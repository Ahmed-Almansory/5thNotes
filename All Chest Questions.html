if(q.o.length){q.o.forEach(o=>{let c='opt';if(rev&&isOk(q,o[0]))c+=' ok';else if(p&&p.c==o[0])c+=' bad';else if(px==o[0])c+=' sel';h+=`<button class="${c}" dir="auto" data-o="${ea(o[0])}"><b>${esc(o[0])}.</b> ${esc(o[1])}</button>`});
if(rev){h+=`<div class="ans" dir="auto"><span class="k">Correct answer: ${esc(AS(q).join(' & ')||'not provided — see flag')}</span></div>`;if(q.e)h+=expl(q)}}
else{h+=`<button class="opt" data-sa="1">Show model answer</button>`;if(rev){h+=`<div class="ans" dir="auto"><span class="k">Answer:</span> ${esc(q.sa||'—')}</div>`;if(q.e)h+=expl(q)}}
(q.f||[]).forEach(f=>h+=`<div class="flag" dir="auto">⚑ ${esc(f)}</div>`);if(q.pg)h+=`<div class="src">Book p. ${esc(q.pg)}</div>`;
if(p&&q.o.length)h+=`<button class="rt">↻ Retry this question</button>`;h+='</div>'});
const none=savedOnly&&!BM.length?'No saved questions yet — tap ☆ on any question to save it here.':wrongOnly&&!DB.q.some(q=>P[q.id]&&P[q.id].r===0)?'No wrong answers right now 🎉':'No questions match.';
$('list').innerHTML=L.length?h:h+`<p>${none}</p>`;
stat()}
/* Exam Mode helpers */
const pendScope=()=>Object.keys(PX).filter(id=>{const q=byId(id);return q&&!P[id]});
function gradeIds(ids,pre){let ok=0,bad=0,n=0;const y=scrollY;ids.forEach(id=>{const q=byId(id),l=PX[id];if(!q||!l)return;const r=q.a?(isOk(q,l)?1:0):2;P[id]={c:l,r:r};delete PX[id];n++;if(r===1)ok++;else if(r===0)bad++});
save();savePX();render();scrollTo(0,y);toast((pre||'')+'Graded '+n+' · ✓ '+ok+' correct · ✗ '+bad+' wrong')}
function gradeNow(){const ids=pendScope();if(!ids.length){toast('Nothing to grade yet — select some answers first.');return}gradeIds(ids)}
function autoGrade(ch){const M=DB.q.filter(q=>q.ch==ch&&q.o.length);if(!M.length||!M.every(q=>A(q.id)))return;const ids=M.filter(q=>PX[q.id]).map(q=>q.id);if(ids.length)gradeIds(ids,'Chapter finished — ')}
function toggleExam(){if(EX){const ids=pendScope();if(ids.length)gradeIds(ids,'Exam Mode off — ');EX=false}else EX=true;try{localStorage.setItem(SK+'exam',EX?'1':'0')}catch(e){}}
function exUI(){$('ex').textContent='Exam Mode: '+(EX?'ON':'OFF');$('ex').classList.toggle('pri',EX);$('xb').classList.toggle('on',EX);$('xc').textContent=pendScope().length+' selected · not graded yet';const h=$('hx');if(h)h.textContent='📝 Exam Mode: '+(EX?'ON':'OFF')}
function expl(q){if(!q.e||!(q.e[0]||q.e[1]))return'';return `<details class="ans" dir="auto" open><summary><b>Explanation</b></summary>${esc(q.e[0])}${q.e[1]?`<div style="margin-top:6px"><b>💡 Pearl:</b> ${esc(q.e[1])}</div>`:''}</details>`}
function stat(){navb();const S=sums();
$('st').textContent=`Total ${S.n} · Solved ${S.d} · Unanswered ${S.n-S.d} · Correct ${S.ok} · Wrong ${S.bad} · ${S.pct}% complete`+(Object.keys(PX).length?` · Selected, not graded ${Object.keys(PX).length}`:'');$('pb').style.width=100*S.d/S.n+'%';$('sv').textContent='★ Saved ('+BM.length+')';syncBtns();exUI();shUI()}
function resume(){const T=nextTarget();if(T.none)return;
if(T.done){toast('🎉 You have answered all '+DB.q.length+' questions. Nothing left to resume!');return}
const q=T.q;$('s').value='';wrongOnly=false;savedOnly=false;syncBtns();openView(q.ch);
const el=$('q-'+q.id);if(el){el.scrollIntoView({block:'start'});el.classList.add('hl');setTimeout(()=>el.classList.remove('hl'),2500);window.scrollBy(0,-70)}}
$('list').addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('qmap'))mapOpen=e.target.open},true);
$('list').onclick=e=>{const im=e.target.closest('img[data-im]');if(im){openLB(DB.img[im.dataset.im]);return}const d=e.target.closest('.dot');
if(d){const el=$('q-'+d.dataset.id);if(el){el.scrollIntoView({block:'start'});window.scrollBy(0,-70);el.classList.add('hl');setTimeout(()=>el.classList.remove('hl'),1500)}return}
const b=e.target.closest('button');if(!b)return;const card=b.closest('.q');if(!card)return;const id=card.dataset.id,q=byId(id),y0=scrollY;
/* save/flag and retry never touch the Resume pointer */
if(b.classList.contains('bm')){toggleBM(id);render();scrollTo(0,y0);return}
if(b.classList.contains('rt')){delete P[id];save();if(LAST&&LAST.id==id)clearLast();render();scrollTo(0,y0);return}
if(P[id])return;
if(EX&&b.dataset.o){if(PX[id]==b.dataset.o){delete PX[id];if(LAST&&LAST.id==id)clearLast()}else{PX[id]=b.dataset.o;saveLast(id)}
savePX();render();scrollTo(0,y0);autoGrade(q.ch);return}
if(PX[id]){delete PX[id];savePX()}
if(b.dataset.sa){P[id]={r:2};}else if(b.dataset.o){P[id]={c:b.dataset.o,r:q.a?(isOk(q,b.dataset.o)?1:0):2}}else return;
save();saveLast(id);const y=scrollY;render();scrollTo(0,y)};
$('nav').onclick=e=>{const a=e.target.closest('a');if(!a)return;$('nav').classList.remove('open');const c=a.dataset.c;
if(c=='__wrong'||c=='__saved'){openFilter(c=='__wrong'?'wrong':'saved');return}
if(c=='all'){wrongOnly=false;savedOnly=false;syncBtns()}
openView(c=='home'?null:c);scrollTo(0,0)};
$('home').onclick=e=>{if(e.target.closest('#rs2')){resume();return}if(e.target.closest('#hw')){openFilter('wrong');return}if(e.target.closest('#hs')){openFilter('saved');return}if(e.target.closest('#hx')){toggleExam();home();return}if(e.target.closest('#hsh')){setShuffle(!SH);home();return}const c=e.target.closest('.card');if(c){if(c.dataset.c=='all'){wrongOnly=false;savedOnly=false;syncBtns()}openView(c.dataset.c);scrollTo(0,0)}};
const SQ=q=>{const ans=AS(q).map(l=>{const o=q.o.find(x=>x[0]==l);return o?o[1]:''}).join(' ');return (q.ch+' '+q.q+' '+q.o.map(o=>o[1]).join(' ')+' '+ans+' '+(q.sa||'')+' '+(q.e?q.e.join(' '):'')).toLowerCase()};
DB.q.forEach(q=>{q._s=SQ(q)});
function doSearch(v,panel){if(!panel)return;const t=v.toLowerCase().trim();if(t.length<2){panel.style.display='none';panel.innerHTML='';return}
const W=t.split(/\s+/),R=DB.q.filter(q=>W.every(w=>q._s.includes(w)));
panel.innerHTML=R.length?R.slice(0,60).map(q=>`<a data-id="${q.id}">${esc((DB.ch.indexOf(q.ch)+1)+'. '+q.ch)} · Q${q.n}<small>${esc(q.q.slice(0,150))}</small></a>`).join('')+(R.length>60?`<a>…and ${R.length-60} more — refine your search</a>`:''):'<a>No matches</a>';panel.style.display='block'}
function goQ(id){const q=byId(id);if(!q)return;wrongOnly=false;savedOnly=false;syncBtns();$('s').value='';openView(q.ch);const el=$('q-'+id);if(el){el.scrollIntoView({block:'start'});window.scrollBy(0,-70);el.classList.add('hl');setTimeout(()=>el.classList.remove('hl'),2500)}}
document.addEventListener('input',e=>{if(e.target.id=='s')doSearch(e.target.value,$('sp'));if(e.target.id=='hs2')doSearch(e.target.value,$('sp2'))});
document.addEventListener('click',e=>{const a=e.target.closest('.sp a[data-id]');if(a){const id=a.dataset.id;['sp','sp2'].forEach(x=>{const p=$(x);if(p){p.style.display='none';p.innerHTML=''}});goQ(id)}});
function fitLB(){const i=$('zi');if(!i.naturalWidth)return;const s=Math.min(3,innerWidth*.96/i.naturalWidth,innerHeight*.88/i.naturalHeight)*($('zm').classList.contains('big')?2:1);i.style.width=Math.round(i.naturalWidth*s)+'px';i.style.height='auto';i.style.maxWidth='none'}
function openLB(src){const i=$('zi');i.onload=fitLB;$('zm').classList.remove('big');i.src=src;$('zm').classList.add('on');if(i.complete)fitLB()}
$('zm').onclick=e=>{if(e.target.id=='zi'){$('zm').classList.toggle('big');fitLB()}else $('zm').classList.remove('on')};addEventListener('resize',fitLB);
document.addEventListener('keydown',e=>{if(e.key=='Escape')$('zm').classList.remove('on')});
$('tg').onclick=()=>{show=!show;$('tg').textContent='Show Answers: '+(show?'ON':'OFF');render()};
$('wr').onclick=()=>{wrongOnly=!wrongOnly;render()};
$('ex').onclick=()=>{toggleExam();render()};$('xg').onclick=gradeNow;$('sh').onclick=()=>{setShuffle(!SH);render();scrollTo(0,0)};$('sh2').onclick=()=>{reshuffle();render();scrollTo(0,0);toast('Questions reshuffled')};
$('sv').onclick=()=>{savedOnly=!savedOnly;render()};
$('rs').onclick=()=>{if(confirm('Reset all progress? (your ★ saved questions are kept)')){P={};PX={};save();savePX();clearLast();render()}};
$('hm').onclick=()=>{openView(null);scrollTo(0,0)};$('rb').onclick=resume;
applyTheme();updRB();openView(null);
</script></body></html>
