/* ============ Design polish (v3.2) ============
   CSS-only refinements: no markup, IDs, classes, JS, or storage keys changed.
   Appended after the v3.1 fluid-UI rules so it overrides by cascade order. */
/* --- Type scale: stem more prominent, options easier to scan --- */
body{font:16px/1.6 system-ui,Segoe UI,Roboto,sans-serif}
main h2{font-size:1.28rem;line-height:1.3;letter-spacing:-.01em;margin:22px 0 12px}
.q h3{font-size:1.08rem;line-height:1.5;font-weight:600;margin:0 0 12px}
/* --- Question cards: airier, softer shadows, clearer zones --- */
.q{padding:20px 20px 16px;border-radius:16px;margin:0 0 16px;box-shadow:0 1px 2px rgba(23,50,77,.05),0 10px 28px rgba(23,50,77,.06)}
.im{margin:4px 0 14px}
.im img{border-radius:12px;box-shadow:0 2px 10px rgba(23,50,77,.10)}
.opt{margin:7px 0;padding:11px 14px;border-radius:11px;font-size:.95rem;position:relative}
.ans{margin-top:14px;padding:12px 14px;border-radius:11px;border-inline-start:3px solid var(--ok)}
.explain{margin-top:14px;padding:12px 14px;border-radius:11px}
.flag{margin-top:10px;padding:8px 12px}
/* --- Answer feedback: gentle pop + check/cross marks (existing classes only) --- */
@keyframes qpop{0%{transform:scale(1)}35%{transform:scale(1.012)}100%{transform:scale(1)}}
.opt.ok,.opt.bad{animation:qpop .28s ease}
.opt.ok{font-weight:600;box-shadow:inset 0 0 0 1px var(--ok),0 2px 12px rgba(27,158,90,.16);padding-inline-end:38px}
.opt.bad{box-shadow:inset 0 0 0 1px var(--bad),0 2px 12px rgba(214,69,69,.14);padding-inline-end:38px}
.opt.ok::after,.opt.bad::after{position:absolute;top:50%;inset-inline-end:12px;transform:translateY(-50%);font-weight:800;font-size:1.05rem;line-height:1}
.opt.ok::after{content:"✓";color:var(--ok)}
.opt.bad::after{content:"✗";color:var(--bad)}
/* --- Header: stronger subject identity, same structure and text --- */
header{padding:24px 56px 20px 20px}
header h1{font-size:1.5rem;letter-spacing:-.015em;line-height:1.2}
header p{font-size:.93rem}
header svg{opacity:.22}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,rgba(255,255,255,.6),rgba(255,255,255,.12) 55%,rgba(255,255,255,0))}
/* --- Home dashboard: progress reads more visually --- */
.sg{gap:12px;margin:14px 0}
.sc{border-radius:14px;padding:14px;box-shadow:0 1px 2px rgba(23,50,77,.05)}
.sc b{font-size:1.55rem;letter-spacing:-.01em}
.sg .sc:nth-child(3){border-color:var(--teal)}
.hmp{height:12px;border-radius:8px;box-shadow:inset 0 1px 3px rgba(0,0,0,.10)}
.hmp i{background:linear-gradient(90deg,var(--hd1),var(--teal));border-radius:8px}
.prog{box-shadow:inset 0 1px 2px rgba(0,0,0,.08)}
.card{border-radius:14px;padding:16px;transition:transform .15s,box-shadow .15s,border-color .15s;box-shadow:0 1px 2px rgba(23,50,77,.05)}
@media(hover:hover){.card:hover{transform:translateY(-2px);border-color:var(--teal);box-shadow:0 8px 20px rgba(23,50,77,.10)}}
.card .cp{height:6px;border-radius:4px}
.resume{border-radius:14px;padding:18px;box-shadow:0 8px 20px rgba(23,50,77,.14)}
.tg{border-radius:16px}
/* --- Sidebar + controls: roomier, smoother --- */
nav a{padding:9px 12px;border-radius:10px;transition:background .15s,color .15s}
button,.btn{border-radius:11px;box-shadow:0 1px 2px rgba(23,50,77,.05)}
@media(hover:hover){button:hover,.btn:hover{border-color:var(--teal)}}
.bar input[type=search]{border-radius:11px;box-shadow:0 1px 2px rgba(23,50,77,.05)}
.bar input[type=search]:focus{border-color:var(--teal)}
/* --- Notes: same airier rhythm as question cards --- */
.nsys{border-radius:14px;box-shadow:0 1px 2px rgba(23,50,77,.05),0 8px 22px rgba(23,50,77,.05)}
.nsys>summary{padding:14px 0}
ul.facts li{padding:10px 14px;border-radius:11px;margin:8px 0}
.nchip{padding:5px 12px}
/* --- Dark mode: shadows need more depth on dark surfaces --- */
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .q,:root:not([data-theme=light]) .nsys{box-shadow:0 10px 28px rgba(0,0,0,.40)}:root:not([data-theme=light]) .card,:root:not([data-theme=light]) .sc{box-shadow:0 2px 10px rgba(0,0,0,.30)}}
:root[data-theme=dark] .q,:root[data-theme=dark] .nsys{box-shadow:0 10px 28px rgba(0,0,0,.40)}
:root[data-theme=dark] .card,:root[data-theme=dark] .sc{box-shadow:0 2px 10px rgba(0,0,0,.30)}
/* --- Motion + small screens --- */
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@media(max-width:800px){.q{padding:16px 14px 14px;border-radius:14px}header{padding:20px 52px 16px 14px}header h1{font-size:1.32rem}.opt{padding:10px 12px}}
/* ============ End design polish ============ */

<script>
const DB={"ch":["Symptoms","General examination","Inspection & palpation","Percussion","Auscultation","Clinical syndromes","Investigations","Asthma & COPD","Suppurative lung disease","Tuberculosis","Tumors & ILD","Pulmonary vascular","Pleural diseases","Mediastinum & resp. failure"],"q":[{"id":"q29530942","ch":"Symptoms","q":"Causes of acute (sudden) dyspnea include all the following except:","o":[["A","Pneumothorax"],["B","Pulmonary embolism"],["C","Interstitial pulmonary fibrosis"],["D","Bronchial asthma"]],"a":"C","sa":null,"pg":null,"f":[],"n":1,"e":["IPF causes gradual, progressive dyspnea, not sudden.",""],"im":[]},{"id":"q6658483d","ch":"Symptoms","q":"Acute dyspnea with chest pain could be due to the following except:","o":[["A","Myocardial infarction"],["B","Pulmonary embolism"],["C","Attack of bronchial asthma"],["D","Pneumothorax"]],"a":"C","sa":null,"pg":null,"f":[],"n":2,"e":["Asthma attack gives dyspnea and wheeze, but chest pain is not typical.",""],"im":[]},{"id":"q0cc7845d","ch":"Symptoms","q":"Gradual progressive dyspnea could be due to the following except:","o":[["A","Pneumothorax"],["B","Chronic obstructive pulmonary disease"],["C","Interstitial pulmonary fibrosis"],["D","Showers of pulmonary emboli"]],"a":"A","sa":null,"pg":null,"f":[],"n":3,"e":["Pneumothorax causes sudden dyspnea, not gradual.",""],"im":[]},{"id":"q92b64028","ch":"Symptoms","q":"Causes of dyspnea with chest wheeze include the following:","o":[["A","Pleural effusion"],["B","Chronic obstructive pulmonary disease"],["C","Pneumothorax"],["D","All of the above"]],"a":"B","sa":null,"pg":null,"f":[],"n":4,"e":["Of these, only COPD causes wheeze; effusion and pneumothorax give dyspnea without wheeze.",""],"im":[]},{"id":"qb0371355","ch":"Symptoms","q":"Causes of dyspnea with chest wheeze include the following except:","o":[["A","Bronchial asthma"],["B","Chronic obstructive pulmonary disease"],["C","Acute asthmatic bronchitis"],["D","Interstitial pulmonary fibrosis"]],"a":"D","sa":null,"pg":null,"f":[],"n":5,"e":["IPF causes dyspnea without wheeze.",""],"im":[]},{"id":"q074c9943","ch":"Symptoms","q":"Orthopnea occurs in:","o":[["A","Left sided heart failure"],["B","Bronchial asthma"],["C","Interstitial pulmonary fibrosis"],["D","All of the above"]],"a":"A","sa":null,"pg":null,"f":["Answer key corrected to A (the duplicate copy lists D)."],"n":6,"e":["Pulmonary congestion in left heart failure causes dyspnea on lying flat.",""],"im":[]},{"id":"qb407f2cd","ch":"Symptoms","q":"Dry cough could be due to the following except:","o":[["A","Bronchial asthma"],["B","Bronchiectasis"],["C","Interstitial pulmonary fibrosis"],["D","Pleurisy"]],"a":"B","sa":null,"pg":null,"f":[],"n":7,"e":["Bronchiectasis gives a productive cough with copious purulent sputum.",""],"im":[]},{"id":"qd13c7f13","ch":"Symptoms","q":"Productive cough could be due to the following except:","o":[["A","Pneumonia"],["B","Bronchiectasis"],["C","Interstitial pulmonary fibrosis"],["D","Lung abscess"]],"a":"C","sa":null,"pg":null,"f":[],"n":8,"e":["IPF causes a dry cough.",""],"im":[]},{"id":"q64d69634","ch":"Symptoms","q":"Hazards of cough include the following except:","o":[["A","Pneumothorax"],["B","Transudative pleural effusion"],["C","Hernia"],["D","Cerebral hemorrhage"]],"a":"B","sa":null,"pg":null,"f":[],"n":9,"e":["Cough does not cause transudative effusion.",""],"im":[]},{"id":"q615f53b5","ch":"Symptoms","q":"Rusty sputum is characteristic of:","o":[["A","Pneumonia"],["B","Bronchiectasis"],["C","Amoebic lung abscess"],["D","Bronchial asthma"]],"a":"A","sa":null,"pg":null,"f":[],"n":10,"e":["Rusty sputum is typical of lobar (pneumococcal) pneumonia.",""],"im":[]},{"id":"qfbc14ae1","ch":"Symptoms","q":"Purulent sputum is characteristic of:","o":[["A","Interstitial pulmonary fibrosis"],["B","Bronchial asthma"],["C","Bronchiectasis"],["D","Pulmonary embolism"]],"a":"C","sa":null,"pg":null,"f":[],"n":11,"e":["Bronchiectasis produces copious purulent sputum.",""],"im":[]},{"id":"q74f39ae1","ch":"Symptoms","q":"Localized fixed wheeze could be due to:","o":[["A","Bronchial asthma"],["B","Chronic bronchitis"],["C","Endobronchial tumor"],["D","Emphysema"]],"a":"C","sa":null,"pg":null,"f":[],"n":12,"e":["A fixed localized wheeze means a local bronchial narrowing, e.g. an endobronchial tumor.",""],"im":[]},{"id":"qc1423a57","ch":"Symptoms","q":"Localized fixed wheeze could be due to the following except:","o":[["A","Foreign body aspiration"],["B","Endobronchial tumor"],["C","Compression of a bronchus by enlarged lymph node"],["D","Bronchial asthma"]],"a":"D","sa":null,"pg":null,"f":[],"n":13,"e":["Asthma gives generalized, variable wheeze, not a fixed localized one.",""],"im":[]},{"id":"q588d2094","ch":"Symptoms","q":"Chest wheezes that disappear with cough could be due to:","o":[["A","Bronchial secretions"],["B","Bronchospasm"],["C","Bronchial compression"],["D","None of the above"]],"a":"A","sa":null,"pg":null,"f":[],"n":14,"e":["Wheeze from secretions clears with cough; bronchospasm or compression does not.",""],"im":[]},{"id":"qdd20b7f9","ch":"Symptoms","q":"Chest pain of pleural origin is characterized by the following except:","o":[["A","Stitching in character"],["B","Increases with cough"],["C","Exaggerated by holding breath"],["D","Increases with inspiration"]],"a":"C","sa":null,"pg":null,"f":[],"n":15,"e":["Pleural pain is worsened by deep breathing and cough, and eased by holding the breath.",""],"im":[]},{"id":"qb574e937","ch":"Symptoms","q":"Stitching chest pain that increases with inspiration and decreases with holding breath could be due to:","o":[["A","Pericarditis"],["B","Pleurisy"],["C","Tracheitis"],["D","Intercostal myositis"]],"a":"B","sa":null,"pg":null,"f":[],"n":16,"e":["Pleuritic pain eases when the breath is held, as the inflamed layers stop rubbing.",""],"im":[]},{"id":"q3d9aee10","ch":"Symptoms","q":"Continuous agonizing dull aching chest pain is associated with:","o":[["A","Pulmonary embolism"],["B","Pleurisy"],["C","Bronchogenic carcinoma"],["D","All of the above"]],"a":"C","sa":null,"pg":null,"f":[],"n":17,"e":["Chest wall/pleural invasion by carcinoma gives constant, severe, dull aching pain.",""],"im":[]},{"id":"q09d5f9e0","ch":"Symptoms","q":"Dyspnea without chest wheeze could be due to:","o":[["A","Pleural effusion"],["B","Primary emphysema"],["C","Interstitial pulmonary fibrosis"],["D","All of the above"]],"a":"D","sa":null,"pg":null,"f":[],"n":18,"e":["Effusion, emphysema and IPF all cause dyspnea without wheeze.",""],"im":[]},{"id":"q60499f60","ch":"Symptoms","q":"(p.30) Complications of chronic cough include all except:","o":[["A","Cerebral hemorrhage"],["B","Hernia"],["C","Pneumothorax"],["D","Pleural effusion"]],"a":"D","sa":null,"pg":null,"f":[],"n":19,"e":["Pleural effusion is not a complication of chronic cough.",""],"im":[]},{"id":"qceb1271f","ch":"General examination","q":"Bilateral congested non-pulsating neck veins occur in all the following EXCEPT:","o":[["A","Fibrosing mediastinitis"],["B","Cardiac tamponade"],["C","SVC thrombosis"],["D","Extra-pulmonary non-metastatic manifestations of oat cell carcinoma"]],"a":"D","sa":null,"pg":null,"f":[],"n":1,"e":["Paraneoplastic (non-metastatic) manifestations do not obstruct venous return; the others do.",""],"im":[]},{"id":"qce9cc5db","ch":"General examination","q":"Clubbing of fingers is associated with the following EXCEPT:","o":[["A","Bronchial asthma"],["B","Bronchogenic carcinoma"],["C","Bronchiectasis"],["D","Interstitial pulmonary fibrosis"]],"a":"A","sa":null,"pg":null,"f":[],"n":2,"e":["Bronchial asthma is not associated with clubbing.",""],"im":[]},{"id":"q0d96a2bf","ch":"General examination","q":"Clubbing is present in all EXCEPT:","o":[["A","IPF"],["B","Cystic fibrosis"],["C","Emphysema"],["D","Bronchiectasis"]],"a":"C","sa":null,"pg":null,"f":[],"n":3,"e":["Emphysema/COPD does not cause clubbing; if present, suspect carcinoma.",""],"im":[]},{"id":"qe5095566","ch":"General examination","q":"Which of the following is NOT associated with clubbing of fingers?","o":[["A","Lung cancer"],["B","Interstitial lung disease"],["C","Cystic fibrosis"],["D","Chronic obstructive pulmonary disease"]],"a":"D","sa":null,"pg":null,"f":[],"n":4,"e":["COPD is not associated with clubbing.",""],"im":[]},{"id":"q617ebf1a","ch":"General examination","q":"Warming the hand in peripheral cyanosis:","o":[["A","Improves cyanosis of the hand"],["B","Worsens cyanosis of the hand"],["C","Improves tongue discoloration"],["D","All of the above"]],"a":"A","sa":null,"pg":null,"f":[],"n":5,"e":["Warming improves circulation, so peripheral cyanosis improves; central (tongue) cyanosis does not.",""],"im":[]},{"id":"q38661b84","ch":"General examination","q":"Warming the hand in central cyanosis:","o":[["A","Improves cyanosis of the hand"],["B","Worsens cyanosis of the hand"],["C","Improves tongue discoloration"],["D","All of the above"]],"a":"B","sa":null,"pg":null,"f":[],"n":6,"e":["Central cyanosis comes from desaturated arterial blood, so warming cannot correct it: increased local flow and oxygen extraction make the hand look more cyanosed, unlike peripheral cyanosis, which improves with warming. The tongue stays blue because it reflects arterial saturation.",""],"im":[]},{"id":"q8df011cd","ch":"General examination","q":"Causes of peripheral cyanosis include all of the following except:","o":[["A","Shock"],["B","Right-to-left shunt"],["C","Peripheral artery disease"],["D","Cold exposure"]],"a":"B","sa":null,"pg":null,"f":[],"n":7,"e":["Right-to-left shunt causes central cyanosis.",""],"im":[]},{"id":"qfda89c46","ch":"General examination","q":"In cyanosis the reduced hemoglobin should not be less than:","o":[["A","5 gm/dl"],["B","7 gm/dl"],["C","9 gm/dl"],["D","None of the above"]],"a":"A","sa":null,"pg":null,"f":[],"n":8,"e":["Cyanosis appears when reduced hemoglobin is 5 g/dl or more.",""],"im":[]},{"id":"qd1fdb9c8","ch":"General examination","q":"Central cyanosis occurs in all of the following except:","o":[["A","Marked polycythemia"],["B","Right-to-left shunt"],["C","Shock"],["D","Interstitial lung fibrosis"]],"a":"C","sa":null,"pg":null,"f":[],"n":9,"e":["Shock causes peripheral (low-flow) cyanosis, not central.",""],"im":[]},{"id":"qa1b0451f","ch":"General examination","q":"In cyanosis the reduced hemoglobin should not be less than:","o":[["A","5 g/dl"],["B","7 g/dl"],["C","9 g/dl"],["D","None of the above"]],"a":"A","sa":null,"pg":null,"f":[],"n":10,"e":["Central cyanosis appears when reduced Hb is at least 5 g/dl.",""],"im":[]},{"id":"q616acee1","ch":"Inspection & palpation","q":"Bifurcation of the trachea (carina) lies opposite:","o":[["A","Angle of Lewis"],["B","Second thoracic vertebral body"],["C","Above the arch of aorta"],["D","Below the bifurcation of the pulmonary conus"]],"a":"A","sa":null,"pg":null,"f":[],"n":1,"e":["The carina lies at the level of the sternal angle (angle of Louis).",""],"im":[]},{"id":"q800a652e","ch":"Inspection & palpation","q":"Angle of Lewis is opposite the following except:","o":[["A","Aortic arch"],["B","Right upper lobe bronchial stump"],["C","Carina of trachea"]],"a":"B","sa":null,"pg":null,"f":[],"n":2,"e":["The sternal angle lies opposite the aortic arch and the carina, not a bronchial stump.",""],"im":[]},{"id":"qc80d11e9","ch":"Inspection & palpation","q":"The transverse fissure is present at the level of:","o":[["A","2nd costal cartilage"],["B","4th thoracic vertebra"],["C","4th costal cartilage"],["D","2nd thoracic vertebra"]],"a":"C","sa":null,"pg":null,"f":[],"n":3,"e":["The transverse fissure lies at the level of the 4th costal cartilage.",""],"im":[]},{"id":"qb247d973","ch":"Inspection & palpation","q":"Barrel shaped chest is caused by:","o":[],"a":null,"sa":"Hyperinflation - emphysema / COPD (the ‘emphysematous’ chest).","pg":null,"f":[],"n":4,"e":["Barrel chest results from chronic hyperinflation with an increased anteroposterior diameter, loss of elastic recoil and air trapping, classically in emphysema / COPD (the 'emphysematous' chest).",""],"im":[]},{"id":"qd37187dc","ch":"Inspection & palpation","q":"Barrel shaped chest is characterized by the following except:","o":[["A","The anteroposterior diameter equals the transverse diameter"],["B","Dorsal lordosis"],["C","Wide subcostal angle"],["D","The shoulders are transverse"]],"a":"B","sa":null,"pg":null,"f":[],"n":5,"e":["Barrel chest has dorsal kyphosis, not lordosis.",""],"im":[]},{"id":"q49835c0b","ch":"Inspection & palpation","q":"Regarding hyperinflation (barrel chest), all of the following are true except:","o":[["A","Increased anteroposterior diameter"],["B","Kyphosis"],["C","Ribs are more oblique"],["D","Wide subcostal angle"]],"a":"C","sa":null,"pg":null,"f":[],"n":6,"e":["In hyperinflation the ribs become horizontal, not oblique.",""],"im":[]},{"id":"qc2b11388","ch":"Inspection & palpation","q":"Symmetrical abnormal chest shape EXCEPT:","o":[],"a":null,"sa":"Kyphoscoliosis","pg":null,"f":[],"n":7,"e":["Barrel chest, pectus carinatum and pectus excavatum deform the chest symmetrically; kyphoscoliosis twists the spine and rib cage, so the deformity is asymmetrical — it is the exception.",""],"im":[]},{"id":"q4a3b7aba","ch":"Inspection & palpation","q":"Unilateral chest wall retraction could be due to:","o":[["A","Lung collapse"],["B","Lung consolidation"],["C","Pleural effusion"],["D","Pneumothorax"]],"a":"A","sa":null,"pg":null,"f":[],"n":8,"e":["Collapse reduces lung volume, so the chest wall retracts on that side.",""],"im":[]},{"id":"q41ca6c9c","ch":"Inspection & palpation","q":"Unilateral chest retraction occurs with the following except:","o":[["A","Pleural fibrosis"],["B","Pulmonary fibrosis"],["C","Lung consolidation"],["D","Kyphoscoliosis"]],"a":"C","sa":null,"pg":null,"f":[],"n":9,"e":["Consolidation does not reduce lung volume, so there is no retraction.",""],"im":[]},{"id":"q0614491d","ch":"Inspection & palpation","q":"The main muscle of ventilation is:","o":[["A","Internal intercostal muscle"],["B","External intercostal muscle"],["C","Diaphragm"],["D","Transversus thoracis"]],"a":"C","sa":null,"pg":null,"f":[],"n":10,"e":["The diaphragm is the main muscle of ventilation.",""],"im":[]},{"id":"q0c0e7268","ch":"Inspection & palpation","q":"Abdominal paradox is a sign of:","o":[["A","Intercostal muscle fatigue"],["B","Diaphragmatic paralysis"],["C","Peritonitis"],["D","Massive ascites"]],"a":"B","sa":null,"pg":null,"f":[],"n":11,"e":["In diaphragmatic paralysis the abdomen moves inward during inspiration (abdominal paradox).",""],"im":[]},{"id":"q243117ee","ch":"Inspection & palpation","q":"Indrawing of the intercostal spaces during inspiration is a sign of:","o":[["A","Intercostal muscle fatigue"],["B","Diaphragmatic paralysis"],["C","Increased airway resistance"],["D","Pleurisy"]],"a":"C","sa":null,"pg":null,"f":[],"n":12,"e":["Indrawing reflects strong negative pressure against raised airway resistance.",""],"im":[]},{"id":"qee64bbce","ch":"Inspection & palpation","q":"All of the following occur in prolonged expiration except:","o":[["A","Use of abdominal muscles"],["B","Intercostal indrawing"],["C","Pursing of the lips"],["D","Inspiration equals expiration"]],"a":"B","sa":null,"pg":null,"f":[],"n":13,"e":["Indrawing is a sign of difficult inspiration, not of prolonged expiration.",""],"im":[]},{"id":"q3ab7acb1","ch":"Inspection & palpation","q":"One of the following increases the mobility of the chest:","o":[["A","Pleural effusion"],["B","Bronchogenic carcinoma"],["C","Pneumothorax"],["D","None of the above"]],"a":"D","sa":null,"pg":null,"f":[],"n":14,"e":["Effusion, carcinoma and pneumothorax all reduce chest movement.",""],"im":[]},{"id":"qd1bd5c97","ch":"Inspection & palpation","q":"About Litten sign, the following is right except:","o":[["A","Should be in fatty patients"],["B","Positive in diaphragmatic paralysis"],["C","Should be detected with patient against sunlight"]],"a":"A","sa":null,"pg":null,"f":[],"n":15,"e":["Litten sign is best seen in thin patients, not fatty ones.",""],"im":[]},{"id":"q0cf17f39","ch":"Inspection & palpation","q":"Presence of dilated tortuous veins over the chest wall which fill from above downward is due to:","o":[["A","Superior vena cava obstruction"],["B","Congestive heart failure"],["C","Inferior vena cava obstruction"],["D","Portal hypertension"]],"a":"A","sa":null,"pg":null,"f":[],"n":16,"e":["Collateral veins fill downward when the SVC is obstructed.",""],"im":[]},{"id":"q1e229138","ch":"Inspection & palpation","q":"Tracheal tug could be detected in:","o":[["A","Emphysema"],["B","Acute severe asthma"],["C","Bilateral pulmonary T.B. (acute)"]],"a":"A","sa":null,"pg":null,"f":[],"n":17,"e":["Hyperinflated chest in emphysema pulls the trachea down with inspiration.",""],"im":[]},{"id":"q4894550e","ch":"Inspection & palpation","q":"What shifts the apex outside the midclavicular line?","o":[["A","Right pleural effusion"],["B","Right pneumothorax"],["C","Right ventricular enlargement"],["D","All of the above"]],"a":"D","sa":null,"pg":null,"f":[],"n":18,"e":["Effusion or pneumothorax pushes the mediastinum, and RV enlargement shifts the apex outward.",""],"im":[]},{"id":"q7598bae0","ch":"Inspection & palpation","q":"Causes of apex at the left parasternal line:","o":[["A","Right pneumothorax"],["B","Right collapse"],["C","Right pleural effusion"]],"a":"B","sa":null,"pg":null,"f":[],"n":19,"e":["Right collapse pulls the heart to the right, so the apex lies near the left parasternal line.",""],"im":[]},{"id":"qb418be2b","ch":"Inspection & palpation","q":"Causes of palpable pulsation over the chest wall:","o":[],"a":null,"sa":"Epigastric & left parasternal pulsations (RV enlargement, e.g. cor pulmonale); apical pulsation absent in emphysema","pg":null,"f":[],"n":20,"e":["A palpable pulsation is usually a hyperdynamic or enlarged right ventricle felt at the epigastrium and left parasternal area, e.g. in cor pulmonale. In emphysema the hyperinflated lung covers the heart, so the apical pulsation is absent.",""],"im":[]},{"id":"q364b315c","ch":"Inspection & palpation","q":"T.V.F. is usually increased over:","o":[["A","Consolidation"],["B","Emphysema"],["C","Pneumothorax"]],"a":"A","sa":null,"pg":null,"f":[],"n":21,"e":["Solid consolidation conducts vibrations well, so TVF rises.",""],"im":[]},{"id":"q4e73ec7b","ch":"Inspection & palpation","q":"Increased TVF occurs in all of the following except:","o":[["A","Pneumonia"],["B","Obstructive collapse"],["C","Superficial cavity"],["D","Cavity surrounded by an area of consolidation"]],"a":"B","sa":null,"pg":null,"f":[],"n":22,"e":["Obstructive collapse has a blocked bronchus, so TVF is decreased.",""],"im":[]},{"id":"qb5922aae","ch":"Inspection & palpation","q":"TVF is increased in the following except:","o":[["A","Pneumonic consolidation"],["B","Superficial cavity"],["C","Deep cavity"],["D","Cavity surrounded by consolidation"]],"a":"C","sa":null,"pg":null,"f":[],"n":23,"e":["A deep cavity does not increase TVF; a superficial cavity with a patent bronchus does.",""],"im":[]},{"id":"q9be72fcb","ch":"Inspection & palpation","q":"TVF is decreased in the following conditions except:","o":[["A","Pneumothorax"],["B","Superficial cavity"],["C","Mesothelioma"],["D","Pleural effusion"]],"a":"B","sa":null,"pg":null,"f":[],"n":24,"e":["A superficial cavity increases TVF.",""],"im":[]},{"id":"qdd0606cd","ch":"Inspection & palpation","q":"All the following show reduced T.V.F. except:","o":[["A","Collapse"],["B","Consolidation"],["C","Fibrosis"],["D","Emphysema"]],"a":"B","sa":null,"pg":null,"f":[],"n":25,"e":["Consolidation increases TVF.",""],"im":[]},{"id":"qa5132ab8","ch":"Inspection & palpation","q":"Unilateral chest wall retraction could be due to the following except:","o":[["A","Lung collapse"],["B","Lung fibrosis"],["C","Lung consolidation"],["D","Pleural fibrosis"]],"a":"C","sa":null,"pg":null,"f":[],"n":26,"e":["Consolidation does not reduce lung volume, so no retraction. Collapse and fibrosis shrink the lung.",""],"i xcept:","o":[["A","Cardiomegaly"],["B","Pericardial effusion"],["C","Lingula collapse"],["D","Emphysema"]],"a":"D","sa":null,"pg":null,"f":[],"n":5,"e":["Emphysema overlaps the heart, reducing the bare-area dullness.",""],"im":[]},{"id":"qc52b09bb","ch":"Percussion","q":"The dullness of the bare area of the heart is increased in case of:","o":[["A","Emphysema"],["B","Bronchial asthma"],["C","Cardiomegaly"],["D","Interstitial pulmonary fibrosis"]],"a":"C","sa":null,"pg":null,"f":[],"n":6,"e":["Cardiomegaly enlarges the bare-area dullness.",""],"im":[]},{"id":"qb1c429b6","ch":"Percussion","q":"Clinically, the right border of the heart can be percussed normally at:","o":[["A","One finger to the right of the sternum"],["B","One cm to the right of the lower half of the sternum"],["C","One cm to the right of mid-sternal line at lower half of the sternum"]],"a":"A","sa":null,"pg":null,"f":[],"n":7,"e":["The right border (formed by the right atrium) is percussed immediately to the right of the sternum — about one finger breadth from its edge. That bedside surface marking is the taught landmark.",""],"im":[]},{"id":"q3d4bae9b","ch":"Percussion","q":"Dullness of Traube’s area is due to the following except:","o":[["A","Left pleural effusion"],["B","Full stomach"],["C","Left lower lobe consolidation"],["D","Splenomegaly"]],"a":"C","sa":null,"pg":null,"f":[],"n":8,"e":["Lung consolidation does not fill Traube’s area; effusion, full stomach and splenomegaly do.",""],"im":[]},{"id":"q55994c03","ch":"Percussion","q":"Traube’s dullness occurs with:","o":[["A","Left lower lobe consolidation"],["B","Left lower lobe collapse"],["C","Left sided pleural effusion"]],"a":"C","sa":null,"pg":null,"f":[],"n":9,"e":["Left pleural effusion makes Traube’s area dull.",""],"im":[]},{"id":"q11d83a1c","ch":"Percussion","q":"Boundaries of Traube’s area include the following except:","o":[["A","Tip of left 8th costal cartilage"],["B","Tip of left 6th costal cartilage"],["C","Left 9th rib in mid-axillary line (MAL)"],["D","Left 11th rib in MAL"]],"a":"B","sa":null,"pg":null,"f":["Answer key follows the source bank; textbook descriptions of Traube's upper boundary vary - verify."],"n":10,"e":["Traube's (semilunar) space is the tympanic gastric area bounded by the left costal margin below (8th cartilage) and the 9th and 11th ribs in the mid-axillary line laterally; the tip of the 6th costal cartilage is not one of its named boundaries in this bank's account. Note: this is the original bank's answer; textbook descriptions of the upper boundary vary.",""],"im":[]},{"id":"qfad300e5","ch":"Percussion","q":"Dull Kronig’s isthmus may be due to:","o":[["A","Superior sulcus tumor"],["B","Consolidated anterior segment of upper lobe"],["C","Emphysema"]],"a":"A","sa":null,"pg":null,"f":[],"n":11,"e":["A superior sulcus (Pancoast) tumor makes Kronig’s isthmus dull.",""],"im":[]},{"id":"qf68a41b4","ch":"Percussion","q":"Unilateral hyperresonance occurs with the following except:","o":[["A","Compensatory emphysema"],["B","Attack of bronchial asthma"],["C","Pneumothorax"],["D","Giant bulla"]],"a":"B","sa":null,"pg":null,"f":[],"n":12,"e":["An asthma attack causes bilateral, not unilateral, hyperresonance.",""],"im":[]},{"id":"qf746c2c4","ch":"Percussion","q":"The upper border of the liver can be detected by:","o":[["A","Heavy percussion at the right midclavicular line"],["B","Light percussion at the right midclavicular line"],["C","Both"]],"a":"A","sa":null,"pg":null,"f":[],"n":13,"e":["Heavy percussion reaches the liver’s upper border beneath the lung.",""],"im":[]},{"id":"q237f60de","ch":"Percussion","q":"Kronig’s isthmus boundaries include the following except:","o":[["A","7th cervical spinous process"],["B","Middle of the sternal notch"],["C","Junction between the lateral third and medial two thirds of the clavicle"],["D","Junction between the lateral two thirds and medial third of the scapular spine"]],"a":"B","sa":null,"pg":null,"f":[],"n":14,"e":["The isthmus lies over the shoulder between the clavicle and the scapular spine, not at the sternal notch.",""],"im":[]},{"id":"q30b54b0e","ch":"Percussion","q":"Boundaries of Kronig’s isthmus, all except:","o":[["A","T1 spine"],["B","Sternoclavicular joint"],["C","Junction between medial 2/3 and lateral 1/3 of the clavicle"]],"a":"A","sa":null,"pg":null,"f":[],"n":15,"e":["The posterior boundary is the C7 spinous process, not T1.",""],"im":[]},{"id":"q2c3ea3bd","ch":"Percussion","q":"Lateral end of Kronig’s isthmus is:","o":[["A","Contact of acromion process with clavicle"],["B","Tip of cervical spine"],["C","Line of contact between junction of medial two thirds & lateral one third of clavicle and junction of lateral two thirds & medial one third of scapular spine"]],"a":"C","sa":null,"pg":null,"f":[],"n":16,"e":["The lateral end is the line joining the clavicle and scapular-spine junctions.",""],"im":[]},{"id":"q1129d6fe","ch":"Auscultation","q":"The following conditions are associated with diminished breath sounds except:","o":[["A","Pneumonia"],["B","Pleural effusion"],["C","Pneumothorax"],["D","Obstructive lung collapse"]],"a":"A","sa":null,"pg":null,"f":[],"n":1,"e":["Consolidation usually gives bronchial breathing, not diminished breath sounds.",""],"im":[]},{"id":"qcf02f761","ch":"Auscultation","q":"The following is associated with diminished intensity of breath sounds:","o":[["A","Pleural effusion"],["B","Obstructive lung collapse"],["C","Pneumothorax"],["D","All of the above"]],"a":"D","sa":null,"pg":null,"f":[],"n":2,"e":["Effusion, collapse and pneumothorax all diminish breath sound intensity.",""],"im":[]},{"id":"q3a127737","ch":"Auscultation","q":"In auscultation, vesicular breathing is characterized by the following except:","o":[["A","Inspiration is three times the expiration"],["B","Gentle rustling sound"],["C","No gap between inspiration and expiration"],["D","Inspiration equals expiration"]],"a":"D","sa":null,"pg":null,"f":[],"n":3,"e":["Vesicular: inspiration longer than s with frothy sputum indicate pulmonary edema from left heart failure.",""],"im":[]},{"id":"q56a7490e","ch":"Clinical syndromes","q":"A case with area of increased TVF, dullness and bronchial breathing. These are physical findings of:","o":[["A","Consolidation"],["B","Lung abscess"],["C","Pneumothorax"],["D","Lung collapse"]],"a":"A","sa":null,"pg":null,"f":[],"n":11,"e":["Classic consolidation triad: increased TVF, dull note, bronchial breathing.",""],"im":[]},{"id":"q92b6c585","ch":"Investigations","q":"Normal pH of arterial blood (ABG) is:","o":[],"a":null,"sa":"7.35 - 7.45","pg":null,"f":[],"n":1,"e":["Normal arterial pH is 7.35–7.45; below 7.35 is acidaemia and above 7.45 is alkalaemia.",""],"im":[]},{"id":"qfe6e6700","ch":"Investigations","q":"Normal PCO2 in arterial blood is:","o":[["A","30-35 mmHg"],["B","20-25 mmHg"],["C","35-45 mmHg"],["D","50-60 mmHg"]],"a":"C","sa":null,"pg":null,"f":[],"n":2,"e":["Normal PaCO2 is 35-45 mmHg.",""],"im":[]},{"id":"qc3017656","ch":"Investigations","q":"Normal oxygen tension (PaO2) in arterial blood gases is:","o":[],"a":null,"sa":"80 - 100 mmHg","pg":null,"f":[],"n":3,"e":["Normal PaO2 on room air is 80–100 mmHg. It is the key ABG measure of oxygenation and falls with age; it is distinct from oxygen saturation (SaO2).",""],"im":[]},{"id":"q3dc45ea9","ch":"Investigations","q":"Simple spirometry can measure all of the following EXCEPT:","o":[["A","Inspiratory capacity"],["B","Tidal volume"],["C","Expiratory reserve volume"],["D","Residual volume"]],"a":"D","sa":null,"pg":null,"f":[],"n":4,"e":["Spirometry cannot measure residual volume.",""],"im":[]},{"id":"q9328413d","ch":"Investigations","q":"In restrictive lung disease, the following volumes are reduced:","o":[["A","Vital capacity"],["B","Residual volume"],["C","Total lung capacity"],["D","All of the above"]],"a":"D","sa":null,"pg":null,"f":[],"n":5,"e":["In restrictive disease VC, RV and TLC are all reduced.",""],"im":[]},{"id":"q71dba329","ch":"Investigations","q":"A pa ng except:","o":[["A","Increased T.V.F. of lung apices"],["B","Encroachment on dullness of the bare area of the heart"],["C","Positive tracheal tug"]],"a":"A","sa":null,"pg":null,"f":[],"n":6,"e":["TVF is decreased, not increased, over emphysematous apices.",""],"im":[]},{"id":"q80009ee9","ch":"Asthma & COPD","q":"In emphysema:","o":[["A","Bare area of heart becomes widened"],["B","Pigeon-shaped chest"],["C","Encroachment over hepatic dullness"]],"a":"C","sa":null,"pg":null,"f":[],"n":7,"e":["Hyperinflated lungs encroach on hepatic dullness.",""],"im":[]},{"id":"qc7e8b1c3","ch":"Asthma & COPD","q":"In COPD all increases except:","o":[["A","FVC"],["B","RV"],["C","TLC"],["D","FRV"]],"a":"A","sa":null,"pg":null,"f":[],"n":8,"e":["In COPD FVC falls while RV, TLC and FRC rise.",""],"im":[]},{"id":"qa3422297","ch":"Suppurative lung disease","q":"A case with cough and expectoration of large amount of purulent offensive sputum for 10 years which increases on leaning forward. The examination revealed bilateral basal crepitations which change with cough. The possible diagnosis is:","o":[["A","Left lower lobe lung abscess"],["B","Right lower lobe lung abscess"],["C","Bronchiectasis"],["D","Right upper lobe abscess"]],"a":"C","sa":null,"pg":null,"f":[],"n":1,"e":["Chronic purulent offensive sputum with changing basal crepitations indicates bronchiectasis.",""],"im":[]},{"id":"q077a78bd","ch":"Suppurative lung disease","q":"Diagnosis of bronchiectasis is confirmed nowadays by:","o":[["A","X-ray"],["B","Bronchography"],["C","Bronchoscopy"],["D","High resolution CT"]],"a":"D","sa":null,"pg":null,"f":[],"n":2,"e":["HRCT confirms bronchiectasis nowadays.",""],"im":[]},{"id":"q1c5ca1bd","ch":"Suppurative lung disease","q":"A case with history of fever and cough for few days followed by sudden gush of large amount of purulent offensive sputum which increases on lying on the left side. The examination revealed bronchial breathing over the right infra-scapular region. The possible diagnosis is:","o":[["A","Left lower lobe lung abscess"],["B","Right lower lobe lung abscess"],["C","Left lower lobe bronchiectasis"],["D","Right upper lobe lung abscess"]],"a":"B","sa":null,"pg":null,"f":[],"n":3,"e":["A sudden gush after fever suggests a lung abscess rupturing into a bronchus, here right lower lobe.",""],"im":[]},{"id":"q9a656c76","ch":"Suppurative lung disease","q":"Suppurative lung syndromes include the following except:","o":[["A","Lung abscess"],["B","Empyema"],["C","Bronchiectasis"],["D","Infected lung cyst"]],"a":"B","sa":null,"pg":null,"f":[],"n":4,"e":["Empyema is a pleural collection, not a lung suppuration.",""],"im":[]},{"id":"q5a7afdd3","ch":"Suppurative lung disease","q":"A case with history of fever and cough for a few days followed by sudden gush of a large amount of purulent offensive sputum which increases on lying on the left side. The examination revealed bronchial breathing over the right infrascapular region. The possible diagnosis is:","o":[["A","Left lower lobe lung abscess"],["B","Right lower lobe lung abscess"],["C","Left lower lobe bronchiectasis"],["D","Right upper lobe abscess"]],"a":"B","sa":null,"pg":null,"f":[],"n":5,"e":["Acute onset, sudden rupture into a bronchus; sputum rises when lying on the opposite side; signs are on the right lower zone.",""],"im":[]},{"id":"q4b46c26a","ch":"Tuberculosis","q":"Tuberculosis is transmitted by:","o":[["A","Droplet infection"],["B","Food borne infection"],["C","Intrauterine infection"],["D","All of the above"]],"a":"D","sa":null,"pg":null,"f":["Answer key corrected to D (the PDF key lists A)."],"n":1,"e":["TB spreads mainly by droplets; milk (bovine) and congenital spread also occur.",""],"im":[]},{"id":"q7ec47cc6","ch":"Tuberculosis","q":"Taking history in a case suspected to be pulmonary T.B. should stress upon:","o":[["A","Present history"],["B","Past history"],["C","Family history"],["D","Contact history"]],"a":"D","sa":null,"pg":null,"f":[],"n":2,"e":["Contact history is key in suspected TB.",""],"im":[]},{"id":"qbc6bca5a","ch":"Tuberculosis","q":"The radiological finding in pulmonary tuberculosis is:","o":[["A","Cavitation"],["B","Fibrosis"],["C","Consolidation"],["D","All of the above"]],"a":"D","sa":null,"pg":null,"f":[],"n":3,"e":["TB can show cavitation, fibrosis and consolidation.",""],"im":[]},{"id":"q84425fa4","ch":"Tuberculosis","q":"The diagnosis of active pulmonary tuberculosis is proved by:","o":[["A","Positive tuberculin skin test"],["B","Positive sputum for acid fast bacilli"],["C","Radiological shadows impressive of TB"],["D","Elevated ESR"]],"a":"B","sa":null,"pg":null,"f":[],"n":4,"e":["Active TB is proven by acid-fast bacilli in sputum.",""],"im":[]},{"id":"q48559d3c","ch":"Tuberculosis","q":"Positive tuberculin test denotes:","o":[["A","Active disease only"],["B","Infection only"],["C","Infection with or without disease"],["D","None of the above"]],"a":"C","sa":null,"pg":null,"f":[],"n":5,"e":["A positive tuberculin test means infection, with or without disease.",""],"im":[]},{"id":"q060f6e4d","ch":"Tuberculosis","q":"The tuberculin skin test is read after:","o":[["A","Twenty four hours"],["B","Seven days"],["C","48 – 72 hours"],["D","Ten days"]],"a":"C","sa":null,"pg":null,"f":[],"n":6,"e":["The tuberculin test is read 48–72 hours after injection.",""],"im":[]},{"id":"qfa7c0b1c","ch":"Tuberculosis","q":"The tuberculin skin test is considered positive if:","o":[["A","The erythema < 10 mm"],["B","The induration > 10 mm"],["C","The erythema > 10 mm"],["D","The induration < 10 mm"]],"a":"B","sa":null,"pg":null,"f":[],"n":7,"e":["Induration (not erythema) is measured; more than 10 mm is positive.",""],"im":[]},{"id":"q883b9a7c","ch":"Tuberculosis","q":"The following anti-tuberculous drugs have hepatotoxic effect except:","o":[["A","Rifampicin"],["B","Pyrazinamide"],["C","Ethambutol"],["D","Isoniazid"]],"a":"C","sa":null,"pg":null,"f":[],"n":8,"e":["Ethambutol is not hepatotoxic (its toxicity is optic neuritis).",""],"im":[]},{"id":"q90cb8b35","ch":"Tuberculosis","q":"The anti-tuberculous drug that leads to orange discoloration of body fluids is:","o":[["A","Rifampicin"],["B","Pyrazinamide"],["C","Ethambutol"],["D","Isoniazid"]],"a":"A","sa":null,"pg":null,"f":[],"n":9,"e":["Rifampicin causes orange discoloration of body fluids.",""],"im":[]},{"id":"q01c104bd","ch":"Tuberculosis","q":"The following anti-TB drugs can be used safely in renal impairment except:","o":[["A","Pyrazinamide"],["B","Streptomycin"]],"a":"B","sa":null,"pg":null,"f":[],"n":10,"e":["Streptomycin is nephrotoxic and avoided in renal impairment.",""],"im":[]},{"id":"qde7d3497","ch":"Tuberculosis","q":"Which of the anti-TB drugs should be totally avoided in pregnancy?","o":[["A","INH"],["B","Pyrazinamide"],["C","Rifampicin"],["D","Streptomycin"]],"a":"D","sa":null,"pg":null,"f":[],"n":11,"e":["Streptomycin is ototoxic to the fetus (8th nerve).",""],"im":[]},{"id":"qaab2c57c","ch":"Tuberculosis","q":"Organisms resistant to T.B drugs are mainly resistant to:","o":[["A","Ethambutol & Rifampicin"],["B","Ethambutol & Streptomycin"],["C","Ethambutol & INH"],["D","INH & Rifampicin"]],"a":"D","sa":null,"pg":null,"f":[],"n":12,"e":["Multidrug-resistant TB is resistant to INH and rifampicin.",""],"im":[]},{"id":"q6e1d08e7","ch":"Tumors & ILD","q":"Exposure to asbestos is the main risk factor for:","o":[["A","Bronchogenic carcinoma"],["B","Mesothelioma"],["C","Carcinoid tumor"],["D","Lymphoma"]],"a":"B","sa":null,"pg":null,"f":[],"n":1,"e":["Asbestos is the main risk factor for mesothelioma.",""],"im":[]},{"id":"q45709b21","ch":"Tumors & ILD","q":"Bronchogenic carcinoma can be presented by:","o":[["A","Lung abscess formation"],["B","Pneumonic consolidation"],["C","Normal physical findings"],["D","All of the above"]],"a":"D","sa":null,"pg":null,"f":[],"n":2,"e":["Bronchogenic carcinoma has many presentations, including abscess, consolidation or none.",""],"im":[]},{"id":"qf333f854","ch":"Tumors & ILD","q":"Screening for detection o eversed splitting of 2nd heart sound at pulmonary area"],["C","Systolic murmur at tricuspid area"],["D","Dullness in pulmonary area"]],"a":"B","sa":null,"pg":null,"f":[],"n":6,"e":["Reversed splitting of the 2nd sound is not a feature; wide splitting is.",""],"im":[]},{"id":"qaa58d225","ch":"Pleural diseases","q":"During physical examination of a patient with suspected left sided pleural effusion, which combination of physical signs is classic for a fluid-filled pleural space?","o":[["A","Increased TVF, stony dull percussion, bronchial breathing"],["B","Decreased tactile vocal fremitus, stony dull percussion, absent/diminished breath sounds"],["C","Normal tactile vocal fremitus, tympanitic percussion, vesicular breathing with wheezes"],["D","Increased tactile vocal fremitus, dull percussion, amphoric breathing"]],"a":"B","sa":null,"pg":null,"f":[],"n":1,"e":["Effusion: decreased TVF, stony dullness, diminished breath sounds.",""],"im":[]},{"id":"q9a60dc5b","ch":"Pleural diseases","q":"Main finding in pleural effusion is:","o":[["A","Dullness with increased breath sounds"],["B","Stony dullness with diminished breath sounds"],["C","Dullness with increased TVF"]],"a":"B","sa":null,"pg":null,"f":[],"n":2,"e":["Stony dullness with diminished breath sounds is the main finding.",""],"im":[]},{"id":"qb976fa00","ch":"Pleural diseases","q":"Low TVF, dullness, diminished breath sounds on the left side and shift of the trachea to the right. Diagnosis?","o":[],"a":null,"sa":"Left massive pleural effusion","pg":null,"f":[],"n":3,"e":["Fluid abolishes vibration and breath sounds and gives stony dullness; a large left effusion also pushes the trachea and mediastinum to the opposite (right) side. Consolidation would increase TVF with bronchial breathing and no shift.",""],"im":[]},{"id":"qc243fe58","ch":"Pleural diseases","q":"Pleural effusion is accompanied by the following physical signs except:","o":[["A","Skodaic resonance above its upper border"],["B","Shifting dullness"],["C","Aegophony at its upper border"]],"a":"B","sa":null,"pg":null,"f":[],"n":4,"e":["Shifting dullness is not a feature of free effusion in this key.",""],"im":[]},{"id":"q29fe55de","ch":"Pleural diseases","q":"A case with diminished TVF, hyper-resonance and diminished breath sounds over the left hemithorax with shift of the trachea to the right side. These are physical findings of:","o":[["A","Left simple pneumothorax"],["B","Left tension pneumothorax"],["C","Left massive pleural effusion"],["D","Left lung consolidation"]],"a":"B","sa":null,"pg":null,"f":[],"n":5,"e":["Hyperresonance with the trachea pushed to the opposite side indicates tension pneumothorax.",""],"im":[]},{"id":"qe203dc3a","ch":"Pleural diseases","q":"A case with diminished TVF, hyper-resonance and diminished breath sounds over the left hemithorax and the trachea is central. These are physical findings of:","o":[["A","Left simple pneumothorax"],["B","Left tension pneumothorax"],["C","Left massive pleural effusion"],["D","Left lung consolidation"]],"a":"A","sa":null,"pg":null,"f":[],"n":6,"e":["Simple pneumothorax: hyperresonance, decreased TVF and breath sounds, trachea central.",""],"im":[]},{"id":"qc76bde3b","ch":"Pleural diseases","q":"A case with diminished TVF, positive shifting dullness and diminished breath sounds over the left hemithorax. These are physical findings of:","o":[["A","Left simple pneumothorax"],["B","Left tension pneumothorax"],["C","Left massive pleural effusion"],["D","Left hydropneumothorax"]],"a":"D","sa":null,"pg":null,"f":[],"n":7,"e":["Air plus fluid in the pleural space (hydropneumothorax) gives a shifting level.",""],"im":[]},{"id":"qfc7e4d5d","ch":"Pleural diseases","q":"Tension pneumothorax shows the following clinical signs except:","o":[["A","Shift of mediastinum to opposite side"],["B","Hyperresonance"],["C","Cavernous breathing"],["D","Amphoric breathing"]],"a":"C","sa":null,"pg":null,"f":[],"n":8,"e":["Cavernous breathing is not a sign of tension pneumothorax; amphoric is.",""],"im":[]},{"id":"q3557d8bb","ch":"Mediastinum & resp. failure","q":"Type II respiratory failure is characterized by:","o":[["A","Hypoxemia only"],["B","Hypercapnia only"],["C","Hypoxemia and hypercapnia"],["D","None of the above"]],"a":"C","sa":null,"pg":null,"f":[],"n":1,"e":["Type II failure has hypoxemia with hypercapnia.",""],"im":[]},{"id":"q4978474e","ch":"Mediastinum & resp. failure","q":"Superior vena cava obstruction is characterized by the following except:","o":[["A","Congested non-pulsating neck veins"],["B","Morning face oedema"],["C","Supraclavicular and suprasternal fullness"],["D","Dilated veins over the chest wall which fill from down upward"]],"a":"D","sa":null,"pg":null,"f":[],"n":2,"e":["In SVC obstruction chest wall veins fill from above downward.",""],"im":[]}],"img":{},"skillVersion":"3.2","categories":[{"id":"hawary","name":"Hawary Only","subtitle":"Questions from Dr. Hawary only","description":"All questions from the Hawary source, shown as a separate view. They remain in their original chapters too.","kind":"source","questionIds":["qa5132ab8","q56a7490e","q8d3212eb","qde7d3497","q4978474e","qc52b09bb","q0cc7845d","qd37187dc","qa5da2fed","qa3422297","qa1b0451f","q9be72fcb","q74f39ae1","q0cf17f39","qadd5af03","q1129d6fe","qd0da86f3","q29fe55de","q4935a36c","q64d69634","q615f53b5","q588d2094","q3a127737","qf3f3805c","q3f2f2c88","qc1423a57","qdd20b7f9","q3557d8bb","qfbc14ae1","q84425fa4","qc80d11e9","qe186ae3a","q0c0e7268","qe5095566","q2bdb8e09","q33292e1e","q4d77a2b4","q6219303e","q4b46c26a","q34d8b18f","q6658483d","q5a7afdd3","q4a3b7aba","q29530942","q92b64028","q0614491d","qf68a41b4","qbc6bca5a","qc1e8b382","q243117ee","q3d9aee10","qffde7073","qce9cc5db","q3d4bae9b","q237f60de","q0d96a2bf","qaa58d225"],"color":"8b5cf6","concepts":[]}],"notes":{"systems":[{"n":"Respiratory Symptoms","topics":[{"n":"Dyspnoea and wheeze","facts":[{"t":"**Sudden (acute) dyspnoea** is caused by pneumothorax, pulmonary embolism and an attack of bronchial asthma, whereas **gradual progressive dyspnoea** is caused by COPD, interstitial pulmonary fibrosis (IPF) and showers of pulmonary emboli; IPF never causes sudden dyspnoea, and pneumothorax never causes gradual dyspnoea.","q":["q29530942","q0cc7845d"]},{"t":"**Acute dyspnoea with chest pain** suggests myocardial infarction, pulmonary embolism or pneumothorax; an asthma attack causes dyspnoea with wheeze, but chest pain is not typical.","q":["q6658483d"]},{"t":"**Dyspnoea with wheeze** occurs in bronchial asthma, COPD and acute asthmatic bronchitis; **dyspnoea without wheeze** occurs in pleural effusion, pneumothorax, interstitial pulmonary fibrosis and primary emphysema.","q":["q92b64028","qb0371355","q09d5f9e0"]},{"t":"**Orthopnoea** (dyspnoea on lying flat) occurs in left-sided heart failure, and also in bronchial asthma and interstitial pulmonary fibrosis.","q":["q074c9943"]},{"t":"A **localised fixed wheeze** means fixed local narrowing of a bronchus — an endobronchial tumour, an aspirated foreign body, or compression by an enlarged lymph node — whereas asthma gives generalised, variable wheeze.","q":["q74f39ae1","qc1423a57"]},{"t":"Wheeze that **disappears with cough** is due to bronchial secretions; wheeze from bronchospasm or bronchial compression does not clear with cough.","q":["q588d2094"]}]},{"n":"Cough and sputum","facts":[{"t":"**Dry cough** occurs in bronchial asthma, interstitial pulmonary fibrosis and pleurisy; **productive cough** occurs in pneumonia, bronchiectasis and lung abscess — bronchiectasis never gives a dry cough, and IPF never gives a productive cough.","q":["qb407f2cd","qd13c7f13"]},{"t":"**Rusty sputum** is characteristic of (lobar pneumococcal) pneumonia, and **copious purulent sputum** is characteristic of bronchiectasis.","q":["q615f53b5","qfbc14ae1"]},{"t":"Hazards and complications of **cough** include pneumothorax, hernia and cerebral haemorrhage; cough does not cause (transudative) pleural effusion.","q":["q64d69634","q60499f60"]}]},{"n":"Chest pain","facts":[{"t":"**Pleuritic (pleural) chest pain** is stitching in character, increases with inspiration and cough, and decreases when the breath is held.","q":["qdd20b7f9","qb574e937"]},{"t":"**Continuous agonising dull aching chest pain** is associated with bronchogenic carcinoma invading the chest wall or pleura, not with pleurisy or pulmonary embolism.","q":["q3d9aee10"]}]}]},{"n":"General Examination","topics":[{"n":"Clubbing","facts":[{"t":"**Clubbing** is associated with bronchogenic carcinoma (lung cancer), bronchiectasis, interstitial lung disease/IPF and cystic fibrosis; it is NOT associated with bronchial asthma, emphysema or uncomplicated COPD — clubbing in COPD should raise suspicion of carcinoma.","q":["qce9cc5db","q0d96a2bf","qe5095566"]}]},{"n":"Cyanosis","facts":[{"t":"**Cyanosis** appears when reduced haemoglobin is at least **5 g/dL**.","q":["qfda89c46","qa1b0451f"]},{"t":"**Central cyanosis** (including discoloration of the tongue) occurs in right-to-left shunt, marked polycythaemia and interstitial lung fibrosis, and does not improve on warming the hand; **peripheral cyanosis** is caused by shock, cold exposure and peripheral arterial disease, and improves on warming the hand.","q":["q617ebf1a","q38661b84","q8df011cd","qd1fdb9c8"]}]},{"n":"Neck veins and venous obstruction","facts":[{"t":"**Bilateral congested non-pulsating neck veins** occur with obstruction of venous return — fibrosing mediastinitis, cardiac tamponade and superior vena cava thrombosis — but not as a non-metastatic (paraneoplastic) manifestation of oat-cell carcinoma.","q":["qceb1271f"]},{"t":"**Superior vena cava obstruction** causes congested non-pulsating neck veins, morning facial oedema, and supraclavicular and suprasternal fullness, with dilated tortuous chest-wall veins that fill **from above downward** (in inferior vena cava obstruction they fill from below upward).","q":["q0cf17f39","q4978474e"]}]}]},{"n":"Inspection and Palpation","topics":[{"n":"Surface anatomy and chest shape","facts":[{"t":"The **carina** (tracheal bifurcation) lies opposite the **sternal angle (angle of Louis/Lewis)**, which also lies opposite the aortic arch; the **transverse (horizontal) fissure** lies at the level of the **4th costal cartilage**.","q":["q616acee1","q800a652e","qc80d11e9"]},{"t":"**Barrel-shaped (hyperinflated, emphysematous) chest** is caused by hyperinflation in emphysema/COPD, with the anteroposterior diameter equal to the transverse diameter, horizontal ribs, dorsal kyphosis (not lordosis), a **wide subcostal angle** (not acute) and transverse shoulders.","q":["qb247d973","qd37187dc","q49835c0b","qbe72f0a6"]},{"t":"**Kyphoscoliosis** causes an asymmetrical chest deformity, unlike symmetrical deformities such as barrel chest.","q":["qc2b11388"]},{"t":"**Unilateral chest-wall retraction** is caused by volume loss — lung collapse, pulmonary fibrosis and pleural fibrosis (and kyphoscoliosis) — but not by lung consolidation, pleural effusion or pneumothorax, which do not reduce lung volume.","q":["q4a3b7aba","q41ca6c9c","qa5132ab8"]}]},{"n":"Breathing mechanics, movement and pulsations","facts":[{"t":"The **diaphragm** is the main muscle of ventilation; **abdominal paradox** (the abdomen moving inward during inspiration) is a sign of diaphragmatic paralysis.","q":["q0614491d","q0c0e7268"]},{"t":"**Indrawing of the intercostal spaces during inspiration** is a sign of increased airway resistance (strong negative intrathoracic pressure), not of intercostal muscle fatigue, diaphragmatic paralysis or pleurisy; prolonged expiration instead uses the abdominal muscles and pursed lips, and intercostal indrawing is a sign of difficult inspiration, not of prolonged expiration.","q":["q243117ee","qee64bbce"]},{"t":"The **Litten sign** (the shadow of diaphragmatic excursion) is best seen in thin patients, not fatty ones, with the patient examined against light.","q":["qd1bd5c97"]},{"t":"Chest **mobility is reduced** (never increased) by pleural effusion, bronchogenic carcinoma and pneumothorax.","q":["q3ab7acb1"]},{"t":"**Tracheal tug** is detected in emphysema, where the hyperinflated chest pulls the trachea down on inspiration.","q":["q1e229138"]},{"t":"The **apex beat is shifted outside the midclavicular line** by right pleural effusion, right pneumothorax (pushing the mediastinum away) and right ventricular enlargement; right-sided collapse pulls the heart toward the right, so the apex lies near the left parasternal line.","q":["q4894550e","q7598bae0"]}]},{"n":"Tactile vocal fremitus","facts":[{"t":"**Tactile vocal fremitus (TVF) is increased** over pneumonic consolidation, a superficial cavity and a cavity surrounded by consolidation, because a patent bronchus conducts vibrations through solid lung; it is **decreased** over pneumothorax, pleural effusion, mesothelioma, emphysema, fibrosis and obstructive collapse (blocked bronchus), and a deep cavity does not increase it.","q":["q364b315c","q4e73ec7b","qb5922aae","q9be72fcb","qdd0606cd","q8d3212eb"]}]}]},{"n":"Percussion","topics":[{"n":"Percussion signs and special tests","facts":[{"t":"**Shifting dullness** over the chest occurs with **hydropneumothorax** (air plus fluid giving a level that shifts with posture, with diminished TVF and diminished breath sounds), not with free or encysted pleural effusion or encysted pneumothorax.","q":["qa5da2fed","qc76bde3b"]},{"t":"**Positive tidal percussion** (dullness moving with respiration) denotes **subdiaphragmatic** dullness, whereas **positive reversed tidal percussion** denotes diaphragmatic paralysis (paradoxical diaphragm movement).","q":["q4d77a2b4","q3668d3c2"]},{"t":"**Unilateral hyperresonance** occurs with pneumothorax, giant bulla and compensatory emphysema; an attack of bronchial asthma causes bilateral, not unilateral, hyperresonance.","q":["qf68a41b4"]}]},{"n":"Cardiac and abdominal percussion areas","facts":[{"t":"The **bare area of the heart** is normally **dull on light percussion** (it is not covered by lung); its dullness is increased by cardiomegaly, pericardial effusion and lingula collapse, and reduced by emphysema and hyperinflation overlapping the heart.","q":["q3f2f2c88","qd4a7f063","qc52b09bb"]},{"t":"The **right border of the heart** is normally percussed **one finger to the right of the sternum**, and the **upper border of the liver** is detected by **heavy percussion at the right midclavicular line**.","q":["qb1c429b6","qf746c2c4"]},{"t":"**Traube's area** (normally tympanitic from the gastric bubble) becomes dull with left-sided pleural effusion, a full stomach or splenomegaly, but not with left lower lobe consolidation.","q":["q3d4bae9b","q55994c03"]},{"t":"The boundaries of **Traube's area** include the tip of the left 8th costal cartilage (not the 6th), the left 9th rib and the left 11th rib in the mid-axillary line.","q":["q11d83a1c"]}]},{"n":"Kronig's isthmus and apical percussion","facts":[{"t":"**Kronig's isthmus** is bounded by the **7th cervical spinous process** posteriorly (not T1), the sternoclavicular joint and the junction of the medial two-thirds and lateral third of the **clavicle** anteriorly, and the junction of the lateral two-thirds and medial third of the **scapular spine**; its lateral end is the line joining the clavicular and scapular-spine junctions, and the middle of the sternal notch is not a boundary.","q":["q237f60de","q30b54b0e","q2c3ea3bd"]},{"t":"A **dull Kronig's isthmus** may be due to a **superior sulcus (Pancoast) tumour**, not to emphysema or a consolidated anterior segment of the upper lobe.","q":["qfad300e5"]}]}]},{"n":"Auscultation","topics":[{"n":"Breath sounds and voice transmission","facts":[{"t":"**Vesicular breathing** is a gentle rustling sound with inspiration about **three times** expiration and **no gap** between inspiration and expiration; **bronchial breathing** is hollow, with inspiration **equal to** expiration and a **gap** between them.","q":["q3a127737","qffde7073"]},{"t":"**Bronchial breathing** is heard over consolidation, collapse with a patent bronchus, a superficial cavity with a patent bronchus and bronchopleural fistula, but not in bronchial asthma (diminished sounds with wheeze); **diminished breath sounds** occur with pleural effusion, pneumothorax and obstructive collapse, whereas pneumonia/consolidation gives bronchial breathing.","q":["q1129d6fe","qcf02f761","q357e7b87","q01c03d56"]},{"t":"**Amphoric bronchial breathing** is a sign of a **superficial tense (tension) cavity** with a patent bronchus, not of pneumonic consolidation, a big cavity with a relaxed wall or encysted pneumothorax; **post-tussive suction** also occurs over a large cavity.","q":["q751760d2","q6bdb6080","q9fbf00d1"]},{"t":"**Positive whispering pectoriloquy** occurs with **tubular bronchial breathing** (solid consolidation transmitting whispered speech), and is the characteristic feature of a **positive D'Espine sign**, which is due to **enlarged subcarinal (tracheobronchial) lymph nodes** transmitting voice sounds to the spines — not to a paratracheal mass, an enlarged left atrium or pericardial effusion.","q":["qadd5af03","q33292e1e","qf3bd8880"]}]},{"n":"Added sounds","facts":[{"t":"**Late inspiratory crepitations** occur in interstitial pulmonary fibrosis; **bilateral basal crepitations with frothy sputum** indicate pulmonary oedema from left-sided heart failure.","q":["qa3e3a357","qf7b63a73"]},{"t":"A **pleural rub** is a to-and-fro sound whose intensity **increases** when the stethoscope is pressed against the chest wall, and which disappears when pleural effusion develops.","q":["qd1d377d3"]}]}]},{"n":"Clinical Syndromes","topics":[{"n":"Consolidation, collapse and cavity","facts":[{"t":"**Consolidation** shows **increased TVF, dullness on percussion and bronchial breathing**; a **superficial cavity** shows increased TVF and bronchial breathing but a **resonant** percussion note.","q":["q33ec3610","qe186ae3a","q56a7490e"]},{"t":"**Lung collapse** is caused by **total bronchial obstruction** (with absorption of air), pneumothorax or pleural effusion (compression), but not by partial bronchial obstruction, bronchospasm or interstitial pulmonary fibrosis; collapse shows **decreased TVF**.","q":["qf48562d3","q4935a36c","q2fab64ff"]},{"t":"**Obstructive collapse** shows diminished TVF, dullness and diminished breath sounds with the **trachea and mediastinum shifted toward the same side**; a **mass such as bronchogenic carcinoma** gives the same dull, diminished signs but pushes the trachea **to the opposite side**.","q":["qf3f3805c","q9713bcaa","q34d8b18f","q6219303e"]}]}]},{"n":"Pleural Disease","topics":[{"n":"Pleural effusion","facts":[{"t":"**Pleural effusion** shows **decreased TVF, stony dullness and diminished or absent breath sounds**, with the trachea shifted **away** from the affected side in massive effusion; **Skodaic resonance** and **aegophony** occur above its upper border, and shifting dullness is not a feature of free effusion.","q":["qaa58d225","q9a60dc5b","qb976fa00","qc243fe58"]}]},{"n":"Pneumothorax","facts":[{"t":"**Simple pneumothorax** shows diminished TVF, hyperresonance and diminished breath sounds with a **central trachea**; **tension pneumothorax** shows the same signs with the trachea and mediastinum **shifted to the opposite side**.","q":["q29fe55de","qe203dc3a","qfc7e4d5d"]}]}]},{"n":"Obstructive Airway Disease: Asthma and COPD","topics":[{"n":"Asthma","facts":[{"t":"The main symptoms of **asthma** are **dyspnoea and wheeze** (not chest pain or haemoptysis); the **rapid reliever of bronchoconstriction** is a **β2-receptor agonist**, whereas sodium cromoglycate, nedocromil and antihistamines are not rapid relievers.","q":["q91dd9d13","qc1e8b382"]}]},{"n":"Emphysema and COPD","facts":[{"t":"**Emphysema** is characterised by **progressive dyspnoea** with hyperinflation: **decreased TVF** over the apices, encroachment on the dullness of the bare area of the heart and on **hepatic dullness**, positive tracheal tug, and an absent apical pulsation.","q":["qbcf4aa27","qf897663c","q80009ee9","qb418be2b"]},{"t":"In **COPD**, the neck veins show **expiratory filling** (raised intrathoracic pressure in expiration), and lung volumes show **increased residual volume, total lung capacity and functional residual capacity with decreased FVC**.","q":["qaaf027b8","qc7e8b1c3"]}]}]},{"n":"Suppurative Lung Disease","topics":[{"n":"Bronchiectasis and lung abscess","facts":[{"t":"**Bronchiectasis** presents with chronic (years-long) cough and **copious purulent offensive sputum** that increases on leaning forward or postural change, with bilateral basal crepitations that **change with cough**; diagnosis is nowadays confirmed by **high-resolution CT (HRCT)**.","q":["qa3422297","q077a78bd"]},{"t":"A **lung abscess** presents acutely with fever and cough for a few days followed by a **sudden gush of large amounts of purulent offensive sputum** (increasing when lying on the opposite side) as it ruptures into a bronchus, with bronchial breathing over the affected lobe.","q":["q1c5ca1bd","q5a7afdd3"]},{"t":"**Suppurative lung syndromes** include lung abscess, bronchiectasis and infected lung cyst; **empyema** is a pleural collection, not a lung suppuration.","q":["q9a656c76"]}]}]},{"n":"Tuberculosis","topics":[{"n":"Transmission, history and diagnosis","facts":[{"t":"**Tuberculosis is transmitted mainly by droplet (airborne) infection**; food-borne (bovine milk) and intrauterine (congenital) spread also occur. In suspected pulmonary TB, the **contact history** must be stressed when taking the history.","q":["q4b46c26a","q7ec47cc6"]},{"t":"Pulmonary TB radiology may show **cavitation, fibrosis and consolidation**; **active pulmonary TB is proved by positive sputum for acid-fast bacilli** — a positive tuberculin test, suggestive radiology or a raised ESR do not prove active disease.","q":["qbc6bca5a","q84425fa4"]},{"t":"A **positive tuberculin skin test** denotes **infection with or without disease** (not active disease only); it is read at **48–72 hours** and is positive when **induration (not erythema) exceeds 10 mm**.","q":["q48559d3c","q060f6e4d","qfa7c0b1c"]}]},{"n":"Anti-tuberculous drugs","facts":[{"t":"**Rifampicin, pyrazinamide and isoniazid are hepatotoxic**, whereas **ethambutol is not** (its toxicity is optic neuritis); **rifampicin** causes **orange discoloration of body fluids**.","q":["q883b9a7c","q90cb8b35"]},{"t":"**Streptomycin** must be **totally avoided in pregnancy** (ototoxic to the fetus, affecting the 8th nerve) and avoided in **renal impairment** (nephrotoxic), whereas pyrazinamide can be used in renal impairment.","q":["q01c104bd","qde7d3497"]},{"t":"**Multidrug-resistant TB** organisms are mainly resistant to **isoniazid (INH) and rifampicin**.","q":["qaab2c57c"]}]}]},{"n":"Tumours, Interstitial Lung Disease and Occupational Lung Disease","topics":[{"n":"Lung tumours","facts":[{"t":"**Asbestos exposure** is the main risk factor for **mesothelioma**.","q":["q6e1d08e7"]},{"t":"**Bronchogenic (bronchial) carcinoma** may present with collapse, consolidation, effusion, lung abscess formation, or **normal physical findings**; **sputum cytology and chest X-ray** are the non-invasive tools used in screening for early lung cancer, whereas fibreoptic/rigid bronchoscopy and bronchography are invasive procedures.","q":["q45709b21","q61b36ad1","qf333f854"]}]},{"n":"Interstitial lung disease","facts":[{"t":"**Interstitial pulmonary fibrosis (IPF)** presents with gradual progressive dyspnoea, a dry irritative cough, central cyanosis, clubbing and **bilateral diffuse late inspiratory crepitations**; **high-resolution CT (HRCT)** is the investigation of choice for interstitial lung diseases.","q":["qee7d5df6","q6c290029"]}]},{"n":"Occupational lung disease","facts":[{"t":"**Caplan syndrome** in coal workers' pneumoconiosis is associated with **rheumatoid arthritis**.","q":["q83482949"]}]}]},{"n":"Pulmonary Vascular Disease, Cor Pulmonale and Respiratory Failure","topics":[{"n":"Pulmonary embolism and pulmonary hypertension","facts":[{"t":"**Pulmonary embolism** typically causes dyspnoea, chest pain and haemoptysis with **tachycardia — not bradycardia**; repeated showers of emboli can cause gradual progressive dyspnoea.","q":["q2bdb8e09","q0cc7845d"]},{"t":"In **pulmonary hypertension** there is a **systolic murmur at the tricuspid area** and **dullness in the pulmonary area**; reversed splitting of the second heart sound is not a feature.","q":["qec846773","q7c82a449"]}]},{"n":"Cor pulmonale","facts":[{"t":"In **cor pulmonale**, palpable pulsations are felt in the **pulmonary area, epigastric area and left parasternal area** (right ventricular enlargement); the neck veins are **congested and pulsating**, with a **giant a wave** and systolic expansion, with tricuspid facies and a positive hepatojugular sign — but **pistol-shot sounds over the femoral artery** are a sign of aortic regurgitation, not cor pulmonale.","q":["qd0da86f3","qd12eb367","qf44312f0","qb418be2b"]}]},{"n":"Respiratory failure","facts":[{"t":"**Type II respiratory failure** is characterised by **hypoxaemia and hypercapnia** together (ventilatory failure), not by either alone.","q":["q3557d8bb"]}]}]},{"n":"Investigations and Pulmonary Function","topics":[{"n":"Arterial blood gases","facts":[{"t":"Normal arterial blood gas values are **pH 7.35–7.45**, **PaCO2 35–45 mmHg** and **PaO2 80–100 mmHg**.","q":["q92b6c585","qfe6e6700","qc3017656"]}]},{"n":"Spirometry and lung volumes","facts":[{"t":"**Simple spirometry** can measure tidal volume, inspiratory capacity and expiratory reserve volume, but **cannot measure residual volume**.","q":["q3dc45ea9"]},{"t":"In **restrictive lung disease**, vital capacity, residual volume and total lung capacity are all **reduced**, and spirometry shows **decreased FVC and FEV1 with a normal FEV1/FVC ratio**.","q":["q9328413d","q71dba329"]}]}]}]},"palette":"respiratory","paletteCol
