/* ============ Design polish (v3.2) ============
   CSS-only refinements: no markup, IDs, classes, JS, or storage keys changed.
   Appended after the v3.1 fluid-UI rules so it overrides by cascade order. */
/* --- Type scale: stem more prominent, options easier to scan --- */
body{font:16px/1.6 system-ui,Segoe UI,Roboto,sans-serif}
main h2{font-size:1.28rem;line-height:1.3;letter-spacing:-.01em;margin:22px 0 12px}
.q h3{font-size:1.08rem;line-height:1.5;font-weight:600;margin:0 0 12px}
/* --- Question cards: airier, softer shadows, clearer zones --- */
.q{padding:20px 20px 16px;border-radius:16px;margin:0 0 16px;box-shadow:0 1px 2px rgba(23,50,77,.05),0 10px 28px rgba(23,50,77,.06)}
.im{margin:4px 0 14px}

.opt{margin:7px 0;padding:11px 14px;border-radius:11px;font-size:.95rem;position:relative}
.ans{margin-top:14px;padding:12px 14px;border-radius:11px;border-inline-start:3px solid var(--ok)}
.explain{margin-top:14px;padding:12px 14px;border-radius:11px}
.flag{margin-top:10px;padding:8px 12px}
/* --- Answer feedback: gentle pop + check/cross marks (existing classes only) --- */
@keyframes qpop{0%{transform:scale(1)}35%{transform:scale(1.012)}100%{transform:scale(1)}}
.opt.ok,.opt.bad{animation:qpop .28s ease}
.opt.ok{font-weight:600;box-shadow:inset 0 0 0 1px var(--ok),0 2px 12px rgba(27,158,90,.16);padding-inline-end:38px}
.opt.bad{box-shadow:inset 0 0 0 1px var(--bad),0 2px 12px rgba(214,69,69,.14);padding-inline-end:38px}
.opt.ok::after,.opt.bad::after{position:absolute;top:50%;inset-inline-end:12px;transform:translateY(-50%);font-weight:800;font-size:1.05rem;line-height:1}
.opt.ok::after{content:"✓";color:var(--ok)}
.opt.bad::after{content:"✗";color:var(--bad)}

header{padding:24px 56px 20px 20px}

header p{font-size:.93rem}
header svg{opacity:.22}

ark questions, or use Wrong Only to review questions you answered incorrectly with their answers shown. (To answer them again from scratch, use Retake wrong.)</p><p><b>Notes:</b> Read consolidated high-yield facts and jump to related questions without changing progress. Use “Wrong questions notes” to show only the facts linked to questions you answered wrongly.</p><p><b>Question map:</b> Use numbered dots to jump to questions and see answer status.</p><p><b>Pictures:</b> Tap an image to enlarge it; tap again to zoom further, or press Esc to close.</p><p><b>Theme:</b> Follows your device by default; use the theme button to switch manually.</p><p><b>Backup / Restore:</b> On the home page, Backup downloads your progress as a file; Restore loads it back on this or another device. Useful before clearing browser data.</p><p><b>Reset:</b> Clears answers and pending exam selections. Saved questions remain available.</p><p><b>Dhikr:</b> A short dhikr from a fixed list of 14 appears in the footer and changes every day. Every custom quiz shows a different dhikr from the same list, rotating with each quiz you build. Finishing a chapter or a collection shows its own duaa, different for each chapter.</p>`;

$('qzp').innerHTML=h;$('qzp').classList.add('on');qzSum()}

$('qzp').onclick=e=>{const b=e.target.closest('button');if(e.target.id=='qzp'||(b&&b.id=='qzx')){$('qzp').classList.remove('on');return}if(!b||b.id!='qzgo')return;
const L=qzPool();if(!L.length){toast('No questions match this selection.');return}
const n=Math.min(L.length,Math.max(1,parseInt($('qzn').value,10)||L.length));const ids=L.map(q=>q.id);
if($('qzsh').checked){for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)),x=ids[i];ids[i]=ids[j];ids[j]=x}}
QZW=(($('qzp').querySelector('input[name=qzp]:checked')||{}).value||'all')==='wrong';QZ=ids.slice(0,n);DHKQC++;try{localStorage.setItem(SK+'qzc',String(DHKQC))}catch(e){};DHKQ=DHK[DHKQC%DHK.length];$('qzp').classList.remove('on');wrongOnly=false;savedOnly=false;syncBtns();$('s').value='';if(SH)setShuffle(false);openView('__quiz');scrollTo(0,0);if(n<L.length)toast('Custom quiz: '+n+' of '+L.length+' matching questions')};

function openShPicker(){const sel=new Set(SC.length?SC:DB.ch);let h='<div class="shb"><h3>🔀 Shuffle from which chapters?</h3><div class="stat">Pick one or more chapters. Only questions you have not answered yet are shuffled.</div><div class="qa"><button id="sha">Select all</button><button id="shn">Clear</button></div><div class="shl">';
DB.ch.forEach((c,i)=>{const L=DB.q.filter(q=>q.ch==c),u=L.filter(q=>!P[q.id]).length;h+=`<label><input type="checkbox" data-c="${ea(c)}" ${sel.has(c)?'checked':''}> ${i+1}. ${esc(c)} <span>${u} unanswered / ${L.length}</span></label>`});

$('shp').onclick=e=>{const b=e.target.closest('button');if(e.target.id=='shp'||(b&&b.id=='shx')){$('shp').classList.remove('on');return}if(!b)return;

/* ---- Progress backup / restore (v3.1): a JSON file the student can keep or move to another device. */
function backupProgress(){try{const data={app:'5thNotes QBank',sk:SK,exportedAt:new Date().toISOString(),answers:P,lastAnswered:LAST,bookmarks:BM,theme:TH,showExplanations:showExpl};const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=SK+'-progress.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Progress backup downloaded')}catch(e){toast('Backup failed: '+e.message)}}
$('rfile').addEventListener('change',()=>{const f=$('rfile').files[0];$('rfile').value='';if(!f)return;const rd=new FileReader();rd.onload=()=>{let d;try{d=JSON.parse(rd.result)}catch(e){toast('That file is not a valid progress backup');return}
if(!d||typeof d!=='object'||!d.answers||typeof d.answers!=='object'){toast('That file is not a progress backup');return}
const valid={};Object.keys(d.answers).forEach(id=>{if(byId(id))valid[id]=d.answers[id]});const n=Object.keys(valid).length;
if(!n){toast('No answers in that backup match this question bank');return}

if(!confirm('Restore '+n+' answered question(s) from the backup? Your current progress will be replaced. Saved questions from the backup will also be restored.'))return;
P=valid;RTS.clear();save();LAST=(d.lastAnswered&&valid[d.lastAnswered.id])?d.lastAnswered:null;try{if(LAST)localStorage.setItem(SK+'ans',JSON.stringify(LAST));else localStorage.removeItem(SK+'ans')}catch(e){}
BM=Array.isArray(d.bookmarks)?d.bookmarks.filter(id=>byId(id)):BM;saveBM();PX={};savePX();updRB();openView(null);toast('Progress restored: '+n+' answered question(s)')};rd.readAsText(f)});
/* ---- Notes page. Viewing / searching / opening notes never touches answered progress or Resume. */
function renderNotes(){const b=$('nbody');const nwb=$('nw');if(nwb)nwb.classList.toggle('pri',NWN);if(!NT){b.innerHTML='<p>No notes in this site.</p>';return}
const W=NQ.toLowerCase().trim().split(/\s+/).filter(Boolean),N=nCount();let h=`<h2>📘 Notes</h2><div class="stat">${N.f} facts · ${N.s} system${N.s>1?'s':''} · ${N.t} topics. Read these first, then test yourself with the questions. Tap a small number to open the related question.${NWN?' Showing only facts linked to questions you answered wrongly.':''}</div>`,shown=0,chips='',body='';
NT.systems.forEach((s,si)=>{let tb='',tc='',sc=0;s.topics.forEach((p,pi)=>{const F=p.facts.map((f,fi)=>({f,fi})).filter(x=>(!W.length||W.every(w=>x.f._s.includes(w)))&&(!NWN||(x.f.q||[]).some(id=>P[id]&&P[id].r===0)));if(!F.length)return;sc+=F.length;
tc+=`<a class="nchip" data-top="${si}-${pi}">${esc(p.n)}</a>`;
tb+=`<div class="ntop"><h4 id="nt-${si}-${pi}" dir="auto">${esc(p.n)} <small>(${F.length})</small></h4><ul class="facts">${F.map(x=>factHTML(x.f,si,pi,x.fi)).join('')}</ul></div>`});
if(!sc)return;shown+=sc;chips+=`<a class="nchip" data-sys="${si}">${esc(s.n)} <small>${sc}</small></a>`;
body+=`<details class="nsys" id="ns-${si}" data-si="${si}" ${(W.length||NOPEN.has(si))?'open':''}><summary dir="auto">${esc(s.n)}<small>${sc} fact${sc>1?'s':''}</small></summary>${s.topics.length>1?`<div class="nchips">${tc}</div>`:''}${tb}</details>`});
h+=(chips?`<div class="nchips">${chips}</div>`:'')+(shown?body:(NWN?(DB.q.some(q=>P[q.id]&&P[q.id].r===0)?'<p>No notes are linked to your wrong answers.</p>':'<p>No wrong answers yet 🎉 — facts linked to questions you answer wrongly will appear here.</p>'):'<p>No notes match your search.</p>'));b.innerHTML=h;
NHL.forEach(k=>{const el=$('nf-'+k);if(el){el.classList.add('hl')}});}
function factHTML(f,si,pi,fi){const R=(f.q||[]).filter(byId);let r='';
if(R.length){const lab=id=>{const q=byId(id);return `<a class="qr" data-qid="${id}" title="${ea(q.q.slice(0,110))}">${DB.ch.indexOf(q.ch)+1}.${q.n}</a>`};
r=`<span class="qrs">Q ${R.slice(0,6).map(lab).join('')}${R.length>6?`<a class="qr" data-more="1">+${R.length-6}</a><span class="qh" hidden>${R.slice(6).map(lab).join('')}</span>`:''}</span>`}

/* in-app help: small (i) icons open one shared tooltip (tap on phones, hover/focus on desktop); it never blocks taps */
const tipEl=document.createElement('div');tipEl.id='tip';tipEl.setAttribute('role','tooltip');document.body.appendChild(tipEl);let tipFor=null,tipHov=false,tipT=0;
function helpText(k){if(k=='shuffle'){const inCat=cur&&cur!=='all'&&cur!=='__notes';return inCat?HELP.shuffleCat:(CATS.length?HELP.shuffleAll:HELP.shuffleAllPlain)}
if(k.indexOf('cat:')==0){const c=CATS.find(x=>x.id==k.slice(4));if(!c)return'';return c.description||(/zanqa/i.test(c.id)?HELP.zanqa:/hawary/i.test(c.id)?HELP.hawary:'An additional view of existing questions. Progress is shared with the main bank.')}return HELP[k]||''}

function showTip(el,hov){const s=helpText(el.dataset.h);if(!s)return;hideTip();tipEl.textContent=s;tipEl.style.display='block';const r=el.getBoundingClientRect(),w=tipEl.offsetWidth,h=tipEl.offsetHeight;
tipEl.style.left=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8)+'px';let y=r.bottom+8;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-8);tipEl.style.top=y+'px';tipFor=el;tipHov=!!hov;el.classList.add('on');if(!hov)tipT=setTimeout(hideTip,9000)}
document.addEventListener('click',e=>{const i=e.target.closest('.hi');if(i){e.preventDefault();e.stopPropagation();if(tipFor===i&&!tipHov)hideTip();else showTip(i,false);return}if(tipFor)hideTip()},true);
