<script>
const DB={ch:["Symptoms & investigations","Abdominal examination","Esophagus, stomach & duodenum","Diarrhea, malabsorption & constipation","IBD & GI neoplasms","Liver investigations & jaundice","Hepatic failure & cirrhosis","Ascites, HRS & portal hypertension","Viral & autoimmune hepatitis","Metabolic, vascular liver disease & tumors","Gall bladder & pancreas"],q:[
{id:"q1",ch:"Abdominal examination",n:1,q:"This physical sign is due to:",o:[["A","Ascites"],["B","Obesity"],["C","Cachexia"],["D","Full bladder"]],a:"A",e:["The abdomen is uniformly distended with bulging flanks and an everted umbilicus - the classic picture of ascites. Obesity gives a centrally sunken umbilicus, and cachexia gives a scaphoid abdomen.","Everted umbilicus + full flanks = free fluid."],f:["Image-based in the original file"]},
{id:"q2",ch:"Diarrhea, malabsorption & constipation",n:2,q:"Which of the following is a true definition of diarrhea?",o:[["A","Acute diarrhea: < 2 weeks"],["B","Persistent diarrhea: 2-4 weeks"],["C","Chronic diarrhea: > 4 weeks"],["D","All of the above"],["E","None of the above"]],a:"D",e:["All three statements are correct: acute diarrhea lasts less than 2 weeks, persistent diarrhea 2-4 weeks, and chronic diarrhea more than 4 weeks.","2-4-4: under 2 weeks acute, 2-4 persistent, over 4 chronic."]},
{id:"q3",ch:"Abdominal examination",n:3,q:"This physical finding is:",o:[["A","Apparent veins"],["B","Deep vein thrombosis"],["C","Dilated abdominal wall veins"],["D","Striae rubrae"]],a:"C",e:["The arrow points to tortuous, prominent veins running over the abdominal wall - dilated collateral veins, not merely veins seen through thin skin.","Abdominal collaterals = portal hypertension until proven otherwise."],f:["Image-based in the original file"]},
{id:"q4",ch:"Diarrhea, malabsorption & constipation",n:4,q:"Physical findings you should look for in the evaluation of a patient with chronic diarrhea:",o:[["A","Edema, ascites / protein-losing enteropathy"],["B","Signs of fat-soluble vitamin (A, D, E, K) deficiency / steatorrhea"],["C","Signs of hypovolemia and dehydration"],["D","All of the above"],["E","None of the above"]],a:"D",e:["Chronic diarrhea causes protein loss (edema, ascites), fat malabsorption with fat-soluble vitamin deficiency, and fluid loss with dehydration - so all must be looked for.","Chronic diarrhea: look at the proteins, the vitamins and the volume."]},
{id:"q5",ch:"Abdominal examination",n:5,q:"Causes of tender hepatomegaly include all of the following except:",o:[["A","Congested liver"],["B","Acute hepatitis"],["C","Liver abscess"],["D","All of the above"],["E","None of the above"]],a:"E",e:["Congestion, acute hepatitis and abscess all stretch the liver capsule and cause tenderness, so every listed cause is genuine and 'None of the above' is the answer.","Tender liver: congestion, acute hepatitis, abscess, cholangitis."]},
{id:"q6",ch:"Abdominal examination",n:6,q:"Causes of this finding are all of the following except:",o:[["A","Repeated pregnancy"],["B","Ascites"],["C","Organomegaly"],["D","Acute viral hepatitis"]],a:"D",e:["Striae result from stretching of the abdominal wall - repeated pregnancy, ascites and organomegaly all stretch it; acute viral hepatitis does not.","Striae mean stretch, not infection."],f:["Image-based in the original file"]},
{id:"q7",ch:"Liver investigations & jaundice",n:7,q:"The investigation to start with to reach the diagnosis is:",o:[["A","CT abdomen"],["B","Liver biopsy"],["C","Abdominal ultrasound"],["D","Tumour markers"]],a:"C",e:["Abdominal ultrasound is the first-line imaging in jaundice: it is cheap, safe and separates biliary obstruction (dilated ducts) from hepatocellular causes.","Jaundice work-up starts with an ultrasound."],f:["Image-based in the original file"]},
{id:"q8",ch:"Abdominal examination",n:8,q:"Physical findings (as shown) occur in all of the following except:",o:[["A","Liver cell failure"],["B","Early HCV infection"],["C","Thyrotoxicosis"],["D","Pregnancy"]],a:"B",e:["Palmar erythema accompanies chronic liver disease with liver cell failure, thyrotoxicosis and pregnancy; it is not a feature of early/acute HCV infection.","Palmar erythema = chronic liver disease, thyroid, pregnancy."],f:["Image-based in the original file"]},
{id:"q9",ch:"Abdominal examination",n:9,q:"This finding occurs in all of the following except:",o:[["A","Nephrotic syndrome"],["B","Right-sided heart failure"],["C","Anemia"],["D","Liver cirrhosis"]],a:"C",e:["Bilateral pitting edema comes from low oncotic pressure (nephrotic syndrome, cirrhosis) or high hydrostatic pressure (right heart failure); anemia alone does not cause edema.","Anemia pales you, it does not swell you."],f:["Image-based in the original file"]},
{id:"q10",ch:"Ascites, HRS & portal hypertension",n:10,q:"Causes of ascites include all of the following except:",o:[["A","Nephrotic syndrome"],["B","Right-sided heart failure"],["C","Anemia"],["D","Liver cirrhosis"]],a:"C",e:["Ascites arises from portal hypertension, hypoalbuminemia or peritoneal disease; anemia lowers oxygen delivery but never raises the serum-ascites gradient.","No albumin loss, no fluid - anemia is not on the list."]},
{id:"q11",ch:"Ascites, HRS & portal hypertension",n:11,q:"The most common cause of ascites is:",o:[["A","Nephrotic syndrome"],["B","Right-sided heart failure"],["C","Anemia"],["D","Liver cirrhosis"]],a:"D",e:["Cirrhosis with portal hypertension accounts for roughly 80% of ascites, far ahead of malignancy, heart failure and nephrotic syndrome.","Ascites in 8 out of 10 = cirrhosis."]},
{id:"q12",ch:"Abdominal examination",n:12,q:"Cause for this finding:",o:[["A","Liver cell failure"],["B","Trauma"],["C","Viral infection"],["D","Bacterial infection"]],a:"A",e:["The lesion is a spider naevus - a central arteriole with radiating vessels - which reflects liver cell failure and the resulting hyperestrogenism.","Spider naevus = failing liver, high estrogen."],f:["Image-based in the original file"]},
{id:"q13",ch:"Abdominal examination",n:13,q:"Causes for this finding in hepatic patients:",o:[["A","Hematemesis"],["B","Renal failure"],["C","Ascites"],["D","Anorexia"]],a:"A",e:["Palmar pallor in a hepatic patient means anemia, and the commonest cause is blood loss from the gut - hematemesis, melena or chronic oozing from varices and gastropathy.","Pale palms in cirrhosis = think bleeding."],f:["Image-based in the original file"]},
{id:"q14",ch:"Ascites, HRS & portal hypertension",n:14,q:"Upper endoscopy in a patient presenting with hematemesis showed dilated tortuous veins with cherry-red spots. The cause of this finding is:",o:[["A","Cancer of the esophagus"],["B","Liver cirrhosis"],["C","Gastritis"],["D","Peptic ulcer"]],a:"B",e:["Dilated tortuous veins with cherry-red spots are esophageal varices with red wale marks - a sign of recent or imminent bleeding, and cirrhosis with portal hypertension is the usual cause.","Cherry-red spots on varices = high risk of rupture."],f:["Image-based in the original file"]},
{id:"q15",ch:"IBD & GI neoplasms",n:15,q:"Colonoscopy shows diffuse ulceration involving the rectum and extending to the sigmoid colon. The probable cause of this endoscopic finding is:",o:[["A","Ulcerative colitis"],["B","Cancer of the rectum"],["C","Familial polyposis"],["D","Coeliac disease"]],a:"A",e:["Continuous, diffuse, circumferential ulceration beginning in the rectum and extending proximally without skip areas is the endoscopic signature of ulcerative colitis.","Starts in the rectum, never skips = UC."],f:["Image-based in the original file"]},
{id:"q16",ch:"IBD & GI neoplasms",n:16,q:"Colonoscopy shows diffuse ulceration involving the rectum and extending to the sigmoid colon. The next investigation is:",o:[["A","CT"],["B","Biopsy"],["C","CBC"],["D","Stool analysis"]],a:"B",e:["Histology is what separates ulcerative colitis from Crohn's disease and from infective or malignant mimics, so a biopsy of the affected mucosa is the next step.","Colitis without histology is only a guess."],f:["Image-based in the original file"]},
{id:"q17",ch:"Ascites, HRS & portal hypertension",n:17,q:"A 50-year-old male patient presenting with hematemesis; upper endoscopy showed these lesions (bluish cords protruding into the lumen of the esophagus). Which laboratory investigation would you recommend as the initial investigation to assess the patient?",o:[["A","Complete blood picture"],["B","Serum gastrin"],["C","H. pylori serology"],["D","Arterial blood gases"]],a:"A",e:["The immediate question after a variceal bleed is how much blood was lost and whether transfusion is needed, so a complete blood picture is the first laboratory test.","Bleeding varices: count the hemoglobin before anything else."],f:["Image-based in the original file"]},
{id:"q18",ch:"IBD & GI neoplasms",n:18,q:"Colonoscopy shows deep colonic ulcers with inflamed surrounding mucosa. These lesions can present by:",o:[["A","Bleeding per rectum"],["B","Diarrhea"],["C","Abdominal pain"],["D","All of the above"]],a:"D",e:["Deep colonic ulceration bleeds, secretes and inflames, so rectal bleeding, diarrhea and abdominal pain all occur together.","Ulcerated colon presents with all three."],f:["Image-based in the original file"]},
{id:"q19",ch:"Abdominal examination",n:19,q:"This physical sign is due to:",o:[["A","Ascites"],["B","Hepatomegaly"],["C","Obesity"],["D","Splenomegaly"],["E","All of the above"]],a:"A",e:["The abdomen is symmetrically distended with bulging flanks and an everted umbilicus, the pattern produced by free intraperitoneal fluid.","Symmetrical distension with full flanks = ascites."],f:["Image-based in the original file"]},
{id:"q20",ch:"Metabolic, vascular liver disease & tumors",n:20,q:"This is a focal hepatic lesion (arrow) on top of a cirrhotic liver. What is the best non-invasive method for diagnosing this focal lesion?",o:[["A","Biopsy"],["B","AFP"],["C","Triphasic CT"],["D","None of the above"]],a:"C",e:["Triphasic CT shows the arterial enhancement with portal venous washout that diagnoses hepatocellular carcinoma non-invasively in a cirrhotic liver, without needing a needle.","Arterial blush + washout = HCC on CT."],f:["Image-based in the original file"]},
{id:"q21",ch:"Abdominal examination",n:21,q:"This physical finding is:",o:[["A","Apparent veins"],["B","Dilated abdominal wall veins"],["C","Ascites"],["D","Striae rubrae"]],a:"B",e:["The arrow indicates enlarged tortuous collateral veins coursing over the distended abdominal wall, not simply veins visible through thin skin.","Dilated collaterals = portal hypertension."],f:["Image-based in the original file"]},
{id:"q22",ch:"Hepatic failure & cirrhosis",n:22,q:"A 45-year-old male with chronic hepatitis C presents with abdominal distension and leg swelling. Which of the following findings indicates decompensated liver disease?",o:[["A","Hepatomegaly"],["B","Thrombocytosis"],["C","Ascites"],["D","Elevated ALT"]],a:"C",e:["Ascites is one of the defining features of decompensation, along with jaundice, encephalopathy, variceal bleeding and hepatorenal syndrome; hepatomegaly and raised ALT occur in compensated disease.","Ascites = the liver has given up compensating."]},
{id:"q23",ch:"Viral & autoimmune hepatitis",n:23,q:"Which statement is false regarding acute hepatitis A?",o:[["A","Usually mild to moderate in severity and worse in adults than in children"],["B","Chronic hepatitis always occurs"],["C","Spreads by the feco-oral route"],["D","High mortality in pregnant women"]],a:"B",e:["Hepatitis A never causes chronic hepatitis - it is self-limiting, although it can be severe or fulminant, especially in adults and pregnant women.","HAV: feco-oral, self-limiting, no chronicity."]},
{id:"q24",ch:"Abdominal examination",n:24,q:"A common cause of hepatosplenomegaly in adults is:",o:[["A","Hemolytic anemia"],["B","Chronic hepatitis C"],["C","Malaria"],["D","All of the above"]],a:"D",e:["Hemolytic anemia causes splenic overactivity, chronic hepatitis C causes hepatic enlargement with portal hypertension, and malaria causes both - all three are genuine causes.","Hepatosplenomegaly has a long differential, and all three qualify."]},
{id:"q25",ch:"Abdominal examination",n:25,q:"Causes of this finding:",o:[["A","Repeated pregnancy"],["B","Ascites"],["C","Organomegaly"],["D","All of the above"],["E","None of the above"]],a:"D",e:["This is divarication of the recti - separation of the rectus muscles from a stretched abdominal wall - caused by repeated pregnancy, ascites or organomegaly.","Anything that stretches the wall splits the recti."],f:["Image-based in the original file"]},
{id:"q26",ch:"Liver investigations & jaundice",n:26,q:"The cause of this physical finding is all of the following except:",o:[["A","Hepatocellular failure"],["B","Anemia"],["C","Hemolysis"],["D","Familial"]],a:"B",e:["The finding is scleral icterus. Jaundice comes from hepatocellular failure, hemolysis and familial (Gilbert-type) hyperbilirubinemia; anemia itself does not yellow the sclera.","Pale is not yellow."],f:["Image-based in the original file"]},
{id:"q27",ch:"Abdominal examination",n:27,q:"This finding occurs in:",o:[["A","Nephrotic syndrome"],["B","Right-sided heart failure"],["C","Liver cirrhosis"],["D","All of the above"]],a:"D",e:["Bilateral pitting pedal edema occurs in nephrotic syndrome (low oncotic pressure), right heart failure (high hydrostatic pressure) and cirrhosis (low albumin with salt and water retention).","Three mechanisms, one swollen ankle."],f:["Image-based in the original file"]},
{id:"q28",ch:"Viral & autoimmune hepatitis",n:28,q:"Which of the following is not a cause of acute hepatitis?",o:[["A","Autoimmune hepatitis"],["B","Cytomegalovirus"],["C","Mushroom poisoning"],["D","Bilharziasis"]],a:"D",e:["Schistosomiasis produces periportal fibrosis and portal hypertension, not acute hepatocyte inflammation; autoimmune hepatitis, CMV and amanita poisoning all do cause acute hepatitis.","Bilharziasis fibroses the liver, it does not inflame it acutely."]},
{id:"q29",ch:"Ascites, HRS & portal hypertension",n:29,q:"Which statement regarding spontaneous bacterial peritonitis (SBP) is incorrect?",o:[["A","Diagnosis is confirmed by paracentesis with WBCs >= 250 cells/mm3, mainly polymorphonuclear leucocytes"],["B","Bacterial culture is rarely positive"],["C","The most common bacteria are Gram positive"],["D","Antibiotic choice includes cefotaxime"]],a:"C",e:["The organisms are predominantly Gram negative - E. coli and Klebsiella - not Gram positive, which is why third-generation cephalosporins such as cefotaxime are used.","SBP: Gram negatives, culture often negative, PMN 250 or more."]},
{id:"q30",ch:"Abdominal examination",n:30,q:"The cause of this finding is:",o:[["A","Liver cell failure"],["B","Insect bite"],["C","Viral infection"],["D","Venous star"]],a:"A",e:["The lesion is a spider naevus with a central arteriole and radiating branches, produced by liver cell failure and impaired estrogen metabolism.","Spider naevus = failing liver."],f:["Image-based in the original file"]},
{id:"q31",ch:"Abdominal examination",n:31,q:"Investigation for this finding (sign) is:",o:[["A","CBC"],["B","Liver function tests"],["C","Serum albumin"],["D","All of the above"]],a:"D",e:["Palmar pallor can reflect anemia, chronic liver disease or hypoalbuminemia, so a complete blood count, liver function tests and serum albumin are all appropriate.","Pale palm: check the blood, the liver and the albumin."],f:["Image-based in the original file"]},
{id:"q32",ch:"Abdominal examination",n:32,q:"Physical signs seen include:",o:[["A","Umbilical nodules"],["B","Dilated abdominal wall veins"],["C","Hyperpigmentation of the umbilicus"],["D","Umbilicus shifted downwards"]],a:"D",e:["In marked ascites the fluid pressure pushes the umbilicus downwards and everts it; the other listed signs belong to different conditions.","Ascites pushes the umbilicus down, not sideways."],f:["Image-based in the original file"]},
{id:"q33",ch:"Diarrhea, malabsorption & constipation",n:33,q:"Definition of acute diarrhea which is true:",o:[["A","Duration < 2 weeks"],["B","Duration 2-4 weeks"],["C","Duration > 4 weeks"],["D","Duration > 6 weeks"]],a:"A",e:["Acute diarrhea is defined as lasting less than 2 weeks; 2-4 weeks is persistent and more than 4 weeks is chronic.","Under 2 weeks = acute."]},
{id:"q34",ch:"Abdominal examination",n:34,q:"This physical finding is due to:",o:[["A","Pregnancy"],["B","Vein thrombosis"],["C","Obesity"],["D","Viral hepatitis"]],a:"B",e:["The keyed answer is venous thrombosis: obstruction of a draining vein forces blood through abdominal wall collaterals. Pregnancy, obesity and viral hepatitis do not distend abdominal veins on their own.","Dilated wall veins mean an obstructed vein."],f:["Image-based in the original file","Answer keyed as B - verify against the original"]},
{id:"q35",ch:"Diarrhea, malabsorption & constipation",n:35,q:"Physical findings you should look for in the evaluation of a patient with chronic diarrhea:",o:[["A","Edema, ascites / protein-losing enteropathy"],["B","Weight gain"],["C","Signs of hypertension and dehydration"],["D","Jaundice"]],a:"A",e:["Chronic diarrhea loses protein across the gut, so edema and ascites from protein-losing enteropathy are the findings to seek; patients lose weight, not gain it.","Chronic diarrhea: look for protein loss."]},
{id:"q36",ch:"Abdominal examination",n:36,q:"Causes of tender hepatomegaly include:",o:[["A","Congested liver"],["B","Liver cirrhosis"],["C","NASH"],["D","Systemic hypertension"]],a:"A",e:["Acute congestion stretches the capsule and is tender; cirrhosis and fatty liver are typically painless, and systemic hypertension does not enlarge the liver.","Congestion hurts, cirrhosis does not."]},
{id:"q37",ch:"Abdominal examination",n:37,q:"Causes of this finding are all of the following except:",o:[["A","Repeated pregnancy"],["B","Obesity"],["C","Organomegaly"],["D","Acute diarrhea"]],a:"D",e:["These are striae from stretching of the abdominal wall by pregnancy, fat or an enlarged organ; acute diarrhea does not stretch the wall.","No stretch, no striae."],f:["Image-based in the original file"]},
{id:"q38",ch:"Liver investigations & jaundice",n:38,q:"The investigation to start with to reach the diagnosis is:",o:[["A","MRI abdomen"],["B","Liver biopsy"],["C","Abdominal ultrasound"],["D","Transaminases"]],a:"C",e:["In a jaundiced patient, abdominal ultrasound is the first-line test because it detects dilated bile ducts and obstruction before any invasive study.","Jaundice: ultrasound first, then decide."],f:["Image-based in the original file"]},
{id:"q39",ch:"Abdominal examination",n:39,q:"Physical findings occur in:",o:[["A","Anemia"],["B","Early HBV infection"],["C","Liver cell failure"],["D","Diarrhea"]],a:"C",e:["This is palmar erythema, a peripheral vasodilatation of chronic liver disease with liver cell failure, driven by raised estrogen and altered vascular mediators.","Palmar erythema belongs to the failing liver."],f:["Image-based in the original file"]},
{id:"q40",ch:"Abdominal examination",n:40,q:"Causes of this finding are all of the following except:",o:[["A","Lymphedema"],["B","Right-sided heart failure"],["C","Nephrotic syndrome"],["D","Liver cirrhosis"]],a:"A",e:["The image shows soft pitting edema. Lymphedema is non-pitting and firm with skin thickening, unlike the pitting edema of heart failure, nephrotic syndrome and cirrhosis.","Pitting means fluid; lymphedema does not pit."],f:["Image-based in the original file"]},
{id:"q41",ch:"Ascites, HRS & portal hypertension",n:41,q:"Causes of ascites include all of the following except:",o:[["A","Nephrotic syndrome"],["B","Right-sided heart failure"],["C","Malignancy"],["D","Acute diarrhea"]],a:"D",e:["Ascites results from portal hypertension, hypoalbuminemia or peritoneal malignancy; acute diarrhea causes volume depletion, not peritoneal fluid.","Diarrhea dehydrates, it does not fill the abdomen."]},
{id:"q42",ch:"Ascites, HRS & portal hypertension",n:42,q:"The most common cause of ascites is:",o:[["A","Nephrotic syndrome"],["B","Meigs' syndrome"],["C","Cancer of the ovary"],["D","Liver cirrhosis"]],a:"D",e:["Cirrhosis with portal hypertension is by far the commonest cause of ascites; Meigs syndrome and ovarian cancer are rare causes.","Commonest ascites = cirrhosis."]},
{id:"q43",ch:"Abdominal examination",n:43,q:"Cause for this finding:",o:[["A","Liver cell failure"],["B","Insect bite"],["C","Viral infection"],["D","Bacterial infection"]],a:"A",e:["A spider naevus with its central arteriole and radiating capillaries indicates liver cell failure and hyperestrogenism.","Spider naevus = liver cell failure."],f:["Image-based in the original file"]},
{id:"q44",ch:"Abdominal examination",n:44,q:"Causes for this finding in hepatic patients are all of the following except:",o:[["A","Hematemesis"],["B","GAVE"],["C","Ascites"],["D","Anorexia"]],a:"C",e:["Pallor of the palms in a hepatic patient reflects anemia from blood loss - hematemesis or gastric antral vascular ectasia - or from poor intake; ascites does not cause pallor.","Ascites swells, it does not pale."],f:["Image-based in the original file"]},
{id:"q45",ch:"Ascites, HRS & portal hypertension",n:45,q:"Upper endoscopy in a patient known to have liver cirrhosis, presenting with hematemesis, described dilated tortuous veins with cherry-red spots. The cause of this finding is:",o:[["A","Oesophagitis"],["B","Portal vein thrombosis"],["C","Gastritis"],["D","Peptic ulcer"]],a:"B",e:["Varices with red wale marks are portal collaterals; among the options, portal vein thrombosis is the cause of portal hypertension that produces them, and it is a recognised complication of cirrhosis.","Varices are a pressure problem - find the block."],f:["Image-based in the original file"]},
{id:"q46",ch:"IBD & GI neoplasms",n:46,q:"Colonoscopy shows diffuse ulceration involving the rectum and extending to the sigmoid colon. The probable cause of this endoscopic finding is:",o:[["A","Ulcerative colitis"],["B","Cancer of the colon"],["C","Familial polyposis"],["D","Coeliac disease"]],a:"A",e:["Continuous diffuse ulceration starting in the rectum and spreading proximally is typical of ulcerative colitis.","Rectum first, no skips = UC."],f:["Image-based in the original file"]},
{id:"q47",ch:"IBD & GI neoplasms",n:47,q:"Colonoscopy shows diffuse ulceration involving the rectum and extending to the sigmoid colon with skip areas and cobblestone appearance. The next investigation is:",o:[["A","Tumour marker"],["B","Biopsy"],["C","CBC"],["D","Stool analysis"]],a:"B",e:["Skip lesions with cobblestoning suggest Crohn's disease, and biopsy showing transmural granulomatous inflammation is what confirms it.","Skip lesions + cobblestone: biopsy to prove Crohn's."],f:["Image-based in the original file"]},
{id:"q48",ch:"Liver investigations & jaundice",n:48,q:"A predominantly direct (conjugated) hyperbilirubinemia is present in all of the following causes of jaundice, except:",o:[["A","Hemolysis"],["B","Bile duct obstruction"],["C","Drug-induced liver injury"],["D","Primary biliary cirrhosis"]],a:"A",e:["Hemolysis raises unconjugated bilirubin because the liver conjugates it faster than it can be excreted; obstruction, drug injury and primary biliary cirrhosis all produce conjugated hyperbilirubinemia.","Conjugated = liver or ducts; unconjugated = hemolysis."]},
{id:"q49",ch:"Symptoms & investigations",n:49,q:"The first step in the management of a patient presenting with hematemesis is:",o:[["A","Gastric wash"],["B","Upper endoscopy"],["C","Resuscitation"],["D","Anti-coma measures"]],a:"C",e:["Airway, breathing and circulation come before any diagnostic procedure - resuscitate with IV access, fluids and blood, then endoscope once the patient is stable.","ABC before endoscopy."]},
{id:"q50",ch:"Hepatic failure & cirrhosis",n:50,q:"Which of the following is NOT a complication of hepatic cirrhosis?",o:[["A","Spontaneous bacterial peritonitis"],["B","Hepatocellular carcinoma"],["C","Thrombocytosis"]],a:"C",e:["Cirrhosis causes thrombocytopenia through hypersplenism and reduced thrombopoietin, so thrombocytosis is not a complication - it points elsewhere.","Cirrhosis lowers platelets, never raises them."]},
{id:"q51",ch:"Ascites, HRS & portal hypertension",n:51,q:"Upper endoscopy showing bluish cords protruding into the lumen of the esophagus. The diagnosis of these lesions can be:",o:[["A","Esophageal varices"],["B","Mallory-Weiss tear"],["C","Esophageal stricture"],["D","Gastroesophageal reflux disease"]],a:"A",e:["Bluish, tortuous cords protruding into the esophageal lumen are dilated submucosal collateral veins - esophageal varices.","Bluish cords in the esophagus = varices."],f:["Image-based in the original file"]},
{id:"q52",ch:"Symptoms & investigations",n:52,q:"A 60-year-old male patient, known HCV liver cirrhosis, presents with hematemesis and melena. BP = 90/60, pulse = 110/min, Hb = 6.5 g/dL. Management includes:",o:[["A","Resuscitation"],["B","Blood transfusion"],["C","Upper endoscopy"],["D","All of the above"],["E","None of the above"]],a:"D",e:["He is shocked and profoundly anemic: resuscitate, transfuse, then endoscope and treat the varices - all three steps belong in management, in that order.","Resuscitate, transfuse, then scope."]},
{id:"q53",ch:"Gall bladder & pancreas",n:53,q:"A patient presented with right hypochondrial pain referred to the right shoulder and dyspepsia to fatty meals. What could be the lesion seen in the abdominal ultrasound (echogenic focus in the gall bladder with back shadow)?",o:[["A","Gallbladder stone"],["B","Gallbladder polyp"],["C","Gallbladder mud"],["D","None of the above"]],a:"A",e:["A mobile echogenic focus that casts a posterior acoustic shadow is the ultrasound signature of a gallstone; polyps do not shadow and sludge is not a discrete focus.","Shadowing = stone."],f:["Image-based in the original file"]},
{id:"q54",ch:"Liver investigations & jaundice",n:54,q:"Which of the following is a marker of the excretory function of the liver?",o:[["A","Serum conjugated bilirubin"],["B","Serum albumin"],["C","Serum alkaline phosphatase"],["D","Serum total proteins"]],a:"A",e:["Conjugated bilirubin is bilirubin the hepatocyte has already processed and must excrete, so it rises when excretion fails; albumin and total protein measure synthetic function.","Conjugated bilirubin = excretion; albumin = synthesis."]},
{id:"q55",ch:"Abdominal examination",n:55,q:"Physical signs seen include:",o:[["A","Localised abdominal distension"],["B","Cullen's sign"],["C","Dilated abdominal wall veins"],["D","Umbilicus shifted downwards"]],a:"D",e:["In gross ascites the umbilicus is pushed downwards and everted by the fluid; Cullen's sign is periumbilical bruising of pancreatitis.","Ascites pushes the umbilicus down."],f:["Image-based in the original file"]},
{id:"q56",ch:"Abdominal examination",n:56,q:"Which of the following laboratory tests can help diagnose the cause of hepatosplenomegaly?",o:[["A","Complete blood count"],["B","Liver function tests"],["C","Serological tests for viral hepatitis"],["D","All of the above"]],a:"D",e:["CBC screens for hemolysis and leukemia, liver function tests assess hepatocellular damage, and viral serology identifies hepatitis - all three are part of the work-up.","Hepatosplenomegaly: blood, liver, serology."]},
{id:"q57",ch:"Abdominal examination",n:57,q:"This physical finding is due to:",o:[["A","Ascites"],["B","Budd-Chiari syndrome"],["C","Liver cirrhosis"],["D","Chronic hepatitis"]],a:"B",e:["Budd-Chiari obstructs hepatic venous outflow, driving blood through portosystemic collaterals and producing prominent dilated abdominal wall veins with tender hepatomegaly and ascites.","Hepatic vein block = caput medusae plus tender liver."],f:["Image-based in the original file"]},
{id:"q58",ch:"Diarrhea, malabsorption & constipation",n:58,q:"Physical findings you should look for in the evaluation of a patient with chronic diarrhea:",o:[["A","Edema, ascites / protein-losing enteropathy"],["B","Weight loss"],["C","Signs of dehydration"],["D","All of the above"]],a:"D",e:["Chronic diarrhea causes protein loss, weight loss and dehydration, so all three must be looked for at the bedside.","Chronic diarrhea loses protein, weight and water."]},
{id:"q59",ch:"Abdominal examination",n:59,q:"Causes of tender hepatomegaly include all of the following except:",o:[["A","Right-sided heart failure"],["B","Advanced liver cirrhosis"],["C","Acute hepatitis"],["D","Liver abscess"]],a:"B",e:["Advanced cirrhosis produces a shrunken, firm, non-tender liver; congestion, acute hepatitis and abscess all stretch the capsule and hurt.","The cirrhotic liver is small and painless."]},
{id:"q60",ch:"Abdominal examination",n:60,q:"All of the following are causes of this finding except:",o:[["A","Repeated pregnancy"],["B","Ascites"],["C","Huge splenomegaly"],["D","Chronic constipation"]],a:"D",e:["Striae come from stretching of the abdominal wall by pregnancy, fluid or an enlarged organ; chronic constipation distends the bowel but does not stretch the skin.","No wall stretch, no striae."],f:["Image-based in the original file"]},
{id:"q61",ch:"Liver investigations & jaundice",n:61,q:"The investigation to start with to reach the diagnosis is:",o:[["A","MRI abdomen"],["B","Liver biopsy"],["C","Abdominal ultrasound"],["D","ERCP"]],a:"C",e:["Abdominal ultrasound is the first-line investigation in jaundice because it identifies dilated bile ducts, gallstones and liver texture without radiation.","Jaundice: ultrasound first."],f:["Image-based in the original file"]},
{id:"q62",ch:"Abdominal examination",n:62,q:"Hepatosplenomegaly is defined as:",o:[["A","Enlargement of the liver and spleen"],["B","Inflammation of the liver and spleen"],["C","Cancer of the liver and spleen"],["D","Infection of the liver and spleen"]],a:"A",e:["Hepatosplenomegaly is purely a descriptive term for enlargement of both organs, whatever the underlying cause.","It means big, not inflamed."]},
{id:"q63",ch:"Abdominal examination",n:63,q:"Unilateral cause of this finding:",o:[["A","Meigs' syndrome"],["B","Right-sided heart failure"],["C","DVT"],["D","Liver metastasis"]],a:"C",e:["Deep vein thrombosis obstructs one side's venous drainage and causes unilateral edema; heart failure, cirrhosis and nephrotic syndrome all give bilateral edema.","One swollen leg = think DVT."],f:["Image-based in the original file"]},
{id:"q64",ch:"Ascites, HRS & portal hypertension",n:64,q:"Causes of ascites include all of the following except:",o:[["A","Nephrotic syndrome"],["B","HIV"],["C","Portal hypertension"],["D","Tuberculosis"]],a:"B",e:["HIV infection alone does not cause ascites; nephrotic syndrome, portal hypertension and tuberculous peritonitis all do.","HIV is not an ascites cause."]},
{id:"q65",ch:"Ascites, HRS & portal hypertension",n:65,q:"A 50-year-old patient presents with vomiting of bright red blood. He has no prior medical history and is not on anticoagulants. Upper endoscopy shows bluish cords protruding into the lumen of the esophagus. The most likely diagnosis is:",o:[["A","Bleeding from a gastric ulcer"],["B","Esophageal variceal bleeding"],["C","Mallory-Weiss tear"],["D","Gastritis"],["E","Gastric carcinoma"]],a:"B",e:["Bluish cords are varices, and their rupture is the cause of the hematemesis - so this is esophageal variceal bleeding.","Bluish cords + hematemesis = variceal bleed."],f:["Image-based in the original file"]},
{id:"q66",ch:"IBD & GI neoplasms",n:66,q:"A 25-year-old woman presents with a 3-month history of abdominal pain, diarrhea (sometimes bloody), weight loss and fatigue. Examination reveals mild tenderness in the right lower quadrant. Laboratory tests show anemia and elevated inflammatory markers. Colonoscopy shows colonic and terminal ileum longitudinal ulcers with cobblestone appearance. Biopsies show transmural inflammation. Which is the most likely diagnosis?",o:[["A","Ulcerative colitis"],["B","Crohn's disease"],["C","Infectious colitis"],["D","Ischemic colitis"]],a:"B",e:["Longitudinal ulcers with cobblestoning involving both colon and terminal ileum, plus transmural inflammation on biopsy, is Crohn's disease.","Cobblestone + terminal ileum + transmural = Crohn's."],f:["Image-based in the original file"]},
{id:"q67",ch:"Ascites, HRS & portal hypertension",n:67,q:"A 45-year-old man presents with progressive abdominal distension over the past two months. He reports early satiety, occasional nausea and fullness. On examination his abdomen is as shown. Which is the most likely cause of his abdominal distension?",o:[["A","Obstructive bowel tumor"],["B","Ascites due to liver cirrhosis"],["C","Gastrointestinal obstruction"],["D","Large intra-abdominal mass"],["E","Intestinal parasitic infection"]],a:"B",e:["Symmetrical distension with bulging flanks, shifting dullness and a fluid wave is ascites, and cirrhosis is its commonest cause.","Fluid wave = ascites."],f:["Image-based in the original file"]},
{id:"q68",ch:"Metabolic, vascular liver disease & tumors",n:68,q:"A patient presented with jaundice. Abdominal ultrasound shows a heterogeneous mass in the left lobe. What is the next step?",o:[["A","Triphasic CT"],["B","Colonoscopy"],["C","MRI"],["D","None of the above"]],a:"A",e:["A focal liver mass on ultrasound needs triphasic (contrast-enhanced) CT to characterize its arterial and venous enhancement pattern and distinguish HCC from other lesions.","Mass on US: characterize with triphasic CT."],f:["Image-based in the original file"]},
{id:"q69",ch:"Metabolic, vascular liver disease & tumors",n:69,q:"A 60-year-old man with chronic hepatitis B presents with right upper quadrant pain and unintentional weight loss. Examination reveals a firm, irregular mass in the right liver lobe. AFP is elevated, and ultrasound reveals a hypervascular liver mass. Which is the most likely diagnosis?",o:[["A","Hepatocellular carcinoma"],["B","Liver metastasis from colon cancer"],["C","Hemangioma of the liver"],["D","Focal nodular hyperplasia"],["E","Hepatic abscess"]],a:"A",e:["Chronic HBV plus a firm irregular hypervascular mass with raised AFP is hepatocellular carcinoma until proven otherwise.","Hep B + high AFP + hypervascular mass = HCC."]},
{id:"q70",ch:"Metabolic, vascular liver disease & tumors",n:70,q:"A 35-year-old woman presents with sudden severe right upper quadrant pain; inspection shows this finding. She has a history of oral contraceptive use. Doppler ultrasound reveals absence of flow in the hepatic veins. Which is the most likely diagnosis?",o:[["A","Cirrhosis"],["B","Budd-Chiari syndrome"],["C","Hepatic abscess"],["D","Fulminant hepatitis"],["E","Right-sided heart failure"]],a:"B",e:["Absent hepatic vein flow with painful hepatomegaly, ascites and dilated abdominal veins in a woman on oral contraceptives is Budd-Chiari syndrome.","No flow in hepatic veins = Budd-Chiari."],f:["Image-based in the original file"]},
{id:"q71",ch:"Esophagus, stomach & duodenum",n:71,q:"A 50-year-old man presents with epigastric pain and melena. He reports daily intake of diclofenac for knee osteoarthritis. Endoscopy reveals a duodenal ulcer. Which is the most common cause of this condition?",o:[["A","Tuberculosis"],["B","Nonsteroidal anti-inflammatory drugs (NSAIDs)"],["C","Zollinger-Ellison syndrome"],["D","Crohn's disease"],["E","Stress from severe illness"]],a:"B",e:["In this patient the daily diclofenac is the culprit: NSAIDs block prostaglandin-mediated mucosal protection and are, after H. pylori, the leading cause of peptic ulceration.","Diclofenac + ulcer: the drug did it."]},
{id:"q72",ch:"Viral & autoimmune hepatitis",n:72,q:"A 50-year-old man with a history of intravenous drug use presents with fatigue, right upper quadrant discomfort and jaundice. Serology shows positive anti-HCV and detectable HCV RNA. Which is the primary mode of transmission?",o:[["A","Sexual contact"],["B","Vertical transmission from mother to child"],["C","Blood-to-blood contact, such as sharing needles"],["D","Contaminated food and water"],["E","Respiratory droplets"]],a:"C",e:["HCV spreads mainly by parenteral blood-to-blood exposure - shared needles, transfusion and unsafe procedures - which fits his intravenous drug use.","HCV is a blood-borne virus."]},
{id:"q73",ch:"Abdominal examination",n:73,q:"A 28-year-old male presents with a 6-month history of a midline abdominal bulge, particularly when he coughs or performs certain movements. This finding could be due to:",o:[["A","Ascites"],["B","Chronic cough"],["C","Organomegaly"],["D","All of the above"]],a:"D",e:["Anything that raises intra-abdominal pressure or weakens the wall - ascites, chronic cough, organomegaly, obesity - can produce divarication of the recti.","Raised pressure splits the recti."],f:["Image-based in the original file"]},
{id:"q74",ch:"Liver investigations & jaundice",n:74,q:"A 45-year-old man presents with fatigue and this sign. Bilirubin is elevated, predominantly direct, with elevated ALT and AST. Ultrasound shows hepatomegaly without biliary obstruction. Which best describes the pathophysiology of his jaundice?",o:[["A","Obstruction of the common bile duct leading to accumulation of conjugated bilirubin"],["B","Increased production of bilirubin due to hemolysis"],["C","Impaired conjugation and excretion of bilirubin by the hepatocytes"],["D","Infiltration of the liver by metastatic tumor causing ductal compression"]],a:"C",e:["With no duct dilatation, the conjugated hyperbilirubinemia reflects injured hepatocytes that cannot conjugate and excrete bilirubin normally - hepatocellular jaundice.","Conjugated without dilated ducts = sick hepatocytes."],f:["Image-based in the original file"]},
{id:"q75",ch:"Abdominal examination",n:75,q:"Which of the following conditions is most commonly associated with this finding?",o:[["A","Diabetes mellitus"],["B","Chronic liver disease"],["C","Hypertension"],["D","Hyperlipidemia"]],a:"B",e:["Palmar erythema over the thenar and hypothenar eminences is a vasodilatory sign of chronic liver disease, driven by raised estrogen and altered vascular mediators.","Red palms = chronic liver disease."],f:["Image-based in the original file"]},
{id:"q76",ch:"Abdominal examination",n:76,q:"A 60-year-old man presents with this finding. He has a history of HCV without antiviral therapy. The edema is bilateral, pitting and non-tender, with moderate ascites. Which is the most likely cause?",o:[["A","Congestive heart failure"],["B","Deep vein thrombosis"],["C","Lymphatic obstruction"],["D","Liver cirrhosis with hypoalbuminemia"],["E","Nephrotic syndrome"]],a:"D",e:["Bilateral pitting edema with ascites in a patient with untreated HCV points to cirrhosis with hypoalbuminemia; DVT would be unilateral and heart failure would raise the JVP.","Untreated HCV + ascites + edema = cirrhosis."],f:["Image-based in the original file"]},
{id:"q77",ch:"Gall bladder & pancreas",n:77,q:"A patient presented with jaundice. Abdominal ultrasound showed common bile duct stones. What is the next step?",o:[["A","Stool analysis"],["B","Colonoscopy"],["C","ERCP"],["D","None of the above"]],a:"C",e:["ERCP is both diagnostic and therapeutic for choledocholithiasis - it confirms the stone and allows sphincterotomy with extraction.","CBD stone = ERCP."],f:["Image-based in the original file"]},
{id:"q78",ch:"Liver investigations & jaundice",n:78,q:"Which imaging technique is considered the best first-line investigation for evaluating liver pathology?",o:[["A","X-ray of the abdomen"],["B","Ultrasound of the abdomen"],["C","CT scan of the abdomen"],["D","MRI of the abdomen"]],a:"B",e:["Ultrasound is cheap, radiation-free and excellent for liver size, texture, focal lesions and biliary dilatation, so it is the first-line study.","Liver imaging starts with ultrasound."]},
{id:"q79",ch:"Abdominal examination",n:79,q:"Which of the following features best describes this lesion?",o:[["A","Raised red papule with blanching center and non-radiating vessels"],["B","Central arteriole with radiating capillaries that blanch with pressure"],["C","Bluish non-blanching lesion"],["D","Brown macule with irregular borders"]],a:"B",e:["A spider naevus is a central arteriole with radiating capillary branches that blanch on pressure and refill from the center.","Press the center, the legs empty."],f:["Image-based in the original file"]},
{id:"q80",ch:"Abdominal examination",n:80,q:"A patient with liver cirrhosis presents with this finding and CBC pancytopenia. What is the most likely cause?",o:[["A","Hypoxia"],["B","Autoimmune disease"],["C","Hypersplenism due to portal hypertension"],["D","Vitamin B12 deficiency"]],a:"C",e:["Portal hypertension causes splenomegaly, and the enlarged spleen sequesters all three cell lines, producing pancytopenia.","Big spleen, low counts = hypersplenism."],f:["Image-based in the original file"]},
{id:"q81",ch:"Ascites, HRS & portal hypertension",n:81,q:"A 60-year-old man with cirrhosis has screening endoscopy showing bluish cords in the esophagus. He has no history of variceal bleeding and his Child-Pugh score is A. What is the recommended management?",o:[["A","No treatment, just regular surveillance"],["B","Start non-selective beta-blockers (e.g., propranolol) for primary prophylaxis"],["C","Immediate variceal band ligation"],["D","None of the above"]],a:"B",e:["Medium-to-large varices that have never bled need primary prophylaxis, and non-selective beta-blockers reduce portal pressure and the risk of first bleeding.","Never bled? Beta-blocker first."],f:["Image-based in the original file"]},
{id:"q82",ch:"IBD & GI neoplasms",n:82,q:"A 25-year-old woman with 3 months of abdominal pain, diarrhea and weight loss has right lower quadrant tenderness, anemia and raised ESR. Colonoscopy shows longitudinal ulcers with cobblestone appearance in colon and terminal ileum. Which is the most characteristic feature of Crohn's disease?",o:[["A","Continuous inflammation starting from the rectum"],["B","Presence of granulomas on biopsy"],["C","Mucosal ulcerations limited to the colon"],["D","Primarily affects the large intestine with superficial ulceration"],["E","Exclusive involvement of the ileum"]],a:"B",e:["Non-caseating granulomas on biopsy are the histological hallmark of Crohn's disease; continuous rectal-sparing patterns belong to ulcerative colitis.","Granuloma = Crohn's."],f:["Image-based in the original file"]},
{id:"q83",ch:"Ascites, HRS & portal hypertension",n:83,q:"A 43-year-old man presents with a 2-week history of increasing abdominal girth, nausea and early satiety. Palpation reveals a fluid wave and shifting dullness. What is the most likely cause of his abdominal distension?",o:[["A","Ascites secondary to liver cirrhosis"],["B","Massive hepatomegaly"],["C","Large intra-abdominal tumor"],["D","Severe constipation"],["E","Obstructive bowel edema"]],a:"A",e:["Shifting dullness plus a fluid wave means free intraperitoneal fluid, and cirrhosis is the commonest cause of ascites.","Shifting dullness = free fluid."],f:["Image-based in the original file"]},
{id:"q84",ch:"Gall bladder & pancreas",n:84,q:"A 45-year-old woman presents with a 2-day history of jaundice, right upper quadrant pain and dark urine. She has mild right upper abdominal tenderness and scleral icterus. Bilirubin and alkaline phosphatase are elevated. Abdominal ultrasound was performed. What is the most likely diagnosis?",o:[["A","Gallbladder carcinoma"],["B","Common bile duct stone (choledocholithiasis)"],["C","Acute cholecystitis"],["D","Hepatocellular carcinoma"],["E","Pancreatic head tumor"]],a:"B",e:["Painful jaundice with a raised alkaline phosphatase means extrahepatic obstruction, and an echogenic focus in the duct on ultrasound is a common bile duct stone.","Pain + jaundice + high ALP = CBD stone."],f:["Image-based in the original file"]},
{id:"q85",ch:"Abdominal examination",n:85,q:"A 50-year-old man with increasing abdominal distension has this finding. The liver is palpable 3 cm below the right costal margin. The presence of dilated abdominal wall veins most likely indicates:",o:[["A","Portal hypertension due to liver cirrhosis"],["B","Inferior vena cava obstruction"],["C","Superior vena cava syndrome"],["D","Abdominal aortic aneurysm"],["E","Gastrointestinal bleeding"]],a:"A",e:["Portosystemic collaterals open when portal pressure rises, producing dilated anterior abdominal wall veins - the commonest cause being cirrhosis.","Collaterals = portal hypertension."],f:["Image-based in the original file"]},
{id:"q86",ch:"Esophagus, stomach & duodenum",n:86,q:"Which of the following is the most common cause of peptic ulcers?",o:[["A","Excessive alcohol consumption"],["B","Helicobacter pylori infection"],["C","Use of proton pump inhibitors"],["D","Chronic smoking"]],a:"B",e:["H. pylori infects the gastric mucosa, causes chronic inflammation and is the leading cause of peptic ulcer disease worldwide, ahead of NSAIDs.","H. pylori is the number one ulcer cause."]},
{id:"q87",ch:"Abdominal examination",n:87,q:"A 30-year-old man presents with this finding, which becomes more noticeable on coughing or straining. What is the most likely diagnosis?",o:[["A","Umbilical hernia"],["B","Diastasis of the rectus abdominis (divarication of the recti)"],["C","Epigastric hernia"],["D","Ventral incisional hernia"],["E","Diastasis recti with herniation"]],a:"B",e:["A midline ridge that widens with raised intra-abdominal pressure and disappears at rest is divarication of the recti, not a true hernia with a neck.","Bulge that widens on straining = diastasis."],f:["Image-based in the original file"]},
{id:"q88",ch:"Liver investigations & jaundice",n:88,q:"A 55-year-old man presents with this finding, dark urine and occasional nausea. No hepatomegaly or abdominal tenderness is observed. Which is the most likely mechanism?",o:[["A","Increased unconjugated bilirubin due to hemolysis"],["B","Increased conjugated bilirubin due to biliary obstruction"],["C","Decreased bilirubin production from liver failure"],["D","Increased serum bilirubin due to excessive hemolysis and impaired conjugation"],["E","Decreased bilirubin excretion due to renal failure"]],a:"B",e:["Dark urine with jaundice and no tender liver suggests conjugated hyperbilirubinemia from biliary obstruction, where water-soluble bilirubin spills into urine.","Dark urine = conjugated bilirubin = obstruction."],f:["Image-based in the original file"]},
{id:"q89",ch:"Gall bladder & pancreas",n:89,q:"A 60-year-old man presents with painless jaundice and weight loss. Bilirubin and alkaline phosphatase are elevated. Ultrasound shows dilated intrahepatic and extrahepatic ducts with no obvious mass. What is the most appropriate next step?",o:[["A","MRCP"],["B","EUS with FNA"],["C","ERCP with brush cytology and possible stenting"],["D","Laparoscopic liver biopsy"],["E","Open surgical exploration"]],a:"C",e:["ERCP allows direct visualization, brush cytology for tissue and stenting for drainage, so it both diagnoses and manages a suspected malignant stricture.","Dilated ducts, no mass: ERCP does both jobs."]},
{id:"q90",ch:"Metabolic, vascular liver disease & tumors",n:90,q:"What is the preferred imaging technique for the initial diagnosis of hepatocellular carcinoma in patients with cirrhosis?",o:[["A","X-ray"],["B","Ultrasound"],["C","Computed tomography"],["D","Magnetic resonance imaging"]],a:"B",e:["Surveillance and initial detection of HCC in cirrhosis uses ultrasound, often with AFP; CT and MRI characterize a lesion once found.","Screen with ultrasound."]},
{id:"q91",ch:"Abdominal examination",n:91,q:"A 35-year-old woman presents with facial flushing and mild abdominal discomfort. Multiple spider naevi are seen on her face and chest. This is most indicative of which underlying condition?",o:[["A","Liver cirrhosis with portal hypertension"],["B","Hyperthyroidism"],["C","Addison's disease"],["D","Cushing's syndrome"],["E","Diabetes mellitus"]],a:"A",e:["Multiple spider naevi indicate chronic liver disease with portal hypertension and impaired estrogen metabolism.","Multiple spiders = cirrhotic liver."],f:["Image-based in the original file"]},
{id:"q92",ch:"Esophagus, stomach & duodenum",n:92,q:"A 45-year-old man with epigastric pain relieved by eating, nausea, and NSAID use has a single clean-based ulcer on the lesser curvature of the stomach on endoscopy. What is the most likely diagnosis?",o:[["A","Gastric carcinoma"],["B","Duodenal ulcer"],["C","Gastric ulcer"],["D","Erosive gastritis"],["E","Functional dyspepsia"]],a:"C",e:["The lesion is on the lesser curvature of the stomach, so it is a gastric ulcer; a duodenal ulcer would sit in the bulb.","Lesser curvature = gastric ulcer."],f:["Image-based in the original file"]},
{id:"q93",ch:"IBD & GI neoplasms",n:93,q:"A 28-year-old woman presents with intermittent abdominal pain, diarrhea, weight loss, mouth ulcers and knee pain. Colonoscopy shows patchy transmural inflammation with skip lesions and cobblestoning; biopsy confirms granulomatous inflammation. What is the most likely diagnosis?",o:[["A","Ulcerative colitis"],["B","Crohn's disease"],["C","Infectious colitis"],["D","Ischemic colitis"],["E","Diverticulitis"]],a:"B",e:["Skip lesions, transmural inflammation and granulomas are the triad of Crohn's disease, and mouth ulcers with arthritis are recognised extraintestinal features.","Skip lesions + granulomas = Crohn's."],f:["Image-based in the original file"]},
{id:"q94",ch:"Ascites, HRS & portal hypertension",n:94,q:"A man with a 2-week history of increasing abdominal girth, nausea and early satiety has a history of HCV. Palpation reveals a fluid wave and shifting dullness. What is the most likely cause of his distension?",o:[["A","Ascites secondary to liver cirrhosis"],["B","Massive hepatomegaly"],["C","Large intra-abdominal tumor"],["D","Severe constipation"],["E","Obstructive bowel edema"]],a:"A",e:["Fluid wave and shifting dullness confirm ascites, and chronic HCV is a leading cause of cirrhosis with portal hypertension.","HCV + shifting dullness = cirrhotic ascites."],f:["Image-based in the original file"]},
{id:"q95",ch:"Hepatic failure & cirrhosis",n:95,q:"A 52-year-old man with 20 years of alcohol use has jaundice, hepatomegaly, ascites and spider angiomata, with low albumin and prolonged prothrombin time. Ultrasound shows a shrunken nodular liver with splenomegaly and ascites. What is the most likely diagnosis?",o:[["A","Hepatocellular carcinoma"],["B","Liver cirrhosis"],["C","Fatty liver disease"],["D","Acute hepatitis"],["E","Liver abscess"]],a:"B",e:["A shrunken nodular liver with irregular borders, splenomegaly and ascites, together with low albumin and prolonged INR, is cirrhosis.","Small bumpy liver + ascites = cirrhosis."],f:["Image-based in the original file"]},
{id:"q96",ch:"Metabolic, vascular liver disease & tumors",n:96,q:"A 58-year-old man with chronic hepatitis B has weight loss, a firm right upper quadrant mass and elevated AFP. CT shows a solitary lesion with arterial enhancement and portal venous washout. What is the diagnosis and initial management?",o:[["A","Hepatocellular carcinoma; consider surgical resection or locoregional therapy"],["B","Liver metastasis; start systemic chemotherapy"],["C","Liver abscess; initiate antibiotics and drainage"],["D","Focal nodular hyperplasia; no treatment needed"],["E","Cirrhosis; monitor regularly without intervention"]],a:"A",e:["Arterial enhancement with venous washout in a cirrhotic liver is diagnostic of HCC, and a solitary lesion in a fit patient is treated by resection or locoregional ablation.","Blush then washout = HCC; resect or ablate."]},
{id:"q97",ch:"Abdominal examination",n:97,q:"A 45-year-old man has progressive abdominal distension with a network of dilated veins on the anterior wall, plus hepatomegaly, splenomegaly and abnormal liver tests. Ultrasound shows a cirrhotic liver with portal vein thrombosis and collaterals. What is the most likely cause of the dilated veins?",o:[["A","Caput medusae secondary to portal hypertension"],["B","Congestive heart failure causing venous distension"],["C","Superior vena cava syndrome"],["D","Abdominal wall infection causing venous dilation"],["E","Varices due to esophageal varices"]],a:"A",e:["Portal vein thrombosis raises portal pressure further, opening paraumbilical collaterals that radiate from the umbilicus - caput medusae.","Veins radiating from the umbilicus = caput medusae."],f:["Image-based in the original file"]},
{id:"q98",ch:"Viral & autoimmune hepatitis",n:98,q:"A 32-year-old man has fatigue, right upper quadrant discomfort and jaundice, with positive HBsAg, positive HBeAg and high HBV DNA. Biopsy shows chronic hepatitis with mild fibrosis. What is the most appropriate next step?",o:[["A","Initiate antiviral therapy with tenofovir"],["B","Start corticosteroids to reduce inflammation"],["C","No treatment needed; monitor periodically"],["D","Liver transplantation immediately"],["E","Administer hepatitis B vaccine"]],a:"A",e:["HBeAg-positive chronic hepatitis with high HBV DNA and fibrosis warrants antiviral therapy, and tenofovir is a first-line nucleotide analogue.","High DNA + HBeAg positive = treat with tenofovir."]},
{id:"q99",ch:"Viral & autoimmune hepatitis",n:99,q:"A 45-year-old woman with a history of intravenous drug use has elevated ALT/AST, positive anti-HCV and PCR-confirmed active hepatitis C with mild fibrosis on biopsy. What is the most appropriate next step?",o:[["A","Start direct-acting antivirals (DAAs)"],["B","Initiate corticosteroids"],["C","No treatment needed; monitor periodically"],["D","Liver transplant immediately"],["E","Administer hepatitis C vaccine"]],a:"A",e:["Any active HCV replication with fibrosis is an indication for direct-acting antivirals, which now achieve cure rates above 95%.","Active HCV = give DAAs."]},
{id:"q100",ch:"Abdominal examination",n:100,q:"A 30-year-old man presents with this finding, which becomes more noticeable on coughing or straining. What is the most likely diagnosis?",o:[["A","Umbilical hernia"],["B","Diastasis of the rectus abdominis (divarication of the recti)"],["C","Epigastric hernia"],["D","Ventral incisional hernia"],["E","Inguinal hernia"]],a:"B",e:["A midline bulge that widens with raised intra-abdominal pressure, without a true hernia neck, is divarication of the recti.","Widens on straining = diastasis."],f:["Image-based in the original file"]},
{id:"q101",ch:"Liver investigations & jaundice",n:101,q:"A 35-year-old woman has jaundice, dark urine and pale stools with recurrent colicky right hypochondrial pain after fatty meals. Bilirubin is 6.0 mg/dL (direct 4.5), ALP is elevated, viral markers are negative, and ultrasound shows a calculous gallbladder with dilated intrahepatic ducts and CBD. What type of jaundice is this and why?",o:[["A","Hemolytic; increased unconjugated bilirubin due to hemolysis"],["B","Obstructive; increased conjugated bilirubin due to biliary obstruction"],["C","Hepatocellular; mixed bilirubin due to hepatocyte injury"],["D","Neonatal; physiological"],["E","Gilbert's syndrome; benign unconjugated hyperbilirubinemia"]],a:"B",e:["A raised direct fraction with dilated ducts and a stone, plus pale stools and dark urine, is obstructive jaundice from biliary obstruction.","Dilated ducts + pale stool = obstruction."],f:["Image-based in the original file"]},
{id:"q102",ch:"Abdominal examination",n:102,q:"A 40-year-old woman presents with this finding and mild fatigue only. Which condition is most commonly associated with it?",o:[["A","Liver cirrhosis"],["B","Rheumatoid arthritis"],["C","Psoriasis"],["D","Hypothyroidism"],["E","Anemia"]],a:"A",e:["Palmar erythema is most commonly associated with liver cirrhosis, where vasodilatory mediators and raised estrogen redden the thenar and hypothenar eminences.","Red palms = cirrhosis."],f:["Image-based in the original file"]},
{id:"q103",ch:"Abdominal examination",n:103,q:"A 65-year-old man with HCV for 5 years has gradually increasing bilateral lower limb edema that worsens by evening and improves overnight. JVP is not elevated. What is the most likely cause?",o:[["A","Heart failure"],["B","Deep vein thrombosis"],["C","Liver cirrhosis with hypoalbuminemia"],["D","Lymphedema"],["E","Cellulitis"]],a:"C",e:["A normal JVP excludes a cardiac cause, and bilateral pitting edema in chronic HCV reflects hypoalbuminemia from cirrhosis.","Normal JVP + bilateral edema = low albumin."],f:["Image-based in the original file"]},
{id:"q104",ch:"Ascites, HRS & portal hypertension",n:104,q:"A 60-year-old woman with chronic alcohol use has ascites with shifting dullness, albumin 2.8 g/dL, SAAG 1.8 g/dL and abnormal liver tests. What is the most likely cause of her ascites?",o:[["A","Congestive heart failure"],["B","Cirrhosis of the liver"],["C","Malignant peritoneal disease"],["D","Nephrotic syndrome"],["E","Tuberculous peritonitis"]],a:"B",e:["A SAAG of 1.8 g/dL (above 1.1) indicates portal hypertension, and in a patient with alcohol use and low albumin that means cirrhosis.","SAAG above 1.1 = portal hypertension."]},
{id:"q105",ch:"Abdominal examination",n:105,q:"A 45-year-old woman with alcohol-related cirrhosis has multiple small red star-shaped blanching lesions on her face and chest. What is the most likely underlying cause?",o:[["A","Rosacea"],["B","Spider naevi (spider angiomas)"],["C","Telangiectasia due to scleroderma"],["D","Petechiae from thrombocytopenia"],["E","Melanoma metastases"]],a:"B",e:["These are spider naevi - central arterioles with radiating capillaries that blanch on pressure, caused by hyperestrogenism in cirrhosis.","Star-shaped and blanching = spider naevi."],f:["Image-based in the original file"]},
{id:"q106",ch:"Abdominal examination",n:106,q:"A 55-year-old man with cirrhosis has Hb 8 g/dL, MCV 78 fL, low ferritin, normal B12 and folate, and positive occult blood in stool. What is the most likely cause of his anemia?",o:[["A","Iron deficiency anemia due to gastrointestinal bleeding"],["B","Anemia of chronic disease"],["C","Megaloblastic anemia due to folate deficiency"],["D","Hemolytic anemia"],["E","Aplastic anemia"]],a:"A",e:["Microcytic anemia with low ferritin and occult blood positivity means chronic gastrointestinal blood loss - varices, gastropathy or ulcers.","Low ferritin + occult blood = bleeding."],f:["Image-based in the original file"]},
{id:"q107",ch:"Ascites, HRS & portal hypertension",n:107,q:"A 58-year-old man presents with vomiting blood and black tarry stools, pale, BP 90/60, pulse 115. Upper endoscopy shows bluish cords protruding into the esophageal lumen. What is the most likely underlying cause?",o:[["A","Peptic ulcer disease"],["B","Gastric cancer"],["C","Esophageal varices due to portal hypertension"],["D","Esophagitis"]],a:"C",e:["Bluish cords are varices, and their rupture under portal hypertension explains the hematemesis, melena and shock.","Bluish cords + shock = bleeding varices."],f:["Image-based in the original file"]},
{id:"q108",ch:"IBD & GI neoplasms",n:108,q:"A 32-year-old woman has intermittent abdominal pain, diarrhea and weight loss for six months. Colonoscopy shows longitudinal ulcers with cobblestone appearance in colon and terminal ileum. What is the most likely diagnosis?",o:[["A","Ulcerative colitis"],["B","Irritable bowel syndrome"],["C","Crohn's disease"],["D","Infectious gastroenteritis"]],a:"C",e:["Longitudinal ulcers with cobblestoning in the terminal ileum and colon are characteristic of Crohn's disease.","Cobblestone + terminal ileum = Crohn's."],f:["Image-based in the original file"]},
{id:"q109",ch:"Ascites, HRS & portal hypertension",n:109,q:"A 60-year-old male with chronic hepatitis C and alcohol use disorder has increasing abdominal distension. What is the most likely underlying cause of his ascites?",o:[["A","Congestive heart failure"],["B","Nephrotic syndrome"],["C","Cirrhosis secondary to chronic liver disease"],["D","Peritoneal carcinomatosis"]],a:"C",e:["Both HCV and alcohol cause cirrhosis, and cirrhosis with portal hypertension is the commonest source of ascites.","Two hepatotoxins, one cirrhotic liver."],f:["Image-based in the original file"]},
{id:"q110",ch:"Gall bladder & pancreas",n:110,q:"A patient presented with jaundice. Abdominal ultrasound showed common bile duct stones. What is the next step?",o:[["A","Stool analysis"],["B","Colonoscopy"],["C","ERCP"],["D","None of the above"]],a:"C",e:["ERCP confirms and removes common bile duct stones, and can decompress an obstructed biliary tree in the same session.","CBD stone: go in with ERCP."],f:["Image-based in the original file"]},
{id:"q111",ch:"Metabolic, vascular liver disease & tumors",n:111,q:"A 65-year-old man with chronic hepatitis B and cirrhosis has intermittent abdominal pain, new fatigue and AFP 350 ng/mL. Ultrasound shows a 4 cm lesion in the right lobe with irregular margins. What is the most likely diagnosis?",o:[["A","Hepatic adenoma"],["B","Hepatocellular carcinoma"],["C","Metastatic liver disease"],["D","Focal nodular hyperplasia"]],a:"B",e:["A new irregular liver lesion with a markedly raised AFP in a cirrhotic patient is hepatocellular carcinoma.","Cirrhosis + rising AFP + new lesion = HCC."]},
{id:"q112",ch:"Metabolic, vascular liver disease & tumors",n:112,q:"A 42-year-old woman has worsening abdominal pain, fatigue, leg swelling and weight gain, with tender hepatomegaly, ascites, bilateral edema and this abdominal finding. What is the most likely diagnosis?",o:[["A","Hepatic cirrhosis"],["B","Budd-Chiari syndrome"],["C","Hepatic adenoma"],["D","Portal vein thrombosis"]],a:"B",e:["Tender hepatomegaly with rapid ascites and dilated abdominal wall veins reflects hepatic venous outflow obstruction - Budd-Chiari syndrome.","Tender liver + rapid ascites + collaterals = Budd-Chiari."],f:["Image-based in the original file"]},
{id:"q113",ch:"Viral & autoimmune hepatitis",n:113,q:"A 35-year-old man has fatigue, nausea, mild jaundice and right upper quadrant tenderness. He has had multiple sexual partners and no hepatitis B vaccine. AST/ALT are markedly elevated with positive HBsAg and IgM anti-HBc. What is the most likely diagnosis?",o:[["A","Acute hepatitis B infection"],["B","Chronic hepatitis B infection"],["C","Hepatitis A infection"],["D","Hepatitis C infection"]],a:"A",e:["IgM anti-HBc marks recent infection, so HBsAg positivity with IgM core antibody means acute hepatitis B.","IgM anti-HBc = acute HBV."]},
{id:"q114",ch:"Abdominal examination",n:114,q:"A 28-year-old male presents with a midline abdominal bulge of 6 months' duration, particularly when he coughs. This finding could be due to:",o:[["A","Ascites"],["B","Obesity"],["C","Weak abdominal wall muscles"],["D","All of the above"]],a:"D",e:["Divarication of the recti results from any combination of raised intra-abdominal pressure and weakened musculature - ascites, obesity and muscle weakness all contribute.","Weak wall plus pressure = diastasis."],f:["Image-based in the original file"]},
{id:"q115",ch:"Liver investigations & jaundice",n:115,q:"A 50-year-old man presents with this finding, dark urine and pale stools for a week, with colicky right hypochondrial pain and nausea. What is the most likely cause?",o:[["A","Hepatocellular damage due to alcohol"],["B","Choledocholithiasis"],["C","Hepatitis A infection"],["D","Hemolysis"]],a:"B",e:["Colicky right upper quadrant pain with dark urine, pale stools and jaundice is the classic triad of an obstructing common bile duct stone.","Colic + dark urine + pale stool = CBD stone."],f:["Image-based in the original file"]},
{id:"q116",ch:"Abdominal examination",n:116,q:"Which of the following is NOT a common cause of this finding?",o:[["A","Heart failure"],["B","Deep vein thrombosis (DVT)"],["C","Hyperthyroidism"],["D","Liver cirrhosis"]],a:"C",e:["Hyperthyroidism does not cause pitting pedal edema; heart failure, DVT and cirrhosis all do through pressure or oncotic mechanisms.","Thyroid does not swell the ankles."],f:["Image-based in the original file"]},
{id:"q117",ch:"Esophagus, stomach & duodenum",n:117,q:"A 50-year-old man has 3 weeks of burning epigastric pain worse after meals and at night, with frequent NSAID use. Endoscopy shows a single ulcer in the duodenal bulb. What is the most likely cause?",o:[["A","H. pylori infection"],["B","Chronic alcohol consumption"],["C","Stress-related mucosal damage"],["D","NSAID use"],["E","Zollinger-Ellison syndrome"]],a:"D",e:["In this patient the frequent NSAID use is the driver: prostaglandin inhibition removes mucosal protection and permits duodenal ulceration.","NSAIDs cause ulcers by removing prostaglandins."],f:["Image-based in the original file"]},
{id:"q118",ch:"IBD & GI neoplasms",n:118,q:"A 25-year-old woman has 3 months of abdominal pain, bloody diarrhea, weight loss, mouth ulcers and skin rashes. Colonoscopy shows patchy inflammation with skip lesions and cobblestoning; biopsy shows transmural granulomatous inflammation. Which is the most characteristic feature of Crohn's disease here?",o:[["A","Continuous inflammation limited to the colon"],["B","Mucosal inflammation without granulomas"],["C","Transmural inflammation with skip lesions and granulomas"],["D","Pseudopolyps and superficial ulcerations only"],["E","Exclusive involvement of the rectum"]],a:"C",e:["Transmural inflammation with skip lesions and granulomas is the defining histological pattern of Crohn's disease.","Transmural + skip + granuloma = Crohn's."],f:["Image-based in the original file"]},
{id:"q119",ch:"Ascites, HRS & portal hypertension",n:119,q:"A 60-year-old man with alcohol use has abdominal distension and 4 kg weight gain, shifting dullness, albumin 2.8 g/dL, SAAG 2.2 g/dL, and straw-coloured ascitic fluid with total protein 1.5 g/dL. What is the most likely cause?",o:[["A","Heart failure"],["B","Cirrhosis of the liver"],["C","Peritoneal carcinomatosis"]],a:"B",e:["A high SAAG (2.2) with low ascitic protein indicates portal hypertensive ascites, which in a patient with alcohol use means cirrhosis.","High SAAG + low protein = cirrhotic ascites."],f:["Image-based in the original file"]},
{id:"q120",ch:"Abdominal examination",n:120,q:"A 35-year-old woman, six months after her second pregnancy, has a lower abdominal bulge worse on coughing, with a 3 cm separation of the rectus muscles at the umbilicus. What is the most likely diagnosis?",o:[["A","Umbilical hernia"],["B","Diastasis of the rectus abdominis"],["C","Incisional hernia"],["D","Rectus sheath hematoma"],["E","Ventral hernia"]],a:"B",e:["Pregnancy stretches the linea alba, and a measurable separation of the recti that widens with contraction is divarication of the recti, not a hernia.","Postpartum midline widening = diastasis."],f:["Image-based in the original file"]},
{id:"q121",ch:"Ascites, HRS & portal hypertension",n:121,q:"A 50-year-old male with hematemesis has upper endoscopy showing bluish cords protruding into the esophageal lumen. What is the next step?",o:[["A","Conservative management"],["B","Biopsy of the lesions"],["C","Band ligation"],["D","Argon"]],a:"C",e:["Actively bleeding varices are treated with endoscopic band ligation, which occludes the varix and stops the hemorrhage.","Bleeding varix: band it."],f:["Image-based in the original file"]},
{id:"q122",ch:"Abdominal examination",n:122,q:"A 45-year-old woman has prominent periumbilical venous collaterals, no hepatosplenomegaly, normal liver tests, and ultrasound shows mild portal vein dilation with no liver mass. What is the most likely cause?",o:[["A","Portal hypertension secondary to cirrhosis"],["B","Inferior vena cava thrombosis"],["C","Malignant intra-abdominal tumor compressing the portal veins"],["D","Congenital vascular malformation"]],a:"C",e:["With normal liver tests, no hepatosplenomegaly and no cirrhosis, the collaterals must come from extrinsic portal venous compression by an intra-abdominal tumour.","Normal liver + collaterals = think compression."],f:["Image-based in the original file"]},
{id:"q123",ch:"Metabolic, vascular liver disease & tumors",n:123,q:"A 35-year-old woman has abdominal pain, hepatomegaly and ascites, with leg swelling and recent oral contraceptive use. Doppler shows absent flow in the hepatic veins. What is the most likely diagnosis?",o:[["A","Cirrhosis secondary to chronic hepatitis B"],["B","Budd-Chiari syndrome"],["C","Congestive heart failure with hepatic congestion"],["D","Liver metastases from colorectal cancer"],["E","Primary sclerosing cholangitis"]],a:"B",e:["Absent hepatic vein flow with painful hepatomegaly and ascites in an oral contraceptive user is Budd-Chiari syndrome, as the pill is prothrombotic.","No hepatic vein flow = Budd-Chiari."]},
{id:"q124",ch:"Viral & autoimmune hepatitis",n:124,q:"A 50-year-old man with intravenous drug use has elevated liver enzymes, positive anti-HCV and detectable HCV RNA. What is the primary mode of transmission of hepatitis C?",o:[["A","Fecal-oral route"],["B","Parenteral exposure (blood-to-blood contact)"],["C","Respiratory droplets"],["D","Sexual contact only"],["E","Vertical transmission during childbirth"]],a:"B",e:["HCV is transmitted parenterally through blood-to-blood contact such as shared needles, which matches his history.","HCV travels in blood."]},
{id:"q125",ch:"Liver investigations & jaundice",n:125,q:"A 45-year-old woman presents with yellowing of skin and sclera, pallor, mild hepatomegaly and dark urine, without abdominal pain or fever. What is the next most important initial investigation?",o:[["A","Upper endoscopy"],["B","ERCP"],["C","Abdominal ultrasound"],["D","Liver biopsy"]],a:"C",e:["Abdominal ultrasound is the first-line investigation in any jaundice: it separates obstructive from hepatocellular causes before invasive testing.","Jaundice: ultrasound before endoscopy or biopsy."],f:["Image-based in the original file"]},
{id:"q126",ch:"Abdominal examination",n:126,q:"A 50-year-old woman with chronic liver disease has redness of the palms over the thenar and hypothenar eminences. Palmar erythema is most commonly associated with which condition?",o:[["A","Liver cell failure"],["B","Hyperthyroidism"],["C","Rheumatoid arthritis"],["D","Hypocalcemia"],["E","Diabetes mellitus"]],a:"A",e:["Palmar erythema is a peripheral vasodilatory sign of liver cell failure with hyperestrogenism.","Red thenar and hypothenar = liver cell failure."],f:["Image-based in the original file"]},
{id:"q127",ch:"Abdominal examination",n:127,q:"A 55-year-old man has non-painful bilateral lower limb swelling with shiny skin that pits on pressure, without ulceration or infection. Which finding is most characteristic of pitting edema?",o:[["A","Non-pitting, hard swelling with skin thickening"],["B","Soft, compressible swelling that pits on pressure"],["C","Irreducible swelling with warmth and redness"],["D","Fixed, non-pitting swelling with skin ulceration"],["E","Swelling that increases with leg elevation"]],a:"B",e:["Pitting edema is soft and compressible, and the indentation persists briefly because the interstitial fluid is displaced.","Fluid pits; lymph does not."],f:["Image-based in the original file"]},
{id:"q128",ch:"Viral & autoimmune hepatitis",n:128,q:"A 30-year-old man has fatigue, nausea, right upper quadrant pain and jaundice after travel to a region with poor sanitation. IgM anti-HAV is positive. Which is the most characteristic feature of hepatitis A?",o:[["A","It causes chronic hepatitis in most cases"],["B","It is transmitted primarily through contaminated water and food"],["C","It is associated with a high risk of hepatocellular carcinoma"],["D","It typically presents with a prolonged relapsing course"],["E","It is transmitted via blood transfusion in most cases"]],a:"B",e:["Hepatitis A spreads by the fecal-oral route through contaminated food and water, and it never becomes chronic.","HAV: food and water, never chronic."]},
{id:"q129",ch:"Abdominal examination",n:129,q:"A 30-year-old woman has fatigue and weakness, with pale conjunctivae and skin. Pallor in this patient is primarily due to:",o:[["A","Increased melanin in the skin"],["B","Decreased hemoglobin concentration in the blood"],["C","Vasodilation of superficial blood vessels"],["D","Edema causing skin swelling"],["E","Hyperbilirubinemia"]],a:"B",e:["Pallor reflects a fall in hemoglobin, which reduces the red colour of blood in the mucosae and skin.","Pale means low hemoglobin."],f:["Image-based in the original file"]},
{id:"q130",ch:"Esophagus, stomach & duodenum",n:130,q:"A 45-year-old man has 3 months of epigastric pain 2-3 hours after meals, waking him at night, with NSAID use. Endoscopy shows a 1.5 cm clean-based ulcer in the duodenal bulb; biopsy is negative for H. pylori and malignancy. What is the diagnosis and most appropriate initial management?",o:[["A","Gastric carcinoma; surgical resection"],["B","Duodenal ulcer; proton pump inhibitor therapy"],["C","Gastric varices; band ligation"],["D","Zollinger-Ellison syndrome; somatostatin analogue"],["E","Gastric ulcer; corticosteroid therapy"]],a:"B",e:["A clean-based duodenal bulb ulcer without H. pylori or malignancy is a duodenal ulcer, and acid suppression with a proton pump inhibitor is first-line therapy.","Duodenal ulcer: PPI."],f:["Image-based in the original file"]},
{id:"q131",ch:"IBD & GI neoplasms",n:131,q:"A 27-year-old woman has 6 months of abdominal pain, diarrhea and weight loss with mouth ulcers and skin rashes. Colonoscopy shows skip lesions, deep ulcers and cobblestoning; biopsy shows transmural inflammation with granulomas. Which is the most characteristic feature of Crohn's disease?",o:[["A","Continuous superficial colonic ulceration often limited to the rectum"],["B","Transmural inflammation with granulomas and skip lesions"],["C","Pseudopolyps and superficial mucosal ulceration in the colon"],["D","Diffuse inflammation limited to the rectosigmoid colon"],["E","Lead pipe appearance on barium enema without granulomas"]],a:"B",e:["Transmural inflammation with granulomas and skip lesions defines Crohn's disease; the other options describe ulcerative colitis.","Transmural, granulomas, skips."],f:["Image-based in the original file"]},
{id:"q132",ch:"Ascites, HRS & portal hypertension",n:132,q:"A 60-year-old man has progressive abdominal distension, shifting dullness and a fluid wave, with hepatomegaly, jaundice, low albumin, high INR and a cirrhotic liver on ultrasound. What is the most common cause of his distension?",o:[["A","Ovarian cyst"],["B","Ascites secondary to liver cirrhosis"],["C","Gastrointestinal tumor"],["D","Congestive heart failure"],["E","Renal failure with fluid overload"]],a:"B",e:["All the findings point to decompensated cirrhosis, and ascites is the most common cause of abdominal distension in that setting.","Cirrhosis plus fluid wave = ascites."],f:["Image-based in the original file"]},
{id:"q133",ch:"Hepatic failure & cirrhosis",n:133,q:"A 55-year-old woman with alcohol use has abdominal distension, jaundice and fatigue. Ultrasound shows a small nodular liver with surface irregularities, splenomegaly and ascites. Which ultrasound finding is most characteristic of cirrhosis?",o:[["A","Homogeneous, smooth and enlarged liver"],["B","Small, nodular liver with surface irregularities and coarse echotexture"],["C","Large, homogenous liver with increased vascularity"],["D","Normal-sized liver with increased echogenicity"],["E","Multiple cysts throughout the liver parenchyma"]],a:"B",e:["Cirrhosis produces a shrunken, nodular liver with an irregular surface and coarse echotexture, along with splenomegaly and ascites.","Small, bumpy, coarse = cirrhosis."],f:["Image-based in the original file"]},
{id:"q134",ch:"Metabolic, vascular liver disease & tumors",n:134,q:"A 65-year-old man with hepatitis C cirrhosis has a 3 cm hypoechoic lesion with irregular borders and a raised AFP on screening ultrasound. What is the most likely diagnosis?",o:[["A","Liver metastasis"],["B","Hepatocellular carcinoma"],["C","Hemangioma of the liver"],["D","Focal nodular hyperplasia"],["E","Liver abscess"]],a:"B",e:["A new hypoechoic lesion with irregular borders and raised AFP in a cirrhotic liver is hepatocellular carcinoma.","Cirrhosis + lesion + high AFP = HCC."]},
{id:"q135",ch:"Metabolic, vascular liver disease & tumors",n:135,q:"A 40-year-old woman on oral contraceptives has sudden severe right upper quadrant pain, hepatomegaly, ascites and jaundice, with absent or reversed hepatic vein flow on Doppler. Which is the most characteristic finding in Budd-Chiari syndrome?",o:[["A","Obstruction of the hepatic veins leading to congestion and hepatomegaly"],["B","Obstruction of the portal vein causing portal hypertension"],["C","Obstruction of the inferior vena cava below the hepatic veins"],["D","Liver cirrhosis with nodular surface"],["E","Multiple cystic lesions in the liver"]],a:"A",e:["Budd-Chiari is obstruction of the hepatic venous outflow, producing congestive hepatomegaly, ascites and abdominal wall collaterals.","Outflow block = Budd-Chiari."],f:["Image-based in the original file"]},
{id:"q136",ch:"Viral & autoimmune hepatitis",n:136,q:"A 55-year-old man with intravenous drug use has mildly elevated ALT/AST, positive HCV antibody and PCR-confirmed active replication. Which is the most common mode of transmission of HCV?",o:[["A","Vertical transmission from mother to child"],["B","Sexual contact"],["C","Blood-to-blood contact, such as sharing needles"],["D","Contaminated food and water"],["E","Respiratory droplets"]],a:"C",e:["Parenteral blood-to-blood exposure, especially shared needles, is the dominant route of HCV transmission.","HCV: needles, blood, not food."]},
{id:"q137",ch:"Viral & autoimmune hepatitis",n:137,q:"A 30-year-old healthcare worker has positive HBsAg and HBeAg with normal liver function tests. Which statement about hepatitis B is true?",o:[["A","HBsAg positivity indicates immunity to HBV"],["B","HBeAg positivity suggests active viral replication and high infectivity"],["C","The presence of anti-HBs antibodies indicates current infection"],["D","HBV is transmitted primarily through the fecal-oral route"],["E","There is no available vaccine for HBV"]],a:"B",e:["HBeAg is a marker of active replication and high infectivity; anti-HBs indicates immunity and HBsAg indicates infection, not protection.","HBeAg positive = highly infectious."]},
{id:"q138",ch:"Abdominal examination",n:138,q:"A 32-year-old woman, 6 months postpartum, has a midline bulge that becomes prominent on raising her head and shoulders, with a 3 cm separation of the recti. What is the most likely diagnosis?",o:[["A","Umbilical hernia"],["B","Diastasis recti (divarication of the recti)"],["C","Incisional hernia"],["D","Rectus sheath hematoma"],["E","Abdominal muscle strain"]],a:"B",e:["A postpartum separation of the rectus muscles along the linea alba that widens on head-raising is divarication of the recti.","Postpartum midline gap = diastasis."],f:["Image-based in the original file"]},
{id:"q139",ch:"Liver investigations & jaundice",n:139,q:"A 45-year-old man has yellow skin and eyes, dark urine, pale stools and right upper quadrant tenderness, with elevated conjugated bilirubin and alkaline phosphatase. What is the most likely cause of his jaundice?",o:[["A","Hemolytic anemia"],["B","Viral hepatitis"],["C","Biliary obstruction"],["D","Liver cirrhosis"],["E","Congenital Gilbert's syndrome"]],a:"C",e:["Pale stools, dark urine and a raised alkaline phosphatase with conjugated hyperbilirubinemia indicate biliary obstruction.","Pale stool + high ALP = obstruction."],f:["Image-based in the original file"]},
