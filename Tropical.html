{id:"q140",ch:"Abdominal examination",n:140,q:"A 52-year-old woman has fatigue, easy bruising, abdominal swelling, facial flushing and red palms. Sclera are icteric and the liver edge is 3 cm below the costal margin, with raised bilirubin and low albumin. What is the most likely underlying condition?",o:[["A","Hyperthyroidism"],["B","Liver cirrhosis"],["C","Rheumatoid arthritis"],["D","Pregnancy"],["E","Menopause"]],a:"B",e:["Palmar erythema with jaundice, low albumin, easy bruising and hepatomegaly is the picture of liver cirrhosis.","Red palms + low albumin = cirrhosis."],f:["Image-based in the original file"]},
{id:"q141",ch:"Abdominal examination",n:141,q:"A 65-year-old man has bilateral pitting leg edema to the knees, fatigue, exertional dyspnea, raised JVP and a displaced apical impulse. What is the most likely cause of his edema?",o:[["A","Deep vein thrombosis"],["B","Heart failure"],["C","Nephrotic syndrome"],["D","Lymphedema"],["E","Liver cirrhosis"]],a:"B",e:["Raised JVP with a displaced apex beat means a dilated, failing heart, and the resulting venous hypertension produces bilateral pitting edema.","High JVP + edema = heart failure."],f:["Image-based in the original file"]},
{id:"q142",ch:"Ascites, HRS & portal hypertension",n:142,q:"A 48-year-old man has abdominal distension, easy bruising and hematemesis, with caput medusae, splenomegaly and ascites after hepatitis B. What is the pathophysiological mechanism?",o:[["A","Obstruction of the hepatic veins leading to Budd-Chiari syndrome"],["B","Increased resistance to portal blood flow due to cirrhosis"],["C","Obstruction of the hepatic artery causing ischemia"],["D","Increased portal vein flow due to arteriovenous fistula"],["E","Congenital absence of the portal vein"]],a:"B",e:["Cirrhosis increases intrahepatic resistance to portal flow, raising portal pressure and opening collaterals such as caput medusae and varices.","Cirrhosis blocks portal inflow, not outflow."]},
{id:"q143",ch:"Ascites, HRS & portal hypertension",n:143,q:"A 50-year-old man with alcohol abuse and hepatitis B presents with large-volume hematemesis and hypotension, with raised JVP, caput medusae and epigastric tenderness. What is the most probable cause?",o:[["A","Peptic ulcer disease"],["B","Esophageal varices secondary to portal hypertension"],["C","Mallory-Weiss tear"],["D","Gastric carcinoma"],["E","Gastric polyp"]],a:"B",e:["Caput medusae and splenomegaly confirm portal hypertension, so the brisk hematemesis comes from ruptured esophageal varices.","Collaterals plus bleeding = varices."]},
{id:"q144",ch:"Abdominal examination",n:144,q:"A 45-year-old woman with years of alcohol use has easy bruising, muscle weakness, multiple small blanching red lesions on face, chest and shoulders, hepatomegaly and mild ascites. Which clinical finding is most characteristic of her condition?",o:[["A","Palmar erythema"],["B","Ascites"],["C","Spider naevi"],["D","Gynecomastia"],["E","Caput medusae"]],a:"C",e:["Blanching red lesions with a central arteriole on the face and upper chest are spider naevi, a hallmark of chronic liver disease.","Spider naevi on the upper body = chronic liver disease."],f:["Image-based in the original file"]},
{id:"q145",ch:"Abdominal examination",n:145,q:"A 55-year-old man with cirrhosis has fatigue, weakness, pallor, hepatomegaly and ascites, with anemia, abnormal liver tests and low albumin, but no recent bleeding. What is the most likely cause of his pallor?",o:[["A","Hemolytic anemia due to autoimmune processes"],["B","Iron deficiency anemia secondary to gastrointestinal bleeding"],["C","Anemia of chronic disease due to liver cirrhosis"],["D","Aplastic anemia"],["E","Vitamin B12 deficiency"]],a:"C",e:["With no recent bleeding, the normocytic anemia of chronic liver disease reflects inflammation, hypersplenism and reduced erythropoietin drive.","Cirrhosis plus no bleeding = anemia of chronic disease."],f:["Image-based in the original file"]},
{id:"q146",ch:"IBD & GI neoplasms",n:146,q:"A 30-year-old woman has persistent abdominal pain, bloody diarrhea and weight loss with mouth ulcers, a tender right lower quadrant mass, and colonoscopy showing patchy transmural inflammation with skip lesions and cobblestoning. Which is most characteristic of her condition?",o:[["A","Continuous colonic inflammation starting from the rectum"],["B","Transmural inflammation that can affect any part of the gastrointestinal tract"],["C","Mucosal inflammation limited to the rectum and sigmoid colon"],["D","Predominantly lymphoid hyperplasia of the ileocecal region"]],a:"B",e:["Crohn's disease is a transmural, segmental inflammation that can involve any part of the gastrointestinal tract from mouth to anus.","Crohn's: anywhere, full thickness."],f:["Image-based in the original file"]},
{id:"q147",ch:"Ascites, HRS & portal hypertension",n:147,q:"A 60-year-old woman has progressive abdominal distension, early satiety, tense abdomen with visible superficial veins and hypoalbuminemia. What is the most probable underlying cause?",o:[["A","Liver cirrhosis"],["B","Ovarian tumor"],["C","Ascites secondary to portal hypertension"],["D","Congestive heart failure"]],a:"A",e:["Visible abdominal veins with hypoalbuminemia indicate portal hypertension, and cirrhosis is the underlying cause.","Low albumin + collaterals = cirrhosis."],f:["Image-based in the original file"]},
{id:"q148",ch:"Hepatic failure & cirrhosis",n:148,q:"A 45-year-old woman has progressive abdominal distension and fatigue. Ultrasound shows a shrunken nodular liver with irregular margins, increased echogenicity and moderate free fluid, with no focal lesions; albumin is low and INR raised. Which ultrasound finding explains her presentation?",o:[["A","Liver tumor with vascular invasion"],["B","Fatty infiltration of the liver"],["C","Cirrhotic liver with portal hypertension and ascites"],["D","Acute hepatitis with hepatomegaly"]],a:"C",e:["A shrunken nodular liver with free fluid in a patient with low albumin and raised INR is cirrhosis with portal hypertension and ascites.","Shrunken liver + fluid = cirrhotic ascites."],f:["Image-based in the original file"]},
{id:"q149",ch:"IBD & GI neoplasms",n:149,q:"A 25-year-old male has bloody diarrhea, urgency and abdominal cramping for 2 weeks, with lower abdominal tenderness, anemia and raised ESR. Which is the most typical histological feature of his condition?",o:[["A","Granulomas and transmural inflammation"],["B","Continuous mucosal inflammation starting from the rectum"],["C","Fissures and deep ulcers involving the entire bowel wall"],["D","Patchy inflammation with skip lesions"]],a:"B",e:["Continuous mucosal inflammation beginning in the rectum is the histological pattern of ulcerative colitis; the other options describe Crohn's disease.","Continuous from the rectum = UC."]},
{id:"q150",ch:"Abdominal examination",n:150,q:"A 45-year-old man has prominent abdominal veins, weight loss, hepatomegaly and splenomegaly with abnormal liver tests. What is the significance of the dilated abdominal wall veins?",o:[["A","They are a sign of portal hypertension with collateral circulation"],["B","Indicate venous thrombosis of the lower limbs"],["C","Suggest superior vena cava obstruction"],["D","Are typical in congenital vascular malformations"]],a:"A",e:["Raised portal pressure opens portosystemic collaterals, which appear as dilated veins on the abdominal wall.","Abdominal collaterals = portal hypertension."],f:["Image-based in the original file"]},
{id:"q151",ch:"Metabolic, vascular liver disease & tumors",n:151,q:"A 60-year-old man with chronic hepatitis B has weight loss, right upper quadrant pain and jaundice. Ultrasound shows a large irregular liver mass and AFP is elevated. What is the most likely diagnosis?",o:[["A","Liver metastasis from colorectal cancer"],["B","Hepatocellular carcinoma"],["C","Hemangioma of the liver"],["D","Focal nodular hyperplasia"],["E","Cholangiocarcinoma"]],a:"B",e:["A large irregular mass with raised AFP in a patient with chronic hepatitis B is hepatocellular carcinoma.","Hep B + AFP + mass = HCC."]},
{id:"q152",ch:"Viral & autoimmune hepatitis",n:152,q:"A 50-year-old woman with a history of intravenous drug use has fatigue, right upper quadrant discomfort and weight loss, with elevated ALT/AST, positive HCV antibody and high HCV RNA. What is the most suitable management?",o:[["A","Watchful waiting"],["B","Start direct-acting antiviral (DAA) therapy"],["C","Liver transplantation"],["D","No treatment, as HCV resolves spontaneously"]],a:"B",e:["Active HCV replication is treated with direct-acting antivirals, which cure the great majority of patients.","Active HCV = DAAs."]},
{id:"q153",ch:"Liver investigations & jaundice",n:153,q:"A 52-year-old woman with hepatitis B has jaundice, dark urine, pale stools, hepatomegaly and right upper quadrant tenderness, with both direct and indirect bilirubin elevated and raised liver enzymes. What is the most probable cause of her jaundice?",o:[["A","Hemolytic anemia"],["B","Obstructive jaundice due to cholestasis"],["C","Liver cell injury causing hepatocellular jaundice"],["D","Neonatal jaundice"]],a:"C",e:["A mixed hyperbilirubinemia with raised transaminases, tender hepatomegaly and hepatitis B indicates hepatocellular injury rather than pure obstruction.","Mixed bilirubin + high transaminases = hepatocellular."],f:["Image-based in the original file"]},
{id:"q154",ch:"Abdominal examination",n:154,q:"A 55-year-old man with chronic liver disease has redness of the palms over the thenar and hypothenar eminences, with raised liver enzymes and cirrhosis. What is the most likely explanation for the palmar erythema?",o:[["A","Allergic dermatitis"],["B","Cirrhosis-related vascular dilation due to increased estrogen levels"],["C","Psoriasis"],["D","Bacterial infection"]],a:"B",e:["Cirrhosis reduces estrogen clearance, and the resulting hyperestrogenism dilates peripheral arterioles, reddening the palms.","Cirrhosis vasodilates through estrogen."],f:["Image-based in the original file"]},
{id:"q155",ch:"Abdominal examination",n:155,q:"A 50-year-old man has bilateral pitting leg edema to the knees, no pain or redness, a history of hypertension and recent weight gain. What is the most likely cause?",o:[["A","Heart failure"],["B","Deep vein thrombosis"],["C","Lymphatic obstruction"],["D","Cellulitis"]],a:"A",e:["Bilateral symmetrical pitting edema without pain or redness, in a hypertensive patient with weight gain, points to cardiac failure rather than local venous or lymphatic disease.","Both legs, no pain = cardiac."],f:["Image-based in the original file"]},
{id:"q156",ch:"Viral & autoimmune hepatitis",n:156,q:"A 35-year-old man from an endemic area has fatigue, right upper quadrant discomfort, mild hepatomegaly, raised ALT, positive HBsAg and anti-HBc, and high HBV DNA. What is the most appropriate next step?",o:[["A","Initiate antiviral therapy"],["B","Liver biopsy to assess fibrosis"],["C","No treatment, just observation"],["D","Vaccination"]],a:"A",e:["Active HBV replication with high DNA and raised ALT warrants antiviral therapy; vaccination is for prevention, not treatment.","High DNA + raised ALT = treat."]},
{id:"q157",ch:"Metabolic, vascular liver disease & tumors",n:157,q:"A 60-year-old man with chronic HBV has weight loss, abdominal pain and jaundice, with hepatomegaly, shifting dullness, a 4 cm irregular liver mass and raised AFP. What is the most likely diagnosis?",o:[["A","Liver metastasis from another primary tumor"],["B","Hepatocellular carcinoma"],["C","Hemangioma of the liver"],["D","Focal nodular hyperplasia"]],a:"B",e:["A large irregular mass with a raised AFP in a chronic HBV carrier is hepatocellular carcinoma.","HBV + AFP + irregular mass = HCC."]},
{id:"q158",ch:"Abdominal examination",n:158,q:"A 45-year-old man with chronic alcohol use has pallor and pale conjunctivae, tender hepatomegaly, splenomegaly, low hemoglobin, raised liver enzymes and prolonged prothrombin time. What is the most likely cause of his pallor?",o:[["A","Anemia due to hypersplenism from portal hypertension"],["B","Iron deficiency anemia"],["C","Hemolytic anemia"],["D","Anemia of chronic disease"]],a:"A",e:["Splenomegaly from portal hypertension sequesters red cells and produces hypersplenic anemia, which fits the enlarged spleen and low counts.","Big spleen = hypersplenic anemia."],f:["Image-based in the original file"]},
{id:"q159",ch:"Esophagus, stomach & duodenum",n:159,q:"A 50-year-old man has burning epigastric pain on an empty stomach, nausea and melena. Endoscopy shows a single clean-based bleeding gastric ulcer and biopsy reveals H. pylori. What is the pathogenesis and supporting histological feature?",o:[["A","Autoimmune destruction of parietal cells; presence of lymphoid follicles"],["B","Excess acid secretion due to vagus nerve overactivity; glandular hyperplasia"],["C","H. pylori infection leading to mucosal inflammation; lymphoid follicles and gastric gland atrophy"],["D","NSAID-induced mucosal injury; erosion of the muscularis mucosae"]],a:"C",e:["H. pylori causes chronic gastritis with mucosal inflammation, lymphoid follicles and gastric gland atrophy, which breaks mucosal defence and permits ulceration.","H. pylori: inflammation, lymphoid follicles, atrophy."],f:["Image-based in the original file"]},
{id:"q160",ch:"IBD & GI neoplasms",n:160,q:"A 28-year-old woman has chronic diarrhea with occasional blood, abdominal pain and weight loss. Colonoscopy shows skip lesions with cobblestoning and biopsy shows granulomas. What is the characteristic pattern of inflammation and which part of the GI tract is most commonly affected?",o:[["A","Continuous colitis limited to the rectum; mucosal ulceration only"],["B","Skip lesions with granulomas; can involve any part of the GI tract from mouth to anus"],["C","Diffuse colitis starting from the rectum; no granulomas"],["D","Isolated ileal ulcer; non-granulomatous inflammation"]],a:"B",e:["Crohn's disease is characterised by skip lesions with granulomas and can affect any segment of the gastrointestinal tract from mouth to anus.","Skip lesions + granulomas = Crohn's anywhere."],f:["Image-based in the original file"]},
{id:"q161",ch:"Abdominal examination",n:161,q:"A 60-year-old man with chronic alcohol use has jaundice, abdominal distension and bilateral leg swelling, with a shrunken nodular liver, raised bilirubin and low albumin. What is the mechanism of his leg edema?",o:[["A","Increased hydrostatic pressure due to right heart failure"],["B","Decreased plasma oncotic pressure due to hypoalbuminemia and portal hypertension-induced lymphatic obstruction"],["C","Lymphatic obstruction from neoplastic infiltration"],["D","Renal loss of protein leading to nephrotic syndrome"]],a:"B",e:["Cirrhosis lowers albumin and raises portal pressure, so plasma oncotic pressure falls and splanchnic lymph formation exceeds drainage - producing edema and ascites.","Low albumin plus high portal pressure."],f:["Image-based in the original file"]},
{id:"q162",ch:"Metabolic, vascular liver disease & tumors",n:162,q:"A 45-year-old woman without liver disease has a well-circumscribed 3 cm hyperechoic lesion in the right liver lobe. What is the most likely diagnosis and its typical histology?",o:[["A","Hepatocellular carcinoma; thickened hepatocyte plates and trabecular pattern"],["B","Liver abscess; necrotic debris with inflammatory infiltrate"],["C","Hemangioma; proliferation of blood vessels with a cavernous pattern"],["D","Focal nodular hyperplasia; central scar with malformed vessels"]],a:"C",e:["A well-circumscribed hyperechoic lesion in a healthy liver is typically a cavernous hemangioma, the commonest benign liver tumour.","Hyperechoic, well-defined, healthy liver = hemangioma."],f:["Image-based in the original file"]},
{id:"q163",ch:"IBD & GI neoplasms",n:163,q:"A 32-year-old man has bloody diarrhea and urgency for weeks. Colonoscopy shows diffuse continuous inflammation extending from the rectum proximally, and biopsy shows crypt abscesses. What is the typical histological feature and distribution?",o:[["A","Granulomas; segmental lesions involving any part of the GI tract"],["B","Crypt abscesses; continuous mucosal involvement limited to the colon and rectum"],["C","Granulomas and skip lesions; involves the entire GI tract"],["D","Non-inflammatory polypoid lesions; limited to the rectum"]],a:"B",e:["Crypt abscesses with continuous mucosal inflammation confined to the colon and rectum is ulcerative colitis.","Crypt abscesses + continuous = UC."]},
{id:"q164",ch:"Abdominal examination",n:164,q:"A 55-year-old man with alcohol-related cirrhosis has increasing abdominal distension and jaundice, with prominent dilated veins radiating from the umbilicus. What is the most likely cause of these veins?",o:[["A","Superior vena cava obstruction"],["B","Portal hypertension secondary to cirrhosis"],["C","Inferior vena cava thrombosis"],["D","Congenital vascular malformation"]],a:"B",e:["Portal hypertension reopens the paraumbilical veins, producing caput medusae radiating from the umbilicus.","Veins radiating from the umbilicus = portal hypertension."]},
{id:"q165",ch:"IBD & GI neoplasms",n:165,q:"A 25-year-old woman has abdominal pain, diarrhea, weight loss and blood in the stool, with oral ulcers and a perianal fistula, and raised ESR and CRP. What is the most probable diagnosis?",o:[["A","Ulcerative colitis"],["B","Crohn's disease"],["C","Infectious colitis"],["D","Ischemic colitis"]],a:"B",e:["Oral ulcers and perianal fistula are classic extraintestinal and perianal features of Crohn's disease, which can affect any part of the gut.","Fistula plus mouth ulcers = Crohn's."]},
{id:"q166",ch:"Hepatic failure & cirrhosis",n:166,q:"A 48-year-old man with hepatitis B has fatigue, leg swelling, an enlarged liver and spider angiomata, with raised bilirubin and low albumin. Which complication is he most at risk of from his cirrhosis?",o:[["A","Kidney failure"],["B","Liver cancer"],["C","Heart failure"],["D","Pneumonia"]],a:"B",e:["Chronic hepatitis B with cirrhosis carries a high risk of hepatocellular carcinoma, which is why these patients need regular ultrasound surveillance.","HBV cirrhosis: screen for HCC."]},
{id:"q167",ch:"Abdominal examination",n:167,q:"A 35-year-old woman, 3 months postpartum, has a midline abdominal bulge worse on coughing, with a palpable separation of the rectus muscles along the linea alba. What is the most likely diagnosis?",o:[["A","Umbilical hernia"],["B","Rectus sheath hematoma"],["C","Diastasis recti"],["D","Diabetic ketoacidosis"]],a:"C",e:["Separation of the recti along the linea alba after pregnancy, widening with raised intra-abdominal pressure, is diastasis recti.","Postpartum midline gap = diastasis recti."],f:["Image-based in the original file"]},
{id:"q168",ch:"Viral & autoimmune hepatitis",n:168,q:"A 30-year-old man from an area with poor sanitation has sudden jaundice, dark urine, fatigue and nausea after drinking contaminated water. Bilirubin is mainly direct, ALT/AST are raised, and hepatitis B and C markers are negative. What is the diagnosis and characteristic histology?",o:[["A","Hepatitis B; ground-glass hepatocytes with intranuclear inclusions"],["B","Hepatitis C; lymphoid aggregates and piecemeal necrosis"],["C","Hepatitis A; ballooning degeneration of hepatocytes and Councilman bodies"],["D","Autoimmune hepatitis; interface hepatitis with plasma cell infiltrates"]],a:"C",e:["Fecal-oral transmission with negative HBV/HCV markers means hepatitis A, which shows ballooning degeneration and Councilman bodies histologically.","HAV: contaminated water, Councilman bodies."],f:["Image-based in the original file"]},
{id:"q169",ch:"Abdominal examination",n:169,q:"A 50-year-old man with known cirrhosis has erythematous palms, especially near the fingertips, and abnormal liver function tests. This finding is most characteristic of which condition?",o:[["A","Psoriasis"],["B","Rheumatoid arthritis"],["C","Liver cirrhosis-associated peripheral vascular changes"],["D","Contact dermatitis"]],a:"C",e:["Palmar erythema in cirrhosis reflects peripheral vasodilatation from altered vascular mediators and hyperestrogenism.","Cirrhosis reddens the palms."],f:["Image-based in the original file"]},
{id:"q170",ch:"Abdominal examination",n:170,q:"A 60-year-old man with long-standing alcohol abuse has jaundice, ascites and bilateral leg swelling, with nodular hepatomegaly, splenomegaly, raised bilirubin, low albumin and prolonged prothrombin time. What is the main mechanism of his leg edema?",o:[["A","Increased hydrostatic pressure from right heart failure"],["B","Decreased plasma oncotic pressure due to hypoalbuminemia and portal hypertension leading to lymphatic obstruction"],["C","Lymphatic obstruction from neoplastic infiltration"],["D","Kidney failure causing sodium retention and edema"]],a:"B",e:["Hypoalbuminemia lowers oncotic pressure while portal hypertension increases splanchnic lymph formation beyond drainage, producing edema.","Low albumin plus portal hypertension."],f:["Image-based in the original file"]},
{id:"q171",ch:"IBD & GI neoplasms",n:171,q:"A 28-year-old woman has bloody diarrhea, cramping and urgency for 2 weeks, with blood and mucus, no fever or weight loss, previous similar episodes and pallor. What common hematological complication explains her pallor?",o:[["A","Iron deficiency anemia due to chronic blood loss"],["B","Vitamin B12 deficiency due to malabsorption"],["C","Anemia of chronic disease"],["D","Hemolytic anemia"]],a:"A",e:["Recurrent bloody diarrhea causes chronic iron loss, and iron deficiency anemia is the commonest hematological complication of ulcerative colitis.","Bloody colitis loses iron."]},
{id:"q172",ch:"Viral & autoimmune hepatitis",n:172,q:"A 35-year-old woman from an endemic area has fatigue, jaundice and right upper quadrant discomfort, with raised ALT/AST and positive HBsAg and HBeAg. What is the primary cause of the enzyme rise and the expected histology?",o:[["A","Alcoholic hepatitis; fatty change and ballooning degeneration"],["B","Viral hepatitis B; interface hepatitis with lymphocytic infiltration and hepatocyte necrosis"],["C","Autoimmune hepatitis; plasma cell infiltration with rosettes"],["D","Cirrhosis; bridging fibrosis with regenerative nodules"]],a:"B",e:["Chronic hepatitis B produces interface hepatitis with lymphocytic infiltration and hepatocyte necrosis, which raises the transaminases.","HBV: interface hepatitis, lymphocytes."]},
{id:"q173",ch:"Abdominal examination",n:173,q:"A 35-year-old woman with alcohol use has multiple small red blanching lesions on the face and upper chest, easy bruising, fatigue and tender hepatomegaly. What is the underlying cause of her spider naevi?",o:[["A","Cirrhosis leading to estrogen imbalance and vascular dilation"],["B","Vitamin deficiency"],["C","Connective tissue disorder"],["D","Primary skin disorder"]],a:"A",e:["Liver disease impairs estrogen clearance, and the excess estrogen dilates cutaneous arterioles to form spider naevi.","Spider naevi: estrogen plus vasodilatation."],f:["Image-based in the original file"]},
{id:"q174",ch:"Abdominal examination",n:174,q:"A 45-year-old man with alcoholic cirrhosis has fatigue, pallor and dizziness, conjunctival pallor, tachycardia and microcytic hypochromic anemia. What is the most likely cause of his pallor?",o:[["A","Iron deficiency anemia due to gastrointestinal bleeding"],["B","Aplastic anemia"],["C","Hemolytic anemia"],["D","Folic acid deficiency"]],a:"A",e:["Microcytic hypochromic anemia in cirrhosis points to iron deficiency from chronic gastrointestinal blood loss, typically from varices or gastropathy.","Microcytic + cirrhosis = gut blood loss."],f:["Image-based in the original file"]}
]};
const SK='tropical-eos-2027';const $=i=>document.getElementById(i);
let cur=null,show=false,wrongOnly=false,P={},LAST=null;
try{P=JSON.parse(localStorage.getItem(SK)||'{}')}catch(e){}
try{LAST=JSON.parse(localStorage.getItem(SK+'ans')||'null')}catch(e){}
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(P))}catch(e){}};
const saveLast=(id)=>{if(!id)return;LAST={id:id};try{localStorage.setItem(SK+'ans',JSON.stringify(LAST))}catch(e){}updRB()};
const clearLast=()=>{LAST=null;try{localStorage.removeItem(SK+'ans')}catch(e){}updRB()};
function lastAnswered(){if(LAST&&P[LAST.id]&&byId(LAST.id))return byId(LAST.id);let f=null;DB.q.forEach(q=>{if(P[q.id])f=q});return f}
function nextTarget(){const la=lastAnswered();if(!la)return {none:true};const i=DB.q.indexOf(la);let t=DB.q.slice(i+1).find(q=>!P[q.id])||DB.q.slice(0,i).find(q=>!P[q.id]);return t?{q:t}:{done:true}}
function toast(m){let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--teal);color:#fff;padding:14px 20px;border-radius:12px;font-weight:700;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:90vw;text-align:center';document.body.appendChild(t)}
t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',4500)}
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const ea=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const byId=id=>DB.q.find(x=>x.id==id);
const tr=c=>{const L=c=='all'?DB.q:DB.q.filter(q=>q.ch==c);let d=0,w=0;L.forEach(q=>{const p=P[q.id];if(p){d++;if(p.r===0)w++}});return d+'/'+L.length+(w?` · <b style="color:var(--bad)">✗${w}</b>`:'')};
function updRB(){const a=!!lastAnswered();$('rb').style.display=a?'':'none';return a}
function navb(){let h=`<a data-c="home" class="${cur===null?'on':''}">⌂ Home</a><a data-c="all" class="${cur=='all'?'on':''}">All chapters <span>${tr('all')}</span></a>`;DB.ch.forEach((c,i)=>{h+=`<a data-c="${ea(c)}" class="${cur==c?'on':''}">${i+1}. ${c} <span>${tr(c)}</span></a>`});$('nav').innerHTML=h}
function home(){const T=nextTarget();let h='';
if(T.q)h+=`<button class="resume" id="rs2">▶ Resume where I left off<small>${DB.ch.indexOf(T.q.ch)+1}. ${T.q.ch} · Question ${T.q.n}</small></button>`;
else if(T.done)h+=`<button class="resume" id="rs2">🎉 All questions answered<small>You have completed every question</small></button>`;
h+=`<div class="cards"><div class="card" data-c="all">All questions <span>${tr('all')}</span></div>`;
DB.ch.forEach((c,i)=>{h+=`<div class="card" data-c="${ea(c)}">${i+1}. ${c} <span>${tr(c)}</span></div>`});
$('home').innerHTML=`<h2>Choose a chapter</h2>`+h+'</div>';stat()}
function openView(c){cur=c;$('home').style.display=c===null?'':'none';$('view').style.display=c===null?'none':'';navb();if(c===null){home()}else{render()}}
function render(){const t=$('s').value.toLowerCase().trim();let L=DB.q.filter(q=>(cur=='all'||q.ch==cur)&&(!wrongOnly||P[q.id]&&P[q.id].r===0)&&(!t||(q.q+q.o.map(o=>o[1]).join(' ')+(q.sa||'')).toLowerCase().includes(t)));
let h='',last='';L.forEach(q=>{if(cur=='all'&&q.ch!=last){last=q.ch;h+=`<h2>${DB.ch.indexOf(q.ch)+1}. ${q.ch}</h2>`}
const p=P[q.id],rev=show||p;
h+=`<div class="q" id="q-${q.id}" data-id="${q.id}"><h3 dir="auto"><b>${q.n}.</b> ${esc(q.q)}</h3>`;
if(q.o.length){q.o.forEach(o=>{let c='opt';if(rev&&o[0]==q.a)c+=' ok';else if(p&&p.c==o[0])c+=' bad';h+=`<button class="${c}" dir="auto" data-o="${ea(o[0])}"><b>${esc(o[0])}.</b> ${esc(o[1])}</button>`});
if(rev){h+=`<div class="ans" dir="auto"><span class="k">Correct answer: ${esc(q.a||'not provided — see flag')}</span></div>`;if(q.e)h+=expl(q)}}
else{h+=`<button class="opt" data-sa="1">Show model answer</button>`;if(rev){h+=`<div class="ans" dir="auto"><span class="k">Answer:</span> ${esc(q.sa||'—')}</div>`;if(q.e)h+=expl(q)}}
(q.f||[]).forEach(f=>h+=`<div class="flag" dir="auto">⚑ ${esc(f)}</div>`);if(q.pg)h+=`<div class="src">Book p. ${q.pg}</div>`;h+='</div>'});
$('list').innerHTML=h||'<p>No questions match.</p>';stat()}
function expl(q){if(!q.e||!(q.e[0]||q.e[1]))return'';return `<details class="ans" dir="auto" open><summary><b>Explanation</b></summary>${esc(q.e[0])}${q.e[1]?`<div style="margin-top:6px"><b>💡 Pearl:</b> ${esc(q.e[1])}</div>`:''}</details>`}
function stat(){navb();const ids=Object.keys(P).filter(k=>P[k].r!==undefined);const ok=ids.filter(k=>P[k].r===1).length;
$('st').textContent=`Solved ${Object.keys(P).length} of ${DB.q.length} · Correct ${ok} · Wrong ${ids.filter(k=>P[k].r===0).length}`;$('pb').style.width=100*Object.keys(P).length/DB.q.length+'%'}
function resume(){const T=nextTarget();if(T.none)return;
if(T.done){toast('🎉 You have answered all '+DB.q.length+' questions. Nothing left to resume!');return}
const q=T.q;$('s').value='';wrongOnly=false;$('wr').classList.remove('pri');openView(q.ch);
const el=$('q-'+q.id);if(el){el.scrollIntoView({block:'start'});el.classList.add('hl');setTimeout(()=>el.classList.remove('hl'),2500);window.scrollBy(0,-70)}}
$('list').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.closest('.q').dataset.id,q=byId(id);
if(P[id])return;
if(b.dataset.sa){P[id]={r:2};}else if(b.dataset.o){P[id]={c:b.dataset.o,r:q.a?(b.dataset.o==q.a?1:0):2}}else return;
save();saveLast(id);const y=scrollY;render();scrollTo(0,y)};
$('nav').onclick=e=>{const a=e.target.closest('a');if(!a)return;$('nav').classList.remove('open');openView(a.dataset.c=='home'?null:a.dataset.c);scrollTo(0,0)};
$('home').onclick=e=>{if(e.target.closest('#rs2')){resume();return}const c=e.target.closest('.card');if(c){openView(c.dataset.c);scrollTo(0,0)}};
$('s').oninput=render;$('tg').onclick=()=>{show=!show;$('tg').textContent='Show answers: '+(show?'on':'off');render()};
$('wr').onclick=()=>{wrongOnly=!wrongOnly;$('wr').classList.toggle('pri',wrongOnly);render()};
$('rs').onclick=()=>{if(confirm('Reset all progress?')){P={};save();clearLast();render()}};
$('hm').onclick=()=>{openView(null);scrollTo(0,0)};$('rb').onclick=resume;
updRB();openView(null);
</script></body></html>
