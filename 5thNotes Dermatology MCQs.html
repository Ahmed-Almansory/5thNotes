ustules are not seen. D) Ulcer formation: Ulcer is not cardinal.","5 cardinal signs."],"im":[]},{"id":"Q371","ch":"Inflammatory Dermatoses","q":"Well-defined erythematous plaques, adherent scales, dilated pilosebaceous orifices, telangiectasia, and atrophic scars are cardinal signs of","o":[["A","Lichen planus"],["B","Psoriasis vulgaris"],["C","Acne vulgaris"],["D","Discoid lupus erythematosus"],["E","Rosacea"]],"a":"D","sa":null,"pg":"65","f":[],"n":80,"e":["The combination of well-defined plaques, adherent scales, dilated pilosebaceous orifices, telangiectasia and atrophy is typical of DLE. Why the other options are wrong: A) Lichen planus: LP is violaceous. B) Psoriasis vulgaris: Psoriasis is silvery. C) Acne vulgaris: Acne has comedones. E) Rosacea: Rosacea has pustules.","DLE."],"im":[]},{"id":"Q372","ch":"Inflammatory Dermatoses","q":"Cardinal signs of discoid lupus include all the following EXCEPT:","o":[["A","Erythema"],["B","Scaling"],["C","Lichenification"],["D","Stippling"],["E","Telangiectasia"]],"a":"C","sa":null,"pg":"65","f":[],"n":81,"e":["Lichenification is a sign of chronic eczema and is not a cardinal sign of DLE (erythema, telangiectasia, scaling, stippling, scarring). Why the other options are wrong: A) Erythema: Cardinal. B) Scaling: Cardinal. D) Stippling: Cardinal. E) Telangiectasia: Cardinal.","No lichenification."],"im":[]},{"id":"Q373","ch":"Inflammatory Dermatoses","q":"PUVA may be used in the treatment of all of the following EXCEPT","o":[["A","Psoriasis."],["B","Vitiligo."],["C","Discoid lupus erythematosus."],["D","Alopecia."],["E","Lichen planus."]],"a":"C","sa":null,"pg":"66","f":[],"n":82,"e":["DLE is photosensitive and UV light can worsen it, so PUVA is not used; PUVA is used for psoriasis, vitiligo and alopecia areata. Why the other options are wrong: A) Psoriasis: PUVA treats it. B) Vitiligo: PUVA treats it. D) Alopecia: PUVA treats AA. E) Lichen planus: PUVA treats LP.","Avoid UV in lupus."],"im":[]},{"id":"Q374","ch":"Inflammatory Dermatoses","q":"A 32-year-old male patient presented with well-defined scaly erythematous plaques on his cheeks and nose with telangiectasia and atrophy. Plaques also showed dilatation of the pilosebaceous orifices. The condition started about five years ago and showed remissions and exacerbations with some improvement during winter times. (Clinical photo: erythematous scaly atrophic plaques on the cheek and nose - discoid lupus erythematosus.) Topical treatment of this case includes","o":[["A","Benzyl benzoate 25%."],["B","Benzoyl peroxide 10%."],["C","Gentamycin ointment."],["D","Azole cream."],["E","Corticosteroid cream."]],"a":"E","sa":null,"pg":"66","f":[],"n":83,"e":["Localized DLE lesions are treated with potent topical (or intralesional) corticosteroids, plus sun protection. Why the other options are wrong: A) Benzyl benzoate 25%: Benzyl benzoate is for scabies. B) Benzoyl peroxide 10%: BPO is for acne. C) Gentamycin ointment: Gentamicin is antibacterial. D) Azole cream: Azoles are antifungal.","Potent topical steroid."],"im":[]},{"id":"Q375","ch":"Inflammatory Dermatoses","q":"One of the following is used in ttt of discoid lupus","o":[["A","Antimalarials."],["B","Phototherapy."],["C","Laser."],["D","Retinoids."],["E","Methotrexate."]],"a":"A","sa":null,"pg":"66","f":[],"n":84,"e":["Antimalarials such as hydroxychloroquine are systemic photoprotective and anti-inflammatory agents used for DLE. Why the other options are wrong: B) Phototherapy: Phototherapy worsens. C) Laser: Laser is not first line. D) Retinoids: Retinoids are used rarely. E) Methotrexate: Methotrexate is not first line.","Hydroxychloroquine."],"im":[]},{"id":"Q376","ch":"Inflammatory Dermatoses","q":"Phototherapy is used in treating the following disease EXCEPT","o":[["A","Psoriasis."],["B","Systemic lupus erythematosus."],["C","Vitiligo."],["D","Alopecia areata."],["E","Atopic eczema."]],"a":"B","sa":null,"pg":"66","f":[],"n":85,"e":["Phototherapy treats psoriasis, vitiligo and alopecia areata, but lupus is photosensitive so it is avoided. Why the other options are wrong: A) Psoriasis: Phototherapy is used. C) Vitiligo: Phototherapy is used. D) Alopecia areata: Phototherapy is used. E) Atopic eczema: Phototherapy is used.","Phototherapy not for lupus."],"im":[]},{"id":"Q377","ch":"Inflammatory Dermatoses","q":"Discoid lupus erythematosus is best treated by","o":[["A","Topical antimalarials only."],["B","Topical antimalarials + systemic antimalarials."],["C","Topical antimalarials + topical steroids."],["D","Topical antimalarials + systemic steroids."],["E","Systemic antimalarials + topical steroids."]],"a":"E","sa":null,"pg":"66","f":[],"n":86,"e":["Extensive DLE is best treated with systemic antimalarials plus topical steroids, with sun avoidance. Why the other options are wrong: A) Topical antimalarials only: Antimalarials are oral, not topical. B) Topical antimalarials + systemic antimal…: There are no topical antimalarials; they are given orally. C) Topical antimalarials + topical steroids: There are no topical antimalarials; they are given orally. D) Topical antimalarials + systemic steroids: Antimalarials are oral and systemic steroids are not first-line.","Antimalarial + topical steroid."],"im":[]},{"id":"Q378","ch":"Inflammatory Dermatoses","q":"An oval skin lesion showing outer erythema, intermediate scaling, and inner healing center is called","o":[["A","Tinea circinata."],["B","Erysipelas."],["C","Herald patch of pityriasis rosea."],["D","Erythrasma."],["E","Scaly ringworm."]],"a":"C","sa":null,"pg":"63","f":[],"n":87,"e":["An oval lesion with outer erythema, intermediate scaling and an inner paler center is the herald patch of pityriasis rosea. Why the other options are wrong: A) Tinea circinata: Circinata has no collarette. B) Erysipelas: Erysipelas is hot. D) Erythrasma: Erythrasma is brown. E) Scaly ringworm: Scaly ringworm is scalp.","Three zones."],"im":[]},{"id":"Q543","ch":"Inflammatory Dermatoses","q":"Onycholysis may be seen in:","o":[["A","Lichen planus."],["B","Psoriasis."],["C","Onychomycosis."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"37","f":[],"n":88,"e":["Onycholysis (separation of the nail plate from the nail bed) occurs in psoriasis, lichen planus and onychomycosis, so all of the above is correct. Why the other options are wrong: A) Lichen planus: Lichen planus affects the nails. True, but B and C also cause onycholysis. B) Psoriasis: Nail psoriasis causes onycholysis. True, but A and C also do. C) Onychomycosis: Onychomycosis causes onycholysis. True, but A and B also do. E) None of the above: Wrong: A, B and C all cause it.","Onycholysis: psoriasis, LP, fungal nails, also trauma and thyroid disease."],"im":[]},{"id":"Q544","ch":"Inflammatory Dermatoses","q":"Methotrexate is:","o":[["A","An H-1 antagonist."],["B","A dihydrofolate reductase inhibitor."],["C","An H-2 antagonist."],["D","A beta adrenergic blocker."],["E","All of the above."]],"a":"B","sa":null,"pg":"56","f":[],"n":89,"e":["Methotrexate is a folate antagonist that inhibits dihydrofolate reductase, so it blocks DNA synthesis in rapidly dividing cells and is used in extensive psoriasis. H1 and H2 antagonists are antihistamines and beta blockers are cardiac drugs. Why the other options are wrong: A) An H-1 antagonist: H1 antagonists are antihistamines. C) An H-2 antagonist: H2 antagonists block acid. D) A beta adrenergic blocker: Beta blockers are cardiac. E) All of the above: Wrong: not all listed statements are correct.","Methotrexate: DHFR inhibitor; liver and marrow toxicity, teratogenic."],"im":[]},{"id":"Q545","ch":"Inflammatory Dermatoses","q":"A 20-year-old female presented with multiple oval erythematous patches distributed on the trunk and proximal limbs, parallel to the ribs forming a Christmas tree pattern. The condition started by a single larger lesion that was preceded by upper respiratory tract infection. The diagnosis is:","o":[["A","Lichen planus."],["B","Herpes simplex."],["C","Pityriasis rosea."],["D","Fixed drug eruption."]],"a":"C","sa":null,"pg":"63","f":[],"n":90,"e":["A single larger herald patch after an upper respiratory infection, followed by oval patches parallel to the ribs in a Christmas-tree pattern on the trunk and proximal limbs, is pityriasis rosea. Why the other options are wrong: A) Lichen planus: LP is violaceous. B) Herpes simplex: HSV is vesicular. D) Fixed drug eruption: FDE is a drug reaction.","Herald patch → Christmas tree = pityriasis rosea."],"im":[]},{"id":"H189","ch":"Inflammatory Dermatoses","q":"A 35-year-old male presents with scaly erythematous symmetrical plaques on extensor surfaces and a positive Auspitz sign. What is the most likely diagnosis?","o":[["A","Psoriasis."],["B","Atopic dermatitis."],["C","Lichen planus."],["D","Seborrheic dermatitis."],["E","Pityriasis rosea."]],"a":"A","sa":null,"pg":null,"f":[],"n":91,"e":["Symmetrical scaly erythematous extensor plaques with a positive Auspitz sign are psoriasis. Why the other options are wrong: B) Atopic dermatitis: Atopic is flexural. C) Lichen planus: LP is violaceous. D) Seborrheic dermatitis: Seb derm is greasy. E) Pityriasis rosea: PR follows a herald patch.","Extensors + Auspitz."],"im":[]},{"id":"H197","ch":"Inflammatory Dermatoses","q":"Actinic lichen planus usually affects:","o":[["A","Mucous membranes."],["B","Genitals."],["C","Upper back."],["D","Face."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":92,"e":["Actinic LP occurs on the sun-exposed face and dorsum of hands, so the face is correct. Why the other options are wrong: A) Mucous membranes: Mucosa is classic LP. B) Genitals: Genitals are classic LP. C) Upper back: Upper back is covered. E) None of the above: Face is correct.","Face."],"im":[]},{"id":"H198","ch":"Inflammatory Dermatoses","q":"Lichen planus actinicus usually affects:","o":[["A","Upper back."],["B","Genitalia."],["C","Nails."],["D","All of the above."],["E","None of the above."]],"a":"E","sa":null,"pg":null,"f":[],"n":93,"e":["Actinic LP is on sun-exposed skin, not upper back, genitals or nails per this key (none of the above). Why the other options are wrong: A) Upper back: It spares the back. B) Genitalia: It spares genitalia. C) Nails: It spares nails. D) All of the above: Wrong: not all listed statements are correct.","Sun-exposed."],"im":[]},{"id":"H199","ch":"Inflammatory Dermatoses","q":"Well-defined flat-topped, polyangular, violaceous, itchy papules are the primary lesions of:","o":[["A","Vitiligo."],["B","Lupus erythematosus."],["C","Lichen planus."],["D","Psoriasis."],["E","None of the above."]],"a":"C","sa":null,"pg":null,"f":[],"n":94,"e":["Flat-topped polyangular violaceous itchy papules are the primary lesion of lichen planus, unlike psoriasis (silvery scale) or lupus. Why the other options are wrong: A) Vitiligo: Vitiligo has macules. B) Lupus erythematosus: Lupus has atrophic plaques. D) Psoriasis: Psoriasis is scaly. E) None of the above: Wrong: at least one listed statement is correct.","LP."],"im":[]},{"id":"H201","ch":"Inflammatory Dermatoses","q":"Scarring alopecia may be caused by:","o":[["A","Psoriasis."],["B","Seborrheic dermatitis."],["C","Fever."],["D","Lichen planus."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":95,"e":["Lichen planus of the scalp destroys the follicles and causes scarring alopecia, unlike psoriasis, seborrheic dermatitis or fever. Why the other options are wrong: A) Psoriasis: Psoriasis is non-scarring. B) Seborrheic dermatitis: Seb derm is non-scarring. C) Fever: Fever causes shedding. E) None of the above: Wrong: at least one listed statement is correct.","LP can scar."],"im":[]},{"id":"H204","ch":"Inflammatory Dermatoses","q":"All of the following are types of lichen planus EXCEPT:","o":[["A","Actinic lichen planus."],["B","Pustular lichen planus."],["C","Annular lichen planus."],["D","Atrophic lichen planus."],["E","Hypertrophic lichen planus."]],"a":"B","sa":null,"pg":null,"f":[],"n":96,"e":["Types of LP include actinic, annular, atrophic and hypertrophic; there is no pustular LP. Why the other options are wrong: A) Actinic lichen planus: A type. C) Annular lichen planus: A type. D) Atrophic lichen planus: A type. E) Hypertrophic lichen planus: A type.","No pustular LP."],"im":[]},{"id":"H205","ch":"Inflammatory Dermatoses","q":"Flat-topped, violaceous, polygonal, itchy papules on the wrists are typical of:","o":[["A","Psoriasis."],["B","Lichen planus."],["C","Common warts."],["D","Seborrheic dermatitis."],["E","Lupus erythematosus."]],"a":"B","sa":null,"pg":null,"f":[],"n":97,"e":["Flat-topped violaceous polygonal itchy papules on the wrists are classic of lichen planus. Why the other options are wrong: A) Psoriasis: Psoriasis is silvery. C) Common warts: Warts are rough. D) Seborrheic dermatitis: Seb derm is greasy. E) Lupus erythematosus: Lupus is atrophic.","Wrists."],"im":[]},{"id":"H209","ch":"Inflammatory Dermatoses","q":"Regarding lichen planus, the following is TRUE:","o":[["A","It is a contagious disease."],["B","The primary lesion is a pearly white umbilicated papule."],["C","Never affects the oral mucosa."],["D","Can lead to cicatricial alopecia."],["E","Is due to HSV-7."]],"a":"D","sa":null,"pg":null,"f":[],"n":98,"e":["LP can cause cicatricial alopecia; it is not contagious, usually does affect the mouth, and the pearly umbilicated papule is molluscum. Why the other options are wrong: A) It is a contagious disease: It is not contagious. B) The primary lesion is a pearly white umb…: That is molluscum. C) Never affects the oral mucosa: It can affect the mouth. E) Is due to HSV-7: It is not viral.","LP scars scalp."],"im":[]},{"id":"H218","ch":"Inflammatory Dermatoses","q":"The primary lesion that precedes pityriasis rosea is:","o":[["A","Chicken pox."],["B","Primary herpetic gingivostomatitis."],["C","Herald patch."],["D","Stippling sign."],["E","Auspitz sign."]],"a":"C","sa":null,"pg":null,"f":[],"n":99,"e":["A single herald patch precedes the generalized eruption of pityriasis rosea; the Auspitz sign is psoriasis and stippling is DLE. Why the other options are wrong: A) Chicken pox: Chickenpox is a separate disease. B) Primary herpetic gingivostomatitis: Gingivostomatitis is HSV. D) Stippling sign: Stippling is DLE. E) Auspitz sign: Auspitz is psoriasis.","Herald patch."],"im":[]},{"id":"H219","ch":"Inflammatory Dermatoses","q":"An 18 years old girl came to the clinic complaining ofa skin rash of 10 days duration. On exam-ination,multiple oval lesions were scattered on the trunk in a “Christmas tree distribution. The primary lesion of this disease is:","o":[["A","Scaly erythema"],["B","Target lesion"],["C","Stippling sign"],["D","Nodule."],["E","Herald patch"]],"a":"E","sa":null,"pg":null,"f":[],"n":100,"e":["Oval lesions in a Christmas-tree distribution mean pityriasis rosea, whose primary lesion is the herald patch. Why the other options are wrong: A) Scaly erythema: Scaly erythema is not specific. B) Target lesion: Target is EM. C) Stippling sign: Stippling is DLE. D) Nodule: A nodule is not primary.","Herald patch."],"im":[]},{"id":"H221","ch":"Inflammatory Dermatoses","q":"PUVA may be used in the treatment of all of the following EXCEPT:","o":[["A","Psoriasis."],["B","Vitiligo."],["C","Discoid lupus erythematosus."],["D","Alopecia."],["E","None of the above."]],"a":"C","sa":null,"pg":null,"f":[],"n":101,"e":["PUVA treats psoriasis, vitiligo and alopecia areata, but not DLE, which is made worse by light. Why the other options are wrong: A) Psoriasis: PUVA treats it. B) Vitiligo: PUVA treats it. D) Alopecia: PUVA treats AA. E) None of the above: Not applicable.","DLE excluded."],"im":[]},{"id":"H224","ch":"Inflammatory Dermatoses","q":"The following findings are pathognomonic of discoid lupus erythematosus EXCEPT:","o":[["A","Erythema."],["B","Adherent scales."],["C","Dilated pilosebaceous orifices."],["D","Pustules."],["E","Telangiectasia."]],"a":"D","sa":null,"pg":null,"f":[],"n":102,"e":["Pustules are not a finding in DLE, unlike erythema, scales and dilated orifices. Why the other options are wrong: A) Erythema: Present. B) Adherent scales: Present. C) Dilated pilosebaceous orifices: Present. E) Telangiectasia: Present.","No pustules."],"im":[]},{"id":"H225","ch":"Inflammatory Dermatoses","q":"The clinical picture of discoid lupus erythematosus is:","o":[["A","Well-defined erythematous plaques covered with adherent scales."],["B","Ill-defined erythematous plaques covered with adherent scales."],["C","Ill-defined erythematous plaques covered with loose scales."],["D","Well-defined erythematous patches covered with adherent scales."],["E","Well-defined erythematous patches covered with loose scales."]],"a":"A","sa":null,"pg":null,"f":[],"n":103,"e":["DLE gives well-defined erythematous plaques covered by adherent scales, with dilated follicles beneath. Why the other options are wrong: B) Ill-defined erythematous plaques covered…: It is well defined. C) Ill-defined erythematous plaques covered…: It is well defined. D) Well-defined erythematous patches covere…: They are plaques. E) Well-defined erythematous patches covere…: They are plaques.","Adherent scales."],"im":[]},{"id":"H227","ch":"Inflammatory Dermatoses","q":"Discoid lupus erythematosus:","o":[["A","Usually occurs in semi-exposed areas."],["B","May be a manifestation of systemic lupus erythematosus."],["C","May end in cicatricial alopecia."],["D","Tropical antimalarials are very effective."],["E","May be confused with lichen planus."]],"a":"C","sa":null,"pg":null,"f":["More than one option is defensible (B and E are also true); the key is C."],"n":104,"e":["DLE of the scalp can end in cicatricial alopecia, and it improves with antimalarials but is not mainly at semi-exposed sites. Why the other options are wrong: A) Usually occurs in semi-exposed areas: DLE is sun-exposed. B) May be a manifestation of systemic lupus…: DLE can accompany SLE, so this is also arguable. D) Tropical antimalarials are very effective: There are no topical antimalarials. E) May be confused with lichen planus: It can resemble LP, so this is also arguable.","DLE scars."],"im":[]},{"id":"H229","ch":"Inflammatory Dermatoses","q":"A 32-year-old male patient presented with well-defined scaly erythematous plaques on his cheeks and nose with telangiectasia and atrophy. Plaques also showed dilatation of the pilosebaceous orifices. The condition started to appear about five years ago and showed remissions and exacerbations with some improvement during winter times. What is the diagnosis of this case?","o":[["A","Discoid lupus."],["B","Contact urticaria."],["C","Contact dermatitis."],["D","Psoriasis."],["E","Vitiligo."]],"a":"A","sa":null,"pg":null,"f":[],"n":105,"e":["Cheek and nose plaques with atrophy, telangiectasia, dilated orifices and chronic course improving in winter is discoid lupus. Why the other options are wrong: B) Contact urticaria: Urticaria has wheals. C) Contact dermatitis: Contact dermatitis is itchy. D) Psoriasis: Psoriasis has silvery scale. E) Vitiligo: Vitiligo is depigmented.","Sun-exposed face."],"im":[]},{"id":"Q379","ch":"Allergic Disorders","q":"In acute eczema, all of the following occurs EXCEPT","o":[["A","Erythema."],["B","Oozing."],["C","Lichenification."],["D","Vesicles."],["E","Crusting."]],"a":"C","sa":null,"pg":"67","f":[],"n":1,"e":["Acute eczema is the wet stage: erythema, edema, vesicles, oozing and crusting. Lichenification (thickened skin with accentuated lines) develops only after prolonged scratching, so it belongs to chronic eczema. Why the other options are wrong: A) Erythema: Occurs. B) Oozing: Occurs. D) Vesicles: Occurs. E) Crusting: Occurs.","Acute = vesicles/oozing; chronic = lichenification."],"im":[]},{"id":"Q380","ch":"Allergic Disorders","q":"Acute dermatitis presents by","o":[["A","Vesicles."],["B","Lichenification."],["C","Wheals."],["D","Pustules."],["E","Ulcers."]],"a":"A","sa":null,"pg":"67","f":[],"n":2,"e":["In the acute phase eczema presents with papules and vesicles on an erythematous edematous base, followed by oozing and crusts. Why the other options are wrong: B) Lichenification: That is chronic. C) Wheals: That is urticaria. D) Pustules: That is infection. E) Ulcers: That is infection.","Acute dermatitis → vesicles."],"im":[]},{"id":"Q381","ch":"Allergic Disorders","q":"Chronic eczema is characterized by one of the following","o":[["A","Erythema."],["B","Oozing."],["C","Lichenification."],["D","Vesicles."],["E","Pustules."]],"a":"C","sa":null,"pg":"67","f":[],"n":3,"e":["Chronic eczema results from prolonged, repeated attacks, giving lichenification, excoriations and pigment change. Erythema, oozing, vesicles and pustules are acute or infected features. Why the other options are wrong: A) Erythema: It occurs in acute. B) Oozing: Oozing is acute. D) Vesicles: Vesicles are acute. E) Pustules: Pustules are infection.","Chronic = lichenification."],"im":[]},{"id":"Q382","ch":"Allergic Disorders","q":"Chronic eczema is characterized by","o":[["A","Itching."],["B","Vesiculation."],["C","Lichenification."],["D","a + b."],["E","a + c."]],"a":"E","sa":null,"pg":"67","f":[],"n":4,"e":["Chronic eczema is itchy (a) and lichenified (c). Vesiculation (b) belongs to the acute stage, so a + c is correct. Why the other options are wrong: A) Itching: True but incomplete. B) Vesiculation: Vesicles are acute. C) Lichenification: True but incomplete. D) a + b: Vesicles are acute.","Itch + lichenification."],"im":[]},{"id":"Q383","ch":"Allergic Disorders","q":"A 4-month-old infant had bilateral erythematous plaques with vesicles, oozing and crusts on both cheeks. The child was very irritable. The most probable diagnosis is","o":[["A","Allergic contact dermatitis."],["B","Primary irritant dermatitis."],["C","Atopic dermatitis."],["D","Impetigo contagiosum."],["E","Molluscum contagiosum."]],"a":"C","sa":null,"pg":"68","f":[],"n":5,"e":["A 4-month-old with bilateral cheek erythema, vesicles, oozing and crusts has the infantile phase of atopic dermatitis, which starts after 2 months and involves the face and extensor surfaces. Seborrheic dermatitis in infants appears earlier with greasy scales. Why the other options are wrong: A) Allergic contact dermatitis: Allergic is contact-related. B) Primary irritant dermatitis: Irritant needs exposure. D) Impetigo contagiosum: Impetigo is crusted. E) Molluscum contagiosum: Molluscum is umbilicated.","Infantile atopic: cheeks."],"im":[]},{"id":"Q384","ch":"Allergic Disorders","q":"A male baby, 4 months old, presented with a reddish rash on his face. His mother reported that the baby was irritable and always crying. On examination, papules and vesicles were noted. (Clinical photo: infant with erythematous papulovesicular rash on the cheeks.) Diagnosis of this case is","o":[["A","Stasis dermatitis."],["B","Allergic dermatitis."],["C","Atopic dermatitis."],["D","Seborrheic dermatitis."],["E","Irritant dermatitis."]],"a":"C","sa":null,"pg":"68","f":[],"n":6,"e":["Facial weeping eczematous lesions in an infant fit infantile atopic dermatitis, often with a family history of atopy. Why the other options are wrong: A) Stasis dermatitis: Stasis is legs. B) Allergic dermatitis: Allergic follows contact. D) Seborrheic dermatitis: Seb derm is greasy. E) Irritant dermatitis: Irritant follows exposure.","Cheeks in infants."],"im":[]},{"id":"Q385","ch":"Allergic Disorders","q":"An infant with bilateral erythematous papulo-vesicular eruption of the cheeks with elevated IgE is suffering from","o":[["A","Atopic eczema."],["B","Varicose eczema."],["C","Dyshidrotic eczema."],["D","Stasis eczema."],["E","Impetigo contagiosum."]],"a":"A","sa":null,"pg":"68","f":[],"n":7,"e":["Bilateral papulovesicular cheek eruption in an infant with raised IgE indicates atopic eczema; atopy is mediated by IgE. Why the other options are wrong: B) Varicose eczema: Varicose is legs. C) Dyshidrotic eczema: Dyshidrotic is hands. D) Stasis eczema: Stasis is legs. E) Impetigo contagiosum: Impetigo is crusted.","IgE elevated in atopy."],"im":[]},{"id":"Q386","ch":"Allergic Disorders","q":"A 6-year-old child presented with groups of itchy papules involving the flexures & sides of the neck. The most probable diagnosis is","o":[["A","Varicose eczema."],["B","Contact eczema."],["C","Atopic eczema."],["D","Stasis eczema."],["E","Seborrheic eczema."]],"a":"C","sa":null,"pg":"68","f":[],"n":8,"e":["Itchy papules on the flexures and neck sides of a child are the childhood phase of atopic dermatitis, which prefers antecubital and popliteal fossae. Why the other options are wrong: A) Varicose eczema: Varicose is legs. B) Contact eczema: Contact follows exposure. D) Stasis eczema: Stasis is legs. E) Seborrheic eczema: Seb derm is greasy.","Child: flexures."],"im":[]},{"id":"Q387","ch":"Allergic Disorders","q":"A male baby, 4 months old, presented with a reddish rash on his face. His mother reported that the baby was irritable and always crying. On examination, papules and vesicles were noted. (Clinical photo: infant with erythematous papulovesicular rash on the cheeks.) One of the following statements about this disease is true","o":[["A","Transmitted by direct contact."],["B","Diagnosed by patch test."],["C","Heals with a scar."],["D","Family history is usually positive."],["E","Treated by topical retinoids."]],"a":"D","sa":null,"pg":"67","f":[],"n":9,"e":["Atopic dermatitis is a hereditary predisposition; family history of asthma, rhinitis or dermatitis is positive in 50-70%. It is not contagious and does not scar. Why the other options are wrong: A) Transmitted by direct contact: Atopic dermatitis is not contagious; it is an inherited atopic disease. B) Diagnosed by patch test: Patch test is for contact. C) Heals with a scar: It heals without scar. E) Treated by topical retinoids: Retinoids treat acne and keratinization disorders; atopic dermatitis needs emollients, topical steroids or calcineurin inhibitors.","Family history positive."],"im":[]},{"id":"Q388","ch":"Allergic Disorders","q":"The following characterizes atopic eczema","o":[["A","Antiseptic lotions are used for lichenified lesions."],["B","In infants, lichenified lesions are common."],["C","In children, it is common on cheeks."],["D","In adults, it is common on flexor areas."],["E","Pruritus is absent."]],"a":"D","sa":null,"pg":"69","f":[],"n":10,"e":["In adults the lesions are like childhood ones with lichenification, common in flexures (flexor areas). Infants favor the face and extensors. Why the other options are wrong: A) Antiseptic lotions are used for lichenif…: Antiseptics are for oozing. B) In infants, lichenified lesions are common: Infants have vesicles. C) In children, it is common on cheeks: Children have flexures. E) Pruritus is absent: It is itchy.","Adult atopic: flexural, lichenified."],"im":[]},{"id":"Q389","ch":"Allergic Disorders","q":"Sites of atopic dermatitis in the infantile and childhood phases are ___","o":[],"a":null,"sa":"Infantile phase: face, neck, extensor extremities (and flexures); childhood phase: flexures, particularly antecubital and popliteal fossae (also face, neck, extensors).","pg":"68","f":[],"n":11,"e":["Infantile phase: face, neck, extensor extremities (and flexures). Childhood phase: flexures, particularly antecubital and popliteal fossae, plus face and neck.","Infant face/extensors; child flexures."],"im":[]},{"id":"Q390","ch":"Allergic Disorders","q":"A 9-year-old female has recurrent itchy papulo-vesicular lesions on the antecubital and popliteal fossae. Her mother gave a history that the child had similar lesions on the cheeks since she was one year old. The best treatment for this condition is","o":[["A","Terbinafine."],["B","Acyclovir."],["C","Dapsone."],["D","Topical steroids."],["E","Electrocautery."]],"a":"D","sa":null,"pg":"75","f":[],"n":12,"e":["Recurrent itchy papulovesicular lesions in the elbow and knee flexures, with facial lesions in infancy, are atopic dermatitis; topical corticosteroids (with moisturizers) are the treatment. Terbinafine, acyclovir and dapsone treat other conditions. Why the other options are wrong: A) Terbinafine: Terbinafine is antifungal. B) Acyclovir: Acyclovir is antiviral. C) Dapsone: Dapsone is for leprosy. E) Electrocautery: Cautery is for warts.","Moisturizer + topical steroid."],"im":[]},{"id":"Q391","ch":"Allergic Disorders","q":"Seborrheic dermatitis may be treated by","o":[["A","Olive oil in infantile scalp lesions."],["B","Topical antifungals."],["C","Topical steroids."],["D","Selenium sulphide."],["E","All of the above."]],"a":"E","sa":null,"pg":"75","f":[],"n":13,"e":["Seborrheic dermatitis (due to the yeast Malassezia) is treated with oils for infantile scalp crusts, topical antifungals, mild steroids and selenium sulfide shampoos, so all options apply. Why the other options are wrong: A) Olive oil in infantile scalp lesions: Olive oil softens infantile scalp scales (cradle cap). True, but B, C and D also help. B) Topical antifungals: Topical antifungals act on Malassezia. True, but A, C and D also help. C) Topical steroids: Topical steroids settle the inflammation. True, but A, B and D also help. D) Selenium sulphide: Selenium sulphide is antiseborrheic and antifungal. True, but A, B and C also help.","Oil, antifungal, steroid, selenium."],"im":[]},{"id":"Q392","ch":"Allergic Disorders","q":"Allergic contact dermatitis","o":[["A","Is an immunological reaction."],["B","Occurs in any individual soon after exposure."],["C","Can be caused by acids or alkalis."],["D","Can occur due to cumulative damage by mild irritants."],["E","Occurs in compulsive washers."]],"a":"A","sa":null,"pg":"72","f":[],"n":14,"e":["Allergic contact dermatitis is a delayed immunological reaction in sensitized individuals after exposure to an allergen. Irritant dermatitis, by contrast, is non-immunological. Why the other options are wrong: B) Occurs in any individual soon after expo…: It needs sensitization. C) Can be caused by acids or alkalis: That is irritant. D) Can occur due to cumulative damage by mi…: That is irritant. E) Occurs in compulsive washers: That is irritant.","Allergic = immune; irritant = direct damage."],"im":[]},{"id":"Q393","ch":"Allergic Disorders","q":"A female patient, 18 years old, presented with an itchy rash on the dorsa of both hands and forearms. The condition started 2 days after henna application with a gradual onset and a progressive course. Patient reported that she once applied henna a year ago and no rash appeared then. What is the diagnosis of this case?","o":[["A","Psoriasis vulgaris."],["B","Irritant dermatitis."],["C","Allergic dermatitis."],["D","Neurodermatitis."],["E","Lichen planus."]],"a":"C","sa":null,"pg":"72","f":[],"n":15,"e":["A localized eczematous rash occurring at the site of contact is allergic contact dermatitis; confirm with patch test. Why the other options are wrong: A) Psoriasis vulgaris: Psoriasis is scaly. B) Irritant dermatitis: Irritant needs exposure. D) Neurodermatitis: Neurodermatitis is chronic. E) Lichen planus: LP is violaceous.","Rash follows contact."],"im":[]},{"id":"Q394","ch":"Allergic Disorders","q":"A 33-year-old man develops severely itchy vesicular lesions at the sites of contact with a leather belt. Lesions are confined to the waistband area. Patch testing is positive for nickel. The most likely diagnosis is","o":[["A","Seborrheic dermatitis."],["B","Allergic contact dermatitis."],["C","Atopic dermatitis."],["D","Stasis dermatitis."],["E","Angioedema."]],"a":"B","sa":null,"pg":"72","f":[],"n":16,"e":["Vesicles confined to the belt buckle area with a positive nickel patch test prove allergic contact dermatitis to nickel. Seborrheic, atopic and stasis dermatitis have different distributions. Why the other options are wrong: A) Seborrheic dermatitis: Seb derm is greasy. C) Atopic dermatitis: Atopic is flexural. D) Stasis dermatitis: Stasis is legs. E) Angioedema: Angioedema is deep swelling.","Nickel patch test +."],"im":[]},{"id":"Q395","ch":"Allergic Disorders","q":"A 17-year-old female presents with a pruritic rash localized to the wrist. Papules and vesicles are noted in a band-like pattern, with slight oozing from some lesions. Which of the following is the most likely cause of the rash?","o":[["A","Stasis dermatitis."],["B","Herpes zoster."],["C","Atopic dermatitis."],["D","Seborrheic dermatitis."],["E","Contact dermatitis."]],"a":"E","sa":null,"pg":"72","f":[],"n":17,"e":["A band-like rash on the wrist suggests contact with a watch or bracelet: contact dermatitis. Herpes zoster is dermatomal and stasis dermatitis occurs in the legs. Why the other options are wrong: A) Stasis dermatitis: Stasis is legs. B) Herpes zoster: Zoster is dermatomal. C) Atopic dermatitis: Atopic is flexural. D) Seborrheic dermatitis: Seb derm is greasy.","Band-like pattern = contact."],"im":[]},{"id":"Q396","ch":"Allergic Disorders","q":"A female patient, 21 years old, presented with a rash on the dorsa of both feet. Rash was severely itchy. (Clinical photo: erythematous eczematous rash on the dorsa of both feet at the sites of sandal straps.) What is the diagnosis of this case?","o":[["A","Irritant dermatitis."],["B","Papular urticaria."],["C","Stasis eczema."],["D","Neurodermatitis."],["E","Allergic dermatitis."]],"a":"E","sa":null,"pg":null,"f":[],"n":18,"e":["A rash at the area of contact with a shoe or ornament is allergic dermatitis, diagnosed by patch testing. Why the other options are wrong: A) Irritant dermatitis: Irritant needs exposure. B) Papular urticaria: Papular urticaria is bites. C) Stasis eczema: Stasis is leg. D) Neurodermatitis: Neurodermatitis is chronic.","Contact allergen."],"im":[]},{"id":"Q397","ch":"Allergic Disorders","q":"Patch test is useful for diagnosis of","o":[["A","Atopic dermatitis."],["B","Stasis dermatitis."],["C","Urticaria."],["D","Irritant contact dermatitis."],["E","Allergic contact dermatitis."]],"a":"E","sa":null,"pg":null,"f":[],"n":19,"e":["Patch testing detects type IV hypersensitivity, so it is used for allergic contact dermatitis (not for urticaria or atopic dermatitis). Why the other options are wrong: A) Atopic dermatitis: Atopic is clinical. B) Stasis dermatitis: Stasis is clinical. C) Urticaria: Urticaria uses prick tests. D) Irritant contact dermatitis: Irritant has no patch test.","Patch test = allergic contact."],"im":[]},{"id":"Q398","ch":"Allergic Disorders","q":"Acute oozing skin conditions are best treated by","o":[["A","Powders."],["B","Ointments."],["C","Creams."],["D","Drying lotions."],["E","Emulsions."]],"a":"D","sa":null,"pg":"75","f":[],"n":20,"e":["Weeping lesions are dried with drying antiseptic lotions (potassium permanganate, aluminum acetate). Ointments and creams would macerate the skin. Why the other options are wrong: A) Powders: Powders are for dry. B) Ointments: Ointments macerate. C) Creams: Creams macerate. E) Emulsions: Emulsions are for subacute.","Wet lesions: lotions; chronic dry lesions: ointments."],"im":[]},{"id":"Q399","ch":"Allergic Disorders","q":"An acute eruption of intensely itchy papules or wheals is called","o":[["A","Acne vulgaris."],["B","Pityriasis rosea."],["C","Psoriasis."],["D","Urticaria."],["E","Scabies."]],"a":"D","sa":null,"pg":"77","f":[],"n":21,"e":["Urticaria is an itchy eruption of raised wheals appearing suddenly; it is acute if shorter than 6 weeks. Why the other options are wrong: A) Acne vulgaris: Acne is not itchy. B) Pityriasis rosea: PR is scaly. C) Psoriasis: Psoriasis is scaly. E) Scabies: Scabies has burrows.","Wheals = urticaria."],"im":[]},{"id":"Q400","ch":"Allergic Disorders","q":"The primary lesion of urticaria is","o":[["A","Papule."],["B","Vesicle."],["C","Macule."],["D","Pustule."],["E","Wheal."]],"a":"E","sa":null,"pg":"77","f":[],"n":22,"e":["The wheal is a transient edematous elevation and is the primary lesion of urticaria. Why the other options are wrong: A) Papule: Papule is persistent. B) Vesicle: Vesicle is fluid. C) Macule: Macule is flat. D) Pustule: Pustule is pus.","Wheal."],"im":[]},{"id":"Q401","ch":"Allergic Disorders","q":"The picture shows one of the primary lesions of the skin: a transient, edematous, erythematous or skin-colored elevation of the skin of variable sizes. (Clinical photo: erythematous edematous wheals.) This primary lesion is characteristic of","o":[["A","Psoriasis."],["B","Herpes simplex."],["C","Urticaria."],["D","Warts."],["E","Molluscum contagiosum."]],"a":"C","sa":null,"pg":"77","f":[],"n":23,"e":["The transient edematous plaque pictured is the wheal, characteristic of urticaria. Why the other options are wrong: A) Psoriasis: Psoriasis is scaly. B) Herpes simplex: HSV is vesicular. D) Warts: Warts are rough. E) Molluscum contagiosum: Molluscum is umbilicated.","Wheal."],"im":[]},{"id":"Q402","ch":"Allergic Disorders","q":"Scarring is NOT found in","o":[["A","Discoid lupus erythematosus."],["B","Favus."],["C","Acne vulgaris."],["D","Ecthyma."],["E","Urticaria."]],"a":"E","sa":null,"pg":"6","f":[],"n":24,"e":["Urticarial wheals are due to dermal edema that resolves without leaving a scar. Ecthyma, DLE and kerion can scar. Why the other options are wrong: A) Discoid lupus erythematosus: DLE scars. B) Favus: Favus scars. C) Acne vulgaris: Acne scars. D) Ecthyma: Ecthyma scars.","Urticaria: no scar."],"im":[]},{"id":"Q403","ch":"Allergic Disorders","q":"A male patient, 52 years old, presented with sudden appearance of a reddish rash on his back, both upper limbs and extended to the lower limbs. Rash was itchy. There was no fever. (Clinical photo: large erythematous edematous wheals on the back.) Diagnosis of this case is","o":[["A","Stevens-Johnson syndrome."],["B","Erythema multiforme."],["C","Angioedema."],["D","Urticaria."],["E","Fixed drug eruption."]],"a":"D","sa":null,"pg":"77","f":[],"n":25,"e":["A sudden itchy rash over the back and limbs without fever is urticaria; erythema multiforme gives target lesions and SJS gives mucosal erosions. Why the other options are wrong: A) Stevens-Johnson syndrome: SJS has mucosal erosions. B) Erythema multiforme: EM has targets. C) Angioedema: Angioedema is deep. E) Fixed drug eruption: FDE is fixed.","Fleeting itchy wheals."],"im":[]},{"id":"Q404","ch":"Allergic Disorders","q":"Angioedema can be life threatening as it causes","o":[["A","Arrhythmias."],["B","Renal failure."],["C","Retinopathy."],["D","Myalgia."],["E","Laryngeal edema."]],"a":"E","sa":null,"pg":"77","f":[],"n":26,"e":["Angioedema involves the deep dermis and hypodermis and can involve the larynx, causing airway obstruction. Why the other options are wrong: A) Arrhythmias: Angioedema is deep dermal/subcutaneous swelling; the danger is airway obstruction from laryngeal edema, not this. B) Renal failure: Angioedema is deep dermal/subcutaneous swelling; the danger is airway obstruction from laryngeal edema, not this. C) Retinopathy: Angioedema is deep dermal/subcutaneous swelling; the danger is airway obstruction from laryngeal edema, not this. D) Myalgia: Angioedema is deep dermal/subcutaneous swelling; the danger is airway obstruction from laryngeal edema, not this.","Laryngeal edema."],"im":[]},{"id":"Q405","ch":"Allergic Disorders","q":"Angioedema","o":[["A","Is an emergency condition."],["B","Is a severe form of eczema."],["C","Is treated by antibiotics."],["D","Acetylcholine is the mediator."],["E","Is due to lymphedema."]],"a":"A","sa":null,"pg":"77","f":[],"n":27,"e":["Because it may involve the larynx, angioedema is an emergency needing immediate treatment; it is not an eczema or lymphedema. Why the other options are wrong: B) Is a severe form of eczema: It is not eczema. C) Is treated by antibiotics: Antibiotics do not help. D) Acetylcholine is the mediator: Acetylcholine is cholinergic. E) Is due to lymphedema: It is not lymphedema.","Emergency."],"im":[]},{"id":"Q406","ch":"Allergic Disorders","q":"The following type of urticaria may be life threatening","o":[["A","Papular urticaria."],["B","Cholinergic urticaria."],["C","Dermographism."],["D","Angioedema."],["E","None of the above."]],"a":"D","sa":null,"pg":"77","f":[],"n":28,"e":["Angioedema is the urticarial variant that can threaten life through laryngeal edema. Why the other options are wrong: A) Papular urticaria: Papular is bites. B) Cholinergic urticaria: Cholinergic is mild. C) Dermographism: Dermographism is mild. E) None of the above: Wrong: at least one listed statement is correct.","Angioedema."],"im":[]},{"id":"Q407","ch":"Allergic Disorders","q":"Choose the correct answer","o":[["A","Lichen planus is caused by pox virus."],["B","The treatment of choice of discoid lupus erythematosus is PUVA."],["C","Herald patch is the primary lesion of urticaria."],["D","Angioedema could be life threatening."],["E","Alopecia areata is a form of cicatricial alopecia."]],"a":"D","sa":null,"pg":"77","f":[],"n":29,"e":["Angioedema could be life threatening due to laryngeal edema and respiratory obstruction. Why the other options are wrong: A) Lichen planus is caused by pox virus: LP is not viral. B) The treatment of choice of discoid lupus…: DLE uses antimalarials. C) Herald patch is the primary lesion of ur…: Herald is PR. E) Alopecia areata is a form of cicatricial…: AA is non-scarring.","Airway."],"im":[]},{"id":"Q408","ch":"Allergic Disorders","q":"Histamine is the main mediator of","o":[["A","Contact dermatitis."],["B","Urticaria."],["C","Atopic dermatitis."],["D","Psoriasis."],["E","Discoid lupus erythematosus."]],"a":"B","sa":null,"pg":"77","f":[],"n":30,"e":["Histamine released from mast cells is the principal mediator of urticaria, with prostaglandins and leukotrienes. Why the other options are wrong: A) Contact dermatitis: Contact is type IV. C) Atopic dermatitis: Atopic is IgE-related. D) Psoriasis: Psoriasis is T-cell. E) Discoid lupus erythematosus: DLE is autoimmune.","Histamine."],"im":[]},{"id":"Q409","ch":"Allergic Disorders","q":"Urticaria is","o":[["A","Type I hypersensitivity reaction."],["B","Type II hypersensitivity reaction."],["C","Type III hypersensitivity reaction."],["D","Type IV hypersensitivity reaction."],["E","None of the above."]],"a":"A","sa":null,"pg":"77","f":[],"n":31,"e":["Urticaria is a type I (IgE-mediated) hypersensitivity, although cholinergic types act through acetylcholine-stimulated mast cells. Why the other options are wrong: B) Type II hypersensitivity reaction: Type II is cytotoxic. C) Type III hypersensitivity reaction: Type III is immune complex. D) Type IV hypersensitivity reaction: Type IV is delayed. E) None of the above: Wrong: at least one listed statement is correct.","Type I; allergic contact is type IV."],"im":[]},{"id":"Q410","ch":"Allergic Disorders","q":"The primary effector cell in urticaria pathogenesis is the","o":[["A","Keratinocyte."],["B","Neutrophil."],["C","Mast cell."],["D","Melanocyte."],["E","Langerhans cell."]],"a":"C","sa":null,"pg":null,"f":[],"n":32,"e":["The mast cell is the primary effector cell: IgE bound to mast cells triggers degranulation on re-exposure. Why the other options are wrong: A) Keratinocyte: Keratinocytes are structural. B) Neutrophil: Neutrophils are not primary. D) Melanocyte: Melanocytes make pigment. E) Langerhans cell: Langerhans cells present antigen.","Mast cell."],"im":[]},{"id":"Q411","ch":"Allergic Disorders","q":"Pathogenesis of urticaria is through","o":[["A","Vasoconstriction of blood vessels."],["B","Exaggerated cell-mediated immune response."],["C","Plasma cell activation."],["D","IgD-mediated allergic reaction."],["E","Increased capillary permeability."]],"a":"E","sa":null,"pg":"77","f":[],"n":33,"e":["Mediators such as histamine increase capillary permeability, producing dermal edema (wheal). Vasoconstriction is not involved. Why the other options are wrong: A) Vasoconstriction of blood vessels: It is vasodilatation. B) Exaggerated cell-mediated immune response: It is not cell-mediated. C) Plasma cell activation: Plasma cells are not involved. D) IgD-mediated allergic reaction: IgE, not IgD.","Permeability ↑, vasodilatation."],"im":[]},{"id":"Q412","ch":"Allergic Disorders","q":"Which of the following is TRUE about urticaria?","o":[["A","In the ordinary type, the main mediator is acetylcholine."],["B","It involves skin and mucous membranes."],["C","Adrenaline is the treatment of the papular type."],["D","Wheal is caused by vasoconstriction."],["E","In cholinergic urticaria, the mediator is cholestyramine."]],"a":"B","sa":null,"pg":"77","f":[],"n":34,"e":["Urticaria can affect skin and mucous membranes (e.g. lips, oral mucosa). Adrenaline is for severe cases, not the papular type, and acetylcholine mediates only cholinergic urticaria. Why the other options are wrong: A) In the ordinary type, the main mediator…: Histamine is the mediator. C) Adrenaline is the treatment of the papul…: Adrenaline is for angioedema. D) Wheal is caused by vasoconstriction: It is vasodilatation. E) In cholinergic urticaria, the mediator i…: Cholestyramine is not the mediator.","Skin + mucosa."],"im":[]},{"id":"Q413","ch":"Allergic Disorders","q":"Physical urticaria includes all of the following EXCEPT","o":[["A","Solar urticaria."],["B","Papular urticaria."],["C","Pressure urticaria."],["D","Heat urticaria."],["E","None of the above."]],"a":"B","sa":null,"pg":"78","f":[],"n":35,"e":["Physical urticaria (solar, cold, heat, aquagenic, dermographism, pressure) is provoked by physical stimuli. Papular urticaria is a hypersensitivity to insect bites. Why the other options are wrong: A) Solar urticaria: Physical. C) Pressure urticaria: Physical. D) Heat urticaria: Physical. E) None of the above: Wrong: at least one listed statement is correct.","Papular urticaria ≠ physical."],"im":[]},{"id":"Q414","ch":"Allergic Disorders","q":"A 33-year-old female patient presented with erythematous, edematous, evanescent itchy lesions on her back of variable sizes. Patient stated that they always appear at sites of exposure to pressure on her skin. (Clinical photo: linear erythematous wheals on the back.) What is the diagnosis of this case?","o":[["A","Acute eczema."],["B","Erythema multiforme."],["C","Chronic spontaneous urticaria."],["D","Physical urticaria."],["E","Lichen planus."]],"a":"D","sa":null,"pg":"78","f":[],"n":36,"e":["Wheals induced by physical stimuli such as pressure, cold, heat, sun or water indicate physical (chronic inducible) urticaria. Why the other options are wrong: A) Acute eczema: Eczema is scaly. B) Erythema multiforme: EM has targets. C) Chronic spontaneous urticaria: Spontaneous has no trigger. E) Lichen planus: LP is violaceous.","Physical trigger."],"im":[]},{"id":"Q415","ch":"Allergic Disorders","q":"Cholinergic urticaria is induced by which of the following precipitating factors","o":[["A","Foods as fish, milk, eggs or strawberries."],["B","Drugs as salicylates, antibiotics or NSAIDs."],["C","Blood elements."],["D","Insect bites."],["E","Sweating, physical effort, psychological stress or increased environmental temperature."]],"a":"E","sa":null,"pg":"79","f":[],"n":37,"e":["Cholinergic urticaria follows sweating from physical effort, emotional stress or heat; acetylcholine stimulates mast cells, giving 1-3 mm wheals lasting less than an hour. Why the other options are wrong: A) Foods as fish, milk, eggs or strawberries: Foods cause ordinary urticaria. B) Drugs as salicylates, antibiotics or NSA…: Drugs cause ordinary urticaria. C) Blood elements: Blood elements cause other types. D) Insect bites: Bites cause papular.","Small wheals with sweating."],"im":[]},{"id":"Q416","ch":"Allergic Disorders","q":"A 22-year-old woman developed small itchy wheals after physical exertion, walking in the sun, eating hot spicy food and when she was angry. The most likely diagnosis is","o":[["A","Chronic idiopathic urticaria."],["B","Heat urticaria."],["C","Solar urticaria."],["D","Cholinergic urticaria."],["E","Papular urticaria."]],"a":"D","sa":null,"pg":"79","f":[],"n":38,"e":["Small itchy wheals provoked by exertion, hot spicy food, sun and anger are cholinergic urticaria. Solar and heat urticaria are induced by sun or heat alone. Why the other options are wrong: A) Chronic idiopathic urticaria: Idiopathic has no trigger. B) Heat urticaria: Heat urticaria is local. C) Solar urticaria: Solar needs sun. E) Papular urticaria: Papular is bites.","Sweat-induced."],"im":[]},{"id":"Q417","ch":"Allergic Disorders","q":"The mainstay of treatment of urticaria is","o":[["A","Topical corticosteroids."],["B","Topical antihistamines."],["C","Oral antihistamines."],["D","Oral erythromycin."],["E","Emollients and moisturizers."]],"a":"C","sa":null,"pg":"79","f":[],"n":39,"e":["Systemic antihistamines are the mainstay; topical agents and erythromycin do not control wheals. Why the other options are wrong: A) Topical corticosteroids: Topical steroids do not help. B) Topical antihistamines: Topical antihistamines are weak. D) Oral erythromycin: Erythromycin is antibacterial. E) Emollients and moisturizers: Emollients do not help.","Oral antihistamine."],"im":[]},{"id":"Q418","ch":"Allergic Disorders","q":"A 35-year-old woman develops an itchy rash over her back, legs, and trunk several hours after swimming in a lake. Erythematous edematous papules and plaques are noted. Lesions vary in size. There are no mucosal lesions and no swelling of the lips. What is best first step in management of her symptomatic rash?","o":[["A","Subcutaneous epinephrine."],["B","Intravenous glucocorticoids."],["C","Oral antihistamines."],["D","Aspirin."],["E","Doxycycline."]],"a":"C","sa":null,"pg":"79","f":[],"n":40,"e":["Urticaria after swimming (cold or water contact) is treated with oral antihistamines. Why the other options are wrong: A) Subcutaneous epinephrine: Epinephrine is for emergencies. B) Intravenous glucocorticoids: Steroids are for severe. D) Aspirin: Aspirin worsens. E) Doxycycline: Doxycycline is antibacterial.","H1 blocker."],"im":[]},{"id":"Q419","ch":"Allergic Disorders","q":"Systemic treatment of urticaria includes","o":[["A","Corticosteroids."],["B","Antihistamines."],["C","Adrenaline."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"79","f":[],"n":41,"e":["Systemic options are antihistamines (mainstay), corticosteroids for short courses, and adrenaline in emergencies, so all of the above. Why the other options are wrong: A) Corticosteroids: Corticosteroids are used in severe acute urticaria. True, but B and C are also used. B) Antihistamines: Antihistamines are first-line. True, but A and C are also used. C) Adrenaline: Adrenaline is used in acute severe urticaria or angioedema. True, but A and B are also used. E) None of the above: Wrong: A, B and C are all used.","All."],"im":[]},{"id":"Q420","ch":"Allergic Disorders","q":"Which of the following is TRUE about urticaria?","o":[["A","It is treated by intravenous corticosteroids in severe cases."],["B","It is a type II hypersensitivity reaction."],["C","Acetylcholine is the mediator of the papular type."],["D","Cholinergic type may be caused by intestinal parasites."],["E","Intravenous adrenaline is life saving."]],"a":"A","sa":null,"pg":"79","f":[],"n":42,"e":["Severe urticaria and angioedema may need IV antihistamines and IV corticosteroids. Why the other options are wrong: B) It is a type II hypersensitivity reaction: It is type I. C) Acetylcholine is the mediator of the pap…: Acetylcholine is cholinergic. D) Cholinergic type may be caused by intest…: Parasites cause other types. E) Intravenous adrenaline is life saving: Intravenous adrenaline is risky.","IV steroids severe."],"im":[]},{"id":"Q421","ch":"Allergic Disorders","q":"SC adrenaline is life saving in patients suffering from","o":[["A","Angioedema."],["B","Papular urticaria."],["C","Aquagenic urticaria."],["D","Cholinergic urticaria."],["E","Solar urticaria."]],"a":"A","sa":null,"pg":null,"f":[],"n":43,"e":["Adrenaline (epinephrine) 300-500 mcg SC or IM is life-saving for angioedema involving the oropharynx or larynx, and anaphylaxis. Why the other options are wrong: B) Papular urticaria: Papular is mild. C) Aquagenic urticaria: Aquagenic is mild. D) Cholinergic urticaria: Cholinergic is mild. E) Solar urticaria: Solar is mild.","Adrenaline."],"im":[]},{"id":"Q422","ch":"Allergic Disorders","q":"The following therapy is a life-saving measure in laryngeal angioedema","o":[["A","IV adrenaline."],["B","SC adrenaline."],["C","IV corticosteroids."],["D","IM corticosteroids."],["E","Antihistamines."]],"a":"B","sa":null,"pg":null,"f":[],"n":44,"e":["In laryngeal angioedema SC (or IM) adrenaline rapidly reverses airway edema, while antihistamines alone are slower. Why the other options are wrong: A) IV adrenaline: IV adrenaline is risky. C) IV corticosteroids: Steroids are slow. D) IM corticosteroids: Steroids are slow. E) Antihistamines: Antihistamines are slow.","Adrenaline first."],"im":[]},{"id":"Q423","ch":"Allergic Disorders","q":"The following therapy is a life saving measure in acute urticaria","o":[["A","IV adrenaline."],["B","Topical corticosteroids."],["C","SC adrenaline."],["D","IM methotrexate."],["E","Oral antihistamines."]],"a":"C","sa":null,"pg":"79","f":["Key says SC adrenaline in acute urticaria; adrenaline is normally reserved for angioedema/anaphylaxis. Please verify."],"n":45,"e":["Per the book's key, SC adrenaline is the life-saving measure; strictly, adrenaline is reserved for angioedema/anaphylaxis, not routine acute urticaria. Flagged for your review. Why the other options are wrong: A) IV adrenaline: IV adrenaline is risky. B) Topical corticosteroids: Topicals do not help. D) IM methotrexate: Methotrexate is unrelated. E) Oral antihistamines: Antihistamines are routine.","Adrenaline for airway."],"im":[]},{"id":"Q424","ch":"Allergic Disorders","q":"A 25-year-old female presented with puffiness of both eyes and lips with difficulty in breathing. The following is a proper life-saving treatment for her","o":[["A","0.5 ml 1/100 adrenaline IV."],["B","0.5 ml 1/1000 adrenaline SC."],["C","1,000,000 IU penicillin IV."],["D","5 ml adrenaline 1/100 solution SC."],["E","Calamine lotion compresses on involved sites."]],"a":"B","sa":null,"pg":"79","f":[],"n":46,"e":["Eyelid and lip swelling with breathing difficulty is angioedema, an emergency; give adrenaline 0.5 ml of 1/1000 SC (300-500 mcg). Why the other options are wrong: A) 0.5 ml 1/100 adrenaline IV: IV and 1/100 is dangerous. C) 1,000,000 IU penicillin IV: Penicillin is unrelated. D) 5 ml adrenaline 1/100 solution SC: 5 ml of 1/100 is a lethal dose. E) Calamine lotion compresses on involved s…: Calamine is symptomatic.","Adrenaline 0.5 ml 1/1000."],"im":[]},{"id":"Q425","ch":"Allergic Disorders","q":"All the following drugs may be used in treatment of angioedema except","o":[["A","Corticosteroids."],["B","Adrenaline."],["C","Hydroxyzine."],["D","Salicylate."],["E","Chlorpheniramine maleate."]],"a":"D","sa":null,"pg":"79","f":[],"n":47,"e":["Corticosteroids, adrenaline and antihistamines (hydroxyzine, chlorpheniramine) are used. Salicylates (aspirin) can actually trigger urticaria/angioedema. Why the other options are wrong: A) Corticosteroids: Corticosteroids are used in severe cases. B) Adrenaline: Adrenaline is used for laryngeal edema. C) Hydroxyzine: Hydroxyzine is a sedating antihistamine. E) Chlorpheniramine maleate: Chlorpheniramine is an antihistamine.","Avoid aspirin/NSAIDs."],"im":[]},{"id":"Q426","ch":"Allergic Disorders","q":"Cutaneous drug reactions may present with the following EXCEPT","o":[["A","Acneform eruption."],["B","Lichenoid eruption."],["C","Neuralgia."],["D","Bullous eruption."],["E","Erythroderma."]],"a":"C","sa":null,"pg":"80","f":[],"n":48,"e":["Drug eruptions may appear as exanthematous, urticarial, acneiform, lichenoid, bullous or erythrodermic reactions. Neuralgia is not a cutaneous reaction. Why the other options are wrong: A) Acneform eruption: Occurs. B) Lichenoid eruption: Occurs. D) Bullous eruption: Occurs. E) Erythroderma: Occurs.","Neuralgia not a rash."],"im":[]},{"id":"Q427","ch":"Allergic Disorders","q":"Drug eruptions may be","o":[["A","Eczematous."],["B","Acneiform."],["C","Pigmented."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"80","f":[],"n":49,"e":["Drugs can cause eczematous, acneiform and pigmented eruptions as well as urticarial and fixed reactions. Why the other options are wrong: A) Eczematous: Eczematous drug eruptions occur. True, but B and C occur too. B) Acneiform: Acneiform drug eruptions occur. True, but A and C occur too. C) Pigmented: Fixed drug eruption leaves pigmentation. True, but A and B occur too. E) None of the above: Wrong: all three occur.","Many patterns."],"im":[]},{"id":"Q428","ch":"Allergic Disorders","q":"Exanthematous drug reaction presents by","o":[["A","Papules on an erythematous background."],["B","Vesicles and bullae."],["C","Wheals."],["D","Pustules."],["E","Violaceous macules and patches."]],"a":"A","sa":null,"pg":"80","f":[],"n":50,"e":["Exanthematous reactions produce papules on an erythematous background that start proximally and generalize in 1-2 days, with marked pruritus. Why the other options are wrong: B) Vesicles and bullae: That is bullous. C) Wheals: That is urticarial. D) Pustules: That is pustular. E) Violaceous macules and patches: That is FDE.","Morbilliform."],"im":[]},{"id":"Q429","ch":"Allergic Disorders","q":"Acneform drug eruption is commonly caused by which of the following drug?","o":[["A","Analgesics."],["B","Corticosteroids."],["C","Tetracyclines."],["D","Penicillins."],["E","Erythromycin."]],"a":"B","sa":null,"pg":"81","f":[],"n":51,"e":["Corticosteroids and anti-epileptics cause acneiform eruptions, which lack comedones. Tetracyclines treat acne. Why the other options are wrong: A) Analgesics: Analgesics are not typical. C) Tetracyclines: Tetracyclines treat acne. D) Penicillins: Penicillins cause rash. E) Erythromycin: Erythromycin treats acne.","Steroid acne: no comedones."],"im":[]},{"id":"Q430","ch":"Allergic Disorders","q":"A 20-year-old male patient had fever and a sore throat for which he received sulphamethoxazole- trimethoprim. The next day, he developed a violaceous macule on his lip. The most probable diagnosis is","o":[["A","Herpes simplex."],["B","Lichen planus."],["C","Discoid lupus erythematosus."],["D","Fixed drug eruption."],["E","Impetigo."]],"a":"D","sa":null,"pg":"81","f":[],"n":52,"e":["A violaceous lip macule after sulfonamide (trimethoprim-sulfamethoxazole) is a fixed drug eruption, which characteristically involves the lips and genitalia. Why the other options are wrong: A) Herpes simplex: HSV is vesicular. B) Lichen planus: LP is violaceous. C) Discoid lupus erythematosus: DLE is scaly. E) Impetigo: Impetigo is crusted.","Lips + sulfa."],"im":[]},{"id":"Q431","ch":"Allergic Disorders","q":"27-year-old male develops a vesicobullous lesion on the glans soon after taking oral tetracycline. The lesion healed with hyperpigmentation. The diagnosis is","o":[["A","Herpes progenitalis."],["B","Fixed drug eruption."],["C","Genital warts."],["D","Genital molluscum."],["E","Chlamydia infection."]],"a":"B","sa":null,"pg":"81","f":[],"n":53,"e":["A vesiculobullous glans lesion after tetracycline that heals with hyperpigmentation is a fixed drug eruption, not herpes (which recurs without drug and with grouped vesicles). Why the other options are wrong: A) Herpes progenitalis: Herpes recurs without drug. C) Genital warts: Warts are rough. D) Genital molluscum: Molluscum is umbilicated. E) Chlamydia infection: Chlamydia is not a rash.","Genitals; leaves pigmentation."],"im":[]},{"id":"Q432","ch":"Allergic Disorders","q":"Fixed drug eruption is named so because it is","o":[["A","Fixed to site."],["B","Fixed to site and drug."],["C","Fixed to drug."],["D","Fixed to duration."],["E","Fixed to season."]],"a":"B","sa":null,"pg":"81","f":[],"n":54,"e":["It recurs at the same site each time the same (or related) drug is taken, so it is fixed to site and drug. Why the other options are wrong: A) Fixed to site: It is also fixed to drug. C) Fixed to drug: It is also fixed to site. D) Fixed to duration: It is not time-bound. E) Fixed to season: It is not seasonal.","Fixed to site and drug."],"im":[]},{"id":"Q433","ch":"Allergic Disorders","q":"Fixed drug eruption is treated by","o":[["A","Topical corticosteroid."],["B","Topical terbinafine."],["C","Systemic acyclovir."],["D","Systemic cyclosporin."],["E","IVIGs."]],"a":"A","sa":null,"pg":"82","f":[],"n":55,"e":["Management is to stop the offending drug; potent topical corticosteroid and antihistamines relieve the lesion. Why the other options are wrong: B) Topical terbinafine: Terbinafine is antifungal. C) Systemic acyclovir: Acyclovir is antiviral. D) Systemic cyclosporin: Cyclosporin is excessive. E) IVIGs: IVIG is for TEN.","Stop the drug."],"im":[]},{"id":"Q434","ch":"Allergic Disorders","q":"Regarding drug reaction, which statement is not true?","o":[["A","Involve skin and mucous membrane."],["B","Corticosteroids are used to treat acneiform eruptions."],["C","Antihistaminics are used to treat urticarial eruptions."],["D","Blisters are seen in fixed eruptions."],["E","Exanthematous reactions cause pruritus."]],"a":"B","sa":null,"pg":"82","f":[],"n":56,"e":["Corticosteroids can themselves cause acneiform eruption, so they are not used to treat it; retinoids and antibiotics are. Why the other options are wrong: A) Involve skin and mucous membrane: Drug reactions can involve skin and mucous membranes. C) Antihistaminics are used to treat urtica…: Antihistamines relieve urticarial drug reactions. D) Blisters are seen in fixed eruptions: Fixed drug eruptions can blister. E) Exanthematous reactions cause pruritus: Exanthematous reactions are itchy.","Steroids not for acneiform."],"im":[]},{"id":"Q435","ch":"Allergic Disorders","q":"The commonest viral infection involved in the etiology of erythema multiforme is","o":[["A","Human papilloma virus."],["B","Herpes simplex."],["C","Cytomegalovirus."],["D","Varicella Zoster virus."],["E","Epstein Barr virus."]],"a":"B","sa":null,"pg":"82","f":[],"n":57,"e":["Herpes simplex virus is the most common trigger of erythema multiforme, followed by drugs and other infections. Why the other options are wrong: A) Human papilloma virus: HPV is not involved. C) Cytomegalovirus: CMV is not common. D) Varicella Zoster virus: VZV is not common. E) Epstein Barr virus: EBV is not common.","HSV."],"im":[]},{"id":"Q436","ch":"Allergic Disorders","q":"Target lesions are classic of","o":[["A","Atopic dermatitis."],["B","Seborrheic dermatitis."],["C","Erythema multiforme."],["D","Fixed drug eruption."],["E","Alopecia areata."]],"a":"C","sa":null,"pg":"82","f":[],"n":58,"e":["Target (iris) lesions are classic of erythema multiforme: three concentric zones, with a dark center, pink ring and red outer ring. Why the other options are wrong: A) Atopic dermatitis: Atopic is flexural. B) Seborrheic dermatitis: Seb derm is greasy. D) Fixed drug eruption: FDE is a patch. E) Alopecia areata: AA is smooth.","Target = EM."],"im":[]},{"id":"Q437","ch":"Allergic Disorders","q":"The most characteristic lesion of erythema multiforme is","o":[["A","Wheal."],["B","Burrow."],["C","Furrow."],["D","Herald patch."],["E","Iris lesion."]],"a":"E","sa":null,"pg":"82","f":[],"n":59,"e":["The iris (target) lesion is the characteristic lesion of EM and often involves oral mucosa. Why the other options are wrong: A) Wheal: Wheal is urticaria. B) Burrow: Burrow is scabies. C) Furrow: Furrow is scabies. D) Herald patch: Herald is PR.","Iris."],"im":[]},{"id":"Q546","ch":"Allergic Disorders","q":"Patch test is done to document:","o":[["A","Type I hypersensitivity."],["B","Delayed type hypersensitivity."],["C","Autoimmune disease."],["D","Immune complex deposition."],["E","Antigen antibody reaction."]],"a":"B","sa":null,"pg":"73","f":[],"n":60,"e":["A patch test documents delayed (type IV) hypersensitivity, as in allergic contact dermatitis, by applying suspected allergens under occlusion and reading at 48-72 hours. Type I hypersensitivity is tested with prick tests. Why the other options are wrong: A) Type I hypersensitivity: Type I uses prick tests. C) Autoimmune disease: Autoimmune needs serology. D) Immune complex deposition: Immune complex needs biopsy. E) Antigen antibody reaction: Antigen-antibody is type I-III.","Patch test = type IV; prick test = type I."],"im":[]},{"id":"Q547","ch":"Allergic Disorders","q":"A 3-month infant presented with papules and vesicles with erythema, edema, oozing and crustations on face and neck. His mother reported positive family history of bronchial asthma. The most likely diagnosis is:","o":[["A","Stasis dermatitis."],["B","Psoriasis."],["C","Molluscum contagiosum."],["D","Atopic dermatitis."]],"a":"D","sa":null,"pg":"68","f":[],"n":61,"e":["An infant of 3 months with papules, vesicles, edema, oozing and crusting on the face and neck and a family history of asthma has infantile atopic dermatitis. Stasis dermatitis, psoriasis and molluscum do not fit. Why the other options are wrong: A) Stasis dermatitis: Stasis is legs. B) Psoriasis: Psoriasis is silvery. C) Molluscum contagiosum: Molluscum is umbilicated.","Infantile atopic: face; family history of atopy."],"im":[]},{"id":"H232","ch":"Allergic Disorders","q":"Allergic contact dermatitis is which type of hypersensitivity reaction?","o":[["A","Type I."],["B","Type II."],["C","Type III."],["D","Type IV."],["E","Type V."]],"a":"D","sa":null,"pg":null,"f":[],"n":62,"e":["Allergic contact dermatitis is a delayed type IV (T-cell mediated) hypersensitivity, unlike urticaria (type I). Why the other options are wrong: A) Type I: Type I is immediate. B) Type II: Type II is cytotoxic. C) Type III: Type III is immune complex. E) Type V: Type V is not classic.","Type IV."],"im":[]},{"id":"H233","ch":"Allergic Disorders","q":"The primary lesion of urticaria is:","o":[["A","Papule."],["B","Vesicle."],["C","Macule."],["D","Pustule."],["E","Wheal."]],"a":"E","sa":null,"pg":null,"f":[],"n":63,"e":["Urticaria is characterized by wheals, which are transient edematous elevations. Why the other options are wrong: A) Papule: Papule is persistent. B) Vesicle: Vesicle is fluid. C) Macule: Macule is flat. D) Pustule: Pustule is pus.","Wheal."],"im":[]},{"id":"H234","ch":"Allergic Disorders","q":"Mother complain that her infant has red rash and vesicles and papules in his face and he is very irritable and crying :","o":[["A","Atopic dermatitis"],["B","Discoid lupus erythematosus"]],"a":"A","sa":null,"pg":null,"f":[],"n":64,"e":["An irritable infant with facial red papulovesicular rash has infantile atopic dermatitis; discoid lupus does not occur like this. Why the other options are wrong: B) Discoid lupus erythematosus: DLE is atrophic.","Infant face."],"im":[]},{"id":"H236","ch":"Allergic Disorders","q":"Histamine is the main mediator of:","o":[["A","Atopic dermatitis"],["B","Contact dermatitis"],["C","Urticaria"],["D","Alopecia areata"],["E","Acne vulgaris"]],"a":"C","sa":null,"pg":null,"f":[],"n":65,"e":["Histamine is released by mast cells in urticaria; atopic eczema is IgE-related but histamine is the main urticaria mediator. Why the other options are wrong: A) Atopic dermatitis: Atopic is IgE-related. B) Contact dermatitis: Contact is type IV. D) Alopecia areata: AA is autoimmune. E) Acne vulgaris: Acne is follicular.","Histamine."],"im":[]},{"id":"H238","ch":"Allergic Disorders","q":"A female patient, 21 years old, presented with a rash on the dorsa of both feet. Rash was severely itchy. What is the diagnosis of this case?","o":[["A","Irritant dermatitis."],["B","Papular urticaria."],["C","Stasis eczema."],["D","Neurodermatitis."],["E","Allergic dermatitis."]],"a":"E","sa":null,"pg":null,"f":[],"n":66,"e":["A severely itchy rash on the foot dorsa is allergic contact dermatitis to footwear materials (rubber, chromate, glues). Why the other options are wrong: A) Irritant dermatitis: Irritant needs exposure. B) Papular urticaria: Papular urticaria is bites. C) Stasis eczema: Stasis is leg. D) Neurodermatitis: Neurodermatitis is chronic.","Shoe allergy."],"im":[]},{"id":"H239","ch":"Allergic Disorders","q":"Allergic contact dermatitis (the rash in the previous question) is caused by: [image- based in the original bank]","o":[["A","Immediate tissue damage."],["B","Type I hypersensitivity reaction."],["C","Type IV hypersensitivity reaction."],["D","Immune complex reaction."],["E","Antigen-antibody reaction."]],"a":"C","sa":null,"pg":null,"f":["Image-based in the original bank; image not in the PDF text."],"n":67,"e":["Allergic contact dermatitis is a type IV (delayed, T-cell) hypersensitivity, not immediate or antigen-antibody mediated. Why the other options are wrong: A) Immediate tissue damage: Not immediate. B) Type I hypersensitivity reaction: Type I is immediate. D) Immune complex reaction: Immune complex is type III. E) Antigen-antibody reaction: Antigen-antibody is type I-III.","Type IV."],"im":[]},{"id":"H241","ch":"Allergic Disorders","q":"The wheal is the characteristic primary lesion of: [image-based in the original bank]","o":[["A","Psoriasis."],["B","Herpes simplex."],["C","Urticaria."],["D","Warts."],["E","Molluscum contagiosum."]],"a":"C","sa":null,"pg":null,"f":["Image-based in the original bank; image not in the PDF text."],"n":68,"e":["The wheal is the characteristic lesion of urticaria; psoriasis, herpes simplex, warts and molluscum have other lesions. Why the other options are wrong: A) Psoriasis: Psoriasis is scaly. B) Herpes simplex: HSV is vesicular. D) Warts: Warts are rough. E) Molluscum contagiosum: Molluscum is umbilicated.","Wheal = urticaria."],"im":[]},{"id":"H242","ch":"Allergic Disorders","q":"A male patient, 52 years old, presented with sudden appearance of a reddish rash on his back, both upper limbs and extended to the lower limbs. Rash was itchy. There was no fever. Diagnosis of this case is:","o":[["A","Stevens-Johnson syndrome."],["B","Erythema multiforme."],["C","Angioedema."],["D","Urticaria."],["E","Fixed drug eruption."]],"a":"D","sa":null,"pg":null,"f":[],"n":69,"e":["A sudden widespread itchy erythematous rash on trunk and limbs without fever is urticaria. Why the other options are wrong: A) Stevens-Johnson syndrome: SJS has mucosal erosions. B) Erythema multiforme: EM has targets. C) Angioedema: Angioedema is deep. E) Fixed drug eruption: FDE is fixed.","No fever."],"im":[]},{"id":"H245","ch":"Allergic Disorders","q":"Allergic contact dermatitis:","o":[["A","Is an immunological reaction."],["B","Occurs in any individual soon after exposure."],["C","Can be caused by acids or alkalis."],["D","Can occur due to cumulative damage by mild irritants."],["E","Occurs in compulsive washers."]],"a":"A","sa":null,"pg":null,"f":[],"n":70,"e":["Allergic contact dermatitis is an immunologic reaction in genetically susceptible people; irritant dermatitis is the one caused by acids, alkalis and cumulative mild irritants. Why the other options are wrong: B) Occurs in any individual soon after expo…: It needs sensitization. C) Can be caused by acids or alkalis: That is irritant. D) Can occur due to cumulative damage by mi…: That is irritant. E) Occurs in compulsive washers: That is irritant.","Immune vs irritant."],"im":[]},{"id":"H254","ch":"Allergic Disorders","q":"Physical urticaria includes all of the following EXCEPT:","o":[["A","Solar urticaria."],["B","Papular urticaria."],["C","Pressure urticaria."],["D","Heat urticaria."],["E","None of the above."]],"a":"B","sa":null,"pg":null,"f":[],"n":71,"e":["Physical urticarias are solar, pressure, heat, cold and aquagenic types. Papular urticaria is an insect-bite hypersensitivity. Why the other options are wrong: A) Solar urticaria: Physical. C) Pressure urticaria: Physical. D) Heat urticaria: Physical. E) None of the above: Wrong: at least one listed statement is correct.","Papular excluded."],"im":[]},{"id":"H256","ch":"Allergic Disorders","q":"The immunoglobulin which is usually elevated in atopics is:","o":[["A","Ig G."],["B","Ig M."],["C","Ig E."],["D","Ig D."],["E","All of the above."]],"a":"C","sa":null,"pg":null,"f":[],"n":72,"e":["IgE is typically elevated in atopic individuals (atopic dermatitis, asthma, rhinitis). Why the other options are wrong: A) Ig G: IgG is not specific. B) Ig M: IgM is not specific. D) Ig D: IgD is not specific. E) All of the above: Only IgE.","IgE."],"im":[]},{"id":"H257","ch":"Allergic Disorders","q":"Mucous membrane affection may occur in all of the following EXCEPT:","o":[["A","Varicella."],["B","Papular urticaria."],["C","Lichen planus."],["D","Herpes simplex."],["E","DLE."]],"a":"B","sa":null,"pg":null,"f":[],"n":73,"e":["Mucous membranes may be involved in varicella, lichen planus, herpes simplex and DLE, but papular urticaria spares them. Why the other options are wrong: A) Varicella: Occurs. C) Lichen planus: Occurs. D) Herpes simplex: Occurs. E) DLE: Occurs.","Papular urticaria: no mucosa."],"im":[]},{"id":"H265","ch":"Allergic Disorders","q":"A 17-year-old female presents with a pruritic rash localized to the wrist. Papules and vesicles are noted in a band-like pattern, with slight oozing from some lesions. Which of the following is the most likely cause of the rash?","o":[["A","Stasis dermatitis."],["B","Herpes zoster."],["C","Atopic dermatitis."],["D","Seborrheic dermatitis."],["E","Contact dermatitis."]],"a":"E","sa":null,"pg":null,"f":[],"n":74,"e":["Band-like papules and vesicles with oozing on the wrist indicate contact dermatitis to a watch or bracelet. Why the other options are wrong: A) Stasis dermatitis: Stasis is legs. B) Herpes zoster: Zoster is dermatomal. C) Atopic dermatitis: Atopic is flexural. D) Seborrheic dermatitis: Seb derm is greasy.","Contact."],"im":[]},{"id":"H266","ch":"Allergic Disorders","q":"A 6-year-old child presented with groups of itchy papules involving the flexures & sides of the neck. The most probable diagnosis is:","o":[["A","Varicose eczema."],["B","Contact eczema."],["C","Atopic eczema."],["D","Stasis eczema."],["E","Seborrheic eczema."]],"a":"C","sa":null,"pg":null,"f":[],"n":75,"e":["Groups of itchy papules in the flexures and neck sides of a child are atopic eczema. Why the other options are wrong: A) Varicose eczema: Varicose is legs. B) Contact eczema: Contact follows exposure. D) Stasis eczema: Stasis is legs. E) Seborrheic eczema: Seb derm is greasy.","Flexural."],"im":[]},{"id":"H271","ch":"Allergic Disorders","q":"An asthmatic child with a severely itchy rash on both popliteal fossae and antecubital fossae. The patient suffered from insomnia in addition to irritability most of the day. The following is true about this disease:","o":[["A","Transmitted by direct contact."],["B","Family history is usually positive."],["C","Involves sebaceous glands activity."],["D","Heals with a scar."],["E","Treated by topical retinoids."]],"a":"B","sa":null,"pg":null,"f":[],"n":76,"e":["An asthmatic child with itchy flexural rash and sleep loss has atopic eczema; the family history of atopy is usually positive. It is not transmitted by contact and heals without scar. Why the other options are wrong: A) Transmitted by direct contact: Atopic dermatitis is not contagious; it is an inherited atopic disease. C) Involves sebaceous glands activity: Sebaceous activity matters in seborrheic dermatitis and acne; atopic dermatitis involves flexures and a defective skin barrier. D) Heals with a scar: It heals without scar. E) Treated by topical retinoids: Retinoids treat acne and keratinization disorders; atopic dermatitis needs emollients, topical steroids or calcineurin inhibitors.","Atopic triad."],"im":[]},{"id":"H279","ch":"Allergic Disorders","q":"Erythema multiforme may be precipitated by:","o":[["A","Herpes simplex infection."],["B","Drugs."],["C","Internal malignancy."],["D","Pregnancy."],["E","All of the above."]],"a":"E","sa":null,"pg":null,"f":[],"n":77,"e":["EM may be triggered by herpes simplex, drugs, internal malignancy and pregnancy, so all of the above. Why the other options are wrong: A) Herpes simplex infection: HSV is the commonest trigger of erythema multiforme. True, but others also trigger it. B) Drugs: Drugs trigger it. True, but others also do. C) Internal malignancy: Internal malignancy triggers it. True, but others also do. D) Pregnancy: Pregnancy triggers it. True, but others also do.","HSV most common."],"im":[]},{"id":"Q438","ch":"Melanocyte Disorders","q":"Absence of pigment in the skin is called","o":[["A","Alopecia areata."],["B","Vitiligo."],["C","Psoriasis."],["D","Discoid lupus erythematosus."],["E","Pityriasis rosea."]],"a":"B","sa":null,"pg":"85","f":[],"n":1,"e":["Vitiligo is an acquired depigmenting disorder: well-circumscribed milky-white macules/patches in which the pigment is completely lost. It is different from hypopigmentation, where some pigment remains. Why the other options are wrong: A) Alopecia areata: Alopecia areata is hair loss. C) Psoriasis: Psoriasis is scaly. D) Discoid lupus erythematosus: DLE is atrophic scarring. E) Pityriasis rosea: PR has herald patch.","Complete loss of pigment = vitiligo."],"im":[]},{"id":"Q439","ch":"Melanocyte Disorders","q":"Complete absence of melanocytes will show as","o":[["A","Vitiligo."],["B","Post-inflammatory hypopigmentation."],["C","Pityriasis alba."],["D","Hypopigmented tinea versicolor."],["E","Hypopigmented nevus."]],"a":"A","sa":null,"pg":"85","f":[],"n":2,"e":["In vitiligo the cytotoxic T cells destroy melanocytes, so the lesion contains no melanocytes and appears chalk-white and accentuated under Wood's lamp. Why the other options are wrong: B) Post-inflammatory hypopigmentation: Melanocytes are present but less active. C) Pityriasis alba: Pityriasis alba is partial loss. D) Hypopigmented tinea versicolor: Versicolor is scaly. E) Hypopigmented nevus: Nevus has melanocytes.","No melanocytes."],"im":[]},{"id":"Q440","ch":"Melanocyte Disorders","q":"Which of the following is TRUE about vitiligo?","o":[["A","It is an infectious disease characterized by loss of melanocytes."],["B","Milky white papule is the primary lesion."],["C","Focal type is transmitted by close contact."],["D","It is a disease of adults."],["E","In generalized type, white macules are scattered all over the body."]],"a":"E","sa":null,"pg":"87","f":[],"n":3,"e":["Generalized vitiligo (vulgaris) shows macules and patches distributed all over the body. It is not infectious or transmitted by contact, can start in childhood or adulthood, and the primary lesion is a macule or patch, not a papule. Why the other options are wrong: A) It is an infectious disease characterize…: Vitiligo is non-infectious: it is autoimmune depigmentation. B) Milky white papule is the primary lesion: The lesion is a macule. C) Focal type is transmitted by close conta…: Not contagious; focal means limited to one area for at least 2 years. D) It is a disease of adults: It also occurs in children.","Vulgaris = scattered over the body."],"im":[]},{"id":"Q441","ch":"Melanocyte Disorders","q":"The primary lesion of vitiligo is a milky white","o":[["A","Plaque."],["B","Scaly patch."],["C","Wheal."],["D","Papule."],["E","Macule."]],"a":"E","sa":null,"pg":"85","f":[],"n":4,"e":["The primary lesion is a well-circumscribed milky-white macule (a patch if larger than 1 cm), often with convex borders and white hairs. Why the other options are wrong: A) Plaque: It is not elevated. B) Scaly patch: Vitiligo patches are smooth, milky white and non-scaly; scale suggests pityriasis versicolor or alba. C) Wheal: A wheal is transient urticarial edema, not a depigmented lesion. D) Papule: A papule is raised; vitiligo lesions are flat (macules/patches).","Macule/patch."],"im":[]},{"id":"Q442","ch":"Melanocyte Disorders","q":"The main complaint in vitiligo is","o":[["A","Itching."],["B","Pain."],["C","Discoloration."],["D","Loss of sensation."],["E","Burning sensation."]],"a":"C","sa":null,"pg":"85","f":[],"n":5,"e":["Viti
