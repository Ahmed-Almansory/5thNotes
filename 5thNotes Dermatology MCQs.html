<script>
const DB={"ch":["Introduction To Dermatology","Bacterial Infections","Mycobacterial Infections","Viral Infections","Fungal Infections","Parasitic Infestations","Inflammatory Dermatoses","Allergic Disorders","Melanocyte Disorders","Hair Disorders","Acne Vulgaris","⭐ Key Ideas — each idea once"],"q":[{"id":"Q001","ch":"Introduction To Dermatology","q":"The outermost structure in the skin is the:","o":[["A","Epidermis."],["B","Dermis."],["C","Hypodermis."],["D","Basement membrane."],["E","Collagen."]],"a":"A","sa":null,"pg":"2","f":[],"n":1,"e":["The epidermis is the superficial layer of the skin, lying above the basement membrane, dermis and hypodermis. Why the other options are wrong: B) Dermis: The dermis lies beneath the epidermis, so it is not outermost. C) Hypodermis: The hypodermis is the deepest layer. D) Basement membrane: The basement membrane is the junction between epidermis and dermis, below the epidermis. E) Collagen: Collagen is a dermal protein, not a skin layer.","Outside → inside: epidermis, dermis, hypodermis."],"im":[]},{"id":"Q002","ch":"Introduction To Dermatology","q":"Main cells of the epidermis are:","o":[["A","Fibroblasts, keratinocytes, melanocytes."],["B","Keratinocytes, melanocytes, Langerhans cells."],["C","Keratinocytes, lymphocytes, Langerhans cells."],["D","Melanocytes, keratinocytes, endothelial cells."],["E","Keratinocytes, melanocytes, lymphocytes."]],"a":"B","sa":null,"pg":"2","f":[],"n":2,"e":["The epidermis is made mainly of keratinocytes (the majority), with melanocytes (pigment) and Langerhans cells (immune) as the other main cells. Fibroblasts, endothelial cells and lymphocytes belong to the dermis or vessels. Why the other options are wrong: A) Fibroblasts, keratinocytes, melanocytes: Fibroblasts are dermal cells, not epidermal. C) Keratinocytes, lymphocytes, Langerhans c…: Lymphocytes are not resident epidermal cells in the main list. D) Melanocytes, keratinocytes, endothelial…: Endothelial cells line dermal vessels. E) Keratinocytes, melanocytes, lymphocytes: Lymphocytes are not a main epidermal cell.","Keratinocyte = structure, melanocyte = pigment, Langerhans = immunity."],"im":[]},{"id":"Q003","ch":"Introduction To Dermatology","q":"What are the main cells of the epidermis?","o":[["A","Melanocytes."],["B","Langerhans cells."],["C","Keratinocytes."],["D","Merkel cells."],["E","Mast cells."]],"a":"C","sa":null,"pg":"2","f":[],"n":3,"e":["Keratinocytes make up about 90% of epidermal cells and produce keratin, forming the barrier. Why the other options are wrong: A) Melanocytes: Melanocytes are a minor epidermal population making pigment. B) Langerhans cells: Langerhans cells are immune cells, a small fraction. D) Merkel cells: Merkel cells are touch receptors, few in number. E) Mast cells: Mast cells are dermal.","Merkel cells = touch; melanocytes = pigment; Langerhans = immunity."],"im":[]},{"id":"Q004","ch":"Introduction To Dermatology","q":"Starting from below upwards, the cell layers of the epidermis are:","o":[["A","Granular, basal, squamous, and horny cell layers."],["B","Horny, granular, squamous, and basal cell layers."],["C","Basal, granular, squamous, and horny cell layers."],["D","Basal, squamous, granular, and horny cell layers."],["E","Basal, horny, granular, and squamous cell layers."]],"a":"D","sa":null,"pg":"2","f":[],"n":4,"e":["From the basement membrane upward: basal → squamous (prickle) → granular → horny (stratum corneum); a clear layer (lucidum) exists only in palms and soles. Why the other options are wrong: A) Granular, basal, squamous, and horny cel…: Basal is the lowest layer, not second from the top of the list. B) Horny, granular, squamous, and basal cel…: This is the reverse (top to bottom) order. C) Basal, granular, squamous, and horny cel…: The granular layer lies above the squamous (prickle) layer. E) Basal, horny, granular, and squamous cel…: The horny layer is the top, not second.","Mnemonic: B-S-G-H (Basal, Spinous, Granular, Horny)."],"im":[]},{"id":"Q005","ch":"Introduction To Dermatology","q":"Name the layers of the epidermis (from below upwards).","o":[],"a":null,"sa":"Basal cell layer -> Prickle (squamous) cell layer -> Granular cell layer -> Horny cell layer (stratum corneum).","pg":"2","f":[],"n":5,"e":["Cells are born in the basal layer, mature through the prickle and granular layers, and end as flattened keratin-filled cells in the horny layer.","Order from below upward is basal → prickle → granular → horny."],"im":[]},{"id":"Q006","ch":"Introduction To Dermatology","q":"The uppermost layer of the epidermis is the:","o":[["A","Granular layer."],["B","Squamous cell layer."],["C","Basal cell layer."],["D","Keratinous (horny) cell layer."],["E","Malpighian cell layer."]],"a":"D","sa":null,"pg":"2","f":[],"n":6,"e":["The outermost epidermal layer is the horny layer (stratum corneum), made of dead keratinized cells that form the physical barrier. Why the other options are wrong: A) Granular layer: Granular is just below the horny layer. B) Squamous cell layer: Squamous cells lie in the middle layer. C) Basal cell layer: Basal is the deepest layer. E) Malpighian cell layer: Malpighian refers to the basal and prickle layers together.","Horny layer = barrier."],"im":[]},{"id":"Q007","ch":"Introduction To Dermatology","q":"The stratum corneum is composed of:","o":[["A","Melanin."],["B","Granules."],["C","Keratin cells."],["D","Squamous cells."],["E","Basal cells."]],"a":"C","sa":null,"pg":"2","f":[],"n":7,"e":["The stratum corneum consists of flattened, anucleate keratinized cells (corneocytes) packed with keratin. Why the other options are wrong: A) Melanin: Melanin is a pigment, not the content of the horny layer. B) Granules: Granules belong to the granular layer. D) Squamous cells: Squamous cells are in the spinous layer. E) Basal cells: Basal cells are the deepest layer.","Corneocytes = dead keratin-filled cells."],"im":[]},{"id":"Q008","ch":"Introduction To Dermatology","q":"The layer of the skin responsible for renewal of the epidermis is:","o":[["A","Horny cell layer."],["B","Granular cell layer."],["C","Squamous cell layer."],["D","Basal cell layer."],["E","Dermis."]],"a":"D","sa":null,"pg":"2","f":[],"n":8,"e":["The basal layer contains the germinative (stem) keratinocytes that divide continuously and replace the epidermis (turnover about 28 days). Why the other options are wrong: A) Horny cell layer: The horny layer sheds dead cells. B) Granular cell layer: The granular layer is a differentiating layer. C) Squamous cell layer: The squamous layer cells are maturing, not stem cells. E) Dermis: The dermis is a different layer, not epidermis.","Basal = renewal; psoriasis speeds up its turnover."],"im":[]},{"id":"Q009","ch":"Introduction To Dermatology","q":"Squamous cells are found in the:","o":[["A","Epidermis."],["B","Dermis."],["C","Hypodermis."],["D","Blood vessels."],["E","Connective tissue."]],"a":"A","sa":null,"pg":"2","f":[],"n":9,"e":["Squamous (prickle) cells are keratinocytes of the stratum spinosum, which is part of the epidermis; squamous cell carcinoma arises from them. Why the other options are wrong: B) Dermis: The dermis contains collagen, fibroblasts and vessels. C) Hypodermis: The hypodermis contains fat. D) Blood vessels: Vessels have endothelium. E) Connective tissue: Connective tissue is dermal.","Squamous cell layer = prickle cell layer."],"im":[]},{"id":"Q010","ch":"Introduction To Dermatology","q":"The immune function of the skin is mediated by:","o":[["A","Melanocytes."],["B","Langerhans cells."],["C","Elastic fibres."],["D","Pacinian corpuscles."],["E","Keratinocytes."]],"a":"B","sa":null,"pg":"2","f":[],"n":10,"e":["Langerhans cells are antigen-presenting dendritic cells in the epidermis and carry the skin's immune function. Pacinian corpuscles sense pressure/vibration, not immunity. Why the other options are wrong: A) Melanocytes: Melanocytes make pigment. C) Elastic fibres: Elastic fibres give recoil. D) Pacinian corpuscles: Pacinian corpuscles sense pressure. E) Keratinocytes: Keratinocytes are structural.","Langerhans = immune; Merkel = touch; melanocyte = pigment."],"im":[]},{"id":"Q011","ch":"Introduction To Dermatology","q":"Skin appendages include:","o":[["A","Nails, hair follicles, sebaceous glands & blood vessels."],["B","Hair follicles, nails, sweat glands & lymphatics."],["C","Sebaceous glands, sweat glands & nerve corpuscles."],["D","Sweat glands, nails, nerve corpuscles & hair follicles."],["E","Sweat glands, nails, hair follicles & sebaceous glands."]],"a":"E","sa":null,"pg":"3","f":[],"n":11,"e":["Appendages are epidermal derivatives: hair follicles, sebaceous glands, sweat glands (eccrine and apocrine) and nails. Blood vessels, lymphatics and nerve corpuscles are not appendages. Why the other options are wrong: A) Nails, hair follicles, sebaceous glands…: Blood vessels are not appendages. B) Hair follicles, nails, sweat glands & ly…: Lymphatics are not appendages. C) Sebaceous glands, sweat glands & nerve c…: Nerve corpuscles are not appendages. D) Sweat glands, nails, nerve corpuscles &…: Nerve corpuscles are not appendages.","Appendages = hair, nails, glands."],"im":[]},{"id":"Q012","ch":"Introduction To Dermatology","q":"Skin appendages include all of the following EXCEPT:","o":[["A","Sebaceous glands."],["B","Eccrine sweat glands."],["C","Melanocytes."],["D","Apocrine sweat glands."],["E","Hair."]],"a":"C","sa":null,"pg":"3","f":[],"n":12,"e":["Melanocytes are cells of the epidermis, not appendages; sebaceous, sweat glands and hair are. Why the other options are wrong: A) Sebaceous glands: Sebaceous glands are appendages. B) Eccrine sweat glands: Eccrine glands are appendages. D) Apocrine sweat glands: Apocrine glands are appendages. E) Hair: Hair is an appendage.","Melanocyte = cell, not appendage."],"im":[]},{"id":"Q013","ch":"Introduction To Dermatology","q":"All of the following are skin appendages EXCEPT:","o":[["A","Nails."],["B","Hair follicles."],["C","Sweat glands."],["D","Blood vessels."],["E","Sebaceous glands."]],"a":"D","sa":null,"pg":"3","f":[],"n":13,"e":["Blood vessels are dermal structures supplying the skin and are not appendages; nails, hair follicles, sweat and sebaceous glands are. Why the other options are wrong: A) Nails: Nails are appendages. B) Hair follicles: Hair follicles are appendages. C) Sweat glands: Sweat glands are appendages. E) Sebaceous glands: Sebaceous glands are appendages.","Vessels and nerves ≠ appendages."],"im":[]},{"id":"Q014","ch":"Introduction To Dermatology","q":"Which one of the following structures is considered a skin appendage?","o":[["A","Epidermis."],["B","Dermis."],["C","Hair follicle."],["D","Subcutaneous fat."],["E","Cutaneous nerves."]],"a":"C","sa":null,"pg":"3","f":[],"n":14,"e":["The hair follicle is an epidermal derivative and therefore an appendage; epidermis and dermis are layers, and fat and nerves are not appendages. Why the other options are wrong: A) Epidermis: The epidermis is a layer. B) Dermis: The dermis is a layer. D) Subcutaneous fat: Fat is the hypodermis. E) Cutaneous nerves: Nerves are not epidermal derivatives.","Hair follicle = appendage."],"im":[]},{"id":"Q015","ch":"Introduction To Dermatology","q":"The pilosebaceous unit is composed of:","o":[["A","Apocrine gland and sebaceous gland."],["B","Hair and sebaceous gland."],["C","Skin and sebaceous gland."],["D","Hair and apocrine gland."],["E","Hair and hair follicle."]],"a":"B","sa":null,"pg":"3","f":[],"n":15,"e":["The pilosebaceous unit is the hair follicle with its attached sebaceous gland; it is the site of acne. Why the other options are wrong: A) Apocrine gland and sebaceous gland: Apocrine glands are separate. C) Skin and sebaceous gland: Skin is too general. D) Hair and apocrine gland: The apocrine gland is not part of the unit. E) Hair and hair follicle: Hair and follicle are one structure.","Pilosebaceous unit = acne site."],"im":[]},{"id":"Q016","ch":"Introduction To Dermatology","q":"The skin appendages responsible for body temperature control are known as:","o":[["A","Eccrine sweat glands."],["B","Sebaceous glands."],["C","Pilosebaceous units."],["D","Hair follicles."],["E","Mast cells."]],"a":"A","sa":null,"pg":"3","f":[],"n":16,"e":["Eccrine sweat glands are distributed over the whole body and cool it by evaporation of sweat. Apocrine glands are scent glands (axilla, groin). Why the other options are wrong: B) Sebaceous glands: Sebaceous glands secrete sebum. C) Pilosebaceous units: The pilosebaceous unit is the acne site. D) Hair follicles: Hair follicles produce hair. E) Mast cells: Mast cells are immune cells.","Eccrine = thermoregulation; apocrine = odor."],"im":[]},{"id":"Q017","ch":"Introduction To Dermatology","q":"The following is a function of the skin:","o":[["A","Defense against external pathogens."],["B","Temperature control."],["C","Sensations."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"3","f":[],"n":17,"e":["The skin defends against pathogens, controls temperature and carries sensation, so 'all of the above' is correct. Why the other options are wrong: A) Defense against external pathogens: True, but incomplete alone. B) Temperature control: True, but incomplete alone. C) Sensations: True, but incomplete alone. E) None of the above: Wrong: all are skin functions.","Skin functions: protection, thermoregulation, sensation, excretion, vitamin D synthesis, immunity."],"im":[]},{"id":"Q018","ch":"Introduction To Dermatology","q":"Functions of the skin include:","o":[["A","Prevention of water and electrolyte loss."],["B","Excretion of sweat."],["C","Formation of vitamin D."],["D","Immunologic function via Langerhans cells."],["E","All of the above."]],"a":"E","sa":null,"pg":"3","f":[],"n":18,"e":["Protection, thermoregulation, sensation, excretion, immunity and vitamin D synthesis are all skin functions. Why the other options are wrong: A) Prevention of water and electrolyte loss: True, but not the only function. B) Excretion of sweat: True, but not the only function. C) Formation of vitamin D: True, but not the only function. D) Immunologic function via Langerhans cells: True, but not the only function.","Skin is a multifunctional organ."],"im":[]},{"id":"Q019","ch":"Introduction To Dermatology","q":"The skin is considered:","o":[["A","An endocrine organ."],["B","A secretory organ."],["C","A defensive organ."],["D","An excretory organ."],["E","All of the above."]],"a":"E","sa":null,"pg":"3","f":[],"n":19,"e":["The skin is protective, secretory (sebum, sweat), excretory (sweat) and endocrine (vitamin D synthesis), so 'all of the above'. Why the other options are wrong: A) An endocrine organ: True, but incomplete alone. B) A secretory organ: True, but incomplete alone. C) A defensive organ: True, but incomplete alone. D) An excretory organ: True, but incomplete alone.","Skin makes vitamin D under UVB."],"im":[]},{"id":"Q020","ch":"Introduction To Dermatology","q":"One of the following statements is correct:","o":[["A","The melanocyte is the main cell of the epidermis."],["B","The skin has an endocrinal function."],["C","The basal cells of the epidermis are squamous."],["D","The sebaceous glands open directly onto the skin surface."],["E","Laminated keratin is called crust."]],"a":"B","sa":null,"pg":"3","f":[],"n":20,"e":["The skin has an endocrine function: UVB converts 7-dehydrocholesterol into vitamin D3. It is not a purely excretory organ. Why the other options are wrong: A) The melanocyte is the main cell of the e…: The keratinocyte is the main cell. C) The basal cells of the epidermis are squ…: Basal cells are columnar/cuboidal, not squamous. D) The sebaceous glands open directly onto…: Sebaceous glands open into the follicle. E) Laminated keratin is called crust: Laminated keratin is a scale, not a crust.","Skin = vitamin D factory."],"im":[]},{"id":"Q021","ch":"Introduction To Dermatology","q":"All of the following are primary lesions EXCEPT:","o":[["A","Macule."],["B","Nodule."],["C","Plaque."],["D","Vesicle."],["E","Crust."]],"a":"E","sa":null,"pg":"8","f":[],"n":21,"e":["Primary lesions arise first (macule, papule, plaque, nodule, vesicle, bulla, pustule, wheal, cyst). A crust is a secondary lesion formed from dried exudate. Why the other options are wrong: A) Macule: The macule is a primary lesion. B) Nodule: The nodule is primary. C) Plaque: The plaque is primary. D) Vesicle: The vesicle is primary.","Crust, scale, erosion, ulcer, scar are secondary lesions."],"im":[]},{"id":"Q022","ch":"Introduction To Dermatology","q":"A circumscribed non-palpable area characterized by color change is a:","o":[["A","Vesicle."],["B","Papule."],["C","Macule."],["D","Scale."],["E","Crust."]],"a":"C","sa":null,"pg":"4","f":[],"n":22,"e":["A macule is a flat lesion that you can see but not feel: it is defined only by a change in color, with no elevation or texture change. Anything palpable (papule, plaque, nodule) is excluded. Why the other options are wrong: A) Vesicle: A vesicle is palpable fluid-filled. B) Papule: A papule is solid and palpable. D) Scale: A scale is keratin. E) Crust: A crust is dried exudate.","Macule = color only (<1 cm); patch >1 cm. Examples: pityriasis versicolor, vitiligo."],"im":[]},{"id":"Q023","ch":"Introduction To Dermatology","q":"Macule is:","o":[["A","A localized collection of fluid."],["B","A solid elevation of the skin less than 0.5 cm in diameter."],["C","A tunnel in the epidermis produced by female Sarcoptes scabiei."],["D","Dried serum, blood or pus on the skin surface."],["E","A circumscribed non-palpable area of skin discoloration less than 1 cm in diameter."]],"a":"E","sa":null,"pg":"4","f":[],"n":23,"e":["A macule is non-palpable discoloration less than 1 cm; the same change over 1 cm is a patch. Why the other options are wrong: A) A localized collection of fluid: That describes a vesicle or bulla. B) A solid elevation of the skin less than…: That describes a papule. C) A tunnel in the epidermis produced by fe…: That describes a burrow. D) Dried serum, blood or pus on the skin su…: That describes a crust.","Macule <1 cm; patch >1 cm."],"im":[]},{"id":"Q024","ch":"Introduction To Dermatology","q":"Patch is a:","o":[["A","Flat, circumscribed non-palpable area of skin discoloration <1 cm in diameter."],["B","Flat, circumscribed non-palpable area of skin discoloration >1 cm in diameter."],["C","Circumscribed solid elevation of skin <1 cm in diameter."],["D","Circumscribed solid elevation of skin >1 cm in diameter having a deep component."],["E","Increased epidermal thickness."]],"a":"B","sa":null,"pg":"4","f":[],"n":24,"e":["A patch is the larger version of a macule: flat, non-palpable color change more than 1 cm in diameter, e.g. vitiligo or versicolor patches. Why the other options are wrong: A) Flat, circumscribed non-palpable area of…: The same wording for a macule (size under 1 cm). C) Circumscribed solid elevation of skin <1…: That is a papule. D) Circumscribed solid elevation of skin >1…: That is a nodule or plaque. E) Increased epidermal thickness: That is hyperkeratosis or lichenification.","Macule <1 cm; patch >1 cm."],"im":[]},{"id":"Q025","ch":"Introduction To Dermatology","q":"A solid elevation of the skin less than 1 cm in diameter is a:","o":[["A","Vesicle."],["B","Pustule."],["C","Papule."],["D","Nodule."],["E","Plaque."]],"a":"C","sa":null,"pg":"4","f":[],"n":25,"e":["A papule is a solid, palpable elevation smaller than 1 cm (e.g. warts). A vesicle contains fluid, and a nodule or plaque is larger than 1 cm. Why the other options are wrong: A) Vesicle: Fluid-filled. B) Pustule: Pus-filled. D) Nodule: Larger than 1 cm and deeper. E) Plaque: Larger than 1 cm and flat-topped.","Papule <1 cm."],"im":[]},{"id":"Q026","ch":"Introduction To Dermatology","q":"Papule is:","o":[["A","A solid elevation less than 1 cm in diameter."],["B","A fluid collection."],["C","An area of depigmented skin."],["D","A tunnel in the epidermis."]],"a":"A","sa":null,"pg":null,"f":[],"n":26,"e":["A papule is a solid elevation smaller than 1 cm in diameter; fluid-filled lesions are vesicles. Why the other options are wrong: B) A fluid collection: That is a vesicle or bulla. C) An area of depigmented skin: That is a patch of vitiligo. D) A tunnel in the epidermis: That is a burrow.","Papule = solid and small."],"im":[]},{"id":"Q027","ch":"Introduction To Dermatology","q":"Define a papule and give an example.","o":[],"a":null,"sa":"A solid elevated palpable lesion less than 1 cm in diameter; e.g. verruca (warts).","pg":null,"f":[],"n":27,"e":["A papule is a solid palpable lesion under 1 cm; examples include warts (verruca) and lichen planus.","Examples: warts, lichen planus, acne papules."],"im":[]},{"id":"Q028","ch":"Introduction To Dermatology","q":"Papule is the primary lesion of:","o":[["A","Leprosy."],["B","Lichen planus."],["C","Urticaria."],["D","Pityriasis versicolor."],["E","Herpes simplex."]],"a":"B","sa":null,"pg":"57","f":[],"n":28,"e":["Lichen planus is the classic papular eruption: flat-topped, violaceous, polygonal, itchy papules. Why the other options are wrong: A) Leprosy: Leprosy gives macules, plaques and nodules. C) Urticaria: Urticaria gives wheals. D) Pityriasis versicolor: Versicolor gives macules. E) Herpes simplex: Herpes gives vesicles.","The 4 Ps: purple, polygonal, pruritic, papule."],"im":[]},{"id":"Q029","ch":"Introduction To Dermatology","q":"A papule:","o":[["A","Is the primary lesion of lichen planus."],["B","Is a circumscribed solid elevation more than 0.5 cm in diameter."],["C","Contains fluid."],["D","Is a subcutaneous lesion."],["E","Is always red in color."]],"a":"A","sa":null,"pg":"57","f":[],"n":29,"e":["Lichen planus is a papular disease: the primary lesion is a flat-topped, polyangular, violaceous papule with a shiny surface and fine scale. Why the other options are wrong: B) Is a circumscribed solid elevation more…: Papules are under 1 cm. C) Contains fluid: Papules are solid. D) Is a subcutaneous lesion: Papules are cutaneous, not subcutaneous. E) Is always red in color: Papule color varies.","LP papule = purple, polygonal, itchy, flat."],"im":[]},{"id":"Q030","ch":"Introduction To Dermatology","q":"A plaque is:","o":[["A","An abnormal change of skin texture."],["B","An area of depigmentation."],["C","The primary lesion of acne vulgaris."],["D","A localized epidermal collection of fluid."],["E","A deroofed burrow."]],"a":"A","sa":null,"pg":"5","f":[],"n":30,"e":["Per the department book, a plaque is a palpable area of abnormal skin texture; it is a flat-topped elevation larger than 1 cm, as in psoriasis. Why the other options are wrong: B) An area of depigmentation: That is vitiligo (patch). C) The primary lesion of acne vulgaris: The primary lesion of acne is the comedone. D) A localized epidermal collection of fluid: That is a vesicle or bulla. E) A deroofed burrow: That is a furrow.","Plaque = large, flat-topped; psoriasis."],"im":[]},{"id":"Q031","ch":"Introduction To Dermatology","q":"Plaque is ___, found in ___ (give definition and an example).","o":[],"a":null,"sa":"A circumscribed solid palpable lesion more than 1 cm in diameter (may be elevated); e.g. psoriasis.","pg":"5","f":[],"n":31,"e":["A plaque is a solid palpable flat-topped lesion over 1 cm, often a coalescence of papules, as in psoriasis.","Plaque >1 cm, mainly epidermal/upper dermal."],"im":[]},{"id":"Q032","ch":"Introduction To Dermatology","q":"A circumscribed solid elevation of skin more than 1 cm in diameter having a deep component that involves the dermis or subcutis is a:","o":[["A","Plaque."],["B","Nodule."],["C","Vesicle."],["D","Papule."],["E","Bulla."]],"a":"B","sa":null,"pg":"5","f":[],"n":32,"e":["A nodule is a solid lesion over 1 cm with a deep component in the dermis or subcutis. Why the other options are wrong: A) Plaque: A plaque is superficial and flat-topped. C) Vesicle: A vesicle contains fluid. D) Papule: A papule is under 1 cm. E) Bulla: A bulla contains fluid.","Nodule = deep; plaque = superficial."],"im":[]},{"id":"Q033","ch":"Introduction To Dermatology","q":"A nodule:","o":[["A","Is a circumscribed solid elevation more than 1 cm."],["B","Is a circumscribed solid elevation less than 1 cm."],["C","Contains fluid."],["D","Is epidermal in origin."],["E","Is the primary lesion of acne."]],"a":"A","sa":null,"pg":"5","f":[],"n":33,"e":["A nodule is a circumscribed solid lesion larger than 1 cm that extends deep into the dermis or subcutis. A papule is the same lesion under 1 cm. Why the other options are wrong: B) Is a circumscribed solid elevation less…: That is a papule. C) Contains fluid: A nodule is solid. D) Is epidermal in origin: A nodule is dermal. E) Is the primary lesion of acne: The acne primary lesion is the comedone.","Nodule >1 cm and deep (e.g. lepromatous leprosy)."],"im":[]},{"id":"Q034","ch":"Introduction To Dermatology","q":"A nodule:","o":[["A","Is a circumscribed solid elevation less than 0.5 cm in diameter."],["B","Is a circumscribed solid elevation more than 0.5 cm in diameter."],["C","Contains fluid."],["D","Is epidermal in origin."],["E","Is a circumscribed discoloration of the skin."]],"a":"B","sa":null,"pg":null,"f":["Answer key says a nodule is larger than 0.5 cm, while other questions and the book say larger than 1 cm. Please verify."],"n":34,"e":["A nodule is a solid lesion larger than 1 cm; the book key gives 0.5 cm in this version, which is inconsistent with other items. Flagged for review. Why the other options are wrong: A) Is a circumscribed solid elevation less…: That describes a papule. C) Contains fluid: A nodule is solid. D) Is epidermal in origin: A nodule is dermal. E) Is a circumscribed discoloration of the…: That describes a macule.","Use >1 cm with a dermal/subcutaneous component."],"im":[]},{"id":"Q035","ch":"Introduction To Dermatology","q":"A nodule is:","o":[["A","The primary lesion of acne."],["B","A superficial lesion."],["C","Less than 1 cm in diameter."],["D","A cystic lesion."],["E","A dermal lesion."]],"a":"E","sa":null,"pg":"5","f":[],"n":35,"e":["A nodule is a dermal (deeper) lesion, unlike a plaque, which is mainly epidermal. Why the other options are wrong: A) The primary lesion of acne: Acne primary lesion is the comedone. B) A superficial lesion: A nodule is deep. C) Less than 1 cm in diameter: A nodule is over 1 cm. D) A cystic lesion: A cyst is cystic; a nodule is solid.","Nodule = dermal."],"im":[]},{"id":"Q036","ch":"Introduction To Dermatology","q":"From the list below, select the most appropriate definition of a nodule:","o":[["A","Well-defined flat area of altered pigmentation."],["B","Raised well-defined lesion usually less than 0.5 cm in diameter."],["C","Raised flat-topped lesion usually greater than 2 cm in diameter."],["D","Solid lump greater than 1 cm in diameter; may be subcutaneous or intradermal."],["E","Well-defined pus-filled lesion."]],"a":"D","sa":null,"pg":"5","f":[],"n":36,"e":["A nodule is a solid lump over 1 cm that may be intradermal or subcutaneous. Why the other options are wrong: A) Well-defined flat area of altered pigmen…: That is a patch. B) Raised well-defined lesion usually less…: That is a papule. C) Raised flat-topped lesion usually greate…: That is a plaque. E) Well-defined pus-filled lesion: That is a pustule.","Nodule = deep lump >1 cm."],"im":[]},{"id":"Q037","ch":"Introduction To Dermatology","q":"Evanescent elevations of the skin caused by edema of the dermis are:","o":[["A","Macules."],["B","Papules."],["C","Wheals."],["D","Nodules."],["E","Crusts."]],"a":"C","sa":null,"pg":"6","f":[],"n":37,"e":["Wheals are transient (evanescent) edematous elevations from dermal edema, typical of urticaria. Why the other options are wrong: A) Macules: A macule is flat. B) Papules: A papule is persistent. D) Nodules: A nodule is persistent. E) Crusts: A crust is dry.","Wheal lasts <24 h."],"im":[]},{"id":"Q038","ch":"Introduction To Dermatology","q":"A wheal is:","o":[["A","A secondary lesion."],["B","Permanent."],["C","An edematous lesion."],["D","The primary lesion of acne."],["E","A vesicular lesion."]],"a":"C","sa":null,"pg":"6","f":[],"n":38,"e":["A wheal is an edematous lesion due to increased capillary permeability in the dermis. Why the other options are wrong: A) A secondary lesion: It is primary. B) Permanent: It is transient (under 24 h). D) The primary lesion of acne: The acne primary lesion is the comedone. E) A vesicular lesion: A vesicle is fluid-filled.","Urticaria = wheals."],"im":[]},{"id":"Q039","ch":"Introduction To Dermatology","q":"The picture shows one of the primary lesions of the skin in which there is a transient, edematous, erythematous or skin-colored elevation of the skin of variable sizes. (Clinical photo: erythematous edematous wheals on the skin.) This picture shows:","o":[["A","Pustules."],["B","Macules."],["C","Comedones."],["D","Papules."],["E","Wheals."]],"a":"E","sa":null,"pg":"6","f":[],"n":39,"e":["The picture and history of itchy, transient edematous plaques indicate wheals (urticaria). Why the other options are wrong: A) Pustules: Pustules contain pus. B) Macules: Macules are flat. C) Comedones: Comedones are keratin plugs. D) Papules: Papules are persistent solid.","Wheal = urticaria."],"im":[]},{"id":"Q040","ch":"Introduction To Dermatology","q":"A 33-year-old female patient presented with erythematous, edematous, evanescent, itchy lesions of variable sizes on her back. She states they always appear at sites of pressure on her skin. (Clinical photo: linear erythematous wheals on the back.) What is the primary lesion of this disease?","o":[["A","Papule."],["B","Wheal."],["C","Vesicle."],["D","Nodule."],["E","Macule."]],"a":"B","sa":null,"pg":"6","f":[],"n":40,"e":["The picture of transient, edematous, erythematous plaques is the wheal, which is the primary lesion of urticaria because of dermal edema from histamine. Why the other options are wrong: A) Papule: Papules last longer. C) Vesicle: Vesicles contain fluid. D) Nodule: Nodules are deep. E) Macule: Macules are flat.","Wheal = urticaria."],"im":[]},{"id":"Q041","ch":"Introduction To Dermatology","q":"A vesicle can be differentiated from a bulla by:","o":[["A","Its size."],["B","Its location."],["C","Having a wall."],["D","Its content."],["E","Its color."]],"a":"A","sa":null,"pg":"6","f":[],"n":41,"e":["A vesicle is a fluid-filled blister under 0.5 cm; a bulla is larger than 0.5 cm. They differ by size. Why the other options are wrong: B) Its location: Both can be anywhere. C) Having a wall: Neither has a wall. D) Its content: Both contain fluid. E) Its color: Both are clear.","Vesicle <0.5 cm; bulla >0.5 cm."],"im":[]},{"id":"Q042","ch":"Introduction To Dermatology","q":"A cyst can be differentiated from a bulla by:","o":[["A","Its size."],["B","Its location."],["C","Having a wall."],["D","Its content."],["E","Its color."]],"a":"C","sa":null,"pg":"7","f":[],"n":42,"e":["A cyst has a true epithelial wall and a bulla does not; both contain fluid or material. Why the other options are wrong: A) Its size: Both can vary in size. B) Its location: Both are in the skin. D) Its content: Both can contain fluid. E) Its color: Color does not distinguish.","Cyst = walled."],"im":[]},{"id":"Q043","ch":"Introduction To Dermatology","q":"The main difference between a cyst and a bulla is:","o":[["A","The cyst has a wall, while the bulla doesn't."],["B","The cyst is <0.5 cm, while the bulla is >0.5 cm in diameter."],["C","The cyst contains purulent fluid, while the bulla contains clear fluid."],["D","The cyst is a solid structure, while the bulla contains fluid."],["E","The cyst is a primary lesion, while the bulla is a secondary lesion."]],"a":"A","sa":null,"pg":"7","f":[],"n":43,"e":["A cyst has a wall (epithelial lining) whereas a bulla is a fluid collection within or under the epidermis without a wall. Why the other options are wrong: B) The cyst is <0.5 cm, while the bulla is…: Size is not the difference. C) The cyst contains purulent fluid, while…: Content is not the difference. D) The cyst is a solid structure, while the…: A cyst contains fluid or semi-solid, not solid. E) The cyst is a primary lesion, while the…: Both are primary.","Cyst = wall; bulla = no wall."],"im":[]},{"id":"Q044","ch":"Introduction To Dermatology","q":"A collection of fluid in the skin with a defined histological wall is a:","o":[["A","Bulla."],["B","Cyst."],["C","Vesicle."],["D","Pustule."],["E","Blister."]],"a":"B","sa":null,"pg":"7","f":[],"n":44,"e":["A cyst is a closed sac with a defined wall containing fluid or semisolid material. Vesicles and bullae contain fluid but have no wall of their own. Why the other options are wrong: A) Bulla: A bulla has no wall. C) Vesicle: A vesicle has no wall. D) Pustule: A pustule contains pus. E) Blister: A blister is a vesicle or bulla.","Cyst = walled."],"im":[]},{"id":"Q045","ch":"Introduction To Dermatology","q":"Burrow is:","o":[["A","A localized collection of fluid."],["B","A solid elevation of the skin less than 0.5 cm in diameter."],["C","A tunnel in the epidermis."],["D","A deroofed furrow."],["E","An area of depigmented skin."]],"a":"C","sa":null,"pg":"7","f":[],"n":45,"e":["A burrow is a tunnel in the stratum corneum (epidermis) dug by the female Sarcoptes scabiei mite. Why the other options are wrong: A) A localized collection of fluid: That describes a vesicle. B) A solid elevation of the skin less than…: That describes a papule. D) A deroofed furrow: A furrow is a deroofed burrow. E) An area of depigmented skin: That describes a patch.","Burrow = epidermal tunnel."],"im":[]},{"id":"Q046","ch":"Introduction To Dermatology","q":"Burrow is:","o":[["A","A localized collection of fluid."],["B","A linear elevation of the skin produced by mites."],["C","The primary lesion of urticaria."],["D","Located in the dermis."],["E","An area of depigmented skin."]],"a":"B","sa":null,"pg":"7","f":[],"n":46,"e":["A burrow is a linear, slightly elevated track just under the stratum corneum, dug by the fertilized female Sarcoptes scabiei mite, which lays 2-3 eggs a day. Why the other options are wrong: A) A localized collection of fluid: A vesicle is fluid. C) The primary lesion of urticaria: Urticaria produces wheals. D) Located in the dermis: Burrows are epidermal. E) An area of depigmented skin: That is a patch.","Burrow = scabies sign."],"im":[]},{"id":"Q047","ch":"Introduction To Dermatology","q":"A burrow is the primary lesion of:","o":[["A","Acne vulgaris."],["B","Lupus vulgaris."],["C","Scabies."],["D","Urticaria."],["E","Psoriasis."]],"a":"C","sa":null,"pg":"7","f":[],"n":47,"e":["The burrow is the diagnostic primary lesion of scabies; other signs (papules, vesicles, excoriations) are non-specific. Acne has comedones, lupus vulgaris has apple-jelly nodules and psoriasis has plaques. Why the other options are wrong: A) Acne vulgaris: Acne gives comedones. B) Lupus vulgaris: Lupus vulgaris gives apple-jelly nodules. D) Urticaria: Urticaria gives wheals. E) Psoriasis: Psoriasis gives plaques.","Burrow = scabies."],"im":[]},{"id":"Q048","ch":"Introduction To Dermatology","q":"Dried exudate on the surface of the skin is a:","o":[["A","Scale."],["B","Crust."],["C","Bulla."],["D","Plaque."],["E","Burrow."]],"a":"B","sa":null,"pg":"8","f":[],"n":48,"e":["A crust is dried serum, blood or pus on the skin surface, a secondary lesion. Scales are keratin; erosion and ulcers are tissue losses. Why the other options are wrong: A) Scale: Scale is keratin. C) Bulla: A bulla is fluid. D) Plaque: A plaque is a solid elevation. E) Burrow: A burrow is a tunnel.","Crust = dried exudate; scale = keratin."],"im":[]},{"id":"Q049","ch":"Introduction To Dermatology","q":"A crust:","o":[["A","Is a primary lesion."],["B","Is formed of skin."],["C","May be seen in herpes simplex."],["D","Is always found in the herald patch."],["E","None of the above."]],"a":"C","sa":null,"pg":"22","f":[],"n":49,"e":["Vesicles of herpes simplex rupture and dry into crusts within a few days, healing without a scar. Why the other options are wrong: A) Is a primary lesion: A crust is secondary. B) Is formed of skin: A crust is formed of dried exudate. D) Is always found in the herald patch: A herald patch has scales, not crusts. E) None of the above: Wrong: at least one listed statement is correct.","HSV: vesicle → crust."],"im":[]},{"id":"Q050","ch":"Introduction To Dermatology","q":"Dry or greasy laminated masses of keratin are:","o":[["A","Scales."],["B","Crusts."],["C","Comedones."],["D","Papules."],["E","Nodules."]],"a":"A","sa":null,"pg":"8","f":[],"n":50,"e":["Scales are dry or greasy laminated masses of keratin shed from the surface. Why the other options are wrong: B) Crusts: A crust is dried exudate. C) Comedones: Comedones are follicular plugs. D) Papules: Papules are solid. E) Nodules: Nodules are solid.","Scale = keratin; crust = dried exudate."],"im":[]},{"id":"Q051","ch":"Introduction To Dermatology","q":"An accumulation of keratin due to increased proliferation or decreased desquamation is:","o":[["A","Fissure."],["B","Crust."],["C","Excoriation."],["D","Scale."],["E","Lichenification."]],"a":"D","sa":null,"pg":"8","f":[],"n":51,"e":["Scales result from increased epidermal proliferation (psoriasis) or decreased desquamation (ichthyosis). Why the other options are wrong: A) Fissure: A fissure is a linear crack. B) Crust: A crust is dried exudate. C) Excoriation: An excoriation is a scratch. E) Lichenification: Lichenification is thickening.","Scale = excess keratin."],"im":[]},{"id":"Q052","ch":"Introduction To Dermatology","q":"An erosion:","o":[["A","Is a loss of epidermis & dermis."],["B","Heals with a scar."],["C","Occurs after rupture of vesicles."],["D","Is a primary lesion."],["E","Is seen in psoriasis."]],"a":"C","sa":null,"pg":"9","f":[],"n":52,"e":["An erosion is a superficial loss of epidermis only; it follows rupture of vesicles or bullae and heals without a scar. Why the other options are wrong: A) Is a loss of epidermis & dermis: That is an ulcer. B) Heals with a scar: An erosion heals without scar. D) Is a primary lesion: It is secondary. E) Is seen in psoriasis: Psoriasis does not erode.","Erosion heals without scarring; ulcer scars."],"im":[]},{"id":"Q053","ch":"Introduction To Dermatology","q":"Ulcer is a lesion of:","o":[["A","Erythrasma."],["B","Ecthyma."],["C","Psoriasis."],["D","Alopecia."],["E","Tinea versicolor."]],"a":"B","sa":null,"pg":"13","f":[],"n":53,"e":["An ulcer is loss of epidermis and dermis and heals with a scar; ecthyma is ulcerative impetigo. Why the other options are wrong: A) Erythrasma: Erythrasma is superficial. C) Psoriasis: Psoriasis does not ulcerate. D) Alopecia: Alopecia does not ulcerate. E) Tinea versicolor: Versicolor is superficial.","Ecthyma = ulcerative impetigo."],"im":[]},{"id":"Q054","ch":"Introduction To Dermatology","q":"Accentuation of skin lines due to chronic itching is called?","o":[],"a":null,"sa":"Lichenification.","pg":"10","f":[],"n":54,"e":["Chronic scratching thickens the skin and exaggerates its lines, called lichenification.","Lichenification = chronic eczema."],"im":[]},{"id":"Q055","ch":"Introduction To Dermatology","q":"A transient, edematous, erythematous or skin-colored elevation of the skin of variable sizes is called","o":[["A","Pustule."],["B","Macule."],["C","Comedone."],["D","Papule."],["E","Wheal."]],"a":"E","sa":null,"pg":"6","f":[],"n":55,"e":["A wheal is a transient edematous elevation, erythematous or skin-colored, of variable size. Why the other options are wrong: A) Pustule: Pustules contain pus. B) Macule: Macules are flat. C) Comedone: Comedones are keratin plugs. D) Papule: Papules are persistent solid.","Wheal = urticaria."],"im":[]},{"id":"Q534","ch":"Introduction To Dermatology","q":"Which skin cell functions mainly as a mechanoreceptor detecting gentle touch and pressure?","o":[["A","Merkel cell."],["B","Melanocyte."],["C","Langerhans cell."],["D","Keratinocyte."]],"a":"A","sa":null,"pg":"2","f":[],"n":56,"e":["Merkel cells sit in the basal layer of the epidermis and act as slowly adapting mechanoreceptors for gentle touch and pressure. Melanocytes produce pigment, Langerhans cells provide immunity and keratinocytes build the barrier. Why the other options are wrong: B) Melanocyte: Melanocytes make pigment. C) Langerhans cell: Langerhans cells are immune cells. D) Keratinocyte: Keratinocytes form the barrier.","Merkel = touch; Langerhans = immunity; melanocyte = pigment."],"im":[]},{"id":"H007","ch":"Introduction To Dermatology","q":"Keratin is present in:","o":[["A","Skin."],["B","Hairs."],["C","Nails."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":57,"e":["Keratin is the structural protein of skin, hair and nails, so all of the above. Why the other options are wrong: A) Skin: True, but incomplete alone. B) Hairs: True, but incomplete alone. C) Nails: True, but incomplete alone. E) None of the above: Wrong, keratin is in all three.","Keratin = skin, hair, nails."],"im":[]},{"id":"H011","ch":"Introduction To Dermatology","q":"Cutaneous examination includes examination of:","o":[["A","Skin."],["B","Hair."],["C","Nails."],["D","Mucous membranes."],["E","All of the above."]],"a":"E","sa":null,"pg":null,"f":[],"n":58,"e":["A full cutaneous examination includes skin, hair, nails and mucous membranes. Why the other options are wrong: A) Skin: The skin is examined. True, but hair, nails and mucosae are too. B) Hair: The hair is examined. True, but others are too. C) Nails: The nails are examined. True, but others are too. D) Mucous membranes: Mucous membranes are examined. True, but others are too.","Always examine mucosa, hair and nails."],"im":[]},{"id":"H012","ch":"Introduction To Dermatology","q":"The epidermal cells that act as mechanoreceptors detecting gentle touch and pressure are:","o":[["A","Keratinocytes."],["B","Melanocytes."],["C","Langerhans cells."],["D","Merkel cells."],["E","Schwann cells."]],"a":"D","sa":null,"pg":null,"f":[],"n":59,"e":["Merkel cells in the basal epidermis are slowly adapting mechanoreceptors for gentle touch and pressure. Keratinocytes form the barrier, melanocytes produce pigment and Langerhans cells provide immunity. Why the other options are wrong: A) Keratinocytes: Keratinocytes form the barrier. B) Melanocytes: Melanocytes make pigment. C) Langerhans cells: Langerhans cells are immune cells. E) Schwann cells: Schwann cells are nerve sheath cells.","Merkel = touch."],"im":[]},{"id":"H013","ch":"Introduction To Dermatology","q":"A macule is:","o":[["A","Localized collection of fluid."],["B","Solid elevation of the skin less than 0.5 cm in diameter."],["C","Tunnel in the epidermis produced by female Sarcoptes scabiei."],["D","Dried serum, blood or pus on the skin surface."],["E","Circumscribed non-palpable area of skin discoloration less than 1 cm in diameter."]],"a":"E","sa":null,"pg":null,"f":[],"n":60,"e":["A macule is a circumscribed, non-palpable area of discoloration less than 1 cm. A localized collection of fluid would be a vesicle/bulla and a tunnel is a burrow. Why the other options are wrong: A) Localized collection of fluid: That is a vesicle or bulla. B) Solid elevation of the skin less than 0.…: That is a papule. C) Tunnel in the epidermis produced by fema…: That is a burrow. D) Dried serum, blood or pus on the skin su…: That is a crust.","Macule: color only."],"im":[]},{"id":"H015","ch":"Introduction To Dermatology","q":"A plaque is a:","o":[["A","Patch of abnormal change of skin texture."],["B","Area of depigmentation."],["C","The primary lesion of acne vulgaris."],["D","Localized epidermal collection of fluid."],["E","Deroofed burrow."]],"a":"A","sa":null,"pg":null,"f":[],"n":61,"e":["Per the book, a plaque is an area of abnormal skin texture, raised and over 1 cm, as in psoriasis. Why the other options are wrong: B) Area of depigmentation: That is vitiligo. C) The primary lesion of acne vulgaris: Acne primary lesion is the comedone. D) Localized epidermal collection of fluid: That is a vesicle. E) Deroofed burrow: That is a furrow.","Plaque >1 cm, flat-topped."],"im":[]},{"id":"H019","ch":"Introduction To Dermatology","q":"A cyst can be differentiated from a bulla by:","o":[["A","Its size."],["B","Its location."],["C","Having a wall."],["D","Its content."],["E","None of the above."]],"a":"C","sa":null,"pg":null,"f":[],"n":62,"e":["A cyst has a wall (epithelial lining) whereas a bulla is just a fluid blister. Size and location do not separate them. Why the other options are wrong: A) Its size: Size does not distinguish. B) Its location: Location does not distinguish. D) Its content: Content does not distinguish. E) None of the above: The wall distinguishes them.","Cyst vs bulla: the wall."],"im":[]},{"id":"H021","ch":"Introduction To Dermatology","q":"A furrow is:","o":[["A","A deroofed burrow."],["B","A roofed burrow."],["C","The primary lesion of scabies."],["D","A tunnel in the dermis."],["E","A tunnel in the SC tissue."]],"a":"A","sa":null,"pg":null,"f":[],"n":63,"e":["A furrow is the roof-less (deroofed) burrow left after the burrow roof is lost, as in scabies. Why the other options are wrong: B) A roofed burrow: A roofed burrow is a burrow. C) The primary lesion of scabies: The primary lesion of scabies is the burrow. D) A tunnel in the dermis: It is epidermal, not dermal. E) A tunnel in the SC tissue: It is epidermal, not subcutaneous.","Burrow = roofed; furrow = deroofed."],"im":[]},{"id":"H023","ch":"Introduction To Dermatology","q":"Masses of keratin are called:","o":[["A","Scales."],["B","Crusts."],["C","Comedones."],["D","Papules."],["E","Plaques."]],"a":"A","sa":null,"pg":null,"f":[],"n":64,"e":["Scales are accumulations of keratin from increased proliferation or decreased desquamation. Crusts are dried exudate; comedones are keratin plugs inside follicles. Why the other options are wrong: B) Crusts: Crusts are dried exudate. C) Comedones: Comedones are follicular. D) Papules: Papules are solid. E) Plaques: Plaques are solid.","Scales = keratin."],"im":[]},{"id":"Q056","ch":"Bacterial Infections","q":"All of the following are bacterial infections EXCEPT:","o":[["A","Impetigo."],["B","Erysipelas."],["C","Furuncles."],["D","Cellulitis."],["E","Kerion."]],"a":"E","sa":null,"pg":"11","f":[],"n":1,"e":["Impetigo, folliculitis, erysipelas and cellulitis are bacterial; kerion is an inflammatory fungal (tinea capitis) reaction. Why the other options are wrong: A) Impetigo: Impetigo is bacterial. B) Erysipelas: Erysipelas is bacterial. C) Furuncles: Furuncles are bacterial. D) Cellulitis: Cellulitis is bacterial.","Kerion = fungal, not bacterial."],"im":[]},{"id":"Q057","ch":"Bacterial Infections","q":"The following are bacterial infections EXCEPT:","o":[["A","Impetigo."],["B","Acne vulgaris."],["C","Erythrasma."],["D","Erysipelas."],["E","Furuncles."]],"a":"B","sa":null,"pg":"11","f":[],"n":2,"e":["Acne vulgaris is a chronic inflammatory disease of the pilosebaceous unit; bacteria (C. acnes) contribute but it is not an infection. Why the other options are wrong: A) Impetigo: Impetigo is bacterial. C) Erythrasma: Erythrasma is bacterial. D) Erysipelas: Erysipelas is bacterial. E) Furuncles: Furuncles are bacterial.","Acne ≠ infection."],"im":[]},{"id":"Q058","ch":"Bacterial Infections","q":"Impetigo may be caused by:","o":[["A","Herpes simplex virus."],["B","Mycobacterium leprae."],["C","Pox virus."],["D","Streptococci and staphylococci."],["E","Human papilloma virus."]],"a":"D","sa":null,"pg":"11","f":[],"n":3,"e":["Impetigo is a superficial infection caused by Staphylococcus aureus and/or group A beta-hemolytic streptococci. Why the other options are wrong: A) Herpes simplex virus: HSV is viral. B) Mycobacterium leprae: M. leprae causes leprosy. C) Pox virus: Pox virus causes molluscum. E) Human papilloma virus: HPV causes warts.","Non-bullous impetigo: staph ± strep."],"im":[]},{"id":"Q059","ch":"Bacterial Infections","q":"How does impetigo present?","o":[["A","Golden honey-colored crust over an erythematous base."],["B","Salmon-colored plaque with silvery scale."],["C","Comedones, pustules and nodules."],["D","Flesh-colored papule with a rough surface."],["E","Polyangular violaceous papule."]],"a":"A","sa":null,"pg":"12","f":[],"n":4,"e":["Impetigo contagiosa shows vesicles/pustules that rupture to leave golden honey-colored crusts on an erythematous base. Why the other options are wrong: B) Salmon-colored plaque with silvery scale: That is psoriasis. C) Comedones, pustules and nodules: That is acne. D) Flesh-colored papule with a rough surface: That is a wart. E) Polyangular violaceous papule: That is lichen planus.","Honey-colored crust = impetigo."],"im":[]},{"id":"Q060","ch":"Bacterial Infections","q":"Impetigo:","o":[["A","Is commoner in adults."],["B","Is caused only by streptococci."],["C","Heals with permanent scarring."],["D","Acute glomerulonephritis is a possible complication."],["E","Doesn't cause blistering."]],"a":"D","sa":null,"pg":"12","f":[],"n":5,"e":["Streptococcal impetigo can lead to post-streptococcal acute glomerulonephritis; rheumatic fever is not a complication. Why the other options are wrong: A) Is commoner in adults: It is commoner in children. B) Is caused only by streptococci: It is staph and/or strep. C) Heals with permanent scarring: It heals without scar. E) Doesn't cause blistering: Bullous impetigo blisters.","Impetigo → AGN (not rheumatic fever)."],"im":[]},{"id":"Q061","ch":"Bacterial Infections","q":"Poststreptococcal glomerulonephritis is a complication of:","o":[["A","Herpes zoster."],["B","Herpes simplex."],["C","Bullous impetigo."],["D","Impetigo contagiosum."],["E","Impetigo of Bockhart."]],"a":"D","sa":null,"pg":"12","f":[],"n":6,"e":["Nephritogenic streptococcal strains in impetigo contagiosa can trigger post-streptococcal glomerulonephritis. Why the other options are wrong: A) Herpes zoster: Zoster does not trigger GN. B) Herpes simplex: HSV does not trigger GN. C) Bullous impetigo: Bullous impetigo is staph. E) Impetigo of Bockhart: Bockhart is staph folliculitis.","Skin strep → AGN."],"im":[]},{"id":"Q062","ch":"Bacterial Infections","q":"The following drug is used for treatment of honey-colored crusted lesions around the mouth after scratching insect bites:","o":[["A","Topical azole."],["B","Topical antibiotic."],["C","Oral fluconazole."],["D","Oral ivermectin."],["E","Topical permethrin."]],"a":"B","sa":null,"pg":"13","f":[],"n":7,"e":["Localized impetigo is treated with topical antibiotics (e.g. fusidic acid, mupirocin). Antifungals, ivermectin and permethrin do not treat bacteria. Why the other options are wrong: A) Topical azole: Azoles treat fungi. C) Oral fluconazole: Fluconazole treats fungi. D) Oral ivermectin: Ivermectin treats parasites. E) Topical permethrin: Permethrin treats scabies.","Localized impetigo → topical antibiotic."],"im":[]},{"id":"Q063","ch":"Bacterial Infections","q":"Bullous impetigo is caused by:","o":[["A","Pneumococci."],["B","Streptococci."],["C","Meningococci."],["D","Staphylococci."],["E","Propionibacteria."]],"a":"D","sa":null,"pg":"12","f":[],"n":8,"e":["Bullous impetigo is caused by Staphylococcus aureus, whose exfoliative toxin splits the upper epidermis. Why the other options are wrong: A) Pneumococci: Pneumococci cause pneumonia and otitis, not impetigo. B) Streptococci: Streptococci cause non-bullous impetigo. C) Meningococci: Meningococci cause meningitis. E) Propionibacteria: Propionibacteria cause acne.","Bullous impetigo = staph."],"im":[]},{"id":"Q064","ch":"Bacterial Infections","q":"Bullous impetigo in neonates is due to:","o":[["A","Group A β-hemolytic streptococci exotoxin."],["B","Staphylococcus aureus exfoliative exotoxin."],["C","Corynebacterium toxin."],["D","Pseudomonas exotoxin."],["E","Clostridial toxin."]],"a":"B","sa":null,"pg":"12","f":[],"n":9,"e":["In neonates, S. aureus exfoliative toxins (ETA/ETB) cause the superficial blisters of bullous impetigo. Why the other options are wrong: A) Group A β-hemolytic streptococci exotoxin: Strep does not cause bullous impetigo. C) Corynebacterium toxin: Corynebacterium causes erythrasma. D) Pseudomonas exotoxin: Pseudomonas is not involved. E) Clostridial toxin: Clostridium is not involved.","Same toxin causes scalded skin syndrome."],"im":[]},{"id":"Q065","ch":"Bacterial Infections","q":"Bullous impetigo:","o":[["A","Is a purely staphylococcal infection."],["B","Is a mixed staphylococcal & streptococcal infection."],["C","Affects neonates."],["D","a + c."],["E","b + c."]],"a":"D","sa":null,"pg":"12","f":[],"n":10,"e":["Per the book, bullous impetigo is a staphylococcal infection that affects neonates, so a + c (the option set matches the key). Why the other options are wrong: A) Is a purely staphylococcal infection: Bullous impetigo is staph, so this is true; it must be combined with C. B) Is a mixed staphylococcal & streptococca…: Bullous impetigo is purely staphylococcal (exfoliative toxin), not mixed. C) Affects neonates: True, but incomplete alone. E) b + c: It is not mixed.","Bullous = staph, neonates."],"im":[]},{"id":"Q066","ch":"Bacterial Infections","q":"A male infant, 6 months old, presented with these lesions on his leg of one week duration. His mother stated that his elder sister had the same lesions. The condition was associated with fever. (Clinical photo: flaccid bullae/pustules with clear-yellow fluid on erythematous skin of the leg.) What is the diagnosis of this case?","o":[["A","Bullous impetigo."],["B","Herpes simplex."],["C","Pustular psoriasis."],["D","Crusted scabies."],["E","Acute eczema."]],"a":"A","sa":null,"pg":"12","f":[],"n":11,"e":["Flaccid blisters and crusts in an infant, with contact cases and fever, indicate bullous impetigo. Why the other options are wrong: B) Herpes simplex: HSV gives grouped vesicles. C) Pustular psoriasis: Pustular psoriasis is sterile. D) Crusted scabies: Crusted scabies is itchy and crusted. E) Acute eczema: Eczema is itchy.","Neonatal bullous impetigo is contagious."],"im":[]},{"id":"Q067","ch":"Bacterial Infections","q":"A male infant, 6 months old, presented with these lesions on his leg of one week duration. His mother stated that his elder sister had the same lesions. The condition was associated with fever. (Clinical photo: flaccid bullae/pustules with clear-yellow fluid on erythematous skin of the leg.) Regarding this disease, choose the correct statement:","o":[["A","Is a superficial bacterial infection."],["B","Diagnosed by patch test."],["C","Heals by scar formation."],["D","Is a deep parasitic infection."],["E","Treated by topical ivermectin 1%."]],"a":"A","sa":null,"pg":"11","f":[],"n":12,"e":["Bullous impetigo is a superficial bacterial infection and heals without scarring; it is not parasitic and needs no patch test. Why the other options are wrong: B) Diagnosed by patch test: Diagnosed clinically. C) Heals by scar formation: It heals without scar. D) Is a deep parasitic infection: It is bacterial. E) Treated by topical ivermectin 1%: Ivermectin is for parasites.","Superficial = no scar."],"im":[]},{"id":"Q068","ch":"Bacterial Infections","q":"Ecthyma is:","o":[["A","Crusted impetigo."],["B","Ulcerative impetigo."],["C","Circinate impetigo."],["D","Bullous impetigo."],["E","Vesicular impetigo."]],"a":"B","sa":null,"pg":"13","f":[],"n":13,"e":["Ecthyma is the ulcerative (deeper) form of impetigo, extending to the dermis. Why the other options are wrong: A) Crusted impetigo: Crusted impetigo is non-bullous. C) Circinate impetigo: Circinate impetigo is another type. D) Bullous impetigo: Bullous impetigo has blisters. E) Vesicular impetigo: Vesicular impetigo is non-bullous.","Ecthyma = ulcerative impetigo."],"im":[]},{"id":"Q069","ch":"Bacterial Infections","q":"Ecthyma is:","o":[["A","Crusted impetigo."],["B","Circinate impetigo."],["C","Bullous impetigo."],["D","Bockhart's impetigo."],["E","None of the above."]],"a":"E","sa":null,"pg":"13","f":[],"n":14,"e":["Ecthyma is ulcerative impetigo; none of the other options given describes it, so 'none of the above' is the key. Why the other options are wrong: A) Crusted impetigo: It is not crusted impetigo. B) Circinate impetigo: It is not circinate. C) Bullous impetigo: It is not bullous. D) Bockhart's impetigo: Bockhart is superficial folliculitis.","Ecthyma heals with scar."],"im":[]},{"id":"Q070","ch":"Bacterial Infections","q":"Ecthyma is:","o":[["A","A type of eczema."],["B","A fungal infection."],["C","An autoimmune disease."],["D","A type of warts."],["E","A type of impetigo."]],"a":"E","sa":null,"pg":"13","f":[],"n":15,"e":["Ecthyma is the ulcerative, deeper variant of non-bullous impetigo, caused by group A streptococci, and heals with scarring. Why the other options are wrong: A) A type of eczema: Ecthyma is a bacterial infection (deep ulcerative impetigo), not eczema. B) A fungal infection: Ecthyma is bacterial, not fungal. C) An autoimmune disease: Ecthyma is bacterial, not autoimmune. D) A type of warts: It is not a wart.","Ecthyma = deep impetigo with ulcer."],"im":[]},{"id":"Q071","ch":"Bacterial Infections","q":"The following is a clinical variant of impetigo contagiosum:","o":[["A","Ecthyma."],["B","Cellulitis."],["C","Erysipelas."],["D","Erythrasma."],["E","Molluscum."]],"a":"A","sa":null,"pg":"13","f":[],"n":16,"e":["Clinical variants of impetigo are non-bullous, bullous and ulcerative (ecthyma). Ecthyma extends into the dermis, forming a punched-out ulcer with a hemorrhagic crust. Why the other options are wrong: B) Cellulitis: Cellulitis is deeper. C) Erysipelas: Erysipelas is dermal. D) Erythrasma: Erythrasma is separate. E) Molluscum: Molluscum is viral.","Ecthyma scars."],"im":[]},{"id":"Q072","ch":"Bacterial Infections","q":"A 10-year-old male child has vesicles which turn into pustules with the formation of thick crusts that heal with scar formation on his legs. The most likely diagnosis is:","o":[["A","Sycosis barbae."],["B","Atopic dermatitis."],["C","Cellulitis."],["D","Ulcerative impetigo (ecthyma)."],["E","Molluscum contagiosum."]],"a":"D","sa":null,"pg":"13","f":[],"n":17,"e":["Vesicles turning to pustules with thick crusts that heal with scarring describe ulcerative impetigo (ecthyma). Why the other options are wrong: A) Sycosis barbae: Sycosis is beard folliculitis. B) Atopic dermatitis: Atopic dermatitis is eczema. C) Cellulitis: Cellulitis is subcutaneous. E) Molluscum contagiosum: Molluscum is viral.","Ecthyma scars; ordinary impetigo does not."],"im":[]},{"id":"Q073","ch":"Bacterial Infections","q":"Ulcerative impetigo (ecthyma) is treated by systemic:","o":[["A","Azoles."],["B","Antihistamines."],["C","Antibiotics."],["D","Steroids."],["E","Retinoids."]],"a":"C","sa":null,"pg":"13","f":[],"n":18,"e":["Ecthyma is deep and needs systemic antibiotics (anti-staphylococcal/anti-streptococcal) plus local care. Why the other options are wrong: A) Azoles: Azoles treat fungi. B) Antihistamines: Antihistamines treat itch. D) Steroids: Steroids worsen infection. E) Retinoids: Retinoids treat acne.","Ecthyma → oral antibiotics."],"im":[]},{"id":"Q074","ch":"Bacterial Infections","q":"Ecthyma is ___ and is treated by ___.","o":[],"a":null,"sa":"Ulcerative impetigo (a deep variant of non-bullous impetigo); treated by systemic antibiotics.","pg":"13","f":[],"n":19,"e":["Ecthyma is a deep ulcerative variant of impetigo and is treated by systemic antibiotics.","Ecthyma = ulcer + oral antibiotics."],"im":[]},{"id":"Q075","ch":"Bacterial Infections","q":"Mention the clinical types of impetigo.","o":[],"a":null,"sa":"Non-bullous impetigo (impetigo contagiosa), bullous impetigo, and ulcerative impetigo (ecthyma)","pg":"12","f":[],"n":20,"e":["Clinical types are non-bullous (impetigo contagiosa), bullous impetigo and ulcerative impetigo (ecthyma). The book's answer text was cut off in the PDF; please verify.","Three types: non-bullous, bullous, ulcerative."],"im":[]},{"id":"Q076","ch":"Bacterial Infections","q":"Staphylococcal infection in the upper part of the hair follicle is known as:","o":[["A","Folliculitis."],["B","Sycosis barbae."],["C","Furuncle."],["D","Cellulitis."],["E","Carbuncle."]],"a":"A","sa":null,"pg":"13","f":[],"n":21,"e":["Staphylococcal infection of the upper (superficial) part of the follicle is folliculitis (Bockhart impetigo). Why the other options are wrong: B) Sycosis barbae: Sycosis involves the beard follicle. C) Furuncle: A furuncle is deep. D) Cellulitis: Cellulitis is subcutaneous. E) Carbuncle: A carbuncle is deep and multiple.","Folliculitis = superficial."],"im":[]},{"id":"Q077","ch":"Bacterial Infections","q":"Infection of the lower part of the hair follicle is called:","o":[["A","Folliculitis."],["B","Furunculosis."],["C","Kerion."],["D","Erythrasma."],["E","Impetigo."]],"a":"B","sa":null,"pg":"14","f":[],"n":22,"e":["Infection of the lower, deeper part of the follicle with necrosis is a furuncle (furunculosis when recurrent). Why the other options are wrong: A) Folliculitis: Folliculitis is upper. C) Kerion: Kerion is fungal. D) Erythrasma: Erythrasma is bacterial but not follicular. E) Impetigo: Impetigo is epidermal.","Furuncle = deep follicle."],"im":[]},{"id":"Q078","ch":"Bacterial Infections","q":"Suppurative infection of the lower part of the hair follicle with central necrosis:","o":[["A","Carbuncle."],["B","Pustule."],["C","Furuncle."],["D","Folliculitis."],["E","Cellulitis."]],"a":"C","sa":null,"pg":"14","f":[],"n":23,"e":["A furuncle is a suppurative infection of the lower follicle with a central necrotic core ('core'). Why the other options are wrong: A) Carbuncle: Carbuncle is several boils. B) Pustule: A pustule is superficial. D) Folliculitis: Folliculitis is upper follicle. E) Cellulitis: Cellulitis is diffuse.","Furuncle = boil with core."],"im":[]},{"id":"Q079","ch":"Bacterial Infections","q":"Multiple deep boils opening on the skin surface by multiple fistulae is called:","o":[["A","Kerion."],["B","Sycosis."],["C","Furunculosis."],["D","Carbuncle."],["E","Cellulitis."]],"a":"D","sa":null,"pg":"14","f":[],"n":24,"e":["A carbuncle is a group of coalescing furuncles draining through multiple openings. Why the other options are wrong: A) Kerion: Kerion is fungal. B) Sycosis: Sycosis is superficial. C) Furunculosis: Furunculosis is multiple separate boils. E) Cellulitis: Cellulitis is diffuse.","Carbuncle = multiple furuncles, many openings."],"im":[]},{"id":"Q080","ch":"Bacterial Infections","q":"A 40-year-old diabetic male develops a large, indurated, tender plaque on the back of the neck with multiple pus-discharging openings. The most likely diagnosis is:","o":[["A","Furuncle."],["B","Abscess."],["C","Folliculitis."],["D","Cellulitis."],["E","Carbuncle."]],"a":"E","sa":null,"pg":"14","f":[],"n":25,"e":["A large indurated painful plaque on the back of the neck with multiple draining openings in a diabetic is a carbuncle. Why the other options are wrong: A) Furuncle: A furuncle is single. B) Abscess: An abscess lacks multiple openings. C) Folliculitis: Folliculitis is superficial. D) Cellulitis: Cellulitis is diffuse.","Carbuncle: diabetic, nape of neck."],"im":[]},{"id":"Q081","ch":"Bacterial Infections","q":"Carbuncle is caused by which organism?","o":[],"a":null,"sa":"Staphylococcus aureus.","pg":"14","f":[],"n":26,"e":["Carbuncles are coalescent deep boils caused by Staphylococcus aureus, more often in diabetic males and nasal carriers.","Boils: S. aureus."],"im":[]},{"id":"Q082","ch":"Bacterial Infections","q":"Erysipelas is a:","o":[["A","Streptococcal infection of the epidermis."],["B","Staphylococcal infection of the subcutaneous tissue."],["C","Streptococcal infection of the hair follicles."],["D","Streptococcal infection of the dermis."],["E","Staphylococcal infection of the sweat ducts."]],"a":"D","sa":null,"pg":"15","f":[],"n":27,"e":["Erysipelas is a streptococcal infection of the upper dermis with lymphatic involvement. Why the other options are wrong: A) Streptococcal infection of the epidermis: It involves the dermis. B) Staphylococcal infection of the subcutan…: It is streptococcal. C) Streptococcal infection of the hair foll…: Follicles are not primary. E) Staphylococcal infection of the sweat du…: Sweat ducts are not primary.","Erysipelas = strep, upper dermis."],"im":[]},{"id":"Q083","ch":"Bacterial Infections","q":"Erysipelas characteristically involves which skin layer?","o":[["A","Epidermis only."],["B","Upper dermis and lymphatics."],["C","Lower dermis and subcutis."],["D","Subcutaneous fat only."],["E","Muscle layer."]],"a":"B","sa":null,"pg":null,"f":[],"n":28,"e":["Erysipelas affects the upper dermis and superficial lymphatics, giving a sharply demarcated raised red plaque. Cellulitis is deeper. Why the other options are wrong: A) Epidermis only: Impetigo is epidermal. C) Lower dermis and subcutis: That is cellulitis. D) Subcutaneous fat only: Fat involvement is panniculitis. E) Muscle layer: Muscle is not involved.","Erysipelas sharp edge; cellulitis ill-defined."],"im":[]},{"id":"Q084","ch":"Bacterial Infections","q":"Erysipelas:","o":[["A","Is a bacterial infection of the subcutaneous tissue."],["B","Affects the intertriginous areas."],["C","Gives coral red fluorescence with Wood's light."],["D","Is caused by Staphylococcus aureus."],["E","Is complicated by (lymph)edema."]],"a":"E","sa":null,"pg":"15","f":[],"n":29,"e":["Erysipelas involves the superficial dermal lymphatics, so repeated attacks scar the lymphatics and cause lymphedema. Lymphedema also predisposes to the next attack. Why the other options are wrong: A) Is a bacterial infection of the subcutan…: It is dermal. B) Affects the intertriginous areas: It involves face and legs. C) Gives coral red fluorescence with Wood's…: Coral red is erythrasma. D) Is caused by Staphylococcus aureus: It is streptococcal.","Erysipelas ↔ lymphedema."],"im":[]},{"id":"Q085","ch":"Bacterial Infections","q":"In erysipelas:","o":[["A","Lymphedema might be a predisposing factor."],["B","Lymphedema might be a complication."],["C","Marked edema with blistering may be observed."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":30,"e":["Lymphedema predisposes to erysipelas and is also a complication of it, and marked edema with bullae can occur; so all of the above. Why the other options are wrong: A) Lymphedema might be a predisposing factor: Lymphedema predisposes. True, but B and C are also true. B) Lymphedema might be a complication: Recurrent erysipelas can cause lymphedema. True, but A and C are also true. C) Marked edema with blistering may be obse…: Severe edema with blisters can occur. True, but A and B are also true. E) None of the above: Wrong: A, B and C are all true.","Vicious circle: lymphedema ↔ erysipelas."],"im":[]},{"id":"Q086","ch":"Bacterial Infections","q":"Lymphedema is a complication of recurrent:","o":[["A","Impetigo."],["B","Erythrasma."],["C","Erysipelas."],["D","Pediculosis."],["E","Favus."]],"a":"C","sa":null,"pg":"15","f":[],"n":31,"e":["Recurrent episodes of erysipelas extend into superficial lymphatics and cause permanent lymphedema (the book's first complication, with glomerulonephritis). Why the other options are wrong: A) Impetigo: Impetigo is superficial. B) Erythrasma: Erythrasma is superficial. D) Pediculosis: Pediculosis is parasitic. E) Favus: Favus is fungal.","Recurrent erysipelas → lymphedema."],"im":[]},{"id":"Q087","ch":"Bacterial Infections","q":"A common complication of erysipelas is:","o":[["A","Pruritus."],["B","Malignant transformation."],["C","Deep venous thrombosis."],["D","Lymphedema."],["E","Scar formation."]],"a":"D","sa":null,"pg":"15","f":[],"n":32,"e":["The commonest complication is lymphedema from lymphatic damage; glomerulonephritis is the other listed complication. DVT and ulceration are not typical. Why the other options are wrong: A) Pruritus: Pruritus is not typical. B) Malignant transformation: No malignant change. C) Deep venous thrombosis: DVT is not typical. E) Scar formation: It does not scar.","Lymphedema."],"im":[]},{"id":"Q088","ch":"Bacterial Infections","q":"An obese female with lower limb lymphedema presented with a well-defined erythematous, swollen, tender area affecting the right leg. The patient was feverish and lethargic. Diagnosis is:","o":[["A","Acute urticaria."],["B","Lepromatous leprosy."],["C","Erysipelas."],["D","Ecthyma."],["E","Erythrasma."]],"a":"C","sa":null,"pg":"15","f":[],"n":33,"e":["A well-demarcated hot red swollen leg with fever on a lymphedematous limb is erysipelas. Why the other options are wrong: A) Acute urticaria: Urticaria is transient. B) Lepromatous leprosy: Leprosy has no fever. D) Ecthyma: Ecthyma is ulcerative. E) Erythrasma: Erythrasma is brown scaly.","Fever + sharp red leg = erysipelas."],"im":[]},{"id":"Q089","ch":"Bacterial Infections","q":"A 45-year-old diabetic male presented with a 3-day history of a progressively increasing warm, tender swelling on the posterolateral aspect of his left calf with recurrent attacks of fever and rigors. Examination revealed a well-defined edematous and erythematous induration. Body temperature was 38°C and white cell count was 15,000. This patient has a:","o":[["A","Streptococcal infection of the dermis."],["B","Streptococcal infection of the epidermis."],["C","Staphylococcal infection of the subcutaneous tissue."],["D","Streptococcal infection of the hair follicles."],["E","Staphylococcal infection of the sweat ducts."]],"a":"A","sa":null,"pg":"15","f":[],"n":34,"e":["A warm, tender, spreading erythematous swelling with systemic features in a diabetic is a streptococcal dermal infection (erysipelas). Why the other options are wrong: B) Streptococcal infection of the epidermis: Impetigo is epidermal. C) Staphylococcal infection of the subcutan…: Staph subcutaneous would be cellulitis. D) Streptococcal infection of the hair foll…: Follicles are not involved. E) Staphylococcal infection of the sweat du…: Sweat ducts are not involved.","Treat with penicillin."],"im":[]},{"id":"Q090","ch":"Bacterial Infections","q":"A 55-year-old diabetic woman presented with a 3-day history of a progressively increasing warm, tender, erythematous swelling on her left cheek. Investigations revealed a white cell count of 15,000 and HbA1c of 8.9. (Clinical photo: bright red, well-demarcated erythematous swelling of the cheek and ear.) The diagnosis of this case is:","o":[["A","Ecthyma."],["B","Erysipelas."],["C","Impetigo contagiosum."],["D","Carbuncle."],["E","Erythrasma."]],"a":"B","sa":null,"pg":"15","f":[],"n":35,"e":["The clinical picture of a sharply demarcated, hot, tender erythema is erysipelas. Why the other options are wrong: A) Ecthyma: Ecthyma is ulcerative. C) Impetigo contagiosum: Impetigo is crusted. D) Carbuncle: Carbuncle is multiple boils. E) Erythrasma: Erythrasma is brown scaly.","Erysipelas = sharp border."],"im":[]},{"id":"Q091","ch":"Bacterial Infections","q":"A 55-year-old diabetic woman presented with a 3-day history of a progressively increasing warm, tender, erythematous swelling on her left cheek. Investigations revealed a white cell count of 15,000 and HbA1c of 8.9. (Clinical photo: bright red, well-demarcated erythematous swelling of the cheek and ear.) This patient has a:","o":[["A","Streptococcal infection of the dermis."],["B","Streptococcal infection of the epidermis."],["C","Staphylococcal infection of the subcutaneous tissue."],["D","Streptococcal infection of the hair follicles."],["E","Staphylococcal infection of the sweat ducts."]],"a":"A","sa":null,"pg":"15","f":[],"n":36,"e":["A hot red tender swollen area with a sharp border and systemic symptoms is erysipelas, a group A streptococcal infection of the upper dermis, treated with penicillin. Why the other options are wrong: B) Streptococcal infection of the epidermis: Impetigo is epidermal. C) Staphylococcal infection of the subcutan…: Staph subcutaneous would be cellulitis. D) Streptococcal infection of the hair foll…: Follicles are not involved. E) Staphylococcal infection of the sweat du…: Sweat ducts are not involved.","Erysipelas = strep, upper dermis."],"im":[]},{"id":"Q092","ch":"Bacterial Infections","q":"A 55-year-old diabetic woman presented with a 3-day history of a progressively increasing warm, tender, erythematous swelling on her left cheek. Investigations revealed a white cell count of 15,000 and HbA1c of 8.9. (Clinical photo: bright red, well-demarcated erythematous swelling of the cheek and ear.) All of the following statements are correct EXCEPT:","o":[["A","Treated by systemic antibiotics."],["B","Associated with fever and malaise."],["C","Shows yellow fluorescence by Wood's light."],["D","Complicated by lymphedema."],["E","Recurrent attacks are common."]],"a":"C","sa":null,"pg":"15","f":[],"n":37,"e":["Erythrasma shows coral-red (not yellow) fluorescence under Wood's light, so that statement is the incorrect one. Why the other options are wrong: A) Treated by systemic antibiotics: True of erysipelas. B) Associated with fever and malaise: True of erysipelas. D) Complicated by lymphedema: True of erysipelas. E) Recurrent attacks are common: True of erysipelas.","Erythrasma = coral red; versicolor = yellow."],"im":[]},{"id":"Q093","ch":"Bacterial Infections","q":"The causative organism of erythrasma is:","o":[["A","Staphylococcus aureus."],["B","Propionibacterium acnes."],["C","Corynebacterium minutissimum."],["D","Dermatophytes."],["E","Candida albicans."]],"a":"C","sa":null,"pg":"16","f":[],"n":38,"e":["Erythrasma is caused by Corynebacterium minutissimum, which produces porphyrins that fluoresce. Why the other options are wrong: A) Staphylococcus aureus: S. aureus causes boils. B) Propionibacterium acnes: P. acnes causes acne. D) Dermatophytes: Dermatophytes cause tinea. E) Candida albicans: Candida causes candidiasis.","Erythrasma = C. minutissimum."],"im":[]},{"id":"Q094","ch":"Bacterial Infections","q":"Erythrasma:","o":[["A","Is a suppurative inflammation of the upper dermis."],["B","Involves intertriginous areas such as axillae, groins and submammary region."],["C","Is caused by Streptococcus pyogenes."],["D","Shows yellow fluorescence on Wood's light examination."],["E","Is associated with fever and malaise."]],"a":"B","sa":null,"pg":"16","f":[],"n":39,"e":["Erythrasma affects intertriginous areas: axillae, groins and submammary folds, with brown scaly patches. Why the other options are wrong: A) Is a suppurative inflammation of the upp…: It is superficial. C) Is caused by Streptococcus pyogenes: It is Corynebacterium. D) Shows yellow fluorescence on Wood's ligh…: Fluorescence is coral red. E) Is associated with fever and malaise: It is asymptomatic.","Folds + coral red."],"im":[]},{"id":"Q095","ch":"Bacterial Infections","q":"A presentation of brown-red scaly groin patches with coral red fluorescence in an obese diabetic patient is diagnostic of:","o":[["A","Tinea cruris."],["B","Erythrasma."],["C","Candidiasis."],["D","Psoriasis."],["E","Tinea versicolor."]],"a":"B","sa":null,"pg":"16","f":[],"n":40,"e":["Brown-red scaly groin patches with coral-red fluorescence in an obese diabetic are erythrasma, treated with erythromycin. Why the other options are wrong: A) Tinea cruris: Tinea has no coral red. C) Candidiasis: Candidiasis is red and satellite. D) Psoriasis: Psoriasis is silvery. E) Tinea versicolor: Versicolor is yellow.","Treat: erythromycin."],"im":[]},{"id":"Q096","ch":"Bacterial Infections","q":"In erythrasma, Wood's light fluorescence is:","o":[["A","Red."],["B","Green."],["C","Yellow."],["D","White."],["E","Violet."]],"a":"A","sa":null,"pg":"16","f":[],"n":41,"e":["The porphyrins of C. minutissimum give coral-red fluorescence on Wood's light. Why the other options are wrong: B) Green: Green is not seen. C) Yellow: Yellow is versicolor. D) White: White is not seen. E) Violet: Violet is not seen.","Red fluorescence = erythrasma."],"im":[]},{"id":"Q097","ch":"Bacterial Infections","q":"Regarding erythrasma, Wood's light examination shows:","o":[["A","Yellow-green fluorescence."],["B","Coral red fluorescence."],["C","Enhancement of color contrast."],["D","No change."],["E","Blue-green fluorescence."]],"a":"B","sa":null,"pg":"16","f":[],"n":42,"e":["Corynebacterium minutissimum produces porphyrins that fluoresce coral red on Wood's light. Yellow fluorescence belongs to versicolor and yellow-green to favus and black-dot ringworm. Why the other options are wrong: A) Yellow-green fluorescence: Yellow-green is favus. C) Enhancement of color contrast: Enhancement of contrast under Wood's lamp is typical of vitiligo, not erythrasma. D) No change: Erythrasma shows a distinct coral-red fluorescence. E) Blue-green fluorescence: Blue-green is Pseudomonas.","Coral red = erythrasma."],"im":[]},{"id":"Q098","ch":"Bacterial Infections","q":"Wood's light helps in the diagnosis of:","o":[["A","Tinea circinata."],["B","Impetigo contagiosum."],["C","Erythrasma."],["D","Erysipelas."],["E","Condyloma acuminata."]],"a":"C","sa":null,"pg":"16","f":[],"n":43,"e":["Wood's light helps diagnose erythrasma (coral red), pityriasis versicolor (yellow) and favus, among others. Why the other options are wrong: A) Tinea circinata: Tinea circinata is variable. B) Impetigo contagiosum: Impetigo does not fluoresce. D) Erysipelas: Erysipelas does not fluoresce. E) Condyloma acuminata: Condyloma does not fluoresce.","Wood's light: erythrasma, versicolor, favus, vitiligo."],"im":[]},{"id":"H028","ch":"Bacterial Infections","q":"Bullous impetigo:","o":[["A","Is a purely staphylococcal infection."],["B","Is a mixed staphylococcal & streptococcal infection."],["C","Affects neonates."],["D","A + c."],["E","B + c."]],"a":"D","sa":null,"pg":null,"f":[],"n":44,"e":["Bullous impetigo is a staphylococcal infection (not mixed) that affects neonates. Why the other options are wrong: A) Is a purely staphylococcal infection: Not purely, since a + c. B) Is a mixed staphylococcal & streptococca…: Bullous impetigo is purely staphylococcal (exfoliativ
