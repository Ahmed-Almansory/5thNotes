tal moniliasis is candidal. Balanitis is candidal.\nDermatophytes only.",""],"im":[]},{"id":"Q224","ch":"Fungal Infections","q":"Griseofulvin may be used in the treatment of","o":[["A","Oral thrush."],["B","Tinea versicolor."],["C","Tinea cruris."],["D","Interdigital moniliasis."],["E","Balanitis."]],"a":"C","sa":null,"pg":"37","f":[],"n":37,"e":["Griseofulvin treats dermatophyte infections such as tinea cruris, not yeast infections. Oral thrush is Candida (yeast). Tinea versicolor is Malassezia (yeast). Interdigital moniliasis is candidal. Balanitis is candidal.\nDermatophytosis.",""],"im":[]},{"id":"Q225","ch":"Fungal Infections","q":"Griseofulvin is a drug of choice for","o":[["A","Dermatophytosis."],["B","Tinea versicolor."],["C","Oral thrush."],["D","Erosio interdigitalis blastomycetica."],["E","Balanitis."]],"a":"A","sa":null,"pg":"37","f":[],"n":38,"e":["Griseofulvin is a drug of choice for dermatophytosis (tinea). Tinea versicolor is yeast. Oral thrush is yeast. Erosio interdigitalis blastomycetica is candidal. Balanitis is usually candidal.\nNot yeasts.",""],"im":[]},{"id":"Q226","ch":"Fungal Infections","q":"Griseofulvin is","o":[["A","The drug of choice in scalp pediculosis."],["B","Used for treatment of dermatophyte infection."],["C","Never used in children."],["D","Effective in treatment of pityriasis versicolor."],["E","The backbone for treatment of leprosy."]],"a":"B","sa":null,"pg":"37","f":[],"n":39,"e":["Griseofulvin is an antifungal for dermatophyte infections. Scalp pediculosis is treated with insecticides such as permethrin. It is used in children for tinea capitis (12.5 mg/kg/day). It is not effective in yeast infections like pityriasis versicolor. Leprosy is treated with rifampicin, dapsone and clofazimine.\nDermatophytes.",""],"im":[]},{"id":"Q227","ch":"Fungal Infections","q":"Griseofulvin is effective in the treatment of all of the following EXCEPT","o":[["A","Tinea capitis."],["B","Tinea corporis."],["C","Tinea versicolor."],["D","Onychomycosis."],["E","Tinea pedis."]],"a":"C","sa":null,"pg":"41","f":[],"n":40,"e":["Griseofulvin is not effective in yeast infection, so it is the exception for tinea versicolor (Malassezia). Tinea capitis is its main indication. Griseofulvin is used in extensive tinea corporis. The book names terbinafine and azoles for nails, but griseofulvin is a dermatophyte drug that has been used for nails. Tinea pedis is dermatophyte infection.\nGriseofulvin ≠ versicolor.",""],"im":[]},{"id":"Q228","ch":"Fungal Infections","q":"Tinea versicolor is a superficial fungal infection caused by","o":[["A","Trichophyton rubrum."],["B","Malassezia furfur."],["C","Microsporum canis."],["D","Candida albicans."],["E","Trichophyton violaceum."]],"a":"B","sa":null,"pg":"38","f":[],"n":41,"e":["Tinea versicolor (pityriasis versicolor) is caused by the lipophilic yeast Malassezia furfur. Trichophyton is a dermatophyte causing tinea. Microsporum is a dermatophyte of scalp ringworm. Candida albicans causes candidiasis. Trichophyton is a dermatophyte.",""],"im":[]},{"id":"Q229","ch":"Fungal Infections","q":"Malassezia furfur is the causative organism of","o":[["A","Tinea circinata."],["B","Tinea cruris."],["C","Pityriasis rosea."],["D","Pityriasis versicolor."],["E","Erythrasma."]],"a":"D","sa":null,"pg":"38","f":[],"n":42,"e":["Malassezia furfur causes pityriasis versicolor. Tinea circinata is dermatophyte infection. Tinea cruris is dermatophyte infection. Pityriasis rosea is probably a viral exanthem. Erythrasma is caused by Corynebacterium minutissimum.",""],"im":[]},{"id":"Q230","ch":"Fungal Infections","q":"Malassezia furfur","o":[["A","Is a dermatophyte."],["B","Causes tinea capitis."],["C","Is treated by griseofulvin."],["D","All of the above."],["E","None of the above."]],"a":"E","sa":null,"pg":"38","f":[],"n":43,"e":["Malassezia furfur is a lipophilic yeast, not a dermatophyte, does not cause tinea capitis, and is not treated by griseofulvin. It is a yeast. Tinea capitis is caused by dermatophytes. Griseofulvin is ineffective in yeasts. All three statements are false.",""],"im":[]},{"id":"Q231","ch":"Fungal Infections","q":"Regarding pityriasis versicolor","o":[["A","It affects children only."],["B","It is very itchy."],["C","Systemic antifungal therapy is essential in the treatment."],["D","A single attack gives lifelong immunity."],["E","It is caused by the lipophilic yeast Malassezia furfur."]],"a":"E","sa":null,"pg":"38","f":[],"n":44,"e":["Pityriasis versicolor is caused by the lipophilic yeast Malassezia furfur. It occurs in adolescents and young adults. It is usually asymptomatic, and itching is mild if present. Topical therapy is first-line; systemic is for extensive cases. Recurrences are common, so there is no lifelong immunity.",""],"im":[]},{"id":"Q232","ch":"Fungal Infections","q":"Pityriasis versicolor","o":[["A","Is a superficial dermatophytic infection of the skin."],["B","Primary lesion is hyper- or hypopigmented papules."],["C","Macules are covered with fine branny scales."],["D","Treatment is by griseofulvin."],["E","Is non-infectious."]],"a":"C","sa":null,"pg":"38","f":[],"n":45,"e":["Pityriasis versicolor lesions are macules or patches with mild, fine (branny) scales. It is caused by a yeast, not a dermatophyte. The lesions are macules and patches, not papules. Griseofulvin is ineffective in yeasts. It is an infectious superficial mycosis.",""],"im":[]},{"id":"Q233","ch":"Fungal Infections","q":"A male patient, 18 years old, had his summer vacation by the sea. He returned with hypo- and hyperpigmented finely scaly macules and patches on the upper trunk, neck and proximal upper limbs. What is the diagnosis?","o":[["A","Lichen planus."],["B","Pityriasis rosea."],["C","Pityriasis versicolor."],["D","Psoriasis."],["E","Subacute lupus."]],"a":"C","sa":null,"pg":"38","f":[],"n":46,"e":["Hypo- and hyperpigmented finely scaly macules on the upper trunk after sun exposure are pityriasis versicolor. Lichen planus is itchy violaceous flat-topped papules. Pityriasis rosea has a herald patch and Christmas-tree pattern. Psoriasis has silvery scaly plaques. Subacute lupus is an inflammatory annular photosensitive rash.\nSummer.",""],"im":[]},{"id":"Q234","ch":"Fungal Infections","q":"A 22-year-old female returns from a fortnight holiday in Cyprus with a tan and numerous scaly hypopigmented lesions on the neck and upper trunk. What is the most likely diagnosis?","o":[["A","Chronic plaque psoriasis."],["B","Contact eczema."],["C","Pityriasis rosea."],["D","Pityriasis versicolor."],["E","Candidiasis."]],"a":"D","sa":null,"pg":"38","f":[],"n":47,"e":["Scaly hypopigmented lesions on the neck and upper trunk with a tan are pityriasis versicolor. Plaque psoriasis has thick silvery plaques. Contact eczema is itchy and vesicular. Pityriasis rosea has a herald patch and oval patches. Candidiasis is moist erythema with satellites in flexures.\nSummer + tan.",""],"im":[]},{"id":"Q235","ch":"Fungal Infections","q":"An adult patient presents with multiple, asymptomatic, hypopigmented macules on the upper back and chest with fine branny scaling. Lesions show yellow fluorescence under Wood's lamp. The most likely diagnosis is:","o":[["A","Erythrasma."],["B","Post-inflammatory hypopigmentation."],["C","Pityriasis rosea."],["D","Leprosy."],["E","Pityriasis versicolor."]],"a":"E","sa":null,"pg":"38","f":[],"n":48,"e":["Asymptomatic hypopigmented macules with branny scales and yellow Wood's fluorescence are pityriasis versicolor. Erythrasma gives coral-red fluorescence and is in flexures. Post-inflammatory hypopigmentation follows a prior inflammatory lesion. Pityriasis rosea is pink oval patches with a herald patch. Leprosy gives anesthetic patches.\nUpper trunk.",""],"im":[]},{"id":"Q236","ch":"Fungal Infections","q":"A female patient presented with multiple small hypopigmented scaly macules on the back and trunk, extending to the breasts in addition to her neck and proximal upper limbs. The condition started after a summer vacation in Alexandria. Wood's light examination was performed. (Clinical photo: back/trunk with multiple small hypopigmented scaly macules.) What is the diagnosis of this case?","o":[["A","Tinea cruris."],["B","Tinea versicolor."],["C","Tinea capitis."],["D","Tinea barbae."],["E","Tinea unguium."]],"a":"B","sa":null,"pg":"38","f":[],"n":49,"e":["Hypopigmented scaly macules on the trunk and neck after a summer holiday are tinea (pityriasis) versicolor. Tinea cruris is groin. Tinea capitis is scalp. Tinea barbae is beard. Tinea unguium is nails.\nUpper trunk.",""],"im":[]},{"id":"Q237","ch":"Fungal Infections","q":"A female patient presented with multiple small hypopigmented scaly macules on the back and trunk, extending to the breasts in addition to her neck and proximal upper limbs. The condition started after a summer vacation in Alexandria. Wood's light examination was performed. (Clinical photo: back/trunk with multiple small hypopigmented scaly macules.) Regarding this disease, choose the appropriate statement","o":[["A","Griseofulvin is an effective treatment."],["B","Itching is more at night."],["C","Slit-skin smear stained with Ziehl-Neelsen is used for diagnosis."],["D","Caused by the lipophilic yeast Malassezia furfur."],["E","A single attack gives lifelong immunity."]],"a":"D","sa":null,"pg":"38","f":[],"n":50,"e":["Pityriasis versicolor is caused by the lipophilic yeast Malassezia furfur. Griseofulvin is not effective in yeast. Nocturnal itching is a feature of scabies. Slit-skin smear with Ziehl-Neelsen is for leprosy. Recurrences are common.",""],"im":[]},{"id":"Q238","ch":"Fungal Infections","q":"Regarding pityriasis versicolor, what is the result of Wood's light examination?","o":[["A","Coral red fluorescence."],["B","Yellow fluorescence."],["C","Permanganate-colored fluorescence."],["D","Bluish fluorescence."],["E","Brown fluorescence."]],"a":"B","sa":null,"pg":"38","f":[],"n":51,"e":["Pityriasis versicolor shows yellow fluorescence under Wood's light. Coral red is erythrasma. Not a Wood's-lamp color in the book: yellow = versicolor, coral red = erythrasma, yellowish-green = favus/black-dot. Not a Wood's-lamp color in the book: yellow = versicolor, coral red = erythrasma, yellowish-green = favus/black-dot. Not a Wood's-lamp color in the book: yellow = versicolor, coral red = erythrasma, yellowish-green = favus/black-dot.",""],"im":[]},{"id":"Q239","ch":"Fungal Infections","q":"Wood's light examination reveals a yellow color when the skin is affected by","o":[["A","Vitiligo."],["B","Erythrasma."],["C","Tinea versicolor."],["D","Tinea circinata."],["E","None of the above."]],"a":"C","sa":null,"pg":"38","f":[],"n":52,"e":["Tinea versicolor shows yellow fluorescence. Vitiligo appears bright white. Erythrasma gives coral red. Tinea circinata is diagnosed by KOH microscopy/culture; it does not give yellow fluorescence. Wrong: tinea versicolor (option C) gives yellow fluorescence.\nYellow = versicolor.",""],"im":[]},{"id":"Q240","ch":"Fungal Infections","q":"Spaghetti and meatballs appearance represents the mycelia and spores of","o":[["A","Candida albicans infection."],["B","Dermatophyte infection."],["C","Pityriasis versicolor infection."],["D","Staphylococcus aureus infection."],["E","Corynebacterium minutissimum infection."]],"a":"C","sa":null,"pg":"38","f":[],"n":53,"e":["KOH shows short hyphae with round spores ('spaghetti and meatballs') in pityriasis versicolor. Candida shows budding yeast and pseudohyphae. Dermatophytes show long branching hyphae and arthrospores. Staph aureus is a bacterium, not seen with KOH. Erythrasma bacterium is seen on stain.",""],"im":[]},{"id":"Q241","ch":"Fungal Infections","q":"A patient with multiple hypopigmented macules on the upper trunk that show yellow fluorescence under Wood's lamp, and KOH shows spaghetti and meatballs. The best treatment option is:","o":[["A","Topical steroid."],["B","Oral macrolide."],["C","Oral griseofulvin."],["D","Topical azole."],["E","Topical sulphur 5%."]],"a":"D","sa":null,"pg":"38","f":[],"n":54,"e":["Wood's yellow fluorescence and spaghetti-and-meatballs on KOH are pityriasis versicolor, best treated with topical azole. Topical steroid does not kill yeast. Macrolides are antibacterial. Griseofulvin is ineffective in yeast. Sulphur is not listed in the book; azoles and selenium sulphide are.",""],"im":[]},{"id":"Q242","ch":"Fungal Infections","q":"Tinea versicolor may be treated by one of the following","o":[["A","Ketoconazole."],["B","Griseofulvin."],["C","Fusidic acid."],["D","Tetracycline."],["E","Permethrin."]],"a":"A","sa":null,"pg":"38","f":[],"n":55,"e":["Ketoconazole, an azole, treats pityriasis versicolor. Griseofulvin is ineffective in yeast. Fusidic acid is antibacterial. Tetracycline is antibacterial. Permethrin is antiparasitic.\nAzoles work.",""],"im":[]},{"id":"Q243","ch":"Fungal Infections","q":"Tinea versicolor can be treated by all of the following EXCEPT","o":[["A","Itraconazole."],["B","Ketoconazole."],["C","Griseofulvin."],["D","Fluconazole."],["E","Selenium sulphide."]],"a":"C","sa":null,"pg":"38","f":[],"n":56,"e":["Griseofulvin does not work against yeasts, so it is the exception. Itraconazole 100 mg twice daily for one week is used. Ketoconazole shampoo is used. Fluconazole 150 mg capsules is used. Selenium sulphide shampoo is used.\nGriseofulvin fails.",""],"im":[]},{"id":"Q244","ch":"Fungal Infections","q":"The following medications can be used for the treatment of pityriasis versicolor EXCEPT","o":[["A","Selenium sulphide 2.5%."],["B","Tincture iodine."],["C","Ketoconazole."],["D","Griseofulvin."],["E","Itraconazole."]],"a":"D","sa":null,"pg":"41","f":[],"n":57,"e":["Griseofulvin is ineffective in yeast, so it is the exception. Selenium sulphide shampoo is a listed topical. Tincture iodine is not listed for PV in the book, but griseofulvin is the definite exception. Ketoconazole is a listed treatment. Itraconazole is a listed systemic treatment.\nGriseofulvin doesn't treat yeasts.",""],"im":[]},{"id":"Q245","ch":"Fungal Infections","q":"Candida albicans is the causative organism of","o":[["A","Oral lichen planus."],["B","Tinea cruris."],["C","Oral thrush."],["D","Pityriasis versicolor."],["E","Erythrasma."]],"a":"C","sa":null,"pg":"40","f":[],"n":58,"e":["Candida albicans causes oral thrush. Oral lichen planus is immune-mediated. Tinea cruris is a dermatophyte infection. Pityriasis versicolor is caused by Malassezia. Erythrasma is bacterial.\nThrush = Candida.",""],"im":[]},{"id":"Q246","ch":"Fungal Infections","q":"Interdigital moniliasis of the hand is common between which fingers?","o":[],"a":null,"sa":"Between the middle and ring fingers (3rd and 4th fingers), as this space is anatomically narrow.","pg":"39","f":[],"n":59,"e":["Interdigital candidiasis is common between the middle and ring fingers because this space is narrow and retains moisture.\n3rd–4th web.",""],"im":[]},{"id":"Q247","ch":"Fungal Infections","q":"Cutaneous manifestations of candida include","o":[["A","Ecthyma."],["B","Hypopigmentation."],["C","Favus."],["D","Herald patch."],["E","Perleche."]],"a":"E","sa":null,"pg":"39","f":[],"n":60,"e":["Perleche (angular cheilitis) is a cutaneous candida manifestation. Ecthyma is bacterial. Hypopigmentation is a feature of pityriasis versicolor. Favus is dermatophyte. Herald patch is pityriasis rosea.",""],"im":[]},{"id":"Q248","ch":"Fungal Infections","q":"Cutaneous manifestations of candida include all of the following EXCEPT","o":[["A","Intertrigo."],["B","Erosio interdigitalis blastomycetica."],["C","Favus."],["D","Paronychia."],["E","Perleche."]],"a":"C","sa":null,"pg":"39","f":[],"n":61,"e":["Favus is a dermatophyte infection, not candida. Candidal intertrigo: erythema with satellite pustules in the groin, axillae and inframammary folds. Interdigital candidiasis: macerated sodden skin between finger webs, typically the ring-middle space. Candidal paronychia: chronic swollen red nail fold in wet-work occupations (housewives, cooks), with no throbbing or pointing. Perleche (angular cheilitis): maceration at the angles of the mouth.\nFavus = dermatophyte.",""],"im":[]},{"id":"Q249","ch":"Fungal Infections","q":"Cutaneous manifestations of candida include all of the following EXCEPT","o":[["A","Intertrigo."],["B","Erosio interdigitalis blastomycetica."],["C","Kerion."],["D","Paronychia."],["E","Perleche."]],"a":"C","sa":null,"pg":"39","f":[],"n":62,"e":["Kerion is a dermatophyte infection, not candida. Candidal intertrigo: erythema with satellite pustules in the groin, axillae and inframammary folds. Interdigital candidiasis: macerated sodden skin between finger webs, typically the ring-middle space. Candidal paronychia: chronic swollen red nail fold in wet-work occupations (housewives, cooks), with no throbbing or pointing. Perleche (angular cheilitis): maceration at the angles of the mouth.\nKerion = dermatophyte.",""],"im":[]},{"id":"Q250","ch":"Fungal Infections","q":"All of the following are clinical presentations of candida infection EXCEPT","o":[["A","Erosio interdigitalis blastomycetica."],["B","Balanitis."],["C","Favus."],["D","Chronic paronychia."],["E","Perleche."]],"a":"C","sa":null,"pg":"39","f":[],"n":63,"e":["Favus is a dermatophyte infection, not candida. Interdigital candidiasis: macerated sodden skin between finger webs, typically the ring-middle space. Candidal balanitis: glans of uncircumcised males and diabetics. Candidal paronychia: chronic swollen red nail fold in wet-work occupations (housewives, cooks), with no throbbing or pointing. Perleche (angular cheilitis): maceration at the angles of the mouth.\nFavus excluded.",""],"im":[]},{"id":"Q251","ch":"Fungal Infections","q":"Candida may cause all of the following EXCEPT:","o":[["A","Perleche."],["B","Erythrasma."],["C","Chronic paronychia."],["D","Intertrigo."],["E","Erosio interdigitalis blastomycetica."]],"a":"B","sa":null,"pg":"39","f":[],"n":64,"e":["Erythrasma is caused by Corynebacterium minutissimum. Perleche (angular cheilitis): maceration at the angles of the mouth. Candidal paronychia: chronic swollen red nail fold in wet-work occupations (housewives, cooks), with no throbbing or pointing. Candidal intertrigo: erythema with satellite pustules in the groin, axillae and inframammary folds. Interdigital candidiasis: macerated sodden skin between finger webs, typically the ring-middle space.\nErythrasma bacterial.",""],"im":[]},{"id":"Q252","ch":"Fungal Infections","q":"Candidiasis may present as all of the following EXCEPT:","o":[["A","Intertrigo."],["B","Oral thrush."],["C","Perleche."],["D","Candidal arthritis."],["E","Erosio interdigitalis blastomycetica."]],"a":"D","sa":null,"pg":"39","f":[],"n":65,"e":["Candida causes cutaneous and mucosal infections, not arthritis in this list. Candidal intertrigo: erythema with satellite pustules in the groin, axillae and inframammary folds. Oral thrush: whitish pseudomembrane in infants, debilitated adults and HIV. Perleche (angular cheilitis): maceration at the angles of the mouth. Interdigital candidiasis: macerated sodden skin between finger webs, typically the ring-middle space.\nNot cutaneous.",""],"im":[]},{"id":"Q253","ch":"Fungal Infections","q":"Treatment of choice for candidal paronychia is:","o":[["A","Imiquimod."],["B","Clofazimine."],["C","Griseofulvin."],["D","Macrolide."],["E","Fluconazole."]],"a":"E","sa":null,"pg":"41","f":[],"n":66,"e":["Fluconazole is systemic azole for candida. Imiquimod is for warts. Clofazimine is for leprosy. Griseofulvin is not effective in yeast. Macrolides are antibacterial.",""],"im":[]},{"id":"Q254","ch":"Fungal Infections","q":"A 4-year-old child presented with a circumscribed area of hair loss. Short stumps of hairs and scales were seen. The diagnosis is","o":[["A","Alopecia areata."],["B","Tinea capitis."],["C","Discoid lupus erythematosus."],["D","Lichen planus."],["E","Psoriasis."]],"a":"B","sa":null,"pg":"33","f":[],"n":67,"e":["A child with a circumscribed bald patch, broken stumps of hair and fine grayish-white scales has scaly (gray patch) tinea capitis; the hairs break off above the skin. Alopecia areata is smooth and not scaly, with normal-looking scalp skin. DLE gives scarring, atrophic, scaly plaques and is rare in young children. Lichen planus (planopilaris) is an adult disease that scars the scalp. Psoriasis gives thick silvery plaques without breaking of hairs into stumps.\nChild + stumps + scales.",""],"im":[]},{"id":"H120","ch":"Fungal Infections","q":"Kerion:","o":[["A","Is a boggy swelling simulating an abscess."],["B","May lead to scarring alopecia."],["C","Is usually caused by fungi of animal origin."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":68,"e":["Kerion is a boggy swelling that mimics an abscess, may scar, and is usually caused by animal-origin dermatophytes.\nKerion scars.",""],"im":[]},{"id":"H123","ch":"Fungal Infections","q":"Griseofulvin may be used in the treatment of:","o":[["A","Oral thrush."],["B","Tinea versicolor."],["C","Tinea corporis."],["D","Interdigital monilia."],["E","None of the above."]],"a":"C","sa":null,"pg":null,"f":[],"n":69,"e":["Griseofulvin is used in dermatophyte infections such as tinea corporis, but is not effective in yeast infections. Oral thrush is Candida (yeast). Tinea versicolor is Malassezia (yeast). Interdigital moniliasis is candidal (yeast), and griseofulvin is not effective in yeast. Wrong: option C (tinea corporis) is correct.\nDermatophytes only.",""],"im":[]},{"id":"H128","ch":"Fungal Infections","q":"A child presents with area of thick yellow cup-shaped crusts surrounding hair shafts on the scalp, associated with scarring alopecia. The most likely diagnosis is:","o":[["A","Tinea corporis."],["B","Favus."],["C","Discoid lupus erythematosus."],["D","Impetigo."],["E","Seborrheic dermatitis."]],"a":"B","sa":null,"pg":null,"f":[],"n":70,"e":["Thick yellow cup-shaped crusts around hair shafts with scarring alopecia are scutula of favus. Tinea corporis affects hairless skin, not the scalp. DLE scars but has no cup-shaped crusts around hairs. Impetigo has honey-colored crusts and does not cause scarring alopecia. Seborrheic dermatitis gives greasy scales and no scarring.\nScutula + scar.",""],"im":[]},{"id":"H133","ch":"Fungal Infections","q":"Wood’s light is used in the diagnosis of:","o":[["A","Tinea versicolor."],["B","Erythrasma."],["C","Favus."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":71,"e":["Wood's light shows yellow fluorescence in tinea versicolor, coral red in erythrasma and yellowish-green in favus (and black-dot type), so all are diagnosed with it.\nAll three.",""],"im":[]},{"id":"H136","ch":"Fungal Infections","q":"Onychomycosis is:","o":[["A","Ringworm of the scalp."],["B","Ringworm of the beard."],["C","Ringworm of the groin."],["D","Ringworm of the nails."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":72,"e":["Onychomycosis is ringworm of the nails. Scalp is tinea capitis. Beard is tinea barbae. Groin is tinea cruris. Wrong: option D is correct.",""],"im":[]},{"id":"H140","ch":"Fungal Infections","q":"An adult patient presents with multiple, asymptomatic, hypopigmented macules on the upper back and chest with fine branny scaling. Lesions show yellow fluorescence under Wood's lamp. The most likely diagnosis is:","o":[["A","Erythrasma."],["B","Post-inflammatory hypopigmentation."],["C","Pityriasis rosea."],["D","Leprosy."],["E","Pityriasis versicolor."]],"a":"E","sa":null,"pg":null,"f":[],"n":73,"e":["Asymptomatic hypopigmented macules with branny scales and yellow Wood's fluorescence are pityriasis versicolor. Erythrasma gives coral-red fluorescence and is in flexures. Post-inflammatory hypopigmentation follows a prior inflammatory lesion. Pityriasis rosea is pink oval patches with a herald patch. Leprosy gives anesthetic patches.\nYellow glow.",""],"im":[]},{"id":"H145","ch":"Fungal Infections","q":"A 45-year-old farmer presents with scaly erythematous patches on the groin with an active, raised border and central clearing. What is the most likely diagnosis?","o":[["A","Tinea cruris."],["B","Candidal intertrigo."],["C","Pityriasis rosea."],["D","Seborrheic dermatitis."],["E","Erythrasma."]],"a":"A","sa":null,"pg":null,"f":[],"n":74,"e":["Scaly erythematous patches in the groin with an active raised border and central clearing are tinea cruris. Candidal intertrigo has satellite lesions and pustules without central clearing. Pityriasis rosea is on the trunk with a herald patch. Seborrheic dermatitis has greasy scales without central clearing. Erythrasma is well-defined brown patches with no active border.",""],"im":[]},{"id":"H146","ch":"Fungal Infections","q":"A patient presents with patchy hair loss associated with a boggy, tender scalp swelling and follicular pustules. The condition did not improve after a course of antibiotics. What is the most likely diagnosis?","o":[["A","Favus."],["B","Kerion."]],"a":"B","sa":null,"pg":null,"f":[],"n":75,"e":["Boggy tender swelling with pustules not responding to antibiotics is kerion. Favus gives yellow cup-shaped crusts (scutula) around hairs, not a boggy swelling with pustules.\nNot bacterial.",""],"im":[]},{"id":"H155","ch":"Fungal Infections","q":"A male patient, 33 years old, complains of an annular lesion with an active border and pale center in his beard area, of acute onset and progressive course for two weeks. He took antibiotics with no improvement. The diagnosis is:","o":[["A","Tinea versicolor."],["B","Tinea barbae."],["C","Discoid lupus erythematosus."],["D","Molluscum contagiosum."]],"a":"B","sa":null,"pg":null,"f":[],"n":76,"e":["Annular lesion with active border in beard that did not improve with antibiotics is tinea barbae. Versicolor is on the trunk. DLE is scarring plaque. Molluscum is papules.",""],"im":[]},{"id":"H156","ch":"Fungal Infections","q":"A child presents with an area of boggy swelling studded with follicular pustules on the scalp, associated with scarring alopecia. The most likely diagnosis is:","o":[["A","Ecthyma."],["B","Favus."],["C","Discoid lupus erythematosus."],["D","Kerion."],["E","Seborrheic dermatitis."]],"a":"D","sa":null,"pg":null,"f":[],"n":77,"e":["Boggy swelling with pustules and scarring is kerion. Ecthyma is ulcerative. Favus has scutula. DLE has atrophic plaques. Seborrheic dermatitis has no boggy swelling.\nKerion → cicatricial alopecia.",""],"im":[]},{"id":"H157","ch":"Fungal Infections","q":"Which statement regarding the scaly type of tinea capitis is correct?","o":[["A","It affects adults only."],["B","Its presence should suggest immunological deficiency."],["C","It results in cicatricial alopecia."],["D","It causes patches that fluoresce yellow-green under Wood's lamp."],["E","It is effectively treated with topical nystatin ointment."]],"a":"D","sa":null,"pg":null,"f":["Answer key corrected per your instruction."],"n":78,"e":["The scaly type fluoresces yellow-green under Wood's lamp (note: the book itself lists black-dot type and favus for this finding); the other statements are false. Note: I am not sure about this answer; it is either B or D. It affects children only. The book does not link the scaly type with immune deficiency, but see the note: the answer is uncertain between B and D. It does not scar. Nystatin is ineffective against dermatophytes.\nMicrosporum = yellow-green.",""],"im":[]},{"id":"Q255","ch":"Parasitic Infestations","q":"Itching is the cardinal symptom in","o":[["A","Vitiligo"],["B","Alopecia"],["C","Scabies"],["D","Leprosy"],["E","Impetigo"]],"a":"C","sa":null,"pg":null,"f":[],"n":1,"e":["Scabies produces intense generalized itching that is worse at night and when warm, which is the cardinal symptom and the first clue. Vitiligo is asymptomatic. Alopecia is asymptomatic. Leprosy is anesthetic. Impetigo is crusted.\nNight itch.",""],"im":[]},{"id":"Q256","ch":"Parasitic Infestations","q":"The following disease is itchy","o":[["A","Alopecia areata"],["B","Ecthyma"],["C","Tinea capitis"],["D","Tuberculoid leprosy"],["E","Scabies"]],"a":"E","sa":null,"pg":"42","f":[],"n":2,"e":["Scabies is itchy (nocturnal pruritus) and contagious, whereas psoriasis, vitiligo and tinea are not described as itchy diseases. AA is asymptomatic. Ecthyma is ulcerative. Capitis is asymptomatic. TT is anesthetic.\nScabies itches.",""],"im":[]},{"id":"Q257","ch":"Parasitic Infestations","q":"The following disease is contagious","o":[["A","Pityriasis rosea"],["B","Urticaria"],["C","Scabies"],["D","Vitiligo"],["E","Acne"]],"a":"C","sa":null,"pg":"42","f":[],"n":3,"e":["Scabies is contagious by close physical contact (and rarely via clothes or bedding), so contacts must be treated. PR is not contagious. Urticaria is allergic (histamine wheals) and not transmitted. Vitiligo is autoimmune and not contagious. Acne is a pilosebaceous disease, not an infection you can catch.\nContact spread.",""],"im":[]},{"id":"Q258","ch":"Parasitic Infestations","q":"Scabies: what is the causative parasite, and what is the primary lesion?","o":[],"a":null,"sa":"Sarcoptes scabiei (fertilized female mite); the primary lesion is the burrow.","pg":null,"f":[],"n":4,"e":["Scabies is caused by the fertilized female Sarcoptes scabiei mite whose primary lesion is the burrow.",""],"im":[]},{"id":"Q260","ch":"Parasitic Infestations","q":"The following diseases are scaly EXCEPT","o":[["A","Tinea versicolor"],["B","Erythrasma"],["C","Psoriasis"],["D","Pityriasis rosea"],["E","Scabies"]],"a":"E","sa":null,"pg":"42","f":[],"n":5,"e":["Scabies lesions are burrows, papules and excoriations, not scales, whereas psoriasis, tinea, seborrheic dermatitis and pityriasis rosea are scaly. Scaly. Scaly. Scaly. Scaly.\nNot scaly.",""],"im":[]},{"id":"Q261","ch":"Parasitic Infestations","q":"Scabies in adults usually involves the following body sites EXCEPT","o":[["A","Wrist"],["B","Genitalia"],["C","Buttocks"],["D","Upper back"],["E","Flexures"]],"a":"D","sa":null,"pg":"43","f":[],"n":6,"e":["Adult scabies spares the upper back; it involves finger webs, wrists, flexures, genitalia and buttocks. Involved. Involved. Involved. Involved.\nUpper back spared.",""],"im":[]},{"id":"Q262","ch":"Parasitic Infestations","q":"Sites of predilection of scabietic burrows in adults include all of the following EXCEPT","o":[["A","In-between fingers & wrist area"],["B","Medial sides of forearms"],["C","Anterior axillary folds & lower abdomen"],["D","Breast in females & genitalia in males"],["E","Upper back"]],"a":"E","sa":null,"pg":"43","f":[],"n":7,"e":["Scabies involves finger sides and webs, wrists, elbows, axillae, waist, buttocks, genitalia and feet, but spares the head, neck, upper back, palms and soles in adults. Predilection. Predilection. Predilection. Predilection.\nUpper back spared.",""],"im":[]},{"id":"Q263","ch":"Parasitic Infestations","q":"One of the following is a cause of pruritus in the pubic area","o":[["A","Scabies"],["B","Pediculosis capitis"],["C","Molluscum contagiosum"],["D","Tinea versicolor"],["E","Alopecia areata"]],"a":"A","sa":null,"pg":null,"f":[],"n":8,"e":["Pubic itching occurs in scabies (genital involvement) and in pediculosis pubis; head lice, molluscum, versicolor and alopecia areata do not. Capitis is scalp. Molluscum is papules. Versicolor is asymptomatic. AA is asymptomatic.\nGenitalia.",""],"im":[]},{"id":"Q264","ch":"Parasitic Infestations","q":"A patient presents with generalized itching at night and burrows in the fingers. The most likely diagnosis is:","o":[["A","Pediculosis"],["B","Scabies"],["C","Urticaria"],["D","Eczema"],["E","Candidiasis"]],"a":"B","sa":null,"pg":"42","f":[],"n":9,"e":["Generalized night itching with burrows on the fingers is scabies; urticaria has wheals and eczema has no burrows. Pediculosis has nits. Urticaria has wheals. Eczema has no burrows. Candida is red.",""],"im":[]},{"id":"Q265","ch":"Parasitic Infestations","q":"The following may help in the diagnosis of scabies","o":[["A","Positive family history"],["B","Night itching"],["C","Distribution of lesions"],["D","All of the above"],["E","None of the above"]],"a":"D","sa":null,"pg":"44","f":[],"n":10,"e":["Scabies is diagnosed on nocturnal pruritus, family history, lesion morphology and distribution, supported by dermoscopy; so all of the above.\nAll clues.",""],"im":[]},{"id":"Q266","ch":"Parasitic Infestations","q":"A 4-month-old infant presented with vesicles and pustules affecting his face, palms and soles, associated with a family history of severe itching at night. (Clinical photo: papulovesicular/pustular rash on the face and vesicopustules on the sole.) The most likely diagnosis is","o":[["A","Disseminated candidiasis"],["B","Pediculosis corporis"],["C","Tinea corporis"],["D","Scabies"],["E","Tuberculoid leprosy"]],"a":"D","sa":null,"pg":"44","f":[],"n":11,"e":["The picture of burrows and papules in typical sites with itching and family history is scabies. Candidiasis is rare. Corporis is on the body. Tinea is scaly. Leprosy is anesthetic.\nTypical scabies.",""],"im":[]},{"id":"Q267","ch":"Parasitic Infestations","q":"A 4-month-old infant presented with vesicles and pustules affecting his face, palms and soles, associated with a family history of severe itching at night. (Clinical photo: papulovesicular/pustular rash on the face and vesicopustules on the sole.) This condition is treated by","o":[["A","Radiotherapy"],["B","Topical permethrin"],["C","Topical corticosteroids"],["D","Systemic antifungals"],["E","Systemic isotretinoin"]],"a":"B","sa":null,"pg":"46","f":[],"n":12,"e":["Scabies is treated with topical permethrin 5% (safe for infants over 2 months and pregnancy), applied to the whole skin, repeated after a week, and treating contacts. Radiotherapy has no role here; vitiligo is treated by stopping the autoimmune process and stimulating repigmentation (phototherapy, steroids, calcineurin inhibitors). Steroids worsen. Antifungals do not treat it. Isotretinoin is for acne.",""],"im":[]},{"id":"Q268","ch":"Parasitic Infestations","q":"A 6-month-old infant had itchy erythematous papules and exudative lesions on the scalp, face and back for one month with vesicular lesions on the palms. The most likely diagnosis is","o":[["A","Atopic dermatitis"],["B","Scabies"],["C","Seborrheic dermatitis"],["D","Psoriasis"],["E","Discoid lupus erythematosus"]],"a":"B","sa":null,"pg":"44","f":[],"n":13,"e":["An infant with itchy papules, exudation and palm vesicles has scabies, which affects palms and soles in infants. Atopic spares palms. Seb derm is greasy. Psoriasis is silvery. DLE is atrophic.\nInfants: palms, soles.",""],"im":[]},{"id":"Q269","ch":"Parasitic Infestations","q":"A male baby, 9 months old, was brought by his mother with papules, pustules, scratch marks and impetigo involving his face, trunk, genitalia, palms and soles. His mother reported insomnia and crying most of the day, and gave a history of night itching. What is the diagnosis?","o":[["A","Seborrheic dermatitis"],["B","Scabies"],["C","Tinea corporis"],["D","Lichen planus"],["E","Psoriasis"]],"a":"B","sa":null,"pg":"44","f":[],"n":14,"e":["An infant with papules, pustules, scratch marks and impetiginization has scabies. Seb derm is greasy. Tinea is scaly. LP is violaceous. Psoriasis is silvery.\nInfant scabies.",""],"im":[]},{"id":"Q270","ch":"Parasitic Infestations","q":"A 2-year-old infant had linear pruritic lesions involving the head, neck, palms and soles of one week duration. His mother had a similar condition 4 weeks ago involving her wrists, abdomen and breast. The most likely diagnosis is","o":[["A","Atopic dermatitis"],["B","Scabies"],["C","Tinea corporis"],["D","Lichen planus"],["E","Psoriasis"]],"a":"B","sa":null,"pg":"44","f":[],"n":15,"e":["Linear pruritic lesions of head, neck, palms and soles in an infant indicate scabies. Atopic is flexural. Tinea is scaly. LP is violaceous. Psoriasis is silvery.\nPalms/soles.",""],"im":[]},{"id":"Q271","ch":"Parasitic Infestations","q":"A male with intensely pruritic nodules on the scrotum for 2 months, with a past history of scabies treated with anti-scabietic treatment, is suffering from","o":[["A","Nodular scabies"],["B","Animal scabies"],["C","Phthirus pubis"],["D","Pediculosis corporis"],["E","Lepromatous leprosy"]],"a":"A","sa":null,"pg":"44","f":[],"n":16,"e":["Itchy scrotal nodules after treated scabies are post-scabietic nodular scabies. Animal scabies has no burrows. Phthirus is lice. Corporis is lice. LL is nodules.\nScrotum.",""],"im":[]},{"id":"Q272","ch":"Parasitic Infestations","q":"A 28-year-old male presented with intensely pruritic nodules on the scrotum for 2 months and a past history of scabies. A suitable treatment for such lesions is","o":[["A","Phototherapy"],["B","Radiotherapy"],["C","Electrocautery"],["D","Podophyllin resin"],["E","Intralesional corticosteroids"]],"a":"E","sa":null,"pg":"44","f":[],"n":17,"e":["Post-scabietic nodules are a hypersensitivity reaction that persists for weeks to months after treatment; they are treated with intralesional corticosteroids rather than more scabicide. Phototherapy is not used for post-scabietic nodules, a hypersensitivity reaction best treated with steroids. Radiotherapy has no role in post-scabietic nodules. Cautery is not used. Podophyllin is for warts.\nIntralesional steroid.",""],"im":[]},{"id":"Q273","ch":"Parasitic Infestations","q":"Post-scabietic nodules","o":[["A","Never cause itching"],["B","Are usually located on the back"],["C","Are best treated by antibiotics"],["D","All of the above"],["E","None of the above"]],"a":"E","sa":null,"pg":"44","f":[],"n":18,"e":["The proposed statements are incorrect; they represent a hypersensitivity reaction, common on the scrotum and itchy. They itch. They are on the scrotum. Post-scabietic nodules are a hypersensitivity reaction to mite antigens, not bacterial. Wrong: not all of the statements are correct.\nNodules ≠ parasites.",""],"im":[]},{"id":"Q274","ch":"Parasitic Infestations","q":"Post-scabietic nodules","o":[["A","Represent a hypersensitivity reaction to parasites"],["B","Present commonly on the scrotum"],["C","Cause severe itching"],["D","All of the above"],["E","None of the above"]],"a":"D","sa":null,"pg":"44","f":[],"n":19,"e":["Post-scabietic nodules are a hypersensitivity reaction, common on the scrotum, and itchy; all of the above.",""],"im":[]},{"id":"Q275","ch":"Parasitic Infestations","q":"Animal scabies is characterized by all of the following EXCEPT","o":[["A","Short incubation period"],["B","Absence of burrows"],["C","Being self-limited"],["D","Transmitted from human to human"],["E","Urticarial lesions"]],"a":"D","sa":null,"pg":"45","f":[],"n":20,"e":["Animal scabies is not transmitted from human to human (so there is no burrow), has a short incubation, and is self-limiting once the animal is avoided. Animal scabies appears quickly after contact with the animal (short incubation). Animal mites cannot burrow or reproduce in human skin, so there are no burrows. It resolves spontaneously once contact with the animal stops. Lesions are itchy urticarial papules at the contact sites.\nNot human-to-human.",""],"im":[]},{"id":"Q276","ch":"Parasitic Infestations","q":"Animal scabies is characterized by","o":[["A","Absence of burrows"],["B","Being self-limited and of short duration"],["C","Being more extensive"],["D","All of the above"]],"a":"D","sa":null,"pg":"45","f":[],"n":21,"e":["Animal scabies has a short incubation, no burrows, is self-limited and urticarial.\nPet scabies.",""],"im":[]},{"id":"Q277","ch":"Parasitic Infestations","q":"As regards treatment of human scabies","o":[["A","Oral antihelminthics are the treatment of choice"],["B","Gamma benzene hexachloride is a safe topical preparation"],["C","Permethrin is safe in pregnancy"],["D","Topical benzoyl peroxide may be used in treatment"],["E","Crotamiton is the most effective topical application"]],"a":"C","sa":null,"pg":"46","f":[],"n":22,"e":["Permethrin 5% is safe in pregnancy, breast-feeding and infants over 2 months, whereas gamma-hexachlorocyclohexane is contraindicated and oral antihelminthics are not first line. Antihelminthics kill intestinal worms, not the scabies mite; permethrin 5% is the first-line scabicide. GBHC is not safe. BPO is for acne. Permethrin is more effective.\nPermethrin safe.",""],"im":[]},{"id":"Q278","ch":"Parasitic Infestations","q":"As regards treatment of scabies","o":[["A","Oral antihelminthics are the treatment of choice"],["B","Gamma benzene hexachloride is a safe topical preparation"],["C","All family members should be treated"],["D","Topical benzoyl peroxide may be used in treatment"],["E","Crotamiton is the most effective topical application"]],"a":"C","sa":null,"pg":"45","f":[],"n":23,"e":["Treatment should include the patient and all close contacts, even if they have no itching, because early cases may be asymptomatic carriers. Antihelminthics kill intestinal worms, not the scabies mite; permethrin 5% is the first-line scabicide. GBHC is not safe. BPO is for acne. Permethrin is more effective.\nTreat contacts.",""],"im":[]},{"id":"Q279","ch":"Parasitic Infestations","q":"A young man presented with intense nocturnal itching. Examination revealed papules and burrows in finger webs, wrists and genital area. The following is a therapeutic topical option:","o":[["A","Steroid"],["B","Calcipotriol"],["C","Benzoyl peroxide 2.5-10%"],["D","Terbinafine"],["E","Permethrin 5%"]],"a":"E","sa":null,"pg":"46","f":[],"n":24,"e":["Nocturnal itch with burrows in finger webs is scabies treated with permethrin 5%. Steroid worsens. Calcipotriol is for psoriasis. BPO is for acne. Terbinafine is antifungal.",""],"im":[]},{"id":"Q280","ch":"Parasitic Infestations","q":"The following is used for the treatment of scabies","o":[["A","Benzyl benzoate"],["B","Benzoyl peroxide"],["C","Dapsone"],["D","Tetracyclines"],["E","Psoralen"]],"a":"A","sa":null,"pg":"46","f":[],"n":25,"e":["Benzyl benzoate (10-25%) is an acaricide used for scabies, along with permethrin, sulphur, crotamiton and ivermectin. BPO is for acne. Dapsone is for leprosy. Tetracyclines are antibacterial. Psoralen is PUVA.",""],"im":[]},{"id":"Q281","ch":"Parasitic Infestations","q":"All the following are used in the treatment of scabies EXCEPT:","o":[["A","Sulphur precipitate 5-10%"],["B","Permethrin 5%"],["C","Benzoyl peroxide 2.5-10%"],["D","Crotamiton 10%"],["E","Benzyl benzoate 25%"]],"a":"C","sa":null,"pg":"46","f":[],"n":26,"e":["Scabies is treated by sulphur, permethrin, crotamiton, benzyl benzoate or ivermectin; benzoyl peroxide is an acne drug. Sulphur precipitate 5-10% is a traditional scabicide. Permethrin 5% is the first-line topical scabicide (and a pediculicide). Crotamiton 10% is a scabicide that also relieves itching. Benzyl benzoate 25% is a scabicide (irritant, diluted for children).\nBPO = acne.",""],"im":[]},{"id":"Q282","ch":"Parasitic Infestations","q":"Pediculosis capitis is an example of","o":[["A","Cutaneous viral infection"],["B","Cutaneous fungal infection"],["C","Cutaneous bacterial infection"],["D","Cutaneous parasitic infection"],["E","Cutaneous mycobacterial infection"]],"a":"D","sa":null,"pg":"47","f":[],"n":27,"e":["Pediculosis capitis is a cutaneous parasitic infestation by Pediculus humanus capitis, a blood-sucking louse. Viral skin infections are warts, herpes and molluscum; lice are arthropods. Fungal skin infections are tinea and candidiasis; lice are arthropods. Bacterial skin infections are impetigo, folliculitis and cellulitis; lice are arthropods. Mycobacterial skin infections are leprosy and cutaneous TB; lice are arthropods.\nLice = parasitic.",""],"im":[]},{"id":"Q283","ch":"Parasitic Infestations","q":"Pediculosis capitis","o":[["A","Is transmitted by hats"],["B","Is treated by acyclovir"],["C","Does not present with pruritus"],["D","Can affect the pubic area"],["E","None of the above"]],"a":"A","sa":null,"pg":"48","f":[],"n":28,"e":["Head lice spread by head-to-head contact and indirectly via combs, brushes, hats and helmets. Acyclovir is antiviral. It is itchy. That is pubic lice. Wrong: at least one of the listed statements is correct.",""],"im":[]},{"id":"Q284","ch":"Parasitic Infestations","q":"Mother of a 9-year-old girl complains of severe itching of her daughter's scalp for two weeks. On examination, firmly attached white flakes were observed. Her younger sister has the same condition. (Clinical photo: scalp hair with lice and nits.) The most likely diagnosis is","o":[["A","Seborrheic dermatitis"],["B","Tinea capitis"],["C","Pediculosis capitis"],["D","Favus"],["E","Alopecia areata"]],"a":"C","sa":null,"pg":"49","f":[],"n":29,"e":["Itchy scalp with excoriations, adult lice and nits firmly attached to hairs is pediculosis capitis. Seb derm has greasy scale. Tinea has hair loss. Favus has scutula. AA is smooth.\nNits on hair.",""],"im":[]},{"id":"Q285","ch":"Parasitic Infestations","q":"The following is characteristic of pediculosis capitis","o":[["A","White patches"],["B","Flat-topped papules"],["C","Nocturnal itching"],["D","Nits cemented to the hairs"],["E","Painful nodules"]],"a":"D","sa":null,"pg":"49","f":[],"n":30,"e":["Nits are eggs cemented to the hair shaft near the scalp, which distinguishes them from dandruff; this is characteristic of head lice. White patches are vitiligo. Flat papules are LP. Nocturnal itch is scabies. Pediculosis gives itchy papules and excoriations, not painful nodules; the diagnostic sign is nits cemented to the hairs.\nCemented nits.",""],"im":[]},{"id":"Q286","ch":"Parasitic Infestations","q":"Pediculosis capitis is treated by topical:","o":[["A","Acyclovir"],["B","Corticosteroids"],["C","Retinoids"],["D","Permethrin"],["E","Azoles"]],"a":"D","sa":null,"pg":"51","f":[],"n":31,"e":["Pediculosis capitis is treated with topical permethrin 5% (or malathion, dimethicone), repeated after a week since eggs are not killed. Acyclovir is antiviral. Steroids do not kill lice. Retinoids are for acne. Azoles are antifungal.",""],"im":[]},{"id":"Q287","ch":"Parasitic Infestations","q":"The following is used for treatment of pediculosis capitis","o":[["A","Topical steroids"],["B","Malathion 0.5% lotion"],["C","Ketoconazole cream"],["D","Topical vitamin D"],["E","Emollients"]],"a":"B","sa":null,"pg":"51","f":[],"n":32,"e":["Malathion 0.5% lotion is used for head lice in children over 6 years and in pregnancy. Steroids do not kill lice. Ketoconazole is antifungal. Vitamin D is for psoriasis. Emollients do not kill lice.",""],"im":[]},{"id":"Q288","ch":"Parasitic Infestations","q":"A child with pruritic scalp, excoriations and firmly attached nits. The following is a good treatment option:","o":[["A","Oral griseofulvin"],["B","Podophyllin resin 10-25%"],["C","Oral nystatin"],["D","Topical selenium sulphide"],["E","Topical ivermectin 0.5%"]],"a":"E","sa":null,"pg":"51","f":[],"n":33,"e":["Pruritic scalp with firmly attached nits is head lice; topical ivermectin 0.5% is a treatment option. Griseofulvin and nystatin are antifungals, and podophyllin is for warts. Griseofulvin is antifungal. Podophyllin is for warts. Nystatin is antifungal. Selenium is for versicolor.",""],"im":[]},{"id":"Q289","ch":"Parasitic Infestations","q":"Phthirus pubis","o":[["A","Is not itchy"],["B","May be sexually transmitted"],["C","Is treated by terbinafine"],["D","Involves the scalp and back"],["E","Is a protozoal infection"]],"a":"B","sa":null,"pg":"48","f":[],"n":34,"e":["Phthirus pubis (pubic louse) spreads by close physical contact and sexual contact in young adults. Pediculosis pubis causes marked itching. Terbinafine is antifungal. It involves the pubis. It is an insect.\nSexually transmissible.",""],"im":[]},{"id":"Q290","ch":"Parasitic Infestations","q":"Lice infestation of the eyelashes is caused by:","o":[["A","Pediculus humanus corporis"],["B","Pediculus humanus capitis"],["C","Phthirus pubis"],["D","Sarcoptes scabiei"],["E","Demodex folliculorum"]],"a":"C","sa":null,"pg":"49","f":[],"n":35,"e":["Pubic lice (Phthirus pubis) can infest the eyelashes, along with the pubic area, lower abdomen and thighs. Corporis is body lice. Capitis is scalp. Sarcoptes scabiei is the scabies mite. Demodex folliculorum is a follicular mite of the face, not a louse.\nEyelash lice.",""],"im":[]},{"id":"Q291","ch":"Parasitic Infestations","q":"A male baby, 9 months old, was brought by his mother presenting with papules, pustules, eczematous rashes, scratch marks and impetigo involving his face, trunk, genitalia, palms and soles. His mother reported that he suffered from insomnia in addition to irritability most of his day. Family history of pruritus was positive. What is the diagnosis?","o":[["A","Atopic dermatitis."],["B","Scabies."],["C","Tinea corporis."],["D","Lichen planus."],["E","Psoriasis."]],"a":"B","sa":null,"pg":"44","f":[],"n":36,"e":["Burrows and nocturnal itching in typical distribution are scabies. Atopic is flexural. Tinea is scaly. LP is violaceous. Psoriasis is silvery.",""],"im":[]},{"id":"Q541","ch":"Parasitic Infestations","q":"Sites of predilection of scabietic burrows include all of the following EXCEPT:","o":[["A","In-between fingers & wrist area."],["B","Medial sides of forearms."],["C","Anterior axillary folds & lower abdomen."],["D","Breast in females & genitalia in males."],["E","Lateral aspect of thighs & buttocks."]],"a":"E","sa":null,"pg":"43","f":["Key (E) conflicts with the book, which lists buttocks and thighs among scabies sites; no option is clearly the exception. Please verify."],"n":37,"e":["Scabies burrows prefer thin skin with few follicles: finger webs, wrists, medial forearms, anterior axillary folds, lower abdomen, breasts in females and genitalia in males. The lateral aspect of the thighs is not a predilection site, so that option is the exception. A predilection site. A predilection site. A predilection site. A predilection site.\nBurrows: webs, wrists, folds, genitalia; spares head/neck and upper back in adults.",""],"im":[]},{"id":"Q542","ch":"Parasitic Infestations","q":"A child presents with intensely pruritic grouped papules at the finger webs and burrows on flexor surfaces. This disease is caused by:","o":[["A","Pediculus humanus corporis."],["B","Demodex folliculorum."],["C","Pthirus pubis."],["D","Sarcoptes scabiei."]],"a":"D","sa":null,"pg":"42","f":[],"n":38,"e":["Intensely itchy grouped papules at the finger webs with burrows on flexor surfaces are scabies, caused by the mite Sarcoptes scabiei. Pediculus corporis and Pthirus pubis are lice, and Demodex lives in follicles. Corporis is lice. Demodex lives in follicles. Pthirus is pubic lice.\nBurrow = Sarcoptes scabiei.",""],"im":[]},{"id":"H162","ch":"Parasitic Infestations","q":"Infant with vesicles and pustules on face, palm and soles. There is family history of itching at night:","o":[["A","Pediculosis pubis"],["B","Tinea corporis"],["C","Scabies"]],"a":"C","sa":null,"pg":null,"f":[],"n":39,"e":["An infant with vesicles on face, palms and soles and family night itching has scabies. Pubis is pubic lice. Tinea corporis gives annular scaly patches, not vesicopustules on the palms and soles with nocturnal itching in the family.\nFamily itch.",""],"im":[]},{"id":"H163","ch":"Parasitic Infestations","q":"Adult scabies can affect the following sites EXCEPT:","o":[["A","Flexures."],["B","Wrist."],["C","Upper back."],["D","Buttocks."],["E","Genitalia."]],"a":"C","sa":null,"pg":null,"f":[],"n":40,"e":["Adult scabies spares the head, neck and upper back, but involves flexures, wrists, buttocks and genitalia. Involved. Involved. Involved. Involved.\nUpper back spared.",""],"im":[]},{"id":"H165","ch":"Parasitic Infestations","q":"Lice infestation of the eyelashes is caused by:","o":[["A","Pediculus humanus corporis."],["B","Pediculus humanus capitis."],["C","Phthirus pubis."],["D","Sarcoptes scabiei."],["E","Demodex folliculorum."]],"a":"C","sa":null,"pg":null,"f":[],"n":41,"e":["Eyelash infestation is typical of the pubic louse Phthirus pubis; head lice infest scalp hair. Corporis is body lice. Capitis is scalp. Sarcoptes scabiei is the scabies mite. Demodex folliculorum is a follicular mite of the face, not a louse.\nEyelashes: pubic lice.",""],"im":[]},{"id":"H168","ch":"Parasitic Infestations","q":"Pediculosis capitis may be treated by:","o":[["A","3% acetic acid."],["B","Gamma benzene hexachloride."],["C","Permethrin."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":42,"e":["Head lice may be treated with acetic acid, gamma benzene hexachloride or permethrin.\nAll of the above.",""],"im":[]},{"id":"H173","ch":"Parasitic Infestations","q":"Pediculosis capitis:","o":[["A","Is transmitted by hats."],["B","Is treated by acyclovir."],["C","Does not present by pruritus."],["D","Can affect the pubic area."],["E","None of the above."]],"a":"A","sa":null,"pg":null,"f":[],"n":43,"e":["Head lice spread via hats, combs and brushes; they are treated with permethrin, malathion or ivermectin, not acyclovir, and they cause itching. Acyclovir is antiviral. It is itchy. That is pubic lice. Wrong: at least one of the listed statements is correct.\nFomites.",""],"im":[]},{"id":"H176","ch":"Parasitic Infestations","q":"The following may help in the diagnosis of scabies:","o":[["A","Positive family history."],["B","Night itching."],["C","Distribution of lesions."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":44,"e":["Family history, night itching and lesion distribution all help diagnose scabies.\nAll of the above.",""],"im":[]},{"id":"Q292","ch":"Inflammatory Dermatoses","q":"All are true about psoriasis EXCEPT","o":[["A","Nail changes could occur"],["B","Has an extensor distribution"],["C","Occurs in children"],["D","Is a contagious disease"],["E","Could be associated with arthritis"]],"a":"D","sa":null,"pg":"52","f":[],"n":1,"e":["Psoriasis is a chronic immune-mediated (T-cell) disease with genetic susceptibility, so it cannot be passed from person to person. Everything else listed (nail changes, extensor distribution, childhood onset, arthritis) is true of it. True: pitting, onycholysis. True: elbows and knees. True: can start in childhood. True: psoriatic arthritis.\nPsoriasis = immune-mediated, never contagious. Auspitz sign, Koebner phenomenon, nail pitting.",""],"im":[]},{"id":"Q293","ch":"Inflammatory Dermatoses","q":"All these skin diseases are infectious EXCEPT","o":[["A","Kerion."],["B","Herpes simplex."],["C","Ecthyma."],["D","Psoriasis."],["E","Bullous impetigo."]],"a":"D","sa":null,"pg":"52","f":[],"n":2,"e":["Psoriasis is an immune-mediated papulosquamous disease, not an infection. The question lists infectious skin diseases, so psoriasis is the one that does not belong. Kerion is fungal. Herpes simplex is viral. Ecthyma is bacterial. Bullous impetigo is bacterial.\nInfectious: impetigo, tinea, scabies, warts. Non-infectious: psoriasis, lichen planus, DLE.",""],"im":[]},{"id":"Q294","ch":"Inflammatory Dermatoses","q":"In psoriasis","o":[["A","There is decreased rate of division of basal cell layer."],["B","There is decreased rate of epidermal turnover."],["C","There is decrease of epidermal turnover time."],["D","The epidermal turnover time is 27 days."],["E","The epidermal turnover time is 17 days."]],"a":"C","sa":null,"pg":"52","f":[],"n":3,"e":["In psoriasis the basal cells divide faster, so the epidermis renews itself much more quickly. The epidermal turnover time falls from the normal 28 days to about 7 days, which produces the thick silvery scales. Cell division is increased. Turnover is faster. Normal is 28 days; here about 7 days. Too long; it is about 7 days.\nNormal turnover 28 days; psoriasis 7 days (shortened, not prolonged).",""],"im":[]},{"id":"Q295","ch":"Inflammatory Dermatoses","q":"A patient presented with well-demarcated erythematous plaques covered by silvery scales on the extensor elbows and knees with positive Auspitz sign. In this disease:","o":[["A","The rate of cell division in the basal layer is decreased."],["B","The epidermal renewal process becomes slower."],["C","The time required for epidermal cell turnover is increased."],["D","The epidermal turnover time is about 7 days."],["E","The epidermal turnover time is about 28 days."]],"a":"D","sa":null,"pg":"52","f":[],"n":4,"e":["Well-demarcated silvery plaques on elbows and knees with a positive Auspitz sign describe psoriasis. The key points are an increased rate of basal cell division and a shortened epidermal turnover of about 7 days (28 days is normal), so the options saying 'decreased' or 'slower' are wrong. Division is increased. Renewal is faster. Time is decreased. 28 days is normal.\nPsoriasis = fast turnover (7 days).",""],"im":[]},{"id":"Q296","ch":"Inflammatory Dermatoses","q":"All of the following is true about psoriasis except","o":[["A","It is a disorder of keratinization"],["B","It gets more severe in summer than in winter"],["C","Its primary lesion is a papule"],["D","Psoriasis vulgaris is its most common type"],["E","It is characterized by Koebner phenomenon"]],"a":"B","sa":null,"pg":"52","f":[],"n":5,"e":["Psoriasis improves with ultraviolet exposure, so it flares in winter and in covered body parts, and is commoner in Scandinavian countries than the tropics. The statement that it worsens in summer is the false one. It is a papule-based disease and Koebner phenomenon is typical. Psoriasis is epidermal hyperproliferation with abnormal keratinization. The primary lesion is a papule that coalesces into plaques. Plaque psoriasis (vulgaris) is the most common type. Koebner phenomenon: new lesions at sites of trauma.\nSun helps psoriasis: worse in winter.",""],"im":[]},{"id":"Q297","ch":"Inflammatory Dermatoses","q":"Koebner's phenomenon is seen in which diseases?","o":[],"a":null,"sa":"Psoriasis, lichen planus, vitiligo and plane (flat) warts","pg":"52","f":[],"n":6,"e":["Koebner phenomenon means new lesions appear on previously normal skin after trauma. The book lists it in psoriasis, lichen planus, vitiligo and flat (plane) warts.\nKoebner: psoriasis, lichen planus, vitiligo, plane warts.",""],"im":[]},{"id":"Q298","ch":"Inflammatory Dermatoses","q":"Primary lesion of psoriasis is","o":[["A","Red macule covered with non-adherent silvery white scales."],["B","Red papule covered with adherent white scales."],["C","Red papule covered with non-adherent silvery white scales."],["D","Red macule covered with white adherent scales."],["E","Red papule with vesicles, crusts and white scales."]],"a":"C","sa":null,"pg":"53","f":[],"n":7,"e":["The psoriatic primary lesion is a red papule covered by loosely attached silvery-white scales; papules join to form plaques. A vesicle or crust points to eczema instead. It is a papule, not a macule. The scales are loose, not adherent. It is a papule, with loose scales. Vesicles and crusts mean eczema.\nPapule + silvery loose scales.",""],"im":[]},{"id":"Q299","ch":"Inflammatory Dermatoses","q":"Auspitz sign is elicited in","o":[["A","Psoriasis."],["B","Lichen planus."],["C","Discoid LE."],["D","Discoid eczema."],["E","Seborrheic dermatitis."]],"a":"A","sa":null,"pg":"53","f":[],"n":8,"e":["Scraping the scales off a psoriatic plaque leaves pinpoint bleeding points (Auspitz sign) because the dermal papillae are thin-capped and engorged. Lichen planus shows Wickham striae and DLE shows follicular plugging instead. LP has Wickham striae. DLE has follicular plugs. Eczema oozes. Seb derm is greasy.\nAuspitz = psoriasis; Wickham = lichen planus.",""],"im":[]},{"id":"Q300","ch":"Inflammatory Dermatoses","q":"A 35-year-old male presents with scaly erythematous symmetrical plaques on extensor surfaces and a positive Auspitz sign. What is the most likely diagnosis?","o":[["A","Psoriasis."],["B","Atopic dermatitis."],["C","Lichen planus."],["D","Seborrheic dermatitis."],["E","Pityriasis rosea."]],"a":"A","sa":null,"pg":"53","f":[],"n":9,"e":["Symmetrical scaly erythematous plaques on the extensor surfaces with a positive Auspitz sign are typical of psoriasis. Atopic dermatitis favors flexures, lichen planus gives violaceous flat papules, and pityriasis rosea follows a herald patch. Atopic is flexural. LP is violaceous. Seb derm is greasy. PR follows a herald patch.\nExtensors + Auspitz = psoriasis.",""],"im":[]},{"id":"Q301","ch":"Inflammatory Dermatoses","q":"A female patient, 17 years old, presented with scaly erythematous plaques on her scalp. She also had scaly plaques on both elbows and knees. (Clinical photo: thick silvery-scaled plaques at the nape/scalp margin.) What is your diagnosis?","o":[["A","Discoid lupus erythematosus."],["B","Lichen planopilaris."],["C","Scalp psoriasis."],["D","Seborrheic dermatitis."],["E","Scalp eczema."]],"a":"C","sa":null,"pg":"53","f":[],"n":10,"e":["Plaques of silvery scale confined to the scalp are scalp psoriasis, which sharply borders the hairline and does not scar the hair, unlike DLE. DLE scars. Planopilaris scars. Seb derm is greasy. Eczema is oozing.\nScalp is a common site; psoriasis hair loss is non-scarring.",""],"im":[]},{"id":"Q302","ch":"Inflammatory Dermatoses","q":"A male patient, 35 years old, presented with itchy scaly plaques on his trunk. He also had scaly plaques on both elbows, forearms and scalp. The condition started when he was 14 years old with remissions and exacerbations. He reported that lesions exacerbated with stressful conditions and in winter months. (Clinical photo: multiple erythematous scaly plaques on the trunk.) This patient suffers from","o":[["A","Impetigo contagiosum."],["B","Psoriasis vulgaris."],["C","Disseminated dermatitis."],["D","Atopic dermatitis."],["E","Lichen planus."]],"a":"B","sa":null,"pg":"52","f":[],"n":11,"e":["Vulgaris means 'common', so psoriasis vulgaris is the common plaque type, accounting for most cases. The picture shows typical well-defined scaly plaques. Impetigo is crusted. Disseminated dermatitis is not silvery. Atopic is flexural. LP is violaceous.\nPlaque psoriasis = psoriasis vulgaris.",""],"im":[]},{"id":"Q303","ch":"Inflammatory Dermatoses","q":"The characteristic clinical picture of psoriasis is","o":[["A","Erythematous papules & plaques covered by silvery scales"],["B","Erythematous macules covered by silvery scales"],["C","Erythematous nodules covered by silvery scales"],["D","Pruritic erythematous patches"],["E","Pruritic polyangular papules"]],"a":"A","sa":null,"pg":"53","f":[],"n":12,"e":["The classic picture is bilateral, symmetrical well-defined erythematous papules and plaques covered by shiny silvery dry scales with a polycyclic outline, mainly on extensors, scalp and lumbosacral area. Lesions are papules and plaques. It does not form nodules. Patches are not characteristic. That is lichen planus.\nSilvery scales on extensors.",""],"im":[]},{"id":"Q304","ch":"Inflammatory Dermatoses","q":"Silver plaques are seen in","o":[["A","Psoriasis."],["B","Vitiligo."],["C","Hypertrophic lichen planus."],["D","Pityriasis rosea."],["E","Cutaneous candidiasis."]],"a":"A","sa":null,"pg":"53","f":[],"n":13,"e":["Silvery scale on a red plaque is the signature of psoriasis. Other scaly diseases such as tinea or seborrheic dermatitis have finer, greasy or branny scales instead. Vitiligo is white. Hypertrophic LP is thick violaceous. PR has collarette scales. Candida is moist.\nSilvery = psoriasis.",""],"im":[]},{"id":"Q305","ch":"Inflammatory Dermatoses","q":"Vulgaris means","o":[["A","Serious"],["B","Common"],["C","Easily treated"],["D","Infectious"],["E","Painful"]],"a":"B","sa":null,"pg":"53","f":[],"n":14,"e":["Vulgaris is Latin for common, as in psoriasis vulgaris (plaque type), acne vulgaris and verruca vulgaris. Not serious. Not easy to treat. Not infectious. Not painful.\nVulgaris = common.",""],"im":[]},{"id":"Q306","ch":"Inflammatory Dermatoses","q":"A patient came presenting with a red plaque covered with silvery white scales, upon removal of the scales bleeding points were observed. The most probable diagnosis is","o":[["A","Lichen planus"],["B","Psoriasis vulgaris"],["C","Discoid lupus erythematosus"],["D","Pityriasis rosea"],["E","Discoid eczema"]],"a":"B","sa":null,"pg":"53","f":[],"n":15,"e":["A red plaque with silvery white scales that bleeds on scale removal (Auspitz sign) is plaque-type psoriasis, i.e. psoriasis vulgaris. LP has no scale bleeding. DLE scale is adherent. PR has collarette. Discoid eczema oozes.\nPlaque + Auspitz.",""],"im":[]},{"id":"Q307","ch":"Inflammatory Dermatoses","q":"Psoriasis may be manifested clinically by all of the following EXCEPT","o":[["A","Erythroderma."],["B","Pustular lesions."],["C","Arthropathy."],["D","Flexural lesions."],["E","Bullous lesions."]],"a":"E","sa":null,"pg":"54","f":[],"n":16,"e":["Psoriasis has several forms: erythrodermic, pustular, flexural, nail and arthritic. Bullous lesions are not part of the psoriasis spectrum, so that option is the exception. It occurs. It occurs. It occurs. It occurs.\nTypes: plaque, flexural, nail, erythrodermic, pustular, arthritic. Never bullous.",""],"im":[]},{"id":"Q308","ch":"Inflammatory Dermatoses","q":"Psoriasis may present by all of the following EXCEPT","o":[["A","Flexural affection."],["B","Joint affection."],["C","Pustular eruption."],["D","Nail pitting."],["E","Cicatricial alopecia."]],"a":"E","sa":null,"pg":"54","f":[],"n":17,"e":["Psoriasis causes hair-bearing plaques without destroying follicles, so any alopecia is non-scarring. Cicatricial (scarring) alopecia occurs in DLE, lichen planus, kerion and favus, not psoriasis. It occurs. It occurs. It occurs. It occurs.\nScarring alopecia: DLE, LP, kerion, favus. Not psoriasis.",""],"im":[]},{"id":"Q309","ch":"Inflammatory Dermatoses","q":"Sterile pustules are characteristic of","o":[["A","Folliculitis."],["B","Pustular psoriasis."],["C","Sycosis barbae."],["D","Nodulocystic acne."],["E","None of the above."]],"a":"B","sa":null,"pg":"52","f":[],"n":18,"e":["Pustular psoriasis shows sterile pustules (no bacteria) on an erythematous base; hypocalcemia can precipitate it. Pustules in bacterial folliculitis or impetigo are infected. Folliculitis is infected. Sycosis is infected. Nodulocystic acne is infected. Wrong: at least one listed statement is correct.\nSterile pustules = pustular psoriasis.",""],"im":[]},{"id":"Q310","ch":"Inflammatory Dermatoses","q":"Which of the following is NOT a recognized clinical type of psoriasis?","o":[["A","Plaque psoriasis."],["B","Guttate psoriasis."],["C","Erythrodermic psoriasis."],["D","Ulcerative psoriasis."],["E","Pustular psoriasis."]],"a":"D","sa":null,"pg":"54","f":[],"n":19,"e":["Recognised forms are plaque (vulgaris), flexural, nail, erythrodermic, pustular and psoriatic arthritis; guttate is also described. There is no 'ulcerative psoriasis'. Recognized. Recognized. Recognized. Recognized.",""],"im":[]},{"id":"Q311","ch":"Inflammatory Dermatoses","q":"Erythroderma may occur in","o":[["A","Alopecia."],["B","Vitiligo."],["C","Psoriasis."],["D","Acne vulgaris."],["E","Pityriasis rosea."]],"a":"C","sa":null,"pg":"54","f":[],"n":20,"e":["Psoriasis, especially when irritated by strong topicals or stopped steroids, may spread to involve the whole skin surface as erythrodermic psoriasis. The question asks which disease can present with erythroderma. Alopecia is hair loss. Vitiligo spares the epidermis. Acne is limited. PR is self-limited.\nErythroderma can complicate psoriasis.",""],"im":[]},{"id":"Q312","ch":"Inflammatory Dermatoses","q":"The following disease may involve the joints","o":[["A","Lichen planus."],["B","Pityriasis rosea."],["C","Psoriasis."],["D","Vitiligo."],["E","Seborrheic eczema."]],"a":"C","sa":null,"pg":"55","f":[],"n":21,"e":["Psoriasis can involve the joints (psoriatic arthritis), listed in the book among the clinical types. Scabies, tinea and impetigo do not affect joints. LP spares joints. PR spares joints. Vitiligo spares joints. Seb eczema spares joints.\nPsoriasis + arthritis; also nail pitting.",""],"im":[]},{"id":"Q313","ch":"Inflammatory Dermatoses","q":"Topical treatment of psoriasis includes","o":[["A","Calcipotriol and coal tar."],["B","Acyclovir and garamycin."],["C","Antiseptic lotions."],["D","Terbinafine."],["E","Gamma benzene hexachloride."]],"a":"A","sa":null,"pg":"56","f":[],"n":22,"e":["Topical psoriasis drugs include keratolytics (salicylic acid), moisturizers, steroids, calcipotriol (vitamin D analogue), coal tar and anthralin. Antivirals, antifungals and antiseptic lotions are not part of the list. Acyclovir and garamycin treat infection. Antiseptics do not treat psoriasis. Terbinafine is antifungal. GBHC is for scabies.\nTopical: calcipotriol, tar, anthralin, steroids.",""],"im":[]},{"id":"Q314","ch":"Inflammatory Dermatoses","q":"All of the following can be used in the treatment of psoriasis EXCEPT","o":[["A","Retinoids."],["B","Cyclosporine."],["C","Doxycycline."],["D","Calcipotriol."],["E","Phototherapy."]],"a":"C","sa":null,"pg":"56","f":[],"n":23,"e":["Retinoids (acitretin), cyclosporine, calcipotriol and phototherapy all treat psoriasis. Doxycycline is an antibiotic with no role in it. Systemic retinoids (acitretin) are used. Cyclosporine is an immunosuppressant for severe psoriasis. Calcipotriol (vitamin D analogue) is a first-line topical. Phototherapy (narrow-band UVB, PUVA) is used.\nSystemic: methotrexate, acitretin, cyclosporine, PUVA.",""],"im":[]},{"id":"Q315","ch":"Inflammatory Dermatoses","q":"Systemic treatment of psoriasis includes :","o":[["A","Tetracyclines."],["B","Methotrexate."],["C","Acyclovir."],["D","Itraconazole."],["E","Antimalarials."]],"a":"B","sa":null,"pg":"56","f":[],"n":24,"e":["Systemic therapy for extensive plaque, pustular, erythrodermic or arthritic psoriasis includes methotrexate, acitretin, cyclosporine and PUVA. Tetracyclines, acyclovir and itraconazole treat infections. Tetracyclines are antibacterial. Acyclovir is antiviral. Itraconazole is antifungal. Antimalarials may worsen psoriasis.\nMethotrexate = systemic psoriasis drug.",""],"im":[]},{"id":"Q316","ch":"Inflammatory Dermatoses","q":"Regarding topical treatment of psoriasis","o":[["A","Permethrin cream is used."],["B","Topical steroids are contraindicated."],["C","Topical antiseptics and antibiotics are important."],["D","Topical vitamin D is effective."],["E","It is effective as monotherapy in erythrodermic psoriasis."]],"a":"D","sa":null,"pg":"56","f":[],"n":25,"e":["Topical vitamin D analogues such as calcipotriol are effective in psoriasis. Permethrin treats scabies, antiseptics/antibiotics are not key psoriasis drugs, and topical steroids are used (not contraindicated). Permethrin is a scabicide, not for psoriasis. Topical steroids are widely used for psoriasis. Psoriasis is not infectious, so antiseptics and antibiotics do not help. Topical treatment alone is not enough in erythrodermic psoriasis; systemic therapy is needed.\nCalcipotriol = vitamin D analogue.",""],"im":[]},{"id":"Q317","ch":"Inflammatory Dermatoses","q":"A female patient, 17 years old, presented with scaly erythematous plaques on her scalp. She also had scaly plaques on both elbows and knees. (Clinical photo: thick silvery-scaled plaques at the nape/scalp margin - psoriasis.) Topical treatment includes","o":[["A","Calcipotriol gel."],["B","Clindamycin lotion."],["C","Potassium permanganate lotion."],["D","Terbinafine cream."],["E","Gamma benzene hexachloride lotion."]],"a":"A","sa":null,"pg":"56","f":[],"n":26,"e":["Calcipotriol gel is a vitamin D analogue that slows keratinocyte proliferation in psoriasis. Acyclovir and terbinafine are antivirals/antifungals. Clindamycin is antibacterial. Permanganate dries oozing. Terbinafine is antifungal. GBHC is for scabies.",""],"im":[]},{"id":"Q318","ch":"Inflammatory Dermatoses","q":"A male patient, 35 years old, presented with itchy scaly plaques on his trunk. He also had scaly plaques on both elbows, forearms and scalp. The condition started when he was 14 years old with remissions and exacerbations, exacerbated by stress and in winter months. (Clinical photo: multiple erythematous scaly plaques on the trunk - psoriasis vulgaris.) Systemic treatment includes","o":[["A","Tetracyclines."],["B","Methotrexate."],["C","Valacyclovir."],["D","Itraconazole."]],"a":"B","sa":null,"pg":"56","f":[],"n":27,"e":["Methotrexate is a systemic antiproliferative/immunosuppressive drug used for extensive psoriasis, along with acitretin, cyclosporine and PUVA. Tetracyclines are antibacterial. Valacyclovir is antiviral. Itraconazole is antifungal.",""],"im":[]},{"id":"Q319","ch":"Inflammatory Dermatoses","q":"Photochemotherapy is used to treat","o":[["A","Psoriasis."],["B","Pediculosis capitis"],["C","Tinea capitis."],["D","Tinea cruris."],["E","Discoid lupus."]],"a":"A","sa":null,"pg":"56","f":[],"n":28,"e":["Photochemotherapy (PUVA = psoralen + UVA) is used for psoriasis, along with narrow-band UVB. It is not used for DLE, which is photosensitive. Lice need insecticides. Tinea needs antifungals. Tinea needs antifungals. DLE is photosensitive.\nPUVA: psoriasis, vitiligo; not DLE.",""],"im":[]},{"id":"Q320","ch":"Inflammatory Dermatoses","q":"Lichen planus is an inflammatory pruritic disease which involves","o":[["A","Mucous membranes."],["B","Skin."],["C","Hair follicles."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"57","f":[],"n":29,"e":["Lichen planus is a pruritic immune-mediated disease that affects skin, mucous membranes, hair and nails, so all options are correct.\nLP: skin, mucosa, hair, nails.",""],"im":[]},{"id":"Q321","ch":"Inflammatory Dermatoses","q":"Mucous membranes are involved in","o":[["A","Papular urticaria."],["B","Tinea versicolor."],["C","Scabies."],["D","Lichen Planus."],["E","Pediculosis capitis."]],"a":"D","sa":null,"pg":"57","f":[],"n":30,"e":["Mucosal lichen planus involves buccal mucosa, tongue, gums and genitalia with white reticular streaks (Wickham striae). Papular urticaria spares mucosa. Versicolor spares mucosa. Scabies spares mucosa. Lice spare mucosa.\nLP has mucosal disease.",""],"im":[]},{"id":"Q322","ch":"Inflammatory Dermatoses","q":"Lichen planus (including hypertrophic LP) may be associated with which viral infection?","o":[],"a":null,"sa":"Hepatitis C virus","pg":"57","f":[],"n":31,"e":["Hepatitis C virus infection is associated with lichen planus, so hepatic work-up is sensible. Hair fall and vitamin/iron deficiency are other clues listed in the introduction.\nLP ↔ hepatitis C.",""],"im":[]},{"id":"Q323","ch":"Inflammatory Dermatoses","q":"Well-defined flat-topped, polyangular, violaceous, itchy papules are the primary lesions of","o":[["A","Vitiligo."],["B","Lupus erythematosus."],["C","Lichen planus."],["D","Psoriasis."],["E","None of the above."]],"a":"C","sa":null,"pg":"57","f":[],"n":32,"e":["Flat-topped, polyangular, violaceous, itchy papules define lichen planus. Psoriasis papules are scaly red and DLE plaques are atrophic. Vitiligo has macules. Lupus has atrophic plaques. Psoriasis is scaly. Wrong: at least one listed statement is correct.\nPurple, polygonal, itchy, planar papules.",""],"im":[]},{"id":"Q324","ch":"Inflammatory Dermatoses","q":"A female patient, 38 years old, presented with papules that developed on both her forearms and wrists. The condition started about five years ago with a gradual onset and a progressive course. She had severe itching. (Clinical photo: multiple violaceous flat-topped papules and plaques on both forearms and wrists.) What is your diagnosis?","o":[["A","Discoid lupus erythematosus."],["B","Stasis dermatitis."],["C","Atopic dermatitis."],["D","Lichen planus."],["E","Psoriasis vulgaris."]],"a":"D","sa":null,"pg":"57","f":[],"n":33,"e":["Flat-topped violaceous polygonal papules, often on wrists, are lichen planus. DLE is atrophic. Stasis is on the legs. Atopic is flexural. Psoriasis is scaly.\nWrists and shins.",""],"im":[]},{"id":"Q325","ch":"Inflammatory Dermatoses","q":"The primary lesion of lichen planus is","o":[["A","Pustule."],["B","Vesicle."],["C","Papule."],["D","Macule."],["E","Bulla."]],"a":"C","sa":null,"pg":null,"f":[],"n":34,"e":["The primary lesion is a papule (flat-topped, polyangular, violaceous, shiny). Plaques form by coalescence. Not a pustule. Not a vesicle. Not a macule. Not a bulla.\nPrimary = papule.",""],"im":[]},{"id":"Q326","ch":"Inflammatory Dermatoses","q":"Lichen planus heals leaving","o":[["A","Pain & paresthesia."],["B","Post-inflammatory hypopigmentation."],["C","Post-inflammatory hyperpigmentation."],["D","Keloids."],["E","Telangiectasia."]],"a":"C","sa":null,"pg":"58","f":[],"n":35,"e":["Lichen planus heals leaving dark post-inflammatory hyperpigmentation, not hypopigmentation, scars or keloids (except in hypertrophic/scalp types). Pain and paresthesia suggest neuropathy or zoster; LP is itchy. It darkens, not lightens. LP does not form keloids; it leaves dark macules. Telangiectasia is typical of atrophic diseases such as DLE, not LP.\nLP → hyperpigmentation.",""],"im":[]},{"id":"Q327","ch":"Inflammatory Dermatoses","q":"Koebner's phenomenon is positive in all of the following EXCEPT","o":[["A","Warts."],["B","Psoriasis."],["C","Lichen planus."],["D","Eczema."],["E","Vitiligo."]],"a":"D","sa":null,"pg":"58","f":[],"n":36,"e":["Koebner is seen in psoriasis, LP, vitiligo and plane warts; eczema is not on that list. Positive. Positive. Positive. Positive.\nEczema: no Koebner.",""],"im":[]},{"id":"Q328","ch":"Inflammatory Dermatoses","q":"Koebner's phenomenon is present in :","o":[["A","Psoriasis."],["B","Lichen planus."],["C","Plane warts."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"58","f":[],"n":37,"e":["Koebner phenomenon occurs in psoriasis, lichen planus and vitiligo, so all of the above is correct.\nKoebner: PLP-V.",""],"im":[]},{"id":"Q329","ch":"Inflammatory Dermatoses","q":"How does lichen planus present clinically?","o":[["A","Red plaques with silvery scales."],["B","Pruritic, red, oozing rash with edema."],["C","Golden colored crusts."],["D","Pruritic, purple, polygonal, planar papules."],["E","Pearly dome-shaped papules with umbilicated centers."]],"a":"D","sa":null,"pg":"57","f":[],"n":38,"e":["LP is described as pruritic, purple, polygonal, planar papules (the 4 Ps; a fifth P: plaques), with shiny surface and fine adherent scales. That is psoriasis. That is acute eczema. That is impetigo. That is molluscum.",""],"im":[]},{"id":"Q330","ch":"Inflammatory Dermatoses","q":"In lichen planus, squamous cell carcinoma may complicate","o":[["A","Oral ulcerative lesions."],["B","Hypertrophic lesions."],["C","Nail lesions."],["D","Actinic lesions."],["E","Scalp lesions."]],"a":"A","sa":null,"pg":"59","f":[],"n":39,"e":["Chronic ulcerative (erosive) oral lesions of LP are resistant to treatment and may become squamous cell carcinoma. Skin lesions do not. Hypertrophic lesions rarely transform. Nails do not transform. Actinic does not transform. Scalp scars.\nOral erosive LP → SCC.",""],"im":[]},{"id":"Q331","ch":"Inflammatory Dermatoses","q":"Wickham striae are seen in:","o":[["A","Pityriasis rosea."],["B","Scabies."],["C","Lichen planus."],["D","Verrucae."],["E","Erythema multiforme."]],"a":"C","sa":null,"pg":"59","f":[],"n":40,"e":["Wickham striae are the fine white reticular lines on lichen planus papules and oral mucosa. They are not seen in pityriasis rosea, scabies or warts. PR has collarette. Scabies has burrows. Warts are rough. EM has targets.\nWickham = LP.",""],"im":[]},{"id":"Q332","ch":"Inflammatory Dermatoses","q":"Complications of lichen planus may include","o":[["A","Frequent recurrences."],["B","Subsequent bacterial infections."],["C","Non-cicatricial alopecia in scalp."],["D","Post-inflammatory hypopigmentation."],["E","Squamous cell carcinoma."]],"a":"E","sa":null,"pg":"59","f":[],"n":41,"e":["Chronic ulcerative mucosal and hypertrophic LP can turn into squamous cell carcinoma. Frequent recurrence and post-inflammatory pigme
