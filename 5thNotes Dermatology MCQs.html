entirely benign lesion: It is oncogenic with HPV 16/18. E) Forms deep nodules in the genital area: It is exophytic.","Genital HPV."],"im":[]},{"id":"H101","ch":"Viral Infections","q":"Herpes progenitalis is:","o":[["A","Caused by HSV type II."],["B","Linked with cancer cervix."],["C","Characterized by recurrent vesicles & erosions on genitalia."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":69,"e":["Herpes progenitalis is caused by HSV-2, linked with cervical cancer, and characterized by recurrent vesicles and erosions, so all of the above. Why the other options are wrong: A) Caused by HSV type II: Herpes progenitalis is mostly HSV type II. True, but B and C are true too. B) Linked with cancer cervix: HSV-II is linked with cervical cancer. True, but A and C are true too. C) Characterized by recurrent vesicles & er…: It shows recurrent genital vesicles and erosions. True, but A and B are true too. E) None of the above: Wrong: A, B and C are all true.","HSV-2, recurrent."],"im":[]},{"id":"H102","ch":"Viral Infections","q":"A female patient, 30 years old, presented with a tender papule involving her sole, started about two months ago. Patient felt pain while walking or running. This patient suffers from:","o":[["A","Plantar warts."],["B","Moniliasis."],["C","Leprotic nodules."],["D","Post-scabietic nodules."],["E","Condyloma acuminata."]],"a":"A","sa":null,"pg":null,"f":[],"n":70,"e":["A tender papule on the sole that hurts when walking or running, with onset over months, is a plantar wart. Post-scabietic nodules occur on genitalia and axillae. Why the other options are wrong: B) Moniliasis: Moniliasis is candida. C) Leprotic nodules: Leprotic nodules are anesthetic. D) Post-scabietic nodules: Post-scabietic nodules are on genitalia. E) Condyloma acuminata: Condyloma is genital.","Plantar wart."],"im":[]},{"id":"H103","ch":"Viral Infections","q":"A female patient, 15 years old, presented with perioral blisters of 4 days duration. Patient was feverish before appearance of the rash by 2 days and she felt a tingling sensation in the area. Patient stated that the condition was recurrent. The causative organism of this disease is:","o":[["A","Group A B-haemolytic Streptococci."],["B","Varicella zoster virus."],["C","Staphylococcus aureus."],["D","Human papilloma virus."],["E","Herpes simplex virus."]],"a":"E","sa":null,"pg":null,"f":[],"n":71,"e":["Perioral blisters with fever and tingling beforehand in a person with recurrence are due to herpes simplex virus (HSV-1) reactivation from the sensory ganglion. Why the other options are wrong: A) Group A B-haemolytic Streptococci: Strep causes impetigo. B) Varicella zoster virus: VZV gives dermatomal vesicles. C) Staphylococcus aureus: Staph causes impetigo. D) Human papilloma virus: HPV gives warts.","HSV recurrent."],"im":[]},{"id":"H104","ch":"Viral Infections","q":"A male patient, 6 years old, presented with asymptomatic flat topped lesions on his face. The condition started 5 months ago with a gradual onset and a progressive course. This patient suffers from:","o":[["A","Psoriasis."],["B","Plane warts."],["C","Molluscum contagiosum."],["D","Scabies."],["E","Condyloma acuminata."]],"a":"B","sa":null,"pg":null,"f":[],"n":72,"e":["Asymptomatic flat-topped lesions on a child's face with gradual onset are plane warts. Why the other options are wrong: A) Psoriasis: Psoriasis is scaly. C) Molluscum contagiosum: Molluscum is umbilicated. D) Scabies: Scabies is itchy. E) Condyloma acuminata: Condyloma is genital.","Plane warts."],"im":[]},{"id":"H113","ch":"Viral Infections","q":"Herpes labialis:","o":[["A","Is recurrent."],["B","Heals with scar."],["C","Its primary lesion is a papule."],["D","Is strictly unilateral."],["E","Is caused by HSV II."]],"a":"A","sa":null,"pg":null,"f":[],"n":73,"e":["Herpes labialis recurs because HSV stays latent in the dorsal root ganglion and is reactivated by stress, UV, fever, menstruation. It is usually HSV-1, heals without scar and begins as vesicles. Why the other options are wrong: B) Heals with scar: It heals without scar. C) Its primary lesion is a papule: The primary lesion is a vesicle. D) Is strictly unilateral: It can be bilateral. E) Is caused by HSV II: It is usually HSV-1.","Recurrent HSV."],"im":[]},{"id":"H114","ch":"Viral Infections","q":"All of the following is true for herpes zoster Except:","o":[["A","It is recurrent."],["B","It is a viral infection."],["C","It is preceded by pain."],["D","It is unilateral."],["E","It might cause scarring."]],"a":"A","sa":null,"pg":null,"f":[],"n":74,"e":["Zoster is not usually recurrent; it is preceded by pain, is unilateral, viral and may scar. Why the other options are wrong: B) It is a viral infection: Zoster is VZV reactivation. C) It is preceded by pain: Pain or tingling precedes the rash. D) It is unilateral: It is unilateral and dermatomal, not crossing the midline. E) It might cause scarring: It can scar, especially hemorrhagic or necrotic cases.","Zoster seldom recurs."],"im":[]},{"id":"Q188","ch":"Fungal Infections","q":"Dermatophytes cause infection of","o":[["A","Non-hairy skin."],["B","Hair."],["C","Nails."],["D","a + b."],["E","a + b + c."]],"a":"E","sa":null,"pg":"32","f":[],"n":1,"e":["Dermatophytes live on keratin, so they infect hairless skin (tinea corporis, cruris, pedis, manuum), hair (tinea capitis, barbae) and nails (tinea unguium). Why the other options are wrong: A) Non-hairy skin: True but incomplete: hairless skin is only one site. B) Hair: True but incomplete: hair (tinea capitis, barbae) is only one site. C) Nails: True but incomplete: nails (tinea unguium) are only one site. D) a + b: Still leaves out the nails, which dermatophytes also invade.","Skin, hair, nails."],"im":[]},{"id":"Q189","ch":"Fungal Infections","q":"Tinea capitis is","o":[["A","A disorder of keratinization."],["B","A disease of adults only."],["C","Staphylococcal infection of the hair follicle."],["D","Always a cause of cicatricial alopecia."],["E","Ringworm of the scalp."]],"a":"E","sa":null,"pg":"32","f":[],"n":2,"e":["Tinea capitis is dermatophyte infection (ringworm) of the scalp and hair. Why the other options are wrong: A) A disorder of keratinization: Keratinization disorders are things like psoriasis or ichthyosis; tinea is an infection. B) A disease of adults only: Scaly and black-dot types occur in children only, but kerion and favus occur in children and adults. C) Staphylococcal infection of the hair fol…: A staphylococcal follicle infection is folliculitis; tinea capitis is fungal. D) Always a cause of cicatricial alopecia: Only kerion and favus scar, and only if untreated; scaly and black-dot types leave no scar.","Capitis = scalp."],"im":[]},{"id":"Q190","ch":"Fungal Infections","q":"Onychomycosis is ringworm of","o":[["A","Scalp."],["B","Beard."],["C","Groin."],["D","Nails."],["E","Trunk."]],"a":"D","sa":null,"pg":"32","f":[],"n":3,"e":["Onychomycosis (tinea unguium) is dermatophyte infection of the nails. Why the other options are wrong: A) Scalp: Ringworm of the scalp is tinea capitis. B) Beard: Ringworm of the beard is tinea barbae. C) Groin: Ringworm of the groin is tinea cruris. E) Trunk: Ringworm of the trunk (hairless skin) is tinea corporis.","Nails."],"im":[]},{"id":"Q191","ch":"Fungal Infections","q":"A 4-year-old child presented with a circumscribed area of hair loss. On examination, short stumps of hairs and scales were seen. The most probable diagnosis is","o":[["A","Alopecia areata."],["B","Tinea capitis (scaly ringworm)."],["C","Discoid lupus erythematosus."],["D","Lichen planus."],["E","Psoriasis."]],"a":"B","sa":null,"pg":"33","f":[],"n":4,"e":["A child with a circumscribed bald patch, broken stumps of hair and fine grayish-white scales has scaly (gray patch) tinea capitis; the hairs break off above the skin. Why the other options are wrong: A) Alopecia areata: Alopecia areata is smooth and not scaly, with normal-looking scalp skin. C) Discoid lupus erythematosus: DLE gives scarring, atrophic, scaly plaques and is rare in young children. D) Lichen planus: Lichen planus (planopilaris) is an adult disease that scars the scalp. E) Psoriasis: Psoriasis gives thick silvery plaques without breaking of hairs into stumps.","Short stumps + scales."],"im":[]},{"id":"Q192","ch":"Fungal Infections","q":"A scaly patch on the scalp with hair loss in a child is characteristic of","o":[["A","Alopecia areata."],["B","Ringworm of scalp."],["C","Telogen effluvium."],["D","DLE."],["E","Tinea versicolor."]],"a":"B","sa":null,"pg":"33","f":[],"n":5,"e":["A scaly bald patch in a child is scaly ringworm of the scalp (tinea capitis), where loose hairs break off and leave fine grayish-white scales. Why the other options are wrong: A) Alopecia areata: Alopecia areata has smooth skin with no scaling. C) Telogen effluvium: Telogen effluvium is diffuse, non-scaly shedding, not a patch. D) DLE: DLE causes scarring plaques, mostly in adults. E) Tinea versicolor: Tinea versicolor is on the trunk and never involves hair.","Child + scaly bald patch."],"im":[]},{"id":"Q193","ch":"Fungal Infections","q":"Scaly type of tinea capitis","o":[["A","Is associated with hair loss."],["B","Causes scarring."],["C","Is a non-infectious disease."],["D","Affects children & adults."],["E","Is treated by oral nystatin."]],"a":"A","sa":null,"pg":"33","f":[],"n":6,"e":["In the scaly type the hairs break off, leaving single or multiple bald patches with fine grayish-white scales; there is no scar. Why the other options are wrong: B) Causes scarring: The course is 'no scar'; only kerion and favus scar if not treated early. C) Is a non-infectious disease: It is an infectious (contagious) dermatophyte infection. D) Affects children & adults: The scaly type occurs in children only. E) Is treated by oral nystatin: Nystatin acts on yeasts (Candida), not dermatophytes; use griseofulvin, terbinafine or azoles.","Hair loss, no scar."],"im":[]},{"id":"Q194","ch":"Fungal Infections","q":"Which of the following is a characteristic of scaly scalp ringworm?","o":[["A","More frequent occurrence in childhood."],["B","Is a cause of permanent alopecia."],["C","Ability to invade the dermis."],["D","Ability to invade other organs."],["E","Sensitivity to penicillin."]],"a":"A","sa":null,"pg":"33","f":[],"n":7,"e":["Scaly ringworm of the scalp is typically a childhood disease (children only). Why the other options are wrong: B) Is a cause of permanent alopecia: The scaly type leaves no scar, so alopecia is not permanent. C) Ability to invade the dermis: Dermatophytes stay in the stratum corneum, hair and nails and do not invade the dermis. D) Ability to invade other organs: The infection is superficial and does not spread to other organs. E) Sensitivity to penicillin: It is fungal, so penicillin has no effect; use griseofulvin, terbinafine or azoles.","Child disease."],"im":[]},{"id":"Q195","ch":"Fungal Infections","q":"Kerion","o":[["A","Is a boggy swelling simulating an abscess."],["B","Is a disease of adults only."],["C","Is a staphylococcal infection of the hair follicle."],["D","Is associated with systemic manifestations."],["E","Never leads to cicatricial alopecia."]],"a":"A","sa":null,"pg":"33","f":[],"n":8,"e":["Kerion is a boggy swelling studded with follicular pustules that mimics a bacterial abscess; incision and antibiotics worsen it and increase scarring. Why the other options are wrong: B) Is a disease of adults only: Kerion affects both children and adults. C) Is a staphylococcal infection of the hai…: It is a dermatophyte (fungal) infection, which is why antibiotics fail. D) Is associated with systemic manifestatio…: It is a local inflammatory reaction; systemic manifestations are not a defining feature. E) Never leads to cicatricial alopecia: It can end in cicatricial alopecia if not treated early.","Kerion = fungal abscess-like."],"im":[]},{"id":"Q196","ch":"Fungal Infections","q":"Kerion is:","o":[["A","Staphylococcal infection of the hair follicle."],["B","Associated with systemic manifestations."],["C","A disease which never leads to cicatricial alopecia."],["D","All of the above."],["E","None of the above."]],"a":"E","sa":null,"pg":"33","f":[],"n":9,"e":["None of the statements is true: kerion is fungal, is a local boggy swelling rather than a systemic illness, and can scar. Why the other options are wrong: A) Staphylococcal infection of the hair fol…: It is a dermatophyte infection, not staphylococcal. B) Associated with systemic manifestations: The picture is local (boggy swelling with pustules); systemic manifestations are not a feature. C) A disease which never leads to cicatrici…: It can lead to cicatricial alopecia if treated late. D) All of the above: All three statements are false.","Kerion can scar."],"im":[]},{"id":"Q197","ch":"Fungal Infections","q":"A child presents with an area of boggy, tender swelling studded with follicular pustules on the scalp, with patchy hair loss; it did not improve with antibiotics and may lead to scarring alopecia. The most likely diagnosis is:","o":[["A","Ecthyma."],["B","Favus."],["C","Discoid lupus erythematosus."],["D","Kerion."],["E","Seborrheic dermatitis."]],"a":"D","sa":null,"pg":"33","f":[],"n":10,"e":["Boggy swelling with follicular pustules that does not respond to antibiotics and may scar is kerion (inflammatory dermatophyte reaction). Why the other options are wrong: A) Ecthyma: Ecthyma is a punched-out crusted ulcer, usually on the legs, not a boggy scalp swelling. B) Favus: Favus has yellow cup-shaped crusts (scutula), not a boggy swelling. C) Discoid lupus erythematosus: DLE gives atrophic scarring plaques, not pustules and boggy swelling. E) Seborrheic dermatitis: Seborrheic dermatitis gives greasy scales without swelling or pustules.","Kerion → scarring risk."],"im":[]},{"id":"Q198","ch":"Fungal Infections","q":"One of the following may cause cicatricial alopecia","o":[["A","Androgenetic alopecia."],["B","Telogen effluvium."],["C","Alopecia areata."],["D","Kerion."],["E","Scaly ringworm."]],"a":"D","sa":null,"pg":"33","f":[],"n":11,"e":["Kerion can heal with scarring (cicatricial alopecia) if not treated early; favus does too. Why the other options are wrong: A) Androgenetic alopecia: Androgenetic alopecia is patterned and non-scarring. B) Telogen effluvium: Telogen effluvium is diffuse reversible shedding. C) Alopecia areata: Alopecia areata is non-scarring. E) Scaly ringworm: Scaly ringworm leaves no scar.","Kerion, favus scar."],"im":[]},{"id":"Q199","ch":"Fungal Infections","q":"Scutula is the characteristic lesion of","o":[["A","Scaly ringworm."],["B","Black-dot ringworm."],["C","Favus."],["D","Kerion."],["E","None of the above."]],"a":"C","sa":null,"pg":"33","f":[],"n":12,"e":["Scutula (yellow cup-shaped sulfur crusts around hairs) are the characteristic lesion of favus. Why the other options are wrong: A) Scaly ringworm: Scaly type shows fine grayish-white scales. B) Black-dot ringworm: Black-dot type shows hairs broken at the skin surface as black dots. D) Kerion: Kerion is a boggy swelling with pustules. E) None of the above: Scutula do belong to one of the types: favus.","Scutula = favus."],"im":[]},{"id":"Q200","ch":"Fungal Infections","q":"A child presents with an area of thick yellow cup-shaped crusts surrounding hair shafts on the scalp, associated with scarring alopecia. The most likely diagnosis is:","o":[["A","Tinea corporis."],["B","Favus."],["C","Discoid lupus erythematosus."],["D","Impetigo."],["E","Seborrheic dermatitis."]],"a":"B","sa":null,"pg":"33","f":[],"n":13,"e":["Thick yellow cup-shaped crusts around hair shafts with scarring alopecia are scutula of favus. Why the other options are wrong: A) Tinea corporis: Tinea corporis affects hairless skin, not the scalp. C) Discoid lupus erythematosus: DLE scars but has no cup-shaped crusts around hairs. D) Impetigo: Impetigo has honey-colored crusts and does not cause scarring alopecia. E) Seborrheic dermatitis: Seborrheic dermatitis gives greasy scales and no scarring.","Favus scars."],"im":[]},{"id":"Q201","ch":"Fungal Infections","q":"Case 6: A female patient, 10 years old, presented with scaly plaques on her scalp of two months duration. Lesions started by a gradual onset and a progressive course and ended by almost complete loss of scalp hair. (Clinical photo: scalp covered with yellowish cup-shaped crusts with hair loss.) The sign seen in the photo is","o":[["A","Wheal."],["B","Papule."],["C","Scutula."],["D","Comedone."],["E","Burrow."]],"a":"C","sa":null,"pg":"33","f":[],"n":14,"e":["The picture is favus: yellow cup-shaped crusts (scutula) around loose hairs, ending in diffuse hair loss replaced by fibrous tissue. Why the other options are wrong: A) Wheal: A wheal is the transient edema of urticaria. B) Papule: A papule is a small solid elevation, not a cup-shaped crust. D) Comedone: A comedone is the primary lesion of acne. E) Burrow: A burrow is the primary lesion of scabies.","Scutula = favus."],"im":[]},{"id":"Q202","ch":"Fungal Infections","q":"Case 6: A female patient, 10 years old, presented with scaly plaques on her scalp of two months duration. Lesions started by a gradual onset and a progressive course and ended by almost complete loss of scalp hair. (Clinical photo: scalp covered with yellowish cup-shaped crusts with hair loss.) Regarding this disease, choose the correct statement","o":[["A","Is a superficial bacterial infection."],["B","Is a deep parasitic infection."],["C","Is a cause of cicatricial alopecia."],["D","Affects children only."],["E","Treated by topical ivermectin 1%."]],"a":"C","sa":null,"pg":"33","f":[],"n":15,"e":["Favus is a fungal infection of the scalp that heals with scarring (cicatricial alopecia). Why the other options are wrong: A) Is a superficial bacterial infection: It is fungal, not bacterial. B) Is a deep parasitic infection: It is superficial and fungal, not a deep parasitic infection. D) Affects children only: Favus occurs in children and adults. E) Treated by topical ivermectin 1%: Ivermectin is antiparasitic; favus needs systemic antifungals.","Favus scars."],"im":[]},{"id":"Q203","ch":"Fungal Infections","q":"Wood's light is used in the diagnosis of","o":[["A","Tinea versicolor."],["B","Erythrasma."],["C","Favus."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"34","f":[],"n":16,"e":["Wood's light shows yellow fluorescence in tinea versicolor, coral red in erythrasma and yellowish-green in favus (and black-dot type), so all are diagnosed with it. Why the other options are wrong: A) Tinea versicolor: True but incomplete: versicolor fluoresces yellow. B) Erythrasma: True but incomplete: erythrasma fluoresces coral red. C) Favus: True but incomplete: favus fluoresces yellowish-green. E) None of the above: Wrong because all listed conditions are examined with Wood's light.","Versicolor, erythrasma, favus."],"im":[]},{"id":"Q204","ch":"Fungal Infections","q":"Case 3: A female patient, 19 years old, presented with an annular well-defined plaque on her forearm. The lesion showed an active border and a clear center. The condition started about 3 weeks ago with a gradual onset and a progressive course. She applied topical antibiotic cream for 2 weeks with no improvement. (Clinical photo: annular plaque with active scaly border and clear center on the forearm.) This plaque is suggestive of","o":[["A","Seborrheic dermatitis."],["B","Irritant dermatitis."],["C","Scabies."],["D","Tinea circinata."],["E","Tinea versicolor."]],"a":"D","sa":null,"pg":"34","f":[],"n":17,"e":["A well-defined annular plaque with an active edge and clear center is tinea corporis (circinata). Why the other options are wrong: A) Seborrheic dermatitis: Seborrheic dermatitis is greasy scaling in seborrheic areas without an active edge. B) Irritant dermatitis: Irritant dermatitis has no advancing edge with central clearing. C) Scabies: Scabies shows burrows and nocturnal itching. E) Tinea versicolor: Tinea versicolor is branny macules on the trunk without an active border.","Ring edge + clear center."],"im":[]},{"id":"Q205","ch":"Fungal Infections","q":"Case 3: A female patient, 19 years old, presented with an annular well-defined plaque on her forearm. The lesion showed an active border and a clear center. The condition started about 3 weeks ago with a gradual onset and a progressive course. She applied topical antibiotic cream for 2 weeks with no improvement. (Clinical photo: annular plaque with active scaly border and clear center on the forearm.) The following drug is used for treatment","o":[["A","Systemic antibiotic."],["B","Topical steroid."],["C","Systemic ivermectin."],["D","Topical permethrin."],["E","Topical azole."]],"a":"E","sa":null,"pg":"37","f":[],"n":18,"e":["Localized tinea corporis is treated with topical azole or terbinafine creams; systemic drugs are kept for extensive or resistant cases. Why the other options are wrong: A) Systemic antibiotic: The cause is fungal, so antibiotics do not help. B) Topical steroid: Topical steroid suppresses inflammation and lets the fungus spread. C) Systemic ivermectin: Ivermectin is for scabies. D) Topical permethrin: Permethrin is for scabies and lice.","Topical azole."],"im":[]},{"id":"Q206","ch":"Fungal Infections","q":"Which systemic treatment is used in treatment of tinea corporis?","o":[["A","Terbinafine."],["B","Ivermectin."],["C","Corticosteroids."],["D","Acitretin."],["E","Psoralen."]],"a":"A","sa":null,"pg":"37","f":[],"n":19,"e":["Systemic terbinafine (also griseofulvin and azoles) is used for extensive or resistant tinea corporis. Why the other options are wrong: B) Ivermectin: Ivermectin treats parasites. C) Corticosteroids: Corticosteroids worsen fungal infection. D) Acitretin: Acitretin is a retinoid for psoriasis. E) Psoralen: Psoralen is used with UVA (PUVA) for psoriasis and vitiligo.","Terbinafine."],"im":[]},{"id":"Q207","ch":"Fungal Infections","q":"A 45-year-old farmer presents with scaly erythematous patches on the groin with an active, raised border and central clearing. What is the most likely diagnosis?","o":[["A","Tinea cruris."],["B","Candidal intertrigo."],["C","Pityriasis rosea."],["D","Seborrheic dermatitis."],["E","Erythrasma."]],"a":"A","sa":null,"pg":"35","f":[],"n":20,"e":["Scaly erythematous patches in the groin with an active raised border and central clearing are tinea cruris. Why the other options are wrong: B) Candidal intertrigo: Candidal intertrigo has satellite lesions and pustules without central clearing. C) Pityriasis rosea: Pityriasis rosea is on the trunk with a herald patch. D) Seborrheic dermatitis: Seborrheic dermatitis has greasy scales without central clearing. E) Erythrasma: Erythrasma is well-defined brown patches with no active border.","Tinea cruris."],"im":[]},{"id":"Q208","ch":"Fungal Infections","q":"Case 2: A female patient, 33 years old, presented with an extending plaque on her inner thighs. The condition started about 2 months ago with a gradual onset and a progressive course. She applied a topical antibiotic cream for 2 weeks with no improvement. (Clinical photo: annular erythematous plaque with active border on the inner thigh.) What is the diagnosis of this case?","o":[["A","Tinea manuum."],["B","Tinea unguium."],["C","Tinea cruris."],["D","Crusted scabies."],["E","Circinate impetigo."]],"a":"C","sa":null,"pg":"35","f":[],"n":21,"e":["An extending plaque in the groin/inner thigh that failed a topical antibiotic is tinea cruris. Why the other options are wrong: A) Tinea manuum: Tinea manuum is ringworm of the palm. B) Tinea unguium: Tinea unguium is nail infection. D) Crusted scabies: Crusted scabies is thick crusts with intense itching, in immunosuppressed patients. E) Circinate impetigo: Circinate impetigo is bacterial and would respond to the antibiotic.","Spares the scrotum."],"im":[]},{"id":"Q209","ch":"Fungal Infections","q":"Case 2: A female patient, 33 years old, presented with an extending plaque on her inner thighs. The condition started about 2 months ago with a gradual onset and a progressive course. She applied a topical antibiotic cream for 2 weeks with no improvement. (Clinical photo: annular erythematous plaque with active border on the inner thigh.) Which medication will benefit the patient?","o":[["A","Oral terbinafine."],["B","Topical corticosteroids."],["C","Oral ivermectin."],["D","Topical psoralen."],["E","Oral antibiotics."]],"a":"A","sa":null,"pg":"37","f":[],"n":22,"e":["The failed topical antibiotic points to a fungal cause. The book gives topical azoles/terbinafine for tinea cruris and systemic therapy for extensive or resistant cases; of the options, only terbinafine is an antifungal. Why the other options are wrong: B) Topical corticosteroids: Topical corticosteroids worsen tinea. C) Oral ivermectin: Ivermectin is antiparasitic. D) Topical psoralen: Psoralen is used for phototherapy. E) Oral antibiotics: Antibiotics do not treat fungi, and she already failed one.","Terbinafine."],"im":[]},{"id":"Q210","ch":"Fungal Infections","q":"Tinea cruris may be confused with","o":[["A","Flexural psoriasis."],["B","Erythrasma."],["C","Candidal intertrigo."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"35","f":[],"n":23,"e":["The differential of tinea cruris includes candidiasis, flexural psoriasis, seborrheic dermatitis and erythrasma, so all options apply. Why the other options are wrong: A) Flexural psoriasis: True but incomplete: flexural (inverse) psoriasis. B) Erythrasma: True but incomplete: erythrasma. C) Candidal intertrigo: True but incomplete: candidal intertrigo. E) None of the above: Wrong because all can mimic it.","DD: psoriasis, erythrasma, candida."],"im":[]},{"id":"Q211","ch":"Fungal Infections","q":"All of the following are part of the differential diagnosis of tinea cruris EXCEPT:","o":[["A","Candidiasis."],["B","Seborrheic dermatitis."],["C","Erythrasma."],["D","Flexural psoriasis."],["E","Leprosy."]],"a":"E","sa":null,"pg":"35","f":[],"n":24,"e":["Leprosy is not a scaly intertriginous eruption and is not in the differential of tinea cruris. Why the other options are wrong: A) Candidiasis: Candidiasis is in the differential. B) Seborrheic dermatitis: Seborrheic dermatitis is in the differential. C) Erythrasma: Erythrasma is in the differential. D) Flexural psoriasis: Flexural psoriasis is in the differential.","Leprosy no."],"im":[]},{"id":"Q212","ch":"Fungal Infections","q":"Flexural areas may be affected in","o":[["A","Psoriasis."],["B","Candidiasis."],["C","Dermatophytosis."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"35","f":[],"n":25,"e":["Flexures are affected by candidal intertrigo, flexural psoriasis and tinea cruris, so all options apply. Why the other options are wrong: A) Psoriasis: True but incomplete: flexural psoriasis. B) Candidiasis: True but incomplete: candidal intertrigo. C) Dermatophytosis: True but incomplete: tinea cruris. E) None of the above: Wrong because all three affect flexures.","Intertrigo."],"im":[]},{"id":"Q213","ch":"Fungal Infections","q":"Tinea barbae","o":[["A","Is a viral infection of the beard area."],["B","May be circinate or kerion-like."],["C","Is a bacterial infection of the beard area."],["D","Is a painful vesicular eruption of the beard area."],["E","Responds to oral tetracycline."]],"a":"B","sa":null,"pg":"35","f":[],"n":26,"e":["Tinea barbae is dermatophyte infection of the beard, mostly one-sided on neck or face, either circinate or with pustules like kerion. Why the other options are wrong: A) Is a viral infection of the beard area: It is fungal, not viral. C) Is a bacterial infection of the beard ar…: Bacterial beard infection is sycosis barbae; tinea barbae is fungal. D) Is a painful vesicular eruption of the b…: Painful vesicles in the beard suggest herpes simplex. E) Responds to oral tetracycline: Tetracycline is antibacterial and will not cure a fungus.","Beard ringworm."],"im":[]},{"id":"Q214","ch":"Fungal Infections","q":"A male patient, 33 years old, complains of an annular lesion with active border and pale center in his beard area, with acute onset and progressive course for two weeks; he took antibiotics with no improvement. The diagnosis is:","o":[["A","Tinea versicolor."],["B","Tinea barbae."],["C","Discoid lupus erythematosus."],["D","Molluscum contagiosum / warts."]],"a":"B","sa":null,"pg":"35","f":[],"n":27,"e":["An annular lesion with an active border and pale center in the beard that fails antibiotics is tinea barbae. Why the other options are wrong: A) Tinea versicolor: Tinea versicolor is on the trunk. C) Discoid lupus erythematosus: DLE is a scarring atrophic plaque, not an annular lesion with an active border. D) Molluscum contagiosum / warts: Molluscum or warts are papules, not annular plaques.","Failed antibiotics."],"im":[]},{"id":"Q215","ch":"Fungal Infections","q":"Tinea pedis","o":[["A","Is strictly unilateral."],["B","Commonly involves the space between 1st & 2nd toes."],["C","Is a recurrent disease."],["D","Excessive dryness is a predisposing factor."],["E","Needs repeated washing of the feet."]],"a":"C","sa":null,"pg":"36","f":[],"n":28,"e":["Tinea pedis is a recurrent disease; recurrences are common. Why the other options are wrong: A) Is strictly unilateral: It is mostly bilateral. B) Commonly involves the space between 1st …: It usually affects the lateral web spaces (4th and 5th toes), not the first and second. D) Excessive dryness is a predisposing fact…: Excessive sweating and moisture predispose, not dryness. E) Needs repeated washing of the feet: Moisture promotes it; the feet should be kept dry.","Recurrent."],"im":[]},{"id":"Q216","ch":"Fungal Infections","q":"Excessive sweating & moisture is a predisposing factor for","o":[["A","Psoriasis."],["B","Pityriasis rosea."],["C","Vitiligo."],["D","Favus."],["E","Tinea pedis."]],"a":"E","sa":null,"pg":"36","f":[],"n":29,"e":["Excessive sweating and moisture predispose to tinea pedis (also diabetes). Why the other options are wrong: A) Psoriasis: Psoriasis is not related to moisture. B) Pityriasis rosea: Pityriasis rosea is not related to sweating. C) Vitiligo: Vitiligo is autoimmune. D) Favus: Favus is not moisture dependent.","Moist feet."],"im":[]},{"id":"Q217","ch":"Fungal Infections","q":"Tinea unguium affects","o":[["A","Nail fold."],["B","Nail plate."],["C","Groin."],["D","Joints."],["E","Interdigital space."]],"a":"B","sa":null,"pg":"37","f":[],"n":30,"e":["Tinea unguium involves the nail plate, with yellowish or whitish discoloration, thickening and onycholysis. Why the other options are wrong: A) Nail fold: The nail fold is affected in paronychia, often candidal. C) Groin: Groin involvement is tinea cruris. D) Joints: Joints are not involved. E) Interdigital space: Interdigital spaces are affected in tinea pedis.","Nail plate."],"im":[]},{"id":"Q218","ch":"Fungal Infections","q":"Tinea unguium affects","o":[["A","Nails."],["B","Joints."],["C","Hair follicle."],["D","Interdigital spaces."],["E","Flexures."]],"a":"A","sa":null,"pg":"37","f":[],"n":31,"e":["Tinea unguium is dermatophyte infection of the nails. Why the other options are wrong: B) Joints: Joints are not involved. C) Hair follicle: Hair follicles are involved in tinea capitis and barbae. D) Interdigital spaces: Interdigital spaces are involved in tinea pedis. E) Flexures: Flexures are involved in tinea cruris and candidiasis.","Nails."],"im":[]},{"id":"Q219","ch":"Fungal Infections","q":"The main line of treatment of tinea capitis is","o":[["A","Tincture iodine."],["B","Griseofulvin."],["C","Malathion."],["D","Calcipotriene."],["E","Tetracycline."]],"a":"B","sa":null,"pg":"37","f":[],"n":32,"e":["Systemic griseofulvin (12.5 mg/kg/day for 6-8 weeks) is the backbone of tinea capitis treatment. Why the other options are wrong: A) Tincture iodine: Tincture iodine is only a topical adjuvant. C) Malathion: Malathion treats head lice. D) Calcipotriene: Calcipotriene is used in psoriasis. E) Tetracycline: Tetracycline is antibacterial.","Griseofulvin = systemic."],"im":[]},{"id":"Q220","ch":"Fungal Infections","q":"Tinea capitis can be treated TOPICALLY ALONE by","o":[["A","Selenium sulphide."],["B","Castellani's paint."],["C","Tincture iodine."],["D","Imidazole derivatives."],["E","None of the above."]],"a":"E","sa":null,"pg":"37","f":[],"n":33,"e":["Tinea capitis cannot be cured by topical therapy alone because the fungus lies inside the hair, so systemic treatment is the backbone. Why the other options are wrong: A) Selenium sulphide: Selenium sulphide shampoo is only an adjuvant. B) Castellani's paint: Castellani paint is used for tinea pedis. C) Tincture iodine: Tincture iodine is only an adjuvant. D) Imidazole derivatives: Azole creams cannot reach fungus inside hair.","Systemic required."],"im":[]},{"id":"Q221","ch":"Fungal Infections","q":"An 18-year-old man presents with an oval, itchy area of patchy hair loss in the scalp with scales which appeared 2 weeks after visiting the barber. Which of the following options would be the most appropriate in treating this condition?","o":[["A","Fusidic acid cream."],["B","Acyclovir cream."],["C","Oral acyclovir."],["D","Oral erythromycin."],["E","Oral griseofulvin."]],"a":"E","sa":null,"pg":"37","f":[],"n":34,"e":["Patchy scaly hair loss after a barber visit is tinea capitis, treated with oral griseofulvin. Why the other options are wrong: A) Fusidic acid cream: Fusidic acid is antibacterial. B) Acyclovir cream: Acyclovir cream is antiviral. C) Oral acyclovir: Oral acyclovir is antiviral. D) Oral erythromycin: Erythromycin is antibacterial.","Oral griseofulvin."],"im":[]},{"id":"Q222","ch":"Fungal Infections","q":"Given that the dose of griseofulvin is 12.5 mg/kg body weight/day and each tablet is 125 mg, an 80 kg man with extensive tinea cruris will take","o":[["A","5 tablets/day."],["B","9 tablets/day."],["C","7 tablets/day."],["D","8 tablets/day."],["E","6 tablets/day."]],"a":"D","sa":null,"pg":"37","f":[],"n":35,"e":["Dose = 12.5 mg x 80 kg = 1000 mg; 1000 / 125 = 8 tablets daily. Why the other options are wrong: A) 5 tablets/day: 5 tablets = 625 mg, too low. B) 9 tablets/day: 9 tablets = 1125 mg, too high. C) 7 tablets/day: 7 tablets = 875 mg, too low. E) 6 tablets/day: 6 tablets = 750 mg, too low.","1000 mg ÷ 125 mg = 8."],"im":[]},{"id":"Q223","ch":"Fungal Infections","q":"Griseofulvin may be used in the treatment of","o":[["A","Oral thrush."],["B","Tinea versicolor."],["C","Tinea corporis."],["D","Interdigital moniliasis."],["E","Balanitis."]],"a":"C","sa":null,"pg":"37","f":[],"n":36,"e":["Griseofulvin is used in dermatophyte infections such as tinea corporis, but is not effective in yeast infections. Why the other options are wrong: A) Oral thrush: Oral thrush is Candida (yeast). B) Tinea versicolor: Tinea versicolor is Malassezia (yeast). D) Interdigital moniliasis: Interdigital moniliasis is candidal. E) Balanitis: Balanitis is candidal.","Dermatophytes only."],"im":[]},{"id":"Q224","ch":"Fungal Infections","q":"Griseofulvin may be used in the treatment of","o":[["A","Oral thrush."],["B","Tinea versicolor."],["C","Tinea cruris."],["D","Interdigital moniliasis."],["E","Balanitis."]],"a":"C","sa":null,"pg":"37","f":[],"n":37,"e":["Griseofulvin treats dermatophyte infections such as tinea cruris, not yeast infections. Why the other options are wrong: A) Oral thrush: Oral thrush is Candida (yeast). B) Tinea versicolor: Tinea versicolor is Malassezia (yeast). D) Interdigital moniliasis: Interdigital moniliasis is candidal. E) Balanitis: Balanitis is candidal.","Dermatophytosis."],"im":[]},{"id":"Q225","ch":"Fungal Infections","q":"Griseofulvin is a drug of choice for","o":[["A","Dermatophytosis."],["B","Tinea versicolor."],["C","Oral thrush."],["D","Erosio interdigitalis blastomycetica."],["E","Balanitis."]],"a":"A","sa":null,"pg":"37","f":[],"n":38,"e":["Griseofulvin is a drug of choice for dermatophytosis (tinea). Why the other options are wrong: B) Tinea versicolor: Tinea versicolor is yeast. C) Oral thrush: Oral thrush is yeast. D) Erosio interdigitalis blastomycetica: Erosio interdigitalis blastomycetica is candidal. E) Balanitis: Balanitis is usually candidal.","Not yeasts."],"im":[]},{"id":"Q226","ch":"Fungal Infections","q":"Griseofulvin is","o":[["A","The drug of choice in scalp pediculosis."],["B","Used for treatment of dermatophyte infection."],["C","Never used in children."],["D","Effective in treatment of pityriasis versicolor."],["E","The backbone for treatment of leprosy."]],"a":"B","sa":null,"pg":"37","f":[],"n":39,"e":["Griseofulvin is an antifungal for dermatophyte infections. Why the other options are wrong: A) The drug of choice in scalp pediculosis: Scalp pediculosis is treated with insecticides such as permethrin. C) Never used in children: It is used in children for tinea capitis (12.5 mg/kg/day). D) Effective in treatment of pityriasis ver…: It is not effective in yeast infections like pityriasis versicolor. E) The backbone for treatment of leprosy: Leprosy is treated with rifampicin, dapsone and clofazimine.","Dermatophytes."],"im":[]},{"id":"Q227","ch":"Fungal Infections","q":"Griseofulvin is effective in the treatment of all of the following EXCEPT","o":[["A","Tinea capitis."],["B","Tinea corporis."],["C","Tinea versicolor."],["D","Onychomycosis."],["E","Tinea pedis."]],"a":"C","sa":null,"pg":"41","f":[],"n":40,"e":["Griseofulvin is not effective in yeast infection, so it is the exception for tinea versicolor (Malassezia). Why the other options are wrong: A) Tinea capitis: Tinea capitis is its main indication. B) Tinea corporis: Griseofulvin is used in extensive tinea corporis. D) Onychomycosis: The book names terbinafine and azoles for nails, but griseofulvin is a dermatophyte drug that has been used for nails. E) Tinea pedis: Tinea pedis is dermatophyte infection.","Griseofulvin ≠ versicolor."],"im":[]},{"id":"Q228","ch":"Fungal Infections","q":"Tinea versicolor is a superficial fungal infection caused by","o":[["A","Trichophyton rubrum."],["B","Malassezia furfur."],["C","Microsporum canis."],["D","Candida albicans."],["E","Trichophyton violaceum."]],"a":"B","sa":null,"pg":"38","f":[],"n":41,"e":["Tinea versicolor (pityriasis versicolor) is caused by the lipophilic yeast Malassezia furfur. Why the other options are wrong: A) Trichophyton rubrum: Trichophyton is a dermatophyte causing tinea. C) Microsporum canis: Microsporum is a dermatophyte of scalp ringworm. D) Candida albicans: Candida albicans causes candidiasis. E) Trichophyton violaceum: Trichophyton is a dermatophyte.","Malassezia."],"im":[]},{"id":"Q229","ch":"Fungal Infections","q":"Malassezia furfur is the causative organism of","o":[["A","Tinea circinata."],["B","Tinea cruris."],["C","Pityriasis rosea."],["D","Pityriasis versicolor."],["E","Erythrasma."]],"a":"D","sa":null,"pg":"38","f":[],"n":42,"e":["Malassezia furfur causes pityriasis versicolor. Why the other options are wrong: A) Tinea circinata: Tinea circinata is dermatophyte infection. B) Tinea cruris: Tinea cruris is dermatophyte infection. C) Pityriasis rosea: Pityriasis rosea is probably a viral exanthem. E) Erythrasma: Erythrasma is caused by Corynebacterium minutissimum.","Pityriasis versicolor."],"im":[]},{"id":"Q230","ch":"Fungal Infections","q":"Malassezia furfur","o":[["A","Is a dermatophyte."],["B","Causes tinea capitis."],["C","Is treated by griseofulvin."],["D","All of the above."],["E","None of the above."]],"a":"E","sa":null,"pg":"38","f":[],"n":43,"e":["Malassezia furfur is a lipophilic yeast, not a dermatophyte, does not cause tinea capitis, and is not treated by griseofulvin. Why the other options are wrong: A) Is a dermatophyte: It is a yeast. B) Causes tinea capitis: Tinea capitis is caused by dermatophytes. C) Is treated by griseofulvin: Griseofulvin is ineffective in yeasts. D) All of the above: All three statements are false.","Yeast."],"im":[]},{"id":"Q231","ch":"Fungal Infections","q":"Regarding pityriasis versicolor","o":[["A","It affects children only."],["B","It is very itchy."],["C","Systemic antifungal therapy is essential in the treatment."],["D","A single attack gives lifelong immunity."],["E","It is caused by the lipophilic yeast Malassezia furfur."]],"a":"E","sa":null,"pg":"38","f":[],"n":44,"e":["Pityriasis versicolor is caused by the lipophilic yeast Malassezia furfur. Why the other options are wrong: A) It affects children only: It occurs in adolescents and young adults. B) It is very itchy: It is usually asymptomatic, and itching is mild if present. C) Systemic antifungal therapy is essential…: Topical therapy is first-line; systemic is for extensive cases. D) A single attack gives lifelong immunity: Recurrences are common, so there is no lifelong immunity.","Lipophilic yeast."],"im":[]},{"id":"Q232","ch":"Fungal Infections","q":"Pityriasis versicolor","o":[["A","Is a superficial dermatophytic infection of the skin."],["B","Primary lesion is hyper- or hypopigmented papules."],["C","Macules are covered with fine branny scales."],["D","Treatment is by griseofulvin."],["E","Is non-infectious."]],"a":"C","sa":null,"pg":"38","f":[],"n":45,"e":["Pityriasis versicolor lesions are macules or patches with mild, fine (branny) scales. Why the other options are wrong: A) Is a superficial dermatophytic infection…: It is caused by a yeast, not a dermatophyte. B) Primary lesion is hyper- or hypopigmente…: The lesions are macules and patches, not papules. D) Treatment is by griseofulvin: Griseofulvin is ineffective in yeasts. E) Is non-infectious: It is an infectious superficial mycosis.","Branny scale."],"im":[]},{"id":"Q233","ch":"Fungal Infections","q":"A male patient, 18 years old, had his summer vacation by the sea. He returned with hypo- and hyperpigmented finely scaly macules and patches on the upper trunk, neck and proximal upper limbs. What is the diagnosis?","o":[["A","Lichen planus."],["B","Pityriasis rosea."],["C","Pityriasis versicolor."],["D","Psoriasis."],["E","Subacute lupus."]],"a":"C","sa":null,"pg":"38","f":[],"n":46,"e":["Hypo- and hyperpigmented finely scaly macules on the upper trunk after sun exposure are pityriasis versicolor. Why the other options are wrong: A) Lichen planus: Lichen planus is itchy violaceous flat-topped papules. B) Pityriasis rosea: Pityriasis rosea has a herald patch and Christmas-tree pattern. D) Psoriasis: Psoriasis has silvery scaly plaques. E) Subacute lupus: Subacute lupus is an inflammatory annular photosensitive rash.","Summer."],"im":[]},{"id":"Q234","ch":"Fungal Infections","q":"A 22-year-old female returns from a fortnight holiday in Cyprus with a tan and numerous scaly hypopigmented lesions on the neck and upper trunk. What is the most likely diagnosis?","o":[["A","Chronic plaque psoriasis."],["B","Contact eczema."],["C","Pityriasis rosea."],["D","Pityriasis versicolor."],["E","Candidiasis."]],"a":"D","sa":null,"pg":"38","f":[],"n":47,"e":["Scaly hypopigmented lesions on the neck and upper trunk with a tan are pityriasis versicolor. Why the other options are wrong: A) Chronic plaque psoriasis: Plaque psoriasis has thick silvery plaques. B) Contact eczema: Contact eczema is itchy and vesicular. C) Pityriasis rosea: Pityriasis rosea has a herald patch and oval patches. E) Candidiasis: Candidiasis is moist erythema with satellites in flexures.","Summer + tan."],"im":[]},{"id":"Q235","ch":"Fungal Infections","q":"An adult patient presents with multiple, asymptomatic, hypopigmented macules on the upper back and chest with fine branny scaling. Lesions show yellow fluorescence under Wood's lamp. The most likely diagnosis is:","o":[["A","Erythrasma."],["B","Post-inflammatory hypopigmentation."],["C","Pityriasis rosea."],["D","Leprosy."],["E","Pityriasis versicolor."]],"a":"E","sa":null,"pg":"38","f":[],"n":48,"e":["Asymptomatic hypopigmented macules with branny scales and yellow Wood's fluorescence are pityriasis versicolor. Why the other options are wrong: A) Erythrasma: Erythrasma gives coral-red fluorescence and is in flexures. B) Post-inflammatory hypopigmentation: Post-inflammatory hypopigmentation follows a prior inflammatory lesion. C) Pityriasis rosea: Pityriasis rosea is pink oval patches with a herald patch. D) Leprosy: Leprosy gives anesthetic patches.","Upper trunk."],"im":[]},{"id":"Q236","ch":"Fungal Infections","q":"A female patient presented with multiple small hypopigmented scaly macules on the back and trunk, extending to the breasts in addition to her neck and proximal upper limbs. The condition started after a summer vacation in Alexandria. Wood's light examination was performed. (Clinical photo: back/trunk with multiple small hypopigmented scaly macules.) What is the diagnosis of this case?","o":[["A","Tinea cruris."],["B","Tinea versicolor."],["C","Tinea capitis."],["D","Tinea barbae."],["E","Tinea unguium."]],"a":"B","sa":null,"pg":"38","f":[],"n":49,"e":["Hypopigmented scaly macules on the trunk and neck after a summer holiday are tinea (pityriasis) versicolor. Why the other options are wrong: A) Tinea cruris: Tinea cruris is groin. C) Tinea capitis: Tinea capitis is scalp. D) Tinea barbae: Tinea barbae is beard. E) Tinea unguium: Tinea unguium is nails.","Upper trunk."],"im":[]},{"id":"Q237","ch":"Fungal Infections","q":"A female patient presented with multiple small hypopigmented scaly macules on the back and trunk, extending to the breasts in addition to her neck and proximal upper limbs. The condition started after a summer vacation in Alexandria. Wood's light examination was performed. (Clinical photo: back/trunk with multiple small hypopigmented scaly macules.) Regarding this disease, choose the appropriate statement","o":[["A","Griseofulvin is an effective treatment."],["B","Itching is more at night."],["C","Slit-skin smear stained with Ziehl-Neelsen is used for diagnosis."],["D","Caused by the lipophilic yeast Malassezia furfur."],["E","A single attack gives lifelong immunity."]],"a":"D","sa":null,"pg":"38","f":[],"n":50,"e":["Pityriasis versicolor is caused by the lipophilic yeast Malassezia furfur. Why the other options are wrong: A) Griseofulvin is an effective treatment: Griseofulvin is not effective in yeast. B) Itching is more at night: Nocturnal itching is a feature of scabies. C) Slit-skin smear stained with Ziehl-Neels…: Slit-skin smear with Ziehl-Neelsen is for leprosy. E) A single attack gives lifelong immunity: Recurrences are common.","Lipophilic."],"im":[]},{"id":"Q238","ch":"Fungal Infections","q":"Regarding pityriasis versicolor, what is the result of Wood's light examination?","o":[["A","Coral red fluorescence."],["B","Yellow fluorescence."],["C","Permanganate-colored fluorescence."],["D","Bluish fluorescence."],["E","Brown fluorescence."]],"a":"B","sa":null,"pg":"38","f":[],"n":51,"e":["Pityriasis versicolor shows yellow fluorescence under Wood's light. Why the other options are wrong: A) Coral red fluorescence: Coral red is erythrasma. C) Permanganate-colored fluorescence: Not a Wood's-lamp color in the book: yellow = versicolor, coral red = erythrasma, yellowish-green = favus/black-dot. D) Bluish fluorescence: Not a Wood's-lamp color in the book: yellow = versicolor, coral red = erythrasma, yellowish-green = favus/black-dot. E) Brown fluorescence: Not a Wood's-lamp color in the book: yellow = versicolor, coral red = erythrasma, yellowish-green = favus/black-dot.","Yellow."],"im":[]},{"id":"Q239","ch":"Fungal Infections","q":"Wood's light examination reveals a yellow color when the skin is affected by","o":[["A","Vitiligo."],["B","Erythrasma."],["C","Tinea versicolor."],["D","Tinea circinata."],["E","None of the above."]],"a":"C","sa":null,"pg":"38","f":[],"n":52,"e":["Tinea versicolor shows yellow fluorescence. Why the other options are wrong: A) Vitiligo: Vitiligo appears bright white. B) Erythrasma: Erythrasma gives coral red. D) Tinea circinata: Tinea circinata is diagnosed by KOH microscopy/culture; it does not give yellow fluorescence. E) None of the above: Wrong: tinea versicolor (option C) gives yellow fluorescence.","Yellow = versicolor."],"im":[]},{"id":"Q240","ch":"Fungal Infections","q":"Spaghetti and meatballs appearance represents the mycelia and spores of","o":[["A","Candida albicans infection."],["B","Dermatophyte infection."],["C","Pityriasis versicolor infection."],["D","Staphylococcus aureus infection."],["E","Corynebacterium minutissimum infection."]],"a":"C","sa":null,"pg":"38","f":[],"n":53,"e":["KOH shows short hyphae with round spores ('spaghetti and meatballs') in pityriasis versicolor. Why the other options are wrong: A) Candida albicans infection: Candida shows budding yeast and pseudohyphae. B) Dermatophyte infection: Dermatophytes show long branching hyphae and arthrospores. D) Staphylococcus aureus infection: Staph aureus is a bacterium, not seen with KOH. E) Corynebacterium minutissimum infection: Erythrasma bacterium is seen on stain.","Spaghetti and meatballs."],"im":[]},{"id":"Q241","ch":"Fungal Infections","q":"A patient with multiple hypopigmented macules on the upper trunk that show yellow fluorescence under Wood's lamp, and KOH shows spaghetti and meatballs. The best treatment option is:","o":[["A","Topical steroid."],["B","Oral macrolide."],["C","Oral griseofulvin."],["D","Topical azole."],["E","Topical sulphur 5%."]],"a":"D","sa":null,"pg":"38","f":[],"n":54,"e":["Wood's yellow fluorescence and spaghetti-and-meatballs on KOH are pityriasis versicolor, best treated with topical azole. Why the other options are wrong: A) Topical steroid: Topical steroid does not kill yeast. B) Oral macrolide: Macrolides are antibacterial. C) Oral griseofulvin: Griseofulvin is ineffective in yeast. E) Topical sulphur 5%: Sulphur is not listed in the book; azoles and selenium sulphide are.","Topical azole."],"im":[]},{"id":"Q242","ch":"Fungal Infections","q":"Tinea versicolor may be treated by one of the following","o":[["A","Ketoconazole."],["B","Griseofulvin."],["C","Fusidic acid."],["D","Tetracycline."],["E","Permethrin."]],"a":"A","sa":null,"pg":"38","f":[],"n":55,"e":["Ketoconazole, an azole, treats pityriasis versicolor. Why the other options are wrong: B) Griseofulvin: Griseofulvin is ineffective in yeast. C) Fusidic acid: Fusidic acid is antibacterial. D) Tetracycline: Tetracycline is antibacterial. E) Permethrin: Permethrin is antiparasitic.","Azoles work."],"im":[]},{"id":"Q243","ch":"Fungal Infections","q":"Tinea versicolor can be treated by all of the following EXCEPT","o":[["A","Itraconazole."],["B","Ketoconazole."],["C","Griseofulvin."],["D","Fluconazole."],["E","Selenium sulphide."]],"a":"C","sa":null,"pg":"38","f":[],"n":56,"e":["Griseofulvin does not work against yeasts, so it is the exception. Why the other options are wrong: A) Itraconazole: Itraconazole 100 mg twice daily for one week is used. B) Ketoconazole: Ketoconazole shampoo is used. D) Fluconazole: Fluconazole 150 mg capsules is used. E) Selenium sulphide: Selenium sulphide shampoo is used.","Griseofulvin fails."],"im":[]},{"id":"Q244","ch":"Fungal Infections","q":"The following medications can be used for the treatment of pityriasis versicolor EXCEPT","o":[["A","Selenium sulphide 2.5%."],["B","Tincture iodine."],["C","Ketoconazole."],["D","Griseofulvin."],["E","Itraconazole."]],"a":"D","sa":null,"pg":"41","f":[],"n":57,"e":["Griseofulvin is ineffective in yeast, so it is the exception. Why the other options are wrong: A) Selenium sulphide 2.5%: Selenium sulphide shampoo is a listed topical. B) Tincture iodine: Tincture iodine is not listed for PV in the book, but griseofulvin is the definite exception. C) Ketoconazole: Ketoconazole is a listed treatment. E) Itraconazole: Itraconazole is a listed systemic treatment.","Griseofulvin doesn't treat yeasts."],"im":[]},{"id":"Q245","ch":"Fungal Infections","q":"Candida albicans is the causative organism of","o":[["A","Oral lichen planus."],["B","Tinea cruris."],["C","Oral thrush."],["D","Pityriasis versicolor."],["E","Erythrasma."]],"a":"C","sa":null,"pg":"40","f":[],"n":58,"e":["Candida albicans causes oral thrush. Why the other options are wrong: A) Oral lichen planus: Oral lichen planus is immune-mediated. B) Tinea cruris: Tinea cruris is a dermatophyte infection. D) Pityriasis versicolor: Pityriasis versicolor is caused by Malassezia. E) Erythrasma: Erythrasma is bacterial.","Thrush = Candida."],"im":[]},{"id":"Q246","ch":"Fungal Infections","q":"Interdigital moniliasis of the hand is common between which fingers?","o":[],"a":null,"sa":"Between the middle and ring fingers (3rd and 4th fingers), as this space is anatomically narrow.","pg":"39","f":[],"n":59,"e":["Interdigital candidiasis is common between the middle and ring fingers because this space is narrow and retains moisture.","3rd–4th web."],"im":[]},{"id":"Q247","ch":"Fungal Infections","q":"Cutaneous manifestations of candida include","o":[["A","Ecthyma."],["B","Hypopigmentation."],["C","Favus."],["D","Herald patch."],["E","Perleche."]],"a":"E","sa":null,"pg":"39","f":[],"n":60,"e":["Perleche (angular cheilitis) is a cutaneous candida manifestation. Why the other options are wrong: A) Ecthyma: Ecthyma is bacterial. B) Hypopigmentation: Hypopigmentation is a feature of pityriasis versicolor. C) Favus: Favus is dermatophyte. D) Herald patch: Herald patch is pityriasis rosea.","Perleche."],"im":[]},{"id":"Q248","ch":"Fungal Infections","q":"Cutaneous manifestations of candida include all of the following EXCEPT","o":[["A","Intertrigo."],["B","Erosio interdigitalis blastomycetica."],["C","Favus."],["D","Paronychia."],["E","Perleche."]],"a":"C","sa":null,"pg":"39","f":[],"n":61,"e":["Favus is a dermatophyte infection, not candida. Why the other options are wrong: A) Intertrigo: Candidal intertrigo: erythema with satellite pustules in the groin, axillae and inframammary folds. B) Erosio interdigitalis blastomycetica: Interdigital candidiasis: macerated sodden skin between finger webs, typically the ring-middle space. D) Paronychia: Candidal paronychia: chronic swollen red nail fold in wet-work occupations (housewives, cooks), with no throbbing or pointing. E) Perleche: Perleche (angular cheilitis): maceration at the angles of the mouth.","Favus = dermatophyte."],"im":[]},{"id":"Q249","ch":"Fungal Infections","q":"Cutaneous manifestations of candida include all of the following EXCEPT","o":[["A","Intertrigo."],["B","Erosio interdigitalis blastomycetica."],["C","Kerion."],["D","Paronychia."],["E","Perleche."]],"a":"C","sa":null,"pg":"39","f":[],"n":62,"e":["Kerion is a dermatophyte infection, not candida. Why the other options are wrong: A) Intertrigo: Candidal intertrigo: erythema with satellite pustules in the groin, axillae and inframammary folds. B) Erosio interdigitalis blastomycetica: Interdigital candidiasis: macerated sodden skin between finger webs, typically the ring-middle space. D) Paronychia: Candidal paronychia: chronic swollen red nail fold in wet-work occupations (housewives, cooks), with no throbbing or pointing. E) Perleche: Perleche (angular cheilitis): maceration at the angles of the mouth.","Kerion = dermatophyte."],"im":[]},{"id":"Q250","ch":"Fungal Infections","q":"All of the following are clinical presentations of candida infection EXCEPT","o":[["A","Erosio interdigitalis blastomycetica."],["B","Balanitis."],["C","Favus."],["D","Chronic paronychia."],["E","Perleche."]],"a":"C","sa":null,"pg":"39","f":[],"n":63,"e":["Favus is a dermatophyte infection, not candida. Why the other options are wrong: A) Erosio interdigitalis blastomycetica: Interdigital candidiasis: macerated sodden skin between finger webs, typically the ring-middle space. B) Balanitis: Candidal balanitis: glans of uncircumcised males and diabetics. D) Chronic paronychia: Candidal paronychia: chronic swollen red nail fold in wet-work occupations (housewives, cooks), with no throbbing or pointing. E) Perleche: Perleche (angular cheilitis): maceration at the angles of the mouth.","Favus excluded."],"im":[]},{"id":"Q251","ch":"Fungal Infections","q":"Candida may cause all of the following EXCEPT:","o":[["A","Perleche."],["B","Erythrasma."],["C","Chronic paronychia."],["D","Intertrigo."],["E","Erosio interdigitalis blastomycetica."]],"a":"B","sa":null,"pg":"39","f":[],"n":64,"e":["Erythrasma is caused by Corynebacterium minutissimum. Why the other options are wrong: A) Perleche: Perleche (angular cheilitis): maceration at the angles of the mouth. C) Chronic paronychia: Candidal paronychia: chronic swollen red nail fold in wet-work occupations (housewives, cooks), with no throbbing or pointing. D) Intertrigo: Candidal intertrigo: erythema with satellite pustules in the groin, axillae and inframammary folds. E) Erosio interdigitalis blastomycetica: Interdigital candidiasis: macerated sodden skin between finger webs, typically the ring-middle space.","Erythrasma bacterial."],"im":[]},{"id":"Q252","ch":"Fungal Infections","q":"Candidiasis may present as all of the following EXCEPT:","o":[["A","Intertrigo."],["B","Oral thrush."],["C","Perleche."],["D","Candidal arthritis."],["E","Erosio interdigitalis blastomycetica."]],"a":"D","sa":null,"pg":"39","f":[],"n":65,"e":["Candida causes cutaneous and mucosal infections, not arthritis in this list. Why the other options are wrong: A) Intertrigo: Candidal intertrigo: erythema with satellite pustules in the groin, axillae and inframammary folds. B) Oral thrush: Oral thrush: whitish pseudomembrane in infants, debilitated adults and HIV. C) Perleche: Perleche (angular cheilitis): maceration at the angles of the mouth. E) Erosio interdigitalis blastomycetica: Interdigital candidiasis: macerated sodden skin between finger webs, typically the ring-middle space.","Not cutaneous."],"im":[]},{"id":"Q253","ch":"Fungal Infections","q":"Treatment of choice for candidal paronychia is:","o":[["A","Imiquimod."],["B","Clofazimine."],["C","Griseofulvin."],["D","Macrolide."],["E","Fluconazole."]],"a":"E","sa":null,"pg":"41","f":[],"n":66,"e":["Fluconazole is systemic azole for candida. Why the other options are wrong: A) Imiquimod: Imiquimod is for warts. B) Clofazimine: Clofazimine is for leprosy. C) Griseofulvin: Griseofulvin is not effective in yeast. D) Macrolide: Macrolides are antibacterial.","Fluconazole."],"im":[]},{"id":"Q254","ch":"Fungal Infections","q":"A 4-year-old child presented with a circumscribed area of hair loss. Short stumps of hairs and scales were seen. The diagnosis is","o":[["A","Alopecia areata."],["B","Tinea capitis."],["C","Discoid lupus erythematosus."],["D","Lichen planus."],["E","Psoriasis."]],"a":"B","sa":null,"pg":"33","f":[],"n":67,"e":["A child with a circumscribed bald patch, broken stumps of hair and fine grayish-white scales has scaly (gray patch) tinea capitis; the hairs break off above the skin. Why the other options are wrong: A) Alopecia areata: Alopecia areata is smooth and not scaly, with normal-looking scalp skin. C) Discoid lupus erythematosus: DLE gives scarring, atrophic, scaly plaques and is rare in young children. D) Lichen planus: Lichen planus (planopilaris) is an adult disease that scars the scalp. E) Psoriasis: Psoriasis gives thick silvery plaques without breaking of hairs into stumps.","Child + stumps + scales."],"im":[]},{"id":"H120","ch":"Fungal Infections","q":"Kerion:","o":[["A","Is a boggy swelling simulating an abscess."],["B","May lead to scarring alopecia."],["C","Is usually caused by fungi of animal origin."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":68,"e":["Kerion is a boggy swelling that mimics an abscess, may scar, and is usually caused by animal-origin dermatophytes. Why the other options are wrong: A) Is a boggy swelling simulating an abscess: Matches the book (boggy swelling with follicular pustules mimicking an abscess), but B and C are also true. B) May lead to scarring alopecia: Scarring alopecia follows if untreated early, but A and C are also true. C) Is usually caused by fungi of animal ori…: Kerion usually comes from zoophilic (animal-origin) dermatophytes, but A and B are also true. E) None of the above: Wrong: A, B and C are all true.","Kerion scars."],"im":[]},{"id":"H123","ch":"Fungal Infections","q":"Griseofulvin may be used in the treatment of:","o":[["A","Oral thrush."],["B","Tinea versicolor."],["C","Tinea corporis."],["D","Interdigital monilia."],["E","None of the above."]],"a":"C","sa":null,"pg":null,"f":[],"n":69,"e":["Griseofulvin is used in dermatophyte infections such as tinea corporis, but is not effective in yeast infections. Why the other options are wrong: A) Oral thrush: Oral thrush is Candida (yeast). B) Tinea versicolor: Tinea versicolor is Malassezia (yeast). D) Interdigital monilia: Interdigital moniliasis is candidal (yeast), and griseofulvin is not effective in yeast. E) None of the above: Wrong: option C (tinea corporis) is correct.","Dermatophytes only."],"im":[]},{"id":"H128","ch":"Fungal Infections","q":"A child presents with area of thick yellow cup-shaped crusts surrounding hair shafts on the scalp, associated with scarring alopecia. The most likely diagnosis is:","o":[["A","Tinea corporis."],["B","Favus."],["C","Discoid lupus erythematosus."],["D","Impetigo."],["E","Seborrheic dermatitis."]],"a":"B","sa":null,"pg":null,"f":[],"n":70,"e":["Thick yellow cup-shaped crusts around hair shafts with scarring alopecia are scutula of favus. Why the other options are wrong: A) Tinea corporis: Tinea corporis affects hairless skin, not the scalp. C) Discoid lupus erythematosus: DLE scars but has no cup-shaped crusts around hairs. D) Impetigo: Impetigo has honey-colored crusts and does not cause scarring alopecia. E) Seborrheic dermatitis: Seborrheic dermatitis gives greasy scales and no scarring.","Scutula + scar."],"im":[]},{"id":"H133","ch":"Fungal Infections","q":"Wood’s light is used in the diagnosis of:","o":[["A","Tinea versicolor."],["B","Erythrasma."],["C","Favus."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":71,"e":["Wood's light shows yellow fluorescence in tinea versicolor, coral red in erythrasma and yellowish-green in favus (and black-dot type), so all are diagnosed with it. Why the other options are wrong: A) Tinea versicolor: True but incomplete: versicolor fluoresces yellow. B) Erythrasma: True but incomplete: erythrasma fluoresces coral red. C) Favus: True but incomplete: favus fluoresces yellowish-green. E) None of the above: Wrong because all listed conditions are examined with Wood's light.","All three."],"im":[]},{"id":"H136","ch":"Fungal Infections","q":"Onychomycosis is:","o":[["A","Ringworm of the scalp."],["B","Ringworm of the beard."],["C","Ringworm of the groin."],["D","Ringworm of the nails."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":72,"e":["Onychomycosis is ringworm of the nails. Why the other options are wrong: A) Ringworm of the scalp: Scalp is tinea capitis. B) Ringworm of the beard: Beard is tinea barbae. C) Ringworm of the groin: Groin is tinea cruris. E) None of the above: Wrong: option D is correct.","Nails."],"im":[]},{"id":"H140","ch":"Fungal Infections","q":"An adult patient presents with multiple, asymptomatic, hypopigmented macules on the upper back and chest with fine branny scaling. Lesions show yellow fluorescence under Wood's lamp. The most likely diagnosis is:","o":[["A","Erythrasma."],["B","Post-inflammatory hypopigmentation."],["C","Pityriasis rosea."],["D","Leprosy."],["E","Pityriasis versicolor."]],"a":"E","sa":null,"pg":null,"f":[],"n":73,"e":["Asymptomatic hypopigmented macules with branny scales and yellow Wood's fluorescence are pityriasis versicolor. Why the other options are wrong: A) Erythrasma: Erythrasma gives coral-red fluorescence and is in flexures. B) Post-inflammatory hypopigmentation: Post-inflammatory hypopigmentation follows a prior inflammatory lesion. C) Pityriasis rosea: Pityriasis rosea is pink oval patches with a herald patch. D) Leprosy: Leprosy gives anesthetic patches.","Yellow glow."],"im":[]},{"id":"H145","ch":"Fungal Infections","q":"A 45-year-old farmer presents with scaly erythematous patches on the groin with an active, raised border and central clearing. What is the most likely diagnosis?","o":[["A","Tinea cruris."],["B","Candidal intertrigo."],["C","Pityriasis rosea."],["D","Seborrheic dermatitis."],["E","Erythrasma."]],"a":"A","sa":null,"pg":null,"f":[],"n":74,"e":["Scaly erythematous patches in the groin with an active raised border and central clearing are tinea cruris. Why the other options are wrong: B) Candidal intertrigo: Candidal intertrigo has satellite lesions and pustules without central clearing. C) Pityriasis rosea: Pityriasis rosea is on the trunk with a herald patch. D) Seborrheic dermatitis: Seborrheic dermatitis has greasy scales without central clearing. E) Erythrasma: Erythrasma is well-defined brown patches with no active border.","Active border."],"im":[]},{"id":"H146","ch":"Fungal Infections","q":"A patient presents with patchy hair loss associated with a boggy, tender scalp swelling and follicular pustules. The condition did not improve after a course of antibiotics. What is the most likely diagnosis?","o":[["A","Favus."],["B","Kerion."]],"a":"B","sa":null,"pg":null,"f":[],"n":75,"e":["Boggy tender swelling with pustules not responding to antibiotics is kerion. Why the other options are wrong: A) Favus: Favus gives yellow cup-shaped crusts (scutula) around hairs, not a boggy swelling with pustules.","Not bacterial."],"im":[]},{"id":"H155","ch":"Fungal Infections","q":"A male patient, 33 years old, complains of an annular lesion with an active border and pale center in his beard area, of acute onset and progressive course for two weeks. He took antibiotics with no improvement. The diagnosis is:","o":[["A","Tinea versicolor."],["B","Tinea barbae."],["C","Discoid lupus erythematosus."],["D","Molluscum contagiosum."]],"a":"B","sa":null,"pg":null,"f":[],"n":76,"e":["Annular lesion with active border in beard that did not improve with antibiotics is tinea barbae. Why the other options are wrong: A) Tinea versicolor: Versicolor is on the trunk. C) Discoid lupus erythematosus: DLE is scarring plaque. D) Molluscum contagiosum: Molluscum is papules.","Tinea barbae."],"im":[]},{"id":"H156","ch":"Fungal Infections","q":"A child presents with an area of boggy swelling studded with follicular pustules on the scalp, associated with scarring alopecia. The most likely diagnosis is:","o":[["A","Ecthyma."],["B","Favus."],["C","Discoid lupus erythematosus."],["D","Kerion."],["E","Seborrheic dermatitis."]],"a":"D","sa":null,"pg":null,"f":[],"n":77,"e":["Boggy swelling with pustules and scarring is kerion. Why the other options are wrong: A) Ecthyma: Ecthyma is ulcerative. B) Favus: Favus has scutula. C) Discoid lupus erythematosus: DLE has atrophic plaques. E) Seborrheic dermatitis: Seborrheic dermatitis has no boggy swelling.","Kerion → cicatricial alopecia."],"im":[]},{"id":"H157","ch":"Fungal Infections","q":"Which statement regarding the scaly type of tinea capitis is correct?","o":[["A","It affects adults only."],["B","Its presence should suggest immunological deficiency."],["C","It results in cicatricial alopecia."],["D","It causes patches that fluoresce yellow-green under Wood's lamp."],["E","It is effectively treated with topical nystatin ointment."]],"a":"D","sa":null,"pg":null,"f":["Answer key corrected per your instruction."],"n":78,"e":["The scaly type fluoresces yellow-green under Wood's lamp (note: the book itself lists black-dot type and favus for this finding); the other statements are false. Note: I am not sure about this answer; it is either B or D. Why the other options are wrong: A) It affects adults only: It affects children only. B) Its presence should suggest immunologica…: The book does not link the scaly type with immune deficiency, but see the note: the answer is uncertain between B and D. C) It results in cicatricial alopecia: It does not scar. E) It is effectively treated with topical n…: Nystatin is ineffective against dermatophytes.","Microsporum = yellow-green."],"im":[]},{"id":"Q255","ch":"Parasitic Infestations","q":"Itching is the cardinal symptom in","o":[["A","Vitiligo"],["B","Alopecia"],["C","Scabies"],["D","Leprosy"],["E","Impetigo"]],"a":"C","sa":null,"pg":null,"f":[],"n":1,"e":["Scabies produces intense generalized itching that is worse at night and when warm, which is the cardinal symptom and the first clue. Why the other options are wrong: A) Vitiligo: Vitiligo is asymptomatic. B) Alopecia: Alopecia is asymptomatic. D) Leprosy: Leprosy is anesthetic. E) Impetigo: Impetigo is crusted.","Night itch."],"im":[]},{"id":"Q256","ch":"Parasitic Infestations","q":"The following disease is itchy","o":[["A","Alopecia areata"],["B","Ecthyma"],["C","Tinea capitis"],["D","Tuberculoid leprosy"],["E","Scabies"]],"a":"E","sa":null,"pg":"42","f":[],"n":2,"e":["Scabies is itchy (nocturnal pruritus) and contagious, whereas psoriasis, vitiligo and tinea are not described as itchy diseases. Why the other options are wrong: A) Alopecia areata: AA is asymptomatic. B) Ecthyma: Ecthyma is ulcerative. C) Tinea capitis: Capitis is asymptomatic. D) Tuberculoid leprosy: TT is anesthetic.","Scabies itches."],"im":[]},{"id":"Q257","ch":"Parasitic Infestations","q":"The following disease is contagious","o":[["A","Pityriasis rosea"],["B","Urticaria"],["C","Scabies"],["D","Vitiligo"],["E","Acne"]],"a":"C","sa":null,"pg":"42","f":[],"n":3,"e":["Scabies is contagious by close physical contact (and rarely via clothes or bedding), so contacts must be treated. Why the other options are wrong: A) Pityriasis rosea: PR is not contagious. B) Urticaria: Urticaria is allergic (histamine wheals) and not transmitted. D) Vitiligo: Vitiligo is autoimmune and not contagious. E) Acne: Acne is a pilosebaceous disease, not an infection you can catch.","Contact spread."],"im":[]},{"id":"Q258","ch":"Parasitic Infestations","q":"Scabies: what is the causative parasite, and what is the primary lesion?","o":[],"a":null,"sa":"Sarcoptes scabiei (fertilized female mite); the primary lesion is the burrow.","pg":null,"f":[],"n":4,"e":["Scabies is caused by the fertilized female Sarcoptes scabiei mite whose primary lesion is the burrow.","Burrow."],"im":[]},{"id":"Q260","ch":"Parasitic Infestations","q":"The following diseases are scaly EXCEPT","o":[["A","Tinea versicolor"],["B","Erythrasma"],["C","Psoriasis"],["D","Pityriasis rosea"],["E","Scabies"]],"a":"E","sa":null,"pg":"42","f":[],"n":5,"e":["Scabies lesions are burrows, papules and excoriations, not scales, whereas psoriasis, tinea, seborrheic dermatitis and pityriasis rosea are scaly. Why the other options are wrong: A) Tinea versicolor: Scaly. B) Erythrasma: Scaly. C) Psoriasis: Scaly. D) Pityriasis rosea: Scaly.","Not scaly."],"im":[]},{"id":"Q261","ch":"Parasitic Infestations","q":"Scabies in adults usually involves the following body sites EXCEPT","o":[["A","Wrist"],["B","Genitalia"],["C","Buttocks"],["D","Upper back"],["E","Flexures"]],"a":"D","sa":null,"pg":"43","f":[],"n":6,"e":["Adult scabies spares the upper back; it involves finger webs, wrists, flexures, genitalia and buttocks. Why the other options are wrong: A) Wrist: Involved. B) Genitalia: Involved. C) Buttocks: Involved. E) Flexures: Involved.","Upper back spared."],"im":[]},{"id":"Q262","ch":"Parasitic Infestations","q":"Sites of predilection of scabietic burrows in adults include all of the following EXCEPT","o":[["A","In-between fingers & wrist area"],["B","Medial sides of forearms"],["C","Anterior axillary folds & lower abdomen"],["D","Breast in females & genitalia in males"],["E","Upper back"]],"a":"E","sa":null,"pg":"43","f":[],"n":7,"e":["Scabies involves finger sides and webs, wrists, elbows, axillae, waist, buttocks, genitalia and feet, but spares the head, neck, upper back, palms and soles in adults. Why the other options are wrong: A) In-between fingers & wrist area: Predilection. B) Medial sides of forearms: Predilection. C) Anterior axillary folds & lower abdomen: Predilection. D) Breast in females & genitalia in males: Predilection.","Upper back spared."],"im":[]},{"id":"Q263","ch":"Parasitic Infestations","q":"One of the following is a cause of pruritus in the pubic area","o":[["A","Scabies"],["B","Pediculosis capitis"],["C","Molluscum contagiosum"],["D","Tinea versicolor"],["E","Alopecia areata"]],"a":"A","sa":null,"pg":null,"f":[],"n":8,"e":["Pubic itching occurs in scabies (genital involvement) and in pediculosis pubis; head lice, molluscum, versicolor and alopecia areata do not. Why the other options are wrong: B) Pediculosis capitis: Capitis is scalp. C) Molluscum contagiosum: Molluscum is papules. D) Tinea versicolor: Versicolor is asymptomatic. E) Alopecia areata: AA is asymptomatic.","Genitalia."],"im":[]},{"id":"Q264","ch":"Parasitic Infestations","q":"A patient presents with generalized itching at night and burrows in the fingers. The most likely diagnosis is:","o":[["A","Pediculosis"],["B","Scabies"],["C","Urticaria"],["D","Eczema"],["E","Candidiasis"]],"a":"B","sa":null,"pg":"42","f":[],"n":9,"e":["Generalized night itching with burrows on the fingers is scabies; urticaria has wheals and eczema has no burrows. Why the other options are wrong: A) Pediculosis: Pediculosis has nits. C) Urticaria: Urticaria has wheals. D) Eczema: Eczema has no burrows. E) Candidiasis: Candida is red.","Burrows."],"im":[]},{"id":"Q265","ch":"Parasitic Infestations","q":"The following may help in the diagnosis of scabies","o":[["A","Positive family history"],["B","Night itching"],["C","Distribution of lesions"],["D","All of the above"],["E","None of the above"]],"a":"D","sa":null,"pg":"44","f":[],"n":10,"e":["Scabies is diagnosed on nocturnal pruritus, family history, lesion morphology and distribution, supported by dermoscopy; so all of the above. Why the other options are wrong: A) Positive family history: A family member with itching suggests contagion; true, but B and C are also clues. B) Night itching: Nocturnal itching is a classic clue; true, but A and C are also clues. C) Distribution of lesions: Distribution (finger webs, wrists, genitalia) is a classic clue; true, but A and B are also clues. E) None of the above: Wrong: A, B and C all help.","All clues."],"im":[]},{"id":"Q266","ch":"Parasitic Infestations","q":"A 4-month-old infant presented with vesicles and pustules affecting his face, palms and soles, associated with a family history of severe itching at night. (Clinical photo: papulovesicular/pustular rash on the face and vesicopustules on the sole.) The most likely diagnosis is","o":[["A","Disseminated candidiasis"],["B","Pediculosis corporis"],["C","Tinea corporis"],["D","Scabies"],["E","Tuberculoid leprosy"]],"a":"D","sa":null,"pg":"44","f":[],"n":11,"e":["The picture of burrows and papules in typical sites with itching and family history is scabies. Why the other options are wrong: A) Disseminated candidiasis: Candidiasis is rare. B) Pediculosis corporis: Corporis is on the body. C) Tinea corporis: Tinea is scaly. E) Tuberculoid leprosy: Leprosy is anesthetic.","Typical scabies."],"im":[]},{"id":"Q267","ch":"Parasitic Infestations","q":"A 4-month-old infant presented with vesicles and pustules affecting his face, palms and soles, associated with a family history of severe itching at night. (Clinical photo: papulovesicular/pustular rash on the face and vesicopustules on the sole.) This condition is treated by","o":[["A","Radiotherapy"],["B","Topical permethrin"],["C","Topical corticosteroids"],["D","Systemic antifungals"],["E","Systemic isotretinoin"]],"a":"B","sa":null,"pg":"46","f":[],"n":12,"e":["Scabies is treated with topical permethrin 5% (safe for infants over 2 months and pregnancy), applied to the whole skin, repeated after a week, and treating contacts. Why the other options are wrong: A) Radiotherapy: Radiotherapy has no role here; vitiligo is treated by stopping the autoimmune process and stimulating repigmentation (phototherapy, steroids, calcineurin inhibitors). C) Topical corticosteroids: Steroids worsen. D) Systemic antifungals: Antifungals do not treat it. E) Systemic isotretinoin: Isotretinoin is for acne.","Permethrin 5%."],"im":[]},{"id":"Q268","ch":"Parasitic Infestations","q":"A 6-month-old infant had itchy erythematous papules and exudative lesions on the scalp, face and back for one month with vesicular lesions on the palms. The most likely diagnosis is","o":[["A","Atopic dermatitis"],["B","Scabies"],["C","Seborrheic dermatitis"],["D","Psoriasis"],["E","Discoid lupus erythematosus"]],"a":"B","sa":null,"pg":"44","f":[],"n":13,"e":["An infant with itchy papules, exudation and palm vesicles has scabies, which affects palms and soles in infants. Why the other options are wrong: A) Atopic dermatitis: Atopic spares palms. C) Seborrheic dermatitis: Seb derm is greasy. D) Psoriasis: Psoriasis is silvery. E) Discoid lupus erythematosus: DLE is atrophic.","Infants: palms, soles."],"im":[]},{"id":"Q269","ch":"Parasitic Infestations","q":"A male baby, 9 months old, was brought by his mother with papules, pustules, scratch marks and impetigo involving his face, trunk, genitalia, palms and soles. His mother reported insomnia and crying most of the day, and gave a history of night itching. What is the diagnosis?","o":[["A","Seborrheic dermatitis"],["B","Scabies"],["C","Tinea corporis"],["D","Lichen planus"],["E","Psoriasis"]],"a":"B","sa":null,"pg":"44","f":[],"n":14,"e":["An infant with papules, pustules, scratch marks and impetiginization has scabies. Why the other options are wrong: A) Seborrheic dermatitis: Seb derm is greasy. C) Tinea corporis: Tinea is scaly. D) Lichen planus: LP is violaceous. E) Psoriasis: Psoriasis is silvery.","Infant scabies."],"im":[]},{"id":"Q270","ch":"Parasitic Infestations","q":"A 2-year-old infant had linear pruritic lesions involving the head, neck, palms and soles of one week duration. His mother had a similar condition 4 weeks ago involving her wrists, abdomen and breast. The most likely diagnosis is","o":[["A","Atopic dermatitis"],["B","Scabies"],["C","Tinea corporis"],["D","Lichen planus"],["E","Psoriasis"]],"a":"B","sa":null,"pg":"44","f":[],"n":15,"e":["Linear pruritic lesions of head, neck, palms and soles in an infant indicate scabies. Why the other options are wrong: A) Atopic dermatitis: Atopic is flexural. C) Tinea corporis: Tinea is scaly. D) Lichen planus: LP is violaceous. E) Psoriasis: Psoriasis is silvery.","Palms/soles."],"im":[]},{"id":"Q271","ch":"Parasitic Infestations","q":"A male with intensely pruritic nodules on the scrotum for 2 months, with a past history of scabies treated with anti-scabietic treatment, is suffering from","o":[["A","Nodular scabies"],["B","Animal scabies"],["C","Phthirus pubis"],["D","Pediculosis corporis"],["E","Lepromatous leprosy"]],"a":"A","sa":null,"pg":"44","f":[],"n":16,"e":["Itchy scrotal nodules after treated scabies are post-scabietic nodular scabies. Why the other options are wrong: B) Animal scabies: Animal scabies has no burrows. C) Phthirus pubis: Phthirus is lice. D) Pediculosis corporis: Corporis is lice. E) Lepromatous leprosy: LL is nodules.","Scrotum."],"im":[]},{"id":"Q272","ch":"Parasitic Infestations","q":"A 28-year-old male presented with intensely pruritic nodules on the scrotum for 2 months and a past history of scabies. A suitable treatment for such lesions is","o":[["A","Phototherapy"],["B","Radiotherapy"],["C","Electrocautery"],["D","Podophyllin resin"],["E","Intralesional corticosteroids"]],"a":"E","sa":null,"pg":"44","f":[],"n":17,"e":["Post-scabietic nodules are a hypersensitivity reaction that persists for weeks to months after treatment; they are treated with intralesional corticosteroids rather than more scabicide. Why the other options are wrong: A) Phototherapy: Phototherapy is not used for post-scabietic nodules, a hypersensitivity reaction best trea
