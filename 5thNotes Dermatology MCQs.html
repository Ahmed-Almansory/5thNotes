e toxin), not mixed. C) Affects neonates: Bullous impetigo does affect neonates; this must be combined with A, hence A + C. E) B + c: It is not mixed.","Bullous = staph, neonates."],"im":[]},{"id":"H037","ch":"Bacterial Infections","q":"Erysipelas :","o":[["A","Streptococcal infection of dermis"],["B","Streptococcal infection of epidermis"],["C","Streptococcal infection of hair"],["D","Streptococcal infection of nail"]],"a":"A","sa":null,"pg":null,"f":[],"n":45,"e":["Erysipelas is a streptococcal infection of the upper dermis, involving superficial lymphatics, giving a sharply demarcated erythematous swollen plaque with systemic symptoms. Impetigo is epidermal and cellulitis is deeper. Why the other options are wrong: B) Streptococcal infection of epidermis: Epidermis is impetigo. C) Streptococcal infection of hair: Hair is folliculitis. D) Streptococcal infection of nail: Nail is paronychia.","Strep, upper dermis."],"im":[]},{"id":"H041","ch":"Bacterial Infections","q":"A male infant 6 months old, presented with the lesions shown in the original image on his leg of one week duration. His mother stated that his elder sister had the same lesions. The condition was associated by fever. What is the diagnosis of this case? [image-based in the original bank]","o":[["A","Bullous impetigo."],["B","Herpes simplex."],["C","Pustular psoriasis."],["D","Crusted scabies."],["E","Acute eczema."]],"a":"A","sa":null,"pg":null,"f":["Image-based in the original bank; image not in the PDF text."],"n":46,"e":["A blistering eruption in an infant that spreads to siblings with fever points to bullous impetigo. The original image is not in the PDF text. Why the other options are wrong: B) Herpes simplex: HSV gives grouped vesicles. C) Pustular psoriasis: Pustular psoriasis is sterile. D) Crusted scabies: Crusted scabies is itchy and crusted. E) Acute eczema: Eczema is itchy.","Contagious blisters in babies."],"im":[]},{"id":"H042","ch":"Bacterial Infections","q":"Regarding this disease [Bullous Impetigo], choose the correct statement:","o":[["A","Is a superficial bacterial infection."],["B","Diagnosed by patch test."],["C","Heals by scar formation."],["D","Is a deep parasitic infection."],["E","Treated by topical ivermectin 1%."]],"a":"A","sa":null,"pg":null,"f":[],"n":47,"e":["Bullous impetigo is a superficial bacterial infection that heals without scarring. Why the other options are wrong: B) Diagnosed by patch test: Not by patch test. C) Heals by scar formation: It heals without scar. D) Is a deep parasitic infection: It is bacterial. E) Treated by topical ivermectin 1%: Ivermectin is for parasites.","Superficial, no scar."],"im":[]},{"id":"Q099","ch":"Mycobacterial Infections","q":"Regarding leprosy, which of the following is TRUE?","o":[["A","It involves mainly skin and nerves."],["B","It has a short incubation period."],["C","Lepra bacilli are easily grown in vitro."],["D","Clinical presentation depends on humoral immunity."],["E","Monodrug therapy is the treatment of choice."]],"a":"A","sa":null,"pg":"19","f":[],"n":1,"e":["Leprosy (Hansen disease) is caused by Mycobacterium leprae and mainly affects skin and peripheral nerves. Why the other options are wrong: B) It has a short incubation period: Incubation is long. C) Lepra bacilli are easily grown in vitro: It is not cultured in vitro. D) Clinical presentation depends on humoral…: It depends on cell-mediated immunity. E) Monodrug therapy is the treatment of cho…: Multidrug therapy is used.","Skin + nerves."],"im":[]},{"id":"Q100","ch":"Mycobacterial Infections","q":"In leprosy","o":[["A","It is a stable disease."],["B","It is not infectious."],["C","Dapsone is the backbone of treatment of all types."],["D","It is an autoimmune disease."],["E","Nodules are characteristic of tuberculoid leprosy."]],"a":"C","sa":null,"pg":"20","f":[],"n":2,"e":["According to the book, dapsone is the backbone of treatment in all types, given in multidrug therapy (with rifampicin ± clofazimine). Why the other options are wrong: A) It is a stable disease: Leprosy is chronic and progressive, causing nerve damage and deformity if untreated. B) It is not infectious: Leprosy is infectious (Mycobacterium leprae), although of low infectivity. D) It is an autoimmune disease: It is infectious. E) Nodules are characteristic of tuberculoi…: Nodules and infiltrated plaques are lepromatous; tuberculoid leprosy has few anesthetic plaques.","MDT: dapsone + rifampicin ± clofazimine."],"im":[]},{"id":"Q101","ch":"Mycobacterial Infections","q":"Target cell for lepra bacilli is the","o":[["A","Keratinocyte."],["B","Melanocyte."],["C","Schwann cell."],["D","Fibroblast."],["E","Endothelial cell."]],"a":"C","sa":null,"pg":"17","f":[],"n":3,"e":["M. leprae has a special affinity for Schwann cells, causing neuropathy and anesthesia. Why the other options are wrong: A) Keratinocyte: Keratinocytes are not targeted. B) Melanocyte: Melanocytes are not targeted. D) Fibroblast: Fibroblasts are not targeted. E) Endothelial cell: Endothelium is not targeted.","Target cell = Schwann cell."],"im":[]},{"id":"Q102","ch":"Mycobacterial Infections","q":"Expression of the disease in leprosy depends on","o":[["A","Humoral immunity."],["B","Immune complexes."],["C","Complement fixation."],["D","Cell-mediated immunity."],["E","IgE-mediated immunity."]],"a":"D","sa":null,"pg":"17","f":[],"n":4,"e":["The clinical form depends on the patient's cell-mediated immunity, not humoral immunity. Why the other options are wrong: A) Humoral immunity: Humoral immunity is not decisive. B) Immune complexes: Immune complexes cause reactions. C) Complement fixation: Complement is not decisive. E) IgE-mediated immunity: IgE is not decisive.","Good CMI → tuberculoid; poor CMI → lepromatous."],"im":[]},{"id":"Q103","ch":"Mycobacterial Infections","q":"Regarding leprosy, the following statement is INCORRECT","o":[["A","High immunity leads to paucibacillary leprosy."],["B","Tuberculoid leprosy shows good immunity."],["C","Infection occurs through nasal mucosa."],["D","Sensory nerves affection leads to glove and stocking anesthesia."],["E","Lepromatous leprosy is paucibacillary."]],"a":"E","sa":null,"pg":"18","f":[],"n":5,"e":["Lepromatous leprosy is multibacillary (poor immunity, many bacilli); the statement that it is paucibacillary is wrong. Why the other options are wrong: A) High immunity leads to paucibacillary le…: Correct statement. B) Tuberculoid leprosy shows good immunity: Correct statement. C) Infection occurs through nasal mucosa: Correct statement. D) Sensory nerves affection leads to glove…: Correct statement.","Lepromatous = multibacillary."],"im":[]},{"id":"Q104","ch":"Mycobacterial Infections","q":"In leprosy, choose the correct answer","o":[["A","Paucibacillary leprosy occurs in a patient with a high immunity."],["B","Tuberculoid leprosy shows bad immunity."],["C","Lepromin test is diagnostic."],["D","Motor nerve affection leads to glove and stocking anesthesia."],["E","Lepromatous leprosy is paucibacillary."]],"a":"A","sa":null,"pg":"17","f":[],"n":6,"e":["Paucibacillary leprosy (tuberculoid) occurs in patients with high immunity, so few bacilli are found. Why the other options are wrong: B) Tuberculoid leprosy shows bad immunity: TT has good immunity. C) Lepromin test is diagnostic: Lepromin is not diagnostic. D) Motor nerve affection leads to glove and…: Sensory nerves cause glove and stocking. E) Lepromatous leprosy is paucibacillary: LL is multibacillary.","High immunity = few bacilli."],"im":[]},{"id":"Q105","ch":"Mycobacterial Infections","q":"In leprosy","o":[["A","Lepromatous, borderline lepromatous & borderline tuberculoid leprosy are paucibacillary forms of the disease."],["B","Nerve invasion is late in tuberculoid leprosy."],["C","Numerous patches are characteristic of tuberculoid leprosy."],["D","All of the above are true."],["E","None of the above is true."]],"a":"E","sa":null,"pg":"18","f":[],"n":7,"e":["The listed statements are all incorrect, so 'none of the above' is the key. Why the other options are wrong: A) Lepromatous, borderline lepromatous & bo…: LL and BL are multibacillary. B) Nerve invasion is late in tuberculoid le…: It is early in TT. C) Numerous patches are characteristic of t…: Patches are few in TT. D) All of the above are true: Wrong: not all listed statements are correct.","Check the spectrum: TT → LL."],"im":[]},{"id":"Q106","ch":"Mycobacterial Infections","q":"Best prognosis in leprotic cases is in","o":[["A","Borderline leprosy."],["B","Tuberculoid leprosy."],["C","Lepromatous leprosy."],["D","Borderline tuberculoid leprosy."],["E","Borderline lepromatous leprosy."]],"a":"B","sa":null,"pg":"17","f":[],"n":8,"e":["Tuberculoid leprosy has good immunity, limited disease and the best prognosis. Why the other options are wrong: A) Borderline leprosy: Borderline is unstable. C) Lepromatous leprosy: LL has the worst prognosis. D) Borderline tuberculoid leprosy: BT is worse than TT. E) Borderline lepromatous leprosy: BL is worse than TT.","TT = best prognosis."],"im":[]},{"id":"Q107","ch":"Mycobacterial Infections","q":"In leprosy","o":[["A","Lepromatous & borderline leprosy are paucibacillary forms."],["B","Nerve invasion is late in tuberculoid leprosy."],["C","Patches are characteristic of tuberculoid leprosy."],["D","It is a stable disease."],["E","It is an autoimmune disease."]],"a":"C","sa":null,"pg":null,"f":[],"n":9,"e":["Tuberculoid leprosy (good immunity) gives few well-defined hypopigmented hairless, anesthetic patches, because nerves are damaged early. Numerous patches are a feature of lepromatous leprosy. Why the other options are wrong: A) Lepromatous & borderline leprosy are pau…: LL and BL are multibacillary. B) Nerve invasion is late in tuberculoid le…: It is early in TT. D) It is a stable disease: Leprosy is chronic and progressive, causing nerve damage and deformity if untreated. E) It is an autoimmune disease: It is infectious.","TT: few patches; LL: numerous."],"im":[]},{"id":"Q108","ch":"Mycobacterial Infections","q":"Hypopigmented anaesthetic macules occur in","o":[["A","Tinea versicolor."],["B","Vitiligo."],["C","Lepromatous leprosy."],["D","Tuberculoid leprosy."],["E","Pityriasis alba."]],"a":"D","sa":null,"pg":"19","f":[],"n":10,"e":["Tuberculoid leprosy produces hypopigmented hairless anesthetic macules or plaques. Why the other options are wrong: A) Tinea versicolor: Versicolor is scaly, not anesthetic. B) Vitiligo: Vitiligo is not anesthetic. C) Lepromatous leprosy: LL macules are not typically anesthetic early. E) Pityriasis alba: Pityriasis alba is not anesthetic.","Anesthesia + hypopigmentation = TT."],"im":[]},{"id":"Q109","ch":"Mycobacterial Infections","q":"Leprosy may present with","o":[["A","Golden crusted lesions."],["B","Umbilicated vesicles."],["C","Numbness and hypopigmented lesion."],["D","Itchy circinate lesion with healing center."],["E","Painful grouped unilateral vesicles along a nerve."]],"a":"C","sa":null,"pg":"19","f":[],"n":11,"e":["Leprosy presents with hypopigmented lesions and numbness from nerve damage. Why the other options are wrong: A) Golden crusted lesions: Impetigo. B) Umbilicated vesicles: Molluscum. D) Itchy circinate lesion with healing center: Tinea. E) Painful grouped unilateral vesicles alon…: Zoster.","Numb patch = think leprosy."],"im":[]},{"id":"Q110","ch":"Mycobacterial Infections","q":"Feature of tuberculoid leprosy","o":[["A","Loss of outer third of eyebrow."],["B","Hairless hypopigmented patches."],["C","Nodules in the face and ear."],["D","Multiple bacilli."]],"a":"B","sa":null,"pg":"19","f":[],"n":12,"e":["Tuberculoid leprosy gives hairless hypopigmented patches with sensory loss. Why the other options are wrong: A) Loss of outer third of eyebrow: Eyebrow loss is LL. C) Nodules in the face and ear: Nodules are LL. D) Multiple bacilli: Many bacilli are LL.","Hairless + anesthetic."],"im":[]},{"id":"Q111","ch":"Mycobacterial Infections","q":"Which is TRUE regarding tuberculoid leprosy?","o":[["A","Diagnosed by lepromin test."],["B","Presents with multiple nodules."],["C","Nerve involvement occurs early."],["D","Involves mucous membranes."],["E","Is a sign of poor immunity."]],"a":"C","sa":null,"pg":"18","f":[],"n":13,"e":["Nerve involvement occurs early in tuberculoid leprosy and is asymmetric and severe. Why the other options are wrong: A) Diagnosed by lepromin test: Not diagnosed by lepromin. B) Presents with multiple nodules: Nodules are LL. D) Involves mucous membranes: Mucosa is LL. E) Is a sign of poor immunity: TT is good immunity.","TT: early nerve, few lesions."],"im":[]},{"id":"Q112","ch":"Mycobacterial Infections","q":"A male patient, 42 years old, presented with multiple hypopigmented hairless macules on the upper extremities as well as patches on his legs. On examination, these patches showed absent sensation, and the ulnar nerve was thickened, beaded and tender by palpation. (Clinical photo: hypopigmented patches on the knee and leg.) Diagnosis of this case is","o":[["A","Erythrasma."],["B","Tuberculoid leprosy."],["C","Lichen planus."],["D","Pityriasis versicolor."],["E","Psoriasis."]],"a":"B","sa":null,"pg":"19","f":[],"n":14,"e":["A few well-defined hypopigmented anesthetic patches indicate tuberculoid leprosy. Why the other options are wrong: A) Erythrasma: Erythrasma is brown scaly. C) Lichen planus: Lichen planus is violaceous. D) Pityriasis versicolor: Versicolor is scaly. E) Psoriasis: Psoriasis is scaly.","Few patches = TT."],"im":[]},{"id":"Q113","ch":"Mycobacterial Infections","q":"A male patient, 42 years old, presented with multiple hypopigmented hairless macules on the upper extremities as well as patches on his legs. On examination, these patches showed absent sensation, and the ulnar nerve was thickened, beaded and tender by palpation. (Clinical photo: hypopigmented patches on the knee and leg.) The following is a feature of this disease","o":[["A","Nerves are involved early."],["B","Mucous membranes are involved."],["C","Shows negative lepromin test."],["D","Viscera are involved."],["E","It is multibacillary."]],"a":"A","sa":null,"pg":"18","f":[],"n":15,"e":["In tuberculoid leprosy, strong cell-mediated immunity attacks the bacillus in nerves, so sensation is impaired early and nerve damage may be extensive. In lepromatous leprosy nerve involvement is late. Why the other options are wrong: B) Mucous membranes are involved: Mucosa is LL. C) Shows negative lepromin test: Lepromin is positive in TT. D) Viscera are involved: Viscera is LL. E) It is multibacillary: TT is paucibacillary.","TT early nerve; LL late nerve."],"im":[]},{"id":"Q114","ch":"Mycobacterial Infections","q":"A male patient, 52 years old, presented with glistening erythematous papules, nodules & plaques on his ears, nose and forehead. He had loss of the outer 1/3 of his eyebrows and gave history of recurrent attacks of epistaxis. What is your diagnosis?","o":[["A","Impetigo contagiosum."],["B","Tuberculoid leprosy."],["C","Lepromatous leprosy."],["D","Pityriasis versicolor."],["E","Psoriasis."]],"a":"C","sa":null,"pg":"19","f":[],"n":16,"e":["Symmetrical nodules and infiltration with leonine face indicate lepromatous leprosy. Why the other options are wrong: A) Impetigo contagiosum: Impetigo is crusted. B) Tuberculoid leprosy: TT is few patches. D) Pityriasis versicolor: Versicolor is scaly. E) Psoriasis: Psoriasis is scaly.","LL: symmetrical, widespread."],"im":[]},{"id":"Q115","ch":"Mycobacterial Infections","q":"A male patient, 52 years old, presented with glistening erythematous papules, nodules & plaques on his ears, nose and forehead. He had loss of the outer 1/3 of his eyebrows and gave history of recurrent attacks of epistaxis. What is the diagnosis?","o":[["A","Alopecia areata."],["B","Cicatricial alopecia."],["C","Favus."],["D","Leprosy."],["E","Kerion."]],"a":"D","sa":null,"pg":"19","f":[],"n":17,"e":["The skin picture with leprosy features calls for slit-skin smear stained with modified Ziehl-Neelsen, skin or nerve biopsy and PCR for confirmation. Why the other options are wrong: A) Alopecia areata: AA is non-scarring. B) Cicatricial alopecia: Cicatricial alopecia is scarring. C) Favus: Favus is scalp. E) Kerion: Kerion is scalp.","Smear + biopsy."],"im":[]},{"id":"Q116","ch":"Mycobacterial Infections","q":"A patient with widespread, symmetrical papules and nodules, infiltrated facial skin, and loss of outer third of eyebrows. Which is TRUE regarding this disease?","o":[["A","Is a parasitic infection."],["B","Bacilli are absent in skin lesions."],["C","Nerve involvement occurs early."],["D","Involves mucous membranes."],["E","Is characterized by good immunity."]],"a":"D","sa":null,"pg":"19","f":[],"n":18,"e":["Lepromatous leprosy has poor immunity and numerous bacilli, so mucous membranes (nasal mucosa → epistaxis, septal destruction), eyes, kidneys, liver, bones and testes can be involved. Tuberculoid leprosy involves skin and nerves only. Why the other options are wrong: A) Is a parasitic infection: It is bacterial. B) Bacilli are absent in skin lesions: Bacilli are numerous. C) Nerve involvement occurs early: Nerve is late. E) Is characterized by good immunity: Immunity is poor.","LL: mucosa + viscera."],"im":[]},{"id":"Q117","ch":"Mycobacterial Infections","q":"All of the following are features of lepromatous leprosy EXCEPT","o":[["A","Nerves are involved early."],["B","Runs a chronic course."],["C","Shows negative lepromin test."],["D","Viscera are involved."],["E","It is multibacillary."]],"a":"A","sa":null,"pg":"18","f":[],"n":19,"e":["In lepromatous leprosy nerve involvement is late, not early; the other features are true. Why the other options are wrong: B) Runs a chronic course: Lepromatous leprosy is chronic. C) Shows negative lepromin test: Lepromin is negative in lepromatous leprosy (poor cell-mediated immunity). D) Viscera are involved: Viscera are involved in lepromatous leprosy. E) It is multibacillary: It is multibacillary.","LL: late nerve; TT: early nerve."],"im":[]},{"id":"Q118","ch":"Mycobacterial Infections","q":"The following is a feature of lepromatous leprosy","o":[["A","Good immunity."],["B","Early anesthesia."],["C","Positive lepromin test."],["D","Epistaxis."],["E","Few bacilli in the lesion."]],"a":"D","sa":null,"pg":"19","f":[],"n":20,"e":["Nasal mucosal infiltration in lepromatous leprosy causes epistaxis and may destroy the nasal septum. This is not a feature of tuberculoid leprosy. Why the other options are wrong: A) Good immunity: Immunity is poor. B) Early anesthesia: Anesthesia is late. C) Positive lepromin test: Lepromin is negative. E) Few bacilli in the lesion: Bacilli are many.","Epistaxis = LL."],"im":[]},{"id":"Q119","ch":"Mycobacterial Infections","q":"Which of the following is a feature of lepromatous leprosy?","o":[["A","Few anesthetic hairless patches."],["B","Symmetrical widespread nodules and thickened nodular ears."],["C","Rapid healing without deformity."],["D","Only mucosal involvement."],["E","Nerve sensation is impaired early."]],"a":"B","sa":null,"pg":"19","f":[],"n":21,"e":["Lepromatous leprosy presents with symmetrical widespread nodules and thickened nodular ears. Why the other options are wrong: A) Few anesthetic hairless patches: That is TT. C) Rapid healing without deformity: Deformity is chronic. D) Only mucosal involvement: Skin is involved too. E) Nerve sensation is impaired early: Nerve is late.","Nodular ears = LL."],"im":[]},{"id":"Q120","ch":"Mycobacterial Infections","q":"The following features belong to lepromatous leprosy","o":[["A","Hypopigmented macules."],["B","Maculoanaesthetic patches."],["C","Strongly positive lepromin test."],["D","Leonine facies."],["E","Bacteriology shows a paucity of bacilli."]],"a":"D","sa":null,"pg":"19","f":[],"n":22,"e":["Leonine facies is due to diffuse infiltration and nodules of the face in lepromatous leprosy. Why the other options are wrong: A) Hypopigmented macules: That is TT. B) Maculoanaesthetic patches: That is TT. C) Strongly positive lepromin test: Lepromin is negative. E) Bacteriology shows a paucity of bacilli: Bacilli are many.","Lion face."],"im":[]},{"id":"Q121","ch":"Mycobacterial Infections","q":"Leonine facies may occur in","o":[["A","Tuberculoid leprosy."],["B","Indeterminate leprosy."],["C","Lepromatous leprosy."],["D","Borderline leprosy."],["E","None of the above."]],"a":"C","sa":null,"pg":"19","f":[],"n":23,"e":["Progressive facial infiltration deepens the natural lines and gives leonine (lion-like) facies, with loss of the outer third of eyebrows. It is a hallmark of lepromatous leprosy. Why the other options are wrong: A) Tuberculoid leprosy: TT is localized. B) Indeterminate leprosy: Indeterminate is early. D) Borderline leprosy: Borderline is variable. E) None of the above: LL has it.","Leonine facies = LL."],"im":[]},{"id":"Q122","ch":"Mycobacterial Infections","q":"In lepromatous leprosy","o":[["A","Lesions are few in number."],["B","Penicillin is the backbone of treatment."],["C","Anesthesia is late & extensive on cold areas."],["D","Organisms are rarely found in skin smears."],["E","Internal organs are not involved."]],"a":"C","sa":null,"pg":"18","f":[],"n":24,"e":["Anesthesia appears late and is extensive (glove and stocking, cold areas) in lepromatous leprosy. Why the other options are wrong: A) Lesions are few in number: Lesions are numerous. B) Penicillin is the backbone of treatment: Dapsone is the backbone. D) Organisms are rarely found in skin smears: Bacilli are many. E) Internal organs are not involved: Organs are involved.","LL: late anesthesia."],"im":[]},{"id":"Q123","ch":"Mycobacterial Infections","q":"In lepromatous leprosy, immunity is ___ and the face appears as ___.","o":[],"a":null,"sa":"Immunity is bad (least effective immune response); leonine (lion) facies.","pg":"19","f":[],"n":25,"e":["Lepromatous leprosy has poor immunity and the face appears leonine (lion-like).","Poor immunity, leonine facies."],"im":[]},{"id":"Q124","ch":"Mycobacterial Infections","q":"Leprosy is treated by","o":[["A","Dapsone."],["B","Retinoids."],["C","Methotrexate."],["D","Cyclosporine."],["E","Azathioprine."]],"a":"A","sa":null,"pg":"20","f":[],"n":26,"e":["Dapsone is part of the WHO multidrug therapy for leprosy (with rifampicin ± clofazimine) and is taken daily. Retinoids, methotrexate and tetracyclines are not anti-leprosy drugs. Why the other options are wrong: B) Retinoids: Retinoids are for acne. C) Methotrexate: Methotrexate is for psoriasis. D) Cyclosporine: Cyclosporine is immunosuppressive. E) Azathioprine: Azathioprine is immunosuppressive.","MDT: rifampicin + dapsone ± clofazimine."],"im":[]},{"id":"Q125","ch":"Mycobacterial Infections","q":"The backbone treatment of leprosy is","o":[["A","Azithromycin."],["B","Tetracycline."],["C","Colchicine."],["D","Steroids."],["E","Dapsone."]],"a":"E","sa":null,"pg":"20","f":[],"n":27,"e":["Dapsone, taken daily for at least 6 months (paucibacillary) or 12 months (multibacillary), is the backbone drug, combined with rifampicin and clofazimine to avoid resistance. Why the other options are wrong: A) Azithromycin: Azithromycin is not first line. B) Tetracycline: Tetracycline is not first line. C) Colchicine: Colchicine is for gout. D) Steroids: Steroids treat reactions.","Dapsone backbone."],"im":[]},{"id":"H051","ch":"Mycobacterial Infections","q":"In lepromatous leprosy:","o":[["A","Lesions are few in number."],["B","Lepromin test is positive."],["C","Anesthesia is late and extensive on cold areas."],["D","Organisms are rarely found in skin smears."],["E","None of the above."]],"a":"C","sa":null,"pg":null,"f":[],"n":28,"e":["In lepromatous leprosy sensory loss appears late but becomes extensive (glove and stocking), because bacilli accumulate in nerves slowly. In tuberculoid leprosy it is early and localized. Why the other options are wrong: A) Lesions are few in number: Lesions are numerous. B) Lepromin test is positive: Lepromin is negative. D) Organisms are rarely found in skin smears: Bacilli are many. E) None of the above: Wrong: at least one listed statement is correct.","LL: late anesthesia."],"im":[]},{"id":"H053","ch":"Mycobacterial Infections","q":"In leprosy:","o":[["A","It is a stable disease."],["B","Keratinocytes are the target cells for the bacilli."],["C","Dapsone is the backbone of treatment of all types of leprosy."],["D","Leprosy is an autoimmune disease."],["E","Lepromin test is reliable in the diagnosis."]],"a":"C","sa":null,"pg":null,"f":[],"n":29,"e":["Per the book, dapsone is the backbone of treatment of all types of leprosy; the disease is not stable, not autoimmune, and the lepromin test is not diagnostic. Why the other options are wrong: A) It is a stable disease: Leprosy is chronic and progressive, causing nerve damage and deformity if untreated. B) Keratinocytes are the target cells for t…: Schwann cells are the target. D) Leprosy is an autoimmune disease: It is infectious. E) Lepromin test is reliable in the diagnos…: The lepromin test is not diagnostic; it only helps classify the type and prognosis.","Lepromin = prognostic only."],"im":[]},{"id":"H054","ch":"Mycobacterial Infections","q":"Diagnosis of leprosy includes:","o":[["A","Skin biopsy."],["B","Nerve biopsy."],["C","Nasal smear."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":30,"e":["Diagnosis uses skin biopsy, nerve biopsy and slit-skin/nasal smears, so all of the above. Why the other options are wrong: A) Skin biopsy: Skin biopsy shows bacilli and granulomas. True, but others are also used. B) Nerve biopsy: Nerve biopsy helps in neural leprosy. True, but others are also used. C) Nasal smear: Nasal smear detects bacilli. True, but others are also used. E) None of the above: Wrong: all are used.","Smear, biopsy, nerve biopsy."],"im":[]},{"id":"H055","ch":"Mycobacterial Infections","q":"Leprosy is treated by:","o":[["A","Dapsone."],["B","Retinoids."],["C","Methotrexate."],["D","Tetracyclines."],["E","All of the above."]],"a":"A","sa":null,"pg":null,"f":[],"n":31,"e":["Dapsone is used for leprosy; retinoids, methotrexate and tetracyclines are not anti-leprotic here. Why the other options are wrong: B) Retinoids: Retinoids are for acne. C) Methotrexate: Methotrexate is for psoriasis. D) Tetracyclines: Tetracyclines are for acne. E) All of the above: Only dapsone is correct.","Dapsone."],"im":[]},{"id":"H056","ch":"Mycobacterial Infections","q":"In leprosy:","o":[["A","Lepromatous, borderline lepromatous & borderline tuberculoid leprosy are paucibacillary forms of the disease."],["B","Nerve invasion is late in tuberculoid leprosy."],["C","Numerous patches are characteristic of tuberculoid leprosy."],["D","All of the above is true."],["E","None of the above is true."]],"a":"E","sa":null,"pg":null,"f":[],"n":32,"e":["The statements given are all wrong: lepromatous/borderline lepromatous are multibacillary, nerve invasion is early in tuberculoid, and numerous patches are lepromatous. Why the other options are wrong: A) Lepromatous, borderline lepromatous & bo…: LL and BL are multibacillary. B) Nerve invasion is late in tuberculoid le…: It is early in TT. C) Numerous patches are characteristic of t…: Patches are few in TT. D) All of the above is true: Wrong: not all listed statements are correct.","Paucibacillary = TT, BT."],"im":[]},{"id":"H057","ch":"Mycobacterial Infections","q":"Hansen's disease is another name for:","o":[["A","Acne."],["B","Alopecia."],["C","Scabies."],["D","Psoriasis."],["E","Leprosy."]],"a":"E","sa":null,"pg":null,"f":[],"n":33,"e":["Hansen's disease is named after Gerhard Hansen, who discovered Mycobacterium leprae; it is simply another name for leprosy. Why the other options are wrong: A) Acne: Acne is a pilosebaceous disease. B) Alopecia: Alopecia is hair loss. C) Scabies: Scabies is a mite disease. D) Psoriasis: Psoriasis is papulosquamous.","Hansen = leprosy."],"im":[]},{"id":"H061","ch":"Mycobacterial Infections","q":"Regarding leprosy, the following statement is INCORRECT:","o":[["A","High immunity leads to paucibacillary leprosy."],["B","Tuberculoid leprosy shows good immunity."],["C","Lepromin test is non-specific and non-diagnostic."],["D","Sensory nerves affection leads to glove and stocking anesthesia."],["E","Lepromatous leprosy is paucibacillary."]],"a":"E","sa":null,"pg":null,"f":[],"n":34,"e":["Lepromatous leprosy is multibacillary, so calling it paucibacillary is incorrect. Why the other options are wrong: A) High immunity leads to paucibacillary le…: Correct statement. B) Tuberculoid leprosy shows good immunity: Correct statement. C) Lepromin test is non-specific and non-di…: Correct statement. D) Sensory nerves affection leads to glove…: Correct statement.","LL multibacillary."],"im":[]},{"id":"H067","ch":"Mycobacterial Infections","q":"Which is TRUE regarding tuberculoid leprosy:","o":[["A","Diagnosed by lepromin test."],["B","Presents with multiple nodules."],["C","Nerve involvement occurs early."],["D","Involves mucous membranes."],["E","Is a sign of poor immunity."]],"a":"C","sa":null,"pg":null,"f":[],"n":35,"e":["In tuberculoid leprosy the host immune response targets bacilli in nerves, so nerve involvement is early, while the disease is paucibacillary and not diagnosed by lepromin test. Why the other options are wrong: A) Diagnosed by lepromin test: Not diagnosed by lepromin. B) Presents with multiple nodules: Nodules are LL. D) Involves mucous membranes: Mucosa is LL. E) Is a sign of poor immunity: TT is good immunity.","TT early nerve."],"im":[]},{"id":"H071","ch":"Mycobacterial Infections","q":"A male patient, 52 years old, presented with glistening erythematous papules, nodules & plaques on his ears, nose and forehead. He had loss of the outer 1/3 of his eyebrows and gave history of recurrent attacks of epistaxis. What is your diagnosis?","o":[["A","Impetigo contagiosum."],["B","Tuberculoid leprosy."],["C","Lepromatous leprosy."],["D","Pityriasis versicolor."],["E","Psoriasis."]],"a":"C","sa":null,"pg":null,"f":[],"n":36,"e":["Glistening nodules on ears, nose and forehead with loss of the outer third of the eyebrows and epistaxis is lepromatous leprosy. Why the other options are wrong: A) Impetigo contagiosum: Impetigo is crusted. B) Tuberculoid leprosy: TT is few patches. D) Pityriasis versicolor: Versicolor is scaly. E) Psoriasis: Psoriasis is scaly.","Madarosis outer third."],"im":[]},{"id":"H072","ch":"Mycobacterial Infections","q":"A patient with widespread, symmetrical papules and nodules, infiltrated facial skin, and loss of the outer third of the eyebrows. Which is TRUE regarding this disease?","o":[["A","Is a parasitic infection."],["B","Bacilli are absent in skin lesions."],["C","Nerve involvement occurs early."],["D","Involves mucous membranes."],["E","Is characterized by good immunity."]],"a":"D","sa":null,"pg":null,"f":[],"n":37,"e":["Symmetrical nodules, infiltrated face and loss of the outer eyebrows indicate lepromatous leprosy, which involves mucous membranes. Why the other options are wrong: A) Is a parasitic infection: It is bacterial. B) Bacilli are absent in skin lesions: Bacilli are numerous. C) Nerve involvement occurs early: Nerve is late. E) Is characterized by good immunity: Immunity is poor.","LL: mucosa involved."],"im":[]},{"id":"Q126","ch":"Viral Infections","q":"Viral skin infections include all of the following EXCEPT","o":[["A","Herpes simplex."],["B","Chicken pox."],["C","Warts."],["D","Impetigo."],["E","Molluscum contagiosum."]],"a":"D","sa":null,"pg":"21","f":[],"n":1,"e":["Impetigo is caused by bacteria (Staphylococcus aureus/streptococci). Herpes simplex, chickenpox, warts and molluscum are viral. Why the other options are wrong: A) Herpes simplex: HSV is viral. B) Chicken pox: Chickenpox is viral. C) Warts: Warts are viral. E) Molluscum contagiosum: Molluscum is viral.","Impetigo = bacterial."],"im":[]},{"id":"Q127","ch":"Viral Infections","q":"All of the following microorganisms have a predilection for neural tissue EXCEPT","o":[["A","Varicella zoster virus."],["B","Human papilloma virus."],["C","Herpes simplex virus type I."],["D","Herpes simplex virus type II."],["E","Lepra bacilli."]],"a":"B","sa":null,"pg":"22","f":[],"n":2,"e":["VZV, HSV and M. leprae are neurotropic; HPV is epitheliotropic, not neural. Why the other options are wrong: A) Varicella zoster virus: VZV is neurotropic. C) Herpes simplex virus type I: HSV-1 is neurotropic. D) Herpes simplex virus type II: HSV-2 is neurotropic. E) Lepra bacilli: Lepra bacilli target nerves.","Neurotropic: VZV, HSV, M. leprae."],"im":[]},{"id":"Q128","ch":"Viral Infections","q":"All of the following microorganisms have a predilection for neural tissue EXCEPT","o":[["A","Varicella zoster virus."],["B","Herpes simplex virus type I."],["C","Herpes simplex virus type II."],["D","Lepra bacilli."],["E","Pox virus."]],"a":"E","sa":null,"pg":"22","f":[],"n":3,"e":["Poxvirus (molluscum) infects epidermal cells and is not neurotropic; VZV, HSV and lepra bacilli are. The same question in Dr. Hawary's file lists HPV and pox virus as both being non-neural (key B / E). Why the other options are wrong: A) Varicella zoster virus: VZV is neurotropic. B) Herpes simplex virus type I: HSV-1 is neurotropic. C) Herpes simplex virus type II: HSV-2 is neurotropic. D) Lepra bacilli: Lepra bacilli target Schwann cells.","Pox and HPV = no neural predilection."],"im":[]},{"id":"Q129","ch":"Viral Infections","q":"Herpes simplex","o":[["A","Is strictly unilateral."],["B","Is a bacterial infection."],["C","Heals with a scar."],["D","One attack provides permanent immunity."],["E","Is genital & non-genital."]],"a":"E","sa":null,"pg":"21","f":[],"n":4,"e":["HSV infects genital and non-genital sites (lips, face, fingers, eye), types 1 and 2 overlapping. Why the other options are wrong: A) Is strictly unilateral: It can be bilateral. B) Is a bacterial infection: It is viral. C) Heals with a scar: It heals without scar. D) One attack provides permanent immunity: It recurs.","HSV-1 mostly oral; HSV-2 mostly genital."],"im":[]},{"id":"Q130","ch":"Viral Infections","q":"In herpes simplex","o":[["A","The primary lesion is a papule."],["B","Neuralgia is a frequent complication."],["C","It usually affects the mucocutaneous junction."],["D","Recurrences are uncommon."],["E","None of the above."]],"a":"C","sa":null,"pg":"27","f":[],"n":5,"e":["HSV classically involves the mucocutaneous junction (lips, nose, genitalia) and recurs there; it is periorificial, whereas zoster follows a dermatome. Why the other options are wrong: A) The primary lesion is a papule: The primary lesion is a vesicle. B) Neuralgia is a frequent complication: Neuralgia is a feature of zoster. D) Recurrences are uncommon: Recurrences are common. E) None of the above: Wrong: at least one listed statement is correct.","Periorificial."],"im":[]},{"id":"Q131","ch":"Viral Infections","q":"In herpes simplex all are true EXCEPT","o":[["A","The primary lesion is a vesicle."],["B","Neuralgia is a frequent complication."],["C","It usually affects the mucocutaneous junction."],["D","It may cause eczema herpeticum in atopics."],["E","Recurrence is common."]],"a":"B","sa":null,"pg":"26","f":[],"n":6,"e":["Neuralgia is a frequent complication of herpes zoster, not of herpes simplex. Why the other options are wrong: A) The primary lesion is a vesicle: The primary lesion of HSV is a grouped vesicle. C) It usually affects the mucocutaneous jun…: HSV typically involves mucocutaneous junctions (lips, genitalia). D) It may cause eczema herpeticum in atopics: HSV can cause eczema herpeticum in atopic skin. E) Recurrence is common: HSV recurs after latency in sensory ganglia.","Post-herpetic neuralgia = zoster."],"im":[]},{"id":"Q132","ch":"Viral Infections","q":"Herpes labialis","o":[["A","Is recurrent."],["B","Heals with a scar."],["C","Its primary lesion is a papule."],["D","Is strictly unilateral."],["E","Is caused by HSV II."]],"a":"A","sa":null,"pg":"22","f":[],"n":7,"e":["Herpes labialis recurs because HSV lies latent in the trigeminal ganglion and reactivates. Why the other options are wrong: B) Heals with a scar: It heals without scar. C) Its primary lesion is a papule: The primary lesion is a vesicle. D) Is strictly unilateral: It can be bilateral. E) Is caused by HSV II: It is usually HSV-1.","Recurrence is common in HSV."],"im":[]},{"id":"Q133","ch":"Viral Infections","q":"A female patient, 15 years old, presented with perioral blisters of 4 days duration. She was feverish 2 days before the rash and felt a tingling sensation in the area. The condition was recurrent. (Clinical photo: grouped vesicles/crusts at the lip margin.) The causative organism of this disease is","o":[["A","Group A β-haemolytic Streptococci."],["B","Varicella zoster virus."],["C","Staphylococcus aureus."],["D","Human papilloma virus."],["E","Herpes simplex virus."]],"a":"E","sa":null,"pg":"22","f":[],"n":8,"e":["Recurrent perioral blisters preceded by fever and tingling are due to herpes simplex virus. Why the other options are wrong: A) Group A β-haemolytic Streptococci: Strep causes impetigo. B) Varicella zoster virus: VZV gives dermatomal vesicles. C) Staphylococcus aureus: Staph causes impetigo. D) Human papilloma virus: HPV gives warts.","Prodrome tingling → HSV."],"im":[]},{"id":"Q134","ch":"Viral Infections","q":"A female patient, 15 years old, presented with perioral blisters of 4 days duration. She was feverish 2 days before the rash and felt a tingling sensation in the area. The condition was recurrent. (Clinical photo: grouped vesicles/crusts at the lip margin.) A possible complication is","o":[["A","Neuralgia."],["B","Erythema multiforme."],["C","Lymphatic obstruction."],["D","Facial palsy."],["E","Scarring."]],"a":"B","sa":null,"pg":"82","f":[],"n":9,"e":["HSV is the most common trigger of erythema multiforme, an immune-mediated reaction with target lesions; other complications are eczema herpeticum, ocular disease and encephalitis. Why the other options are wrong: A) Neuralgia: Neuralgia is a zoster complication. C) Lymphatic obstruction: Lymphatic obstruction occurs in erysipelas. D) Facial palsy: Facial palsy is not typical. E) Scarring: HSV heals without scar.","HSV → EM."],"im":[]},{"id":"Q135","ch":"Viral Infections","q":"A female patient presented with bilateral grouped vesicles on an erythematous base on the lips, preceded by burning sensation. The diagnosis is","o":[["A","Herpes zoster."],["B","Herpes simplex."],["C","Molluscum contagiosum."],["D","Impetigo contagiosum."],["E","Drug eruption."]],"a":"B","sa":null,"pg":"22","f":[],"n":10,"e":["Bilateral grouped vesicles on an erythematous base on the lips after burning sensation indicate herpes simplex. Why the other options are wrong: A) Herpes zoster: Zoster is unilateral and dermatomal. C) Molluscum contagiosum: Molluscum is umbilicated. D) Impetigo contagiosum: Impetigo is crusted. E) Drug eruption: No drug here.","Burning prodrome + grouped vesicles."],"im":[]},{"id":"Q136","ch":"Viral Infections","q":"A 40-year-old male patient with bilateral grouped vesicles on an erythematous base affecting the lips and nose, with no fever or lymphadenopathy, may have","o":[["A","Herpes zoster."],["B","Primary herpetic gingivostomatitis."],["C","Recurrent herpes simplex."],["D","Erysipelas."],["E","Verruca vulgaris."]],"a":"C","sa":null,"pg":"22","f":[],"n":11,"e":["Recurrent grouped vesicles on the lips and nose indicate recurrent herpes simplex (labialis). Why the other options are wrong: A) Herpes zoster: Zoster is unilateral. B) Primary herpetic gingivostomatitis: Primary herpetic gingivostomatitis is with fever and lymph nodes. D) Erysipelas: Erysipelas is a hot plaque. E) Verruca vulgaris: Verruca is rough.","Recurrent = HSV."],"im":[]},{"id":"Q137","ch":"Viral Infections","q":"A 24-year-old man develops grouped painful vesicles on the penis, preceded by burning sensation. The most likely diagnosis is","o":[["A","Molluscum contagiosum."],["B","Condyloma acuminata."],["C","Herpes progenitalis."],["D","Scabies."],["E","Exanthematous drug eruption."]],"a":"C","sa":null,"pg":"23","f":[],"n":12,"e":["Grouped painful vesicles on the penis after burning point to genital herpes (herpes progenitalis). Why the other options are wrong: A) Molluscum contagiosum: Molluscum is not painful. B) Condyloma acuminata: Condyloma is not vesicular. D) Scabies: Scabies is itchy. E) Exanthematous drug eruption: Drug eruption is exanthematous.","HSV-2 usually."],"im":[]},{"id":"Q138","ch":"Viral Infections","q":"Caesarian section is indicated for a pregnant female if at the time of delivery she is affected by","o":[["A","Herpetic whitlow."],["B","Herpes progenitalis."],["C","Herpes zoster."],["D","Chicken pox."],["E","None of the above."]],"a":"B","sa":null,"pg":"23","f":[],"n":13,"e":["Active genital herpes at delivery is an indication for cesarean section to prevent neonatal herpes. Why the other options are wrong: A) Herpetic whitlow: Whitlow is on fingers. C) Herpes zoster: Zoster is not transmitted at birth this way. D) Chicken pox: Chickenpox is managed differently. E) None of the above: Wrong: at least one listed statement is correct.","Active genital herpes → C-section."],"im":[]},{"id":"Q139","ch":"Viral Infections","q":"The following disease could be transmitted by sexual contact","o":[["A","Pityriasis rosea."],["B","Pityriasis versicolor."],["C","Herpes simplex."],["D","Herpes zoster."],["E","Ophiasis."]],"a":"C","sa":null,"pg":"21","f":[],"n":14,"e":["Herpes simplex type 2 is a very common sexually transmitted infection, spread by contact with the genital mucosa or skin; zoster, psoriasis and versicolor are not STDs. Why the other options are wrong: A) Pityriasis rosea: Pityriasis rosea is not an STD. B) Pityriasis versicolor: Versicolor is not an STD. D) Herpes zoster: Zoster is reactivation. E) Ophiasis: Ophiasis is alopecia.","HSV-2 genital."],"im":[]},{"id":"Q140","ch":"Viral Infections","q":"In herpetic whitlow the site of infection is","o":[["A","Face."],["B","Mucous membrane."],["C","Genitals."],["D","Fingers."],["E","None of the above."]],"a":"D","sa":null,"pg":"23","f":[],"n":15,"e":["Herpetic whitlow is HSV infection of the finger in children (HSV-1) or adults after digital-genital contact. Why the other options are wrong: A) Face: Face is herpes labialis. B) Mucous membrane: Mucosa is gingivostomatitis. C) Genitals: Genitals is progenitalis. E) None of the above: Wrong: at least one listed statement is correct.","Whitlow = finger."],"im":[]},{"id":"Q141","ch":"Viral Infections","q":"The eye may be affected in ONE of the following diseases","o":[["A","Lichen planus."],["B","Pityriasis rosea."],["C","Acne vulgaris."],["D","Herpes simplex."],["E","Psoriasis."]],"a":"D","sa":null,"pg":"23","f":[],"n":16,"e":["HSV can cause keratitis (HSV-1 in children and adults, HSV-2 in newborns), possibly with corneal ulcers; zoster also causes eye disease through the ophthalmic branch. Why the other options are wrong: A) Lichen planus: Lichen planus does not affect the eye. B) Pityriasis rosea: PR does not affect the eye. C) Acne vulgaris: Acne does not affect the eye. E) Psoriasis: Psoriasis does not affect the eye.","HSV ocular."],"im":[]},{"id":"Q142","ch":"Viral Infections","q":"Complications of herpes simplex infection include","o":[["A","Erythema multiforme."],["B","Eczema herpeticum."],["C","Corneal ulcers."],["D","CNS complications."],["E","All of the above."]],"a":"E","sa":null,"pg":"23","f":[],"n":17,"e":["HSV complications include erythema multiforme, eczema herpeticum, corneal ulcers and CNS (encephalitis). Why the other options are wrong: A) Erythema multiforme: Erythema multiforme can follow HSV. True, but B, C and D are also complications. B) Eczema herpeticum: Eczema herpeticum is HSV superinfection of atopic skin. True, but others also occur. C) Corneal ulcers: HSV causes corneal ulcers. True, but others also occur. D) CNS complications: HSV can reach the CNS (encephalitis). True, but others also occur.","All of the above."],"im":[]},{"id":"Q143","ch":"Viral Infections","q":"Tzank smear is used to diagnose","o":[["A","Leprosy."],["B","Impetigo."],["C","Herpes simplex."],["D","Psoriasis."],["E","Pediculosis."]],"a":"C","sa":null,"pg":"24","f":[],"n":18,"e":["A Tzanck smear shows multinucleated giant cells in herpes simplex (and zoster/varicella). Why the other options are wrong: A) Leprosy: Leprosy needs smear. B) Impetigo: Impetigo needs culture. D) Psoriasis: Psoriasis is clinical. E) Pediculosis: Lice need microscopy.","Tzanck = multinucleated giant cells."],"im":[]},{"id":"Q144","ch":"Viral Infections","q":"Primary varicella zoster virus infection leads to","o":[["A","Facial palsy."],["B","Genital herpes."],["C","Chickenpox."],["D","Herpes zoster."],["E","Oral herpes."]],"a":"C","sa":null,"pg":"24","f":[],"n":19,"e":["Primary VZV infection leads to chickenpox, usually in childhood; the virus then lies latent in posterior root ganglia and reactivates as herpes zoster. Why the other options are wrong: A) Facial palsy: Not facial palsy. B) Genital herpes: Genital herpes is HSV. D) Herpes zoster: Zoster is reactivation. E) Oral herpes: Oral herpes is HSV.","Primary VZV = varicella."],"im":[]},{"id":"Q145","ch":"Viral Infections","q":"Chicken pox represents","o":[["A","HSV infection."],["B","HPV infection."],["C","Poxvirus infection."],["D","Reactivation of VZV."],["E","Primary VZV infection."]],"a":"E","sa":null,"pg":"24","f":[],"n":20,"e":["Chickenpox is the primary VZV infection, whereas herpes zoster is reactivation. HSV causes oral and genital herpes. Why the other options are wrong: A) HSV infection: HSV is a different virus. B) HPV infection: HPV causes warts. C) Poxvirus infection: Poxvirus causes molluscum. D) Reactivation of VZV: Reactivation is zoster.","Primary vs reactivation."],"im":[]},{"id":"Q146","ch":"Viral Infections","q":"Varicella: what is the causative virus, and what is the treatment?","o":[],"a":null,"sa":"Varicella zoster virus (VZV); antiviral, e.g. acyclovir 800 mg 5 times daily for 7 days (started within 48 hours).","pg":"24","f":[],"n":21,"e":["Varicella is caused by VZV, and treatment is antiviral therapy (acyclovir 800 mg 5 times daily for 7 days, started within 48 hours) plus vaccine prophylaxis in children.","VZV, acyclovir."],"im":[]},{"id":"Q147","ch":"Viral Infections","q":"An adult patient with unilateral painful grouped vesicles along the distribution of a sensory nerve is suffering from","o":[["A","Herpes simplex."],["B","Herpes zoster."],["C","Chickenpox."],["D","Warts."],["E","Molluscum contagiosum."]],"a":"B","sa":null,"pg":"25","f":[],"n":22,"e":["Unilateral grouped vesicles along a sensory nerve distribution are herpes zoster. Why the other options are wrong: A) Herpes simplex: HSV is not dermatomal. C) Chickenpox: Chickenpox is generalized. D) Warts: Warts are not vesicles. E) Molluscum contagiosum: Molluscum is umbilicated.","Dermatomal = zoster."],"im":[]},{"id":"Q148","ch":"Viral Infections","q":"Unilateral painful grouped vesicles on an erythematous base are seen in","o":[["A","Verruca vulgaris."],["B","Acute eczema."],["C","Herpes zoster."],["D","Varicella."],["E","Pediculosis."]],"a":"C","sa":null,"pg":"25","f":[],"n":23,"e":["Unilateral painful grouped vesicles on an erythematous base indicate herpes zoster. Why the other options are wrong: A) Verruca vulgaris: Verruca is rough. B) Acute eczema: Acute eczema is bilateral. D) Varicella: Varicella is generalized. E) Pediculosis: Pediculosis is itchy.","Pain + unilateral."],"im":[]},{"id":"Q149","ch":"Viral Infections","q":"Primary lesions of herpes zoster are unilateral","o":[["A","Flat-topped skin-colored papules."],["B","Flat-topped violaceous papules."],["C","Umbilicated papules."],["D","Grouped pustules."],["E","Grouped vesicles."]],"a":"E","sa":null,"pg":"27","f":[],"n":24,"e":["The primary lesion of zoster is grouped vesicles on a dermatome, unilateral. Why the other options are wrong: A) Flat-topped skin-colored papules: That is plane warts. B) Flat-topped violaceous papules: That is lichen planus. C) Umbilicated papules: That is molluscum. D) Grouped pustules: Pustules are not typical.","Grouped vesicles."],"im":[]},{"id":"Q150","ch":"Viral Infections","q":"Post-herpetic neuralgia is more common in","o":[["A","Children."],["B","Elderly patients."],["C","Diabetic patients."],["D","Motor nerve affection."],["E","Sensory nerve affection."]],"a":"B","sa":null,"pg":"26","f":[],"n":25,"e":["Post-herpetic neuralgia occurs in elderly patients and may persist for weeks to months. Early antivirals and vaccines reduce its risk. Why the other options are wrong: A) Children: Children rarely get PHN. C) Diabetic patients: Age, not diabetes, is the main risk. D) Motor nerve affection: Sensory fibers are involved. E) Sensory nerve affection: Not a discriminating factor.","Elderly → PHN."],"im":[]},{"id":"Q151","ch":"Viral Infections","q":"Common complication of herpes zoster","o":[["A","Long-standing pain."],["B","Ulceration."],["C","Lymphatic obstruction."],["D","Deep venous thrombosis."]],"a":"A","sa":null,"pg":"26","f":[],"n":26,"e":["Post-herpetic neuralgia (long-standing pain) is the common complication of zoster. Why the other options are wrong: B) Ulceration: Ulceration is rare. C) Lymphatic obstruction: Lymphatic obstruction is not a zoster complication. D) Deep venous thrombosis: DVT is not a complication.","PHN."],"im":[]},{"id":"Q152","ch":"Viral Infections","q":"The following drug is the main treatment of herpes zoster","o":[["A","Acyclovir."],["B","Tetracycline."],["C","Retinoids."],["D","Cyclosporin."],["E","Methotrexate."]],"a":"A","sa":null,"pg":"27","f":[],"n":27,"e":["Acyclovir (also valacyclovir and famciclovir) is the main treatment for herpes zoster when started within 48 hours; analgesics and gabapentin help the pain. Why the other options are wrong: B) Tetracycline: Tetracycline is antibacterial. C) Retinoids: Retinoids are for acne. D) Cyclosporin: Cyclosporin is immunosuppressive. E) Methotrexate: Methotrexate is antiproliferative.","Acyclovir."],"im":[]},{"id":"Q153","ch":"Viral Infections","q":"A 65-year-old man presents with unilateral, painful vesicles along a dermatome on the trunk. Treatment of this condition is oral acyclovir in a dose of","o":[["A","800 mg 3 times daily."],["B","200 mg 3 times daily."],["C","800 mg 5 times daily."],["D","200 mg 5 times daily."],["E","400 mg 5 times daily."]],"a":"C","sa":null,"pg":"27","f":[],"n":28,"e":["Herpes zoster in older adults is treated with oral acyclovir 800 mg five times daily for 7 days. Why the other options are wrong: A) 800 mg 3 times daily: Too infrequent. B) 200 mg 3 times daily: Too low. D) 200 mg 5 times daily: That is the herpes simplex dose. E) 400 mg 5 times daily: Not the standard.","800 mg × 5/day."],"im":[]},{"id":"Q154","ch":"Viral Infections","q":"Treatment of herpes zoster (dose of acyclovir)?","o":[],"a":null,"sa":"Oral acyclovir 800 mg 5 times daily for 7 days (started within 48 hours).","pg":"27","f":[],"n":29,"e":["Zoster: oral acyclovir 800 mg five times daily for 7 days, started within 48 hours.","800 × 5 × 7 days."],"im":[]},{"id":"Q155","ch":"Viral Infections","q":"Warts are caused by","o":[["A","HSV-1."],["B","Pox virus."],["C","Human papilloma virus."]],"a":"C","sa":null,"pg":"28","f":[],"n":30,"e":["Warts are common benign epithelial growths caused by human papilloma virus (over 200 genotypes), not pox virus or herpes simplex. Why the other options are wrong: A) HSV-1: HSV-1 gives vesicles. B) Pox virus: Pox virus gives molluscum.","Warts = HPV."],"im":[]},{"id":"Q156","ch":"Viral Infections","q":"Verruca vulgaris is caused by","o":[["A","Herpes simplex virus type 1."],["B","Herpes simplex virus type 2."],["C","Human papilloma virus."],["D","Varicella-zoster virus."],["E","Pox virus."]],"a":"C","sa":null,"pg":null,"f":[],"n":31,"e":["Verruca vulgaris (common wart) is caused by HPV, a DNA virus transmitted by skin contact or fomites. Why the other options are wrong: A) Herpes simplex virus type 1: HSV-1 gives vesicles. B) Herpes simplex virus type 2: HSV-2 gives genital herpes. D) Varicella-zoster virus: VZV gives zoster. E) Pox virus: Pox gives molluscum.","HPV."],"im":[]},{"id":"Q157","ch":"Viral Infections","q":"Verruca","o":[["A","Presents by violaceous papules."],["B","Is characterized by asymptomatic verrucous macules."],["C","May involve the mucous membranes."],["D","Is a systemic disease."],["E","Is always treated by surgical excision."]],"a":"C","sa":null,"pg":"28","f":[],"n":32,"e":["Warts may involve mucous membranes as well as skin; genital warts are the best example. Why the other options are wrong: A) Presents by violaceous papules: Warts are not violaceous. B) Is characterized by asymptomatic verruco…: Lesions are papules. D) Is a systemic disease: It is local. E) Is always treated by surgical excision: Destruction is used.","Warts: skin and mucosa."],"im":[]},{"id":"Q158","ch":"Viral Infections","q":"Which of the following is a correct statement concerning verrucae?","o":[["A","Primary lesion is a skin-colored macule."],["B","Involve mucous membranes."],["C","Found mainly in patients with lymphoma."],["D","Contagious in children only."],["E","Treated with griseofulvin."]],"a":"B","sa":null,"pg":"28","f":[],"n":33,"e":["Verrucae can involve mucous membranes (oral, genital, anal); they are not limited to skin, and are not caused by Treponema. Why the other options are wrong: A) Primary lesion is a skin-colored macule: The primary lesion is a papule. C) Found mainly in patients with lymphoma: Not lymphoma-specific. D) Contagious in children only: Adults also get warts. E) Treated with griseofulvin: Griseofulvin is for fungi.","Mucosal warts."],"im":[]},{"id":"Q159","ch":"Viral Infections","q":"ONE of the following statements about warts is CORRECT","o":[["A","The primary lesion of verruca vulgaris is a skin-colored macule."],["B","Condyloma acuminata is caused by Treponema pallidum."],["C","Warts occur on the skin, but not on mucous membranes."],["D","Cancer cervix is a complication of female genital warts."],["E","All types are painless."]],"a":"D","sa":null,"pg":"29","f":[],"n":34,"e":["Genital warts (certain HPV types) are linked to cervical cancer; common warts are not skin-colored macules, and warts are not caused by Treponema. Why the other options are wrong: A) The primary lesion of verruca vulgaris i…: Macules are flat. B) Condyloma acuminata is caused by Trepone…: Treponema causes syphilis. C) Warts occur on the skin, but not on muco…: Warts occur on mucosa. E) All types are painless: Plantar warts are tender.","HPV 16/18 → cervix cancer."],"im":[]},{"id":"Q160","ch":"Viral Infections","q":"Verrucae vulgaris are","o":[["A","Genital warts."],["B","Plantar warts."],["C","Common warts."],["D","Plane warts."],["E","Filiform warts."]],"a":"C","sa":null,"pg":"28","f":[],"n":35,"e":["Verruca vulgaris is the common wart: hyperkeratotic, dome-shaped skin-colored papules on hands and fingers with a rough mamillated surface. Why the other options are wrong: A) Genital warts: Genital warts are condyloma. B) Plantar warts: Plantar warts are on the sole. D) Plane warts: Plane warts are flat. E) Filiform warts: Filiform warts are thread-like.","Vulgaris = common."],"im":[]},{"id":"Q161","ch":"Viral Infections","q":"A male patient, 6 years old, presented with asymptomatic flat-topped lesions on his face. The condition started 5 months ago with a gradual onset and a progressive course. (Clinical photo: multiple small flat-topped skin- colored/pinkish papules on the cheek.) This patient suffers from","o":[["A","Psoriasis."],["B","Plane warts."],["C","Molluscum contagiosum."],["D","Scabies."],["E","Condyloma acuminata."]],"a":"B","sa":null,"pg":"28","f":[],"n":36,"e":["Multiple flat-topped skin-colored papules, often on the face of a child, are plane warts. Why the other options are wrong: A) Psoriasis: Psoriasis is scaly. C) Molluscum contagiosum: Molluscum is umbilicated. D) Scabies: Scabies is itchy. E) Condyloma acuminata: Condyloma is genital.","Plane = flat."],"im":[]},{"id":"Q162","ch":"Viral Infections","q":"A male patient, 6 years old, presented with asymptomatic flat-topped lesions on his face. The condition started 5 months ago with a gradual onset and a progressive course. (Clinical photo: multiple small flat-topped skin- colored/pinkish papules on the cheek.) The causative organism of this disease is","o":[["A","Human herpes virus 6."],["B","Varicella zoster virus."],["C","Epstein-Barr virus."],["D","Human papilloma virus."],["E","Herpes simplex virus."]],"a":"D","sa":null,"pg":"28","f":[],"n":37,"e":["Warts are caused by human papilloma virus. Why the other options are wrong: A) Human herpes virus 6: HHV-6 is pityriasis rosea. B) Varicella zoster virus: VZV is zoster. C) Epstein-Barr virus: EBV is mononucleosis. E) Herpes simplex virus: HSV is vesicular.","HPV."],"im":[]},{"id":"Q163","ch":"Viral Infections","q":"This wart is usually tender","o":[["A","Plane wart."],["B","Plantar wart."],["C","Verruca vulgaris."],["D","Filiform wart."],["E","Condyloma acuminata."]],"a":"B","sa":null,"pg":"29","f":[],"n":38,"e":["Plantar warts are tender because they grow inward under pressure on the sole. Why the other options are wrong: A) Plane wart: Plane warts are flat. C) Verruca vulgaris: Verruca vulgaris is not tender. D) Filiform wart: Filiform warts are not tender. E) Condyloma acuminata: Condyloma is soft.","Plantar wart = tender."],"im":[]},{"id":"Q164","ch":"Viral Infections","q":"A female patient, 30 years old, presented with a tender papule involving her sole, soon followed by other similar ones. The condition started about two months ago. She feels pain while walking or running. This patient suffers from","o":[["A","Plantar warts."],["B","Moniliasis."],["C","Leprotic nodules."],["D","Post-scabietic nodules."],["E","Condyloma acuminata."]],"a":"A","sa":null,"pg":"29","f":[],"n":39,"e":["A tender thick papule on the sole, painful on walking, with other similar lesions nearby is a plantar wart. It grows inward and is tender. Why the other options are wrong: B) Moniliasis: Moniliasis is candida. C) Leprotic nodules: Leprotic nodules are anesthetic. D) Post-scabietic nodules: Post-scabietic nodules are on genitalia. E) Condyloma acuminata: Condyloma is genital.","Plantar warts: tender, endophytic."],"im":[]},{"id":"Q165","ch":"Viral Infections","q":"Which of the following is TRUE regarding plantar warts?","o":[["A","Long, thin pedunculated skin growths."],["B","Caused by human herpes virus 7."],["C","Secondary infection is a common complication."],["D","Treated by cryotherapy."],["E","Caused by blood-borne infection."]],"a":"D","sa":null,"pg":"30","f":[],"n":40,"e":["Plantar warts are treated by destruction: cryotherapy, electrocautery, chemical cautery (salicylic acid) or laser. Why the other options are wrong: A) Long, thin pedunculated skin growths: That is filiform. B) Caused by human herpes virus 7: HPV, not HHV-7. C) Secondary infection is a common complica…: Warts spread by direct contact with HPV, and secondary infection is not a common complication. E) Caused by blood-borne infection: Warts spread by direct contact with HPV, and secondary infection is not a common complication.","Cryotherapy."],"im":[]},{"id":"Q166","ch":"Viral Infections","q":"Condyloma acuminatum","o":[["A","Is herpes simplex virus infection of the genital area."],["B","Involves female genital areas only."],["C","Usually affects skin & mucous membranes of the genital area."],["D","Is an entirely benign lesion."],["E","Forms deep nodules in the genital area."]],"a":"C","sa":null,"pg":"29","f":[],"n":41,"e":["Condyloma acuminata (genital warts) involve skin and mucosa of the genital, perineal and perianal area; they are caused by HPV and may extend into the vagina, urethra or anus. Why the other options are wrong: A) Is herpes simplex virus infection of the…: It is HPV. B) Involves female genital areas only: It involves both sexes. D) Is an entirely benign lesion: It is oncogenic with HPV 16/18. E) Forms deep nodules in the genital area: It is exophytic.","Genital warts: skin and mucosa."],"im":[]},{"id":"Q167","ch":"Viral Infections","q":"A female patient, 34 years old, presented with multiple soft, pinkish, moist, foul-smelling outgrowths involving her genitalia. The condition started about one year ago with a gradual onset and progressive course. (Clinical photo: multiple cauliflower-like warty growths on the genital/perianal area.) This patient suffers from","o":[["A","Genital herpes."],["B","Verruca plana."],["C","Condyloma acuminata."],["D","Molluscum contagiosum."],["E","Impetigo contagiosum."]],"a":"C","sa":null,"pg":"29","f":[],"n":42,"e":["Discrete soft exophytic papules on the genitalia indicate condyloma acuminata, an HPV infection that is oncogenic with types 16 and 18. Why the other options are wrong: A) Genital herpes: Herpes is vesicular. B) Verruca plana: Verruca plana is flat. D) Molluscum contagiosum: Molluscum is umbilicated. E) Impetigo contagiosum: Impetigo is crusted.","Condyloma."],"im":[]},{"id":"Q168","ch":"Viral Infections","q":"A female patient, 34 years old, presented with multiple soft, pinkish, moist, foul-smelling outgrowths involving her genitalia. The condition started about one year ago with a gradual onset and progressive course. (Clinical photo: multiple cauliflower-like warty growths on the genital/perianal area.) Management of this case is by","o":[["A","Phototherapy."],["B","Radiotherapy."],["C","Systemic acyclovir."],["D","Intralesional steroids."],["E","Podophyllin resin 25%."]],"a":"E","sa":null,"pg":"30","f":[],"n":43,"e":["Genital warts are treated with podophyllin resin (10-25%, weekly, washed after 1-4 h), imiquimod, cryotherapy or laser. Podophyllin is contraindicated in pregnancy. Why the other options are wrong: A) Phototherapy: Phototherapy has no role in genital warts; podophyllin, imiquimod, cryotherapy or laser are used. B) Radiotherapy: Radiotherapy has no role in genital warts. C) Systemic acyclovir: Acyclovir treats HSV. D) Intralesional steroids: Steroids worsen warts.","Podophyllin weekly."],"im":[]},{"id":"Q169","ch":"Viral Infections","q":"Treatment of verruca vulgaris is by","o":[["A","Surgical excision."],["B","Intralesional corticosteroids."],["C","Topical antibiotic."],["D","Topical steroid."],["E","Electrocautery."]],"a":"E","sa":null,"pg":"30","f":[],"n":44,"e":["Verruca vulgaris can be destroyed by electrocautery, cryotherapy or chemicals. Why the other options are wrong: A) Surgical excision: Excision leaves scars. B) Intralesional corticosteroids: Steroids do not treat warts. C) Topical antibiotic: Antibiotics are for bacteria. D) Topical steroid: Steroids do not treat warts.","Destructive therapy."],"im":[]},{"id":"Q170","ch":"Viral Infections","q":"Warts can be treated by all of the following EXCEPT","o":[["A","Laser."],["B","Cryotherapy."],["C","Electrocautery."],["D","Intralesional steroids."],["E","Chemical cautery."]],"a":"D","sa":null,"pg":"30","f":[],"n":45,"e":["Intralesional steroids are not used for warts; laser, cryotherapy, electrocautery and chemical cautery are. Why the other options are wrong: A) Laser: Laser treats warts. B) Cryotherapy: Cryotherapy treats warts. C) Electrocautery: Electrocautery treats warts. E) Chemical cautery: Chemical cautery treats warts.","Steroids don't treat warts."],"im":[]},{"id":"Q171","ch":"Viral Infections","q":"The following are different treatments of warts EXCEPT","o":[["A","Cryotherapy."],["B","Podophyllin resin."],["C","Laser treatment."],["D","PUVA."],["E","Electrocautery."]],"a":"D","sa":null,"pg":"30","f":[],"n":46,"e":["PUVA is not a wart treatment; cryotherapy, podophyllin, laser and electrocautery are. Why the other options are wrong: A) Cryotherapy: Cryotherapy treats warts. B) Podophyllin resin: Podophyllin treats warts. C) Laser treatment: Laser treats warts. E) Electrocautery: Electrocautery treats warts.","PUVA ≠ warts."],"im":[]},{"id":"Q172","ch":"Viral Infections","q":"In a pregnant female with venereal warts, all of the following treatment modalities can be used safely EXCEPT","o":[["A","Podophyllin resin."],["B","Laser."],["C","Cryotherapy."],["D","Electrocautery."],["E","None of the above."]],"a":"A","sa":null,"pg":"30","f":[],"n":47,"e":["Podophyllin resin is contraindicated in pregnancy; laser, cryotherapy and electrocautery may be used. Why the other options are wrong: B) Laser: Laser is safe. C) Cryotherapy: Cryotherapy is safe. D) Electrocautery: Electrocautery is safe. E) None of the above: A is the exception.","Pregnancy: avoid podophyllin."],"im":[]},{"id":"Q173","ch":"Viral Infections","q":"Genital warts are treated by ___, which is contraindicated in ___.","o":[],"a":null,"sa":"Podophyllin resin 10-25% (applied once weekly, washed off after 1-4 hours); contraindicated in pregnancy and in large bleeding warts.","pg":"30","f":[],"n":48,"e":["Genital warts are treated by podophyllin resin 10-25%, which is contraindicated in pregnancy and large bleeding warts.","Wash off after 1-4 h."],"im":[]},{"id":"Q174","ch":"Viral Infections","q":"Laser may be used in the treatment of","o":[["A","Warts."],["B","Molluscum contagiosum."],["C","Acne scars."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"30","f":[],"n":49,"e":["Laser (CO2 or pulsed dye) can destroy warts, molluscum lesions and treat acne scars by resurfacing. Why the other options are wrong: A) Warts: Laser removes resistant warts. True, but B and C also apply. B) Molluscum contagiosum: Laser can treat molluscum. True, but A and C also apply. C) Acne scars: Laser resurfacing treats acne scars. True, but A and B also apply. E) None of the above: Wrong: laser is used in all three.","Laser: all of these."],"im":[]},{"id":"Q175","ch":"Viral Infections","q":"Pox virus can cause","o":[["A","Molluscum contagiosum."],["B","Warts."],["C","Herpes zoster."],["D","Tinea capitis."],["E","Impetigo contagiosum."]],"a":"A","sa":null,"pg":"30","f":[],"n":50,"e":["Poxvirus causes molluscum contagiosum; warts are HPV, zoster is VZV and impetigo contagiosa is bacterial. Why the other options are wrong: B) Warts: Warts are HPV. C) Herpes zoster: Zoster is VZV. D) Tinea capitis: Tinea is fungal. E) Impetigo contagiosum: Impetigo is bacterial.","Molluscum = pox."],"im":[]},{"id":"Q176","ch":"Viral Infections","q":"Which one of the following viruses is responsible for causing molluscum contagiosum?","o":[["A","Human papilloma virus."],["B","Herpes simplex virus."],["C","Pox virus."],["D","Varicella zoster virus."],["E","Human immunodeficiency virus."]],"a":"C","sa":null,"pg":"30","f":[],"n":51,"e":["Molluscum contagiosum is caused by a poxvirus, which causes pearly umbilicated papules. Why the other options are wrong: A) Human papilloma virus: HPV causes warts. B) Herpes simplex virus: HSV causes vesicles. D) Varicella zoster virus: VZV causes zoster. E) Human immunodeficiency virus: HIV is a different virus.","Pox."],"im":[]},{"id":"Q177","ch":"Viral Infections","q":"Molluscum contagiosum is","o":[["A","A bacterial infection with vesicle as primary lesion."],["B","A mycobacterial infection transmitted by droplet."],["C","A fungal infection caused by a yeast."],["D","A parasitic infection with nocturnal itching."],["E","A viral infection caused by pox virus."]],"a":"E","sa":null,"pg":"30","f":[],"n":52,"e":["Molluscum contagiosum is a viral infection by pox virus, spread by skin contact; it is considered an STD when genital. Why the other options are wrong: A) A bacterial infection with vesicle as pr…: It is viral. B) A mycobacterial infection transmitted by…: Molluscum is a poxvirus infection, not mycobacterial, fungal or parasitic. C) A fungal infection caused by a yeast: Molluscum is a poxvirus infection, not mycobacterial, fungal or parasitic. D) A parasitic infection with nocturnal itc…: Molluscum is a poxvirus infection, not mycobacterial, fungal or parasitic.","Pox virus."],"im":[]},{"id":"Q178","ch":"Viral Infections","q":"(Clinical photo: close-up of skin with multiple small umbilicated, pearly papules.) The causative organism is","o":[["A","β-haemolytic Streptococci."],["B","Staphylococcus aureus."],["C","Human papilloma virus."],["D","Pox virus."],["E","Herpes simplex virus."]],"a":"D","sa":null,"pg":"30","f":[],"n":53,"e":["Pox virus is the cause of the umbilicated pearly papules of molluscum contagiosum. Why the other options are wrong: A) β-haemolytic Streptococci: Strep causes impetigo. B) Staphylococcus aureus: Staph causes boils. C) Human papilloma virus: HPV causes warts. E) Herpes simplex virus: HSV causes vesicles.","Pox."],"im":[]},{"id":"Q179","ch":"Viral Infections","q":"The primary lesion of molluscum contagiosum is","o":[["A","Macule."],["B","Papule."],["C","Plaque."],["D","Vesicle."],["E","Pustule."]],"a":"B","sa":null,"pg":"30","f":[],"n":54,"e":["The primary lesion of molluscum is a firm, pearly white, umbilicated papule with a waxy surface from which white cheesy material can be expressed. Why the other options are wrong: A) Macule: Molluscum lesions are solid, dome-shaped, umbilicated pearly papules, not this lesion. C) Plaque: Molluscum lesions are solid, dome-shaped, umbilicated pearly papules, not this lesion. D) Vesicle: Molluscum lesions are solid, dome-shaped, umbilicated pearly papules, not this lesion. E) Pustule: Molluscum lesions are solid, dome-shaped, umbilicated pearly papules, not this lesion.","Papule."],"im":[]},{"id":"Q180","ch":"Viral Infections","q":"A pearly papule with central umbilication exuding cheesy material is typical of","o":[["A","Molluscum contagiosum."],["B","Plane wart."],["C","Varicella."],["D","Condyloma acuminata."],["E","Seborrheic keratosis."]],"a":"A","sa":null,"pg":"30","f":[],"n":55,"e":["A pearly papule with central umbilication and cheesy material is molluscum contagiosum. Why the other options are wrong: B) Plane wart: Plane warts are flat. C) Varicella: Varicella is vesicular. D) Condyloma acuminata: Condyloma is cauliflower. E) Seborrheic keratosis: Seborrheic keratosis is greasy.","Umbilicated."],"im":[]},{"id":"Q181","ch":"Viral Infections","q":"Molluscum contagiosum lesions are","o":[["A","Painful grouped vesicles on an erythematous base."],["B","Firm umbilicated pearly white papules expressing white cheesy material."],["C","Thick endophytic tender papules on the palms and soles."],["D","Annular scaly patches with central clearing."],["E","Deep nodules with sinus tracts."]],"a":"B","sa":null,"pg":"30","f":[],"n":56,"e":["Molluscum lesions are firm umbilicated pearly papules that express cheesy material. Why the other options are wrong: A) Painful grouped vesicles on an erythemat…: That is herpes. C) Thick endophytic tender papules on the p…: That is a plantar wart. D) Annular scaly patches with central clear…: That is tinea. E) Deep nodules with sinus tracts: That is a deep infection.","Curettage/expression."],"im":[]},{"id":"Q182","ch":"Viral Infections","q":"All of the following may be used in the treatment of molluscum contagiosum EXCEPT","o":[["A","Electrocautery."],["B","Carbolic acid."],["C","Cryotherapy."],["D","Steroids."],["E","Laser."]],"a":"D","sa":null,"pg":"31","f":[],"n":57,"e":["Molluscum is treated by curettage, cautery, cryotherapy, laser and chemicals, not steroids. Why the other options are wrong: A) Electrocautery: Electrocautery treats molluscum. B) Carbolic acid: Carbolic acid treats molluscum. C) Cryotherapy: Cryotherapy treats molluscum. E) Laser: Laser treats molluscum.","No steroids."],"im":[]},{"id":"Q183","ch":"Viral Infections","q":"Which of the following is a sexually transmitted disease?","o":[["A","Herpes zoster."],["B","Psoriasis vulgaris."],["C","Molluscum contagiosum."],["D","Lichen planus."],["E","Tinea versicolor."]],"a":"C","sa":null,"pg":"30","f":[],"n":58,"e":["Molluscum contagiosum is considered a sexually transmitted disease if it involves genital skin or mucosa, spread by direct contact. Why the other options are wrong: A) Herpes zoster: Zoster is reactivation. B) Psoriasis vulgaris: Psoriasis is not infectious. D) Lichen planus: LP is not infectious. E) Tinea versicolor: Versicolor is not an STD.","Genital molluscum = STD."],"im":[]},{"id":"Q184","ch":"Viral Infections","q":"The following may be sexually transmitted","o":[["A","Psoriasis."],["B","Lichen planus."],["C","Warts."],["D","Eczema."],["E","Vitiligo."]],"a":"C","sa":null,"pg":"28","f":[],"n":59,"e":["Genital warts (condyloma acuminata) are sexually transmitted HPV infections. Why the other options are wrong: A) Psoriasis: Psoriasis is not infectious. B) Lichen planus: LP is not infectious. D) Eczema: Eczema is not infectious. E) Vitiligo: Vitiligo is not infectious.","Genital warts STD."],"im":[]},{"id":"Q185","ch":"Viral Infections","q":"Which of the following is a sexually transmitted skin disease?","o":[["A","Herpes progenitalis."],["B","Condyloma acuminata."],["C","Molluscum contagiosum."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"30","f":[],"n":60,"e":["Herpes progenitalis, condyloma acuminata and molluscum contagiosum are all sexually transmitted skin diseases. Why the other options are wrong: A) Herpes progenitalis: Herpes progenitalis (HSV-2) is sexually transmitted. True, but B and C also can be. B) Condyloma acuminata: Condyloma acuminata (HPV) is sexually transmitted. True, but A and C also can be. C) Molluscum contagiosum: Genital molluscum is sexually transmitted in adults. True, but A and B also are. E) None of the above: Wrong: all three can be sexually transmitted.","All of the above."],"im":[]},{"id":"Q186","ch":"Viral Infections","q":"All of the following diseases may be sexually transmitted EXCEPT","o":[["A","Scabies."],["B","Molluscum contagiosum."],["C","Condyloma acuminata."],["D","Eczema herpeticum."],["E","Herpes progenitalis."]],"a":"D","sa":null,"pg":"23","f":[],"n":61,"e":["Eczema herpeticum is a complication of HSV in atopic skin, not an STD itself. Why the other options are wrong: A) Scabies: Scabies is sexually transmissible. B) Molluscum contagiosum: Molluscum is transmissible. C) Condyloma acuminata: Condyloma is an STD. E) Herpes progenitalis: Herpes progenitalis is an STD.","Eczema herpeticum = atopics."],"im":[]},{"id":"Q187","ch":"Viral Infections","q":"Choose the correct statement","o":[["A","Lichen planus is caused by pox virus"],["B","The treatment of choice of discoid lupus erythematosus is PUVA"],["C","Herald patch is the primary lesion of urticaria"],["D","Molluscum contagiosum is a sexually transmitted disease"],["E","Alopecia areata is a form of cicatricial alopecia"]],"a":"D","sa":null,"pg":"30","f":[],"n":62,"e":["Per the book, molluscum contagiosum involving genital skin is a sexually transmitted disease; it spreads by skin-to-skin contact and rarely fomites. Why the other options are wrong: A) Lichen planus is caused by pox virus: LP is not viral. B) The treatment of choice of discoid lupus…: DLE is treated by antimalarials. C) Herald patch is the primary lesion of ur…: Herald patch is of PR. E) Alopecia areata is a form of cicatricial…: AA is non-scarring.","Adult molluscum is sexually transmissible."],"im":[]},{"id":"Q537","ch":"Viral Infections","q":"Mucous membranes may be affected in:","o":[["A","Papular urticaria."],["B","Actinic lichen planus."],["C","Scabies."],["D","Chickenpox."],["E","None of the above."]],"a":"D","sa":null,"pg":"24","f":[],"n":63,"e":["Chickenpox produces vesicles that also appear on the oral mucosa (enanthem). Papular urticaria is an insect-bite hypersensitivity limited to skin, scabies spares mucous membranes, and actinic lichen planus (sun-exposed skin) does not typically involve them. Why the other options are wrong: A) Papular urticaria: Papular urticaria spares mucosa. B) Actinic lichen planus: Actinic LP is on sun-exposed skin. C) Scabies: Scabies spares mucosa. E) None of the above: Chickenpox does involve mucosa.","Mucosa: chickenpox, herpes simplex, classic lichen planus, DLE; not papular urticaria or scabies."],"im":[]},{"id":"Q538","ch":"Viral Infections","q":"The proper dose of oral acyclovir in the treatment of herpes zoster is:","o":[["A","200 mg 5 times daily."],["B","400 mg 3 times daily."],["C","800 mg 5 times daily."],["D","800 mg 3 times daily."]],"a":"C","sa":null,"pg":"27","f":[],"n":64,"e":["The dose of oral acyclovir for herpes zoster is 800 mg five times daily for 7 days, started within 48-72 hours of the rash. 200 mg five times daily is the herpes simplex dose, which is why the lower options are wrong. Why the other options are wrong: A) 200 mg 5 times daily: Too low. B) 400 mg 3 times daily: Not the zoster dose. D) 800 mg 3 times daily: Too infrequent.","Zoster: 800 mg × 5/day × 7 days. Herpes simplex: 200 mg × 5/day."],"im":[]},{"id":"H079","ch":"Viral Infections","q":"One attack gives solid immunity for:","o":[["A","Herpes simplex."],["B","Herpes zoster."],["C","Scabies."],["D","Impetigo."],["E","Molluscum contagiosum."]],"a":"B","sa":null,"pg":null,"f":["The book notes zoster can recur; the key treats one attack as giving solid immunity. Please verify."],"n":65,"e":["Herpes zoster usually gives solid lifelong immunity after one attack, unlike herpes simplex which recurs. Why the other options are wrong: A) Herpes simplex: HSV recurs. C) Scabies: Scabies can recur. D) Impetigo: Impetigo recurs. E) Molluscum contagiosum: Molluscum recurs.","Zoster rarely recurs."],"im":[]},{"id":"H082","ch":"Viral Infections","q":"ONE of the following statements about warts is CORRECT:","o":[["A","The primary lesion of common warts is a skin-colored macule."],["B","Condyloma acuminata is caused by Treponema pallidum."],["C","Warts occur on the skin, but not on mucous membranes."],["D","Cancer cervix is a complication of female genital warts."],["E","All types are painless."]],"a":"D","sa":null,"pg":null,"f":[],"n":66,"e":["Genital warts of oncogenic HPV types 16 and 18 can predispose to cervical dysplasia and carcinoma; common warts are hyperkeratotic papules, not macules, and Treponema pallidum causes syphilis. Why the other options are wrong: A) The primary lesion of common warts is a…: Macules are flat. B) Condyloma acuminata is caused by Trepone…: Treponema causes syphilis. C) Warts occur on the skin, but not on muco…: Warts occur on mucosa. E) All types are painless: Plantar warts are tender.","HPV 16/18 → cervix."],"im":[]},{"id":"H083","ch":"Viral Infections","q":"All of the following microorganisms have a predilection for neural tissue EXCEPT:","o":[["A","Varicella zoster virus."],["B","Human papilloma virus."],["C","Herpes simplex virus."],["D","Lepra bacilli."],["E","Pox virus."]],"a":"B & E","sa":null,"pg":null,"f":["Both B and E are accepted as correct answers."],"n":67,"e":["HPV is not neurotropic and pox virus also lacks neural predilection, so both B and E are correct answers. VZV, HSV and lepra bacilli do have neural predilection. Why the other options are wrong: A) Varicella zoster virus: VZV stays latent in dorsal root ganglia and causes zoster along a nerve. C) Herpes simplex virus: HSV stays latent in sensory ganglia and recurs along the nerve. D) Lepra bacilli: M. leprae invades Schwann cells, causing nerve damage.","Neurotropic: VZV, HSV, lepra."],"im":[]},{"id":"H084","ch":"Viral Infections","q":"Condyloma acuminatum:","o":[["A","Is herpes simplex virus infection of the genital area."],["B","Involves female genital areas only."],["C","Usually affect skin & mucous membranes of the genital area."],["D","Is an entirely benign lesion."],["E","Forms deep nodules in the genital area."]],"a":"C","sa":null,"pg":null,"f":[],"n":68,"e":["Condyloma acuminatum affects skin and mucous membranes of the genital area. Why the other options are wrong: A) Is herpes simplex virus infection of the…: It is HPV. B) Involves female genital areas only: It involves both sexes. D) Is an
