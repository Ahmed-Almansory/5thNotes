es tetracyclines or macrolides, and nodulocystic acne needs retinoids. C) Fluconazole: Fluconazole is antifungal. D) Acyclovir: Acyclovir is antiviral. E) Antihistamines: Acne is not histamine-mediated, so antihistamines do not treat it.","Isotretinoin."],"im":[]},{"id":"Q531","ch":"Acne Vulgaris","q":"An 18-year-old female patient has severe acne, with multiple inflammatory papules on her face and some even larger nodules and cysts. She tried many topical therapies with no lasting benefit. Which of the following is the most appropriate next step in management?","o":[["A","Radiotherapy."],["B","Phototherapy."],["C","Cryotherapy."],["D","Oral steroids."],["E","Oral retinoids."]],"a":"E","sa":null,"pg":"99","f":[],"n":31,"e":["Severe nodulocystic acne unresponsive to topical therapy needs oral retinoids; this drug is teratogenic, so pregnancy must be excluded and double contraception used. Why the other options are wrong: A) Radiotherapy: Radiotherapy has no role here; vitiligo is treated by stopping the autoimmune process and stimulating repigmentation (phototherapy, steroids, calcineurin inhibitors). B) Phototherapy: Phototherapy is not a standard acne treatment; failed topical therapy with nodulocystic lesions calls for oral retinoids. C) Cryotherapy: Cryotherapy is used for warts, not acne. D) Oral steroids: Oral steroids worsen.","Oral retinoid; teratogenic."],"im":[]},{"id":"Q532","ch":"Acne Vulgaris","q":"Choose the wrong answer","o":[["A","Retinoids are special derivatives of vitamin A."],["B","Retinoids could be used topically or orally."],["C","Retinoids increase keratinization of the orifice."],["D","Systemic retinoids should not be given to females in childbearing period."],["E","Retinoids are used in severe acne."]],"a":"C","sa":null,"pg":"99","f":[],"n":32,"e":["Retinoids (vitamin A derivatives) normalize keratinization; saying they increase keratinization of the follicle orifice is incorrect. Why the other options are wrong: A) Retinoids are special derivatives of vit…: Retinoids are vitamin A derivatives. B) Retinoids could be used topically or ora…: Retinoids are used topically (all cases) or orally (severe cases). D) Systemic retinoids should not be given t…: Oral retinoids are teratogenic: pregnancy test and double contraception are mandatory. E) Retinoids are used in severe acne: Oral retinoids are used in severe inflammatory, nodulocystic or scarring acne.","Normalize keratinization."],"im":[]},{"id":"Q533","ch":"Acne Vulgaris","q":"What is the systemic treatment of acne vulgaris?","o":[],"a":null,"sa":"Systemic antibiotics (tetracyclines, macrolides) and oral retinoids; also dapsone and antiandrogens/OCPs for females with hormonal disturbance","pg":"99","f":[],"n":33,"e":["Moderate or severe acne is treated with systemic antibiotics (tetracyclines, macrolides), oral retinoids and dapsone; females with hormonal causes get antiandrogens or OCPs.","Isotretinoin teratogenic."],"im":[]},{"id":"H316","ch":"Acne Vulgaris","q":"Acne vulgaris is:","o":[["A","An infectious disease."],["B","A disease affecting skin and mucous membranes."],["C","A disease of sweat glands."],["D","Treated by topical steroids."],["E","Treated by retinoids in its nodulocystic form."]],"a":"E","sa":null,"pg":null,"f":[],"n":34,"e":["Nodulocystic acne is severe inflammatory acne treated with oral retinoids (isotretinoin), because they reduce sebum, normalize keratinization and are anti-inflammatory. Why the other options are wrong: A) An infectious disease: Acne is multifactorial (keratinization, sebum, Cutibacterium acnes); the bacterium is a skin commensal, not a contagious infection. B) A disease affecting skin and mucous memb…: Mucosa is spared. C) A disease of sweat glands: It is pilosebaceous. D) Treated by topical steroids: Steroids worsen.","Isotretinoin."],"im":[]},{"id":"H318","ch":"Acne Vulgaris","q":"All of the following are factors in acne pathogenesis EXCEPT:","o":[["A","Increase in sebum production."],["B","Change in sebum composition."],["C","Increase in the epidermal turnover."],["D","Distension of pilosebaceous follicle."],["E","Microbial colonization of pilosebaceous units."]],"a":"C","sa":null,"pg":null,"f":["Key says increased epidermal turnover is not a factor, but keratinocyte hyperproliferation contributes to comedone formation. Please verify."],"n":35,"e":["Pathogenesis includes increased sebum and altered composition, distension of the follicle, microbial colonization and increased keratinocyte proliferation. The key marks 'increase in epidermal turnover' as the exception, though hyperproliferation does occur; flagged. Why the other options are wrong: A) Increase in sebum production: A factor. B) Change in sebum composition: A factor. D) Distension of pilosebaceous follicle: A factor. E) Microbial colonization of pilosebaceous…: A factor.","Keratinization abnormality."],"im":[]},{"id":"H321","ch":"Acne Vulgaris","q":"Choose the wrong answer:","o":[["A","Retinoids are special derivatives of vitamin A."],["B","Retinoids could be used systemically or orally."],["C","Retinoids increase keratinization of the orifice."],["D","Systemic retinoids should not be given to females in childbearing period."],["E","Retinoids are used in severe acne."]],"a":"C","sa":null,"pg":null,"f":[],"n":36,"e":["Retinoids normalize follicular keratinization, so saying they increase it is wrong; they are derivatives of vitamin A used for severe acne, are teratogenic, and are used orally or topically. Why the other options are wrong: A) Retinoids are special derivatives of vit…: Retinoids are vitamin A derivatives. B) Retinoids could be used systemically or …: Retinoids can be applied topically (all cases) or taken orally (severe cases). D) Systemic retinoids should not be given t…: Oral retinoids are teratogenic: pregnancy test and double contraception are mandatory. E) Retinoids are used in severe acne: Oral retinoids are used in severe inflammatory, nodulocystic or scarring acne.","Retinoids normalize."],"im":[]},{"id":"H323","ch":"Acne Vulgaris","q":"Acne vulgaris:","o":[["A","Is cured by topical steroids."],["B","Is an infectious disease."],["C","Causes itching that increases at night."],["D","Is a disease of pilosebaceous unit."],["E","Characterized by vesicle formation."]],"a":"D","sa":null,"pg":null,"f":[],"n":37,"e":["Acne is a disease of the pilosebaceous unit, not of sweat glands and not infectious. Why the other options are wrong: A) Is cured by topical steroids: Steroids worsen. B) Is an infectious disease: Acne is multifactorial (keratinization, sebum, Cutibacterium acnes); the bacterium is a skin commensal, not a contagious infection. C) Causes itching that increases at night: It is not itchy. E) Characterized by vesicle formation: Acne lesions are comedones, papules, pustules, nodules and cysts; vesicles belong to viral or eczematous diseases.","Pilosebaceous."],"im":[]},{"id":"H324","ch":"Acne Vulgaris","q":"Case 5 A female patient, 21 years old, single, presented with facial lesions. She stated that it all started since she was 15 years old with remissions and exacerbations. Lesions exacerbated during her menstruation. Patient's face was oily. 9) This patient suffers from:","o":[["A","Actinic lichen."],["B","Furuncles."],["C","Acne vulgaris."],["D","Impetigo of Bockhart."],["E","Systemic lupus."]],"a":"C","sa":null,"pg":null,"f":[],"n":38,"e":["Facial lesions from age 15 with menstrual flares and oily skin indicate acne vulgaris (androgen-driven sebum). Why the other options are wrong: A) Actinic lichen: Actinic LP is violaceous. B) Furuncles: Furuncles are single. D) Impetigo of Bockhart: Bockhart is infectious. E) Systemic lupus: SLE is photosensitive.","Premenstrual flare."],"im":[]},{"id":"H328","ch":"Acne Vulgaris","q":"The following drugs may be used in the treatment of acne EXCEPT:","o":[["A","Retinoids."],["B","Dapsone."],["C","Tetracyclines."],["D","Androgens."],["E","Steroids."]],"a":"D","sa":null,"pg":null,"f":[],"n":39,"e":["Retinoids, dapsone, tetracyclines and steroids (intralesional) may be used; androgens increase sebum and worsen acne. Why the other options are wrong: A) Retinoids: Retinoids are used topically and orally in acne. B) Dapsone: Dapsone is used for severe inflammatory and nodulocystic acne. C) Tetracyclines: Tetracyclines are used systemically for moderate to severe acne. E) Steroids: Intralesional or short oral steroid courses are used selectively for severe inflammatory lesions; androgens, in contrast, increase sebum production.","Androgens worsen acne."],"im":[]},{"id":"H329","ch":"Acne Vulgaris","q":"Benzoyl peroxide is used in the treatment of:","o":[["A","Animal scabies."],["B","Pediculosis capitis."],["C","Phthirus pubis."],["D","Acne vulgaris"]],"a":"D","sa":null,"pg":null,"f":[],"n":40,"e":["Benzoyl peroxide 2.5-10% is a bactericidal topical agent for acne vulgaris without bacterial resistance. Why the other options are wrong: A) Animal scabies: Scabies uses permethrin. B) Pediculosis capitis: Pediculosis uses permethrin. C) Phthirus pubis: Phthirus uses permethrin.","BPO."],"im":[]},{"id":"H331","ch":"Acne Vulgaris","q":"In acne vulgaris:","o":[["A","There is loss of melanocytes."],["B","Benzyl benzoate is an effective topical agent."],["C","There is colonization of pilosebaceous units by Propionibacterium acnes."],["D","Lesions include comedones, pustules, vesicles and nodulocysts."],["E","Retinoids could be used topically or orally."]],"a":"E","sa":null,"pg":null,"f":[],"n":41,"e":["Retinoids can be used topically for mild-moderate acne and orally for severe disease. Why the other options are wrong: A) There is loss of melanocytes: Melanocytes are intact. B) Benzyl benzoate is an effective topical …: Benzyl benzoate is for scabies. C) There is colonization of pilosebaceous u…: The organism is P. acnes. D) Lesions include comedones, pustules, ves…: Acne lesions are comedones, papules, pustules, nodules and cysts; vesicles belong to viral or eczematous diseases.","Topical or oral."],"im":[]},{"id":"K001","ch":"⭐ Key Ideas — each idea once","q":"The outermost structure in the skin is the:","o":[["A","Epidermis."],["B","Dermis."],["C","Hypodermis."],["D","Basement membrane."],["E","Collagen."]],"a":"A","sa":null,"pg":"2","f":[],"n":1,"e":["The epidermis is the superficial layer of the skin, lying above the basement membrane, dermis and hypodermis. Why the other options are wrong: B) Dermis: The dermis lies beneath the epidermis, so it is not outermost. C) Hypodermis: The hypodermis is the deepest layer. D) Basement membrane: The basement membrane is the junction between epidermis and dermis, below the epidermis. E) Collagen: Collagen is a dermal protein, not a skin layer.","Outside → inside: epidermis, dermis, hypodermis."],"im":[],"src":"Q001"},{"id":"K002","ch":"⭐ Key Ideas — each idea once","q":"Main cells of the epidermis are:","o":[["A","Fibroblasts, keratinocytes, melanocytes."],["B","Keratinocytes, melanocytes, Langerhans cells."],["C","Keratinocytes, lymphocytes, Langerhans cells."],["D","Melanocytes, keratinocytes, endothelial cells."],["E","Keratinocytes, melanocytes, lymphocytes."]],"a":"B","sa":null,"pg":"2","f":[],"n":2,"e":["The epidermis is made mainly of keratinocytes (the majority), with melanocytes (pigment) and Langerhans cells (immune) as the other main cells. Fibroblasts, endothelial cells and lymphocytes belong to the dermis or vessels. Why the other options are wrong: A) Fibroblasts, keratinocytes, melanocytes: Fibroblasts are dermal cells, not epidermal. C) Keratinocytes, lymphocytes, Langerhans c…: Lymphocytes are not resident epidermal cells in the main list. D) Melanocytes, keratinocytes, endothelial…: Endothelial cells line dermal vessels. E) Keratinocytes, melanocytes, lymphocytes: Lymphocytes are not a main epidermal cell.","Keratinocyte = structure, melanocyte = pigment, Langerhans = immunity."],"im":[],"src":"Q002"},{"id":"K003","ch":"⭐ Key Ideas — each idea once","q":"Starting from below upwards, the cell layers of the epidermis are:","o":[["A","Granular, basal, squamous, and horny cell layers."],["B","Horny, granular, squamous, and basal cell layers."],["C","Basal, granular, squamous, and horny cell layers."],["D","Basal, squamous, granular, and horny cell layers."],["E","Basal, horny, granular, and squamous cell layers."]],"a":"D","sa":null,"pg":"2","f":[],"n":3,"e":["From the basement membrane upward: basal → squamous (prickle) → granular → horny (stratum corneum); a clear layer (lucidum) exists only in palms and soles. Why the other options are wrong: A) Granular, basal, squamous, and horny cel…: Basal is the lowest layer, not second from the top of the list. B) Horny, granular, squamous, and basal cel…: This is the reverse (top to bottom) order. C) Basal, granular, squamous, and horny cel…: The granular layer lies above the squamous (prickle) layer. E) Basal, horny, granular, and squamous cel…: The horny layer is the top, not second.","Mnemonic: B-S-G-H (Basal, Spinous, Granular, Horny)."],"im":[],"src":"Q004"},{"id":"K004","ch":"⭐ Key Ideas — each idea once","q":"The stratum corneum is composed of:","o":[["A","Melanin."],["B","Granules."],["C","Keratin cells."],["D","Squamous cells."],["E","Basal cells."]],"a":"C","sa":null,"pg":"2","f":[],"n":4,"e":["The stratum corneum consists of flattened, anucleate keratinized cells (corneocytes) packed with keratin. Why the other options are wrong: A) Melanin: Melanin is a pigment, not the content of the horny layer. B) Granules: Granules belong to the granular layer. D) Squamous cells: Squamous cells are in the spinous layer. E) Basal cells: Basal cells are the deepest layer.","Corneocytes = dead keratin-filled cells."],"im":[],"src":"Q007"},{"id":"K005","ch":"⭐ Key Ideas — each idea once","q":"The layer of the skin responsible for renewal of the epidermis is:","o":[["A","Horny cell layer."],["B","Granular cell layer."],["C","Squamous cell layer."],["D","Basal cell layer."],["E","Dermis."]],"a":"D","sa":null,"pg":"2","f":[],"n":5,"e":["The basal layer contains the germinative (stem) keratinocytes that divide continuously and replace the epidermis (turnover about 28 days). Why the other options are wrong: A) Horny cell layer: The horny layer sheds dead cells. B) Granular cell layer: The granular layer is a differentiating layer. C) Squamous cell layer: The squamous layer cells are maturing, not stem cells. E) Dermis: The dermis is a different layer, not epidermis.","Basal = renewal; psoriasis speeds up its turnover."],"im":[],"src":"Q008"},{"id":"K006","ch":"⭐ Key Ideas — each idea once","q":"The immune function of the skin is mediated by:","o":[["A","Melanocytes."],["B","Langerhans cells."],["C","Elastic fibres."],["D","Pacinian corpuscles."],["E","Keratinocytes."]],"a":"B","sa":null,"pg":"2","f":[],"n":6,"e":["Langerhans cells are antigen-presenting dendritic cells in the epidermis and carry the skin's immune function. Pacinian corpuscles sense pressure/vibration, not immunity. Why the other options are wrong: A) Melanocytes: Melanocytes make pigment. C) Elastic fibres: Elastic fibres give recoil. D) Pacinian corpuscles: Pacinian corpuscles sense pressure. E) Keratinocytes: Keratinocytes are structural.","Langerhans = immune; Merkel = touch; melanocyte = pigment."],"im":[],"src":"Q010"},{"id":"K007","ch":"⭐ Key Ideas — each idea once","q":"Skin appendages include:","o":[["A","Nails, hair follicles, sebaceous glands & blood vessels."],["B","Hair follicles, nails, sweat glands & lymphatics."],["C","Sebaceous glands, sweat glands & nerve corpuscles."],["D","Sweat glands, nails, nerve corpuscles & hair follicles."],["E","Sweat glands, nails, hair follicles & sebaceous glands."]],"a":"E","sa":null,"pg":"3","f":[],"n":7,"e":["Appendages are epidermal derivatives: hair follicles, sebaceous glands, sweat glands (eccrine and apocrine) and nails. Blood vessels, lymphatics and nerve corpuscles are not appendages. Why the other options are wrong: A) Nails, hair follicles, sebaceous glands…: Blood vessels are not appendages. B) Hair follicles, nails, sweat glands & ly…: Lymphatics are not appendages. C) Sebaceous glands, sweat glands & nerve c…: Nerve corpuscles are not appendages. D) Sweat glands, nails, nerve corpuscles &…: Nerve corpuscles are not appendages.","Appendages = hair, nails, glands."],"im":[],"src":"Q011"},{"id":"K008","ch":"⭐ Key Ideas — each idea once","q":"The pilosebaceous unit is composed of:","o":[["A","Apocrine gland and sebaceous gland."],["B","Hair and sebaceous gland."],["C","Skin and sebaceous gland."],["D","Hair and apocrine gland."],["E","Hair and hair follicle."]],"a":"B","sa":null,"pg":"3","f":[],"n":8,"e":["The pilosebaceous unit is the hair follicle with its attached sebaceous gland; it is the site of acne. Why the other options are wrong: A) Apocrine gland and sebaceous gland: Apocrine glands are separate. C) Skin and sebaceous gland: Skin is too general. D) Hair and apocrine gland: The apocrine gland is not part of the unit. E) Hair and hair follicle: Hair and follicle are one structure.","Pilosebaceous unit = acne site."],"im":[],"src":"Q015"},{"id":"K009","ch":"⭐ Key Ideas — each idea once","q":"The skin appendages responsible for body temperature control are known as:","o":[["A","Eccrine sweat glands."],["B","Sebaceous glands."],["C","Pilosebaceous units."],["D","Hair follicles."],["E","Mast cells."]],"a":"A","sa":null,"pg":"3","f":[],"n":9,"e":["Eccrine sweat glands are distributed over the whole body and cool it by evaporation of sweat. Apocrine glands are scent glands (axilla, groin). Why the other options are wrong: B) Sebaceous glands: Sebaceous glands secrete sebum. C) Pilosebaceous units: The pilosebaceous unit is the acne site. D) Hair follicles: Hair follicles produce hair. E) Mast cells: Mast cells are immune cells.","Eccrine = thermoregulation; apocrine = odor."],"im":[],"src":"Q016"},{"id":"K010","ch":"⭐ Key Ideas — each idea once","q":"The following is a function of the skin:","o":[["A","Defense against external pathogens."],["B","Temperature control."],["C","Sensations."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"3","f":[],"n":10,"e":["The skin defends against pathogens, controls temperature and carries sensation, so 'all of the above' is correct. Why the other options are wrong: A) Defense against external pathogens: True, but incomplete alone. B) Temperature control: True, but incomplete alone. C) Sensations: True, but incomplete alone. E) None of the above: Wrong: all are skin functions.","Skin functions: protection, thermoregulation, sensation, excretion, vitamin D synthesis, immunity."],"im":[],"src":"Q017"},{"id":"K011","ch":"⭐ Key Ideas — each idea once","q":"Functions of the skin include:","o":[["A","Prevention of water and electrolyte loss."],["B","Excretion of sweat."],["C","Formation of vitamin D."],["D","Immunologic function via Langerhans cells."],["E","All of the above."]],"a":"E","sa":null,"pg":"3","f":[],"n":11,"e":["Protection, thermoregulation, sensation, excretion, immunity and vitamin D synthesis are all skin functions. Why the other options are wrong: A) Prevention of water and electrolyte loss: True, but not the only function. B) Excretion of sweat: True, but not the only function. C) Formation of vitamin D: True, but not the only function. D) Immunologic function via Langerhans cells: True, but not the only function.","Skin is a multifunctional organ."],"im":[],"src":"Q018"},{"id":"K012","ch":"⭐ Key Ideas — each idea once","q":"The skin is considered:","o":[["A","An endocrine organ."],["B","A secretory organ."],["C","A defensive organ."],["D","An excretory organ."],["E","All of the above."]],"a":"E","sa":null,"pg":"3","f":[],"n":12,"e":["The skin is protective, secretory (sebum, sweat), excretory (sweat) and endocrine (vitamin D synthesis), so 'all of the above'. Why the other options are wrong: A) An endocrine organ: True, but incomplete alone. B) A secretory organ: True, but incomplete alone. C) A defensive organ: True, but incomplete alone. D) An excretory organ: True, but incomplete alone.","Skin makes vitamin D under UVB."],"im":[],"src":"Q019"},{"id":"K013","ch":"⭐ Key Ideas — each idea once","q":"One of the following statements is correct:","o":[["A","The melanocyte is the main cell of the epidermis."],["B","The skin has an endocrinal function."],["C","The basal cells of the epidermis are squamous."],["D","The sebaceous glands open directly onto the skin surface."],["E","Laminated keratin is called crust."]],"a":"B","sa":null,"pg":"3","f":[],"n":13,"e":["The skin has an endocrine function: UVB converts 7-dehydrocholesterol into vitamin D3. It is not a purely excretory organ. Why the other options are wrong: A) The melanocyte is the main cell of the e…: The keratinocyte is the main cell. C) The basal cells of the epidermis are squ…: Basal cells are columnar/cuboidal, not squamous. D) The sebaceous glands open directly onto…: Sebaceous glands open into the follicle. E) Laminated keratin is called crust: Laminated keratin is a scale, not a crust.","Skin = vitamin D factory."],"im":[],"src":"Q020"},{"id":"K014","ch":"⭐ Key Ideas — each idea once","q":"All of the following are primary lesions EXCEPT:","o":[["A","Macule."],["B","Nodule."],["C","Plaque."],["D","Vesicle."],["E","Crust."]],"a":"E","sa":null,"pg":"8","f":[],"n":14,"e":["Primary lesions arise first (macule, papule, plaque, nodule, vesicle, bulla, pustule, wheal, cyst). A crust is a secondary lesion formed from dried exudate. Why the other options are wrong: A) Macule: The macule is a primary lesion. B) Nodule: The nodule is primary. C) Plaque: The plaque is primary. D) Vesicle: The vesicle is primary.","Crust, scale, erosion, ulcer, scar are secondary lesions."],"im":[],"src":"Q021"},{"id":"K015","ch":"⭐ Key Ideas — each idea once","q":"Macule is:","o":[["A","A localized collection of fluid."],["B","A solid elevation of the skin less than 0.5 cm in diameter."],["C","A tunnel in the epidermis produced by female Sarcoptes scabiei."],["D","Dried serum, blood or pus on the skin surface."],["E","A circumscribed non-palpable area of skin discoloration less than 1 cm in diameter."]],"a":"E","sa":null,"pg":"4","f":[],"n":15,"e":["A macule is non-palpable discoloration less than 1 cm; the same change over 1 cm is a patch. Why the other options are wrong: A) A localized collection of fluid: That describes a vesicle or bulla. B) A solid elevation of the skin less than…: That describes a papule. C) A tunnel in the epidermis produced by fe…: That describes a burrow. D) Dried serum, blood or pus on the skin su…: That describes a crust.","Macule <1 cm; patch >1 cm."],"im":[],"src":"Q023"},{"id":"K016","ch":"⭐ Key Ideas — each idea once","q":"Patch is a:","o":[["A","Flat, circumscribed non-palpable area of skin discoloration <1 cm in diameter."],["B","Flat, circumscribed non-palpable area of skin discoloration >1 cm in diameter."],["C","Circumscribed solid elevation of skin <1 cm in diameter."],["D","Circumscribed solid elevation of skin >1 cm in diameter having a deep component."],["E","Increased epidermal thickness."]],"a":"B","sa":null,"pg":"4","f":[],"n":16,"e":["A patch is the larger version of a macule: flat, non-palpable color change more than 1 cm in diameter, e.g. vitiligo or versicolor patches. Why the other options are wrong: A) Flat, circumscribed non-palpable area of…: The same wording for a macule (size under 1 cm). C) Circumscribed solid elevation of skin <1…: That is a papule. D) Circumscribed solid elevation of skin >1…: That is a nodule or plaque. E) Increased epidermal thickness: That is hyperkeratosis or lichenification.","Macule <1 cm; patch >1 cm."],"im":[],"src":"Q024"},{"id":"K017","ch":"⭐ Key Ideas — each idea once","q":"Papule is:","o":[["A","A solid elevation less than 1 cm in diameter."],["B","A fluid collection."],["C","An area of depigmented skin."],["D","A tunnel in the epidermis."]],"a":"A","sa":null,"pg":null,"f":[],"n":17,"e":["A papule is a solid elevation smaller than 1 cm in diameter; fluid-filled lesions are vesicles. Why the other options are wrong: B) A fluid collection: That is a vesicle or bulla. C) An area of depigmented skin: That is a patch of vitiligo. D) A tunnel in the epidermis: That is a burrow.","Papule = solid and small."],"im":[],"src":"Q026"},{"id":"K018","ch":"⭐ Key Ideas — each idea once","q":"A plaque is:","o":[["A","An abnormal change of skin texture."],["B","An area of depigmentation."],["C","The primary lesion of acne vulgaris."],["D","A localized epidermal collection of fluid."],["E","A deroofed burrow."]],"a":"A","sa":null,"pg":"5","f":[],"n":18,"e":["Per the department book, a plaque is a palpable area of abnormal skin texture; it is a flat-topped elevation larger than 1 cm, as in psoriasis. Why the other options are wrong: B) An area of depigmentation: That is vitiligo (patch). C) The primary lesion of acne vulgaris: The primary lesion of acne is the comedone. D) A localized epidermal collection of fluid: That is a vesicle or bulla. E) A deroofed burrow: That is a furrow.","Plaque = large, flat-topped; psoriasis."],"im":[],"src":"Q030"},{"id":"K019","ch":"⭐ Key Ideas — each idea once","q":"From the list below, select the most appropriate definition of a nodule:","o":[["A","Well-defined flat area of altered pigmentation."],["B","Raised well-defined lesion usually less than 0.5 cm in diameter."],["C","Raised flat-topped lesion usually greater than 2 cm in diameter."],["D","Solid lump greater than 1 cm in diameter; may be subcutaneous or intradermal."],["E","Well-defined pus-filled lesion."]],"a":"D","sa":null,"pg":"5","f":[],"n":19,"e":["A nodule is a solid lump over 1 cm that may be intradermal or subcutaneous. Why the other options are wrong: A) Well-defined flat area of altered pigmen…: That is a patch. B) Raised well-defined lesion usually less…: That is a papule. C) Raised flat-topped lesion usually greate…: That is a plaque. E) Well-defined pus-filled lesion: That is a pustule.","Nodule = deep lump >1 cm."],"im":[],"src":"Q036"},{"id":"K020","ch":"⭐ Key Ideas — each idea once","q":"Evanescent elevations of the skin caused by edema of the dermis are:","o":[["A","Macules."],["B","Papules."],["C","Wheals."],["D","Nodules."],["E","Crusts."]],"a":"C","sa":null,"pg":"6","f":[],"n":20,"e":["Wheals are transient (evanescent) edematous elevations from dermal edema, typical of urticaria. Why the other options are wrong: A) Macules: A macule is flat. B) Papules: A papule is persistent. D) Nodules: A nodule is persistent. E) Crusts: A crust is dry.","Wheal lasts <24 h."],"im":[],"src":"Q037"},{"id":"K021","ch":"⭐ Key Ideas — each idea once","q":"A vesicle can be differentiated from a bulla by:","o":[["A","Its size."],["B","Its location."],["C","Having a wall."],["D","Its content."],["E","Its color."]],"a":"A","sa":null,"pg":"6","f":[],"n":21,"e":["A vesicle is a fluid-filled blister under 0.5 cm; a bulla is larger than 0.5 cm. They differ by size. Why the other options are wrong: B) Its location: Both can be anywhere. C) Having a wall: Neither has a wall. D) Its content: Both contain fluid. E) Its color: Both are clear.","Vesicle <0.5 cm; bulla >0.5 cm."],"im":[],"src":"Q041"},{"id":"K022","ch":"⭐ Key Ideas — each idea once","q":"The main difference between a cyst and a bulla is:","o":[["A","The cyst has a wall, while the bulla doesn't."],["B","The cyst is <0.5 cm, while the bulla is >0.5 cm in diameter."],["C","The cyst contains purulent fluid, while the bulla contains clear fluid."],["D","The cyst is a solid structure, while the bulla contains fluid."],["E","The cyst is a primary lesion, while the bulla is a secondary lesion."]],"a":"A","sa":null,"pg":"7","f":[],"n":22,"e":["A cyst has a wall (epithelial lining) whereas a bulla is a fluid collection within or under the epidermis without a wall. Why the other options are wrong: B) The cyst is <0.5 cm, while the bulla is…: Size is not the difference. C) The cyst contains purulent fluid, while…: Content is not the difference. D) The cyst is a solid structure, while the…: A cyst contains fluid or semi-solid, not solid. E) The cyst is a primary lesion, while the…: Both are primary.","Cyst = wall; bulla = no wall."],"im":[],"src":"Q043"},{"id":"K023","ch":"⭐ Key Ideas — each idea once","q":"Burrow is:","o":[["A","A localized collection of fluid."],["B","A linear elevation of the skin produced by mites."],["C","The primary lesion of urticaria."],["D","Located in the dermis."],["E","An area of depigmented skin."]],"a":"B","sa":null,"pg":"7","f":[],"n":23,"e":["A burrow is a linear, slightly elevated track just under the stratum corneum, dug by the fertilized female Sarcoptes scabiei mite, which lays 2-3 eggs a day. Why the other options are wrong: A) A localized collection of fluid: A vesicle is fluid. C) The primary lesion of urticaria: Urticaria produces wheals. D) Located in the dermis: Burrows are epidermal. E) An area of depigmented skin: That is a patch.","Burrow = scabies sign."],"im":[],"src":"Q046"},{"id":"K024","ch":"⭐ Key Ideas — each idea once","q":"Dried exudate on the surface of the skin is a:","o":[["A","Scale."],["B","Crust."],["C","Bulla."],["D","Plaque."],["E","Burrow."]],"a":"B","sa":null,"pg":"8","f":[],"n":24,"e":["A crust is dried serum, blood or pus on the skin surface, a secondary lesion. Scales are keratin; erosion and ulcers are tissue losses. Why the other options are wrong: A) Scale: Scale is keratin. C) Bulla: A bulla is fluid. D) Plaque: A plaque is a solid elevation. E) Burrow: A burrow is a tunnel.","Crust = dried exudate; scale = keratin."],"im":[],"src":"Q048"},{"id":"K025","ch":"⭐ Key Ideas — each idea once","q":"An accumulation of keratin due to increased proliferation or decreased desquamation is:","o":[["A","Fissure."],["B","Crust."],["C","Excoriation."],["D","Scale."],["E","Lichenification."]],"a":"D","sa":null,"pg":"8","f":[],"n":25,"e":["Scales result from increased epidermal proliferation (psoriasis) or decreased desquamation (ichthyosis). Why the other options are wrong: A) Fissure: A fissure is a linear crack. B) Crust: A crust is dried exudate. C) Excoriation: An excoriation is a scratch. E) Lichenification: Lichenification is thickening.","Scale = excess keratin."],"im":[],"src":"Q051"},{"id":"K026","ch":"⭐ Key Ideas — each idea once","q":"An erosion:","o":[["A","Is a loss of epidermis & dermis."],["B","Heals with a scar."],["C","Occurs after rupture of vesicles."],["D","Is a primary lesion."],["E","Is seen in psoriasis."]],"a":"C","sa":null,"pg":"9","f":[],"n":26,"e":["An erosion is a superficial loss of epidermis only; it follows rupture of vesicles or bullae and heals without a scar. Why the other options are wrong: A) Is a loss of epidermis & dermis: That is an ulcer. B) Heals with a scar: An erosion heals without scar. D) Is a primary lesion: It is secondary. E) Is seen in psoriasis: Psoriasis does not erode.","Erosion heals without scarring; ulcer scars."],"im":[],"src":"Q052"},{"id":"K027","ch":"⭐ Key Ideas — each idea once","q":"Accentuation of skin lines due to chronic itching is called?","o":[],"a":null,"sa":"Lichenification.","pg":"10","f":[],"n":27,"e":["Chronic scratching thickens the skin and exaggerates its lines, called lichenification.","Lichenification = chronic eczema."],"im":[],"src":"Q054"},{"id":"K028","ch":"⭐ Key Ideas — each idea once","q":"Which skin cell functions mainly as a mechanoreceptor detecting gentle touch and pressure?","o":[["A","Merkel cell."],["B","Melanocyte."],["C","Langerhans cell."],["D","Keratinocyte."]],"a":"A","sa":null,"pg":"2","f":[],"n":28,"e":["Merkel cells sit in the basal layer of the epidermis and act as slowly adapting mechanoreceptors for gentle touch and pressure. Melanocytes produce pigment, Langerhans cells provide immunity and keratinocytes build the barrier. Why the other options are wrong: B) Melanocyte: Melanocytes make pigment. C) Langerhans cell: Langerhans cells are immune cells. D) Keratinocyte: Keratinocytes form the barrier.","Merkel = touch; Langerhans = immunity; melanocyte = pigment."],"im":[],"src":"Q534"},{"id":"K029","ch":"⭐ Key Ideas — each idea once","q":"Cutaneous examination includes examination of:","o":[["A","Skin."],["B","Hair."],["C","Nails."],["D","Mucous membranes."],["E","All of the above."]],"a":"E","sa":null,"pg":null,"f":[],"n":29,"e":["A full cutaneous examination includes skin, hair, nails and mucous membranes. Why the other options are wrong: A) Skin: The skin is examined. True, but hair, nails and mucosae are too. B) Hair: The hair is examined. True, but others are too. C) Nails: The nails are examined. True, but others are too. D) Mucous membranes: Mucous membranes are examined. True, but others are too.","Always examine mucosa, hair and nails."],"im":[],"src":"H011"},{"id":"K030","ch":"⭐ Key Ideas — each idea once","q":"A furrow is:","o":[["A","A deroofed burrow."],["B","A roofed burrow."],["C","The primary lesion of scabies."],["D","A tunnel in the dermis."],["E","A tunnel in the SC tissue."]],"a":"A","sa":null,"pg":null,"f":[],"n":30,"e":["A furrow is the roof-less (deroofed) burrow left after the burrow roof is lost, as in scabies. Why the other options are wrong: B) A roofed burrow: A roofed burrow is a burrow. C) The primary lesion of scabies: The primary lesion of scabies is the burrow. D) A tunnel in the dermis: It is epidermal, not dermal. E) A tunnel in the SC tissue: It is epidermal, not subcutaneous.","Burrow = roofed; furrow = deroofed."],"im":[],"src":"H021"},{"id":"K031","ch":"⭐ Key Ideas — each idea once","q":"Impetigo may be caused by:","o":[["A","Herpes simplex virus."],["B","Mycobacterium leprae."],["C","Pox virus."],["D","Streptococci and staphylococci."],["E","Human papilloma virus."]],"a":"D","sa":null,"pg":"11","f":[],"n":31,"e":["Impetigo is a superficial infection caused by Staphylococcus aureus and/or group A beta-hemolytic streptococci. Why the other options are wrong: A) Herpes simplex virus: HSV is viral. B) Mycobacterium leprae: M. leprae causes leprosy. C) Pox virus: Pox virus causes molluscum. E) Human papilloma virus: HPV causes warts.","Non-bullous impetigo: staph ± strep."],"im":[],"src":"Q058"},{"id":"K032","ch":"⭐ Key Ideas — each idea once","q":"How does impetigo present?","o":[["A","Golden honey-colored crust over an erythematous base."],["B","Salmon-colored plaque with silvery scale."],["C","Comedones, pustules and nodules."],["D","Flesh-colored papule with a rough surface."],["E","Polyangular violaceous papule."]],"a":"A","sa":null,"pg":"12","f":[],"n":32,"e":["Impetigo contagiosa shows vesicles/pustules that rupture to leave golden honey-colored crusts on an erythematous base. Why the other options are wrong: B) Salmon-colored plaque with silvery scale: That is psoriasis. C) Comedones, pustules and nodules: That is acne. D) Flesh-colored papule with a rough surface: That is a wart. E) Polyangular violaceous papule: That is lichen planus.","Honey-colored crust = impetigo."],"im":[],"src":"Q059"},{"id":"K033","ch":"⭐ Key Ideas — each idea once","q":"Poststreptococcal glomerulonephritis is a complication of:","o":[["A","Herpes zoster."],["B","Herpes simplex."],["C","Bullous impetigo."],["D","Impetigo contagiosum."],["E","Impetigo of Bockhart."]],"a":"D","sa":null,"pg":"12","f":[],"n":33,"e":["Nephritogenic streptococcal strains in impetigo contagiosa can trigger post-streptococcal glomerulonephritis. Why the other options are wrong: A) Herpes zoster: Zoster does not trigger GN. B) Herpes simplex: HSV does not trigger GN. C) Bullous impetigo: Bullous impetigo is staph. E) Impetigo of Bockhart: Bockhart is staph folliculitis.","Skin strep → AGN."],"im":[],"src":"Q061"},{"id":"K034","ch":"⭐ Key Ideas — each idea once","q":"The following drug is used for treatment of honey-colored crusted lesions around the mouth after scratching insect bites:","o":[["A","Topical azole."],["B","Topical antibiotic."],["C","Oral fluconazole."],["D","Oral ivermectin."],["E","Topical permethrin."]],"a":"B","sa":null,"pg":"13","f":[],"n":34,"e":["Localized impetigo is treated with topical antibiotics (e.g. fusidic acid, mupirocin). Antifungals, ivermectin and permethrin do not treat bacteria. Why the other options are wrong: A) Topical azole: Azoles treat fungi. C) Oral fluconazole: Fluconazole treats fungi. D) Oral ivermectin: Ivermectin treats parasites. E) Topical permethrin: Permethrin treats scabies.","Localized impetigo → topical antibiotic."],"im":[],"src":"Q062"},{"id":"K035","ch":"⭐ Key Ideas — each idea once","q":"Bullous impetigo in neonates is due to:","o":[["A","Group A β-hemolytic streptococci exotoxin."],["B","Staphylococcus aureus exfoliative exotoxin."],["C","Corynebacterium toxin."],["D","Pseudomonas exotoxin."],["E","Clostridial toxin."]],"a":"B","sa":null,"pg":"12","f":[],"n":35,"e":["In neonates, S. aureus exfoliative toxins (ETA/ETB) cause the superficial blisters of bullous impetigo. Why the other options are wrong: A) Group A β-hemolytic streptococci exotoxin: Strep does not cause bullous impetigo. C) Corynebacterium toxin: Corynebacterium causes erythrasma. D) Pseudomonas exotoxin: Pseudomonas is not involved. E) Clostridial toxin: Clostridium is not involved.","Same toxin causes scalded skin syndrome."],"im":[],"src":"Q064"},{"id":"K036","ch":"⭐ Key Ideas — each idea once","q":"A male infant, 6 months old, presented with these lesions on his leg of one week duration. His mother stated that his elder sister had the same lesions. The condition was associated with fever. (Clinical photo: flaccid bullae/pustules with clear-yellow fluid on erythematous skin of the leg.) What is the diagnosis of this case?","o":[["A","Bullous impetigo."],["B","Herpes simplex."],["C","Pustular psoriasis."],["D","Crusted scabies."],["E","Acute eczema."]],"a":"A","sa":null,"pg":"12","f":[],"n":36,"e":["Flaccid blisters and crusts in an infant, with contact cases and fever, indicate bullous impetigo. Why the other options are wrong: B) Herpes simplex: HSV gives grouped vesicles. C) Pustular psoriasis: Pustular psoriasis is sterile. D) Crusted scabies: Crusted scabies is itchy and crusted. E) Acute eczema: Eczema is itchy.","Neonatal bullous impetigo is contagious."],"im":[],"src":"Q066"},{"id":"K037","ch":"⭐ Key Ideas — each idea once","q":"Ecthyma is:","o":[["A","Crusted impetigo."],["B","Ulcerative impetigo."],["C","Circinate impetigo."],["D","Bullous impetigo."],["E","Vesicular impetigo."]],"a":"B","sa":null,"pg":"13","f":[],"n":37,"e":["Ecthyma is the ulcerative (deeper) form of impetigo, extending to the dermis. Why the other options are wrong: A) Crusted impetigo: Crusted impetigo is non-bullous. C) Circinate impetigo: Circinate impetigo is another type. D) Bullous impetigo: Bullous impetigo has blisters. E) Vesicular impetigo: Vesicular impetigo is non-bullous.","Ecthyma = ulcerative impetigo."],"im":[],"src":"Q068"},{"id":"K038","ch":"⭐ Key Ideas — each idea once","q":"A 10-year-old male child has vesicles which turn into pustules with the formation of thick crusts that heal with scar formation on his legs. The most likely diagnosis is:","o":[["A","Sycosis barbae."],["B","Atopic dermatitis."],["C","Cellulitis."],["D","Ulcerative impetigo (ecthyma)."],["E","Molluscum contagiosum."]],"a":"D","sa":null,"pg":"13","f":[],"n":38,"e":["Vesicles turning to pustules with thick crusts that heal with scarring describe ulcerative impetigo (ecthyma). Why the other options are wrong: A) Sycosis barbae: Sycosis is beard folliculitis. B) Atopic dermatitis: Atopic dermatitis is eczema. C) Cellulitis: Cellulitis is subcutaneous. E) Molluscum contagiosum: Molluscum is viral.","Ecthyma scars; ordinary impetigo does not."],"im":[],"src":"Q072"},{"id":"K039","ch":"⭐ Key Ideas — each idea once","q":"Ulcerative impetigo (ecthyma) is treated by systemic:","o":[["A","Azoles."],["B","Antihistamines."],["C","Antibiotics."],["D","Steroids."],["E","Retinoids."]],"a":"C","sa":null,"pg":"13","f":[],"n":39,"e":["Ecthyma is deep and needs systemic antibiotics (anti-staphylococcal/anti-streptococcal) plus local care. Why the other options are wrong: A) Azoles: Azoles treat fungi. B) Antihistamines: Antihistamines treat itch. D) Steroids: Steroids worsen infection. E) Retinoids: Retinoids treat acne.","Ecthyma → oral antibiotics."],"im":[],"src":"Q073"},{"id":"K040","ch":"⭐ Key Ideas — each idea once","q":"Staphylococcal infection in the upper part of the hair follicle is known as:","o":[["A","Folliculitis."],["B","Sycosis barbae."],["C","Furuncle."],["D","Cellulitis."],["E","Carbuncle."]],"a":"A","sa":null,"pg":"13","f":[],"n":40,"e":["Staphylococcal infection of the upper (superficial) part of the follicle is folliculitis (Bockhart impetigo). Why the other options are wrong: B) Sycosis barbae: Sycosis involves the beard follicle. C) Furuncle: A furuncle is deep. D) Cellulitis: Cellulitis is subcutaneous. E) Carbuncle: A carbuncle is deep and multiple.","Folliculitis = superficial."],"im":[],"src":"Q076"},{"id":"K041","ch":"⭐ Key Ideas — each idea once","q":"Suppurative infection of the lower part of the hair follicle with central necrosis:","o":[["A","Carbuncle."],["B","Pustule."],["C","Furuncle."],["D","Folliculitis."],["E","Cellulitis."]],"a":"C","sa":null,"pg":"14","f":[],"n":41,"e":["A furuncle is a suppurative infection of the lower follicle with a central necrotic core ('core'). Why the other options are wrong: A) Carbuncle: Carbuncle is several boils. B) Pustule: A pustule is superficial. D) Folliculitis: Folliculitis is upper follicle. E) Cellulitis: Cellulitis is diffuse.","Furuncle = boil with core."],"im":[],"src":"Q078"},{"id":"K042","ch":"⭐ Key Ideas — each idea once","q":"Multiple deep boils opening on the skin surface by multiple fistulae is called:","o":[["A","Kerion."],["B","Sycosis."],["C","Furunculosis."],["D","Carbuncle."],["E","Cellulitis."]],"a":"D","sa":null,"pg":"14","f":[],"n":42,"e":["A carbuncle is a group of coalescing furuncles draining through multiple openings. Why the other options are wrong: A) Kerion: Kerion is fungal. B) Sycosis: Sycosis is superficial. C) Furunculosis: Furunculosis is multiple separate boils. E) Cellulitis: Cellulitis is diffuse.","Carbuncle = multiple furuncles, many openings."],"im":[],"src":"Q079"},{"id":"K043","ch":"⭐ Key Ideas — each idea once","q":"A 40-year-old diabetic male develops a large, indurated, tender plaque on the back of the neck with multiple pus-discharging openings. The most likely diagnosis is:","o":[["A","Furuncle."],["B","Abscess."],["C","Folliculitis."],["D","Cellulitis."],["E","Carbuncle."]],"a":"E","sa":null,"pg":"14","f":[],"n":43,"e":["A large indurated painful plaque on the back of the neck with multiple draining openings in a diabetic is a carbuncle. Why the other options are wrong: A) Furuncle: A furuncle is single. B) Abscess: An abscess lacks multiple openings. C) Folliculitis: Folliculitis is superficial. D) Cellulitis: Cellulitis is diffuse.","Carbuncle: diabetic, nape of neck."],"im":[],"src":"Q080"},{"id":"K044","ch":"⭐ Key Ideas — each idea once","q":"Erysipelas is a:","o":[["A","Streptococcal infection of the epidermis."],["B","Staphylococcal infection of the subcutaneous tissue."],["C","Streptococcal infection of the hair follicles."],["D","Streptococcal infection of the dermis."],["E","Staphylococcal infection of the sweat ducts."]],"a":"D","sa":null,"pg":"15","f":[],"n":44,"e":["Erysipelas is a streptococcal infection of the upper dermis with lymphatic involvement. Why the other options are wrong: A) Streptococcal infection of the epidermis: It involves the dermis. B) Staphylococcal infection of the subcutan…: It is streptococcal. C) Streptococcal infection of the hair foll…: Follicles are not primary. E) Staphylococcal infection of the sweat du…: Sweat ducts are not primary.","Erysipelas = strep, upper dermis."],"im":[],"src":"Q082"},{"id":"K045","ch":"⭐ Key Ideas — each idea once","q":"Erysipelas characteristically involves which skin layer?","o":[["A","Epidermis only."],["B","Upper dermis and lymphatics."],["C","Lower dermis and subcutis."],["D","Subcutaneous fat only."],["E","Muscle layer."]],"a":"B","sa":null,"pg":null,"f":[],"n":45,"e":["Erysipelas affects the upper dermis and superficial lymphatics, giving a sharply demarcated raised red plaque. Cellulitis is deeper. Why the other options are wrong: A) Epidermis only: Impetigo is epidermal. C) Lower dermis and subcutis: That is cellulitis. D) Subcutaneous fat only: Fat involvement is panniculitis. E) Muscle layer: Muscle is not involved.","Erysipelas sharp edge; cellulitis ill-defined."],"im":[],"src":"Q083"},{"id":"K046","ch":"⭐ Key Ideas — each idea once","q":"A common complication of erysipelas is:","o":[["A","Pruritus."],["B","Malignant transformation."],["C","Deep venous thrombosis."],["D","Lymphedema."],["E","Scar formation."]],"a":"D","sa":null,"pg":"15","f":[],"n":46,"e":["The commonest complication is lymphedema from lymphatic damage; glomerulonephritis is the other listed complication. DVT and ulceration are not typical. Why the other options are wrong: A) Pruritus: Pruritus is not typical. B) Malignant transformation: No malignant change. C) Deep venous thrombosis: DVT is not typical. E) Scar formation: It does not scar.","Lymphedema."],"im":[],"src":"Q087"},{"id":"K047","ch":"⭐ Key Ideas — each idea once","q":"An obese female with lower limb lymphedema presented with a well-defined erythematous, swollen, tender area affecting the right leg. The patient was feverish and lethargic. Diagnosis is:","o":[["A","Acute urticaria."],["B","Lepromatous leprosy."],["C","Erysipelas."],["D","Ecthyma."],["E","Erythrasma."]],"a":"C","sa":null,"pg":"15","f":[],"n":47,"e":["A well-demarcated hot red swollen leg with fever on a lymphedematous limb is erysipelas. Why the other options are wrong: A) Acute urticaria: Urticaria is transient. B) Lepromatous leprosy: Leprosy has no fever. D) Ecthyma: Ecthyma is ulcerative. E) Erythrasma: Erythrasma is brown scaly.","Fever + sharp red leg = erysipelas."],"im":[],"src":"Q088"},{"id":"K048","ch":"⭐ Key Ideas — each idea once","q":"A 55-year-old diabetic woman presented with a 3-day history of a progressively increasing warm, tender, erythematous swelling on her left cheek. Investigations revealed a white cell count of 15,000 and HbA1c of 8.9. (Clinical photo: bright red, well-demarcated erythematous swelling of the cheek and ear.) The diagnosis of this case is:","o":[["A","Ecthyma."],["B","Erysipelas."],["C","Impetigo contagiosum."],["D","Carbuncle."],["E","Erythrasma."]],"a":"B","sa":null,"pg":"15","f":[],"n":48,"e":["The clinical picture of a sharply demarcated, hot, tender erythema is erysipelas. Why the other options are wrong: A) Ecthyma: Ecthyma is ulcerative. C) Impetigo contagiosum: Impetigo is crusted. D) Carbuncle: Carbuncle is multiple boils. E) Erythrasma: Erythrasma is brown scaly.","Erysipelas = sharp border."],"im":[],"src":"Q090"},{"id":"K049","ch":"⭐ Key Ideas — each idea once","q":"The causative organism of erythrasma is:","o":[["A","Staphylococcus aureus."],["B","Propionibacterium acnes."],["C","Corynebacterium minutissimum."],["D","Dermatophytes."],["E","Candida albicans."]],"a":"C","sa":null,"pg":"16","f":[],"n":49,"e":["Erythrasma is caused by Corynebacterium minutissimum, which produces porphyrins that fluoresce. Why the other options are wrong: A) Staphylococcus aureus: S. aureus causes boils. B) Propionibacterium acnes: P. acnes causes acne. D) Dermatophytes: Dermatophytes cause tinea. E) Candida albicans: Candida causes candidiasis.","Erythrasma = C. minutissimum."],"im":[],"src":"Q093"},{"id":"K050","ch":"⭐ Key Ideas — each idea once","q":"Erythrasma:","o":[["A","Is a suppurative inflammation of the upper dermis."],["B","Involves intertriginous areas such as axillae, groins and submammary region."],["C","Is caused by Streptococcus pyogenes."],["D","Shows yellow fluorescence on Wood's light examination."],["E","Is associated with fever and malaise."]],"a":"B","sa":null,"pg":"16","f":[],"n":50,"e":["Erythrasma affects intertriginous areas: axillae, groins and submammary folds, with brown scaly patches. Why the other options are wrong: A) Is a suppurative inflammation of the upp…: It is superficial. C) Is caused by Streptococcus pyogenes: It is Corynebacterium. D) Shows yellow fluorescence on Wood's ligh…: Fluorescence is coral red. E) Is associated with fever and malaise: It is asymptomatic.","Folds + coral red."],"im":[],"src":"Q094"},{"id":"K051","ch":"⭐ Key Ideas — each idea once","q":"A presentation of brown-red scaly groin patches with coral red fluorescence in an obese diabetic patient is diagnostic of:","o":[["A","Tinea cruris."],["B","Erythrasma."],["C","Candidiasis."],["D","Psoriasis."],["E","Tinea versicolor."]],"a":"B","sa":null,"pg":"16","f":[],"n":51,"e":["Brown-red scaly groin patches with coral-red fluorescence in an obese diabetic are erythrasma, treated with erythromycin. Why the other options are wrong: A) Tinea cruris: Tinea has no coral red. C) Candidiasis: Candidiasis is red and satellite. D) Psoriasis: Psoriasis is silvery. E) Tinea versicolor: Versicolor is yellow.","Treat: erythromycin."],"im":[],"src":"Q095"},{"id":"K052","ch":"⭐ Key Ideas — each idea once","q":"Regarding erythrasma, Wood's light examination shows:","o":[["A","Yellow-green fluorescence."],["B","Coral red fluorescence."],["C","Enhancement of color contrast."],["D","No change."],["E","Blue-green fluorescence."]],"a":"B","sa":null,"pg":"16","f":[],"n":52,"e":["Corynebacterium minutissimum produces porphyrins that fluoresce coral red on Wood's light. Yellow fluorescence belongs to versicolor and yellow-green to favus and black-dot ringworm. Why the other options are wrong: A) Yellow-green fluorescence: Yellow-green is favus. C) Enhancement of color contrast: Enhancement of contrast under Wood's lamp is typical of vitiligo, not erythrasma. D) No change: Erythrasma shows a distinct coral-red fluorescence. E) Blue-green fluorescence: Blue-green is Pseudomonas.","Coral red = erythrasma."],"im":[],"src":"Q097"},{"id":"K053","ch":"⭐ Key Ideas — each idea once","q":"Regarding leprosy, which of the following is TRUE?","o":[["A","It involves mainly skin and nerves."],["B","It has a short incubation period."],["C","Lepra bacilli are easily grown in vitro."],["D","Clinical presentation depends on humoral immunity."],["E","Monodrug therapy is the treatment of choice."]],"a":"A","sa":null,"pg":"19","f":[],"n":53,"e":["Leprosy (Hansen disease) is caused by Mycobacterium leprae and mainly affects skin and peripheral nerves. Why the other options are wrong: B) It has a short incubation period: Incubation is long. C) Lepra bacilli are easily grown in vitro: It is not cultured in vitro. D) Clinical presentation depends on humoral…: It depends on cell-mediated immunity. E) Monodrug therapy is the treatment of cho…: Multidrug therapy is used.","Skin + nerves."],"im":[],"src":"Q099"},{"id":"K054","ch":"⭐ Key Ideas — each idea once","q":"In leprosy","o":[["A","It is a stable disease."],["B","It is not infectious."],["C","Dapsone is the backbone of treatment of all types."],["D","It is an autoimmune disease."],["E","Nodules are characteristic of tuberculoid leprosy."]],"a":"C","sa":null,"pg":"20","f":[],"n":54,"e":["According to the book, dapsone is the backbone of treatment in all types, given in multidrug therapy (with rifampicin ± clofazimine). Why the other options are wrong: A) It is a stable disease: Leprosy is chronic and progressive, causing nerve damage and deformity if untreated. B) It is not infectious: Leprosy is infectious (Mycobacterium leprae), although of low infectivity. D) It is an autoimmune disease: It is infectious. E) Nodules are characteristic of tuberculoi…: Nodules and infiltrated plaques are lepromatous; tuberculoid leprosy has few anesthetic plaques.","MDT: dapsone + rifampicin ± clofazimine."],"im":[],"src":"Q100"},{"id":"K055","ch":"⭐ Key Ideas — each idea once","q":"Target cell for lepra bacilli is the","o":[["A","Keratinocyte."],["B","Melanocyte."],["C","Schwann cell."],["D","Fibroblast."],["E","Endothelial cell."]],"a":"C","sa":null,"pg":"17","f":[],"n":55,"e":["M. leprae has a special affinity for Schwann cells, causing neuropathy and anesthesia. Why the other options are wrong: A) Keratinocyte: Keratinocytes are not targeted. B) Melanocyte: Melanocytes are not targeted. D) Fibroblast: Fibroblasts are not targeted. E) Endothelial cell: Endothelium is not targeted.","Target cell = Schwann cell."],"im":[],"src":"Q101"},{"id":"K056","ch":"⭐ Key Ideas — each idea once","q":"Expression of the disease in leprosy depends on","o":[["A","Humoral immunity."],["B","Immune complexes."],["C","Complement fixation."],["D","Cell-mediated immunity."],["E","IgE-mediated immunity."]],"a":"D","sa":null,"pg":"17","f":[],"n":56,"e":["The clinical form depends on the patient's cell-mediated immunity, not humoral immunity. Why the other options are wrong: A) Humoral immunity: Humoral immunity is not decisive. B) Immune complexes: Immune complexes cause reactions. C) Complement fixation: Complement is not decisive. E) IgE-mediated immunity: IgE is not decisive.","Good CMI → tuberculoid; poor CMI → lepromatous."],"im":[],"src":"Q102"},{"id":"K057","ch":"⭐ Key Ideas — each idea once","q":"Regarding leprosy, the following statement is INCORRECT","o":[["A","High immunity leads to paucibacillary leprosy."],["B","Tuberculoid leprosy shows good immunity."],["C","Infection occurs through nasal mucosa."],["D","Sensory nerves affection leads to glove and stocking anesthesia."],["E","Lepromatous leprosy is paucibacillary."]],"a":"E","sa":null,"pg":"18","f":[],"n":57,"e":["Lepromatous leprosy is multibacillary (poor immunity, many bacilli); the statement that it is paucibacillary is wrong. Why the other options are wrong: A) High immunity leads to paucibacillary le…: Correct statement. B) Tuberculoid leprosy shows good immunity: Correct statement. C) Infection occurs through nasal mucosa: Correct statement. D) Sensory nerves affection leads to glove…: Correct statement.","Lepromatous = multibacillary."],"im":[],"src":"Q103"},{"id":"K058","ch":"⭐ Key Ideas — each idea once","q":"In leprosy, choose the correct answer","o":[["A","Paucibacillary leprosy occurs in a patient with a high immunity."],["B","Tuberculoid leprosy shows bad immunity."],["C","Lepromin test is diagnostic."],["D","Motor nerve affection leads to glove and stocking anesthesia."],["E","Lepromatous leprosy is paucibacillary."]],"a":"A","sa":null,"pg":"17","f":[],"n":58,"e":["Paucibacillary leprosy (tuberculoid) occurs in patients with high immunity, so few bacilli are found. Why the other options are wrong: B) Tuberculoid leprosy shows bad immunity: TT has good immunity. C) Lepromin test is diagnostic: Lepromin is not diagnostic. D) Motor nerve affection leads to glove and…: Sensory nerves cause glove and stocking. E) Lepromatous leprosy is paucibacillary: LL is multibacillary.","High immunity = few bacilli."],"im":[],"src":"Q104"},{"id":"K059","ch":"⭐ Key Ideas — each idea once","q":"Best prognosis in leprotic cases is in","o":[["A","Borderline leprosy."],["B","Tuberculoid leprosy."],["C","Lepromatous leprosy."],["D","Borderline tuberculoid leprosy."],["E","Borderline lepromatous leprosy."]],"a":"B","sa":null,"pg":"17","f":[],"n":59,"e":["Tuberculoid leprosy has good immunity, limited disease and the best prognosis. Why the other options are wrong: A) Borderline leprosy: Borderline is unstable. C) Lepromatous leprosy: LL has the worst prognosis. D) Borderline tuberculoid leprosy: BT is worse than TT. E) Borderline lepromatous leprosy: BL is worse than TT.","TT = best prognosis."],"im":[],"src":"Q106"},{"id":"K060","ch":"⭐ Key Ideas — each idea once","q":"Which is TRUE regarding tuberculoid leprosy?","o":[["A","Diagnosed by lepromin test."],["B","Presents with multiple nodules."],["C","Nerve involvement occurs early."],["D","Involves mucous membranes."],["E","Is a sign of poor immunity."]],"a":"C","sa":null,"pg":"18","f":[],"n":60,"e":["Nerve involvement occurs early in tuberculoid leprosy and is asymmetric and severe. Why the other options are wrong: A) Diagnosed by lepromin test: Not diagnosed by lepromin. B) Presents with multiple nodules: Nodules are LL. D) Involves mucous membranes: Mucosa is LL. E) Is a sign of poor immunity: TT is good immunity.","TT: early nerve, few lesions."],"im":[],"src":"Q111"},{"id":"K061","ch":"⭐ Key Ideas — each idea once","q":"A male patient, 42 years old, presented with multiple hypopigmented hairless macules on the upper extremities as well as patches on his legs. On examination, these patches showed absent sensation, and the ulnar nerve was thickened, beaded and tender by palpation. (Clinical photo: hypopigmented patches on the knee and leg.) Diagnosis of this case is","o":[["A","Erythrasma."],["B","Tuberculoid leprosy."],["C","Lichen planus."],["D","Pityriasis versicolor."],["E","Psoriasis."]],"a":"B","sa":null,"pg":"19","f":[],"n":61,"e":["A few well-defined hypopigmented anesthetic patches indicate tuberculoid leprosy. Why the other options are wrong: A) Erythrasma: Erythrasma is brown scaly. C) Lichen planus: Lichen planus is violaceous. D) Pityriasis versicolor: Versicolor is scaly. E) Psoriasis: Psoriasis is scaly.","Few patches = TT."],"im":[],"src":"Q112"},{"id":"K062","ch":"⭐ Key Ideas — each idea once","q":"A male patient, 52 years old, presented with glistening erythematous papules, nodules & plaques on his ears, nose and forehead. He had loss of the outer 1/3 of his eyebrows and gave history of recurrent attacks of epistaxis. What is your diagnosis?","o":[["A","Impetigo contagiosum."],["B","Tuberculoid leprosy."],["C","Lepromatous leprosy."],["D","Pityriasis versicolor."],["E","Psoriasis."]],"a":"C","sa":null,"pg":"19","f":[],"n":62,"e":["Symmetrical nodules and infiltration with leonine face indicate lepromatous leprosy. Why the other options are wrong: A) Impetigo contagiosum: Impetigo is crusted. B) Tuberculoid leprosy: TT is few patches. D) Pityriasis versicolor: Versicolor is scaly. E) Psoriasis: Psoriasis is scaly.","LL: symmetrical, widespread."],"im":[],"src":"Q114"},{"id":"K063","ch":"⭐ Key Ideas — each idea once","q":"A patient with widespread, symmetrical papules and nodules, infiltrated facial skin, and loss of outer third of eyebrows. Which is TRUE regarding this disease?","o":[["A","Is a parasitic infection."],["B","Bacilli are absent in skin lesions."],["C","Nerve involvement occurs early."],["D","Involves mucous membranes."],["E","Is characterized by good immunity."]],"a":"D","sa":null,"pg":"19","f":[],"n":63,"e":["Lepromatous leprosy has poor immunity and numerous bacilli, so mucous membranes (nasal mucosa → epistaxis, septal destruction), eyes, kidneys, liver, bones and testes can be involved. Tuberculoid leprosy involves skin and nerves only. Why the other options are wrong: A) Is a parasitic infection: It is bacterial. B) Bacilli are absent in skin lesions: Bacilli are numerous. C) Nerve involvement occurs early: Nerve is late. E) Is characterized by good immunity: Immunity is poor.","LL: mucosa + viscera."],"im":[],"src":"Q116"},{"id":"K064","ch":"⭐ Key Ideas — each idea once","q":"The following features belong to lepromatous leprosy","o":[["A","Hypopigmented macules."],["B","Maculoanaesthetic patches."],["C","Strongly positive lepromin test."],["D","Leonine facies."],["E","Bacteriology shows a paucity of bacilli."]],"a":"D","sa":null,"pg":"19","f":[],"n":64,"e":["Leonine facies is due to diffuse infiltration and nodules of the face in lepromatous leprosy. Why the other options are wrong: A) Hypopigmented macules: That is TT. B) Maculoanaesthetic patches: That is TT. C) Strongly positive lepromin test: Lepromin is negative. E) Bacteriology shows a paucity of bacilli: Bacilli are many.","Lion face."],"im":[],"src":"Q120"},{"id":"K065","ch":"⭐ Key Ideas — each idea once","q":"In lepromatous leprosy","o":[["A","Lesions are few in number."],["B","Penicillin is the backbone of treatment."],["C","Anesthesia is late & extensive on cold areas."],["D","Organisms are rarely found in skin smears."],["E","Internal organs are not involved."]],"a":"C","sa":null,"pg":"18","f":[],"n":65,"e":["Anesthesia appears late and is extensive (glove and stocking, cold areas) in lepromatous leprosy. Why the other options are wrong: A) Lesions are few in number: Lesions are numerous. B) Penicillin is the backbone of treatment: Dapsone is the backbone. D) Organisms are rarely found in skin smears: Bacilli are many. E) Internal organs are not involved: Organs are involved.","LL: late anesthesia."],"im":[],"src":"Q122"},{"id":"K066","ch":"⭐ Key Ideas — each idea once","q":"Diagnosis of leprosy includes:","o":[["A","Skin biopsy."],["B","Nerve biopsy."],["C","Nasal smear."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":66,"e":["Diagnosis uses skin biopsy, nerve biopsy and slit-skin/nasal smears, so all of the above. Why the other options are wrong: A) Skin biopsy: Skin biopsy shows bacilli and granulomas. True, but others are also used. B) Nerve biopsy: Nerve biopsy helps in neural leprosy. True, but others are also used. C) Nasal smear: Nasal smear detects bacilli. True, but others are also used. E) None of the above: Wrong: all are used.","Smear, biopsy, nerve biopsy."],"im":[],"src":"H054"},{"id":"K067","ch":"⭐ Key Ideas — each idea once","q":"Hansen's disease is another name for:","o":[["A","Acne."],["B","Alopecia."],["C","Scabies."],["D","Psoriasis."],["E","Leprosy."]],"a":"E","sa":null,"pg":null,"f":[],"n":67,"e":["Hansen's disease is named after Gerhard Hansen, who discovered Mycobacterium leprae; it is simply another name for leprosy. Why the other options are wrong: A) Acne: Acne is a pilosebaceous disease. B) Alopecia: Alopecia is hair loss. C) Scabies: Scabies is a mite disease. D) Psoriasis: Psoriasis is papulosquamous.","Hansen = leprosy."],"im":[],"src":"H057"},{"id":"K068","ch":"⭐ Key Ideas — each idea once","q":"Herpes simplex","o":[["A","Is strictly unilateral."],["B","Is a bacterial infection."],["C","Heals with a scar."],["D","One attack provides permanent immunity."],["E","Is genital & non-genital."]],"a":"E","sa":null,"pg":"21","f":[],"n":68,"e":["HSV infects genital and non-genital sites (lips, face, fingers, eye), types 1 and 2 overlapping. Why the other options are wrong: A) Is strictly unilateral: It can be bilateral. B) Is a bacterial infection: It is viral. C) Heals with a scar: It heals without scar. D) One attack provides permanent immunity: It recurs.","HSV-1 mostly oral; HSV-2 mostly genital."],"im":[],"src":"Q129"},{"id":"K069","ch":"⭐ Key Ideas — each idea once","q":"In herpes simplex","o":[["A","The primary lesion is a papule."],["B","Neuralgia is a frequent complication."],["C","It usually affects the mucocutaneous junction."],["D","Recurrences are uncommon."],["E","None of the above."]],"a":"C","sa":null,"pg":"27","f":[],"n":69,"e":["HSV classically involves the mucocutaneous junction (lips, nose, genitalia) and recurs there; it is periorificial, whereas zoster follows a dermatome. Why the other options are wrong: A) The primary lesion is a papule: The primary lesion is a vesicle. B) Neuralgia is a frequent complication: Neuralgia is a feature of zoster. D) Recurrences are uncommon: Recurrences are common. E) None of the above: Wrong: at least one listed statement is correct.","Periorificial."],"im":[],"src":"Q130"},{"id":"K070","ch":"⭐ Key Ideas — each idea once","q":"In herpes simplex all are true EXCEPT","o":[["A","The primary lesion is a vesicle."],["B","Neuralgia is a frequent complication."],["C","It usually affects the mucocutaneous junction."],["D","It may cause eczema herpeticum in atopics."],["E","Recurrence is common."]],"a":"B","sa":null,"pg":"26","f":[],"n":70,"e":["Neuralgia is a frequent complication of herpes zoster, not of herpes simplex. Why the other options are wrong: A) The primary lesion is a vesicle: The primary lesion of HSV is a grouped vesicle. C) It usually affects the mucocutaneous jun…: HSV typically involves mucocutaneous junctions (lips, genitalia). D) It may cause eczema herpeticum in atopics: HSV can cause eczema herpeticum in atopic skin. E) Recurrence is common: HSV recurs after latency in sensory ganglia.","Post-herpetic neuralgia = zoster."],"im":[],"src":"Q131"},{"id":"K071","ch":"⭐ Key Ideas — each idea once","q":"Herpes labialis","o":[["A","Is recurrent."],["B","Heals with a scar."],["C","Its primary lesion is a papule."],["D","Is strictly unilateral."],["E","Is caused by HSV II."]],"a":"A","sa":null,"pg":"22","f":[],"n":71,"e":["Herpes labialis recurs because HSV lies latent in the trigeminal ganglion and reactivates. Why the other options are wrong: B) Heals with a scar: It heals without scar. C) Its primary lesion is a papule: The primary lesion is a vesicle. D) Is strictly unilateral: It can be bilateral. E) Is caused by HSV II: It is usually HSV-1.","Recurrence is common in HSV."],"im":[],"src":"Q132"},{"id":"K072","ch":"⭐ Key Ideas — each idea once","q":"A female patient, 15 years old, presented with perioral blisters of 4 days duration. She was feverish 2 days before the rash and felt a tingling sensation in the area. The condition was recurrent. (Clinical photo: grouped vesicles/crusts at the lip margin.) The causative organism of this disease is","o":[["A","Group A β-haemolytic Streptococci."],["B","Varicella zoster virus."],["C","Staphylococcus aureus."],["D","Human papilloma virus."],["E","Herpes simplex virus."]],"a":"E","sa":null,"pg":"22","f":[],"n":72,"e":["Recurrent perioral blisters preceded by fever and tingling are due to herpes simplex virus. Why the other options are wrong: A) Group A β-haemolytic Streptococci: Strep causes impetigo. B) Varicella zoster virus: VZV gives dermatomal vesicles. C) Staphylococcus aureus: Staph causes impetigo. D) Human papilloma virus: HPV gives warts.","Prodrome tingling → HSV."],"im":[],"src":"Q133"},{"id":"K073","ch":"⭐ Key Ideas — each idea once","q":"A 40-year-old male patient with bilateral grouped vesicles on an erythematous base affecting the lips and nose, with no fever or lymphadenopathy, may have","o":[["A","Herpes zoster."],["B","Primary herpetic gingivostomatitis."],["C","Recurrent herpes simplex."],["D","Erysipelas."],["E","Verruca vulgaris."]],"a":"C","sa":null,"pg":"22","f":[],"n":73,"e":["Recurrent grouped vesicles on the lips and nose indicate recurrent herpes simplex (labialis). Why the other options are wrong: A) Herpes zoster: Zoster is unilateral. B) Primary herpetic gingivostomatitis: Primary herpetic gingivostomatitis is with fever and lymph nodes. D) Erysipelas: Erysipelas is a hot plaque. E) Verruca vulgaris: Verruca is rough.","Recurrent = HSV."],"im":[],"src":"Q136"},{"id":"K074","ch":"⭐ Key Ideas — each idea once","q":"A 24-year-old man develops grouped painful vesicles on the penis, preceded by burning sensation. The most likely diagnosis is","o":[["A","Molluscum contagiosum."],["B","Condyloma acuminata."],["C","Herpes progenitalis."],["D","Scabies."],["E","Exanthematous drug eruption."]],"a":"C","sa":null,"pg":"23","f":[],"n":74,"e":["Grouped painful vesicles on the penis after burning point to genital herpes (herpes progenitalis). Why the other options are wrong: A) Molluscum contagiosum: Molluscum is not painful. B) Condyloma acuminata: Condyloma is not vesicular. D) Scabies: Scabies is itchy. E) Exanthematous drug eruption: Drug eruption is exanthematous.","HSV-2 usually."],"im":[],"src":"Q137"},{"id":"K075","ch":"⭐ Key Ideas — each idea once","q":"Caesarian section is indicated for a pregnant female if at the time of delivery she is affected by","o":[["A","Herpetic whitlow."],["B","Herpes progenitalis."],["C","Herpes zoster."],["D","Chicken pox."],["E","None of the above."]],"a":"B","sa":null,"pg":"23","f":[],"n":75,"e":["Active genital herpes at delivery is an indication for cesarean section to prevent neonatal herpes. Why the other options are wrong: A) Herpetic whitlow: Whitlow is on fingers. C) Herpes zoster: Zoster is not transmitted at birth this way. D) Chicken pox: Chickenpox is managed differently. E) None of the above: Wrong: at least one listed statement is correct.","Active genital herpes → C-section."],"im":[],"src":"Q138"},{"id":"K076","ch":"⭐ Key Ideas — each idea once","q":"In herpetic whitlow the site of infection is","o":[["A","Face."],["B","Mucous membrane."],["C","Genitals."],["D","Fingers."],["E","None of the above."]],"a":"D","sa":null,"pg":"23","f":[],"n":76,"e":["Herpetic whitlow is HSV infection of the finger in children (HSV-1) or adults after digital-genital contact. Why the other options are wrong: A) Face: Face is herpes labialis. B) Mucous membrane: Mucosa is gingivostomatitis. C) Genitals: Genitals is progenitalis. E) None of the above: Wrong: at least one listed statement is correct.","Whitlow = finger."],"im":[],"src":"Q140"},{"id":"K077","ch":"⭐ Key Ideas — each idea once","q":"Complications of herpes simplex infection include","o":[["A","Erythema multiforme."],["B","Eczema herpeticum."],["C","Corneal ulcers."],["D","CNS complications."],["E","All of the above."]],"a":"E","sa":null,"pg":"23","f":[],"n":77,"e":["HSV complications include erythema multiforme, eczema herpeticum, corneal ulcers and CNS (encephalitis). Why the other options are wrong: A) Erythema multiforme: Erythema multiforme can follow HSV. True, but B, C and D are also complications. B) Eczema herpeticum: Eczema herpeticum is HSV superinfection of atopic skin. True, but others also occur. C) Corneal ulcers: HSV causes corneal ulcers. True, but others also occur. D) CNS complications: HSV can reach the CNS (encephalitis). True, but others also occur.","All of the above."],"im":[],"src":"Q142"},{"id":"K078","ch":"⭐ Key Ideas — each idea once","q":"Tzank smear is used to diagnose","o":[["A","Leprosy."],["B","Impetigo."],["C","Herpes simplex."],["D","Psoriasis."],["E","Pediculosis."]],"a":"C","sa":null,"pg":"24","f":[],"n":78,"e":["A Tzanck smear shows multinucleated giant cells in herpes simplex (and zoster/varicella). Why the other options are wrong: A) Leprosy: Leprosy needs smear. B) Impetigo: Impetigo needs culture. D) Psoriasis: Psoriasis is clinical. E) Pediculosis: Lice need microscopy.","Tzanck = multinucleated giant cells."],"im":[],"src":"Q143"},{"id":"K079","ch":"⭐ Key Ideas — each idea once","q":"Chicken pox represents","o":[["A","HSV infection."],["B","HPV infection."],["C","Poxvirus infection."],["D","Reactivation of VZV."],["E","Primary VZV infection."]],"a":"E","sa":null,"pg":"24","f":[],"n":79,"e":["Chickenpox is the primary VZV infection, whereas herpes zoster is reactivation. HSV causes oral and genital herpes. Why the other options are wrong: A) HSV infection: HSV is a different virus. B) HPV infection: HPV causes warts. C) Poxvirus infection: Poxvirus causes molluscum. D) Reactivation of VZV: Reactivation is zoster.","Primary vs reactivation."],"im":[],"src":"Q145"},{"id":"K080","ch":"⭐ Key Ideas — each idea once","q":"Varicella: what is the causative virus, and what is the treatment?","o":[],"a":null,"sa":"Varicella zoster virus (VZV); antiviral, e.g. acyclovir 800 mg 5 times daily for 7 days (started within 48 hours).","pg":"24","f":[],"n":80,"e":["Varicella is caused by VZV, and treatment is antiviral therapy (acyclovir 800 mg 5 times daily for 7 days, started within 48 hours) plus vaccine prophylaxis in children.","VZV, acyclovir."],"im":[],"src":"Q146"},{"id":"K081","ch":"⭐ Key Ideas — each idea once","q":"An adult patient with unilateral painful grouped vesicles along the distribution of a sensory nerve is suffering from","o":[["A","Herpes simplex."],["B","Herpes zoster."],["C","Chickenpox."],["D","Warts."],["E","Molluscum contagiosum."]],"a":"B","sa":null,"pg":"25","f":[],"n":81,"e":["Unilateral grouped vesicles along a sensory nerve distribution are herpes zoster. Why the other options are wrong: A) Herpes simplex: HSV is not dermatomal. C) Chickenpox: Chickenpox is generalized. D) Warts: Warts are not vesicles. E) Molluscum contagiosum: Molluscum is umbilicated.","Dermatomal = zoster."],"im":[],"src":"Q147"},{"id":"K082","ch":"⭐ Key Ideas — each idea once","q":"Post-herpetic neuralgia is more common in","o":[["A","Children."],["B","Elderly patients."],["C","Diabetic patients."],["D","Motor nerve affection."],["E","Sensory nerve affection."]],"a":"B","sa":null,"pg":"26","f":[],"n":82,"e":["Post-herpetic neuralgia occurs in elderly patients and may persist for weeks to months. Early antivirals and vaccines reduce its risk. Why the other options are wrong: A) Children: Children rarely get PHN. C) Diabetic patients: Age, not diabetes, is the main risk. D) Motor nerve affection: Sensory fibers are involved. E) Sensory nerve affection: Not a discriminating factor.","Elderly → PHN."],"im":[],"src":"Q150"},{"id":"K083","ch":"⭐ Key Ideas — each idea once","q":"The following drug is the main treatment of herpes zoster","o":[["A","Acyclovir."],["B","Tetracycline."],["C","Retinoids."],["D","Cyclosporin."],["E","Methotrexate."]],"a":"A","sa":null,"pg":"27","f":[],"n":83,"e":["Acyclovir (also valacyclovir and famciclovir) is the main treatment for herpes zoster when started within 48 hours; analgesics and gabapentin help the pain. Why the other options are wrong: B) Tetracycline: Tetracycline is antibacterial. C) Retinoids: Retinoids are for acne. D) Cyclosporin: Cyclosporin is immunosuppressive. E) Methotrexate: Methotrexate is antiproliferative.","Acyclovir."],"im":[],"src":"Q152"},{"id":"K084","ch":"⭐ Key Ideas — each idea once","q":"Warts are caused by","o":[["A","HSV-1."],["B","Pox virus."],["C","Human papilloma virus."]],"a":"C","sa":null,"pg":"28","f":[],"n":84,"e":["Warts are common benign epithelial growths caused by human papilloma virus (over 200 genotypes), not pox virus or herpes simplex. Why the other options are wrong: A) HSV-1: HSV-1 gives vesicles. B) Pox virus: Pox virus gives molluscum.","Warts = HPV."],"im":[],"src":"Q155"},{"id":"K085","ch":"⭐ Key Ideas — each idea once","q":"Verruca","o":[["A","Presents by violaceous papules."],["B","Is characterized by asymptomatic verrucous macules."],["C","May involve the mucous membranes."],["D","Is a systemic disease."],["E","Is always treated by surgical excision."]],"a":"C","sa":null,"pg":"28","f":[],"n":85,"e":["Warts may involve mucous membranes as well as skin; genital warts are the best example. Why the other options are wrong: A) Presents by violaceous papules: Warts are not violaceous. B) Is characterized by asymptomatic verruco…: Lesions are papules. D) Is a systemic disease: It is local. E) Is always treated by surgical excision: Destruction is used.","Warts: skin and mucosa."],"im":[],"src":"Q157"},{"id":"K086","ch":"⭐ Key Ideas — each idea once","q":"ONE of the following statements about warts is CORRECT","o":[["A","The primary lesion of verruca vulgaris is a skin-colored macule."],["B","Condyloma acuminata is caused by Treponema pallidum."],["C","Warts occur on the skin, but not on mucous membranes."],["D","Cancer cervix is a complication of female genital warts."],["E","All types are painless."]],"a":"D","sa":null,"pg":"29","f":[],"n":86,"e":["Genital warts (certain HPV types) are linked to cervical cancer; common warts are not skin-colored macules, and warts are not caused by Treponema. Why the other options are wrong: A) The primary lesion of verruca vulgaris i…: Macules are flat. B) Condyloma acuminata is caused by Trepone…: Treponema causes syphilis. C) Warts occur on the skin, but not on muco…: Warts occur on mucosa. E) All types are painless: Plantar warts are tender.","HPV 16/18 → cervix cancer."],"im":[],"src":"Q159"},{"id":"K087","ch":"⭐ Key Ideas — each idea once","q":"A male patient, 6 years old, presented with asymptomatic flat-topped lesions on his face. The condition started 5 months ago with a gradual onset and a progressive course. (Clinical photo: multiple small flat-topped skin- colored/pinkish papules on the cheek.) This patient suffers from","o":[["A","Psoriasis."],["B","Plane warts."],["C","Molluscum contagiosum."],["D","Scabies."],["E","Condyloma acuminata."]],"a":"B","sa":null,"pg":"28","f":[],"n":87,"e":["Multiple flat-topped skin-colored papules, often on the face of a child, are plane warts. Why the other options are wrong: A) Psoriasis: Psoriasis is scaly. C) Molluscum contagiosum: Molluscum is umbilicated. D) Scabies: Scabies is itchy. E) Condyloma acuminata: Condyloma is genital.","Plane = flat."],"im":[],"src":"Q161"},{"id":"K088","ch":"⭐ Key Ideas — each idea once","q":"A female patient, 30 years old, presented with a tender papule involving her sole, soon followed by other similar ones. The condition started about two months ago. She feels pain while walking or running. This patient suffers from","o":[["A","Plantar warts."],["B","Moniliasis."],["C","Leprotic nodules."],["D","Post-scabietic nodules."],["E","Condyloma acuminata."]],"a":"A","sa":null,"pg":"29","f":[],"n":88,"e":["A tender thick papule on the sole, painful on walking, with other similar lesions nearby is a plantar wart. It grows inward and is tender. Why the other options are wrong: B) Moniliasis: Moniliasis is candida. C) Leprotic nodules: Leprotic nodules are anesthetic. D) Post-scabietic nodules: Post-scabietic nodules are on genitalia. E) Condyloma acuminata: Condyloma is genital.","Plantar warts: tender, endophytic."],"im":[],"src":"Q164"},{"id":"K089","ch":"⭐ Key Ideas — each idea once","q":"Which of the following is TRUE regarding plantar warts?","o":[["A","Long, thin pedunculated skin growths."],["B","Caused by human herpes virus 7."],["C","Secondary infection is a common complication."],["D","Treated by cryotherapy."],["E","Caused by blood-borne infection."]],"a":"D","sa":null,"pg":"30","f":[],"n":89,"e":["Plantar warts are treated by destruction: cryotherapy, electrocautery, chemical cautery (salicylic acid) or laser. Why the other options are wrong: A) Long, thin pedunculated skin growths: That is filiform. B) Caused by human herpes virus 7: HPV, not HHV-7. C) Secondary infection is a common complica…: Warts spread by direct contact with HPV, and secondary infection is not a common complication. E) Caused by blood-borne infection: Warts spread by direct contact with HPV, and secondary infection is not a common complication.","Cryotherapy."],"im":[],"src":"Q165"},{"id":"K090","ch":"⭐ Key Ideas — each idea once","q":"Condyloma acuminatum","o":[["A","Is herpes simplex virus infection of the genital area."],["B","Involves female genital areas only."],["C","Usually affects skin & mucous membranes of the genital area."],["D","Is an entirely benign lesion."],["E","Forms deep nodules in the genital area."]],"a":"C","sa":null,"pg":"29","f":[],"n":90,"e":["Condyloma acuminata (genital warts) involve skin and mucosa of the genital, perineal and perianal area; they are caused by HPV and may extend into the vagina, urethra or anus. Why the other options are wrong: A) Is herpes simplex virus infection of the…: It is HPV. B) Involves female genital areas only: It involves both sexes. D) Is an entirely benign lesion: It is oncogenic with HPV 16/18. E) Forms deep nodules in the genital area: It is exophytic.","Genital warts: skin and mucosa."],"im":[],"src":"Q166"},{"id":"K091","ch":"⭐ Key Ideas — each idea once","q":"A female patient, 34 years old, presented with multiple soft, pinkish, moist, foul-smelling outgrowths involving her genitalia. The condition started about one year ago with a gradual onset and progressive course. (Clinical photo: multiple cauliflower-like warty growths on the genital/perianal area.) This patient suffers from","o":[["A","Genital herpes."],["B","Verruca plana."],["C","Condyloma acuminata."],["D","Molluscum contagiosum."],["E","Impetigo contagiosum."]],"a":"C","sa":null,"pg":"29","f":[],"n":91,"e":["Discrete soft exophytic papules on the genitalia indicate condyloma acuminata, an
