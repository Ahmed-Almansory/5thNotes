ligo is asymptomatic: no itching, pain or burning. The complaint is the cosmetic discoloration and its psychological impact. Why the other options are wrong: A) Itching: It is asymptomatic. B) Pain: It is not painful. D) Loss of sensation: Sensation is normal. E) Burning sensation: It does not burn.","Cosmetic complaint only."],"im":[]},{"id":"Q443","ch":"Melanocyte Disorders","q":"The main complaint in vitiligo is","o":[["A","Itching."],["B","Pain."],["C","Burning sensation."],["D","All of the above."],["E","None of the above."]],"a":"E","sa":null,"pg":"85","f":[],"n":6,"e":["Itching, pain and burning are not features of vitiligo (the key gives 'none of the above'); the only complaint is cosmetic discoloration. Why the other options are wrong: A) Itching: It is asymptomatic. B) Pain: It is not painful. C) Burning sensation: It does not burn. D) All of the above: Wrong: not all of the statements are correct.","Asymptomatic."],"im":[]},{"id":"Q444","ch":"Melanocyte Disorders","q":"Pruritus is a cardinal symptom in all of the following EXCEPT","o":[["A","Scabies."],["B","Urticaria."],["C","Atopic dermatitis."],["D","Lichen planus."],["E","Vitiligo."]],"a":"E","sa":null,"pg":"85","f":[],"n":7,"e":["Pruritus is the cardinal symptom of scabies, eczema or lichen planus, but vitiligo is asymptomatic. Why the other options are wrong: A) Scabies: Itchy. B) Urticaria: Itchy. C) Atopic dermatitis: Itchy. D) Lichen planus: Itchy.","Vitiligo: no itch."],"im":[]},{"id":"Q445","ch":"Melanocyte Disorders","q":"As regards vitiligo, all of the following are false EXCEPT","o":[["A","Itching is a prominent symptom."],["B","It is not heritable."],["C","Scalp may be affected."],["D","Family history is positive in all cases."],["E","Milky white papules are seen."]],"a":"C","sa":null,"pg":"85","f":[],"n":8,"e":["Of the listed statements only 'scalp may be affected' is true. Vitiligo is not usually itchy and is partly heritable, it does not have milky papules, and family history is not positive in all cases. Why the other options are wrong: A) Itching is a prominent symptom: It is not itchy. B) It is not heritable: Genetic predisposition is part of the pathogenesis, and many patients have affected relatives. D) Family history is positive in all cases: Only some patients have a family history; predisposition does not mean every case is familial. E) Milky white papules are seen: The lesions are macules.","Scalp/white hairs can be involved."],"im":[]},{"id":"Q446","ch":"Melanocyte Disorders","q":"Vitiligo as an autoimmune disease may be associated with","o":[["A","Thyroid disease."],["B","Impetigo."],["C","Herpes zoster."],["D","Eczema."],["E","Pityriasis rosea."]],"a":"A","sa":null,"pg":"85","f":[],"n":9,"e":["Generalized vitiligo is autoimmune, so it is associated with autoimmune thyroid disease, alopecia areata, type 1 diabetes, myasthenia gravis, lupus and rheumatoid arthritis. Impetigo, zoster, eczema and pityriasis rosea are unrelated. Why the other options are wrong: B) Impetigo: Impetigo is unrelated. C) Herpes zoster: Zoster is unrelated. D) Eczema: Eczema is not autoimmune. E) Pityriasis rosea: PR is unrelated.","Thyroid disease."],"im":[]},{"id":"Q447","ch":"Melanocyte Disorders","q":"Vitiligo as an autoimmune disease may be associated with","o":[["A","Impetigo."],["B","Herpes zoster."],["C","Alopecia areata."],["D","Eczema."],["E","Pityriasis rosea."]],"a":"C","sa":null,"pg":"85","f":[],"n":10,"e":["Alopecia areata is another autoimmune disease associated with generalized vitiligo. Why the other options are wrong: A) Impetigo: Impetigo is unrelated. B) Herpes zoster: Zoster is unrelated. D) Eczema: Eczema is not autoimmune. E) Pityriasis rosea: PR is unrelated.","Alopecia areata."],"im":[]},{"id":"Q448","ch":"Melanocyte Disorders","q":"A male patient, 13 years old, presented with whitish patches involving his face, chest and both upper limbs. The condition started when he was four years old with a gradual onset and a progressive course. (Clinical photo: depigmented milky white patches on chest and arms.) What is the pathogenesis of vitiligo?","o":[["A","Congenital lack of pigmentation."],["B","Autoimmune destruction of melanocytes."],["C","Appearance of malformed melanocytes."],["D","Benign proliferation of melanocytes."],["E","Enlargement of melanocytes."]],"a":"B","sa":null,"pg":"86","f":[],"n":11,"e":["Cytotoxic T cells attack melanocytes in genetically predisposed patients, helped by oxidative stress; it is not fungal, viral or congenital. Why the other options are wrong: A) Congenital lack of pigmentation: It is acquired. C) Appearance of malformed melanocytes: Melanocytes are absent. D) Benign proliferation of melanocytes: Vitiligo is destruction of melanocytes, not proliferation (proliferation suggests nevi or melanoma). E) Enlargement of melanocytes: They are absent, not enlarged.","Autoimmune destruction of melanocytes."],"im":[]},{"id":"Q449","ch":"Melanocyte Disorders","q":"Vitiligo is caused by","o":[["A","Hyperproliferation of melanocytes."],["B","Excess melanin synthesis."],["C","Fungal infection."],["D","Autoimmune destruction of melanocytes."],["E","Viral infection."]],"a":"D","sa":null,"pg":"86","f":[],"n":12,"e":["Vitiligo results from autoimmune destruction of melanocytes, not overproduction or proliferation of them. Why the other options are wrong: A) Hyperproliferation of melanocytes: Melanocytes are lost. B) Excess melanin synthesis: Pigment is lost. C) Fungal infection: Fungal infection causes pityriasis versicolor (fine-scaly macules), not vitiligo. E) Viral infection: No viral cause; vitiligo is autoimmune, with cytotoxic T cells destroying melanocytes.","Autoimmune."],"im":[]},{"id":"Q450","ch":"Melanocyte Disorders","q":"A male patient, 23 years old, presented with milky white patches involving both hands and feet. The condition started four years ago with a gradual onset and a progressive course. Which is true regarding this disorder?","o":[["A","Considered an autoimmune disease."],["B","Treated by antiandrogens."],["C","Benign proliferation of melanocytes."],["D","Affects adults only."],["E","It is contagious."]],"a":"A","sa":null,"pg":"86","f":[],"n":13,"e":["Vitiligo is considered an autoimmune disease; it is not contagious, not a benign proliferation of melanocytes and not treated by anti-androgens. Why the other options are wrong: B) Treated by antiandrogens: Anti-androgens are not used. C) Benign proliferation of melanocytes: Melanocytes are lost. D) Affects adults only: Children get it too. E) It is contagious: Vitiligo is autoimmune and not contagious.","Autoimmune, non-infectious."],"im":[]},{"id":"Q451","ch":"Melanocyte Disorders","q":"In vitiligo, melanocytes are","o":[["A","Absent."],["B","Malformed."],["C","Non-functioning."],["D","Hyperactive."],["E","Enlarged."]],"a":"A","sa":null,"pg":"86","f":[],"n":14,"e":["Biopsy of a vitiligo patch shows complete absence of melanocytes, whereas in hypopigmentation they are present but less active. Why the other options are wrong: B) Malformed: They are absent. C) Non-functioning: They are absent. D) Hyperactive: They are absent. E) Enlarged: They are absent.","Absent."],"im":[]},{"id":"Q452","ch":"Melanocyte Disorders","q":"The damage in vitiligo is in","o":[["A","Keratinocytes."],["B","Langerhans cells."],["C","Melanocytes."],["D","Lymphocytes."],["E","Endothelial cells."]],"a":"C","sa":null,"pg":"86","f":[],"n":15,"e":["The target of the immune attack is the melanocyte (pigment cell), not the keratinocyte or Langerhans cell. Why the other options are wrong: A) Keratinocytes: Keratinocytes are intact. B) Langerhans cells: Langerhans cells are intact. D) Lymphocytes: Lymphocytes are the attackers. E) Endothelial cells: Endothelium is intact.","Melanocytes."],"im":[]},{"id":"Q453","ch":"Melanocyte Disorders","q":"Types of vitiligo include all of the following EXCEPT","o":[["A","Papular."],["B","Unilateral."],["C","Generalized."],["D","Focal."],["E","Universal."]],"a":"A","sa":null,"pg":"86","f":[],"n":16,"e":["Clinical types are focal, segmental, mucosal, vulgaris, acrofacial and universal. There is no papular type, since the primary lesion is a macule. Why the other options are wrong: B) Unilateral: A type (segmental). C) Generalized: A type. D) Focal: A type. E) Universal: A type.","Types: focal, segmental, mucosal, vulgaris, acrofacial, universal."],"im":[]},{"id":"Q454","ch":"Melanocyte Disorders","q":"Clinical types of vitiligo include","o":[["A","Focal type."],["B","Segmental type."],["C","Acrofacial vitiligo."],["D","Universal type."],["E","All of the above."]],"a":"E","sa":null,"pg":"86","f":[],"n":17,"e":["Clinical types include localized (focal, segmental, mucosal) and generalized (vulgaris, acrofacial, universal), so all of the above. Why the other options are wrong: A) Focal type: Focal: one area for at least 2 years, not segmental. True, but other types exist too. B) Segmental type: Segmental: unilateral, dermatomal, does not cross the midline. Also true. C) Acrofacial vitiligo: Acrofacial: face and distal extremities. Also true. D) Universal type: Universal: complete or nearly complete depigmentation. Also true.","Localized vs generalized."],"im":[]},{"id":"Q455","ch":"Melanocyte Disorders","q":"What is the diagnosis? (Clinical photo: well-defined depigmented milky white patches on the trunk and arms.)","o":[["A","Hypopigmented tinea versicolor."],["B","Tuberculoid leprosy."],["C","Vitiligo."],["D","Disseminated eczema."],["E","Post-inflammatory hypopigmentation."]],"a":"C","sa":null,"pg":"85","f":[],"n":18,"e":["Well-defined depigmented milky-white patches on trunk and arms are vitiligo; pityriasis alba is hypopigmented with fine scale and versicolor is scaly. Why the other options are wrong: A) Hypopigmented tinea versicolor: Versicolor is scaly. B) Tuberculoid leprosy: TT is anesthetic. D) Disseminated eczema: Eczema is itchy. E) Post-inflammatory hypopigmentation: Post-inflammatory has history.","Chalk-white, no scale."],"im":[]},{"id":"Q456","ch":"Melanocyte Disorders","q":"The following may be used in the treatment of vitiligo","o":[["A","Radiotherapy."],["B","Electrocautery."],["C","Cryocautery."],["D","Phototherapy."],["E","Physiotherapy."]],"a":"D","sa":null,"pg":"89","f":[],"n":19,"e":["Phototherapy (narrow-band UVB, excimer light, PUVA) is the backbone of vitiligo treatment because it stimulates residual melanocytes. Why the other options are wrong: A) Radiotherapy: Radiotherapy has no role here; vitiligo is treated by stopping the autoimmune process and stimulating repigmentation (phototherapy, steroids, calcineurin inhibitors). B) Electrocautery: Cautery is not used. C) Cryocautery: Cryo is not used. E) Physiotherapy: Physiotherapy does not act on melanocyte autoimmunity; phototherapy is the backbone.","Phototherapy backbone."],"im":[]},{"id":"Q457","ch":"Melanocyte Disorders","q":"A male patient, 33 years old, presented with white patches on his chest and both upper limbs. The condition started when he was 27 years old with a gradual onset and a progressive course. (Clinical photo: extensive depigmented white patches on the back.) Which of the following can be used in its treatment?","o":[["A","Radiotherapy."],["B","Systemic antibiotics."],["C","Topical retinoids."],["D","Narrowband UVB."],["E","Systemic antifungals."]],"a":"D","sa":null,"pg":"89","f":[],"n":20,"e":["Narrow-band UVB is the standard phototherapy for generalized vitiligo, which helps repigmentation. Why the other options are wrong: A) Radiotherapy: Radiotherapy has no role here; vitiligo is treated by stopping the autoimmune process and stimulating repigmentation (phototherapy, steroids, calcineurin inhibitors). B) Systemic antibiotics: Vitiligo is autoimmune, not bacterial, so antibiotics do nothing. C) Topical retinoids: Retinoids treat acne and keratinization disorders; they do not repigment vitiligo. E) Systemic antifungals: Vitiligo is autoimmune, not fungal (do not confuse it with pityriasis versicolor), so antifungals do nothing.","NB-UVB."],"im":[]},{"id":"Q458","ch":"Melanocyte Disorders","q":"One of the following is used in treatment of vitiligo","o":[["A","Radiotherapy."],["B","Topical calcineurin inhibitors."],["C","Systemic antibiotics."],["D","Systemic antifungals."]],"a":"B","sa":null,"pg":"89","f":[],"n":21,"e":["Topical calcineurin inhibitors (tacrolimus, pimecrolimus) stop the autoimmune process locally and are used especially on face and neck. Why the other options are wrong: A) Radiotherapy: Radiotherapy has no role here; vitiligo is treated by stopping the autoimmune process and stimulating repigmentation (phototherapy, steroids, calcineurin inhibitors). C) Systemic antibiotics: Vitiligo is autoimmune, not bacterial, so antibiotics do nothing. D) Systemic antifungals: Vitiligo is autoimmune, not fungal (do not confuse it with pityriasis versicolor), so antifungals do nothing.","Tacrolimus."],"im":[]},{"id":"Q459","ch":"Melanocyte Disorders","q":"The following drug could be used topically for treatment of vitiligo","o":[["A","Terbinafine."],["B","Azelaic acid 20%."],["C","Steroid."],["D","Crude coal tar."],["E","Permethrin lotion 5%."]],"a":"C","sa":null,"pg":"89","f":[],"n":22,"e":["Topical corticosteroids are used for stabilization and repigmentation in localized vitiligo. Terbinafine and permethrin are anti-infective agents. Why the other options are wrong: A) Terbinafine: Terbinafine is antifungal. B) Azelaic acid 20%: Azelaic acid is for acne. D) Crude coal tar: Coal tar is for psoriasis. E) Permethrin lotion 5%: Permethrin is for scabies.","Topical steroids."],"im":[]},{"id":"Q460","ch":"Melanocyte Disorders","q":"Vitiligo in a patient with hepatic failure can be treated by","o":[["A","Topical psoralen with ultraviolet A."],["B","Topical steroids."],["C","Ultraviolet B."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"89","f":[],"n":23,"e":["In hepatic failure oral drugs are avoided, so topical PUVA, topical steroids or UVB can all be used, i.e. all of the above. Why the other options are wrong: A) Topical psoralen with ultraviolet A: Topical PUVA acts on localized lesions without the liver metabolism of oral psoralen, so it is usable. B) Topical steroids: Topical steroids have little systemic absorption and stabilize the disease. C) Ultraviolet B: UVB acts on the skin locally, with no hepatic metabolism. E) None of the above: Wrong: A, B and C are all usable.","Topical/light-based treatments."],"im":[]},{"id":"H335","ch":"Melanocyte Disorders","q":"The following may be used in the treatment of vitiligo:","o":[["A","Radiotherapy."],["B","Electrocautery."],["C","Cryocautery."],["D","Phototherapy."],["E","Physiotherapy."]],"a":"D","sa":null,"pg":null,"f":[],"n":24,"e":["Phototherapy (NB-UVB, PUVA, excimer) is the main treatment of vitiligo; radiotherapy, cautery and cryocautery are not used. Why the other options are wrong: A) Radiotherapy: Radiotherapy has no role here; vitiligo is treated by stopping the autoimmune process and stimulating repigmentation (phototherapy, steroids, calcineurin inhibitors). B) Electrocautery: Cautery is not used. C) Cryocautery: Cryo is not used. E) Physiotherapy: Physiotherapy does not act on melanocyte autoimmunity; phototherapy is the backbone.","Phototherapy."],"im":[]},{"id":"H336","ch":"Melanocyte Disorders","q":"In vitiligo, melanocytes are:","o":[["A","Absent."],["B","Malformed."],["C","Non-functioning."],["D","Hyperactive."],["E","None of the above."]],"a":"A","sa":null,"pg":null,"f":[],"n":25,"e":["Melanocytes are completely absent in vitiligo patches, not just malformed or non-functioning. Why the other options are wrong: B) Malformed: They are absent. C) Non-functioning: They are absent. D) Hyperactive: They are absent. E) None of the above: Wrong: at least one of the listed statements is correct.","Absent."],"im":[]},{"id":"H340","ch":"Melanocyte Disorders","q":"Vitiligo may be confused with:","o":[["A","Pityriasis alba."],["B","Leprosy."],["C","Pityriasis versicolor."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":26,"e":["Vitiligo can be confused with pityriasis alba, leprosy (hypopigmented patches) and pityriasis versicolor; the history of total pigment loss and absent sensory loss helps. Why the other options are wrong: A) Pityriasis alba: Pityriasis alba: ill-defined hypopigmented (not depigmented) scaly patches, mostly in children. B) Leprosy: Leprosy: hypopigmented anesthetic patch (vitiligo has normal sensation). C) Pityriasis versicolor: Pityriasis versicolor: hypopigmented fine-scaly macules with yellow fluorescence. E) None of the above: Wrong: all three can mimic vitiligo.","All of the above."],"im":[]},{"id":"H341","ch":"Melanocyte Disorders","q":"Vitiligo is caused by:","o":[["A","Hyperproliferation of melanocytes."],["B","Excess melanin synthesis."],["C","Fungal infection."],["D","Autoimmune destruction of melanocytes."],["E","Viral infection."]],"a":"D","sa":null,"pg":null,"f":[],"n":27,"e":["Vitiligo results from autoimmune destruction of melanocytes by cytotoxic T cells. Why the other options are wrong: A) Hyperproliferation of melanocytes: Melanocytes are lost. B) Excess melanin synthesis: Pigment is lost. C) Fungal infection: Fungal infection causes pityriasis versicolor (fine-scaly macules), not vitiligo. E) Viral infection: No viral cause; vitiligo is autoimmune, with cytotoxic T cells destroying melanocytes.","Autoimmune."],"im":[]},{"id":"H344","ch":"Melanocyte Disorders","q":"A male patient, 23 years old presented with milky white patches involving both hands and feet. The condition started four years ago with a gradual onset and a progressive course. which is true regarding this disorder?","o":[["A","Considered an autoimmune disease."],["B","Treated by antiandrogens."],["C","Benign proliferation of melanocytes."],["D","Affects adults only."],["E","It is contagious."]],"a":"A","sa":null,"pg":null,"f":[],"n":28,"e":["Milky-white patches on the hands and feet for years, progressive, indicate vitiligo, an autoimmune disease. It is not contagious, not treated with anti-androgens, and is not limited to adults. Why the other options are wrong: B) Treated by antiandrogens: Anti-androgens are not used. C) Benign proliferation of melanocytes: Melanocytes are lost. D) Affects adults only: Children get it too. E) It is contagious: Vitiligo is autoimmune and not contagious.","Autoimmune, not contagious."],"im":[]},{"id":"H345","ch":"Melanocyte Disorders","q":"Which of the following can be used in treatment of vitiligo ?","o":[["A","Radiotherapy."],["B","Phototherapy."],["C","Systemic antibiotics."],["D","Systemic antifungals."],["E","Isotretinoin."]],"a":"B","sa":null,"pg":null,"f":[],"n":29,"e":["Phototherapy is a mainstay; antibiotics, antifungals, isotretinoin and radiotherapy have no role. Why the other options are wrong: A) Radiotherapy: Radiotherapy has no role here; vitiligo is treated by stopping the autoimmune process and stimulating repigmentation (phototherapy, steroids, calcineurin inhibitors). C) Systemic antibiotics: Vitiligo is autoimmune, not bacterial, so antibiotics do nothing. D) Systemic antifungals: Vitiligo is autoimmune, not fungal (do not confuse it with pityriasis versicolor), so antifungals do nothing. E) Isotretinoin: Isotretinoin is for acne.","Phototherapy."],"im":[]},{"id":"H346","ch":"Melanocyte Disorders","q":"Vitiligo as an autoimmune disease may be associated with:","o":[["A","Impetigo."],["B","Herpes zoster."],["C","Alopecia areata."],["D","Eczema."],["E","Pityriasis rosea."]],"a":"C","sa":null,"pg":null,"f":[],"n":30,"e":["Alopecia areata is autoimmune and is associated with generalized vitiligo, along with thyroid disease and type 1 diabetes. Why the other options are wrong: A) Impetigo: Impetigo is unrelated. B) Herpes zoster: Zoster is unrelated. D) Eczema: Eczema is not autoimmune. E) Pityriasis rosea: PR is unrelated.","Autoimmune cluster."],"im":[]},{"id":"H350","ch":"Melanocyte Disorders","q":"As regards vitiligo all of the following is true:","o":[["A","Itching is a prominent symptom."],["B","It is not heritable."],["C","Scalp may be affected."],["D","Family history is positive in all cases."],["E","Milky white papules are seen."]],"a":"C","sa":null,"pg":null,"f":[],"n":31,"e":["Vitiligo can affect the scalp (with white hair patches). It is not itchy, is heritable, and the lesions are macules, not papules. Why the other options are wrong: A) Itching is a prominent symptom: It is not itchy. B) It is not heritable: Genetic predisposition is part of the pathogenesis, and many patients have affected relatives. D) Family history is positive in all cases: Only some patients have a family history; predisposition does not mean every case is familial. E) Milky white papules are seen: The lesions are macules.","Scalp involved."],"im":[]},{"id":"H351","ch":"Melanocyte Disorders","q":"Vitiligo may affect all of the following areas EXCEPT:","o":[["A","Oral mucosa."],["B","Scalp."],["C","Palm."],["D","Penis."],["E","Areola."]],"a":"A","sa":null,"pg":null,"f":["Key (oral mucosa) is questionable: the book describes mucosal vitiligo, so every listed site can be affected. Please verify."],"n":32,"e":["Per the key, oral mucosa is the exception; however, the book describes mucosal vitiligo, so this answer is questionable. Please verify against the source. Why the other options are wrong: B) Scalp: The scalp can be affected. C) Palm: The palm can be affected. D) Penis: The penis can be affected. E) Areola: The areola can be affected.","Mucosal vitiligo exists."],"im":[]},{"id":"H352","ch":"Melanocyte Disorders","q":"A patient presented with well-circumscribed milky white patches involving both hands, feet, forearms and chest with a gradual onset and a progressive course. Which of the following can be used in treatment?","o":[["A","Antimalarials."],["B","Systemic antibiotics."],["C","Systemic antifungals."],["D","Isotretinoin."],["E","Phototherapy."]],"a":"E","sa":null,"pg":null,"f":[],"n":33,"e":["Well-circumscribed milky-white patches on hands, feet, forearms and chest, with gradual progression, are generalized vitiligo; phototherapy is used. Why the other options are wrong: A) Antimalarials: Antimalarials are used in lupus and lichen planus, not vitiligo. B) Systemic antibiotics: Vitiligo is autoimmune, not bacterial, so antibiotics do nothing. C) Systemic antifungals: Vitiligo is autoimmune, not fungal (do not confuse it with pityriasis versicolor), so antifungals do nothing. D) Isotretinoin: Isotretinoin is for acne.","Phototherapy."],"im":[]},{"id":"Q461","ch":"Hair Disorders","q":"Scarring alopecia may be caused by","o":[["A","Psoriasis."],["B","Seborrheic dermatitis."],["C","Fever."],["D","Lichen planus."],["E","Scaly tinea capitis."]],"a":"D","sa":null,"pg":"90","f":[],"n":1,"e":["Lichen planus of the scalp (lichen planopilaris) destroys follicles, leaving scarring alopecia, as do DLE, kerion and favus. Why the other options are wrong: A) Psoriasis: Psoriasis is non-scarring. B) Seborrheic dermatitis: Seb derm is non-scarring. C) Fever: Fever causes shedding. E) Scaly tinea capitis: Scaly ringworm is non-scarring.","LP can scar."],"im":[]},{"id":"Q462","ch":"Hair Disorders","q":"Hair loss is permanent and irreversible in","o":[["A","Cicatricial alopecia."],["B","Androgenetic alopecia."],["C","Telogen effluvium."],["D","Anagen effluvium."],["E","Alopecia areata."]],"a":"A","sa":null,"pg":"90","f":[],"n":2,"e":["In cicatricial alopecia the follicle is destroyed and replaced by scar tissue, so hair loss is permanent. Non-scarring types (androgenetic alopecia, telogen/anagen effluvium, alopecia areata) are reversible, at least in principle. Why the other options are wrong: B) Androgenetic alopecia: AGA is non-scarring. C) Telogen effluvium: TE is reversible. D) Anagen effluvium: Anagen effluvium is reversible. E) Alopecia areata: AA can regrow.","Scar = permanent."],"im":[]},{"id":"Q463","ch":"Hair Disorders","q":"Cicatricial alopecia occurs in the following disease","o":[["A","Tinea circinata."],["B","Psoriasis vulgaris."],["C","Systemic lupus erythematosus."],["D","Scaly ringworm."],["E","Favus."]],"a":"E","sa":null,"pg":"90","f":[],"n":3,"e":["Favus (yellow scutula) of the scalp causes cicatricial alopecia. Scaly ringworm and black-dot types usually heal without scar. Why the other options are wrong: A) Tinea circinata: Circinata is on the body. B) Psoriasis vulgaris: Psoriasis is non-scarring. C) Systemic lupus erythematosus: SLE is typically non-scarring. D) Scaly ringworm: Scaly ringworm is non-scarring.","Favus and kerion scar."],"im":[]},{"id":"Q464","ch":"Hair Disorders","q":"Cicatricial alopecia occurs in the following disease","o":[["A","Tinea circinata."],["B","Psoriasis vulgaris."],["C","Acne vulgaris."],["D","Systemic lupus erythematosus."],["E","Discoid lupus erythematosus."]],"a":"E","sa":null,"pg":"90","f":[],"n":4,"e":["DLE affecting the scalp ends in permanent cicatricial alopecia, so it appears among scarring causes. Why the other options are wrong: A) Tinea circinata: Circinata is on the body. B) Psoriasis vulgaris: Psoriasis is non-scarring. C) Acne vulgaris: Acne scars the face, not the scalp. D) Systemic lupus erythematosus: SLE is typically non-scarring.","DLE scars."],"im":[]},{"id":"Q465","ch":"Hair Disorders","q":"The following disease can cause cicatricial hair loss","o":[["A","Telogen effluvium."],["B","Discoid lupus erythematosus."],["C","Psoriasis."],["D","Seborrheic dermatitis."],["E","Pityriasis rosea."]],"a":"B","sa":null,"pg":"90","f":[],"n":5,"e":["DLE is a collagen disease that destroys follicles and causes permanent hair loss; telogen effluvium, psoriasis and seborrheic dermatitis do not. Why the other options are wrong: A) Telogen effluvium: TE is reversible. C) Psoriasis: Psoriasis is non-scarring. D) Seborrheic dermatitis: Seb derm is non-scarring. E) Pityriasis rosea: PR is not scalp.","DLE scars."],"im":[]},{"id":"Q467","ch":"Hair Disorders","q":"Cicatricial alopecia may be caused by","o":[["A","Warts."],["B","Vitiligo."],["C","Psoriasis."],["D","Burn."],["E","Alopecia areata."]],"a":"D","sa":null,"pg":"90","f":[],"n":6,"e":["Burns destroy the follicles directly, a physical cause of cicatricial alopecia, whereas warts, vitiligo, psoriasis and alopecia areata spare them. Why the other options are wrong: A) Warts: Warts are not destructive. B) Vitiligo: Vitiligo is pigment. C) Psoriasis: Psoriasis is non-scarring. E) Alopecia areata: AA is non-scarring.","Burn."],"im":[]},{"id":"Q468","ch":"Hair Disorders","q":"Scarring alopecia may be due to","o":[["A","Discoid LE."],["B","Lichen planus."],["C","Favus."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"90","f":[],"n":7,"e":["Scarring alopecia arises from trauma, burns, fungal infections (kerion, favus), zoster, DLE and lichen planus, so all of the above. Why the other options are wrong: A) Discoid LE: DLE scars. True, but B and C also scar. B) Lichen planus: Lichen planopilaris scars. True, but A and C also scar. C) Favus: Favus scars. True, but A and B also scar. E) None of the above: Wrong: all three scar.","Many causes."],"im":[]},{"id":"Q469","ch":"Hair Disorders","q":"Cicatricial alopecia is caused by all of the following diseases EXCEPT","o":[["A","Lichen planus."],["B","Trauma."],["C","Favus."],["D","Systemic lupus erythematosus."],["E","Kerion."]],"a":"D","sa":null,"pg":"90","f":[],"n":8,"e":["DLE, lichen planus, trauma, favus and kerion scar the scalp. The key lists SLE as the exception because it usually causes non-scarring diffuse hair loss. Why the other options are wrong: A) Lichen planus: It scars. B) Trauma: It scars. C) Favus: It scars. E) Kerion: It scars.","DLE ≠ SLE."],"im":[]},{"id":"Q470","ch":"Hair Disorders","q":"The following skin diseases may cause cicatricial alopecia EXCEPT","o":[["A","Discoid LE."],["B","Lichen planus."],["C","Favus."],["D","Alopecia areata."],["E","Kerion."]],"a":"D","sa":null,"pg":"90","f":[],"n":9,"e":["Alopecia areata attacks anagen follicles without destroying them, so it is non-scarring; the other diseases listed can scar. Why the other options are wrong: A) Discoid LE: It scars. B) Lichen planus: It scars. C) Favus: It scars. E) Kerion: It scars.","AA non-scarring."],"im":[]},{"id":"Q471","ch":"Hair Disorders","q":"Which of the following conditions causes non-cicatricial alopecia?","o":[["A","Discoid lupus."],["B","Herpes zoster."],["C","Alopecia areata."],["D","Lichen planus."],["E","Burn."]],"a":"C","sa":null,"pg":"93","f":[],"n":10,"e":["Alopecia areata, an immune attack on anagen follicles in a patch of otherwise normal skin, is non-cicatricial. DLE, zoster, lichen planus and burns scar. Why the other options are wrong: A) Discoid lupus: DLE scars. B) Herpes zoster: Zoster can scar. D) Lichen planus: LP scars. E) Burn: Burn scars.","AA = non-scarring."],"im":[]},{"id":"Q472","ch":"Hair Disorders","q":"Which of the following diseases can cause non-cicatricial alopecia?","o":[["A","Herpes zoster."],["B","Telogen effluvium."],["C","Favus."],["D","Basal cell carcinoma."],["E","Mechanical trauma."]],"a":"B","sa":null,"pg":"92","f":[],"n":11,"e":["Telogen effluvium (premature shift to telogen) causes diffuse reversible shedding without follicle destruction. Why the other options are wrong: A) Herpes zoster: Zoster can scar. C) Favus: Favus scars. D) Basal cell carcinoma: BCC destroys follicles. E) Mechanical trauma: Trauma can scar.","Reversible."],"im":[]},{"id":"Q473","ch":"Hair Disorders","q":"A female patient, 36 years old, presented with hair loss of 5 years duration with a gradual onset and a progressive course. She also complained of skin lesions on the face and ears that, on examination, were well-defined erythematous plaques covered with adherent scales as well as telangiectasia. (Clinical photo: scalp with scarring alopecia and atrophic depigmented and hyperpigmented patches.) This patient is presenting with","o":[["A","Androgenetic alopecia."],["B","Telogen effluvium."],["C","Anagen effluvium."],["D","Cicatricial alopecia."],["E","Alopecia areata."]],"a":"D","sa":null,"pg":"90","f":[],"n":12,"e":["Smooth shiny scalp patches without follicle openings indicate cicatricial alopecia, where follicles are destroyed. Why the other options are wrong: A) Androgenetic alopecia: AGA is non-scarring. B) Telogen effluvium: TE is reversible. C) Anagen effluvium: Anagen effluvium is acute. E) Alopecia areata: AA is non-scarring.","No follicular openings."],"im":[]},{"id":"Q474","ch":"Hair Disorders","q":"A female patient, 36 years old, presented with hair loss of 5 years duration with a gradual onset and a progressive course. She also complained of skin lesions on the face and ears that, on examination, were well-defined erythematous plaques covered with adherent scales as well as telangiectasia. (Clinical photo: scalp with scarring alopecia and atrophic depigmented and hyperpigmented patches.) What is the cause of this condition?","o":[["A","Toxicity of anagen hairs."],["B","Lymphocyte infiltrates around hair follicles."],["C","Activity of 5-alpha reductase enzyme in hair follicles."],["D","Destruction of hair follicles."],["E","Premature transformation of hair follicles into telogen phase."]],"a":"D","sa":null,"pg":"90","f":[],"n":13,"e":["In cicatricial alopecia the follicles themselves are destroyed (by inflammation, trauma or infection) and replaced by fibrous tissue. Why the other options are wrong: A) Toxicity of anagen hairs: That is anagen effluvium. B) Lymphocyte infiltrates around hair folli…: That is AA. C) Activity of 5-alpha reductase enzyme in…: That is AGA. E) Premature transformation of hair follicl…: That is TE.","Follicle destruction."],"im":[]},{"id":"Q475","ch":"Hair Disorders","q":"A male patient, 27 years old, presented with hair loss of five-year duration with a gradual onset and a progressive course. It began by frontal and bitemporal recession, and then it involved the vertex. (Clinical photo: male scalp with frontal/bitemporal recession and vertex thinning.) This patient is presenting with","o":[["A","Telogen effluvium."],["B","Anagen effluvium."],["C","Androgenetic alopecia."],["D","Cicatricial alopecia."],["E","Alopecia areata."]],"a":"C","sa":null,"pg":"91","f":[],"n":14,"e":["Hair thinning in a characteristic pattern (frontal and bitemporal recession then vertex in males) is androgenetic alopecia. Why the other options are wrong: A) Telogen effluvium: TE is diffuse. B) Anagen effluvium: Anagen effluvium is acute. D) Cicatricial alopecia: Scarring is localized. E) Alopecia areata: AA is patchy.","AGA pattern."],"im":[]},{"id":"Q476","ch":"Hair Disorders","q":"A male patient, 27 years old, presented with hair loss of five-year duration with a gradual onset and a progressive course. It began by frontal and bitemporal recession, and then it involved the vertex. (Clinical photo: male scalp with frontal/bitemporal recession and vertex thinning.) Which is true regarding this disease?","o":[["A","Treated by systemic corticosteroids."],["B","Affects males only."],["C","Pathology involves melanocytes."],["D","Caused by accentuated 5-alpha reductase activity in hair follicles."],["E","Contagious."]],"a":"D","sa":null,"pg":"91","f":[],"n":15,"e":["In androgenetic alopecia 5-alpha reductase activity increases in susceptible follicles, converting testosterone to the more potent DHT, which miniaturizes follicles. It is not treated by corticosteroids, not melanocyte-related and not contagious; it also occurs in females. Why the other options are wrong: A) Treated by systemic corticosteroids: Steroids do not treat AGA. B) Affects males only: Females are affected. C) Pathology involves melanocytes: Melanocytes are the target in vitiligo; hair-loss pathology here is in the follicle. E) Contagious: Not contagious.","5-alpha reductase → DHT."],"im":[]},{"id":"Q477","ch":"Hair Disorders","q":"Which of the following is TRUE about androgenetic alopecia?","o":[["A","It is a genetically determined cicatricial type of alopecia."],["B","Oral antiandrogens are used for treatment of male androgenetic alopecia."],["C","Minoxidil 2% is used in treatment of male (not female) androgenetic alopecia."],["D","Finasteride is contraindicated in male androgenetic alopecia."],["E","It is due to increased activity of 5-alpha reductase in target follicles."]],"a":"E","sa":null,"pg":"91","f":[],"n":16,"e":["AGA is genetically determined and non-cicatricial, caused by increased 5-alpha reductase activity in target follicles. Why the other options are wrong: A) It is a genetically determined cicatrici…: AGA is non-scarring. B) Oral antiandrogens are used for treatmen…: Antiandrogens feminize males. C) Minoxidil 2% is used in treatment of mal…: Minoxidil is used in both sexes. D) Finasteride is contraindicated in male a…: Finasteride is used.","5-AR ↑."],"im":[]},{"id":"Q478","ch":"Hair Disorders","q":"Diffuse hair loss involving the vertex of the scalp with maintenance of the frontal hairline is","o":[["A","Alopecia areata."],["B","Anagen effluvium."],["C","Male pattern baldness."],["D","Female pattern baldness."],["E","Telogen effluvium."]],"a":"D","sa":null,"pg":"91","f":[],"n":17,"e":["Female pattern hair loss involves the vertex with preservation of the frontal hairline; in males it begins with frontal and bitemporal recession. Why the other options are wrong: A) Alopecia areata: AA is patchy. B) Anagen effluvium: Anagen effluvium is acute. C) Male pattern baldness: Male is frontal and bitemporal. E) Telogen effluvium: TE is diffuse.","Female: vertex with intact frontal line."],"im":[]},{"id":"Q479","ch":"Hair Disorders","q":"Androgenetic alopecia in males can be treated by","o":[["A","Estrogens."],["B","Cyproterone acetate."],["C","Spironolactone."],["D","Topical minoxidil."],["E","Corticosteroids."]],"a":"D","sa":null,"pg":"92","f":[],"n":18,"e":["Topical minoxidil 2-5% and 5-alpha reductase inhibitors (finasteride) are used in males; antiandrogens and estrogens are not. Why the other options are wrong: A) Estrogens: Estrogens feminize. B) Cyproterone acetate: Cyproterone feminizes. C) Spironolactone: Spironolactone feminizes. E) Corticosteroids: Steroids do not help.","Minoxidil, finasteride."],"im":[]},{"id":"Q480","ch":"Hair Disorders","q":"Androgenetic alopecia can be treated by all of the following EXCEPT","o":[["A","Finasteride."],["B","Cyproterone acetate."],["C","Spironolactone."],["D","Topical minoxidil."],["E","Corticosteroids."]],"a":"E","sa":null,"pg":"92","f":[],"n":19,"e":["AGA is treated with minoxidil, finasteride, spironolactone (females) and transplantation. Corticosteroids have no role. Why the other options are wrong: A) Finasteride: Finasteride is a 5-alpha reductase inhibitor. B) Cyproterone acetate: Cyproterone acetate is an antiandrogen. C) Spironolactone: Spironolactone has antiandrogen action. D) Topical minoxidil: Topical minoxidil prolongs anagen.","No steroids."],"im":[]},{"id":"Q481","ch":"Hair Disorders","q":"Telogen effluvium is","o":[["A","A type of cicatricial alopecia."],["B","Diffuse hair loss."],["C","Alopecia totalis."],["D","Alopecia universalis."],["E","Ophiasis."]],"a":"B","sa":null,"pg":null,"f":[],"n":20,"e":["Telogen effluvium is a diffuse increase in hair shedding after follicles prematurely enter telogen, not a scarring alopecia. Why the other options are wrong: A) A type of cicatricial alopecia: It is non-scarring. C) Alopecia totalis: Totalis is total scalp. D) Alopecia universalis: Universalis is total body. E) Ophiasis: Ophiasis is marginal.","Diffuse."],"im":[]},{"id":"Q482","ch":"Hair Disorders","q":"A female patient presents with diffuse alopecia. She had suffered from typhoid fever 4 months back. The most probable diagnosis is","o":[["A","Androgenetic alopecia."],["B","Telogen effluvium."],["C","Anagen effluvium."],["D","Alopecia areata."],["E","Trichotillomania."]],"a":"B","sa":null,"pg":"92","f":[],"n":21,"e":["Diffuse alopecia appearing about 3-4 months after typhoid fever is telogen effluvium after a stressful (febrile) illness. Why the other options are wrong: A) Androgenetic alopecia: AGA is gradual. C) Anagen effluvium: Anagen effluvium follows toxins. D) Alopecia areata: AA is patchy. E) Trichotillomania: Trichotillomania is self-pulling.","3-4 months after the trigger."],"im":[]},{"id":"Q483","ch":"Hair Disorders","q":"A woman reports diffuse hair shedding three months after childbirth with a normal scalp. The diagnosis is","o":[["A","Telogen effluvium."],["B","Alopecia areata."],["C","Androgenetic alopecia."],["D","Ophiasis."],["E","Anagen effluvium."]],"a":"A","sa":null,"pg":"93","f":[],"n":22,"e":["Postpartum diffuse shedding with a normal scalp 3 months after childbirth is classic telogen effluvium. Why the other options are wrong: B) Alopecia areata: AA is patchy. C) Androgenetic alopecia: AGA is gradual. D) Ophiasis: Ophiasis is marginal. E) Anagen effluvium: Anagen effluvium follows toxins.","Postpartum."],"im":[]},{"id":"Q484","ch":"Hair Disorders","q":"Anagen effluvium is caused by","o":[["A","High fever."],["B","Surgical interventions."],["C","General anesthesia."],["D","Weight loss."],["E","Cytotoxic chemotherapy."]],"a":"E","sa":null,"pg":"93","f":[],"n":23,"e":["Cytotoxic chemotherapy, heavy metals, radiation and drugs like methotrexate poison actively growing anagen follicles, causing anagen effluvium. Fever and surgery cause telogen effluvium. Why the other options are wrong: A) High fever: Fever causes telogen effluvium. B) Surgical interventions: Surgery causes telogen effluvium. C) General anesthesia: Anesthesia causes telogen effluvium. D) Weight loss: Weight loss causes telogen effluvium.","Chemo = anagen effluvium."],"im":[]},{"id":"Q485","ch":"Hair Disorders","q":"A 17-year-old male presents with alopecia of gradual onset and progressive course 3 months after starting chemotherapy for lymphoma. The diagnosis is","o":[["A","Androgenetic alopecia."],["B","Telogen effluvium."],["C","Anagen effluvium."],["D","Alopecia areata."],["E","Cicatricial alopecia."]],"a":"C","sa":null,"pg":"93","f":[],"n":24,"e":["Hair loss after starting chemotherapy is anagen effluvium due to toxicity to active anagen roots. Why the other options are wrong: A) Androgenetic alopecia: AGA is gradual. B) Telogen effluvium: TE is later. D) Alopecia areata: AA is patchy. E) Cicatricial alopecia: It is non-scarring.","Chemotherapy."],"im":[]},{"id":"Q486","ch":"Hair Disorders","q":"A patient presented with hair loss of gradual onset and a rapidly progressive course, which started after receiving 2 chemotherapy sessions for lymphoma. (Clinical photo: scalp with diffuse sparse hair.) What is the cause of this disease?","o":[["A","Toxicity of anagen hairs."],["B","Lymphocyte infiltrates around hair follicles."],["C","Activity of 5-alpha reductase enzyme in hair follicles."],["D","Destruction of hair follicles."],["E","Premature transformation of hair follicles into telogen phase."]],"a":"A","sa":null,"pg":"93","f":[],"n":25,"e":["Anagen effluvium is caused by toxic injury to actively growing anagen follicles, e.g. chemotherapy, heavy metals and radiation. Why the other options are wrong: B) Lymphocyte infiltrates around hair folli…: That is AA. C) Activity of 5-alpha reductase enzyme in…: That is AGA. D) Destruction of hair follicles: That is scarring. E) Premature transformation of hair follicl…: That is TE.","Toxic."],"im":[]},{"id":"Q487","ch":"Hair Disorders","q":"Which of the following is considered an autoimmune disease?","o":[["A","Scaly ringworm."],["B","Androgenetic alopecia."],["C","Alopecia areata."],["D","Favus."],["E","Kerion."]],"a":"C","sa":null,"pg":"93","f":[],"n":26,"e":["Alopecia areata is an autoimmune disease against anagen follicles. Androgenetic alopecia is hormonal and fungal infections (kerion, favus, scaly ringworm) are infectious. Why the other options are wrong: A) Scaly ringworm: Fungal. B) Androgenetic alopecia: Hormonal. D) Favus: Fungal. E) Kerion: Fungal.","AA autoimmune."],"im":[]},{"id":"Q488","ch":"Hair Disorders","q":"A male patient, 27 years old, presented with several circumscribed areas of hair loss of one-year duration. He received several topical treatments to which he initially responded, but hair loss started again once he stopped treatment. On examination, scalp skin was completely normal with no scales or erythema. (Clinical photo: scalp with multiple well-circumscribed smooth patches of hair loss.) This patient is presenting with","o":[["A","Androgenetic alopecia."],["B","Telogen effluvium."],["C","Anagen effluvium."],["D","Cicatricial alopecia."],["E","Alopecia areata."]],"a":"E","sa":null,"pg":"93","f":[],"n":27,"e":["Circumscribed round patches of hair loss in normal-looking skin are alopecia areata. Why the other options are wrong: A) Androgenetic alopecia: AGA is patterned. B) Telogen effluvium: TE is diffuse. C) Anagen effluvium: Anagen effluvium is toxic. D) Cicatricial alopecia: Scarring is atrophic.","Patches, smooth."],"im":[]},{"id":"Q489","ch":"Hair Disorders","q":"A male patient, 27 years old, presented with several circumscribed areas of hair loss of one-year duration. He received several topical treatments to which he initially responded, but hair loss started again once he stopped treatment. On examination, scalp skin was completely normal with no scales or erythema. (Clinical photo: scalp with multiple well-circumscribed smooth patches of hair loss.) Which is true regarding this disease?","o":[["A","Considered an autoimmune disease."],["B","Treated by antiandrogens."],["C","Pathology involves melanocytes."],["D","Affects adults only."],["E","Contagious."]],"a":"A","sa":null,"pg":null,"f":[],"n":28,"e":["Alopecia areata is autoimmune, associated with thyroid disease, atopy and SLE; 10-20% have a family history. Why the other options are wrong: B) Treated by antiandrogens: Antiandrogens treat androgenetic alopecia; alopecia areata is autoimmune. C) Pathology involves melanocytes: Melanocytes are the target in vitiligo; hair-loss pathology here is in the follicle. D) Affects adults only: It affects all ages. E) Contagious: Not contagious.","Autoimmune."],"im":[]},{"id":"Q490","ch":"Hair Disorders","q":"Patchy, asymptomatic, non-scarring, sudden complete loss of hair in circumscribed areas of the scalp is called","o":[["A","Androgenetic alopecia."],["B","Telogen effluvium."],["C","Alopecia totalis."],["D","Alopecia areata."],["E","Anagen effluvium."]],"a":"D","sa":null,"pg":"94","f":[],"n":29,"e":["Patchy, sudden, asymptomatic, non-scarring hair loss in circumscribed areas is alopecia areata, an autoimmune disease. Why the other options are wrong: A) Androgenetic alopecia: AGA is gradual. B) Telogen effluvium: TE is diffuse. C) Alopecia totalis: Totalis is total. E) Anagen effluvium: Anagen effluvium is toxic.","Sudden non-scarring patches."],"im":[]},{"id":"Q491","ch":"Hair Disorders","q":"A 7-year-old female child presented with a circumscribed area of hair loss on the scalp. On examination, the skin of the affected area was normal. The diagnosis is","o":[["A","Cicatricial alopecia."],["B","Tinea capitis."],["C","Alopecia areata."],["D","Lichen planus."],["E","Discoid lupus erythematosus."]],"a":"C","sa":null,"pg":"93","f":[],"n":30,"e":["A well-demarcated patch of hair loss on normal smooth scalp in a child, with exclamation-mark hairs at its margin, is alopecia areata; tinea capitis has scales and broken hairs. Why the other options are wrong: A) Cicatricial alopecia: The skin is normal. B) Tinea capitis: Tinea has scales. D) Lichen planus: LP is scarring. E) Discoid lupus erythematosus: DLE is scarring.","No scales."],"im":[]},{"id":"Q493","ch":"Hair Disorders","q":"Clinical types of alopecia areata include all of the following EXCEPT","o":[["A","Patchy type."],["B","Marginal type."],["C","Mucocutaneous type."],["D","Alopecia totalis."],["E","Alopecia universalis."]],"a":"C","sa":null,"pg":"94","f":[],"n":31,"e":["Types are patchy, ophiasis, totalis and universalis; there is no mucocutaneous type. Why the other options are wrong: A) Patchy type: Patchy: one or more round bald patches. B) Marginal type: Marginal (ophiasis): loss along the scalp margins. D) Alopecia totalis: Totalis: total scalp hair loss. E) Alopecia universalis: Universalis: loss of all body hair.","No mucocutaneous."],"im":[]},{"id":"Q494","ch":"Hair Disorders","q":"In ophiasis","o":[["A","Hair loss occurs along the margins of the scalp."],["B","Total scalp hair loss occurs."],["C","Cicatricial alopecia is a complication."],["D","Total body hair loss occurs."],["E","A localized area of hair loss is present."]],"a":"A","sa":null,"pg":"94","f":[],"n":32,"e":["In ophiasis hair loss occurs along the scalp margins (temporal and occipital); it is usually resistant to therapy. Why the other options are wrong: B) Total scalp hair loss occurs: That is totalis. C) Cicatricial alopecia is a complication: It is non-scarring. D) Total body hair loss occurs: That is universalis. E) A localized area of hair loss is present: That is patchy.","Margins."],"im":[]},{"id":"Q495","ch":"Hair Disorders","q":"Marginal alopecia of the scalp is called","o":[["A","Alopecia totalis."],["B","Alopecia universalis."],["C","Ophiasis."],["D","Telogen effluvium."]],"a":"C","sa":null,"pg":"94","f":[],"n":33,"e":["Ophiasis is alopecia areata along the scalp margins. Why the other options are wrong: A) Alopecia totalis: Totalis is total scalp. B) Alopecia universalis: Universalis is total body. D) Telogen effluvium: TE is diffuse.","Ophiasis."],"im":[]},{"id":"Q496","ch":"Hair Disorders","q":"Alopecia areata along the scalp margins is named ___ and it is ___ (regarding response to treatment).","o":[],"a":null,"sa":"Ophiasis; usually resistant to therapy","pg":null,"f":[],"n":34,"e":["Ophiasis is a band-like loss along the scalp margins and usually resists treatment.","Poor response."],"im":[]},{"id":"Q497","ch":"Hair Disorders","q":"Alopecia totalis is","o":[["A","Localised loss of hair."],["B","Loss of the scalp and body hair."],["C","Loss of frontal scalp hair."],["D","Loss of all scalp hair."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":35,"e":["Alopecia totalis is loss of all scalp hair; loss of all body hair is alopecia universalis. Why the other options are wrong: A) Localised loss of hair: That is patchy. B) Loss of the scalp and body hair: That is universalis. C) Loss of frontal scalp hair: That is not totalis. E) None of the above: Wrong: at least one listed statement is correct.","Totalis = scalp; universalis = body."],"im":[]},{"id":"Q498","ch":"Hair Disorders","q":"Alopecia areata may be treated by","o":[["A","Corticosteroids."],["B","Spironolactone."],["C","Estrogens."],["D","Androgens."],["E","Cyproterone acetate."]],"a":"A","sa":null,"pg":"95","f":[],"n":36,"e":["Topical or intralesional corticosteroids are the first treatment for alopecia areata, with calcineurin inhibitors, minoxidil, PUVA and irritants. Why the other options are wrong: B) Spironolactone: Spironolactone is antiandrogen. C) Estrogens: Estrogens are not used. D) Androgens: Androgens worsen. E) Cyproterone acetate: Cyproterone is antiandrogen.","Steroids."],"im":[]},{"id":"Q499","ch":"Hair Disorders","q":"Alopecia areata may be treated by","o":[["A","Corticosteroids."],["B","Tincture iodine."],["C","PUVA."],["D","Minoxidil."],["E","All of the above."]],"a":"E","sa":null,"pg":"95","f":[],"n":37,"e":["Alopecia areata responds to corticosteroids, irritants like tincture iodine, PUVA and minoxidil, so all of the above. Why the other options are wrong: A) Corticosteroids: Corticosteroids (topical or intralesional) are used. True, but B, C and D are also used. B) Tincture iodine: Tincture iodine is a topical irritant used. True, but A, C and D are also used. C) PUVA: PUVA is used. True, but A, B and D are also used. D) Minoxidil: Minoxidil is used. True, but A, B and C are also used.","Several options."],"im":[]},{"id":"Q500","ch":"Hair Disorders","q":"Systemic corticosteroids are used to treat","o":[["A","Androgenetic alopecia."],["B","Alopecia areata."],["C","Psoriasis."],["D","Warts."],["E","Molluscum contagiosum."]],"a":"B","sa":null,"pg":"95","f":[],"n":38,"e":["Systemic corticosteroids are used in resistant or extensive alopecia areata (ophiasis, totalis, universalis). Why the other options are wrong: A) Androgenetic alopecia: AGA is hormonal. C) Psoriasis: Psoriasis uses MTX. D) Warts: Warts are destroyed. E) Molluscum contagiosum: Molluscum is destroyed.","Systemic steroids in extensive AA."],"im":[]},{"id":"H292","ch":"Hair Disorders","q":"The following may be observed in alopecia areata:","o":[["A","Itching."],["B","Comedones."],["C","Vesicles."],["D","Adherent scales."],["E","Exclamation mark hairs."]],"a":"E","sa":null,"pg":null,"f":[],"n":39,"e":["Exclamation-mark hairs, short broken hairs tapering toward the scalp, are seen at the border of alopecia areata patches. Itching, comedones, vesicles and adherent scales are not features. Why the other options are wrong: A) Itching: AA is not itchy. B) Comedones: Not seen in alopecia areata (comedones = acne, vesicles = viral/eczema); the scalp skin is smooth. C) Vesicles: Not seen in alopecia areata (comedones = acne, vesicles = viral/eczema); the scalp skin is smooth. D) Adherent scales: AA is non-scaly.","Exclamation hairs = AA."],"im":[]},{"id":"H293","ch":"Hair Disorders","q":"Clinical types of alopecia areata include all EXCEPT:","o":[["A","Patchy type."],["B","Marginal type."],["C","Mucocutaneous type."],["D","Alopecia totalis."],["E","Alopecia universalis."]],"a":"C","sa":null,"pg":null,"f":[],"n":40,"e":["Clinical types: patchy, ophiasis, totalis, universalis (marginal type is ophiasis). No mucocutaneous type. Why the other options are wrong: A) Patchy type: Patchy: one or more round bald patches. B) Marginal type: Marginal (ophiasis): loss along the scalp margins. D) Alopecia totalis: Totalis: total scalp hair loss. E) Alopecia universalis: Universalis: loss of all body hair.","No mucocutaneous."],"im":[]},{"id":"H294","ch":"Hair Disorders","q":"Androgenetic alopecia in males can be treated by:","o":[["A","Estrogens."],["B","Cyproterone acetate."],["C","Spironolactone."],["D","Topical minoxidil."],["E","All of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":41,"e":["Topical minoxidil and 5-alpha reductase inhibitors treat male AGA; estrogens and antiandrogens are for females. Why the other options are wrong: A) Estrogens: Estrogens feminize. B) Cyproterone acetate: Cyproterone feminizes. C) Spironolactone: Spironolactone feminizes. E) All of the above: Not all are used in males.","Minoxidil."],"im":[]},{"id":"H296","ch":"Hair Disorders","q":"17 year old male presenting with alopecia of gradual onset and progressive course 3 months after starting chemotherapy for lymphoma:","o":[["A","Androgenet alopecia"],["B","Telogen effluvium"],["C","Anagen effluvium"],["D","Alopecia areata"],["E","Cicatricial alopecia"]],"a":"C","sa":null,"pg":null,"f":[],"n":42,"e":["Hair loss starting 3 months after chemotherapy for lymphoma points to anagen effluvium (toxic to active follicles). Why the other options are wrong: A) Androgenet alopecia: AGA is gradual. B) Telogen effluvium: TE is later. D) Alopecia areata: AA is patchy. E) Cicatricial alopecia: It is non-scarring.","Chemo."],"im":[]},{"id":"H297","ch":"Hair Disorders","q":"In ophiasis:","o":[["A","Hair loss occurs along the margins of the scalp."],["B","Total scalp hair loss occurs."],["C","Cicatricial alopecia is a complication."],["D","Total body hair loss occurs."],["E","Localized area of hair loss is present."]],"a":"A","sa":null,"pg":null,"f":[],"n":43,"e":["Hair loss along the scalp margins is ophiasis, a type of alopecia areata; it is not cicatricial and is not total. Why the other options are wrong: B) Total scalp hair loss occurs: That is totalis. C) Cicatricial alopecia is a complication: It is non-scarring. D) Total body hair loss occurs: That is universalis. E) Localized area of hair loss is present: That is patchy.","Margins."],"im":[]},{"id":"H298","ch":"Hair Disorders","q":"Case 2 A male patient, 27 years old, presented with hair loss of five- year duration with a gradual onset and a progressive course. It began by frontal and bitemporal recession, and then it involved the vertex. This patient is presenting with:","o":[["A","Telogen effluvium."],["B","Anagen effluvium."],["C","Androgenetic alopecia."],["D","Cicatricial alopecia."],["E","Alopecia areata."]],"a":"C","sa":null,"pg":null,"f":[],"n":44,"e":["Slow progressive hair loss starting with frontal and bitemporal recession then the vertex in a young man is androgenetic alopecia. Why the other options are wrong: A) Telogen effluvium: TE is diffuse. B) Anagen effluvium: Anagen effluvium is acute. D) Cicatricial alopecia: Scarring is localized. E) Alopecia areata: AA is patchy.","Male pattern."],"im":[]},{"id":"H299","ch":"Hair Disorders","q":"Which is TRUE regarding androgenetic alopecia?","o":[["A","Treated by systemic corticosteroids."],["B","Affects males only."],["C","Pathology involves melanocytes."],["D","Caused by accentuated 5-alpha reductase activity in hair follicles."],["E","Contagious."]],"a":"D","sa":null,"pg":null,"f":[],"n":45,"e":["AGA is due to accentuated 5-alpha reductase in follicles. It is not treated by systemic steroids, affects both sexes and does not involve melanocytes. Why the other options are wrong: A) Treated by systemic corticosteroids: Steroids do not treat AGA. B) Affects males only: Females are affected. C) Pathology involves melanocytes: Melanocytes are the target in vitiligo; hair-loss pathology here is in the follicle. E) Contagious: Not contagious.","5-AR."],"im":[]},{"id":"H301","ch":"Hair Disorders","q":"Exclamation mark hair is present in:","o":[["A","Androgenetic alopecia."],["B","Alopecia areata."],["C","Telogen effluvium."],["D","Anagen effluvium."]],"a":"B","sa":null,"pg":null,"f":[],"n":46,"e":["Exclamation-mark hairs, broken tapered hairs at the margin of patches, are specific to alopecia areata. Why the other options are wrong: A) Androgenetic alopecia: AGA has miniaturization. C) Telogen effluvium: TE has club hairs. D) Anagen effluvium: Anagen effluvium has tapered hairs.","Exclamation hairs."],"im":[]},{"id":"H305","ch":"Hair Disorders","q":"Which of the following is considered an autoimmune disease?","o":[["A","Scaly ringworm."],["B","Androgenetic alopecia."],["C","Alopecia areata."],["D","Favus."],["E","Kerion."]],"a":"C","sa":null,"pg":null,"f":[],"n":47,"e":["Alopecia areata is autoimmune; androgenetic alopecia is hormonal, others are fungal. Why the other options are wrong: A) Scaly ringworm: Fungal. B) Androgenetic alopecia: Hormonal. D) Favus: Fungal. E) Kerion: Fungal.","AA autoimmune."],"im":[]},{"id":"H307","ch":"Hair Disorders","q":"Which of the following is TRUE about androgenetic alopecia?","o":[["A","It is a genetically determined cicatricial type of alopecia."],["B","Oral antiandrogens are used for treatment of male androgenetic alopecia."],["C","Minoxidil 2% is used in treatment of male (not female) androgenetic alopecia."],["D","Finasteride is contraindicated in male androgenetic alopecia."],["E","Is due to increased activity of 5 alfa-reductase in target follicles."]],"a":"E","sa":null,"pg":null,"f":[],"n":48,"e":["AGA is genetically determined, non-cicatricial, treated by minoxidil (males and females), antiandrogens only in females, and due to increased 5-alpha reductase. Finasteride is used in males, not contraindicated. Why the other options are wrong: A) It is a genetically determined cicatrici…: AGA is non-scarring. B) Oral antiandrogens are used for treatmen…: Antiandrogens feminize males. C) Minoxidil 2% is used in treatment of mal…: Minoxidil is used in both sexes. D) Finasteride is contraindicated in male a…: Finasteride is used.","5-AR increased."],"im":[]},{"id":"Q501","ch":"Acne Vulgaris","q":"Acne is a chronic inflammatory disorder of the","o":[["A","Pilosebaceous units."],["B","Eccrine sweat glands."],["C","Apocrine sweat glands."],["D","Superficial dermis."],["E","Epidermis."]],"a":"A","sa":null,"pg":"96","f":[],"n":1,"e":["Acne vulgaris is a chronic inflammatory disorder of the pilosebaceous unit (hair follicle plus sebaceous gland), not of sweat glands. Why the other options are wrong: B) Eccrine sweat glands: Eccrine glands are sweat glands with no follicle; acne arises in the pilosebaceous unit (follicle plus sebaceous gland). C) Apocrine sweat glands: Apocrine glands (axilla, groin) are involved in other diseases such as hidradenitis; acne is pilosebaceous. D) Superficial dermis: Acne starts in the follicle; the dermis is inflamed only after follicular rupture. E) Epidermis: Not the epidermis alone.","Pilosebaceous."],"im":[]},{"id":"Q502","ch":"Acne Vulgaris","q":"Acne vulgaris is due to involvement of","o":[["A","Sebaceous glands."],["B","Eccrine glands."],["C","Pilosebaceous glands."],["D","Apocrine glands."],["E","Sweat glands."]],"a":"C","sa":null,"pg":null,"f":[],"n":2,"e":["Acne arises in the pilosebaceous glands of the face, chest and back, where sebum production is under androgen control. Why the other options are wrong: A) Sebaceous glands: The gland alone is incomplete. B) Eccrine glands: Eccrine glands are not involved. D) Apocrine glands: Apocrine glands are not involved. E) Sweat glands: Sweat glands are not involved.","Face, chest, back."],"im":[]},{"id":"Q503","ch":"Acne Vulgaris","q":"Acne vulgaris","o":[["A","Is cured by topical steroids."],["B","Is an infectious disease."],["C","Causes itching that increases at night."],["D","Is a disease of the pilosebaceous unit."],["E","Is characterized by vesicle formation."]],"a":"D","sa":null,"pg":"96","f":[],"n":3,"e":["Acne is a disease of the pilosebaceous unit, involving follicular keratinization, sebum and Cutibacterium acnes. Why the other options are wrong: A) Is cured by topical steroids: Steroids worsen acne. B) Is an infectious disease: Acne is multifactorial (keratinization, sebum, Cutibacterium acnes); the bacterium is a skin commensal, not a contagious infection. C) Causes itching that increases at night: It is not itchy. E) Is characterized by vesicle formation: Acne lesions are comedones, papules, pustules, nodules and cysts; vesicles belong to viral or eczematous diseases.","3 factors."],"im":[]},{"id":"Q504","ch":"Acne Vulgaris","q":"Acne vulgaris is","o":[["A","A superficial streptococcal infection."],["B","A human papilloma viral infection."],["C","Best treated by systemic steroids."],["D","May affect palms and soles."],["E","A disease of pilosebaceous follicles."]],"a":"E","sa":null,"pg":null,"f":[],"n":4,"e":["Acne is a disease of the pilosebaceous follicles, with retained keratinocytes blocking the follicle opening and sebum accumulating. Why the other options are wrong: A) A superficial streptococcal infection: Streptococci cause impetigo and erysipelas; the acne organism is Cutibacterium acnes. B) A human papilloma viral infection: HPV causes warts; acne has no viral cause. C) Best treated by systemic steroids: Steroids worsen. D) May affect palms and soles: It spares palms and soles.","Follicle."],"im":[]},{"id":"Q505","ch":"Acne Vulgaris","q":"Regarding acne vulgaris, choose the correct answer","o":[["A","Staphylococcus aureus is involved in the pathogenesis."],["B","An infectious disease."],["C","A chronic inflammation of the pilosebaceous units."],["D","Treated by topical and systemic steroids."],["E","Clinical lesions include papules, vesicles, nodules and cysts."]],"a":"C","sa":null,"pg":"96","f":[],"n":5,"e":["Acne is chronic inflammation of the pilosebaceous units; it is not an infection, not treated with steroids and has no vesicles. Why the other options are wrong: A) Staphylococcus aureus is involved in the…: Staph is not the key. B) An infectious disease: Acne is multifactorial (keratinization, sebum, Cutibacterium acnes); the bacterium is a skin commensal, not a contagious infection. D) Treated by topical and systemic steroids: Steroids worsen. E) Clinical lesions include papules, vesicl…: Acne lesions are comedones, papules, pustules, nodules and cysts; vesicles belong to viral or eczematous diseases.","Chronic inflammation."],"im":[]},{"id":"Q506","ch":"Acne Vulgaris","q":"Which of the following is true about acne vulgaris?","o":[["A","It is an infectious disease."],["B","Lesions include comedones, papules, vesicles and nodulocysts."],["C","Chronic inflammation of the pilosebaceous unit."],["D","There is colonization of pilosebaceous units by Streptococcus acnes."]],"a":"C","sa":null,"pg":"96","f":[],"n":6,"e":["Chronic inflammation of the pilosebaceous unit with retained keratinocytes blocking the follicle is the correct description. Why the other options are wrong: A) It is an infectious disease: Acne is multifactorial (keratinization, sebum, Cutibacterium acnes); the bacterium is a skin commensal, not a contagious infection. B) Lesions include comedones, papules, vesi…: Acne lesions are comedones, papules, pustules, nodules and cysts; vesicles belong to viral or eczematous diseases. D) There is colonization of pilosebaceous u…: The organism in the pilosebaceous unit is Cutibacterium acnes, not streptococcus.","Not infectious."],"im":[]},{"id":"Q507","ch":"Acne Vulgaris","q":"The following disease is NOT contagious","o":[["A","Scabies."],["B","Pediculosis capitis."],["C","Ecthyma."],["D","Leprosy."],["E","Acne."]],"a":"E","sa":null,"pg":"96","f":[],"n":7,"e":["Acne is not contagious: it results from follicular keratinization, androgens and bacterial colonization (commensal C. acnes). Why the other options are wrong: A) Scabies: Contagious. B) Pediculosis capitis: Contagious. C) Ecthyma: Contagious. D) Leprosy: Contagious.","Not contagious."],"im":[]},{"id":"Q508","ch":"Acne Vulgaris","q":"Acne vulgaris is:","o":[["A","A disease of the pilosebaceous apparatus."],["B","A disease which commonly affects the face."],["C","A disease which can be treated by oral tetracyclines."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"96","f":[],"n":8,"e":["Acne is a chronic inflammatory disease of pilosebaceous units seen in adolescence and involving face, chest and back, so all of the above. Why the other options are wrong: A) A disease of the pilosebaceous apparatus: Acne is a disease of the pilosebaceous apparatus. True, but B and C are true too. B) A disease which commonly affects the face: Acne mostly affects the face (also back, chest, shoulders). True, but A and C are true too. C) A disease which can be treated by oral t…: Oral tetracyclines are used for moderate to severe acne. True, but A and B are true too. E) None of the above: Wrong: A, B and C are all true.","All."],"im":[]},{"id":"Q509","ch":"Acne Vulgaris","q":"Acne vulgaris:","o":[["A","May affect palms and soles."],["B","Is a disease of sweat glands."],["C","Commonly affects the scalp."],["D","Is a disease of adolescents."],["E","Causes itching which increases by night."]],"a":"D","sa":null,"pg":"96","f":[],"n":9,"e":["Acne vulgaris peaks in adolescence under androgen influence, although it may start or persist in adulthood. It does not affect palms and soles (no pilosebaceous units). Why the other options are wrong: A) May affect palms and soles: Palms and soles lack follicles. B) Is a disease of sweat glands: It is pilosebaceous. C) Commonly affects the scalp: The face is common. E) Causes itching which increases by night: It is not itchy.","Adolescents."],"im":[]},{"id":"Q510","ch":"Acne Vulgaris","q":"Which of the following statements about acne vulgaris is INCORRECT?","o":[["A","It is a disease of adolescence."],["B","Primary lesion is a comedone."],["C","Severe forms can be treated by systemic retinoids."],["D","It is a disease of the pilosebaceous unit."],["E","It is best treated by topical steroids."]],"a":"E","sa":null,"pg":"99","f":[],"n":10,"e":["Topical steroids worsen or cause acneiform eruptions, so 'best treated by topical steroids' is wrong. Retinoids, benzoyl peroxide and antibiotics are used. Why the other options are wrong: A) It is a disease of adolescence: The peak incidence is in adolescence. B) Primary lesion is a comedone: The comedone is the primary lesion (non-inflammatory keratinous impaction). C) Severe forms can be treated by systemic …: Severe nodulocystic or scarring acne is treated with systemic retinoids. D) It is a disease of the pilosebaceous unit: Acne is a chronic inflammatory disease of the pilosebaceous unit.","Steroids worsen acne."],"im":[]},{"id":"Q511","ch":"Acne Vulgaris","q":"In acne vulgaris,","o":[["A","There is loss of melanocytes."],["B","The sebum composition is normal."],["C","There is colonization of pilosebaceous units by Strep. acnes."],["D","Lesions include comedones, vesicles and nodulocysts."],["E","There is increased proliferation of keratinocytes."]],"a":"E","sa":null,"pg":"96","f":[],"n":11,"e":["Abnormal follicular keratinization with proliferation of keratinocytes blocks the follicle opening, forming the comedone. Why the other options are wrong: A) There is loss of melanocytes: Melanocytes are intact. B) The sebum composition is normal: Sebum composition changes. C) There is colonization of pilosebaceous u…: The organism is P. acnes. D) Lesions include comedones, vesicles and …: Acne lesions are comedones, papules, pustules, nodules and cysts; vesicles belong to viral or eczematous diseases.","Keratin plug."],"im":[]},{"id":"Q512","ch":"Acne Vulgaris","q":"The following organism is related to acne vulgaris","o":[["A","Malassezia furfur."],["B","Corynebacterium minutissimum."],["C","Propionibacterium acnes."],["D","Streptococcus haemolyticus."],["E","Pityrosporum ovale."]],"a":"C","sa":null,"pg":"96","f":[],"n":12,"e":["Cutibacterium (Propionibacterium) acnes colonizes the pilosebaceous unit; Malassezia is linked to seborrheic dermatitis and Corynebacterium to erythrasma. Why the other options are wrong: A) Malassezia furfur: Malassezia is seb derm. B) Corynebacterium minutissimum: Corynebacterium is erythrasma. D) Streptococcus haemolyticus: Strep is impetigo. E) Pityrosporum ovale: Pityrosporum is Malassezia.","P. acnes."],"im":[]},{"id":"Q513","ch":"Acne Vulgaris","q":"The bacteria that multiply in blocked skin pores, metabolize sebum, and can lead to the development of acne are:","o":[["A","Staphylococcus aureus."],["B","Mycobacteria."],["C","Corynebacterium minutissimum."],["D","Streptococcus pyogenes."],["E","Propionibacterium."]],"a":"E","sa":null,"pg":"96","f":[],"n":13,"e":["Propionibacterium (Cutibacterium) multiplies in blocked pores and metabolizes sebum, driving inflammation. Why the other options are wrong: A) Staphylococcus aureus: S. aureus causes boils. B) Mycobacteria: Mycobacteria cause leprosy. C) Corynebacterium minutissimum: Corynebacterium causes erythrasma. D) Streptococcus pyogenes: Strep causes impetigo.","P. acnes."],"im":[]},{"id":"Q514","ch":"Acne Vulgaris","q":"Which organism in the pilosebaceous unit is involved in the pathogenesis of acne vulgaris?","o":[],"a":null,"sa":"Cutibacterium (Propionibacterium) acnes.","pg":"96","f":[],"n":14,"e":["Cutibacterium acnes (formerly Propionibacterium) is the organism in acne pathogenesis.","C. acnes."],"im":[]},{"id":"Q515","ch":"Acne Vulgaris","q":"In acne vulgaris","o":[["A","There is loss of melanocytes."],["B","Sebum composition is normal."],["C","There is colonization of pilosebaceous units by Strep. acnes."],["D","Lesions include comedones, vesicles & nodulocysts."],["E","Retinoids are used for treatment."]],"a":"E","sa":null,"pg":"99","f":[],"n":15,"e":["Retinoids normalize follicular keratinization and are anti-inflammatory; they are used topically and orally. Why the other options are wrong: A) There is loss of melanocytes: Melanocytes are intact. B) Sebum composition is normal: Sebum composition changes. C) There is colonization of pilosebaceous u…: The organism is P. acnes. D) Lesions include comedones, vesicles & no…: Acne lesions are comedones, papules, pustules, nodules and cysts; vesicles belong to viral or eczematous diseases.","Retinoids."],"im":[]},{"id":"Q516","ch":"Acne Vulgaris","q":"The following lesions are present in acne vulgaris EXCEPT","o":[["A","Papules."],["B","Comedones."],["C","Pustules."],["D","Nodules."],["E","Vesicles."]],"a":"E","sa":null,"pg":"96","f":[],"n":16,"e":["Acne lesions are comedones, papules, pustules, nodules and cysts. Vesicles are not part of acne. Why the other options are wrong: A) Papules: Present. B) Comedones: Present. C) Pustules: Present. D) Nodules: Present.","No vesicles."],"im":[]},{"id":"Q517","ch":"Acne Vulgaris","q":"The lesions in acne vulgaris include:","o":[["A","Comedones, pustules, nodules."],["B","Comedones, furrows, cysts."],["C","Papules, macules, vesicles."],["D","Papules, nodules, bullae."],["E","Pustules, vesicles, scars."]],"a":"A","sa":null,"pg":"96","f":[],"n":17,"e":["Acne lesions include comedones, pustules, nodules (and papules and cysts); none are vesicles. Why the other options are wrong: B) Comedones, furrows, cysts: Furrows are scabies. C) Papules, macules, vesicles: A papule is raised; vitiligo lesions are flat (macules/patches). D) Papules, nodules, bullae: Bullae are not acne. E) Pustules, vesicles, scars: Vesicles are not acne.","Polymorphic."],"im":[]},{"id":"Q518","ch":"Acne Vulgaris","q":"In acne vulgaris","o":[["A","Lesions are monomorphic, primary lesion is a comedone."],["B","Lesions are polymorphic, primary lesion is a cyst."],["C","Lesions are polymorphic, primary lesion is a comedone."],["D","Lesions are monomorphic, primary lesion is a pustule."],["E","Lesions are comedones, papules, vesicles, pustules & cysts."]],"a":"C","sa":null,"pg":"96","f":[],"n":18,"e":["Acne is polymorphic (many lesion types) and the primary lesion is the comedone. Why the other options are wrong: A) Lesions are monomorphic, primary lesion …: It is polymorphic. B) Lesions are polymorphic, primary lesion …: The primary lesion is a comedone. D) Lesions are monomorphic, primary lesion …: It is polymorphic. E) Lesions are comedones, papules, vesicles…: Acne lesions are comedones, papules, pustules, nodules and cysts; vesicles belong to viral or eczematous diseases.","Comedone."],"im":[]},{"id":"Q519","ch":"Acne Vulgaris","q":"Scarring can occur as a result of","o":[["A","Psoriasis."],["B","Urticaria."],["C","Nodular acne."],["D","Actinic lichen planus."],["E","Erythrasma."]],"a":"C","sa":null,"pg":"96","f":[],"n":19,"e":["Inflammatory nodular and cystic acne destroys deep follicular tissue and scars, unlike psoriasis, urticaria or erythrasma. Why the other options are wrong: A) Psoriasis: Psoriasis is non-scarring. B) Urticaria: Urticaria is non-scarring. D) Actinic lichen planus: Actinic LP is non-scarring. E) Erythrasma: Erythrasma is non-scarring.","Nodulocystic scars."],"im":[]},{"id":"Q520","ch":"Acne Vulgaris","q":"A patient is concerned his acne will leave scarring; which lesion is more likely to cause such a complication?","o":[["A","Comedones."],["B","Papules."],["C","Nodulocystic lesions."],["D","Plaques."],["E","Macules."]],"a":"C","sa":null,"pg":"96","f":[],"n":20,"e":["Nodulocystic lesions, being deep inflammatory, carry the highest risk of scarring. Why the other options are wrong: A) Comedones: Comedones rarely scar. B) Papules: Papules rarely scar. D) Plaques: Plaques are not acne. E) Macules: Macules are not acne.","Nodulocystic scars."],"im":[]},{"id":"Q521","ch":"Acne Vulgaris","q":"A female patient, 21 years old, single, presented with facial lesions. She stated that it all started since she was 15 years old with remissions and exacerbations. Lesions exacerbated during her menstruation. Patient's face was oily. (Clinical photo: papules and pustules on the cheeks and chin.) This patient suffers from","o":[["A","Actinic lichen."],["B","Furuncles."],["C","Acne vulgaris."],["D","Impetigo of Bockhart."],["E","Systemic lupus."]],"a":"C","sa":null,"pg":"96","f":[],"n":21,"e":["Comedones, papules and pustules on the face of an adolescent are acne vulgaris. Why the other options are wrong: A) Actinic lichen: Actinic LP is violaceous. B) Furuncles: Furuncles are single. D) Impetigo of Bockhart: Bockhart is infectious. E) Systemic lupus: SLE is photosensitive.","Acne."],"im":[]},{"id":"Q522","ch":"Acne Vulgaris","q":"A male patient, 24 years old, presented with skin lesions on his face. The condition started since he was 14 years old with remissions and exacerbations. (Clinical photo: papules and pustules on the cheek.) This patient suffers from","o":[["A","Folliculitis."],["B","Molluscum contagiosum."],["C","Contact eczema."],["D","Acne vulgaris."],["E","Furunculosis."]],"a":"D","sa":null,"pg":"96","f":[],"n":22,"e":["Polymorphic facial lesions with comedones are acne vulgaris. Why the other options are wrong: A) Folliculitis: Folliculitis is pustular only. B) Molluscum contagiosum: Molluscum is umbilicated. C) Contact eczema: Contact eczema is itchy. E) Furunculosis: Furunculosis is boils.","Acne."],"im":[]},{"id":"Q523","ch":"Acne Vulgaris","q":"A patient with comedones and few or no papules on his face has","o":[["A","Mild acne."],["B","Sycosis barbae."],["C","Bockhart impetigo."],["D","Acne conglobata."],["E","Folliculitis."]],"a":"A","sa":null,"pg":"97","f":[],"n":23,"e":["A patient with only comedones and few or no papules has mild acne (non-inflammatory acne). Why the other options are wrong: B) Sycosis barbae: Sycosis is beard. C) Bockhart impetigo: Bockhart is pustular. D) Acne conglobata: Conglobata is severe. E) Folliculitis: Folliculitis is pustular.","Mild acne."],"im":[]},{"id":"Q524","ch":"Acne Vulgaris","q":"A teenage boy presents with oily skin, comedones, and inflammatory papules on face and back. First- line therapy includes topical:","o":[["A","Calcipotriol."],["B","Terbinafine."],["C","Crotamiton 10%."],["D","Retinoids."],["E","Steroid."]],"a":"D","sa":null,"pg":"99","f":[],"n":24,"e":["Oily skin with comedones and inflammatory papules is acne; topical retinoids are first-line because they normalize keratinization. Why the other options are wrong: A) Calcipotriol: Calcipotriol is for psoriasis. B) Terbinafine: Terbinafine is antifungal. C) Crotamiton 10%: Crotamiton is for scabies. E) Steroid: Steroids worsen acne.","Topical retinoid."],"im":[]},{"id":"Q525","ch":"Acne Vulgaris","q":"An adolescent with comedones and papules on the skin is treated with which topical agent?","o":[],"a":null,"sa":"Topical benzoyl peroxide (other topical options: retinoids, erythromycin/clindamycin, azelaic acid)","pg":"99","f":[],"n":25,"e":["Comedones and papules are treated with topical agents: retinoids, benzoyl peroxide, antibiotics (erythromycin, clindamycin) or azelaic acid.","Topical first."],"im":[]},{"id":"Q526","ch":"Acne Vulgaris","q":"Benzoyl peroxide may be used in the treatment of","o":[["A","Scabies."],["B","Acne vulgaris."],["C","Phthirus pubis."],["D","Impetigo."],["E","Pediculosis."]],"a":"B","sa":null,"pg":"99","f":[],"n":26,"e":["Benzoyl peroxide 2.5-10% is a bactericidal agent against C. acnes with no resistance. Why the other options are wrong: A) Scabies: Scabies uses permethrin. C) Phthirus pubis: Phthirus uses permethrin. D) Impetigo: Impetigo uses antibiotics. E) Pediculosis: Pediculosis uses permethrin.","BPO for acne."],"im":[]},{"id":"Q527","ch":"Acne Vulgaris","q":"Benzoyl peroxide is used in the treatment of:","o":[["A","Scabies."],["B","Pediculosis."],["C","Phthirus pubis."],["D","None of the above."]],"a":"D","sa":null,"pg":"99","f":[],"n":27,"e":["Benzoyl peroxide treats acne, not scabies, lice or fungal infection, so the listed non-acne options are wrong. Why the other options are wrong: A) Scabies: Scabies uses permethrin. B) Pediculosis: Pediculosis uses permethrin. C) Phthirus pubis: Phthirus uses permethrin.","BPO = acne only."],"im":[]},{"id":"Q528","ch":"Acne Vulgaris","q":"Acne vulgaris is","o":[["A","Cured by topical steroids."],["B","An infectious disease."],["C","Treated by oral retinoids in its nodulocystic forms."],["D","A disease affecting skin and mucous membranes."],["E","A disease of sweat glands."]],"a":"C","sa":null,"pg":"99","f":[],"n":28,"e":["Nodulocystic acne is severe and treated with oral retinoids (isotretinoin). Why the other options are wrong: A) Cured by topical steroids: Steroids worsen. B) An infectious disease: Acne is multifactorial (keratinization, sebum, Cutibacterium acnes); the bacterium is a skin commensal, not a contagious infection. D) A disease affecting skin and mucous memb…: Mucosa is spared. E) A disease of sweat glands: It is pilosebaceous.","Isotretinoin."],"im":[]},{"id":"Q529","ch":"Acne Vulgaris","q":"A 17-year-old female presented with multiple papules, pustules, nodules and cysts on her face. What is the appropriate systemic treatment for such a case?","o":[["A","Methotrexate."],["B","Retinoids."],["C","Cyclosporine."],["D","Antivirals."],["E","Antihelminthics."]],"a":"B","sa":null,"pg":"99","f":[],"n":29,"e":["Multiple papules, pustules, nodules and cysts represent severe acne needing systemic retinoids. Why the other options are wrong: A) Methotrexate: Methotrexate is for psoriasis. C) Cyclosporine: Cyclosporine is immunosuppressive. D) Antivirals: Antivirals are unrelated. E) Antihelminthics: Antihelminthics are unrelated.","Oral retinoid."],"im":[]},{"id":"Q530","ch":"Acne Vulgaris","q":"A teenager presented with a polymorphic eruption on the face of comedones, papules, pustules, many nodules and cysts. The treatment of choice is oral","o":[["A","Ampicillin."],["B","Retinoids."],["C","Fluconazole."],["D","Acyclovir."],["E","Antihistamines."]],"a":"B","sa":null,"pg":"99","f":[],"n":30,"e":["Polymorphic eruption with many nodules is severe acne, treated by systemic retinoids. Why the other options are wrong: A) Ampicillin: Ampicillin is not an acne antibiotic; acne us
