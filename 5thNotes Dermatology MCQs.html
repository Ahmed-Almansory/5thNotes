<style>

@media(prefers-color-scheme:dark){:root{--navy:#9fd8e0;--soft:#13283c;--lav:#221f3a;--bg:#0c1824;--card:#112334;--tx:#dbe8f1;--mut:#8fa6b8;--bd:#23394d}}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}

header h1{margin:0;font-size:1.35rem}header p{margin:2px 0 0;opacity:.85;font-size:.9rem}

.wrap{display:flex;max-width:1200px;margin:0 auto}
nav{width:270px;flex:none;padding:14px;position:sticky;top:0;align-self:flex-start;max-height:100vh;overflow:auto}
nav a{display:flex;justify-content:space-between;padding:8px 10px;border-radius:8px;color:var(--tx);text-decoration:none;font-size:.92rem;cursor:pointer}
nav a.on,nav a:hover{background:var(--soft);color:var(--teal);font-weight:600}nav a span{color:var(--mut);font-size:.8rem}
main{flex:1;min-width:0;padding:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar input[type=search]{flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:1rem}
button,.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:10px;font-size:.88rem;cursor:pointer}
button.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
.prog{height:8px;background:var(--soft);border-radius:6px;overflow:hidden;margin:6px 0 4px}.prog i{display:block;height:100%;background:var(--teal);width:0}
.stat{font-size:.85rem;color:var(--mut);margin-bottom:12px}
.q{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--teal);border-radius:12px;padding:14px;margin:0 0 12px}
.q h3{margin:0 0 8px;font-size:1rem}.q h3 b{color:var(--teal)}
.opt{display:block;width:100%;text-align:left;margin:5px 0;padding:9px 11px;background:var(--bg);border:1px solid var(--bd);border-radius:9px}
.opt.ok{background:rgba(27,158,90,.15);border-color:var(--ok)}.opt.bad{background:rgba(214,69,69,.15);border-color:var(--bad)}
.ans{margin-top:8px;padding:10px 12px;background:var(--soft);border-radius:9px;font-size:.93rem}
.ans .k{color:var(--ok);font-weight:700}.flag{margin-top:6px;padding:6px 10px;background:var(--lav);border-radius:8px;font-size:.82rem}
.src{font-size:.78rem;color:var(--mut);margin-top:6px}
.tg{display:flex;align-items:center;gap:12px;margin:18px 0;padding:14px 16px;border-radius:14px;background:linear-gradient(135deg,#0f8b8d,#0b2545);color:#fff;text-decoration:none}
.tg svg{width:42px;height:42px;flex:none}.tg b{display:block;font-size:1.05rem}.tg span{font-size:.85rem;opacity:.85}
footer{text-align:center;padding:16px;color:var(--mut);font-size:.9rem;border-top:1px solid var(--bd)}
nav a span,.card span{white-space:nowrap;margin-left:8px}#mb{display:none}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:12px 0}.card{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--teal);border-radius:12px;padding:14px;cursor:pointer;font-weight:600}.card span{color:var(--mut);font-weight:400}.resume{display:block;width:100%;background:var(--teal);color:#fff;border:0;border-radius:12px;padding:16px;font-size:1.05rem;font-weight:700;margin:8px 0}.resume small{display:block;font-weight:400;opacity:.9;margin-top:2px}.q.hl{outline:3px solid var(--teal)}
@media(max-width:800px){nav{position:fixed;inset:0 30% 0 0;width:auto;background:var(--card);z-index:9;transform:translateX(-105%);transition:.2s;box-shadow:2px 0 12px #0004}nav.open{transform:none}#mb{display:inline-block}.wrap{display:block}}
</style></head><body>

<script>
const DB={"ch": ["Introduction To Dermatology", "Bacterial Infections", "Mycobacterial Infections", "Viral Infections", "Fungal Infections", "Parasitic Infestations", "Inflammatory Dermatoses", "Allergic Disorders", "Melanocyte Disorders", "Hair Disorders", "Acne Vulgaris"], "lbl": {"Introduction To Dermatology": "Introduction", "Bacterial Infections": "Bacterial", "Mycobacterial Infections": "Leprosy", "Viral Infections": "Viral", "Fungal Infections": "Fungal", "Parasitic Infestations": "Parasitic", "Inflammatory Dermatoses": "Inflammatory", "Allergic Disorders": "Allergic", "Melanocyte Disorders": "Vitiligo", "Hair Disorders": "Hair", "Acne Vulgaris": "Acne"}, "q": [{"id": "Q001", "ch": "Introduction To Dermatology", "q": "The outermost structure in the skin is the:", "o": [["A", "Epidermis."], ["B", "Dermis."], ["C", "Hypodermis."], ["D", "Basement membrane."], ["E", "Collagen."]], "a": "A", "sa": null, "pg": "2", "f": [], "s": "B", "n": 1, "e": ["The epidermis is the superficial layer of the skin, lying above the basement membrane, dermis and hypodermis.", "Outside → inside: epidermis, dermis, hypodermis."]}, {"id": "Q002", "ch": "Introduction To Dermatology", "q": "Main cells of the epidermis are:", "o": [["A", "Fibroblasts, keratinocytes, melanocytes."], ["B", "Keratinocytes, melanocytes, Langerhans cells."], ["C", "Keratinocytes, lymphocytes, Langerhans cells."], ["D", "Melanocytes, keratinocytes, endothelial cells."], ["E", "Keratinocytes, melanocytes, lymphocytes."]], "a": "B", "sa": null, "pg": "2", "f": [], "s": "B", "n": 2, "e": ["The epidermis is made mainly of keratinocytes (the majority), with melanocytes (pigment) and Langerhans cells (immune) as the other main cells. Fibroblasts, endothelial cells and lymphocytes belong to the dermis or vessels.", "Keratinocyte = structure, melanocyte = pigment, Langerhans = immunity."]}, {"id": "Q003", "ch": "Introduction To Dermatology", "q": "What are the main cells of the epidermis?", "o": [["A", "Melanocytes."], ["B", "Langerhans cells."], ["C", "Keratinocytes."], ["D", "Merkel cells."], ["E", "Mast cells."]], "a": "C", "sa": null, "pg": "2", "f": [], "s": "B", "n": 3, "e": ["Keratinocytes make up about 90% of epidermal cells and produce keratin, forming the barrier.", "Merkel cells = touch; melanocytes = pigment; Langerhans = immunity."]}, {"id": "Q004", "ch": "Introduction To Dermatology", "q": "Starting from below upwards, the cell layers of the epidermis are:", "o": [["A", "Granular, basal, squamous, and horny cell layers."], ["B", "Horny, granular, squamous, and basal cell layers."], ["C", "Basal, granular, squamous, and horny cell layers."], ["D", "Basal, squamous, granular, and horny cell layers."], ["E", "Basal, horny, granular, and squamous cell layers."]], "a": "D", "sa": null, "pg": "2", "f": [], "s": "B", "n": 4, "e": ["From the basement membrane upward: basal → squamous (prickle) → granular → horny (stratum corneum); a clear layer (lucidum) exists only in palms and soles.", "Mnemonic: B-S-G-H (Basal, Spinous, Granular, Horny)."]}, {"id": "Q005", "ch": "Introduction To Dermatology", "q": "Name the layers of the epidermis (from below upwards).", "o": [], "a": null, "sa": "Basal cell layer -> Prickle (squamous) cell layer -> Granular cell layer -> Horny cell layer (stratum corneum).", "pg": "2", "f": [], "s": "B", "n": 5, "e": ["Cells are born in the basal layer, mature through the prickle and granular layers, and end as flattened keratin-filled cells in the horny layer.", "Order from below upward is basal → prickle → granular → horny."]}, {"id": "Q006", "ch": "Introduction To Dermatology", "q": "The uppermost layer of the epidermis is the:", "o": [["A", "Granular layer."], ["B", "Squamous cell layer."], ["C", "Basal cell layer."], ["D", "Keratinous (horny) cell layer."], ["E", "Malpighian cell layer."]], "a": "D", "sa": null, "pg": "2", "f": [], "s": "B", "n": 6, "e": ["The outermost epidermal layer is the horny layer (stratum corneum), made of dead keratinized cells that form the physical barrier.", "Horny layer = barrier."]}, {"id": "Q007", "ch": "Introduction To Dermatology", "q": "The stratum corneum is composed of:", "o": [["A", "Melanin."], ["B", "Granules."], ["C", "Keratin cells."], ["D", "Squamous cells."], ["E", "Basal cells."]], "a": "C", "sa": null, "pg": "2", "f": [], "s": "B", "n": 7, "e": ["The stratum corneum consists of flattened, anucleate keratinized cells (corneocytes) packed with keratin.", "Corneocytes = dead keratin-filled cells."]}, {"id": "Q008", "ch": "Introduction To Dermatology", "q": "The layer of the skin responsible for renewal of the epidermis is:", "o": [["A", "Horny cell layer."], ["B", "Granular cell layer."], ["C", "Squamous cell layer."], ["D", "Basal cell layer."], ["E", "Dermis."]], "a": "D", "sa": null, "pg": "2", "f": [], "s": "B", "n": 8, "e": ["The basal layer contains the germinative (stem) keratinocytes that divide continuously and replace the epidermis (turnover about 28 days).", "Basal = renewal; psoriasis speeds up its turnover."]}, {"id": "Q009", "ch": "Introduction To Dermatology", "q": "Squamous cells are found in the:", "o": [["A", "Epidermis."], ["B", "Dermis."], ["C", "Hypodermis."], ["D", "Blood vessels."], ["E", "Connective tissue."]], "a": "A", "sa": null, "pg": "2", "f": [], "s": "B", "n": 9, "e": ["Squamous (prickle) cells are keratinocytes of the stratum spinosum, which is part of the epidermis; squamous cell carcinoma arises from them.", "Squamous cell layer = prickle cell layer."]}, {"id": "Q010", "ch": "Introduction To Dermatology", "q": "The immune function of the skin is mediated by:", "o": [["A", "Melanocytes."], ["B", "Langerhans cells."], ["C", "Elastic fibres."], ["D", "Pacinian corpuscles."], ["E", "Keratinocytes."]], "a": "B", "sa": null, "pg": "2", "f": [], "s": "B", "n": 10, "e": ["Langerhans cells are antigen-presenting dendritic cells in the epidermis and carry the skin's immune function. Pacinian corpuscles sense pressure/vibration, not immunity.", "Langerhans = immune; Merkel = touch; melanocyte = pigment."]}, {"id": "Q011", "ch": "Introduction To Dermatology", "q": "Skin appendages include:", "o": [["A", "Nails, hair follicles, sebaceous glands & blood vessels."], ["B", "Hair follicles, nails, sweat glands & lymphatics."], ["C", "Sebaceous glands, sweat glands & nerve corpuscles."], ["D", "Sweat glands, nails, nerve corpuscles & hair follicles."], ["E", "Sweat glands, nails, hair follicles & sebaceous glands."]], "a": "E", "sa": null, "pg": "3", "f": [], "s": "B", "n": 11, "e": ["Appendages are epidermal derivatives: hair follicles, sebaceous glands, sweat glands (eccrine and apocrine) and nails. Blood vessels, lymphatics and nerve corpuscles are not appendages.", "Appendages = hair, nails, glands."]}, {"id": "Q012", "ch": "Introduction To Dermatology", "q": "Skin appendages include all of the following EXCEPT:", "o": [["A", "Sebaceous glands."], ["B", "Eccrine sweat glands."], ["C", "Melanocytes."], ["D", "Apocrine sweat glands."], ["E", "Hair."]], "a": "C", "sa": null, "pg": "3", "f": [], "s": "B", "n": 12, "e": ["Melanocytes are cells of the epidermis, not appendages; sebaceous, sweat glands and hair are.", "Melanocyte = cell, not appendage."]}, {"id": "Q013", "ch": "Introduction To Dermatology", "q": "All of the following are skin appendages EXCEPT:", "o": [["A", "Nails."], ["B", "Hair follicles."], ["C", "Sweat glands."], ["D", "Blood vessels."], ["E", "Sebaceous glands."]], "a": "D", "sa": null, "pg": "3", "f": [], "s": "B", "n": 13, "e": ["Blood vessels are dermal structures supplying the skin and are not appendages; nails, hair follicles, sweat and sebaceous glands are.", "Vessels and nerves ≠ appendages."]}, {"id": "Q014", "ch": "Introduction To Dermatology", "q": "Which one of the following structures is considered a skin appendage?", "o": [["A", "Epidermis."], ["B", "Dermis."], ["C", "Hair follicle."], ["D", "Subcutaneous fat."], ["E", "Cutaneous nerves."]], "a": "C", "sa": null, "pg": "3", "f": [], "s": "B", "n": 14, "e": ["The hair follicle is an epidermal derivative and therefore an appendage; epidermis and dermis are layers, and fat and nerves are not appendages.", "Hair follicle = appendage."]}, {"id": "Q015", "ch": "Introduction To Dermatology", "q": "The pilosebaceous unit is composed of:", "o": [["A", "Apocrine gland and sebaceous gland."], ["B", "Hair and sebaceous gland."], ["C", "Skin and sebaceous gland."], ["D", "Hair and apocrine gland."], ["E", "Hair and hair follicle."]], "a": "B", "sa": null, "pg": "3", "f": [], "s": "B", "n": 15, "e": ["The pilosebaceous unit is the hair follicle with its attached sebaceous gland; it is the site of acne.", "Pilosebaceous unit = acne site."]}, {"id": "Q016", "ch": "Introduction To Dermatology", "q": "The skin appendages responsible for body temperature control are known as:", "o": [["A", "Eccrine sweat glands."], ["B", "Sebaceous glands."], ["C", "Pilosebaceous units."], ["D", "Hair follicles."], ["E", "Mast cells."]], "a": "A", "sa": null, "pg": "3", "f": [], "s": "B", "n": 16, "e": ["Eccrine sweat glands are distributed over the whole body and cool it by evaporation of sweat. Apocrine glands are scent glands (axilla, groin).", "Eccrine = thermoregulation; apocrine = odor."]}, {"id": "Q017", "ch": "Introduction To Dermatology", "q": "The following is a function of the skin:", "o": [["A", "Defense against external pathogens."], ["B", "Temperature control."], ["C", "Sensations."], ["D", "All of the above."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": "3", "f": [], "s": "B", "n": 17, "e": ["The skin defends against pathogens, controls temperature and carries sensation, so 'all of the above' is correct.", "Skin functions: protection, thermoregulation, sensation, excretion, vitamin D synthesis, immunity."]}, {"id": "Q018", "ch": "Introduction To Dermatology", "q": "Functions of the skin include:", "o": [["A", "Prevention of water and electrolyte loss."], ["B", "Excretion of sweat."], ["C", "Formation of vitamin D."], ["D", "Immunologic function via Langerhans cells."], ["E", "All of the above."]], "a": "E", "sa": null, "pg": "3", "f": [], "s": "B", "n": 18, "e": ["Protection, thermoregulation, sensation, excretion, immunity and vitamin D synthesis are all skin functions.", "Skin is a multifunctional organ."]}, {"id": "Q019", "ch": "Introduction To Dermatology", "q": "The skin is considered:", "o": [["A", "An endocrine organ."], ["B", "A secretory organ."], ["C", "A defensive organ."], ["D", "An excretory organ."], ["E", "All of the above."]], "a": "E", "sa": null, "pg": "3", "f": [], "s": "B", "n": 19, "e": ["The skin is protective, secretory (sebum, sweat), excretory (sweat) and endocrine (vitamin D synthesis), so 'all of the above'.", "Skin makes vitamin D under UVB."]}, {"id": "Q020", "ch": "Introduction To Dermatology", "q": "One of the following statements is correct:", "o": [["A", "The melanocyte is the main cell of the epidermis."], ["B", "The skin has an endocrinal function."], ["C", "The basal cells of the epidermis are squamous."], ["D", "The sebaceous glands open directly onto the skin surface."], ["E", "Laminated keratin is called crust."]], "a": "B", "sa": null, "pg": "3", "f": [], "s": "B", "n": 20, "e": ["The skin has an endocrine function: UVB converts 7-dehydrocholesterol into vitamin D3. It is not a purely excretory organ.", "Skin = vitamin D factory."]}, {"id": "Q021", "ch": "Introduction To Dermatology", "q": "All of the following are primary lesions EXCEPT:", "o": [["A", "Macule."], ["B", "Nodule."], ["C", "Plaque."], ["D", "Vesicle."], ["E", "Crust."]], "a": "E", "sa": null, "pg": "8", "f": [], "s": "B", "n": 21, "e": ["Primary lesions arise first (macule, papule, plaque, nodule, vesicle, bulla, pustule, wheal, cyst). A crust is a secondary lesion formed from dried exudate.", "Crust, scale, erosion, ulcer, scar are secondary lesions."]}, {"id": "Q022", "ch": "Introduction To Dermatology", "q": "A circumscribed non-palpable area characterized by color change is a:", "o": [["A", "Vesicle."], ["B", "Papule."], ["C", "Macule."], ["D", "Scale."], ["E", "Crust."]], "a": "C", "sa": null, "pg": "4", "f": [], "s": "B", "n": 22, "e": ["A macule is a flat lesion that you can see but not feel: it is defined only by a change in color, with no elevation or texture change. Anything palpable (papule, plaque, nodule) is excluded.", "Macule = color only (<1 cm); patch >1 cm. Examples: pityriasis versicolor, vitiligo."]}, {"id": "Q023", "ch": "Introduction To Dermatology", "q": "Macule is:", "o": [["A", "A localized collection of fluid."], ["B", "A solid elevation of the skin less than 0.5 cm in diameter."], ["C", "A tunnel in the epidermis produced by female Sarcoptes scabiei."], ["D", "Dried serum, blood or pus on the skin surface."], ["E", "A circumscribed non-palpable area of skin discoloration less than 1 cm in diameter."]], "a": "E", "sa": null, "pg": "4", "f": [], "s": "B", "n": 23, "e": ["A macule is non-palpable discoloration less than 1 cm; the same change over 1 cm is a patch.", "Macule <1 cm; patch >1 cm."]}, {"id": "Q024", "ch": "Introduction To Dermatology", "q": "Patch is a:", "o": [["A", "Flat, circumscribed non-palpable area of skin discoloration <1 cm in diameter."], ["B", "Flat, circumscribed non-palpable area of skin discoloration >1 cm in diameter."], ["C", "Circumscribed solid elevation of skin <1 cm in diameter."], ["D", "Circumscribed solid elevation of skin >1 cm in diameter having a deep component."], ["E", "Increased epidermal thickness."]], "a": "B", "sa": null, "pg": "4", "f": [], "s": "B", "n": 24, "e": ["A patch is the larger version of a macule: flat, non-palpable color change more than 1 cm in diameter, e.g. vitiligo or versicolor patches.", "Macule <1 cm; patch >1 cm."]}, {"id": "Q025", "ch": "Introduction To Dermatology", "q": "A solid elevation of the skin less than 1 cm in diameter is a:", "o": [["A", "Vesicle."], ["B", "Pustule."], ["C", "Papule."], ["D", "Nodule."], ["E", "Plaque."]], "a": "C", "sa": null, "pg": "4", "f": [], "s": "B", "n": 25, "e": ["A papule is a solid, palpable elevation smaller than 1 cm (e.g. warts). A vesicle contains fluid, and a nodule or plaque is larger than 1 cm.", "Papule <1 cm."]}, {"id": "Q026", "ch": "Introduction To Dermatology", "q": "Papule is:", "o": [["A", "A solid elevation less than 1 cm in diameter."], ["B", "A fluid collection."], ["C", "An area of depigmented skin."], ["D", "A tunnel in the epidermis."]], "a": "A", "sa": null, "pg": null, "f": [], "s": "B", "n": 26, "e": ["A papule is a solid elevation smaller than 1 cm in diameter; fluid-filled lesions are vesicles.", "Papule = solid and small."]}, {"id": "Q027", "ch": "Introduction To Dermatology", "q": "Define a papule and give an example.", "o": [], "a": null, "sa": "A solid elevated palpable lesion less than 1 cm in diameter; e.g. verruca (warts).", "pg": null, "f": [], "s": "B", "n": 27, "e": ["A papule is a solid palpable lesion under 1 cm; examples include warts (verruca) and lichen planus.", "Examples: warts, lichen planus, acne papules."]}, {"id": "Q028", "ch": "Introduction To Dermatology", "q": "Papule is the primary lesion of:", "o": [["A", "Leprosy."], ["B", "Lichen planus."], ["C", "Urticaria."], ["D", "Pityriasis versicolor."], ["E", "Herpes simplex."]], "a": "B", "sa": null, "pg": "57", "f": [], "s": "B", "n": 28, "e": ["Lichen planus is the classic papular eruption: flat-topped, violaceous, polygonal, itchy papules.", "The 4 Ps: purple, polygonal, pruritic, papule."]}, {"id": "Q029", "ch": "Introduction To Dermatology", "q": "A papule:", "o": [["A", "Is the primary lesion of lichen planus."], ["B", "Is a circumscribed solid elevation more than 0.5 cm in diameter."], ["C", "Contains fluid."], ["D", "Is a subcutaneous lesion."], ["E", "Is always red in color."]], "a": "A", "sa": null, "pg": "57", "f": [], "s": "B", "n": 29, "e": ["Lichen planus is a papular disease: the primary lesion is a flat-topped, polyangular, violaceous papule with a shiny surface and fine scale.", "LP papule = purple, polygonal, itchy, flat."]}, {"id": "Q030", "ch": "Introduction To Dermatology", "q": "A plaque is:", "o": [["A", "An abnormal change of skin texture."], ["B", "An area of depigmentation."], ["C", "The primary lesion of acne vulgaris."], ["D", "A localized epidermal collection of fluid."], ["E", "A deroofed burrow."]], "a": "A", "sa": null, "pg": "5", "f": [], "s": "B", "n": 30, "e": ["Per the department book, a plaque is a palpable area of abnormal skin texture; it is a flat-topped elevation larger than 1 cm, as in psoriasis.", "Plaque = large, flat-topped; psoriasis."]}, {"id": "Q031", "ch": "Introduction To Dermatology", "q": "Plaque is ___, found in ___ (give definition and an example).", "o": [], "a": null, "sa": "A circumscribed solid palpable lesion more than 1 cm in diameter (may be elevated); e.g. psoriasis.", "pg": "5", "f": [], "s": "B", "n": 31, "e": ["A plaque is a solid palpable flat-topped lesion over 1 cm, often a coalescence of papules, as in psoriasis.", "Plaque >1 cm, mainly epidermal/upper dermal."]}, {"id": "Q032", "ch": "Introduction To Dermatology", "q": "A circumscribed solid elevation of skin more than 1 cm in diameter having a deep component that involves the dermis or subcutis is a:", "o": [["A", "Plaque."], ["B", "Nodule."], ["C", "Vesicle."], ["D", "Papule."], ["E", "Bulla."]], "a": "B", "sa": null, "pg": "5", "f": [], "s": "B", "n": 32, "e": ["A nodule is a solid lesion over 1 cm with a deep component in the dermis or subcutis.", "Nodule = deep; plaque = superficial."]}, {"id": "Q033", "ch": "Introduction To Dermatology", "q": "A nodule:", "o": [["A", "Is a circumscribed solid elevation more than 1 cm."], ["B", "Is a circumscribed solid elevation less than 1 cm."], ["C", "Contains fluid."], ["D", "Is epidermal in origin."], ["E", "Is the primary lesion of acne."]], "a": "A", "sa": null, "pg": "5", "f": [], "s": "B", "n": 33, "e": ["A nodule is a circumscribed solid lesion larger than 1 cm that extends deep into the dermis or subcutis. A papule is the same lesion under 1 cm.", "Nodule >1 cm and deep (e.g. lepromatous leprosy)."]}, {"id": "Q034", "ch": "Introduction To Dermatology", "q": "A nodule:", "o": [["A", "Is a circumscribed solid elevation less than 0.5 cm in diameter."], ["B", "Is a circumscribed solid elevation more than 0.5 cm in diameter."], ["C", "Contains fluid."], ["D", "Is epidermal in origin."], ["E", "Is a circumscribed discoloration of the skin."]], "a": "B", "sa": null, "pg": null, "f": [], "s": "B", "n": 34, "e": ["A nodule is a solid lesion larger than 1 cm; the book key gives 0.5 cm in this version, which is inconsistent with other items. Flagged for review.", "Use >1 cm with a dermal/subcutaneous component."]}, {"id": "Q035", "ch": "Introduction To Dermatology", "q": "A nodule is:", "o": [["A", "The primary lesion of acne."], ["B", "A superficial lesion."], ["C", "Less than 1 cm in diameter."], ["D", "A cystic lesion."], ["E", "A dermal lesion."]], "a": "E", "sa": null, "pg": "5", "f": [], "s": "B", "n": 35, "e": ["A nodule is a dermal (deeper) lesion, unlike a plaque, which is mainly epidermal.", "Nodule = dermal."]}, {"id": "Q036", "ch": "Introduction To Dermatology", "q": "From the list below, select the most appropriate definition of a nodule:", "o": [["A", "Well-defined flat area of altered pigmentation."], ["B", "Raised well-defined lesion usually less than 0.5 cm in diameter."], ["C", "Raised flat-topped lesion usually greater than 2 cm in diameter."], ["D", "Solid lump greater than 1 cm in diameter; may be subcutaneous or intradermal."], ["E", "Well-defined pus-filled lesion."]], "a": "D", "sa": null, "pg": "5", "f": [], "s": "B", "n": 36, "e": ["A nodule is a solid lump over 1 cm that may be intradermal or subcutaneous.", "Nodule = deep lump >1 cm."]}, {"id": "Q037", "ch": "Introduction To Dermatology", "q": "Evanescent elevations of the skin caused by edema of the dermis are:", "o": [["A", "Macules."], ["B", "Papules."], ["C", "Wheals."], ["D", "Nodules."], ["E", "Crusts."]], "a": "C", "sa": null, "pg": "6", "f": [], "s": "B", "n": 37, "e": ["Wheals are transient (evanescent) edematous elevations from dermal edema, typical of urticaria.", "Wheal lasts <24 h."]}, {"id": "Q038", "ch": "Introduction To Dermatology", "q": "A wheal is:", "o": [["A", "A secondary lesion."], ["B", "Permanent."], ["C", "An edematous lesion."], ["D", "The primary lesion of acne."], ["E", "A vesicular lesion. 1     The picture shows one of the primary lesions of the skin in which there is a transient, edematous, erythematous or skin-colored elevation of the skin of variable sizes. (Clinical photo: erythematous edematous wheals on the skin.)"]], "a": "C", "sa": null, "pg": "6", "f": [], "s": "B", "n": 38, "e": ["A wheal is an edematous lesion due to increased capillary permeability in the dermis.", "Urticaria = wheals."]}, {"id": "Q039", "ch": "Introduction To Dermatology", "q": "This picture shows:", "o": [["A", "Pustules."], ["B", "Macules."], ["C", "Comedones."], ["D", "Papules."], ["E", "Wheals. 1     A 33-year-old female patient presented with erythematous, edematous, evanescent, itchy lesions of variable sizes on her back. She states they always appear at sites of pressure on her skin. (Clinical photo: linear erythematous wheals on the back.)"]], "a": "E", "sa": null, "pg": "6", "f": [], "s": "B", "n": 39, "e": ["The picture and history of itchy, transient edematous plaques indicate wheals (urticaria).", "Wheal = urticaria."]}, {"id": "Q040", "ch": "Introduction To Dermatology", "q": "What is the primary lesion of this disease?", "o": [["A", "Papule."], ["B", "Wheal."], ["C", "Vesicle."], ["D", "Nodule."], ["E", "Macule."]], "a": "B", "sa": null, "pg": "6", "f": [], "s": "B", "n": 40, "e": ["The picture of transient, edematous, erythematous plaques is the wheal, which is the primary lesion of urticaria because of dermal edema from histamine.", "Wheal = urticaria."]}, {"id": "Q041", "ch": "Introduction To Dermatology", "q": "A vesicle can be differentiated from a bulla by:", "o": [["A", "Its size."], ["B", "Its location."], ["C", "Having a wall."], ["D", "Its content."], ["E", "Its color."]], "a": "A", "sa": null, "pg": "6", "f": [], "s": "B", "n": 41, "e": ["A vesicle is a fluid-filled blister under 0.5 cm; a bulla is larger than 0.5 cm. They differ by size.", "Vesicle <0.5 cm; bulla >0.5 cm."]}, {"id": "Q042", "ch": "Introduction To Dermatology", "q": "A cyst can be differentiated from a bulla by:", "o": [["A", "Its size."], ["B", "Its location."], ["C", "Having a wall."], ["D", "Its content."], ["E", "Its color."]], "a": "C", "sa": null, "pg": "7", "f": [], "s": "B", "n": 42, "e": ["A cyst has a true epithelial wall and a bulla does not; both contain fluid or material.", "Cyst = walled."]}, {"id": "Q043", "ch": "Introduction To Dermatology", "q": "The main difference between a cyst and a bulla is:", "o": [["A", "The cyst has a wall, while the bulla doesn't."], ["B", "The cyst is <0.5 cm, while the bulla is >0.5 cm in diameter."], ["C", "The cyst contains purulent fluid, while the bulla contains clear fluid."], ["D", "The cyst is a solid structure, while the bulla contains fluid."], ["E", "The cyst is a primary lesion, while the bulla is a secondary lesion."]], "a": "A", "sa": null, "pg": "7", "f": [], "s": "B", "n": 43, "e": ["A cyst has a wall (epithelial lining) whereas a bulla is a fluid collection within or under the epidermis without a wall.", "Cyst = wall; bulla = no wall."]}, {"id": "Q044", "ch": "Introduction To Dermatology", "q": "A collection of fluid in the skin with a defined histological wall is a:", "o": [["A", "Bulla."], ["B", "Cyst."], ["C", "Vesicle."], ["D", "Pustule."], ["E", "Blister."]], "a": "B", "sa": null, "pg": "7", "f": [], "s": "B", "n": 44, "e": ["A cyst is a closed sac with a defined wall containing fluid or semisolid material. Vesicles and bullae contain fluid but have no wall of their own.", "Cyst = walled."]}, {"id": "Q045", "ch": "Introduction To Dermatology", "q": "Burrow is:", "o": [["A", "A localized collection of fluid."], ["B", "A solid elevation of the skin less than 0.5 cm in diameter."], ["C", "A tunnel in the epidermis."], ["D", "A deroofed furrow."], ["E", "An area of depigmented skin."]], "a": "C", "sa": null, "pg": "7", "f": [], "s": "B", "n": 45, "e": ["A burrow is a tunnel in the stratum corneum (epidermis) dug by the female Sarcoptes scabiei mite.", "Burrow = epidermal tunnel."]}, {"id": "Q046", "ch": "Introduction To Dermatology", "q": "Burrow is:", "o": [["A", "A localized collection of fluid."], ["B", "A linear elevation of the skin produced by mites."], ["C", "The primary lesion of urticaria."], ["D", "Located in the dermis."], ["E", "An area of depigmented skin."]], "a": "B", "sa": null, "pg": "7", "f": [], "s": "B", "n": 46, "e": ["A burrow is a linear, slightly elevated track just under the stratum corneum, dug by the fertilized female Sarcoptes scabiei mite, which lays 2-3 eggs a day.", "Burrow = scabies sign."]}, {"id": "Q047", "ch": "Introduction To Dermatology", "q": "A burrow is the primary lesion of:", "o": [["A", "Acne vulgaris."], ["B", "Lupus vulgaris."], ["C", "Scabies."], ["D", "Urticaria."], ["E", "Psoriasis."]], "a": "C", "sa": null, "pg": "7", "f": [], "s": "B", "n": 47, "e": ["The burrow is the diagnostic primary lesion of scabies; other signs (papules, vesicles, excoriations) are non-specific. Acne has comedones, lupus vulgaris has apple-jelly nodules and psoriasis has plaques.", "Burrow = scabies."]}, {"id": "Q048", "ch": "Introduction To Dermatology", "q": "Dried exudate on the surface of the skin is a:", "o": [["A", "Scale."], ["B", "Crust."], ["C", "Bulla."], ["D", "Plaque."], ["E", "Burrow."]], "a": "B", "sa": null, "pg": "8", "f": [], "s": "B", "n": 48, "e": ["A crust is dried serum, blood or pus on the skin surface, a secondary lesion. Scales are keratin; erosion and ulcers are tissue losses.", "Crust = dried exudate; scale = keratin."]}, {"id": "Q049", "ch": "Introduction To Dermatology", "q": "A crust:", "o": [["A", "Is a primary lesion."], ["B", "Is formed of skin."], ["C", "May be seen in herpes simplex."], ["D", "Is always found in the herald patch."], ["E", "None of the above."]], "a": "C", "sa": null, "pg": "22", "f": [], "s": "B", "n": 49, "e": ["Vesicles of herpes simplex rupture and dry into crusts within a few days, healing without a scar.", "HSV: vesicle → crust."]}, {"id": "Q050", "ch": "Introduction To Dermatology", "q": "Dry or greasy laminated masses of keratin are:", "o": [["A", "Scales."], ["B", "Crusts."], ["C", "Comedones."], ["D", "Papules."], ["E", "Nodules."]], "a": "A", "sa": null, "pg": "8", "f": [], "s": "B", "n": 50, "e": ["Scales are dry or greasy laminated masses of keratin shed from the surface.", "Scale = keratin; crust = dried exudate."]}, {"id": "Q051", "ch": "Introduction To Dermatology", "q": "An accumulation of keratin due to increased proliferation or decreased desquamation is:", "o": [["A", "Fissure."], ["B", "Crust."], ["C", "Excoriation."], ["D", "Scale."], ["E", "Lichenification."]], "a": "D", "sa": null, "pg": "8", "f": [], "s": "B", "n": 51, "e": ["Scales result from increased epidermal proliferation (psoriasis) or decreased desquamation (ichthyosis).", "Scale = excess keratin."]}, {"id": "Q052", "ch": "Introduction To Dermatology", "q": "An erosion:", "o": [["A", "Is a loss of epidermis & dermis."], ["B", "Heals with a scar."], ["C", "Occurs after rupture of vesicles."], ["D", "Is a primary lesion."], ["E", "Is seen in psoriasis."]], "a": "C", "sa": null, "pg": "9", "f": [], "s": "B", "n": 52, "e": ["An erosion is a superficial loss of epidermis only; it follows rupture of vesicles or bullae and heals without a scar.", "Erosion heals without scarring; ulcer scars."]}, {"id": "Q053", "ch": "Introduction To Dermatology", "q": "Ulcer is a lesion of:", "o": [["A", "Erythrasma."], ["B", "Ecthyma."], ["C", "Psoriasis."], ["D", "Alopecia."], ["E", "Tinea versicolor."]], "a": "B", "sa": null, "pg": "13", "f": [], "s": "B", "n": 53, "e": ["An ulcer is loss of epidermis and dermis and heals with a scar; ecthyma is ulcerative impetigo.", "Ecthyma = ulcerative impetigo."]}, {"id": "Q054", "ch": "Introduction To Dermatology", "q": "Accentuation of skin lines due to chronic itching is called?", "o": [], "a": null, "sa": "Lichenification.", "pg": "10", "f": [], "s": "B", "n": 54, "e": ["Chronic scratching thickens the skin and exaggerates its lines, called lichenification.", "Lichenification = chronic eczema."]}, {"id": "Q055", "ch": "Introduction To Dermatology", "q": "A transient, edematous, erythematous or skin-colored elevation of the skin of variable sizes is called", "o": [["A", "Pustule."], ["B", "Macule."], ["C", "Comedone."], ["D", "Papule."], ["E", "Wheal."]], "a": "E", "sa": null, "pg": "6", "f": [], "s": "B", "n": 55, "e": ["A wheal is a transient edematous elevation, erythematous or skin-colored, of variable size.", "Wheal = urticaria."]}, {"id": "H007", "ch": "Introduction To Dermatology", "q": "Keratin is present in:", "o": [["A", "Skin."], ["B", "Hairs."], ["C", "Nails."], ["D", "All of the above."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 56, "e": ["Keratin is the structural protein of skin, hair and nails, so all of the above.", "Keratin = skin, hair, nails."]}, {"id": "H011", "ch": "Introduction To Dermatology", "q": "Cutaneous examination includes examination of:", "o": [["A", "Skin."], ["B", "Hair."], ["C", "Nails."], ["D", "Mucous membranes."], ["E", "All of the above."]], "a": "E", "sa": null, "pg": null, "f": [], "s": "H", "n": 57, "e": ["A full cutaneous examination includes skin, hair, nails and mucous membranes.", "Always examine mucosa, hair and nails."]}, {"id": "H012", "ch": "Introduction To Dermatology", "q": "The epidermal cells that act as mechanoreceptors detecting gentle touch and pressure are:", "o": [["A", "Keratinocytes."], ["B", "Melanocytes."], ["C", "Langerhans cells."], ["D", "Merkel cells."], ["E", "Schwann cells."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 58, "e": ["Merkel cells in the basal epidermis are slowly adapting mechanoreceptors for gentle touch and pressure. Keratinocytes form the barrier, melanocytes produce pigment and Langerhans cells provide immunity.", "Merkel = touch."]}, {"id": "H013", "ch": "Introduction To Dermatology", "q": "A macule is:", "o": [["A", "Localized collection of fluid."], ["B", "Solid elevation of the skin less than 0.5 cm in diameter."], ["C", "Tunnel in the epidermis produced by female Sarcoptes scabiei."], ["D", "Dried serum, blood or pus on the skin surface."], ["E", "Circumscribed non-palpable area of skin discoloration less than 1 cm in diameter."]], "a": "E", "sa": null, "pg": null, "f": [], "s": "H", "n": 59, "e": ["A macule is a circumscribed, non-palpable area of discoloration less than 1 cm. A localized collection of fluid would be a vesicle/bulla and a tunnel is a burrow.", "Macule: color only."]}, {"id": "H015", "ch": "Introduction To Dermatology", "q": "A plaque is a:", "o": [["A", "Patch of abnormal change of skin texture."], ["B", "Area of depigmentation."], ["C", "The primary lesion of acne vulgaris."], ["D", "Localized epidermal collection of fluid."], ["E", "Deroofed burrow."]], "a": "A", "sa": null, "pg": null, "f": [], "s": "H", "n": 60, "e": ["Per the book, a plaque is an area of abnormal skin texture, raised and over 1 cm, as in psoriasis.", "Plaque >1 cm, flat-topped."]}, {"id": "H019", "ch": "Introduction To Dermatology", "q": "A cyst can be differentiated from a bulla by:", "o": [["A", "Its size."], ["B", "Its location."], ["C", "Having a wall."], ["D", "Its content."], ["E", "None of the above."]], "a": "C", "sa": null, "pg": null, "f": [], "s": "H", "n": 61, "e": ["A cyst has a wall (epithelial lining) whereas a bulla is just a fluid blister. Size and location do not separate them.", "Cyst vs bulla: the wall."]}, {"id": "H021", "ch": "Introduction To Dermatology", "q": "A furrow is:", "o": [["A", "A deroofed burrow."], ["B", "A roofed burrow."], ["C", "The primary lesion of scabies."], ["D", "A tunnel in the dermis."], ["E", "A tunnel in the SC tissue."]], "a": "A", "sa": null, "pg": null, "f": [], "s": "H", "n": 62, "e": ["A furrow is the roof-less (deroofed) burrow left after the burrow roof is lost, as in scabies.", "Burrow = roofed; furrow = deroofed."]}, {"id": "H023", "ch": "Introduction To Dermatology", "q": "Masses of keratin are called:", "o": [["A", "Scales."], ["B", "Crusts."], ["C", "Comedones."], ["D", "Papules."], ["E", "Plaques."]], "a": "A", "sa": null, "pg": null, "f": [], "s": "H", "n": 63, "e": ["Scales are accumulations of keratin from increased proliferation or decreased desquamation. Crusts are dried exudate; comedones are keratin plugs inside follicles.", "Scales = keratin."]}, {"id": "Q056", "ch": "Bacterial Infections", "q": "All of the following are bacterial infections EXCEPT:", "o": [["A", "Impetigo."], ["B", "Erysipelas."], ["C", "Furuncles."], ["D", "Cellulitis."], ["E", "Kerion."]], "a": "E", "sa": null, "pg": "11", "f": [], "s": "B", "n": 1, "e": ["Impetigo, folliculitis, erysipelas and cellulitis are bacterial; kerion is an inflammatory fungal (tinea capitis) reaction.", "Kerion = fungal, not bacterial."]}, {"id": "Q057", "ch": "Bacterial Infections", "q": "The following are bacterial infections EXCEPT:", "o": [["A", "Impetigo."], ["B", "Acne vulgaris."], ["C", "Erythrasma."], ["D", "Erysipelas."], ["E", "Furuncles."]], "a": "B", "sa": null, "pg": "11", "f": [], "s": "B", "n": 2, "e": ["Acne vulgaris is a chronic inflammatory disease of the pilosebaceous unit; bacteria (C. acnes) contribute but it is not an infection.", "Acne ≠ infection."]}, {"id": "Q058", "ch": "Bacterial Infections", "q": "Impetigo may be caused by:", "o": [["A", "Herpes simplex virus."], ["B", "Mycobacterium leprae."], ["C", "Pox virus."], ["D", "Streptococci and staphylococci."], ["E", "Human papilloma virus."]], "a": "D", "sa": null, "pg": "11", "f": [], "s": "B", "n": 3, "e": ["Impetigo is a superficial infection caused by Staphylococcus aureus and/or group A beta-hemolytic streptococci.", "Non-bullous impetigo: staph ± strep."]}, {"id": "Q059", "ch": "Bacterial Infections", "q": "How does impetigo present?", "o": [["A", "Golden honey-colored crust over an erythematous base."], ["B", "Salmon-colored plaque with silvery scale."], ["C", "Comedones, pustules and nodules."], ["D", "Flesh-colored papule with a rough surface."], ["E", "Polyangular violaceous papule."]], "a": "A", "sa": null, "pg": "12", "f": [], "s": "B", "n": 4, "e": ["Impetigo contagiosa shows vesicles/pustules that rupture to leave golden honey-colored crusts on an erythematous base.", "Honey-colored crust = impetigo."]}, {"id": "Q060", "ch": "Bacterial Infections", "q": "Impetigo:", "o": [["A", "Is commoner in adults."], ["B", "Is caused only by streptococci."], ["C", "Heals with permanent scarring."], ["D", "Acute glomerulonephritis is a possible complication."], ["E", "Doesn't cause blistering."]], "a": "D", "sa": null, "pg": "12", "f": [], "s": "B", "n": 5, "e": ["Streptococcal impetigo can lead to post-streptococcal acute glomerulonephritis; rheumatic fever is not a complication.", "Impetigo → AGN (not rheumatic fever)."]}, {"id": "Q061", "ch": "Bacterial Infections", "q": "Poststreptococcal glomerulonephritis is a complication of:", "o": [["A", "Herpes zoster."], ["B", "Herpes simplex."], ["C", "Bullous impetigo."], ["D", "Impetigo contagiosum."], ["E", "Impetigo of Bockhart."]], "a": "D", "sa": null, "pg": "12", "f": [], "s": "B", "n": 6, "e": ["Nephritogenic streptococcal strains in impetigo contagiosa can trigger post-streptococcal glomerulonephritis.", "Skin strep → AGN."]}, {"id": "Q062", "ch": "Bacterial Infections", "q": "The following drug is used for treatment of honey-colored crusted lesions around the mouth after scratching insect bites:", "o": [["A", "Topical azole."], ["B", "Topical antibiotic."], ["C", "Oral fluconazole."], ["D", "Oral ivermectin."], ["E", "Topical permethrin."]], "a": "B", "sa": null, "pg": "13", "f": [], "s": "B", "n": 7, "e": ["Localized impetigo is treated with topical antibiotics (e.g. fusidic acid, mupirocin). Antifungals, ivermectin and permethrin do not treat bacteria.", "Localized impetigo → topical antibiotic."]}, {"id": "Q063", "ch": "Bacterial Infections", "q": "Bullous impetigo is caused by:", "o": [["A", "Pneumococci."], ["B", "Streptococci."], ["C", "Meningococci."], ["D", "Staphylococci."], ["E", "Propionibacteria."]], "a": "D", "sa": null, "pg": "12", "f": [], "s": "B", "n": 8, "e": ["Bullous impetigo is caused by Staphylococcus aureus, whose exfoliative toxin splits the upper epidermis.", "Bullous impetigo = staph."]}, {"id": "Q064", "ch": "Bacterial Infections", "q": "Bullous impetigo in neonates is due to:", "o": [["A", "Group A β-hemolytic streptococci exotoxin."], ["B", "Staphylococcus aureus exfoliative exotoxin."], ["C", "Corynebacterium toxin."], ["D", "Pseudomonas exotoxin."], ["E", "Clostridial toxin."]], "a": "B", "sa": null, "pg": "12", "f": [], "s": "B", "n": 9, "e": ["In neonates, S. aureus exfoliative toxins (ETA/ETB) cause the superficial blisters of bullous impetigo.", "Same toxin causes scalded skin syndrome."]}, {"id": "Q065", "ch": "Bacterial Infections", "q": "Bullous impetigo:", "o": [["A", "Is a purely staphylococcal infection."], ["B", "Is a mixed staphylococcal & streptococcal infection."], ["C", "Affects neonates."], ["D", "a + c."], ["E", "b + c. 2     A male infant, 6 months old, presented with these lesions on his leg of one week duration. His mother stated that his elder sister had the same lesions. The condition was associated with fever. (Clinical photo: flaccid bullae/pustules with clear-yellow fluid on erythematous skin of the leg.)"]], "a": "D", "sa": null, "pg": "12", "f": [], "s": "B", "n": 10, "e": ["Per the book, bullous impetigo is a staphylococcal infection that affects neonates, so a + c (the option set matches the key).", "Bullous = staph, neonates."]}, {"id": "Q066", "ch": "Bacterial Infections", "q": "What is the diagnosis of this case?", "o": [["A", "Bullous impetigo."], ["B", "Herpes simplex."], ["C", "Pustular psoriasis."], ["D", "Crusted scabies."], ["E", "Acute eczema. 2     A male infant, 6 months old, presented with these lesions on his leg of one week duration. His mother stated that his elder sister had the same lesions. The condition was associated with fever. (Clinical photo: flaccid bullae/pustules with clear-yellow fluid on erythematous skin of the leg.)"]], "a": "A", "sa": null, "pg": "12", "f": [], "s": "B", "n": 11, "e": ["Flaccid blisters and crusts in an infant, with contact cases and fever, indicate bullous impetigo.", "Neonatal bullous impetigo is contagious."]}, {"id": "Q067", "ch": "Bacterial Infections", "q": "Regarding this disease, choose the correct statement:", "o": [["A", "Is a superficial bacterial infection."], ["B", "Diagnosed by patch test."], ["C", "Heals by scar formation."], ["D", "Is a deep parasitic infection."], ["E", "Treated by topical ivermectin 1%."]], "a": "A", "sa": null, "pg": "11", "f": [], "s": "B", "n": 12, "e": ["Bullous impetigo is a superficial bacterial infection and heals without scarring; it is not parasitic and needs no patch test.", "Superficial = no scar."]}, {"id": "Q068", "ch": "Bacterial Infections", "q": "Ecthyma is:", "o": [["A", "Crusted impetigo."], ["B", "Ulcerative impetigo."], ["C", "Circinate impetigo."], ["D", "Bullous impetigo."], ["E", "Vesicular impetigo."]], "a": "B", "sa": null, "pg": "13", "f": [], "s": "B", "n": 13, "e": ["Ecthyma is the ulcerative (deeper) form of impetigo, extending to the dermis.", "Ecthyma = ulcerative impetigo."]}, {"id": "Q069", "ch": "Bacterial Infections", "q": "Ecthyma is:", "o": [["A", "Crusted impetigo."], ["B", "Circinate impetigo."], ["C", "Bullous impetigo."], ["D", "Bockhart's impetigo."], ["E", "None of the above."]], "a": "E", "sa": null, "pg": "13", "f": [], "s": "B", "n": 14, "e": ["Ecthyma is ulcerative impetigo; none of the other options given describes it, so 'none of the above' is the key.", "Ecthyma heals with scar."]}, {"id": "Q070", "ch": "Bacterial Infections", "q": "Ecthyma is:", "o": [["A", "A type of eczema."], ["B", "A fungal infection."], ["C", "An autoimmune disease."], ["D", "A type of warts."], ["E", "A type of impetigo."]], "a": "E", "sa": null, "pg": "13", "f": [], "s": "B", "n": 15, "e": ["Ecthyma is the ulcerative, deeper variant of non-bullous impetigo, caused by group A streptococci, and heals with scarring.", "Ecthyma = deep impetigo with ulcer."]}, {"id": "Q071", "ch": "Bacterial Infections", "q": "The following is a clinical variant of impetigo contagiosum:", "o": [["A", "Ecthyma."], ["B", "Cellulitis."], ["C", "Erysipelas."], ["D", "Erythrasma."], ["E", "Molluscum."]], "a": "A", "sa": null, "pg": "13", "f": [], "s": "B", "n": 16, "e": ["Clinical variants of impetigo are non-bullous, bullous and ulcerative (ecthyma). Ecthyma extends into the dermis, forming a punched-out ulcer with a hemorrhagic crust.", "Ecthyma scars."]}, {"id": "Q072", "ch": "Bacterial Infections", "q": "A 10-year-old male child has vesicles which turn into pustules with the formation of thick crusts that heal with scar formation on his legs. The most likely diagnosis is:", "o": [["A", "Sycosis barbae."], ["B", "Atopic dermatitis."], ["C", "Cellulitis."], ["D", "Ulcerative impetigo (ecthyma)."], ["E", "Molluscum contagiosum."]], "a": "D", "sa": null, "pg": "13", "f": [], "s": "B", "n": 17, "e": ["Vesicles turning to pustules with thick crusts that heal with scarring describe ulcerative impetigo (ecthyma).", "Ecthyma scars; ordinary impetigo does not."]}, {"id": "Q073", "ch": "Bacterial Infections", "q": "Ulcerative impetigo (ecthyma) is treated by systemic:", "o": [["A", "Azoles."], ["B", "Antihistamines."], ["C", "Antibiotics."], ["D", "Steroids."], ["E", "Retinoids."]], "a": "C", "sa": null, "pg": "13", "f": [], "s": "B", "n": 18, "e": ["Ecthyma is deep and needs systemic antibiotics (anti-staphylococcal/anti-streptococcal) plus local care.", "Ecthyma → oral antibiotics."]}, {"id": "Q074", "ch": "Bacterial Infections", "q": "Ecthyma is ___ and is treated by ___.", "o": [], "a": null, "sa": "Ulcerative impetigo (a deep variant of non-bullous impetigo); treated by systemic antibiotics.", "pg": "13", "f": [], "s": "B", "n": 19, "e": ["Ecthyma is a deep ulcerative variant of impetigo and is treated by systemic antibiotics.", "Ecthyma = ulcer + oral antibiotics."]}, {"id": "Q075", "ch": "Bacterial Infections", "q": "Mention the clinical types of impetigo.", "o": [], "a": null, "sa": "Non-bullous impetigo (impetigo contagiosa), bullous impetigo, and ulcerative impetigo (ecthyma)", "pg": "12", "f": [], "s": "B", "n": 20, "e": ["Clinical types are non-bullous (impetigo contagiosa), bullous impetigo and ulcerative impetigo (ecthyma). The book's answer text was cut off in the PDF; please verify.", "Three types: non-bullous, bullous, ulcerative."]}, {"id": "Q076", "ch": "Bacterial Infections", "q": "Staphylococcal infection in the upper part of the hair follicle is known as:", "o": [["A", "Folliculitis."], ["B", "Sycosis barbae."], ["C", "Furuncle."], ["D", "Cellulitis."], ["E", "Carbuncle."]], "a": "A", "sa": null, "pg": "13", "f": [], "s": "B", "n": 21, "e": ["Staphylococcal infection of the upper (superficial) part of the follicle is folliculitis (Bockhart impetigo).", "Folliculitis = superficial."]}, {"id": "Q077", "ch": "Bacterial Infections", "q": "Infection of the lower part of the hair follicle is called:", "o": [["A", "Folliculitis."], ["B", "Furunculosis."], ["C", "Kerion."], ["D", "Erythrasma."], ["E", "Impetigo."]], "a": "B", "sa": null, "pg": "14", "f": [], "s": "B", "n": 22, "e": ["Infection of the lower, deeper part of the follicle with necrosis is a furuncle (furunculosis when recurrent).", "Furuncle = deep follicle."]}, {"id": "Q078", "ch": "Bacterial Infections", "q": "Suppurative infection of the lower part of the hair follicle with central necrosis:", "o": [["A", "Carbuncle."], ["B", "Pustule."], ["C", "Furuncle."], ["D", "Folliculitis."], ["E", "Cellulitis."]], "a": "C", "sa": null, "pg": "14", "f": [], "s": "B", "n": 23, "e": ["A furuncle is a suppurative infection of the lower follicle with a central necrotic core ('core').", "Furuncle = boil with core."]}, {"id": "Q079", "ch": "Bacterial Infections", "q": "Multiple deep boils opening on the skin surface by multiple fistulae is called:", "o": [["A", "Kerion."], ["B", "Sycosis."], ["C", "Furunculosis."], ["D", "Carbuncle."], ["E", "Cellulitis."]], "a": "D", "sa": null, "pg": "14", "f": [], "s": "B", "n": 24, "e": ["A carbuncle is a group of coalescing furuncles draining through multiple openings.", "Carbuncle = multiple furuncles, many openings."]}, {"id": "Q080", "ch": "Bacterial Infections", "q": "A 40-year-old diabetic male develops a large, indurated, tender plaque on the back of the neck with multiple pus-discharging openings. The most likely diagnosis is:", "o": [["A", "Furuncle."], ["B", "Abscess."], ["C", "Folliculitis."], ["D", "Cellulitis."], ["E", "Carbuncle."]], "a": "E", "sa": null, "pg": "14", "f": [], "s": "B", "n": 25, "e": ["A large indurated painful plaque on the back of the neck with multiple draining openings in a diabetic is a carbuncle.", "Carbuncle: diabetic, nape of neck."]}, {"id": "Q081", "ch": "Bacterial Infections", "q": "Carbuncle is caused by which organism?", "o": [], "a": null, "sa": "Staphylococcus aureus.", "pg": "14", "f": [], "s": "B", "n": 26, "e": ["Carbuncles are coalescent deep boils caused by Staphylococcus aureus, more often in diabetic males and nasal carriers.", "Boils: S. aureus."]}, {"id": "Q082", "ch": "Bacterial Infections", "q": "Erysipelas is a:", "o": [["A", "Streptococcal infection of the epidermis."], ["B", "Staphylococcal infection of the subcutaneous tissue."], ["C", "Streptococcal infection of the hair follicles."], ["D", "Streptococcal infection of the dermis."], ["E", "Staphylococcal infection of the sweat ducts."]], "a": "D", "sa": null, "pg": "15", "f": [], "s": "B", "n": 27, "e": ["Erysipelas is a streptococcal infection of the upper dermis with lymphatic involvement.", "Erysipelas = strep, upper dermis."]}, {"id": "Q083", "ch": "Bacterial Infections", "q": "Erysipelas characteristically involves which skin layer?", "o": [["A", "Epidermis only."], ["B", "Upper dermis and lymphatics."], ["C", "Lower dermis and subcutis."], ["D", "Subcutaneous fat only."], ["E", "Muscle layer."]], "a": "B", "sa": null, "pg": null, "f": [], "s": "B", "n": 28, "e": ["Erysipelas affects the upper dermis and superficial lymphatics, giving a sharply demarcated raised red plaque. Cellulitis is deeper.", "Erysipelas sharp edge; cellulitis ill-defined."]}, {"id": "Q084", "ch": "Bacterial Infections", "q": "Erysipelas:", "o": [["A", "Is a bacterial infection of the subcutaneous tissue."], ["B", "Affects the intertriginous areas."], ["C", "Gives coral red fluorescence with Wood's light."], ["D", "Is caused by Staphylococcus aureus."], ["E", "Is complicated by (lymph)edema."]], "a": "E", "sa": null, "pg": "15", "f": [], "s": "B", "n": 29, "e": ["Erysipelas involves the superficial dermal lymphatics, so repeated attacks scar the lymphatics and cause lymphedema. Lymphedema also predisposes to the next attack.", "Erysipelas ↔ lymphedema."]}, {"id": "Q085", "ch": "Bacterial Infections", "q": "In erysipelas:", "o": [["A", "Lymphedema might be a predisposing factor."], ["B", "Lymphedema might be a complication."], ["C", "Marked edema with blistering may be observed."], ["D", "All of the above."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "B", "n": 30, "e": ["Lymphedema predisposes to erysipelas and is also a complication of it, and marked edema with bullae can occur; so all of the above.", "Vicious circle: lymphedema ↔ erysipelas."]}, {"id": "Q086", "ch": "Bacterial Infections", "q": "Lymphedema is a complication of recurrent:", "o": [["A", "Impetigo."], ["B", "Erythrasma."], ["C", "Erysipelas."], ["D", "Pediculosis."], ["E", "Favus."]], "a": "C", "sa": null, "pg": "15", "f": [], "s": "B", "n": 31, "e": ["Recurrent episodes of erysipelas extend into superficial lymphatics and cause permanent lymphedema (the book's first complication, with glomerulonephritis).", "Recurrent erysipelas → lymphedema."]}, {"id": "Q087", "ch": "Bacterial Infections", "q": "A common complication of erysipelas is:", "o": [["A", "Pruritus."], ["B", "Malignant transformation."], ["C", "Deep venous thrombosis."], ["D", "Lymphedema."], ["E", "Scar formation."]], "a": "D", "sa": null, "pg": "15", "f": [], "s": "B", "n": 32, "e": ["The commonest complication is lymphedema from lymphatic damage; glomerulonephritis is the other listed complication. DVT and ulceration are not typical.", "Lymphedema."]}, {"id": "Q088", "ch": "Bacterial Infections", "q": "An obese female with lower limb lymphedema presented with a well-defined erythematous, swollen, tender area affecting the right leg. The patient was feverish and lethargic. Diagnosis is:", "o": [["A", "Acute urticaria."], ["B", "Lepromatous leprosy."], ["C", "Erysipelas."], ["D", "Ecthyma."], ["E", "Erythrasma."]], "a": "C", "sa": null, "pg": "15", "f": [], "s": "B", "n": 33, "e": ["A well-demarcated hot red swollen leg with fever on a lymphedematous limb is erysipelas.", "Fever + sharp red leg = erysipelas."]}, {"id": "Q089", "ch": "Bacterial Infections", "q": "A 45-year-old diabetic male presented with a 3-day history of a progressively increasing warm, tender swelling on the posterolateral aspect of his left calf with recurrent attacks of fever and rigors. Examination revealed a well-defined edematous and erythematous induration. Body temperature was 38°C and white cell count was 15,000. This patient has a:", "o": [["A", "Streptococcal infection of the dermis."], ["B", "Streptococcal infection of the epidermis."], ["C", "Staphylococcal infection of the subcutaneous tissue."], ["D", "Streptococcal infection of the hair follicles."], ["E", "Staphylococcal infection of the sweat ducts. 1     A 55-year-old diabetic woman presented with a 3-day history of a progressively increasing warm, tender, erythematous swelling on her left cheek. Investigations revealed a white cell count of 15,000 and HbA1c of 8.9. (Clinical photo: bright red, well-demarcated erythematous swelling of the cheek and ear.)"]], "a": "A", "sa": null, "pg": "15", "f": [], "s": "B", "n": 34, "e": ["A warm, tender, spreading erythematous swelling with systemic features in a diabetic is a streptococcal dermal infection (erysipelas).", "Treat with penicillin."]}, {"id": "Q090", "ch": "Bacterial Infections", "q": "The diagnosis of this case is:", "o": [["A", "Ecthyma."], ["B", "Erysipelas."], ["C", "Impetigo contagiosum."], ["D", "Carbuncle."], ["E", "Erythrasma. 1     A 55-year-old diabetic woman presented with a 3-day history of a progressively increasing warm, tender, erythematous swelling on her left cheek. Investigations revealed a white cell count of 15,000 and HbA1c of 8.9. (Clinical photo: bright red, well-demarcated erythematous swelling of the cheek and ear.)"]], "a": "B", "sa": null, "pg": "15", "f": [], "s": "B", "n": 35, "e": ["The clinical picture of a sharply demarcated, hot, tender erythema is erysipelas.", "Erysipelas = sharp border."]}, {"id": "Q091", "ch": "Bacterial Infections", "q": "This patient has a:", "o": [["A", "Streptococcal infection of the dermis."], ["B", "Streptococcal infection of the epidermis."], ["C", "Staphylococcal infection of the subcutaneous tissue."], ["D", "Streptococcal infection of the hair follicles."], ["E", "Staphylococcal infection of the sweat ducts. 2     A 55-year-old diabetic woman presented with a 3-day history of a progressively increasing warm, tender, erythematous swelling on her left cheek. Investigations revealed a white cell count of 15,000 and HbA1c of 8.9. (Clinical photo: bright red, well-demarcated erythematous swelling of the cheek and ear.)"]], "a": "A", "sa": null, "pg": "15", "f": [], "s": "B", "n": 36, "e": ["A hot red tender swollen area with a sharp border and systemic symptoms is erysipelas, a group A streptococcal infection of the upper dermis, treated with penicillin.", "Erysipelas = strep, upper dermis."]}, {"id": "Q092", "ch": "Bacterial Infections", "q": "All of the following statements are correct EXCEPT:", "o": [["A", "Treated by systemic antibiotics."], ["B", "Associated with fever and malaise."], ["C", "Shows yellow fluorescence by Wood's light."], ["D", "Complicated by lymphedema."], ["E", "Recurrent attacks are common."]], "a": "C", "sa": null, "pg": "15", "f": [], "s": "B", "n": 37, "e": ["Erythrasma shows coral-red (not yellow) fluorescence under Wood's light, so that statement is the incorrect one.", "Erythrasma = coral red; versicolor = yellow."]}, {"id": "Q093", "ch": "Bacterial Infections", "q": "The causative organism of erythrasma is:", "o": [["A", "Staphylococcus aureus."], ["B", "Propionibacterium acnes."], ["C", "Corynebacterium minutissimum."], ["D", "Dermatophytes."], ["E", "Candida albicans."]], "a": "C", "sa": null, "pg": "16", "f": [], "s": "B", "n": 38, "e": ["Erythrasma is caused by Corynebacterium minutissimum, which produces porphyrins that fluoresce.", "Erythrasma = C. minutissimum."]}, {"id": "Q094", "ch": "Bacterial Infections", "q": "Erythrasma:", "o": [["A", "Is a suppurative inflammation of the upper dermis."], ["B", "Involves intertriginous areas such as axillae, groins and submammary region."], ["C", "Is caused by Streptococcus pyogenes."], ["D", "Shows yellow fluorescence on Wood's light examination."], ["E", "Is associated with fever and malaise."]], "a": "B", "sa": null, "pg": "16", "f": [], "s": "B", "n": 39, "e": ["Erythrasma affects intertriginous areas: axillae, groins and submammary folds, with brown scaly patches.", "Folds + coral red."]}, {"id": "Q095", "ch": "Bacterial Infections", "q": "A presentation of brown-red scaly groin patches with coral red fluorescence in an obese diabetic patient is diagnostic of:", "o": [["A", "Tinea cruris."], ["B", "Erythrasma."], ["C", "Candidiasis."], ["D", "Psoriasis."], ["E", "Tinea versicolor."]], "a": "B", "sa": null, "pg": "16", "f": [], "s": "B", "n": 40, "e": ["Brown-red scaly groin patches with coral-red fluorescence in an obese diabetic are erythrasma, treated with erythromycin.", "Treat: erythromycin."]}, {"id": "Q096", "ch": "Bacterial Infections", "q": "In erythrasma, Wood's light fluorescence is:", "o": [["A", "Red."], ["B", "Green."], ["C", "Yellow."], ["D", "White."], ["E", "Violet."]], "a": "A", "sa": null, "pg": "16", "f": [], "s": "B", "n": 41, "e": ["The porphyrins of C. minutissimum give coral-red fluorescence on Wood's light.", "Red fluorescence = erythrasma."]}, {"id": "Q097", "ch": "Bacterial Infections", "q": "Regarding erythrasma, Wood's light examination shows:", "o": [["A", "Yellow-green fluorescence."], ["B", "Coral red fluorescence."], ["C", "Enhancement of color contrast."], ["D", "No change."], ["E", "Blue-green fluorescence."]], "a": "B", "sa": null, "pg": "16", "f": [], "s": "B", "n": 42, "e": ["Corynebacterium minutissimum produces porphyrins that fluoresce coral red on Wood's light. Yellow fluorescence belongs to versicolor and yellow-green to favus and black-dot ringworm.", "Coral red = erythrasma."]}, {"id": "Q098", "ch": "Bacterial Infections", "q": "Wood's light helps in the diagnosis of:", "o": [["A", "Tinea circinata."], ["B", "Impetigo contagiosum."], ["C", "Erythrasma."], ["D", "Erysipelas."], ["E", "Condyloma acuminata."]], "a": "C", "sa": null, "pg": "16", "f": [], "s": "B", "n": 43, "e": ["Wood's light helps diagnose erythrasma (coral red), pityriasis versicolor (yellow) and favus, among others.", "Wood's light: erythrasma, versicolor, favus, vitiligo."]}, {"id": "H028", "ch": "Bacterial Infections", "q": "Bullous impetigo:", "o": [["A", "Is a purely staphylococcal infection."], ["B", "Is a mixed staphylococcal & streptococcal infection."], ["C", "Affects neonates."], ["D", "A + c."], ["E", "B + c."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 44, "e": ["Bullous impetigo is a staphylococcal infection (not mixed) that affects neonates.", "Bullous = staph, neonates."]}, {"id": "H037", "ch": "Bacterial Infections", "q": "Erysipelas :", "o": [["A", "Streptococcal infection of dermis"], ["B", "Streptococcal infection of epidermis"], ["C", "Streptococcal infection of hair"], ["D", "Streptococcal infection of nail"]], "a": "A", "sa": null, "pg": null, "f": [], "s": "H", "n": 45, "e": ["Erysipelas is a streptococcal infection of the upper dermis, involving superficial lymphatics, giving a sharply demarcated erythematous swollen plaque with systemic symptoms. Impetigo is epidermal and cellulitis is deeper.", "Strep, upper dermis."]}, {"id": "H041", "ch": "Bacterial Infections", "q": "A male infant 6 months old, presented with the lesions shown in the original image on his leg of one week duration. His mother stated that his elder sister had the same lesions. The condition was associated by fever. What is the diagnosis of this case? [image-based in the original bank]", "o": [["A", "Bullous impetigo."], ["B", "Herpes simplex."], ["C", "Pustular psoriasis."], ["D", "Crusted scabies."], ["E", "Acute eczema."]], "a": "A", "sa": null, "pg": null, "f": ["Image-based in the original bank; image not in the PDF text."], "s": "H", "n": 46, "e": ["A blistering eruption in an infant that spreads to siblings with fever points to bullous impetigo. The original image is not in the PDF text.", "Contagious blisters in babies."]}, {"id": "H042", "ch": "Bacterial Infections", "q": "Regarding this disease [Bullous Impetigo], choose the correct statement:", "o": [["A", "Is a superficial bacterial infection."], ["B", "Diagnosed by patch test."], ["C", "Heals by scar formation."], ["D", "Is a deep parasitic infection."], ["E", "Treated by topical ivermectin 1%."]], "a": "A", "sa": null, "pg": null, "f": [], "s": "H", "n": 47, "e": ["Bullous impetigo is a superficial bacterial infection that heals without scarring.", "Superficial, no scar."]}, {"id": "Q099", "ch": "Mycobacterial Infections", "q": "Regarding leprosy, which of the following is TRUE?", "o": [["A", "It involves mainly skin and nerves."], ["B", "It has a short incubation period."], ["C", "Lepra bacilli are easily grown in vitro."], ["D", "Clinical presentation depends on humoral immunity."], ["E", "Monodrug therapy is the treatment of choice."]], "a": "A", "sa": null, "pg": "19", "f": [], "s": "B", "n": 1, "e": ["Leprosy (Hansen disease) is caused by Mycobacterium leprae and mainly affects skin and peripheral nerves.", "Skin + nerves."]}, {"id": "Q100", "ch": "Mycobacterial Infections", "q": "In leprosy", "o": [["A", "It is a stable disease."], ["B", "It is not infectious."], ["C", "Dapsone is the backbone of treatment of all types."], ["D", "It is an autoimmune disease."], ["E", "Nodules are characteristic of tuberculoid leprosy."]], "a": "C", "sa": null, "pg": "20", "f": [], "s": "B", "n": 2, "e": ["According to the book, dapsone is the backbone of treatment in all types, given in multidrug therapy (with rifampicin ± clofazimine).", "MDT: dapsone + rifampicin ± clofazimine."]}, {"id": "Q101", "ch": "Mycobacterial Infections", "q": "Target cell for lepra bacilli is the", "o": [["A", "Keratinocyte."], ["B", "Melanocyte."], ["C", "Schwann cell."], ["D", "Fibroblast."], ["E", "Endothelial cell."]], "a": "C", "sa": null, "pg": "17", "f": [], "s": "B", "n": 3, "e": ["M. leprae has a special affinity for Schwann cells, causing neuropathy and anesthesia.", "Target cell = Schwann cell."]}, {"id": "Q102", "ch": "Mycobacterial Infections", "q": "Expression of the disease in leprosy depends on", "o": [["A", "Humoral immunity."], ["B", "Immune complexes."], ["C", "Complement fixation."], ["D", "Cell-mediated immunity."], ["E", "IgE-mediated immunity."]], "a": "D", "sa": null, "pg": "17", "f": [], "s": "B", "n": 4, "e": ["The clinical form depends on the patient's cell-mediated immunity, not humoral immunity.", "Good CMI → tuberculoid; poor CMI → lepromatous."]}, {"id": "Q103", "ch": "Mycobacterial Infections", "q": "Regarding leprosy, the following statement is INCORRECT", "o": [["A", "High immunity leads to paucibacillary leprosy."], ["B", "Tuberculoid leprosy shows good immunity."], ["C", "Infection occurs through nasal mucosa."], ["D", "Sensory nerves affection leads to glove and stocking anesthesia."], ["E", "Lepromatous leprosy is paucibacillary."]], "a": "E", "sa": null, "pg": "18", "f": [], "s": "B", "n": 5, "e": ["Lepromatous leprosy is multibacillary (poor immunity, many bacilli); the statement that it is paucibacillary is wrong.", "Lepromatous = multibacillary."]}, {"id": "Q104", "ch": "Mycobacterial Infections", "q": "In leprosy, choose the correct answer", "o": [["A", "Paucibacillary leprosy occurs in a patient with a high immunity."], ["B", "Tuberculoid leprosy shows bad immunity."], ["C", "Lepromin test is diagnostic."], ["D", "Motor nerve affection leads to glove and stocking anesthesia."], ["E", "Lepromatous leprosy is paucibacillary."]], "a": "A", "sa": null, "pg": "17", "f": [], "s": "B", "n": 6, "e": ["Paucibacillary leprosy (tuberculoid) occurs in patients with high immunity, so few bacilli are found.", "High immunity = few bacilli."]}, {"id": "Q105", "ch": "Mycobacterial Infections", "q": "In leprosy", "o": [["A", "Lepromatous, borderline lepromatous & borderline tuberculoid leprosy are paucibacillary forms of the disease."], ["B", "Nerve invasion is late in tuberculoid leprosy."], ["C", "Numerous patches are characteristic of tuberculoid leprosy."], ["D", "All of the above are true."], ["E", "None of the above is true."]], "a": "E", "sa": null, "pg": "18", "f": [], "s": "B", "n": 7, "e": ["The listed statements are all incorrect, so 'none of the above' is the key.", "Check the spectrum: TT → LL."]}, {"id": "Q106", "ch": "Mycobacterial Infections", "q": "Best prognosis in leprotic cases is in", "o": [["A", "Borderline leprosy."], ["B", "Tuberculoid leprosy."], ["C", "Lepromatous leprosy."], ["D", "Borderline tuberculoid leprosy."], ["E", "Borderline lepromatous leprosy."]], "a": "B", "sa": null, "pg": "17", "f": [], "s": "B", "n": 8, "e": ["Tuberculoid leprosy has good immunity, limited disease and the best prognosis.", "TT = best prognosis."]}, {"id": "Q107", "ch": "Mycobacterial Infections", "q": "In leprosy", "o": [["A", "Lepromatous & borderline leprosy are paucibacillary forms."], ["B", "Nerve invasion is late in tuberculoid leprosy."], ["C", "Patches are characteristic of tuberculoid leprosy."], ["D", "It is a stable disease."], ["E", "It is an autoimmune disease."]], "a": "C", "sa": null, "pg": null, "f": [], "s": "B", "n": 9, "e": ["Tuberculoid leprosy (good immunity) gives few well-defined hypopigmented hairless, anesthetic patches, because nerves are damaged early. Numerous patches are a feature of lepromatous leprosy.", "TT: few patches; LL: numerous."]}, {"id": "Q108", "ch": "Mycobacterial Infections", "q": "Hypopigmented anaesthetic macules occur in", "o": [["A", "Tinea versicolor."], ["B", "Vitiligo."], ["C", "Lepromatous leprosy."], ["D", "Tuberculoid leprosy."], ["E", "Pityriasis alba."]], "a": "D", "sa": null, "pg": "19", "f": [], "s": "B", "n": 10, "e": ["Tuberculoid leprosy produces hypopigmented hairless anesthetic macules or plaques.", "Anesthesia + hypopigmentation = TT."]}, {"id": "Q109", "ch": "Mycobacterial Infections", "q": "Leprosy may present with", "o": [["A", "Golden crusted lesions."], ["B", "Umbilicated vesicles."], ["C", "Numbness and hypopigmented lesion."], ["D", "Itchy circinate lesion with healing center."], ["E", "Painful grouped unilateral vesicles along a nerve."]], "a": "C", "sa": null, "pg": "19", "f": [], "s": "B", "n": 11, "e": ["Leprosy presents with hypopigmented lesions and numbness from nerve damage.", "Numb patch = think leprosy."]}, {"id": "Q110", "ch": "Mycobacterial Infections", "q": "Feature of tuberculoid leprosy", "o": [["A", "Loss of outer third of eyebrow."], ["B", "Hairless hypopigmented patches."], ["C", "Nodules in the face and ear."], ["D", "Multiple bacilli."]], "a": "B", "sa": null, "pg": "19", "f": [], "s": "B", "n": 12, "e": ["Tuberculoid leprosy gives hairless hypopigmented patches with sensory loss.", "Hairless + anesthetic."]}, {"id": "Q111", "ch": "Mycobacterial Infections", "q": "Which is TRUE regarding tuberculoid leprosy?", "o": [["A", "Diagnosed by lepromin test."], ["B", "Presents with multiple nodules."], ["C", "Nerve involvement occurs early."], ["D", "Involves mucous membranes."], ["E", "Is a sign of poor immunity. 1     A male patient, 42 years old, presented with multiple hypopigmented hairless macules on the upper extremities as well as patches on his legs. On examination, these patches showed absent sensation, and the ulnar nerve was thickened, beaded and tender by palpation. (Clinical photo: hypopigmented patches on the knee and leg.)"]], "a": "C", "sa": null, "pg": "18", "f": [], "s": "B", "n": 13, "e": ["Nerve involvement occurs early in tuberculoid leprosy and is asymmetric and severe.", "TT: early nerve, few lesions."]}, {"id": "Q112", "ch": "Mycobacterial Infections", "q": "Diagnosis of this case is", "o": [["A", "Erythrasma."], ["B", "Tuberculoid leprosy."], ["C", "Lichen planus."], ["D", "Pityriasis versicolor."], ["E", "Psoriasis. 1     A male patient, 42 years old, presented with multiple hypopigmented hairless macules on the upper extremities as well as patches on his legs. On examination, these patches showed absent sensation, and the ulnar nerve was thickened, beaded and tender by palpation. (Clinical photo: hypopigmented patches on the knee and leg.)"]], "a": "B", "sa": null, "pg": "19", "f": [], "s": "B", "n": 14, "e": ["A few well-defined hypopigmented anesthetic patches indicate tuberculoid leprosy.", "Few patches = TT."]}, {"id": "Q113", "ch": "Mycobacterial Infections", "q": "The following is a feature of this disease", "o": [["A", "Nerves are involved early."], ["B", "Mucous membranes are involved."], ["C", "Shows negative lepromin test."], ["D", "Viscera are involved."], ["E", "It is multibacillary. 2     A male patient, 52 years old, presented with glistening erythematous papules, nodules & plaques on his ears, nose and forehead. He had loss of the outer 1/3 of his eyebrows and gave history of recurrent attacks of epistaxis."]], "a": "A", "sa": null, "pg": "18", "f": [], "s": "B", "n": 15, "e": ["In tuberculoid leprosy, strong cell-mediated immunity attacks the bacillus in nerves, so sensation is impaired early and nerve damage may be extensive. In lepromatous leprosy nerve involvement is late.", "TT early nerve; LL late nerve."]}, {"id": "Q114", "ch": "Mycobacterial Infections", "q": "What is your diagnosis?", "o": [["A", "Impetigo contagiosum."], ["B", "Tuberculoid leprosy."], ["C", "Lepromatous leprosy."], ["D", "Pityriasis versicolor."], ["E", "Psoriasis. 1     A male patient, 52 years old, presented with glistening erythematous papules, nodules & plaques on his ears, nose and forehead. He had loss of the outer 1/3 of his eyebrows and gave history of recurrent attacks of epistaxis."]], "a": "C", "sa": null, "pg": "19", "f": [], "s": "B", "n": 16, "e": ["Symmetrical nodules and infiltration with leonine face indicate lepromatous leprosy.", "LL: symmetrical, widespread."]}, {"id": "Q115", "ch": "Mycobacterial Infections", "q": "What is the diagnosis?", "o": [["A", "Alopecia areata."], ["B", "Cicatricial alopecia."], ["C", "Favus."], ["D", "Leprosy."], ["E", "Kerion. 2     A patient with widespread, symmetrical papules and nodules, infiltrated facial skin, and loss of outer third of eyebrows."]], "a": "D", "sa": null, "pg": "19", "f": [], "s": "B", "n": 17, "e": ["The skin picture with leprosy features calls for slit-skin smear stained with modified Ziehl-Neelsen, skin or nerve biopsy and PCR for confirmation.", "Smear + biopsy."]}, {"id": "Q116", "ch": "Mycobacterial Infections", "q": "Which is TRUE regarding this disease?", "o": [["A", "Is a parasitic infection."], ["B", "Bacilli are absent in skin lesions."], ["C", "Nerve involvement occurs early."], ["D", "Involves mucous membranes."], ["E", "Is characterized by good immunity."]], "a": "D", "sa": null, "pg": "19", "f": [], "s": "B", "n": 18, "e": ["Lepromatous leprosy has poor immunity and numerous bacilli, so mucous membranes (nasal mucosa → epistaxis, septal destruction), eyes, kidneys, liver, bones and testes can be involved. Tuberculoid leprosy involves skin and nerves only.", "LL: mucosa + viscera."]}, {"id": "Q117", "ch": "Mycobacterial Infections", "q": "All of the following are features of lepromatous leprosy EXCEPT", "o": [["A", "Nerves are involved early."], ["B", "Runs a chronic course."], ["C", "Shows negative lepromin test."], ["D", "Viscera are involved."], ["E", "It is multibacillary."]], "a": "A", "sa": null, "pg": "18", "f": [], "s": "B", "n": 19, "e": ["In lepromatous leprosy nerve involvement is late, not early; the other features are true.", "LL: late nerve; TT: early nerve."]}, {"id": "Q118", "ch": "Mycobacterial Infections", "q": "The following is a feature of lepromatous leprosy", "o": [["A", "Good immunity."], ["B", "Early anesthesia."], ["C", "Positive lepromin test."], ["D", "Epistaxis."], ["E", "Few bacilli in the lesion."]], "a": "D", "sa": null, "pg": "19", "f": [], "s": "B", "n": 20, "e": ["Nasal mucosal infiltration in lepromatous leprosy causes epistaxis and may destroy the nasal septum. This is not a feature of tuberculoid leprosy.", "Epistaxis = LL."]}, {"id": "Q119", "ch": "Mycobacterial Infections", "q": "Which of the following is a feature of lepromatous leprosy?", "o": [["A", "Few anesthetic hairless patches."], ["B", "Symmetrical widespread nodules and thickened nodular ears."], ["C", "Rapid healing without deformity."], ["D", "Only mucosal involvement."], ["E", "Nerve sensation is impaired early."]], "a": "B", "sa": null, "pg": "19", "f": [], "s": "B", "n": 21, "e": ["Lepromatous leprosy presents with symmetrical widespread nodules and thickened nodular ears.", "Nodular ears = LL."]}, {"id": "Q120", "ch": "Mycobacterial Infections", "q": "The following features belong to lepromatous leprosy", "o": [["A", "Hypopigmented macules."], ["B", "Maculoanaesthetic patches."], ["C", "Strongly positive lepromin test."], ["D", "Leonine facies."], ["E", "Bacteriology shows a paucity of bacilli."]], "a": "D", "sa": null, "pg": "19", "f": [], "s": "B", "n": 22, "e": ["Leonine facies is due to diffuse infiltration and nodules of the face in lepromatous leprosy.", "Lion face."]}, {"id": "Q121", "ch": "Mycobacterial Infections", "q": "Leonine facies may occur in", "o": [["A", "Tuberculoid leprosy."], ["B", "Indeterminate leprosy."], ["C", "Lepromatous leprosy."], ["D", "Borderline leprosy."], ["E", "None of the above."]], "a": "C", "sa": null, "pg": "19", "f": [], "s": "B", "n": 23, "e": ["Progressive facial infiltration deepens the natural lines and gives leonine (lion-like) facies, with loss of the outer third of eyebrows. It is a hallmark of lepromatous leprosy.", "Leonine facies = LL."]}, {"id": "Q122", "ch": "Mycobacterial Infections", "q": "In lepromatous leprosy", "o": [["A", "Lesions are few in number."], ["B", "Penicillin is the backbone of treatment."], ["C", "Anesthesia is late & extensive on cold areas."], ["D", "Organisms are rarely found in skin smears."], ["E", "Internal organs are not involved."]], "a": "C", "sa": null, "pg": "18", "f": [], "s": "B", "n": 24, "e": ["Anesthesia appears late and is extensive (glove and stocking, cold areas) in lepromatous leprosy.", "LL: late anesthesia."]}, {"id": "Q123", "ch": "Mycobacterial Infections", "q": "In lepromatous leprosy, immunity is ___ and the face appears as ___.", "o": [], "a": null, "sa": "Immunity is bad (least effective immune response); leonine (lion) facies.", "pg": "19", "f": [], "s": "B", "n": 25, "e": ["Lepromatous leprosy has poor immunity and the face appears leonine (lion-like).", "Poor immunity, leonine facies."]}, {"id": "Q124", "ch": "Mycobacterial Infections", "q": "Leprosy is treated by", "o": [["A", "Dapsone."], ["B", "Retinoids."], ["C", "Methotrexate."], ["D", "Cyclosporine."], ["E", "Azathioprine."]], "a": "A", "sa": null, "pg": "20", "f": [], "s": "B", "n": 26, "e": ["Dapsone is part of the WHO multidrug therapy for leprosy (with rifampicin ± clofazimine) and is taken daily. Retinoids, methotrexate and tetracyclines are not anti-leprosy drugs.", "MDT: rifampicin + dapsone ± clofazimine."]}, {"id": "Q125", "ch": "Mycobacterial Infections", "q": "The backbone treatment of leprosy is", "o": [["A", "Azithromycin."], ["B", "Tetracycline."], ["C", "Colchicine."], ["D", "Steroids."], ["E", "Dapsone."]], "a": "E", "sa": null, "pg": "20", "f": [], "s": "B", "n": 27, "e": ["Dapsone, taken daily for at least 6 months (paucibacillary) or 12 months (multibacillary), is the backbone drug, combined with rifampicin and clofazimine to avoid resistance.", "Dapsone backbone."]}, {"id": "H051", "ch": "Mycobacterial Infections", "q": "In lepromatous leprosy:", "o": [["A", "Lesions are few in number."], ["B", "Lepromin test is positive."], ["C", "Anesthesia is late and extensive on cold areas."], ["D", "Organisms are rarely found in skin smears."], ["E", "None of the above."]], "a": "C", "sa": null, "pg": null, "f": [], "s": "H", "n": 28, "e": ["In lepromatous leprosy sensory loss appears late but becomes extensive (glove and stocking), because bacilli accumulate in nerves slowly. In tuberculoid leprosy it is early and localized.", "LL: late anesthesia."]}, {"id": "H053", "ch": "Mycobacterial Infections", "q": "In leprosy:", "o": [["A", "It is a stable disease."], ["B", "Keratinocytes are the target cells for the bacilli."], ["C", "Dapsone is the backbone of treatment of all types of leprosy."], ["D", "Leprosy is an autoimmune disease."], ["E", "Lepromin test is reliable in the diagnosis."]], "a": "C", "sa": null, "pg": null, "f": [], "s": "H", "n": 29, "e": ["Per the book, dapsone is the backbone of treatment of all types of leprosy; the disease is not stable, not autoimmune, and the lepromin test is not diagnostic.", "Lepromin = prognostic only."]}, {"id": "H054", "ch": "Mycobacterial Infections", "q": "Diagnosis of leprosy includes:", "o": [["A", "Skin biopsy."], ["B", "Nerve biopsy."], ["C", "Nasal smear."], ["D", "All of the above."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 30, "e": ["Diagnosis uses skin biopsy, nerve biopsy and slit-skin/nasal smears, so all of the above.", "Smear, biopsy, nerve biopsy."]}, {"id": "H055", "ch": "Mycobacterial Infections", "q": "Leprosy is treated by:", "o": [["A", "Dapsone."], ["B", "Retinoids."], ["C", "Methotrexate."], ["D", "Tetracyclines."], ["E", "All of the above."]], "a": "A", "sa": null, "pg": null, "f": [], "s": "H", "n": 31, "e": ["Dapsone is used for leprosy; retinoids, methotrexate and tetracyclines are not anti-leprotic here.", "Dapsone."]}, {"id": "H056", "ch": "Mycobacterial Infections", "q": "In leprosy:", "o": [["A", "Lepromatous, borderline lepromatous & borderline tuberculoid leprosy are paucibacillary forms of the disease."], ["B", "Nerve invasion is late in tuberculoid leprosy."], ["C", "Numerous patches are characteristic of tuberculoid leprosy."], ["D", "All of the above is true."], ["E", "None of the above is true."]], "a": "E", "sa": null, "pg": null, "f": [], "s": "H", "n": 32, "e": ["The statements given are all wrong: lepromatous/borderline lepromatous are multibacillary, nerve invasion is early in tuberculoid, and numerous patches are lepromatous.", "Paucibacillary = TT, BT."]}, {"id": "H057", "ch": "Mycobacterial Infections", "q": "Hansen's disease is another name for:", "o
