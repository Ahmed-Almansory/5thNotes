,"Calcipotriene."],["C","Antimalarials."],["D","Ivermectin."],["E","Nystatin."]],"a":"C","sa":null,"pg":"62","f":[],"n":192,"e":["Antimalarials (hydroxychloroquine/chloroquine) are the treatment of choice for actinic LP, with sunscreens. Why the other options are wrong: A) Allylamines: Allylamines are antifungal. B) Calcipotriene: Calcipotriene is for psoriasis. D) Ivermectin: Ivermectin is antiparasitic. E) Nystatin: Nystatin is antifungal.","Actinic LP = antimalarials + sunscreen."],"im":[],"src":"Q339"},{"id":"K193","ch":"⭐ Key Ideas — each idea once","q":"Treatment of actinic lichen planus includes","o":[["A","Benzoyl peroxide."],["B","Phototherapy."],["C","Terbinafine."],["D","Chloroquine"],["E","Crotamiton."]],"a":"D","sa":null,"pg":"62","f":[],"n":193,"e":["Chloroquine/hydroxychloroquine, antimalarials, are the treatment for actinic LP, along with sunscreen. Why the other options are wrong: A) Benzoyl peroxide: BPO is for acne. B) Phototherapy: Phototherapy worsens actinic LP. C) Terbinafine: Terbinafine is antifungal. E) Crotamiton: Crotamiton is for scabies.","Antimalarials."],"im":[],"src":"Q340"},{"id":"K194","ch":"⭐ Key Ideas — each idea once","q":"Pityriasis rosea is","o":[["A","Contagious with a chronic course."],["B","Contagious with a self-limited course."],["C","Non-contagious with a self-limited course."],["D","Contagious with an acute course."],["E","Non-contagious with remissions and exacerbations."]],"a":"C","sa":null,"pg":"64","f":[],"n":194,"e":["Pityriasis rosea is considered a non-contagious exanthematous reaction with a self-limiting course, so isolation is unnecessary. Why the other options are wrong: A) Contagious with a chronic course: It is non-contagious. B) Contagious with a self-limited course: It is non-contagious. D) Contagious with an acute course: It is non-contagious. E) Non-contagious with remissions and exace…: It does not relapse.","Non-infectious, self-limited."],"im":[],"src":"Q344"},{"id":"K195","ch":"⭐ Key Ideas — each idea once","q":"The causative organism of pityriasis rosea is","o":[["A","Varicella zoster virus."],["B","Human papilloma virus."],["C","Human herpes virus 6 & 7."],["D","Human herpes virus 8."],["E","Human herpes virus 1 & 2."]],"a":"C","sa":null,"pg":"63","f":[],"n":195,"e":["Human herpes viruses 6 and 7 are implicated, with recent reports of influenza and COVID-19. Why the other options are wrong: A) Varicella zoster virus: VZV causes zoster. B) Human papilloma virus: HPV causes warts. D) Human herpes virus 8: HHV-8 causes Kaposi. E) Human herpes virus 1 & 2: HSV causes vesicles.","HHV-6/7."],"im":[],"src":"Q348"},{"id":"K196","ch":"⭐ Key Ideas — each idea once","q":"The differential diagnosis of \"herald patch\" on the trunk is","o":[["A","Tinea capitis."],["B","Tinea corporis."],["C","Pityriasis versicolor."],["D","Tinea manuum."],["E","Tinea pedis."]],"a":"B","sa":null,"pg":null,"f":["Answer taken from key row; verify."],"n":196,"e":["A herald patch (a single annular scaly patch) mimics tinea corporis, so scraping with KOH distinguishes them. Why the other options are wrong: A) Tinea capitis: Capitis is scalp. C) Pityriasis versicolor: Versicolor is macular. D) Tinea manuum: Manuum is hands. E) Tinea pedis: Pedis is feet.","Herald patch ≈ tinea corporis."],"im":[],"src":"Q349"},{"id":"K197","ch":"⭐ Key Ideas — each idea once","q":"Typical distribution of the secondary eruption of pityriasis rosea is on","o":[["A","Trunk and proximal extremities."],["B","Face."],["C","Upper limbs."],["D","Lower limbs."],["E","Hands and feet."]],"a":"A","sa":null,"pg":null,"f":[],"n":197,"e":["The secondary eruption of smaller oval lesions appears on the trunk and proximal limbs in a Christmas-tree pattern along the ribs; face, palms and soles are spared. Why the other options are wrong: B) Face: Face is spared. C) Upper limbs: Upper limbs are spared distally. D) Lower limbs: Lower limbs are spared. E) Hands and feet: Hands and feet are spared.","Trunk and proximal limbs; spares face, palms, soles."],"im":[],"src":"Q350"},{"id":"K198","ch":"⭐ Key Ideas — each idea once","q":"What disorder is characterized by an initial herald patch, followed by scaly erythematous lesions on the trunk in a \"Christmas tree\" distribution?","o":[["A","Pityriasis rosea."],["B","Herpes simplex"],["C","Herpes zoster."],["D","Erysipelas."],["E","Molluscum contagiosum."]],"a":"A","sa":null,"pg":"63","f":[],"n":198,"e":["A herald patch followed by crops of scaly lesions on the trunk in a Christmas-tree pattern is pityriasis rosea. Why the other options are wrong: B) Herpes simplex: HSV is vesicular. C) Herpes zoster: Zoster is dermatomal. D) Erysipelas: Erysipelas is hot. E) Molluscum contagiosum: Molluscum is umbilicated.","Herald → Christmas tree."],"im":[],"src":"Q354"},{"id":"K199","ch":"⭐ Key Ideas — each idea once","q":"Herald patch is the primary lesion of","o":[["A","Psoriasis"],["B","Lichen planus"],["C","Pityriasis rosea"],["D","Atopic dermatitis"],["E","Scabies"]],"a":"C","sa":null,"pg":"63","f":[],"n":199,"e":["The herald patch is the first lesion of pityriasis rosea: a single 2-5 cm oval scaly lesion with a collarette of scales. Why the other options are wrong: A) Psoriasis: Psoriasis has plaques. B) Lichen planus: LP has papules. D) Atopic dermatitis: Atopic has flexural lesions. E) Scabies: Scabies has burrows.","Herald → PR."],"im":[],"src":"Q357"},{"id":"K200","ch":"⭐ Key Ideas — each idea once","q":"Treatment of pityriasis rosea includes","o":[["A","Isolation."],["B","Reassurance."],["C","Cytotoxic drugs."],["D","Intralesional steroids."],["E","Topical antibiotics."]],"a":"B","sa":null,"pg":"64","f":[],"n":200,"e":["Treatment is mainly reassurance that the eruption is non-infectious and self-limited, with emollients; no isolation or cytotoxic drugs are needed. Why the other options are wrong: A) Isolation: Not contagious. C) Cytotoxic drugs: Not needed. D) Intralesional steroids: Not needed. E) Topical antibiotics: It is not bacterial.","Reassure."],"im":[],"src":"Q358"},{"id":"K201","ch":"⭐ Key Ideas — each idea once","q":"Treatment of pityriasis rosea includes","o":[["A","Isolation"],["B","Topical antibiotics"],["C","Intralesional steroids"],["D","Topical steroids"],["E","Cytotoxic drugs"]],"a":"D","sa":null,"pg":"64","f":[],"n":201,"e":["Mild topical corticosteroids (and emollients) relieve itching in pityriasis rosea; antihistamines can be added. Why the other options are wrong: A) Isolation: Not contagious. B) Topical antibiotics: It is not bacterial. C) Intralesional steroids: Not needed. E) Cytotoxic drugs: Not needed.","Mild steroid for itch."],"im":[],"src":"Q359"},{"id":"K202","ch":"⭐ Key Ideas — each idea once","q":"Stippling means","o":[["A","Dilated capillaries."],["B","Dilated pilosebaceous orifices."],["C","Atrophy."],["D","Scarring."],["E","Telangiectasia."]],"a":"B","sa":null,"pg":"65","f":[],"n":202,"e":["Stippling is the appearance of dilated pilosebaceous orifices filled with keratin plugs, seen in DLE as follicular plugging. Why the other options are wrong: A) Dilated capillaries: That is telangiectasia. C) Atrophy: That is atrophy. D) Scarring: That is scarring. E) Telangiectasia: That is telangiectasia.","Stippling = DLE."],"im":[],"src":"Q361"},{"id":"K203","ch":"⭐ Key Ideas — each idea once","q":"The clinical picture of discoid lupus erythematosus is","o":[["A","Well-defined erythematous plaques covered with adherent scales."],["B","ill-defined erythematous plaques covered with adherent scales."],["C","ill-defined erythematous plaques covered with loose scales."],["D","Well-defined erythematous patches covered with adherent scales."],["E","Well-defined erythematous patches covered with loose scales."]],"a":"A","sa":null,"pg":"65","f":[],"n":203,"e":["DLE shows well-defined erythematous plaques covered with adherent scales, while the underlying orifices are dilated. Why the other options are wrong: B) ill-defined erythematous plaques covered…: It is well defined. C) ill-defined erythematous plaques covered…: It is well defined. D) Well-defined erythematous patches covere…: They are plaques. E) Well-defined erythematous patches covere…: They are plaques.","Adherent scales, well-defined."],"im":[],"src":"Q364"},{"id":"K204","ch":"⭐ Key Ideas — each idea once","q":"Scalp involvement is typical of the following dermatological disorder","o":[["A","Discoid lupus erythematosus"],["B","Scabies"],["C","Ecthyma."],["D","Pityriasis rosea."],["E","Erythrasma."]],"a":"A","sa":null,"pg":"65","f":[],"n":204,"e":["DLE typically involves the scalp and ends in permanent cicatricial alopecia. Why the other options are wrong: B) Scabies: Scabies spares the scalp. C) Ecthyma: Ecthyma is on legs. D) Pityriasis rosea: PR is truncal. E) Erythrasma: Erythrasma is in folds.","DLE scarring alopecia."],"im":[],"src":"Q366"},{"id":"K205","ch":"⭐ Key Ideas — each idea once","q":"All of the following are signs of discoid lupus erythematosus EXCEPT","o":[["A","Erythema."],["B","Telangiectasia."],["C","Stippling."],["D","Scarring."],["E","Pustulation."]],"a":"E","sa":null,"pg":"65","f":[],"n":205,"e":["Erythema, telangiectasia, stippling and scarring are DLE signs. Pustulation is not. Why the other options are wrong: A) Erythema: A sign. B) Telangiectasia: A sign. C) Stippling: A sign. D) Scarring: A sign.","No pustules."],"im":[],"src":"Q367"},{"id":"K206","ch":"⭐ Key Ideas — each idea once","q":"One of the cardinal signs of discoid lupus erythematosus is","o":[["A","Hypopigmentation"],["B","Comedones"],["C","Pustules"],["D","Ulcer formation"],["E","Telangiectasia"]],"a":"E","sa":null,"pg":"65","f":[],"n":206,"e":["Telangiectasia is one of the five cardinal signs of DLE: erythema, telangiectasia, scaling, stippling, scarring. Why the other options are wrong: A) Hypopigmentation: DLE leaves hypo and hyperpigmentation. B) Comedones: Comedones are acne. C) Pustules: Pustules are not seen. D) Ulcer formation: Ulcer is not cardinal.","5 cardinal signs."],"im":[],"src":"Q370"},{"id":"K207","ch":"⭐ Key Ideas — each idea once","q":"PUVA may be used in the treatment of all of the following EXCEPT","o":[["A","Psoriasis."],["B","Vitiligo."],["C","Discoid lupus erythematosus."],["D","Alopecia."],["E","Lichen planus."]],"a":"C","sa":null,"pg":"66","f":[],"n":207,"e":["DLE is photosensitive and UV light can worsen it, so PUVA is not used; PUVA is used for psoriasis, vitiligo and alopecia areata. Why the other options are wrong: A) Psoriasis: PUVA treats it. B) Vitiligo: PUVA treats it. D) Alopecia: PUVA treats AA. E) Lichen planus: PUVA treats LP.","Avoid UV in lupus."],"im":[],"src":"Q373"},{"id":"K208","ch":"⭐ Key Ideas — each idea once","q":"Discoid lupus erythematosus is best treated by","o":[["A","Topical antimalarials only."],["B","Topical antimalarials + systemic antimalarials."],["C","Topical antimalarials + topical steroids."],["D","Topical antimalarials + systemic steroids."],["E","Systemic antimalarials + topical steroids."]],"a":"E","sa":null,"pg":"66","f":[],"n":208,"e":["Extensive DLE is best treated with systemic antimalarials plus topical steroids, with sun avoidance. Why the other options are wrong: A) Topical antimalarials only: Antimalarials are oral, not topical. B) Topical antimalarials + systemic antimal…: There are no topical antimalarials; they are given orally. C) Topical antimalarials + topical steroids: There are no topical antimalarials; they are given orally. D) Topical antimalarials + systemic steroids: Antimalarials are oral and systemic steroids are not first-line.","Antimalarial + topical steroid."],"im":[],"src":"Q377"},{"id":"K209","ch":"⭐ Key Ideas — each idea once","q":"Onycholysis may be seen in:","o":[["A","Lichen planus."],["B","Psoriasis."],["C","Onychomycosis."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"37","f":[],"n":209,"e":["Onycholysis (separation of the nail plate from the nail bed) occurs in psoriasis, lichen planus and onychomycosis, so all of the above is correct. Why the other options are wrong: A) Lichen planus: Lichen planus affects the nails. True, but B and C also cause onycholysis. B) Psoriasis: Nail psoriasis causes onycholysis. True, but A and C also do. C) Onychomycosis: Onychomycosis causes onycholysis. True, but A and B also do. E) None of the above: Wrong: A, B and C all cause it.","Onycholysis: psoriasis, LP, fungal nails, also trauma and thyroid disease."],"im":[],"src":"Q543"},{"id":"K210","ch":"⭐ Key Ideas — each idea once","q":"Methotrexate is:","o":[["A","An H-1 antagonist."],["B","A dihydrofolate reductase inhibitor."],["C","An H-2 antagonist."],["D","A beta adrenergic blocker."],["E","All of the above."]],"a":"B","sa":null,"pg":"56","f":[],"n":210,"e":["Methotrexate is a folate antagonist that inhibits dihydrofolate reductase, so it blocks DNA synthesis in rapidly dividing cells and is used in extensive psoriasis. H1 and H2 antagonists are antihistamines and beta blockers are cardiac drugs. Why the other options are wrong: A) An H-1 antagonist: H1 antagonists are antihistamines. C) An H-2 antagonist: H2 antagonists block acid. D) A beta adrenergic blocker: Beta blockers are cardiac. E) All of the above: Wrong: not all listed statements are correct.","Methotrexate: DHFR inhibitor; liver and marrow toxicity, teratogenic."],"im":[],"src":"Q544"},{"id":"K211","ch":"⭐ Key Ideas — each idea once","q":"All of the following are types of lichen planus EXCEPT:","o":[["A","Actinic lichen planus."],["B","Pustular lichen planus."],["C","Annular lichen planus."],["D","Atrophic lichen planus."],["E","Hypertrophic lichen planus."]],"a":"B","sa":null,"pg":null,"f":[],"n":211,"e":["Types of LP include actinic, annular, atrophic and hypertrophic; there is no pustular LP. Why the other options are wrong: A) Actinic lichen planus: A type. C) Annular lichen planus: A type. D) Atrophic lichen planus: A type. E) Hypertrophic lichen planus: A type.","No pustular LP."],"im":[],"src":"H204"},{"id":"K212","ch":"⭐ Key Ideas — each idea once","q":"Discoid lupus erythematosus:","o":[["A","Usually occurs in semi-exposed areas."],["B","May be a manifestation of systemic lupus erythematosus."],["C","May end in cicatricial alopecia."],["D","Tropical antimalarials are very effective."],["E","May be confused with lichen planus."]],"a":"C","sa":null,"pg":null,"f":["More than one option is defensible (B and E are also true); the key is C."],"n":212,"e":["DLE of the scalp can end in cicatricial alopecia, and it improves with antimalarials but is not mainly at semi-exposed sites. Why the other options are wrong: A) Usually occurs in semi-exposed areas: DLE is sun-exposed. B) May be a manifestation of systemic lupus…: DLE can accompany SLE, so this is also arguable. D) Tropical antimalarials are very effective: There are no topical antimalarials. E) May be confused with lichen planus: It can resemble LP, so this is also arguable.","DLE scars."],"im":[],"src":"H227"},{"id":"K213","ch":"⭐ Key Ideas — each idea once","q":"In acute eczema, all of the following occurs EXCEPT","o":[["A","Erythema."],["B","Oozing."],["C","Lichenification."],["D","Vesicles."],["E","Crusting."]],"a":"C","sa":null,"pg":"67","f":[],"n":213,"e":["Acute eczema is the wet stage: erythema, edema, vesicles, oozing and crusting. Lichenification (thickened skin with accentuated lines) develops only after prolonged scratching, so it belongs to chronic eczema. Why the other options are wrong: A) Erythema: Occurs. B) Oozing: Occurs. D) Vesicles: Occurs. E) Crusting: Occurs.","Acute = vesicles/oozing; chronic = lichenification."],"im":[],"src":"Q379"},{"id":"K214","ch":"⭐ Key Ideas — each idea once","q":"Chronic eczema is characterized by one of the following","o":[["A","Erythema."],["B","Oozing."],["C","Lichenification."],["D","Vesicles."],["E","Pustules."]],"a":"C","sa":null,"pg":"67","f":[],"n":214,"e":["Chronic eczema results from prolonged, repeated attacks, giving lichenification, excoriations and pigment change. Erythema, oozing, vesicles and pustules are acute or infected features. Why the other options are wrong: A) Erythema: It occurs in acute. B) Oozing: Oozing is acute. D) Vesicles: Vesicles are acute. E) Pustules: Pustules are infection.","Chronic = lichenification."],"im":[],"src":"Q381"},{"id":"K215","ch":"⭐ Key Ideas — each idea once","q":"A 4-month-old infant had bilateral erythematous plaques with vesicles, oozing and crusts on both cheeks. The child was very irritable. The most probable diagnosis is","o":[["A","Allergic contact dermatitis."],["B","Primary irritant dermatitis."],["C","Atopic dermatitis."],["D","Impetigo contagiosum."],["E","Molluscum contagiosum."]],"a":"C","sa":null,"pg":"68","f":[],"n":215,"e":["A 4-month-old with bilateral cheek erythema, vesicles, oozing and crusts has the infantile phase of atopic dermatitis, which starts after 2 months and involves the face and extensor surfaces. Seborrheic dermatitis in infants appears earlier with greasy scales. Why the other options are wrong: A) Allergic contact dermatitis: Allergic is contact-related. B) Primary irritant dermatitis: Irritant needs exposure. D) Impetigo contagiosum: Impetigo is crusted. E) Molluscum contagiosum: Molluscum is umbilicated.","Infantile atopic: cheeks."],"im":[],"src":"Q383"},{"id":"K216","ch":"⭐ Key Ideas — each idea once","q":"A 6-year-old child presented with groups of itchy papules involving the flexures & sides of the neck. The most probable diagnosis is","o":[["A","Varicose eczema."],["B","Contact eczema."],["C","Atopic eczema."],["D","Stasis eczema."],["E","Seborrheic eczema."]],"a":"C","sa":null,"pg":"68","f":[],"n":216,"e":["Itchy papules on the flexures and neck sides of a child are the childhood phase of atopic dermatitis, which prefers antecubital and popliteal fossae. Why the other options are wrong: A) Varicose eczema: Varicose is legs. B) Contact eczema: Contact follows exposure. D) Stasis eczema: Stasis is legs. E) Seborrheic eczema: Seb derm is greasy.","Child: flexures."],"im":[],"src":"Q386"},{"id":"K217","ch":"⭐ Key Ideas — each idea once","q":"A male baby, 4 months old, presented with a reddish rash on his face. His mother reported that the baby was irritable and always crying. On examination, papules and vesicles were noted. (Clinical photo: infant with erythematous papulovesicular rash on the cheeks.) One of the following statements about this disease is true","o":[["A","Transmitted by direct contact."],["B","Diagnosed by patch test."],["C","Heals with a scar."],["D","Family history is usually positive."],["E","Treated by topical retinoids."]],"a":"D","sa":null,"pg":"67","f":[],"n":217,"e":["Atopic dermatitis is a hereditary predisposition; family history of asthma, rhinitis or dermatitis is positive in 50-70%. It is not contagious and does not scar. Why the other options are wrong: A) Transmitted by direct contact: Atopic dermatitis is not contagious; it is an inherited atopic disease. B) Diagnosed by patch test: Patch test is for contact. C) Heals with a scar: It heals without scar. E) Treated by topical retinoids: Retinoids treat acne and keratinization disorders; atopic dermatitis needs emollients, topical steroids or calcineurin inhibitors.","Family history positive."],"im":[],"src":"Q387"},{"id":"K218","ch":"⭐ Key Ideas — each idea once","q":"The following characterizes atopic eczema","o":[["A","Antiseptic lotions are used for lichenified lesions."],["B","In infants, lichenified lesions are common."],["C","In children, it is common on cheeks."],["D","In adults, it is common on flexor areas."],["E","Pruritus is absent."]],"a":"D","sa":null,"pg":"69","f":[],"n":218,"e":["In adults the lesions are like childhood ones with lichenification, common in flexures (flexor areas). Infants favor the face and extensors. Why the other options are wrong: A) Antiseptic lotions are used for lichenif…: Antiseptics are for oozing. B) In infants, lichenified lesions are common: Infants have vesicles. C) In children, it is common on cheeks: Children have flexures. E) Pruritus is absent: It is itchy.","Adult atopic: flexural, lichenified."],"im":[],"src":"Q388"},{"id":"K219","ch":"⭐ Key Ideas — each idea once","q":"A 9-year-old female has recurrent itchy papulo-vesicular lesions on the antecubital and popliteal fossae. Her mother gave a history that the child had similar lesions on the cheeks since she was one year old. The best treatment for this condition is","o":[["A","Terbinafine."],["B","Acyclovir."],["C","Dapsone."],["D","Topical steroids."],["E","Electrocautery."]],"a":"D","sa":null,"pg":"75","f":[],"n":219,"e":["Recurrent itchy papulovesicular lesions in the elbow and knee flexures, with facial lesions in infancy, are atopic dermatitis; topical corticosteroids (with moisturizers) are the treatment. Terbinafine, acyclovir and dapsone treat other conditions. Why the other options are wrong: A) Terbinafine: Terbinafine is antifungal. B) Acyclovir: Acyclovir is antiviral. C) Dapsone: Dapsone is for leprosy. E) Electrocautery: Cautery is for warts.","Moisturizer + topical steroid."],"im":[],"src":"Q390"},{"id":"K220","ch":"⭐ Key Ideas — each idea once","q":"Seborrheic dermatitis may be treated by","o":[["A","Olive oil in infantile scalp lesions."],["B","Topical antifungals."],["C","Topical steroids."],["D","Selenium sulphide."],["E","All of the above."]],"a":"E","sa":null,"pg":"75","f":[],"n":220,"e":["Seborrheic dermatitis (due to the yeast Malassezia) is treated with oils for infantile scalp crusts, topical antifungals, mild steroids and selenium sulfide shampoos, so all options apply. Why the other options are wrong: A) Olive oil in infantile scalp lesions: Olive oil softens infantile scalp scales (cradle cap). True, but B, C and D also help. B) Topical antifungals: Topical antifungals act on Malassezia. True, but A, C and D also help. C) Topical steroids: Topical steroids settle the inflammation. True, but A, B and D also help. D) Selenium sulphide: Selenium sulphide is antiseborrheic and antifungal. True, but A, B and C also help.","Oil, antifungal, steroid, selenium."],"im":[],"src":"Q391"},{"id":"K221","ch":"⭐ Key Ideas — each idea once","q":"Allergic contact dermatitis","o":[["A","Is an immunological reaction."],["B","Occurs in any individual soon after exposure."],["C","Can be caused by acids or alkalis."],["D","Can occur due to cumulative damage by mild irritants."],["E","Occurs in compulsive washers."]],"a":"A","sa":null,"pg":"72","f":[],"n":221,"e":["Allergic contact dermatitis is a delayed immunological reaction in sensitized individuals after exposure to an allergen. Irritant dermatitis, by contrast, is non-immunological. Why the other options are wrong: B) Occurs in any individual soon after expo…: It needs sensitization. C) Can be caused by acids or alkalis: That is irritant. D) Can occur due to cumulative damage by mi…: That is irritant. E) Occurs in compulsive washers: That is irritant.","Allergic = immune; irritant = direct damage."],"im":[],"src":"Q392"},{"id":"K222","ch":"⭐ Key Ideas — each idea once","q":"A 33-year-old man develops severely itchy vesicular lesions at the sites of contact with a leather belt. Lesions are confined to the waistband area. Patch testing is positive for nickel. The most likely diagnosis is","o":[["A","Seborrheic dermatitis."],["B","Allergic contact dermatitis."],["C","Atopic dermatitis."],["D","Stasis dermatitis."],["E","Angioedema."]],"a":"B","sa":null,"pg":"72","f":[],"n":222,"e":["Vesicles confined to the belt buckle area with a positive nickel patch test prove allergic contact dermatitis to nickel. Seborrheic, atopic and stasis dermatitis have different distributions. Why the other options are wrong: A) Seborrheic dermatitis: Seb derm is greasy. C) Atopic dermatitis: Atopic is flexural. D) Stasis dermatitis: Stasis is legs. E) Angioedema: Angioedema is deep swelling.","Nickel patch test +."],"im":[],"src":"Q394"},{"id":"K223","ch":"⭐ Key Ideas — each idea once","q":"A 17-year-old female presents with a pruritic rash localized to the wrist. Papules and vesicles are noted in a band-like pattern, with slight oozing from some lesions. Which of the following is the most likely cause of the rash?","o":[["A","Stasis dermatitis."],["B","Herpes zoster."],["C","Atopic dermatitis."],["D","Seborrheic dermatitis."],["E","Contact dermatitis."]],"a":"E","sa":null,"pg":"72","f":[],"n":223,"e":["A band-like rash on the wrist suggests contact with a watch or bracelet: contact dermatitis. Herpes zoster is dermatomal and stasis dermatitis occurs in the legs. Why the other options are wrong: A) Stasis dermatitis: Stasis is legs. B) Herpes zoster: Zoster is dermatomal. C) Atopic dermatitis: Atopic is flexural. D) Seborrheic dermatitis: Seb derm is greasy.","Band-like pattern = contact."],"im":[],"src":"Q395"},{"id":"K224","ch":"⭐ Key Ideas — each idea once","q":"A female patient, 21 years old, presented with a rash on the dorsa of both feet. Rash was severely itchy. (Clinical photo: erythematous eczematous rash on the dorsa of both feet at the sites of sandal straps.) What is the diagnosis of this case?","o":[["A","Irritant dermatitis."],["B","Papular urticaria."],["C","Stasis eczema."],["D","Neurodermatitis."],["E","Allergic dermatitis."]],"a":"E","sa":null,"pg":null,"f":[],"n":224,"e":["A rash at the area of contact with a shoe or ornament is allergic dermatitis, diagnosed by patch testing. Why the other options are wrong: A) Irritant dermatitis: Irritant needs exposure. B) Papular urticaria: Papular urticaria is bites. C) Stasis eczema: Stasis is leg. D) Neurodermatitis: Neurodermatitis is chronic.","Contact allergen."],"im":[],"src":"Q396"},{"id":"K225","ch":"⭐ Key Ideas — each idea once","q":"Patch test is useful for diagnosis of","o":[["A","Atopic dermatitis."],["B","Stasis dermatitis."],["C","Urticaria."],["D","Irritant contact dermatitis."],["E","Allergic contact dermatitis."]],"a":"E","sa":null,"pg":null,"f":[],"n":225,"e":["Patch testing detects type IV hypersensitivity, so it is used for allergic contact dermatitis (not for urticaria or atopic dermatitis). Why the other options are wrong: A) Atopic dermatitis: Atopic is clinical. B) Stasis dermatitis: Stasis is clinical. C) Urticaria: Urticaria uses prick tests. D) Irritant contact dermatitis: Irritant has no patch test.","Patch test = allergic contact."],"im":[],"src":"Q397"},{"id":"K226","ch":"⭐ Key Ideas — each idea once","q":"Acute oozing skin conditions are best treated by","o":[["A","Powders."],["B","Ointments."],["C","Creams."],["D","Drying lotions."],["E","Emulsions."]],"a":"D","sa":null,"pg":"75","f":[],"n":226,"e":["Weeping lesions are dried with drying antiseptic lotions (potassium permanganate, aluminum acetate). Ointments and creams would macerate the skin. Why the other options are wrong: A) Powders: Powders are for dry. B) Ointments: Ointments macerate. C) Creams: Creams macerate. E) Emulsions: Emulsions are for subacute.","Wet lesions: lotions; chronic dry lesions: ointments."],"im":[],"src":"Q398"},{"id":"K227","ch":"⭐ Key Ideas — each idea once","q":"An acute eruption of intensely itchy papules or wheals is called","o":[["A","Acne vulgaris."],["B","Pityriasis rosea."],["C","Psoriasis."],["D","Urticaria."],["E","Scabies."]],"a":"D","sa":null,"pg":"77","f":[],"n":227,"e":["Urticaria is an itchy eruption of raised wheals appearing suddenly; it is acute if shorter than 6 weeks. Why the other options are wrong: A) Acne vulgaris: Acne is not itchy. B) Pityriasis rosea: PR is scaly. C) Psoriasis: Psoriasis is scaly. E) Scabies: Scabies has burrows.","Wheals = urticaria."],"im":[],"src":"Q399"},{"id":"K228","ch":"⭐ Key Ideas — each idea once","q":"Scarring is NOT found in","o":[["A","Discoid lupus erythematosus."],["B","Favus."],["C","Acne vulgaris."],["D","Ecthyma."],["E","Urticaria."]],"a":"E","sa":null,"pg":"6","f":[],"n":228,"e":["Urticarial wheals are due to dermal edema that resolves without leaving a scar. Ecthyma, DLE and kerion can scar. Why the other options are wrong: A) Discoid lupus erythematosus: DLE scars. B) Favus: Favus scars. C) Acne vulgaris: Acne scars. D) Ecthyma: Ecthyma scars.","Urticaria: no scar."],"im":[],"src":"Q402"},{"id":"K229","ch":"⭐ Key Ideas — each idea once","q":"Angioedema can be life threatening as it causes","o":[["A","Arrhythmias."],["B","Renal failure."],["C","Retinopathy."],["D","Myalgia."],["E","Laryngeal edema."]],"a":"E","sa":null,"pg":"77","f":[],"n":229,"e":["Angioedema involves the deep dermis and hypodermis and can involve the larynx, causing airway obstruction. Why the other options are wrong: A) Arrhythmias: Angioedema is deep dermal/subcutaneous swelling; the danger is airway obstruction from laryngeal edema, not this. B) Renal failure: Angioedema is deep dermal/subcutaneous swelling; the danger is airway obstruction from laryngeal edema, not this. C) Retinopathy: Angioedema is deep dermal/subcutaneous swelling; the danger is airway obstruction from laryngeal edema, not this. D) Myalgia: Angioedema is deep dermal/subcutaneous swelling; the danger is airway obstruction from laryngeal edema, not this.","Laryngeal edema."],"im":[],"src":"Q404"},{"id":"K230","ch":"⭐ Key Ideas — each idea once","q":"Histamine is the main mediator of","o":[["A","Contact dermatitis."],["B","Urticaria."],["C","Atopic dermatitis."],["D","Psoriasis."],["E","Discoid lupus erythematosus."]],"a":"B","sa":null,"pg":"77","f":[],"n":230,"e":["Histamine released from mast cells is the principal mediator of urticaria, with prostaglandins and leukotrienes. Why the other options are wrong: A) Contact dermatitis: Contact is type IV. C) Atopic dermatitis: Atopic is IgE-related. D) Psoriasis: Psoriasis is T-cell. E) Discoid lupus erythematosus: DLE is autoimmune.","Histamine."],"im":[],"src":"Q408"},{"id":"K231","ch":"⭐ Key Ideas — each idea once","q":"Urticaria is","o":[["A","Type I hypersensitivity reaction."],["B","Type II hypersensitivity reaction."],["C","Type III hypersensitivity reaction."],["D","Type IV hypersensitivity reaction."],["E","None of the above."]],"a":"A","sa":null,"pg":"77","f":[],"n":231,"e":["Urticaria is a type I (IgE-mediated) hypersensitivity, although cholinergic types act through acetylcholine-stimulated mast cells. Why the other options are wrong: B) Type II hypersensitivity reaction: Type II is cytotoxic. C) Type III hypersensitivity reaction: Type III is immune complex. D) Type IV hypersensitivity reaction: Type IV is delayed. E) None of the above: Wrong: at least one listed statement is correct.","Type I; allergic contact is type IV."],"im":[],"src":"Q409"},{"id":"K232","ch":"⭐ Key Ideas — each idea once","q":"The primary effector cell in urticaria pathogenesis is the","o":[["A","Keratinocyte."],["B","Neutrophil."],["C","Mast cell."],["D","Melanocyte."],["E","Langerhans cell."]],"a":"C","sa":null,"pg":null,"f":[],"n":232,"e":["The mast cell is the primary effector cell: IgE bound to mast cells triggers degranulation on re-exposure. Why the other options are wrong: A) Keratinocyte: Keratinocytes are structural. B) Neutrophil: Neutrophils are not primary. D) Melanocyte: Melanocytes make pigment. E) Langerhans cell: Langerhans cells present antigen.","Mast cell."],"im":[],"src":"Q410"},{"id":"K233","ch":"⭐ Key Ideas — each idea once","q":"Pathogenesis of urticaria is through","o":[["A","Vasoconstriction of blood vessels."],["B","Exaggerated cell-mediated immune response."],["C","Plasma cell activation."],["D","IgD-mediated allergic reaction."],["E","Increased capillary permeability."]],"a":"E","sa":null,"pg":"77","f":[],"n":233,"e":["Mediators such as histamine increase capillary permeability, producing dermal edema (wheal). Vasoconstriction is not involved. Why the other options are wrong: A) Vasoconstriction of blood vessels: It is vasodilatation. B) Exaggerated cell-mediated immune response: It is not cell-mediated. C) Plasma cell activation: Plasma cells are not involved. D) IgD-mediated allergic reaction: IgE, not IgD.","Permeability ↑, vasodilatation."],"im":[],"src":"Q411"},{"id":"K234","ch":"⭐ Key Ideas — each idea once","q":"Which of the following is TRUE about urticaria?","o":[["A","In the ordinary type, the main mediator is acetylcholine."],["B","It involves skin and mucous membranes."],["C","Adrenaline is the treatment of the papular type."],["D","Wheal is caused by vasoconstriction."],["E","In cholinergic urticaria, the mediator is cholestyramine."]],"a":"B","sa":null,"pg":"77","f":[],"n":234,"e":["Urticaria can affect skin and mucous membranes (e.g. lips, oral mucosa). Adrenaline is for severe cases, not the papular type, and acetylcholine mediates only cholinergic urticaria. Why the other options are wrong: A) In the ordinary type, the main mediator…: Histamine is the mediator. C) Adrenaline is the treatment of the papul…: Adrenaline is for angioedema. D) Wheal is caused by vasoconstriction: It is vasodilatation. E) In cholinergic urticaria, the mediator i…: Cholestyramine is not the mediator.","Skin + mucosa."],"im":[],"src":"Q412"},{"id":"K235","ch":"⭐ Key Ideas — each idea once","q":"Physical urticaria includes all of the following EXCEPT","o":[["A","Solar urticaria."],["B","Papular urticaria."],["C","Pressure urticaria."],["D","Heat urticaria."],["E","None of the above."]],"a":"B","sa":null,"pg":"78","f":[],"n":235,"e":["Physical urticaria (solar, cold, heat, aquagenic, dermographism, pressure) is provoked by physical stimuli. Papular urticaria is a hypersensitivity to insect bites. Why the other options are wrong: A) Solar urticaria: Physical. C) Pressure urticaria: Physical. D) Heat urticaria: Physical. E) None of the above: Wrong: at least one listed statement is correct.","Papular urticaria ≠ physical."],"im":[],"src":"Q413"},{"id":"K236","ch":"⭐ Key Ideas — each idea once","q":"Cholinergic urticaria is induced by which of the following precipitating factors","o":[["A","Foods as fish, milk, eggs or strawberries."],["B","Drugs as salicylates, antibiotics or NSAIDs."],["C","Blood elements."],["D","Insect bites."],["E","Sweating, physical effort, psychological stress or increased environmental temperature."]],"a":"E","sa":null,"pg":"79","f":[],"n":236,"e":["Cholinergic urticaria follows sweating from physical effort, emotional stress or heat; acetylcholine stimulates mast cells, giving 1-3 mm wheals lasting less than an hour. Why the other options are wrong: A) Foods as fish, milk, eggs or strawberries: Foods cause ordinary urticaria. B) Drugs as salicylates, antibiotics or NSA…: Drugs cause ordinary urticaria. C) Blood elements: Blood elements cause other types. D) Insect bites: Bites cause papular.","Small wheals with sweating."],"im":[],"src":"Q415"},{"id":"K237","ch":"⭐ Key Ideas — each idea once","q":"The mainstay of treatment of urticaria is","o":[["A","Topical corticosteroids."],["B","Topical antihistamines."],["C","Oral antihistamines."],["D","Oral erythromycin."],["E","Emollients and moisturizers."]],"a":"C","sa":null,"pg":"79","f":[],"n":237,"e":["Systemic antihistamines are the mainstay; topical agents and erythromycin do not control wheals. Why the other options are wrong: A) Topical corticosteroids: Topical steroids do not help. B) Topical antihistamines: Topical antihistamines are weak. D) Oral erythromycin: Erythromycin is antibacterial. E) Emollients and moisturizers: Emollients do not help.","Oral antihistamine."],"im":[],"src":"Q417"},{"id":"K238","ch":"⭐ Key Ideas — each idea once","q":"Systemic treatment of urticaria includes","o":[["A","Corticosteroids."],["B","Antihistamines."],["C","Adrenaline."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"79","f":[],"n":238,"e":["Systemic options are antihistamines (mainstay), corticosteroids for short courses, and adrenaline in emergencies, so all of the above. Why the other options are wrong: A) Corticosteroids: Corticosteroids are used in severe acute urticaria. True, but B and C are also used. B) Antihistamines: Antihistamines are first-line. True, but A and C are also used. C) Adrenaline: Adrenaline is used in acute severe urticaria or angioedema. True, but A and B are also used. E) None of the above: Wrong: A, B and C are all used.","All."],"im":[],"src":"Q419"},{"id":"K239","ch":"⭐ Key Ideas — each idea once","q":"Which of the following is TRUE about urticaria?","o":[["A","It is treated by intravenous corticosteroids in severe cases."],["B","It is a type II hypersensitivity reaction."],["C","Acetylcholine is the mediator of the papular type."],["D","Cholinergic type may be caused by intestinal parasites."],["E","Intravenous adrenaline is life saving."]],"a":"A","sa":null,"pg":"79","f":[],"n":239,"e":["Severe urticaria and angioedema may need IV antihistamines and IV corticosteroids. Why the other options are wrong: B) It is a type II hypersensitivity reaction: It is type I. C) Acetylcholine is the mediator of the pap…: Acetylcholine is cholinergic. D) Cholinergic type may be caused by intest…: Parasites cause other types. E) Intravenous adrenaline is life saving: Intravenous adrenaline is risky.","IV steroids severe."],"im":[],"src":"Q420"},{"id":"K240","ch":"⭐ Key Ideas — each idea once","q":"The following therapy is a life-saving measure in laryngeal angioedema","o":[["A","IV adrenaline."],["B","SC adrenaline."],["C","IV corticosteroids."],["D","IM corticosteroids."],["E","Antihistamines."]],"a":"B","sa":null,"pg":null,"f":[],"n":240,"e":["In laryngeal angioedema SC (or IM) adrenaline rapidly reverses airway edema, while antihistamines alone are slower. Why the other options are wrong: A) IV adrenaline: IV adrenaline is risky. C) IV corticosteroids: Steroids are slow. D) IM corticosteroids: Steroids are slow. E) Antihistamines: Antihistamines are slow.","Adrenaline first."],"im":[],"src":"Q422"},{"id":"K241","ch":"⭐ Key Ideas — each idea once","q":"A 25-year-old female presented with puffiness of both eyes and lips with difficulty in breathing. The following is a proper life-saving treatment for her","o":[["A","0.5 ml 1/100 adrenaline IV."],["B","0.5 ml 1/1000 adrenaline SC."],["C","1,000,000 IU penicillin IV."],["D","5 ml adrenaline 1/100 solution SC."],["E","Calamine lotion compresses on involved sites."]],"a":"B","sa":null,"pg":"79","f":[],"n":241,"e":["Eyelid and lip swelling with breathing difficulty is angioedema, an emergency; give adrenaline 0.5 ml of 1/1000 SC (300-500 mcg). Why the other options are wrong: A) 0.5 ml 1/100 adrenaline IV: IV and 1/100 is dangerous. C) 1,000,000 IU penicillin IV: Penicillin is unrelated. D) 5 ml adrenaline 1/100 solution SC: 5 ml of 1/100 is a lethal dose. E) Calamine lotion compresses on involved s…: Calamine is symptomatic.","Adrenaline 0.5 ml 1/1000."],"im":[],"src":"Q424"},{"id":"K242","ch":"⭐ Key Ideas — each idea once","q":"All the following drugs may be used in treatment of angioedema except","o":[["A","Corticosteroids."],["B","Adrenaline."],["C","Hydroxyzine."],["D","Salicylate."],["E","Chlorpheniramine maleate."]],"a":"D","sa":null,"pg":"79","f":[],"n":242,"e":["Corticosteroids, adrenaline and antihistamines (hydroxyzine, chlorpheniramine) are used. Salicylates (aspirin) can actually trigger urticaria/angioedema. Why the other options are wrong: A) Corticosteroids: Corticosteroids are used in severe cases. B) Adrenaline: Adrenaline is used for laryngeal edema. C) Hydroxyzine: Hydroxyzine is a sedating antihistamine. E) Chlorpheniramine maleate: Chlorpheniramine is an antihistamine.","Avoid aspirin/NSAIDs."],"im":[],"src":"Q425"},{"id":"K243","ch":"⭐ Key Ideas — each idea once","q":"Cutaneous drug reactions may present with the following EXCEPT","o":[["A","Acneform eruption."],["B","Lichenoid eruption."],["C","Neuralgia."],["D","Bullous eruption."],["E","Erythroderma."]],"a":"C","sa":null,"pg":"80","f":[],"n":243,"e":["Drug eruptions may appear as exanthematous, urticarial, acneiform, lichenoid, bullous or erythrodermic reactions. Neuralgia is not a cutaneous reaction. Why the other options are wrong: A) Acneform eruption: Occurs. B) Lichenoid eruption: Occurs. D) Bullous eruption: Occurs. E) Erythroderma: Occurs.","Neuralgia not a rash."],"im":[],"src":"Q426"},{"id":"K244","ch":"⭐ Key Ideas — each idea once","q":"Drug eruptions may be","o":[["A","Eczematous."],["B","Acneiform."],["C","Pigmented."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"80","f":[],"n":244,"e":["Drugs can cause eczematous, acneiform and pigmented eruptions as well as urticarial and fixed reactions. Why the other options are wrong: A) Eczematous: Eczematous drug eruptions occur. True, but B and C occur too. B) Acneiform: Acneiform drug eruptions occur. True, but A and C occur too. C) Pigmented: Fixed drug eruption leaves pigmentation. True, but A and B occur too. E) None of the above: Wrong: all three occur.","Many patterns."],"im":[],"src":"Q427"},{"id":"K245","ch":"⭐ Key Ideas — each idea once","q":"Exanthematous drug reaction presents by","o":[["A","Papules on an erythematous background."],["B","Vesicles and bullae."],["C","Wheals."],["D","Pustules."],["E","Violaceous macules and patches."]],"a":"A","sa":null,"pg":"80","f":[],"n":245,"e":["Exanthematous reactions produce papules on an erythematous background that start proximally and generalize in 1-2 days, with marked pruritus. Why the other options are wrong: B) Vesicles and bullae: That is bullous. C) Wheals: That is urticarial. D) Pustules: That is pustular. E) Violaceous macules and patches: That is FDE.","Morbilliform."],"im":[],"src":"Q428"},{"id":"K246","ch":"⭐ Key Ideas — each idea once","q":"Acneform drug eruption is commonly caused by which of the following drug?","o":[["A","Analgesics."],["B","Corticosteroids."],["C","Tetracyclines."],["D","Penicillins."],["E","Erythromycin."]],"a":"B","sa":null,"pg":"81","f":[],"n":246,"e":["Corticosteroids and anti-epileptics cause acneiform eruptions, which lack comedones. Tetracyclines treat acne. Why the other options are wrong: A) Analgesics: Analgesics are not typical. C) Tetracyclines: Tetracyclines treat acne. D) Penicillins: Penicillins cause rash. E) Erythromycin: Erythromycin treats acne.","Steroid acne: no comedones."],"im":[],"src":"Q429"},{"id":"K247","ch":"⭐ Key Ideas — each idea once","q":"A 20-year-old male patient had fever and a sore throat for which he received sulphamethoxazole- trimethoprim. The next day, he developed a violaceous macule on his lip. The most probable diagnosis is","o":[["A","Herpes simplex."],["B","Lichen planus."],["C","Discoid lupus erythematosus."],["D","Fixed drug eruption."],["E","Impetigo."]],"a":"D","sa":null,"pg":"81","f":[],"n":247,"e":["A violaceous lip macule after sulfonamide (trimethoprim-sulfamethoxazole) is a fixed drug eruption, which characteristically involves the lips and genitalia. Why the other options are wrong: A) Herpes simplex: HSV is vesicular. B) Lichen planus: LP is violaceous. C) Discoid lupus erythematosus: DLE is scaly. E) Impetigo: Impetigo is crusted.","Lips + sulfa."],"im":[],"src":"Q430"},{"id":"K248","ch":"⭐ Key Ideas — each idea once","q":"27-year-old male develops a vesicobullous lesion on the glans soon after taking oral tetracycline. The lesion healed with hyperpigmentation. The diagnosis is","o":[["A","Herpes progenitalis."],["B","Fixed drug eruption."],["C","Genital warts."],["D","Genital molluscum."],["E","Chlamydia infection."]],"a":"B","sa":null,"pg":"81","f":[],"n":248,"e":["A vesiculobullous glans lesion after tetracycline that heals with hyperpigmentation is a fixed drug eruption, not herpes (which recurs without drug and with grouped vesicles). Why the other options are wrong: A) Herpes progenitalis: Herpes recurs without drug. C) Genital warts: Warts are rough. D) Genital molluscum: Molluscum is umbilicated. E) Chlamydia infection: Chlamydia is not a rash.","Genitals; leaves pigmentation."],"im":[],"src":"Q431"},{"id":"K249","ch":"⭐ Key Ideas — each idea once","q":"Fixed drug eruption is named so because it is","o":[["A","Fixed to site."],["B","Fixed to site and drug."],["C","Fixed to drug."],["D","Fixed to duration."],["E","Fixed to season."]],"a":"B","sa":null,"pg":"81","f":[],"n":249,"e":["It recurs at the same site each time the same (or related) drug is taken, so it is fixed to site and drug. Why the other options are wrong: A) Fixed to site: It is also fixed to drug. C) Fixed to drug: It is also fixed to site. D) Fixed to duration: It is not time-bound. E) Fixed to season: It is not seasonal.","Fixed to site and drug."],"im":[],"src":"Q432"},{"id":"K250","ch":"⭐ Key Ideas — each idea once","q":"Fixed drug eruption is treated by","o":[["A","Topical corticosteroid."],["B","Topical terbinafine."],["C","Systemic acyclovir."],["D","Systemic cyclosporin."],["E","IVIGs."]],"a":"A","sa":null,"pg":"82","f":[],"n":250,"e":["Management is to stop the offending drug; potent topical corticosteroid and antihistamines relieve the lesion. Why the other options are wrong: B) Topical terbinafine: Terbinafine is antifungal. C) Systemic acyclovir: Acyclovir is antiviral. D) Systemic cyclosporin: Cyclosporin is excessive. E) IVIGs: IVIG is for TEN.","Stop the drug."],"im":[],"src":"Q433"},{"id":"K251","ch":"⭐ Key Ideas — each idea once","q":"The commonest viral infection involved in the etiology of erythema multiforme is","o":[["A","Human papilloma virus."],["B","Herpes simplex."],["C","Cytomegalovirus."],["D","Varicella Zoster virus."],["E","Epstein Barr virus."]],"a":"B","sa":null,"pg":"82","f":[],"n":251,"e":["Herpes simplex virus is the most common trigger of erythema multiforme, followed by drugs and other infections. Why the other options are wrong: A) Human papilloma virus: HPV is not involved. C) Cytomegalovirus: CMV is not common. D) Varicella Zoster virus: VZV is not common. E) Epstein Barr virus: EBV is not common.","HSV."],"im":[],"src":"Q435"},{"id":"K252","ch":"⭐ Key Ideas — each idea once","q":"Target lesions are classic of","o":[["A","Atopic dermatitis."],["B","Seborrheic dermatitis."],["C","Erythema multiforme."],["D","Fixed drug eruption."],["E","Alopecia areata."]],"a":"C","sa":null,"pg":"82","f":[],"n":252,"e":["Target (iris) lesions are classic of erythema multiforme: three concentric zones, with a dark center, pink ring and red outer ring. Why the other options are wrong: A) Atopic dermatitis: Atopic is flexural. B) Seborrheic dermatitis: Seb derm is greasy. D) Fixed drug eruption: FDE is a patch. E) Alopecia areata: AA is smooth.","Target = EM."],"im":[],"src":"Q436"},{"id":"K253","ch":"⭐ Key Ideas — each idea once","q":"Patch test is done to document:","o":[["A","Type I hypersensitivity."],["B","Delayed type hypersensitivity."],["C","Autoimmune disease."],["D","Immune complex deposition."],["E","Antigen antibody reaction."]],"a":"B","sa":null,"pg":"73","f":[],"n":253,"e":["A patch test documents delayed (type IV) hypersensitivity, as in allergic contact dermatitis, by applying suspected allergens under occlusion and reading at 48-72 hours. Type I hypersensitivity is tested with prick tests. Why the other options are wrong: A) Type I hypersensitivity: Type I uses prick tests. C) Autoimmune disease: Autoimmune needs serology. D) Immune complex deposition: Immune complex needs biopsy. E) Antigen antibody reaction: Antigen-antibody is type I-III.","Patch test = type IV; prick test = type I."],"im":[],"src":"Q546"},{"id":"K254","ch":"⭐ Key Ideas — each idea once","q":"Allergic contact dermatitis is which type of hypersensitivity reaction?","o":[["A","Type I."],["B","Type II."],["C","Type III."],["D","Type IV."],["E","Type V."]],"a":"D","sa":null,"pg":null,"f":[],"n":254,"e":["Allergic contact dermatitis is a delayed type IV (T-cell mediated) hypersensitivity, unlike urticaria (type I). Why the other options are wrong: A) Type I: Type I is immediate. B) Type II: Type II is cytotoxic. C) Type III: Type III is immune complex. E) Type V: Type V is not classic.","Type IV."],"im":[],"src":"H232"},{"id":"K255","ch":"⭐ Key Ideas — each idea once","q":"The immunoglobulin which is usually elevated in atopics is:","o":[["A","Ig G."],["B","Ig M."],["C","Ig E."],["D","Ig D."],["E","All of the above."]],"a":"C","sa":null,"pg":null,"f":[],"n":255,"e":["IgE is typically elevated in atopic individuals (atopic dermatitis, asthma, rhinitis). Why the other options are wrong: A) Ig G: IgG is not specific. B) Ig M: IgM is not specific. D) Ig D: IgD is not specific. E) All of the above: Only IgE.","IgE."],"im":[],"src":"H256"},{"id":"K256","ch":"⭐ Key Ideas — each idea once","q":"Erythema multiforme may be precipitated by:","o":[["A","Herpes simplex infection."],["B","Drugs."],["C","Internal malignancy."],["D","Pregnancy."],["E","All of the above."]],"a":"E","sa":null,"pg":null,"f":[],"n":256,"e":["EM may be triggered by herpes simplex, drugs, internal malignancy and pregnancy, so all of the above. Why the other options are wrong: A) Herpes simplex infection: HSV is the commonest trigger of erythema multiforme. True, but others also trigger it. B) Drugs: Drugs trigger it. True, but others also do. C) Internal malignancy: Internal malignancy triggers it. True, but others also do. D) Pregnancy: Pregnancy triggers it. True, but others also do.","HSV most common."],"im":[],"src":"H279"},{"id":"K257","ch":"⭐ Key Ideas — each idea once","q":"Absence of pigment in the skin is called","o":[["A","Alopecia areata."],["B","Vitiligo."],["C","Psoriasis."],["D","Discoid lupus erythematosus."],["E","Pityriasis rosea."]],"a":"B","sa":null,"pg":"85","f":[],"n":257,"e":["Vitiligo is an acquired depigmenting disorder: well-circumscribed milky-white macules/patches in which the pigment is completely lost. It is different from hypopigmentation, where some pigment remains. Why the other options are wrong: A) Alopecia areata: Alopecia areata is hair loss. C) Psoriasis: Psoriasis is scaly. D) Discoid lupus erythematosus: DLE is atrophic scarring. E) Pityriasis rosea: PR has herald patch.","Complete loss of pigment = vitiligo."],"im":[],"src":"Q438"},{"id":"K258","ch":"⭐ Key Ideas — each idea once","q":"The primary lesion of vitiligo is a milky white","o":[["A","Plaque."],["B","Scaly patch."],["C","Wheal."],["D","Papule."],["E","Macule."]],"a":"E","sa":null,"pg":"85","f":[],"n":258,"e":["The primary lesion is a well-circumscribed milky-white macule (a patch if larger than 1 cm), often with convex borders and white hairs. Why the other options are wrong: A) Plaque: It is not elevated. B) Scaly patch: Vitiligo patches are smooth, milky white and non-scaly; scale suggests pityriasis versicolor or alba. C) Wheal: A wheal is transient urticarial edema, not a depigmented lesion. D) Papule: A papule is raised; vitiligo lesions are flat (macules/patches).","Macule/patch."],"im":[],"src":"Q441"},{"id":"K259","ch":"⭐ Key Ideas — each idea once","q":"The main complaint in vitiligo is","o":[["A","Itching."],["B","Pain."],["C","Discoloration."],["D","Loss of sensation."],["E","Burning sensation."]],"a":"C","sa":null,"pg":"85","f":[],"n":259,"e":["Vitiligo is asymptomatic: no itching, pain or burning. The complaint is the cosmetic discoloration and its psychological impact. Why the other options are wrong: A) Itching: It is asymptomatic. B) Pain: It is not painful. D) Loss of sensation: Sensation is normal. E) Burning sensation: It does not burn.","Cosmetic complaint only."],"im":[],"src":"Q442"},{"id":"K260","ch":"⭐ Key Ideas — each idea once","q":"Pruritus is a cardinal symptom in all of the following EXCEPT","o":[["A","Scabies."],["B","Urticaria."],["C","Atopic dermatitis."],["D","Lichen planus."],["E","Vitiligo."]],"a":"E","sa":null,"pg":"85","f":[],"n":260,"e":["Pruritus is the cardinal symptom of scabies, eczema or lichen planus, but vitiligo is asymptomatic. Why the other options are wrong: A) Scabies: Itchy. B) Urticaria: Itchy. C) Atopic dermatitis: Itchy. D) Lichen planus: Itchy.","Vitiligo: no itch."],"im":[],"src":"Q444"},{"id":"K261","ch":"⭐ Key Ideas — each idea once","q":"As regards vitiligo, all of the following are false EXCEPT","o":[["A","Itching is a prominent symptom."],["B","It is not heritable."],["C","Scalp may be affected."],["D","Family history is positive in all cases."],["E","Milky white papules are seen."]],"a":"C","sa":null,"pg":"85","f":[],"n":261,"e":["Of the listed statements only 'scalp may be affected' is true. Vitiligo is not usually itchy and is partly heritable, it does not have milky papules, and family history is not positive in all cases. Why the other options are wrong: A) Itching is a prominent symptom: It is not itchy. B) It is not heritable: Genetic predisposition is part of the pathogenesis, and many patients have affected relatives. D) Family history is positive in all cases: Only some patients have a family history; predisposition does not mean every case is familial. E) Milky white papules are seen: The lesions are macules.","Scalp/white hairs can be involved."],"im":[],"src":"Q445"},{"id":"K262","ch":"⭐ Key Ideas — each idea once","q":"Vitiligo as an autoimmune disease may be associated with","o":[["A","Thyroid disease."],["B","Impetigo."],["C","Herpes zoster."],["D","Eczema."],["E","Pityriasis rosea."]],"a":"A","sa":null,"pg":"85","f":[],"n":262,"e":["Generalized vitiligo is autoimmune, so it is associated with autoimmune thyroid disease, alopecia areata, type 1 diabetes, myasthenia gravis, lupus and rheumatoid arthritis. Impetigo, zoster, eczema and pityriasis rosea are unrelated. Why the other options are wrong: B) Impetigo: Impetigo is unrelated. C) Herpes zoster: Zoster is unrelated. D) Eczema: Eczema is not autoimmune. E) Pityriasis rosea: PR is unrelated.","Thyroid disease."],"im":[],"src":"Q446"},{"id":"K263","ch":"⭐ Key Ideas — each idea once","q":"Vitiligo is caused by","o":[["A","Hyperproliferation of melanocytes."],["B","Excess melanin synthesis."],["C","Fungal infection."],["D","Autoimmune destruction of melanocytes."],["E","Viral infection."]],"a":"D","sa":null,"pg":"86","f":[],"n":263,"e":["Vitiligo results from autoimmune destruction of melanocytes, not overproduction or proliferation of them. Why the other options are wrong: A) Hyperproliferation of melanocytes: Melanocytes are lost. B) Excess melanin synthesis: Pigment is lost. C) Fungal infection: Fungal infection causes pityriasis versicolor (fine-scaly macules), not vitiligo. E) Viral infection: No viral cause; vitiligo is autoimmune, with cytotoxic T cells destroying melanocytes.","Autoimmune."],"im":[],"src":"Q449"},{"id":"K264","ch":"⭐ Key Ideas — each idea once","q":"In vitiligo, melanocytes are","o":[["A","Absent."],["B","Malformed."],["C","Non-functioning."],["D","Hyperactive."],["E","Enlarged."]],"a":"A","sa":null,"pg":"86","f":[],"n":264,"e":["Biopsy of a vitiligo patch shows complete absence of melanocytes, whereas in hypopigmentation they are present but less active. Why the other options are wrong: B) Malformed: They are absent. C) Non-functioning: They are absent. D) Hyperactive: They are absent. E) Enlarged: They are absent.","Absent."],"im":[],"src":"Q451"},{"id":"K265","ch":"⭐ Key Ideas — each idea once","q":"Clinical types of vitiligo include","o":[["A","Focal type."],["B","Segmental type."],["C","Acrofacial vitiligo."],["D","Universal type."],["E","All of the above."]],"a":"E","sa":null,"pg":"86","f":[],"n":265,"e":["Clinical types include localized (focal, segmental, mucosal) and generalized (vulgaris, acrofacial, universal), so all of the above. Why the other options are wrong: A) Focal type: Focal: one area for at least 2 years, not segmental. True, but other types exist too. B) Segmental type: Segmental: unilateral, dermatomal, does not cross the midline. Also true. C) Acrofacial vitiligo: Acrofacial: face and distal extremities. Also true. D) Universal type: Universal: complete or nearly complete depigmentation. Also true.","Localized vs generalized."],"im":[],"src":"Q454"},{"id":"K266","ch":"⭐ Key Ideas — each idea once","q":"A male patient, 33 years old, presented with white patches on his chest and both upper limbs. The condition started when he was 27 years old with a gradual onset and a progressive course. (Clinical photo: extensive depigmented white patches on the back.) Which of the following can be used in its treatment?","o":[["A","Radiotherapy."],["B","Systemic antibiotics."],["C","Topical retinoids."],["D","Narrowband UVB."],["E","Systemic antifungals."]],"a":"D","sa":null,"pg":"89","f":[],"n":266,"e":["Narrow-band UVB is the standard phototherapy for generalized vitiligo, which helps repigmentation. Why the other options are wrong: A) Radiotherapy: Radiotherapy has no role here; vitiligo is treated by stopping the autoimmune process and stimulating repigmentation (phototherapy, steroids, calcineurin inhibitors). B) Systemic antibiotics: Vitiligo is autoimmune, not bacterial, so antibiotics do nothing. C) Topical retinoids: Retinoids treat acne and keratinization disorders; they do not repigment vitiligo. E) Systemic antifungals: Vitiligo is autoimmune, not fungal (do not confuse it with pityriasis versicolor), so antifungals do nothing.","NB-UVB."],"im":[],"src":"Q457"},{"id":"K267","ch":"⭐ Key Ideas — each idea once","q":"One of the following is used in treatment of vitiligo","o":[["A","Radiotherapy."],["B","Topical calcineurin inhibitors."],["C","Systemic antibiotics."],["D","Systemic antifungals."]],"a":"B","sa":null,"pg":"89","f":[],"n":267,"e":["Topical calcineurin inhibitors (tacrolimus, pimecrolimus) stop the autoimmune process locally and are used especially on face and neck. Why the other options are wrong: A) Radiotherapy: Radiotherapy has no role here; vitiligo is treated by stopping the autoimmune process and stimulating repigmentation (phototherapy, steroids, calcineurin inhibitors). C) Systemic antibiotics: Vitiligo is autoimmune, not bacterial, so antibiotics do nothing. D) Systemic antifungals: Vitiligo is autoimmune, not fungal (do not confuse it with pityriasis versicolor), so antifungals do nothing.","Tacrolimus."],"im":[],"src":"Q458"},{"id":"K268","ch":"⭐ Key Ideas — each idea once","q":"The following drug could be used topically for treatment of vitiligo","o":[["A","Terbinafine."],["B","Azelaic acid 20%."],["C","Steroid."],["D","Crude coal tar."],["E","Permethrin lotion 5%."]],"a":"C","sa":null,"pg":"89","f":[],"n":268,"e":["Topical corticosteroids are used for stabilization and repigmentation in localized vitiligo. Terbinafine and permethrin are anti-infective agents. Why the other options are wrong: A) Terbinafine: Terbinafine is antifungal. B) Azelaic acid 20%: Azelaic acid is for acne. D) Crude coal tar: Coal tar is for psoriasis. E) Permethrin lotion 5%: Permethrin is for scabies.","Topical steroids."],"im":[],"src":"Q459"},{"id":"K269","ch":"⭐ Key Ideas — each idea once","q":"Vitiligo in a patient with hepatic failure can be treated by","o":[["A","Topical psoralen with ultraviolet A."],["B","Topical steroids."],["C","Ultraviolet B."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"89","f":[],"n":269,"e":["In hepatic failure oral drugs are avoided, so topical PUVA, topical steroids or UVB can all be used, i.e. all of the above. Why the other options are wrong: A) Topical psoralen with ultraviolet A: Topical PUVA acts on localized lesions without the liver metabolism of oral psoralen, so it is usable. B) Topical steroids: Topical steroids have little systemic absorption and stabilize the disease. C) Ultraviolet B: UVB acts on the skin locally, with no hepatic metabolism. E) None of the above: Wrong: A, B and C are all usable.","Topical/light-based treatments."],"im":[],"src":"Q460"},{"id":"K270","ch":"⭐ Key Ideas — each idea once","q":"Vitiligo may be confused with:","o":[["A","Pityriasis alba."],["B","Leprosy."],["C","Pityriasis versicolor."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":270,"e":["Vitiligo can be confused with pityriasis alba, leprosy (hypopigmented patches) and pityriasis versicolor; the history of total pigment loss and absent sensory loss helps. Why the other options are wrong: A) Pityriasis alba: Pityriasis alba: ill-defined hypopigmented (not depigmented) scaly patches, mostly in children. B) Leprosy: Leprosy: hypopigmented anesthetic patch (vitiligo has normal sensation). C) Pityriasis versicolor: Pityriasis versicolor: hypopigmented fine-scaly macules with yellow fluorescence. E) None of the above: Wrong: all three can mimic vitiligo.","All of the above."],"im":[],"src":"H340"},{"id":"K271","ch":"⭐ Key Ideas — each idea once","q":"Hair loss is permanent and irreversible in","o":[["A","Cicatricial alopecia."],["B","Androgenetic alopecia."],["C","Telogen effluvium."],["D","Anagen effluvium."],["E","Alopecia areata."]],"a":"A","sa":null,"pg":"90","f":[],"n":271,"e":["In cicatricial alopecia the follicle is destroyed and replaced by scar tissue, so hair loss is permanent. Non-scarring types (androgenetic alopecia, telogen/anagen effluvium, alopecia areata) are reversible, at least in principle. Why the other options are wrong: B) Androgenetic alopecia: AGA is non-scarring. C) Telogen effluvium: TE is reversible. D) Anagen effluvium: Anagen effluvium is reversible. E) Alopecia areata: AA can regrow.","Scar = permanent."],"im":[],"src":"Q462"},{"id":"K272","ch":"⭐ Key Ideas — each idea once","q":"Scarring alopecia may be due to","o":[["A","Discoid LE."],["B","Lichen planus."],["C","Favus."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"90","f":[],"n":272,"e":["Scarring alopecia arises from trauma, burns, fungal infections (kerion, favus), zoster, DLE and lichen planus, so all of the above. Why the other options are wrong: A) Discoid LE: DLE scars. True, but B and C also scar. B) Lichen planus: Lichen planopilaris scars. True, but A and C also scar. C) Favus: Favus scars. True, but A and B also scar. E) None of the above: Wrong: all three scar.","Many causes."],"im":[],"src":"Q468"},{"id":"K273","ch":"⭐ Key Ideas — each idea once","q":"Cicatricial alopecia is caused by all of the following diseases EXCEPT","o":[["A","Lichen planus."],["B","Trauma."],["C","Favus."],["D","Systemic lupus erythematosus."],["E","Kerion."]],"a":"D","sa":null,"pg":"90","f":[],"n":273,"e":["DLE, lichen planus, trauma, favus and kerion scar the scalp. The key lists SLE as the exception because it usually causes non-scarring diffuse hair loss. Why the other options are wrong: A) Lichen planus: It scars. B) Trauma: It scars. C) Favus: It scars. E) Kerion: It scars.","DLE ≠ SLE."],"im":[],"src":"Q469"},{"id":"K274","ch":"⭐ Key Ideas — each idea once","q":"Which of the following diseases can cause non-cicatricial alopecia?","o":[["A","Herpes zoster."],["B","Telogen effluvium."],["C","Favus."],["D","Basal cell carcinoma."],["E","Mechanical trauma."]],"a":"B","sa":null,"pg":"92","f":[],"n":274,"e":["Telogen effluvium (premature shift to telogen) causes diffuse reversible shedding without follicle destruction. Why the other options are wrong: A) Herpes zoster: Zoster can scar. C) Favus: Favus scars. D) Basal cell carcinoma: BCC destroys follicles. E) Mechanical trauma: Trauma can scar.","Reversible."],"im":[],"src":"Q472"},{"id":"K275","ch":"⭐ Key Ideas — each idea once","q":"A female patient, 36 years old, presented with hair loss of 5 years duration with a gradual onset and a progressive course. She also complained of skin lesions on the face and ears that, on examination, were well-defined erythematous plaques covered with adherent scales as well as telangiectasia. (Clinical photo: scalp with scarring alopecia and atrophic depigmented and hyperpigmented patches.) What is the cause of this condition?","o":[["A","Toxicity of anagen hairs."],["B","Lymphocyte infiltrates around hair follicles."],["C","Activity of 5-alpha reductase enzyme in hair follicles."],["D","Destruction of hair follicles."],["E","Premature transformation of hair follicles into telogen phase."]],"a":"D","sa":null,"pg":"90","f":[],"n":275,"e":["In cicatricial alopecia the follicles themselves are destroyed (by inflammation, trauma or infection) and replaced by fibrous tissue. Why the other options are wrong: A) Toxicity of anagen hairs: That is anagen effluvium. B) Lymphocyte infiltrates around hair folli…: That is AA. C) Activity of 5-alpha reductase enzyme in…: That is AGA. E) Premature transformation of hair follicl…: That is TE.","Follicle destruction."],"im":[],"src":"Q474"},{"id":"K276","ch":"⭐ Key Ideas — each idea once","q":"A male patient, 27 years old, presented with hair loss of five-year duration with a gradual onset and a progressive course. It began by frontal and bitemporal recession, and then it involved the vertex. (Clinical photo: male scalp with frontal/bitemporal recession and vertex thinning.) This patient is presenting with","o":[["A","Telogen effluvium."],["B","Anagen effluvium."],["C","Androgenetic alopecia."],["D","Cicatricial alopecia."],["E","Alopecia areata."]],"a":"C","sa":null,"pg":"91","f":[],"n":276,"e":["Hair thinning in a characteristic pattern (frontal and bitemporal recession then vertex in males) is androgenetic alopecia. Why the other options are wrong: A) Telogen effluvium: TE is diffuse. B) Anagen effluvium: Anagen effluvium is acute. D) Cicatricial alopecia: Scarring is localized. E) Alopecia areata: AA is patchy.","AGA pattern."],"im":[],"src":"Q475"},{"id":"K277","ch":"⭐ Key Ideas — each idea once","q":"Which of the following is TRUE about androgenetic alopecia?","o":[["A","It is a genetically determined cicatricial type of alopecia."],["B","Oral antiandrogens are used for treatment of male androgenetic alopecia."],["C","Minoxidil 2% is used in treatment of male (not female) androgenetic alopecia."],["D","Finasteride is contraindicated in male androgenetic alopecia."],["E","It is due to increased activity of 5-alpha reductase in target follicles."]],"a":"E","sa":null,"pg":"91","f":[],"n":277,"e":["AGA is genetically determined and non-cicatricial, caused by increased 5-alpha reductase activity in target follicles. Why the other options are wrong: A) It is a genetically determined cicatrici…: AGA is non-scarring. B) Oral antiandrogens are used for treatmen…: Antiandrogens feminize males. C) Minoxidil 2% is used in treatment of mal…: Minoxidil is used in both sexes. D) Finasteride is contraindicated in male a…: Finasteride is used.","5-AR ↑."],"im":[],"src":"Q477"},{"id":"K278","ch":"⭐ Key Ideas — each idea once","q":"Diffuse hair loss involving the vertex of the scalp with maintenance of the frontal hairline is","o":[["A","Alopecia areata."],["B","Anagen effluvium."],["C","Male pattern baldness."],["D","Female pattern baldness."],["E","Telogen effluvium."]],"a":"D","sa":null,"pg":"91","f":[],"n":278,"e":["Female pattern hair loss involves the vertex with preservation of the frontal hairline; in males it begins with frontal and bitemporal recession. Why the other options are wrong: A) Alopecia areata: AA is patchy. B) Anagen effluvium: Anagen effluvium is acute. C) Male pattern baldness: Male is frontal and bitemporal. E) Telogen effluvium: TE is diffuse.","Female: vertex with intact frontal line."],"im":[],"src":"Q478"},{"id":"K279","ch":"⭐ Key Ideas — each idea once","q":"Androgenetic alopecia in males can be treated by","o":[["A","Estrogens."],["B","Cyproterone acetate."],["C","Spironolactone."],["D","Topical minoxidil."],["E","Corticosteroids."]],"a":"D","sa":null,"pg":"92","f":[],"n":279,"e":["Topical minoxidil 2-5% and 5-alpha reductase inhibitors (finasteride) are used in males; antiandrogens and estrogens are not. Why the other options are wrong: A) Estrogens: Estrogens feminize. B) Cyproterone acetate: Cyproterone feminizes. C) Spironolactone: Spironolactone feminizes. E) Corticosteroids: Steroids do not help.","Minoxidil, finasteride."],"im":[],"src":"Q479"},{"id":"K280","ch":"⭐ Key Ideas — each idea once","q":"Androgenetic alopecia can be treated by all of the following EXCEPT","o":[["A","Finasteride."],["B","Cyproterone acetate."],["C","Spironolactone."],["D","Topical minoxidil."],["E","Corticosteroids."]],"a":"E","sa":null,"pg":"92","f":[],"n":280,"e":["AGA is treated with minoxidil, finasteride, spironolactone (females) and transplantation. Corticosteroids have no role. Why the other options are wrong: A) Finasteride: Finasteride is a 5-alpha reductase inhibitor. B) Cyproterone acetate: Cyproterone acetate is an antiandrogen. C) Spironolactone: Spironolactone has antiandrogen action. D) Topical minoxidil: Topical minoxidil prolongs anagen.","No steroids."],"im":[],"src":"Q480"},{"id":"K281","ch":"⭐ Key Ideas — each idea once","q":"A female patient presents with diffuse alopecia. She had suffered from typhoid fever 4 months back. The most probable diagnosis is","o":[["A","Androgenetic alopecia."],["B","Telogen effluvium."],["C","Anagen effluvium."],["D","Alopecia areata."],["E","Trichotillomania."]],"a":"B","sa":null,"pg":"92","f":[],"n":281,"e":["Diffuse alopecia appearing about 3-4 months after typhoid fever is telogen effluvium after a stressful (febrile) illness. Why the other options are wrong: A) Androgenetic alopecia: AGA is gradual. C) Anagen effluvium: Anagen effluvium follows toxins. D) Alopecia areata: AA is patchy. E) Trichotillomania: Trichotillomania is self-pulling.","3-4 months after the trigger."],"im":[],"src":"Q482"},{"id":"K282","ch":"⭐ Key Ideas — each idea once","q":"A woman reports diffuse hair shedding three months after childbirth with a normal scalp. The diagnosis is","o":[["A","Telogen effluvium."],["B","Alopecia areata."],["C","Androgenetic alopecia."],["D","Ophiasis."],["E","Anagen effluvium."]],"a":"A","sa":null,"pg":"93","f":[],"n":282,"e":["Postpartum diffuse shedding with a normal scalp 3 months after childbirth is classic telogen effluvium. Why the other options are wrong: B) Alopecia areata: AA is patchy. C) Androgenetic alopecia: AGA is gradual. D) Ophiasis: Ophiasis is marginal. E) Anagen effluvium: Anagen effluvium follows toxins.","Postpartum."],"im":[],"src":"Q483"},{"id":"K283","ch":"⭐ Key Ideas — each idea once","q":"Anagen effluvium is caused by","o":[["A","High fever."],["B","Surgical interventions."],["C","General anesthesia."],["D","Weight loss."],["E","Cytotoxic chemotherapy."]],"a":"E","sa":null,"pg":"93","f":[],"n":283,"e":["Cytotoxic chemotherapy, heavy metals, radiation and drugs like methotrexate poison actively growing anagen follicles, causing anagen effluvium. Fever and surgery cause telogen effluvium. Why the other options are wrong: A) High fever: Fever causes telogen effluvium. B) Surgical interventions: Surgery causes telogen effluvium. C) General anesthesia: Anesthesia causes telogen effluvium. D) Weight loss: Weight loss causes telogen effluvium.","Chemo = anagen effluvium."],"im":[],"src":"Q484"},{"id":"K284","ch":"⭐ Key Ideas — each idea once","q":"A patient presented with hair loss of gradual onset and a rapidly progressive course, which started after receiving 2 chemotherapy sessions for lymphoma. (Clinical photo: scalp with diffuse sparse hair.) What is the cause of this disease?","o":[["A","Toxicity of anagen hairs."],["B","Lymphocyte infiltrates around hair follicles."],["C","Activity of 5-alpha reductase enzyme in hair follicles."],["D","Destruction of hair follicles."],["E","Premature transformation of hair follicles into telogen phase."]],"a":"A","sa":null,"pg":"93","f":[],"n":284,"e":["Anagen effluvium is caused by toxic injury to actively growing anagen follicles, e.g. chemotherapy, heavy metals and radiation. Why the other options are wrong: B) Lymphocyte infiltrates around hair folli…: That is AA. C) Activity of 5-alpha reductase enzyme in…: That is AGA. D) Destruction of hair follicles: That is scarring. E) Premature transformation of hair follicl…: That is TE.","Toxic."],"im":[],"src":"Q486"},{"id":"K285","ch":"⭐ Key Ideas — each idea once","q":"Which of the following is considered an autoimmune disease?","o":[["A","Scaly ringworm."],["B","Androgenetic alopecia."],["C","Alopecia areata."],["D","Favus."],["E","Kerion."]],"a":"C","sa":null,"pg":"93","f":[],"n":285,"e":["Alopecia areata is an autoimmune disease against anagen follicles. Androgenetic alopecia is hormonal and fungal infections (kerion, favus, scaly ringworm) are infectious. Why the other options are wrong: A) Scaly ringworm: Fungal. B) Androgenetic alopecia: Hormonal. D) Favus: Fungal. E) Kerion: Fungal.","AA autoimmune."],"im":[],"src":"Q487"},{"id":"K286","ch":"⭐ Key Ideas — each idea once","q":"A male patient, 27 years old, presented with several circumscribed areas of hair loss of one-year duration. He received several topical treatments to which he initially responded, but hair loss started again once he stopped treatment. On examination, scalp skin was completely normal with no scales or erythema. (Clinical photo: scalp with multiple well-circumscribed smooth patches of hair loss.) This patient is presenting with","o":[["A","Androgenetic alopecia."],["B","Telogen effluvium."],["C","Anagen effluvium."],["D","Cicatricial alopecia."],["E","Alopecia areata."]],"a":"E","sa":null,"pg":"93","f":[],"n":286,"e":["Circumscribed round patches of hair loss in normal-looking skin are alopecia areata. Why the other options are wrong: A) Androgenetic alopecia: AGA is patterned. B) Telogen effluvium: TE is diffuse. C) Anagen effluvium: Anagen effluvium is toxic. D) Cicatricial alopecia: Scarring is atrophic.","Patches, smooth."],"im":[],"src":"Q488"},{"id":"K287","ch":"⭐ Key Ideas — each idea once","q":"Clinical types of alopecia areata include all of the following EXCEPT","o":[["A","Patchy type."],["B","Marginal type."],["C","Mucocutaneous type."],["D","Alopecia totalis."],["E","Alopecia universalis."]],"a":"C","sa":null,"pg":"94","f":[],"n":287,"e":["Types are patchy, ophiasis, totalis and universalis; there is no mucocutaneous type. Why the other options are wrong: A) Patchy type: Patchy: one or more round bald patches. B) Marginal type: Marginal (ophiasis): loss along the scalp margins. D) Alopecia totalis: Totalis: total scalp hair loss. E) Alopecia universalis: Universalis: loss of all body hair.","No mucocutaneous."],"im":[],"src":"Q493"},{"id":"K288","ch":"⭐ Key Ideas — each idea once","q":"Marginal alopecia of the scalp is called","o":[["A","Alopecia totalis."],["B","Alopecia universalis."],["C","Ophiasis."],["D","Telogen effluvium."]],"a":"C","sa":null,"pg":"94","f":[],"n":288,"e":["Ophiasis is alopecia areata along the scalp margins. Why the other options are wrong: A) Alopecia totalis: Totalis is total scalp. B) Alopecia universalis: Universalis is total body. D) Telogen effluvium: TE is diffuse.","Ophiasis."],"im":[],"src":"Q495"},{"id":"K289","ch":"⭐ Key Ideas — each idea once","q":"Alopecia areata along the scalp margins is named ___ and it is ___ (regarding response to treatment).","o":[],"a":null,"sa":"Ophiasis; usually resistant to therapy","pg":null,"f":[],"n":289,"e":["Ophiasis is a band-like loss along the scalp margins and usually resists treatment.","Poor response."],"im":[],"src":"Q496"},{"id":"K290","ch":"⭐ Key Ideas — each idea once","q":"Alopecia totalis is","o":[["A","Localised loss of hair."],["B","Loss of the scalp and body hair."],["C","Loss of frontal scalp hair."],["D","Loss of all scalp hair."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":290,"e":["Alopecia totalis is loss of all scalp hair; loss of all body hair is alopecia universalis. Why the other options are wrong: A) Localised loss of hair: That is patchy. B) Loss of the scalp and body hair: That is universalis. C) Loss of frontal scalp hair: That is not totalis. E) None of the above: Wrong: at least one listed statement is correct.","Totalis = scalp; universalis = body."],"im":[],"src":"Q497"},{"id":"K291","ch":"⭐ Key Ideas — each idea once","q":"Alopecia areata may be treated by","o":[["A","Corticosteroids."],["B","Tincture iodine."],["C","PUVA."],["D","Minoxidil."],["E","All of the above."]],"a":"E","sa":null,"pg":"95","f":[],"n":291,"e":["Alopecia areata responds to corticosteroids, irritants like tincture iodine, PUVA and minoxidil, so all of the above. Why the other options are wrong: A) Corticosteroids: Corticosteroids (topical or intralesional) are used. True, but B, C and D are also used. B) Tincture iodine: Tincture iodine is a topical irritant used. True, but A, C and D are also used. C) PUVA: PUVA is used. True, but A, B and D are also used. D) Minoxidil: Minoxidil is used. True, but A, B and C are also used.","Several options."],"im":[],"src":"Q499"},{"id":"K292","ch":"⭐ Key Ideas — each idea once","q":"The following may be observed in alopecia areata:","o":[["A","Itching."],["B","Comedones."],["C","Vesicles."],["D","Adherent scales."],["E","Exclamation mark hairs."]],"a":"E","sa":null,"pg":null,"f":[],"n":292,"e":["Exclamation-mark hairs, short broken hairs tapering toward the scalp, are seen at the border of alopecia areata patches. Itching, comedones, vesicles and adherent scales are not features. Why the other options are wrong: A) Itching: AA is not itchy. B) Comedones: Not seen in alopecia areata (comedones = acne, vesicles = viral/eczema); the scalp skin is smooth. C) Vesicles: Not seen in alopecia areata (comedones = acne, vesicles = viral/eczema); the scalp skin is smooth. D) Adherent scales: AA is non-scaly.","Exclamation hairs = AA."],"im":[],"src":"H292"},{"id":"K293","ch":"⭐ Key Ideas — each idea once","q":"Which of the following is true about acne vulgaris?","o":[["A","It is an infectious disease."],["B","Lesions include comedones, papules, vesicles and nodulocysts."],["C","Chronic inflammation of the pilosebaceous unit."],["D","There is colonization of pilosebaceous units by Streptococcus acnes."]],"a":"C","sa":null,"pg":"96","f":[],"n":293,"e":["Chronic inflammation of the pilosebaceous unit with retained keratinocytes blocking the follicle is the correct description. Why the other options are wrong: A) It is an infectious disease: Acne is multifactorial (keratinization, sebum, Cutibacterium acnes); the bacterium is a skin commensal, not a contagious infection. B) Lesions include comedones, papules, vesi…: Acne lesions are comedones, papules, pustules, nodules and cysts; vesicles belong to viral or eczematous diseases. D) There is colonization of pilosebaceous u…: The organism in the pilosebaceous unit is Cutibacterium acnes, not streptococcus.","Not infectious."],"im":[],"src":"Q506"},{"id":"K294","ch":"⭐ Key Ideas — each idea once","q":"Acne vulgaris:","o":[["A","May affect palms and soles."],["B","Is a disease of sweat glands."],["C","Commonly affects the scalp."],["D","Is a disease of adolescents."],["E","Causes itching which increases by night."]],"a":"D","sa":null,"pg":"96","f":[],"n":294,"e":["Acne vulgaris peaks in adolescence under androgen influence, although it may start or persist in adulthood. It does not affect palms and soles (no pilosebaceous units). Why the other options are wrong: A) May affect palms and soles: Palms and soles lack follicles. B) Is a disease of sweat glands: It is pilosebaceous. C) Commonly affects the scalp: The face is common. E) Causes itching which increases by night: It is not itchy.","Adolescents."],"im":[],"src":"Q509"},{"id":"K295","ch":"⭐ Key Ideas — each idea once","q":"Which of the following statements about acne vulgaris is INCORRECT?","o":[["A","It is a disease of adolescence."],["B","Primary lesion is a comedone."],["C","Severe forms can be treated by systemic retinoids."],["D","It is a disease of the pilosebaceous unit."],["E","It is best treated by topical steroids."]],"a":"E","sa":null,"pg":"99","f":[],"n":295,"e":["Topical steroids worsen or cause acneiform eruptions, so 'best treated by topical steroids' is wrong. Retinoids, benzoyl peroxide and antibiotics are used. Why the other options are wrong: A) It is a disease of adolescence: The peak incidence is in adolescence. B) Primary lesion is a comedone: The comedone is the primary lesion (non-inflammatory keratinous impaction). C) Severe forms can be treated by systemic …: Se
