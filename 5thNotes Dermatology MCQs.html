ted with steroids. B) Radiotherapy: Radiotherapy has no role in post-scabietic nodules. C) Electrocautery: Cautery is not used. D) Podophyllin resin: Podophyllin is for warts.","Intralesional steroid."],"im":[]},{"id":"Q273","ch":"Parasitic Infestations","q":"Post-scabietic nodules","o":[["A","Never cause itching"],["B","Are usually located on the back"],["C","Are best treated by antibiotics"],["D","All of the above"],["E","None of the above"]],"a":"E","sa":null,"pg":"44","f":[],"n":18,"e":["The proposed statements are incorrect; they represent a hypersensitivity reaction, common on the scrotum and itchy. Why the other options are wrong: A) Never cause itching: They itch. B) Are usually located on the back: They are on the scrotum. C) Are best treated by antibiotics: Post-scabietic nodules are a hypersensitivity reaction to mite antigens, not bacterial. D) All of the above: Wrong: not all of the statements are correct.","Nodules ≠ parasites."],"im":[]},{"id":"Q274","ch":"Parasitic Infestations","q":"Post-scabietic nodules","o":[["A","Represent a hypersensitivity reaction to parasites"],["B","Present commonly on the scrotum"],["C","Cause severe itching"],["D","All of the above"],["E","None of the above"]],"a":"D","sa":null,"pg":"44","f":[],"n":19,"e":["Post-scabietic nodules are a hypersensitivity reaction, common on the scrotum, and itchy; all of the above. Why the other options are wrong: A) Represent a hypersensitivity reaction to…: Nodules are a hypersensitivity reaction to mite antigens. True, but B and C are also true. B) Present commonly on the scrotum: Nodules are commonly on the scrotum. True, but A and C are also true. C) Cause severe itching: Nodules are intensely itchy. True, but A and B are also true. E) None of the above: Wrong: A, B and C are all true.","Hypersensitivity."],"im":[]},{"id":"Q275","ch":"Parasitic Infestations","q":"Animal scabies is characterized by all of the following EXCEPT","o":[["A","Short incubation period"],["B","Absence of burrows"],["C","Being self-limited"],["D","Transmitted from human to human"],["E","Urticarial lesions"]],"a":"D","sa":null,"pg":"45","f":[],"n":20,"e":["Animal scabies is not transmitted from human to human (so there is no burrow), has a short incubation, and is self-limiting once the animal is avoided. Why the other options are wrong: A) Short incubation period: Animal scabies appears quickly after contact with the animal (short incubation). B) Absence of burrows: Animal mites cannot burrow or reproduce in human skin, so there are no burrows. C) Being self-limited: It resolves spontaneously once contact with the animal stops. E) Urticarial lesions: Lesions are itchy urticarial papules at the contact sites.","Not human-to-human."],"im":[]},{"id":"Q276","ch":"Parasitic Infestations","q":"Animal scabies is characterized by","o":[["A","Absence of burrows"],["B","Being self-limited and of short duration"],["C","Being more extensive"],["D","All of the above"]],"a":"D","sa":null,"pg":"45","f":[],"n":21,"e":["Animal scabies has a short incubation, no burrows, is self-limited and urticarial. Why the other options are wrong: A) Absence of burrows: Animal mites do not burrow in human skin. True, but B and C are true too. B) Being self-limited and of short duration: It resolves quickly once contact with the animal stops. True, but A and C are true too. C) Being more extensive: It is less extensive.","Pet scabies."],"im":[]},{"id":"Q277","ch":"Parasitic Infestations","q":"As regards treatment of human scabies","o":[["A","Oral antihelminthics are the treatment of choice"],["B","Gamma benzene hexachloride is a safe topical preparation"],["C","Permethrin is safe in pregnancy"],["D","Topical benzoyl peroxide may be used in treatment"],["E","Crotamiton is the most effective topical application"]],"a":"C","sa":null,"pg":"46","f":[],"n":22,"e":["Permethrin 5% is safe in pregnancy, breast-feeding and infants over 2 months, whereas gamma-hexachlorocyclohexane is contraindicated and oral antihelminthics are not first line. Why the other options are wrong: A) Oral antihelminthics are the treatment o…: Antihelminthics kill intestinal worms, not the scabies mite; permethrin 5% is the first-line scabicide. B) Gamma benzene hexachloride is a safe top…: GBHC is not safe. D) Topical benzoyl peroxide may be used in …: BPO is for acne. E) Crotamiton is the most effective topical…: Permethrin is more effective.","Permethrin safe."],"im":[]},{"id":"Q278","ch":"Parasitic Infestations","q":"As regards treatment of scabies","o":[["A","Oral antihelminthics are the treatment of choice"],["B","Gamma benzene hexachloride is a safe topical preparation"],["C","All family members should be treated"],["D","Topical benzoyl peroxide may be used in treatment"],["E","Crotamiton is the most effective topical application"]],"a":"C","sa":null,"pg":"45","f":[],"n":23,"e":["Treatment should include the patient and all close contacts, even if they have no itching, because early cases may be asymptomatic carriers. Why the other options are wrong: A) Oral antihelminthics are the treatment o…: Antihelminthics kill intestinal worms, not the scabies mite; permethrin 5% is the first-line scabicide. B) Gamma benzene hexachloride is a safe top…: GBHC is not safe. D) Topical benzoyl peroxide may be used in …: BPO is for acne. E) Crotamiton is the most effective topical…: Permethrin is more effective.","Treat contacts."],"im":[]},{"id":"Q279","ch":"Parasitic Infestations","q":"A young man presented with intense nocturnal itching. Examination revealed papules and burrows in finger webs, wrists and genital area. The following is a therapeutic topical option:","o":[["A","Steroid"],["B","Calcipotriol"],["C","Benzoyl peroxide 2.5-10%"],["D","Terbinafine"],["E","Permethrin 5%"]],"a":"E","sa":null,"pg":"46","f":[],"n":24,"e":["Nocturnal itch with burrows in finger webs is scabies treated with permethrin 5%. Why the other options are wrong: A) Steroid: Steroid worsens. B) Calcipotriol: Calcipotriol is for psoriasis. C) Benzoyl peroxide 2.5-10%: BPO is for acne. D) Terbinafine: Terbinafine is antifungal.","Permethrin 5%."],"im":[]},{"id":"Q280","ch":"Parasitic Infestations","q":"The following is used for the treatment of scabies","o":[["A","Benzyl benzoate"],["B","Benzoyl peroxide"],["C","Dapsone"],["D","Tetracyclines"],["E","Psoralen"]],"a":"A","sa":null,"pg":"46","f":[],"n":25,"e":["Benzyl benzoate (10-25%) is an acaricide used for scabies, along with permethrin, sulphur, crotamiton and ivermectin. Why the other options are wrong: B) Benzoyl peroxide: BPO is for acne. C) Dapsone: Dapsone is for leprosy. D) Tetracyclines: Tetracyclines are antibacterial. E) Psoralen: Psoralen is PUVA.","Benzyl benzoate."],"im":[]},{"id":"Q281","ch":"Parasitic Infestations","q":"All the following are used in the treatment of scabies EXCEPT:","o":[["A","Sulphur precipitate 5-10%"],["B","Permethrin 5%"],["C","Benzoyl peroxide 2.5-10%"],["D","Crotamiton 10%"],["E","Benzyl benzoate 25%"]],"a":"C","sa":null,"pg":"46","f":[],"n":26,"e":["Scabies is treated by sulphur, permethrin, crotamiton, benzyl benzoate or ivermectin; benzoyl peroxide is an acne drug. Why the other options are wrong: A) Sulphur precipitate 5-10%: Sulphur precipitate 5-10% is a traditional scabicide. B) Permethrin 5%: Permethrin 5% is the first-line topical scabicide (and a pediculicide). D) Crotamiton 10%: Crotamiton 10% is a scabicide that also relieves itching. E) Benzyl benzoate 25%: Benzyl benzoate 25% is a scabicide (irritant, diluted for children).","BPO = acne."],"im":[]},{"id":"Q282","ch":"Parasitic Infestations","q":"Pediculosis capitis is an example of","o":[["A","Cutaneous viral infection"],["B","Cutaneous fungal infection"],["C","Cutaneous bacterial infection"],["D","Cutaneous parasitic infection"],["E","Cutaneous mycobacterial infection"]],"a":"D","sa":null,"pg":"47","f":[],"n":27,"e":["Pediculosis capitis is a cutaneous parasitic infestation by Pediculus humanus capitis, a blood-sucking louse. Why the other options are wrong: A) Cutaneous viral infection: Viral skin infections are warts, herpes and molluscum; lice are arthropods. B) Cutaneous fungal infection: Fungal skin infections are tinea and candidiasis; lice are arthropods. C) Cutaneous bacterial infection: Bacterial skin infections are impetigo, folliculitis and cellulitis; lice are arthropods. E) Cutaneous mycobacterial infection: Mycobacterial skin infections are leprosy and cutaneous TB; lice are arthropods.","Lice = parasitic."],"im":[]},{"id":"Q283","ch":"Parasitic Infestations","q":"Pediculosis capitis","o":[["A","Is transmitted by hats"],["B","Is treated by acyclovir"],["C","Does not present with pruritus"],["D","Can affect the pubic area"],["E","None of the above"]],"a":"A","sa":null,"pg":"48","f":[],"n":28,"e":["Head lice spread by head-to-head contact and indirectly via combs, brushes, hats and helmets. Why the other options are wrong: B) Is treated by acyclovir: Acyclovir is antiviral. C) Does not present with pruritus: It is itchy. D) Can affect the pubic area: That is pubic lice. E) None of the above: Wrong: at least one of the listed statements is correct.","Hats."],"im":[]},{"id":"Q284","ch":"Parasitic Infestations","q":"Mother of a 9-year-old girl complains of severe itching of her daughter's scalp for two weeks. On examination, firmly attached white flakes were observed. Her younger sister has the same condition. (Clinical photo: scalp hair with lice and nits.) The most likely diagnosis is","o":[["A","Seborrheic dermatitis"],["B","Tinea capitis"],["C","Pediculosis capitis"],["D","Favus"],["E","Alopecia areata"]],"a":"C","sa":null,"pg":"49","f":[],"n":29,"e":["Itchy scalp with excoriations, adult lice and nits firmly attached to hairs is pediculosis capitis. Why the other options are wrong: A) Seborrheic dermatitis: Seb derm has greasy scale. B) Tinea capitis: Tinea has hair loss. D) Favus: Favus has scutula. E) Alopecia areata: AA is smooth.","Nits on hair."],"im":[]},{"id":"Q285","ch":"Parasitic Infestations","q":"The following is characteristic of pediculosis capitis","o":[["A","White patches"],["B","Flat-topped papules"],["C","Nocturnal itching"],["D","Nits cemented to the hairs"],["E","Painful nodules"]],"a":"D","sa":null,"pg":"49","f":[],"n":30,"e":["Nits are eggs cemented to the hair shaft near the scalp, which distinguishes them from dandruff; this is characteristic of head lice. Why the other options are wrong: A) White patches: White patches are vitiligo. B) Flat-topped papules: Flat papules are LP. C) Nocturnal itching: Nocturnal itch is scabies. E) Painful nodules: Pediculosis gives itchy papules and excoriations, not painful nodules; the diagnostic sign is nits cemented to the hairs.","Cemented nits."],"im":[]},{"id":"Q286","ch":"Parasitic Infestations","q":"Pediculosis capitis is treated by topical:","o":[["A","Acyclovir"],["B","Corticosteroids"],["C","Retinoids"],["D","Permethrin"],["E","Azoles"]],"a":"D","sa":null,"pg":"51","f":[],"n":31,"e":["Pediculosis capitis is treated with topical permethrin 5% (or malathion, dimethicone), repeated after a week since eggs are not killed. Why the other options are wrong: A) Acyclovir: Acyclovir is antiviral. B) Corticosteroids: Steroids do not kill lice. C) Retinoids: Retinoids are for acne. E) Azoles: Azoles are antifungal.","Permethrin."],"im":[]},{"id":"Q287","ch":"Parasitic Infestations","q":"The following is used for treatment of pediculosis capitis","o":[["A","Topical steroids"],["B","Malathion 0.5% lotion"],["C","Ketoconazole cream"],["D","Topical vitamin D"],["E","Emollients"]],"a":"B","sa":null,"pg":"51","f":[],"n":32,"e":["Malathion 0.5% lotion is used for head lice in children over 6 years and in pregnancy. Why the other options are wrong: A) Topical steroids: Steroids do not kill lice. C) Ketoconazole cream: Ketoconazole is antifungal. D) Topical vitamin D: Vitamin D is for psoriasis. E) Emollients: Emollients do not kill lice.","Malathion."],"im":[]},{"id":"Q288","ch":"Parasitic Infestations","q":"A child with pruritic scalp, excoriations and firmly attached nits. The following is a good treatment option:","o":[["A","Oral griseofulvin"],["B","Podophyllin resin 10-25%"],["C","Oral nystatin"],["D","Topical selenium sulphide"],["E","Topical ivermectin 0.5%"]],"a":"E","sa":null,"pg":"51","f":[],"n":33,"e":["Pruritic scalp with firmly attached nits is head lice; topical ivermectin 0.5% is a treatment option. Griseofulvin and nystatin are antifungals, and podophyllin is for warts. Why the other options are wrong: A) Oral griseofulvin: Griseofulvin is antifungal. B) Podophyllin resin 10-25%: Podophyllin is for warts. C) Oral nystatin: Nystatin is antifungal. D) Topical selenium sulphide: Selenium is for versicolor.","Ivermectin 0.5%."],"im":[]},{"id":"Q289","ch":"Parasitic Infestations","q":"Phthirus pubis","o":[["A","Is not itchy"],["B","May be sexually transmitted"],["C","Is treated by terbinafine"],["D","Involves the scalp and back"],["E","Is a protozoal infection"]],"a":"B","sa":null,"pg":"48","f":[],"n":34,"e":["Phthirus pubis (pubic louse) spreads by close physical contact and sexual contact in young adults. Why the other options are wrong: A) Is not itchy: Pediculosis pubis causes marked itching. C) Is treated by terbinafine: Terbinafine is antifungal. D) Involves the scalp and back: It involves the pubis. E) Is a protozoal infection: It is an insect.","Sexually transmissible."],"im":[]},{"id":"Q290","ch":"Parasitic Infestations","q":"Lice infestation of the eyelashes is caused by:","o":[["A","Pediculus humanus corporis"],["B","Pediculus humanus capitis"],["C","Phthirus pubis"],["D","Sarcoptes scabiei"],["E","Demodex folliculorum"]],"a":"C","sa":null,"pg":"49","f":[],"n":35,"e":["Pubic lice (Phthirus pubis) can infest the eyelashes, along with the pubic area, lower abdomen and thighs. Why the other options are wrong: A) Pediculus humanus corporis: Corporis is body lice. B) Pediculus humanus capitis: Capitis is scalp. D) Sarcoptes scabiei: Sarcoptes scabiei is the scabies mite. E) Demodex folliculorum: Demodex folliculorum is a follicular mite of the face, not a louse.","Eyelash lice."],"im":[]},{"id":"Q291","ch":"Parasitic Infestations","q":"A male baby, 9 months old, was brought by his mother presenting with papules, pustules, eczematous rashes, scratch marks and impetigo involving his face, trunk, genitalia, palms and soles. His mother reported that he suffered from insomnia in addition to irritability most of his day. Family history of pruritus was positive. What is the diagnosis?","o":[["A","Atopic dermatitis."],["B","Scabies."],["C","Tinea corporis."],["D","Lichen planus."],["E","Psoriasis."]],"a":"B","sa":null,"pg":"44","f":[],"n":36,"e":["Burrows and nocturnal itching in typical distribution are scabies. Why the other options are wrong: A) Atopic dermatitis: Atopic is flexural. C) Tinea corporis: Tinea is scaly. D) Lichen planus: LP is violaceous. E) Psoriasis: Psoriasis is silvery.","Scabies."],"im":[]},{"id":"Q541","ch":"Parasitic Infestations","q":"Sites of predilection of scabietic burrows include all of the following EXCEPT:","o":[["A","In-between fingers & wrist area."],["B","Medial sides of forearms."],["C","Anterior axillary folds & lower abdomen."],["D","Breast in females & genitalia in males."],["E","Lateral aspect of thighs & buttocks."]],"a":"E","sa":null,"pg":"43","f":["Key (E) conflicts with the book, which lists buttocks and thighs among scabies sites; no option is clearly the exception. Please verify."],"n":37,"e":["Scabies burrows prefer thin skin with few follicles: finger webs, wrists, medial forearms, anterior axillary folds, lower abdomen, breasts in females and genitalia in males. The lateral aspect of the thighs is not a predilection site, so that option is the exception. Why the other options are wrong: A) In-between fingers & wrist area: A predilection site. B) Medial sides of forearms: A predilection site. C) Anterior axillary folds & lower abdomen: A predilection site. D) Breast in females & genitalia in males: A predilection site.","Burrows: webs, wrists, folds, genitalia; spares head/neck and upper back in adults."],"im":[]},{"id":"Q542","ch":"Parasitic Infestations","q":"A child presents with intensely pruritic grouped papules at the finger webs and burrows on flexor surfaces. This disease is caused by:","o":[["A","Pediculus humanus corporis."],["B","Demodex folliculorum."],["C","Pthirus pubis."],["D","Sarcoptes scabiei."]],"a":"D","sa":null,"pg":"42","f":[],"n":38,"e":["Intensely itchy grouped papules at the finger webs with burrows on flexor surfaces are scabies, caused by the mite Sarcoptes scabiei. Pediculus corporis and Pthirus pubis are lice, and Demodex lives in follicles. Why the other options are wrong: A) Pediculus humanus corporis: Corporis is lice. B) Demodex folliculorum: Demodex lives in follicles. C) Pthirus pubis: Pthirus is pubic lice.","Burrow = Sarcoptes scabiei."],"im":[]},{"id":"H162","ch":"Parasitic Infestations","q":"Infant with vesicles and pustules on face, palm and soles. There is family history of itching at night:","o":[["A","Pediculosis pubis"],["B","Tinea corporis"],["C","Scabies"]],"a":"C","sa":null,"pg":null,"f":[],"n":39,"e":["An infant with vesicles on face, palms and soles and family night itching has scabies. Why the other options are wrong: A) Pediculosis pubis: Pubis is pubic lice. B) Tinea corporis: Tinea corporis gives annular scaly patches, not vesicopustules on the palms and soles with nocturnal itching in the family.","Family itch."],"im":[]},{"id":"H163","ch":"Parasitic Infestations","q":"Adult scabies can affect the following sites EXCEPT:","o":[["A","Flexures."],["B","Wrist."],["C","Upper back."],["D","Buttocks."],["E","Genitalia."]],"a":"C","sa":null,"pg":null,"f":[],"n":40,"e":["Adult scabies spares the head, neck and upper back, but involves flexures, wrists, buttocks and genitalia. Why the other options are wrong: A) Flexures: Involved. B) Wrist: Involved. D) Buttocks: Involved. E) Genitalia: Involved.","Upper back spared."],"im":[]},{"id":"H165","ch":"Parasitic Infestations","q":"Lice infestation of the eyelashes is caused by:","o":[["A","Pediculus humanus corporis."],["B","Pediculus humanus capitis."],["C","Phthirus pubis."],["D","Sarcoptes scabiei."],["E","Demodex folliculorum."]],"a":"C","sa":null,"pg":null,"f":[],"n":41,"e":["Eyelash infestation is typical of the pubic louse Phthirus pubis; head lice infest scalp hair. Why the other options are wrong: A) Pediculus humanus corporis: Corporis is body lice. B) Pediculus humanus capitis: Capitis is scalp. D) Sarcoptes scabiei: Sarcoptes scabiei is the scabies mite. E) Demodex folliculorum: Demodex folliculorum is a follicular mite of the face, not a louse.","Eyelashes: pubic lice."],"im":[]},{"id":"H168","ch":"Parasitic Infestations","q":"Pediculosis capitis may be treated by:","o":[["A","3% acetic acid."],["B","Gamma benzene hexachloride."],["C","Permethrin."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":42,"e":["Head lice may be treated with acetic acid, gamma benzene hexachloride or permethrin. Why the other options are wrong: A) 3% acetic acid: 3% acetic acid helps loosen nits; true, but B and C are also used. B) Gamma benzene hexachloride: Gamma benzene hexachloride is a pediculicide; true, but A and C are also used. C) Permethrin: Permethrin is a first-line pediculicide; true, but A and B are also used. E) None of the above: Wrong: A, B and C are all used.","All of the above."],"im":[]},{"id":"H173","ch":"Parasitic Infestations","q":"Pediculosis capitis:","o":[["A","Is transmitted by hats."],["B","Is treated by acyclovir."],["C","Does not present by pruritus."],["D","Can affect the pubic area."],["E","None of the above."]],"a":"A","sa":null,"pg":null,"f":[],"n":43,"e":["Head lice spread via hats, combs and brushes; they are treated with permethrin, malathion or ivermectin, not acyclovir, and they cause itching. Why the other options are wrong: B) Is treated by acyclovir: Acyclovir is antiviral. C) Does not present by pruritus: It is itchy. D) Can affect the pubic area: That is pubic lice. E) None of the above: Wrong: at least one of the listed statements is correct.","Fomites."],"im":[]},{"id":"H176","ch":"Parasitic Infestations","q":"The following may help in the diagnosis of scabies:","o":[["A","Positive family history."],["B","Night itching."],["C","Distribution of lesions."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":44,"e":["Family history, night itching and lesion distribution all help diagnose scabies. Why the other options are wrong: A) Positive family history: A family member with itching suggests contagion; true, but B and C are also clues. B) Night itching: Nocturnal itching is a classic clue; true, but A and C are also clues. C) Distribution of lesions: Distribution (finger webs, wrists, genitalia) is a classic clue; true, but A and B are also clues. E) None of the above: Wrong: A, B and C all help.","All of the above."],"im":[]},{"id":"Q292","ch":"Inflammatory Dermatoses","q":"All are true about psoriasis EXCEPT","o":[["A","Nail changes could occur"],["B","Has an extensor distribution"],["C","Occurs in children"],["D","Is a contagious disease"],["E","Could be associated with arthritis"]],"a":"D","sa":null,"pg":"52","f":[],"n":1,"e":["Psoriasis is a chronic immune-mediated (T-cell) disease with genetic susceptibility, so it cannot be passed from person to person. Everything else listed (nail changes, extensor distribution, childhood onset, arthritis) is true of it. Why the other options are wrong: A) Nail changes could occur: True: pitting, onycholysis. B) Has an extensor distribution: True: elbows and knees. C) Occurs in children: True: can start in childhood. E) Could be associated with arthritis: True: psoriatic arthritis.","Psoriasis = immune-mediated, never contagious. Auspitz sign, Koebner phenomenon, nail pitting."],"im":[]},{"id":"Q293","ch":"Inflammatory Dermatoses","q":"All these skin diseases are infectious EXCEPT","o":[["A","Kerion."],["B","Herpes simplex."],["C","Ecthyma."],["D","Psoriasis."],["E","Bullous impetigo."]],"a":"D","sa":null,"pg":"52","f":[],"n":2,"e":["Psoriasis is an immune-mediated papulosquamous disease, not an infection. The question lists infectious skin diseases, so psoriasis is the one that does not belong. Why the other options are wrong: A) Kerion: Kerion is fungal. B) Herpes simplex: Herpes simplex is viral. C) Ecthyma: Ecthyma is bacterial. E) Bullous impetigo: Bullous impetigo is bacterial.","Infectious: impetigo, tinea, scabies, warts. Non-infectious: psoriasis, lichen planus, DLE."],"im":[]},{"id":"Q294","ch":"Inflammatory Dermatoses","q":"In psoriasis","o":[["A","There is decreased rate of division of basal cell layer."],["B","There is decreased rate of epidermal turnover."],["C","There is decrease of epidermal turnover time."],["D","The epidermal turnover time is 27 days."],["E","The epidermal turnover time is 17 days."]],"a":"C","sa":null,"pg":"52","f":[],"n":3,"e":["In psoriasis the basal cells divide faster, so the epidermis renews itself much more quickly. The epidermal turnover time falls from the normal 28 days to about 7 days, which produces the thick silvery scales. Why the other options are wrong: A) There is decreased rate of division of b…: Cell division is increased. B) There is decreased rate of epidermal tur…: Turnover is faster. D) The epidermal turnover time is 27 days: Normal is 28 days; here about 7 days. E) The epidermal turnover time is 17 days: Too long; it is about 7 days.","Normal turnover 28 days; psoriasis 7 days (shortened, not prolonged)."],"im":[]},{"id":"Q295","ch":"Inflammatory Dermatoses","q":"A patient presented with well-demarcated erythematous plaques covered by silvery scales on the extensor elbows and knees with positive Auspitz sign. In this disease:","o":[["A","The rate of cell division in the basal layer is decreased."],["B","The epidermal renewal process becomes slower."],["C","The time required for epidermal cell turnover is increased."],["D","The epidermal turnover time is about 7 days."],["E","The epidermal turnover time is about 28 days."]],"a":"D","sa":null,"pg":"52","f":[],"n":4,"e":["Well-demarcated silvery plaques on elbows and knees with a positive Auspitz sign describe psoriasis. The key points are an increased rate of basal cell division and a shortened epidermal turnover of about 7 days (28 days is normal), so the options saying 'decreased' or 'slower' are wrong. Why the other options are wrong: A) The rate of cell division in the basal l…: Division is increased. B) The epidermal renewal process becomes sl…: Renewal is faster. C) The time required for epidermal cell tur…: Time is decreased. E) The epidermal turnover time is about 28…: 28 days is normal.","Psoriasis = fast turnover (7 days)."],"im":[]},{"id":"Q296","ch":"Inflammatory Dermatoses","q":"All of the following is true about psoriasis except","o":[["A","It is a disorder of keratinization"],["B","It gets more severe in summer than in winter"],["C","Its primary lesion is a papule"],["D","Psoriasis vulgaris is its most common type"],["E","It is characterized by Koebner phenomenon"]],"a":"B","sa":null,"pg":"52","f":[],"n":5,"e":["Psoriasis improves with ultraviolet exposure, so it flares in winter and in covered body parts, and is commoner in Scandinavian countries than the tropics. The statement that it worsens in summer is the false one. It is a papule-based disease and Koebner phenomenon is typical. Why the other options are wrong: A) It is a disorder of keratinization: Psoriasis is epidermal hyperproliferation with abnormal keratinization. C) Its primary lesion is a papule: The primary lesion is a papule that coalesces into plaques. D) Psoriasis vulgaris is its most common ty…: Plaque psoriasis (vulgaris) is the most common type. E) It is characterized by Koebner phenomenon: Koebner phenomenon: new lesions at sites of trauma.","Sun helps psoriasis: worse in winter."],"im":[]},{"id":"Q297","ch":"Inflammatory Dermatoses","q":"Koebner's phenomenon is seen in which diseases?","o":[],"a":null,"sa":"Psoriasis, lichen planus, vitiligo and plane (flat) warts","pg":"52","f":[],"n":6,"e":["Koebner phenomenon means new lesions appear on previously normal skin after trauma. The book lists it in psoriasis, lichen planus, vitiligo and flat (plane) warts.","Koebner: psoriasis, lichen planus, vitiligo, plane warts."],"im":[]},{"id":"Q298","ch":"Inflammatory Dermatoses","q":"Primary lesion of psoriasis is","o":[["A","Red macule covered with non-adherent silvery white scales."],["B","Red papule covered with adherent white scales."],["C","Red papule covered with non-adherent silvery white scales."],["D","Red macule covered with white adherent scales."],["E","Red papule with vesicles, crusts and white scales."]],"a":"C","sa":null,"pg":"53","f":[],"n":7,"e":["The psoriatic primary lesion is a red papule covered by loosely attached silvery-white scales; papules join to form plaques. A vesicle or crust points to eczema instead. Why the other options are wrong: A) Red macule covered with non-adherent sil…: It is a papule, not a macule. B) Red papule covered with adherent white s…: The scales are loose, not adherent. D) Red macule covered with white adherent s…: It is a papule, with loose scales. E) Red papule with vesicles, crusts and whi…: Vesicles and crusts mean eczema.","Papule + silvery loose scales."],"im":[]},{"id":"Q299","ch":"Inflammatory Dermatoses","q":"Auspitz sign is elicited in","o":[["A","Psoriasis."],["B","Lichen planus."],["C","Discoid LE."],["D","Discoid eczema."],["E","Seborrheic dermatitis."]],"a":"A","sa":null,"pg":"53","f":[],"n":8,"e":["Scraping the scales off a psoriatic plaque leaves pinpoint bleeding points (Auspitz sign) because the dermal papillae are thin-capped and engorged. Lichen planus shows Wickham striae and DLE shows follicular plugging instead. Why the other options are wrong: B) Lichen planus: LP has Wickham striae. C) Discoid LE: DLE has follicular plugs. D) Discoid eczema: Eczema oozes. E) Seborrheic dermatitis: Seb derm is greasy.","Auspitz = psoriasis; Wickham = lichen planus."],"im":[]},{"id":"Q300","ch":"Inflammatory Dermatoses","q":"A 35-year-old male presents with scaly erythematous symmetrical plaques on extensor surfaces and a positive Auspitz sign. What is the most likely diagnosis?","o":[["A","Psoriasis."],["B","Atopic dermatitis."],["C","Lichen planus."],["D","Seborrheic dermatitis."],["E","Pityriasis rosea."]],"a":"A","sa":null,"pg":"53","f":[],"n":9,"e":["Symmetrical scaly erythematous plaques on the extensor surfaces with a positive Auspitz sign are typical of psoriasis. Atopic dermatitis favors flexures, lichen planus gives violaceous flat papules, and pityriasis rosea follows a herald patch. Why the other options are wrong: B) Atopic dermatitis: Atopic is flexural. C) Lichen planus: LP is violaceous. D) Seborrheic dermatitis: Seb derm is greasy. E) Pityriasis rosea: PR follows a herald patch.","Extensors + Auspitz = psoriasis."],"im":[]},{"id":"Q301","ch":"Inflammatory Dermatoses","q":"A female patient, 17 years old, presented with scaly erythematous plaques on her scalp. She also had scaly plaques on both elbows and knees. (Clinical photo: thick silvery-scaled plaques at the nape/scalp margin.) What is your diagnosis?","o":[["A","Discoid lupus erythematosus."],["B","Lichen planopilaris."],["C","Scalp psoriasis."],["D","Seborrheic dermatitis."],["E","Scalp eczema."]],"a":"C","sa":null,"pg":"53","f":[],"n":10,"e":["Plaques of silvery scale confined to the scalp are scalp psoriasis, which sharply borders the hairline and does not scar the hair, unlike DLE. Why the other options are wrong: A) Discoid lupus erythematosus: DLE scars. B) Lichen planopilaris: Planopilaris scars. D) Seborrheic dermatitis: Seb derm is greasy. E) Scalp eczema: Eczema is oozing.","Scalp is a common site; psoriasis hair loss is non-scarring."],"im":[]},{"id":"Q302","ch":"Inflammatory Dermatoses","q":"A male patient, 35 years old, presented with itchy scaly plaques on his trunk. He also had scaly plaques on both elbows, forearms and scalp. The condition started when he was 14 years old with remissions and exacerbations. He reported that lesions exacerbated with stressful conditions and in winter months. (Clinical photo: multiple erythematous scaly plaques on the trunk.) This patient suffers from","o":[["A","Impetigo contagiosum."],["B","Psoriasis vulgaris."],["C","Disseminated dermatitis."],["D","Atopic dermatitis."],["E","Lichen planus."]],"a":"B","sa":null,"pg":"52","f":[],"n":11,"e":["Vulgaris means 'common', so psoriasis vulgaris is the common plaque type, accounting for most cases. The picture shows typical well-defined scaly plaques. Why the other options are wrong: A) Impetigo contagiosum: Impetigo is crusted. C) Disseminated dermatitis: Disseminated dermatitis is not silvery. D) Atopic dermatitis: Atopic is flexural. E) Lichen planus: LP is violaceous.","Plaque psoriasis = psoriasis vulgaris."],"im":[]},{"id":"Q303","ch":"Inflammatory Dermatoses","q":"The characteristic clinical picture of psoriasis is","o":[["A","Erythematous papules & plaques covered by silvery scales"],["B","Erythematous macules covered by silvery scales"],["C","Erythematous nodules covered by silvery scales"],["D","Pruritic erythematous patches"],["E","Pruritic polyangular papules"]],"a":"A","sa":null,"pg":"53","f":[],"n":12,"e":["The classic picture is bilateral, symmetrical well-defined erythematous papules and plaques covered by shiny silvery dry scales with a polycyclic outline, mainly on extensors, scalp and lumbosacral area. Why the other options are wrong: B) Erythematous macules covered by silvery…: Lesions are papules and plaques. C) Erythematous nodules covered by silvery…: It does not form nodules. D) Pruritic erythematous patches: Patches are not characteristic. E) Pruritic polyangular papules: That is lichen planus.","Silvery scales on extensors."],"im":[]},{"id":"Q304","ch":"Inflammatory Dermatoses","q":"Silver plaques are seen in","o":[["A","Psoriasis."],["B","Vitiligo."],["C","Hypertrophic lichen planus."],["D","Pityriasis rosea."],["E","Cutaneous candidiasis."]],"a":"A","sa":null,"pg":"53","f":[],"n":13,"e":["Silvery scale on a red plaque is the signature of psoriasis. Other scaly diseases such as tinea or seborrheic dermatitis have finer, greasy or branny scales instead. Why the other options are wrong: B) Vitiligo: Vitiligo is white. C) Hypertrophic lichen planus: Hypertrophic LP is thick violaceous. D) Pityriasis rosea: PR has collarette scales. E) Cutaneous candidiasis: Candida is moist.","Silvery = psoriasis."],"im":[]},{"id":"Q305","ch":"Inflammatory Dermatoses","q":"Vulgaris means","o":[["A","Serious"],["B","Common"],["C","Easily treated"],["D","Infectious"],["E","Painful"]],"a":"B","sa":null,"pg":"53","f":[],"n":14,"e":["Vulgaris is Latin for common, as in psoriasis vulgaris (plaque type), acne vulgaris and verruca vulgaris. Why the other options are wrong: A) Serious: Not serious. C) Easily treated: Not easy to treat. D) Infectious: Not infectious. E) Painful: Not painful.","Vulgaris = common."],"im":[]},{"id":"Q306","ch":"Inflammatory Dermatoses","q":"A patient came presenting with a red plaque covered with silvery white scales, upon removal of the scales bleeding points were observed. The most probable diagnosis is","o":[["A","Lichen planus"],["B","Psoriasis vulgaris"],["C","Discoid lupus erythematosus"],["D","Pityriasis rosea"],["E","Discoid eczema"]],"a":"B","sa":null,"pg":"53","f":[],"n":15,"e":["A red plaque with silvery white scales that bleeds on scale removal (Auspitz sign) is plaque-type psoriasis, i.e. psoriasis vulgaris. Why the other options are wrong: A) Lichen planus: LP has no scale bleeding. C) Discoid lupus erythematosus: DLE scale is adherent. D) Pityriasis rosea: PR has collarette. E) Discoid eczema: Discoid eczema oozes.","Plaque + Auspitz."],"im":[]},{"id":"Q307","ch":"Inflammatory Dermatoses","q":"Psoriasis may be manifested clinically by all of the following EXCEPT","o":[["A","Erythroderma."],["B","Pustular lesions."],["C","Arthropathy."],["D","Flexural lesions."],["E","Bullous lesions."]],"a":"E","sa":null,"pg":"54","f":[],"n":16,"e":["Psoriasis has several forms: erythrodermic, pustular, flexural, nail and arthritic. Bullous lesions are not part of the psoriasis spectrum, so that option is the exception. Why the other options are wrong: A) Erythroderma: It occurs. B) Pustular lesions: It occurs. C) Arthropathy: It occurs. D) Flexural lesions: It occurs.","Types: plaque, flexural, nail, erythrodermic, pustular, arthritic. Never bullous."],"im":[]},{"id":"Q308","ch":"Inflammatory Dermatoses","q":"Psoriasis may present by all of the following EXCEPT","o":[["A","Flexural affection."],["B","Joint affection."],["C","Pustular eruption."],["D","Nail pitting."],["E","Cicatricial alopecia."]],"a":"E","sa":null,"pg":"54","f":[],"n":17,"e":["Psoriasis causes hair-bearing plaques without destroying follicles, so any alopecia is non-scarring. Cicatricial (scarring) alopecia occurs in DLE, lichen planus, kerion and favus, not psoriasis. Why the other options are wrong: A) Flexural affection: It occurs. B) Joint affection: It occurs. C) Pustular eruption: It occurs. D) Nail pitting: It occurs.","Scarring alopecia: DLE, LP, kerion, favus. Not psoriasis."],"im":[]},{"id":"Q309","ch":"Inflammatory Dermatoses","q":"Sterile pustules are characteristic of","o":[["A","Folliculitis."],["B","Pustular psoriasis."],["C","Sycosis barbae."],["D","Nodulocystic acne."],["E","None of the above."]],"a":"B","sa":null,"pg":"52","f":[],"n":18,"e":["Pustular psoriasis shows sterile pustules (no bacteria) on an erythematous base; hypocalcemia can precipitate it. Pustules in bacterial folliculitis or impetigo are infected. Why the other options are wrong: A) Folliculitis: Folliculitis is infected. C) Sycosis barbae: Sycosis is infected. D) Nodulocystic acne: Nodulocystic acne is infected. E) None of the above: Wrong: at least one listed statement is correct.","Sterile pustules = pustular psoriasis."],"im":[]},{"id":"Q310","ch":"Inflammatory Dermatoses","q":"Which of the following is NOT a recognized clinical type of psoriasis?","o":[["A","Plaque psoriasis."],["B","Guttate psoriasis."],["C","Erythrodermic psoriasis."],["D","Ulcerative psoriasis."],["E","Pustular psoriasis."]],"a":"D","sa":null,"pg":"54","f":[],"n":19,"e":["Recognised forms are plaque (vulgaris), flexural, nail, erythrodermic, pustular and psoriatic arthritis; guttate is also described. There is no 'ulcerative psoriasis'. Why the other options are wrong: A) Plaque psoriasis: Recognized. B) Guttate psoriasis: Recognized. C) Erythrodermic psoriasis: Recognized. E) Pustular psoriasis: Recognized.","No ulcerative psoriasis."],"im":[]},{"id":"Q311","ch":"Inflammatory Dermatoses","q":"Erythroderma may occur in","o":[["A","Alopecia."],["B","Vitiligo."],["C","Psoriasis."],["D","Acne vulgaris."],["E","Pityriasis rosea."]],"a":"C","sa":null,"pg":"54","f":[],"n":20,"e":["Psoriasis, especially when irritated by strong topicals or stopped steroids, may spread to involve the whole skin surface as erythrodermic psoriasis. The question asks which disease can present with erythroderma. Why the other options are wrong: A) Alopecia: Alopecia is hair loss. B) Vitiligo: Vitiligo spares the epidermis. D) Acne vulgaris: Acne is limited. E) Pityriasis rosea: PR is self-limited.","Erythroderma can complicate psoriasis."],"im":[]},{"id":"Q312","ch":"Inflammatory Dermatoses","q":"The following disease may involve the joints","o":[["A","Lichen planus."],["B","Pityriasis rosea."],["C","Psoriasis."],["D","Vitiligo."],["E","Seborrheic eczema."]],"a":"C","sa":null,"pg":"55","f":[],"n":21,"e":["Psoriasis can involve the joints (psoriatic arthritis), listed in the book among the clinical types. Scabies, tinea and impetigo do not affect joints. Why the other options are wrong: A) Lichen planus: LP spares joints. B) Pityriasis rosea: PR spares joints. D) Vitiligo: Vitiligo spares joints. E) Seborrheic eczema: Seb eczema spares joints.","Psoriasis + arthritis; also nail pitting."],"im":[]},{"id":"Q313","ch":"Inflammatory Dermatoses","q":"Topical treatment of psoriasis includes","o":[["A","Calcipotriol and coal tar."],["B","Acyclovir and garamycin."],["C","Antiseptic lotions."],["D","Terbinafine."],["E","Gamma benzene hexachloride."]],"a":"A","sa":null,"pg":"56","f":[],"n":22,"e":["Topical psoriasis drugs include keratolytics (salicylic acid), moisturizers, steroids, calcipotriol (vitamin D analogue), coal tar and anthralin. Antivirals, antifungals and antiseptic lotions are not part of the list. Why the other options are wrong: B) Acyclovir and garamycin: Acyclovir and garamycin treat infection. C) Antiseptic lotions: Antiseptics do not treat psoriasis. D) Terbinafine: Terbinafine is antifungal. E) Gamma benzene hexachloride: GBHC is for scabies.","Topical: calcipotriol, tar, anthralin, steroids."],"im":[]},{"id":"Q314","ch":"Inflammatory Dermatoses","q":"All of the following can be used in the treatment of psoriasis EXCEPT","o":[["A","Retinoids."],["B","Cyclosporine."],["C","Doxycycline."],["D","Calcipotriol."],["E","Phototherapy."]],"a":"C","sa":null,"pg":"56","f":[],"n":23,"e":["Retinoids (acitretin), cyclosporine, calcipotriol and phototherapy all treat psoriasis. Doxycycline is an antibiotic with no role in it. Why the other options are wrong: A) Retinoids: Systemic retinoids (acitretin) are used. B) Cyclosporine: Cyclosporine is an immunosuppressant for severe psoriasis. D) Calcipotriol: Calcipotriol (vitamin D analogue) is a first-line topical. E) Phototherapy: Phototherapy (narrow-band UVB, PUVA) is used.","Systemic: methotrexate, acitretin, cyclosporine, PUVA."],"im":[]},{"id":"Q315","ch":"Inflammatory Dermatoses","q":"Systemic treatment of psoriasis includes :","o":[["A","Tetracyclines."],["B","Methotrexate."],["C","Acyclovir."],["D","Itraconazole."],["E","Antimalarials."]],"a":"B","sa":null,"pg":"56","f":[],"n":24,"e":["Systemic therapy for extensive plaque, pustular, erythrodermic or arthritic psoriasis includes methotrexate, acitretin, cyclosporine and PUVA. Tetracyclines, acyclovir and itraconazole treat infections. Why the other options are wrong: A) Tetracyclines: Tetracyclines are antibacterial. C) Acyclovir: Acyclovir is antiviral. D) Itraconazole: Itraconazole is antifungal. E) Antimalarials: Antimalarials may worsen psoriasis.","Methotrexate = systemic psoriasis drug."],"im":[]},{"id":"Q316","ch":"Inflammatory Dermatoses","q":"Regarding topical treatment of psoriasis","o":[["A","Permethrin cream is used."],["B","Topical steroids are contraindicated."],["C","Topical antiseptics and antibiotics are important."],["D","Topical vitamin D is effective."],["E","It is effective as monotherapy in erythrodermic psoriasis."]],"a":"D","sa":null,"pg":"56","f":[],"n":25,"e":["Topical vitamin D analogues such as calcipotriol are effective in psoriasis. Permethrin treats scabies, antiseptics/antibiotics are not key psoriasis drugs, and topical steroids are used (not contraindicated). Why the other options are wrong: A) Permethrin cream is used: Permethrin is a scabicide, not for psoriasis. B) Topical steroids are contraindicated: Topical steroids are widely used for psoriasis. C) Topical antiseptics and antibiotics are …: Psoriasis is not infectious, so antiseptics and antibiotics do not help. E) It is effective as monotherapy in erythr…: Topical treatment alone is not enough in erythrodermic psoriasis; systemic therapy is needed.","Calcipotriol = vitamin D analogue."],"im":[]},{"id":"Q317","ch":"Inflammatory Dermatoses","q":"A female patient, 17 years old, presented with scaly erythematous plaques on her scalp. She also had scaly plaques on both elbows and knees. (Clinical photo: thick silvery-scaled plaques at the nape/scalp margin - psoriasis.) Topical treatment includes","o":[["A","Calcipotriol gel."],["B","Clindamycin lotion."],["C","Potassium permanganate lotion."],["D","Terbinafine cream."],["E","Gamma benzene hexachloride lotion."]],"a":"A","sa":null,"pg":"56","f":[],"n":26,"e":["Calcipotriol gel is a vitamin D analogue that slows keratinocyte proliferation in psoriasis. Acyclovir and terbinafine are antivirals/antifungals. Why the other options are wrong: B) Clindamycin lotion: Clindamycin is antibacterial. C) Potassium permanganate lotion: Permanganate dries oozing. D) Terbinafine cream: Terbinafine is antifungal. E) Gamma benzene hexachloride lotion: GBHC is for scabies.","Calcipotriol."],"im":[]},{"id":"Q318","ch":"Inflammatory Dermatoses","q":"A male patient, 35 years old, presented with itchy scaly plaques on his trunk. He also had scaly plaques on both elbows, forearms and scalp. The condition started when he was 14 years old with remissions and exacerbations, exacerbated by stress and in winter months. (Clinical photo: multiple erythematous scaly plaques on the trunk - psoriasis vulgaris.) Systemic treatment includes","o":[["A","Tetracyclines."],["B","Methotrexate."],["C","Valacyclovir."],["D","Itraconazole."]],"a":"B","sa":null,"pg":"56","f":[],"n":27,"e":["Methotrexate is a systemic antiproliferative/immunosuppressive drug used for extensive psoriasis, along with acitretin, cyclosporine and PUVA. Why the other options are wrong: A) Tetracyclines: Tetracyclines are antibacterial. C) Valacyclovir: Valacyclovir is antiviral. D) Itraconazole: Itraconazole is antifungal.","Methotrexate."],"im":[]},{"id":"Q319","ch":"Inflammatory Dermatoses","q":"Photochemotherapy is used to treat","o":[["A","Psoriasis."],["B","Pediculosis capitis"],["C","Tinea capitis."],["D","Tinea cruris."],["E","Discoid lupus."]],"a":"A","sa":null,"pg":"56","f":[],"n":28,"e":["Photochemotherapy (PUVA = psoralen + UVA) is used for psoriasis, along with narrow-band UVB. It is not used for DLE, which is photosensitive. Why the other options are wrong: B) Pediculosis capitis: Lice need insecticides. C) Tinea capitis: Tinea needs antifungals. D) Tinea cruris: Tinea needs antifungals. E) Discoid lupus: DLE is photosensitive.","PUVA: psoriasis, vitiligo; not DLE."],"im":[]},{"id":"Q320","ch":"Inflammatory Dermatoses","q":"Lichen planus is an inflammatory pruritic disease which involves","o":[["A","Mucous membranes."],["B","Skin."],["C","Hair follicles."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"57","f":[],"n":29,"e":["Lichen planus is a pruritic immune-mediated disease that affects skin, mucous membranes, hair and nails, so all options are correct. Why the other options are wrong: A) Mucous membranes: Oral lesions (white reticulate streaks) occur. True, but B and C are also involved. B) Skin: Skin shows violaceous flat-topped polygonal papules. True, but A and C are also involved. C) Hair follicles: Hair follicles are involved (lichen planopilaris, scarring alopecia). True, but A and B are also involved. E) None of the above: Wrong: A, B and C are all involved.","LP: skin, mucosa, hair, nails."],"im":[]},{"id":"Q321","ch":"Inflammatory Dermatoses","q":"Mucous membranes are involved in","o":[["A","Papular urticaria."],["B","Tinea versicolor."],["C","Scabies."],["D","Lichen Planus."],["E","Pediculosis capitis."]],"a":"D","sa":null,"pg":"57","f":[],"n":30,"e":["Mucosal lichen planus involves buccal mucosa, tongue, gums and genitalia with white reticular streaks (Wickham striae). Why the other options are wrong: A) Papular urticaria: Papular urticaria spares mucosa. B) Tinea versicolor: Versicolor spares mucosa. C) Scabies: Scabies spares mucosa. E) Pediculosis capitis: Lice spare mucosa.","LP has mucosal disease."],"im":[]},{"id":"Q322","ch":"Inflammatory Dermatoses","q":"Lichen planus (including hypertrophic LP) may be associated with which viral infection?","o":[],"a":null,"sa":"Hepatitis C virus","pg":"57","f":[],"n":31,"e":["Hepatitis C virus infection is associated with lichen planus, so hepatic work-up is sensible. Hair fall and vitamin/iron deficiency are other clues listed in the introduction.","LP ↔ hepatitis C."],"im":[]},{"id":"Q323","ch":"Inflammatory Dermatoses","q":"Well-defined flat-topped, polyangular, violaceous, itchy papules are the primary lesions of","o":[["A","Vitiligo."],["B","Lupus erythematosus."],["C","Lichen planus."],["D","Psoriasis."],["E","None of the above."]],"a":"C","sa":null,"pg":"57","f":[],"n":32,"e":["Flat-topped, polyangular, violaceous, itchy papules define lichen planus. Psoriasis papules are scaly red and DLE plaques are atrophic. Why the other options are wrong: A) Vitiligo: Vitiligo has macules. B) Lupus erythematosus: Lupus has atrophic plaques. D) Psoriasis: Psoriasis is scaly. E) None of the above: Wrong: at least one listed statement is correct.","Purple, polygonal, itchy, planar papules."],"im":[]},{"id":"Q324","ch":"Inflammatory Dermatoses","q":"A female patient, 38 years old, presented with papules that developed on both her forearms and wrists. The condition started about five years ago with a gradual onset and a progressive course. She had severe itching. (Clinical photo: multiple violaceous flat-topped papules and plaques on both forearms and wrists.) What is your diagnosis?","o":[["A","Discoid lupus erythematosus."],["B","Stasis dermatitis."],["C","Atopic dermatitis."],["D","Lichen planus."],["E","Psoriasis vulgaris."]],"a":"D","sa":null,"pg":"57","f":[],"n":33,"e":["Flat-topped violaceous polygonal papules, often on wrists, are lichen planus. Why the other options are wrong: A) Discoid lupus erythematosus: DLE is atrophic. B) Stasis dermatitis: Stasis is on the legs. C) Atopic dermatitis: Atopic is flexural. E) Psoriasis vulgaris: Psoriasis is scaly.","Wrists and shins."],"im":[]},{"id":"Q325","ch":"Inflammatory Dermatoses","q":"The primary lesion of lichen planus is","o":[["A","Pustule."],["B","Vesicle."],["C","Papule."],["D","Macule."],["E","Bulla."]],"a":"C","sa":null,"pg":null,"f":[],"n":34,"e":["The primary lesion is a papule (flat-topped, polyangular, violaceous, shiny). Plaques form by coalescence. Why the other options are wrong: A) Pustule: Not a pustule. B) Vesicle: Not a vesicle. D) Macule: Not a macule. E) Bulla: Not a bulla.","Primary = papule."],"im":[]},{"id":"Q326","ch":"Inflammatory Dermatoses","q":"Lichen planus heals leaving","o":[["A","Pain & paresthesia."],["B","Post-inflammatory hypopigmentation."],["C","Post-inflammatory hyperpigmentation."],["D","Keloids."],["E","Telangiectasia."]],"a":"C","sa":null,"pg":"58","f":[],"n":35,"e":["Lichen planus heals leaving dark post-inflammatory hyperpigmentation, not hypopigmentation, scars or keloids (except in hypertrophic/scalp types). Why the other options are wrong: A) Pain & paresthesia: Pain and paresthesia suggest neuropathy or zoster; LP is itchy. B) Post-inflammatory hypopigmentation: It darkens, not lightens. D) Keloids: LP does not form keloids; it leaves dark macules. E) Telangiectasia: Telangiectasia is typical of atrophic diseases such as DLE, not LP.","LP → hyperpigmentation."],"im":[]},{"id":"Q327","ch":"Inflammatory Dermatoses","q":"Koebner's phenomenon is positive in all of the following EXCEPT","o":[["A","Warts."],["B","Psoriasis."],["C","Lichen planus."],["D","Eczema."],["E","Vitiligo."]],"a":"D","sa":null,"pg":"58","f":[],"n":36,"e":["Koebner is seen in psoriasis, LP, vitiligo and plane warts; eczema is not on that list. Why the other options are wrong: A) Warts: Positive. B) Psoriasis: Positive. C) Lichen planus: Positive. E) Vitiligo: Positive.","Eczema: no Koebner."],"im":[]},{"id":"Q328","ch":"Inflammatory Dermatoses","q":"Koebner's phenomenon is present in :","o":[["A","Psoriasis."],["B","Lichen planus."],["C","Plane warts."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"58","f":[],"n":37,"e":["Koebner phenomenon occurs in psoriasis, lichen planus and vitiligo, so all of the above is correct. Why the other options are wrong: A) Psoriasis: Koebner phenomenon occurs in psoriasis. True, but B and C also show it. B) Lichen planus: It occurs in lichen planus. True, but A and C also show it. C) Plane warts: It occurs in plane warts. True, but A and B also show it. E) None of the above: Wrong: A, B and C all show it.","Koebner: PLP-V."],"im":[]},{"id":"Q329","ch":"Inflammatory Dermatoses","q":"How does lichen planus present clinically?","o":[["A","Red plaques with silvery scales."],["B","Pruritic, red, oozing rash with edema."],["C","Golden colored crusts."],["D","Pruritic, purple, polygonal, planar papules."],["E","Pearly dome-shaped papules with umbilicated centers."]],"a":"D","sa":null,"pg":"57","f":[],"n":38,"e":["LP is described as pruritic, purple, polygonal, planar papules (the 4 Ps; a fifth P: plaques), with shiny surface and fine adherent scales. Why the other options are wrong: A) Red plaques with silvery scales: That is psoriasis. B) Pruritic, red, oozing rash with edema: That is acute eczema. C) Golden colored crusts: That is impetigo. E) Pearly dome-shaped papules with umbilica…: That is molluscum.","4 Ps."],"im":[]},{"id":"Q330","ch":"Inflammatory Dermatoses","q":"In lichen planus, squamous cell carcinoma may complicate","o":[["A","Oral ulcerative lesions."],["B","Hypertrophic lesions."],["C","Nail lesions."],["D","Actinic lesions."],["E","Scalp lesions."]],"a":"A","sa":null,"pg":"59","f":[],"n":39,"e":["Chronic ulcerative (erosive) oral lesions of LP are resistant to treatment and may become squamous cell carcinoma. Skin lesions do not. Why the other options are wrong: B) Hypertrophic lesions: Hypertrophic lesions rarely transform. C) Nail lesions: Nails do not transform. D) Actinic lesions: Actinic does not transform. E) Scalp lesions: Scalp scars.","Oral erosive LP → SCC."],"im":[]},{"id":"Q331","ch":"Inflammatory Dermatoses","q":"Wickham striae are seen in:","o":[["A","Pityriasis rosea."],["B","Scabies."],["C","Lichen planus."],["D","Verrucae."],["E","Erythema multiforme."]],"a":"C","sa":null,"pg":"59","f":[],"n":40,"e":["Wickham striae are the fine white reticular lines on lichen planus papules and oral mucosa. They are not seen in pityriasis rosea, scabies or warts. Why the other options are wrong: A) Pityriasis rosea: PR has collarette. B) Scabies: Scabies has burrows. D) Verrucae: Warts are rough. E) Erythema multiforme: EM has targets.","Wickham = LP."],"im":[]},{"id":"Q332","ch":"Inflammatory Dermatoses","q":"Complications of lichen planus may include","o":[["A","Frequent recurrences."],["B","Subsequent bacterial infections."],["C","Non-cicatricial alopecia in scalp."],["D","Post-inflammatory hypopigmentation."],["E","Squamous cell carcinoma."]],"a":"E","sa":null,"pg":"59","f":[],"n":41,"e":["Chronic ulcerative mucosal and hypertrophic LP can turn into squamous cell carcinoma. Frequent recurrence and post-inflammatory pigmentation are common, but SCC is the serious complication. Why the other options are wrong: A) Frequent recurrences: True but not serious. B) Subsequent bacterial infections: True but not serious. C) Non-cicatricial alopecia in scalp: Scalp LP scars, not non-scarring. D) Post-inflammatory hypopigmentation: It leaves hyperpigmentation.","Complication: SCC."],"im":[]},{"id":"Q333","ch":"Inflammatory Dermatoses","q":"One of the following is precancerous","o":[["A","Actinic lichen planus"],["B","Mucosal lichen planus"],["C","Lichen planus pigmentosus"],["D","Lichen planopilaris"],["E","Scalp lichen planus"]],"a":"B","sa":null,"pg":"59","f":[],"n":42,"e":["Mucosal (erosive) lichen planus is considered precancerous because of its risk of SCC. Why the other options are wrong: A) Actinic lichen planus: Actinic is not precancerous. C) Lichen planus pigmentosus: Pigmentosus is benign. D) Lichen planopilaris: Planopilaris scars. E) Scalp lichen planus: Scalp scars.","Oral LP: follow up."],"im":[]},{"id":"Q334","ch":"Inflammatory Dermatoses","q":"Lichen planus actinicus usually involves","o":[["A","Upper back."],["B","Genitalia."],["C","Nails."],["D","All of the above."],["E","None of the above."]],"a":"E","sa":null,"pg":null,"f":[],"n":43,"e":["Actinic LP lies on sun-exposed skin (face, dorsa of hands). Upper back, genitalia and nails are not its typical targets, so 'none of the above' is the key. Why the other options are wrong: A) Upper back: It spares the back. B) Genitalia: It spares genitalia. C) Nails: It spares nails. D) All of the above: Wrong: not all listed statements are correct.","Actinic LP: sun-exposed areas, often the face."],"im":[]},{"id":"Q335","ch":"Inflammatory Dermatoses","q":"Regarding lichen planus, the following is TRUE","o":[["A","It is a contagious disease."],["B","The primary lesion is a pearly white umbilicated papule."],["C","It never affects the oral mucosa."],["D","It can lead to cicatricial alopecia."],["E","It is due to HHV-7."]],"a":"D","sa":null,"pg":"90","f":[],"n":44,"e":["LP affecting the scalp destroys follicles and ends in scarring (cicatricial) alopecia. It is not contagious, and its papule is flat-topped violaceous, not pearly umbilicated (that is molluscum). Why the other options are wrong: A) It is a contagious disease: It is not contagious. B) The primary lesion is a pearly white umb…: That is molluscum. C) It never affects the oral mucosa: It can affect the mouth. E) It is due to HHV-7: It is not viral.","LP can scar the scalp."],"im":[]},{"id":"Q336","ch":"Inflammatory Dermatoses","q":"Actinic lichen planus usually affects","o":[["A","Mucous membranes."],["B","Genitals."],["C","Upper back."],["D","Face."],["E","None of the above."]],"a":"D","sa":null,"pg":"57","f":[],"n":45,"e":["Actinic LP (lichen planus tropicus) appears on sun-exposed areas such as the face and dorsum of the hands. Why the other options are wrong: A) Mucous membranes: Mucosa is classic LP. B) Genitals: Genitals are classic LP. C) Upper back: Upper back is covered. E) None of the above: None applies, since the face is the usual site.","Face = actinic LP."],"im":[]},{"id":"Q337","ch":"Inflammatory Dermatoses","q":"A female patient, 38 years old, presented with papules that developed on both her forearms and wrists. The condition started about five years ago with a gradual onset and a progressive course. She had severe itching. (Clinical photo: multiple violaceous flat-topped papules and plaques on both forearms and wrists - lichen planus.) Best treatment option is","o":[["A","Radiotherapy."],["B","Oral ivermectin."],["C","Topical potassium permanganate 1/8000."],["D","Oral terbinafine."],["E","Topical corticosteroids."]],"a":"E","sa":null,"pg":"62","f":[],"n":46,"e":["A few itchy lichen planus papules on the forearms are treated with topical corticosteroids, the first-line therapy for localized disease. Why the other options are wrong: A) Radiotherapy: Radiotherapy is not used. B) Oral ivermectin: Ivermectin is antiparasitic. C) Topical potassium permanganate 1/8000: Permanganate dries oozing. D) Oral terbinafine: Terbinafine is antifungal.","Topical steroids."],"im":[]},{"id":"Q338","ch":"Inflammatory Dermatoses","q":"A patient presented with papules on both forearms and wrists. The condition started about five years ago with a gradual onset and a progressive course, with severe itching. (Clinical photo: violaceous flat-topped papules and plaques on both forearms and wrists - lichen planus.) Best treatment option is","o":[["A","Radiotherapy."],["B","Oral ivermectin."],["C","Topical potassium permanganate 1/8000."],["D","Topical terbinafine."],["E","Oral corticosteroids."]],"a":"E","sa":null,"pg":"62","f":[],"n":47,"e":["Extensive or severe LP needs oral corticosteroids, with sedating antihistamines for itch. Why the other options are wrong: A) Radiotherapy: Radiotherapy is not used. B) Oral ivermectin: Ivermectin is antiparasitic. C) Topical potassium permanganate 1/8000: Permanganate dries oozing. D) Topical terbinafine: Terbinafine is antifungal.","Generalized LP → systemic steroids."],"im":[]},{"id":"Q339","ch":"Inflammatory Dermatoses","q":"Treatment of choice for actinic lichen planus is","o":[["A","Allylamines."],["B","Calcipotriene."],["C","Antimalarials."],["D","Ivermectin."],["E","Nystatin."]],"a":"C","sa":null,"pg":"62","f":[],"n":48,"e":["Antimalarials (hydroxychloroquine/chloroquine) are the treatment of choice for actinic LP, with sunscreens. Why the other options are wrong: A) Allylamines: Allylamines are antifungal. B) Calcipotriene: Calcipotriene is for psoriasis. D) Ivermectin: Ivermectin is antiparasitic. E) Nystatin: Nystatin is antifungal.","Actinic LP = antimalarials + sunscreen."],"im":[]},{"id":"Q340","ch":"Inflammatory Dermatoses","q":"Treatment of actinic lichen planus includes","o":[["A","Benzoyl peroxide."],["B","Phototherapy."],["C","Terbinafine."],["D","Chloroquine"],["E","Crotamiton."]],"a":"D","sa":null,"pg":"62","f":[],"n":49,"e":["Chloroquine/hydroxychloroquine, antimalarials, are the treatment for actinic LP, along with sunscreen. Why the other options are wrong: A) Benzoyl peroxide: BPO is for acne. B) Phototherapy: Phototherapy worsens actinic LP. C) Terbinafine: Terbinafine is antifungal. E) Crotamiton: Crotamiton is for scabies.","Antimalarials."],"im":[]},{"id":"Q341","ch":"Inflammatory Dermatoses","q":"In lichen planus tropicus (actinic LP), the lesions","o":[["A","Respond to antimalarials"],["B","May be precancerous"],["C","Respond to PUVA therapy"],["D","Are ulcerative"],["E","Are severely itchy"]],"a":"A","sa":null,"pg":"62","f":[],"n":50,"e":["Lichen planus tropicus (actinic LP) responds to antimalarials. Allylamines and nystatin are antifungals. Why the other options are wrong: B) May be precancerous: Actinic LP is not precancerous. C) Respond to PUVA therapy: PUVA adds UV to a light-induced disease; antimalarials are used instead. D) Are ulcerative: Ulcerative lesions belong to erosive LP, not actinic LP. E) Are severely itchy: It is moderately itchy.","Antimalarials."],"im":[]},{"id":"Q342","ch":"Inflammatory Dermatoses","q":"Pityriasis rosea","o":[["A","Is a scaly erythematous disease"],["B","Is an infectious disease caused by a virus"],["C","Is commonly a recurrent disease"],["D","Usually heals in one week"],["E","Involves mainly forearms and legs"]],"a":"A","sa":null,"pg":"63","f":[],"n":51,"e":["Pityriasis rosea is a scaly erythematous papulosquamous eruption that is acute and self-limited, not a chronic or contagious disease. Why the other options are wrong: B) Is an infectious disease caused by a virus: It is not infectious. C) Is commonly a recurrent disease: It is rarely recurrent. D) Usually heals in one week: It heals in weeks. E) Involves mainly forearms and legs: It is truncal.","Scaly, rosy, self-limited."],"im":[]},{"id":"Q343","ch":"Inflammatory Dermatoses","q":"Pityriasis rosea is","o":[["A","Self-limiting."],["B","Chronic relapsing."],["C","A life threatening infection."],["D","An autoimmune disease."],["E","Caused by dermatophytes."]],"a":"A","sa":null,"pg":"63","f":[],"n":52,"e":["The rash heals spontaneously within 4-8 weeks (up to 5 months) without sequelae, so it is self-limiting. It is not chronic relapsing, autoimmune or fungal. Why the other options are wrong: B) Chronic relapsing: It is self-limited. C) A life threatening infection: It is benign. D) An autoimmune disease: It is not autoimmune. E) Caused by dermatophytes: It is not fungal.","Self-limited; recurrence rare."],"im":[]},{"id":"Q344","ch":"Inflammatory Dermatoses","q":"Pityriasis rosea is","o":[["A","Contagious with a chronic course."],["B","Contagious with a self-limited course."],["C","Non-contagious with a self-limited course."],["D","Contagious with an acute course."],["E","Non-contagious with remissions and exacerbations."]],"a":"C","sa":null,"pg":"64","f":[],"n":53,"e":["Pityriasis rosea is considered a non-contagious exanthematous reaction with a self-limiting course, so isolation is unnecessary. Why the other options are wrong: A) Contagious with a chronic course: It is non-contagious. B) Contagious with a self-limited course: It is non-contagious. D) Contagious with an acute course: It is non-contagious. E) Non-contagious with remissions and exace…: It does not relapse.","Non-infectious, self-limited."],"im":[]},{"id":"Q345","ch":"Inflammatory Dermatoses","q":"Pityriasis rosea","o":[["A","Is an infectious scaly erythematous disease."],["B","Is caused by human herpes viruses 6 & 7."],["C","Is commonly a recurrent disease."],["D","Usually heals in one week."],["E","Affects mainly forearms & lower legs."]],"a":"B","sa":null,"pg":"63","f":[],"n":54,"e":["PR is probably an exanthem related to upper respiratory viral infection with human herpes virus 6 and 7. Why the other options are wrong: A) Is an infectious scaly erythematous dise…: It is not contagious. C) Is commonly a recurrent disease: It rarely recurs. D) Usually heals in one week: It takes weeks. E) Affects mainly forearms & lower legs: It is truncal.","HHV 6 and 7."],"im":[]},{"id":"Q346","ch":"Inflammatory Dermatoses","q":"Pityriasis rosea","o":[["A","Is caused by varicella-zoster virus."],["B","Is commonly associated with burning sensation."],["C","Is usually recurrent."],["D","Has a viral aetiology related to HHV-6."],["E","Heals spontaneously after one week."]],"a":"D","sa":null,"pg":"63","f":[],"n":55,"e":["Pityriasis rosea is believed to be a viral exanthem associated with HHV-6/7, not bacterial or fungal. Why the other options are wrong: A) Is caused by varicella-zoster virus: It is not VZV. B) Is commonly associated with burning sens…: It is mildly itchy. C) Is usually recurrent: It rarely recurs. E) Heals spontaneously after one week: It takes weeks.","HHV-6."],"im":[]},{"id":"Q347","ch":"Inflammatory Dermatoses","q":"Pityriasis rosea","o":[["A","Is an infectious scaly erythematous disease."],["B","Is a viral exanthema."],["C","Is commonly a recurrent disease."],["D","Usually heals in one week."],["E","Affects mainly forearms and lower legs."]],"a":"B","sa":null,"pg":"63","f":[],"n":56,"e":["The eruption follows an upper respiratory infection and is therefore regarded as an exanthematous reaction (viral exanthem). Why the other options are wrong: A) Is an infectious scaly erythematous dise…: It is not contagious. C) Is commonly a recurrent disease: It rarely recurs. D) Usually heals in one week: It takes weeks. E) Affects mainly forearms and lower legs: It is truncal.","Viral."],"im":[]},{"id":"Q348","ch":"Inflammatory Dermatoses","q":"The causative organism of pityriasis rosea is","o":[["A","Varicella zoster virus."],["B","Human papilloma virus."],["C","Human herpes virus 6 & 7."],["D","Human herpes virus 8."],["E","Human herpes virus 1 & 2."]],"a":"C","sa":null,"pg":"63","f":[],"n":57,"e":["Human herpes viruses 6 and 7 are implicated, with recent reports of influenza and COVID-19. Why the other options are wrong: A) Varicella zoster virus: VZV causes zoster. B) Human papilloma virus: HPV causes warts. D) Human herpes virus 8: HHV-8 causes Kaposi. E) Human herpes virus 1 & 2: HSV causes vesicles.","HHV-6/7."],"im":[]},{"id":"Q349","ch":"Inflammatory Dermatoses","q":"The differential diagnosis of \"herald patch\" on the trunk is","o":[["A","Tinea capitis."],["B","Tinea corporis."],["C","Pityriasis versicolor."],["D","Tinea manuum."],["E","Tinea pedis."]],"a":"B","sa":null,"pg":null,"f":["Answer taken from key row; verify."],"n":58,"e":["A herald patch (a single annular scaly patch) mimics tinea corporis, so scraping with KOH distinguishes them. Why the other options are wrong: A) Tinea capitis: Capitis is scalp. C) Pityriasis versicolor: Versicolor is macular. D) Tinea manuum: Manuum is hands. E) Tinea pedis: Pedis is feet.","Herald patch ≈ tinea corporis."],"im":[]},{"id":"Q350","ch":"Inflammatory Dermatoses","q":"Typical distribution of the secondary eruption of pityriasis rosea is on","o":[["A","Trunk and proximal extremities."],["B","Face."],["C","Upper limbs."],["D","Lower limbs."],["E","Hands and feet."]],"a":"A","sa":null,"pg":null,"f":[],"n":59,"e":["The secondary eruption of smaller oval lesions appears on the trunk and proximal limbs in a Christmas-tree pattern along the ribs; face, palms and soles are spared. Why the other options are wrong: B) Face: Face is spared. C) Upper limbs: Upper limbs are spared distally. D) Lower limbs: Lower limbs are spared. E) Hands and feet: Hands and feet are spared.","Trunk and proximal limbs; spares face, palms, soles."],"im":[]},{"id":"Q351","ch":"Inflammatory Dermatoses","q":"The primary lesion that precedes pityriasis rosea is","o":[["A","Chicken pox."],["B","Primary herpetic gingivostomatitis."],["C","Herald patch."],["D","Stippling sign."],["E","Auspitz sign."]],"a":"C","sa":null,"pg":"63","f":[],"n":60,"e":["The herald patch, a single 2-5 cm oval scaly lesion, appears 1-2 weeks before the generalized eruption. Why the other options are wrong: A) Chicken pox: Chickenpox is a separate disease. B) Primary herpetic gingivostomatitis: Gingivostomatitis is HSV. D) Stippling sign: Stippling is DLE. E) Auspitz sign: Auspitz is psoriasis.","Herald patch first."],"im":[]},{"id":"Q352","ch":"Inflammatory Dermatoses","q":"An 18-year-old girl came to the clinic complaining of a skin rash of 10 days duration. On examination, multiple oval lesions were scattered on the trunk in a \"Christmas tree\" distribution. The primary lesion of this disease is","o":[["A","Scaly erythema"],["B","Target lesion"],["C","Stippling sign"],["D","Nodule."],["E","Herald patch"]],"a":"E","sa":null,"pg":"63","f":[],"n":61,"e":["The primary lesion of PR is the herald patch, with an outer erythematous zone and an inner collarette of scales. Why the other options are wrong: A) Scaly erythema: Scaly erythema is not specific. B) Target lesion: Target is EM. C) Stippling sign: Stippling is DLE. D) Nodule: A nodule is not primary.","Collarette scale."],"im":[]},{"id":"Q353","ch":"Inflammatory Dermatoses","q":"The following diseases show scales EXCEPT","o":[["A","Lichen planus"],["B","Alopecia areata"],["C","Lupus erythematosus"],["D","Pityriasis rosea"],["E","Pityriasis versicolor"]],"a":"B","sa":null,"pg":"94","f":[],"n":62,"e":["Scaly conditions include psoriasis, PR, tinea and seborrheic dermatitis; alopecia areata is non-scaly with smooth bald skin. Why the other options are wrong: A) Lichen planus: LP has scale. C) Lupus erythematosus: Lupus has scale. D) Pityriasis rosea: PR has scale. E) Pityriasis versicolor: Versicolor has scale.","AA: smooth, non-scaly."],"im":[]},{"id":"Q354","ch":"Inflammatory Dermatoses","q":"What disorder is characterized by an initial herald patch, followed by scaly erythematous lesions on the trunk in a \"Christmas tree\" distribution?","o":[["A","Pityriasis rosea."],["B","Herpes simplex"],["C","Herpes zoster."],["D","Erysipelas."],["E","Molluscum contagiosum."]],"a":"A","sa":null,"pg":"63","f":[],"n":63,"e":["A herald patch followed by crops of scaly lesions on the trunk in a Christmas-tree pattern is pityriasis rosea. Why the other options are wrong: B) Herpes simplex: HSV is vesicular. C) Herpes zoster: Zoster is dermatomal. D) Erysipelas: Erysipelas is hot. E) Molluscum contagiosum: Molluscum is umbilicated.","Herald → Christmas tree."],"im":[]},{"id":"Q355","ch":"Inflammatory Dermatoses","q":"A 17-year-old girl noted a 2-cm annular pink, scaly lesion on her back. Over the next 2 weeks she developed several smaller oval pink lesions with a fine collarette of scales. They seem to run in the body folds and mainly involve the trunk, although a few occur on the upper arms and thighs. What is the most likely diagnosis?","o":[["A","Tinea versicolor."],["B","Psoriasis."],["C","Lichen planus"],["D","Pityriasis rosea"],["E","Tinea circinata."]],"a":"D","sa":null,"pg":"63","f":[],"n":64,"e":["A 2 cm annular scaly lesion, then similar smaller lesions two weeks later along the ribs, is pityriasis rosea. Why the other options are wrong: A) Tinea versicolor: Versicolor is macular. B) Psoriasis: Psoriasis is silvery. C) Lichen planus: LP is violaceous. E) Tinea circinata: Circinata has no herald.","Initial annular lesion."],"im":[]},{"id":"Q356","ch":"Inflammatory Dermatoses","q":"The primary lesion of pityriasis rosea is","o":[["A","Patch"],["B","Plaque"],["C","Vesicle"],["D","Pustule"],["E","Nodule"]],"a":"A","sa":null,"pg":"63","f":[],"n":65,"e":["The first lesion is a 'patch' (herald patch), 2-5 cm, oval with a collarette of scales; this is what the question calls the primary lesion. Why the other options are wrong: B) Plaque: It is not a plaque. C) Vesicle: It is not a vesicle. D) Pustule: It is not a pustule. E) Nodule: It is not a nodule.","Herald patch = single large patch."],"im":[]},{"id":"Q357","ch":"Inflammatory Dermatoses","q":"Herald patch is the primary lesion of","o":[["A","Psoriasis"],["B","Lichen planus"],["C","Pityriasis rosea"],["D","Atopic dermatitis"],["E","Scabies"]],"a":"C","sa":null,"pg":"63","f":[],"n":66,"e":["The herald patch is the first lesion of pityriasis rosea: a single 2-5 cm oval scaly lesion with a collarette of scales. Why the other options are wrong: A) Psoriasis: Psoriasis has plaques. B) Lichen planus: LP has papules. D) Atopic dermatitis: Atopic has flexural lesions. E) Scabies: Scabies has burrows.","Herald → PR."],"im":[]},{"id":"Q358","ch":"Inflammatory Dermatoses","q":"Treatment of pityriasis rosea includes","o":[["A","Isolation."],["B","Reassurance."],["C","Cytotoxic drugs."],["D","Intralesional steroids."],["E","Topical antibiotics."]],"a":"B","sa":null,"pg":"64","f":[],"n":67,"e":["Treatment is mainly reassurance that the eruption is non-infectious and self-limited, with emollients; no isolation or cytotoxic drugs are needed. Why the other options are wrong: A) Isolation: Not contagious. C) Cytotoxic drugs: Not needed. D) Intralesional steroids: Not needed. E) Topical antibiotics: It is not bacterial.","Reassure."],"im":[]},{"id":"Q359","ch":"Inflammatory Dermatoses","q":"Treatment of pityriasis rosea includes","o":[["A","Isolation"],["B","Topical antibiotics"],["C","Intralesional steroids"],["D","Topical steroids"],["E","Cytotoxic drugs"]],"a":"D","sa":null,"pg":"64","f":[],"n":68,"e":["Mild topical corticosteroids (and emollients) relieve itching in pityriasis rosea; antihistamines can be added. Why the other options are wrong: A) Isolation: Not contagious. B) Topical antibiotics: It is not bacterial. C) Intralesional steroids: Not needed. E) Cytotoxic drugs: Not needed.","Mild steroid for itch."],"im":[]},{"id":"Q360","ch":"Inflammatory Dermatoses","q":"The following disease is NOT contagious","o":[["A","Scabies."],["B","Pediculosis capitis."],["C","Ecthyma."],["D","Leprosy."],["E","Discoid lupus erythematosus."]],"a":"E","sa":null,"pg":"65","f":[],"n":69,"e":["DLE is an autoimmune skin disease and cannot be transmitted, unlike scabies, tinea or impetigo. Why the other options are wrong: A) Scabies: Scabies is contagious. B) Pediculosis capitis: Lice are contagious. C) Ecthyma: Ecthyma is contagious. D) Leprosy: Leprosy is contagious.","Autoimmune."],"im":[]},{"id":"Q361","ch":"Inflammatory Dermatoses","q":"Stippling means","o":[["A","Dilated capillaries."],["B","Dilated pilosebaceous orifices."],["C","Atrophy."],["D","Scarring."],["E","Telangiectasia."]],"a":"B","sa":null,"pg":"65","f":[],"n":70,"e":["Stippling is the appearance of dilated pilosebaceous orifices filled with keratin plugs, seen in DLE as follicular plugging. Why the other options are wrong: A) Dilated capillaries: That is telangiectasia. C) Atrophy: That is atrophy. D) Scarring: That is scarring. E) Telangiectasia: That is telangiectasia.","Stippling = DLE."],"im":[]},{"id":"Q362","ch":"Inflammatory Dermatoses","q":"A 25 years old female patient presenting with well-defined erythematous plaques on the face with adherent scales, telangiectasia, stippling & atrophy is suffering from","o":[["A","Psoriasis."],["B","Discoid lupus erythematosus."],["C","Lichen planus."],["D","Seborrheic dermatitis."],["E","None of the above."]],"a":"B","sa":null,"pg":"65","f":[],"n":71,"e":["Well-defined plaques with adherent scales, telangiectasia, stippling and atrophy on the face are the five cardinal signs of DLE. Why the other options are wrong: A) Psoriasis: Psoriasis has silvery scale. C) Lichen planus: LP is violaceous. D) Seborrheic dermatitis: Seb derm is greasy. E) None of the above: DLE is correct.","Erythema, telangiectasia, scaling, stippling, scarring."],"im":[]},{"id":"Q363","ch":"Inflammatory Dermatoses","q":"Stippling sign is present in","o":[["A","Lichen planus."],["B","Psoriasis."],["C","Lupus erythematosus."],["D","Pityriasis rosea."],["E","Vitiligo."]],"a":"C","sa":null,"pg":"65","f":[],"n":72,"e":["The stippling sign (dilated follicular orifices with keratotic plugs) is a hallmark of lupus erythematosus, i.e. DLE. Why the other options are wrong: A) Lichen planus: LP has striae. B) Psoriasis: Psoriasis has Auspitz. D) Pityriasis rosea: PR has collarette. E) Vitiligo: Vitiligo is depigmented.","Stippling."],"im":[]},{"id":"Q364","ch":"Inflammatory Dermatoses","q":"The clinical picture of discoid lupus erythematosus is","o":[["A","Well-defined erythematous plaques covered with adherent scales."],["B","ill-defined erythematous plaques covered with adherent scales."],["C","ill-defined erythematous plaques covered with loose scales."],["D","Well-defined erythematous patches covered with adherent scales."],["E","Well-defined erythematous patches covered with loose scales."]],"a":"A","sa":null,"pg":"65","f":[],"n":73,"e":["DLE shows well-defined erythematous plaques covered with adherent scales, while the underlying orifices are dilated. Why the other options are wrong: B) ill-defined erythematous plaques covered…: It is well defined. C) ill-defined erythematous plaques covered…: It is well defined. D) Well-defined erythematous patches covere…: They are plaques. E) Well-defined erythematous patches covere…: They are plaques.","Adherent scales, well-defined."],"im":[]},{"id":"Q365","ch":"Inflammatory Dermatoses","q":"A 32-year-old male patient presented with well-defined scaly erythematous plaques on his cheeks and nose with telangiectasia and atrophy. Plaques also showed dilatation of the pilosebaceous orifices. The condition started about five years ago and showed remissions and exacerbations with some improvement during winter times. (Clinical photo: erythematous scaly atrophic plaques on the cheek and nose.) What is the diagnosis of this case?","o":[["A","Discoid lupus."],["B","Contact urticaria."],["C","Contact dermatitis."],["D","Psoriasis."],["E","Vitiligo."]],"a":"A","sa":null,"pg":"65","f":[],"n":74,"e":["Scaly erythematous plaques with telangiectasia and atrophy in sun-exposed areas are discoid lupus. Why the other options are wrong: B) Contact urticaria: Urticaria has wheals. C) Contact dermatitis: Contact dermatitis is itchy. D) Psoriasis: Psoriasis has silvery scale. E) Vitiligo: Vitiligo is depigmented.","DLE."],"im":[]},{"id":"Q366","ch":"Inflammatory Dermatoses","q":"Scalp involvement is typical of the following dermatological disorder","o":[["A","Discoid lupus erythematosus"],["B","Scabies"],["C","Ecthyma."],["D","Pityriasis rosea."],["E","Erythrasma."]],"a":"A","sa":null,"pg":"65","f":[],"n":75,"e":["DLE typically involves the scalp and ends in permanent cicatricial alopecia. Why the other options are wrong: B) Scabies: Scabies spares the scalp. C) Ecthyma: Ecthyma is on legs. D) Pityriasis rosea: PR is truncal. E) Erythrasma: Erythrasma is in folds.","DLE scarring alopecia."],"im":[]},{"id":"Q367","ch":"Inflammatory Dermatoses","q":"All of the following are signs of discoid lupus erythematosus EXCEPT","o":[["A","Erythema."],["B","Telangiectasia."],["C","Stippling."],["D","Scarring."],["E","Pustulation."]],"a":"E","sa":null,"pg":"65","f":[],"n":76,"e":["Erythema, telangiectasia, stippling and scarring are DLE signs. Pustulation is not. Why the other options are wrong: A) Erythema: A sign. B) Telangiectasia: A sign. C) Stippling: A sign. D) Scarring: A sign.","No pustules."],"im":[]},{"id":"Q368","ch":"Inflammatory Dermatoses","q":"Regarding discoid lupus erythematosus:","o":[["A","It involves mainly upper and lower limbs."],["B","Telangiectasia is one of its cardinal signs."],["C","It is a multisystem connective tissue disease."],["D","It heals without scarring."],["E","Phototherapy is the first line of treatment."]],"a":"B","sa":null,"pg":"65","f":[],"n":77,"e":["Telangiectasia at the borders is one of the five cardinal signs of DLE; DLE is confined to skin rather than multisystem, and it heals with scarring. Why the other options are wrong: A) It involves mainly upper and lower limbs: It involves the face. C) It is a multisystem connective tissue di…: DLE is cutaneous. D) It heals without scarring: It heals with scarring. E) Phototherapy is the first line of treatm…: Antimalarials are used.","Cardinal signs include telangiectasia."],"im":[]},{"id":"Q369","ch":"Inflammatory Dermatoses","q":"The following findings are characteristic of discoid lupus erythematosus EXCEPT","o":[["A","Erythema."],["B","Adherent scales."],["C","Dilated pilosebaceous orifices."],["D","Pustules."],["E","Telangiectasia."]],"a":"D","sa":null,"pg":"65","f":[],"n":78,"e":["Pustules are not a feature of DLE; they occur in pustular psoriasis or acne. Why the other options are wrong: A) Erythema: Characteristic. B) Adherent scales: Characteristic. C) Dilated pilosebaceous orifices: Characteristic. E) Telangiectasia: Characteristic.","No pustules in DLE."],"im":[]},{"id":"Q370","ch":"Inflammatory Dermatoses","q":"One of the cardinal signs of discoid lupus erythematosus is","o":[["A","Hypopigmentation"],["B","Comedones"],["C","Pustules"],["D","Ulcer formation"],["E","Telangiectasia"]],"a":"E","sa":null,"pg":"65","f":[],"n":79,"e":["Telangiectasia is one of the five cardinal signs of DLE: erythema, telangiectasia, scaling, stippling, scarring. Why the other options are wrong: A) Hypopigmentation: DLE leaves hypo and hyperpigmentation. B) Comedones: Comedones are acne. C) Pustules: P
