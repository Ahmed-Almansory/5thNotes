nic inflammatory disorder of the pilosebaceous unit (hair follicle plus sebaceous gland), not of sweat glands.", "Pilosebaceous."]}, {"id": "Q502", "ch": "Acne Vulgaris", "q": "Acne vulgaris is due to involvement of", "o": [["A", "Sebaceous glands."], ["B", "Eccrine glands."], ["C", "Pilosebaceous glands."], ["D", "Apocrine glands."], ["E", "Sweat glands."]], "a": "C", "sa": null, "pg": null, "f": [], "s": "B", "n": 2, "e": ["Acne arises in the pilosebaceous glands of the face, chest and back, where sebum production is under androgen control.", "Face, chest, back."]}, {"id": "Q503", "ch": "Acne Vulgaris", "q": "Acne vulgaris", "o": [["A", "Is cured by topical steroids."], ["B", "Is an infectious disease."], ["C", "Causes itching that increases at night."], ["D", "Is a disease of the pilosebaceous unit."], ["E", "Is characterized by vesicle formation."]], "a": "D", "sa": null, "pg": "96", "f": [], "s": "B", "n": 3, "e": ["Acne is a disease of the pilosebaceous unit, involving follicular keratinization, sebum and Cutibacterium acnes.", "3 factors."]}, {"id": "Q504", "ch": "Acne Vulgaris", "q": "Acne vulgaris is", "o": [["A", "A superficial streptococcal infection."], ["B", "A human papilloma viral infection."], ["C", "Best treated by systemic steroids."], ["D", "May affect palms and soles."], ["E", "A disease of pilosebaceous follicles."]], "a": "E", "sa": null, "pg": null, "f": [], "s": "B", "n": 4, "e": ["Acne is a disease of the pilosebaceous follicles, with retained keratinocytes blocking the follicle opening and sebum accumulating.", "Follicle."]}, {"id": "Q505", "ch": "Acne Vulgaris", "q": "Regarding acne vulgaris, choose the correct answer", "o": [["A", "Staphylococcus aureus is involved in the pathogenesis."], ["B", "An infectious disease."], ["C", "A chronic inflammation of the pilosebaceous units."], ["D", "Treated by topical and systemic steroids."], ["E", "Clinical lesions include papules, vesicles, nodules and cysts."]], "a": "C", "sa": null, "pg": "96", "f": [], "s": "B", "n": 5, "e": ["Acne is chronic inflammation of the pilosebaceous units; it is not an infection, not treated with steroids and has no vesicles.", "Chronic inflammation."]}, {"id": "Q506", "ch": "Acne Vulgaris", "q": "Which of the following is true about acne vulgaris?", "o": [["A", "It is an infectious disease."], ["B", "Lesions include comedones, papules, vesicles and nodulocysts."], ["C", "Chronic inflammation of the pilosebaceous unit."], ["D", "There is colonization of pilosebaceous units by Streptococcus acnes."]], "a": "C", "sa": null, "pg": "96", "f": [], "s": "B", "n": 6, "e": ["Chronic inflammation of the pilosebaceous unit with retained keratinocytes blocking the follicle is the correct description.", "Not infectious."]}, {"id": "Q507", "ch": "Acne Vulgaris", "q": "The following disease is NOT contagious", "o": [["A", "Scabies."], ["B", "Pediculosis capitis."], ["C", "Ecthyma."], ["D", "Leprosy."], ["E", "Acne."]], "a": "E", "sa": null, "pg": "96", "f": [], "s": "B", "n": 7, "e": ["Acne is not contagious: it results from follicular keratinization, androgens and bacterial colonization (commensal C. acnes).", "Not contagious."]}, {"id": "Q508", "ch": "Acne Vulgaris", "q": "Acne vulgaris is:", "o": [["A", "A disease of the pilosebaceous apparatus."], ["B", "A disease which commonly affects the face."], ["C", "A disease which can be treated by oral tetracyclines."], ["D", "All of the above."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": "96", "f": [], "s": "B", "n": 8, "e": ["Acne is a chronic inflammatory disease of pilosebaceous units seen in adolescence and involving face, chest and back, so all of the above.", "All."]}, {"id": "Q509", "ch": "Acne Vulgaris", "q": "Acne vulgaris:", "o": [["A", "May affect palms and soles."], ["B", "Is a disease of sweat glands."], ["C", "Commonly affects the scalp."], ["D", "Is a disease of adolescents."], ["E", "Causes itching which increases by night."]], "a": "D", "sa": null, "pg": "96", "f": [], "s": "B", "n": 9, "e": ["Acne vulgaris peaks in adolescence under androgen influence, although it may start or persist in adulthood. It does not affect palms and soles (no pilosebaceous units).", "Adolescents."]}, {"id": "Q510", "ch": "Acne Vulgaris", "q": "Which of the following statements about acne vulgaris is INCORRECT?", "o": [["A", "It is a disease of adolescence."], ["B", "Primary lesion is a comedone."], ["C", "Severe forms can be treated by systemic retinoids."], ["D", "It is a disease of the pilosebaceous unit."], ["E", "It is best treated by topical steroids."]], "a": "E", "sa": null, "pg": "99", "f": [], "s": "B", "n": 10, "e": ["Topical steroids worsen or cause acneiform eruptions, so 'best treated by topical steroids' is wrong. Retinoids, benzoyl peroxide and antibiotics are used.", "Steroids worsen acne."]}, {"id": "Q511", "ch": "Acne Vulgaris", "q": "In acne vulgaris,", "o": [["A", "There is loss of melanocytes."], ["B", "The sebum composition is normal."], ["C", "There is colonization of pilosebaceous units by Strep. acnes."], ["D", "Lesions include comedones, vesicles and nodulocysts."], ["E", "There is increased proliferation of keratinocytes."]], "a": "E", "sa": null, "pg": "96", "f": [], "s": "B", "n": 11, "e": ["Abnormal follicular keratinization with proliferation of keratinocytes blocks the follicle opening, forming the comedone.", "Keratin plug."]}, {"id": "Q512", "ch": "Acne Vulgaris", "q": "The following organism is related to acne vulgaris", "o": [["A", "Malassezia furfur."], ["B", "Corynebacterium minutissimum."], ["C", "Propionibacterium acnes."], ["D", "Streptococcus haemolyticus."], ["E", "Pityrosporum ovale."]], "a": "C", "sa": null, "pg": "96", "f": [], "s": "B", "n": 12, "e": ["Cutibacterium (Propionibacterium) acnes colonizes the pilosebaceous unit; Malassezia is linked to seborrheic dermatitis and Corynebacterium to erythrasma.", "P. acnes."]}, {"id": "Q513", "ch": "Acne Vulgaris", "q": "The bacteria that multiply in blocked skin pores, metabolize sebum, and can lead to the development of acne are:", "o": [["A", "Staphylococcus aureus."], ["B", "Mycobacteria."], ["C", "Corynebacterium minutissimum."], ["D", "Streptococcus pyogenes."], ["E", "Propionibacterium."]], "a": "E", "sa": null, "pg": "96", "f": [], "s": "B", "n": 13, "e": ["Propionibacterium (Cutibacterium) multiplies in blocked pores and metabolizes sebum, driving inflammation.", "P. acnes."]}, {"id": "Q514", "ch": "Acne Vulgaris", "q": "Which organism in the pilosebaceous unit is involved in the pathogenesis of acne vulgaris?", "o": [], "a": null, "sa": "Cutibacterium (Propionibacterium) acnes.", "pg": "96", "f": [], "s": "B", "n": 14, "e": ["Cutibacterium acnes (formerly Propionibacterium) is the organism in acne pathogenesis.", "C. acnes."]}, {"id": "Q515", "ch": "Acne Vulgaris", "q": "In acne vulgaris", "o": [["A", "There is loss of melanocytes."], ["B", "Sebum composition is normal."], ["C", "There is colonization of pilosebaceous units by Strep. acnes."], ["D", "Lesions include comedones, vesicles & nodulocysts."], ["E", "Retinoids are used for treatment."]], "a": "E", "sa": null, "pg": "99", "f": [], "s": "B", "n": 15, "e": ["Retinoids normalize follicular keratinization and are anti-inflammatory; they are used topically and orally.", "Retinoids."]}, {"id": "Q516", "ch": "Acne Vulgaris", "q": "The following lesions are present in acne vulgaris EXCEPT", "o": [["A", "Papules."], ["B", "Comedones."], ["C", "Pustules."], ["D", "Nodules."], ["E", "Vesicles."]], "a": "E", "sa": null, "pg": "96", "f": [], "s": "B", "n": 16, "e": ["Acne lesions are comedones, papules, pustules, nodules and cysts. Vesicles are not part of acne.", "No vesicles."]}, {"id": "Q517", "ch": "Acne Vulgaris", "q": "The lesions in acne vulgaris include:", "o": [["A", "Comedones, pustules, nodules."], ["B", "Comedones, furrows, cysts."], ["C", "Papules, macules, vesicles."], ["D", "Papules, nodules, bullae."], ["E", "Pustules, vesicles, scars."]], "a": "A", "sa": null, "pg": "96", "f": [], "s": "B", "n": 17, "e": ["Acne lesions include comedones, pustules, nodules (and papules and cysts); none are vesicles.", "Polymorphic."]}, {"id": "Q518", "ch": "Acne Vulgaris", "q": "In acne vulgaris", "o": [["A", "Lesions are monomorphic, primary lesion is a comedone."], ["B", "Lesions are polymorphic, primary lesion is a cyst."], ["C", "Lesions are polymorphic, primary lesion is a comedone."], ["D", "Lesions are monomorphic, primary lesion is a pustule."], ["E", "Lesions are comedones, papules, vesicles, pustules & cysts."]], "a": "C", "sa": null, "pg": "96", "f": [], "s": "B", "n": 18, "e": ["Acne is polymorphic (many lesion types) and the primary lesion is the comedone.", "Comedone."]}, {"id": "Q519", "ch": "Acne Vulgaris", "q": "Scarring can occur as a result of", "o": [["A", "Psoriasis."], ["B", "Urticaria."], ["C", "Nodular acne."], ["D", "Actinic lichen planus."], ["E", "Erythrasma."]], "a": "C", "sa": null, "pg": "96", "f": [], "s": "B", "n": 19, "e": ["Inflammatory nodular and cystic acne destroys deep follicular tissue and scars, unlike psoriasis, urticaria or erythrasma.", "Nodulocystic scars."]}, {"id": "Q520", "ch": "Acne Vulgaris", "q": "A patient is concerned his acne will leave scarring; which lesion is more likely to cause such a complication?", "o": [["A", "Comedones."], ["B", "Papules."], ["C", "Nodulocystic lesions."], ["D", "Plaques."], ["E", "Macules. 1     A female patient, 21 years old, single, presented with facial lesions. She stated that it all started since she was 15 years old with remissions and exacerbations. Lesions exacerbated during her menstruation. Patient's face was oily. (Clinical photo: papules and pustules on the cheeks and chin.)"]], "a": "C", "sa": null, "pg": "96", "f": [], "s": "B", "n": 20, "e": ["Nodulocystic lesions, being deep inflammatory, carry the highest risk of scarring.", "Nodulocystic scars."]}, {"id": "Q521", "ch": "Acne Vulgaris", "q": "This patient suffers from", "o": [ ", "Tetracyclines."], ["D", "Androgens."], ["E", "Steroids."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 39, "e": ["Retinoids, dapsone, tetracyclines and steroids (intralesional) may be used; androgens increase sebum and worsen acne.", "Androgens worsen acne."]}, {"id": "H329", "ch": "Acne Vulgaris", "q": "Benzoyl peroxide is used in the treatment of:", "o": [["A", "Animal scabies."], ["B", "Pediculosis capitis."], ["C", "Phthirus pubis."], ["D", "Acne vulgaris"]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 40, "e": ["Benzoyl peroxide 2.5-10% is a bactericidal topical agent for acne vulgaris without bacterial resistance.", "BPO."]}, {"id": "H331", "ch": "Acne Vulgaris", "q": "In acne vulgaris:", "o": [["A", "There is loss of melanocytes."], ["B", "Benzyl benzoate is an effective topical agent."], ["C", "There is colonization of pilosebaceous units by Propionibacterium acnes."], ["D", "Lesions include comedones, pustules, vesicles and nodulocysts."], ["E", "Retinoids could be used topically or orally."]], "a": "E", "sa": null, "pg": null, "f": [], "s": "H", "n": 41, "e": ["Retinoids can be used topically for mild-moderate acne and orally for severe disease.", "Topical or oral."]}]};const $=i=>document.getElementById(i);
let cur=null,show=false,wrongOnly=false,P={},LAST=null;
try{P=JSON.parse(localStorage.getItem('derma5')||'{}')}catch(e){}
try{LAST=JSON.parse(localStorage.getItem('derma5ans')||'null')}catch(e){}
const save=()=>{try{localStorage.setItem('derma5',JSON.stringify(P))}catch(e){}};
const saveLast=(id)=>{if(!id)return;LAST={id:id};try{localStorage.setItem('derma5ans',JSON.stringify(LAST))}catch(e){}updRB()};
const clearLast=()=>{LAST=null;try{localStorage.removeItem('derma5ans')}catch(e){}updRB()};
/* Resume depends ONLY on answered progress (P + last answered id), never on scroll/view. */
function lastAnswered(){if(LAST&&P[LAST.id]&&byId(LAST.id))return byId(LAST.id);
let f=null;DB.q.forEach(q=>{if(P[q.id])f=q});return f}
function nextTarget(){const la=lastAnswered();if(!la)return {none:true};
const i=DB.q.indexOf(la);let t=DB.q.slice(i+1).find(q=>!P[q.id])||DB.q.slice(0,i).find(q=>!P[q.id]);
return t?{q:t}:{done:true}}
function toast(m){let t=$('toast');if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--teal);color:#fff;padding:14px 20px;border-radius:12px;font-weight:700;z-index:9999;box-shadow:0 4px 16px rgba(0,0,0,.3);max-width:90vw;text-align:center';document.body.appendChild(t)}
t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',4500)}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const byId=id=>DB.q.find(x=>x.id==id);
const tr=c=>{const L=c=='all'?DB.q:DB.q.filter(q=>q.ch==c);let d=0,w=0;L.forEach(q=>{const p=P[q.id];if(p){d++;if(p.r===0)w++}});return d+'/'+L.length+(w?` · <b style="color:var(--bad)">✗${w}</b>`:'')};
function updRB(){const a=!!lastAnswered();$('rb').style.display=a?'':'none';return a}
function navb(){let h=`<a data-c="home" class="${cur===null?'on':''}">⌂ Home</a><a data-c="all" class="${cur=='all'?'on':''}">All chapters <span>${tr('all')}</span></a>`;
DB.ch.forEach((c,i)=>{h+=`<a data-c="${c}" class="${cur==c?'on':''}">${i+1}. ${c} <span>${tr(c)}</span></a>`});$('nav').innerHTML=h}
function home(){const T=nextTarget();let h='';
if(T.q)h+=`<button class="resume" id="rs2">▶ Resume where I left off<small>${DB.ch.indexOf(T.q.ch)+1}. ${T.q.ch} · Question ${T.q.n}</small></button>`;
else if(T.done)h+=`<button class="resume" id="rs2">🎉 All questions answered<small>You have completed every question</small></button>`;
h+=`<div class="cards"><div class="card" data-c="all">All questions <span>${tr('all')}</span></div>`;
DB.ch.forEach((c,i)=>{h+=`<div class="card" data-c="${c}">${i+1}. ${c} <span>${tr(c)}</span></div>`});
$('home').innerHTML=`<h2>Choose a chapter</h2>`+h+'</div>';stat()}
function openView(c){cur=c;$('home').style.display=c===null?'':'none';$('view').style.display=c===null?'none':'';navb();if(c===null){home()}else{render()}}
function render(){const t=$('s').value.toLowerCase().trim();let L=DB.q.filter(q=>(cur=='all'||q.ch==cur)&&(!wrongOnly||P[q.id]&&P[q.id].r===0)&&(!t||(q.q+q.o.map(o=>o[1]).join(' ')+(q.sa||'')).toLowerCase().includes(t)));
let h='',last='';L.forEach(q=>{if(cur=='all'&&q.ch!=last){last=q.ch;h+=`<h2>${DB.ch.indexOf(q.ch)+1}. ${q.ch}</h2>`}
const p=P[q.id],rev=show||p;
h+=`<div class="q" id="q-${q.id}" data-id="${q.id}"><h3><b>${q.n}.</b> ${esc(q.q)}</h3>`;
if(q.o.length){q.o.forEach(o=>{let c='opt';if(rev&&o[0]==q.a)c+=' ok';else if(p&&p.c==o[0])c+=' bad';h+=`<button class="${c}" data-o="${o[0]}"><b>${o[0]}.</b> ${esc(o[1])}</button>`});
if(rev){h+=`<div class="ans"><span class="k">Correct answer: ${q.a||'see flag'}</span></div>`;if(q.e)h+=`<details class="ans" open><summary><b>Explanation</b></summary>${esc(q.e[0])}<div style="margin-top:6px"><b>💡 Pearl:</b> ${esc(q.e[1])}</div></details>`}}
else{h+=`<button class="opt" data-sa="1">Show model answer</button>`;if(rev){h+=`<div class="ans"><span class="k">Answer:</span> ${esc(q.sa||'—')}</div>`;if(q.e)h+=`<details class="ans" open><summary><b>Explanation</b></summary>${esc(q.e[0])}<div style="margin-top:6px"><b>💡 Pearl:</b> ${esc(q.e[1])}</div></details>`}}
q.f.forEach(f=>h+=`<div class="flag">⚑ ${f}</div>`);if(q.pg)h+=`<div class="src">Book p. ${q.pg}</div>`;h+='</div>'});
$('list').innerHTML=h||'<p>No questions match.</p>';stat()}
function stat(){navb();const ids=Object.keys(P).filter(k=>P[k].r!==undefined);const ok=ids.filter(k=>P[k].r===1).length;
$('st').textContent=`Solved ${Object.keys(P).length} of ${DB.q.length} · Correct ${ok} · Wrong ${ids.filter(k=>P[k].r===0).length}`;$('pb').style.width=100*Object.keys(P).length/DB.q.length+'%'}
function resume(){const T=nextTarget();if(T.none)return;
if(T.done){toast('🎉 You have answered all '+DB.q.length+' questions. Nothing left to resume!');return}
const q=T.q;$('s').value='';wrongOnly=false;$('wr').classList.remove('pri');openView(q.ch);
const el=$('q-'+q.id);if(el){el.scrollIntoView({block:'start'});el.classList.add('hl');setTimeout(()=>el.classList.remove('hl'),2500);window.scrollBy(0,-70)}}
$('list').onclick=e=>{const b=e.target.closest('button');if(!b)return;const id=b.closest('.q').dataset.id,q=byId(id);
if(P[id])return;
if(b.dataset.sa){P[id]={r:2};}else if(b.dataset.o){P[id]={c:b.dataset.o,r:b.dataset.o==q.a?1:0}}else return;
save();saveLast(id);const y=scrollY;render();scrollTo(0,y)};
$('nav').onclick=e=>{const a=e.target.closest('a');if(!a)return;$('nav').classList.remove('open');openView(a.dataset.c=='home'?null:a.dataset.c);scrollTo(0,0)};
$('home').onclick=e=>{if(e.target.closest('#rs2')){resume();return}const c=e.target.closest('.card');if(c){openView(c.dataset.c);scrollTo(0,0)}};
$('s').oninput=render;$('tg').onclick=()=>{show=!show;$('tg').textContent='Show answers: '+(show?'on':'off');render()};
$('wr').onclick=()=>{wrongOnly=!wrongOnly;$('wr').classList.toggle('pri',wrongOnly);render()};
$('rs').onclick=()=>{if(confirm('Reset all progress?')){P={};save();clearLast();render()}};
$('hm').onclick=()=>{openView(null);scrollTo(0,0)};$('rb').onclick=resume;
updRB();openView(null);
</script></body></html>
