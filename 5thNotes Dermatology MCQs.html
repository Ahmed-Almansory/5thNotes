ily history"], ["B", "Night itching"], ["C", "Distribution of lesions"], ["D", "All of the above"], ["E", "None of the above 3     A 4-month-old infant presented with vesicles and pustules affecting his face, palms and soles, associated with a family history of severe itching at night. (Clinical photo: papulovesicular/pustular rash on the face and vesicopustules on the sole.)"]], "a": "D", "sa": null, "pg": "44", "f": [], "s": "B", "n": 11, "e": ["Scabies is diagnosed on nocturnal pruritus, family history, lesion morphology and distribution, supported by dermoscopy; so all of the above.", "All clues."]}, {"id": "Q266", "ch": "Parasitic Infestations", "q": "The most likely diagnosis is", "o": [["A", "Disseminated candidiasis"], ["B", "Pediculosis corporis"], ["C", "Tinea corporis"], ["D", "Scabies"], ["E", "Tuberculoid leprosy 2     A 4-month-old infant presented with vesicles and pustules affecting his face, palms and soles, associated with a family history of severe itching at night. (Clinical photo: papulovesicular/pustular rash on the face and vesicopustules on the sole.)"]], "a": "D", "sa": null, "pg": "44", "f": [], "s": "B", "n": 12, "e": ["The picture of burrows and papules in typical sites with itching and family history is scabies.", "Typical scabies."]}, {"id": "Q267", "ch": "Parasitic Infestations", "q": "This condition is treated by", "o": [["A", "Radiotherapy"], ["B", "Topical permethrin"], ["C", "Topical corticosteroids"], ["D", "Systemic antifungals"], ["E", "Systemic isotretinoin"]], "a": "B", "sa": null, "pg": "46", "f": [], "s": "B", "n": 13, "e": ["Scabies is treated with topical permethrin 5% (safe for infants over 2 months and pregnancy), applied to the whole skin, repeated after a week, and treating contacts.", "Permethrin 5%."]}, {"id": "Q268", "ch": "Parasitic Infestations", "q": "A 6-month-old infant had itchy erythematous papules and exudative lesions on the scalp, face and back for one month with vesicular lesions on the palms. The most likely diagnosis is", "o": [["A", "Atopic dermatitis"], ["B", "Scabies"], ["C", "Seborrheic dermatitis"], ["D", "Psoriasis"], ["E", "Discoid lupus erythematosus"]], "a": "B", "sa": null, "pg": "44", "f": [], "s": "B", "n": 14, "e": ["An infant with itchy papules, exudation and palm vesicles has scabies, which affects palms and soles in infants.", "Infants: palms, soles."]}, {"id": "Q269", "ch": "Parasitic Infestations", "q": "A male baby, 9 months old, was brought by his mother with papules, pustules, scratch marks and impetigo involving his face, trunk, genitalia, palms and soles. His mother reported insomnia and crying most of the day, and gave a history of night itching. What is the diagnosis?", "o": [["A", "Seborrheic dermatitis"], ["B", "Scabies"], ["C", "Tinea corporis"], ["D", "Lichen planus"], ["E", "Psoriasis"]], "a": "B", "sa": null, "pg": "44", "f": [], "s": "B", "n": 15, "e": ["An infant with papules, pustules, scratch marks and impetiginization has scabies.", "Infant scabies."]}, {"id": "Q270", "ch": "Parasitic Infestations", "q": "A 2-year-old infant had linear pruritic lesions involving the head, neck, palms and soles of one week duration. His mother had a similar condition 4 weeks ago involving her wrists, abdomen and breast. The most likely diagnosis is", "o": [["A", "Atopic dermatitis"], ["B", "Scabies"], ["C", "Tinea corporis"], ["D", "Lichen planus"], ["E", "Psoriasis"]], "a": "B", "sa": null, "pg": "44", "f": [], "s": "B", "n": 16, "e": ["Linear pruritic lesions of head, neck, palms and soles in an infant indicate scabies.", "Palms/soles."]}, {"id": "Q271", "ch": "Parasitic Infestations", "q": "A male with intensely pruritic nodules on the scrotum for 2 months, with a past history of scabies treated with anti-scabietic treatment, is suffering from", "o": [["A", "Nodular scabies"], ["B", "Animal scabies"], ["C", "Phthirus pubis"], ["D", "Pediculosis corporis"], ["E", "Lepromatous leprosy"]], "a": "A", "sa": null, "pg": "44", "f": [], "s": "B", "n": 17, "e": ["Itchy scrotal nodules after treated scabies are post-scabietic nodular scabies.", "Scrotum."]}, {"id": "Q272", "ch": "Parasitic Infestations", "q": "A 28-year-old male presented with intensely pruritic nodules on the scrotum for 2 months and a past history of scabies. A suitable treatment for such lesions is", "o": [["A", "Phototherapy"], ["B", "Radiotherapy"], ["C", "Electrocautery"], ["D", "Podophyllin resin"], ["E", "Intralesional corticosteroids"]], "a": "E", "sa": null, "pg": "44", "f": [], "s": "B", "n": 18, "e": ["Post-scabietic nodules are a hypersensitivity reaction that persists for weeks to months after treatment; they are treated with intralesional corticosteroids rather than more scabicide.", "Intralesional steroid."]}, {"id": "Q273", "ch": "Parasitic Infestations", "q": "Post-scabietic nodules", "o": [["A", "Never cause itching"], ["B", "Are usually located on the back"], ["C", "Are best treated by antibiotics"], ["D", "All of the above"], ["E", "None of the above"]], "a": "E", "sa": null, "pg": "44", "f": [], "s": "B", "n": 19, "e": ["The proposed statements are incorrect; they represent a hypersensitivity reaction, common on the scrotum and itchy.", "Nodules ≠ parasites."]}, {"id": "Q274", "ch": "Parasitic Infestations", "q": "Post-scabietic nodules", "o": [["A", "Represent a hypersensitivity reaction to parasites"], ["B", "Present commonly on the scrotum"], ["C", "Cause severe itching"], ["D", "All of the above"], ["E", "None of the above"]], "a": "D", "sa": null, "pg": "44", "f": [], "s": "B", "n": 20, "e": ["Post-scabietic nodules are a hypersensitivity reaction, common on the scrotum, and itchy; all of the above.", "Hypersensitivity."]}, {"id": "Q275", "ch": "Parasitic Infestations", "q": "Animal scabies is characterized by all of the following EXCEPT", "o": [["A", "Short incubation period"], ["B", "Absence of burrows"], ["C", "Being self-limited"], ["D", "Transmitted from human to human"], ["E", "Urticarial lesions"]], "a": "D", "sa": null, "pg": "45", "f": [], "s": "B", "n": 21, "e": ["Animal scabies is not transmitted from human to human (so there is no burrow), has a short incubation, and is self-limiting once the animal is avoided.", "Not human-to-human."]}, {"id": "Q276", "ch": "Parasitic Infestations", "q": "Animal scabies is characterized by", "o": [["A", "Absence of burrows"], ["B", "Being self-limited and of short duration"], ["C", "Being more extensive"], ["D", "All of the above"]], "a": "D", "sa": null, "pg": "45", "f": [], "s": "B", "n": 22, "e": ["Animal scabies has a short incubation, no burrows, is self-limited and urticarial.", "Pet scabies."]}, {"id": "Q277", "ch": "Parasitic Infestations", "q": "As regards treatment of human scabies", "o": [["A", "Oral antihelminthics are the treatment of choice"], ["B", "Gamma benzene hexachloride is a safe topical preparation"], ["C", "Permethrin is safe in pregnancy"], ["D", "Topical benzoyl peroxide may be used in treatment"], ["E", "Crotamiton is the most effective topical application"]], "a": "C", "sa": null, "pg": "46", "f": [], "s": "B", "n": 23, "e": ["Permethrin 5% is safe in pregnancy, breast-feeding and infants over 2 months, whereas gamma-hexachlorocyclohexane is contraindicated and oral antihelminthics are not first line.", "Permethrin safe."]}, {"id": "Q278", "ch": "Parasitic Infestations", "q": "As regards treatment of scabies", "o": [["A", "Oral antihelminthics are the treatment of choice"], ["B", "Gamma benzene hexachloride is a safe topical preparation"], ["C", "All family members should be treated"], ["D", "Topical benzoyl peroxide may be used in treatment"], ["E", "Crotamiton is the most effective topical application"]], "a": "C", "sa": null, "pg": "45", "f": [], "s": "B", "n": 24, "e": ["Treatment should include the patient and all close contacts, even if they have no itching, because early cases may be asymptomatic carriers.", "Treat contacts."]}, {"id": "Q279", "ch": "Parasitic Infestations", "q": "A young man presented with intense nocturnal itching. Examination revealed papules and burrows in finger webs, wrists and genital area. The following is a therapeutic topical option:", "o": [["A", "Steroid"], ["B", "Calcipotriol"], ["C", "Benzoyl peroxide 2.5-10%"], ["D", "Terbinafine"], ["E", "Permethrin 5%"]], "a": "E", "sa": null, "pg": "46", "f": [], "s": "B", "n": 25, "e": ["Nocturnal itch with burrows in finger webs is scabies treated with permethrin 5%.", "Permethrin 5%."]}, {"id": "Q280", "ch": "Parasitic Infestations", "q": "The following is used for the treatment of scabies", "o": [["A", "Benzyl benzoate"], ["B", "Benzoyl peroxide"], ["C", "Dapsone"], ["D", "Tetracyclines"], ["E", "Psoralen"]], "a": "A", "sa": null, "pg": "46", "f": [], "s": "B", "n": 26, "e": ["Benzyl benzoate (10-25%) is an acaricide used for scabies, along with permethrin, sulphur, crotamiton and ivermectin.", "Benzyl benzoate."]}, {"id": "Q281", "ch": "Parasitic Infestations", "q": "All the following are used in the treatment of scabies EXCEPT:", "o": [["A", "Sulphur precipitate 5-10%"], ["B", "Permethrin 5%"], ["C", "Benzoyl peroxide 2.5-10%"], ["D", "Crotamiton 10%"], ["E", "Benzyl benzoate 25%"]], "a": "C", "sa": null, "pg": "46", "f": [], "s": "B", "n": 27, "e": ["Scabies is treated by sulphur, permethrin, crotamiton, benzyl benzoate or ivermectin; benzoyl peroxide is an acne drug.", "BPO = acne."]}, {"id": "Q282", "ch": "Parasitic Infestations", "q": "Pediculosis capitis is an example of", "o": [["A", "Cutaneous viral infection"], ["B", "Cutaneous fungal infection"], ["C", "Cutaneous bacterial infection"], ["D", "Cutaneous parasitic infection"], ["E", "Cutaneous mycobacterial infection"]], "a": "D", "sa": null, "pg": "47", "f": [], "s": "B", "n": 28, "e": ["Pediculosis capitis is a cutaneous parasitic infestation by Pediculus humanus capitis, a blood-sucking louse.", "Lice = parasitic."]}, {"id": "Q283", "ch": "Parasitic Infestations", "q": "Pediculosis capitis", "o": [["A", "Is transmitted by hats"], ["B", "Is treated by acyclovir"], ["C", "Does not present with pruritus"], ["D", "Can affect the pubic area"], ["E", "None of the above 1     Mother of a 9-year-old girl complains of severe itching of her daughter's scalp for two weeks. On examination, firmly attached white flakes were observed. Her younger sister has the same condition. (Clinical photo: scalp hair with lice and nits.)"]], "a": "A", "sa": null, "pg": "48", "f": [], "s": "B", "n": 29, "e": ["Head lice spread by head-to-head contact and indirectly via combs, brushes, hats and helmets.", "Hats."]}, {"id": "Q284", "ch": "Parasitic Infestations", "q": "The most likely diagnosis is", "o": [["A", "Seborrheic dermatitis"], ["B", "Tinea capitis"], ["C", "Pediculosis capitis"], ["D", "Favus"], ["E", "Alopecia areata"]], "a": "C", "sa": null, "pg": "49", "f": [], "s": "B", "n": 30, "e": ["Itchy scalp with excoriations, adult lice and nits firmly attached to hairs is pediculosis capitis.", "Nits on hair."]}, {"id": "Q285", "ch": "Parasitic Infestations", "q": "The following is characteristic of pediculosis capitis", "o": [["A", "White patches"], ["B", "Flat-topped papules"], ["C", "Nocturnal itching"], ["D", "Nits cemented to the hairs"], ["E", "Painful nodules"]], "a": "D", "sa": null, "pg": "49", "f": [], "s": "B", "n": 31, "e": ["Nits are eggs cemented to the hair shaft near the scalp, which distinguishes them from dandruff; this is characteristic of head lice.", "Cemented nits."]}, {"id": "Q286", "ch": "Parasitic Infestations", "q": "Pediculosis capitis is treated by topical:", "o": [["A", "Acyclovir"], ["B", "Corticosteroids"], ["C", "Retinoids"], ["D", "Permethrin"], ["E", "Azoles"]], "a": "D", "sa": null, "pg": "51", "f": [], "s": "B", "n": 32, "e": ["Pediculosis capitis is treated with topical permethrin 5% (or malathion, dimethicone), repeated after a week since eggs are not killed.", "Permethrin."]}, {"id": "Q287", "ch": "Parasitic Infestations", "q": "The following is used for treatment of pediculosis capitis", "o": [["A", "Topical steroids"], ["B", "Malathion 0.5% lotion"], ["C", "Ketoconazole cream"], ["D", "Topical vitamin D"], ["E", "Emollients"]], "a": "B", "sa": null, "pg": "51", "f": [], "s": "B", "n": 33, "e": ["Malathion 0.5% lotion is used for head lice in children over 6 years and in pregnancy.", "Malathion."]}, {"id": "Q288", "ch": "Parasitic Infestations", "q": "A child with pruritic scalp, excoriations and firmly attached nits. The following is a good treatment option:", "o": [["A", "Oral griseofulvin"], ["B", "Podophyllin resin 10-25%"], ["C", "Oral nystatin"], ["D", "Topical selenium sulphide"], ["E", "Topical ivermectin 0.5%"]], "a": "E", "sa": null, "pg": "51", "f": [], "s": "B", "n": 34, "e": ["Pruritic scalp with firmly attached nits is head lice; topical ivermectin 0.5% is a treatment option. Griseofulvin and nystatin are antifungals, and podophyllin is for warts.", "Ivermectin 0.5%."]}, {"id": "Q289", "ch": "Parasitic Infestations", "q": "Phthirus pubis", "o": [["A", "Is not itchy"], ["B", "May be sexually transmitted"], ["C", "Is treated by terbinafine"], ["D", "Involves the scalp and back"], ["E", "Is a protozoal infection"]], "a": "B", "sa": null, "pg": "48", "f": [], "s": "B", "n": 35, "e": ["Phthirus pubis (pubic louse) spreads by close physical contact and sexual contact in young adults.", "Sexually transmissible."]}, {"id": "Q290", "ch": "Parasitic Infestations", "q": "Lice infestation of the eyelashes is caused by:", "o": [["A", "Pediculus humanus corporis"], ["B", "Pediculus humanus capitis"], ["C", "Phthirus pubis"], ["D", "Sarcoptes scabiei"], ["E", "Demodex folliculorum 1     A male baby, 9 months old, was brought by his mother presenting with papules, pustules, eczematous rashes, scratch marks and impetigo involving his face, trunk, genitalia, palms and soles. His mother reported that he suffered from insomnia in addition to irritability most of his day. Family history of pruritus was positive."]], "a": "C", "sa": null, "pg": "49", "f": [], "s": "B", "n": 36, "e": ["Pubic lice (Phthirus pubis) can infest the eyelashes, along with the pubic area, lower abdomen and thighs.", "Eyelash lice."]}, {"id": "Q291", "ch": "Parasitic Infestations", "q": "What is the diagnosis?", "o": [["A", "Atopic dermatitis."], ["B", "Scabies."], ["C", "Tinea corporis."], ["D", "Lichen planus."], ["E", "Psoriasis."]], "a": "B", "sa": null, "pg": "44", "f": [], "s": "B", "n": 37, "e": ["Burrows and nocturnal itching in typical distribution are scabies.", "Scabies."]}, {"id": "H162", "ch": "Parasitic Infestations", "q": "Infant with vesicles and pustules on face, palm and soles. There is family history of itching at night:", "o": [["A", "Pediculosis pubis"], ["B", "Tinea corporis"], ["C", "Scabies"]], "a": "C", "sa": null, "pg": null, "f": [], "s": "H", "n": 38, "e": ["An infant with vesicles on face, palms and soles and family night itching has scabies.", "Family itch."]}, {"id": "H163", "ch": "Parasitic Infestations", "q": "Adult scabies can affect the following sites EXCEPT:", "o": [["A", "Flexures."], ["B", "Wrist."], ["C", "Upper back."], ["D", "Buttocks."], ["E", "Genitalia."]], "a": "C", "sa": null, "pg": null, "f": [], "s": "H", "n": 39, "e": ["Adult scabies spares the head, neck and upper back, but involves flexures, wrists, buttocks and genitalia.", "Upper back spared."]}, {"id": "H165", "ch": "Parasitic Infestations", "q": "Lice infestation of the eyelashes is caused by:", "o": [["A", "Pediculus humanus corporis."], ["B", "Pediculus humanus capitis."], ["C", "Phthirus pubis."], ["D", "Sarcoptes scabiei."], ["E", "Demodex folliculorum."]], "a": "C", "sa": null, "pg": null, "f": [], "s": "H", "n": 40, "e": ["Eyelash infestation is typical of the pubic louse Phthirus pubis; head lice infest scalp hair.", "Eyelashes: pubic lice."]}, {"id": "H168", "ch": "Parasitic Infestations", "q": "Pediculosis capitis may be treated by:", "o": [["A", "3% acetic acid."], ["B", "Gamma benzene hexachloride."], ["C", "Permethrin."], ["D", "All of the above."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 41, "e": ["Head lice may be treated with acetic acid, gamma benzene hexachloride or permethrin.", "All of the above."]}, {"id": "H173", "ch": "Parasitic Infestations", "q": "Pediculosis capitis:", "o": [["A", "Is transmitted by hats."], ["B", "Is treated by acyclovir."], ["C", "Does not present by pruritus."], ["D", "Can affect the pubic area."], ["E", "None of the above."]], "a": "A", "sa": null, "pg": null, "f": [], "s": "H", "n": 42, "e": ["Head lice spread via hats, combs and brushes; they are treated with permethrin, malathion or ivermectin, not acyclovir, and they cause itching.", "Fomites."]}, {"id": "H176", "ch": "Parasitic Infestations", "q": "The following may help in the diagnosis of scabies:", "o": [["A", "Positive family history."], ["B", "Night itching."], ["C", "Distribution of lesions."], ["D", "All of the above."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 43, "e": ["Family history, night itching and lesion distribution all help diagnose scabies.", "All of the above."]}, {"id": "Q292", "ch": "Inflammatory Dermatoses", "q": "All are true about psoriasis EXCEPT", "o": [["A", "Nail changes could occur"], ["B", "Has an extensor distribution"], ["C", "Occurs in children"], ["D", "Is a contagious disease"], ["E", "Could be associated with arthritis"]], "a": "D", "sa": null, "pg": "52", "f": [], "s": "B", "n": 1, "e": ["Psoriasis is a chronic immune-mediated (T-cell) disease with genetic susceptibility, so it cannot be passed from person to person. Everything else listed (nail changes, extensor distribution, childhood onset, arthritis) is true of it.", "Psoriasis = immune-mediated, never contagious. Auspitz sign, Koebner phenomenon, nail pitting."]}, {"id": "Q293", "ch": "Inflammatory Dermatoses", "q": "All these skin diseases are infectious EXCEPT", "o": [["A", "Kerion."], ["B", "Herpes simplex."], ["C", "Ecthyma."], ["D", "Psoriasis."], ["E", "Bullous impetigo."]], "a": "D", "sa": null, "pg": "52", "f": [], "s": "B", "n": 2, "e": ["Psoriasis is an immune-mediated papulosquamous disease, not an infection. The question lists infectious skin diseases, so psoriasis is the one that does not belong.", "Infectious: impetigo, tinea, scabies, warts. Non-infectious: psoriasis, lichen planus, DLE."]}, {"id": "Q294", "ch": "Inflammatory Dermatoses", "q": "In psoriasis", "o": [["A", "There is decreased rate of division of basal cell layer."], ["B", "There is decreased rate of epidermal turnover."], ["C", "There is decrease of epidermal turnover time."], ["D", "The epidermal turnover time is 27 days."], ["E", "The epidermal turnover time is 17 days."]], "a": "C", "sa": null, "pg": "52", "f": [], "s": "B", "n": 3, "e": ["In psoriasis the basal cells divide faster, so the epidermis renews itself much more quickly. The epidermal turnover time falls from the normal 28 days to about 7 days, which produces the thick silvery scales.", "Normal turnover 28 days; psoriasis 7 days (shortened, not prolonged)."]}, {"id": "Q295", "ch": "Inflammatory Dermatoses", "q": "A patient presented with well-demarcated erythematous plaques covered by silvery scales on the extensor elbows and knees with positive Auspitz sign. In this disease:", "o": [["A", "The rate of cell division in the basal layer is decreased."], ["B", "The epidermal renewal process becomes slower."], ["C", "The time required for epidermal cell turnover is increased."], ["D", "The epidermal turnover time is about 7 days."], ["E", "The epidermal turnover time is about 28 days."]], "a": "D", "sa": null, "pg": "52", "f": [], "s": "B", "n": 4, "e": ["Well-demarcated silvery plaques on elbows and knees with a positive Auspitz sign describe psoriasis. The key points are an increased rate of basal cell division and a shortened epidermal turnover of about 7 days (28 days is normal), so the options saying 'decreased' or 'slower' are wrong.", "Psoriasis = fast turnover (7 days)."]}, {"id": "Q296", "ch": "Inflammatory Dermatoses", "q": "All of the following is true about psoriasis except", "o": [["A", "It is a disorder of keratinization"], ["B", "It gets more severe in summer than in winter"], ["C", "Its primary lesion is a papule"], ["D", "Psoriasis vulgaris is its most common type"], ["E", "It is characterized by Koebner phenomenon"]], "a": "B", "sa": null, "pg": "52", "f": [], "s": "B", "n": 5, "e": ["Psoriasis improves with ultraviolet exposure, so it flares in winter and in covered body parts, and is commoner in Scandinavian countries than the tropics. The statement that it worsens in summer is the false one. It is a papule-based disease and Koebner phenomenon is typical.", "Sun helps psoriasis: worse in winter."]}, {"id": "Q297", "ch": "Inflammatory Dermatoses", "q": "Koebner's phenomenon is seen in which diseases?", "o": [], "a": null, "sa": "Psoriasis, lichen planus, vitiligo and plane (flat) warts", "pg": "52", "f": [], "s": "B", "n": 6, "e": ["Koebner phenomenon means new lesions appear on previously normal skin after trauma. The book lists it in psoriasis, lichen planus, vitiligo and flat (plane) warts.", "Koebner: psoriasis, lichen planus, vitiligo, plane warts."]}, {"id": "Q298", "ch": "Inflammatory Dermatoses", "q": "Primary lesion of psoriasis is", "o": [["A", "Red macule covered with non-adherent silvery white scales."], ["B", "Red papule covered with adherent white scales."], ["C", "Red papule covered with non-adherent silvery white scales."], ["D", "Red macule covered with white adherent scales."], ["E", "Red papule with vesicles, crusts and white scales."]], "a": "C", "sa": null, "pg": "53", "f": [], "s": "B", "n": 7, "e": ["The psoriatic primary lesion is a red papule covered by loosely attached silvery-white scales; papules join to form plaques. A vesicle or crust points to eczema instead.", "Papule + silvery loose scales."]}, {"id": "Q299", "ch": "Inflammatory Dermatoses", "q": "Auspitz sign is elicited in", "o": [["A", "Psoriasis."], ["B", "Lichen planus."], ["C", "Discoid LE."], ["D", "Discoid eczema."], ["E", "Seborrheic dermatitis."]], "a": "A", "sa": null, "pg": "53", "f": [], "s": "B", "n": 8, "e": ["Scraping the scales off a psoriatic plaque leaves pinpoint bleeding points (Auspitz sign) because the dermal papillae are thin-capped and engorged. Lichen planus shows Wickham striae and DLE shows follicular plugging instead.", "Auspitz = psoriasis; Wickham = lichen planus."]}, {"id": "Q300", "ch": "Inflammatory Dermatoses", "q": "A 35-year-old male presents with scaly erythematous symmetrical plaques on extensor surfaces and a positive Auspitz sign. What is the most likely diagnosis?", "o": [["A", "Psoriasis."], ["B", "Atopic dermatitis."], ["C", "Lichen planus."], ["D", "Seborrheic dermatitis."], ["E", "Pityriasis rosea. 1     A female patient, 17 years old, presented with scaly erythematous plaques on her scalp. She also had scaly plaques on both elbows and knees. (Clinical photo: thick silvery-scaled plaques at the nape/scalp margin.)"]], "a": "A", "sa": null, "pg": "53", "f": [], "s": "B", "n": 9, "e": ["Symmetrical scaly erythematous plaques on the extensor surfaces with a positive Auspitz sign are typical of psoriasis. Atopic dermatitis favors flexures, lichen planus gives violaceous flat papules, and pityriasis rosea follows a herald patch.", "Extensors + Auspitz = psoriasis."]}, {"id": "Q301", "ch": "Inflammatory Dermatoses", "q": "What is your diagnosis?", "o": [["A", "Discoid lupus erythematosus."], ["B", "Lichen planopilaris."], ["C", "Scalp psoriasis."], ["D", "Seborrheic dermatitis."], ["E", "Scalp eczema. 1     A male patient, 35 years old, presented with itchy scaly plaques on his trunk. He also had scaly plaques on both elbows, forearms and scalp. The condition started when he was 14 years old with remissions and exacerbations. He reported that lesions exacerbated with stressful conditions and in winter months. (Clinical photo: multiple erythematous scaly plaques on the trunk.)"]], "a": "C", "sa": null, "pg": "53", "f": [], "s": "B", "n": 10, "e": ["Plaques of silvery scale confined to the scalp are scalp psoriasis, which sharply borders the hairline and does not scar the hair, unlike DLE.", "Scalp is a common site; psoriasis hair loss is non-scarring."]}, {"id": "Q302", "ch": "Inflammatory Dermatoses", "q": "This patient suffers from", "o": [["A", "Impetigo contagiosum."], ["B", "Psoriasis vulgaris."], ["C", "Disseminated dermatitis."], ["D", "Atopic dermatitis."], ["E", "Lichen planus."]], "a": "B", "sa": null, "pg": "52", "f": [], "s": "B", "n": 11, "e": ["Vulgaris means 'common', so psoriasis vulgaris is the common plaque type, accounting for most cases. The picture shows typical well-defined scaly plaques.", "Plaque psoriasis = psoriasis vulgaris."]}, {"id": "Q303", "ch": "Inflammatory Dermatoses", "q": "The characteristic clinical picture of psoriasis is", "o": [["A", "Erythematous papules & plaques covered by silvery scales"], ["B", "Erythematous macules covered by silvery scales"], ["C", "Erythematous nodules covered by silvery scales"], ["D", "Pruritic erythematous patches"], ["E", "Pruritic polyangular papules"]], "a": "A", "sa": null, "pg": "53", "f": [], "s": "B", "n": 12, "e": ["The classic picture is bilateral, symmetrical well-defined erythematous papules and plaques covered by shiny silvery dry scales with a polycyclic outline, mainly on extensors, scalp and lumbosacral area.", "Silvery scales on extensors."]}, {"id": "Q304", "ch": "Inflammatory Dermatoses", "q": "Silver plaques are seen in", "o": [["A", "Psoriasis."], ["B", "Vitiligo."], ["C", "Hypertrophic lichen planus."], ["D", "Pityriasis rosea."], ["E", "Cutaneous candidiasis."]], "a": "A", "sa": null, "pg": "53", "f": [], "s": "B", "n": 13, "e": ["Silvery scale on a red plaque is the signature of psoriasis. Other scaly diseases such as tinea or seborrheic dermatitis have finer, greasy or branny scales instead.", "Silvery = psoriasis."]}, {"id": "Q305", "ch": "Inflammatory Dermatoses", "q": "Vulgaris means", "o": [["A", "Serious"], ["B", "Common"], ["C", "Easily treated"], ["D", "Infectious"], ["E", "Painful"]], "a": "B", "sa": null, "pg": "53", "f": [], "s": "B", "n": 14, "e": ["Vulgaris is Latin for common, as in psoriasis vulgaris (plaque type), acne vulgaris and verruca vulgaris.", "Vulgaris = common."]}, {"id": "Q306", "ch": "Inflammatory Dermatoses", "q": "A patient came presenting with a red plaque covered with silvery white scales, upon removal of the scales bleeding points were observed. The most probable diagnosis is", "o": [["A", "Lichen planus"], ["B", "Psoriasis vulgaris"], ["C", "Discoid lupus erythematosus"], ["D", "Pityriasis rosea"], ["E", "Discoid eczema"]], "a": "B", "sa": null, "pg": "53", "f": [], "s": "B", "n": 15, "e": ["A red plaque with silvery white scales that bleeds on scale removal (Auspitz sign) is plaque-type psoriasis, i.e. psoriasis vulgaris.", "Plaque + Auspitz."]}, {"id": "Q307", "ch": "Inflammatory Dermatoses", "q": "Psoriasis may be manifested clinically by all of the following EXCEPT", "o": [["A", "Erythroderma."], ["B", "Pustular lesions."], ["C", "Arthropathy."], ["D", "Flexural lesions."], ["E", "Bullous lesions."]], "a": "E", "sa": null, "pg": "54", "f": [], "s": "B", "n": 16, "e": ["Psoriasis has several forms: erythrodermic, pustular, flexural, nail and arthritic. Bullous lesions are not part of the psoriasis spectrum, so that option is the exception.", "Types: plaque, flexural, nail, erythrodermic, pustular, arthritic. Never bullous."]}, {"id": "Q308", "ch": "Inflammatory Dermatoses", "q": "Psoriasis may present by all of the following EXCEPT", "o": [["A", "Flexural affection."], ["B", "Joint affection."], ["C", "Pustular eruption."], ["D", "Nail pitting."], ["E", "Cicatricial alopecia."]], "a": "E", "sa": null, "pg": "54", "f": [], "s": "B", "n": 17, "e": ["Psoriasis causes hair-bearing plaques without destroying follicles, so any alopecia is non-scarring. Cicatricial (scarring) alopecia occurs in DLE, lichen planus, kerion and favus, not psoriasis.", "Scarring alopecia: DLE, LP, kerion, favus. Not psoriasis."]}, {"id": "Q309", "ch": "Inflammatory Dermatoses", "q": "Sterile pustules are characteristic of", "o": [["A", "Folliculitis."], ["B", "Pustular psoriasis."], ["C", "Sycosis barbae."], ["D", "Nodulocystic acne."], ["E", "None of the above."]], "a": "B", "sa": null, "pg": "52", "f": [], "s": "B", "n": 18, "e": ["Pustular psoriasis shows sterile pustules (no bacteria) on an erythematous base; hypocalcemia can precipitate it. Pustules in bacterial folliculitis or impetigo are infected.", "Sterile pustules = pustular psoriasis."]}, {"id": "Q310", "ch": "Inflammatory Dermatoses", "q": "Which of the following is NOT a recognized clinical type of psoriasis?", "o": [["A", "Plaque psoriasis."], ["B", "Guttate psoriasis."], ["C", "Erythrodermic psoriasis."], ["D", "Ulcerative psoriasis."], ["E", "Pustular psoriasis."]], "a": "D", "sa": null, "pg": "54", "f": [], "s": "B", "n": 19, "e": ["Recognised forms are plaque (vulgaris), flexural, nail, erythrodermic, pustular and psoriatic arthritis; guttate is also described. There is no 'ulcerative psoriasis'.", "No ulcerative psoriasis."]}, {"id": "Q311", "ch": "Inflammatory Dermatoses", "q": "Erythroderma may occur in", "o": [["A", "Alopecia."], ["B", "Vitiligo."], ["C", "Psoriasis."], ["D", "Acne vulgaris."], ["E", "Pityriasis rosea."]], "a": "C", "sa": null, "pg": "54", "f": [], "s": "B", "n": 20, "e": ["Psoriasis, especially when irritated by strong topicals or stopped steroids, may spread to involve the whole skin surface as erythrodermic psoriasis. The question asks which disease can present with erythroderma.", "Erythroderma can complicate psoriasis."]}, {"id": "Q312", "ch": "Inflammatory Dermatoses", "q": "The following disease may involve the joints", "o": [["A", "Lichen planus."], ["B", "Pityriasis rosea."], ["C", "Psoriasis."], ["D", "Vitiligo."], ["E", "Seborrheic eczema."]], "a": "C", "sa": null, "pg": "55", "f": [], "s": "B", "n": 21, "e": ["Psoriasis can involve the joints (psoriatic arthritis), listed in the book among the clinical types. Scabies, tinea and impetigo do not affect joints.", "Psoriasis + arthritis; also nail pitting."]}, {"id": "Q313", "ch": "Inflammatory Dermatoses", "q": "Topical treatment of psoriasis includes", "o": [["A", "Calcipotriol and coal tar."], ["B", "Acyclovir and garamycin."], ["C", "Antiseptic lotions."], ["D", "Terbinafine."], ["E", "Gamma benzene hexachloride."]], "a": "A", "sa": null, "pg": "56", "f": [], "s": "B", "n": 22, "e": ["Topical psoriasis drugs include keratolytics (salicylic acid), moisturizers, steroids, calcipotriol (vitamin D analogue), coal tar and anthralin. Antivirals, antifungals and antiseptic lotions are not part of the list.", "Topical: calcipotriol, tar, anthralin, steroids."]}, {"id": "Q314", "ch": "Inflammatory Dermatoses", "q": "All of the following can be used in the treatment of psoriasis EXCEPT", "o": [["A", "Retinoids."], ["B", "Cyclosporine."], ["C", "Doxycycline."], ["D", "Calcipotriol."], ["E", "Phototherapy."]], "a": "C", "sa": null, "pg": "56", "f": [], "s": "B", "n": 23, "e": ["Retinoids (acitretin), cyclosporine, calcipotriol and phototherapy all treat psoriasis. Doxycycline is an antibiotic with no role in it.", "Systemic: methotrexate, acitretin, cyclosporine, PUVA."]}, {"id": "Q315", "ch": "Inflammatory Dermatoses", "q": "Systemic treatment of psoriasis includes :", "o": [["A", "Tetracyclines."], ["B", "Methotrexate."], ["C", "Acyclovir."], ["D", "Itraconazole."], ["E", "Antimalarials."]], "a": "B", "sa": null, "pg": "56", "f": [], "s": "B", "n": 24, "e": ["Systemic therapy for extensive plaque, pustular, erythrodermic or arthritic psoriasis includes methotrexate, acitretin, cyclosporine and PUVA. Tetracyclines, acyclovir and itraconazole treat infections.", "Methotrexate = systemic psoriasis drug."]}, {"id": "Q316", "ch": "Inflammatory Dermatoses", "q": "Regarding topical treatment of psoriasis", "o": [["A", "Permethrin cream is used."], ["B", "Topical steroids are contraindicated."], ["C", "Topical antiseptics and antibiotics are important."], ["D", "Topical vitamin D is effective."], ["E", "It is effective as monotherapy in erythrodermic psoriasis. 1     A female patient, 17 years old, presented with scaly erythematous plaques on her scalp. She also had scaly plaques on both elbows and knees. (Clinical photo: thick silvery-scaled plaques at the nape/scalp margin - psoriasis.)"]], "a": "D", "sa": null, "pg": "56", "f": [], "s": "B", "n": 25, "e": ["Topical vitamin D analogues such as calcipotriol are effective in psoriasis. Permethrin treats scabies, antiseptics/antibiotics are not key psoriasis drugs, and topical steroids are used (not contraindicated).", "Calcipotriol = vitamin D analogue."]}, {"id": "Q317", "ch": "Inflammatory Dermatoses", "q": "Topical treatment includes", "o": [["A", "Calcipotriol gel."], ["B", "Clindamycin lotion."], ["C", "Potassium permanganate lotion."], ["D", "Terbinafine cream."], ["E", "Gamma benzene hexachloride lotion. 1     A male patient, 35 years old, presented with itchy scaly plaques on his trunk. He also had scaly plaques on both elbows, forearms and scalp. The condition started when he was 14 years old with remissions and exacerbations, exacerbated by stress and in winter months. (Clinical photo: multiple erythematous scaly plaques on the trunk - psoriasis vulgaris.)"]], "a": "A", "sa": null, "pg": "56", "f": [], "s": "B", "n": 26, "e": ["Calcipotriol gel is a vitamin D analogue that slows keratinocyte proliferation in psoriasis. Acyclovir and terbinafine are antivirals/antifungals.", "Calcipotriol."]}, {"id": "Q318", "ch": "Inflammatory Dermatoses", "q": "Systemic treatment includes", "o": [["A", "Tetracyclines."], ["B", "Methotrexate."], ["C", "Valacyclovir."], ["D", "Itraconazole."]], "a": "B", "sa": null, "pg": "56", "f": [], "s": "B", "n": 27, "e": ["Methotrexate is a systemic antiproliferative/immunosuppressive drug used for extensive psoriasis, along with acitretin, cyclosporine and PUVA.", "Methotrexate."]}, {"id": "Q319", "ch": "Inflammatory Dermatoses", "q": "Photochemotherapy is used to treat", "o": [["A", "Psoriasis."], ["B", "Pediculosis capitis"], ["C", "Tinea capitis."], ["D", "Tinea cruris."], ["E", "Discoid lupus."]], "a": "A", "sa": null, "pg": "56", "f": [], "s": "B", "n": 28, "e": ["Photochemotherapy (PUVA = psoralen + UVA) is used for psoriasis, along with narrow-band UVB. It is not used for DLE, which is photosensitive.", "PUVA: psoriasis, vitiligo; not DLE."]}, {"id": "Q320", "ch": "Inflammatory Dermatoses", "q": "Lichen planus is an inflammatory pruritic disease which involves", "o": [["A", "Mucous membranes."], ["B", "Skin."], ["C", "Hair follicles."], ["D", "All of the above."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": "57", "f": [], "s": "B", "n": 29, "e": ["Lichen planus is a pruritic immune-mediated disease that affects skin, mucous membranes, hair and nails, so all options are correct.", "LP: skin, mucosa, hair, nails."]}, {"id": "Q321", "ch": "Inflammatory Dermatoses", "q": "Mucous membranes are involved in", "o": [["A", "Papular urticaria."], ["B", "Tinea versicolor."], ["C", "Scabies."], ["D", "Lichen Planus."], ["E", "Pediculosis capitis."]], "a": "D", "sa": null, "pg": "57", "f": [], "s": "B", "n": 30, "e": ["Mucosal lichen planus involves buccal mucosa, tongue, gums and genitalia with white reticular streaks (Wickham striae).", "LP has mucosal disease."]}, {"id": "Q322", "ch": "Inflammatory Dermatoses", "q": "Lichen planus (including hypertrophic LP) may be associated with which viral infection?", "o": [], "a": null, "sa": "Hepatitis C virus", "pg": "57", "f": [], "s": "B", "n": 31, "e": ["Hepatitis C virus infection is associated with lichen planus, so hepatic work-up is sensible. Hair fall and vitamin/iron deficiency are other clues listed in the introduction.", "LP ↔ hepatitis C."]}, {"id": "Q323", "ch": "Inflammatory Dermatoses", "q": "Well-defined flat-topped, polyangular, violaceous, itchy papules are the primary lesions of", "o": [["A", "Vitiligo."], ["B", "Lupus erythematosus."], ["C", "Lichen planus."], ["D", "Psoriasis."], ["E", "None of the above. 2     A female patient, 38 years old, presented with papules that developed on both her forearms and wrists. The condition started about five years ago with a gradual onset and a progressive course. She had severe itching. (Clinical photo: multiple violaceous flat-topped papules and plaques on both forearms and wrists.)"]], "a": "C", "sa": null, "pg": "57", "f": [], "s": "B", "n": 32, "e": ["Flat-topped, polyangular, violaceous, itchy papules define lichen planus. Psoriasis papules are scaly red and DLE plaques are atrophic.", "Purple, polygonal, itchy, planar papules."]}, {"id": "Q324", "ch": "Inflammatory Dermatoses", "q": "What is your diagnosis?", "o": [["A", "Discoid lupus erythematosus."], ["B", "Stasis dermatitis."], ["C", "Atopic dermatitis."], ["D", "Lichen planus."], ["E", "Psoriasis vulgaris."]], "a": "D", "sa": null, "pg": "57", "f": [], "s": "B", "n": 33, "e": ["Flat-topped violaceous polygonal papules, often on wrists, are lichen planus.", "Wrists and shins."]}, {"id": "Q325", "ch": "Inflammatory Dermatoses", "q": "The primary lesion of lichen planus is", "o": [["A", "Pustule."], ["B", "Vesicle."], ["C", "Papule."], ["D", "Macule."], ["E", "Bulla."]], "a": "C", "sa": null, "pg": null, "f": [], "s": "B", "n": 34, "e": ["The primary lesion is a papule (flat-topped, polyangular, violaceous, shiny). Plaques form by coalescence.", "Primary = papule."]}, {"id": "Q326", "ch": "Inflammatory Dermatoses", "q": "Lichen planus heals leaving", "o": [["A", "Pain & paresthesia."], ["B", "Post-inflammatory hypopigmentation."], ["C", "Post-inflammatory hyperpigmentation."], ["D", "Keloids."], ["E", "Telangiectasia."]], "a": "C", "sa": null, "pg": "58", "f": [], "s": "B", "n": 35, "e": ["Lichen planus heals leaving dark post-inflammatory hyperpigmentation, not hypopigmentation, scars or keloids (except in hypertrophic/scalp types).", "LP → hyperpigmentation."]}, {"id": "Q327", "ch": "Inflammatory Dermatoses", "q": "Koebner's phenomenon is positive in all of the following EXCEPT", "o": [["A", "Warts."], ["B", "Psoriasis."], ["C", "Lichen planus."], ["D", "Eczema."], ["E", "Vitiligo."]], "a": "D", "sa": null, "pg": "58", "f": [], "s": "B", "n": 36, "e": ["Koebner is seen in psoriasis, LP, vitiligo and plane warts; eczema is not on that list.", "Eczema: no Koebner."]}, {"id": "Q328", "ch": "Inflammatory Dermatoses", "q": "Koebner's phenomenon is present in :", "o": [["A", "Psoriasis."], ["B", "Lichen planus."], ["C", "Plane warts."], ["D", "All of the above."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": "58", "f": [], "s": "B", "n": 37, "e": ["Koebner phenomenon occurs in psoriasis, lichen planus and vitiligo, so all of the above is correct.", "Koebner: PLP-V."]}, {"id": "Q329", "ch": "Inflammatory Dermatoses", "q": "How does lichen planus present clinically?", "o": [["A", "Red plaques with silvery scales."], ["B", "Pruritic, red, oozing rash with edema."], ["C", "Golden colored crusts."], ["D", "Pruritic, purple, polygonal, planar papules."], ["E", "Pearly dome-shaped papules with umbilicated centers."]], "a": "D", "sa": null, "pg": "57", "f": [], "s": "B", "n": 38, "e": ["LP is described as pruritic, purple, polygonal, planar papules (the 4 Ps; a fifth P: plaques), with shiny surface and fine adherent scales.", "4 Ps."]}, {"id": "Q330", "ch": "Inflammatory Dermatoses", "q": "In lichen planus, squamous cell carcinoma may complicate", "o": [["A", "Oral ulcerative lesions."], ["B", "Hypertrophic lesions."], ["C", "Nail lesions."], ["D", "Actinic lesions."], ["E", "Scalp lesions."]], "a": "A", "sa": null, "pg": "59", "f": [], "s": "B", "n": 39, "e": ["Chronic ulcerative (erosive) oral lesions of LP are resistant to treatment and may become squamous cell carcinoma. Skin lesions do not.", "Oral erosive LP → SCC."]}, {"id": "Q331", "ch": "Inflammatory Dermatoses", "q": "Wickham striae are seen in:", "o": [["A", "Pityriasis rosea."], ["B", "Scabies."], ["C", "Lichen planus."], ["D", "Verrucae."], ["E", "Erythema multiforme."]], "a": "C", "sa": null, "pg": "59", "f": [], "s": "B", "n": 40, "e": ["Wickham striae are the fine white reticular lines on lichen planus papules and oral mucosa. They are not seen in pityriasis rosea, scabies or warts.", "Wickham = LP."]}, {"id": "Q332", "ch": "Inflammatory Dermatoses", "q": "Complications of lichen planus may include", "o": [["A", "Frequent recurrences."], ["B", "Subsequent bacterial infections."], ["C", "Non-cicatricial alopecia in scalp."], ["D", "Post-inflammatory hypopigmentation."], ["E", "Squamous cell carcinoma."]], "a": "E", "sa": null, "pg": "59", "f": [], "s": "B", "n": 41, "e": ["Chronic ulcerative mucosal and hypertrophic LP can turn into squamous cell carcinoma. Frequent recurrence and post-inflammatory pigmentation are common, but SCC is the serious complication.", "Complication: SCC."]}, {"id": "Q333", "ch": "Inflammatory Dermatoses", "q": "One of the following is precancerous", "o": [["A", "Actinic lichen planus"], ["B", "Mucosal lichen planus"], ["C", "Lichen planus pigmentosus"], ["D", "Lichen planopilaris"], ["E", "Scalp lichen planus"]], "a": "B", "sa": null, "pg": "59", "f": [], "s": "B", "n": 42, "e": ["Mucosal (erosive) lichen planus is considered precancerous because of its risk of SCC.", "Oral LP: follow up."]}, {"id": "Q334", "ch": "Inflammatory Dermatoses", "q": "Lichen planus actinicus usually involves", "o": [["A", "Upper back."], ["B", "Genitalia."], ["C", "Nails."], ["D", "All of the above."], ["E", "None of the above."]], "a": "E", "sa": null, "pg": null, "f": [], "s": "B", "n": 43, "e": ["Actinic LP lies on sun-exposed skin (face, dorsa of hands). Upper back, genitalia and nails are not its typical targets, so 'none of the above' is the key.", "Actinic LP: sun-exposed areas, often the face."]}, {"id": "Q335", "ch": "Inflammatory Dermatoses", "q": "Regarding lichen planus, the following is TRUE", "o": [["A", "It is a contagious disease."], ["B", "The primary lesion is a pearly white umbilicated papule."], ["C", "It never affects the oral mucosa."], ["D", "It can lead to cicatricial alopecia."], ["E", "It is due to HHV-7."]], "a": "D", "sa": null, "pg": "90", "f": [], "s": "B", "n": 44, "e": ["LP affecting the scalp destroys follicles and ends in scarring (cicatricial) alopecia. It is not contagious, and its papule is flat-topped violaceous, not pearly umbilicated (that is molluscum).", "LP can scar the scalp."]}, {"id": "Q336", "ch": "Inflammatory Dermatoses", "q": "Actinic lichen planus usually affects", "o": [["A", "Mucous membranes."], ["B", "Genitals."], ["C", "Upper back."], ["D", "Face."], ["E", "None of the above. 2     A female patient, 38 years old, presented with papules that developed on both her forearms and wrists. The condition started about five years ago with a gradual onset and a progressive course. She had severe itching. (Clinical photo: multiple violaceous flat-topped papules and plaques on both forearms and wrists - lichen planus.)"]], "a": "D", "sa": null, "pg": "57", "f": [], "s": "B", "n": 45, "e": ["Actinic LP (lichen planus tropicus) appears on sun-exposed areas such as the face and dorsum of the hands.", "Face = actinic LP."]}, {"id": "Q337", "ch": "Inflammatory Dermatoses", "q": "Best treatment option is", "o": [["A", "Radiotherapy."], ["B", "Oral ivermectin."], ["C", "Topical potassium permanganate 1/8000."], ["D", "Oral terbinafine."], ["E", "Topical corticosteroids. 1     A patient presented with papules on both forearms and wrists. The condition started about five years ago with a gradual onset and a progressive course, with severe itching. (Clinical photo: violaceous flat-topped papules and plaques on both forearms and wrists - lichen planus.)"]], "a": "E", "sa": null, "pg": "62", "f": [], "s": "B", "n": 46, "e": ["A few itchy lichen planus papules on the forearms are treated with topical corticosteroids, the first-line therapy for localized disease.", "Topical steroids."]}, {"id": "Q338", "ch": "Inflammatory Dermatoses", "q": "Best treatment option is", "o": [["A", "Radiotherapy."], ["B", "Oral ivermectin."], ["C", "Topical potassium permanganate 1/8000."], ["D", "Topical terbinafine."], ["E", "Oral corticosteroids."]], "a": "E", "sa": null, "pg": "62", "f": [], "s": "B", "n": 47, "e": ["Extensive or severe LP needs oral corticosteroids, with sedating antihistamines for itch.", "Generalized LP → systemic steroids."]}, {"id": "Q339", "ch": "Inflammatory Dermatoses", "q": "Treatment of choice for actinic lichen planus is", "o": [["A", "Allylamines."], ["B", "Calcipotriene."], ["C", "Antimalarials."], ["D", "Ivermectin."], ["E", "Nystatin."]], "a": "C", "sa": null, "pg": "62", "f": [], "s": "B", "n": 48, "e": ["Antimalarials (hydroxychloroquine/chloroquine) are the treatment of choice for actinic LP, with sunscreens.", "Actinic LP = antimalarials + sunscreen."]}, {"id": "Q340", "ch": "Inflammatory Dermatoses", "q": "Treatment of actinic lichen planus includes", "o": [["A", "Benzoyl peroxide."], ["B", "Phototherapy."], ["C", "Terbinafine."], ["D", "Chloroquine"], ["E", "Crotamiton."]], "a": "D", "sa": null, "pg": "62", "f": [], "s": "B", "n": 49, "e": ["Chloroquine/hydroxychloroquine, antimalarials, are the treatment for actinic LP, along with sunscreen.", "Antimalarials."]}, {"id": "Q341", "ch": "Inflammatory Dermatoses", "q": "In lichen planus tropicus (actinic LP), the lesions", "o": [["A", "Respond to antimalarials"], ["B", "May be precancerous"], ["C", "Respond to PUVA therapy"], ["D", "Are ulcerative"], ["E", "Are severely itchy"]], "a": "A", "sa": null, "pg": "62", "f": [], "s": "B", "n": 50, "e": ["Lichen planus tropicus (actinic LP) responds to antimalarials. Allylamines and nystatin are antifungals.", "Antimalarials."]}, {"id": "Q342", "ch": "Inflammatory Dermatoses", "q": "Pityriasis rosea", "o": [["A", "Is a scaly erythematous disease"], ["B", "Is an infectious disease caused by a virus"], ["C", "Is commonly a recurrent disease"], ["D", "Usually heals in one week"], ["E", "Involves mainly forearms and legs"]], "a": "A", "sa": null, "pg": "63", "f": [], "s": "B", "n": 51, "e": ["Pityriasis rosea is a scaly erythematous papulosquamous eruption that is acute and self-limited, not a chronic or contagious disease.", "Scaly, rosy, self-limited."]}, {"id": "Q343", "ch": "Inflammatory Dermatoses", "q": "Pityriasis rosea is", "o": [["A", "Self-limiting."], ["B", "Chronic relapsing."], ["C", "A life threatening infection."], ["D", "An autoimmune disease."], ["E", "Caused by dermatophytes."]], "a": "A", "sa": null, "pg": "63", "f": [], "s": "B", "n": 52, "e": ["The rash heals spontaneously within 4-8 weeks (up to 5 months) without sequelae, so it is self-limiting. It is not chronic relapsing, autoimmune or fungal.", "Self-limited; recurrence rare."]}, {"id": "Q344", "ch": "Inflammatory Dermatoses", "q": "Pityriasis rosea is", "o": [["A", "Contagious with a chronic course."], ["B", "Contagious with a self-limited course."], ["C", "Non-contagious with a self-limited course."], ["D", "Contagious with an acute course."], ["E", "Non-contagious with remissions and exacerbations."]], "a": "C", "sa": null, "pg": "64", "f": [], "s": "B", "n": 53, "e": ["Pityriasis rosea is considered a non-contagious exanthematous reaction with a self-limiting course, so isolation is unnecessary.", "Non-infectious, self-limited."]}, {"id": "Q345", "ch": "Inflammatory Dermatoses", "q": "Pityriasis rosea", "o": [["A", "Is an infectious scaly erythematous disease."], ["B", "Is caused by human herpes viruses 6 & 7."], ["C", "Is commonly a recurrent disease."], ["D", "Usually heals in one week."], ["E", "Affects mainly forearms & lower legs."]], "a": "B", "sa": null, "pg": "63", "f": [], "s": "B", "n": 54, "e": ["PR is probably an exanthem related to upper respiratory viral infection with human herpes virus 6 and 7.", "HHV 6 and 7."]}, {"id": "Q346", "ch": "Inflammatory Dermatoses", "q": "Pityriasis rosea", "o": [["A", "Is caused by varicella-zoster virus."], ["B", "Is commonly associated with burning sensation."], ["C", "Is usually recurrent."], ["D", "Has a viral aetiology related to HHV-6."], ["E", "Heals spontaneously after one week."]], "a": "D", "sa": null, "pg": "63", "f": [], "s": "B", "n": 55, "e": ["Pityriasis rosea is believed to be a viral exanthem associated with HHV-6/7, not bacterial or fungal.", "HHV-6."]}, {"id": "Q347", "ch": "Inflammatory Dermatoses", "q": "Pityriasis rosea", "o": [["A", "Is an infectious scaly erythematous disease."], ["B", "Is a viral exanthema."], ["C", "Is commonly a recurrent disease."], ["D", "Usually heals in one week."], ["E", "Affects mainly forearms and lower legs."]], "a": "B", "sa": null, "pg": "63", "f": [], "s": "B", "n": 56, "e": ["The eruption follows an upper respiratory infection and is therefore regarded as an exanthematous reaction (viral exanthem).", "Viral."]}, {"id": "Q348", "ch": "Inflammatory Dermatoses", "q": "The causative organism of pityriasis rosea is", "o": [["A", "Varicella zoster virus."], ["B", "Human papilloma virus."], ["C", "Human herpes virus 6 & 7."], ["D", "Human herpes virus 8."], ["E", "Human herpes virus 1 & 2."]], "a": "C", "sa": null, "pg": "63", "f": [], "s": "B", "n": 57, "e": ["Human herpes viruses 6 and 7 are implicated, with recent reports of influenza and COVID-19.", "HHV-6/7."]}, {"id": "Q349", "ch": "Inflammatory Dermatoses", "q": "The differential diagnosis of \"herald patch\" on the trunk is", "o": [["A", "Tinea capitis."], ["B", "Tinea corporis."], ["C", "Pityriasis versicolor."], ["D", "Tinea manuum."], ["E", "Tinea pedis."]], "a": "B", "sa": null, "pg": null, "f": ["Answer taken from key row; verify."], "s": "B", "n": 58, "e": ["A herald patch (a single annular scaly patch) mimics tinea corporis, so scraping with KOH distinguishes them.", "Herald patch ≈ tinea corporis."]}, {"id": "Q350", "ch": "Inflammatory Dermatoses", "q": "Typical distribution of the secondary eruption of pityriasis rosea is on", "o": [["A", "Trunk and proximal extremities."], ["B", "Face."], ["C", "Upper limbs."], ["D", "Lower limbs."], ["E", "Hands and feet."]], "a": "A", "sa": null, "pg": null, "f": [], "s": "B", "n": 59, "e": ["The secondary eruption of smaller oval lesions appears on the trunk and proximal limbs in a Christmas-tree pattern along the ribs; face, palms and soles are spared.", "Trunk and proximal limbs; spares face, palms, soles."]}, {"id": "Q351", "ch": "Inflammatory Dermatoses", "q": "The primary lesion that precedes pityriasis rosea is", "o": [["A", "Chicken pox."], ["B", "Primary herpetic gingivostomatitis."], ["C", "Herald patch."], ["D", "Stippling sign."], ["E", "Auspitz sign. 1     An 18-year-old girl came to the clinic complaining of a skin rash of 10 days duration. On examination, multiple oval lesions were scattered on the trunk in a \"Christmas tree\" distribution."]], "a": "C", "sa": null, "pg": "63", "f": [], "s": "B", "n": 60, "e": ["The herald patch, a single 2-5 cm oval scaly lesion, appears 1-2 weeks before the generalized eruption.", "Herald patch first."]}, {"id": "Q352", "ch": "Inflammatory Dermatoses", "q": "The primary lesion of this disease is", "o": [["A", "Scaly erythema"], ["B", "Target lesion"], ["C", "Stippling sign"], ["D", "Nodule."], ["E", "Herald patch"]], "a": "E", "sa": null, "pg": "63", "f": [], "s": "B", "n": 61, "e": ["The primary lesion of PR is the herald patch, with an outer erythematous zone and an inner collarette of scales.", "Collarette scale."]}, {"id": "Q353", "ch": "Inflammatory Dermatoses", "q": "The following diseases show scales EXCEPT", "o": [["A", "Lichen planus"], ["B", "Alopecia areata"], ["C", "Lupus erythematosus"], ["D", "Pityriasis rosea"], ["E", "Pityriasis versicolor"]], "a": "B", "sa": null, "pg": "94", "f": [], "s": "B", "n": 62, "e": ["Scaly conditions include psoriasis, PR, tinea and seborrheic dermatitis; alopecia areata is non-scaly with smooth bald skin.", "AA: smooth, non-scaly."]}, {"id": "Q354", "ch": "Inflammatory Dermatoses", "q": "What disorder is characterized by an initial herald patch, followed by scaly erythematous lesions on the trunk in a \"Christmas tree\" distribution?", "o": [["A", "Pityriasis rosea."], ["B", "Herpes simplex"], ["C", "Herpes zoster."], ["D", "Erysipelas."], ["E", "Molluscum contagiosum."]], "a": "A", "sa": null, "pg": "63", "f": [], "s": "B", "n": 63, "e": ["A herald patch followed by crops of scaly lesions on the trunk in a Christmas-tree pattern is pityriasis rosea.", "Herald → Christmas tree."]}, {"id": "Q355", "ch": "Inflammatory Dermatoses", "q": "A 17-year-old girl noted a 2-cm annular pink, scaly lesion on her back. Over the next 2 weeks she developed several smaller oval pink lesions with a fine collarette of scales. They seem to run in the body folds and mainly involve the trunk, although a few occur on the upper arms and thighs. What is the most likely diagnosis?", "o": [["A", "Tinea versicolor."], ["B", "Psoriasis."], ["C", "Lichen planus"], ["D", "Pityriasis rosea"], ["E", "Tinea circinata."]], "a": "D", "sa": null, "pg": "63", "f": [], "s": "B", "n": 64, "e": ["A 2 cm annular scaly lesion, then similar smaller lesions two weeks later along the ribs, is pityriasis rosea.", "Initial annular lesion."]}, {"id": "Q356", "ch": "Inflammatory Dermatoses", "q": "The primary lesion of pityriasis rosea is", "o": [["A", "Patch"], ["B", "Plaque"], ["C", "Vesicle"], ["D", "Pustule"], ["E", "Nodule"]], "a": "A", "sa": null, "pg": "63", "f": [], "s": "B", "n": 65, "e": ["The first lesion is a 'patch' (herald patch), 2-5 cm, oval with a collarette of scales; this is what the question calls the primary lesion.", "Herald patch = single large patch."]}, {"id": "Q357", "ch": "Inflammatory Dermatoses", "q": "Herald patch is the primary lesion of", "o": [["A", "Psoriasis"], ["B", "Lichen planus"], ["C", "Pityriasis rosea"], ["D", "Atopic dermatitis"], ["E", "Scabies"]], "a": "C", "sa": null, "pg": "63", "f": [], "s": "B", "n": 66, "e": ["The herald patch is the first lesion of pityriasis rosea: a single 2-5 cm oval scaly lesion with a collarette of scales.", "Herald → PR."]}, {"id": "Q358", "ch": "Inflammatory Dermatoses", "q": "Treatment of pityriasis rosea includes", "o": [["A", "Isolation."], ["B", "Reassurance."], ["C", "Cytotoxic drugs."], ["D", "Intralesional steroids."], ["E", "Topical antibiotics."]], "a": "B", "sa": null, "pg": "64", "f": [], "s": "B", "n": 67, "e": ["Treatment is mainly reassurance that the eruption is non-infectious and self-limited, with emollients; no isolation or cytotoxic drugs are needed.", "Reassure."]}, {"id": "Q359", "ch": "Inflammatory Dermatoses", "q": "Treatment of pityriasis rosea includes", "o": [["A", "Isolation"], ["B", "Topical antibiotics"], ["C", "Intralesional steroids"], ["D", "Topical steroids"], ["E", "Cytotoxic drugs"]], "a": "D", "sa": null, "pg": "64", "f": [], "s": "B", "n": 68, "e": ["Mild topical corticosteroids (and emollients) relieve itching in pityriasis rosea; antihistamines can be added.", "Mild steroid for itch."]}, {"id": "Q360", "ch": "Inflammatory Dermatoses", "q": "The following disease is NOT contagious", "o": [["A", "Scabies."], ["B", "Pediculosis capitis."], ["C", "Ecthyma."], ["D", "Leprosy."], ["E", "Discoid lupus erythematosus."]], "a": "E", "sa": null, "pg": "65", "f": [], "s": "B", "n": 69, "e": ["DLE is an autoimmune skin disease and cannot be transmitted, unlike scabies, tinea or impetigo.", "Autoimmune."]}, {"id": "Q361", "ch": "Inflammatory Dermatoses", "q": "Stippling means", "o": [["A", "Dilated capillaries."], ["B", "Dilated pilosebaceous orifices."], ["C", "Atrophy."], ["D", "Scarring."], ["E", "Telangiectasia."]], "a": "B", "sa": null, "pg": "65", "f": [], "s": "B", "n": 70, "e": ["Stippling is the appearance of dilated pilosebaceous orifices filled with keratin plugs, seen in DLE as follicular plugging.", "Stippling = DLE."]}, {"id": "Q362", "ch": "Inflammatory Dermatoses", "q": "A 25 years old female patient presenting with well-defined erythematous plaques on the face with adherent scales, telangiectasia, stippling & atrophy is suffering from", "o": [["A", "Psoriasis."], ["B", "Discoid lupus erythematosus."], ["C", "Lichen planus."], ["D", "Seborrheic dermatitis."], ["E", "None of the above."]], "a": "B", "sa": null, "pg": "65", "f": [], "s": "B", "n": 71, "e": ["Well-defined plaques with adherent scales, telangiectasia, stippling and atrophy on the face are the five cardinal signs of DLE.", "Erythema, telangiectasia, scaling, stippling, scarring."]}, {"id": "Q363", "ch": "Inflammatory Dermatoses", "q": "Stippling sign is present in", "o": [["A", "Lichen planus."], ["B", "Psoriasis."], ["C", "Lupus erythematosus."], ["D", "Pityriasis rosea."], ["E", "Vitiligo."]], "a": "C", "sa": null, "pg": "65", "f": [], "s": "B", "n": 72, "e": ["The stippling sign (dilated follicular orifices with keratotic plugs) is a hallmark of lupus erythematosus, i.e. DLE.", "Stippling."]}, {"id": "Q364", "ch": "Inflammatory Dermatoses", "q": "The clinical picture of discoid lupus erythematosus is", "o": [["A", "Well-defined erythematous plaques covered with adherent scales."], ["B", "ill-defined erythematous plaques covered with adherent scales."], ["C", "ill-defined erythematous plaques covered with loose scales."], ["D", "Well-defined erythematous patches covered with adherent scales."], ["E", "Well-defined erythematous patches covered with loose scales. 1     A 32-year-old male patient presented with well-defined scaly erythematous plaques on his cheeks and nose with telangiectasia and atrophy. Plaques also showed dilatation of the pilosebaceous orifices. The condition started about five years ago and showed remissions and exacerbations with some improvement during winter times. (Clinical photo: erythematous scaly atrophic plaques on the cheek and nose.)"]], "a": "A", "sa": null, "pg": "65", "f": [], "s": "B", "n": 73, "e": ["DLE shows well-defined erythematous plaques covered with adherent scales, while the underlying orifices are dilated.", "Adherent scales, well-defined."]}, {"id": "Q365", "ch": "Inflammatory Dermatoses", "q": "What is the diagnosis of this case?", "o": [["A", "Discoid lupus."], ["B", "Contact urticaria."], ["C", "Contact dermatitis."], ["D", "Psoriasis."], ["E", "Vitiligo."]], "a": "A", "sa": null, "pg": "65", "f": [], "s": "B", "n": 74, "e": ["Scaly erythematous plaques with telangiectasia and atrophy in sun-exposed areas are discoid lupus.", "DLE."]}, {"id": "Q366", "ch": "Inflammatory Dermatoses", "q": "Scalp involvement is typical of the following dermatological disorder", "o": [["A", "Discoid lupus erythematosus"], ["B", "Scabies"], ["C", "Ecthyma."], ["D", "Pityriasis rosea."], ["E", "Erythrasma."]], "a": "A", "sa": null, "pg": "65", "f": [], "s": "B", "n": 75, "e": ["DLE typically involves the scalp and ends in permanent cicatricial alopecia.", "DLE scarring alopecia."]}, {"id": "Q367", "ch": "Inflammatory Dermatoses", "q": "All of the following are signs of discoid lupus erythematosus EXCEPT", "o": [["A", "Erythema."], ["B", "Telangiectasia."], ["C", "Stippling."], ["D", "Scarring."], ["E", "Pustulation."]], "a": "E", "sa": null, "pg": "65", "f": [], "s": "B", "n": 76, "e": ["Erythema, telangiectasia, stippling and scarring are DLE signs. Pustulation is not.", "No pustules."]}, {"id": "Q368", "ch": "Inflammatory Dermatoses", "q": "Regarding discoid lupus erythematosus:", "o": [["A", "It involves mainly upper and lower limbs."], ["B", "Telangiectasia is one of its cardinal signs."], ["C", "It is a multisystem connective tissue disease."], ["D", "It heals without scarring."], ["E", "Phototherapy is the first line of treatment."]], "a": "B", "sa": null, "pg": "65", "f": [], "s": "B", "n": 77, "e": ["Telangiectasia at the borders is one of the five cardinal signs of DLE; DLE is confined to skin rather than multisystem, and it heals with scarring.", "Cardinal signs include telangiectasia."]}, {"id": "Q369", "ch": "Inflammatory Dermatoses", "q": "The following findings are characteristic of discoid lupus erythematosus EXCEPT", "o": [["A", "Erythema."], ["B", "Adherent scales."], ["C", "Dilated pilosebaceous orifices."], ["D", "Pustules."], ["E", "Telangiectasia."]], "a": "D", "sa": null, "pg": "65", "f": [], "s": "B", "n": 78, "e": ["Pustules are not a feature of DLE; they occur in pustular psoriasis or acne.", "No pustules in DLE."]}, {"id": "Q370", "ch": "Inflammatory Dermatoses", "q": "One of the cardinal signs of discoid lupus erythematosus is", "o": [["A", "Hypopigmentation"], ["B", "Comedones"], ["C", "Pustules"], ["D", "Ulcer formation"], ["E", "Telangiectasia"]], "a": "E", "sa": null, "pg": "65", "f": [], "s": "B", "n": 79, "e": ["Telangiectasia is one of the five cardinal signs of DLE: erythema, telangiectasia, scaling, stippling, scarring.", "5 cardinal signs."]}, {"id": "Q371", "ch": "Inflammatory Dermatoses", "q": "Well-defined erythematous plaques, adherent scales, dilated pilosebaceous orifices, telangiectasia, and atrophic scars are cardinal signs of", "o": [["A", "Lichen planus"], ["B", "Psoriasis vulgaris"], ["C", "Acne vulgaris"], ["D", "Discoid lupus erythematosus"], ["E", "Rosacea"]], "a": "D", "sa": null, "pg": "65", "f": [], "s": "B", "n": 80, "e": ["The combination of well-defined plaques, adherent scales, dilated pilosebaceous orifices, telangiectasia and atrophy is typical of DLE.", "DLE."]}, {"id": "Q372", "ch": "Inflammatory Dermatoses", "q": "Cardinal signs of discoid lupus include all the following EXCEPT:", "o": [["A", "Erythema"], ["B", "Scaling"], ["C", "Lichenification"], ["D", "Stippling"], ["E", "Telangiectasia"]], "a": "C", "sa": null, "pg": "65", "f": [], "s": "B", "n": 81, "e": ["Lichenification is a sign of chronic eczema and is not a cardinal sign of DLE (erythema, telangiectasia, scaling, stippling, scarring).", "No lichenification."]}, {"id": "Q373", "ch": "Inflammatory Dermatoses", "q": "PUVA may be used in the treatment of all of the following EXCEPT", "o": [["A", "Psoriasis."], ["B", "Vitiligo."], ["C", "Discoid lupus erythematosus."], ["D", "Alopecia."], ["E", "Lichen planus. 1     A 32-year-old male patient presented with well-defined scaly erythematous plaques on his cheeks and nose with telangiectasia and atrophy. Plaques also showed dilatation of the pilosebaceous orifices. The condition started about five years ago and showed remissions and exacerbations with some improvement during winter times. (Clinical photo: erythematous scaly atrophic plaques on the cheek and nose - discoid lupus erythematosus.)"]], "a": "C", "sa": null, "pg": "66", "f": [], "s": "B", "n": 82, "e": ["DLE is photosensitive and UV light can worsen it, so PUVA is not used; PUVA is used for psoriasis, vitiligo and alopecia areata.", "Avoid UV in lupus."]}, {"id": "Q374", "ch": "Inflammatory Dermatoses", "q": "Topical treatment of this case includes", "o": [["A", "Benzyl benzoate 25%."], ["B", "Benzoyl peroxide 10%."], ["C", "Gentamycin ointment."], ["D", "Azole cream."], ["E", "Corticosteroid cream."]], "a": "E", "sa": null, "pg": "66", "f": [], "s": "B", "n": 83, "e": ["Localized DLE lesions are treated with potent topical (or intralesional) corticosteroids, plus sun protection.", "Potent topical steroid."]}, {"id": "Q375", "ch": "Inflammatory Dermatoses", "q": "One of the following is used in ttt of discoid lupus", "o": [["A", "Antimalarials."], ["B", "Phototherapy."], ["C", "Laser."], ["D", "Retinoids."], ["E", "Methotrexate."]], "a": "A", "sa": null, "pg": "66", "f": [], "s": "B", "n": 84, "e": ["Antimalarials such as hydroxychloroquine are systemic photoprotective and anti-inflammatory agents used for DLE.", "Hydroxychloroquine."]}, {"id": "Q376", "ch": "Inflammatory Dermatoses", "q": "Phototherapy is used in treating the following disease EXCEPT", "o": [["A", "Psoriasis."], ["B", "Systemic lupus erythematosus."], ["C", "Vitiligo."], ["D", "Alopecia areata."], ["E", "Atopic eczema."]], "a": "B", "sa": null, "pg": "66", "f": [], "s": "B", "n": 85, "e": ["Phototherapy treats psoriasis, vitiligo and alopecia areata, but lupus is photosensitive so it is avoided.", "Phototherapy not for lupus."]}, {"id": "Q377", "ch": "Inflammatory Dermatoses", "q": "Discoid lupus erythematosus is best treated by", "o": [["A", "Topical antimalarials only."], ["B", "Topical antimalarials + systemic antimalarials."], ["C", "Topical antimalarials + topical steroids."], ["D", "Topical antimalarials + systemic steroids."], ["E", "Systemic antimalarials + topical steroids."]], "a": "E", "sa": null, "pg": "66", "f": [], "s": "B", "n": 86, "e": ["Extensive DLE is best treated with systemic antimalarials plus topical steroids, with sun avoidance.", "Antimalarial + topical steroid."]}, {"id": "Q378", "ch": "Inflammatory Dermatoses", "q": "An oval skin lesion showing outer erythema, intermediate scaling, and inner healing center is called", "o": [["A", "Tinea circinata."], ["B", "Erysipelas."], ["C", "Herald patch of pityriasis rosea."], ["D", "Erythrasma."], ["E", "Scaly ringworm."]], "a": "C", "sa": null, "pg": "63", "f": [], "s": "B", "n": 87, "e": ["An oval lesion with outer erythema, intermediate scaling and an inner paler center is the herald patch of pityriasis rosea.", "Three zones."]}, {"id": "H189", "ch": "Inflammatory Dermatoses", "q": "A 35-year-old male presents with scaly erythematous symmetrical plaques on extensor surfaces and a positive Auspitz sign. What is the most likely diagnosis?", "o": [["A", "Psoriasis."], ["B", "Atopic dermatitis."], ["C", "Lichen planus."], ["D", "Seborrheic dermatitis."], ["E", "Pityriasis rosea."]], "a": "A", "sa": null, "pg": null, "f": [], "s": "H", "n": 88, "e": ["Symmetrical scaly erythematous extensor plaques with a positive Auspitz sign are psoriasis.", "Extensors + Auspitz."]}, {"id": "H192", "ch": "Inflammatory Dermatoses", "q": "Regarding topical treatment of psoriasis:", "o": [["A", "Permethrin cream is used."], ["B", "Topical steroids are contraindicated."], ["C", "Topical antiseptics and antibiotics are important."], ["D", "Topical vitamin D is effective."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 89, "e": ["Vitamin D analogue calcipotriol is effective topically, whereas permethrin (scabies) and antiseptics are not. Steroids are not contraindicated.", "Vitamin D works."]}, {"id": "H197", "ch": "Inflammatory Dermatoses", "q": "Actinic lichen planus usually affects:", "o": [["A", "Mucous membranes."], ["B", "Genitals."], ["C", "Upper back."], ["D", "Face."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 90, "e": ["Actinic LP occurs on the sun-exposed face and dorsum of hands, so the face is correct.", "Face."]}, {"id": "H198", "ch": "Inflammatory Dermatoses", "q": "Lichen planus actinicus usually affects:", "o": [["A", "Upper back."], ["B", "Genitalia."], ["C", "Nails."], ["D", "All of the above."], ["E", "None of the above."]], "a": "E", "sa": null, "pg": null, "f": [], "s": "H", "n": 91, "e": ["Actinic LP is on sun-exposed skin, not upper back, genitals or nails per this key (none of the above).", "Sun-exposed."]}, {"id": "H199", "ch": "Inflammatory Dermatoses", "q": "Well-defined flat-topped, polyangular, violaceous, itchy papules are the primary lesions of:", "o": [["A", "Vitiligo."], ["B", "Lupus erythematosus."], ["C", "Lichen planus."], ["D", "Psoriasis."], ["E", "None of the above."]], "a": "C", "sa": null, "pg": null, "f": [], "s": "H", "n": 92, "e": ["Flat-topped polyangular violaceous itchy papules are the primary lesion of lichen planus, unlike psoriasis (silvery scale) or lupus.", "LP."]}, {"id": "H201", "ch": "Inflammatory Dermatoses", "q": "Scarring alopecia may be caused by:", "o": [["A", "Psoriasis."], ["B", "Seborrheic dermatitis."], ["C", "Fever."], ["D", "Lichen planus."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 93, "e": ["Lichen planus of the scalp destroys the follicles and causes scarring alopecia, unlike psoriasis, seborrheic dermatitis or fever.", "LP can scar."]}, {"id": "H204", "ch": "Inflammatory Dermatoses", "q": "All of the following are types of lichen planus EXCEPT:", "o": [["A", "Actinic lichen planus."], ["B", "Pustular lichen planus."], ["C", "Annular lichen planus."], ["D", "Atrophic lichen planus."], ["E", "Hypertrophic lichen planus."]], "a": "B", "sa": null, "pg": null, "f": [], "s": "H", "n": 94, "e": ["Types of LP include actinic, annular, atrophic and hypertrophic; there is no pustular LP.", "No pustular LP."]}, {"id": "H205", "ch": "Inflammatory Dermatoses", "q": "Flat-topped, violaceous, polygonal, itchy papules on the wrists are typical of:", "o": [["A", "Psoriasis."], ["B", "Lichen planus."], ["C", "Common warts."], ["D", "Seborrheic dermatitis."], ["E", "Lupus erythematosus."]], "a": "B", "sa": null, "pg": null, "f": [], "s": "H", "n": 95, "e": ["Flat-topped violaceous polygonal itchy papules on the wrists are classic of lichen planus.", "Wrists."]}, {"id": "H209", "ch": "Inflammatory Dermatoses", "q": "Regarding lichen planus, the following is TRUE:", "o": [["A", "It is a contagious disease."], ["B", "The primary lesion is a pearly white umbilicated papule."], ["C", "Never affects the oral mucosa."], ["D", "Can lead to cicatricial alopecia."], ["E", "Is due to HSV-7."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 96, "e": ["LP can cause cicatricial alopecia; it is not contagious, usually does affect the mouth, and the pearly umbilicated papule is molluscum.", "LP scars scalp."]}, {"id": "H218", "ch": "Inflammatory Dermatoses", "q": "The primary lesion that precedes pityriasis rosea is:", "o": [["A", "Chicken pox."], ["B", "Primary herpetic gingivostomatitis."], ["C", "Herald patch."], ["D", "Stippling sign."], ["E", "Auspitz sign."]], "a": "C", "sa": null, "pg": null, "f": [], "s": "H", "n": 97, "e": ["A single herald patch precedes the generalized eruption of pityriasis rosea; the Auspitz sign is psoriasis and stippling is DLE.", "Herald patch."]}, {"id": "H219", "ch": "Inflammatory Dermatoses", "q": "An 18 years old girl came to the clinic complaining ofa skin rash of 10 days duration. On exam-ination,multiple oval lesions were scattered on the trunk in a “Christmas tree distribution. The primary lesion of this disease is:", "o": [["A", "Scaly erythema"], ["B", "Target lesion"], ["C", "Stippling sign"], ["D", "Nodule."], ["E", "Herald patch"]], "a": "E", "sa": null, "pg": null, "f": [], "s": "H", "n": 98, "e": ["Oval lesions in a Christmas-tree distribution mean pityriasis rosea, whose primary lesion is the herald patch.", "Herald patch."]}, {"id": "H221", "ch": "Inflammatory Dermatoses", "q": "PUVA may be used in the treatment of all of the following EXCEPT:", "o": [["A", "Psoriasis."], ["B", "Vitiligo."], ["C", "Discoid lupus erythematosus."], ["D", "Alopecia."], ["E", "None of the above."]], "a": "C", "sa": null, "pg": null, "f": [], "s": "H", "n": 99, "e": ["PUVA treats psoriasis, vitiligo and alopecia areata, but not DLE, which is made worse by light.", "DLE excluded."]}, {"id": "H224", "ch": "Inflammatory Dermatoses", "q": "The following findings are pathognomonic of discoid lupus erythematosus EXCEPT:", "o": [["A", "Erythema."], ["B", "Adherent scales."], ["C", "Dilated pilosebaceous orifices."], ["D", "Pustules."], ["E", "Telangiectasia."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 100, "e": ["Pustules are not a finding in DLE, unlike erythema, scales and dilated orifices.", "No pustules."]}, {"id": "H225", "ch": "Inflammatory Dermatoses", "q": "The clinical picture of discoid lupus erythematosus is:", "o": [["A", "Well-defined erythematous plaques covered with adherent scales."], ["B", "Ill-defined erythematous plaques covered with adherent scales."], ["C", "Ill-defined erythematous plaques covered with loose scales."], ["D", "Well-defined erythematous patches covered with adherent scales."], ["E", "Well-defined erythematous patches covered with loose scales."]], "a": "A", "sa": null, "pg": null, "f": [], "s": "H", "n": 101, "e": ["DLE gives well-defined erythematous plaques covered by adherent scales, with dilated follicles beneath.", "Adherent scales."]}, {"id": "H227", "ch": "Inflammatory Dermatoses", "q": "Discoid lupus erythematosus:", "o": [["A", "Usually occurs in semi-exposed areas."], ["B", "May be a manifestation of systemic lupus erythematosus."], ["C", "May end in cicatricial alopecia."], ["D", "Tropical antimalarials are very effective."], ["E", "May be confused with lichen planus."]], "a": "C", "sa": null, "pg": null, "f": [], "s": "H", "n": 102, "e": ["DLE of the scalp can end in cicatricial alopecia, and it improves with antimalarials but is not mainly at semi-exposed sites.", "DLE scars."]}, {"id": "H229", "ch": "Inflammatory Dermatoses", "q": "A 32-year-old male patient presented with well-defined scaly erythematous plaques on his cheeks and nose with telangiectasia and atrophy. Plaques also showed dilatation of the pilosebaceous orifices. The condition started to appear about five years ago and showed remissions and exacerbations with some improvement during winter times. What is the diagnosis of this case?", "o": [["A", "Discoid lupus."], ["B", "Contact urticaria."], ["C", "Contact dermatitis."], ["D", "Psoriasis."], ["E", "Vitiligo."]], "a": "A", "sa": null, "pg": null, "f": [], "s": "H", "n": 103, "e": ["Cheek and nose plaques with atrophy, telangiectasia, dilated orifices and chronic course improving in winter is discoid lupus.", "Sun-exposed face."]}, {"id": "Q379", "ch": "Allergic Disorders", "q": "In acute eczema, all of the following occurs EXCEPT", "o": [["A", "Erythema."], ["B", "Oozing."], ["C", "Lichenification."], ["D", "Vesicles."], ["E", "Crusting."]], "a": "C", "sa": null, "pg": "67", "f": [], "s": "B", "n": 1, "e": ["Acute eczema is the wet stage: erythema, edema, vesicles, oozing and crusting. Lichenification (thickened skin with accentuated lines) develops only after prolonged scratching, so it belongs to chronic eczema.", "Acute = vesicles/oozing; chronic = lichenification."]}, {"id": "Q380", "ch": "Allergic Disorders", "q": "Acute dermatitis presents by", "o": [["A", "Vesicles."], ["B", "Lichenification."], ["C", "Wheals."], ["D", "Pustules."], ["E", "Ulcers."]], "a": "A", "sa": null, "pg": "67", "f": [], "s": "B", "n": 2, "e": ["In the acute phase eczema presents with papules and vesicles on an erythematous edematous base, followed by oozing and crusts.", "Acute dermatitis → vesicles."]}, {"id": "Q381", "ch": "Allergic Disorders", "q": "Chronic eczema is characterized by one of the following", "o": [["A", "Erythema."], ["B", "Oozing."], ["C", "Lichenification."], ["D", "Vesicles."], ["E", "Pustules."]], "a": "C", "sa": null, "pg": "67", "f": [], "s": "B", "n": 3, "e": ["Chronic eczema results from prolonged, repeated attacks, giving lichenification, excoriations and pigment change. Erythema, oozing, vesicles and pustules are acute or infected features.", "Chronic = lichenification."]}, {"id": "Q382", "ch": "Allergic Disorders", "q": "Chronic eczema is characterized by", "o": [["A", "Itching."], ["B", "Vesiculation."], ["C", "Lichenification."], ["D", "a + b."], ["E", "a + c."]], "a": "E", "sa": null, "pg": "67", "f": [], "s": "B", "n": 4, "e": ["Chronic eczema is itchy (a) and lichenified (c). Vesiculation (b) belongs to the acute stage, so a + c is correct.", "Itch + lichenification."]}, {"id": "Q383", "ch": "Allergic Disorders", "q": "A 4-month-old infant had bilateral erythematous plaques with vesicles, oozing and crusts on both cheeks. The child was very irritable. The most probable diagnosis is", "o": [["A", "Allergic contact dermatitis."], ["B", "Primary irritant dermatitis."], ["C", "Atopic dermatitis."], ["D", "Impetigo contagiosum."], ["E", "Molluscum contagiosum. 2     A male baby, 4 months old, presented with a reddish rash on his face. His mother reported that the baby was irritable and always crying. On examination, papules and vesicles were noted. (Clinical photo: infant with erythematous papulovesicular rash on the cheeks.)"]], "a": "C", "sa": null, "pg": "68", "f": [], "s": "B", "n": 5, "e": ["A 4-month-old with bilateral cheek erythema, vesicles, oozing and crusts has the infantile phase of atopic dermatitis, which starts after 2 months and involves the face and extensor surfaces. Seborrheic dermatitis in infants appears earlier with greasy scales.", "Infantile atopic: cheeks."]}, {"id": "Q384", "ch": "Allergic Disorders", "q": "Diagnosis of this case is", "o": [["A", "Stasis dermatitis."], ["B", "Allergic dermatitis."], ["C", "Atopic dermatitis."], ["D", "Seborrheic dermatitis."], ["E", "Irritant dermatitis."]], "a": "C", "sa": null, "pg": "68", "f": [], "s": "B", "n": 6, "e": ["Facial weeping eczematous lesions in an infant fit infantile atopic dermatitis, often with a family history of atopy.", "Cheeks in infants."]}, {"id": "Q385", "ch": "Allergic Disorders", "q": "An infant with bilateral erythematous papulo-vesicular eruption of the cheeks with elevated IgE is suffering from", "o": [["A", "Atopic eczema."], ["B", "Varicose eczema."], ["C", "Dyshidrotic eczema."], ["D", "Stasis eczema."], ["E", "Impetigo contagiosum."]], "a": "A", "sa": null, "pg": "68", "f": [], "s": "B", "n": 7, "e": ["Bilateral papulovesicular cheek eruption in an infant with raised IgE indicates atopic eczema; atopy is mediated by IgE.", "IgE elevated in atopy."]}, {"id": "Q386", "ch": "Allergic Disorders", "q": "A 6-year-old child presented with groups of itchy papules involving the flexures & sides of the neck. The most probable diagnosis is", "o": [["A", "Varicose eczema."], ["B", "Contact eczema."], ["C", "Atopic eczema."], ["D", "Stasis eczema."], ["E", "Seborrheic eczema. 2     A male baby, 4 months old, presented with a reddish rash on his face. His mother reported that the baby was irritable and always crying. On examination, papules and vesicles were noted. (Clinical photo: infant with erythematous papulovesicular rash on the cheeks.)"]], "a": "C", "sa": null, "pg": "68", "f": [], "s": "B", "n": 8, "e": ["Itchy papules on the flexures and neck sides of a child are the childhood phase of atopic dermatitis, which prefers antecubital and popliteal fossae.", "Child: flexures."]}, {"id": "Q387", "ch": "Allergic Disorders", "q": "One of the following statements about this disease is true", "o": [["A", "Transmitted by direct contact."], ["B", "Diagnosed by patch test."], ["C", "Heals with a scar."], ["D", "Family history is usually positive."], ["E", "Treated by topical retinoids."]], "a": "D", "sa": null, "pg": "67", "f": [], "s": "B", "n": 9, "e": ["Atopic dermatitis is a hereditary predisposition; family history of asthma, rhinitis or dermatitis is positive in 50-70%. It is not contagious and does not scar.", "Family history positive."]}, {"id": "Q388", "ch": "Allergic Disorders", "q": "The following characterizes atopic eczema", "o": [["A", "Antiseptic lotions are used for lichenified lesions."], ["B", "In infants, lichenified lesions are common."], ["C", "In children, it is common on cheeks."], ["D", "In adults, it is common on flexor areas."], ["E", "Pruritus is absent."]], "a": "D", "sa": null, "pg": "69", "f": [], "s": "B", "n": 10, "e": ["In adults the lesions are like childhood ones with lichenification, common in flexures (flexor areas). Infants favor the face and extensors.", "Adult atopic: flexural, lichenified."]}, {"id": "Q389", "ch": "Allergic Disorders", "q": "Sites of atopic dermatitis in the infantile and childhood phases are ___", "o": [], "a": null, "sa": "Infantile phase: face, neck, extensor extremities (and flexures); childhood phase: flexures, particularly antecubital and popliteal fossae (al
