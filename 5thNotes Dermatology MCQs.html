so face, neck, extensors).", "pg": "68", "f": [], "s": "B", "n": 11, "e": ["Infantile phase: face, neck, extensor extremities (and flexures). Childhood phase: flexures, particularly antecubital and popliteal fossae, plus face and neck.", "Infant face/extensors; child flexures."]}, {"id": "Q390", "ch": "Allergic Disorders", "q": "A 9-year-old female has recurrent itchy papulo-vesicular lesions on the antecubital and popliteal fossae. Her mother gave a history that the child had similar lesions on the cheeks since she was one year old. The best treatment for this condition is", "o": [["A", "Terbinafine."], ["B", "Acyclovir."], ["C", "Dapsone."], ["D", "Topical steroids."], ["E", "Electrocautery."]], "a": "D", "sa": null, "pg": "75", "f": [], "s": "B", "n": 12, "e": ["Recurrent itchy papulovesicular lesions in the elbow and knee flexures, with facial lesions in infancy, are atopic dermatitis; topical corticosteroids (with moisturizers) are the treatment. Terbinafine, acyclovir and dapsone treat other conditions.", "Moisturizer + topical steroid."]}, {"id": "Q391", "ch": "Allergic Disorders", "q": "Seborrheic dermatitis may be treated by", "o": [["A", "Olive oil in infantile scalp lesions."], ["B", "Topical antifungals."], ["C", "Topical steroids."], ["D", "Selenium sulphide."], ["E", "All of the above."]], "a": "E", "sa": null, "pg": "75", "f": [], "s": "B", "n": 13, "e": ["Seborrheic dermatitis (due to the yeast Malassezia) is treated with oils for infantile scalp crusts, topical antifungals, mild steroids and selenium sulfide shampoos, so all options apply.", "Oil, antifungal, steroid, selenium."]}, {"id": "Q392", "ch": "Allergic Disorders", "q": "Allergic contact dermatitis", "o": [["A", "Is an immunological reaction."], ["B", "Occurs in any individual soon after exposure."], ["C", "Can be caused by acids or alkalis."], ["D", "Can occur due to cumulative damage by mild irritants."], ["E", "Occurs in compulsive washers. 1     A female patient, 18 years old, presented with an itchy rash on the dorsa of both hands and forearms. The condition started 2 days after henna application with a gradual onset and a progressive course. Patient reported that she once applied henna a year ago and no rash appeared then."]], "a": "A", "sa": null, "pg": "72", "f": [], "s": "B", "n": 14, "e": ["Allergic contact dermatitis is a delayed immunological reaction in sensitized individuals after exposure to an allergen. Irritant dermatitis, by contrast, is non-immunological.", "Allergic = immune; irritant = direct damage."]}, {"id": "Q393", "ch": "Allergic Disorders", "q": "What is the diagnosis of this case?", "o": [["A", "Psoriasis vulgaris."], ["B", "Irritant dermatitis."], ["C", "Allergic dermatitis."], ["D", "Neurodermatitis."], ["E", "Lichen planus."]], "a": "C", "sa": null, "pg": "72", "f": [], "s": "B", "n": 15, "e": ["A localized eczematous rash occurring at the site of contact is allergic contact dermatitis; confirm with patch test.", "Rash follows contact."]}, {"id": "Q394", "ch": "Allergic Disorders", "q": "A 33-year-old man develops severely itchy vesicular lesions at the sites of contact with a leather belt. Lesions are confined to the waistband area. Patch testing is positive for nickel. The most likely diagnosis is", "o": [["A", "Seborrheic dermatitis."], ["B", "Allergic contact dermatitis."], ["C", "Atopic dermatitis."], ["D", "Stasis dermatitis."], ["E", "Angioedema."]], "a": "B", "sa": null, "pg": "72", "f": [], "s": "B", "n": 16, "e": ["Vesicles confined to the belt buckle area with a positive nickel patch test prove allergic contact dermatitis to nickel. Seborrheic, atopic and stasis dermatitis have different distributions.", "Nickel patch test +."]}, {"id": "Q395", "ch": "Allergic Disorders", "q": "A 17-year-old female presents with a pruritic rash localized to the wrist. Papules and vesicles are noted in a band-like pattern, with slight oozing from some lesions. Which of the following is the most likely cause of the rash?", "o": [["A", "Stasis dermatitis."], ["B", "Herpes zoster."], ["C", "Atopic dermatitis."], ["D", "Seborrheic dermatitis."], ["E", "Contact dermatitis. 1     A female patient, 21 years old, presented with a rash on the dorsa of both feet. Rash was severely itchy. (Clinical photo: erythematous eczematous rash on the dorsa of both feet at the sites of sandal straps.)"]], "a": "E", "sa": null, "pg": "72", "f": [], "s": "B", "n": 17, "e": ["A band-like rash on the wrist suggests contact with a watch or bracelet: contact dermatitis. Herpes zoster is dermatomal and stasis dermatitis occurs in the legs.", "Band-like pattern = contact."]}, {"id": "Q396", "ch": "Allergic Disorders", "q": "What is the diagnosis of this case?", "o": [["A", "Irritant dermatitis."], ["B", "Papular urticaria."], ["C", "Stasis eczema."], ["D", "Neurodermatitis."], ["E", "Allergic dermatitis."]], "a": "E", "sa": null, "pg": null, "f": [], "s": "B", "n": 18, "e": ["A rash at the area of contact with a shoe or ornament is allergic dermatitis, diagnosed by patch testing.", "Contact allergen."]}, {"id": "Q397", "ch": "Allergic Disorders", "q": "Patch test is useful for diagnosis of", "o": [["A", "Atopic dermatitis."], ["B", "Stasis dermatitis."], ["C", "Urticaria."], ["D", "Irritant contact dermatitis."], ["E", "Allergic contact dermatitis."]], "a": "E", "sa": null, "pg": null, "f": [], "s": "B", "n": 19, "e": ["Patch testing detects type IV hypersensitivity, so it is used for allergic contact dermatitis (not for urticaria or atopic dermatitis).", "Patch test = allergic contact."]}, {"id": "Q398", "ch": "Allergic Disorders", "q": "Acute oozing skin conditions are best treated by", "o": [["A", "Powders."], ["B", "Ointments."], ["C", "Creams."], ["D", "Drying lotions."], ["E", "Emulsions."]], "a": "D", "sa": null, "pg": "75", "f": [], "s": "B", "n": 20, "e": ["Weeping lesions are dried with drying antiseptic lotions (potassium permanganate, aluminum acetate). Ointments and creams would macerate the skin.", "Wet lesions: lotions; chronic dry lesions: ointments."]}, {"id": "Q399", "ch": "Allergic Disorders", "q": "An acute eruption of intensely itchy papules or wheals is called", "o": [["A", "Acne vulgaris."], ["B", "Pityriasis rosea."], ["C", "Psoriasis."], ["D", "Urticaria."], ["E", "Scabies."]], "a": "D", "sa": null, "pg": "77", "f": [], "s": "B", "n": 21, "e": ["Urticaria is an itchy eruption of raised wheals appearing suddenly; it is acute if shorter than 6 weeks.", "Wheals = urticaria."]}, {"id": "Q400", "ch": "Allergic Disorders", "q": "The primary lesion of urticaria is", "o": [["A", "Papule."], ["B", "Vesicle."], ["C", "Macule."], ["D", "Pustule."], ["E", "Wheal. 1     The picture shows one of the primary lesions of the skin: a transient, edematous, erythematous or skin-colored elevation of the skin of variable sizes. (Clinical photo: erythematous edematous wheals.)"]], "a": "E", "sa": null, "pg": "77", "f": [], "s": "B", "n": 22, "e": ["The wheal is a transient edematous elevation and is the primary lesion of urticaria.", "Wheal."]}, {"id": "Q401", "ch": "Allergic Disorders", "q": "This primary lesion is characteristic of", "o": [["A", "Psoriasis."], ["B", "Herpes simplex."], ["C", "Urticaria."], ["D", "Warts."], ["E", "Molluscum contagiosum."]], "a": "C", "sa": null, "pg": "77", "f": [], "s": "B", "n": 23, "e": ["The transient edematous plaque pictured is the wheal, characteristic of urticaria.", "Wheal."]}, {"id": "Q402", "ch": "Allergic Disorders", "q": "Scarring is NOT found in", "o": [["A", "Discoid lupus erythematosus."], ["B", "Favus."], ["C", "Acne vulgaris."], ["D", "Ecthyma."], ["E", "Urticaria. 1     A male patient, 52 years old, presented with sudden appearance of a reddish rash on his back, both upper limbs and extended to the lower limbs. Rash was itchy. There was no fever. (Clinical photo: large erythematous edematous wheals on the back.)"]], "a": "E", "sa": null, "pg": "6", "f": [], "s": "B", "n": 24, "e": ["Urticarial wheals are due to dermal edema that resolves without leaving a scar. Ecthyma, DLE and kerion can scar.", "Urticaria: no scar."]}, {"id": "Q403", "ch": "Allergic Disorders", "q": "Diagnosis of this case is", "o": [["A", "Stevens-Johnson syndrome."], ["B", "Erythema multiforme."], ["C", "Angioedema."], ["D", "Urticaria."], ["E", "Fixed drug eruption."]], "a": "D", "sa": null, "pg": "77", "f": [], "s": "B", "n": 25, "e": ["A sudden itchy rash over the back and limbs without fever is urticaria; erythema multiforme gives target lesions and SJS gives mucosal erosions.", "Fleeting itchy wheals."]}, {"id": "Q404", "ch": "Allergic Disorders", "q": "Angioedema can be life threatening as it causes", "o": [["A", "Arrhythmias."], ["B", "Renal failure."], ["C", "Retinopathy."], ["D", "Myalgia."], ["E", "Laryngeal edema."]], "a": "E", "sa": null, "pg": "77", "f": [], "s": "B", "n": 26, "e": ["Angioedema involves the deep dermis and hypodermis and can involve the larynx, causing airway obstruction.", "Laryngeal edema."]}, {"id": "Q405", "ch": "Allergic Disorders", "q": "Angioedema", "o": [["A", "Is an emergency condition."], ["B", "Is a severe form of eczema."], ["C", "Is treated by antibiotics."], ["D", "Acetylcholine is the mediator."], ["E", "Is due to lymphedema."]], "a": "A", "sa": null, "pg": "77", "f": [], "s": "B", "n": 27, "e": ["Because it may involve the larynx, angioedema is an emergency needing immediate treatment; it is not an eczema or lymphedema.", "Emergency."]}, {"id": "Q406", "ch": "Allergic Disorders", "q": "The following type of urticaria may be life threatening", "o": [["A", "Papular urticaria."], ["B", "Cholinergic urticaria."], ["C", "Dermographism."], ["D", "Angioedema."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": "77", "f": [], "s": "B", "n": 28, "e": ["Angioedema is the urticarial variant that can threaten life through laryngeal edema.", "Angioedema."]}, {"id": "Q407", "ch": "Allergic Disorders", "q": "Choose the correct answer", "o": [["A", "Lichen planus is caused by pox virus."], ["B", "The treatment of choice of discoid lupus erythematosus is PUVA."], ["C", "Herald patch is the primary lesion of urticaria."], ["D", "Angioedema could be life threatening."], ["E", "Alopecia areata is a form of cicatricial alopecia."]], "a": "D", "sa": null, "pg": "77", "f": [], "s": "B", "n": 29, "e": ["Angioedema could be life threatening due to laryngeal edema and respiratory obstruction.", "Airway."]}, {"id": "Q408", "ch": "Allergic Disorders", "q": "Histamine is the main mediator of", "o": [["A", "Contact dermatitis."], ["B", "Urticaria."], ["C", "Atopic dermatitis."], ["D", "Psoriasis."], ["E", "Discoid lupus erythematosus."]], "a": "B", "sa": null, "pg": "77", "f": [], "s": "B", "n": 30, "e": ["Histamine released from mast cells is the principal mediator of urticaria, with prostaglandins and leukotrienes.", "Histamine."]}, {"id": "Q409", "ch": "Allergic Disorders", "q": "Urticaria is", "o": [["A", "Type I hypersensitivity reaction."], ["B", "Type II hypersensitivity reaction."], ["C", "Type III hypersensitivity reaction."], ["D", "Type IV hypersensitivity reaction."], ["E", "None of the above."]], "a": "A", "sa": null, "pg": "77", "f": [], "s": "B", "n": 31, "e": ["Urticaria is a type I (IgE-mediated) hypersensitivity, although cholinergic types act through acetylcholine-stimulated mast cells.", "Type I; allergic contact is type IV."]}, {"id": "Q410", "ch": "Allergic Disorders", "q": "The primary effector cell in urticaria pathogenesis is the", "o": [["A", "Keratinocyte."], ["B", "Neutrophil."], ["C", "Mast cell."], ["D", "Melanocyte."], ["E", "Langerhans cell."]], "a": "C", "sa": null, "pg": null, "f": [], "s": "B", "n": 32, "e": ["The mast cell is the primary effector cell: IgE bound to mast cells triggers degranulation on re-exposure.", "Mast cell."]}, {"id": "Q411", "ch": "Allergic Disorders", "q": "Pathogenesis of urticaria is through", "o": [["A", "Vasoconstriction of blood vessels."], ["B", "Exaggerated cell-mediated immune response."], ["C", "Plasma cell activation."], ["D", "IgD-mediated allergic reaction."], ["E", "Increased capillary permeability."]], "a": "E", "sa": null, "pg": "77", "f": [], "s": "B", "n": 33, "e": ["Mediators such as histamine increase capillary permeability, producing dermal edema (wheal). Vasoconstriction is not involved.", "Permeability ↑, vasodilatation."]}, {"id": "Q412", "ch": "Allergic Disorders", "q": "Which of the following is TRUE about urticaria?", "o": [["A", "In the ordinary type, the main mediator is acetylcholine."], ["B", "It involves skin and mucous membranes."], ["C", "Adrenaline is the treatment of the papular type."], ["D", "Wheal is caused by vasoconstriction."], ["E", "In cholinergic urticaria, the mediator is cholestyramine."]], "a": "B", "sa": null, "pg": "77", "f": [], "s": "B", "n": 34, "e": ["Urticaria can affect skin and mucous membranes (e.g. lips, oral mucosa). Adrenaline is for severe cases, not the papular type, and acetylcholine mediates only cholinergic urticaria.", "Skin + mucosa."]}, {"id": "Q413", "ch": "Allergic Disorders", "q": "Physical urticaria includes all of the following EXCEPT", "o": [["A", "Solar urticaria."], ["B", "Papular urticaria."], ["C", "Pressure urticaria."], ["D", "Heat urticaria."], ["E", "None of the above. 1     A 33-year-old female patient presented with erythematous, edematous, evanescent itchy lesions on her back of variable sizes. Patient stated that they always appear at sites of exposure to pressure on her skin. (Clinical photo: linear erythematous wheals on the back.)"]], "a": "B", "sa": null, "pg": "78", "f": [], "s": "B", "n": 35, "e": ["Physical urticaria (solar, cold, heat, aquagenic, dermographism, pressure) is provoked by physical stimuli. Papular urticaria is a hypersensitivity to insect bites.", "Papular urticaria ≠ physical."]}, {"id": "Q414", "ch": "Allergic Disorders", "q": "What is the diagnosis of this case?", "o": [["A", "Acute eczema."], ["B", "Erythema multiforme."], ["C", "Chronic spontaneous urticaria."], ["D", "Physical urticaria."], ["E", "Lichen planus."]], "a": "D", "sa": null, "pg": "78", "f": [], "s": "B", "n": 36, "e": ["Wheals induced by physical stimuli such as pressure, cold, heat, sun or water indicate physical (chronic inducible) urticaria.", "Physical trigger."]}, {"id": "Q415", "ch": "Allergic Disorders", "q": "Cholinergic urticaria is induced by which of the following precipitating factors", "o": [["A", "Foods as fish, milk, eggs or strawberries."], ["B", "Drugs as salicylates, antibiotics or NSAIDs."], ["C", "Blood elements."], ["D", "Insect bites."], ["E", "Sweating, physical effort, psychological stress or increased environmental temperature."]], "a": "E", "sa": null, "pg": "79", "f": [], "s": "B", "n": 37, "e": ["Cholinergic urticaria follows sweating from physical effort, emotional stress or heat; acetylcholine stimulates mast cells, giving 1-3 mm wheals lasting less than an hour.", "Small wheals with sweating."]}, {"id": "Q416", "ch": "Allergic Disorders", "q": "A 22-year-old woman developed small itchy wheals after physical exertion, walking in the sun, eating hot spicy food and when she was angry. The most likely diagnosis is", "o": [["A", "Chronic idiopathic urticaria."], ["B", "Heat urticaria."], ["C", "Solar urticaria."], ["D", "Cholinergic urticaria."], ["E", "Papular urticaria."]], "a": "D", "sa": null, "pg": "79", "f": [], "s": "B", "n": 38, "e": ["Small itchy wheals provoked by exertion, hot spicy food, sun and anger are cholinergic urticaria. Solar and heat urticaria are induced by sun or heat alone.", "Sweat-induced."]}, {"id": "Q417", "ch": "Allergic Disorders", "q": "The mainstay of treatment of urticaria is", "o": [["A", "Topical corticosteroids."], ["B", "Topical antihistamines."], ["C", "Oral antihistamines."], ["D", "Oral erythromycin."], ["E", "Emollients and moisturizers."]], "a": "C", "sa": null, "pg": "79", "f": [], "s": "B", "n": 39, "e": ["Systemic antihistamines are the mainstay; topical agents and erythromycin do not control wheals.", "Oral antihistamine."]}, {"id": "Q418", "ch": "Allergic Disorders", "q": "A 35-year-old woman develops an itchy rash over her back, legs, and trunk several hours after swimming in a lake. Erythematous edematous papules and plaques are noted. Lesions vary in size. There are no mucosal lesions and no swelling of the lips. What is best first step in management of her symptomatic rash?", "o": [["A", "Subcutaneous epinephrine."], ["B", "Intravenous glucocorticoids."], ["C", "Oral antihistamines."], ["D", "Aspirin."], ["E", "Doxycycline."]], "a": "C", "sa": null, "pg": "79", "f": [], "s": "B", "n": 40, "e": ["Urticaria after swimming (cold or water contact) is treated with oral antihistamines.", "H1 blocker."]}, {"id": "Q419", "ch": "Allergic Disorders", "q": "Systemic treatment of urticaria includes", "o": [["A", "Corticosteroids."], ["B", "Antihistamines."], ["C", "Adrenaline."], ["D", "All of the above."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": "79", "f": [], "s": "B", "n": 41, "e": ["Systemic options are antihistamines (mainstay), corticosteroids for short courses, and adrenaline in emergencies, so all of the above.", "All."]}, {"id": "Q420", "ch": "Allergic Disorders", "q": "Which of the following is TRUE about urticaria?", "o": [["A", "It is treated by intravenous corticosteroids in severe cases."], ["B", "It is a type II hypersensitivity reaction."], ["C", "Acetylcholine is the mediator of the papular type."], ["D", "Cholinergic type may be caused by intestinal parasites."], ["E", "Intravenous adrenaline is life saving."]], "a": "A", "sa": null, "pg": "79", "f": [], "s": "B", "n": 42, "e": ["Severe urticaria and angioedema may need IV antihistamines and IV corticosteroids.", "IV steroids severe."]}, {"id": "Q421", "ch": "Allergic Disorders", "q": "SC adrenaline is life saving in patients suffering from", "o": [["A", "Angioedema."], ["B", "Papular urticaria."], ["C", "Aquagenic urticaria."], ["D", "Cholinergic urticaria."], ["E", "Solar urticaria."]], "a": "A", "sa": null, "pg": null, "f": [], "s": "B", "n": 43, "e": ["Adrenaline (epinephrine) 300-500 mcg SC or IM is life-saving for angioedema involving the oropharynx or larynx, and anaphylaxis.", "Adrenaline."]}, {"id": "Q422", "ch": "Allergic Disorders", "q": "The following therapy is a life-saving measure in laryngeal angioedema", "o": [["A", "IV adrenaline."], ["B", "SC adrenaline."], ["C", "IV corticosteroids."], ["D", "IM corticosteroids."], ["E", "Antihistamines."]], "a": "B", "sa": null, "pg": null, "f": [], "s": "B", "n": 44, "e": ["In laryngeal angioedema SC (or IM) adrenaline rapidly reverses airway edema, while antihistamines alone are slower.", "Adrenaline first."]}, {"id": "Q423", "ch": "Allergic Disorders", "q": "The following therapy is a life saving measure in acute urticaria", "o": [["A", "IV adrenaline."], ["B", "Topical corticosteroids."], ["C", "SC adrenaline."], ["D", "IM methotrexate."], ["E", "Oral antihistamines."]], "a": "C", "sa": null, "pg": "79", "f": [], "s": "B", "n": 45, "e": ["Per the book's key, SC adrenaline is the life-saving measure; strictly, adrenaline is reserved for angioedema/anaphylaxis, not routine acute urticaria. Flagged for your review.", "Adrenaline for airway."]}, {"id": "Q424", "ch": "Allergic Disorders", "q": "A 25-year-old female presented with puffiness of both eyes and lips with difficulty in breathing. The following is a proper life-saving treatment for her", "o": [["A", "0.5 ml 1/100 adrenaline IV."], ["B", "0.5 ml 1/1000 adrenaline SC."], ["C", "1,000,000 IU penicillin IV."], ["D", "5 ml adrenaline 1/100 solution SC."], ["E", "Calamine lotion compresses on involved sites."]], "a": "B", "sa": null, "pg": "79", "f": [], "s": "B", "n": 46, "e": ["Eyelid and lip swelling with breathing difficulty is angioedema, an emergency; give adrenaline 0.5 ml of 1/1000 SC (300-500 mcg).", "Adrenaline 0.5 ml 1/1000."]}, {"id": "Q425", "ch": "Allergic Disorders", "q": "All the following drugs may be used in treatment of angioedema except", "o": [["A", "Corticosteroids."], ["B", "Adrenaline."], ["C", "Hydroxyzine."], ["D", "Salicylate."], ["E", "Chlorpheniramine maleate."]], "a": "D", "sa": null, "pg": "79", "f": [], "s": "B", "n": 47, "e": ["Corticosteroids, adrenaline and antihistamines (hydroxyzine, chlorpheniramine) are used. Salicylates (aspirin) can actually trigger urticaria/angioedema.", "Avoid aspirin/NSAIDs."]}, {"id": "Q426", "ch": "Allergic Disorders", "q": "Cutaneous drug reactions may present with the following EXCEPT", "o": [["A", "Acneform eruption."], ["B", "Lichenoid eruption."], ["C", "Neuralgia."], ["D", "Bullous eruption."], ["E", "Erythroderma."]], "a": "C", "sa": null, "pg": "80", "f": [], "s": "B", "n": 48, "e": ["Drug eruptions may appear as exanthematous, urticarial, acneiform, lichenoid, bullous or erythrodermic reactions. Neuralgia is not a cutaneous reaction.", "Neuralgia not a rash."]}, {"id": "Q427", "ch": "Allergic Disorders", "q": "Drug eruptions may be", "o": [["A", "Eczematous."], ["B", "Acneiform."], ["C", "Pigmented."], ["D", "All of the above."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": "80", "f": [], "s": "B", "n": 49, "e": ["Drugs can cause eczematous, acneiform and pigmented eruptions as well as urticarial and fixed reactions.", "Many patterns."]}, {"id": "Q428", "ch": "Allergic Disorders", "q": "Exanthematous drug reaction presents by", "o": [["A", "Papules on an erythematous background."], ["B", "Vesicles and bullae."], ["C", "Wheals."], ["D", "Pustules."], ["E", "Violaceous macules and patches."]], "a": "A", "sa": null, "pg": "80", "f": [], "s": "B", "n": 50, "e": ["Exanthematous reactions produce papules on an erythematous background that start proximally and generalize in 1-2 days, with marked pruritus.", "Morbilliform."]}, {"id": "Q429", "ch": "Allergic Disorders", "q": "Acneform drug eruption is commonly caused by which of the following drug?", "o": [["A", "Analgesics."], ["B", "Corticosteroids."], ["C", "Tetracyclines."], ["D", "Penicillins."], ["E", "Erythromycin."]], "a": "B", "sa": null, "pg": "81", "f": [], "s": "B", "n": 51, "e": ["Corticosteroids and anti-epileptics cause acneiform eruptions, which lack comedones. Tetracyclines treat acne.", "Steroid acne: no comedones."]}, {"id": "Q430", "ch": "Allergic Disorders", "q": "A 20-year-old male patient had fever and a sore throat for which he received sulphamethoxazole- trimethoprim. The next day, he developed a violaceous macule on his lip. The most probable diagnosis is", "o": [["A", "Herpes simplex."], ["B", "Lichen planus."], ["C", "Discoid lupus erythematosus."], ["D", "Fixed drug eruption."], ["E", "Impetigo."]], "a": "D", "sa": null, "pg": "81", "f": [], "s": "B", "n": 52, "e": ["A violaceous lip macule after sulfonamide (trimethoprim-sulfamethoxazole) is a fixed drug eruption, which characteristically involves the lips and genitalia.", "Lips + sulfa."]}, {"id": "Q431", "ch": "Allergic Disorders", "q": "27-year-old male develops a vesicobullous lesion on the glans soon after taking oral tetracycline. The lesion healed with hyperpigmentation. The diagnosis is", "o": [["A", "Herpes progenitalis."], ["B", "Fixed drug eruption."], ["C", "Genital warts."], ["D", "Genital molluscum."], ["E", "Chlamydia infection."]], "a": "B", "sa": null, "pg": "81", "f": [], "s": "B", "n": 53, "e": ["A vesiculobullous glans lesion after tetracycline that heals with hyperpigmentation is a fixed drug eruption, not herpes (which recurs without drug and with grouped vesicles).", "Genitals; leaves pigmentation."]}, {"id": "Q432", "ch": "Allergic Disorders", "q": "Fixed drug eruption is named so because it is", "o": [["A", "Fixed to site."], ["B", "Fixed to site and drug."], ["C", "Fixed to drug."], ["D", "Fixed to duration."], ["E", "Fixed to season."]], "a": "B", "sa": null, "pg": "81", "f": [], "s": "B", "n": 54, "e": ["It recurs at the same site each time the same (or related) drug is taken, so it is fixed to site and drug.", "Fixed to site and drug."]}, {"id": "Q433", "ch": "Allergic Disorders", "q": "Fixed drug eruption is treated by", "o": [["A", "Topical corticosteroid."], ["B", "Topical terbinafine."], ["C", "Systemic acyclovir."], ["D", "Systemic cyclosporin."], ["E", "IVIGs."]], "a": "A", "sa": null, "pg": "82", "f": [], "s": "B", "n": 55, "e": ["Management is to stop the offending drug; potent topical corticosteroid and antihistamines relieve the lesion.", "Stop the drug."]}, {"id": "Q434", "ch": "Allergic Disorders", "q": "Regarding drug reaction, which statement is not true?", "o": [["A", "Involve skin and mucous membrane."], ["B", "Corticosteroids are used to treat acneiform eruptions."], ["C", "Antihistaminics are used to treat urticarial eruptions."], ["D", "Blisters are seen in fixed eruptions."], ["E", "Exanthematous reactions cause pruritus."]], "a": "B", "sa": null, "pg": "82", "f": [], "s": "B", "n": 56, "e": ["Corticosteroids can themselves cause acneiform eruption, so they are not used to treat it; retinoids and antibiotics are.", "Steroids not for acneiform."]}, {"id": "Q435", "ch": "Allergic Disorders", "q": "The commonest viral infection involved in the etiology of erythema multiforme is", "o": [["A", "Human papilloma virus."], ["B", "Herpes simplex."], ["C", "Cytomegalovirus."], ["D", "Varicella Zoster virus."], ["E", "Epstein Barr virus."]], "a": "B", "sa": null, "pg": "82", "f": [], "s": "B", "n": 57, "e": ["Herpes simplex virus is the most common trigger of erythema multiforme, followed by drugs and other infections.", "HSV."]}, {"id": "Q436", "ch": "Allergic Disorders", "q": "Target lesions are classic of", "o": [["A", "Atopic dermatitis."], ["B", "Seborrheic dermatitis."], ["C", "Erythema multiforme."], ["D", "Fixed drug eruption."], ["E", "Alopecia areata."]], "a": "C", "sa": null, "pg": "82", "f": [], "s": "B", "n": 58, "e": ["Target (iris) lesions are classic of erythema multiforme: three concentric zones, with a dark center, pink ring and red outer ring.", "Target = EM."]}, {"id": "Q437", "ch": "Allergic Disorders", "q": "The most characteristic lesion of erythema multiforme is", "o": [["A", "Wheal."], ["B", "Burrow."], ["C", "Furrow."], ["D", "Herald patch."], ["E", "Iris lesion."]], "a": "E", "sa": null, "pg": "82", "f": [], "s": "B", "n": 59, "e": ["The iris (target) lesion is the characteristic lesion of EM and often involves oral mucosa.", "Iris."]}, {"id": "H232", "ch": "Allergic Disorders", "q": "Allergic contact dermatitis is which type of hypersensitivity reaction?", "o": [["A", "Type I."], ["B", "Type II."], ["C", "Type III."], ["D", "Type IV."], ["E", "Type V."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 60, "e": ["Allergic contact dermatitis is a delayed type IV (T-cell mediated) hypersensitivity, unlike urticaria (type I).", "Type IV."]}, {"id": "H233", "ch": "Allergic Disorders", "q": "The primary lesion of urticaria is:", "o": [["A", "Papule."], ["B", "Vesicle."], ["C", "Macule."], ["D", "Pustule."], ["E", "Wheal."]], "a": "E", "sa": null, "pg": null, "f": [], "s": "H", "n": 61, "e": ["Urticaria is characterized by wheals, which are transient edematous elevations.", "Wheal."]}, {"id": "H234", "ch": "Allergic Disorders", "q": "Mother complain that her infant has red rash and vesicles and papules in his face and he is very irritable and crying :", "o": [["A", "Atopic dermatitis"], ["B", "Discoid lupus erythematosus"]], "a": "A", "sa": null, "pg": null, "f": [], "s": "H", "n": 62, "e": ["An irritable infant with facial red papulovesicular rash has infantile atopic dermatitis; discoid lupus does not occur like this.", "Infant face."]}, {"id": "H236", "ch": "Allergic Disorders", "q": "Histamine is the main mediator of:", "o": [["A", "Atopic dermatitis"], ["B", "Contact dermatitis"], ["C", "Urticaria"], ["D", "Alopecia areata"], ["E", "Acne vulgaris"]], "a": "C", "sa": null, "pg": null, "f": [], "s": "H", "n": 63, "e": ["Histamine is released by mast cells in urticaria; atopic eczema is IgE-related but histamine is the main urticaria mediator.", "Histamine."]}, {"id": "H238", "ch": "Allergic Disorders", "q": "A female patient, 21 years old, presented with a rash on the dorsa of both feet. Rash was severely itchy. What is the diagnosis of this case?", "o": [["A", "Irritant dermatitis."], ["B", "Papular urticaria."], ["C", "Stasis eczema."], ["D", "Neurodermatitis."], ["E", "Allergic dermatitis."]], "a": "E", "sa": null, "pg": null, "f": [], "s": "H", "n": 64, "e": ["A severely itchy rash on the foot dorsa is allergic contact dermatitis to footwear materials (rubber, chromate, glues).", "Shoe allergy."]}, {"id": "H239", "ch": "Allergic Disorders", "q": "Allergic contact dermatitis (the rash in the previous question) is caused by: [image- based in the original bank]", "o": [["A", "Immediate tissue damage."], ["B", "Type I hypersensitivity reaction."], ["C", "Type IV hypersensitivity reaction."], ["D", "Immune complex reaction."], ["E", "Antigen-antibody reaction."]], "a": "C", "sa": null, "pg": null, "f": ["Image-based in the original bank; image not in the PDF text."], "s": "H", "n": 65, "e": ["Allergic contact dermatitis is a type IV (delayed, T-cell) hypersensitivity, not immediate or antigen-antibody mediated.", "Type IV."]}, {"id": "H241", "ch": "Allergic Disorders", "q": "The wheal is the characteristic primary lesion of: [image-based in the original bank]", "o": [["A", "Psoriasis."], ["B", "Herpes simplex."], ["C", "Urticaria."], ["D", "Warts."], ["E", "Molluscum contagiosum."]], "a": "C", "sa": null, "pg": null, "f": ["Image-based in the original bank; image not in the PDF text."], "s": "H", "n": 66, "e": ["The wheal is the characteristic lesion of urticaria; psoriasis, herpes simplex, warts and molluscum have other lesions.", "Wheal = urticaria."]}, {"id": "H242", "ch": "Allergic Disorders", "q": "A male patient, 52 years old, presented with sudden appearance of a reddish rash on his back, both upper limbs and extended to the lower limbs. Rash was itchy. There was no fever. Diagnosis of this case is:", "o": [["A", "Stevens-Johnson syndrome."], ["B", "Erythema multiforme."], ["C", "Angioedema."], ["D", "Urticaria."], ["E", "Fixed drug eruption."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 67, "e": ["A sudden widespread itchy erythematous rash on trunk and limbs without fever is urticaria.", "No fever."]}, {"id": "H245", "ch": "Allergic Disorders", "q": "Allergic contact dermatitis:", "o": [["A", "Is an immunological reaction."], ["B", "Occurs in any individual soon after exposure."], ["C", "Can be caused by acids or alkalis."], ["D", "Can occur due to cumulative damage by mild irritants."], ["E", "Occurs in compulsive washers."]], "a": "A", "sa": null, "pg": null, "f": [], "s": "H", "n": 68, "e": ["Allergic contact dermatitis is an immunologic reaction in genetically susceptible people; irritant dermatitis is the one caused by acids, alkalis and cumulative mild irritants.", "Immune vs irritant."]}, {"id": "H254", "ch": "Allergic Disorders", "q": "Physical urticaria includes all of the following EXCEPT:", "o": [["A", "Solar urticaria."], ["B", "Papular urticaria."], ["C", "Pressure urticaria."], ["D", "Heat urticaria."], ["E", "None of the above."]], "a": "B", "sa": null, "pg": null, "f": [], "s": "H", "n": 69, "e": ["Physical urticarias are solar, pressure, heat, cold and aquagenic types. Papular urticaria is an insect-bite hypersensitivity.", "Papular excluded."]}, {"id": "H256", "ch": "Allergic Disorders", "q": "The immunoglobulin which is usually elevated in atopics is:", "o": [["A", "Ig G."], ["B", "Ig M."], ["C", "Ig E."], ["D", "Ig D."], ["E", "All of the above."]], "a": "C", "sa": null, "pg": null, "f": [], "s": "H", "n": 70, "e": ["IgE is typically elevated in atopic individuals (atopic dermatitis, asthma, rhinitis).", "IgE."]}, {"id": "H257", "ch": "Allergic Disorders", "q": "Mucous membrane affection may occur in all of the following EXCEPT:", "o": [["A", "Varicella."], ["B", "Papular urticaria."], ["C", "Lichen planus."], ["D", "Herpes simplex."], ["E", "DLE."]], "a": "B", "sa": null, "pg": null, "f": [], "s": "H", "n": 71, "e": ["Mucous membranes may be involved in varicella, lichen planus, herpes simplex and DLE, but papular urticaria spares them.", "Papular urticaria: no mucosa."]}, {"id": "H264", "ch": "Allergic Disorders", "q": "A 22-year-old woman developed small itchy wheals after physical exertion, walking in the sun, eating hot spicy food and when she was angry. The most likely diagnosis is:", "o": [["A", "Chronic idiopathic urticaria."], ["B", "Heat urticaria."], ["C", "Solar urticaria."], ["D", "Cholinergic urticaria."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 72, "e": ["Small wheals after exercise, hot spicy food, sun and anger describe cholinergic urticaria triggered by sweating.", "Cholinergic."]}, {"id": "H265", "ch": "Allergic Disorders", "q": "A 17-year-old female presents with a pruritic rash localized to the wrist. Papules and vesicles are noted in a band-like pattern, with slight oozing from some lesions. Which of the following is the most likely cause of the rash?", "o": [["A", "Stasis dermatitis."], ["B", "Herpes zoster."], ["C", "Atopic dermatitis."], ["D", "Seborrheic dermatitis."], ["E", "Contact dermatitis."]], "a": "E", "sa": null, "pg": null, "f": [], "s": "H", "n": 73, "e": ["Band-like papules and vesicles with oozing on the wrist indicate contact dermatitis to a watch or bracelet.", "Contact."]}, {"id": "H266", "ch": "Allergic Disorders", "q": "A 6-year-old child presented with groups of itchy papules involving the flexures & sides of the neck. The most probable diagnosis is:", "o": [["A", "Varicose eczema."], ["B", "Contact eczema."], ["C", "Atopic eczema."], ["D", "Stasis eczema."], ["E", "Seborrheic eczema."]], "a": "C", "sa": null, "pg": null, "f": [], "s": "H", "n": 74, "e": ["Groups of itchy papules in the flexures and neck sides of a child are atopic eczema.", "Flexural."]}, {"id": "H271", "ch": "Allergic Disorders", "q": "An asthmatic child with a severely itchy rash on both popliteal fossae and antecubital fossae. The patient suffered from insomnia in addition to irritability most of the day. The following is true about this disease:", "o": [["A", "Transmitted by direct contact."], ["B", "Family history is usually positive."], ["C", "Involves sebaceous glands activity."], ["D", "Heals with a scar."], ["E", "Treated by topical retinoids."]], "a": "B", "sa": null, "pg": null, "f": [], "s": "H", "n": 75, "e": ["An asthmatic child with itchy flexural rash and sleep loss has atopic eczema; the family history of atopy is usually positive. It is not transmitted by contact and heals without scar.", "Atopic triad."]}, {"id": "H279", "ch": "Allergic Disorders", "q": "Erythema multiforme may be precipitated by:", "o": [["A", "Herpes simplex infection."], ["B", "Drugs."], ["C", "Internal malignancy."], ["D", "Pregnancy."], ["E", "All of the above."]], "a": "E", "sa": null, "pg": null, "f": [], "s": "H", "n": 76, "e": ["EM may be triggered by herpes simplex, drugs, internal malignancy and pregnancy, so all of the above.", "HSV most common."]}, {"id": "Q438", "ch": "Melanocyte Disorders", "q": "Absence of pigment in the skin is called", "o": [["A", "Alopecia areata."], ["B", "Vitiligo."], ["C", "Psoriasis."], ["D", "Discoid lupus erythematosus."], ["E", "Pityriasis rosea."]], "a": "B", "sa": null, "pg": "85", "f": [], "s": "B", "n": 1, "e": ["Vitiligo is an acquired depigmenting disorder: well-circumscribed milky-white macules/patches in which the pigment is completely lost. It is different from hypopigmentation, where some pigment remains.", "Complete loss of pigment = vitiligo."]}, {"id": "Q439", "ch": "Melanocyte Disorders", "q": "Complete absence of melanocytes will show as", "o": [["A", "Vitiligo."], ["B", "Post-inflammatory hypopigmentation."], ["C", "Pityriasis alba."], ["D", "Hypopigmented tinea versicolor."], ["E", "Hypopigmented nevus."]], "a": "A", "sa": null, "pg": "85", "f": [], "s": "B", "n": 2, "e": ["In vitiligo the cytotoxic T cells destroy melanocytes, so the lesion contains no melanocytes and appears chalk-white and accentuated under Wood's lamp.", "No melanocytes."]}, {"id": "Q440", "ch": "Melanocyte Disorders", "q": "Which of the following is TRUE about vitiligo?", "o": [["A", "It is an infectious disease characterized by loss of melanocytes."], ["B", "Milky white papule is the primary lesion."], ["C", "Focal type is transmitted by close contact."], ["D", "It is a disease of adults."], ["E", "In generalized type, white macules are scattered all over the body."]], "a": "E", "sa": null, "pg": "87", "f": [], "s": "B", "n": 3, "e": ["Generalized vitiligo (vulgaris) shows macules and patches distributed all over the body. It is not infectious or transmitted by contact, can start in childhood or adulthood, and the primary lesion is a macule or patch, not a papule.", "Vulgaris = scattered over the body."]}, {"id": "Q441", "ch": "Melanocyte Disorders", "q": "The primary lesion of vitiligo is a milky white", "o": [["A", "Plaque."], ["B", "Scaly patch."], ["C", "Wheal."], ["D", "Papule."], ["E", "Macule."]], "a": "E", "sa": null, "pg": "85", "f": [], "s": "B", "n": 4, "e": ["The primary lesion is a well-circumscribed milky-white macule (a patch if larger than 1 cm), often with convex borders and white hairs.", "Macule/patch."]}, {"id": "Q442", "ch": "Melanocyte Disorders", "q": "The main complaint in vitiligo is", "o": [["A", "Itching."], ["B", "Pain."], ["C", "Discoloration."], ["D", "Loss of sensation."], ["E", "Burning sensation."]], "a": "C", "sa": null, "pg": "85", "f": [], "s": "B", "n": 5, "e": ["Vitiligo is asymptomatic: no itching, pain or burning. The complaint is the cosmetic discoloration and its psychological impact.", "Cosmetic complaint only."]}, {"id": "Q443", "ch": "Melanocyte Disorders", "q": "The main complaint in vitiligo is", "o": [["A", "Itching."], ["B", "Pain."], ["C", "Burning sensation."], ["D", "All of the above."], ["E", "None of the above."]], "a": "E", "sa": null, "pg": "85", "f": [], "s": "B", "n": 6, "e": ["Itching, pain and burning are not features of vitiligo (the key gives 'none of the above'); the only complaint is cosmetic discoloration.", "Asymptomatic."]}, {"id": "Q444", "ch": "Melanocyte Disorders", "q": "Pruritus is a cardinal symptom in all of the following EXCEPT", "o": [["A", "Scabies."], ["B", "Urticaria."], ["C", "Atopic dermatitis."], ["D", "Lichen planus."], ["E", "Vitiligo."]], "a": "E", "sa": null, "pg": "85", "f": [], "s": "B", "n": 7, "e": ["Pruritus is the cardinal symptom of scabies, eczema or lichen planus, but vitiligo is asymptomatic.", "Vitiligo: no itch."]}, {"id": "Q445", "ch": "Melanocyte Disorders", "q": "As regards vitiligo, all of the following are false EXCEPT", "o": [["A", "Itching is a prominent symptom."], ["B", "It is not heritable."], ["C", "Scalp may be affected."], ["D", "Family history is positive in all cases."], ["E", "Milky white papules are seen."]], "a": "C", "sa": null, "pg": "85", "f": [], "s": "B", "n": 8, "e": ["Of the listed statements only 'scalp may be affected' is true. Vitiligo is not usually itchy and is partly heritable, it does not have milky papules, and family history is not positive in all cases.", "Scalp/white hairs can be involved."]}, {"id": "Q446", "ch": "Melanocyte Disorders", "q": "Vitiligo as an autoimmune disease may be associated with", "o": [["A", "Thyroid disease."], ["B", "Impetigo."], ["C", "Herpes zoster."], ["D", "Eczema."], ["E", "Pityriasis rosea."]], "a": "A", "sa": null, "pg": "85", "f": [], "s": "B", "n": 9, "e": ["Generalized vitiligo is autoimmune, so it is associated with autoimmune thyroid disease, alopecia areata, type 1 diabetes, myasthenia gravis, lupus and rheumatoid arthritis. Impetigo, zoster, eczema and pityriasis rosea are unrelated.", "Thyroid disease."]}, {"id": "Q447", "ch": "Melanocyte Disorders", "q": "Vitiligo as an autoimmune disease may be associated with", "o": [["A", "Impetigo."], ["B", "Herpes zoster."], ["C", "Alopecia areata."], ["D", "Eczema."], ["E", "Pityriasis rosea. 7     A male patient, 13 years old, presented with whitish patches involving his face, chest and both upper limbs. The condition started when he was four years old with a gradual onset and a progressive course. (Clinical photo: depigmented milky white patches on chest and arms.)"]], "a": "C", "sa": null, "pg": "85", "f": [], "s": "B", "n": 10, "e": ["Alopecia areata is another autoimmune disease associated with generalized vitiligo.", "Alopecia areata."]}, {"id": "Q448", "ch": "Melanocyte Disorders", "q": "What is the pathogenesis of vitiligo?", "o": [["A", "Congenital lack of pigmentation."], ["B", "Autoimmune destruction of melanocytes."], ["C", "Appearance of malformed melanocytes."], ["D", "Benign proliferation of melanocytes."], ["E", "Enlargement of melanocytes."]], "a": "B", "sa": null, "pg": "86", "f": [], "s": "B", "n": 11, "e": ["Cytotoxic T cells attack melanocytes in genetically predisposed patients, helped by oxidative stress; it is not fungal, viral or congenital.", "Autoimmune destruction of melanocytes."]}, {"id": "Q449", "ch": "Melanocyte Disorders", "q": "Vitiligo is caused by", "o": [["A", "Hyperproliferation of melanocytes."], ["B", "Excess melanin synthesis."], ["C", "Fungal infection."], ["D", "Autoimmune destruction of melanocytes."], ["E", "Viral infection. 1     A male patient, 23 years old, presented with milky white patches involving both hands and feet. The condition started four years ago with a gradual onset and a progressive course."]], "a": "D", "sa": null, "pg": "86", "f": [], "s": "B", "n": 12, "e": ["Vitiligo results from autoimmune destruction of melanocytes, not overproduction or proliferation of them.", "Autoimmune."]}, {"id": "Q450", "ch": "Melanocyte Disorders", "q": "Which is true regarding this disorder?", "o": [["A", "Considered an autoimmune disease."], ["B", "Treated by antiandrogens."], ["C", "Benign proliferation of melanocytes."], ["D", "Affects adults only."], ["E", "It is contagious."]], "a": "A", "sa": null, "pg": "86", "f": [], "s": "B", "n": 13, "e": ["Vitiligo is considered an autoimmune disease; it is not contagious, not a benign proliferation of melanocytes and not treated by anti-androgens.", "Autoimmune, non-infectious."]}, {"id": "Q451", "ch": "Melanocyte Disorders", "q": "In vitiligo, melanocytes are", "o": [["A", "Absent."], ["B", "Malformed."], ["C", "Non-functioning."], ["D", "Hyperactive."], ["E", "Enlarged."]], "a": "A", "sa": null, "pg": "86", "f": [], "s": "B", "n": 14, "e": ["Biopsy of a vitiligo patch shows complete absence of melanocytes, whereas in hypopigmentation they are present but less active.", "Absent."]}, {"id": "Q452", "ch": "Melanocyte Disorders", "q": "The damage in vitiligo is in", "o": [["A", "Keratinocytes."], ["B", "Langerhans cells."], ["C", "Melanocytes."], ["D", "Lymphocytes."], ["E", "Endothelial cells."]], "a": "C", "sa": null, "pg": "86", "f": [], "s": "B", "n": 15, "e": ["The target of the immune attack is the melanocyte (pigment cell), not the keratinocyte or Langerhans cell.", "Melanocytes."]}, {"id": "Q453", "ch": "Melanocyte Disorders", "q": "Types of vitiligo include all of the following EXCEPT", "o": [["A", "Papular."], ["B", "Unilateral."], ["C", "Generalized."], ["D", "Focal."], ["E", "Universal."]], "a": "A", "sa": null, "pg": "86", "f": [], "s": "B", "n": 16, "e": ["Clinical types are focal, segmental, mucosal, vulgaris, acrofacial and universal. There is no papular type, since the primary lesion is a macule.", "Types: focal, segmental, mucosal, vulgaris, acrofacial, universal."]}, {"id": "Q454", "ch": "Melanocyte Disorders", "q": "Clinical types of vitiligo include", "o": [["A", "Focal type."], ["B", "Segmental type."], ["C", "Acrofacial vitiligo."], ["D", "Universal type."], ["E", "All of the above."]], "a": "E", "sa": null, "pg": "86", "f": [], "s": "B", "n": 17, "e": ["Clinical types include localized (focal, segmental, mucosal) and generalized (vulgaris, acrofacial, universal), so all of the above.", "Localized vs generalized."]}, {"id": "Q455", "ch": "Melanocyte Disorders", "q": "What is the diagnosis? (Clinical photo: well-defined depigmented milky white patches on the trunk and arms.)", "o": [["A", "Hypopigmented tinea versicolor."], ["B", "Tuberculoid leprosy."], ["C", "Vitiligo."], ["D", "Disseminated eczema."], ["E", "Post-inflammatory hypopigmentation."]], "a": "C", "sa": null, "pg": "85", "f": [], "s": "B", "n": 18, "e": ["Well-defined depigmented milky-white patches on trunk and arms are vitiligo; pityriasis alba is hypopigmented with fine scale and versicolor is scaly.", "Chalk-white, no scale."]}, {"id": "Q456", "ch": "Melanocyte Disorders", "q": "The following may be used in the treatment of vitiligo", "o": [["A", "Radiotherapy."], ["B", "Electrocautery."], ["C", "Cryocautery."], ["D", "Phototherapy."], ["E", "Physiotherapy. 1      A male patient, 33 years old, presented with white patches on his chest and both upper limbs. The condition started when he was 27 years old with a gradual onset and a progressive course. (Clinical photo: extensive depigmented white patches on the back.)"]], "a": "D", "sa": null, "pg": "89", "f": [], "s": "B", "n": 19, "e": ["Phototherapy (narrow-band UVB, excimer light, PUVA) is the backbone of vitiligo treatment because it stimulates residual melanocytes.", "Phototherapy backbone."]}, {"id": "Q457", "ch": "Melanocyte Disorders", "q": "Which of the following can be used in its treatment?", "o": [["A", "Radiotherapy."], ["B", "Systemic antibiotics."], ["C", "Topical retinoids."], ["D", "Narrowband UVB."], ["E", "Systemic antifungals."]], "a": "D", "sa": null, "pg": "89", "f": [], "s": "B", "n": 20, "e": ["Narrow-band UVB is the standard phototherapy for generalized vitiligo, which helps repigmentation.", "NB-UVB."]}, {"id": "Q458", "ch": "Melanocyte Disorders", "q": "One of the following is used in treatment of vitiligo", "o": [["A", "Radiotherapy."], ["B", "Topical calcineurin inhibitors."], ["C", "Systemic antibiotics."], ["D", "Systemic antifungals."]], "a": "B", "sa": null, "pg": "89", "f": [], "s": "B", "n": 21, "e": ["Topical calcineurin inhibitors (tacrolimus, pimecrolimus) stop the autoimmune process locally and are used especially on face and neck.", "Tacrolimus."]}, {"id": "Q459", "ch": "Melanocyte Disorders", "q": "The following drug could be used topically for treatment of vitiligo", "o": [["A", "Terbinafine."], ["B", "Azelaic acid 20%."], ["C", "Steroid."], ["D", "Crude coal tar."], ["E", "Permethrin lotion 5%."]], "a": "C", "sa": null, "pg": "89", "f": [], "s": "B", "n": 22, "e": ["Topical corticosteroids are used for stabilization and repigmentation in localized vitiligo. Terbinafine and permethrin are anti-infective agents.", "Topical steroids."]}, {"id": "Q460", "ch": "Melanocyte Disorders", "q": "Vitiligo in a patient with hepatic failure can be treated by", "o": [["A", "Topical psoralen with ultraviolet A."], ["B", "Topical steroids."], ["C", "Ultraviolet B."], ["D", "All of the above."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": "89", "f": [], "s": "B", "n": 23, "e": ["In hepatic failure oral drugs are avoided, so topical PUVA, topical steroids or UVB can all be used, i.e. all of the above.", "Topical/light-based treatments."]}, {"id": "H335", "ch": "Melanocyte Disorders", "q": "The following may be used in the treatment of vitiligo:", "o": [["A", "Radiotherapy."], ["B", "Electrocautery."], ["C", "Cryocautery."], ["D", "Phototherapy."], ["E", "Physiotherapy."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 24, "e": ["Phototherapy (NB-UVB, PUVA, excimer) is the main treatment of vitiligo; radiotherapy, cautery and cryocautery are not used.", "Phototherapy."]}, {"id": "H336", "ch": "Melanocyte Disorders", "q": "In vitiligo, melanocytes are:", "o": [["A", "Absent."], ["B", "Malformed."], ["C", "Non-functioning."], ["D", "Hyperactive."], ["E", "None of the above."]], "a": "A", "sa": null, "pg": null, "f": [], "s": "H", "n": 25, "e": ["Melanocytes are completely absent in vitiligo patches, not just malformed or non-functioning.", "Absent."]}, {"id": "H340", "ch": "Melanocyte Disorders", "q": "Vitiligo may be confused with:", "o": [["A", "Pityriasis alba."], ["B", "Leprosy."], ["C", "Pityriasis versicolor."], ["D", "All of the above."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 26, "e": ["Vitiligo can be confused with pityriasis alba, leprosy (hypopigmented patches) and pityriasis versicolor; the history of total pigment loss and absent sensory loss helps.", "All of the above."]}, {"id": "H341", "ch": "Melanocyte Disorders", "q": "Vitiligo is caused by:", "o": [["A", "Hyperproliferation of melanocytes."], ["B", "Excess melanin synthesis."], ["C", "Fungal infection."], ["D", "Autoimmune destruction of melanocytes."], ["E", "Viral infection."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 27, "e": ["Vitiligo results from autoimmune destruction of melanocytes by cytotoxic T cells.", "Autoimmune."]}, {"id": "H344", "ch": "Melanocyte Disorders", "q": "A male patient, 23 years old presented with milky white patches involving both hands and feet. The condition started four years ago with a gradual onset and a progressive course. which is true regarding this disorder?", "o": [["A", "Considered an autoimmune disease."], ["B", "Treated by antiandrogens."], ["C", "Benign proliferation of melanocytes."], ["D", "Affects adults only."], ["E", "It is contagious."]], "a": "A", "sa": null, "pg": null, "f": [], "s": "H", "n": 28, "e": ["Milky-white patches on the hands and feet for years, progressive, indicate vitiligo, an autoimmune disease. It is not contagious, not treated with anti-androgens, and is not limited to adults.", "Autoimmune, not contagious."]}, {"id": "H345", "ch": "Melanocyte Disorders", "q": "Which of the following can be used in treatment of vitiligo ?", "o": [["A", "Radiotherapy."], ["B", "Phototherapy."], ["C", "Systemic antibiotics."], ["D", "Systemic antifungals."], ["E", "Isotretinoin."]], "a": "B", "sa": null, "pg": null, "f": [], "s": "H", "n": 29, "e": ["Phototherapy is a mainstay; antibiotics, antifungals, isotretinoin and radiotherapy have no role.", "Phototherapy."]}, {"id": "H346", "ch": "Melanocyte Disorders", "q": "Vitiligo as an autoimmune disease may be associated with:", "o": [["A", "Impetigo."], ["B", "Herpes zoster."], ["C", "Alopecia areata."], ["D", "Eczema."], ["E", "Pityriasis rosea."]], "a": "C", "sa": null, "pg": null, "f": [], "s": "H", "n": 30, "e": ["Alopecia areata is autoimmune and is associated with generalized vitiligo, along with thyroid disease and type 1 diabetes.", "Autoimmune cluster."]}, {"id": "H350", "ch": "Melanocyte Disorders", "q": "As regards vitiligo all of the following is true:", "o": [["A", "Itching is a prominent symptom."], ["B", "It is not heritable."], ["C", "Scalp may be affected."], ["D", "Family history is positive in all cases."], ["E", "Milky white papules are seen."]], "a": "C", "sa": null, "pg": null, "f": [], "s": "H", "n": 31, "e": ["Vitiligo can affect the scalp (with white hair patches). It is not itchy, is heritable, and the lesions are macules, not papules.", "Scalp involved."]}, {"id": "H351", "ch": "Melanocyte Disorders", "q": "Vitiligo may affect all of the following areas EXCEPT:", "o": [["A", "Oral mucosa."], ["B", "Scalp."], ["C", "Palm."], ["D", "Penis."], ["E", "Areola."]], "a": "A", "sa": null, "pg": null, "f": [], "s": "H", "n": 32, "e": ["Per the key, oral mucosa is the exception; however, the book describes mucosal vitiligo, so this answer is questionable. Please verify against the source.", "Mucosal vitiligo exists."]}, {"id": "H352", "ch": "Melanocyte Disorders", "q": "A patient presented with well-circumscribed milky white patches involving both hands, feet, forearms and chest with a gradual onset and a progressive course. Which of the following can be used in treatment?", "o": [["A", "Antimalarials."], ["B", "Systemic antibiotics."], ["C", "Systemic antifungals."], ["D", "Isotretinoin."], ["E", "Phototherapy."]], "a": "E", "sa": null, "pg": null, "f": [], "s": "H", "n": 33, "e": ["Well-circumscribed milky-white patches on hands, feet, forearms and chest, with gradual progression, are generalized vitiligo; phototherapy is used.", "Phototherapy."]}, {"id": "Q461", "ch": "Hair Disorders", "q": "Scarring alopecia may be caused by", "o": [["A", "Psoriasis."], ["B", "Seborrheic dermatitis."], ["C", "Fever."], ["D", "Lichen planus."], ["E", "Scaly tinea capitis."]], "a": "D", "sa": null, "pg": "90", "f": [], "s": "B", "n": 1, "e": ["Lichen planus of the scalp (lichen planopilaris) destroys follicles, leaving scarring alopecia, as do DLE, kerion and favus.", "LP can scar."]}, {"id": "Q462", "ch": "Hair Disorders", "q": "Hair loss is permanent and irreversible in", "o": [["A", "Cicatricial alopecia."], ["B", "Androgenetic alopecia."], ["C", "Telogen effluvium."], ["D", "Anagen effluvium."], ["E", "Alopecia areata."]], "a": "A", "sa": null, "pg": "90", "f": [], "s": "B", "n": 2, "e": ["In cicatricial alopecia the follicle is destroyed and replaced by scar tissue, so hair loss is permanent. Non-scarring types (androgenetic alopecia, telogen/anagen effluvium, alopecia areata) are reversible, at least in principle.", "Scar = permanent."]}, {"id": "Q463", "ch": "Hair Disorders", "q": "Cicatricial alopecia occurs in the following disease", "o": [["A", "Tinea circinata."], ["B", "Psoriasis vulgaris."], ["C", "Systemic lupus erythematosus."], ["D", "Scaly ringworm."], ["E", "Favus."]], "a": "E", "sa": null, "pg": "90", "f": [], "s": "B", "n": 3, "e": ["Favus (yellow scutula) of the scalp causes cicatricial alopecia. Scaly ringworm and black-dot types usually heal without scar.", "Favus and kerion scar."]}, {"id": "Q464", "ch": "Hair Disorders", "q": "Cicatricial alopecia occurs in the following disease", "o": [["A", "Tinea circinata."], ["B", "Psoriasis vulgaris."], ["C", "Acne vulgaris."], ["D", "Systemic lupus erythematosus."], ["E", "Discoid lupus erythematosus."]], "a": "E", "sa": null, "pg": "90", "f": [], "s": "B", "n": 4, "e": ["DLE affecting the scalp ends in permanent cicatricial alopecia, so it appears among scarring causes.", "DLE scars."]}, {"id": "Q465", "ch": "Hair Disorders", "q": "The following disease can cause cicatricial hair loss", "o": [["A", "Telogen effluvium."], ["B", "Discoid lupus erythematosus."], ["C", "Psoriasis."], ["D", "Seborrheic dermatitis."], ["E", "Pityriasis rosea."]], "a": "B", "sa": null, "pg": "90", "f": [], "s": "B", "n": 5, "e": ["DLE is a collagen disease that destroys follicles and causes permanent hair loss; telogen effluvium, psoriasis and seborrheic dermatitis do not.", "DLE scars."]}, {"id": "Q466", "ch": "Hair Disorders", "q": "One of the following may cause cicatricial alopecia", "o": [["A", "Androgenetic alopecia."], ["B", "Telogen effluvium."], ["C", "Alopecia areata."], ["D", "Kerion."], ["E", "Scaly ringworm."]], "a": "D", "sa": null, "pg": "90", "f": [], "s": "B", "n": 6, "e": ["Kerion's intense inflammation destroys hair follicles, giving cicatricial alopecia if not treated early; scaly ringworm does not.", "Kerion scar."]}, {"id": "Q467", "ch": "Hair Disorders", "q": "Cicatricial alopecia may be caused by", "o": [["A", "Warts."], ["B", "Vitiligo."], ["C", "Psoriasis."], ["D", "Burn."], ["E", "Alopecia areata."]], "a": "D", "sa": null, "pg": "90", "f": [], "s": "B", "n": 7, "e": ["Burns destroy the follicles directly, a physical cause of cicatricial alopecia, whereas warts, vitiligo, psoriasis and alopecia areata spare them.", "Burn."]}, {"id": "Q468", "ch": "Hair Disorders", "q": "Scarring alopecia may be due to", "o": [["A", "Discoid LE."], ["B", "Lichen planus."], ["C", "Favus."], ["D", "All of the above."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": "90", "f": [], "s": "B", "n": 8, "e": ["Scarring alopecia arises from trauma, burns, fungal infections (kerion, favus), zoster, DLE and lichen planus, so all of the above.", "Many causes."]}, {"id": "Q469", "ch": "Hair Disorders", "q": "Cicatricial alopecia is caused by all of the following diseases EXCEPT", "o": [["A", "Lichen planus."], ["B", "Trauma."], ["C", "Favus."], ["D", "Systemic lupus erythematosus."], ["E", "Kerion."]], "a": "D", "sa": null, "pg": "90", "f": [], "s": "B", "n": 9, "e": ["DLE, lichen planus, trauma, favus and kerion scar the scalp. The key lists SLE as the exception because it usually causes non-scarring diffuse hair loss.", "DLE ≠ SLE."]}, {"id": "Q470", "ch": "Hair Disorders", "q": "The following skin diseases may cause cicatricial alopecia EXCEPT", "o": [["A", "Discoid LE."], ["B", "Lichen planus."], ["C", "Favus."], ["D", "Alopecia areata."], ["E", "Kerion."]], "a": "D", "sa": null, "pg": "90", "f": [], "s": "B", "n": 10, "e": ["Alopecia areata attacks anagen follicles without destroying them, so it is non-scarring; the other diseases listed can scar.", "AA non-scarring."]}, {"id": "Q471", "ch": "Hair Disorders", "q": "Which of the following conditions causes non-cicatricial alopecia?", "o": [["A", "Discoid lupus."], ["B", "Herpes zoster."], ["C", "Alopecia areata."], ["D", "Lichen planus."], ["E", "Burn."]], "a": "C", "sa": null, "pg": "93", "f": [], "s": "B", "n": 11, "e": ["Alopecia areata, an immune attack on anagen follicles in a patch of otherwise normal skin, is non-cicatricial. DLE, zoster, lichen planus and burns scar.", "AA = non-scarring."]}, {"id": "Q472", "ch": "Hair Disorders", "q": "Which of the following diseases can cause non-cicatricial alopecia?", "o": [["A", "Herpes zoster."], ["B", "Telogen effluvium."], ["C", "Favus."], ["D", "Basal cell carcinoma."], ["E", "Mechanical trauma. 1     A female patient, 36 years old, presented with hair loss of 5 years duration with a gradual onset and a progressive course. She also complained of skin lesions on the face and ears that, on examination, were well-defined erythematous plaques covered with adherent scales as well as telangiectasia. (Clinical photo: scalp with scarring alopecia and atrophic depigmented and hyperpigmented patches.)"]], "a": "B", "sa": null, "pg": "92", "f": [], "s": "B", "n": 12, "e": ["Telogen effluvium (premature shift to telogen) causes diffuse reversible shedding without follicle destruction.", "Reversible."]}, {"id": "Q473", "ch": "Hair Disorders", "q": "This patient is presenting with", "o": [["A", "Androgenetic alopecia."], ["B", "Telogen effluvium."], ["C", "Anagen effluvium."], ["D", "Cicatricial alopecia."], ["E", "Alopecia areata. 1     A female patient, 36 years old, presented with hair loss of 5 years duration with a gradual onset and a progressive course. She also complained of skin lesions on the face and ears that, on examination, were well-defined erythematous plaques covered with adherent scales as well as telangiectasia. (Clinical photo: scalp with scarring alopecia and atrophic depigmented and hyperpigmented patches.)"]], "a": "D", "sa": null, "pg": "90", "f": [], "s": "B", "n": 13, "e": ["Smooth shiny scalp patches without follicle openings indicate cicatricial alopecia, where follicles are destroyed.", "No follicular openings."]}, {"id": "Q474", "ch": "Hair Disorders", "q": "What is the cause of this condition?", "o": [["A", "Toxicity of anagen hairs."], ["B", "Lymphocyte infiltrates around hair follicles."], ["C", "Activity of 5-alpha reductase enzyme in hair follicles."], ["D", "Destruction of hair follicles."], ["E", "Premature transformation of hair follicles into telogen phase. 1     A male patient, 27 years old, presented with hair loss of five-year duration with a gradual onset and a progressive course. It began by frontal and bitemporal recession, and then it involved the vertex. (Clinical photo: male scalp with frontal/bitemporal recession and vertex thinning.)"]], "a": "D", "sa": null, "pg": "90", "f": [], "s": "B", "n": 14, "e": ["In cicatricial alopecia the follicles themselves are destroyed (by inflammation, trauma or infection) and replaced by fibrous tissue.", "Follicle destruction."]}, {"id": "Q475", "ch": "Hair Disorders", "q": "This patient is presenting with", "o": [["A", "Telogen effluvium."], ["B", "Anagen effluvium."], ["C", "Androgenetic alopecia."], ["D", "Cicatricial alopecia."], ["E", "Alopecia areata. 1     A male patient, 27 years old, presented with hair loss of five-year duration with a gradual onset and a progressive course. It began by frontal and bitemporal recession, and then it involved the vertex. (Clinical photo: male scalp with frontal/bitemporal recession and vertex thinning.)"]], "a": "C", "sa": null, "pg": "91", "f": [], "s": "B", "n": 15, "e": ["Hair thinning in a characteristic pattern (frontal and bitemporal recession then vertex in males) is androgenetic alopecia.", "AGA pattern."]}, {"id": "Q476", "ch": "Hair Disorders", "q": "Which is true regarding this disease?", "o": [["A", "Treated by systemic corticosteroids."], ["B", "Affects males only."], ["C", "Pathology involves melanocytes."], ["D", "Caused by accentuated 5-alpha reductase activity in hair follicles."], ["E", "Contagious."]], "a": "D", "sa": null, "pg": "91", "f": [], "s": "B", "n": 16, "e": ["In androgenetic alopecia 5-alpha reductase activity increases in susceptible follicles, converting testosterone to the more potent DHT, which miniaturizes follicles. It is not treated by corticosteroids, not melanocyte-related and not contagious; it also occurs in females.", "5-alpha reductase → DHT."]}, {"id": "Q477", "ch": "Hair Disorders", "q": "Which of the following is TRUE about androgenetic alopecia?", "o": [["A", "It is a genetically determined cicatricial type of alopecia."], ["B", "Oral antiandrogens are used for treatment of male androgenetic alopecia."], ["C", "Minoxidil 2% is used in treatment of male (not female) androgenetic alopecia."], ["D", "Finasteride is contraindicated in male androgenetic alopecia."], ["E", "It is due to increased activity of 5-alpha reductase in target follicles."]], "a": "E", "sa": null, "pg": "91", "f": [], "s": "B", "n": 17, "e": ["AGA is genetically determined and non-cicatricial, caused by increased 5-alpha reductase activity in target follicles.", "5-AR ↑."]}, {"id": "Q478", "ch": "Hair Disorders", "q": "Diffuse hair loss involving the vertex of the scalp with maintenance of the frontal hairline is", "o": [["A", "Alopecia areata."], ["B", "Anagen effluvium."], ["C", "Male pattern baldness."], ["D", "Female pattern baldness."], ["E", "Telogen effluvium."]], "a": "D", "sa": null, "pg": "91", "f": [], "s": "B", "n": 18, "e": ["Female pattern hair loss involves the vertex with preservation of the frontal hairline; in males it begins with frontal and bitemporal recession.", "Female: vertex with intact frontal line."]}, {"id": "Q479", "ch": "Hair Disorders", "q": "Androgenetic alopecia in males can be treated by", "o": [["A", "Estrogens."], ["B", "Cyproterone acetate."], ["C", "Spironolactone."], ["D", "Topical minoxidil."], ["E", "Corticosteroids."]], "a": "D", "sa": null, "pg": "92", "f": [], "s": "B", "n": 19, "e": ["Topical minoxidil 2-5% and 5-alpha reductase inhibitors (finasteride) are used in males; antiandrogens and estrogens are not.", "Minoxidil, finasteride."]}, {"id": "Q480", "ch": "Hair Disorders", "q": "Androgenetic alopecia can be treated by all of the following EXCEPT", "o": [["A", "Finasteride."], ["B", "Cyproterone acetate."], ["C", "Spironolactone."], ["D", "Topical minoxidil."], ["E", "Corticosteroids."]], "a": "E", "sa": null, "pg": "92", "f": [], "s": "B", "n": 20, "e": ["AGA is treated with minoxidil, finasteride, spironolactone (females) and transplantation. Corticosteroids have no role.", "No steroids."]}, {"id": "Q481", "ch": "Hair Disorders", "q": "Telogen effluvium is", "o": [["A", "A type of cicatricial alopecia."], ["B", "Diffuse hair loss."], ["C", "Alopecia totalis."], ["D", "Alopecia universalis."], ["E", "Ophiasis."]], "a": "B", "sa": null, "pg": null, "f": [], "s": "B", "n": 21, "e": ["Telogen effluvium is a diffuse increase in hair shedding after follicles prematurely enter telogen, not a scarring alopecia.", "Diffuse."]}, {"id": "Q482", "ch": "Hair Disorders", "q": "A female patient presents with diffuse alopecia. She had suffered from typhoid fever 4 months back. The most probable diagnosis is", "o": [["A", "Androgenetic alopecia."], ["B", "Telogen effluvium."], ["C", "Anagen effluvium."], ["D", "Alopecia areata."], ["E", "Trichotillomania."]], "a": "B", "sa": null, "pg": "92", "f": [], "s": "B", "n": 22, "e": ["Diffuse alopecia appearing about 3-4 months after typhoid fever is telogen effluvium after a stressful (febrile) illness.", "3-4 months after the trigger."]}, {"id": "Q483", "ch": "Hair Disorders", "q": "A woman reports diffuse hair shedding three months after childbirth with a normal scalp. The diagnosis is", "o": [["A", "Telogen effluvium."], ["B", "Alopecia areata."], ["C", "Androgenetic alopecia."], ["D", "Ophiasis."], ["E", "Anagen effluvium."]], "a": "A", "sa": null, "pg": "93", "f": [], "s": "B", "n": 23, "e": ["Postpartum diffuse shedding with a normal scalp 3 months after childbirth is classic telogen effluvium.", "Postpartum."]}, {"id": "Q484", "ch": "Hair Disorders", "q": "Anagen effluvium is caused by", "o": [["A", "High fever."], ["B", "Surgical interventions."], ["C", "General anesthesia."], ["D", "Weight loss."], ["E", "Cytotoxic chemotherapy."]], "a": "E", "sa": null, "pg": "93", "f": [], "s": "B", "n": 24, "e": ["Cytotoxic chemotherapy, heavy metals, radiation and drugs like methotrexate poison actively growing anagen follicles, causing anagen effluvium. Fever and surgery cause telogen effluvium.", "Chemo = anagen effluvium."]}, {"id": "Q485", "ch": "Hair Disorders", "q": "A 17-year-old male presents with alopecia of gradual onset and progressive course 3 months after starting chemotherapy for lymphoma. The diagnosis is", "o": [["A", "Androgenetic alopecia."], ["B", "Telogen effluvium."], ["C", "Anagen effluvium."], ["D", "Alopecia areata."], ["E", "Cicatricial alopecia. 1     A patient presented with hair loss of gradual onset and a rapidly progressive course, which started after receiving 2 chemotherapy sessions for lymphoma. (Clinical photo: scalp with diffuse sparse hair.)"]], "a": "C", "sa": null, "pg": "93", "f": [], "s": "B", "n": 25, "e": ["Hair loss after starting chemotherapy is anagen effluvium due to toxicity to active anagen roots.", "Chemotherapy."]}, {"id": "Q486", "ch": "Hair Disorders", "q": "What is the cause of this disease?", "o": [["A", "Toxicity of anagen hairs."], ["B", "Lymphocyte infiltrates around hair follicles."], ["C", "Activity of 5-alpha reductase enzyme in hair follicles."], ["D", "Destruction of hair follicles."], ["E", "Premature transformation of hair follicles into telogen phase."]], "a": "A", "sa": null, "pg": "93", "f": [], "s": "B", "n": 26, "e": ["Anagen effluvium is caused by toxic injury to actively growing anagen follicles, e.g. chemotherapy, heavy metals and radiation.", "Toxic."]}, {"id": "Q487", "ch": "Hair Disorders", "q": "Which of the following is considered an autoimmune disease?", "o": [["A", "Scaly ringworm."], ["B", "Androgenetic alopecia."], ["C", "Alopecia areata."], ["D", "Favus."], ["E", "Kerion. 1     A male patient, 27 years old, presented with several circumscribed areas of hair loss of one-year duration. He received several topical treatments to which he initially responded, but hair loss started again once he stopped treatment. On examination, scalp skin was completely normal with no scales or erythema. (Clinical photo: scalp with multiple well-circumscribed smooth patches of hair loss.)"]], "a": "C", "sa": null, "pg": "93", "f": [], "s": "B", "n": 27, "e": ["Alopecia areata is an autoimmune disease against anagen follicles. Androgenetic alopecia is hormonal and fungal infections (kerion, favus, scaly ringworm) are infectious.", "AA autoimmune."]}, {"id": "Q488", "ch": "Hair Disorders", "q": "This patient is presenting with", "o": [["A", "Androgenetic alopecia."], ["B", "Telogen effluvium."], ["C", "Anagen effluvium."], ["D", "Cicatricial alopecia."], ["E", "Alopecia areata. 2     A male patient, 27 years old, presented with several circumscribed areas of hair loss of one-year duration. He received several topical treatments to which he initially responded, but hair loss started again once he stopped treatment. On examination, scalp skin was completely normal with no scales or erythema. (Clinical photo: scalp with multiple well-circumscribed smooth patches of hair loss.)"]], "a": "E", "sa": null, "pg": "93", "f": [], "s": "B", "n": 28, "e": ["Circumscribed round patches of hair loss in normal-looking skin are alopecia areata.", "Patches, smooth."]}, {"id": "Q489", "ch": "Hair Disorders", "q": "Which is true regarding this disease?", "o": [["A", "Considered an autoimmune disease."], ["B", "Treated by antiandrogens."], ["C", "Pathology involves melanocytes."], ["D", "Affects adults only."], ["E", "Contagious."]], "a": "A", "sa": null, "pg": null, "f": [], "s": "B", "n": 29, "e": ["Alopecia areata is autoimmune, associated with thyroid disease, atopy and SLE; 10-20% have a family history.", "Autoimmune."]}, {"id": "Q490", "ch": "Hair Disorders", "q": "Patchy, asymptomatic, non-scarring, sudden complete loss of hair in circumscribed areas of the scalp is called", "o": [["A", "Androgenetic alopecia."], ["B", "Telogen effluvium."], ["C", "Alopecia totalis."], ["D", "Alopecia areata."], ["E", "Anagen effluvium."]], "a": "D", "sa": null, "pg": "94", "f": [], "s": "B", "n": 30, "e": ["Patchy, sudden, asymptomatic, non-scarring hair loss in circumscribed areas is alopecia areata, an autoimmune disease.", "Sudden non-scarring patches."]}, {"id": "Q491", "ch": "Hair Disorders", "q": "A 7-year-old female child presented with a circumscribed area of hair loss on the scalp. On examination, the skin of the affected area was normal. The diagnosis is", "o": [["A", "Cicatricial alopecia."], ["B", "Tinea capitis."], ["C", "Alopecia areata."], ["D", "Lichen planus."], ["E", "Discoid lupus erythematosus."]], "a": "C", "sa": null, "pg": "93", "f": [], "s": "B", "n": 31, "e": ["A well-demarcated patch of hair loss on normal smooth scalp in a child, with exclamation-mark hairs at its margin, is alopecia areata; tinea capitis has scales and broken hairs.", "No scales."]}, {"id": "Q492", "ch": "Hair Disorders", "q": "The following diseases show scales EXCEPT", "o": [["A", "Lichen planus."], ["B", "Alopecia areata."], ["C", "Lupus erythematosus."], ["D", "Pityriasis rosea."], ["E", "Pityriasis versicolor."]], "a": "B", "sa": null, "pg": "93", "f": [], "s": "B", "n": 32, "e": ["Psoriasis, seborrheic dermatitis and tinea capitis show scales; alopecia areata leaves smooth non-scaly skin.", "Non-scaly."]}, {"id": "Q493", "ch": "Hair Disorders", "q": "Clinical types of alopecia areata include all of the following EXCEPT", "o": [["A", "Patchy type."], ["B", "Marginal type."], ["C", "Mucocutaneous type."], ["D", "Alopecia totalis."], ["E", "Alopecia universalis."]], "a": "C", "sa": null, "pg": "94", "f": [], "s": "B", "n": 33, "e": ["Types are patchy, ophiasis, totalis and universalis; there is no mucocutaneous type.", "No mucocutaneous."]}, {"id": "Q494", "ch": "Hair Disorders", "q": "In ophiasis", "o": [["A", "Hair loss occurs along the margins of the scalp."], ["B", "Total scalp hair loss occurs."], ["C", "Cicatricial alopecia is a complication."], ["D", "Total body hair loss occurs."], ["E", "A localized area of hair loss is present."]], "a": "A", "sa": null, "pg": "94", "f": [], "s": "B", "n": 34, "e": ["In ophiasis hair loss occurs along the scalp margins (temporal and occipital); it is usually resistant to therapy.", "Margins."]}, {"id": "Q495", "ch": "Hair Disorders", "q": "Marginal alopecia of the scalp is called", "o": [["A", "Alopecia totalis."], ["B", "Alopecia universalis."], ["C", "Ophiasis."], ["D", "Telogen effluvium."]], "a": "C", "sa": null, "pg": "94", "f": [], "s": "B", "n": 35, "e": ["Ophiasis is alopecia areata along the scalp margins.", "Ophiasis."]}, {"id": "Q496", "ch": "Hair Disorders", "q": "Alopecia areata along the scalp margins is named ___ and it is ___ (regarding response to treatment).", "o": [], "a": null, "sa": "Ophiasis; usually resistant to therapy", "pg": null, "f": [], "s": "B", "n": 36, "e": ["Ophiasis is a band-like loss along the scalp margins and usually resists treatment.", "Poor response."]}, {"id": "Q497", "ch": "Hair Disorders", "q": "Alopecia totalis is", "o": [["A", "Localised loss of hair."], ["B", "Loss of the scalp and body hair."], ["C", "Loss of frontal scalp hair."], ["D", "Loss of all scalp hair."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "B", "n": 37, "e": ["Alopecia totalis is loss of all scalp hair; loss of all body hair is alopecia universalis.", "Totalis = scalp; universalis = body."]}, {"id": "Q498", "ch": "Hair Disorders", "q": "Alopecia areata may be treated by", "o": [["A", "Corticosteroids."], ["B", "Spironolactone."], ["C", "Estrogens."], ["D", "Androgens."], ["E", "Cyproterone acetate."]], "a": "A", "sa": null, "pg": "95", "f": [], "s": "B", "n": 38, "e": ["Topical or intralesional corticosteroids are the first treatment for alopecia areata, with calcineurin inhibitors, minoxidil, PUVA and irritants.", "Steroids."]}, {"id": "Q499", "ch": "Hair Disorders", "q": "Alopecia areata may be treated by", "o": [["A", "Corticosteroids."], ["B", "Tincture iodine."], ["C", "PUVA."], ["D", "Minoxidil."], ["E", "All of the above."]], "a": "E", "sa": null, "pg": "95", "f": [], "s": "B", "n": 39, "e": ["Alopecia areata responds to corticosteroids, irritants like tincture iodine, PUVA and minoxidil, so all of the above.", "Several options."]}, {"id": "Q500", "ch": "Hair Disorders", "q": "Systemic corticosteroids are used to treat", "o": [["A", "Androgenetic alopecia."], ["B", "Alopecia areata."], ["C", "Psoriasis."], ["D", "Warts."], ["E", "Molluscum contagiosum."]], "a": "B", "sa": null, "pg": "95", "f": [], "s": "B", "n": 40, "e": ["Systemic corticosteroids are used in resistant or extensive alopecia areata (ophiasis, totalis, universalis).", "Systemic steroids in extensive AA."]}, {"id": "H292", "ch": "Hair Disorders", "q": "The following may be observed in alopecia areata:", "o": [["A", "Itching."], ["B", "Comedones."], ["C", "Vesicles."], ["D", "Adherent scales."], ["E", "Exclamation mark hairs."]], "a": "E", "sa": null, "pg": null, "f": [], "s": "H", "n": 41, "e": ["Exclamation-mark hairs, short broken hairs tapering toward the scalp, are seen at the border of alopecia areata patches. Itching, comedones, vesicles and adherent scales are not features.", "Exclamation hairs = AA."]}, {"id": "H293", "ch": "Hair Disorders", "q": "Clinical types of alopecia areata include all EXCEPT:", "o": [["A", "Patchy type."], ["B", "Marginal type."], ["C", "Mucocutaneous type."], ["D", "Alopecia totalis."], ["E", "Alopecia universalis."]], "a": "C", "sa": null, "pg": null, "f": [], "s": "H", "n": 42, "e": ["Clinical types: patchy, ophiasis, totalis, universalis (marginal type is ophiasis). No mucocutaneous type.", "No mucocutaneous."]}, {"id": "H294", "ch": "Hair Disorders", "q": "Androgenetic alopecia in males can be treated by:", "o": [["A", "Estrogens."], ["B", "Cyproterone acetate."], ["C", "Spironolactone."], ["D", "Topical minoxidil."], ["E", "All of the above."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 43, "e": ["Topical minoxidil and 5-alpha reductase inhibitors treat male AGA; estrogens and antiandrogens are for females.", "Minoxidil."]}, {"id": "H296", "ch": "Hair Disorders", "q": "17 year old male presenting with alopecia of gradual onset and progressive course 3 months after starting chemotherapy for lymphoma:", "o": [["A", "Androgenet alopecia"], ["B", "Telogen effluvium"], ["C", "Anagen effluvium"], ["D", "Alopecia areata"], ["E", "Cicatricial alopecia"]], "a": "C", "sa": null, "pg": null, "f": [], "s": "H", "n": 44, "e": ["Hair loss starting 3 months after chemotherapy for lymphoma points to anagen effluvium (toxic to active follicles).", "Chemo."]}, {"id": "H297", "ch": "Hair Disorders", "q": "In ophiasis:", "o": [["A", "Hair loss occurs along the margins of the scalp."], ["B", "Total scalp hair loss occurs."], ["C", "Cicatricial alopecia is a complication."], ["D", "Total body hair loss occurs."], ["E", "Localized area of hair loss is present."]], "a": "A", "sa": null, "pg": null, "f": [], "s": "H", "n": 45, "e": ["Hair loss along the scalp margins is ophiasis, a type of alopecia areata; it is not cicatricial and is not total.", "Margins."]}, {"id": "H298", "ch": "Hair Disorders", "q": "Case 2 A male patient, 27 years old, presented with hair loss of five- year duration with a gradual onset and a progressive course. It began by frontal and bitemporal recession, and then it involved the vertex. This patient is presenting with:", "o": [["A", "Telogen effluvium."], ["B", "Anagen effluvium."], ["C", "Androgenetic alopecia."], ["D", "Cicatricial alopecia."], ["E", "Alopecia areata."]], "a": "C", "sa": null, "pg": null, "f": [], "s": "H", "n": 46, "e": ["Slow progressive hair loss starting with frontal and bitemporal recession then the vertex in a young man is androgenetic alopecia.", "Male pattern."]}, {"id": "H299", "ch": "Hair Disorders", "q": "Which is TRUE regarding androgenetic alopecia?", "o": [["A", "Treated by systemic corticosteroids."], ["B", "Affects males only."], ["C", "Pathology involves melanocytes."], ["D", "Caused by accentuated 5-alpha reductase activity in hair follicles."], ["E", "Contagious."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 47, "e": ["AGA is due to accentuated 5-alpha reductase in follicles. It is not treated by systemic steroids, affects both sexes and does not involve melanocytes.", "5-AR."]}, {"id": "H301", "ch": "Hair Disorders", "q": "Exclamation mark hair is present in:", "o": [["A", "Androgenetic alopecia."], ["B", "Alopecia areata."], ["C", "Telogen effluvium."], ["D", "Anagen effluvium."]], "a": "B", "sa": null, "pg": null, "f": [], "s": "H", "n": 48, "e": ["Exclamation-mark hairs, broken tapered hairs at the margin of patches, are specific to alopecia areata.", "Exclamation hairs."]}, {"id": "H305", "ch": "Hair Disorders", "q": "Which of the following is considered an autoimmune disease?", "o": [["A", "Scaly ringworm."], ["B", "Androgenetic alopecia."], ["C", "Alopecia areata."], ["D", "Favus."], ["E", "Kerion."]], "a": "C", "sa": null, "pg": null, "f": [], "s": "H", "n": 49, "e": ["Alopecia areata is autoimmune; androgenetic alopecia is hormonal, others are fungal.", "AA autoimmune."]}, {"id": "H307", "ch": "Hair Disorders", "q": "Which of the following is TRUE about androgenetic alopecia?", "o": [["A", "It is a genetically determined cicatricial type of alopecia."], ["B", "Oral antiandrogens are used for treatment of male androgenetic alopecia."], ["C", "Minoxidil 2% is used in treatment of male (not female) androgenetic alopecia."], ["D", "Finasteride is contraindicated in male androgenetic alopecia."], ["E", "Is due to increased activity of 5 alfa-reductase in target follicles."]], "a": "E", "sa": null, "pg": null, "f": [], "s": "H", "n": 50, "e": ["AGA is genetically determined, non-cicatricial, treated by minoxidil (males and females), antiandrogens only in females, and due to increased 5-alpha reductase. Finasteride is used in males, not contraindicated.", "5-AR increased."]}, {"id": "Q501", "ch": "Acne Vulgaris", "q": "Acne is a chronic inflammatory disorder of the", "o": [["A", "Pilosebaceous units."], ["B", "Eccrine sweat glands."], ["C", "Apocrine sweat glands."], ["D", "Superficial dermis."], ["E", "Epidermis."]], "a": "A", "sa": null, "pg": "96", "f": [], "s": "B", "n": 1, "e": ["Acne vulgaris is a chro
