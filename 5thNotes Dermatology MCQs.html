HPV infection that is oncogenic with types 16 and 18. Why the other options are wrong: A) Genital herpes: Herpes is vesicular. B) Verruca plana: Verruca plana is flat. D) Molluscum contagiosum: Molluscum is umbilicated. E) Impetigo contagiosum: Impetigo is crusted.","Condyloma."],"im":[],"src":"Q167"},{"id":"K092","ch":"⭐ Key Ideas — each idea once","q":"A female patient, 34 years old, presented with multiple soft, pinkish, moist, foul-smelling outgrowths involving her genitalia. The condition started about one year ago with a gradual onset and progressive course. (Clinical photo: multiple cauliflower-like warty growths on the genital/perianal area.) Management of this case is by","o":[["A","Phototherapy."],["B","Radiotherapy."],["C","Systemic acyclovir."],["D","Intralesional steroids."],["E","Podophyllin resin 25%."]],"a":"E","sa":null,"pg":"30","f":[],"n":92,"e":["Genital warts are treated with podophyllin resin (10-25%, weekly, washed after 1-4 h), imiquimod, cryotherapy or laser. Podophyllin is contraindicated in pregnancy. Why the other options are wrong: A) Phototherapy: Phototherapy has no role in genital warts; podophyllin, imiquimod, cryotherapy or laser are used. B) Radiotherapy: Radiotherapy has no role in genital warts. C) Systemic acyclovir: Acyclovir treats HSV. D) Intralesional steroids: Steroids worsen warts.","Podophyllin weekly."],"im":[],"src":"Q168"},{"id":"K093","ch":"⭐ Key Ideas — each idea once","q":"Treatment of verruca vulgaris is by","o":[["A","Surgical excision."],["B","Intralesional corticosteroids."],["C","Topical antibiotic."],["D","Topical steroid."],["E","Electrocautery."]],"a":"E","sa":null,"pg":"30","f":[],"n":93,"e":["Verruca vulgaris can be destroyed by electrocautery, cryotherapy or chemicals. Why the other options are wrong: A) Surgical excision: Excision leaves scars. B) Intralesional corticosteroids: Steroids do not treat warts. C) Topical antibiotic: Antibiotics are for bacteria. D) Topical steroid: Steroids do not treat warts.","Destructive therapy."],"im":[],"src":"Q169"},{"id":"K094","ch":"⭐ Key Ideas — each idea once","q":"Warts can be treated by all of the following EXCEPT","o":[["A","Laser."],["B","Cryotherapy."],["C","Electrocautery."],["D","Intralesional steroids."],["E","Chemical cautery."]],"a":"D","sa":null,"pg":"30","f":[],"n":94,"e":["Intralesional steroids are not used for warts; laser, cryotherapy, electrocautery and chemical cautery are. Why the other options are wrong: A) Laser: Laser treats warts. B) Cryotherapy: Cryotherapy treats warts. C) Electrocautery: Electrocautery treats warts. E) Chemical cautery: Chemical cautery treats warts.","Steroids don't treat warts."],"im":[],"src":"Q170"},{"id":"K095","ch":"⭐ Key Ideas — each idea once","q":"In a pregnant female with venereal warts, all of the following treatment modalities can be used safely EXCEPT","o":[["A","Podophyllin resin."],["B","Laser."],["C","Cryotherapy."],["D","Electrocautery."],["E","None of the above."]],"a":"A","sa":null,"pg":"30","f":[],"n":95,"e":["Podophyllin resin is contraindicated in pregnancy; laser, cryotherapy and electrocautery may be used. Why the other options are wrong: B) Laser: Laser is safe. C) Cryotherapy: Cryotherapy is safe. D) Electrocautery: Electrocautery is safe. E) None of the above: A is the exception.","Pregnancy: avoid podophyllin."],"im":[],"src":"Q172"},{"id":"K096","ch":"⭐ Key Ideas — each idea once","q":"Laser may be used in the treatment of","o":[["A","Warts."],["B","Molluscum contagiosum."],["C","Acne scars."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"30","f":[],"n":96,"e":["Laser (CO2 or pulsed dye) can destroy warts, molluscum lesions and treat acne scars by resurfacing. Why the other options are wrong: A) Warts: Laser removes resistant warts. True, but B and C also apply. B) Molluscum contagiosum: Laser can treat molluscum. True, but A and C also apply. C) Acne scars: Laser resurfacing treats acne scars. True, but A and B also apply. E) None of the above: Wrong: laser is used in all three.","Laser: all of these."],"im":[],"src":"Q174"},{"id":"K097","ch":"⭐ Key Ideas — each idea once","q":"Molluscum contagiosum is","o":[["A","A bacterial infection with vesicle as primary lesion."],["B","A mycobacterial infection transmitted by droplet."],["C","A fungal infection caused by a yeast."],["D","A parasitic infection with nocturnal itching."],["E","A viral infection caused by pox virus."]],"a":"E","sa":null,"pg":"30","f":[],"n":97,"e":["Molluscum contagiosum is a viral infection by pox virus, spread by skin contact; it is considered an STD when genital. Why the other options are wrong: A) A bacterial infection with vesicle as pr…: It is viral. B) A mycobacterial infection transmitted by…: Molluscum is a poxvirus infection, not mycobacterial, fungal or parasitic. C) A fungal infection caused by a yeast: Molluscum is a poxvirus infection, not mycobacterial, fungal or parasitic. D) A parasitic infection with nocturnal itc…: Molluscum is a poxvirus infection, not mycobacterial, fungal or parasitic.","Pox virus."],"im":[],"src":"Q177"},{"id":"K098","ch":"⭐ Key Ideas — each idea once","q":"A pearly papule with central umbilication exuding cheesy material is typical of","o":[["A","Molluscum contagiosum."],["B","Plane wart."],["C","Varicella."],["D","Condyloma acuminata."],["E","Seborrheic keratosis."]],"a":"A","sa":null,"pg":"30","f":[],"n":98,"e":["A pearly papule with central umbilication and cheesy material is molluscum contagiosum. Why the other options are wrong: B) Plane wart: Plane warts are flat. C) Varicella: Varicella is vesicular. D) Condyloma acuminata: Condyloma is cauliflower. E) Seborrheic keratosis: Seborrheic keratosis is greasy.","Umbilicated."],"im":[],"src":"Q180"},{"id":"K099","ch":"⭐ Key Ideas — each idea once","q":"All of the following may be used in the treatment of molluscum contagiosum EXCEPT","o":[["A","Electrocautery."],["B","Carbolic acid."],["C","Cryotherapy."],["D","Steroids."],["E","Laser."]],"a":"D","sa":null,"pg":"31","f":[],"n":99,"e":["Molluscum is treated by curettage, cautery, cryotherapy, laser and chemicals, not steroids. Why the other options are wrong: A) Electrocautery: Electrocautery treats molluscum. B) Carbolic acid: Carbolic acid treats molluscum. C) Cryotherapy: Cryotherapy treats molluscum. E) Laser: Laser treats molluscum.","No steroids."],"im":[],"src":"Q182"},{"id":"K100","ch":"⭐ Key Ideas — each idea once","q":"Which of the following is a sexually transmitted skin disease?","o":[["A","Herpes progenitalis."],["B","Condyloma acuminata."],["C","Molluscum contagiosum."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"30","f":[],"n":100,"e":["Herpes progenitalis, condyloma acuminata and molluscum contagiosum are all sexually transmitted skin diseases. Why the other options are wrong: A) Herpes progenitalis: Herpes progenitalis (HSV-2) is sexually transmitted. True, but B and C also can be. B) Condyloma acuminata: Condyloma acuminata (HPV) is sexually transmitted. True, but A and C also can be. C) Molluscum contagiosum: Genital molluscum is sexually transmitted in adults. True, but A and B also are. E) None of the above: Wrong: all three can be sexually transmitted.","All of the above."],"im":[],"src":"Q185"},{"id":"K101","ch":"⭐ Key Ideas — each idea once","q":"All of the following diseases may be sexually transmitted EXCEPT","o":[["A","Scabies."],["B","Molluscum contagiosum."],["C","Condyloma acuminata."],["D","Eczema herpeticum."],["E","Herpes progenitalis."]],"a":"D","sa":null,"pg":"23","f":[],"n":101,"e":["Eczema herpeticum is a complication of HSV in atopic skin, not an STD itself. Why the other options are wrong: A) Scabies: Scabies is sexually transmissible. B) Molluscum contagiosum: Molluscum is transmissible. C) Condyloma acuminata: Condyloma is an STD. E) Herpes progenitalis: Herpes progenitalis is an STD.","Eczema herpeticum = atopics."],"im":[],"src":"Q186"},{"id":"K102","ch":"⭐ Key Ideas — each idea once","q":"Mucous membranes may be affected in:","o":[["A","Papular urticaria."],["B","Actinic lichen planus."],["C","Scabies."],["D","Chickenpox."],["E","None of the above."]],"a":"D","sa":null,"pg":"24","f":[],"n":102,"e":["Chickenpox produces vesicles that also appear on the oral mucosa (enanthem). Papular urticaria is an insect-bite hypersensitivity limited to skin, scabies spares mucous membranes, and actinic lichen planus (sun-exposed skin) does not typically involve them. Why the other options are wrong: A) Papular urticaria: Papular urticaria spares mucosa. B) Actinic lichen planus: Actinic LP is on sun-exposed skin. C) Scabies: Scabies spares mucosa. E) None of the above: Chickenpox does involve mucosa.","Mucosa: chickenpox, herpes simplex, classic lichen planus, DLE; not papular urticaria or scabies."],"im":[],"src":"Q537"},{"id":"K103","ch":"⭐ Key Ideas — each idea once","q":"The proper dose of oral acyclovir in the treatment of herpes zoster is:","o":[["A","200 mg 5 times daily."],["B","400 mg 3 times daily."],["C","800 mg 5 times daily."],["D","800 mg 3 times daily."]],"a":"C","sa":null,"pg":"27","f":[],"n":103,"e":["The dose of oral acyclovir for herpes zoster is 800 mg five times daily for 7 days, started within 48-72 hours of the rash. 200 mg five times daily is the herpes simplex dose, which is why the lower options are wrong. Why the other options are wrong: A) 200 mg 5 times daily: Too low. B) 400 mg 3 times daily: Not the zoster dose. D) 800 mg 3 times daily: Too infrequent.","Zoster: 800 mg × 5/day × 7 days. Herpes simplex: 200 mg × 5/day."],"im":[],"src":"Q538"},{"id":"K104","ch":"⭐ Key Ideas — each idea once","q":"One attack gives solid immunity for:","o":[["A","Herpes simplex."],["B","Herpes zoster."],["C","Scabies."],["D","Impetigo."],["E","Molluscum contagiosum."]],"a":"B","sa":null,"pg":null,"f":["The book notes zoster can recur; the key treats one attack as giving solid immunity. Please verify."],"n":104,"e":["Herpes zoster usually gives solid lifelong immunity after one attack, unlike herpes simplex which recurs. Why the other options are wrong: A) Herpes simplex: HSV recurs. C) Scabies: Scabies can recur. D) Impetigo: Impetigo recurs. E) Molluscum contagiosum: Molluscum recurs.","Zoster rarely recurs."],"im":[],"src":"H079"},{"id":"K105","ch":"⭐ Key Ideas — each idea once","q":"All of the following microorganisms have a predilection for neural tissue EXCEPT:","o":[["A","Varicella zoster virus."],["B","Human papilloma virus."],["C","Herpes simplex virus."],["D","Lepra bacilli."],["E","Pox virus."]],"a":"B & E","sa":null,"pg":null,"f":["Both B and E are accepted as correct answers."],"n":105,"e":["HPV is not neurotropic and pox virus also lacks neural predilection, so both B and E are correct answers. VZV, HSV and lepra bacilli do have neural predilection. Why the other options are wrong: A) Varicella zoster virus: VZV stays latent in dorsal root ganglia and causes zoster along a nerve. C) Herpes simplex virus: HSV stays latent in sensory ganglia and recurs along the nerve. D) Lepra bacilli: M. leprae invades Schwann cells, causing nerve damage.","Neurotropic: VZV, HSV, lepra."],"im":[],"src":"H083"},{"id":"K106","ch":"⭐ Key Ideas — each idea once","q":"Herpes progenitalis is:","o":[["A","Caused by HSV type II."],["B","Linked with cancer cervix."],["C","Characterized by recurrent vesicles & erosions on genitalia."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":106,"e":["Herpes progenitalis is caused by HSV-2, linked with cervical cancer, and characterized by recurrent vesicles and erosions, so all of the above. Why the other options are wrong: A) Caused by HSV type II: Herpes progenitalis is mostly HSV type II. True, but B and C are true too. B) Linked with cancer cervix: HSV-II is linked with cervical cancer. True, but A and C are true too. C) Characterized by recurrent vesicles & er…: It shows recurrent genital vesicles and erosions. True, but A and B are true too. E) None of the above: Wrong: A, B and C are all true.","HSV-2, recurrent."],"im":[],"src":"H101"},{"id":"K107","ch":"⭐ Key Ideas — each idea once","q":"All of the following is true for herpes zoster Except:","o":[["A","It is recurrent."],["B","It is a viral infection."],["C","It is preceded by pain."],["D","It is unilateral."],["E","It might cause scarring."]],"a":"A","sa":null,"pg":null,"f":[],"n":107,"e":["Zoster is not usually recurrent; it is preceded by pain, is unilateral, viral and may scar. Why the other options are wrong: B) It is a viral infection: Zoster is VZV reactivation. C) It is preceded by pain: Pain or tingling precedes the rash. D) It is unilateral: It is unilateral and dermatomal, not crossing the midline. E) It might cause scarring: It can scar, especially hemorrhagic or necrotic cases.","Zoster seldom recurs."],"im":[],"src":"H114"},{"id":"K108","ch":"⭐ Key Ideas — each idea once","q":"Dermatophytes cause infection of","o":[["A","Non-hairy skin."],["B","Hair."],["C","Nails."],["D","a + b."],["E","a + b + c."]],"a":"E","sa":null,"pg":"32","f":[],"n":108,"e":["Dermatophytes live on keratin, so they infect hairless skin (tinea corporis, cruris, pedis, manuum), hair (tinea capitis, barbae) and nails (tinea unguium). Why the other options are wrong: A) Non-hairy skin: True but incomplete: hairless skin is only one site. B) Hair: True but incomplete: hair (tinea capitis, barbae) is only one site. C) Nails: True but incomplete: nails (tinea unguium) are only one site. D) a + b: Still leaves out the nails, which dermatophytes also invade.","Skin, hair, nails."],"im":[],"src":"Q188"},{"id":"K109","ch":"⭐ Key Ideas — each idea once","q":"Onychomycosis is ringworm of","o":[["A","Scalp."],["B","Beard."],["C","Groin."],["D","Nails."],["E","Trunk."]],"a":"D","sa":null,"pg":"32","f":[],"n":109,"e":["Onychomycosis (tinea unguium) is dermatophyte infection of the nails. Why the other options are wrong: A) Scalp: Ringworm of the scalp is tinea capitis. B) Beard: Ringworm of the beard is tinea barbae. C) Groin: Ringworm of the groin is tinea cruris. E) Trunk: Ringworm of the trunk (hairless skin) is tinea corporis.","Nails."],"im":[],"src":"Q190"},{"id":"K110","ch":"⭐ Key Ideas — each idea once","q":"A 4-year-old child presented with a circumscribed area of hair loss. On examination, short stumps of hairs and scales were seen. The most probable diagnosis is","o":[["A","Alopecia areata."],["B","Tinea capitis (scaly ringworm)."],["C","Discoid lupus erythematosus."],["D","Lichen planus."],["E","Psoriasis."]],"a":"B","sa":null,"pg":"33","f":[],"n":110,"e":["A child with a circumscribed bald patch, broken stumps of hair and fine grayish-white scales has scaly (gray patch) tinea capitis; the hairs break off above the skin. Why the other options are wrong: A) Alopecia areata: Alopecia areata is smooth and not scaly, with normal-looking scalp skin. C) Discoid lupus erythematosus: DLE gives scarring, atrophic, scaly plaques and is rare in young children. D) Lichen planus: Lichen planus (planopilaris) is an adult disease that scars the scalp. E) Psoriasis: Psoriasis gives thick silvery plaques without breaking of hairs into stumps.","Short stumps + scales."],"im":[],"src":"Q191"},{"id":"K111","ch":"⭐ Key Ideas — each idea once","q":"Kerion","o":[["A","Is a boggy swelling simulating an abscess."],["B","Is a disease of adults only."],["C","Is a staphylococcal infection of the hair follicle."],["D","Is associated with systemic manifestations."],["E","Never leads to cicatricial alopecia."]],"a":"A","sa":null,"pg":"33","f":[],"n":111,"e":["Kerion is a boggy swelling studded with follicular pustules that mimics a bacterial abscess; incision and antibiotics worsen it and increase scarring. Why the other options are wrong: B) Is a disease of adults only: Kerion affects both children and adults. C) Is a staphylococcal infection of the hai…: It is a dermatophyte (fungal) infection, which is why antibiotics fail. D) Is associated with systemic manifestatio…: It is a local inflammatory reaction; systemic manifestations are not a defining feature. E) Never leads to cicatricial alopecia: It can end in cicatricial alopecia if not treated early.","Kerion = fungal abscess-like."],"im":[],"src":"Q195"},{"id":"K112","ch":"⭐ Key Ideas — each idea once","q":"One of the following may cause cicatricial alopecia","o":[["A","Androgenetic alopecia."],["B","Telogen effluvium."],["C","Alopecia areata."],["D","Kerion."],["E","Scaly ringworm."]],"a":"D","sa":null,"pg":"33","f":[],"n":112,"e":["Kerion can heal with scarring (cicatricial alopecia) if not treated early; favus does too. Why the other options are wrong: A) Androgenetic alopecia: Androgenetic alopecia is patterned and non-scarring. B) Telogen effluvium: Telogen effluvium is diffuse reversible shedding. C) Alopecia areata: Alopecia areata is non-scarring. E) Scaly ringworm: Scaly ringworm leaves no scar.","Kerion, favus scar."],"im":[],"src":"Q198"},{"id":"K113","ch":"⭐ Key Ideas — each idea once","q":"Scutula is the characteristic lesion of","o":[["A","Scaly ringworm."],["B","Black-dot ringworm."],["C","Favus."],["D","Kerion."],["E","None of the above."]],"a":"C","sa":null,"pg":"33","f":[],"n":113,"e":["Scutula (yellow cup-shaped sulfur crusts around hairs) are the characteristic lesion of favus. Why the other options are wrong: A) Scaly ringworm: Scaly type shows fine grayish-white scales. B) Black-dot ringworm: Black-dot type shows hairs broken at the skin surface as black dots. D) Kerion: Kerion is a boggy swelling with pustules. E) None of the above: Scutula do belong to one of the types: favus.","Scutula = favus."],"im":[],"src":"Q199"},{"id":"K114","ch":"⭐ Key Ideas — each idea once","q":"A child presents with an area of thick yellow cup-shaped crusts surrounding hair shafts on the scalp, associated with scarring alopecia. The most likely diagnosis is:","o":[["A","Tinea corporis."],["B","Favus."],["C","Discoid lupus erythematosus."],["D","Impetigo."],["E","Seborrheic dermatitis."]],"a":"B","sa":null,"pg":"33","f":[],"n":114,"e":["Thick yellow cup-shaped crusts around hair shafts with scarring alopecia are scutula of favus. Why the other options are wrong: A) Tinea corporis: Tinea corporis affects hairless skin, not the scalp. C) Discoid lupus erythematosus: DLE scars but has no cup-shaped crusts around hairs. D) Impetigo: Impetigo has honey-colored crusts and does not cause scarring alopecia. E) Seborrheic dermatitis: Seborrheic dermatitis gives greasy scales and no scarring.","Favus scars."],"im":[],"src":"Q200"},{"id":"K115","ch":"⭐ Key Ideas — each idea once","q":"Wood's light is used in the diagnosis of","o":[["A","Tinea versicolor."],["B","Erythrasma."],["C","Favus."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"34","f":[],"n":115,"e":["Wood's light shows yellow fluorescence in tinea versicolor, coral red in erythrasma and yellowish-green in favus (and black-dot type), so all are diagnosed with it. Why the other options are wrong: A) Tinea versicolor: True but incomplete: versicolor fluoresces yellow. B) Erythrasma: True but incomplete: erythrasma fluoresces coral red. C) Favus: True but incomplete: favus fluoresces yellowish-green. E) None of the above: Wrong because all listed conditions are examined with Wood's light.","Versicolor, erythrasma, favus."],"im":[],"src":"Q203"},{"id":"K116","ch":"⭐ Key Ideas — each idea once","q":"Case 3: A female patient, 19 years old, presented with an annular well-defined plaque on her forearm. The lesion showed an active border and a clear center. The condition started about 3 weeks ago with a gradual onset and a progressive course. She applied topical antibiotic cream for 2 weeks with no improvement. (Clinical photo: annular plaque with active scaly border and clear center on the forearm.) This plaque is suggestive of","o":[["A","Seborrheic dermatitis."],["B","Irritant dermatitis."],["C","Scabies."],["D","Tinea circinata."],["E","Tinea versicolor."]],"a":"D","sa":null,"pg":"34","f":[],"n":116,"e":["A well-defined annular plaque with an active edge and clear center is tinea corporis (circinata). Why the other options are wrong: A) Seborrheic dermatitis: Seborrheic dermatitis is greasy scaling in seborrheic areas without an active edge. B) Irritant dermatitis: Irritant dermatitis has no advancing edge with central clearing. C) Scabies: Scabies shows burrows and nocturnal itching. E) Tinea versicolor: Tinea versicolor is branny macules on the trunk without an active border.","Ring edge + clear center."],"im":[],"src":"Q204"},{"id":"K117","ch":"⭐ Key Ideas — each idea once","q":"Case 3: A female patient, 19 years old, presented with an annular well-defined plaque on her forearm. The lesion showed an active border and a clear center. The condition started about 3 weeks ago with a gradual onset and a progressive course. She applied topical antibiotic cream for 2 weeks with no improvement. (Clinical photo: annular plaque with active scaly border and clear center on the forearm.) The following drug is used for treatment","o":[["A","Systemic antibiotic."],["B","Topical steroid."],["C","Systemic ivermectin."],["D","Topical permethrin."],["E","Topical azole."]],"a":"E","sa":null,"pg":"37","f":[],"n":117,"e":["Localized tinea corporis is treated with topical azole or terbinafine creams; systemic drugs are kept for extensive or resistant cases. Why the other options are wrong: A) Systemic antibiotic: The cause is fungal, so antibiotics do not help. B) Topical steroid: Topical steroid suppresses inflammation and lets the fungus spread. C) Systemic ivermectin: Ivermectin is for scabies. D) Topical permethrin: Permethrin is for scabies and lice.","Topical azole."],"im":[],"src":"Q205"},{"id":"K118","ch":"⭐ Key Ideas — each idea once","q":"Which systemic treatment is used in treatment of tinea corporis?","o":[["A","Terbinafine."],["B","Ivermectin."],["C","Corticosteroids."],["D","Acitretin."],["E","Psoralen."]],"a":"A","sa":null,"pg":"37","f":[],"n":118,"e":["Systemic terbinafine (also griseofulvin and azoles) is used for extensive or resistant tinea corporis. Why the other options are wrong: B) Ivermectin: Ivermectin treats parasites. C) Corticosteroids: Corticosteroids worsen fungal infection. D) Acitretin: Acitretin is a retinoid for psoriasis. E) Psoralen: Psoralen is used with UVA (PUVA) for psoriasis and vitiligo.","Terbinafine."],"im":[],"src":"Q206"},{"id":"K119","ch":"⭐ Key Ideas — each idea once","q":"Case 2: A female patient, 33 years old, presented with an extending plaque on her inner thighs. The condition started about 2 months ago with a gradual onset and a progressive course. She applied a topical antibiotic cream for 2 weeks with no improvement. (Clinical photo: annular erythematous plaque with active border on the inner thigh.) What is the diagnosis of this case?","o":[["A","Tinea manuum."],["B","Tinea unguium."],["C","Tinea cruris."],["D","Crusted scabies."],["E","Circinate impetigo."]],"a":"C","sa":null,"pg":"35","f":[],"n":119,"e":["An extending plaque in the groin/inner thigh that failed a topical antibiotic is tinea cruris. Why the other options are wrong: A) Tinea manuum: Tinea manuum is ringworm of the palm. B) Tinea unguium: Tinea unguium is nail infection. D) Crusted scabies: Crusted scabies is thick crusts with intense itching, in immunosuppressed patients. E) Circinate impetigo: Circinate impetigo is bacterial and would respond to the antibiotic.","Spares the scrotum."],"im":[],"src":"Q208"},{"id":"K120","ch":"⭐ Key Ideas — each idea once","q":"Case 2: A female patient, 33 years old, presented with an extending plaque on her inner thighs. The condition started about 2 months ago with a gradual onset and a progressive course. She applied a topical antibiotic cream for 2 weeks with no improvement. (Clinical photo: annular erythematous plaque with active border on the inner thigh.) Which medication will benefit the patient?","o":[["A","Oral terbinafine."],["B","Topical corticosteroids."],["C","Oral ivermectin."],["D","Topical psoralen."],["E","Oral antibiotics."]],"a":"A","sa":null,"pg":"37","f":[],"n":120,"e":["The failed topical antibiotic points to a fungal cause. The book gives topical azoles/terbinafine for tinea cruris and systemic therapy for extensive or resistant cases; of the options, only terbinafine is an antifungal. Why the other options are wrong: B) Topical corticosteroids: Topical corticosteroids worsen tinea. C) Oral ivermectin: Ivermectin is antiparasitic. D) Topical psoralen: Psoralen is used for phototherapy. E) Oral antibiotics: Antibiotics do not treat fungi, and she already failed one.","Terbinafine."],"im":[],"src":"Q209"},{"id":"K121","ch":"⭐ Key Ideas — each idea once","q":"Tinea cruris may be confused with","o":[["A","Flexural psoriasis."],["B","Erythrasma."],["C","Candidal intertrigo."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"35","f":[],"n":121,"e":["The differential of tinea cruris includes candidiasis, flexural psoriasis, seborrheic dermatitis and erythrasma, so all options apply. Why the other options are wrong: A) Flexural psoriasis: True but incomplete: flexural (inverse) psoriasis. B) Erythrasma: True but incomplete: erythrasma. C) Candidal intertrigo: True but incomplete: candidal intertrigo. E) None of the above: Wrong because all can mimic it.","DD: psoriasis, erythrasma, candida."],"im":[],"src":"Q210"},{"id":"K122","ch":"⭐ Key Ideas — each idea once","q":"Flexural areas may be affected in","o":[["A","Psoriasis."],["B","Candidiasis."],["C","Dermatophytosis."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"35","f":[],"n":122,"e":["Flexures are affected by candidal intertrigo, flexural psoriasis and tinea cruris, so all options apply. Why the other options are wrong: A) Psoriasis: True but incomplete: flexural psoriasis. B) Candidiasis: True but incomplete: candidal intertrigo. C) Dermatophytosis: True but incomplete: tinea cruris. E) None of the above: Wrong because all three affect flexures.","Intertrigo."],"im":[],"src":"Q212"},{"id":"K123","ch":"⭐ Key Ideas — each idea once","q":"Tinea barbae","o":[["A","Is a viral infection of the beard area."],["B","May be circinate or kerion-like."],["C","Is a bacterial infection of the beard area."],["D","Is a painful vesicular eruption of the beard area."],["E","Responds to oral tetracycline."]],"a":"B","sa":null,"pg":"35","f":[],"n":123,"e":["Tinea barbae is dermatophyte infection of the beard, mostly one-sided on neck or face, either circinate or with pustules like kerion. Why the other options are wrong: A) Is a viral infection of the beard area: It is fungal, not viral. C) Is a bacterial infection of the beard ar…: Bacterial beard infection is sycosis barbae; tinea barbae is fungal. D) Is a painful vesicular eruption of the b…: Painful vesicles in the beard suggest herpes simplex. E) Responds to oral tetracycline: Tetracycline is antibacterial and will not cure a fungus.","Beard ringworm."],"im":[],"src":"Q213"},{"id":"K124","ch":"⭐ Key Ideas — each idea once","q":"Tinea pedis","o":[["A","Is strictly unilateral."],["B","Commonly involves the space between 1st & 2nd toes."],["C","Is a recurrent disease."],["D","Excessive dryness is a predisposing factor."],["E","Needs repeated washing of the feet."]],"a":"C","sa":null,"pg":"36","f":[],"n":124,"e":["Tinea pedis is a recurrent disease; recurrences are common. Why the other options are wrong: A) Is strictly unilateral: It is mostly bilateral. B) Commonly involves the space between 1st …: It usually affects the lateral web spaces (4th and 5th toes), not the first and second. D) Excessive dryness is a predisposing fact…: Excessive sweating and moisture predispose, not dryness. E) Needs repeated washing of the feet: Moisture promotes it; the feet should be kept dry.","Recurrent."],"im":[],"src":"Q215"},{"id":"K125","ch":"⭐ Key Ideas — each idea once","q":"Excessive sweating & moisture is a predisposing factor for","o":[["A","Psoriasis."],["B","Pityriasis rosea."],["C","Vitiligo."],["D","Favus."],["E","Tinea pedis."]],"a":"E","sa":null,"pg":"36","f":[],"n":125,"e":["Excessive sweating and moisture predispose to tinea pedis (also diabetes). Why the other options are wrong: A) Psoriasis: Psoriasis is not related to moisture. B) Pityriasis rosea: Pityriasis rosea is not related to sweating. C) Vitiligo: Vitiligo is autoimmune. D) Favus: Favus is not moisture dependent.","Moist feet."],"im":[],"src":"Q216"},{"id":"K126","ch":"⭐ Key Ideas — each idea once","q":"Tinea unguium affects","o":[["A","Nail fold."],["B","Nail plate."],["C","Groin."],["D","Joints."],["E","Interdigital space."]],"a":"B","sa":null,"pg":"37","f":[],"n":126,"e":["Tinea unguium involves the nail plate, with yellowish or whitish discoloration, thickening and onycholysis. Why the other options are wrong: A) Nail fold: The nail fold is affected in paronychia, often candidal. C) Groin: Groin involvement is tinea cruris. D) Joints: Joints are not involved. E) Interdigital space: Interdigital spaces are affected in tinea pedis.","Nail plate."],"im":[],"src":"Q217"},{"id":"K127","ch":"⭐ Key Ideas — each idea once","q":"The main line of treatment of tinea capitis is","o":[["A","Tincture iodine."],["B","Griseofulvin."],["C","Malathion."],["D","Calcipotriene."],["E","Tetracycline."]],"a":"B","sa":null,"pg":"37","f":[],"n":127,"e":["Systemic griseofulvin (12.5 mg/kg/day for 6-8 weeks) is the backbone of tinea capitis treatment. Why the other options are wrong: A) Tincture iodine: Tincture iodine is only a topical adjuvant. C) Malathion: Malathion treats head lice. D) Calcipotriene: Calcipotriene is used in psoriasis. E) Tetracycline: Tetracycline is antibacterial.","Griseofulvin = systemic."],"im":[],"src":"Q219"},{"id":"K128","ch":"⭐ Key Ideas — each idea once","q":"Tinea capitis can be treated TOPICALLY ALONE by","o":[["A","Selenium sulphide."],["B","Castellani's paint."],["C","Tincture iodine."],["D","Imidazole derivatives."],["E","None of the above."]],"a":"E","sa":null,"pg":"37","f":[],"n":128,"e":["Tinea capitis cannot be cured by topical therapy alone because the fungus lies inside the hair, so systemic treatment is the backbone. Why the other options are wrong: A) Selenium sulphide: Selenium sulphide shampoo is only an adjuvant. B) Castellani's paint: Castellani paint is used for tinea pedis. C) Tincture iodine: Tincture iodine is only an adjuvant. D) Imidazole derivatives: Azole creams cannot reach fungus inside hair.","Systemic required."],"im":[],"src":"Q220"},{"id":"K129","ch":"⭐ Key Ideas — each idea once","q":"Given that the dose of griseofulvin is 12.5 mg/kg body weight/day and each tablet is 125 mg, an 80 kg man with extensive tinea cruris will take","o":[["A","5 tablets/day."],["B","9 tablets/day."],["C","7 tablets/day."],["D","8 tablets/day."],["E","6 tablets/day."]],"a":"D","sa":null,"pg":"37","f":[],"n":129,"e":["Dose = 12.5 mg x 80 kg = 1000 mg; 1000 / 125 = 8 tablets daily. Why the other options are wrong: A) 5 tablets/day: 5 tablets = 625 mg, too low. B) 9 tablets/day: 9 tablets = 1125 mg, too high. C) 7 tablets/day: 7 tablets = 875 mg, too low. E) 6 tablets/day: 6 tablets = 750 mg, too low.","1000 mg ÷ 125 mg = 8."],"im":[],"src":"Q222"},{"id":"K130","ch":"⭐ Key Ideas — each idea once","q":"Griseofulvin is a drug of choice for","o":[["A","Dermatophytosis."],["B","Tinea versicolor."],["C","Oral thrush."],["D","Erosio interdigitalis blastomycetica."],["E","Balanitis."]],"a":"A","sa":null,"pg":"37","f":[],"n":130,"e":["Griseofulvin is a drug of choice for dermatophytosis (tinea). Why the other options are wrong: B) Tinea versicolor: Tinea versicolor is yeast. C) Oral thrush: Oral thrush is yeast. D) Erosio interdigitalis blastomycetica: Erosio interdigitalis blastomycetica is candidal. E) Balanitis: Balanitis is usually candidal.","Not yeasts."],"im":[],"src":"Q225"},{"id":"K131","ch":"⭐ Key Ideas — each idea once","q":"Griseofulvin is effective in the treatment of all of the following EXCEPT","o":[["A","Tinea capitis."],["B","Tinea corporis."],["C","Tinea versicolor."],["D","Onychomycosis."],["E","Tinea pedis."]],"a":"C","sa":null,"pg":"41","f":[],"n":131,"e":["Griseofulvin is not effective in yeast infection, so it is the exception for tinea versicolor (Malassezia). Why the other options are wrong: A) Tinea capitis: Tinea capitis is its main indication. B) Tinea corporis: Griseofulvin is used in extensive tinea corporis. D) Onychomycosis: The book names terbinafine and azoles for nails, but griseofulvin is a dermatophyte drug that has been used for nails. E) Tinea pedis: Tinea pedis is dermatophyte infection.","Griseofulvin ≠ versicolor."],"im":[],"src":"Q227"},{"id":"K132","ch":"⭐ Key Ideas — each idea once","q":"Regarding pityriasis versicolor","o":[["A","It affects children only."],["B","It is very itchy."],["C","Systemic antifungal therapy is essential in the treatment."],["D","A single attack gives lifelong immunity."],["E","It is caused by the lipophilic yeast Malassezia furfur."]],"a":"E","sa":null,"pg":"38","f":[],"n":132,"e":["Pityriasis versicolor is caused by the lipophilic yeast Malassezia furfur. Why the other options are wrong: A) It affects children only: It occurs in adolescents and young adults. B) It is very itchy: It is usually asymptomatic, and itching is mild if present. C) Systemic antifungal therapy is essential…: Topical therapy is first-line; systemic is for extensive cases. D) A single attack gives lifelong immunity: Recurrences are common, so there is no lifelong immunity.","Lipophilic yeast."],"im":[],"src":"Q231"},{"id":"K133","ch":"⭐ Key Ideas — each idea once","q":"Pityriasis versicolor","o":[["A","Is a superficial dermatophytic infection of the skin."],["B","Primary lesion is hyper- or hypopigmented papules."],["C","Macules are covered with fine branny scales."],["D","Treatment is by griseofulvin."],["E","Is non-infectious."]],"a":"C","sa":null,"pg":"38","f":[],"n":133,"e":["Pityriasis versicolor lesions are macules or patches with mild, fine (branny) scales. Why the other options are wrong: A) Is a superficial dermatophytic infection…: It is caused by a yeast, not a dermatophyte. B) Primary lesion is hyper- or hypopigmente…: The lesions are macules and patches, not papules. D) Treatment is by griseofulvin: Griseofulvin is ineffective in yeasts. E) Is non-infectious: It is an infectious superficial mycosis.","Branny scale."],"im":[],"src":"Q232"},{"id":"K134","ch":"⭐ Key Ideas — each idea once","q":"An adult patient presents with multiple, asymptomatic, hypopigmented macules on the upper back and chest with fine branny scaling. Lesions show yellow fluorescence under Wood's lamp. The most likely diagnosis is:","o":[["A","Erythrasma."],["B","Post-inflammatory hypopigmentation."],["C","Pityriasis rosea."],["D","Leprosy."],["E","Pityriasis versicolor."]],"a":"E","sa":null,"pg":"38","f":[],"n":134,"e":["Asymptomatic hypopigmented macules with branny scales and yellow Wood's fluorescence are pityriasis versicolor. Why the other options are wrong: A) Erythrasma: Erythrasma gives coral-red fluorescence and is in flexures. B) Post-inflammatory hypopigmentation: Post-inflammatory hypopigmentation follows a prior inflammatory lesion. C) Pityriasis rosea: Pityriasis rosea is pink oval patches with a herald patch. D) Leprosy: Leprosy gives anesthetic patches.","Upper trunk."],"im":[],"src":"Q235"},{"id":"K135","ch":"⭐ Key Ideas — each idea once","q":"Regarding pityriasis versicolor, what is the result of Wood's light examination?","o":[["A","Coral red fluorescence."],["B","Yellow fluorescence."],["C","Permanganate-colored fluorescence."],["D","Bluish fluorescence."],["E","Brown fluorescence."]],"a":"B","sa":null,"pg":"38","f":[],"n":135,"e":["Pityriasis versicolor shows yellow fluorescence under Wood's light. Why the other options are wrong: A) Coral red fluorescence: Coral red is erythrasma. C) Permanganate-colored fluorescence: Not a Wood's-lamp color in the book: yellow = versicolor, coral red = erythrasma, yellowish-green = favus/black-dot. D) Bluish fluorescence: Not a Wood's-lamp color in the book: yellow = versicolor, coral red = erythrasma, yellowish-green = favus/black-dot. E) Brown fluorescence: Not a Wood's-lamp color in the book: yellow = versicolor, coral red = erythrasma, yellowish-green = favus/black-dot.","Yellow."],"im":[],"src":"Q238"},{"id":"K136","ch":"⭐ Key Ideas — each idea once","q":"Spaghetti and meatballs appearance represents the mycelia and spores of","o":[["A","Candida albicans infection."],["B","Dermatophyte infection."],["C","Pityriasis versicolor infection."],["D","Staphylococcus aureus infection."],["E","Corynebacterium minutissimum infection."]],"a":"C","sa":null,"pg":"38","f":[],"n":136,"e":["KOH shows short hyphae with round spores ('spaghetti and meatballs') in pityriasis versicolor. Why the other options are wrong: A) Candida albicans infection: Candida shows budding yeast and pseudohyphae. B) Dermatophyte infection: Dermatophytes show long branching hyphae and arthrospores. D) Staphylococcus aureus infection: Staph aureus is a bacterium, not seen with KOH. E) Corynebacterium minutissimum infection: Erythrasma bacterium is seen on stain.","Spaghetti and meatballs."],"im":[],"src":"Q240"},{"id":"K137","ch":"⭐ Key Ideas — each idea once","q":"Tinea versicolor may be treated by one of the following","o":[["A","Ketoconazole."],["B","Griseofulvin."],["C","Fusidic acid."],["D","Tetracycline."],["E","Permethrin."]],"a":"A","sa":null,"pg":"38","f":[],"n":137,"e":["Ketoconazole, an azole, treats pityriasis versicolor. Why the other options are wrong: B) Griseofulvin: Griseofulvin is ineffective in yeast. C) Fusidic acid: Fusidic acid is antibacterial. D) Tetracycline: Tetracycline is antibacterial. E) Permethrin: Permethrin is antiparasitic.","Azoles work."],"im":[],"src":"Q242"},{"id":"K138","ch":"⭐ Key Ideas — each idea once","q":"Candida albicans is the causative organism of","o":[["A","Oral lichen planus."],["B","Tinea cruris."],["C","Oral thrush."],["D","Pityriasis versicolor."],["E","Erythrasma."]],"a":"C","sa":null,"pg":"40","f":[],"n":138,"e":["Candida albicans causes oral thrush. Why the other options are wrong: A) Oral lichen planus: Oral lichen planus is immune-mediated. B) Tinea cruris: Tinea cruris is a dermatophyte infection. D) Pityriasis versicolor: Pityriasis versicolor is caused by Malassezia. E) Erythrasma: Erythrasma is bacterial.","Thrush = Candida."],"im":[],"src":"Q245"},{"id":"K139","ch":"⭐ Key Ideas — each idea once","q":"Interdigital moniliasis of the hand is common between which fingers?","o":[],"a":null,"sa":"Between the middle and ring fingers (3rd and 4th fingers), as this space is anatomically narrow.","pg":"39","f":[],"n":139,"e":["Interdigital candidiasis is common between the middle and ring fingers because this space is narrow and retains moisture.","3rd–4th web."],"im":[],"src":"Q246"},{"id":"K140","ch":"⭐ Key Ideas — each idea once","q":"Cutaneous manifestations of candida include","o":[["A","Ecthyma."],["B","Hypopigmentation."],["C","Favus."],["D","Herald patch."],["E","Perleche."]],"a":"E","sa":null,"pg":"39","f":[],"n":140,"e":["Perleche (angular cheilitis) is a cutaneous candida manifestation. Why the other options are wrong: A) Ecthyma: Ecthyma is bacterial. B) Hypopigmentation: Hypopigmentation is a feature of pityriasis versicolor. C) Favus: Favus is dermatophyte. D) Herald patch: Herald patch is pityriasis rosea.","Perleche."],"im":[],"src":"Q247"},{"id":"K141","ch":"⭐ Key Ideas — each idea once","q":"Cutaneous manifestations of candida include all of the following EXCEPT","o":[["A","Intertrigo."],["B","Erosio interdigitalis blastomycetica."],["C","Favus."],["D","Paronychia."],["E","Perleche."]],"a":"C","sa":null,"pg":"39","f":[],"n":141,"e":["Favus is a dermatophyte infection, not candida. Why the other options are wrong: A) Intertrigo: Candidal intertrigo: erythema with satellite pustules in the groin, axillae and inframammary folds. B) Erosio interdigitalis blastomycetica: Interdigital candidiasis: macerated sodden skin between finger webs, typically the ring-middle space. D) Paronychia: Candidal paronychia: chronic swollen red nail fold in wet-work occupations (housewives, cooks), with no throbbing or pointing. E) Perleche: Perleche (angular cheilitis): maceration at the angles of the mouth.","Favus = dermatophyte."],"im":[],"src":"Q248"},{"id":"K142","ch":"⭐ Key Ideas — each idea once","q":"Treatment of choice for candidal paronychia is:","o":[["A","Imiquimod."],["B","Clofazimine."],["C","Griseofulvin."],["D","Macrolide."],["E","Fluconazole."]],"a":"E","sa":null,"pg":"41","f":[],"n":142,"e":["Fluconazole is systemic azole for candida. Why the other options are wrong: A) Imiquimod: Imiquimod is for warts. B) Clofazimine: Clofazimine is for leprosy. C) Griseofulvin: Griseofulvin is not effective in yeast. D) Macrolide: Macrolides are antibacterial.","Fluconazole."],"im":[],"src":"Q253"},{"id":"K143","ch":"⭐ Key Ideas — each idea once","q":"Which statement regarding the scaly type of tinea capitis is correct?","o":[["A","It affects adults only."],["B","Its presence should suggest immunological deficiency."],["C","It results in cicatricial alopecia."],["D","It causes patches that fluoresce yellow-green under Wood's lamp."],["E","It is effectively treated with topical nystatin ointment."]],"a":"D","sa":null,"pg":null,"f":["Answer key corrected per your instruction."],"n":143,"e":["The scaly type fluoresces yellow-green under Wood's lamp (note: the book itself lists black-dot type and favus for this finding); the other statements are false. Note: I am not sure about this answer; it is either B or D. Why the other options are wrong: A) It affects adults only: It affects children only. B) Its presence should suggest immunologica…: The book does not link the scaly type with immune deficiency, but see the note: the answer is uncertain between B and D. C) It results in cicatricial alopecia: It does not scar. E) It is effectively treated with topical n…: Nystatin is ineffective against dermatophytes.","Microsporum = yellow-green."],"im":[],"src":"H157"},{"id":"K144","ch":"⭐ Key Ideas — each idea once","q":"Itching is the cardinal symptom in","o":[["A","Vitiligo"],["B","Alopecia"],["C","Scabies"],["D","Leprosy"],["E","Impetigo"]],"a":"C","sa":null,"pg":null,"f":[],"n":144,"e":["Scabies produces intense generalized itching that is worse at night and when warm, which is the cardinal symptom and the first clue. Why the other options are wrong: A) Vitiligo: Vitiligo is asymptomatic. B) Alopecia: Alopecia is asymptomatic. D) Leprosy: Leprosy is anesthetic. E) Impetigo: Impetigo is crusted.","Night itch."],"im":[],"src":"Q255"},{"id":"K145","ch":"⭐ Key Ideas — each idea once","q":"Scabies: what is the causative parasite, and what is the primary lesion?","o":[],"a":null,"sa":"Sarcoptes scabiei (fertilized female mite); the primary lesion is the burrow.","pg":null,"f":[],"n":145,"e":["Scabies is caused by the fertilized female Sarcoptes scabiei mite whose primary lesion is the burrow.","Burrow."],"im":[],"src":"Q258"},{"id":"K146","ch":"⭐ Key Ideas — each idea once","q":"Sites of predilection of scabietic burrows in adults include all of the following EXCEPT","o":[["A","In-between fingers & wrist area"],["B","Medial sides of forearms"],["C","Anterior axillary folds & lower abdomen"],["D","Breast in females & genitalia in males"],["E","Upper back"]],"a":"E","sa":null,"pg":"43","f":[],"n":146,"e":["Scabies involves finger sides and webs, wrists, elbows, axillae, waist, buttocks, genitalia and feet, but spares the head, neck, upper back, palms and soles in adults. Why the other options are wrong: A) In-between fingers & wrist area: Predilection. B) Medial sides of forearms: Predilection. C) Anterior axillary folds & lower abdomen: Predilection. D) Breast in females & genitalia in males: Predilection.","Upper back spared."],"im":[],"src":"Q262"},{"id":"K147","ch":"⭐ Key Ideas — each idea once","q":"A patient presents with generalized itching at night and burrows in the fingers. The most likely diagnosis is:","o":[["A","Pediculosis"],["B","Scabies"],["C","Urticaria"],["D","Eczema"],["E","Candidiasis"]],"a":"B","sa":null,"pg":"42","f":[],"n":147,"e":["Generalized night itching with burrows on the fingers is scabies; urticaria has wheals and eczema has no burrows. Why the other options are wrong: A) Pediculosis: Pediculosis has nits. C) Urticaria: Urticaria has wheals. D) Eczema: Eczema has no burrows. E) Candidiasis: Candida is red.","Burrows."],"im":[],"src":"Q264"},{"id":"K148","ch":"⭐ Key Ideas — each idea once","q":"The following may help in the diagnosis of scabies","o":[["A","Positive family history"],["B","Night itching"],["C","Distribution of lesions"],["D","All of the above"],["E","None of the above"]],"a":"D","sa":null,"pg":"44","f":[],"n":148,"e":["Scabies is diagnosed on nocturnal pruritus, family history, lesion morphology and distribution, supported by dermoscopy; so all of the above. Why the other options are wrong: A) Positive family history: A family member with itching suggests contagion; true, but B and C are also clues. B) Night itching: Nocturnal itching is a classic clue; true, but A and C are also clues. C) Distribution of lesions: Distribution (finger webs, wrists, genitalia) is a classic clue; true, but A and B are also clues. E) None of the above: Wrong: A, B and C all help.","All clues."],"im":[],"src":"Q265"},{"id":"K149","ch":"⭐ Key Ideas — each idea once","q":"A 4-month-old infant presented with vesicles and pustules affecting his face, palms and soles, associated with a family history of severe itching at night. (Clinical photo: papulovesicular/pustular rash on the face and vesicopustules on the sole.) The most likely diagnosis is","o":[["A","Disseminated candidiasis"],["B","Pediculosis corporis"],["C","Tinea corporis"],["D","Scabies"],["E","Tuberculoid leprosy"]],"a":"D","sa":null,"pg":"44","f":[],"n":149,"e":["The picture of burrows and papules in typical sites with itching and family history is scabies. Why the other options are wrong: A) Disseminated candidiasis: Candidiasis is rare. B) Pediculosis corporis: Corporis is on the body. C) Tinea corporis: Tinea is scaly. E) Tuberculoid leprosy: Leprosy is anesthetic.","Typical scabies."],"im":[],"src":"Q266"},{"id":"K150","ch":"⭐ Key Ideas — each idea once","q":"A 4-month-old infant presented with vesicles and pustules affecting his face, palms and soles, associated with a family history of severe itching at night. (Clinical photo: papulovesicular/pustular rash on the face and vesicopustules on the sole.) This condition is treated by","o":[["A","Radiotherapy"],["B","Topical permethrin"],["C","Topical corticosteroids"],["D","Systemic antifungals"],["E","Systemic isotretinoin"]],"a":"B","sa":null,"pg":"46","f":[],"n":150,"e":["Scabies is treated with topical permethrin 5% (safe for infants over 2 months and pregnancy), applied to the whole skin, repeated after a week, and treating contacts. Why the other options are wrong: A) Radiotherapy: Radiotherapy has no role here; vitiligo is treated by stopping the autoimmune process and stimulating repigmentation (phototherapy, steroids, calcineurin inhibitors). C) Topical corticosteroids: Steroids worsen. D) Systemic antifungals: Antifungals do not treat it. E) Systemic isotretinoin: Isotretinoin is for acne.","Permethrin 5%."],"im":[],"src":"Q267"},{"id":"K151","ch":"⭐ Key Ideas — each idea once","q":"A male with intensely pruritic nodules on the scrotum for 2 months, with a past history of scabies treated with anti-scabietic treatment, is suffering from","o":[["A","Nodular scabies"],["B","Animal scabies"],["C","Phthirus pubis"],["D","Pediculosis corporis"],["E","Lepromatous leprosy"]],"a":"A","sa":null,"pg":"44","f":[],"n":151,"e":["Itchy scrotal nodules after treated scabies are post-scabietic nodular scabies. Why the other options are wrong: B) Animal scabies: Animal scabies has no burrows. C) Phthirus pubis: Phthirus is lice. D) Pediculosis corporis: Corporis is lice. E) Lepromatous leprosy: LL is nodules.","Scrotum."],"im":[],"src":"Q271"},{"id":"K152","ch":"⭐ Key Ideas — each idea once","q":"A 28-year-old male presented with intensely pruritic nodules on the scrotum for 2 months and a past history of scabies. A suitable treatment for such lesions is","o":[["A","Phototherapy"],["B","Radiotherapy"],["C","Electrocautery"],["D","Podophyllin resin"],["E","Intralesional corticosteroids"]],"a":"E","sa":null,"pg":"44","f":[],"n":152,"e":["Post-scabietic nodules are a hypersensitivity reaction that persists for weeks to months after treatment; they are treated with intralesional corticosteroids rather than more scabicide. Why the other options are wrong: A) Phototherapy: Phototherapy is not used for post-scabietic nodules, a hypersensitivity reaction best treated with steroids. B) Radiotherapy: Radiotherapy has no role in post-scabietic nodules. C) Electrocautery: Cautery is not used. D) Podophyllin resin: Podophyllin is for warts.","Intralesional steroid."],"im":[],"src":"Q272"},{"id":"K153","ch":"⭐ Key Ideas — each idea once","q":"Post-scabietic nodules","o":[["A","Represent a hypersensitivity reaction to parasites"],["B","Present commonly on the scrotum"],["C","Cause severe itching"],["D","All of the above"],["E","None of the above"]],"a":"D","sa":null,"pg":"44","f":[],"n":153,"e":["Post-scabietic nodules are a hypersensitivity reaction, common on the scrotum, and itchy; all of the above. Why the other options are wrong: A) Represent a hypersensitivity reaction to…: Nodules are a hypersensitivity reaction to mite antigens. True, but B and C are also true. B) Present commonly on the scrotum: Nodules are commonly on the scrotum. True, but A and C are also true. C) Cause severe itching: Nodules are intensely itchy. True, but A and B are also true. E) None of the above: Wrong: A, B and C are all true.","Hypersensitivity."],"im":[],"src":"Q274"},{"id":"K154","ch":"⭐ Key Ideas — each idea once","q":"Animal scabies is characterized by","o":[["A","Absence of burrows"],["B","Being self-limited and of short duration"],["C","Being more extensive"],["D","All of the above"]],"a":"D","sa":null,"pg":"45","f":[],"n":154,"e":["Animal scabies has a short incubation, no burrows, is self-limited and urticarial. Why the other options are wrong: A) Absence of burrows: Animal mites do not burrow in human skin. True, but B and C are true too. B) Being self-limited and of short duration: It resolves quickly once contact with the animal stops. True, but A and C are true too. C) Being more extensive: It is less extensive.","Pet scabies."],"im":[],"src":"Q276"},{"id":"K155","ch":"⭐ Key Ideas — each idea once","q":"As regards treatment of human scabies","o":[["A","Oral antihelminthics are the treatment of choice"],["B","Gamma benzene hexachloride is a safe topical preparation"],["C","Permethrin is safe in pregnancy"],["D","Topical benzoyl peroxide may be used in treatment"],["E","Crotamiton is the most effective topical application"]],"a":"C","sa":null,"pg":"46","f":[],"n":155,"e":["Permethrin 5% is safe in pregnancy, breast-feeding and infants over 2 months, whereas gamma-hexachlorocyclohexane is contraindicated and oral antihelminthics are not first line. Why the other options are wrong: A) Oral antihelminthics are the treatment o…: Antihelminthics kill intestinal worms, not the scabies mite; permethrin 5% is the first-line scabicide. B) Gamma benzene hexachloride is a safe top…: GBHC is not safe. D) Topical benzoyl peroxide may be used in …: BPO is for acne. E) Crotamiton is the most effective topical…: Permethrin is more effective.","Permethrin safe."],"im":[],"src":"Q277"},{"id":"K156","ch":"⭐ Key Ideas — each idea once","q":"As regards treatment of scabies","o":[["A","Oral antihelminthics are the treatment of choice"],["B","Gamma benzene hexachloride is a safe topical preparation"],["C","All family members should be treated"],["D","Topical benzoyl peroxide may be used in treatment"],["E","Crotamiton is the most effective topical application"]],"a":"C","sa":null,"pg":"45","f":[],"n":156,"e":["Treatment should include the patient and all close contacts, even if they have no itching, because early cases may be asymptomatic carriers. Why the other options are wrong: A) Oral antihelminthics are the treatment o…: Antihelminthics kill intestinal worms, not the scabies mite; permethrin 5% is the first-line scabicide. B) Gamma benzene hexachloride is a safe top…: GBHC is not safe. D) Topical benzoyl peroxide may be used in …: BPO is for acne. E) Crotamiton is the most effective topical…: Permethrin is more effective.","Treat contacts."],"im":[],"src":"Q278"},{"id":"K157","ch":"⭐ Key Ideas — each idea once","q":"The following is used for the treatment of scabies","o":[["A","Benzyl benzoate"],["B","Benzoyl peroxide"],["C","Dapsone"],["D","Tetracyclines"],["E","Psoralen"]],"a":"A","sa":null,"pg":"46","f":[],"n":157,"e":["Benzyl benzoate (10-25%) is an acaricide used for scabies, along with permethrin, sulphur, crotamiton and ivermectin. Why the other options are wrong: B) Benzoyl peroxide: BPO is for acne. C) Dapsone: Dapsone is for leprosy. D) Tetracyclines: Tetracyclines are antibacterial. E) Psoralen: Psoralen is PUVA.","Benzyl benzoate."],"im":[],"src":"Q280"},{"id":"K158","ch":"⭐ Key Ideas — each idea once","q":"Pediculosis capitis","o":[["A","Is transmitted by hats"],["B","Is treated by acyclovir"],["C","Does not present with pruritus"],["D","Can affect the pubic area"],["E","None of the above"]],"a":"A","sa":null,"pg":"48","f":[],"n":158,"e":["Head lice spread by head-to-head contact and indirectly via combs, brushes, hats and helmets. Why the other options are wrong: B) Is treated by acyclovir: Acyclovir is antiviral. C) Does not present with pruritus: It is itchy. D) Can affect the pubic area: That is pubic lice. E) None of the above: Wrong: at least one of the listed statements is correct.","Hats."],"im":[],"src":"Q283"},{"id":"K159","ch":"⭐ Key Ideas — each idea once","q":"The following is characteristic of pediculosis capitis","o":[["A","White patches"],["B","Flat-topped papules"],["C","Nocturnal itching"],["D","Nits cemented to the hairs"],["E","Painful nodules"]],"a":"D","sa":null,"pg":"49","f":[],"n":159,"e":["Nits are eggs cemented to the hair shaft near the scalp, which distinguishes them from dandruff; this is characteristic of head lice. Why the other options are wrong: A) White patches: White patches are vitiligo. B) Flat-topped papules: Flat papules are LP. C) Nocturnal itching: Nocturnal itch is scabies. E) Painful nodules: Pediculosis gives itchy papules and excoriations, not painful nodules; the diagnostic sign is nits cemented to the hairs.","Cemented nits."],"im":[],"src":"Q285"},{"id":"K160","ch":"⭐ Key Ideas — each idea once","q":"Pediculosis capitis is treated by topical:","o":[["A","Acyclovir"],["B","Corticosteroids"],["C","Retinoids"],["D","Permethrin"],["E","Azoles"]],"a":"D","sa":null,"pg":"51","f":[],"n":160,"e":["Pediculosis capitis is treated with topical permethrin 5% (or malathion, dimethicone), repeated after a week since eggs are not killed. Why the other options are wrong: A) Acyclovir: Acyclovir is antiviral. B) Corticosteroids: Steroids do not kill lice. C) Retinoids: Retinoids are for acne. E) Azoles: Azoles are antifungal.","Permethrin."],"im":[],"src":"Q286"},{"id":"K161","ch":"⭐ Key Ideas — each idea once","q":"The following is used for treatment of pediculosis capitis","o":[["A","Topical steroids"],["B","Malathion 0.5% lotion"],["C","Ketoconazole cream"],["D","Topical vitamin D"],["E","Emollients"]],"a":"B","sa":null,"pg":"51","f":[],"n":161,"e":["Malathion 0.5% lotion is used for head lice in children over 6 years and in pregnancy. Why the other options are wrong: A) Topical steroids: Steroids do not kill lice. C) Ketoconazole cream: Ketoconazole is antifungal. D) Topical vitamin D: Vitamin D is for psoriasis. E) Emollients: Emollients do not kill lice.","Malathion."],"im":[],"src":"Q287"},{"id":"K162","ch":"⭐ Key Ideas — each idea once","q":"A child with pruritic scalp, excoriations and firmly attached nits. The following is a good treatment option:","o":[["A","Oral griseofulvin"],["B","Podophyllin resin 10-25%"],["C","Oral nystatin"],["D","Topical selenium sulphide"],["E","Topical ivermectin 0.5%"]],"a":"E","sa":null,"pg":"51","f":[],"n":162,"e":["Pruritic scalp with firmly attached nits is head lice; topical ivermectin 0.5% is a treatment option. Griseofulvin and nystatin are antifungals, and podophyllin is for warts. Why the other options are wrong: A) Oral griseofulvin: Griseofulvin is antifungal. B) Podophyllin resin 10-25%: Podophyllin is for warts. C) Oral nystatin: Nystatin is antifungal. D) Topical selenium sulphide: Selenium is for versicolor.","Ivermectin 0.5%."],"im":[],"src":"Q288"},{"id":"K163","ch":"⭐ Key Ideas — each idea once","q":"Phthirus pubis","o":[["A","Is not itchy"],["B","May be sexually transmitted"],["C","Is treated by terbinafine"],["D","Involves the scalp and back"],["E","Is a protozoal infection"]],"a":"B","sa":null,"pg":"48","f":[],"n":163,"e":["Phthirus pubis (pubic louse) spreads by close physical contact and sexual contact in young adults. Why the other options are wrong: A) Is not itchy: Pediculosis pubis causes marked itching. C) Is treated by terbinafine: Terbinafine is antifungal. D) Involves the scalp and back: It involves the pubis. E) Is a protozoal infection: It is an insect.","Sexually transmissible."],"im":[],"src":"Q289"},{"id":"K164","ch":"⭐ Key Ideas — each idea once","q":"Lice infestation of the eyelashes is caused by:","o":[["A","Pediculus humanus corporis"],["B","Pediculus humanus capitis"],["C","Phthirus pubis"],["D","Sarcoptes scabiei"],["E","Demodex folliculorum"]],"a":"C","sa":null,"pg":"49","f":[],"n":164,"e":["Pubic lice (Phthirus pubis) can infest the eyelashes, along with the pubic area, lower abdomen and thighs. Why the other options are wrong: A) Pediculus humanus corporis: Corporis is body lice. B) Pediculus humanus capitis: Capitis is scalp. D) Sarcoptes scabiei: Sarcoptes scabiei is the scabies mite. E) Demodex folliculorum: Demodex folliculorum is a follicular mite of the face, not a louse.","Eyelash lice."],"im":[],"src":"Q290"},{"id":"K165","ch":"⭐ Key Ideas — each idea once","q":"Pediculosis capitis may be treated by:","o":[["A","3% acetic acid."],["B","Gamma benzene hexachloride."],["C","Permethrin."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":165,"e":["Head lice may be treated with acetic acid, gamma benzene hexachloride or permethrin. Why the other options are wrong: A) 3% acetic acid: 3% acetic acid helps loosen nits; true, but B and C are also used. B) Gamma benzene hexachloride: Gamma benzene hexachloride is a pediculicide; true, but A and C are also used. C) Permethrin: Permethrin is a first-line pediculicide; true, but A and B are also used. E) None of the above: Wrong: A, B and C are all used.","All of the above."],"im":[],"src":"H168"},{"id":"K166","ch":"⭐ Key Ideas — each idea once","q":"All are true about psoriasis EXCEPT","o":[["A","Nail changes could occur"],["B","Has an extensor distribution"],["C","Occurs in children"],["D","Is a contagious disease"],["E","Could be associated with arthritis"]],"a":"D","sa":null,"pg":"52","f":[],"n":166,"e":["Psoriasis is a chronic immune-mediated (T-cell) disease with genetic susceptibility, so it cannot be passed from person to person. Everything else listed (nail changes, extensor distribution, childhood onset, arthritis) is true of it. Why the other options are wrong: A) Nail changes could occur: True: pitting, onycholysis. B) Has an extensor distribution: True: elbows and knees. C) Occurs in children: True: can start in childhood. E) Could be associated with arthritis: True: psoriatic arthritis.","Psoriasis = immune-mediated, never contagious. Auspitz sign, Koebner phenomenon, nail pitting."],"im":[],"src":"Q292"},{"id":"K167","ch":"⭐ Key Ideas — each idea once","q":"A patient presented with well-demarcated erythematous plaques covered by silvery scales on the extensor elbows and knees with positive Auspitz sign. In this disease:","o":[["A","The rate of cell division in the basal layer is decreased."],["B","The epidermal renewal process becomes slower."],["C","The time required for epidermal cell turnover is increased."],["D","The epidermal turnover time is about 7 days."],["E","The epidermal turnover time is about 28 days."]],"a":"D","sa":null,"pg":"52","f":[],"n":167,"e":["Well-demarcated silvery plaques on elbows and knees with a positive Auspitz sign describe psoriasis. The key points are an increased rate of basal cell division and a shortened epidermal turnover of about 7 days (28 days is normal), so the options saying 'decreased' or 'slower' are wrong. Why the other options are wrong: A) The rate of cell division in the basal l…: Division is increased. B) The epidermal renewal process becomes sl…: Renewal is faster. C) The time required for epidermal cell tur…: Time is decreased. E) The epidermal turnover time is about 28…: 28 days is normal.","Psoriasis = fast turnover (7 days)."],"im":[],"src":"Q295"},{"id":"K168","ch":"⭐ Key Ideas — each idea once","q":"All of the following is true about psoriasis except","o":[["A","It is a disorder of keratinization"],["B","It gets more severe in summer than in winter"],["C","Its primary lesion is a papule"],["D","Psoriasis vulgaris is its most common type"],["E","It is characterized by Koebner phenomenon"]],"a":"B","sa":null,"pg":"52","f":[],"n":168,"e":["Psoriasis improves with ultraviolet exposure, so it flares in winter and in covered body parts, and is commoner in Scandinavian countries than the tropics. The statement that it worsens in summer is the false one. It is a papule-based disease and Koebner phenomenon is typical. Why the other options are wrong: A) It is a disorder of keratinization: Psoriasis is epidermal hyperproliferation with abnormal keratinization. C) Its primary lesion is a papule: The primary lesion is a papule that coalesces into plaques. D) Psoriasis vulgaris is its most common ty…: Plaque psoriasis (vulgaris) is the most common type. E) It is characterized by Koebner phenomenon: Koebner phenomenon: new lesions at sites of trauma.","Sun helps psoriasis: worse in winter."],"im":[],"src":"Q296"},{"id":"K169","ch":"⭐ Key Ideas — each idea once","q":"Koebner's phenomenon is seen in which diseases?","o":[],"a":null,"sa":"Psoriasis, lichen planus, vitiligo and plane (flat) warts","pg":"52","f":[],"n":169,"e":["Koebner phenomenon means new lesions appear on previously normal skin after trauma. The book lists it in psoriasis, lichen planus, vitiligo and flat (plane) warts.","Koebner: psoriasis, lichen planus, vitiligo, plane warts."],"im":[],"src":"Q297"},{"id":"K170","ch":"⭐ Key Ideas — each idea once","q":"Auspitz sign is elicited in","o":[["A","Psoriasis."],["B","Lichen planus."],["C","Discoid LE."],["D","Discoid eczema."],["E","Seborrheic dermatitis."]],"a":"A","sa":null,"pg":"53","f":[],"n":170,"e":["Scraping the scales off a psoriatic plaque leaves pinpoint bleeding points (Auspitz sign) because the dermal papillae are thin-capped and engorged. Lichen planus shows Wickham striae and DLE shows follicular plugging instead. Why the other options are wrong: B) Lichen planus: LP has Wickham striae. C) Discoid LE: DLE has follicular plugs. D) Discoid eczema: Eczema oozes. E) Seborrheic dermatitis: Seb derm is greasy.","Auspitz = psoriasis; Wickham = lichen planus."],"im":[],"src":"Q299"},{"id":"K171","ch":"⭐ Key Ideas — each idea once","q":"The characteristic clinical picture of psoriasis is","o":[["A","Erythematous papules & plaques covered by silvery scales"],["B","Erythematous macules covered by silvery scales"],["C","Erythematous nodules covered by silvery scales"],["D","Pruritic erythematous patches"],["E","Pruritic polyangular papules"]],"a":"A","sa":null,"pg":"53","f":[],"n":171,"e":["The classic picture is bilateral, symmetrical well-defined erythematous papules and plaques covered by shiny silvery dry scales with a polycyclic outline, mainly on extensors, scalp and lumbosacral area. Why the other options are wrong: B) Erythematous macules covered by silvery…: Lesions are papules and plaques. C) Erythematous nodules covered by silvery…: It does not form nodules. D) Pruritic erythematous patches: Patches are not characteristic. E) Pruritic polyangular papules: That is lichen planus.","Silvery scales on extensors."],"im":[],"src":"Q303"},{"id":"K172","ch":"⭐ Key Ideas — each idea once","q":"Psoriasis may be manifested clinically by all of the following EXCEPT","o":[["A","Erythroderma."],["B","Pustular lesions."],["C","Arthropathy."],["D","Flexural lesions."],["E","Bullous lesions."]],"a":"E","sa":null,"pg":"54","f":[],"n":172,"e":["Psoriasis has several forms: erythrodermic, pustular, flexural, nail and arthritic. Bullous lesions are not part of the psoriasis spectrum, so that option is the exception. Why the other options are wrong: A) Erythroderma: It occurs. B) Pustular lesions: It occurs. C) Arthropathy: It occurs. D) Flexural lesions: It occurs.","Types: plaque, flexural, nail, erythrodermic, pustular, arthritic. Never bullous."],"im":[],"src":"Q307"},{"id":"K173","ch":"⭐ Key Ideas — each idea once","q":"Sterile pustules are characteristic of","o":[["A","Folliculitis."],["B","Pustular psoriasis."],["C","Sycosis barbae."],["D","Nodulocystic acne."],["E","None of the above."]],"a":"B","sa":null,"pg":"52","f":[],"n":173,"e":["Pustular psoriasis shows sterile pustules (no bacteria) on an erythematous base; hypocalcemia can precipitate it. Pustules in bacterial folliculitis or impetigo are infected. Why the other options are wrong: A) Folliculitis: Folliculitis is infected. C) Sycosis barbae: Sycosis is infected. D) Nodulocystic acne: Nodulocystic acne is infected. E) None of the above: Wrong: at least one listed statement is correct.","Sterile pustules = pustular psoriasis."],"im":[],"src":"Q309"},{"id":"K174","ch":"⭐ Key Ideas — each idea once","q":"Which of the following is NOT a recognized clinical type of psoriasis?","o":[["A","Plaque psoriasis."],["B","Guttate psoriasis."],["C","Erythrodermic psoriasis."],["D","Ulcerative psoriasis."],["E","Pustular psoriasis."]],"a":"D","sa":null,"pg":"54","f":[],"n":174,"e":["Recognised forms are plaque (vulgaris), flexural, nail, erythrodermic, pustular and psoriatic arthritis; guttate is also described. There is no 'ulcerative psoriasis'. Why the other options are wrong: A) Plaque psoriasis: Recognized. B) Guttate psoriasis: Recognized. C) Erythrodermic psoriasis: Recognized. E) Pustular psoriasis: Recognized.","No ulcerative psoriasis."],"im":[],"src":"Q310"},{"id":"K175","ch":"⭐ Key Ideas — each idea once","q":"Erythroderma may occur in","o":[["A","Alopecia."],["B","Vitiligo."],["C","Psoriasis."],["D","Acne vulgaris."],["E","Pityriasis rosea."]],"a":"C","sa":null,"pg":"54","f":[],"n":175,"e":["Psoriasis, especially when irritated by strong topicals or stopped steroids, may spread to involve the whole skin surface as erythrodermic psoriasis. The question asks which disease can present with erythroderma. Why the other options are wrong: A) Alopecia: Alopecia is hair loss. B) Vitiligo: Vitiligo spares the epidermis. D) Acne vulgaris: Acne is limited. E) Pityriasis rosea: PR is self-limited.","Erythroderma can complicate psoriasis."],"im":[],"src":"Q311"},{"id":"K176","ch":"⭐ Key Ideas — each idea once","q":"The following disease may involve the joints","o":[["A","Lichen planus."],["B","Pityriasis rosea."],["C","Psoriasis."],["D","Vitiligo."],["E","Seborrheic eczema."]],"a":"C","sa":null,"pg":"55","f":[],"n":176,"e":["Psoriasis can involve the joints (psoriatic arthritis), listed in the book among the clinical types. Scabies, tinea and impetigo do not affect joints. Why the other options are wrong: A) Lichen planus: LP spares joints. B) Pityriasis rosea: PR spares joints. D) Vitiligo: Vitiligo spares joints. E) Seborrheic eczema: Seb eczema spares joints.","Psoriasis + arthritis; also nail pitting."],"im":[],"src":"Q312"},{"id":"K177","ch":"⭐ Key Ideas — each idea once","q":"Topical treatment of psoriasis includes","o":[["A","Calcipotriol and coal tar."],["B","Acyclovir and garamycin."],["C","Antiseptic lotions."],["D","Terbinafine."],["E","Gamma benzene hexachloride."]],"a":"A","sa":null,"pg":"56","f":[],"n":177,"e":["Topical psoriasis drugs include keratolytics (salicylic acid), moisturizers, steroids, calcipotriol (vitamin D analogue), coal tar and anthralin. Antivirals, antifungals and antiseptic lotions are not part of the list. Why the other options are wrong: B) Acyclovir and garamycin: Acyclovir and garamycin treat infection. C) Antiseptic lotions: Antiseptics do not treat psoriasis. D) Terbinafine: Terbinafine is antifungal. E) Gamma benzene hexachloride: GBHC is for scabies.","Topical: calcipotriol, tar, anthralin, steroids."],"im":[],"src":"Q313"},{"id":"K178","ch":"⭐ Key Ideas — each idea once","q":"All of the following can be used in the treatment of psoriasis EXCEPT","o":[["A","Retinoids."],["B","Cyclosporine."],["C","Doxycycline."],["D","Calcipotriol."],["E","Phototherapy."]],"a":"C","sa":null,"pg":"56","f":[],"n":178,"e":["Retinoids (acitretin), cyclosporine, calcipotriol and phototherapy all treat psoriasis. Doxycycline is an antibiotic with no role in it. Why the other options are wrong: A) Retinoids: Systemic retinoids (acitretin) are used. B) Cyclosporine: Cyclosporine is an immunosuppressant for severe psoriasis. D) Calcipotriol: Calcipotriol (vitamin D analogue) is a first-line topical. E) Phototherapy: Phototherapy (narrow-band UVB, PUVA) is used.","Systemic: methotrexate, acitretin, cyclosporine, PUVA."],"im":[],"src":"Q314"},{"id":"K179","ch":"⭐ Key Ideas — each idea once","q":"Systemic treatment of psoriasis includes :","o":[["A","Tetracyclines."],["B","Methotrexate."],["C","Acyclovir."],["D","Itraconazole."],["E","Antimalarials."]],"a":"B","sa":null,"pg":"56","f":[],"n":179,"e":["Systemic therapy for extensive plaque, pustular, erythrodermic or arthritic psoriasis includes methotrexate, acitretin, cyclosporine and PUVA. Tetracyclines, acyclovir and itraconazole treat infections. Why the other options are wrong: A) Tetracyclines: Tetracyclines are antibacterial. C) Acyclovir: Acyclovir is antiviral. D) Itraconazole: Itraconazole is antifungal. E) Antimalarials: Antimalarials may worsen psoriasis.","Methotrexate = systemic psoriasis drug."],"im":[],"src":"Q315"},{"id":"K180","ch":"⭐ Key Ideas — each idea once","q":"Photochemotherapy is used to treat","o":[["A","Psoriasis."],["B","Pediculosis capitis"],["C","Tinea capitis."],["D","Tinea cruris."],["E","Discoid lupus."]],"a":"A","sa":null,"pg":"56","f":[],"n":180,"e":["Photochemotherapy (PUVA = psoralen + UVA) is used for psoriasis, along with narrow-band UVB. It is not used for DLE, which is photosensitive. Why the other options are wrong: B) Pediculosis capitis: Lice need insecticides. C) Tinea capitis: Tinea needs antifungals. D) Tinea cruris: Tinea needs antifungals. E) Discoid lupus: DLE is photosensitive.","PUVA: psoriasis, vitiligo; not DLE."],"im":[],"src":"Q319"},{"id":"K181","ch":"⭐ Key Ideas — each idea once","q":"Lichen planus is an inflammatory pruritic disease which involves","o":[["A","Mucous membranes."],["B","Skin."],["C","Hair follicles."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"57","f":[],"n":181,"e":["Lichen planus is a pruritic immune-mediated disease that affects skin, mucous membranes, hair and nails, so all options are correct. Why the other options are wrong: A) Mucous membranes: Oral lesions (white reticulate streaks) occur. True, but B and C are also involved. B) Skin: Skin shows violaceous flat-topped polygonal papules. True, but A and C are also involved. C) Hair follicles: Hair follicles are involved (lichen planopilaris, scarring alopecia). True, but A and B are also involved. E) None of the above: Wrong: A, B and C are all involved.","LP: skin, mucosa, hair, nails."],"im":[],"src":"Q320"},{"id":"K182","ch":"⭐ Key Ideas — each idea once","q":"Lichen planus (including hypertrophic LP) may be associated with which viral infection?","o":[],"a":null,"sa":"Hepatitis C virus","pg":"57","f":[],"n":182,"e":["Hepatitis C virus infection is associated with lichen planus, so hepatic work-up is sensible. Hair fall and vitamin/iron deficiency are other clues listed in the introduction.","LP ↔ hepatitis C."],"im":[],"src":"Q322"},{"id":"K183","ch":"⭐ Key Ideas — each idea once","q":"Well-defined flat-topped, polyangular, violaceous, itchy papules are the primary lesions of","o":[["A","Vitiligo."],["B","Lupus erythematosus."],["C","Lichen planus."],["D","Psoriasis."],["E","None of the above."]],"a":"C","sa":null,"pg":"57","f":[],"n":183,"e":["Flat-topped, polyangular, violaceous, itchy papules define lichen planus. Psoriasis papules are scaly red and DLE plaques are atrophic. Why the other options are wrong: A) Vitiligo: Vitiligo has macules. B) Lupus erythematosus: Lupus has atrophic plaques. D) Psoriasis: Psoriasis is scaly. E) None of the above: Wrong: at least one listed statement is correct.","Purple, polygonal, itchy, planar papules."],"im":[],"src":"Q323"},{"id":"K184","ch":"⭐ Key Ideas — each idea once","q":"Lichen planus heals leaving","o":[["A","Pain & paresthesia."],["B","Post-inflammatory hypopigmentation."],["C","Post-inflammatory hyperpigmentation."],["D","Keloids."],["E","Telangiectasia."]],"a":"C","sa":null,"pg":"58","f":[],"n":184,"e":["Lichen planus heals leaving dark post-inflammatory hyperpigmentation, not hypopigmentation, scars or keloids (except in hypertrophic/scalp types). Why the other options are wrong: A) Pain & paresthesia: Pain and paresthesia suggest neuropathy or zoster; LP is itchy. B) Post-inflammatory hypopigmentation: It darkens, not lightens. D) Keloids: LP does not form keloids; it leaves dark macules. E) Telangiectasia: Telangiectasia is typical of atrophic diseases such as DLE, not LP.","LP → hyperpigmentation."],"im":[],"src":"Q326"},{"id":"K185","ch":"⭐ Key Ideas — each idea once","q":"Koebner's phenomenon is present in :","o":[["A","Psoriasis."],["B","Lichen planus."],["C","Plane warts."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"58","f":[],"n":185,"e":["Koebner phenomenon occurs in psoriasis, lichen planus and vitiligo, so all of the above is correct. Why the other options are wrong: A) Psoriasis: Koebner phenomenon occurs in psoriasis. True, but B and C also show it. B) Lichen planus: It occurs in lichen planus. True, but A and C also show it. C) Plane warts: It occurs in plane warts. True, but A and B also show it. E) None of the above: Wrong: A, B and C all show it.","Koebner: PLP-V."],"im":[],"src":"Q328"},{"id":"K186","ch":"⭐ Key Ideas — each idea once","q":"In lichen planus, squamous cell carcinoma may complicate","o":[["A","Oral ulcerative lesions."],["B","Hypertrophic lesions."],["C","Nail lesions."],["D","Actinic lesions."],["E","Scalp lesions."]],"a":"A","sa":null,"pg":"59","f":[],"n":186,"e":["Chronic ulcerative (erosive) oral lesions of LP are resistant to treatment and may become squamous cell carcinoma. Skin lesions do not. Why the other options are wrong: B) Hypertrophic lesions: Hypertrophic lesions rarely transform. C) Nail lesions: Nails do not transform. D) Actinic lesions: Actinic does not transform. E) Scalp lesions: Scalp scars.","Oral erosive LP → SCC."],"im":[],"src":"Q330"},{"id":"K187","ch":"⭐ Key Ideas — each idea once","q":"Wickham striae are seen in:","o":[["A","Pityriasis rosea."],["B","Scabies."],["C","Lichen planus."],["D","Verrucae."],["E","Erythema multiforme."]],"a":"C","sa":null,"pg":"59","f":[],"n":187,"e":["Wickham striae are the fine white reticular lines on lichen planus papules and oral mucosa. They are not seen in pityriasis rosea, scabies or warts. Why the other options are wrong: A) Pityriasis rosea: PR has collarette. B) Scabies: Scabies has burrows. D) Verrucae: Warts are rough. E) Erythema multiforme: EM has targets.","Wickham = LP."],"im":[],"src":"Q331"},{"id":"K188","ch":"⭐ Key Ideas — each idea once","q":"Regarding lichen planus, the following is TRUE","o":[["A","It is a contagious disease."],["B","The primary lesion is a pearly white umbilicated papule."],["C","It never affects the oral mucosa."],["D","It can lead to cicatricial alopecia."],["E","It is due to HHV-7."]],"a":"D","sa":null,"pg":"90","f":[],"n":188,"e":["LP affecting the scalp destroys follicles and ends in scarring (cicatricial) alopecia. It is not contagious, and its papule is flat-topped violaceous, not pearly umbilicated (that is molluscum). Why the other options are wrong: A) It is a contagious disease: It is not contagious. B) The primary lesion is a pearly white umb…: That is molluscum. C) It never affects the oral mucosa: It can affect the mouth. E) It is due to HHV-7: It is not viral.","LP can scar the scalp."],"im":[],"src":"Q335"},{"id":"K189","ch":"⭐ Key Ideas — each idea once","q":"Actinic lichen planus usually affects","o":[["A","Mucous membranes."],["B","Genitals."],["C","Upper back."],["D","Face."],["E","None of the above."]],"a":"D","sa":null,"pg":"57","f":[],"n":189,"e":["Actinic LP (lichen planus tropicus) appears on sun-exposed areas such as the face and dorsum of the hands. Why the other options are wrong: A) Mucous membranes: Mucosa is classic LP. B) Genitals: Genitals are classic LP. C) Upper back: Upper back is covered. E) None of the above: None applies, since the face is the usual site.","Face = actinic LP."],"im":[],"src":"Q336"},{"id":"K190","ch":"⭐ Key Ideas — each idea once","q":"A female patient, 38 years old, presented with papules that developed on both her forearms and wrists. The condition started about five years ago with a gradual onset and a progressive course. She had severe itching. (Clinical photo: multiple violaceous flat-topped papules and plaques on both forearms and wrists - lichen planus.) Best treatment option is","o":[["A","Radiotherapy."],["B","Oral ivermectin."],["C","Topical potassium permanganate 1/8000."],["D","Oral terbinafine."],["E","Topical corticosteroids."]],"a":"E","sa":null,"pg":"62","f":[],"n":190,"e":["A few itchy lichen planus papules on the forearms are treated with topical corticosteroids, the first-line therapy for localized disease. Why the other options are wrong: A) Radiotherapy: Radiotherapy is not used. B) Oral ivermectin: Ivermectin is antiparasitic. C) Topical potassium permanganate 1/8000: Permanganate dries oozing. D) Oral terbinafine: Terbinafine is antifungal.","Topical steroids."],"im":[],"src":"Q337"},{"id":"K191","ch":"⭐ Key Ideas — each idea once","q":"A patient presented with papules on both forearms and wrists. The condition started about five years ago with a gradual onset and a progressive course, with severe itching. (Clinical photo: violaceous flat-topped papules and plaques on both forearms and wrists - lichen planus.) Best treatment option is","o":[["A","Radiotherapy."],["B","Oral ivermectin."],["C","Topical potassium permanganate 1/8000."],["D","Topical terbinafine."],["E","Oral corticosteroids."]],"a":"E","sa":null,"pg":"62","f":[],"n":191,"e":["Extensive or severe LP needs oral corticosteroids, with sedating antihistamines for itch. Why the other options are wrong: A) Radiotherapy: Radiotherapy is not used. B) Oral ivermectin: Ivermectin is antiparasitic. C) Topical potassium permanganate 1/8000: Permanganate dries oozing. D) Topical terbinafine: Terbinafine is antifungal.","Generalized LP → systemic steroids."],"im":[],"src":"Q338"},{"id":"K192","ch":"⭐ Key Ideas — each idea once","q":"Treatment of choice for actinic lichen planus is","o":[["A","Allylamines."],["B"
