racterized by good immunity."]],"a":"D","sa":null,"pg":"19","f":[],"n":18,"e":["Lepromatous leprosy has poor immunity and numerous bacilli, so mucous membranes (nasal mucosa → epistaxis, septal destruction), eyes, kidneys, liver, bones and testes can be involved. Tuberculoid leprosy involves skin and nerves only. It is bacterial. Bacilli are numerous. Nerve is late. Immunity is poor.\nLL: mucosa + viscera.",""],"im":[]},{"id":"Q117","ch":"Mycobacterial Infections","q":"All of the following are features of lepromatous leprosy EXCEPT","o":[["A","Nerves are involved early."],["B","Runs a chronic course."],["C","Shows negative lepromin test."],["D","Viscera are involved."],["E","It is multibacillary."]],"a":"A","sa":null,"pg":"18","f":[],"n":19,"e":["In lepromatous leprosy nerve involvement is late, not early; the other features are true. Lepromatous leprosy is chronic. Lepromin is negative in lepromatous leprosy (poor cell-mediated immunity). Viscera are involved in lepromatous leprosy. It is multibacillary.\nLL: late nerve; TT: early nerve.",""],"im":[]},{"id":"Q118","ch":"Mycobacterial Infections","q":"The following is a feature of lepromatous leprosy","o":[["A","Good immunity."],["B","Early anesthesia."],["C","Positive lepromin test."],["D","Epistaxis."],["E","Few bacilli in the lesion."]],"a":"D","sa":null,"pg":"19","f":[],"n":20,"e":["Nasal mucosal infiltration in lepromatous leprosy causes epistaxis and may destroy the nasal septum. This is not a feature of tuberculoid leprosy. Immunity is poor. Anesthesia is late. Lepromin is negative. Bacilli are many.\nEpistaxis = LL.",""],"im":[]},{"id":"Q119","ch":"Mycobacterial Infections","q":"Which of the following is a feature of lepromatous leprosy?","o":[["A","Few anesthetic hairless patches."],["B","Symmetrical widespread nodules and thickened nodular ears."],["C","Rapid healing without deformity."],["D","Only mucosal involvement."],["E","Nerve sensation is impaired early."]],"a":"B","sa":null,"pg":"19","f":[],"n":21,"e":["Lepromatous leprosy presents with symmetrical widespread nodules and thickened nodular ears. That is TT. Deformity is chronic. Skin is involved too. Nerve is late.\nNodular ears = LL.",""],"im":[]},{"id":"Q120","ch":"Mycobacterial Infections","q":"The following features belong to lepromatous leprosy","o":[["A","Hypopigmented macules."],["B","Maculoanaesthetic patches."],["C","Strongly positive lepromin test."],["D","Leonine facies."],["E","Bacteriology shows a paucity of bacilli."]],"a":"D","sa":null,"pg":"19","f":[],"n":22,"e":["Leonine facies is due to diffuse infiltration and nodules of the face in lepromatous leprosy. That is TT. That is TT. Lepromin is negative. Bacilli are many.\nLion face.",""],"im":[]},{"id":"Q121","ch":"Mycobacterial Infections","q":"Leonine facies may occur in","o":[["A","Tuberculoid leprosy."],["B","Indeterminate leprosy."],["C","Lepromatous leprosy."],["D","Borderline leprosy."],["E","None of the above."]],"a":"C","sa":null,"pg":"19","f":[],"n":23,"e":["Progressive facial infiltration deepens the natural lines and gives leonine (lion-like) facies, with loss of the outer third of eyebrows. It is a hallmark of lepromatous leprosy. TT is localized. Indeterminate is early. Borderline is variable. LL has it.\nLeonine facies = LL.",""],"im":[]},{"id":"Q122","ch":"Mycobacterial Infections","q":"In lepromatous leprosy","o":[["A","Lesions are few in number."],["B","Penicillin is the backbone of treatment."],["C","Anesthesia is late & extensive on cold areas."],["D","Organisms are rarely found in skin smears."],["E","Internal organs are not involved."]],"a":"C","sa":null,"pg":"18","f":[],"n":24,"e":["Anesthesia appears late and is extensive (glove and stocking, cold areas) in lepromatous leprosy. Lesions are numerous. Dapsone is the backbone. Bacilli are many. Organs are involved.\nLL: late anesthesia.",""],"im":[]},{"id":"Q123","ch":"Mycobacterial Infections","q":"In lepromatous leprosy, immunity is ___ and the face appears as ___.","o":[],"a":null,"sa":"Immunity is bad (least effective immune response); leonine (lion) facies.","pg":"19","f":[],"n":25,"e":["Lepromatous leprosy has poor immunity and the face appears leonine (lion-like).\nPoor immunity, leonine facies.",""],"im":[]},{"id":"Q124","ch":"Mycobacterial Infections","q":"Leprosy is treated by","o":[["A","Dapsone."],["B","Retinoids."],["C","Methotrexate."],["D","Cyclosporine."],["E","Azathioprine."]],"a":"A","sa":null,"pg":"20","f":[],"n":26,"e":["Dapsone is part of the WHO multidrug therapy for leprosy (with rifampicin ± clofazimine) and is taken daily. Retinoids, methotrexate and tetracyclines are not anti-leprosy drugs. Retinoids are for acne. Methotrexate is for psoriasis. Cyclosporine is immunosuppressive. Azathioprine is immunosuppressive.\nMDT: rifampicin + dapsone ± clofazimine.",""],"im":[]},{"id":"Q125","ch":"Mycobacterial Infections","q":"The backbone treatment of leprosy is","o":[["A","Azithromycin."],["B","Tetracycline."],["C","Colchicine."],["D","Steroids."],["E","Dapsone."]],"a":"E","sa":null,"pg":"20","f":[],"n":27,"e":["Dapsone, taken daily for at least 6 months (paucibacillary) or 12 months (multibacillary), is the backbone drug, combined with rifampicin and clofazimine to avoid resistance. Azithromycin is not first line. Tetracycline is not first line. Colchicine is for gout. Steroids treat reactions.\nDapsone backbone.",""],"im":[]},{"id":"H051","ch":"Mycobacterial Infections","q":"In lepromatous leprosy:","o":[["A","Lesions are few in number."],["B","Lepromin test is positive."],["C","Anesthesia is late and extensive on cold areas."],["D","Organisms are rarely found in skin smears."],["E","None of the above."]],"a":"C","sa":null,"pg":null,"f":[],"n":28,"e":["In lepromatous leprosy sensory loss appears late but becomes extensive (glove and stocking), because bacilli accumulate in nerves slowly. In tuberculoid leprosy it is early and localized. Lesions are numerous. Lepromin is negative. Bacilli are many. Wrong: at least one listed statement is correct.\nLL: late anesthesia.",""],"im":[]},{"id":"H053","ch":"Mycobacterial Infections","q":"In leprosy:","o":[["A","It is a stable disease."],["B","Keratinocytes are the target cells for the bacilli."],["C","Dapsone is the backbone of treatment of all types of leprosy."],["D","Leprosy is an autoimmune disease."],["E","Lepromin test is reliable in the diagnosis."]],"a":"C","sa":null,"pg":null,"f":[],"n":29,"e":["Per the book, dapsone is the backbone of treatment of all types of leprosy; the disease is not stable, not autoimmune, and the lepromin test is not diagnostic. Leprosy is chronic and progressive, causing nerve damage and deformity if untreated. Schwann cells are the target. It is infectious. The lepromin test is not diagnostic; it only helps classify the type and prognosis.\nLepromin = prognostic only.",""],"im":[]},{"id":"H054","ch":"Mycobacterial Infections","q":"Diagnosis of leprosy includes:","o":[["A","Skin biopsy."],["B","Nerve biopsy."],["C","Nasal smear."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":30,"e":["Diagnosis uses skin biopsy, nerve biopsy and slit-skin/nasal smears, so all of the above.\nSmear, biopsy, nerve biopsy.",""],"im":[]},{"id":"H055","ch":"Mycobacterial Infections","q":"Leprosy is treated by:","o":[["A","Dapsone."],["B","Retinoids."],["C","Methotrexate."],["D","Tetracyclines."],["E","All of the above."]],"a":"A","sa":null,"pg":null,"f":[],"n":31,"e":["Dapsone is used for leprosy; retinoids, methotrexate and tetracyclines are not anti-leprotic here. Retinoids are for acne. Methotrexate is for psoriasis. Tetracyclines are for acne. Only dapsone is correct.",""],"im":[]},{"id":"H056","ch":"Mycobacterial Infections","q":"In leprosy:","o":[["A","Lepromatous, borderline lepromatous & borderline tuberculoid leprosy are paucibacillary forms of the disease."],["B","Nerve invasion is late in tuberculoid leprosy."],["C","Numerous patches are characteristic of tuberculoid leprosy."],["D","All of the above is true."],["E","None of the above is true."]],"a":"E","sa":null,"pg":null,"f":[],"n":32,"e":["The statements given are all wrong: lepromatous/borderline lepromatous are multibacillary, nerve invasion is early in tuberculoid, and numerous patches are lepromatous. LL and BL are multibacillary. It is early in TT. Patches are few in TT. Wrong: not all listed statements are correct.\nPaucibacillary = TT, BT.",""],"im":[]},{"id":"H057","ch":"Mycobacterial Infections","q":"Hansen's disease is another name for:","o":[["A","Acne."],["B","Alopecia."],["C","Scabies."],["D","Psoriasis."],["E","Leprosy."]],"a":"E","sa":null,"pg":null,"f":[],"n":33,"e":["Hansen's disease is named after Gerhard Hansen, who discovered Mycobacterium leprae; it is simply another name for leprosy. Acne is a pilosebaceous disease. Alopecia is hair loss. Scabies is a mite disease. Psoriasis is papulosquamous.\nHansen = leprosy.",""],"im":[]},{"id":"H061","ch":"Mycobacterial Infections","q":"Regarding leprosy, the following statement is INCORRECT:","o":[["A","High immunity leads to paucibacillary leprosy."],["B","Tuberculoid leprosy shows good immunity."],["C","Lepromin test is non-specific and non-diagnostic."],["D","Sensory nerves affection leads to glove and stocking anesthesia."],["E","Lepromatous leprosy is paucibacillary."]],"a":"E","sa":null,"pg":null,"f":[],"n":34,"e":["Lepromatous leprosy is multibacillary, so calling it paucibacillary is incorrect. Correct statement. Correct statement. Correct statement. Correct statement.\nLL multibacillary.",""],"im":[]},{"id":"H067","ch":"Mycobacterial Infections","q":"Which is TRUE regarding tuberculoid leprosy:","o":[["A","Diagnosed by lepromin test."],["B","Presents with multiple nodules."],["C","Nerve involvement occurs early."],["D","Involves mucous membranes."],["E","Is a sign of poor immunity."]],"a":"C","sa":null,"pg":null,"f":[],"n":35,"e":["In tuberculoid leprosy the host immune response targets bacilli in nerves, so nerve involvement is early, while the disease is paucibacillary and not diagnosed by lepromin test. Not diagnosed by lepromin. Nodules are LL. Mucosa is LL. TT is good immunity.\nTT early nerve.",""],"im":[]},{"id":"H071","ch":"Mycobacterial Infections","q":"A male patient, 52 years old, presented with glistening erythematous papules, nodules & plaques on his ears, nose and forehead. He had loss of the outer 1/3 of his eyebrows and gave history of recurrent attacks of epistaxis. What is your diagnosis?","o":[["A","Impetigo contagiosum."],["B","Tuberculoid leprosy."],["C","Lepromatous leprosy."],["D","Pityriasis versicolor."],["E","Psoriasis."]],"a":"C","sa":null,"pg":null,"f":[],"n":36,"e":["Glistening nodules on ears, nose and forehead with loss of the outer third of the eyebrows and epistaxis is lepromatous leprosy. Impetigo is crusted. TT is few patches. Versicolor is scaly. Psoriasis is scaly.\nMadarosis outer third.",""],"im":[]},{"id":"H072","ch":"Mycobacterial Infections","q":"A patient with widespread, symmetrical papules and nodules, infiltrated facial skin, and loss of the outer third of the eyebrows. Which is TRUE regarding this disease?","o":[["A","Is a parasitic infection."],["B","Bacilli are absent in skin lesions."],["C","Nerve involvement occurs early."],["D","Involves mucous membranes."],["E","Is characterized by good immunity."]],"a":"D","sa":null,"pg":null,"f":[],"n":37,"e":["Symmetrical nodules, infiltrated face and loss of the outer eyebrows indicate lepromatous leprosy, which involves mucous membranes. It is bacterial. Bacilli are numerous. Nerve is late. Immunity is poor.\nLL: mucosa involved.",""],"im":[]},{"id":"Q126","ch":"Viral Infections","q":"Viral skin infections include all of the following EXCEPT","o":[["A","Herpes simplex."],["B","Chicken pox."],["C","Warts."],["D","Impetigo."],["E","Molluscum contagiosum."]],"a":"D","sa":null,"pg":"21","f":[],"n":1,"e":["Impetigo is caused by bacteria (Staphylococcus aureus/streptococci). Herpes simplex, chickenpox, warts and molluscum are viral. HSV is viral. Chickenpox is viral. Warts are viral. Molluscum is viral.\nImpetigo = bacterial.",""],"im":[]},{"id":"Q127","ch":"Viral Infections","q":"All of the following microorganisms have a predilection for neural tissue EXCEPT","o":[["A","Varicella zoster virus."],["B","Human papilloma virus."],["C","Herpes simplex virus type I."],["D","Herpes simplex virus type II."],["E","Lepra bacilli."]],"a":"B","sa":null,"pg":"22","f":[],"n":2,"e":["VZV, HSV and M. leprae are neurotropic; HPV is epitheliotropic, not neural. VZV is neurotropic. HSV-1 is neurotropic. HSV-2 is neurotropic. Lepra bacilli target nerves.\nNeurotropic: VZV, HSV, M. leprae.",""],"im":[]},{"id":"Q128","ch":"Viral Infections","q":"All of the following microorganisms have a predilection for neural tissue EXCEPT","o":[["A","Varicella zoster virus."],["B","Herpes simplex virus type I."],["C","Herpes simplex virus type II."],["D","Lepra bacilli."],["E","Pox virus."]],"a":"E","sa":null,"pg":"22","f":[],"n":3,"e":["Poxvirus (molluscum) infects epidermal cells and is not neurotropic; VZV, HSV and lepra bacilli are. The same question in Dr. Hawary's file lists HPV and pox virus as both being non-neural (key B / E). VZV is neurotropic. HSV-1 is neurotropic. HSV-2 is neurotropic. Lepra bacilli target Schwann cells.\nPox and HPV = no neural predilection.",""],"im":[]},{"id":"Q129","ch":"Viral Infections","q":"Herpes simplex","o":[["A","Is strictly unilateral."],["B","Is a bacterial infection."],["C","Heals with a scar."],["D","One attack provides permanent immunity."],["E","Is genital & non-genital."]],"a":"E","sa":null,"pg":"21","f":[],"n":4,"e":["HSV infects genital and non-genital sites (lips, face, fingers, eye), types 1 and 2 overlapping. It can be bilateral. It is viral. It heals without scar. It recurs.\nHSV-1 mostly oral; HSV-2 mostly genital.",""],"im":[]},{"id":"Q130","ch":"Viral Infections","q":"In herpes simplex","o":[["A","The primary lesion is a papule."],["B","Neuralgia is a frequent complication."],["C","It usually affects the mucocutaneous junction."],["D","Recurrences are uncommon."],["E","None of the above."]],"a":"C","sa":null,"pg":"27","f":[],"n":5,"e":["HSV classically involves the mucocutaneous junction (lips, nose, genitalia) and recurs there; it is periorificial, whereas zoster follows a dermatome. The primary lesion is a vesicle. Neuralgia is a feature of zoster. Recurrences are common. Wrong: at least one listed statement is correct.",""],"im":[]},{"id":"Q131","ch":"Viral Infections","q":"In herpes simplex all are true EXCEPT","o":[["A","The primary lesion is a vesicle."],["B","Neuralgia is a frequent complication."],["C","It usually affects the mucocutaneous junction."],["D","It may cause eczema herpeticum in atopics."],["E","Recurrence is common."]],"a":"B","sa":null,"pg":"26","f":[],"n":6,"e":["Neuralgia is a frequent complication of herpes zoster, not of herpes simplex. The primary lesion of HSV is a grouped vesicle. HSV typically involves mucocutaneous junctions (lips, genitalia). HSV can cause eczema herpeticum in atopic skin. HSV recurs after latency in sensory ganglia.\nPost-herpetic neuralgia = zoster.",""],"im":[]},{"id":"Q132","ch":"Viral Infections","q":"Herpes labialis","o":[["A","Is recurrent."],["B","Heals with a scar."],["C","Its primary lesion is a papule."],["D","Is strictly unilateral."],["E","Is caused by HSV II."]],"a":"A","sa":null,"pg":"22","f":[],"n":7,"e":["Herpes labialis recurs because HSV lies latent in the trigeminal ganglion and reactivates. It heals without scar. The primary lesion is a vesicle. It can be bilateral. It is usually HSV-1.\nRecurrence is common in HSV.",""],"im":[]},{"id":"Q133","ch":"Viral Infections","q":"A female patient, 15 years old, presented with perioral blisters of 4 days duration. She was feverish 2 days before the rash and felt a tingling sensation in the area. The condition was recurrent. (Clinical photo: grouped vesicles/crusts at the lip margin.) The causative organism of this disease is","o":[["A","Group A β-haemolytic Streptococci."],["B","Varicella zoster virus."],["C","Staphylococcus aureus."],["D","Human papilloma virus."],["E","Herpes simplex virus."]],"a":"E","sa":null,"pg":"22","f":[],"n":8,"e":["Recurrent perioral blisters preceded by fever and tingling are due to herpes simplex virus. Strep causes impetigo. VZV gives dermatomal vesicles. Staph causes impetigo. HPV gives warts.\nProdrome tingling → HSV.",""],"im":[]},{"id":"Q134","ch":"Viral Infections","q":"A female patient, 15 years old, presented with perioral blisters of 4 days duration. She was feverish 2 days before the rash and felt a tingling sensation in the area. The condition was recurrent. (Clinical photo: grouped vesicles/crusts at the lip margin.) A possible complication is","o":[["A","Neuralgia."],["B","Erythema multiforme."],["C","Lymphatic obstruction."],["D","Facial palsy."],["E","Scarring."]],"a":"B","sa":null,"pg":"82","f":[],"n":9,"e":["HSV is the most common trigger of erythema multiforme, an immune-mediated reaction with target lesions; other complications are eczema herpeticum, ocular disease and encephalitis. Neuralgia is a zoster complication. Lymphatic obstruction occurs in erysipelas. Facial palsy is not typical. HSV heals without scar.\nHSV → EM.",""],"im":[]},{"id":"Q135","ch":"Viral Infections","q":"A female patient presented with bilateral grouped vesicles on an erythematous base on the lips, preceded by burning sensation. The diagnosis is","o":[["A","Herpes zoster."],["B","Herpes simplex."],["C","Molluscum contagiosum."],["D","Impetigo contagiosum."],["E","Drug eruption."]],"a":"B","sa":null,"pg":"22","f":[],"n":10,"e":["Bilateral grouped vesicles on an erythematous base on the lips after burning sensation indicate herpes simplex. Zoster is unilateral and dermatomal. Molluscum is umbilicated. Impetigo is crusted. No drug here.\nBurning prodrome + grouped vesicles.",""],"im":[]},{"id":"Q136","ch":"Viral Infections","q":"A 40-year-old male patient with bilateral grouped vesicles on an erythematous base affecting the lips and nose, with no fever or lymphadenopathy, may have","o":[["A","Herpes zoster."],["B","Primary herpetic gingivostomatitis."],["C","Recurrent herpes simplex."],["D","Erysipelas."],["E","Verruca vulgaris."]],"a":"C","sa":null,"pg":"22","f":[],"n":11,"e":["Recurrent grouped vesicles on the lips and nose indicate recurrent herpes simplex (labialis). Zoster is unilateral. Primary herpetic gingivostomatitis is with fever and lymph nodes. Erysipelas is a hot plaque. Verruca is rough.\nRecurrent = HSV.",""],"im":[]},{"id":"Q137","ch":"Viral Infections","q":"A 24-year-old man develops grouped painful vesicles on the penis, preceded by burning sensation. The most likely diagnosis is","o":[["A","Molluscum contagiosum."],["B","Condyloma acuminata."],["C","Herpes progenitalis."],["D","Scabies."],["E","Exanthematous drug eruption."]],"a":"C","sa":null,"pg":"23","f":[],"n":12,"e":["Grouped painful vesicles on the penis after burning point to genital herpes (herpes progenitalis). Molluscum is not painful. Condyloma is not vesicular. Scabies is itchy. Drug eruption is exanthematous.\nHSV-2 usually.",""],"im":[]},{"id":"Q138","ch":"Viral Infections","q":"Caesarian section is indicated for a pregnant female if at the time of delivery she is affected by","o":[["A","Herpetic whitlow."],["B","Herpes progenitalis."],["C","Herpes zoster."],["D","Chicken pox."],["E","None of the above."]],"a":"B","sa":null,"pg":"23","f":[],"n":13,"e":["Active genital herpes at delivery is an indication for cesarean section to prevent neonatal herpes. Whitlow is on fingers. Zoster is not transmitted at birth this way. Chickenpox is managed differently. Wrong: at least one listed statement is correct.\nActive genital herpes → C-section.",""],"im":[]},{"id":"Q139","ch":"Viral Infections","q":"The following disease could be transmitted by sexual contact","o":[["A","Pityriasis rosea."],["B","Pityriasis versicolor."],["C","Herpes simplex."],["D","Herpes zoster."],["E","Ophiasis."]],"a":"C","sa":null,"pg":"21","f":[],"n":14,"e":["Herpes simplex type 2 is a very common sexually transmitted infection, spread by contact with the genital mucosa or skin; zoster, psoriasis and versicolor are not STDs. Pityriasis rosea is not an STD. Versicolor is not an STD. Zoster is reactivation. Ophiasis is alopecia.\nHSV-2 genital.",""],"im":[]},{"id":"Q140","ch":"Viral Infections","q":"In herpetic whitlow the site of infection is","o":[["A","Face."],["B","Mucous membrane."],["C","Genitals."],["D","Fingers."],["E","None of the above."]],"a":"D","sa":null,"pg":"23","f":[],"n":15,"e":["Herpetic whitlow is HSV infection of the finger in children (HSV-1) or adults after digital-genital contact. Face is herpes labialis. Mucosa is gingivostomatitis. Genitals is progenitalis. Wrong: at least one listed statement is correct.\nWhitlow = finger.",""],"im":[]},{"id":"Q141","ch":"Viral Infections","q":"The eye may be affected in ONE of the following diseases","o":[["A","Lichen planus."],["B","Pityriasis rosea."],["C","Acne vulgaris."],["D","Herpes simplex."],["E","Psoriasis."]],"a":"D","sa":null,"pg":"23","f":[],"n":16,"e":["HSV can cause keratitis (HSV-1 in children and adults, HSV-2 in newborns), possibly with corneal ulcers; zoster also causes eye disease through the ophthalmic branch. Lichen planus does not affect the eye. PR does not affect the eye. Acne does not affect the eye. Psoriasis does not affect the eye.\nHSV ocular.",""],"im":[]},{"id":"Q142","ch":"Viral Infections","q":"Complications of herpes simplex infection include","o":[["A","Erythema multiforme."],["B","Eczema herpeticum."],["C","Corneal ulcers."],["D","CNS complications."],["E","All of the above."]],"a":"E","sa":null,"pg":"23","f":[],"n":17,"e":["HSV complications include erythema multiforme, eczema herpeticum, corneal ulcers and CNS (encephalitis).\nAll of the above.",""],"im":[]},{"id":"Q143","ch":"Viral Infections","q":"Tzank smear is used to diagnose","o":[["A","Leprosy."],["B","Impetigo."],["C","Herpes simplex."],["D","Psoriasis."],["E","Pediculosis."]],"a":"C","sa":null,"pg":"24","f":[],"n":18,"e":["A Tzanck smear shows multinucleated giant cells in herpes simplex (and zoster/varicella). Leprosy needs smear. Impetigo needs culture. Psoriasis is clinical. Lice need microscopy.\nTzanck = multinucleated giant cells.",""],"im":[]},{"id":"Q144","ch":"Viral Infections","q":"Primary varicella zoster virus infection leads to","o":[["A","Facial palsy."],["B","Genital herpes."],["C","Chickenpox."],["D","Herpes zoster."],["E","Oral herpes."]],"a":"C","sa":null,"pg":"24","f":[],"n":19,"e":["Primary VZV infection leads to chickenpox, usually in childhood; the virus then lies latent in posterior root ganglia and reactivates as herpes zoster. Not facial palsy. Genital herpes is HSV. Zoster is reactivation. Oral herpes is HSV.\nPrimary VZV = varicella.",""],"im":[]},{"id":"Q145","ch":"Viral Infections","q":"Chicken pox represents","o":[["A","HSV infection."],["B","HPV infection."],["C","Poxvirus infection."],["D","Reactivation of VZV."],["E","Primary VZV infection."]],"a":"E","sa":null,"pg":"24","f":[],"n":20,"e":["Chickenpox is the primary VZV infection, whereas herpes zoster is reactivation. HSV causes oral and genital herpes. HSV is a different virus. HPV causes warts. Poxvirus causes molluscum. Reactivation is zoster.\nPrimary vs reactivation.",""],"im":[]},{"id":"Q146","ch":"Viral Infections","q":"Varicella: what is the causative virus, and what is the treatment?","o":[],"a":null,"sa":"Varicella zoster virus (VZV); antiviral, e.g. acyclovir 800 mg 5 times daily for 7 days (started within 48 hours).","pg":"24","f":[],"n":21,"e":["Varicella is caused by VZV, and treatment is antiviral therapy (acyclovir 800 mg 5 times daily for 7 days, started within 48 hours) plus vaccine prophylaxis in children.\nVZV, acyclovir.",""],"im":[]},{"id":"Q147","ch":"Viral Infections","q":"An adult patient with unilateral painful grouped vesicles along the distribution of a sensory nerve is suffering from","o":[["A","Herpes simplex."],["B","Herpes zoster."],["C","Chickenpox."],["D","Warts."],["E","Molluscum contagiosum."]],"a":"B","sa":null,"pg":"25","f":[],"n":22,"e":["Unilateral grouped vesicles along a sensory nerve distribution are herpes zoster. HSV is not dermatomal. Chickenpox is generalized. Warts are not vesicles. Molluscum is umbilicated.\nDermatomal = zoster.",""],"im":[]},{"id":"Q148","ch":"Viral Infections","q":"Unilateral painful grouped vesicles on an erythematous base are seen in","o":[["A","Verruca vulgaris."],["B","Acute eczema."],["C","Herpes zoster."],["D","Varicella."],["E","Pediculosis."]],"a":"C","sa":null,"pg":"25","f":[],"n":23,"e":["Unilateral painful grouped vesicles on an erythematous base indicate herpes zoster. Verruca is rough. Acute eczema is bilateral. Varicella is generalized. Pediculosis is itchy.\nPain + unilateral.",""],"im":[]},{"id":"Q149","ch":"Viral Infections","q":"Primary lesions of herpes zoster are unilateral","o":[["A","Flat-topped skin-colored papules."],["B","Flat-topped violaceous papules."],["C","Umbilicated papules."],["D","Grouped pustules."],["E","Grouped vesicles."]],"a":"E","sa":null,"pg":"27","f":[],"n":24,"e":["The primary lesion of zoster is grouped vesicles on a dermatome, unilateral. That is plane warts. That is lichen planus. That is molluscum. Pustules are not typical.",""],"im":[]},{"id":"Q150","ch":"Viral Infections","q":"Post-herpetic neuralgia is more common in","o":[["A","Children."],["B","Elderly patients."],["C","Diabetic patients."],["D","Motor nerve affection."],["E","Sensory nerve affection."]],"a":"B","sa":null,"pg":"26","f":[],"n":25,"e":["Post-herpetic neuralgia occurs in elderly patients and may persist for weeks to months. Early antivirals and vaccines reduce its risk. Children rarely get PHN. Age, not diabetes, is the main risk. Sensory fibers are involved. Not a discriminating factor.\nElderly → PHN.",""],"im":[]},{"id":"Q151","ch":"Viral Infections","q":"Common complication of herpes zoster","o":[["A","Long-standing pain."],["B","Ulceration."],["C","Lymphatic obstruction."],["D","Deep venous thrombosis."]],"a":"A","sa":null,"pg":"26","f":[],"n":26,"e":["Post-herpetic neuralgia (long-standing pain) is the common complication of zoster. Ulceration is rare. Lymphatic obstruction is not a zoster complication. DVT is not a complication.\nPHN.",""],"im":[]},{"id":"Q152","ch":"Viral Infections","q":"The following drug is the main treatment of herpes zoster","o":[["A","Acyclovir."],["B","Tetracycline."],["C","Retinoids."],["D","Cyclosporin."],["E","Methotrexate."]],"a":"A","sa":null,"pg":"27","f":[],"n":27,"e":["Acyclovir (also valacyclovir and famciclovir) is the main treatment for herpes zoster when started within 48 hours; analgesics and gabapentin help the pain. Tetracycline is antibacterial. Retinoids are for acne. Cyclosporin is immunosuppressive. Methotrexate is antiproliferative.",""],"im":[]},{"id":"Q153","ch":"Viral Infections","q":"A 65-year-old man presents with unilateral, painful vesicles along a dermatome on the trunk. Treatment of this condition is oral acyclovir in a dose of","o":[["A","800 mg 3 times daily."],["B","200 mg 3 times daily."],["C","800 mg 5 times daily."],["D","200 mg 5 times daily."],["E","400 mg 5 times daily."]],"a":"C","sa":null,"pg":"27","f":[],"n":28,"e":["Herpes zoster in older adults is treated with oral acyclovir 800 mg five times daily for 7 days. Too infrequent. Too low. That is the herpes simplex dose. Not the standard.\n800 mg × 5/day.",""],"im":[]},{"id":"Q154","ch":"Viral Infections","q":"Treatment of herpes zoster (dose of acyclovir)?","o":[],"a":null,"sa":"Oral acyclovir 800 mg 5 times daily for 7 days (started within 48 hours).","pg":"27","f":[],"n":29,"e":["Zoster: oral acyclovir 800 mg five times daily for 7 days, started within 48 hours.\n800 × 5 × 7 days.",""],"im":[]},{"id":"Q155","ch":"Viral Infections","q":"Warts are caused by","o":[["A","HSV-1."],["B","Pox virus."],["C","Human papilloma virus."]],"a":"C","sa":null,"pg":"28","f":[],"n":30,"e":["Warts are common benign epithelial growths caused by human papilloma virus (over 200 genotypes), not pox virus or herpes simplex. HSV-1 gives vesicles. Pox virus gives molluscum.\nWarts = HPV.",""],"im":[]},{"id":"Q156","ch":"Viral Infections","q":"Verruca vulgaris is caused by","o":[["A","Herpes simplex virus type 1."],["B","Herpes simplex virus type 2."],["C","Human papilloma virus."],["D","Varicella-zoster virus."],["E","Pox virus."]],"a":"C","sa":null,"pg":null,"f":[],"n":31,"e":["Verruca vulgaris (common wart) is caused by HPV, a DNA virus transmitted by skin contact or fomites. HSV-1 gives vesicles. HSV-2 gives genital herpes. VZV gives zoster. Pox gives molluscum.",""],"im":[]},{"id":"Q157","ch":"Viral Infections","q":"Verruca","o":[["A","Presents by violaceous papules."],["B","Is characterized by asymptomatic verrucous macules."],["C","May involve the mucous membranes."],["D","Is a systemic disease."],["E","Is always treated by surgical excision."]],"a":"C","sa":null,"pg":"28","f":[],"n":32,"e":["Warts may involve mucous membranes as well as skin; genital warts are the best example. Warts are not violaceous. Lesions are papules. It is local. Destruction is used.\nWarts: skin and mucosa.",""],"im":[]},{"id":"Q158","ch":"Viral Infections","q":"Which of the following is a correct statement concerning verrucae?","o":[["A","Primary lesion is a skin-colored macule."],["B","Involve mucous membranes."],["C","Found mainly in patients with lymphoma."],["D","Contagious in children only."],["E","Treated with griseofulvin."]],"a":"B","sa":null,"pg":"28","f":[],"n":33,"e":["Verrucae can involve mucous membranes (oral, genital, anal); they are not limited to skin, and are not caused by Treponema. The primary lesion is a papule. Not lymphoma-specific. Adults also get warts. Griseofulvin is for fungi.\nMucosal warts.",""],"im":[]},{"id":"Q159","ch":"Viral Infections","q":"ONE of the following statements about warts is CORRECT","o":[["A","The primary lesion of verruca vulgaris is a skin-colored macule."],["B","Condyloma acuminata is caused by Treponema pallidum."],["C","Warts occur on the skin, but not on mucous membranes."],["D","Cancer cervix is a complication of female genital warts."],["E","All types are painless."]],"a":"D","sa":null,"pg":"29","f":[],"n":34,"e":["Genital warts (certain HPV types) are linked to cervical cancer; common warts are not skin-colored macules, and warts are not caused by Treponema. Macules are flat. Treponema causes syphilis. Warts occur on mucosa. Plantar warts are tender.\nHPV 16/18 → cervix cancer.",""],"im":[]},{"id":"Q160","ch":"Viral Infections","q":"Verrucae vulgaris are","o":[["A","Genital warts."],["B","Plantar warts."],["C","Common warts."],["D","Plane warts."],["E","Filiform warts."]],"a":"C","sa":null,"pg":"28","f":[],"n":35,"e":["Verruca vulgaris is the common wart: hyperkeratotic, dome-shaped skin-colored papules on hands and fingers with a rough mamillated surface. Genital warts are condyloma. Plantar warts are on the sole. Plane warts are flat. Filiform warts are thread-like.\nVulgaris = common.",""],"im":[]},{"id":"Q161","ch":"Viral Infections","q":"A male patient, 6 years old, presented with asymptomatic flat-topped lesions on his face. The condition started 5 months ago with a gradual onset and a progressive course. (Clinical photo: multiple small flat-topped skin- colored/pinkish papules on the cheek.) This patient suffers from","o":[["A","Psoriasis."],["B","Plane warts."],["C","Molluscum contagiosum."],["D","Scabies."],["E","Condyloma acuminata."]],"a":"B","sa":null,"pg":"28","f":[],"n":36,"e":["Multiple flat-topped skin-colored papules, often on the face of a child, are plane warts. Psoriasis is scaly. Molluscum is umbilicated. Scabies is itchy. Condyloma is genital.\nPlane = flat.",""],"im":[]},{"id":"Q162","ch":"Viral Infections","q":"A male patient, 6 years old, presented with asymptomatic flat-topped lesions on his face. The condition started 5 months ago with a gradual onset and a progressive course. (Clinical photo: multiple small flat-topped skin- colored/pinkish papules on the cheek.) The causative organism of this disease is","o":[["A","Human herpes virus 6."],["B","Varicella zoster virus."],["C","Epstein-Barr virus."],["D","Human papilloma virus."],["E","Herpes simplex virus."]],"a":"D","sa":null,"pg":"28","f":[],"n":37,"e":["Warts are caused by human papilloma virus. HHV-6 is pityriasis rosea. VZV is zoster. EBV is mononucleosis. HSV is vesicular.\nHPV.",""],"im":[]},{"id":"Q163","ch":"Viral Infections","q":"This wart is usually tender","o":[["A","Plane wart."],["B","Plantar wart."],["C","Verruca vulgaris."],["D","Filiform wart."],["E","Condyloma acuminata."]],"a":"B","sa":null,"pg":"29","f":[],"n":38,"e":["Plantar warts are tender because they grow inward under pressure on the sole. Plane warts are flat. Verruca vulgaris is not tender. Filiform warts are not tender. Condyloma is soft.\nPlantar wart = tender.",""],"im":[]},{"id":"Q164","ch":"Viral Infections","q":"A female patient, 30 years old, presented with a tender papule involving her sole, soon followed by other similar ones. The condition started about two months ago. She feels pain while walking or running. This patient suffers from","o":[["A","Plantar warts."],["B","Moniliasis."],["C","Leprotic nodules."],["D","Post-scabietic nodules."],["E","Condyloma acuminata."]],"a":"A","sa":null,"pg":"29","f":[],"n":39,"e":["A tender thick papule on the sole, painful on walking, with other similar lesions nearby is a plantar wart. It grows inward and is tender. Moniliasis is candida. Leprotic nodules are anesthetic. Post-scabietic nodules are on genitalia. Condyloma is genital.\nPlantar warts: tender, endophytic.",""],"im":[]},{"id":"Q165","ch":"Viral Infections","q":"Which of the following is TRUE regarding plantar warts?","o":[["A","Long, thin pedunculated skin growths."],["B","Caused by human herpes virus 7."],["C","Secondary infection is a common complication."],["D","Treated by cryotherapy."],["E","Caused by blood-borne infection."]],"a":"D","sa":null,"pg":"30","f":[],"n":40,"e":["Plantar warts are treated by destruction: cryotherapy, electrocautery, chemical cautery (salicylic acid) or laser. That is filiform. HPV, not HHV-7. Warts spread by direct contact with HPV, and secondary infection is not a common complication. Warts spread by direct contact with HPV, and secondary infection is not a common complication.",""],"im":[]},{"id":"Q166","ch":"Viral Infections","q":"Condyloma acuminatum","o":[["A","Is herpes simplex virus infection of the genital area."],["B","Involves female genital areas only."],["C","Usually affects skin & mucous membranes of the genital area."],["D","Is an entirely benign lesion."],["E","Forms deep nodules in the genital area."]],"a":"C","sa":null,"pg":"29","f":[],"n":41,"e":["Condyloma acuminata (genital warts) involve skin and mucosa of the genital, perineal and perianal area; they are caused by HPV and may extend into the vagina, urethra or anus. It is HPV. It involves both sexes. It is oncogenic with HPV 16/18. It is exophytic.\nGenital warts: skin and mucosa.",""],"im":[]},{"id":"Q167","ch":"Viral Infections","q":"A female patient, 34 years old, presented with multiple soft, pinkish, moist, foul-smelling outgrowths involving her genitalia. The condition started about one year ago with a gradual onset and progressive course. (Clinical photo: multiple cauliflower-like warty growths on the genital/perianal area.) This patient suffers from","o":[["A","Genital herpes."],["B","Verruca plana."],["C","Condyloma acuminata."],["D","Molluscum contagiosum."],["E","Impetigo contagiosum."]],"a":"C","sa":null,"pg":"29","f":[],"n":42,"e":["Discrete soft exophytic papules on the genitalia indicate condyloma acuminata, an HPV infection that is oncogenic with types 16 and 18. Herpes is vesicular. Verruca plana is flat. Molluscum is umbilicated. Impetigo is crusted.",""],"im":[]},{"id":"Q168","ch":"Viral Infections","q":"A female patient, 34 years old, presented with multiple soft, pinkish, moist, foul-smelling outgrowths involving her genitalia. The condition started about one year ago with a gradual onset and progressive course. (Clinical photo: multiple cauliflower-like warty growths on the genital/perianal area.) Management of this case is by","o":[["A","Phototherapy."],["B","Radiotherapy."],["C","Systemic acyclovir."],["D","Intralesional steroids."],["E","Podophyllin resin 25%."]],"a":"E","sa":null,"pg":"30","f":[],"n":43,"e":["Genital warts are treated with podophyllin resin (10-25%, weekly, washed after 1-4 h), imiquimod, cryotherapy or laser. Podophyllin is contraindicated in pregnancy. Phototherapy has no role in genital warts; podophyllin, imiquimod, cryotherapy or laser are used. Radiotherapy has no role in genital warts. Acyclovir treats HSV. Steroids worsen warts.\nPodophyllin weekly.",""],"im":[]},{"id":"Q169","ch":"Viral Infections","q":"Treatment of verruca vulgaris is by","o":[["A","Surgical excision."],["B","Intralesional corticosteroids."],["C","Topical antibiotic."],["D","Topical steroid."],["E","Electrocautery."]],"a":"E","sa":null,"pg":"30","f":[],"n":44,"e":["Verruca vulgaris can be destroyed by electrocautery, cryotherapy or chemicals. Excision leaves scars. Steroids do not treat warts. Antibiotics are for bacteria. Steroids do not treat warts.\nDestructive therapy.",""],"im":[]},{"id":"Q170","ch":"Viral Infections","q":"Warts can be treated by all of the following EXCEPT","o":[["A","Laser."],["B","Cryotherapy."],["C","Electrocautery."],["D","Intralesional steroids."],["E","Chemical cautery."]],"a":"D","sa":null,"pg":"30","f":[],"n":45,"e":["Intralesional steroids are not used for warts; laser, cryotherapy, electrocautery and chemical cautery are. Laser treats warts. Cryotherapy treats warts. Electrocautery treats warts. Chemical cautery treats warts.\nSteroids don't treat warts.",""],"im":[]},{"id":"Q171","ch":"Viral Infections","q":"The following are different treatments of warts EXCEPT","o":[["A","Cryotherapy."],["B","Podophyllin resin."],["C","Laser treatment."],["D","PUVA."],["E","Electrocautery."]],"a":"D","sa":null,"pg":"30","f":[],"n":46,"e":["PUVA is not a wart treatment; cryotherapy, podophyllin, laser and electrocautery are. Cryotherapy treats warts. Podophyllin treats warts. Laser treats warts. Electrocautery treats warts.\nPUVA ≠ warts.",""],"im":[]},{"id":"Q172","ch":"Viral Infections","q":"In a pregnant female with venereal warts, all of the following treatment modalities can be used safely EXCEPT","o":[["A","Podophyllin resin."],["B","Laser."],["C","Cryotherapy."],["D","Electrocautery."],["E","None of the above."]],"a":"A","sa":null,"pg":"30","f":[],"n":47,"e":["Podophyllin resin is contraindicated in pregnancy; laser, cryotherapy and electrocautery may be used. Laser is safe. Cryotherapy is safe. Electrocautery is safe. A is the exception.\nPregnancy: avoid podophyllin.",""],"im":[]},{"id":"Q173","ch":"Viral Infections","q":"Genital warts are treated by ___, which is contraindicated in ___.","o":[],"a":null,"sa":"Podophyllin resin 10-25% (applied once weekly, washed off after 1-4 hours); contraindicated in pregnancy and in large bleeding warts.","pg":"30","f":[],"n":48,"e":["Genital warts are treated by podophyllin resin 10-25%, which is contraindicated in pregnancy and large bleeding warts.\nWash off after 1-4 h.",""],"im":[]},{"id":"Q174","ch":"Viral Infections","q":"Laser may be used in the treatment of","o":[["A","Warts."],["B","Molluscum contagiosum."],["C","Acne scars."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"30","f":[],"n":49,"e":["Laser (CO2 or pulsed dye) can destroy warts, molluscum lesions and treat acne scars by resurfacing.\nLaser: all of these.",""],"im":[]},{"id":"Q175","ch":"Viral Infections","q":"Pox virus can cause","o":[["A","Molluscum contagiosum."],["B","Warts."],["C","Herpes zoster."],["D","Tinea capitis."],["E","Impetigo contagiosum."]],"a":"A","sa":null,"pg":"30","f":[],"n":50,"e":["Poxvirus causes molluscum contagiosum; warts are HPV, zoster is VZV and impetigo contagiosa is bacterial. Warts are HPV. Zoster is VZV. Tinea is fungal. Impetigo is bacterial.\nMolluscum = pox.",""],"im":[]},{"id":"Q176","ch":"Viral Infections","q":"Which one of the following viruses is responsible for causing molluscum contagiosum?","o":[["A","Human papilloma virus."],["B","Herpes simplex virus."],["C","Pox virus."],["D","Varicella zoster virus."],["E","Human immunodeficiency virus."]],"a":"C","sa":null,"pg":"30","f":[],"n":51,"e":["Molluscum contagiosum is caused by a poxvirus, which causes pearly umbilicated papules. HPV causes warts. HSV causes vesicles. VZV causes zoster. HIV is a different virus.",""],"im":[]},{"id":"Q177","ch":"Viral Infections","q":"Molluscum contagiosum is","o":[["A","A bacterial infection with vesicle as primary lesion."],["B","A mycobacterial infection transmitted by droplet."],["C","A fungal infection caused by a yeast."],["D","A parasitic infection with nocturnal itching."],["E","A viral infection caused by pox virus."]],"a":"E","sa":null,"pg":"30","f":[],"n":52,"e":["Molluscum contagiosum is a viral infection by pox virus, spread by skin contact; it is considered an STD when genital. It is viral. Molluscum is a poxvirus infection, not mycobacterial, fungal or parasitic. Molluscum is a poxvirus infection, not mycobacterial, fungal or parasitic. Molluscum is a poxvirus infection, not mycobacterial, fungal or parasitic.",""],"im":[]},{"id":"Q178","ch":"Viral Infections","q":"(Clinical photo: close-up of skin with multiple small umbilicated, pearly papules.) The causative organism is","o":[["A","β-haemolytic Streptococci."],["B","Staphylococcus aureus."],["C","Human papilloma virus."],["D","Pox virus."],["E","Herpes simplex virus."]],"a":"D","sa":null,"pg":"30","f":[],"n":53,"e":["Pox virus is the cause of the umbilicated pearly papules of molluscum contagiosum. Strep causes impetigo. Staph causes boils. HPV causes warts. HSV causes vesicles.",""],"im":[]},{"id":"Q179","ch":"Viral Infections","q":"The primary lesion of molluscum contagiosum is","o":[["A","Macule."],["B","Papule."],["C","Plaque."],["D","Vesicle."],["E","Pustule."]],"a":"B","sa":null,"pg":"30","f":[],"n":54,"e":["The primary lesion of molluscum is a firm, pearly white, umbilicated papule with a waxy surface from which white cheesy material can be expressed. Molluscum lesions are solid, dome-shaped, umbilicated pearly papules, not this lesion. Molluscum lesions are solid, dome-shaped, umbilicated pearly papules, not this lesion. Molluscum lesions are solid, dome-shaped, umbilicated pearly papules, not this lesion. Molluscum lesions are solid, dome-shaped, umbilicated pearly papules, not this lesion.",""],"im":[]},{"id":"Q180","ch":"Viral Infections","q":"A pearly papule with central umbilication exuding cheesy material is typical of","o":[["A","Molluscum contagiosum."],["B","Plane wart."],["C","Varicella."],["D","Condyloma acuminata."],["E","Seborrheic keratosis."]],"a":"A","sa":null,"pg":"30","f":[],"n":55,"e":["A pearly papule with central umbilication and cheesy material is molluscum contagiosum. Plane warts are flat. Varicella is vesicular. Condyloma is cauliflower. Seborrheic keratosis is greasy.\nUmbilicated.",""],"im":[]},{"id":"Q181","ch":"Viral Infections","q":"Molluscum contagiosum lesions are","o":[["A","Painful grouped vesicles on an erythematous base."],["B","Firm umbilicated pearly white papules expressing white cheesy material."],["C","Thick endophytic tender papules on the palms and soles."],["D","Annular scaly patches with central clearing."],["E","Deep nodules with sinus tracts."]],"a":"B","sa":null,"pg":"30","f":[],"n":56,"e":["Molluscum lesions are firm umbilicated pearly papules that express cheesy material. That is herpes. That is a plantar wart. That is tinea. That is a deep infection.\nCurettage/expression.",""],"im":[]},{"id":"Q182","ch":"Viral Infections","q":"All of the following may be used in the treatment of molluscum contagiosum EXCEPT","o":[["A","Electrocautery."],["B","Carbolic acid."],["C","Cryotherapy."],["D","Steroids."],["E","Laser."]],"a":"D","sa":null,"pg":"31","f":[],"n":57,"e":["Molluscum is treated by curettage, cautery, cryotherapy, laser and chemicals, not steroids. Electrocautery treats molluscum. Carbolic acid treats molluscum. Cryotherapy treats molluscum. Laser treats molluscum.\nNo steroids.",""],"im":[]},{"id":"Q183","ch":"Viral Infections","q":"Which of the following is a sexually transmitted disease?","o":[["A","Herpes zoster."],["B","Psoriasis vulgaris."],["C","Molluscum contagiosum."],["D","Lichen planus."],["E","Tinea versicolor."]],"a":"C","sa":null,"pg":"30","f":[],"n":58,"e":["Molluscum contagiosum is considered a sexually transmitted disease if it involves genital skin or mucosa, spread by direct contact. Zoster is reactivation. Psoriasis is not infectious. LP is not infectious. Versicolor is not an STD.\nGenital molluscum = STD.",""],"im":[]},{"id":"Q184","ch":"Viral Infections","q":"The following may be sexually transmitted","o":[["A","Psoriasis."],["B","Lichen planus."],["C","Warts."],["D","Eczema."],["E","Vitiligo."]],"a":"C","sa":null,"pg":"28","f":[],"n":59,"e":["Genital warts (condyloma acuminata) are sexually transmitted HPV infections. Psoriasis is not infectious. LP is not infectious. Eczema is not infectious. Vitiligo is not infectious.\nGenital warts STD.",""],"im":[]},{"id":"Q185","ch":"Viral Infections","q":"Which of the following is a sexually transmitted skin disease?","o":[["A","Herpes progenitalis."],["B","Condyloma acuminata."],["C","Molluscum contagiosum."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"30","f":[],"n":60,"e":["Herpes progenitalis, condyloma acuminata and molluscum contagiosum are all sexually transmitted skin diseases.\nAll of the above.",""],"im":[]},{"id":"Q186","ch":"Viral Infections","q":"All of the following diseases may be sexually transmitted EXCEPT","o":[["A","Scabies."],["B","Molluscum contagiosum."],["C","Condyloma acuminata."],["D","Eczema herpeticum."],["E","Herpes progenitalis."]],"a":"D","sa":null,"pg":"23","f":[],"n":61,"e":["Eczema herpeticum is a complication of HSV in atopic skin, not an STD itself. Scabies is sexually transmissible. Molluscum is transmissible. Condyloma is an STD. Herpes progenitalis is an STD.\nEczema herpeticum = atopics.",""],"im":[]},{"id":"Q187","ch":"Viral Infections","q":"Choose the correct statement","o":[["A","Lichen planus is caused by pox virus"],["B","The treatment of choice of discoid lupus erythematosus is PUVA"],["C","Herald patch is the primary lesion of urticaria"],["D","Molluscum contagiosum is a sexually transmitted disease"],["E","Alopecia areata is a form of cicatricial alopecia"]],"a":"D","sa":null,"pg":"30","f":[],"n":62,"e":["Per the book, molluscum contagiosum involving genital skin is a sexually transmitted disease; it spreads by skin-to-skin contact and rarely fomites. LP is not viral. DLE is treated by antimalarials. Herald patch is of PR. AA is non-scarring.\nAdult molluscum is sexually transmissible.",""],"im":[]},{"id":"Q537","ch":"Viral Infections","q":"Mucous membranes may be affected in:","o":[["A","Papular urticaria."],["B","Actinic lichen planus."],["C","Scabies."],["D","Chickenpox."],["E","None of the above."]],"a":"D","sa":null,"pg":"24","f":[],"n":63,"e":["Chickenpox produces vesicles that also appear on the oral mucosa (enanthem). Papular urticaria is an insect-bite hypersensitivity limited to skin, scabies spares mucous membranes, and actinic lichen planus (sun-exposed skin) does not typically involve them. Papular urticaria spares mucosa. Actinic LP is on sun-exposed skin. Scabies spares mucosa. Chickenpox does involve mucosa.\nMucosa: chickenpox, herpes simplex, classic lichen planus, DLE; not papular urticaria or scabies.",""],"im":[]},{"id":"Q538","ch":"Viral Infections","q":"The proper dose of oral acyclovir in the treatment of herpes zoster is:","o":[["A","200 mg 5 times daily."],["B","400 mg 3 times daily."],["C","800 mg 5 times daily."],["D","800 mg 3 times daily."]],"a":"C","sa":null,"pg":"27","f":[],"n":64,"e":["The dose of oral acyclovir for herpes zoster is 800 mg five times daily for 7 days, started within 48-72 hours of the rash. 200 mg five times daily is the herpes simplex dose, which is why the lower options are wrong. Too low. Not the zoster dose. Too infrequent.\nZoster: 800 mg × 5/day × 7 days. Herpes simplex: 200 mg × 5/day.",""],"im":[]},{"id":"H079","ch":"Viral Infections","q":"One attack gives solid immunity for:","o":[["A","Herpes simplex."],["B","Herpes zoster."],["C","Scabies."],["D","Impetigo."],["E","Molluscum contagiosum."]],"a":"B","sa":null,"pg":null,"f":["The book notes zoster can recur; the key treats one attack as giving solid immunity. Please verify."],"n":65,"e":["Herpes zoster usually gives solid lifelong immunity after one attack, unlike herpes simplex which recurs. HSV recurs. Scabies can recur. Impetigo recurs. Molluscum recurs.\nZoster rarely recurs.",""],"im":[]},{"id":"H082","ch":"Viral Infections","q":"ONE of the following statements about warts is CORRECT:","o":[["A","The primary lesion of common warts is a skin-colored macule."],["B","Condyloma acuminata is caused by Treponema pallidum."],["C","Warts occur on the skin, but not on mucous membranes."],["D","Cancer cervix is a complication of female genital warts."],["E","All types are painless."]],"a":"D","sa":null,"pg":null,"f":[],"n":66,"e":["Genital warts of oncogenic HPV types 16 and 18 can predispose to cervical dysplasia and carcinoma; common warts are hyperkeratotic papules, not macules, and Treponema pallidum causes syphilis. Macules are flat. Treponema causes syphilis. Warts occur on mucosa. Plantar warts are tender.\nHPV 16/18 → cervix.",""],"im":[]},{"id":"H083","ch":"Viral Infections","q":"All of the following microorganisms have a predilection for neural tissue EXCEPT:","o":[["A","Varicella zoster virus."],["B","Human papilloma virus."],["C","Herpes simplex virus."],["D","Lepra bacilli."],["E","Pox virus."]],"a":"B&E","sa":null,"pg":null,"f":["Both B and E are accepted as correct answers."],"n":67,"e":["HPV is not neurotropic and pox virus also lacks neural predilection, so both B and E are correct answers. VZV, HSV and lepra bacilli do have neural predilection. VZV stays latent in dorsal root ganglia and causes zoster along a nerve. HSV stays latent in sensory ganglia and recurs along the nerve. M. leprae invades Schwann cells, causing nerve damage.\nNeurotropic: VZV, HSV, lepra.",""],"im":[]},{"id":"H084","ch":"Viral Infections","q":"Condyloma acuminatum:","o":[["A","Is herpes simplex virus infection of the genital area."],["B","Involves female genital areas only."],["C","Usually affect skin & mucous membranes of the genital area."],["D","Is an entirely benign lesion."],["E","Forms deep nodules in the genital area."]],"a":"C","sa":null,"pg":null,"f":[],"n":68,"e":["Condyloma acuminatum affects skin and mucous membranes of the genital area. It is HPV. It involves both sexes. It is oncogenic with HPV 16/18. It is exophytic.\nGenital HPV.",""],"im":[]},{"id":"H101","ch":"Viral Infections","q":"Herpes progenitalis is:","o":[["A","Caused by HSV type II."],["B","Linked with cancer cervix."],["C","Characterized by recurrent vesicles & erosions on genitalia."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":69,"e":["Herpes progenitalis is caused by HSV-2, linked with cervical cancer, and characterized by recurrent vesicles and erosions, so all of the above.\nHSV-2, recurrent.",""],"im":[]},{"id":"H102","ch":"Viral Infections","q":"A female patient, 30 years old, presented with a tender papule involving her sole, started about two months ago. Patient felt pain while walking or running. This patient suffers from:","o":[["A","Plantar warts."],["B","Moniliasis."],["C","Leprotic nodules."],["D","Post-scabietic nodules."],["E","Condyloma acuminata."]],"a":"A","sa":null,"pg":null,"f":[],"n":70,"e":["A tender papule on the sole that hurts when walking or running, with onset over months, is a plantar wart. Post-scabietic nodules occur on genitalia and axillae. Moniliasis is candida. Leprotic nodules are anesthetic. Post-scabietic nodules are on genitalia. Condyloma is genital.",""],"im":[]},{"id":"H103","ch":"Viral Infections","q":"A female patient, 15 years old, presented with perioral blisters of 4 days duration. Patient was feverish before appearance of the rash by 2 days and she felt a tingling sensation in the area. Patient stated that the condition was recurrent. The causative organism of this disease is:","o":[["A","Group A B-haemolytic Streptococci."],["B","Varicella zoster virus."],["C","Staphylococcus aureus."],["D","Human papilloma virus."],["E","Herpes simplex virus."]],"a":"E","sa":null,"pg":null,"f":[],"n":71,"e":["Perioral blisters with fever and tingling beforehand in a person with recurrence are due to herpes simplex virus (HSV-1) reactivation from the sensory ganglion. Strep causes impetigo. VZV gives dermatomal vesicles. Staph causes impetigo. HPV gives warts.\nHSV recurrent.",""],"im":[]},{"id":"H104","ch":"Viral Infections","q":"A male patient, 6 years old, presented with asymptomatic flat topped lesions on his face. The condition started 5 months ago with a gradual onset and a progressive course. This patient suffers from:","o":[["A","Psoriasis."],["B","Plane warts."],["C","Molluscum contagiosum."],["D","Scabies."],["E","Condyloma acuminata."]],"a":"B","sa":null,"pg":null,"f":[],"n":72,"e":["Asymptomatic flat-topped lesions on a child's face with gradual onset are plane warts. Psoriasis is scaly. Molluscum is umbilicated. Scabies is itchy. Condyloma is genital.",""],"im":[]},{"id":"H113","ch":"Viral Infections","q":"Herpes labialis:","o":[["A","Is recurrent."],["B","Heals with scar."],["C","Its primary lesion is a papule."],["D","Is strictly unilateral."],["E","Is caused by HSV II."]],"a":"A","sa":null,"pg":null,"f":[],"n":73,"e":["Herpes labialis recurs because HSV stays latent in the dorsal root ganglion and is reactivated by stress, UV, fever, menstruation. It is usually HSV-1, heals without scar and begins as vesicles. It heals without scar. The primary lesion is a vesicle. It can be bilateral. It is usually HSV-1.\nRecurrent HSV.",""],"im":[]},{"id":"H114","ch":"Viral Infections","q":"All of the following is true for herpes zoster Except:","o":[["A","It is recurrent."],["B","It is a viral infection."],["C","It is preceded by pain."],["D","It is unilateral."],["E","It might cause scarring."]],"a":"A","sa":null,"pg":null,"f":[],"n":74,"e":["Zoster is not usually recurrent; it is preceded by pain, is unilateral, viral and may scar. Zoster is VZV reactivation. Pain or tingling precedes the rash. It is unilateral and dermatomal, not crossing the midline. It can scar, especially hemorrhagic or necrotic cases.\nZoster seldom recurs.",""],"im":[]},{"id":"Q188","ch":"Fungal Infections","q":"Dermatophytes cause infection of","o":[["A","Non-hairy skin."],["B","Hair."],["C","Nails."],["D","a + b."],["E","a + b + c."]],"a":"E","sa":null,"pg":"32","f":[],"n":1,"e":["Dermatophytes live on keratin, so they infect hairless skin (tinea corporis, cruris, pedis, manuum), hair (tinea capitis, barbae) and nails (tinea unguium). True but incomplete: hairless skin is only one site. True but incomplete: hair (tinea capitis, barbae) is only one site. True but incomplete: nails (tinea unguium) are only one site. Still leaves out the nails, which dermatophytes also invade.\nSkin, hair, nails.",""],"im":[]},{"id":"Q189","ch":"Fungal Infections","q":"Tinea capitis is","o":[["A","A disorder of keratinization."],["B","A disease of adults only."],["C","Staphylococcal infection of the hair follicle."],["D","Always a cause of cicatricial alopecia."],["E","Ringworm of the scalp."]],"a":"E","sa":null,"pg":"32","f":[],"n":2,"e":["Tinea capitis is dermatophyte infection (ringworm) of the scalp and hair. Keratinization disorders are things like psoriasis or ichthyosis; tinea is an infection. Scaly and black-dot types occur in children only, but kerion and favus occur in children and adults. A staphylococcal follicle infection is folliculitis; tinea capitis is fungal. Only kerion and favus scar, and only if untreated; scaly and black-dot types leave no scar.\nCapitis = scalp.",""],"im":[]},{"id":"Q190","ch":"Fungal Infections","q":"Onychomycosis is ringworm of","o":[["A","Scalp."],["B","Beard."],["C","Groin."],["D","Nails."],["E","Trunk."]],"a":"D","sa":null,"pg":"32","f":[],"n":3,"e":["Onychomycosis (tinea unguium) is dermatophyte infection of the nails. Ringworm of the scalp is tinea capitis. Ringworm of the beard is tinea barbae. Ringworm of the groin is tinea cruris. Ringworm of the trunk (hairless skin) is tinea corporis.",""],"im":[]},{"id":"Q191","ch":"Fungal Infections","q":"A 4-year-old child presented with a circumscribed area of hair loss. On examination, short stumps of hairs and scales were seen. The most probable diagnosis is","o":[["A","Alopecia areata."],["B","Tinea capitis (scaly ringworm)."],["C","Discoid lupus erythematosus."],["D","Lichen planus."],["E","Psoriasis."]],"a":"B","sa":null,"pg":"33","f":[],"n":4,"e":["A child with a circumscribed bald patch, broken stumps of hair and fine grayish-white scales has scaly (gray patch) tinea capitis; the hairs break off above the skin. Alopecia areata is smooth and not scaly, with normal-looking scalp skin. DLE gives scarring, atrophic, scaly plaques and is rare in young children. Lichen planus (planopilaris) is an adult disease that scars the scalp. Psoriasis gives thick silvery plaques without breaking of hairs into stumps.\nShort stumps + scales.",""],"im":[]},{"id":"Q192","ch":"Fungal Infections","q":"A scaly patch on the scalp with hair loss in a child is characteristic of","o":[["A","Alopecia areata."],["B","Ringworm of scalp."],["C","Telogen effluvium."],["D","DLE."],["E","Tinea versicolor."]],"a":"B","sa":null,"pg":"33","f":[],"n":5,"e":["A scaly bald patch in a child is scaly ringworm of the scalp (tinea capitis), where loose hairs break off and leave fine grayish-white scales. Alopecia areata has smooth skin with no scaling. Telogen effluvium is diffuse, non-scaly shedding, not a patch. DLE causes scarring plaques, mostly in adults. Tinea versicolor is on the trunk and never involves hair.\nChild + scaly bald patch.",""],"im":[]},{"id":"Q193","ch":"Fungal Infections","q":"Scaly type of tinea capitis","o":[["A","Is associated with hair loss."],["B","Causes scarring."],["C","Is a non-infectious disease."],["D","Affects children & adults."],["E","Is treated by oral nystatin."]],"a":"A","sa":null,"pg":"33","f":[],"n":6,"e":["In the scaly type the hairs break off, leaving single or multiple bald patches with fine grayish-white scales; there is no scar. The course is 'no scar'; only kerion and favus scar if not treated early. It is an infectious (contagious) dermatophyte infection. The scaly type occurs in children only. Nystatin acts on yeasts (Candida), not dermatophytes; use griseofulvin, terbinafine or azoles.\nHair loss, no scar.",""],"im":[]},{"id":"Q194","ch":"Fungal Infections","q":"Which of the following is a characteristic of scaly scalp ringworm?","o":[["A","More frequent occurrence in childhood."],["B","Is a cause of permanent alopecia."],["C","Ability to invade the dermis."],["D","Ability to invade other organs."],["E","Sensitivity to penicillin."]],"a":"A","sa":null,"pg":"33","f":[],"n":7,"e":["Scaly ringworm of the scalp is typically a childhood disease (children only). The scaly type leaves no scar, so alopecia is not permanent. Dermatophytes stay in the stratum corneum, hair and nails and do not invade the dermis. The infection is superficial and does not spread to other organs. It is fungal, so penicillin has no effect; use griseofulvin, terbinafine or azoles.\nChild disease.",""],"im":[]},{"id":"Q195","ch":"Fungal Infections","q":"Kerion","o":[["A","Is a boggy swelling simulating an abscess."],["B","Is a disease of adults only."],["C","Is a staphylococcal infection of the hair follicle."],["D","Is associated with systemic manifestations."],["E","Never leads to cicatricial alopecia."]],"a":"A","sa":null,"pg":"33","f":[],"n":8,"e":["Kerion is a boggy swelling studded with follicular pustules that mimics a bacterial abscess; incision and antibiotics worsen it and increase scarring. Kerion affects both children and adults. It is a dermatophyte (fungal) infection, which is why antibiotics fail. It is a local inflammatory reaction; systemic manifestations are not a defining feature. It can end in cicatricial alopecia if not treated early.\nKerion = fungal abscess-like.",""],"im":[]},{"id":"Q196","ch":"Fungal Infections","q":"Kerion is:","o":[["A","Staphylococcal infection of the hair follicle."],["B","Associated with systemic manifestations."],["C","A disease which never leads to cicatricial alopecia."],["D","All of the above."],["E","None of the above."]],"a":"E","sa":null,"pg":"33","f":[],"n":9,"e":["None of the statements is true: kerion is fungal, is a local boggy swelling rather than a systemic illness, and can scar. It is a dermatophyte infection, not staphylococcal. The picture is local (boggy swelling with pustules); systemic manifestations are not a feature. It can lead to cicatricial alopecia if treated late. All three statements are false.\nKerion can scar.",""],"im":[]},{"id":"Q197","ch":"Fungal Infections","q":"A child presents with an area of boggy, tender swelling studded with follicular pustules on the scalp, with patchy hair loss; it did not improve with antibiotics and may lead to scarring alopecia. The most likely diagnosis is:","o":[["A","Ecthyma."],["B","Favus."],["C","Discoid lupus erythematosus."],["D","Kerion."],["E","Seborrheic dermatitis."]],"a":"D","sa":null,"pg":"33","f":[],"n":10,"e":["Boggy swelling with follicular pustules that does not respond to antibiotics and may scar is kerion (inflammatory dermatophyte reaction). Ecthyma is a punched-out crusted ulcer, usually on the legs, not a boggy scalp swelling. Favus has yellow cup-shaped crusts (scutula), not a boggy swelling. DLE gives atrophic scarring plaques, not pustules and boggy swelling. Seborrheic dermatitis gives greasy scales without swelling or pustules.\nKerion → scarring risk.",""],"im":[]},{"id":"Q198","ch":"Fungal Infections","q":"One of the following may cause cicatricial alopecia","o":[["A","Androgenetic alopecia."],["B","Telogen effluvium."],["C","Alopecia areata."],["D","Kerion."],["E","Scaly ringworm."]],"a":"D","sa":null,"pg":"33","f":[],"n":11,"e":["Kerion can heal with scarring (cicatricial alopecia) if not treated early; favus does too. Androgenetic alopecia is patterned and non-scarring. Telogen effluvium is diffuse reversible shedding. Alopecia areata is non-scarring. Scaly ringworm leaves no scar.\nKerion, favus scar.",""],"im":[]},{"id":"Q199","ch":"Fungal Infections","q":"Scutula is the characteristic lesion of","o":[["A","Scaly ringworm."],["B","Black-dot ringworm."],["C","Favus."],["D","Kerion."],["E","None of the above."]],"a":"C","sa":null,"pg":"33","f":[],"n":12,"e":["Scutula (yellow cup-shaped sulfur crusts around hairs) are the characteristic lesion of favus. Scaly type shows fine grayish-white scales. Black-dot type shows hairs broken at the skin surface as black dots. Kerion is a boggy swelling with pustules. Scutula do belong to one of the types: favus.\nScutula = favus.",""],"im":[]},{"id":"Q200","ch":"Fungal Infections","q":"A child presents with an area of thick yellow cup-shaped crusts surrounding hair shafts on the scalp, associated with scarring alopecia. The most likely diagnosis is:","o":[["A","Tinea corporis."],["B","Favus."],["C","Discoid lupus erythematosus."],["D","Impetigo."],["E","Seborrheic dermatitis."]],"a":"B","sa":null,"pg":"33","f":[],"n":13,"e":["Thick yellow cup-shaped crusts around hair shafts with scarring alopecia are scutula of favus. Tinea corporis affects hairless skin, not the scalp. DLE scars but has no cup-shaped crusts around hairs. Impetigo has honey-colored crusts and does not cause scarring alopecia. Seborrheic dermatitis gives greasy scales and no scarring.\nFavus scars.",""],"im":[]},{"id":"Q201","ch":"Fungal Infections","q":"Case 6: A female patient, 10 years old, presented with scaly plaques on her scalp of two months duration. Lesions started by a gradual onset and a progressive course and ended by almost complete loss of scalp hair. (Clinical photo: scalp covered with yellowish cup-shaped crusts with hair loss.) The sign seen in the photo is","o":[["A","Wheal."],["B","Papule."],["C","Scutula."],["D","Comedone."],["E","Burrow."]],"a":"C","sa":null,"pg":"33","f":[],"n":14,"e":["The picture is favus: yellow cup-shaped crusts (scutula) around loose hairs, ending in diffuse hair loss replaced by fibrous tissue. A wheal is the transient edema of urticaria. A papule is a small solid elevation, not a cup-shaped crust. A comedone is the primary lesion of acne. A burrow is the primary lesion of scabies.\nScutula = favus.",""],"im":[]},{"id":"Q202","ch":"Fungal Infections","q":"Case 6: A female patient, 10 years old, presented with scaly plaques on her scalp of two months duration. Lesions started by a gradual onset and a progressive course and ended by almost complete loss of scalp hair. (Clinical photo: scalp covered with yellowish cup-shaped crusts with hair loss.) Regarding this disease, choose the correct statement","o":[["A","Is a superficial bacterial infection."],["B","Is a deep parasitic infection."],["C","Is a cause of cicatricial alopecia."],["D","Affects children only."],["E","Treated by topical ivermectin 1%."]],"a":"C","sa":null,"pg":"33","f":[],"n":15,"e":["Favus is a fungal infection of the scalp that heals with scarring (cicatricial alopecia). It is fungal, not bacterial. It is superficial and fungal, not a deep parasitic infection. Favus occurs in children and adults. Ivermectin is antiparasitic; favus needs systemic antifungals.\nFavus scars.",""],"im":[]},{"id":"Q203","ch":"Fungal Infections","q":"Wood's light is used in the diagnosis of","o":[["A","Tinea versicolor."],["B","Erythrasma."],["C","Favus."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"34","f":[],"n":16,"e":["Wood's light shows yellow fluorescence in tinea versicolor, coral red in erythrasma and yellowish-green in favus (and black-dot type), so all are diagnosed with it.\nVersicolor, erythrasma, favus.",""],"im":[]},{"id":"Q204","ch":"Fungal Infections","q":"Case 3: A female patient, 19 years old, presented with an annular well-defined plaque on her forearm. The lesion showed an active border and a clear center. The condition started about 3 weeks ago with a gradual onset and a progressive course. She applied topical antibiotic cream for 2 weeks with no improvement. (Clinical photo: annular plaque with active scaly border and clear center on the forearm.) This plaque is suggestive of","o":[["A","Seborrheic dermatitis."],["B","Irritant dermatitis."],["C","Scabies."],["D","Tinea circinata."],["E","Tinea versicolor."]],"a":"D","sa":null,"pg":"34","f":[],"n":17,"e":["A well-defined annular plaque with an active edge and clear center is tinea corporis (circinata). Seborrheic dermatitis is greasy scaling in seborrheic areas without an active edge. Irritant dermatitis has no advancing edge with central clearing. Scabies shows burrows and nocturnal itching. Tinea versicolor is branny macules on the trunk without an active border.\nRing edge + clear center.",""],"im":[]},{"id":"Q205","ch":"Fungal Infections","q":"Case 3: A female patient, 19 years old, presented with an annular well-defined plaque on her forearm. The lesion showed an active border and a clear center. The condition started about 3 weeks ago with a gradual onset and a progressive course. She applied topical antibiotic cream for 2 weeks with no improvement. (Clinical photo: annular plaque with active scaly border and clear center on the forearm.) The following drug is used for treatment","o":[["A","Systemic antibiotic."],["B","Topical steroid."],["C","Systemic ivermectin."],["D","Topical permethrin."],["E","Topical azole."]],"a":"E","sa":null,"pg":"37","f":[],"n":18,"e":["Localized tinea corporis is treated with topical azole or terbinafine creams; systemic drugs are kept for extensive or resistant cases. The cause is fungal, so antibiotics do not help. Topical steroid suppresses inflammation and lets the fungus spread. Ivermectin is for scabies. Permethrin is for scabies and lice.",""],"im":[]},{"id":"Q206","ch":"Fungal Infections","q":"Which systemic treatment is used in treatment of tinea corporis?","o":[["A","Terbinafine."],["B","Ivermectin."],["C","Corticosteroids."],["D","Acitretin."],["E","Psoralen."]],"a":"A","sa":null,"pg":"37","f":[],"n":19,"e":["Systemic terbinafine (also griseofulvin and azoles) is used for extensive or resistant tinea corporis. Ivermectin treats parasites. Corticosteroids worsen fungal infection. Acitretin is a retinoid for psoriasis. Psoralen is used with UVA (PUVA) for psoriasis and vitiligo.",""],"im":[]},{"id":"Q207","ch":"Fungal Infections","q":"A 45-year-old farmer presents with scaly erythematous patches on the groin with an active, raised border and central clearing. What is the most likely diagnosis?","o":[["A","Tinea cruris."],["B","Candidal intertrigo."],["C","Pityriasis rosea."],["D","Seborrheic dermatitis."],["E","Erythrasma."]],"a":"A","sa":null,"pg":"35","f":[],"n":20,"e":["Scaly erythematous patches in the groin with an active raised border and central clearing are tinea cruris. Candidal intertrigo has satellite lesions and pustules without central clearing. Pityriasis rosea is on the trunk with a herald patch. Seborrheic dermatitis has greasy scales without central clearing. Erythrasma is well-defined brown patches with no active border.",""],"im":[]},{"id":"Q208","ch":"Fungal Infections","q":"Case 2: A female patient, 33 years old, presented with an extending plaque on her inner thighs. The condition started about 2 months ago with a gradual onset and a progressive course. She applied a topical antibiotic cream for 2 weeks with no improvement. (Clinical photo: annular erythematous plaque with active border on the inner thigh.) What is the diagnosis of this case?","o":[["A","Tinea manuum."],["B","Tinea unguium."],["C","Tinea cruris."],["D","Crusted scabies."],["E","Circinate impetigo."]],"a":"C","sa":null,"pg":"35","f":[],"n":21,"e":["An extending plaque in the groin/inner thigh that failed a topical antibiotic is tinea cruris. Tinea manuum is ringworm of the palm. Tinea unguium is nail infection. Crusted scabies is thick crusts with intense itching, in immunosuppressed patients. Circinate impetigo is bacterial and would respond to the antibiotic.\nSpares the scrotum.",""],"im":[]},{"id":"Q209","ch":"Fungal Infections","q":"Case 2: A female patient, 33 years old, presented with an extending plaque on her inner thighs. The condition started about 2 months ago with a gradual onset and a progressive course. She applied a topical antibiotic cream for 2 weeks with no improvement. (Clinical photo: annular erythematous plaque with active border on the inner thigh.) Which medication will benefit the patient?","o":[["A","Oral terbinafine."],["B","Topical corticosteroids."],["C","Oral ivermectin."],["D","Topical psoralen."],["E","Oral antibiotics."]],"a":"A","sa":null,"pg":"37","f":[],"n":22,"e":["The failed topical antibiotic points to a fungal cause. The book gives topical azoles/terbinafine for tinea cruris and systemic therapy for extensive or resistant cases; of the options, only terbinafine is an antifungal. Topical corticosteroids worsen tinea. Ivermectin is antiparasitic. Psoralen is used for phototherapy. Antibiotics do not treat fungi, and she already failed one.",""],"im":[]},{"id":"Q210","ch":"Fungal Infections","q":"Tinea cruris may be confused with","o":[["A","Flexural psoriasis."],["B","Erythrasma."],["C","Candidal intertrigo."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"35","f":[],"n":23,"e":["The differential of tinea cruris includes candidiasis, flexural psoriasis, seborrheic dermatitis and erythrasma, so all options apply.\nDD: psoriasis, erythrasma, candida.",""],"im":[]},{"id":"Q211","ch":"Fungal Infections","q":"All of the following are part of the differential diagnosis of tinea cruris EXCEPT:","o":[["A","Candidiasis."],["B","Seborrheic dermatitis."],["C","Erythrasma."],["D","Flexural psoriasis."],["E","Leprosy."]],"a":"E","sa":null,"pg":"35","f":[],"n":24,"e":["Leprosy is not a scaly intertriginous eruption and is not in the differential of tinea cruris. Candidiasis is in the differential. Seborrheic dermatitis is in the differential. Erythrasma is in the differential. Flexural psoriasis is in the differential.\nLeprosy no.",""],"im":[]},{"id":"Q212","ch":"Fungal Infections","q":"Flexural areas may be affected in","o":[["A","Psoriasis."],["B","Candidiasis."],["C","Dermatophytosis."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"35","f":[],"n":25,"e":["Flexures are affected by candidal intertrigo, flexural psoriasis and tinea cruris, so all options apply.",""],"im":[]},{"id":"Q213","ch":"Fungal Infections","q":"Tinea barbae","o":[["A","Is a viral infection of the beard area."],["B","May be circinate or kerion-like."],["C","Is a bacterial infection of the beard area."],["D","Is a painful vesicular eruption of the beard area."],["E","Responds to oral tetracycline."]],"a":"B","sa":null,"pg":"35","f":[],"n":26,"e":["Tinea barbae is dermatophyte infection of the beard, mostly one-sided on neck or face, either circinate or with pustules like kerion. It is fungal, not viral. Bacterial beard infection is sycosis barbae; tinea barbae is fungal. Painful vesicles in the beard suggest herpes simplex. Tetracycline is antibacterial and will not cure a fungus.\nBeard ringworm.",""],"im":[]},{"id":"Q214","ch":"Fungal Infections","q":"A male patient, 33 years old, complains of an annular lesion with active border and pale center in his beard area, with acute onset and progressive course for two weeks; he took antibiotics with no improvement. The diagnosis is:","o":[["A","Tinea versicolor."],["B","Tinea barbae."],["C","Discoid lupus erythematosus."],["D","Molluscum contagiosum / warts."]],"a":"B","sa":null,"pg":"35","f":[],"n":27,"e":["An annular lesion with an active border and pale center in the beard that fails antibiotics is tinea barbae. Tinea versicolor is on the trunk. DLE is a scarring atrophic plaque, not an annular lesion with an active border. Molluscum or warts are papules, not annular plaques.\nFailed antibiotics.",""],"im":[]},{"id":"Q215","ch":"Fungal Infections","q":"Tinea pedis","o":[["A","Is strictly unilateral."],["B","Commonly involves the space between 1st & 2nd toes."],["C","Is a recurrent disease."],["D","Excessive dryness is a predisposing factor."],["E","Needs repeated washing of the feet."]],"a":"C","sa":null,"pg":"36","f":[],"n":28,"e":["Tinea pedis is a recurrent disease; recurrences are common. It is mostly bilateral. It usually affects the lateral web spaces (4th and 5th toes), not the first and second. Excessive sweating and moisture predispose, not dryness. Moisture promotes it; the feet should be kept dry.",""],"im":[]},{"id":"Q216","ch":"Fungal Infections","q":"Excessive sweating & moisture is a predisposing factor for","o":[["A","Psoriasis."],["B","Pityriasis rosea."],["C","Vitiligo."],["D","Favus."],["E","Tinea pedis."]],"a":"E","sa":null,"pg":"36","f":[],"n":29,"e":["Excessive sweating and moisture predispose to tinea pedis (also diabetes). Psoriasis is not related to moisture. Pityriasis rosea is not related to sweating. Vitiligo is autoimmune. Favus is not moisture dependent.\nMoist feet.",""],"im":[]},{"id":"Q217","ch":"Fungal Infections","q":"Tinea unguium affects","o":[["A","Nail fold."],["B","Nail plate."],["C","Groin."],["D","Joints."],["E","Interdigital space."]],"a":"B","sa":null,"pg":"37","f":[],"n":30,"e":["Tinea unguium involves the nail plate, with yellowish or whitish discoloration, thickening and onycholysis. The nail fold is affected in paronychia, often candidal. Groin involvement is tinea cruris. Joints are not involved. Interdigital spaces are affected in tinea pedis.",""],"im":[]},{"id":"Q218","ch":"Fungal Infections","q":"Tinea unguium affects","o":[["A","Nails."],["B","Joints."],["C","Hair follicle."],["D","Interdigital spaces."],["E","Flexures."]],"a":"A","sa":null,"pg":"37","f":[],"n":31,"e":["Tinea unguium is dermatophyte infection of the nails. Joints are not involved. Hair follicles are involved in tinea capitis and barbae. Interdigital spaces are involved in tinea pedis. Flexures are involved in tinea cruris and candidiasis.",""],"im":[]},{"id":"Q219","ch":"Fungal Infections","q":"The main line of treatment of tinea capitis is","o":[["A","Tincture iodine."],["B","Griseofulvin."],["C","Malathion."],["D","Calcipotriene."],["E","Tetracycline."]],"a":"B","sa":null,"pg":"37","f":[],"n":32,"e":["Systemic griseofulvin (12.5 mg/kg/day for 6-8 weeks) is the backbone of tinea capitis treatment. Tincture iodine is only a topical adjuvant. Malathion treats head lice. Calcipotriene is used in psoriasis. Tetracycline is antibacterial.\nGriseofulvin = systemic.",""],"im":[]},{"id":"Q220","ch":"Fungal Infections","q":"Tinea capitis can be treated TOPICALLY ALONE by","o":[["A","Selenium sulphide."],["B","Castellani's paint."],["C","Tincture iodine."],["D","Imidazole derivatives."],["E","None of the above."]],"a":"E","sa":null,"pg":"37","f":[],"n":33,"e":["Tinea capitis cannot be cured by topical therapy alone because the fungus lies inside the hair, so systemic treatment is the backbone. Selenium sulphide shampoo is only an adjuvant. Castellani paint is used for tinea pedis. Tincture iodine is only an adjuvant. Azole creams cannot reach fungus inside hair.\nSystemic required.",""],"im":[]},{"id":"Q221","ch":"Fungal Infections","q":"An 18-year-old man presents with an oval, itchy area of patchy hair loss in the scalp with scales which appeared 2 weeks after visiting the barber. Which of the following options would be the most appropriate in treating this condition?","o":[["A","Fusidic acid cream."],["B","Acyclovir cream."],["C","Oral acyclovir."],["D","Oral erythromycin."],["E","Oral griseofulvin."]],"a":"E","sa":null,"pg":"37","f":[],"n":34,"e":["Patchy scaly hair loss after a barber visit is tinea capitis, treated with oral griseofulvin. Fusidic acid is antibacterial. Acyclovir cream is antiviral. Oral acyclovir is antiviral. Erythromycin is antibacterial.",""],"im":[]},{"id":"Q222","ch":"Fungal Infections","q":"Given that the dose of griseofulvin is 12.5 mg/kg body weight/day and each tablet is 125 mg, an 80 kg man with extensive tinea cruris will take","o":[["A","5 tablets/day."],["B","9 tablets/day."],["C","7 tablets/day."],["D","8 tablets/day."],["E","6 tablets/day."]],"a":"D","sa":null,"pg":"37","f":[],"n":35,"e":["Dose = 12.5 mg x 80 kg = 1000 mg; 1000 / 125 = 8 tablets daily. 5 tablets = 625 mg, too low. 9 tablets = 1125 mg, too high. 7 tablets = 875 mg, too low. 6 tablets = 750 mg, too low.\n1000 mg ÷ 125 mg = 8.",""],"im":[]},{"id":"Q223","ch":"Fungal Infections","q":"Griseofulvin may be used in the treatment of","o":[["A","Oral thrush."],["B","Tinea versicolor."],["C","Tinea corporis."],["D","Interdigital moniliasis."],["E","Balanitis."]],"a":"C","sa":null,"pg":"37","f":[],"n":36,"e":["Griseofulvin is used in dermatophyte infections such as tinea corporis, but is not effective in yeast infections. Oral thrush is Candida (yeast). Tinea versicolor is Malassezia (yeast). Interdigi
