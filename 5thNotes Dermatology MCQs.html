ionIds":["Q001","Q002","Q004","Q007","Q008","Q010","Q011","Q015","Q016","Q017","Q018","Q019","Q020","Q021","Q024","Q026","Q030","Q036","Q037","Q041","Q043","Q046","Q048","Q051","Q052","Q054","Q534","H011","H021","Q058","Q059","Q061","Q062","Q064","Q066","Q068","Q072","Q073","Q076","Q078","Q079","Q080","Q082","Q083","Q087","Q088","Q090","Q093","Q094","Q095","Q097","Q099","Q100","Q101","Q102","Q103","Q104","Q106","Q111","Q112","Q114","Q116","Q120","Q122","H054","H057","Q129","Q130","Q131","Q132","Q133","Q136","Q137","Q138","Q140","Q142","Q143","Q145","Q146","Q147","Q150","Q152","Q155","Q157","Q159","Q161","Q164","Q165","Q166","Q168","Q169","Q480","Q172","Q174","Q177","Q180","Q182","Q185","Q186","Q537","Q538","H079","H083","H101","H114","Q188","Q190","Q191","Q195","Q198","Q199","Q200","Q203","Q205","Q206","Q209","Q210","Q212","Q213","Q215","Q216","Q217","Q219","Q220","Q222","Q225","Q227","Q231","Q232","Q235","Q238","Q240","Q242","Q245","Q246","Q247","Q248","Q253","H157","Q255","Q258","Q262","Q264","Q265","Q267","Q271","Q272","Q274","Q276","Q277","Q287","Q283","Q285","Q286","Q288","Q289","Q290","H168","Q292","Q295","Q296","Q297","Q299","Q303","Q307","Q309","Q310","Q311","Q312","Q313","Q314","Q315","Q319","Q320","Q322","Q323","Q326","Q328","Q330","Q331","Q335","Q336","Q337","Q338","Q339","Q344","Q348","Q349","Q350","Q354","Q357","Q358","Q361","Q364","Q366","H204","Q370","Q373","Q377","Q543","Q544","H227","Q379","Q381","Q383","Q386","Q387","Q388","Q390","Q391","Q392","Q394","Q395","Q396","Q397","Q398","Q399","Q402","Q404","Q408","Q409","Q410","Q411","Q477","Q413","Q415","Q417","Q419","Q422","Q424","Q425","Q426","Q427","Q428","Q429","Q430","Q431","Q432","Q433","Q435","Q436","Q546","H232","H256","H279","Q438","Q441","Q442","Q444","Q445","Q446","Q449","Q451","Q454","Q457","Q458","Q459","Q460","H340","Q462","Q468","Q469","Q472","Q474","Q475","Q478","Q479","Q482","Q483","Q484","Q486","Q487","Q488","Q493","Q495","Q496","Q497","Q499","H292","Q506","Q509","Q510","Q518","Q512","Q516","Q519","Q522","Q523","Q524","Q525","Q526","Q528","Q532","Q533","H318","H328"],"color":"e09a28","concepts":[]}],"notes":{"systems":[{"n":"Introduction To Dermatology","topics":[{"n":"Skin structure and function","facts":[{"t":"The **epidermis** is the outermost skin layer; its layers from deep to superficial are **basal → prickle (squamous) → granular → horny (stratum corneum)**, with a clear layer (lucidum) only on palms and soles.","q":["Q001","Q004","Q005","Q006","Q009"]},{"t":"**Keratinocytes** make up about 90% of epidermal cells and produce keratin; the **stratum corneum** is formed of flat, anucleate keratinized cells (corneocytes). Keratin is the structural protein of skin, hair and nails.","q":["Q002","Q003","Q007","H007"]},{"t":"The **basal layer** holds the germinative (stem) keratinocytes that renew the epidermis (turnover about 28 days).","q":["Q008"]},{"t":"Other epidermal cells: **melanocytes** (pigment), **Langerhans cells** (antigen-presenting; the immune function of the skin) and **Merkel cells** (basal layer; slowly adapting mechanoreceptors for gentle touch and pressure).","q":["Q002","Q010","Q534","H012"]},{"t":"**Skin appendages** are hair follicles, sebaceous glands, sweat glands (eccrine and apocrine) and nails; melanocytes, blood vessels and nerves are NOT appendages. The **pilosebaceous unit** (hair follicle + sebaceous gland) is the site of acne.","q":["Q011","Q012","Q013","Q014","Q015"]},{"t":"**Eccrine sweat glands** cover the whole body and control temperature by evaporation; **apocrine glands** are scent glands (axilla, groin).","q":["Q016"]},{"t":"Skin functions: protection, thermoregulation, sensation, secretion, excretion, immunity and **endocrine** activity (UVB converts 7-dehydrocholesterol into **vitamin D3**).","q":["Q017","Q018","Q019","Q020"]},{"t":"A full cutaneous examination covers skin, hair, nails and mucous membranes.","q":["H011"]}]},{"n":"Primary lesions","facts":[{"t":"**Macule**: flat, non-palpable colour change <1 cm; the same change >1 cm is a **patch** (e.g. vitiligo, pityriasis versicolor).","q":["Q022","Q023","Q024","H013"]},{"t":"**Papule**: solid palpable elevation <1 cm (e.g. warts); the classic papular disease is **lichen planus** (flat-topped, polyangular, violaceous, itchy, shiny).","q":["Q025","Q026","Q027","Q028","Q029"]},{"t":"**Plaque**: palpable flat-topped lesion >1 cm with abnormal skin texture, often from coalescing papules, mainly epidermal (e.g. psoriasis).","q":["Q030","Q031","H015"]},{"t":"**Nodule**: solid lesion >1 cm with a deep component in the dermis or subcutis (a dermal lesion, unlike the plaque).","q":["Q032","Q033","Q035","Q036"]},{"t":"**Wheal**: transient (evanescent) oedematous, erythematous or skin-coloured elevation of variable size from dermal oedema (histamine); the primary lesion of **urticaria**.","q":["Q037","Q038","Q039","Q040","Q055"]},{"t":"**Vesicle** (<0.5 cm) and **bulla** (>0.5 cm) are fluid-filled and differ by size; a **cyst** has a true epithelial wall, whereas a bulla has no wall.","q":["Q041","Q042","Q043","Q044","H019"]},{"t":"**Burrow**: linear tunnel in the stratum corneum dug by the fertilized female *Sarcoptes scabiei*; the diagnostic lesion of **scabies**. A **furrow** is a deroofed burrow.","q":["Q045","Q046","Q047","H021"]}]},{"n":"Secondary lesions","facts":[{"t":"A **crust** is a secondary lesion (primary lesions arise first: macule, papule, plaque, nodule, vesicle, bulla, pustule, wheal, cyst); it is dried serum, blood or pus (e.g. after herpes simplex vesicles, healing without scar).","q":["Q021","Q048","Q049"]},{"t":"**Scales** are laminated masses of keratin from increased proliferation (psoriasis) or decreased desquamation (ichthyosis).","q":["Q050","Q051","H023"]},{"t":"**Erosion** = loss of epidermis only (after rupture of vesicles/bullae), heals without scar; **ulcer** = loss of epidermis and dermis, heals with scar (e.g. ecthyma).","q":["Q052","Q053"]},{"t":"**Lichenification** = thickened skin with accentuated lines from chronic scratching.","q":["Q054"]}]}]},{"n":"Bacterial Infections","topics":[{"n":"Impetigo and ecthyma","facts":[{"t":"**Impetigo** is a superficial infection by *Staphylococcus aureus* and/or group A β-haemolytic streptococci; the lesion is a vesicle/pustule that ruptures to leave a **golden honey-coloured crust** on an erythematous base. Localized disease is treated with a **topical antibiotic** (fusidic acid, mupirocin).","q":["Q058","Q059","Q062"]},{"t":"Streptococcal impetigo can lead to **post-streptococcal acute glomerulonephritis** (not rheumatic fever).","q":["Q060","Q061"]},{"t":"**Bullous impetigo** is staphylococcal: *S. aureus* **exfoliative toxin** splits the upper epidermis, giving flaccid blisters; typical in neonates/infants, spreads by contact, is a superficial infection and heals without scarring.","q":["Q063","Q064","Q065","Q066","Q067","H028","H041","H042"]},{"t":"**Ecthyma** is **ulcerative impetigo**: a deep, streptococcal variant extending into the dermis (vesicle → pustule → thick crust → punched-out ulcer) that heals **with scar** and needs **systemic antibiotics**. Clinical types of impetigo: non-bullous, bullous, ulcerative (ecthyma).","q":["Q068","Q069","Q070","Q071","Q072","Q073","Q074","Q075"]},{"t":"Not bacterial infections: **kerion** (inflammatory tinea capitis) and **acne vulgaris** (a pilosebaceous inflammatory disease, although *C. acnes* contributes).","q":["Q056","Q057"]}]},{"n":"Follicular infections","facts":[{"t":"**Folliculitis** = staphylococcal infection of the upper (superficial) part of the follicle; **furuncle** (boil) = suppurative infection of the lower follicle with a central necrotic core (furunculosis when recurrent).","q":["Q076","Q077","Q078"]},{"t":"**Carbuncle** = coalescing deep furuncles draining through multiple openings (a large, indurated, painful plaque, typically on the back of the neck); caused by *S. aureus*, commoner in **diabetic** males and nasal carriers.","q":["Q079","Q080","Q081"]}]},{"n":"Erysipelas","facts":[{"t":"**Erysipelas** is a group A streptococcal infection of the **upper dermis and superficial lymphatics**: a sharply demarcated, hot, tender, raised red plaque with fever (deeper involvement = cellulitis); treated with penicillin.","q":["Q082","Q083","H037","Q088","Q089","Q090","Q091"]},{"t":"**Lymphoedema** both predisposes to and results from recurrent erysipelas (scarring of lymphatics); it is the commonest complication, with glomerulonephritis also reported.","q":["Q084","Q085","Q086","Q087"]}]},{"n":"Erythrasma","facts":[{"t":"**Erythrasma** is caused by *Corynebacterium minutissimum*: brown-red scaly patches in intertriginous areas (axillae, groins, submammary), commoner in obese/diabetic patients; treated with erythromycin.","q":["Q093","Q094","Q095"]},{"t":"Porphyrins of *C. minutissimum* give **coral-red fluorescence** under **Wood's light** (versicolor fluoresces yellow); Wood's light also helps in diagnosing erythrasma and pityriasis versicolor.","q":["Q092","Q096","Q097","Q098"]}]}]},{"n":"Mycobacterial Infections","topics":[{"n":"Leprosy: basics and diagnosis","facts":[{"t":"**Leprosy (Hansen's disease)** is caused by *Mycobacterium leprae*, which mainly affects **skin and peripheral nerves**; its target cell is the **Schwann cell**, causing neuropathy and anaesthesia. Typical presentation: hypopigmented lesions with numbness.","q":["Q099","Q101","Q109","H057"]},{"t":"The clinical form depends on the patient's **cell-mediated immunity** (not humoral): high immunity → **paucibacillary (tuberculoid)** with few bacilli; poor immunity → **multibacillary (lepromatous)**; borderline forms lie between.","q":["Q102","Q103","Q104","H056","H061"]},{"t":"Diagnosis: **slit-skin smear** (modified Ziehl-Neelsen), skin or nerve biopsy (and nasal smears, PCR); the lepromin test is not diagnostic.","q":["Q115","H054","H053"]}]},{"n":"Tuberculoid versus lepromatous leprosy","facts":[{"t":"**Tuberculoid leprosy** (good immunity, paucibacillary, best prognosis): few well-defined, **hypopigmented, hairless, anaesthetic** patches/plaques; **nerve involvement is early**, asymmetric and severe.","q":["Q105","Q106","Q107","Q108","Q110","Q111","Q112","Q113","H067"]},{"t":"**Lepromatous leprosy** (poor immunity, multibacillary): symmetrical widespread glistening papules, nodules and plaques with thickened nodular ears, diffuse facial infiltration (**leonine facies**) and **loss of the outer third of the eyebrows**.","q":["Q114","Q119","Q120","Q121","Q123","H071"]},{"t":"Lepromatous leprosy also involves **mucous membranes** (nasal infiltration → **epistaxis**, septal destruction), eyes, kidneys, liver, bones and testes; nerve involvement is **late** but extensive (glove-and-stocking anaesthesia of cold areas).","q":["Q116","Q117","Q118","Q122","H051","H072"]}]},{"n":"Leprosy treatment","facts":[{"t":"**Dapsone** is the backbone of treatment of all types of leprosy, given daily in **WHO multidrug therapy** with rifampicin ± clofazimine (at least 6 months for paucibacillary, 12 months for multibacillary); retinoids, methotrexate and tetracyclines are not anti-leprotic.","q":["Q100","Q124","Q125","H053","H055"]}]}]},{"n":"Viral Infections","topics":[{"n":"Viral skin infections: general","facts":[{"t":"Viral skin diseases: herpes simplex, varicella/zoster, warts (HPV) and molluscum (pox virus); **impetigo is bacterial**. **VZV, HSV and *M. leprae*** are neurotropic, whereas **HPV and pox virus** infect epithelium and are not.","q":["Q126","Q127","Q128","H083"]},{"t":"Sexually transmitted skin diseases: **genital herpes, condyloma acuminata and genital molluscum contagiosum**; eczema herpeticum is a complication of HSV, not an STD.","q":["Q139","Q183","Q184","Q185","Q186","Q187"]}]},{"n":"Herpes simplex","facts":[{"t":"**Herpes simplex** is genital and non-genital (lips, face, fingers, eye), classically at the **mucocutaneous junction**: grouped vesicles on an erythematous base preceded by burning/tingling. HSV stays latent in the sensory (trigeminal/dorsal root) ganglion, so **herpes labialis recurs** (triggers: stress, UV, fever, menstruation); **neuralgia is not a feature**.","q":["Q129","Q130","Q131","Q132","Q133","Q135","Q136","H103","H113"]},{"t":"**Herpes progenitalis**: grouped painful vesicles/erosions on the genitalia (usually HSV-2, recurrent); active genital herpes at delivery is an indication for **caesarean section** to protect the neonate.","q":["Q137","Q138","H101"]},{"t":"**Herpetic whitlow** = HSV of the finger; HSV can also cause **keratitis** (eye) and encephalitis.","q":["Q140","Q141","Q142"]},{"t":"Complications of HSV: **erythema multiforme** (the commonest trigger), eczema herpeticum, corneal ulcers and CNS involvement.","q":["Q134","Q142"]},{"t":"**Tzanck smear** shows multinucleated giant cells in herpes simplex (and in zoster/varicella).","q":["Q143"]}]},{"n":"Varicella and herpes zoster","facts":[{"t":"**Chickenpox** is the primary VZV infection (childhood), with vesicles also on the oral mucosa; the virus stays latent in posterior root ganglia and reactivates as **herpes zoster**. Treatment: early antiviral (acyclovir) and vaccine prophylaxis.","q":["Q144","Q145","Q146","Q537"]},{"t":"**Herpes zoster**: **unilateral, painful grouped vesicles** on an erythematous base along a dermatome; usually not recurrent and gives solid immunity after one attack.","q":["Q147","Q148","Q149","H079","H114"]},{"t":"**Post-herpetic neuralgia** (long-standing pain) is the common complication, more frequent in the **elderly**; early antivirals and vaccination reduce the risk.","q":["Q150","Q151"]},{"t":"Zoster is treated with **oral acyclovir 800 mg 5 times daily for 7 days**, started within 48 hours (valacyclovir and famciclovir are alternatives; analgesics/gabapentin for pain); 200 mg five times daily is the herpes simplex dose.","q":["Q152","Q153","Q154","Q538"]}]},{"n":"Warts (HPV)","facts":[{"t":"**Warts** are benign epithelial growths caused by **human papillomavirus** (DNA virus, over 200 genotypes), spread by skin contact or fomites; they may involve mucous membranes (e.g. genital warts).","q":["Q155","Q156","Q157","Q158"]},{"t":"Types: **verruca vulgaris** (hyperkeratotic skin-coloured papules on hands/fingers), **plane warts** (multiple flat-topped papules, often on a child's face) and **plantar warts** (grow inward, tender, painful on walking).","q":["Q160","Q161","Q162","Q163","Q164","H102","H104"]},{"t":"**Condyloma acuminata** (genital warts): soft, pinkish, moist exophytic papules of the genital/perianal skin and mucosa; **HPV 16 and 18** are oncogenic and linked to **cervical cancer**.","q":["Q159","Q166","Q167","H082","H084"]},{"t":"Warts are treated by **destruction**: cryotherapy, electrocautery, chemical cautery (salicylic acid), laser; **intralesional steroids and PUVA are not used**. Plantar warts: cryotherapy.","q":["Q165","Q169","Q170","Q171","Q174"]},{"t":"Genital warts: **podophyllin resin 10-25%** (weekly, washed off after 1-4 h), imiquimod, cryotherapy or laser; **podophyllin is contraindicated in pregnancy** and in large bleeding warts (use laser, cryotherapy or electrocautery instead).","q":["Q168","Q172","Q173"]}]},{"n":"Molluscum contagiosum","facts":[{"t":"**Molluscum contagiosum** is caused by a **pox virus**: firm, **pearly umbilicated papules** from which white cheesy material can be expressed; spread by skin contact (an STD when genital).","q":["Q175","Q176","Q177","Q178","Q179","Q180","Q181"]},{"t":"Molluscum is treated by curettage, cautery, cryotherapy, laser or chemicals; **steroids are not used**.","q":["Q182","Q174"]}]}]},{"n":"Fungal Infections","topics":[{"n":"Dermatophytosis (tinea): general and treatment","facts":[{"t":"**Dermatophytes** are keratin-loving fungi that infect the stratum corneum of glabrous skin, **hair and nails**; sites: tinea capitis (scalp), corporis, cruris, barbae, pedis, manuum and **onychomycosis/tinea unguium** (nail plate: discoloration, thickening, onycholysis).","q":["Q188","Q189","Q190","Q217","Q218","H136"]},{"t":"**Griseofulvin** is the drug of choice for dermatophytes (tinea capitis, corporis, cruris) but is **ineffective against yeasts** (*Candida*, *Malassezia*/versicolor); dose 12.5 mg/kg/day (e.g. 80 kg = 1000 mg = 8 × 125 mg tablets). Terbinafine and azoles are alternatives.","q":["Q219","Q222","Q223","Q224","Q225","Q226","Q227","H123"]}]},{"n":"Tinea capitis, kerion and favus","facts":[{"t":"**Scaly tinea capitis**: round scaly bald patch with broken hair stumps and grey scales; **children only** (resolves at puberty), no scarring; fluoresces **yellow-green** under Wood's light (Microsporum).","q":["Q191","Q192","Q193","Q194","Q254","H157"]},{"t":"**Systemic griseofulvin** is the backbone of tinea capitis treatment (6-8 weeks); topical treatment alone cannot cure it because the fungus lies inside the hair.","q":["Q219","Q220","Q221"]},{"t":"**Kerion**: inflammatory, boggy, tender, abscess-like swelling studded with follicular pustules (zoophilic fungi), not improved by antibiotics; may cause **cicatricial alopecia** if not treated early.","q":["Q195","Q196","Q197","Q198","H120","H146","H156"]},{"t":"**Favus**: thick yellow cup-shaped crusts (**scutula**) around hairs, causes **scarring (cicatricial) alopecia**; occurs in children and adults.","q":["Q199","Q200","Q201","Q202","H128"]},{"t":"**Wood's light** fluorescence: versicolor = **yellow**; erythrasma = **coral red**; favus/scalp ringworm = **yellow-green**.","q":["Q203","H133","Q238","Q239"]}]},{"n":"Tinea corporis, cruris, barbae and pedis","facts":[{"t":"**Tinea corporis (circinata)**: annular plaque with active scaly/vesicular edge and clearing centre; localized disease → **topical azoles/terbinafine**; extensive or resistant → systemic terbinafine, azoles or griseofulvin.","q":["Q204","Q205","Q206"]},{"t":"**Tinea cruris**: scaly erythematous groin patch with active raised border and central clearing, sparing the scrotum; extensive disease → oral terbinafine. Differential: **flexural psoriasis, erythrasma, candidal intertrigo** (not leprosy).","q":["Q207","Q208","Q209","Q210","Q211","Q212","H145"]},{"t":"**Tinea barbae**: annular lesion with active border in the beard (farm animals, barber instruments), may be circinate or kerion-like; unresponsive to antibiotics.","q":["Q213","Q214","H155"]},{"t":"**Tinea pedis** (athlete's foot) is common and recurrent; sweating and moisture are predisposing factors.","q":["Q215","Q216"]}]},{"n":"Pityriasis (tinea) versicolor","facts":[{"t":"**Pityriasis versicolor** is caused by the lipophilic yeast ***Malassezia furfur*** (not a dermatophyte); favoured by heat, humidity, oily skin and sweating; recurs in summer.","q":["Q228","Q229","Q230","Q231","Q237"]},{"t":"Clinical picture: asymptomatic hypo-/hyperpigmented (or erythematous) macules with **fine branny scales** on the upper trunk, neck and breasts; more obvious after tanning because the patches do not tan.","q":["Q232","Q233","Q234","Q235","Q236","H140"]},{"t":"Diagnosis: **yellow fluorescence** on Wood's light; KOH shows short thick hyphae with round spores (**\"spaghetti and meatballs\"**).","q":["Q238","Q239","Q240","Q241"]},{"t":"Treatment: **topical azoles** or selenium sulfide/ketoconazole shampoo; systemic fluconazole/itraconazole for extensive disease; **griseofulvin and terbinafine do not work**.","q":["Q241","Q242","Q243","Q244"]}]},{"n":"Candidiasis","facts":[{"t":"*Candida albicans* causes **oral thrush** (whitish pseudomembrane in infants, debilitated adults, HIV; nystatin), **perleche**, intertrigo, interdigital candidiasis (commonly between the **middle and ring fingers**), napkin dermatitis and chronic paronychia. **Favus, kerion and erythrasma are not candidal.**","q":["Q245","Q246","Q247","Q248","Q249","Q250","Q251","Q252"]},{"t":"**Candidal paronychia** (chronic, red swollen nail fold in wet-work occupations) is treated with **fluconazole** and avoidance of moisture.","q":["Q253"]}]}]},{"n":"Parasitic Infestations","topics":[{"n":"Scabies: diagnosis","facts":[{"t":"**Scabies** is a contagious infestation by the fertilized female mite ***Sarcoptes scabiei***; the primary lesion is the **burrow**. Cardinal symptom: intense generalized **nocturnal itching** (worse when warm), often with a family history; lesions are burrows, papules and excoriations, **not scales**.","q":["Q255","Q256","Q257","Q258","Q260","Q264","Q265","Q542","H176"]},{"t":"Adult sites: **finger webs and sides, wrists, elbows, axillae, waist, lower abdomen, genitalia, buttocks and feet**; adults spare the head, neck, palms/soles and **upper back**. Scabies is a cause of pubic itching (with pediculosis pubis).","q":["Q261","Q262","Q263","H163"]},{"t":"In **infants** scabies also involves the **face, palms and soles**, with vesicles, pustules, exudation and secondary impetiginization.","q":["Q266","Q267","Q268","Q269","Q270","Q291","H162"]}]},{"n":"Scabies: variants and treatment","facts":[{"t":"**Post-scabietic (nodular) scabies**: intensely itchy nodules, typically on the scrotum/genitalia and axillae, persisting after successful treatment because they are a **hypersensitivity reaction**; treated with **intralesional corticosteroids**.","q":["Q271","Q272","Q273","Q274"]},{"t":"**Animal scabies**: short incubation, **no burrows**, urticarial, self-limited once the animal is avoided, and **not transmitted human-to-human**.","q":["Q275","Q276"]},{"t":"Scabies treatment: **permethrin 5%** (safe in pregnancy, breast-feeding and infants >2 months; applied to the whole skin and repeated after a week), benzyl benzoate, sulphur, crotamiton or ivermectin; **all family members/close contacts must be treated** even if asymptomatic. Benzoyl peroxide is an acne drug.","q":["Q267","Q277","Q278","Q279","Q280","Q281"]}]},{"n":"Pediculosis","facts":[{"t":"**Pediculosis capitis** (*Pediculus humanus capitis*, blood-sucking louse): itchy scalp with excoriations; **nits are eggs firmly cemented to the hair shaft** (unlike dandruff); spread by head contact and by combs, brushes and hats.","q":["Q282","Q283","Q284","Q285","H173"]},{"t":"Head lice treatment: **permethrin 5%** (repeat after a week because eggs survive), malathion 0.5% lotion, dimethicone or topical ivermectin 0.5%; antifungals and podophyllin are not used.","q":["Q286","Q287","Q288","H168"]},{"t":"***Phthirus pubis*** (pubic louse) is spread by close/sexual contact and can infest the **eyelashes** as well as the pubic area.","q":["Q289","Q290","H165"]}]}]},{"n":"Inflammatory Dermatoses","topics":[{"n":"Psoriasis: pathogenesis and clinical picture","facts":[{"t":"**Psoriasis** is a chronic immune-mediated (T-cell) papulosquamous disease with genetic susceptibility; **not infectious/contagious**. Basal cell division is accelerated, so **epidermal turnover time is markedly shortened** (normal 28 days). It **improves with sunlight** (flares in winter and in covered areas).","q":["Q292","Q293","Q294","Q295","Q296"]},{"t":"Primary lesion: **red papule covered by loosely adherent silvery-white scales**, coalescing into well-defined, symmetrical plaques with polycyclic outline on **extensor surfaces (elbows, knees)**, scalp and trunk; **psoriasis vulgaris** (vulgaris = common) is the plaque type. Scalp plaques border the hairline sharply and **do not scar** the hair.","q":["Q298","Q300","Q301","Q302","Q303","Q304","Q305","Q306","Q308","H189"]},{"t":"**Auspitz sign**: removal of the scales leaves **pinpoint bleeding points** (thin-capped, engorged dermal papillae).","q":["Q299","Q295","Q306"]},{"t":"Clinical forms: plaque (vulgaris), guttate, flexural, nail, **erythrodermic**, **pustular (sterile pustules)** and **psoriatic arthritis**; bullous and ulcerative forms do not exist. Nail changes include onycholysis (also seen in lichen planus and onychomycosis).","q":["Q307","Q309","Q310","Q311","Q312","Q543"]}]},{"n":"Psoriasis: treatment","facts":[{"t":"**Topical** psoriasis treatment: keratolytics (salicylic acid), emollients, corticosteroids, **calcipotriol** (vitamin D analogue), coal tar, anthralin.","q":["Q313","Q316","Q317"]},{"t":"**Systemic/physical** treatment for extensive disease: **methotrexate** (dihydrofolate reductase inhibitor), acitretin, cyclosporine, **PUVA/narrow-band UVB** phototherapy; antibiotics such as doxycycline have no role.","q":["Q314","Q315","Q318","Q319","Q544"]}]},{"n":"Koebner phenomenon","facts":[{"t":"**Koebner phenomenon** = new lesions on previously normal skin after trauma; seen in **psoriasis, lichen planus, vitiligo and plane warts** (not eczema).","q":["Q297","Q327","Q328"]}]},{"n":"Lichen planus","facts":[{"t":"**Lichen planus (LP)** is a pruritic immune-mediated disease involving **skin, mucous membranes, hair and nails**; associated with **hepatitis C virus**; not contagious. Types: actinic, annular, atrophic, hypertrophic (no pustular type).","q":["Q320","Q321","Q322","H204"]},{"t":"Primary lesion: **pruritic, purple, polygonal, planar papule** (flat-topped, violaceous, shiny, fine adherent scales), often on the **wrists and forearms**; **Wickham striae** (fine white reticular lines) on papules and oral mucosa; heals with **post-inflammatory hyperpigmentation**.","q":["Q323","Q324","Q325","Q326","Q329","Q331","H199","H205"]},{"t":"LP of the scalp destroys follicles → **cicatricial alopecia**; **chronic erosive/ulcerative oral (mucosal) LP and hypertrophic LP are precancerous** (squamous cell carcinoma).","q":["Q330","Q332","Q333","Q335","H201","H209"]},{"t":"**Actinic LP** (LP tropicus) occurs on sun-exposed skin (**face, dorsum of hands**) and is treated with **antimalarials** (chloroquine/hydroxychloroquine) plus sunscreen.","q":["Q336","Q339","Q340","Q341","H197"]},{"t":"Treatment of ordinary LP: **topical corticosteroids** for localized disease; **oral corticosteroids** (with sedating antihistamines) for extensive or severe disease.","q":["Q337","Q338"]}]},{"n":"Pityriasis rosea","facts":[{"t":"**Pityriasis rosea** is an acute, self-limited (4-8 weeks), **non-contagious** scaly erythematous papulosquamous eruption, regarded as a viral exanthem related to **HHV-6 and HHV-7**; treatment is **reassurance**, emollients and mild topical steroids/antihistamines for itch.","q":["Q342","Q343","Q344","Q345","Q346","Q347","Q348","Q358","Q359"]},{"t":"The **herald patch** (single 2-5 cm oval scaly patch with a collarette of scales, outer erythema) precedes the eruption by 1-2 weeks and mimics **tinea corporis** (KOH distinguishes them).","q":["Q349","Q351","Q352","Q356","Q357","Q378","H218","H219"]},{"t":"Secondary eruption: smaller oval scaly lesions on the **trunk and proximal limbs** in a **\"Christmas-tree\" pattern** along the ribs, sparing face, palms and soles.","q":["Q350","Q354","Q355","Q545"]},{"t":"Scaly diseases include psoriasis, pityriasis rosea, tinea and seborrhoeic dermatitis; **alopecia areata is non-scaly**.","q":["Q353"]}]},{"n":"Discoid lupus erythematosus (DLE)","facts":[{"t":"**DLE** is an autoimmune, **non-contagious**, photosensitive skin disease: well-defined erythematous plaques with **adherent scales**, usually on the face (cheeks, nose), ears and **scalp**.","q":["Q360","Q362","Q364","Q365","Q371","H225","H229"]},{"t":"**Five cardinal signs**: erythema, **telangiectasia**, scaling, **stippling** (dilated pilosebaceous orifices with keratin plugs) and **scarring/atrophy**; pustules and lichenification are not DLE signs.","q":["Q361","Q363","Q367","Q368","Q369","Q370","Q372","H224"]},{"t":"Scalp DLE ends in permanent **cicatricial alopecia**.","q":["Q366","H227"]},{"t":"DLE treatment: sun protection, **potent topical (or intralesional) steroids** and **systemic antimalarials** for extensive disease; **PUVA/phototherapy are contraindicated** (lupus is photosensitive).","q":["Q373","Q374","Q375","Q376","Q377","H221"]}]}]},{"n":"Allergic Disorders","topics":[{"n":"Eczema: acute and chronic","facts":[{"t":"**Acute eczema** = wet stage: erythema, oedema, papules/vesicles, oozing and crusting; treat weeping lesions with **drying lotions** (potassium permanganate, aluminium acetate), not ointments. **Chronic eczema**: itchy, **lichenified**, excoriated, with pigment change; lichenification is not an acute feature.","q":["Q379","Q380","Q381","Q382","Q398"]}]},{"n":"Atopic dermatitis","facts":[{"t":"**Atopic dermatitis**: hereditary, **IgE-related** (raised IgE; family history of asthma/rhinitis/dermatitis in 50-70%), intensely itchy, irritable infants, non-contagious.","q":["Q385","Q387","H256","H271"]},{"t":"Distribution by age: **infantile** phase (from ~2 months) = weeping papulovesicular eczema of the **cheeks/face**, neck and extensors; **childhood and adult** phases = **flexures (antecubital and popliteal fossae)**, neck sides, with lichenification in adults.","q":["Q383","Q384","Q386","Q388","Q389","Q390","Q547","H234","H266"]},{"t":"Treatment of flexural atopic dermatitis: **emollients and topical corticosteroids**.","q":["Q390"]}]},{"n":"Seborrheic dermatitis","facts":[{"t":"**Seborrheic dermatitis** (associated with *Malassezia* yeast) is treated with oils for infantile scalp crusts, topical antifungals, mild steroids and selenium sulfide shampoo.","q":["Q391"]}]},{"n":"Contact dermatitis","facts":[{"t":"**Allergic contact dermatitis** is a **delayed type IV (T-cell) hypersensitivity** in sensitized individuals; the rash occurs at the site of contact (henna, nickel in belt buckles, watch/bracelet band-like rash, footwear on the foot dorsa) and is confirmed by the **patch test**. Irritant dermatitis is non-immunological.","q":["Q392","Q393","Q394","Q395","Q396","Q397","Q546","H232","H238","H239","H245","H265"]}]},{"n":"Urticaria and angioedema","facts":[{"t":"**Urticaria**: sudden itchy **wheals** (transient dermal oedema, heal **without scarring**); acute if <6 weeks; may involve mucous membranes.","q":["Q399","Q400","Q401","Q402","Q403","Q412","H233","H241","H242"]},{"t":"Pathogenesis: **type I (IgE-mediated) hypersensitivity**; **mast cell** is the effector cell and **histamine** the main mediator, increasing **capillary permeability**.","q":["Q408","Q409","Q410","Q411","H236"]},{"t":"**Physical urticaria** (solar, cold, heat, aquagenic, pressure, dermographism) is stimulus-induced; **papular urticaria** (insect-bite hypersensitivity) is not physical and spares mucous membranes. **Cholinergic urticaria**: small wheals after sweating, exertion, heat, hot spicy food or emotion (acetylcholine-stimulated mast cells).","q":["Q413","Q414","Q415","Q416","H254","H257"]},{"t":"**Angioedema** involves the deep dermis/hypodermis (eyelids, lips) and can be **life-threatening** through **laryngeal oedema**; emergency treatment is **adrenaline 0.5 ml of 1/1000 SC/IM** (300-500 mcg), with IV antihistamines and corticosteroids; salicylates can trigger urticaria/angioedema.","q":["Q404","Q405","Q406","Q407","Q421","Q422","Q424","Q425"]},{"t":"Urticaria treatment: **oral antihistamines are the mainstay**; short courses of corticosteroids (IV in severe cases) are added when needed.","q":["Q417","Q418","Q419","Q420"]}]},{"n":"Drug eruptions and erythema multiforme","facts":[{"t":"**Drug eruptions** can be exanthematous (papules on erythema, starting proximally, itchy), urticarial, acneiform, eczematous, lichenoid, bullous, pigmented or erythrodermic; **neuralgia is not a cutaneous drug reaction**. **Corticosteroids and anti-epileptics** cause acneiform eruptions (so steroids are not used to treat them).","q":["Q426","Q427","Q428","Q429","Q434"]},{"t":"**Fixed drug eruption** recurs at the **same site** whenever the same drug is taken (lips, genitalia; e.g. sulphonamides, tetracycline), heals with hyperpigmentation; treatment: stop the drug, topical corticosteroid.","q":["Q430","Q431","Q432","Q433"]},{"t":"**Erythema multiforme**: characteristic **target (iris) lesion** with three concentric zones, often with oral mucosal involvement; the commonest trigger is **herpes simplex**, then drugs, malignancy and pregnancy.","q":["Q435","Q436","Q437","H279"]}]}]},{"n":"Melanocyte Disorders","topics":[{"n":"Vitiligo: pathogenesis and clinical picture","facts":[{"t":"**Vitiligo** is an acquired **depigmenting** disorder caused by **autoimmune (cytotoxic T-cell) destruction of melanocytes**; biopsy shows **complete absence of melanocytes** (in hypopigmentation melanocytes are present but less active). Not contagious.","q":["Q438","Q439","Q448","Q449","Q450","Q451","Q452","H336","H341","H344"]},{"t":"Primary lesion: well-circumscribed **milky/chalk-white macule or patch** (accentuated under Wood's light), often with white hairs; **asymptomatic** (no itch/pain) - the complaint is cosmetic; can affect the scalp.","q":["Q440","Q441","Q442","Q443","Q444","Q445","Q455","H350","H352"]},{"t":"Types: **focal, segmental, mucosal** (localized) and **vulgaris (generalized), acrofacial, universal**; there is no papular type.","q":["Q453","Q454"]},{"t":"Generalized vitiligo is associated with other autoimmune diseases: **thyroid disease, alopecia areata**, type 1 diabetes, myasthenia gravis, lupus and rheumatoid arthritis.","q":["Q446","Q447","H346"]},{"t":"Vitiligo may be confused with pityriasis alba, hypopigmented leprosy and pityriasis versicolor.","q":["H340"]}]},{"n":"Vitiligo: treatment","facts":[{"t":"**Phototherapy** is the backbone of vitiligo treatment (**narrow-band UVB**, excimer, PUVA) because it stimulates residual melanocytes.","q":["Q456","Q457","H335","H345","H352"]},{"t":"Topical options: **corticosteroids** (localized disease) and **calcineurin inhibitors** (tacrolimus, pimecrolimus; especially face and neck); in hepatic failure oral drugs are avoided and topical PUVA, topical steroids or UVB can be used.","q":["Q458","Q459","Q460"]}]}]},{"n":"Hair Disorders","topics":[{"n":"Cicatricial (scarring) versus non-cicatricial alopecia","facts":[{"t":"**Cicatricial alopecia** = follicles are **destroyed and replaced by scar**, so hair loss is **permanent**; causes: **lichen planus (lichen planopilaris), DLE, favus, kerion**, burns, trauma, zoster; the scalp looks smooth and shiny without follicular openings.","q":["Q461","Q462","Q463","Q464","Q465","Q467","Q468","Q473","Q474"]},{"t":"**Non-cicatricial** alopecias (follicle preserved, reversible): **alopecia areata, androgenetic alopecia, telogen and anagen effluvium**.","q":["Q470","Q471","Q472"]}]},{"n":"Androgenetic alopecia","facts":[{"t":"**Androgenetic alopecia (AGA)**: genetically determined, non-scarring, due to **increased 5-alpha reductase activity** in target follicles (testosterone → DHT miniaturizes follicles). Males: **frontal and bitemporal recession then vertex**; females: diffuse vertex thinning with **preserved frontal hairline**.","q":["Q475","Q476","Q477","Q478","H298","H299","H307"]},{"t":"AGA treatment: **topical minoxidil** (both sexes), **finasteride** (5-alpha reductase inhibitor, males), spironolactone/antiandrogens (females only), hair transplantation; **corticosteroids have no role**.","q":["Q479","Q480","H294"]}]},{"n":"Telogen and anagen effluvium","facts":[{"t":"**Telogen effluvium**: diffuse, reversible shedding ~3-4 months after a trigger such as **fever (typhoid) or childbirth**, with a normal scalp.","q":["Q481","Q482","Q483"]},{"t":"**Anagen effluvium**: toxic injury to actively growing anagen follicles (**cytotoxic chemotherapy**, radiation, heavy metals, methotrexate), causing rapid hair loss soon after starting treatment.","q":["Q484","Q485","Q486","H296"]}]},{"n":"Alopecia areata","facts":[{"t":"**Alopecia areata** is an **autoimmune**, non-scarring disease against anagen follicles: sudden, asymptomatic, well-circumscribed round patches of hair loss on **normal-looking skin** (no scales); **exclamation-mark hairs** at the margin are characteristic. Associated with thyroid disease, atopy, vitiligo; 10-20% have a family history.","q":["Q487","Q488","Q489","Q490","Q491","H292","H301","H305"]},{"t":"Types: **patchy, ophiasis** (band along the scalp margins; usu function openShPicker(){const sel=new Set(SC.length?SC:DB.ch);let h='<div class="shb"><h3>🔀 Shuffle from which chapters?</h3><div class="stat">Pick one or more chapters. Only questions you have not answered yet are shuffled.</div><div class="qa"><button id="sha">Select all</button><button id="shn">Clear</button></div><div class="shl">';
DB.ch.forEach((c,i)=>{const L=DB.q.filter(q=>q.ch==c),u=L.filter(q=>!P[q.id]).length;h+=`<label><input type="checkbox" data-c="${ea(c)}" ${sel.has(c)?'checked':''}> ${i+1}. ${esc(c)} <span>${u} unanswered / ${L.length}</span></label>`});
h+='</div><div class="qa"><button class="pri" id="shgo">🔀 Start shuffle</button><button id="shx">Cancel</button></div></div>';$('shp').innerHTML=h;$('shp').classList.add('on')}
$('shp').onclick=e=>{const b=e.target.closest('button');if(e.target.id=='shp'||(b&&b.id=='shx')){$('shp').classList.remove('on');return}if(!b)return;
const bx=[...$('shp').querySelectorAll('input[data-c]')];if(b.id=='sha'){bx.forEach(x=>x.checked=true);return}if(b.id=='shn'){bx.forEach(x=>x.checked=false);return}
if(b.id=='shgo'){const ch=bx.filter(x=>x.checked).map(x=>x.dataset.c);if(!ch.length){toast('Select at least one chapter');return}
if(!DB.q.some(q=>ch.includes(q.ch)&&!P[q.id])){toast('Every question in the selected chapters is already answered');return}
SC=ch.length==DB.ch.length?[]:ch;saveSC();wrongOnly=false;savedOnly=false;syncBtns();$('s').value='';$('shp').classList.remove('on');setShuffle(true);openView('all');scrollTo(0,0)}};
$('shc').onclick=openShPicker;
$('sv').onclick=()=>{savedOnly=!savedOnly;render()};
$('rs').onclick=()=>{if(confirm('Reset all progress? (your ★ saved questions are kept)')){P={};PX={};save();savePX();clearLast();stopTimer();if(SH)reshuffle();render()}};
/* ---- Progress backup / restore (v3.1): a JSON file the student can keep or move to another device. */
function backupProgress(){try{const data={app:'5thNotes QBank',sk:SK,exportedAt:new Date().toISOString(),answers:P,lastAnswered:LAST,bookmarks:BM,theme:TH,showExplanations:showExpl};const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=SK+'-progress.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('Progress backup downloaded')}catch(e){toast('Backup failed: '+e.message)}}
$('rfile').addEventListener('change',()=>{const f=$('rfile').files[0];$('rfile').value='';if(!f)return;const rd=new FileReader();rd.onload=()=>{let d;try{d=JSON.parse(rd.result)}catch(e){toast('That file is not a valid progress backup');return}
if(!d||typeof d!=='object'||!d.answers||typeof d.answers!=='object'){toast('That file is not a progress backup');return}
const valid={};Object.keys(d.answers).forEach(id=>{if(byId(id))valid[id]=d.answers[id]});const n=Object.keys(valid).length;
if(!n){toast('No answers in that backup match this question bank');return}
if(d.sk&&d.sk!==SK&&!confirm('This backup is from a different question bank ('+d.sk+'). Restore the '+n+' matching answers anyway?'))return;
if(!confirm('Restore '+n+' answered question(s) from the backup? Your current progress will be replaced. Saved questions from the backup will also be restored.'))return;
P=valid;save();LAST=(d.lastAnswered&&valid[d.lastAnswered.id])?d.lastAnswered:null;try{if(LAST)localStorage.setItem(SK+'ans',JSON.stringify(LAST));else localStorage.removeItem(SK+'ans')}catch(e){}
BM=Array.isArray(d.bookmarks)?d.bookmarks.filter(id=>byId(id)):BM;saveBM();PX={};savePX();updRB();openView(null);toast('Progress restored: '+n+' answered question(s)')};rd.readAsText(f)});
/* ---- Notes page. Viewing / searching / opening notes never touches answered progress or Resume. */
function renderNotes(){const b=$('nbody');if(!NT){b.innerHTML='<p>No notes in this site.</p>';return}
const W=NQ.toLowerCase().trim().split(/\s+/).filter(Boolean),N=nCount();let h=`<h2>📘 Notes</h2><div class="stat">${N.f} facts · ${N.s} system${N.s>1?'s':''} · ${N.t} topics. Read these first, then test yourself with the questions. Tap a small number to open the related question.</div>`,shown=0,chips='',body='';
NT.systems.forEach((s,si)=>{let tb='',tc='',sc=0;s.topics.forEach((p,pi)=>{const F=p.facts.map((f,fi)=>({f,fi})).filter(x=>!W.length||W.every(w=>x.f._s.includes(w)));if(!F.length)return;sc+=F.length;
tc+=`<a class="nchip" data-top="${si}-${pi}">${esc(p.n)}</a>`;
tb+=`<div class="ntop"><h4 id="nt-${si}-${pi}" dir="auto">${esc(p.n)} <small>(${F.length})</small></h4><ul class="facts">${F.map(x=>factHTML(x.f,si,pi,x.fi)).join('')}</ul></div>`});
if(!sc)return;shown+=sc;chips+=`<a class="nchip" data-sys="${si}">${esc(s.n)} <small>${sc}</small></a>`;
body+=`<details class="nsys" id="ns-${si}" data-si="${si}" ${(W.length||NOPEN.has(si))?'open':''}><summary dir="auto">${esc(s.n)}<small>${sc} fact${sc>1?'s':''}</small></summary>${s.topics.length>1?`<div class="nchips">${tc}</div>`:''}${tb}</details>`});
h+=(chips?`<div class="nchips">${chips}</div>`:'')+(shown?body:'<p>No notes match your search.</p>');b.innerHTML=h;
NHL.forEach(k=>{const el=$('nf-'+k);if(el){el.classList.add('hl')}});}
function factHTML(f,si,pi,fi){const R=(f.q||[]).filter(byId);let r='';
if(R.length){const lab=id=>{const q=byId(id);return `<a class="qr" data-qid="${id}" title="${ea(q.q.slice(0,110))}">${DB.ch.indexOf(q.ch)+1}.${q.n}</a>`};
r=`<span class="qrs">Q ${R.slice(0,6).map(lab).join('')}${R.length>6?`<a class="qr" data-more="1">+${R.length-6}</a><span class="qh" hidden>${R.slice(6).map(lab).join('')}</span>`:''}</span>`}
return `<li id="nf-${si}-${pi}-${fi}" dir="auto"><span>${nfmt(f.t)}</span>${r}</li>`}
function openNotes(){if(!NT)return;wrongOnly=false;savedOnly=false;syncBtns();NQ='';$('ns').value='';NHL=[];if(NT.systems.length==1)NOPEN.add(0);openView('__notes');scrollTo(0,0)}
function openNotesAt(qid){if(!NT||!QN[qid])return;NQ='';$('ns').value='';NHL=QN[qid].map(x=>x.join('-'));QN[qid].forEach(x=>NOPEN.add(x[0]));openView('__notes');const el=$('nf-'+NHL[0]);if(el){el.scrollIntoView({block:'center'})}else scrollTo(0,0)}
$('nbody').addEventListener('toggle',e=>{const d=e.target;if(d.classList&&d.classList.contains('nsys')){const si=+d.dataset.si;if(d.open)NOPEN.add(si);else NOPEN.delete(si)}},true);
$('nbody').onclick=e=>{const q=e.target.closest('a[data-qid]');if(q){goQ(q.dataset.qid);return}
const m=e.target.closest('a[data-more]');if(m){const h=m.nextElementSibling;if(h)h.hidden=false;m.remove();return}
const s=e.target.closest('a[data-sys]');if(s){const si=+s.dataset.sys;NOPEN.add(si);NHL=[];renderNotes();const el=$('ns-'+si);if(el)el.scrollIntoView({block:'start'});return}
const t=e.target.closest('a[data-top]');if(t){const el=$('nt-'+t.dataset.top);if(el)el.scrollIntoView({block:'start'})}};
$('ns').addEventListener('input',e=>{NQ=e.target.value;NHL=[];renderNotes()});
$('nx').onclick=()=>{NT.systems.forEach((s,i)=>NOPEN.add(i));renderNotes()};$('nc').onclick=()=>{NOPEN.clear();NQ='';$('ns').value='';renderNotes()};
$('nhm').onclick=()=>{openView(null);scrollTo(0,0)};$('ng').onclick=resume;$('nt').onclick=openNotes;if(NT)$('nt').style.display='';
$('hm').onclick=()=>{openView(null);scrollTo(0,0)};$('rb').onclick=resume;
/* in-app help: small (i) icons open one shared tooltip (tap on phones, hover/focus on desktop); it never blocks taps */
const tipEl=document.createElement('div');tipEl.id='tip';tipEl.setAttribute('role','tooltip');document.body.appendChild(tipEl);let tipFor=null,tipHov=false,tipT=0;
function helpText(k){if(k=='shuffle'){const inCat=cur&&cur!=='all'&&cur!=='__notes';return inCat?HELP.shuffleCat:(CATS.length?HELP.shuffleAll:HELP.shuffleAllPlain)}
if(k.indexOf('cat:')==0){const c=CATS.find(x=>x.id==k.slice(4));if(!c)return'';return c.description||(/zanqa/i.test(c.id)?HELP.zanqa:/hawary/i.test(c.id)?HELP.hawary:'An additional view of existing questions. Progress is shared with the main bank.')}return HELP[k]||''}
function hideTip(){tipEl.style.display='none';if(tipFor){tipFor.classList.remove('on');tipFor=null}clearTimeout(tipT)}
function showTip(el,hov){const s=helpText(el.dataset.h);if(!s)return;hideTip();tipEl.textContent=s;tipEl.style.display='block';const r=el.getBoundingClientRect(),w=tipEl.offsetWidth,h=tipEl.offsetHeight;
tipEl.style.left=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8)+'px';let y=r.bottom+8;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-8);tipEl.style.top=y+'px';tipFor=el;tipHov=!!hov;el.classList.add('on');if(!hov)tipT=setTimeout(hideTip,9000)}
document.addEventListener('click',e=>{const i=e.target.closest('.hi');if(i){e.preventDefault();e.stopPropagation();if(tipFor===i&&!tipHov)hideTip();else showTip(i,false);return}if(tipFor)hideTip()},true);
document.addEventListener('keydown',e=>{const i=e.target.closest&&e.target.closest('.hi');if(i&&(e.key=='Enter'||e.key==' ')){e.preventDefault();i.click()}else if(e.key=='Escape')hideTip()});
if(window.matchMedia&&matchMedia('(hover:hover)').matches){document.addEventListener('mouseover',e=>{const i=e.target.closest('.hi');if(i&&tipFor!==i)showTip(i,true)});document.addEventListener('mouseout',e=>{const i=e.target.closest('.hi');if(i&&tipHov)hideTip()})}
addEventListener('scroll',()=>{if(tipFor)hideTip()},{passive:true});
applyTheme();updRB();openView(null);
</script></body></html>
