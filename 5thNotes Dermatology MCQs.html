": [["A", "Acne."], ["B", "Alopecia."], ["C", "Scabies."], ["D", "Psoriasis."], ["E", "Leprosy."]], "a": "E", "sa": null, "pg": null, "f": [], "s": "H", "n": 33, "e": ["Hansen's disease is named after Gerhard Hansen, who discovered Mycobacterium leprae; it is simply another name for leprosy.", "Hansen = leprosy."]}, {"id": "H061", "ch": "Mycobacterial Infections", "q": "Regarding leprosy, the following statement is INCORRECT:", "o": [["A", "High immunity leads to paucibacillary leprosy."], ["B", "Tuberculoid leprosy shows good immunity."], ["C", "Lepromin test is non-specific and non-diagnostic."], ["D", "Sensory nerves affection leads to glove and stocking anesthesia."], ["E", "Lepromatous leprosy is paucibacillary."]], "a": "E", "sa": null, "pg": null, "f": [], "s": "H", "n": 34, "e": ["Lepromatous leprosy is multibacillary, so calling it paucibacillary is incorrect.", "LL multibacillary."]}, {"id": "H067", "ch": "Mycobacterial Infections", "q": "Which is TRUE regarding tuberculoid leprosy:", "o": [["A", "Diagnosed by lepromin test."], ["B", "Presents with multiple nodules."], ["C", "Nerve involvement occurs early."], ["D", "Involves mucous membranes."], ["E", "Is a sign of poor immunity."]], "a": "C", "sa": null, "pg": null, "f": [], "s": "H", "n": 35, "e": ["In tuberculoid leprosy the host immune response targets bacilli in nerves, so nerve involvement is early, while the disease is paucibacillary and not diagnosed by lepromin test.", "TT early nerve."]}, {"id": "H071", "ch": "Mycobacterial Infections", "q": "A male patient, 52 years old, presented with glistening erythematous papules, nodules & plaques on his ears, nose and forehead. He had loss of the outer 1/3 of his eyebrows and gave history of recurrent attacks of epistaxis. What is your diagnosis?", "o": [["A", "Impetigo contagiosum."], ["B", "Tuberculoid leprosy."], ["C", "Lepromatous leprosy."], ["D", "Pityriasis versicolor."], ["E", "Psoriasis."]], "a": "C", "sa": null, "pg": null, "f": [], "s": "H", "n": 36, "e": ["Glistening nodules on ears, nose and forehead with loss of the outer third of the eyebrows and epistaxis is lepromatous leprosy.", "Madarosis outer third."]}, {"id": "H072", "ch": "Mycobacterial Infections", "q": "A patient with widespread, symmetrical papules and nodules, infiltrated facial skin, and loss of the outer third of the eyebrows. Which is TRUE regarding this disease?", "o": [["A", "Is a parasitic infection."], ["B", "Bacilli are absent in skin lesions."], ["C", "Nerve involvement occurs early."], ["D", "Involves mucous membranes."], ["E", "Is characterized by good immunity."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 37, "e": ["Symmetrical nodules, infiltrated face and loss of the outer eyebrows indicate lepromatous leprosy, which involves mucous membranes.", "LL: mucosa involved."]}, {"id": "Q126", "ch": "Viral Infections", "q": "Viral skin infections include all of the following EXCEPT", "o": [["A", "Herpes simplex."], ["B", "Chicken pox."], ["C", "Warts."], ["D", "Impetigo."], ["E", "Molluscum contagiosum."]], "a": "D", "sa": null, "pg": "21", "f": [], "s": "B", "n": 1, "e": ["Impetigo is caused by bacteria (Staphylococcus aureus/streptococci). Herpes simplex, chickenpox, warts and molluscum are viral.", "Impetigo = bacterial."]}, {"id": "Q127", "ch": "Viral Infections", "q": "All of the following microorganisms have a predilection for neural tissue EXCEPT", "o": [["A", "Varicella zoster virus."], ["B", "Human papilloma virus."], ["C", "Herpes simplex virus type I."], ["D", "Herpes simplex virus type II."], ["E", "Lepra bacilli."]], "a": "B", "sa": null, "pg": "22", "f": [], "s": "B", "n": 2, "e": ["VZV, HSV and M. leprae are neurotropic; HPV is epitheliotropic, not neural.", "Neurotropic: VZV, HSV, M. leprae."]}, {"id": "Q128", "ch": "Viral Infections", "q": "All of the following microorganisms have a predilection for neural tissue EXCEPT", "o": [["A", "Varicella zoster virus."], ["B", "Herpes simplex virus type I."], ["C", "Herpes simplex virus type II."], ["D", "Lepra bacilli."], ["E", "Pox virus."]], "a": "E", "sa": null, "pg": "22", "f": [], "s": "B", "n": 3, "e": ["Poxvirus (molluscum) infects epidermal cells and is not neurotropic; VZV, HSV and lepra bacilli are. The same question in Dr. Hawary's file lists HPV and pox virus as both being non-neural (key B / E).", "Pox and HPV = no neural predilection."]}, {"id": "Q129", "ch": "Viral Infections", "q": "Herpes simplex", "o": [["A", "Is strictly unilateral."], ["B", "Is a bacterial infection."], ["C", "Heals with a scar."], ["D", "One attack provides permanent immunity."], ["E", "Is genital & non-genital."]], "a": "E", "sa": null, "pg": "21", "f": [], "s": "B", "n": 4, "e": ["HSV infects genital and non-genital sites (lips, face, fingers, eye), types 1 and 2 overlapping.", "HSV-1 mostly oral; HSV-2 mostly genital."]}, {"id": "Q130", "ch": "Viral Infections", "q": "In herpes simplex", "o": [["A", "The primary lesion is a papule."], ["B", "Neuralgia is a frequent complication."], ["C", "It usually affects the mucocutaneous junction."], ["D", "Recurrences are uncommon."], ["E", "None of the above."]], "a": "C", "sa": null, "pg": "27", "f": [], "s": "B", "n": 5, "e": ["HSV classically involves the mucocutaneous junction (lips, nose, genitalia) and recurs there; it is periorificial, whereas zoster follows a dermatome.", "Periorificial."]}, {"id": "Q131", "ch": "Viral Infections", "q": "In herpes simplex all are true EXCEPT", "o": [["A", "The primary lesion is a vesicle."], ["B", "Neuralgia is a frequent complication."], ["C", "It usually affects the mucocutaneous junction."], ["D", "It may cause eczema herpeticum in atopics."], ["E", "Recurrence is common."]], "a": "B", "sa": null, "pg": "26", "f": [], "s": "B", "n": 6, "e": ["Neuralgia is a frequent complication of herpes zoster, not of herpes simplex.", "Post-herpetic neuralgia = zoster."]}, {"id": "Q132", "ch": "Viral Infections", "q": "Herpes labialis", "o": [["A", "Is recurrent."], ["B", "Heals with a scar."], ["C", "Its primary lesion is a papule."], ["D", "Is strictly unilateral."], ["E", "Is caused by HSV II. 1     A female patient, 15 years old, presented with perioral blisters of 4 days duration. She was feverish 2 days before the rash and felt a tingling sensation in the area. The condition was recurrent. (Clinical photo: grouped vesicles/crusts at the lip margin.)"]], "a": "A", "sa": null, "pg": "22", "f": [], "s": "B", "n": 7, "e": ["Herpes labialis recurs because HSV lies latent in the trigeminal ganglion and reactivates.", "Recurrence is common in HSV."]}, {"id": "Q133", "ch": "Viral Infections", "q": "The causative organism of this disease is", "o": [["A", "Group A β-haemolytic Streptococci."], ["B", "Varicella zoster virus."], ["C", "Staphylococcus aureus."], ["D", "Human papilloma virus."], ["E", "Herpes simplex virus. 1     A female patient, 15 years old, presented with perioral blisters of 4 days duration. She was feverish 2 days before the rash and felt a tingling sensation in the area. The condition was recurrent. (Clinical photo: grouped vesicles/crusts at the lip margin.)"]], "a": "E", "sa": null, "pg": "22", "f": [], "s": "B", "n": 8, "e": ["Recurrent perioral blisters preceded by fever and tingling are due to herpes simplex virus.", "Prodrome tingling → HSV."]}, {"id": "Q134", "ch": "Viral Infections", "q": "A possible complication is", "o": [["A", "Neuralgia."], ["B", "Erythema multiforme."], ["C", "Lymphatic obstruction."], ["D", "Facial palsy."], ["E", "Scarring."]], "a": "B", "sa": null, "pg": "82", "f": [], "s": "B", "n": 9, "e": ["HSV is the most common trigger of erythema multiforme, an immune-mediated reaction with target lesions; other complications are eczema herpeticum, ocular disease and encephalitis.", "HSV → EM."]}, {"id": "Q135", "ch": "Viral Infections", "q": "A female patient presented with bilateral grouped vesicles on an erythematous base on the lips, preceded by burning sensation. The diagnosis is", "o": [["A", "Herpes zoster."], ["B", "Herpes simplex."], ["C", "Molluscum contagiosum."], ["D", "Impetigo contagiosum."], ["E", "Drug eruption."]], "a": "B", "sa": null, "pg": "22", "f": [], "s": "B", "n": 10, "e": ["Bilateral grouped vesicles on an erythematous base on the lips after burning sensation indicate herpes simplex.", "Burning prodrome + grouped vesicles."]}, {"id": "Q136", "ch": "Viral Infections", "q": "A 40-year-old male patient with bilateral grouped vesicles on an erythematous base affecting the lips and nose, with no fever or lymphadenopathy, may have", "o": [["A", "Herpes zoster."], ["B", "Primary herpetic gingivostomatitis."], ["C", "Recurrent herpes simplex."], ["D", "Erysipelas."], ["E", "Verruca vulgaris."]], "a": "C", "sa": null, "pg": "22", "f": [], "s": "B", "n": 11, "e": ["Recurrent grouped vesicles on the lips and nose indicate recurrent herpes simplex (labialis).", "Recurrent = HSV."]}, {"id": "Q137", "ch": "Viral Infections", "q": "A 24-year-old man develops grouped painful vesicles on the penis, preceded by burning sensation. The most likely diagnosis is", "o": [["A", "Molluscum contagiosum."], ["B", "Condyloma acuminata."], ["C", "Herpes progenitalis."], ["D", "Scabies."], ["E", "Exanthematous drug eruption."]], "a": "C", "sa": null, "pg": "23", "f": [], "s": "B", "n": 12, "e": ["Grouped painful vesicles on the penis after burning point to genital herpes (herpes progenitalis).", "HSV-2 usually."]}, {"id": "Q138", "ch": "Viral Infections", "q": "Caesarian section is indicated for a pregnant female if at the time of delivery she is affected by", "o": [["A", "Herpetic whitlow."], ["B", "Herpes progenitalis."], ["C", "Herpes zoster."], ["D", "Chicken pox."], ["E", "None of the above."]], "a": "B", "sa": null, "pg": "23", "f": [], "s": "B", "n": 13, "e": ["Active genital herpes at delivery is an indication for cesarean section to prevent neonatal herpes.", "Active genital herpes → C-section."]}, {"id": "Q139", "ch": "Viral Infections", "q": "The following disease could be transmitted by sexual contact", "o": [["A", "Pityriasis rosea."], ["B", "Pityriasis versicolor."], ["C", "Herpes simplex."], ["D", "Herpes zoster."], ["E", "Ophiasis."]], "a": "C", "sa": null, "pg": "21", "f": [], "s": "B", "n": 14, "e": ["Herpes simplex type 2 is a very common sexually transmitted infection, spread by contact with the genital mucosa or skin; zoster, psoriasis and versicolor are not STDs.", "HSV-2 genital."]}, {"id": "Q140", "ch": "Viral Infections", "q": "In herpetic whitlow the site of infection is", "o": [["A", "Face."], ["B", "Mucous membrane."], ["C", "Genitals."], ["D", "Fingers."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": "23", "f": [], "s": "B", "n": 15, "e": ["Herpetic whitlow is HSV infection of the finger in children (HSV-1) or adults after digital-genital contact.", "Whitlow = finger."]}, {"id": "Q141", "ch": "Viral Infections", "q": "The eye may be affected in ONE of the following diseases", "o": [["A", "Lichen planus."], ["B", "Pityriasis rosea."], ["C", "Acne vulgaris."], ["D", "Herpes simplex."], ["E", "Psoriasis."]], "a": "D", "sa": null, "pg": "23", "f": [], "s": "B", "n": 16, "e": ["HSV can cause keratitis (HSV-1 in children and adults, HSV-2 in newborns), possibly with corneal ulcers; zoster also causes eye disease through the ophthalmic branch.", "HSV ocular."]}, {"id": "Q142", "ch": "Viral Infections", "q": "Complications of herpes simplex infection include", "o": [["A", "Erythema multiforme."], ["B", "Eczema herpeticum."], ["C", "Corneal ulcers."], ["D", "CNS complications."], ["E", "All of the above."]], "a": "E", "sa": null, "pg": "23", "f": [], "s": "B", "n": 17, "e": ["HSV complications include erythema multiforme, eczema herpeticum, corneal ulcers and CNS (encephalitis).", "All of the above."]}, {"id": "Q143", "ch": "Viral Infections", "q": "Tzank smear is used to diagnose", "o": [["A", "Leprosy."], ["B", "Impetigo."], ["C", "Herpes simplex."], ["D", "Psoriasis."], ["E", "Pediculosis."]], "a": "C", "sa": null, "pg": "24", "f": [], "s": "B", "n": 18, "e": ["A Tzanck smear shows multinucleated giant cells in herpes simplex (and zoster/varicella).", "Tzanck = multinucleated giant cells."]}, {"id": "Q144", "ch": "Viral Infections", "q": "Primary varicella zoster virus infection leads to", "o": [["A", "Facial palsy."], ["B", "Genital herpes."], ["C", "Chickenpox."], ["D", "Herpes zoster."], ["E", "Oral herpes."]], "a": "C", "sa": null, "pg": "24", "f": [], "s": "B", "n": 19, "e": ["Primary VZV infection leads to chickenpox, usually in childhood; the virus then lies latent in posterior root ganglia and reactivates as herpes zoster.", "Primary VZV = varicella."]}, {"id": "Q145", "ch": "Viral Infections", "q": "Chicken pox represents", "o": [["A", "HSV infection."], ["B", "HPV infection."], ["C", "Poxvirus infection."], ["D", "Reactivation of VZV."], ["E", "Primary VZV infection."]], "a": "E", "sa": null, "pg": "24", "f": [], "s": "B", "n": 20, "e": ["Chickenpox is the primary VZV infection, whereas herpes zoster is reactivation. HSV causes oral and genital herpes.", "Primary vs reactivation."]}, {"id": "Q146", "ch": "Viral Infections", "q": "Varicella: what is the causative virus, and what is the treatment?", "o": [], "a": null, "sa": "Varicella zoster virus (VZV); antiviral, e.g. acyclovir 800 mg 5 times daily for 7 days (started within 48 hours).", "pg": "24", "f": [], "s": "B", "n": 21, "e": ["Varicella is caused by VZV, and treatment is antiviral therapy (acyclovir 800 mg 5 times daily for 7 days, started within 48 hours) plus vaccine prophylaxis in children.", "VZV, acyclovir."]}, {"id": "Q147", "ch": "Viral Infections", "q": "An adult patient with unilateral painful grouped vesicles along the distribution of a sensory nerve is suffering from", "o": [["A", "Herpes simplex."], ["B", "Herpes zoster."], ["C", "Chickenpox."], ["D", "Warts."], ["E", "Molluscum contagiosum."]], "a": "B", "sa": null, "pg": "25", "f": [], "s": "B", "n": 22, "e": ["Unilateral grouped vesicles along a sensory nerve distribution are herpes zoster.", "Dermatomal = zoster."]}, {"id": "Q148", "ch": "Viral Infections", "q": "Unilateral painful grouped vesicles on an erythematous base are seen in", "o": [["A", "Verruca vulgaris."], ["B", "Acute eczema."], ["C", "Herpes zoster."], ["D", "Varicella."], ["E", "Pediculosis."]], "a": "C", "sa": null, "pg": "25", "f": [], "s": "B", "n": 23, "e": ["Unilateral painful grouped vesicles on an erythematous base indicate herpes zoster.", "Pain + unilateral."]}, {"id": "Q149", "ch": "Viral Infections", "q": "Primary lesions of herpes zoster are unilateral", "o": [["A", "Flat-topped skin-colored papules."], ["B", "Flat-topped violaceous papules."], ["C", "Umbilicated papules."], ["D", "Grouped pustules."], ["E", "Grouped vesicles."]], "a": "E", "sa": null, "pg": "27", "f": [], "s": "B", "n": 24, "e": ["The primary lesion of zoster is grouped vesicles on a dermatome, unilateral.", "Grouped vesicles."]}, {"id": "Q150", "ch": "Viral Infections", "q": "Post-herpetic neuralgia is more common in", "o": [["A", "Children."], ["B", "Elderly patients."], ["C", "Diabetic patients."], ["D", "Motor nerve affection."], ["E", "Sensory nerve affection."]], "a": "B", "sa": null, "pg": "26", "f": [], "s": "B", "n": 25, "e": ["Post-herpetic neuralgia occurs in elderly patients and may persist for weeks to months. Early antivirals and vaccines reduce its risk.", "Elderly → PHN."]}, {"id": "Q151", "ch": "Viral Infections", "q": "Common complication of herpes zoster", "o": [["A", "Long-standing pain."], ["B", "Ulceration."], ["C", "Lymphatic obstruction."], ["D", "Deep venous thrombosis."]], "a": "A", "sa": null, "pg": "26", "f": [], "s": "B", "n": 26, "e": ["Post-herpetic neuralgia (long-standing pain) is the common complication of zoster.", "PHN."]}, {"id": "Q152", "ch": "Viral Infections", "q": "The following drug is the main treatment of herpes zoster", "o": [["A", "Acyclovir."], ["B", "Tetracycline."], ["C", "Retinoids."], ["D", "Cyclosporin."], ["E", "Methotrexate."]], "a": "A", "sa": null, "pg": "27", "f": [], "s": "B", "n": 27, "e": ["Acyclovir (also valacyclovir and famciclovir) is the main treatment for herpes zoster when started within 48 hours; analgesics and gabapentin help the pain.", "Acyclovir."]}, {"id": "Q153", "ch": "Viral Infections", "q": "A 65-year-old man presents with unilateral, painful vesicles along a dermatome on the trunk. Treatment of this condition is oral acyclovir in a dose of", "o": [["A", "800 mg 3 times daily."], ["B", "200 mg 3 times daily."], ["C", "800 mg 5 times daily."], ["D", "200 mg 5 times daily."], ["E", "400 mg 5 times daily."]], "a": "C", "sa": null, "pg": "27", "f": [], "s": "B", "n": 28, "e": ["Herpes zoster in older adults is treated with oral acyclovir 800 mg five times daily for 7 days.", "800 mg × 5/day."]}, {"id": "Q154", "ch": "Viral Infections", "q": "Treatment of herpes zoster (dose of acyclovir)?", "o": [], "a": null, "sa": "Oral acyclovir 800 mg 5 times daily for 7 days (started within 48 hours).", "pg": "27", "f": [], "s": "B", "n": 29, "e": ["Zoster: oral acyclovir 800 mg five times daily for 7 days, started within 48 hours.", "800 × 5 × 7 days."]}, {"id": "Q155", "ch": "Viral Infections", "q": "Warts are caused by", "o": [["A", "HSV-1."], ["B", "Pox virus."], ["C", "Human papilloma virus."]], "a": "C", "sa": null, "pg": "28", "f": [], "s": "B", "n": 30, "e": ["Warts are common benign epithelial growths caused by human papilloma virus (over 200 genotypes), not pox virus or herpes simplex.", "Warts = HPV."]}, {"id": "Q156", "ch": "Viral Infections", "q": "Verruca vulgaris is caused by", "o": [["A", "Herpes simplex virus type 1."], ["B", "Herpes simplex virus type 2."], ["C", "Human papilloma virus."], ["D", "Varicella-zoster virus."], ["E", "Pox virus."]], "a": "C", "sa": null, "pg": null, "f": [], "s": "B", "n": 31, "e": ["Verruca vulgaris (common wart) is caused by HPV, a DNA virus transmitted by skin contact or fomites.", "HPV."]}, {"id": "Q157", "ch": "Viral Infections", "q": "Verruca", "o": [["A", "Presents by violaceous papules."], ["B", "Is characterized by asymptomatic verrucous macules."], ["C", "May involve the mucous membranes."], ["D", "Is a systemic disease."], ["E", "Is always treated by surgical excision."]], "a": "C", "sa": null, "pg": "28", "f": [], "s": "B", "n": 32, "e": ["Warts may involve mucous membranes as well as skin; genital warts are the best example.", "Warts: skin and mucosa."]}, {"id": "Q158", "ch": "Viral Infections", "q": "Which of the following is a correct statement concerning verrucae?", "o": [["A", "Primary lesion is a skin-colored macule."], ["B", "Involve mucous membranes."], ["C", "Found mainly in patients with lymphoma."], ["D", "Contagious in children only."], ["E", "Treated with griseofulvin."]], "a": "B", "sa": null, "pg": "28", "f": [], "s": "B", "n": 33, "e": ["Verrucae can involve mucous membranes (oral, genital, anal); they are not limited to skin, and are not caused by Treponema.", "Mucosal warts."]}, {"id": "Q159", "ch": "Viral Infections", "q": "ONE of the following statements about warts is CORRECT", "o": [["A", "The primary lesion of verruca vulgaris is a skin-colored macule."], ["B", "Condyloma acuminata is caused by Treponema pallidum."], ["C", "Warts occur on the skin, but not on mucous membranes."], ["D", "Cancer cervix is a complication of female genital warts."], ["E", "All types are painless."]], "a": "D", "sa": null, "pg": "29", "f": [], "s": "B", "n": 34, "e": ["Genital warts (certain HPV types) are linked to cervical cancer; common warts are not skin-colored macules, and warts are not caused by Treponema.", "HPV 16/18 → cervix cancer."]}, {"id": "Q160", "ch": "Viral Infections", "q": "Verrucae vulgaris are", "o": [["A", "Genital warts."], ["B", "Plantar warts."], ["C", "Common warts."], ["D", "Plane warts."], ["E", "Filiform warts. 1     A male patient, 6 years old, presented with asymptomatic flat-topped lesion mucosa."]}, {"id": "Q167", "ch": "Viral Infections", "q": "This patient suffers from", "o": [["A", "Genital herpes."], ["B", "Verruca plana."], ["C", "Condyloma acuminata."], ["D", "Molluscum contagiosum."], ["E", "Impetigo contagiosum. 1     A female patient, 34 years old, presented with multiple soft, pinkish, moist, foul-smelling outgrowths involving her genitalia. The condition started about one year ago with a gradual onset and progressive course. (Clinical photo: multiple cauliflower-like warty growths on the genital/perianal area.)"]], "a": "C", "sa": null, "pg": "29", "f": [], "s": "B", "n": 42, "e": ["Discrete soft exophytic papules on the genitalia indicate condyloma acuminata, an HPV infection that is oncogenic with types 16 and 18.", "Condyloma."]}, {"id": "Q168", "ch": "Viral Infections", "q": "Management of this case is by", "o": [["A", "Phototherapy."], ["B", "Radiotherapy."], ["C", "Systemic acyclovir."], ["D", "Intralesional steroids."], ["E", "Podophyllin resin 25%."]], "a": "E", "sa": null, "pg": "30", "f": [], "s": "B", "n": 43, "e": ["Genital warts are treated with podophyllin resin (10-25%, weekly, washed after 1-4 h), imiquimod, cryotherapy or laser. Podophyllin is contraindicated in pregnancy.", "Podophyllin weekly."]}, {"id": "Q169", "ch": "Viral Infections", "q": "Treatment of verruca vulgaris is by", "o": [["A", "Surgical excision."], ["B", "Intralesional corticosteroids."], ["C", "Topical antibiotic."], ["D", "Topical steroid."], ["E", "Electrocautery."]], "a": "E", "sa": null, "pg": "30", "f": [], "s": "B", "n": 44, "e": ["Verruca vulgaris can be destroyed by electrocautery, cryotherapy or chemicals.", "Destructive therapy."]}, {"id": "Q170", "ch": "Viral Infections", "q": "Warts can be treated by all of the following EXCEPT", "o": [["A", "Laser."], ["B", "Cryotherapy."], ["C", "Electrocautery."], ["D", "Intralesional steroids."], ["E", "Chemical cautery."]], "a": "D", "sa": null, "pg": "30", "f": [], "s": "B", "n": 45, "e": ["Intralesio , "o": [["A", "Molluscum contagiosum."], ["B", "Warts."], ["C", "Herpes zoster."], ["D", "Tinea capitis."], ["E", "Impetigo contagiosum."]], "a": "A", "sa": null, "pg": "30", "f": [], "s": "B", "n": 50, "e": ["Poxvirus causes molluscum contagiosum; warts are HPV, zoster is VZV and impetigo contagiosa is bacterial.", "Molluscum = pox."]}, {"id": "Q176", "ch": "Viral Infections", "q": "Which one of the following viruses is responsible for causing molluscum contagiosum?", "o": [["A", "Human papilloma virus."], ["B", "Herpes simplex virus."], ["C", "Pox virus."], ["D", "Varicella zoster virus."], ["E", "Human immunodeficiency virus."]], "a": "C", "sa": null, "pg": "30", "f": [], "s": "B", "n": 51, "e": ["Molluscum contagiosum is caused by a poxvirus, which causes pearly umbilicated papules.", "Pox."]}, {"id": "Q177", "ch": "Viral Infections", "q": "Molluscum contagiosum is", "o": [["A", "A bacterial infection with vesicle as primary lesion."], ["B", "A mycobacterial infection transmitted by droplet."], ["C", "A fungal infection caused by a yeast."], ["D", "A parasitic infection with nocturnal itching."], ["E", "A viral infection caused by pox virus. 1     (Clinical photo: close-up of skin with multiple small umbilicated, pearly papules.)"]], "a": "E", "sa": null, "pg": "30", "f": [], "s": "B", "n": 52, "e": ["Molluscum contagiosum is a viral infection by pox virus, spread by skin contact; it is considered an STD when genital.", "Pox virus."]}, {"id": "Q178", "ch": "Viral Infections", "q": "The causative organism is", "o": [["A", "β-haemolytic Streptococci."], ["B", "Staphylococcus aureus."], ["C", "Human papilloma virus."], ["D", "Pox virus."], ["E", "Herpes simplex virus."]], "a": "D", "sa": null, "pg": "30", "f": [], "s": "B", "n": 53, "e": ["Pox virus is the cause of the umbilicated pearly papules of molluscum contagiosum.", "Pox."]}, {"id": "Q179", "ch": "Viral Infections", "q": "The primary lesion of molluscum contagiosum is", "o": [["A", "Macule."], ["B", "Papule."], ["C", "Plaque."], ["D", "Vesicle."], ["E", "Pustule."]], "a": "B", "sa": null, "pg": "30", "f": [], "s": "B", "n": 54, "e": ["The primary lesion of molluscum is a firm, pearly white, umbilicated papule with a waxy surface from which white cheesy material can be expressed.", "Papule."]}, {"id": "Q180", "ch": "Viral Infections", "q": "A pearly papule with central umbilication exuding cheesy material is typical of", "o": [["A", "Molluscum contagiosum."], ["B", "Plane wart."], ["C", "Varicella."], ["D", "Condyloma acuminata."], ["E", "Seborrheic keratosis."]], "a": "A", "sa": null, "pg": "30", "f": [], "s": "B", "n": 55, "e": ["A pearly papule with central umbilication and cheesy material is molluscum contagiosum.", "Umbilicated."]}, {"id": "Q181", "ch": "Viral Infections", "q": "Molluscum contagiosum lesions are", "o": [["A", "Painful grouped vesicles on an erythematous base."], ["B", "Firm umbilicated pearly white papules expressing white cheesy material."], ["C", "Thick endophytic tender papules on the palms and soles."], ["D", "Annular scaly patches with central clearing."], ["E", "Deep nodules with sinus tracts."]], "a": "B", "sa": null, "pg": "30", "f": [], "s": "B", "n": 56, "e": ["Molluscum lesions are firm umbilicated pearly papules that express cheesy material.", "Curettage/expression."]}, {"id": "Q182", "ch": "Viral Infections", "q": "All of the following may be used in the treatment of molluscum contagiosum EXCEPT", "o": [["A", "Electrocautery."], ["B", "Carbolic acid."], ["C", "Cryotherapy."], ["D", "Steroids."], ["E", "Laser."]], "a": "D", "sa": null, "pg": "31", "f": [], "s": "B", "n": 57, "e": ["Molluscum is treated by curettage, cautery, cryotherapy, laser and chemicals, not steroids.", "No steroids."]}, {"id": "Q183", "ch": "Viral Infections", "q": "Which of the following is a sexually transmitted disease?", "o": [["A", "Herpes zoster."], ["B", "Psoriasis vulgaris."], ["C", "Molluscum contagiosum."], ["D", "Lichen planus."], ["E", "Tinea versicolor."]], "a": "C", "sa": null, "pg": "30", "f": [], "s": "B", "n": 58, "e": ["Molluscum contagiosum is considered a sexually transmitted disease if it involves genital skin or mucosa, spread by direct contact.", "Genital molluscum = STD."]}, {"id": "Q184", "ch": "Viral Infections", "q": "The following may be sexually transmitted", "o": [["A", "Psoriasis."], ["B", "Lichen planus."], ["C", "Warts."], ["D", "Eczema."], ["E", "Vitiligo."]], "a": "C", "sa": null, "pg": "28", "f": [], "s": "B", "n": 59, "e": ["Genital warts (condyloma acuminata) are sexually transmitted HPV infections.", "Genital warts STD."]}, {"id": "Q185", "ch": "Viral Infections", "q": "Which of the following is a sexually transmitted skin disease?", "o": [["A", "Herpes progenitalis."], ["B", "Condyloma acuminata."], ["C", "Molluscum contagiosum."], ["D", "All of the above."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": "30", "f": [], "s": "B", "n": 60, "e": ["Herpes progenitalis, condyloma acuminata and molluscum contagiosum are all sexually transmitted skin diseases.", "All of the above."]}, {"id": "Q186", "ch": "Viral Infections", "q": "All of the following diseases may be sexually transmitted EXCEPT", "o": [["A", "Scabies."], ["B", "Molluscum contagiosum."], ["C", "Condyloma acuminata."], ["D", "Eczema herpeticum."], ["E", "Herpes progenitalis."]], "a": "D", "sa": null, "pg": "23", "f": [], "s": "B", "n": 61, "e": ["Eczema herpeticum is a complication of HSV in atopic skin, not an STD itself.", "Eczema herpeticum = atopics."]}, {"id": "Q187", "ch": "Viral Infections", "q": "Choose the correct statement", "o": [["A", "Lichen planus is caused by pox virus"], ["B", "The treatment of choice of discoid lupus erythematosus is PUVA"], ["C", "Herald patch is the primary lesion of urticaria"], ["D", "Molluscum contagiosum is a sexually transmitted disease"], ["E", "Alopecia areata is a form of cicatricial alopecia"]], "a": "D", "sa": null, "pg": "30", "f": [], "s": "B", "n": 62, "e": ["Per the book, molluscum contagiosum involving genital skin is a sexually transmitted disease; it spreads by skin-to-skin contact and rarely fomites.", "Adult molluscum is sexually transmissible."]}, {"id": "H079", "ch": "Viral Infections", "q": "One attack gives solid immunity for:", "o": [["A", "Herpes simplex."], ["B", "Herpes zoster."], ["C", "Scabies."], ["D", "Impetigo."], ["E", "Molluscum contagiosum."]], "a": "B", "sa": null, "pg": null, "f": [], "s": "H", "n": 63, "e": ["Herpes zoster usually gives solid lifelong immunity after one attack, unlike herpes simplex which recurs.", "Zoster rarely recurs."]}, {"id": "H082", "ch": "Viral Infections", "q": "ONE of the following statements about warts is CORRECT:", "o": [["A", "The primary lesion of common warts is a skin-colored macule."], ["B", "Condyloma acuminata is caused by Treponema pallidum."], ["C", "Warts occur on the skin, but not on mucous membranes."], ["D", "Cancer cervix is a complication of female genital warts."], ["E", "All types are painless."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 64, "e": ["Genital warts of oncogenic HPV types 16 and 18 can predispose to cervical dysplasia and carcinoma; common warts are hyperkeratotic papules, not macules, and Treponema pallidum causes syphilis.", "HPV 16/18 → cervix."]}, {"id": "H083", "ch": "Viral Infections", "q": "All of the following microorganisms have a predilection for neural tissue EXCEPT:", "o": [["A", "Varicella zoster virus."], ["B", "Human papilloma virus."], ["C", "Herpes simplex virus."], ["D", "Lepra bacilli."], ["E", "Pox virus."]], "a": "B", "sa": null, "pg": null, "f": ["Answer key lists two answers (B / E); B shown. Verify."], "s": "H", "n": 65, "e": ["HPV is not neurotropic, and pox virus also lacks neural predilection; the key accepts both B and E. Please verify.", "Neurotropic: VZV, HSV, lepra."]}, {"id": "H084", "ch": "Viral Infections", "q": "Condyloma acuminatum:", "o": [["A", "Is herpes simplex virus infection of the genital area."], ["B", "Involves female genital areas only."], ["C", "Usually affect skin & mucous membranes of the genital area."], ["D", "Is an entirely benign lesion."], ["E", "Forms deep nodules in the genital area."]], "a": "C", "sa": null, "pg": null, "f": [], "s": "H", "n": 66, "e": ["Condyloma acuminatum affects skin and mucous membranes of the genital area.", "Genital HPV."]}, {"id": "H101", "ch": "Viral Infections", "q": "Herpes progenitalis is:", "o": [["A", "Caused by HSV type II."], ["B", "Linked with cancer cervix."], ["C", "Characterized by recurrent vesicles & erosions on genitalia."], ["D", "All of the above."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 67, "e": ["Herpes progenitalis is caused by HSV-2, linked with cervical cancer, and characterized by recurrent vesicles and erosions, so all of the above.", "HSV-2, recurrent."]}, {"id": "H102", "ch": "Viral Infections", "q": "A female patient, 30 years old, presented with a tender papule involving her sole, started about two months ago. Patient felt pain while walking or running. This patient suffers from:", "o": [["A", "Plantar warts."], ["B", "Moniliasis."], ["C", "Leprotic nodules."], ["D", "Post-scabietic nodules."], ["E", "Condyloma acuminata."]], "a": "A", "sa": null, "pg": null, "f": [], "s": "H", "n": 68, "e": ["A tender papule on the sole that hurts when walking or running, with onset over months, is a plantar wart. Post-scabietic nodules occur on genitalia and axillae.", "Plantar wart."]}, {"id": "H103", "ch": "Viral Infections", "q": "A female patient, 15 years old, presented with perioral blisters of 4 days duration. Patient was feverish before appearance of the rash by 2 days and she felt a tingling sensation in the area. Patient stated that the condition was recurrent. The causative organism of this disease is:", "o": [["A", "Group A B-haemolytic Streptococci."], ["B", "Varicella zoster virus."], ["C", "Staphylococcus aureus."], ["D", "Human papilloma virus."], ["E", "Herpes simplex virus."]], "a": "E", "sa": null, "pg": null, "f": [], "s": "H", "n": 69, "e": ["Perioral blisters with fever and tingling beforehand in a person with recurrence are due to herpes simplex virus (HSV-1) reactivation from the sensory ganglion.", "HSV recurrent."]}, {"id": "H104", "ch": "Viral Infections", "q": "A male patient, 6 years old, presented with asymptomatic flat topped lesions on his face. The condition started 5 months ago with a gradual onset and a progressive course. This patient suffers from:", "o": [["A", "Psoriasis."], ["B", "Plane warts."], ["C", "Molluscum contagiosum."], ["D", "Scabies."], ["E", "Condyloma acuminata."]], "a": "B", "sa": null, "pg": null, "f": [], "s": "H", "n": 70, "e": ["Asymptomatic flat-topped lesions on a child's face with gradual onset are plane warts.", "Plane warts."]}, {"id": "H113", "ch": "Viral Infections", "q": "Herpes labialis:", "o": [["A", "Is recurrent."], ["B", "Heals with scar."], ["C", "Its primary lesion is a papule."], ["D", "Is strictly unilateral."], ["E", "Is caused by HSV II."]], "a": "A", "sa": null, "pg": null, "f": [], "s": "H", "n": 71, "e": ["Herpes labialis recurs because HSV stays latent in the dorsal root ganglion and is reactivated by stress, UV, fever, menstruation. It is usually HSV-1, heals without scar and begins as vesicles.", "Recurrent HSV."]}, {"id": "H114", "ch": "Viral Infections", "q": "All of the following is true for herpes zoster Except:", "o": [["A", "It is recurrent."], ["B", "It is a viral infection."], ["C", "It is preceded by pain."], ["D", "It is unilateral."], ["E", "It might cause scarring."]], "a": "A", "sa": null, "pg": null, "f": [], "s": "H", "n": 72, "e": ["Zoster is not usually recurrent; it is preceded by pain, is unilateral, viral and may scar.", "Zoster seldom recurs."]}, {"id": "Q188", "ch": "Fungal Infections", "q": "Dermatophytes cause infection of", "o": [["A", "Non-hairy skin."], ["B", "Hair."], ["C", "Nails."], ["D", "a + b."], ["E", "a + b + c."]], "a": "E", "sa": null, "pg": "32", "f": [], "s": "B", "n": 1, "e": ["Dermatophytes are keratin-loving fungi that infect the stratum corneum of the glabrous (non-hairy) skin, the hair and the nails, so a + b + c is correct.", "Skin, hair, nails."]}, {"id": "Q189", "ch": "Fungal Infections", "q": "Tinea capitis is", "o": [["A", "A disorder of keratinization."], ["B", "A disease of adults only."], ["C", "Staphylococcal infection of the hair follicle."], ["D", "Always a cause of cicatricial alopecia."], ["E", "Ringworm of the scalp."]], "a": "E", "sa": null, "pg": "32", "f": [], "s": "B", "n": 2, "e": ["Tinea capitis is ringworm of the scalp, and tinea corporis, cruris, barbae, pedis and manuum are the other sites.", "Capitis = scalp."]}, {"id": "Q190", "ch": "Fungal Infections", "q": "Onychomycosis is ringworm of", "o": [["A", "Scalp."], ["B", "Beard."], ["C", "Groin."], ["D", "Nails."], ["E", "Trunk."]], "a": "D", "sa": null, "pg": "32", "f": [], "s": "B", "n": 3, "e": ["Onychomycosis (tinea unguium) is fungal infection of the nails with yellow-white discoloration, thickening and onycholysis, treated with terbinafine or azoles.", "Nails."]}, {"id": "Q191", "ch": "Fungal Infections", "q": "A 4-year-old child presented with a circumscribed area of hair loss. On examination, short stumps of hairs and scales were seen. The most probable diagnosis is", "o": [["A", "Alopecia areata."], ["B", "Tinea capitis (scaly ringworm)."], ["C", "Discoid lupus erythematosus."], ["D", "Lichen planus."], ["E", "Psoriasis."]], "a": "B", "sa": null, "pg": "33", "f": [], "s": "B", "n": 4, "e": ["A child with a round scaly bald patch and broken hair stumps has scaly tinea capitis.", "Short stumps + scales."]}, {"id": "Q192", "ch": "Fungal Infections", "q": "A scaly patch on the scalp with hair loss in a child is characteristic of", "o": [["A", "Alopecia areata."], ["B", "Ringworm of scalp."], ["C", "Telogen effluvium."], ["D", "DLE."], ["E", "Tinea versicolor."]], "a": "B", "sa": null, "pg": "33", "f": [], "s": "B", "n": 5, "e": ["A scaly patch of hair loss in a child is scaly tinea capitis (ringworm), where loose hairs break off leaving bald patches with grayish scales.", "Child + scaly bald patch."]}, {"id": "Q193", "ch": "Fungal Infections", "q": "Scaly type of tinea capitis", "o": [["A", "Is associated with hair loss."], ["B", "Causes scarring."], ["C", "Is a non-infectious disease."], ["D", "Affects children & adults."], ["E", "Is treated by oral nystatin."]], "a": "A", "sa": null, "pg": "33", "f": [], "s": "B", "n": 6, "e": ["In scaly tinea capitis hair breaks off producing single or multiple bald patches with fine gray scales, in children only, without scarring.", "Hair loss, no scar."]}, {"id": "Q194", "ch": "Fungal Infections", "q": "Which of the following is a characteristic of scaly scalp ringworm?", "o": [["A", "More frequent occurrence in childhood."], ["B", "Is a cause of permanent alopecia."], ["C", "Ability to invade the dermis."], ["D", "Ability to invade other organs."], ["E", "Sensitivity to penicillin."]], "a": "A", "sa": null, "pg": "33", "f": [], "s": "B", "n": 7, "e": ["Scaly scalp ringworm is characteristic of childhood and usually resolves at puberty.", "Child disease."]}, {"id": "Q195", "ch": "Fungal Infections", "q": "Kerion", "o": [["A", "Is a boggy swelling simulating an abscess."], ["B", "Is a disease of adults only."], ["C", "Is a staphylococcal infection of the hair follicle."], ["D", "Is associated with systemic manifestations."], ["E", "Never leads to cicatricial alopecia."]], "a": "A", "sa": null, "pg": "33", "f": [], "s": "B", "n": 8, "e": ["Kerion is an inflammatory boggy swelling with pustules simulating an abscess, from zoophilic fungi.", "Kerion = fungal abscess-like."]}, {"id": "Q196", "ch": "Fungal Infections", "q": "Kerion is:", "o": [["A", "Staphylococcal infection of the hair follicle."], ["B", "Associated with systemic manifestations."], ["C", "A disease which never leads to cicatricial alopecia."], ["D", "All of the above."], ["E", "None of the above."]], "a": "E", "sa": null, "pg": "33", "f": [], "s": "B", "n": 9, "e": ["The offered statements about kerion are incorrect (it is not staph, not always systemic, and may scar), so none of the above.", "Kerion can scar."]}, {"id": "Q197", "ch": "Fungal Infections", "q": "A child presents with an area of boggy, tender swelling studded with follicular pustules on the scalp, with patchy hair loss; it did not improve with antibiotics and may lead to scarring alopecia. The most likely diagnosis is:", "o": [["A", "Ecthyma."], ["B", "Favus."], ["C", "Discoid lupus erythematosus."], ["D", "Kerion."], ["E", "Seborrheic dermatitis."]], "a": "D", "sa": null, "pg": "33", "f": [], "s": "B", "n": 10, "e": ["A boggy tender scalp swelling with follicular pustules in a child is a kerion.", "Kerion → scarring risk."]}, {"id": "Q198", "ch": "Fungal Infections", "q": "One of the following may cause cicatricial alopecia", "o": [["A", "Androgenetic alopecia."], ["B", "Telogen effluvium."], ["C", "Alopecia areata."], ["D", "Kerion."], ["E", "Scaly ringworm."]], "a": "D", "sa": null, "pg": "33", "f": [], "s": "B", "n": 11, "e": ["Kerion may cause cicatricial alopecia because of intense inflammation; scaly ringworm does not.", "Kerion, favus scar."]}, {"id": "Q199", "ch": "Fungal Infections", "q": "Scutula is the characteristic lesion of", "o": [["A", "Scaly ringworm."], ["B", "Black-dot ringworm."], ["C", "Favus."], ["D", "Kerion."], ["E", "None of the above."]], "a": "C", "sa": null, "pg": "33", "f": [], "s": "B", "n": 12, "e": ["Scutula (yellow cup-shaped crusts around hairs) is characteristic of favus.", "Scutula = favus."]}, {"id": "Q200", "ch": "Fungal Infections", "q": "A child presents with an area of thick yellow cup-shaped crusts surrounding hair shafts on the scalp, associated with scarring alopecia. The most likely diagnosis is:", "o": [["A", "Tinea corporis."], ["B", "Favus."], ["C", "Discoid lupus erythematosus."], ["D", "Impetigo."], ["E", "Seborrheic dermatitis. 1     Case 6: A female patient, 10 years old, presented with scaly plaques on her scalp of two months duration. Lesions started by a gradual onset and a progressive course and ended by almost complete loss of scalp hair. (Clinical photo: scalp covered with yellowish cup-shaped crusts with hair loss.)"]], "a": "B", "sa": null, "pg": "33", "f": [], "s": "B", "n": 13, "e": ["Thick yellow cup-shaped crusts around hair shafts with scarring alopecia are favus.", "Favus scars."]}, {"id": "Q201", "ch": "Fungal Infections", "q": "The sign seen in the photo is", "o": [["A", "Wheal."], ["B", "Papule."], ["C", "Scutula."], ["D", "Comedone."], ["E", "Burrow. 1     Case 6: A female patient, 10 years old, presented with scaly plaques on her scalp of two months duration. Lesions started by a gradual onset and a progressive course and ended by almost complete loss of scalp hair. (Clinical photo: scalp covered with yellowish cup-shaped crusts with hair loss.)"]], "a": "C", "sa": null, "pg": "33", "f": [], "s": "B", "n": 14, "e": ["Scutula are the yellow cup-shaped sulfur crusts around hairs in favus.", "Scutula = favus."]}, {"id": "Q202", "ch": "Fungal Infections", "q": "Regarding this disease, choose the correct statement", "o": [["A", "Is a superficial bacterial infection."], ["B", "Is a deep parasitic infection."], ["C", "Is a cause of cicatricial alopecia."], ["D", "Affects children only."], ["E", "Treated by topical ivermectin 1%."]], "a": "C", "sa": null, "pg": "33", "f": [], "s": "B", "n": 15, "e": ["Favus gives scutula and diffuse hair loss replaced by fibrous tissue, so it causes cicatricial alopecia, and occurs in children and adults.", "Favus scars."]}, {"id": "Q203", "ch": "Fungal Infections", "q": "Wood's light is used in the diagnosis of", "o": [["A", "Tinea versicolor."], ["B", "Erythrasma."], ["C", "Favus."], ["D", "All of the above."], ["E", "None of the above. 1     Case 3: A female patient, 19 years old, presented with an annular well-defined plaque on her forearm. The lesion showed an active border and a clear center. The condition started about 3 weeks ago with a gradual onset and a progressive course. She applied topical antibiotic cream for 2 weeks with no improvement. (Clinical photo: annular plaque with active scaly border and clear center on the forearm.)"]], "a": "D", "sa": null, "pg": "34", "f": [], "s": "B", "n": 16, "e": ["Wood's light fluoresces versicolor (yellow), erythrasma (coral red), and favus/black-dot ringworm (yellowish-green), so all of the above.", "Versicolor, erythrasma, favus."]}, {"id": "Q204", "ch": "Fungal Infections", "q": "This plaque is suggestive of", "o": [["A", "Seborrheic dermatitis."], ["B", "Irritant dermatitis."], ["C", "Scabies."], ["D", "Tinea circinata."], ["E", "Tinea versicolor. 1     Case 3: A female patient, 19 years old, presented with an annular well-defined plaque on her forearm. The lesion showed an active border and a clear center. The condition started about 3 weeks ago with a gradual onset and a progressive course. She applied topical antibiotic cream for 2 weeks with no improvement. (Clinical photo: annular plaque with active scaly border and clear center on the forearm.)"]], "a": "D", "sa": null, "pg": "34", "f": [], "s": "B", "n": 17, "e": ["An annular plaque with an active scaly vesicular edge and healing center is tinea circinata (corporis).", "Ring edge + clear center."]}, {"id": "Q205", "ch": "Fungal Infections", "q": "The following drug is used for treatment", "o": [["A", "Systemic antibiotic."], ["B", "Topical steroid."], ["C", "Systemic ivermectin."], ["D", "Topical permethrin."], ["E", "Topical azole."]], "a": "E", "sa": null, "pg": "37", "f": [], "s": "B", "n": 18, "e": ["Localized tinea corporis or cruris is treated by topical azoles or terbinafine creams.", "Topical azole."]}, {"id": "Q206", "ch": "Fungal Infections", "q": "Which systemic treatment is used in treatment of tinea corporis?", "o": [["A", "Terbinafine."], ["B", "Ivermectin."], ["C", "Corticosteroids."], ["D", "Acitretin."], ["E", "Psoralen."]], "a": "A", "sa": null, "pg": "37", "f": [], "s": "B", "n": 19, "e": ["Extensive or resistant tinea corporis needs a systemic antifungal: griseofulvin, terbinafine or azoles. Terbinafine is the one listed.", "Terbinafine."]}, {"id": "Q207", "ch": "Fungal Infections", "q": "A 45-year-old farmer presents with scaly erythematous patches on the groin with an active, raised border and central clearing. What is the most likely diagnosis?", "o": [["A", "Tinea cruris."], ["B", "Candidal intertrigo."], ["C", "Pityriasis rosea."], ["D", "Seborrheic dermatitis."], ["E", "Erythrasma. 1     Case 2: A female patient, 33 years old, presented with an extending plaque on her inner thighs. The condition started about 2 months ago with a gradual onset and a progressive course. She applied a topical antibiotic cream for 2 weeks with no improvement. (Clinical photo: annular erythematous plaque with active border on the inner thigh.)"]], "a": "A", "sa": null, "pg": "35", "f": [], "s": "B", "n": 20, "e": ["Annular scaly groin patches with an active border and central clearing in a farmer indicate tinea cruris.", "Tinea cruris."]}, {"id": "Q208", "ch": "Fungal Infections", "q": "What is the diagnosis of this case?", "o": [["A", "Tinea manuum."], ["B", "Tinea unguium."], ["C", "Tinea cruris."], ["D", "Crusted scabies."], ["E", "Circinate impetigo. 1     Case 2: A female patient, 33 years old, presented with an extending plaque on her inner thighs. The condition started about 2 months ago with a gradual onset and a progressive course. She applied a topical antibiotic cream for 2 weeks with no improvement. (Clinical photo: annular erythematous plaque with active border on the inner thigh.)"]], "a": "C", "sa": null, "pg": "35", "f": [], "s": "B", "n": 21, "e": ["Scaly erythematous groin patches with an active border and central clearing, sparing the scrotum, are tinea cruris.", "Spares the scrotum."]}, {"id": "Q209", "ch": "Fungal Infections", "q": "Which medication will benefit the patient?", "o": [["A", "Oral terbinafine."], ["B", "Topical corticosteroids."], ["C", "Oral ivermectin."], ["D", "Topical psoralen."], ["E", "Oral antibiotics."]], "a": "A", "sa": null, "pg": "37", "f": [], "s": "B", "n": 22, "e": ["Extensive tinea cruris is treated with oral terbinafine, azoles or griseofulvin; topical azoles suffice for mild cases.", "Terbinafine."]}, {"id": "Q210", "ch": "Fungal Infections", "q": "Tinea cruris may be confused with", "o": [["A", "Flexural psoriasis."], ["B", "Erythrasma."], ["C", "Candidal intertrigo."], ["D", "All of the above."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": "35", "f": [], "s": "B", "n": 23, "e": ["Tinea cruris resembles flexural psoriasis, erythrasma and candidal intertrigo.", "DD: psoriasis, erythrasma, candida."]}, {"id": "Q211", "ch": "Fungal Infections", "q": "All of the following are part of the differential diagnosis of tinea cruris EXCEPT:", "o": [["A", "Candidiasis."], ["B", "Seborrheic dermatitis."], ["C", "Erythrasma."], ["D", "Flexural psoriasis."], ["E", "Leprosy."]], "a": "E", "sa": null, "pg": "35", "f": [], "s": "B", "n": 24, "e": ["Leprosy is not in the differential of groin tinea; psoriasis, erythrasma and candida are.", "Leprosy no."]}, {"id": "Q212", "ch": "Fungal Infections", "q": "Flexural areas may be affected in", "o": [["A", "Psoriasis."], ["B", "Candidiasis."], ["C", "Dermatophytosis."], ["D", "All of the above."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": "35", "f": [], "s": "B", "n": 25, "e": ["Flexures are affected in psoriasis, candida intertrigo, tinea and erythrasma.", "Intertrigo."]}, {"id": "Q213", "ch": "Fungal Infections", "q": "Tinea barbae", "o": [["A", "Is a viral infection of the beard area."], ["B", "May be circinate or kerion-like."], ["C", "Is a bacterial infection of the beard area."], ["D", "Is a painful vesicular eruption of the beard area."], ["E", "Responds to oral tetracycline."]], "a": "B", "sa": null, "pg": "35", "f": [], "s": "B", "n": 26, "e": ["Tinea barbae occurs in the beard, from farm animals or barber instruments, and may be annular like tinea circinata or kerion-like with pustules and hair loss.", "Beard ringworm."]}, {"id": "Q214", "ch": "Fungal Infections", "q": "A male patient, 33 years old, complains of an annular lesion with active border and pale center in his beard area, with acute onset and progressive course for two weeks; he took antibiotics with no improvement. The diagnosis is:", "o": [["A", "Tinea versicolor."], ["B", "Tinea barbae."], ["C", "Discoid lupus erythematosus."], ["D", "Molluscum contagiosum / warts."]], "a": "B", "sa": null, "pg": "35", "f": [], "s": "B", "n": 27, "e": ["An annular lesion with an active border in the beard area, unresponsive to antibiotics, is tinea barbae.", "Failed antibiotics."]}, {"id": "Q215", "ch": "Fungal Infections", "q": "Tinea pedis", "o": [["A", "Is strictly unilateral."], ["B", "Commonly involves the space between 1st & 2nd toes."], ["C", "Is a recurrent disease."], ["D", "Excessive dryness is a predisposing factor."], ["E", "Needs repeated washing of the feet."]], "a": "C", "sa": null, "pg": "36", "f": [], "s": "B", "n": 28, "e": ["Tinea pedis (athlete's foot) is common, usually bilateral, and recurrent, often from wet floors or shoes; moisture, sweating and diabetes predispose.", "Recurrent."]}, {"id": "Q216", "ch": "Fungal Infections", "q": "Excessive sweating & moisture is a predisposing factor for", "o": [["A", "Psoriasis."], ["B", "Pityriasis rosea."], ["C", "Vitiligo."], ["D", "Favus."], ["E", "Tinea pedis."]], "a": "E", "sa": null, "pg": "36", "f": [], "s": "B", "n": 29, "e": ["Excess sweating and moisture macerate the web spaces and favor dermatophyte growth in tinea pedis.", "Moist feet."]}, {"id": "Q217", "ch": "Fungal Infections", "q": "Tinea unguium affects", "o": [["A", "Nail fold."], ["B", "Nail plate."], ["C", "Groin."], ["D", "Joints."], ["E", "Interdigital space."]], "a": "B", "sa": null, "pg": "37", "f": [], "s": "B", "n": 30, "e": ["Tinea unguium affects the nail plate (lateral and distal borders), causing discoloration, thickening and onycholysis.", "Nail plate."]}, {"id": "Q218", "ch": "Fungal Infections", "q": "Tinea unguium affects", "o": [["A", "Nails."], ["B", "Joints."], ["C", "Hair follicle."], ["D", "Interdigital spaces."], ["E", "Flexures."]], "a": "A", "sa": null, "pg": "37", "f": [], "s": "B", "n": 31, "e": ["Tinea unguium is dermatophyte infection of nails (onychomycosis).", "Nails."]}, {"id": "Q219", "ch": "Fungal Infections", "q": "The main line of treatment of tinea capitis is", "o": [["A", "Tincture iodine."], ["B", "Griseofulvin."], ["C", "Malathion."], ["D", "Calcipotriene."], ["E", "Tetracycline."]], "a": "B", "sa": null, "pg": "37", "f": [], "s": "B", "n": 32, "e": ["Griseofulvin 12.5 mg/kg/day for 6-8 weeks is the backbone of tinea capitis therapy (alternative terbinafine); topical agents alone cannot reach the hair follicle.", "Griseofulvin = systemic."]}, {"id": "Q220", "ch": "Fungal Infections", "q": "Tinea capitis can be treated TOPICALLY ALONE by", "o": [["A", "Selenium sulphide."], ["B", "Castellani's paint."], ["C", "Tincture iodine."], ["D", "Imidazole derivatives."], ["E", "None of the above."]], "a": "E", "sa": null, "pg": "37", "f": [], "s": "B", "n": 33, "e": ["Tinea capitis cannot be cured by topical therapy alone because the fungus lies inside the hair.", "Systemic required."]}, {"id": "Q221", "ch": "Fungal Infections", "q": "An 18-year-old man presents with an oval, itchy area of patchy hair loss in the scalp with scales which appeared 2 weeks after visiting the barber. Which of the following options would be the most appropriate in treating this condition?", "o": [["A", "Fusidic acid cream."], ["B", "Acyclovir cream."], ["C", "Oral acyclovir."], ["D", "Oral erythromycin."], ["E", "Oral griseofulvin."]], "a": "E", "sa": null, "pg": "37", "f": [], "s": "B", "n": 34, "e": ["Patchy scaly hair loss in an adult needs systemic griseofulvin (backbone), because the fungus is inside the hair.", "Oral griseofulvin."]}, {"id": "Q222", "ch": "Fungal Infections", "q": "Given that the dose of griseofulvin is 12.5 mg/kg body weight/day and each tablet is 125 mg, an 80 kg man with extensive tinea cruris will take", "o": [["A", "5 tablets/day."], ["B", "9 tablets/day."], ["C", "7 tablets/day."], ["D", "8 tablets/day."], ["E", "6 tablets/day."]], "a": "D", "sa": null, "pg": "37", "f": [], "s": "B", "n": 35, "e": ["Dose = 12.5 mg/kg × 80 kg = 1000 mg per day; at 125 mg per tablet this is 8 tablets daily.", "1000 mg ÷ 125 mg = 8."]}, {"id": "Q223", "ch": "Fungal Infections", "q": "Griseofulvin may be used in the treatment of", "o": [["A", "Oral thrush."], ["B", "Tinea versicolor."], ["C", "Tinea corporis."], ["D", "Interdigital moniliasis."], ["E", "Balanitis."]], "a": "C", "sa": null, "pg": "37", "f": [], "s": "B", "n": 36, "e": ["Griseofulvin treats dermatophyte infections including tinea corporis, cruris and capitis, but not yeasts.", "Dermatophytes only."]}, {"id": "Q224", "ch": "Fungal Infections", "q": "Griseofulvin may be used in the treatment of", "o": [["A", "Oral thrush."], ["B", "Tinea versicolor."], ["C", "Tinea cruris."], ["D", "Interdigital moniliasis."], ["E", "Balanitis."]], "a": "C", "sa": null, "pg": "37", "f": [], "s": "B", "n": 37, "e": ["Tinea cruris is a dermatophytosis, so systemic griseofulvin, terbinafine or azoles can be used when extensive.", "Dermatophytosis."]}, {"id": "Q225", "ch": "Fungal Infections", "q": "Griseofulvin is a drug of choice for", "o": [["A", "Dermatophytosis."], ["B", "Tinea versicolor."], ["C", "Oral thrush."], ["D", "Erosio interdigitalis blastomycetica."], ["E", "Balanitis."]], "a": "A", "sa": null, "pg": "37", "f": [], "s": "B", "n": 38, "e": ["Griseofulvin is a drug of choice for dermatophyte infection.", "Not yeasts."]}, {"id": "Q226", "ch": "Fungal Infections", "q": "Griseofulvin is", "o": [["A", "The drug of choice in scalp pediculosis."], ["B", "Used for treatment of dermatophyte infection."], ["C", "Never used in children."], ["D", "Effective in treatment of pityriasis versicolor."], ["E", "The backbone for treatment of leprosy."]], "a": "B", "sa": null, "pg": "37", "f": [], "s": "B", "n": 39, "e": ["Griseofulvin works against dermatophytes but not against yeasts (Candida, Malassezia), nor is it used for leprosy or scalp lice.", "Dermatophytes."]}, {"id": "Q227", "ch": "Fungal Infections", "q": "Griseofulvin is effective in the treatment of all of the following EXCEPT", "o": [["A", "Tinea capitis."], ["B", "Tinea corporis."], ["C", "Tinea versicolor."], ["D", "Onychomycosis."], ["E", "Tinea pedis."]], "a": "C", "sa": null, "pg": "41", "f": [], "s": "B", "n": 40, "e": ["Griseofulvin is ineffective in pityriasis versicolor, which is due to a yeast.", "Griseofulvin ≠ versicolor."]}, {"id": "Q228", "ch": "Fungal Infections", "q": "Tinea versicolor is a superficial fungal infection caused by", "o": [["A", "Trichophyton rubrum."], ["B", "Malassezia furfur."], ["C", "Microsporum canis."], ["D", "Candida albicans."], ["E", "Trichophyton violaceum."]], "a": "B", "sa": null, "pg": "38", "f": [], "s": "B", "n": 41, "e": ["Pityriasis (tinea) versicolor is caused by the lipophilic yeast Malassezia furfur (and globosa), not by dermatophytes.", "Malassezia."]}, {"id": "Q229", "ch": "Fungal Infections", "q": "Malassezia furfur is the causative organism of", "o": [["A", "Tinea circinata."], ["B", "Tinea cruris."], ["C", "Pityriasis rosea."], ["D", "Pityriasis versicolor."], ["E", "Erythrasma."]], "a": "D", "sa": null, "pg": "38", "f": [], "s": "B", "n": 42, "e": ["Malassezia furfur causes pityriasis versicolor (and is also linked to seborrheic dermatitis).", "Pityriasis versicolor."]}, {"id": "Q230", "ch": "Fungal Infections", "q": "Malassezia furfur", "o": [["A", "Is a dermatophyte."], ["B", "Causes tinea capitis."], ["C", "Is treated by griseofulvin."], ["D", "All of the above."], ["E", "None of the above."]], "a": "E", "sa": null, "pg": "38", "f": [], "s": "B", "n": 43, "e": ["Malassezia is a yeast, not a dermatophyte, and is not treated by griseofulvin; the options are wrong so none of the above.", "Yeast."]}, {"id": "Q231", "ch": "Fungal Infections", "q": "Regarding pityriasis versicolor", "o": [["A", "It affects children only."], ["B", "It is very itchy."], ["C", "Systemic antifungal therapy is essential in the treatment."], ["D", "A single attack gives lifelong immunity."], ["E", "It is caused by the lipophilic yeast Malassezia furfur."]], "a": "E", "sa": null, "pg": "38", "f": [], "s": "B", "n": 44, "e": ["Versicolor is due to conversion of the round yeast Malassezia to the mycelial form, favored by heat, humidity, oily skin and sweating; it is not a dermatophyte, so griseofulvin fails.", "Lipophilic yeast."]}, {"id": "Q232", "ch": "Fungal Infections", "q": "Pityriasis versicolor", "o": [["A", "Is a superficial dermatophytic infection of the skin."], ["B", "Primary lesion is hyper- or hypopigmented papules."], ["C", "Macules are covered with fine branny scales."], ["D", "Treatment is by griseofulvin."], ["E", "Is non-infectious."]], "a": "C", "sa": null, "pg": "38", "f": [], "s": "B", "n": 45, "e": ["Versicolor shows hypo-, hyperpigmented or erythematous macules with fine branny scale, best seen on stretching or scratching the skin.", "Branny scale."]}, {"id": "Q233", "ch": "Fungal Infections", "q": "A male patient, 18 years old, had his summer vacation by the sea. He returned with hypo- and hyperpigmented finely scaly macules and patches on the upper trunk, neck and proximal upper limbs. What is the diagnosis?", "o": [["A", "Lichen planus."], ["B", "Pityriasis rosea."], ["C", "Pityriasis versicolor."], ["D", "Psoriasis."], ["E", "Subacute lupus."]], "a": "C", "sa": null, "pg": "38", "f": [], "s": "B", "n": 46, "e": ["Hypo- and hyperpigmented scaly macules on the trunk after sun exposure are pityriasis versicolor.", "Summer."]}, {"id": "Q234", "ch": "Fungal Infections", "q": "A 22-year-old female returns from a fortnight holiday in Cyprus with a tan and numerous scaly hypopigmented lesions on the neck and upper trunk. What is the most likely diagnosis?", "o": [["A", "Chronic plaque psoriasis."], ["B", "Contact eczema."], ["C", "Pityriasis rosea."], ["D", "Pityriasis versicolor."], ["E", "Candidiasis."]], "a": "D", "sa": null, "pg": "38", "f": [], "s": "B", "n": 47, "e": ["Scaly hypopigmented macules becoming obvious after a tan in summer are pityriasis versicolor (tanning does not occur in the affected patches).", "Summer + tan."]}, {"id": "Q235", "ch": "Fungal Infections", "q": "An adult patient presents with multiple, asymptomatic, hypopigmented macules on the upper back and chest with fine branny scaling. Lesions show yellow fluorescence under Wood's lamp. The most likely diagnosis is:", "o": [["A", "Erythrasma."], ["B", "Post-inflammatory hypopigmentation."], ["C", "Pityriasis rosea."], ["D", "Leprosy."], ["E", "Pityriasis versicolor. 1     A female patient presented with multiple small hypopigmented scaly macules on the back and trunk, extending to the breasts in addition to her neck and proximal upper limbs. The condition started after a summer vacation in Alexandria. Wood's light examination was performed. (Clinical photo: back/trunk with multiple small hypopigmented scaly macules.)"]], "a": "E", "sa": null, "pg": "38", "f": [], "s": "B", "n": 48, "e": ["Asymptomatic hypopigmented scaly macules on the upper trunk are versicolor.", "Upper trunk."]}, {"id": "Q236", "ch": "Fungal Infections", "q": "What is the diagnosis of this case?", "o": [["A", "Tinea cruris."], ["B", "Tinea versicolor."], ["C", "Tinea capitis."], ["D", "Tinea barbae."], ["E", "Tinea unguium. 1     A female patient presented with multiple small hypopigmented scaly macules on the back and trunk, extending to the breasts in addition to her neck and proximal upper limbs. The condition started after a summer vacation in Alexandria. Wood's light examination was performed. (Clinical photo: back/trunk with multiple small hypopigmented scaly macules.)"]], "a": "B", "sa": null, "pg": "38", "f": [], "s": "B", "n": 49, "e": ["Multiple hypopigmented scaly macules on the trunk are tinea (pityriasis) versicolor.", "Upper trunk."]}, {"id": "Q237", "ch": "Fungal Infections", "q": "Regarding this disease, choose the appropriate statement", "o": [["A", "Griseofulvin is an effective treatment."], ["B", "Itching is more at night."], ["C", "Slit-skin smear stained with Ziehl-Neelsen is used for diagnosis."], ["D", "Caused by the lipophilic yeast Malassezia furfur."], ["E", "A single attack gives lifelong immunity."]], "a": "D", "sa": null, "pg": "38", "f": [], "s": "B", "n": 50, "e": ["Versicolor is caused by Malassezia, a lipophilic yeast, usually asymptomatic with recurrences in summer.", "Lipophilic."]}, {"id": "Q238", "ch": "Fungal Infections", "q": "Regarding pityriasis versicolor, what is the result of Wood's light examination?", "o": [["A", "Coral red fluorescence."], ["B", "Yellow fluorescence."], ["C", "Permanganate-colored fluorescence."], ["D", "Bluish fluorescence."], ["E", "Brown fluorescence."]], "a": "B", "sa": null, "pg": "38", "f": [], "s": "B", "n": 51, "e": ["Wood's light gives yellow fluorescence in pityriasis versicolor (coral red is erythrasma).", "Yellow."]}, {"id": "Q239", "ch": "Fungal Infections", "q": "Wood's light examination reveals a yellow color when the skin is affected by", "o": [["A", "Vitiligo."], ["B", "Erythrasma."], ["C", "Tinea versicolor."], ["D", "Tinea circinata."], ["E", "None of the above."]], "a": "C", "sa": null, "pg": "38", "f": [], "s": "B", "n": 52, "e": ["Yellow fluorescence on Wood's light is seen in tinea versicolor, while erythrasma is coral red and vitiligo shows accentuated whiteness.", "Yellow = versicolor."]}, {"id": "Q240", "ch": "Fungal Infections", "q": "Spaghetti and meatballs appearance represents the mycelia and spores of", "o": [["A", "Candida albicans infection."], ["B", "Dermatophyte infection."], ["C", "Pityriasis versicolor infection."], ["D", "Staphylococcus aureus infection."], ["E", "Corynebacterium minutissimum infection."]], "a": "C", "sa": null, "pg": "38", "f": [], "s": "B", "n": 53, "e": ["KOH microscopy shows short thick hyphae with round spores, called spaghetti and meatballs, which is typical of Malassezia in versicolor.", "Spaghetti and meatballs."]}, {"id": "Q241", "ch": "Fungal Infections", "q": "A patient with multiple hypopigmented macules on the upper trunk that show yellow fluorescence under Wood's lamp, and KOH shows spaghetti and meatballs. The best treatment option is:", "o": [["A", "Topical steroid."], ["B", "Oral macrolide."], ["C", "Oral griseofulvin."], ["D", "Topical azole."], ["E", "Topical sulphur 5%."]], "a": "D", "sa": null, "pg": "38", "f": [], "s": "B", "n": 54, "e": ["Localized versicolor is treated with topical azoles (imidazole lotion, ketoconazole or selenium sulfide shampoos); systemic fluconazole or itraconazole are for extensive cases.", "Topical azole."]}, {"id": "Q242", "ch": "Fungal Infections", "q": "Tinea versicolor may be treated by one of the following", "o": [["A", "Ketoconazole."], ["B", "Griseofulvin."], ["C", "Fusidic acid."], ["D", "Tetracycline."], ["E", "Permethrin."]], "a": "A", "sa": null, "pg": "38", "f": [], "s": "B", "n": 55, "e": ["Ketoconazole (topical shampoo or systemic) is an azole effective against Malassezia. Griseofulvin is not.", "Azoles work."]}, {"id": "Q243", "ch": "Fungal Infections", "q": "Tinea versicolor can be treated by all of the following EXCEPT", "o": [["A", "Itraconazole."], ["B", "Ketoconazole."], ["C", "Griseofulvin."], ["D", "Fluconazole."], ["E", "Selenium sulphide."]], "a": "C", "sa": null, "pg": "38", "f": [], "s": "B", "n": 56, "e": ["Itraconazole, ketoconazole, fluconazole and selenium sulfide treat versicolor, but griseofulvin and terbinafine do not work on yeasts.", "Griseofulvin fails."]}, {"id": "Q244", "ch": "Fungal Infections", "q": "The following medications can be used for the treatment of pityriasis versicolor EXCEPT", "o": [["A", "Selenium sulphide 2.5%."], ["B", "Tincture iodine."], ["C", "Ketoconazole."], ["D", "Griseofulvin."], ["E", "Itraconazole."]], "a": "D", "sa": null, "pg": "41", "f": [], "s": "B", "n": 57, "e": ["Griseofulvin is ineffective against yeasts like Malassezia, so it is the exception.", "Griseofulvin doesn't treat yeasts."]}, {"id": "Q245", "ch": "Fungal Infections", "q": "Candida albicans is the causative organism of", "o": [["A", "Oral lichen planus."], ["B", "Tinea cruris."], ["C", "Oral thrush."], ["D", "Pityriasis versicolor."], ["E", "Erythrasma."]], "a": "C", "sa": null, "pg": "40", "f": [], "s": "B", "n": 58, "e": ["Candida albicans causes oral thrush, a whitish pseudomembrane in infants, debilitated adults and HIV patients, treated with nystatin suspension.", "Thrush = Candida."]}, {"id": "Q246", "ch": "Fungal Infections", "q": "Interdigital moniliasis of the hand is common between which fingers?", "o": [], "a": null, "sa": "Between the middle and ring fingers (3rd and 4th fingers), as this space is anatomically narrow.", "pg": "39", "f": [], "s": "B", "n": 59, "e": ["Interdigital candidiasis is common between the middle and ring fingers because this space is narrow and retains moisture.", "3rd–4th web."]}, {"id": "Q247", "ch": "Fungal Infections", "q": "Cutaneous manifestations of candida include", "o": [["A", "Ecthyma."], ["B", "Hypopigmentation."], ["C", "Favus."], ["D", "Herald patch."], ["E", "Perleche."]], "a": "E", "sa": null, "pg": "39", "f": [], "s": "B", "n": 60, "e": ["Perleche (angular cheilitis) is candidal maceration of the mouth angles; other cutaneous types are intertrigo, interdigital, napkin dermatitis and paronychia.", "Perleche."]}, {"id": "Q248", "ch": "Fungal Infections", "q": "Cutaneous manifestations of candida include all of the following EXCEPT", "o": [["A", "Intertrigo."], ["B", "Erosio interdigitalis blastomycetica."], ["C", "Favus."], ["D", "Paronychia."], ["E", "Perleche."]], "a": "C", "sa": null, "pg": "39", "f": [], "s": "B", "n": 61, "e": ["Favus is a dermatophyte infection of the scalp (yellow scutula), so it is not a candida manifestation.", "Favus = dermatophyte."]}, {"id": "Q249", "ch": "Fungal Infections", "q": "Cutaneous manifestations of candida include all of the following EXCEPT", "o": [["A", "Intertrigo."], ["B", "Erosio interdigitalis blastomycetica."], ["C", "Kerion."], ["D", "Paronychia."], ["E", "Perleche."]], "a": "C", "sa": null, "pg": "39", "f": [], "s": "B", "n": 62, "e": ["Kerion is an inflammatory dermatophyte scalp infection, not candidal.", "Kerion = dermatophyte."]}, {"id": "Q250", "ch": "Fungal Infections", "q": "All of the following are clinical presentations of candida infection EXCEPT", "o": [["A", "Erosio interdigitalis blastomycetica."], ["B", "Balanitis."], ["C", "Favus."], ["D", "Chronic paronychia."], ["E", "Perleche."]], "a": "C", "sa": null, "pg": "39", "f": [], "s": "B", "n": 63, "e": ["Candida presents as intertrigo, interdigital maceration, perleche, napkin dermatitis, paronychia and thrush; favus is a dermatophyte scalp disease.", "Favus excluded."]}, {"id": "Q251", "ch": "Fungal Infections", "q": "Candida may cause all of the following EXCEPT:", "o": [["A", "Perleche."], ["B", "Erythrasma."], ["C", "Chronic paronychia."], ["D", "Intertrigo."], ["E", "Erosio interdigitalis blastomycetica."]], "a": "B", "sa": null, "pg": "39", "f": [], "s": "B", "n": 64, "e": ["Erythrasma is caused by Corynebacterium minutissimum (bacterial), so Candida cannot cause it, whereas it can cause intertrigo, perleche and chronic paronychia.", "Erythrasma bacterial."]}, {"id": "Q252", "ch": "Fungal Infections", "q": "Candidiasis may present as all of the following EXCEPT:", "o": [["A", "Intertrigo."], ["B", "Oral thrush."], ["C", "Perleche."], ["D", "Candidal arthritis."], ["E", "Erosio interdigitalis blastomycetica."]], "a": "D", "sa": null, "pg": "39", "f": [], "s": "B", "n": 65, "e": ["Candida causes cutaneous and mucosal disease (intertrigo, paronychia, thrush, vulvovaginitis, balanitis); candidal arthritis is not one of the listed presentations.", "Not cutaneous."]}, {"id": "Q253", "ch": "Fungal Infections", "q": "Treatment of choice for candidal paronychia is:", "o": [["A", "Imiquimod."], ["B", "Clofazimine."], ["C", "Griseofulvin."], ["D", "Macrolide."], ["E", "Fluconazole."]], "a": "E", "sa": null, "pg": "41", "f": [], "s": "B", "n": 66, "e": ["Candidal paronychia is chronic, red, swollen nail fold in people with wet occupations; it is treated with fluconazole (systemic) and avoiding moisture. Griseofulvin does not work on yeasts.", "Fluconazole."]}, {"id": "Q254", "ch": "Fungal Infections", "q": "A 4-year-old child presented with a circumscribed area of hair loss. Short stumps of hairs and scales were seen. The diagnosis is", "o": [["A", "Alopecia areata."], ["B", "Tinea capitis."], ["C", "Discoid lupus erythematosus."], ["D", "Lichen planus."], ["E", "Psoriasis."]], "a": "B", "sa": null, "pg": "33", "f": [], "s": "B", "n": 67, "e": ["A circumscribed bald patch with short hair stumps and scales in a 4-year-old is scaly tinea capitis; alopecia areata has smooth skin without scales or stumps.", "Child + stumps + scales."]}, {"id": "H120", "ch": "Fungal Infections", "q": "Kerion:", "o": [["A", "Is a boggy swelling simulating an abscess."], ["B", "May lead to scarring alopecia."], ["C", "Is usually caused by fungi of animal origin."], ["D", "All of the above."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 68, "e": ["Kerion is a boggy abscess-like swelling, may scar, and is usually caused by zoophilic fungi; all of the above.", "Kerion scars."]}, {"id": "H123", "ch": "Fungal Infections", "q": "Griseofulvin may be used in the treatment of:", "o": [["A", "Oral thrush."], ["B", "Tinea versicolor."], ["C", "Tinea corporis."], ["D", "Interdigital monilia."], ["E", "None of the above."]], "a": "C", "sa": null, "pg": null, "f": [], "s": "H", "n": 69, "e": ["Griseofulvin treats dermatophyte infection, so it works in tinea corporis. It does not work against Candida (thrush, interdigital candidiasis) or versicolor.", "Dermatophytes only."]}, {"id": "H128", "ch": "Fungal Infections", "q": "A child presents with area of thick yellow cup-shaped crusts surrounding hair shafts on the scalp, associated with scarring alopecia. The most likely diagnosis is:", "o": [["A", "Tinea corporis."], ["B", "Favus."], ["C", "Discoid lupus erythematosus."], ["D", "Impetigo."], ["E", "Seborrheic dermatitis."]], "a": "B", "sa": null, "pg": null, "f": [], "s": "H", "n": 70, "e": ["Favus gives yellow cup-shaped sulfur crusts (scutula) around hair shafts and leaves scarring alopecia; impetigo has honey crusts but no scarring.", "Scutula + scar."]}, {"id": "H133", "ch": "Fungal Infections", "q": "Wood’s light is used in the diagnosis of:", "o": [["A", "Tinea versicolor."], ["B", "Erythrasma."], ["C", "Favus."], ["D", "All of the above."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 71, "e": ["Wood's light helps diagnose versicolor (yellow), erythrasma (coral red) and favus (yellow-green), so all.", "All three."]}, {"id": "H136", "ch": "Fungal Infections", "q": "Onychomycosis is:", "o": [["A", "Ringworm of the scalp."], ["B", "Ringworm of the beard."], ["C", "Ringworm of the groin."], ["D", "Ringworm of the nails."], ["E", "None of the above."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 72, "e": ["Onychomycosis is dermatophyte infection of the nails (tinea unguium).", "Nails."]}, {"id": "H140", "ch": "Fungal Infections", "q": "An adult patient presents with multiple, asymptomatic, hypopigmented macules on the upper back and chest with fine branny scaling. Lesions show yellow fluorescence under Wood's lamp. The most likely diagnosis is:", "o": [["A", "Erythrasma."], ["B", "Post-inflammatory hypopigmentation."], ["C", "Pityriasis rosea."], ["D", "Leprosy."], ["E", "Pityriasis versicolor."]], "a": "E", "sa": null, "pg": null, "f": [], "s": "H", "n": 73, "e": ["Asymptomatic hypopigmented macules with branny scale on the upper trunk showing yellow fluorescence are pityriasis versicolor, not erythrasma (coral red) or leprosy (anesthetic).", "Yellow glow."]}, {"id": "H145", "ch": "Fungal Infections", "q": "A 45-year-old farmer presents with scaly erythematous patches on the groin with an active, raised border and central clearing. What is the most likely diagnosis?", "o": [["A", "Tinea cruris."], ["B", "Candidal intertrigo."], ["C", "Pityriasis rosea."], ["D", "Seborrheic dermatitis."], ["E", "Erythrasma."]], "a": "A", "sa": null, "pg": null, "f": [], "s": "H", "n": 74, "e": ["An active, raised border with central clearing in the groin of a farmer is tinea cruris, spreading peripherally and sparing the scrotum.", "Active border."]}, {"id": "H146", "ch": "Fungal Infections", "q": "A patient presents with patchy hair loss associated with a boggy, tender scalp swelling and follicular pustules. The condition did not improve after a course of antibiotics. What is the most likely diagnosis?", "o": [["A", "Favus."], ["B", "Kerion."]], "a": "B", "sa": null, "pg": null, "f": [], "s": "H", "n": 75, "e": ["A boggy tender scalp swelling with pustules unresponsive to antibiotics is a kerion.", "Not bacterial."]}, {"id": "H155", "ch": "Fungal Infections", "q": "A male patient, 33 years old, complains of an annular lesion with an active border and pale center in his beard area, of acute onset and progressive course for two weeks. He took antibiotics with no improvement. The diagnosis is:", "o": [["A", "Tinea versicolor."], ["B", "Tinea barbae."], ["C", "Discoid lupus erythematosus."], ["D", "Molluscum contagiosum."]], "a": "B", "sa": null, "pg": null, "f": [], "s": "H", "n": 76, "e": ["An annular lesion with active border in the beard unresponsive to antibiotics is tinea barbae.", "Tinea barbae."]}, {"id": "H156", "ch": "Fungal Infections", "q": "A child presents with an area of boggy swelling studded with follicular pustules on the scalp, associated with scarring alopecia. The most likely diagnosis is:", "o": [["A", "Ecthyma."], ["B", "Favus."], ["C", "Discoid lupus erythematosus."], ["D", "Kerion."], ["E", "Seborrheic dermatitis."]], "a": "D", "sa": null, "pg": null, "f": [], "s": "H", "n": 77, "e": ["A boggy tender scalp swelling studded with follicular pustules is kerion, an intense inflammatory reaction that may scar if not treated early (ecthyma and DLE differ).", "Kerion → cicatricial alopecia."]}, {"id": "H157", "ch": "Fungal Infections", "q": "Which statement regarding the scaly type of tinea capitis is correct?", "o": [["A", "It affects adults only."], ["B", "Its presence should suggest immunological deficiency."], ["C", "It results in cicatricial alopecia."], ["D", "It causes patches that fluoresce yellow-green under Wood's lamp."], ["E", "It is effectively treated with topical nystatin ointment."]], "a": "D", "sa": null, "pg": null, "f": ["Answer key corrected per your instruction."], "s": "H", "n": 78, "e": ["The scaly type of tinea capitis (Microsporum) fluoresces yellow-green under Wood's lamp. Key corrected to D per your instruction.", "Microsporum = yellow-green."]}, {"id": "Q255", "ch": "Parasitic Infestations", "q": "Itching is the cardinal symptom in", "o": [["A", "Vitiligo"], ["B", "Alopecia"], ["C", "Scabies"], ["D", "Leprosy"], ["E", "Impetigo"]], "a": "C", "sa": null, "pg": null, "f": [], "s": "B", "n": 1, "e": ["Scabies produces intense generalized itching that is worse at night and when warm, which is the cardinal symptom and the first clue.", "Night itch."]}, {"id": "Q256", "ch": "Parasitic Infestations", "q": "The following disease is itchy", "o": [["A", "Alopecia areata"], ["B", "Ecthyma"], ["C", "Tinea capitis"], ["D", "Tuberculoid leprosy"], ["E", "Scabies"]], "a": "E", "sa": null, "pg": "42", "f": [], "s": "B", "n": 2, "e": ["Scabies is itchy (nocturnal pruritus) and contagious, whereas psoriasis, vitiligo and tinea are not described as itchy diseases.", "Scabies itches."]}, {"id": "Q257", "ch": "Parasitic Infestations", "q": "The following disease is contagious", "o": [["A", "Pityriasis rosea"], ["B", "Urticaria"], ["C", "Scabies"], ["D", "Vitiligo"], ["E", "Acne"]], "a": "C", "sa": null, "pg": "42", "f": [], "s": "B", "n": 3, "e": ["Scabies is contagious by close physical contact (and rarely via clothes or bedding), so contacts must be treated.", "Contact spread."]}, {"id": "Q258", "ch": "Parasitic Infestations", "q": "Scabies: what is the causative parasite, and what is the primary lesion?", "o": [], "a": null, "sa": "Sarcoptes scabiei (fertilized female mite); the primary lesion is the burrow.", "pg": null, "f": [], "s": "B", "n": 4, "e": ["Scabies is caused by the fertilized female Sarcoptes scabiei mite whose primary lesion is the burrow.", "Burrow."]}, {"id": "Q259", "ch": "Parasitic Infestations", "q": "A burrow is the primary lesion of", "o": [["A", "Acne vulgaris"], ["B", "Lupus vulgaris"], ["C", "Scabies"], ["D", "Urticaria"], ["E", "Psoriasis"]], "a": "C", "sa": null, "pg": "42", "f": [], "s": "B", "n": 5, "e": ["The burrow, a linear track under the stratum corneum, is the primary lesion of scabies. Other signs (papules, vesicles, excoriations) are secondary.", "Burrow."]}, {"id": "Q260", "ch": "Parasitic Infestations", "q": "The following diseases are scaly EXCEPT", "o": [["A", "Tinea versicolor"], ["B", "Erythrasma"], ["C", "Psoriasis"], ["D", "Pityriasis rosea"], ["E", "Scabies"]], "a": "E", "sa": null, "pg": "42", "f": [], "s": "B", "n": 6, "e": ["Scabies lesions are burrows, papules and excoriations, not scales, whereas psoriasis, tinea, seborrheic dermatitis and pityriasis rosea are scaly.", "Not scaly."]}, {"id": "Q261", "ch": "Parasitic Infestations", "q": "Scabies in adults usually involves the following body sites EXCEPT", "o": [["A", "Wrist"], ["B", "Genitalia"], ["C", "Buttocks"], ["D", "Upper back"], ["E", "Flexures"]], "a": "D", "sa": null, "pg": "43", "f": [], "s": "B", "n": 7, "e": ["Adult scabies spares the upper back; it involves finger webs, wrists, flexures, genitalia and buttocks.", "Upper back spared."]}, {"id": "Q262", "ch": "Parasitic Infestations", "q": "Sites of predilection of scabietic burrows in adults include all of the following EXCEPT", "o": [["A", "In-between fingers & wrist area"], ["B", "Medial sides of forearms"], ["C", "Anterior axillary folds & lower abdomen"], ["D", "Breast in females & genitalia in males"], ["E", "Upper back"]], "a": "E", "sa": null, "pg": "43", "f": [], "s": "B", "n": 8, "e": ["Scabies involves finger sides and webs, wrists, elbows, axillae, waist, buttocks, genitalia and feet, but spares the head, neck, upper back, palms and soles in adults.", "Upper back spared."]}, {"id": "Q263", "ch": "Parasitic Infestations", "q": "One of the following is a cause of pruritus in the pubic area", "o": [["A", "Scabies"], ["B", "Pediculosis capitis"], ["C", "Molluscum contagiosum"], ["D", "Tinea versicolor"], ["E", "Alopecia areata"]], "a": "A", "sa": null, "pg": null, "f": [], "s": "B", "n": 9, "e": ["Pubic itching occurs in scabies (genital involvement) and in pediculosis pubis; head lice, molluscum, versicolor and alopecia areata do not.", "Genitalia."]}, {"id": "Q264", "ch": "Parasitic Infestations", "q": "A patient presents with generalized itching at night and burrows in the fingers. The most likely diagnosis is:", "o": [["A", "Pediculosis"], ["B", "Scabies"], ["C", "Urticaria"], ["D", "Eczema"], ["E", "Candidiasis"]], "a": "B", "sa": null, "pg": "42", "f": [], "s": "B", "n": 10, "e": ["Generalized night itching with burrows on the fingers is scabies; urticaria has wheals and eczema has no burrows.", "Burrows."]}, {"id": "Q265", "ch": "Parasitic Infestations", "q": "The following may help in the diagnosis of scabies", "o": [["A", "Positive fam
