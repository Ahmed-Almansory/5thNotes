vere nodulocystic or scarring acne is treated with systemic retinoids. D) It is a disease of the pilosebaceous unit: Acne is a chronic inflammatory disease of the pilosebaceous unit.","Steroids worsen acne."],"im":[],"src":"Q510"},{"id":"K296","ch":"⭐ Key Ideas — each idea once","q":"In acne vulgaris,","o":[["A","There is loss of melanocytes."],["B","The sebum composition is normal."],["C","There is colonization of pilosebaceous units by Strep. acnes."],["D","Lesions include comedones, vesicles and nodulocysts."],["E","There is increased proliferation of keratinocytes."]],"a":"E","sa":null,"pg":"96","f":[],"n":296,"e":["Abnormal follicular keratinization with proliferation of keratinocytes blocks the follicle opening, forming the comedone. Why the other options are wrong: A) There is loss of melanocytes: Melanocytes are intact. B) The sebum composition is normal: Sebum composition changes. C) There is colonization of pilosebaceous u…: The organism is P. acnes. D) Lesions include comedones, vesicles and …: Acne lesions are comedones, papules, pustules, nodules and cysts; vesicles belong to viral or eczematous diseases.","Keratin plug."],"im":[],"src":"Q511"},{"id":"K297","ch":"⭐ Key Ideas — each idea once","q":"The following organism is related to acne vulgaris","o":[["A","Malassezia furfur."],["B","Corynebacterium minutissimum."],["C","Propionibacterium acnes."],["D","Streptococcus haemolyticus."],["E","Pityrosporum ovale."]],"a":"C","sa":null,"pg":"96","f":[],"n":297,"e":["Cutibacterium (Propionibacterium) acnes colonizes the pilosebaceous unit; Malassezia is linked to seborrheic dermatitis and Corynebacterium to erythrasma. Why the other options are wrong: A) Malassezia furfur: Malassezia is seb derm. B) Corynebacterium minutissimum: Corynebacterium is erythrasma. D) Streptococcus haemolyticus: Strep is impetigo. E) Pityrosporum ovale: Pityrosporum is Malassezia.","P. acnes."],"im":[],"src":"Q512"},{"id":"K298","ch":"⭐ Key Ideas — each idea once","q":"The following lesions are present in acne vulgaris EXCEPT","o":[["A","Papules."],["B","Comedones."],["C","Pustules."],["D","Nodules."],["E","Vesicles."]],"a":"E","sa":null,"pg":"96","f":[],"n":298,"e":["Acne lesions are comedones, papules, pustules, nodules and cysts. Vesicles are not part of acne. Why the other options are wrong: A) Papules: Present. B) Comedones: Present. C) Pustules: Present. D) Nodules: Present.","No vesicles."],"im":[],"src":"Q516"},{"id":"K299","ch":"⭐ Key Ideas — each idea once","q":"In acne vulgaris","o":[["A","Lesions are monomorphic, primary lesion is a comedone."],["B","Lesions are polymorphic, primary lesion is a cyst."],["C","Lesions are polymorphic, primary lesion is a comedone."],["D","Lesions are monomorphic, primary lesion is a pustule."],["E","Lesions are comedones, papules, vesicles, pustules & cysts."]],"a":"C","sa":null,"pg":"96","f":[],"n":299,"e":["Acne is polymorphic (many lesion types) and the primary lesion is the comedone. Why the other options are wrong: A) Lesions are monomorphic, primary lesion …: It is polymorphic. B) Lesions are polymorphic, primary lesion …: The primary lesion is a comedone. D) Lesions are monomorphic, primary lesion …: It is polymorphic. E) Lesions are comedones, papules, vesicles…: Acne lesions are comedones, papules, pustules, nodules and cysts; vesicles belong to viral or eczematous diseases.","Comedone."],"im":[],"src":"Q518"},{"id":"K300","ch":"⭐ Key Ideas — each idea once","q":"Scarring can occur as a result of","o":[["A","Psoriasis."],["B","Urticaria."],["C","Nodular acne."],["D","Actinic lichen planus."],["E","Erythrasma."]],"a":"C","sa":null,"pg":"96","f":[],"n":300,"e":["Inflammatory nodular and cystic acne destroys deep follicular tissue and scars, unlike psoriasis, urticaria or erythrasma. Why the other options are wrong: A) Psoriasis: Psoriasis is non-scarring. B) Urticaria: Urticaria is non-scarring. D) Actinic lichen planus: Actinic LP is non-scarring. E) Erythrasma: Erythrasma is non-scarring.","Nodulocystic scars."],"im":[],"src":"Q519"},{"id":"K301","ch":"⭐ Key Ideas — each idea once","q":"A male patient, 24 years old, presented with skin lesions on his face. The condition started since he was 14 years old with remissions and exacerbations. (Clinical photo: papules and pustules on the cheek.) This patient suffers from","o":[["A","Folliculitis."],["B","Molluscum contagiosum."],["C","Contact eczema."],["D","Acne vulgaris."],["E","Furunculosis."]],"a":"D","sa":null,"pg":"96","f":[],"n":301,"e":["Polymorphic facial lesions with comedones are acne vulgaris. Why the other options are wrong: A) Folliculitis: Folliculitis is pustular only. B) Molluscum contagiosum: Molluscum is umbilicated. C) Contact eczema: Contact eczema is itchy. E) Furunculosis: Furunculosis is boils.","Acne."],"im":[],"src":"Q522"},{"id":"K302","ch":"⭐ Key Ideas — each idea once","q":"A patient with comedones and few or no papules on his face has","o":[["A","Mild acne."],["B","Sycosis barbae."],["C","Bockhart impetigo."],["D","Acne conglobata."],["E","Folliculitis."]],"a":"A","sa":null,"pg":"97","f":[],"n":302,"e":["A patient with only comedones and few or no papules has mild acne (non-inflammatory acne). Why the other options are wrong: B) Sycosis barbae: Sycosis is beard. C) Bockhart impetigo: Bockhart is pustular. D) Acne conglobata: Conglobata is severe. E) Folliculitis: Folliculitis is pustular.","Mild acne."],"im":[],"src":"Q523"},{"id":"K303","ch":"⭐ Key Ideas — each idea once","q":"A teenage boy presents with oily skin, comedones, and inflammatory papules on face and back. First- line therapy includes topical:","o":[["A","Calcipotriol."],["B","Terbinafine."],["C","Crotamiton 10%."],["D","Retinoids."],["E","Steroid."]],"a":"D","sa":null,"pg":"99","f":[],"n":303,"e":["Oily skin with comedones and inflammatory papules is acne; topical retinoids are first-line because they normalize keratinization. Why the other options are wrong: A) Calcipotriol: Calcipotriol is for psoriasis. B) Terbinafine: Terbinafine is antifungal. C) Crotamiton 10%: Crotamiton is for scabies. E) Steroid: Steroids worsen acne.","Topical retinoid."],"im":[],"src":"Q524"},{"id":"K304","ch":"⭐ Key Ideas — each idea once","q":"An adolescent with comedones and papules on the skin is treated with which topical agent?","o":[],"a":null,"sa":"Topical benzoyl peroxide (other topical options: retinoids, erythromycin/clindamycin, azelaic acid)","pg":"99","f":[],"n":304,"e":["Comedones and papules are treated with topical agents: retinoids, benzoyl peroxide, antibiotics (erythromycin, clindamycin) or azelaic acid.","Topical first."],"im":[],"src":"Q525"},{"id":"K305","ch":"⭐ Key Ideas — each idea once","q":"Benzoyl peroxide may be used in the treatment of","o":[["A","Scabies."],["B","Acne vulgaris."],["C","Phthirus pubis."],["D","Impetigo."],["E","Pediculosis."]],"a":"B","sa":null,"pg":"99","f":[],"n":305,"e":["Benzoyl peroxide 2.5-10% is a bactericidal agent against C. acnes with no resistance. Why the other options are wrong: A) Scabies: Scabies uses permethrin. C) Phthirus pubis: Phthirus uses permethrin. D) Impetigo: Impetigo uses antibiotics. E) Pediculosis: Pediculosis uses permethrin.","BPO for acne."],"im":[],"src":"Q526"},{"id":"K306","ch":"⭐ Key Ideas — each idea once","q":"Acne vulgaris is","o":[["A","Cured by topical steroids."],["B","An infectious disease."],["C","Treated by oral retinoids in its nodulocystic forms."],["D","A disease affecting skin and mucous membranes."],["E","A disease of sweat glands."]],"a":"C","sa":null,"pg":"99","f":[],"n":306,"e":["Nodulocystic acne is severe and treated with oral retinoids (isotretinoin). Why the other options are wrong: A) Cured by topical steroids: Steroids worsen. B) An infectious disease: Acne is multifactorial (keratinization, sebum, Cutibacterium acnes); the bacterium is a skin commensal, not a contagious infection. D) A disease affecting skin and mucous memb…: Mucosa is spared. E) A disease of sweat glands: It is pilosebaceous.","Isotretinoin."],"im":[],"src":"Q528"},{"id":"K307","ch":"⭐ Key Ideas — each idea once","q":"Choose the wrong answer","o":[["A","Retinoids are special derivatives of vitamin A."],["B","Retinoids could be used topically or orally."],["C","Retinoids increase keratinization of the orifice."],["D","Systemic retinoids should not be given to females in childbearing period."],["E","Retinoids are used in severe acne."]],"a":"C","sa":null,"pg":"99","f":[],"n":307,"e":["Retinoids (vitamin A derivatives) normalize keratinization; saying they increase keratinization of the follicle orifice is incorrect. Why the other options are wrong: A) Retinoids are special derivatives of vit…: Retinoids are vitamin A derivatives. B) Retinoids could be used topically or ora…: Retinoids are used topically (all cases) or orally (severe cases). D) Systemic retinoids should not be given t…: Oral retinoids are teratogenic: pregnancy test and double contraception are mandatory. E) Retinoids are used in severe acne: Oral retinoids are used in severe inflammatory, nodulocystic or scarring acne.","Normalize keratinization."],"im":[],"src":"Q532"},{"id":"K308","ch":"⭐ Key Ideas — each idea once","q":"What is the systemic treatment of acne vulgaris?","o":[],"a":null,"sa":"Systemic antibiotics (tetracyclines, macrolides) and oral retinoids; also dapsone and antiandrogens/OCPs for females with hormonal disturbance","pg":"99","f":[],"n":308,"e":["Moderate or severe acne is treated with systemic antibiotics (tetracyclines, macrolides), oral retinoids and dapsone; females with hormonal causes get antiandrogens or OCPs.","Isotretinoin teratogenic."],"im":[],"src":"Q533"},{"id":"K309","ch":"⭐ Key Ideas — each idea once","q":"All of the following are factors in acne pathogenesis EXCEPT:","o":[["A","Increase in sebum production."],["B","Change in sebum composition."],["C","Increase in the epidermal turnover."],["D","Distension of pilosebaceous follicle."],["E","Microbial colonization of pilosebaceous units."]],"a":"C","sa":null,"pg":null,"f":["Key says increased epidermal turnover is not a factor, but keratinocyte hyperproliferation contributes to comedone formation. Please verify."],"n":309,"e":["Pathogenesis includes increased sebum and altered composition, distension of the follicle, microbial colonization and increased keratinocyte proliferation. The key marks 'increase in epidermal turnover' as the exception, though hyperproliferation does occur; flagged. Why the other options are wrong: A) Increase in sebum production: A factor. B) Change in sebum composition: A factor. D) Distension of pilosebaceous follicle: A factor. E) Microbial colonization of pilosebaceous…: A factor.","Keratinization abnormality."],"im":[],"src":"H318"},{"id":"K310","ch":"⭐ Key Ideas — each idea once","q":"The following drugs may be used in the treatment of acne EXCEPT:","o":[["A","Retinoids."],["B","Dapsone."],["C","Tetracyclines."],["D","Androgens."],["E","Steroids."]],"a":"D","sa":null,"pg":null,"f":[],"n":310,"e":["Retinoids, dapsone, tetracyclines and steroids (intralesional) may be used; androgens increase sebum and worsen acne. Why the other options are wrong: A) Retinoids: Retinoids are used topically and orally in acne. B) Dapsone: Dapsone is used for severe inflammatory and nodulocystic acne. C) Tetracyclines: Tetracyclines are used systemically for moderate to severe acne. E) Steroids: Intralesional or short oral steroid courses are used selectively for severe inflammatory lesions; androgens, in contrast, increase sebum production.","Androgens worsen acne."],"im":[],"src":"H328"}],"img":{},"notes":{"systems":[{"n":"Introduction To Dermatology","topics":[{"n":"Skin structure and function","facts":[{"t":"The **epidermis** is the outermost skin layer; its layers from deep to superficial are **basal → prickle (squamous) → granular → horny (stratum corneum)**, with a clear layer (lucidum) only on palms and soles.","q":["Q001","Q004","Q005","Q006","Q009"]},{"t":"**Keratinocytes** make up about 90% of epidermal cells and produce keratin; the **stratum corneum** is formed of flat, anucleate keratinized cells (corneocytes). Keratin is the structural protein of skin, hair and nails.","q":["Q002","Q003","Q007","H007"]},{"t":"The **basal layer** holds the germinative (stem) keratinocytes that renew the epidermis (turnover about 28 days).","q":["Q008"]},{"t":"Other epidermal cells: **melanocytes** (pigment), **Langerhans cells** (antigen-presenting; the immune function of the skin) and **Merkel cells** (basal layer; slowly adapting mechanoreceptors for gentle touch and pressure).","q":["Q002","Q010","Q534","H012"]},{"t":"**Skin appendages** are hair follicles, sebaceous glands, sweat glands (eccrine and apocrine) and nails; melanocytes, blood vessels and nerves are NOT appendages. The **pilosebaceous unit** (hair follicle + sebaceous gland) is the site of acne.","q":["Q011","Q012","Q013","Q014","Q015"]},{"t":"**Eccrine sweat glands** cover the whole body and control temperature by evaporation; **apocrine glands** are scent glands (axilla, groin).","q":["Q016"]},{"t":"Skin functions: protection, thermoregulation, sensation, secretion, excretion, immunity and **endocrine** activity (UVB converts 7-dehydrocholesterol into **vitamin D3**).","q":["Q017","Q018","Q019","Q020"]},{"t":"A full cutaneous examination covers skin, hair, nails and mucous membranes.","q":["H011"]}]},{"n":"Primary lesions","facts":[{"t":"**Macule**: flat, non-palpable colour change <1 cm; the same change >1 cm is a **patch** (e.g. vitiligo, pityriasis versicolor).","q":["Q022","Q023","Q024","H013"]},{"t":"**Papule**: solid palpable elevation <1 cm (e.g. warts); the classic papular disease is **lichen planus** (flat-topped, polyangular, violaceous, itchy, shiny).","q":["Q025","Q026","Q027","Q028","Q029"]},{"t":"**Plaque**: palpable flat-topped lesion >1 cm with abnormal skin texture, often from coalescing papules, mainly epidermal (e.g. psoriasis).","q":["Q030","Q031","H015"]},{"t":"**Nodule**: solid lesion >1 cm with a deep component in the dermis or subcutis (a dermal lesion, unlike the plaque).","q":["Q032","Q033","Q035","Q036"]},{"t":"**Wheal**: transient (evanescent) oedematous, erythematous or skin-coloured elevation of variable size from dermal oedema (histamine); the primary lesion of **urticaria**.","q":["Q037","Q038","Q039","Q040","Q055"]},{"t":"**Vesicle** (<0.5 cm) and **bulla** (>0.5 cm) are fluid-filled and differ by size; a **cyst** has a true epithelial wall, whereas a bulla has no wall.","q":["Q041","Q042","Q043","Q044","H019"]},{"t":"**Burrow**: linear tunnel in the stratum corneum dug by the fertilized female *Sarcoptes scabiei*; the diagnostic lesion of **scabies**. A **furrow** is a deroofed burrow.","q":["Q045","Q046","Q047","H021"]}]},{"n":"Secondary lesions","facts":[{"t":"A **crust** is a secondary lesion (primary lesions arise first: macule, papule, plaque, nodule, vesicle, bulla, pustule, wheal, cyst); it is dried serum, blood or pus (e.g. after herpes simplex vesicles, healing without scar).","q":["Q021","Q048","Q049"]},{"t":"**Scales** are laminated masses of keratin from increased proliferation (psoriasis) or decreased desquamation (ichthyosis).","q":["Q050","Q051","H023"]},{"t":"**Erosion** = loss of epidermis only (after rupture of vesicles/bullae), heals without scar; **ulcer** = loss of epidermis and dermis, heals with scar (e.g. ecthyma).","q":["Q052","Q053"]},{"t":"**Lichenification** = thickened skin with accentuated lines from chronic scratching.","q":["Q054"]}]}]},{"n":"Bacterial Infections","topics":[{"n":"Impetigo and ecthyma","facts":[{"t":"**Impetigo** is a superficial infection by *Staphylococcus aureus* and/or group A β-haemolytic streptococci; the lesion is a vesicle/pustule that ruptures to leave a **golden honey-coloured crust** on an erythematous base. Localized disease is treated with a **topical antibiotic** (fusidic acid, mupirocin).","q":["Q058","Q059","Q062"]},{"t":"Streptococcal impetigo can lead to **post-streptococcal acute glomerulonephritis** (not rheumatic fever).","q":["Q060","Q061"]},{"t":"**Bullous impetigo** is staphylococcal: *S. aureus* **exfoliative toxin** splits the upper epidermis, giving flaccid blisters; typical in neonates/infants, spreads by contact, is a superficial infection and heals without scarring.","q":["Q063","Q064","Q065","Q066","Q067","H028","H041","H042"]},{"t":"**Ecthyma** is **ulcerative impetigo**: a deep, streptococcal variant extending into the dermis (vesicle → pustule → thick crust → punched-out ulcer) that heals **with scar** and needs **systemic antibiotics**. Clinical types of impetigo: non-bullous, bullous, ulcerative (ecthyma).","q":["Q068","Q069","Q070","Q071","Q072","Q073","Q074","Q075"]},{"t":"Not bacterial infections: **kerion** (inflammatory tinea capitis) and **acne vulgaris** (a pilosebaceous inflammatory disease, although *C. acnes* contributes).","q":["Q056","Q057"]}]},{"n":"Follicular infections","facts":[{"t":"**Folliculitis** = staphylococcal infection of the upper (superficial) part of the follicle; **furuncle** (boil) = suppurative infection of the lower follicle with a central necrotic core (furunculosis when recurrent).","q":["Q076","Q077","Q078"]},{"t":"**Carbuncle** = coalescing deep furuncles draining through multiple openings (a large, indurated, painful plaque, typically on the back of the neck); caused by *S. aureus*, commoner in **diabetic** males and nasal carriers.","q":["Q079","Q080","Q081"]}]},{"n":"Erysipelas","facts":[{"t":"**Erysipelas** is a group A streptococcal infection of the **upper dermis and superficial lymphatics**: a sharply demarcated, hot, tender, raised red plaque with fever (deeper involvement = cellulitis); treated with penicillin.","q":["Q082","Q083","H037","Q088","Q089","Q090","Q091"]},{"t":"**Lymphoedema** both predisposes to and results from recurrent erysipelas (scarring of lymphatics); it is the commonest complication, with glomerulonephritis also reported.","q":["Q084","Q085","Q086","Q087"]}]},{"n":"Erythrasma","facts":[{"t":"**Erythrasma** is caused by *Corynebacterium minutissimum*: brown-red scaly patches in intertriginous areas (axillae, groins, submammary), commoner in obese/diabetic patients; treated with erythromycin.","q":["Q093","Q094","Q095"]},{"t":"Porphyrins of *C. minutissimum* give **coral-red fluorescence** under **Wood's light** (versicolor fluoresces yellow); Wood's light also helps in diagnosing erythrasma and pityriasis versicolor.","q":["Q092","Q096","Q097","Q098"]}]}]},{"n":"Mycobacterial Infections","topics":[{"n":"Leprosy: basics and diagnosis","facts":[{"t":"**Leprosy (Hansen's disease)** is caused by *Mycobacterium leprae*, which mainly affects **skin and peripheral nerves**; its target cell is the **Schwann cell**, causing neuropathy and anaesthesia. Typical presentation: hypopigmented lesions with numbness.","q":["Q099","Q101","Q109","H057"]},{"t":"The clinical form depends on the patient's **cell-mediated immunity** (not humoral): high immunity → **paucibacillary (tuberculoid)** with few bacilli; poor immunity → **multibacillary (lepromatous)**; borderline forms lie between.","q":["Q102","Q103","Q104","H056","H061"]},{"t":"Diagnosis: **slit-skin smear** (modified Ziehl-Neelsen), skin or nerve biopsy (and nasal smears, PCR); the lepromin test is not diagnostic.","q":["Q115","H054","H053"]}]},{"n":"Tuberculoid versus lepromatous leprosy","facts":[{"t":"**Tuberculoid leprosy** (good immunity, paucibacillary, best prognosis): few well-defined, **hypopigmented, hairless, anaesthetic** patches/plaques; **nerve involvement is early**, asymmetric and severe.","q":["Q105","Q106","Q107","Q108","Q110","Q111","Q112","Q113","H067"]},{"t":"**Lepromatous leprosy** (poor immunity, multibacillary): symmetrical widespread glistening papules, nodules and plaques with thickened nodular ears, diffuse facial infiltration (**leonine facies**) and **loss of the outer third of the eyebrows**.","q":["Q114","Q119","Q120","Q121","Q123","H071"]},{"t":"Lepromatous leprosy also involves **mucous membranes** (nasal infiltration → **epistaxis**, septal destruction), eyes, kidneys, liver, bones and testes; nerve involvement is **late** but extensive (glove-and-stocking anaesthesia of cold areas).","q":["Q116","Q117","Q118","Q122","H051","H072"]}]},{"n":"Leprosy treatment","facts":[{"t":"**Dapsone** is the backbone of treatment of all types of leprosy, given daily in **WHO multidrug therapy** with rifampicin ± clofazimine (at least 6 months for paucibacillary, 12 months for multibacillary); retinoids, methotrexate and tetracyclines are not anti-leprotic.","q":["Q100","Q124","Q125","H053","H055"]}]}]},{"n":"Viral Infections","topics":[{"n":"Viral skin infections: general","facts":[{"t":"Viral skin diseases: herpes simplex, varicella/zoster, warts (HPV) and molluscum (pox virus); **impetigo is bacterial**. **VZV, HSV and *M. leprae*** are neurotropic, whereas **HPV and pox virus** infect epithelium and are not.","q":["Q126","Q127","Q128","H083"]},{"t":"Sexually transmitted skin diseases: **genital herpes, condyloma acuminata and genital molluscum contagiosum**; eczema herpeticum is a complication of HSV, not an STD.","q":["Q139","Q183","Q184","Q185","Q186","Q187"]}]},{"n":"Herpes simplex","facts":[{"t":"**Herpes simplex** is genital and non-genital (lips, face, fingers, eye), classically at the **mucocutaneous junction**: grouped vesicles on an erythematous base preceded by burning/tingling. HSV stays latent in the sensory (trigeminal/dorsal root) ganglion, so **herpes labialis recurs** (triggers: stress, UV, fever, menstruation); **neuralgia is not a feature**.","q":["Q129","Q130","Q131","Q132","Q133","Q135","Q136","H103","H113"]},{"t":"**Herpes progenitalis**: grouped painful vesicles/erosions on the genitalia (usually HSV-2, recurrent); active genital herpes at delivery is an indication for **caesarean section** to protect the neonate.","q":["Q137","Q138","H101"]},{"t":"**Herpetic whitlow** = HSV of the finger; HSV can also cause **keratitis** (eye) and encephalitis.","q":["Q140","Q141","Q142"]},{"t":"Complications of HSV: **erythema multiforme** (the commonest trigger), eczema herpeticum, corneal ulcers and CNS involvement.","q":["Q134","Q142"]},{"t":"**Tzanck smear** shows multinucleated giant cells in herpes simplex (and in zoster/varicella).","q":["Q143"]}]},{"n":"Varicella and herpes zoster","facts":[{"t":"**Chickenpox** is the primary VZV infection (childhood), with vesicles also on the oral mucosa; the virus stays latent in posterior root ganglia and reactivates as **herpes zoster**. Treatment: early antiviral (acyclovir) and vaccine prophylaxis.","q":["Q144","Q145","Q146","Q537"]},{"t":"**Herpes zoster**: **unilateral, painful grouped vesicles** on an erythematous base along a dermatome; usually not recurrent and gives solid immunity after one attack.","q":["Q147","Q148","Q149","H079","H114"]},{"t":"**Post-herpetic neuralgia** (long-standing pain) is the common complication, more frequent in the **elderly**; early antivirals and vaccination reduce the risk.","q":["Q150","Q151"]},{"t":"Zoster is treated with **oral acyclovir 800 mg 5 times daily for 7 days**, started within 48 hours (valacyclovir and famciclovir are alternatives; analgesics/gabapentin for pain); 200 mg five times daily is the herpes simplex dose.","q":["Q152","Q153","Q154","Q538"]}]},{"n":"Warts (HPV)","facts":[{"t":"**Warts** are benign epithelial growths caused by **human papillomavirus** (DNA virus, over 200 genotypes), spread by skin contact or fomites; they may involve mucous membranes (e.g. genital warts).","q":["Q155","Q156","Q157","Q158"]},{"t":"Types: **verruca vulgaris** (hyperkeratotic skin-coloured papules on hands/fingers), **plane warts** (multiple flat-topped papules, often on a child's face) and **plantar warts** (grow inward, tender, painful on walking).","q":["Q160","Q161","Q162","Q163","Q164","H102","H104"]},{"t":"**Condyloma acuminata** (genital warts): soft, pinkish, moist exophytic papules of the genital/perianal skin and mucosa; **HPV 16 and 18** are oncogenic and linked to **cervical cancer**.","q":["Q159","Q166","Q167","H082","H084"]},{"t":"Warts are treated by **destruction**: cryotherapy, electrocautery, chemical cautery (salicylic acid), laser; **intralesional steroids and PUVA are not used**. Plantar warts: cryotherapy.","q":["Q165","Q169","Q170","Q171","Q174"]},{"t":"Genital warts: **podophyllin resin 10-25%** (weekly, washed off after 1-4 h), imiquimod, cryotherapy or laser; **podophyllin is contraindicated in pregnancy** and in large bleeding warts (use laser, cryotherapy or electrocautery instead).","q":["Q168","Q172","Q173"]}]},{"n":"Molluscum contagiosum","facts":[{"t":"**Molluscum contagiosum** is caused by a **pox virus**: firm, **pearly umbilicated papules** from which white cheesy material can be expressed; spread by skin contact (an STD when genital).","q":["Q175","Q176","Q177","Q178","Q179","Q180","Q181"]},{"t":"Molluscum is treated by curettage, cautery, cryotherapy, laser or chemicals; **steroids are not used**.","q":["Q182","Q174"]}]}]},{"n":"Fungal Infections","topics":[{"n":"Dermatophytosis (tinea): general and treatment","facts":[{"t":"**Dermatophytes** are keratin-loving fungi that infect the stratum corneum of glabrous skin, **hair and nails**; sites: tinea capitis (scalp), corporis, cruris, barbae, pedis, manuum and **onychomycosis/tinea unguium** (nail plate: discoloration, thickening, onycholysis).","q":["Q188","Q189","Q190","Q217","Q218","H136"]},{"t":"**Griseofulvin** is the drug of choice for dermatophytes (tinea capitis, corporis, cruris) but is **ineffective against yeasts** (*Candida*, *Malassezia*/versicolor); dose 12.5 mg/kg/day (e.g. 80 kg = 1000 mg = 8 × 125 mg tablets). Terbinafine and azoles are alternatives.","q":["Q219","Q222","Q223","Q224","Q225","Q226","Q227","H123"]}]},{"n":"Tinea capitis, kerion and favus","facts":[{"t":"**Scaly tinea capitis**: round scaly bald patch with broken hair stumps and grey scales; **children only** (resolves at puberty), no scarring; fluoresces **yellow-green** under Wood's light (Microsporum).","q":["Q191","Q192","Q193","Q194","Q254","H157"]},{"t":"**Systemic griseofulvin** is the backbone of tinea capitis treatment (6-8 weeks); topical treatment alone cannot cure it because the fungus lies inside the hair.","q":["Q219","Q220","Q221"]},{"t":"**Kerion**: inflammatory, boggy, tender, abscess-like swelling studded with follicular pustules (zoophilic fungi), not improved by antibiotics; may cause **cicatricial alopecia** if not treated early.","q":["Q195","Q196","Q197","Q198","H120","H146","H156"]},{"t":"**Favus**: thick yellow cup-shaped crusts (**scutula**) around hairs, causes **scarring (cicatricial) alopecia**; occurs in children and adults.","q":["Q199","Q200","Q201","Q202","H128"]},{"t":"**Wood's light** fluorescence: versicolor = **yellow**; erythrasma = **coral red**; favus/scalp ringworm = **yellow-green**.","q":["Q203","H133","Q238","Q239"]}]},{"n":"Tinea corporis, cruris, barbae and pedis","facts":[{"t":"**Tinea corporis (circinata)**: annular plaque with active scaly/vesicular edge and clearing centre; localized disease → **topical azoles/terbinafine**; extensive or resistant → systemic terbinafine, azoles or griseofulvin.","q":["Q204","Q205","Q206"]},{"t":"**Tinea cruris**: scaly erythematous groin patch with active raised border and central clearing, sparing the scrotum; extensive disease → oral terbinafine. Differential: **flexural psoriasis, erythrasma, candidal intertrigo** (not leprosy).","q":["Q207","Q208","Q209","Q210","Q211","Q212","H145"]},{"t":"**Tinea barbae**: annular lesion with active border in the beard (farm animals, barber instruments), may be circinate or kerion-like; unresponsive to antibiotics.","q":["Q213","Q214","H155"]},{"t":"**Tinea pedis** (athlete's foot) is common and recurrent; sweating and moisture are predisposing factors.","q":["Q215","Q216"]}]},{"n":"Pityriasis (tinea) versicolor","facts":[{"t":"**Pityriasis versicolor** is caused by the lipophilic yeast ***Malassezia furfur*** (not a dermatophyte); favoured by heat, humidity, oily skin and sweating; recurs in summer.","q":["Q228","Q229","Q230","Q231","Q237"]},{"t":"Clinical picture: asymptomatic hypo-/hyperpigmented (or erythematous) macules with **fine branny scales** on the upper trunk, neck and breasts; more obvious after tanning because the patches do not tan.","q":["Q232","Q233","Q234","Q235","Q236","H140"]},{"t":"Diagnosis: **yellow fluorescence** on Wood's light; KOH shows short thick hyphae with round spores (**\"spaghetti and meatballs\"**).","q":["Q238","Q239","Q240","Q241"]},{"t":"Treatment: **topical azoles** or selenium sulfide/ketoconazole shampoo; systemic fluconazole/itraconazole for extensive disease; **griseofulvin and terbinafine do not work**.","q":["Q241","Q242","Q243","Q244"]}]},{"n":"Candidiasis","facts":[{"t":"*Candida albicans* causes **oral thrush** (whitish pseudomembrane in infants, debilitated adults, HIV; nystatin), **perleche**, intertrigo, interdigital candidiasis (commonly between the **middle and ring fingers**), napkin dermatitis and chronic paronychia. **Favus, kerion and erythrasma are not candidal.**","q":["Q245","Q246","Q247","Q248","Q249","Q250","Q251","Q252"]},{"t":"**Candidal paronychia** (chronic, red swollen nail fold in wet-work occupations) is treated with **fluconazole** and avoidance of moisture.","q":["Q253"]}]}]},{"n":"Parasitic Infestations","topics":[{"n":"Scabies: diagnosis","facts":[{"t":"**Scabies** is a contagious infestation by the fertilized female mite ***Sarcoptes scabiei***; the primary lesion is the **burrow**. Cardinal symptom: intense generalized **nocturnal itching** (worse when warm), often with a family history; lesions are burrows, papules and excoriations, **not scales**.","q":["Q255","Q256","Q257","Q258","Q260","Q264","Q265","Q542","H176"]},{"t":"Adult sites: **finger webs and sides, wrists, elbows, axillae, waist, lower abdomen, genitalia, buttocks and feet**; adults spare the head, neck, palms/soles and **upper back**. Scabies is a cause of pubic itching (with pediculosis pubis).","q":["Q261","Q262","Q263","H163"]},{"t":"In **infants** scabies also involves the **face, palms and soles**, with vesicles, pustules, exudation and secondary impetiginization.","q":["Q266","Q267","Q268","Q269","Q270","Q291","H162"]}]},{"n":"Scabies: variants and treatment","facts":[{"t":"**Post-scabietic (nodular) scabies**: intensely itchy nodules, typically on the scrotum/genitalia and axillae, persisting after successful treatment because they are a **hypersensitivity reaction**; treated with **intralesional corticosteroids**.","q":["Q271","Q272","Q273","Q274"]},{"t":"**Animal scabies**: short incubation, **no burrows**, urticarial, self-limited once the animal is avoided, and **not transmitted human-to-human**.","q":["Q275","Q276"]},{"t":"Scabies treatment: **permethrin 5%** (safe in pregnancy, breast-feeding and infants >2 months; applied to the whole skin and repeated after a week), benzyl benzoate, sulphur, crotamiton or ivermectin; **all family members/close contacts must be treated** even if asymptomatic. Benzoyl peroxide is an acne drug.","q":["Q267","Q277","Q278","Q279","Q280","Q281"]}]},{"n":"Pediculosis","facts":[{"t":"**Pediculosis capitis** (*Pediculus humanus capitis*, blood-sucking louse): itchy scalp with excoriations; **nits are eggs firmly cemented to the hair shaft** (unlike dandruff); spread by head contact and by combs, brushes and hats.","q":["Q282","Q283","Q284","Q285","H173"]},{"t":"Head lice treatment: **permethrin 5%** (repeat after a week because eggs survive), malathion 0.5% lotion, dimethicone or topical ivermectin 0.5%; antifungals and podophyllin are not used.","q":["Q286","Q287","Q288","H168"]},{"t":"***Phthirus pubis*** (pubic louse) is spread by close/sexual contact and can infest the **eyelashes** as well as the pubic area.","q":["Q289","Q290","H165"]}]}]},{"n":"Inflammatory Dermatoses","topics":[{"n":"Psoriasis: pathogenesis and clinical picture","facts":[{"t":"**Psoriasis** is a chronic immune-mediated (T-cell) papulosquamous disease with genetic susceptibility; **not infectious/contagious**. Basal cell division is accelerated, so **epidermal turnover time is markedly shortened** (normal 28 days). It **improves with sunlight** (flares in winter and in covered areas).","q":["Q292","Q293","Q294","Q295","Q296"]},{"t":"Primary lesion: **red papule covered by loosely adherent silvery-white scales**, coalescing into well-defined, symmetrical plaques with polycyclic outline on **extensor surfaces (elbows, knees)**, scalp and trunk; **psoriasis vulgaris** (vulgaris = common) is the plaque type. Scalp plaques border the hairline sharply and **do not scar** the hair.","q":["Q298","Q300","Q301","Q302","Q303","Q304","Q305","Q306","Q308","H189"]},{"t":"**Auspitz sign**: removal of the scales leaves **pinpoint bleeding points** (thin-capped, engorged dermal papillae).","q":["Q299","Q295","Q306"]},{"t":"Clinical forms: plaque (vulgaris), guttate, flexural, nail, **erythrodermic**, **pustular (sterile pustules)** and **psoriatic arthritis**; bullous and ulcerative forms do not exist. Nail changes include onycholysis (also seen in lichen planus and onychomycosis).","q":["Q307","Q309","Q310","Q311","Q312","Q543"]}]},{"n":"Psoriasis: treatment","facts":[{"t":"**Topical** psoriasis treatment: keratolytics (salicylic acid), emollients, corticosteroids, **calcipotriol** (vitamin D analogue), coal tar, anthralin.","q":["Q313","Q316","Q317"]},{"t":"**Systemic/physical** treatment for extensive disease: **methotrexate** (dihydrofolate reductase inhibitor), acitretin, cyclosporine, **PUVA/narrow-band UVB** phototherapy; antibiotics such as doxycycline have no role.","q":["Q314","Q315","Q318","Q319","Q544"]}]},{"n":"Koebner phenomenon","facts":[{"t":"**Koebner phenomenon** = new lesions on previously normal skin after trauma; seen in **psoriasis, lichen planus, vitiligo and plane warts** (not eczema).","q":["Q297","Q327","Q328"]}]},{"n":"Lichen planus","facts":[{"t":"**Lichen planus (LP)** is a pruritic immune-mediated disease involving **skin, mucous membranes, hair and nails**; associated with **hepatitis C virus**; not contagious. Types: actinic, annular, atrophic, hypertrophic (no pustular type).","q":["Q320","Q321","Q322","H204"]},{"t":"Primary lesion: **pruritic, purple, polygonal, planar papule** (flat-topped, violaceous, shiny, fine adherent scales), often on the **wrists and forearms**; **Wickham striae** (fine white reticular lines) on papules and oral mucosa; heals with **post-inflammatory hyperpigmentation**.","q":["Q323","Q324","Q325","Q326","Q329","Q331","H199","H205"]},{"t":"LP of the scalp destroys follicles → **cicatricial alopecia**; **chronic erosive/ulcerative oral (mucosal) LP and hypertrophic LP are precancerous** (squamous cell carcinoma).","q":["Q330","Q332","Q333","Q335","H201","H209"]},{"t":"**Actinic LP** (LP tropicus) occurs on sun-exposed skin (**face, dorsum of hands**) and is treated with **antimalarials** (chloroquine/hydroxychloroquine) plus sunscreen.","q":["Q336","Q339","Q340","Q341","H197"]},{"t":"Treatment of ordinary LP: **topical corticosteroids** for localized disease; **oral corticosteroids** (with sedating antihistamines) for extensive or severe disease.","q":["Q337","Q338"]}]},{"n":"Pityriasis rosea","facts":[{"t":"**Pityriasis rosea** is an acute, self-limited (4-8 weeks), **non-contagious** scaly erythematous papulosquamous eruption, regarded as a viral exanthem related to **HHV-6 and HHV-7**; treatment is **reassurance**, emollients and mild topical steroids/antihistamines for itch.","q":["Q342","Q343","Q344","Q345","Q346","Q347","Q348","Q358","Q359"]},{"t":"The **herald patch** (single 2-5 cm oval scaly patch with a collarette of scales, outer erythema) precedes the eruption by 1-2 weeks and mimics **tinea corporis** (KOH distinguishes them).","q":["Q349","Q351","Q352","Q356","Q357","Q378","H218","H219"]},{"t":"Secondary eruption: smaller oval scaly lesions on the **trunk and proximal limbs** in a **\"Christmas-tree\" pattern** along the ribs, sparing face, palms and soles.","q":["Q350","Q354","Q355","Q545"]},{"t":"Scaly diseases include psoriasis, pityriasis rosea, tinea and seborrhoeic dermatitis; **alopecia areata is non-scaly**.","q":["Q353"]}]},{"n":"Discoid lupus erythematosus (DLE)","facts":[{"t":"**DLE** is an autoimmune, **non-contagious**, photosensitive skin disease: well-defined erythematous plaques with **adherent scales**, usually on the face (cheeks, nose), ears and **scalp**.","q":["Q360","Q362","Q364","Q365","Q371","H225","H229"]},{"t":"**Five cardinal signs**: erythema, **telangiectasia**, scaling, **stippling** (dilated pilosebaceous orifices with keratin plugs) and **scarring/atrophy**; pustules and lichenification are not DLE signs.","q":["Q361","Q363","Q367","Q368","Q369","Q370","Q372","H224"]},{"t":"Scalp DLE ends in permanent **cicatricial alopecia**.","q":["Q366","H227"]},{"t":"DLE treatment: sun protection, **potent topical (or intralesional) steroids** and **systemic antimalarials** for extensive disease; **PUVA/phototherapy are contraindicated** (lupus is photosensitive).","q":["Q373","Q374","Q375","Q376","Q377","H221"]}]}]},{"n":"Allergic Disorders","topics":[{"n":"Eczema: acute and chronic","facts":[{"t":"**Acute eczema** = wet stage: erythema, oedema, papules/vesicles, oozing and crusting; treat weeping lesions with **drying lotions** (potassium permanganate, aluminium acetate), not ointments. **Chronic eczema**: itchy, **lichenified**, excoriated, with pigment change; lichenification is not an acute feature.","q":["Q379","Q380","Q381","Q382","Q398"]}]},{"n":"Atopic dermatitis","facts":[{"t":"**Atopic dermatitis**: hereditary, **IgE-related** (raised IgE; family history of asthma/rhinitis/dermatitis in 50-70%), intensely itchy, irritable infants, non-contagious.","q":["Q385","Q387","H256","H271"]},{"t":"Distribution by age: **infantile** phase (from ~2 months) = weeping papulovesicular eczema of the **cheeks/face**, neck and extensors; **childhood and adult** phases = **flexures (antecubital and popliteal fossae)**, neck sides, with lichenification in adults.","q":["Q383","Q384","Q386","Q388","Q389","Q390","Q547","H234","H266"]},{"t":"Treatment of flexural atopic dermatitis: **emollients and topical corticosteroids**.","q":["Q390"]}]},{"n":"Seborrheic dermatitis","facts":[{"t":"**Seborrheic dermatitis** (associated with *Malassezia* yeast) is treated with oils for infantile scalp crusts, topical antifungals, mild steroids and selenium sulfide shampoo.","q":["Q391"]}]},{"n":"Contact dermatitis","facts":[{"t":"**Allergic contact dermatitis** is a **delayed type IV (T-cell) hypersensitivity** in sensitized individuals; the rash occurs at the site of contact (henna, nickel in belt buckles, watch/bracelet band-like rash, footwear on the foot dorsa) and is confirmed by the **patch test**. Irritant dermatitis is non-immunological.","q":["Q392","Q393","Q394","Q395","Q396","Q397","Q546","H232","H238","H239","H245","H265"]}]},{"n":"Urticaria and angioedema","facts":[{"t":"**Urticaria**: sudden itchy **wheals** (transient dermal oedema, heal **without scarring**); acute if <6 weeks; may involve mucous membranes.","q":["Q399","Q400","Q401","Q402","Q403","Q412","H233","H241","H242"]},{"t":"Pathogenesis: **type I (IgE-mediated) hypersensitivity**; **mast cell** is the effector cell and **histamine** the main mediator, increasing **capillary permeability**.","q":["Q408","Q409","Q410","Q411","H236"]},{"t":"**Physical urticaria** (solar, cold, heat, aquagenic, pressure, dermographism) is stimulus-induced; **papular urticaria** (insect-bite hypersensitivity) is not physical and spares mucous membranes. **Cholinergic urticaria**: small wheals after sweating, exertion, heat, hot spicy food or emotion (acetylcholine-stimulated mast cells).","q":["Q413","Q414 cumscribed **milky/chalk-white macule or patch** (accentuated under Wood's light), often with white hairs; **asymptomatic** (no itch/pain) - the complaint is cosmetic; can affect the scalp.","q":["Q440","Q441","Q442","Q443","Q444","Q445","Q455","H350","H352"]},{"t":"Types: **focal, segmental, mucosal** (localized) and **vulgaris (generalized), acrofacial, universal**; there is no papular type.","q":["Q453","Q454"]},{"t":"Generalized vitiligo is associated with other autoimmune diseases: **thyroid disease, alopecia areata**, type 1 diabetes, myasthenia gravis, lupus and rheumatoid arthritis.","q":["Q446","Q447","H346"]},{"t":"Vitiligo may be confused with pityriasis alba, hypopigmented leprosy and pityriasis versicolor.","q":["H340"]}]},{"n":"Vitiligo: treatment","facts":[{"t":"**Phototherapy** is the backbone of vitiligo treatment (**narrow-band UVB**, excimer, PUVA) because it stimulates residual melanocytes.","q":["Q456","Q457","H335","H345","H352"]},{"t":"Topical options: **corticosteroids** (localized disease) and **calcineurin inhibitors** (tacrolimus, pimecrolimus; especially face and neck); in hepatic failure oral drugs are avoided and topical PUVA, topical steroids or UVB can be used.","q":["Q458","Q459","Q460"]}]}]},{"n":"Hair Disorders","topics":[{"n":"Cicatricial (scarring) versus non-cicatricial alopecia","facts":[{"t":"**Cicatricial alopecia** = follicles are **destroyed and replaced by scar**, so hair loss is **permanent**; causes: **lichen planus (lichen planopilaris), DLE, favus, kerion**, burns, trauma, zoster; the scalp looks smooth and shiny without follicular openings.","q":["Q461","Q462","Q463","Q464","Q465","Q467","Q468","Q473","Q474"]},{"t":"**Non-cicatricial** alopecias (follicle preserved, reversible): **alopecia areata, androgenetic alopecia, telogen and anagen effluvium**.","q":["Q470","Q471","Q472"]}]},{"n":"Androgenetic alopecia","facts":[{"t":"**Androgenetic alopecia (AGA)**: genetically determined, non-scarring, due to **increased 5-alpha reductase activity** in target follicles (testosterone → DHT miniaturizes follicles). Males: **frontal and bitemporal recession then vertex**; females: diffuse vertex thinning with **preserved frontal hairline**.","q":["Q475","Q476","Q477","Q478","H298","H299","H307"]},{"t":"AGA treatment: **topical minoxidil** (both sexes), **finasteride** (5-alpha reductase inhibitor, males), spironolactone/antiandrogens (females only), hair transplantation; **corticosteroids have no role**.","q":["Q479","Q480","H294"]}]},{"n":"Telogen and anagen effluvium","facts":[{"t":"**Telogen effluvium**: diffuse, reversible shedding ~3-4 months after a trigger such as **fever (typhoid) or childbirth**, with a normal scalp.","q":["Q481","Q482","Q483"]},{"t":"**Anagen effluvium**: toxic injury to actively growing anagen follicles (**cytotoxic chemotherapy**, radiation, heavy metals, methotrexate), causing rapid hair loss soon after starting treatment.","q":["Q484","Q485","Q486","H296"]}]},{"n":"Alopecia areata","facts":[{"t":"**Alopecia areata** is an **autoimmune**, non-scarring disease against anagen follicles: sudden, asymptomatic, well-circumscribed round patches of hair loss on **normal-looking skin** (no scales); **exclamation-mark hairs** at the margin are characteristic. Associated with thyroid disease, atopy, vitiligo; 10-20% have a family history.","q":["Q487","Q488","Q489","Q490","Q491","H292","H301","H305"]},{"t":"Types: **patchy, ophiasis** (band along the scalp margins; usually **resistant to treatment**), **totalis** (all scalp hair) and **universalis** (all body hair); there is no mucocutaneous type.","q":["Q493","Q494","Q495","Q496","Q497","H293","H297"]},{"t":"Treatment: **topical/intralesional corticosteroids first**, then calcineurin inhibitors, minoxidil, irritants (tincture iodine) and PUVA; **systemic corticosteroids** for resistant or extensive forms (ophiasis, totalis, universalis).","q":["Q498","Q499","Q500"]}]}]},{"n":"Acne Vulgaris","topics":[{"n":"Pathogenesis and clinical picture","facts":[{"t":"**Acne vulgaris** is a chronic inflammatory (non-infectious, **non-contagious**) disease of the **pilosebaceous unit**, peaking in adolescence (face, chest, back; palms and soles spared). Pathogenesis: androgen-driven **increased sebum**, abnormal follicular keratinization with **keratinocyte proliferation** blocking the orifice, follicular distension and colonization by *Cutibacterium (Propionibacterium) acnes*; increased epidermal turnover is not a factor.","q":["Q501","Q502","Q503","Q504","Q505","Q506","Q507","Q508","Q509","Q511","Q512","Q513","Q514","H318","H323","H324"]},{"t":"Lesions are **polymorphic**: primary lesion = **comedone**, then papules, pustules, nodules and cysts; **vesicles do not occur**. Comedones with few/no papules = mild (non-inflammatory) acne.","q":["Q516","Q517","Q518","Q521","Q522","Q523"]},{"t":"**Nodular/nodulocystic** acne causes deep inflammation and therefore **scarring**.","q":["Q519","Q520"]}]},{"n":"Treatment of acne","facts":[{"t":"**Retinoids** (vitamin A derivatives) **normalize** follicular keratinization (they do not increase it) and are anti-inflammatory; used **topically** for mild-moderate acne (first-line with comedones/papules) and **orally** for severe disease.","q":["Q515","Q524","Q532","H321","H331"]},{"t":"**Benzoyl peroxide** 2.5-10% is a bactericidal topical agent against *C. acnes* without resistance; other topical options: erythromycin/clindamycin and azelaic acid.","q":["Q525","Q526","Q527","H329"]},{"t":"**Severe nodulocystic acne** → **oral retinoids (isotretinoin)**, which are **teratogenic** (exclude pregnancy, double contraception); moderate-severe acne may also need systemic antibiotics (tetracyclines, macrolides) or, in hormonal cases, antiandrogens/OCPs.","q":["Q528","Q529","Q530","Q531","Q533","H316"]},{"t":"**Corticosteroids** (topical) worsen or cause acneiform eruptions and **androgens** worsen acne, so neither is used.","q":["Q510","H328"]}]}]}]}};const SK='der if(cur!='all'){const C=DB.q.filter(q=>q.ch==cur);h+=`<details class="qmap" ${mapOpen?'open':''}><summary>Question map (${C.filter(q=>P[q.id]).length}/${C.length} answered${C.some(q=>!P[q.id]&&PX[q.id])?' · '+C.filter(q=>!P[q.id]&&PX[q.id]).length+' selected, not graded':''})</summary><div class="map">${C.map(q=>{const p=P[q.id];return `<span class="dot ${p?(p.r===1?'ok':p.r===0?'bad':''):(PX[q.id]?'pend':'')} ${BM.includes(q.id)?'sv':''} ${q.dup?'dp':''}" data-id="${q.id}">${q.n}</span>`}).join('')}</div></details>`}
L.forEach(q=>{if(cur=='all'&&!SH&&q.ch!=last){last=q.ch;h+=`<h2>${DB.ch.indexOf(q.ch)+1}. ${q.ch}</h2>`}
if(q.dup&&!SH&&lastDup!==q.ch){lastDup=q.ch;h+=`<div class="dsep">مكرر — Duplicates<small>Same questions as in the other chapters. Kept here unchanged.</small></div>`}
const p=P[q.id],px=p?null:PX[q.id],rev=(show&&!EX)||p;
h+=`<div class="q" id="q-${q.id}" data-id="${q.id}"><button class="bm ${BM.includes(q.id)?'on':''}" title="Save / flag this question" aria-label="Save question">${BM.includes(q.id)?'★':'☆'}</button>${cur=='all'&&SH&&p?`<div class="chtag">${DB.ch.indexOf(q.ch)+1}. ${esc(q.ch)}</div>`:''}<h3 dir="auto"><b>${q.n}.</b> ${esc(q.q)}${q.dup?` <span class="dupb">مكرر${q.dn?' · Ch'+q.dc+' Q'+q.dn:''}</span>`:''}</h3>${imgs(q)}`;
if(q.o.length){q.o.forEach(o=>{let c='opt';if(rev&&isOk(q,o[0]))c+=' ok';else if(p&&p.c==o[0])c+=' bad';else if(px==o[0])c+=' sel';h+=`<button class="${c}" dir="auto" data-o="${ea(o[0])}"><b>${esc(o[0])}.</b> ${esc(o[1])}</button>`});
if(rev){h+=`<div class="ans" dir="auto"><span class="k">Correct answer: ${esc(AS(q).join(' & ')||'not provided — see flag')}</span></div>`;if(q.e)h+=expl(q)}}
else{h+=`<button class="opt" data-sa="1">Show model answer</button>`;if(rev){h+=`<div class="ans" dir="auto"><span class="k">Answer:</span> ${esc(q.sa||'—')}</div>`;if(q.e)h+=expl(q)}}
(q.f||[]).forEach(f=>h+=`<div class="flag" dir="auto">⚑ ${esc(f)}</div>`);if(q.pg)h+=`<div class="src">Book p. ${esc(q.pg)}</div>`;
if(rev&&NT&&QN[q.id])h+=`<div class="rn"><a data-rn="1">📘 Related notes</a></div>`;
if(p&&q.o.length)h+=`<button class="rt">↻ Retry this question</button>`;h+='</div>'});
const none=savedOnly&&!BM.length?'No saved questions yet — tap ☆ on any question to save it here.':wrongOnly&&!DB.q.some(q=>P[q.id]&&P[q.id].r===0)?'No wrong answers right now 🎉':(SH&&!wrongOnly&&!savedOnly?'Nothing left to shuffle here: every question is answered 🎉 (press Change chapters, or turn Shuffle off).':'No questions match.');
$('list').innerHTML=L.length?h:h+`<p>${none}</p>`;
stat()}
/* Exam Mode helpers */
const pendScope=()=>Object.keys(PX).filter(id=>{const q=byId(id);return q&&!P[id]});
function gradeIds(ids,pre){let ok=0,bad=0,n=0;const y=scrollY;ids.forEach(id=>{const q=byId(id),l=PX[id];if(!q||!l)return;const r=q.a?(isOk(q,l)?1:0):2;P[id]={c:l,r:r};SESS.add(id);delete PX[id];n++;if(r===1)ok++;else if(r===0)bad++});
save();savePX();render();scrollTo(0,y);toast((pre||'')+'Graded '+n+' · ✓ '+ok+' correct · ✗ '+bad+' wrong')}
function gradeNow(){const ids=pendScope();if(!ids.length){toast('Nothing to grade yet — select some answers first.');return}gradeIds(ids)}
function autoGrade(ch){const M=DB.q.filter(q=>q.ch==ch&&q.o.length);if(!M.length||!M.every(q=>A(q.id)))return;const ids=M.filter(q=>PX[q.id]).map(q=>q.id);if(ids.length)gradeIds(ids,'Chapter finished — ')}
function toggleExam(){if(EX){const ids=pendScope();if(ids.length)gradeIds(ids,'Exam Mode off — ');EX=false}else EX=true;try{localStorage.setItem(SK+'exam',EX?'1':'0')}catch(e){}}
function exUI(){$('ex').textContent='Exam Mode: '+(EX?'ON':'OFF');$('ex').classList.toggle('pri',EX);$('xb').classList.toggle('on',EX);$('xc').textContent=pendScope().length+' selected · not graded yet';const h=$('hx');if(h)h.textContent='📝 Exam Mode: '+(EX?'ON':'OFF')}
function expl(q){if(!q.e||!(q.e[0]||q.e[1]))return'';return `<details class="ans" dir="auto" open><summary><b>Explanation</b></summary>${esc(q.e[0])}${q.e[1]?`<div style="margin-top:6px"><b>💡 Pearl:</b> ${esc(q.e[1])}</div>`:''}</details>`}
function stat(){navb();const S=sums();
$('st').textContent=`Total ${S.n} · Solved ${S.d} · Unanswered ${S.n-S.d} · Correct ${S.ok} · Wrong ${S.bad} · ${S.pct}% complete`+(Object.keys(PX).length?` · Selected, not graded ${Object.keys(PX).length}`:'');$('pb').style.width=100*S.d/S.n+'%';$('sv').textContent='★ Saved ('+BM.length+')';syncBtns();exUI();shUI()}
function resume(){const T=nextTarget();if(T.none)return;
if(T.done){toast('🎉 You have answered all '+MAIN.length+' questions. Nothing left to resume!');return}
const q=T.q;$('s').value='';wrongOnly=false;savedOnly=false;syncBtns();openView(q.ch);
let el=$('q-'+q.id);if(!el&&SH){setShuffle(false);render();el=$('q-'+q.id);toast('Shuffle turned off to show this question')}if(el){el.scrollIntoView({block:'start'});el.classList.add('hl');setTimeout(()=>el.classList.remove('hl'),2500);window.scrollBy(0,-70)}}
$('list').addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('qmap'))mapOpen=e.target.open},true);
$('list').onclick=e=>{if(e.target.closest('#shc2')){openShPicker();return}const im=e.target.closest('img[data-im]');if(im){openLB(DB.img[im.dataset.im]);return}const d=e.target.closest('.dot');
if(d){let el=$('q-'+d.dataset.id);if(!el&&SH){setShuffle(false);render();el=$('q-'+d.dataset.id)}if(el){el.scrollIntoView({block:'start'});window.scrollBy(0,-70);el.classList.add('hl');setTimeout(()=>el.classList.remove('hl'),1500)}return}
const rn=e.target.closest('a[data-rn]');if(rn){const c0=rn.closest('.q');if(c0)openNotesAt(c0.dataset.id);return}
const b=e.target.closest('button');if(!b)return;const card=b.closest('.q');if(!card)return;const id=card.dataset.id,q=byId(id),y0=scrollY;
/* save/flag and retry never touch the Resume pointer */
if(b.classList.contains('bm')){toggleBM(id);render();scrollTo(0,y0);return}
if(b.classList.contains('rt')){delete P[id];save();if(LAST&&LAST.id==id)clearLast();render();scrollTo(0,y0);return}
if(P[id])return;
if(EX&&b.dataset.o){if(PX[id]==b.dataset.o){delete PX[id];if(LAST&&LAST.id==id)clearLast()}else{PX[id]=b.dataset.o;saveLast(id)}
savePX();render();scrollTo(0,y0);autoGrade(q.ch);return}
if(PX[id]){delete PX[id];savePX()}
if(b.dataset.sa){P[id]={r:2};}else if(b.dataset.o){P[id]={c:b.dataset.o,r:q.a?(isOk(q,b.dataset.o)?1:0):2}}else return;
SESS.add(id);save();saveLast(id);const y=scrollY;render();scrollTo(0,y)};
$('nav').onclick=e=>{const a=e.target.closest('a');if(!a)return;$('nav').classList.remove('open');const c=a.dataset.c;
if(c=='__notes'){openNotes();return}
if(c=='__wrong'||c=='__saved'){openFilter(c=='__wrong'?'wrong':'saved');return}
if(c=='all'){wrongOnly=false;savedOnly=false;syncBtns()}
openView(c=='home'?null:c);scrollTo(0,0)};
$('home').onclick=e=>{if(e.target.closest('#rs2')){resume();return}if(e.target.closest('#hn')){openNotes();return}if(e.target.closest('#hw')){openFilter('wrong');return}if(e.target.closest('#hs')){openFilter('saved');return}if(e.target.closest('#hx')){toggleExam();home();return}if(e.target.closest('#hshc')){openShPicker();return}if(e.target.closest('#hsh')){setShuffle(!SH);home();return}const c=e.target.closest('.card');if(c){if(c.dataset.c=='all'){wrongOnly=false;savedOnly=false;syncBtns()}openView(c.dataset.c);scrollTo(0,0)}};
const SQ=q=>{const ans=AS(q).map(l=>{const o=q.o.find(x=>x[0]==l);return o?o[1]:''}).join(' ');return (q.ch+' '+q.q+' '+q.o.map(o=>o[1]).join(' ')+' '+ans+' '+(q.sa||'')+' '+(q.e?q.e.join(' '):'')).toLowerCase()};
DB.q.forEach(q=>{q._s=SQ(q)});
function doSearch(v,panel){if(!panel)return;const t=v.toLowerCase().trim();if(t.length<2){panel.style.display='none';panel.innerHTML='';return}
const W=t.split(/\s+/),R=DB.q.filter(q=>W.every(w=>q._s.includes(w)));
panel.innerHTML=R.length?R.slice(0,60).map(q=>`<a data-id="${q.id}">${esc((DB.ch.indexOf(q.ch)+1)+'. '+q.ch)} · Q${q.n}<small>${esc(q.q.slice(0,150))}</small></a>`).join('')+(R.length>60?`<a>…and ${R.length-60} more — refine your search</a>`:''):'<a>No matches</a>';panel.style.display='block'}
function goQ(id){const q=byId(id);if(!q)return;wrongOnly=false;savedOnly=false;syncBtns();$('s').value='';openView(q.ch);let el=$('q-'+id);if(!el&&SH){setShuffle(false);render();el=$('q-'+id);toast('Shuffle turned off to show this question')}if(el){el.scrollIntoView({block:'start'});window.scrollBy(0,-70);el.classList.add('hl');setTimeout(()=>el.classList.remove('hl'),2500)}}
document.addEventListener('input',e=>{if(e.target.id=='s')doSearch(e.target.value,$('sp'));if(e.target.id=='hs2')doSearch(e.target.value,$('sp2'))});
document.addEventListener('click',e=>{const a=e.target.closest('.sp a[data-id]');if(a){const id=a.dataset.id;['sp','sp2'].forEach(x=>{const p=$(x);if(p){p.style.display='none';p.innerHTML=''}});goQ(id)}});
function fitLB(){const i=$('zi');if(!i.naturalWidth)return;const s=Math.min(3,innerWidth*.96/i.naturalWidth,innerHeight*.88/i.naturalHeight)*($('zm').classList.contains('big')?2:1);i.style.width=Math.round(i.naturalWidth*s)+'px';i.style.height='auto';i.style.maxWidth='none'}
function openLB(src){const i=$('zi');i.onload=fitLB;$('zm').classList.remove('big');i.src=src;$('zm').classList.add('on');if(i.complete)fitLB()}
$('zm').onclick=e=>{if(e.target.id=='zi'){$('zm').classList.toggle('big');fitLB()}else $('zm').classList.remove('on')};addEventListener('resize',fitLB);
document.addEventListener('keydown',e=>{if(e.key=='Escape')$('zm').classList.remove('on')});
$('tg').onclick=()=>{show=!show;$('tg').textContent='Show Answers: '+(show?'ON':'OFF');render()};
$('wr').onclick=()=>{wrongOnly=!wrongOnly;render()};
$('ex').onclick=()=>{toggleExam();render()};$('xg').onclick=gradeNow;$('sh').onclick=()=>{setShuffle(!SH);render();scrollTo(0,0)};$('sh2').onclick=()=>{reshuffle();render();scrollTo(0,0);toast('Reshuffled the '+SO.length+' unanswered questions')};
/* chapter picker: shuffle the unanswered questions of ONE OR MORE chapters together */
function openShPicker(){const sel=new Set(SC.length?SC:DB.ch);let h='<div class="shb"><h3>🔀 Shuffle from which chapters?</h3><div class="stat">Pick one or more chapters. Only questions you have not answered yet are shuffled.</div><div class="qa"><button id="sha">Select all</button><button id="shn">Clear</button></div><div class="shl">';
DB.ch.forEach((c,i)=>{const L=DB.q.filter(q=>q.ch==c),u=L.filter(q=>!P[q.id]).length;h+=`<label><input type="checkbox" data-c="${ea(c)}" ${sel.has(c)?'checked':''}> ${i+1}. ${esc(c)} <span>${u} unanswered / ${L.length}</span></label>`});
h+='</div><div class="qa"><button class="pri" id="shgo">🔀 Start shuffle</button><button id="shx">Cancel</button></div></div>';$('shp').innerHTML=h;$('shp').classList.add('on')}
$('shp').onclick=e=>{const b=e.target.closest('button');if(e.target.id=='shp'||(b&&b.id=='shx')){$('shp').classList.remove('on');return}if(!b)return;
const bx=[...$('shp').querySelectorAll('input[data-c]')];if(b.id=='sha'){bx.forEach(x=>x.checked=true);return}if(b.id=='shn'){bx.forEach(x=>x.checked=false);return}
if(b.id=='shgo'){const ch=bx.filter(x=>x.checked).map(x=>x.dataset.c);if(!ch.length){toast('Select at least one chapter');return}
if(!DB.q.some(q=>ch.includes(q.ch)&&!P[q.id])){toast('Every question in the selected chapters is already answered');return}
SC=ch.length==DB.ch.length?[]:ch;saveSC();wrongOnly=false;savedOnly=false;syncBtns();$('s').value='';$('shp').classList.remove('on');setShuffle(true);openView('all');scrollTo(0,0)}};
$('shc').onclick=openShPicker;
$('sv').onclick=()=>{savedOnly=!savedOnly;render()};
$('rs').onclick=()=>{if(confirm('Reset all progress? (your ★ saved questions are kept)')){P=wr({});PX=wr({});save();savePX();clearLast();render()}};
/* ---- Notes page. Viewing / searching / opening notes never touches answered progress or Resume. */
function renderNotes(){const b=$('nbody');if(!NT){b.innerHTML='<p>No notes in this site.</p>';return}
const W=NQ.toLowerCase().trim().split(/\s+/).filter(Boolean),N=nCount();let h=`<h2>📘 Notes</h2><div class="stat">${N.f} facts · ${N.s} system${N.s>1?'s':''} · ${N.t} topics. Read these first, then test yourself with the questions. Tap a small number to open the related question.</div>`,shown=0,chips='',body='';
NT.systems.forEach((s,si)=>{let tb='',tc='',sc=0;s.topics.forEach((p,pi)=>{const F=p.facts.map((f,fi)=>({f,fi})).filter(x=>!W.length||W.every(w=>x.f._s.includes(w)));if(!F.length)return;sc+=F.length;
tc+=`<a class="nchip" data-top="${si}-${pi}">${esc(p.n)}</a>`;
tb+=`<div class="ntop"><h4 id="nt-${si}-${pi}" dir="auto">${esc(p.n)} <small>(${F.length})</small></h4><ul class="facts">${F.map(x=>factHTML(x.f,si,pi,x.fi)).join('')}</ul></div>`});
if(!sc)return;shown+=sc;chips+=`<a class="nchip" data-sys="${si}">${esc(s.n)} <small>${sc}</small></a>`;
body+=`<details class="nsys" id="ns-${si}" data-si="${si}" ${(W.length||NOPEN.has(si))?'open':''}><summary dir="auto">${esc(s.n)}<small>${sc} fact${sc>1?'s':''}</small></summary>${s.topics.length>1?`<div class="nchips">${tc}</div>`:''}${tb}</details>`});
h+=(chips?`<div class="nchips">${chips}</div>`:'')+(shown?body:'<p>No notes match your search.</p>');b.innerHTML=h;
NHL.forEach(k=>{const el=$('nf-'+k);if(el){el.classList.add('hl')}});}
function factHTML(f,si,pi,fi){const R=(f.q||[]).filter(byId);let r='';
if(R.length){const lab=id=>{const q=byId(id);return `<a class="qr" data-qid="${id}" title="${ea(q.q.slice(0,110))}">${DB.ch.indexOf(q.ch)+1}.${q.n}</a>`};
r=`<span class="qrs">Q ${R.slice(0,6).map(lab).join('')}${R.length>6?`<a class="qr" data-more="1">+${R.length-6}</a><span class="qh" hidden>${R.slice(6).map(lab).join('')}</span>`:''}</span>`}
return `<li id="nf-${si}-${pi}-${fi}" dir="auto"><span>${nfmt(f.t)}</span>${r}</li>`}
function openNotes(){if(!NT)return;wrongOnly=false;savedOnly=false;syncBtns();NQ='';$('ns').value='';NHL=[];if(NT.systems.length==1)NOPEN.add(0);openView('__notes');scrollTo(0,0)}
function openNotesAt(qid){if(!NT||!QN[qid])return;NQ='';$('ns').value='';NHL=QN[qid].map(x=>x.join('-'));QN[qid].forEach(x=>NOPEN.add(x[0]));openView('__notes');const el=$('nf-'+NHL[0]);if(el){el.scrollIntoView({block:'center'})}else scrollTo(0,0)}
$('nbody').addEventListener('toggle',e=>{const d=e.target;if(d.classList&&d.classList.contains('nsys')){const si=+d.dataset.si;if(d.open)NOPEN.add(si);else NOPEN.delete(si)}},true);
$('nbody').onclick=e=>{const q=e.target.closest('a[data-qid]');if(q){goQ(q.dataset.qid);return}
const m=e.target.closest('a[data-more]');if(m){const h=m.nextElementSibling;if(h)h.hidden=false;m.remove();return}
const s=e.target.closest('a[data-sys]');if(s){const si=+s.dataset.sys;NOPEN.add(si);NHL=[];renderNotes();const el=$('ns-'+si);if(el)el.scrollIntoView({block:'start'});return}
const t=e.target.closest('a[data-top]');if(t){const el=$('nt-'+t.dataset.top);if(el)el.scrollIntoView({block:'start'})}};
$('ns').addEventListener('input',e=>{NQ=e.target.value;NHL=[];renderNotes()});
$('nx').onclick=()=>{NT.systems.forEach((s,i)=>NOPEN.add(i));renderNotes()};$('nc').onclick=()=>{NOPEN.clear();NQ='';$('ns').value='';renderNotes()};
$('nhm').onclick=()=>{openView(null);scrollTo(0,0)};$('ng').onclick=resume;$('nt').onclick=openNotes;if(NT)$('nt').style.display='';
$('hm').onclick=()=>{openView(null);scrollTo(0,0)};$('rb').onclick=resume;
applyTheme();updRB();openView(null);
</script></body></html>
