ntation are common, but SCC is the serious complication. True but not serious. True but not serious. Scalp LP scars, not non-scarring. It leaves hyperpigmentation.\nComplication: SCC.",""],"im":[]},{"id":"Q333","ch":"Inflammatory Dermatoses","q":"One of the following is precancerous","o":[["A","Actinic lichen planus"],["B","Mucosal lichen planus"],["C","Lichen planus pigmentosus"],["D","Lichen planopilaris"],["E","Scalp lichen planus"]],"a":"B","sa":null,"pg":"59","f":[],"n":42,"e":["Mucosal (erosive) lichen planus is considered precancerous because of its risk of SCC. Actinic is not precancerous. Pigmentosus is benign. Planopilaris scars. Scalp scars.\nOral LP: follow up.",""],"im":[]},{"id":"Q334","ch":"Inflammatory Dermatoses","q":"Lichen planus actinicus usually involves","o":[["A","Upper back."],["B","Genitalia."],["C","Nails."],["D","All of the above."],["E","None of the above."]],"a":"E","sa":null,"pg":null,"f":[],"n":43,"e":["Actinic LP lies on sun-exposed skin (face, dorsa of hands). Upper back, genitalia and nails are not its typical targets, so 'none of the above' is the key. It spares the back. It spares genitalia. It spares nails. Wrong: not all listed statements are correct.\nActinic LP: sun-exposed areas, often the face.",""],"im":[]},{"id":"Q335","ch":"Inflammatory Dermatoses","q":"Regarding lichen planus, the following is TRUE","o":[["A","It is a contagious disease."],["B","The primary lesion is a pearly white umbilicated papule."],["C","It never affects the oral mucosa."],["D","It can lead to cicatricial alopecia."],["E","It is due to HHV-7."]],"a":"D","sa":null,"pg":"90","f":[],"n":44,"e":["LP affecting the scalp destroys follicles and ends in scarring (cicatricial) alopecia. It is not contagious, and its papule is flat-topped violaceous, not pearly umbilicated (that is molluscum). It is not contagious. That is molluscum. It can affect the mouth. It is not viral.\nLP can scar the scalp.",""],"im":[]},{"id":"Q336","ch":"Inflammatory Dermatoses","q":"Actinic lichen planus usually affects","o":[["A","Mucous membranes."],["B","Genitals."],["C","Upper back."],["D","Face."],["E","None of the above."]],"a":"D","sa":null,"pg":"57","f":[],"n":45,"e":["Actinic LP (lichen planus tropicus) appears on sun-exposed areas such as the face and dorsum of the hands. Mucosa is classic LP. Genitals are classic LP. Upper back is covered. None applies, since the face is the usual site.\nFace = actinic LP.",""],"im":[]},{"id":"Q337","ch":"Inflammatory Dermatoses","q":"A female patient, 38 years old, presented with papules that developed on both her forearms and wrists. The condition started about five years ago with a gradual onset and a progressive course. She had severe itching. (Clinical photo: multiple violaceous flat-topped papules and plaques on both forearms and wrists - lichen planus.) Best treatment option is","o":[["A","Radiotherapy."],["B","Oral ivermectin."],["C","Topical potassium permanganate 1/8000."],["D","Oral terbinafine."],["E","Topical corticosteroids."]],"a":"E","sa":null,"pg":"62","f":[],"n":46,"e":["A few itchy lichen planus papules on the forearms are treated with topical corticosteroids, the first-line therapy for localized disease. Radiotherapy is not used. Ivermectin is antiparasitic. Permanganate dries oozing. Terbinafine is antifungal.\nTopical steroids.",""],"im":[]},{"id":"Q338","ch":"Inflammatory Dermatoses","q":"A patient presented with papules on both forearms and wrists. The condition started about five years ago with a gradual onset and a progressive course, with severe itching. (Clinical photo: violaceous flat-topped papules and plaques on both forearms and wrists - lichen planus.) Best treatment option is","o":[["A","Radiotherapy."],["B","Oral ivermectin."],["C","Topical potassium permanganate 1/8000."],["D","Topical terbinafine."],["E","Oral corticosteroids."]],"a":"E","sa":null,"pg":"62","f":[],"n":47,"e":["Extensive or severe LP needs oral corticosteroids, with sedating antihistamines for itch. Radiotherapy is not used. Ivermectin is antiparasitic. Permanganate dries oozing. Terbinafine is antifungal.\nGeneralized LP → systemic steroids.",""],"im":[]},{"id":"Q339","ch":"Inflammatory Dermatoses","q":"Treatment of choice for actinic lichen planus is","o":[["A","Allylamines."],["B","Calcipotriene."],["C","Antimalarials."],["D","Ivermectin."],["E","Nystatin."]],"a":"C","sa":null,"pg":"62","f":[],"n":48,"e":["Antimalarials (hydroxychloroquine/chloroquine) are the treatment of choice for actinic LP, with sunscreens. Allylamines are antifungal. Calcipotriene is for psoriasis. Ivermectin is antiparasitic. Nystatin is antifungal.\nActinic LP = antimalarials + sunscreen.",""],"im":[]},{"id":"Q340","ch":"Inflammatory Dermatoses","q":"Treatment of actinic lichen planus includes","o":[["A","Benzoyl peroxide."],["B","Phototherapy."],["C","Terbinafine."],["D","Chloroquine"],["E","Crotamiton."]],"a":"D","sa":null,"pg":"62","f":[],"n":49,"e":["Chloroquine/hydroxychloroquine, antimalarials, are the treatment for actinic LP, along with sunscreen. BPO is for acne. Phototherapy worsens actinic LP. Terbinafine is antifungal. Crotamiton is for scabies.",""],"im":[]},{"id":"Q341","ch":"Inflammatory Dermatoses","q":"In lichen planus tropicus (actinic LP), the lesions","o":[["A","Respond to antimalarials"],["B","May be precancerous"],["C","Respond to PUVA therapy"],["D","Are ulcerative"],["E","Are severely itchy"]],"a":"A","sa":null,"pg":"62","f":[],"n":50,"e":["Lichen planus tropicus (actinic LP) responds to antimalarials. Allylamines and nystatin are antifungals. Actinic LP is not precancerous. PUVA adds UV to a light-induced disease; antimalarials are used instead. Ulcerative lesions belong to erosive LP, not actinic LP. It is moderately itchy.",""],"im":[]},{"id":"Q342","ch":"Inflammatory Dermatoses","q":"Pityriasis rosea","o":[["A","Is a scaly erythematous disease"],["B","Is an infectious disease caused by a virus"],["C","Is commonly a recurrent disease"],["D","Usually heals in one week"],["E","Involves mainly forearms and legs"]],"a":"A","sa":null,"pg":"63","f":[],"n":51,"e":["Pityriasis rosea is a scaly erythematous papulosquamous eruption that is acute and self-limited, not a chronic or contagious disease. It is not infectious. It is rarely recurrent. It heals in weeks. It is truncal.\nScaly, rosy, self-limited.",""],"im":[]},{"id":"Q343","ch":"Inflammatory Dermatoses","q":"Pityriasis rosea is","o":[["A","Self-limiting."],["B","Chronic relapsing."],["C","A life threatening infection."],["D","An autoimmune disease."],["E","Caused by dermatophytes."]],"a":"A","sa":null,"pg":"63","f":[],"n":52,"e":["The rash heals spontaneously within 4-8 weeks (up to 5 months) without sequelae, so it is self-limiting. It is not chronic relapsing, autoimmune or fungal. It is self-limited. It is benign. It is not autoimmune. It is not fungal.\nSelf-limited; recurrence rare.",""],"im":[]},{"id":"Q344","ch":"Inflammatory Dermatoses","q":"Pityriasis rosea is","o":[["A","Contagious with a chronic course."],["B","Contagious with a self-limited course."],["C","Non-contagious with a self-limited course."],["D","Contagious with an acute course."],["E","Non-contagious with remissions and exacerbations."]],"a":"C","sa":null,"pg":"64","f":[],"n":53,"e":["Pityriasis rosea is considered a non-contagious exanthematous reaction with a self-limiting course, so isolation is unnecessary. It is non-contagious. It is non-contagious. It is non-contagious. It does not relapse.\nNon-infectious, self-limited.",""],"im":[]},{"id":"Q345","ch":"Inflammatory Dermatoses","q":"Pityriasis rosea","o":[["A","Is an infectious scaly erythematous disease."],["B","Is caused by human herpes viruses 6 & 7."],["C","Is commonly a recurrent disease."],["D","Usually heals in one week."],["E","Affects mainly forearms & lower legs."]],"a":"B","sa":null,"pg":"63","f":[],"n":54,"e":["PR is probably an exanthem related to upper respiratory viral infection with human herpes virus 6 and 7. It is not contagious. It rarely recurs. It takes weeks. It is truncal.\nHHV 6 and 7.",""],"im":[]},{"id":"Q346","ch":"Inflammatory Dermatoses","q":"Pityriasis rosea","o":[["A","Is caused by varicella-zoster virus."],["B","Is commonly associated with burning sensation."],["C","Is usually recurrent."],["D","Has a viral aetiology related to HHV-6."],["E","Heals spontaneously after one week."]],"a":"D","sa":null,"pg":"63","f":[],"n":55,"e":["Pityriasis rosea is believed to be a viral exanthem associated with HHV-6/7, not bacterial or fungal. It is not VZV. It is mildly itchy. It rarely recurs. It takes weeks.",""],"im":[]},{"id":"Q347","ch":"Inflammatory Dermatoses","q":"Pityriasis rosea","o":[["A","Is an infectious scaly erythematous disease."],["B","Is a viral exanthema."],["C","Is commonly a recurrent disease."],["D","Usually heals in one week."],["E","Affects mainly forearms and lower legs."]],"a":"B","sa":null,"pg":"63","f":[],"n":56,"e":["The eruption follows an upper respiratory infection and is therefore regarded as an exanthematous reaction (viral exanthem). It is not contagious. It rarely recurs. It takes weeks. It is truncal.",""],"im":[]},{"id":"Q348","ch":"Inflammatory Dermatoses","q":"The causative organism of pityriasis rosea is","o":[["A","Varicella zoster virus."],["B","Human papilloma virus."],["C","Human herpes virus 6 & 7."],["D","Human herpes virus 8."],["E","Human herpes virus 1 & 2."]],"a":"C","sa":null,"pg":"63","f":[],"n":57,"e":["Human herpes viruses 6 and 7 are implicated, with recent reports of influenza and COVID-19. VZV causes zoster. HPV causes warts. HHV-8 causes Kaposi. HSV causes vesicles.\nHHV-6/7.",""],"im":[]},{"id":"Q349","ch":"Inflammatory Dermatoses","q":"The differential diagnosis of \"herald patch\" on the trunk is","o":[["A","Tinea capitis."],["B","Tinea corporis."],["C","Pityriasis versicolor."],["D","Tinea manuum."],["E","Tinea pedis."]],"a":"B","sa":null,"pg":null,"f":["Answer taken from key row; verify."],"n":58,"e":["A herald patch (a single annular scaly patch) mimics tinea corporis, so scraping with KOH distinguishes them. Capitis is scalp. Versicolor is macular. Manuum is hands. Pedis is feet.\nHerald patch ≈ tinea corporis.",""],"im":[]},{"id":"Q350","ch":"Inflammatory Dermatoses","q":"Typical distribution of the secondary eruption of pityriasis rosea is on","o":[["A","Trunk and proximal extremities."],["B","Face."],["C","Upper limbs."],["D","Lower limbs."],["E","Hands and feet."]],"a":"A","sa":null,"pg":null,"f":[],"n":59,"e":["The secondary eruption of smaller oval lesions appears on the trunk and proximal limbs in a Christmas-tree pattern along the ribs; face, palms and soles are spared. Face is spared. Upper limbs are spared distally. Lower limbs are spared. Hands and feet are spared.\nTrunk and proximal limbs; spares face, palms, soles.",""],"im":[]},{"id":"Q351","ch":"Inflammatory Dermatoses","q":"The primary lesion that precedes pityriasis rosea is","o":[["A","Chicken pox."],["B","Primary herpetic gingivostomatitis."],["C","Herald patch."],["D","Stippling sign."],["E","Auspitz sign."]],"a":"C","sa":null,"pg":"63","f":[],"n":60,"e":["The herald patch, a single 2-5 cm oval scaly lesion, appears 1-2 weeks before the generalized eruption. Chickenpox is a separate disease. Gingivostomatitis is HSV. Stippling is DLE. Auspitz is psoriasis.\nHerald patch first.",""],"im":[]},{"id":"Q352","ch":"Inflammatory Dermatoses","q":"An 18-year-old girl came to the clinic complaining of a skin rash of 10 days duration. On examination, multiple oval lesions were scattered on the trunk in a \"Christmas tree\" distribution. The primary lesion of this disease is","o":[["A","Scaly erythema"],["B","Target lesion"],["C","Stippling sign"],["D","Nodule."],["E","Herald patch"]],"a":"E","sa":null,"pg":"63","f":[],"n":61,"e":["The primary lesion of PR is the herald patch, with an outer erythematous zone and an inner collarette of scales. Scaly erythema is not specific. Target is EM. Stippling is DLE. A nodule is not primary.\nCollarette scale.",""],"im":[]},{"id":"Q353","ch":"Inflammatory Dermatoses","q":"The following diseases show scales EXCEPT","o":[["A","Lichen planus"],["B","Alopecia areata"],["C","Lupus erythematosus"],["D","Pityriasis rosea"],["E","Pityriasis versicolor"]],"a":"B","sa":null,"pg":"94","f":[],"n":62,"e":["Scaly conditions include psoriasis, PR, tinea and seborrheic dermatitis; alopecia areata is non-scaly with smooth bald skin. LP has scale. Lupus has scale. PR has scale. Versicolor has scale.\nAA: smooth, non-scaly.",""],"im":[]},{"id":"Q354","ch":"Inflammatory Dermatoses","q":"What disorder is characterized by an initial herald patch, followed by scaly erythematous lesions on the trunk in a \"Christmas tree\" distribution?","o":[["A","Pityriasis rosea."],["B","Herpes simplex"],["C","Herpes zoster."],["D","Erysipelas."],["E","Molluscum contagiosum."]],"a":"A","sa":null,"pg":"63","f":[],"n":63,"e":["A herald patch followed by crops of scaly lesions on the trunk in a Christmas-tree pattern is pityriasis rosea. HSV is vesicular. Zoster is dermatomal. Erysipelas is hot. Molluscum is umbilicated.\nHerald → Christmas tree.",""],"im":[]},{"id":"Q355","ch":"Inflammatory Dermatoses","q":"A 17-year-old girl noted a 2-cm annular pink, scaly lesion on her back. Over the next 2 weeks she developed several smaller oval pink lesions with a fine collarette of scales. They seem to run in the body folds and mainly involve the trunk, although a few occur on the upper arms and thighs. What is the most likely diagnosis?","o":[["A","Tinea versicolor."],["B","Psoriasis."],["C","Lichen planus"],["D","Pityriasis rosea"],["E","Tinea circinata."]],"a":"D","sa":null,"pg":"63","f":[],"n":64,"e":["A 2 cm annular scaly lesion, then similar smaller lesions two weeks later along the ribs, is pityriasis rosea. Versicolor is macular. Psoriasis is silvery. LP is violaceous. Circinata has no herald.\nInitial annular lesion.",""],"im":[]},{"id":"Q356","ch":"Inflammatory Dermatoses","q":"The primary lesion of pityriasis rosea is","o":[["A","Patch"],["B","Plaque"],["C","Vesicle"],["D","Pustule"],["E","Nodule"]],"a":"A","sa":null,"pg":"63","f":[],"n":65,"e":["The first lesion is a 'patch' (herald patch), 2-5 cm, oval with a collarette of scales; this is what the question calls the primary lesion. It is not a plaque. It is not a vesicle. It is not a pustule. It is not a nodule.\nHerald patch = single large patch.",""],"im":[]},{"id":"Q357","ch":"Inflammatory Dermatoses","q":"Herald patch is the primary lesion of","o":[["A","Psoriasis"],["B","Lichen planus"],["C","Pityriasis rosea"],["D","Atopic dermatitis"],["E","Scabies"]],"a":"C","sa":null,"pg":"63","f":[],"n":66,"e":["The herald patch is the first lesion of pityriasis rosea: a single 2-5 cm oval scaly lesion with a collarette of scales. Psoriasis has plaques. LP has papules. Atopic has flexural lesions. Scabies has burrows.\nHerald → PR.",""],"im":[]},{"id":"Q358","ch":"Inflammatory Dermatoses","q":"Treatment of pityriasis rosea includes","o":[["A","Isolation."],["B","Reassurance."],["C","Cytotoxic drugs."],["D","Intralesional steroids."],["E","Topical antibiotics."]],"a":"B","sa":null,"pg":"64","f":[],"n":67,"e":["Treatment is mainly reassurance that the eruption is non-infectious and self-limited, with emollients; no isolation or cytotoxic drugs are needed. Not contagious. Not needed. Not needed. It is not bacterial.\nReassure.",""],"im":[]},{"id":"Q359","ch":"Inflammatory Dermatoses","q":"Treatment of pityriasis rosea includes","o":[["A","Isolation"],["B","Topical antibiotics"],["C","Intralesional steroids"],["D","Topical steroids"],["E","Cytotoxic drugs"]],"a":"D","sa":null,"pg":"64","f":[],"n":68,"e":["Mild topical corticosteroids (and emollients) relieve itching in pityriasis rosea; antihistamines can be added. Not contagious. It is not bacterial. Not needed. Not needed.\nMild steroid for itch.",""],"im":[]},{"id":"Q360","ch":"Inflammatory Dermatoses","q":"The following disease is NOT contagious","o":[["A","Scabies."],["B","Pediculosis capitis."],["C","Ecthyma."],["D","Leprosy."],["E","Discoid lupus erythematosus."]],"a":"E","sa":null,"pg":"65","f":[],"n":69,"e":["DLE is an autoimmune skin disease and cannot be transmitted, unlike scabies, tinea or impetigo. Scabies is contagious. Lice are contagious. Ecthyma is contagious. Leprosy is contagious.",""],"im":[]},{"id":"Q361","ch":"Inflammatory Dermatoses","q":"Stippling means","o":[["A","Dilated capillaries."],["B","Dilated pilosebaceous orifices."],["C","Atrophy."],["D","Scarring."],["E","Telangiectasia."]],"a":"B","sa":null,"pg":"65","f":[],"n":70,"e":["Stippling is the appearance of dilated pilosebaceous orifices filled with keratin plugs, seen in DLE as follicular plugging. That is telangiectasia. That is atrophy. That is scarring. That is telangiectasia.\nStippling = DLE.",""],"im":[]},{"id":"Q362","ch":"Inflammatory Dermatoses","q":"A 25 years old female patient presenting with well-defined erythematous plaques on the face with adherent scales, telangiectasia, stippling & atrophy is suffering from","o":[["A","Psoriasis."],["B","Discoid lupus erythematosus."],["C","Lichen planus."],["D","Seborrheic dermatitis."],["E","None of the above."]],"a":"B","sa":null,"pg":"65","f":[],"n":71,"e":["Well-defined plaques with adherent scales, telangiectasia, stippling and atrophy on the face are the five cardinal signs of DLE. Psoriasis has silvery scale. LP is violaceous. Seb derm is greasy. DLE is correct.\nErythema, telangiectasia, scaling, stippling, scarring.",""],"im":[]},{"id":"Q363","ch":"Inflammatory Dermatoses","q":"Stippling sign is present in","o":[["A","Lichen planus."],["B","Psoriasis."],["C","Lupus erythematosus."],["D","Pityriasis rosea."],["E","Vitiligo."]],"a":"C","sa":null,"pg":"65","f":[],"n":72,"e":["The stippling sign (dilated follicular orifices with keratotic plugs) is a hallmark of lupus erythematosus, i.e. DLE. LP has striae. Psoriasis has Auspitz. PR has collarette. Vitiligo is depigmented.",""],"im":[]},{"id":"Q364","ch":"Inflammatory Dermatoses","q":"The clinical picture of discoid lupus erythematosus is","o":[["A","Well-defined erythematous plaques covered with adherent scales."],["B","ill-defined erythematous plaques covered with adherent scales."],["C","ill-defined erythematous plaques covered with loose scales."],["D","Well-defined erythematous patches covered with adherent scales."],["E","Well-defined erythematous patches covered with loose scales."]],"a":"A","sa":null,"pg":"65","f":[],"n":73,"e":["DLE shows well-defined erythematous plaques covered with adherent scales, while the underlying orifices are dilated. It is well defined. It is well defined. They are plaques. They are plaques.\nAdherent scales, well-defined.",""],"im":[]},{"id":"Q365","ch":"Inflammatory Dermatoses","q":"A 32-year-old male patient presented with well-defined scaly erythematous plaques on his cheeks and nose with telangiectasia and atrophy. Plaques also showed dilatation of the pilosebaceous orifices. The condition started about five years ago and showed remissions and exacerbations with some improvement during winter times. (Clinical photo: erythematous scaly atrophic plaques on the cheek and nose.) What is the diagnosis of this case?","o":[["A","Discoid lupus."],["B","Contact urticaria."],["C","Contact dermatitis."],["D","Psoriasis."],["E","Vitiligo."]],"a":"A","sa":null,"pg":"65","f":[],"n":74,"e":["Scaly erythematous plaques with telangiectasia and atrophy in sun-exposed areas are discoid lupus. Urticaria has wheals. Contact dermatitis is itchy. Psoriasis has silvery scale. Vitiligo is depigmented.\nDLE.",""],"im":[]},{"id":"Q366","ch":"Inflammatory Dermatoses","q":"Scalp involvement is typical of the following dermatological disorder","o":[["A","Discoid lupus erythematosus"],["B","Scabies"],["C","Ecthyma."],["D","Pityriasis rosea."],["E","Erythrasma."]],"a":"A","sa":null,"pg":"65","f":[],"n":75,"e":["DLE typically involves the scalp and ends in permanent cicatricial alopecia. Scabies spares the scalp. Ecthyma is on legs. PR is truncal. Erythrasma is in folds.\nDLE scarring alopecia.",""],"im":[]},{"id":"Q367","ch":"Inflammatory Dermatoses","q":"All of the following are signs of discoid lupus erythematosus EXCEPT","o":[["A","Erythema."],["B","Telangiectasia."],["C","Stippling."],["D","Scarring."],["E","Pustulation."]],"a":"E","sa":null,"pg":"65","f":[],"n":76,"e":["Erythema, telangiectasia, stippling and scarring are DLE signs. Pustulation is not. A sign. A sign. A sign. A sign.\nNo pustules.",""],"im":[]},{"id":"Q368","ch":"Inflammatory Dermatoses","q":"Regarding discoid lupus erythematosus:","o":[["A","It involves mainly upper and lower limbs."],["B","Telangiectasia is one of its cardinal signs."],["C","It is a multisystem connective tissue disease."],["D","It heals without scarring."],["E","Phototherapy is the first line of treatment."]],"a":"B","sa":null,"pg":"65","f":[],"n":77,"e":["Telangiectasia at the borders is one of the five cardinal signs of DLE; DLE is confined to skin rather than multisystem, and it heals with scarring. It involves the face. DLE is cutaneous. It heals with scarring. Antimalarials are used.\nCardinal signs include telangiectasia.",""],"im":[]},{"id":"Q369","ch":"Inflammatory Dermatoses","q":"The following findings are characteristic of discoid lupus erythematosus EXCEPT","o":[["A","Erythema."],["B","Adherent scales."],["C","Dilated pilosebaceous orifices."],["D","Pustules."],["E","Telangiectasia."]],"a":"D","sa":null,"pg":"65","f":[],"n":78,"e":["Pustules are not a feature of DLE; they occur in pustular psoriasis or acne. Characteristic. Characteristic. Characteristic. Characteristic.\nNo pustules in DLE.",""],"im":[]},{"id":"Q370","ch":"Inflammatory Dermatoses","q":"One of the cardinal signs of discoid lupus erythematosus is","o":[["A","Hypopigmentation"],["B","Comedones"],["C","Pustules"],["D","Ulcer formation"],["E","Telangiectasia"]],"a":"E","sa":null,"pg":"65","f":[],"n":79,"e":["Telangiectasia is one of the five cardinal signs of DLE: erythema, telangiectasia, scaling, stippling, scarring. DLE leaves hypo and hyperpigmentation. Comedones are acne. Pustules are not seen. Ulcer is not cardinal.\n5 cardinal signs.",""],"im":[]},{"id":"Q371","ch":"Inflammatory Dermatoses","q":"Well-defined erythematous plaques, adherent scales, dilated pilosebaceous orifices, telangiectasia, and atrophic scars are cardinal signs of","o":[["A","Lichen planus"],["B","Psoriasis vulgaris"],["C","Acne vulgaris"],["D","Discoid lupus erythematosus"],["E","Rosacea"]],"a":"D","sa":null,"pg":"65","f":[],"n":80,"e":["The combination of well-defined plaques, adherent scales, dilated pilosebaceous orifices, telangiectasia and atrophy is typical of DLE. LP is violaceous. Psoriasis is silvery. Acne has comedones. Rosacea has pustules.",""],"im":[]},{"id":"Q372","ch":"Inflammatory Dermatoses","q":"Cardinal signs of discoid lupus include all the following EXCEPT:","o":[["A","Erythema"],["B","Scaling"],["C","Lichenification"],["D","Stippling"],["E","Telangiectasia"]],"a":"C","sa":null,"pg":"65","f":[],"n":81,"e":["Lichenification is a sign of chronic eczema and is not a cardinal sign of DLE (erythema, telangiectasia, scaling, stippling, scarring). Cardinal. Cardinal. Cardinal. Cardinal.\nNo lichenification.",""],"im":[]},{"id":"Q373","ch":"Inflammatory Dermatoses","q":"PUVA may be used in the treatment of all of the following EXCEPT","o":[["A","Psoriasis."],["B","Vitiligo."],["C","Discoid lupus erythematosus."],["D","Alopecia."],["E","Lichen planus."]],"a":"C","sa":null,"pg":"66","f":[],"n":82,"e":["DLE is photosensitive and UV light can worsen it, so PUVA is not used; PUVA is used for psoriasis, vitiligo and alopecia areata. PUVA treats it. PUVA treats it. PUVA treats AA. PUVA treats LP.\nAvoid UV in lupus.",""],"im":[]},{"id":"Q374","ch":"Inflammatory Dermatoses","q":"A 32-year-old male patient presented with well-defined scaly erythematous plaques on his cheeks and nose with telangiectasia and atrophy. Plaques also showed dilatation of the pilosebaceous orifices. The condition started about five years ago and showed remissions and exacerbations with some improvement during winter times. (Clinical photo: erythematous scaly atrophic plaques on the cheek and nose - discoid lupus erythematosus.) Topical treatment of this case includes","o":[["A","Benzyl benzoate 25%."],["B","Benzoyl peroxide 10%."],["C","Gentamycin ointment."],["D","Azole cream."],["E","Corticosteroid cream."]],"a":"E","sa":null,"pg":"66","f":[],"n":83,"e":["Localized DLE lesions are treated with potent topical (or intralesional) corticosteroids, plus sun protection. Benzyl benzoate is for scabies. BPO is for acne. Gentamicin is antibacterial. Azoles are antifungal.\nPotent topical steroid.",""],"im":[]},{"id":"Q375","ch":"Inflammatory Dermatoses","q":"One of the following is used in ttt of discoid lupus","o":[["A","Antimalarials."],["B","Phototherapy."],["C","Laser."],["D","Retinoids."],["E","Methotrexate."]],"a":"A","sa":null,"pg":"66","f":[],"n":84,"e":["Antimalarials such as hydroxychloroquine are systemic photoprotective and anti-inflammatory agents used for DLE. Phototherapy worsens. Laser is not first line. Retinoids are used rarely. Methotrexate is not first line.",""],"im":[]},{"id":"Q376","ch":"Inflammatory Dermatoses","q":"Phototherapy is used in treating the following disease EXCEPT","o":[["A","Psoriasis."],["B","Systemic lupus erythematosus."],["C","Vitiligo."],["D","Alopecia areata."],["E","Atopic eczema."]],"a":"B","sa":null,"pg":"66","f":[],"n":85,"e":["Phototherapy treats psoriasis, vitiligo and alopecia areata, but lupus is photosensitive so it is avoided. Phototherapy is used. Phototherapy is used. Phototherapy is used. Phototherapy is used.\nPhototherapy not for lupus.",""],"im":[]},{"id":"Q377","ch":"Inflammatory Dermatoses","q":"Discoid lupus erythematosus is best treated by","o":[["A","Topical antimalarials only."],["B","Topical antimalarials + systemic antimalarials."],["C","Topical antimalarials + topical steroids."],["D","Topical antimalarials + systemic steroids."],["E","Systemic antimalarials + topical steroids."]],"a":"E","sa":null,"pg":"66","f":[],"n":86,"e":["Extensive DLE is best treated with systemic antimalarials plus topical steroids, with sun avoidance. Antimalarials are oral, not topical. There are no topical antimalarials; they are given orally. There are no topical antimalarials; they are given orally. Antimalarials are oral and systemic steroids are not first-line.\nAntimalarial + topical steroid.",""],"im":[]},{"id":"Q378","ch":"Inflammatory Dermatoses","q":"An oval skin lesion showing outer erythema, intermediate scaling, and inner healing center is called","o":[["A","Tinea circinata."],["B","Erysipelas."],["C","Herald patch of pityriasis rosea."],["D","Erythrasma."],["E","Scaly ringworm."]],"a":"C","sa":null,"pg":"63","f":[],"n":87,"e":["An oval lesion with outer erythema, intermediate scaling and an inner paler center is the herald patch of pityriasis rosea. Circinata has no collarette. Erysipelas is hot. Erythrasma is brown. Scaly ringworm is scalp.\nThree zones.",""],"im":[]},{"id":"Q543","ch":"Inflammatory Dermatoses","q":"Onycholysis may be seen in:","o":[["A","Lichen planus."],["B","Psoriasis."],["C","Onychomycosis."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"37","f":[],"n":88,"e":["Onycholysis (separation of the nail plate from the nail bed) occurs in psoriasis, lichen planus and onychomycosis, so all of the above is correct.\nOnycholysis: psoriasis, LP, fungal nails, also trauma and thyroid disease.",""],"im":[]},{"id":"Q544","ch":"Inflammatory Dermatoses","q":"Methotrexate is:","o":[["A","An H-1 antagonist."],["B","A dihydrofolate reductase inhibitor."],["C","An H-2 antagonist."],["D","A beta adrenergic blocker."],["E","All of the above."]],"a":"B","sa":null,"pg":"56","f":[],"n":89,"e":["Methotrexate is a folate antagonist that inhibits dihydrofolate reducta above."]],"a":"D","sa":null,"pg":null,"f":[],"n":92,"e":["Actinic LP occurs on the sun-exposed face and dorsum of hands, so the face is correct. Mucosa is classic LP. Genitals are classic LP. Upper back is covered. Face is correct.",""],"im":[]},{"id":"H198","ch":"Inflammatory Dermatoses","q":"Lichen planus actinicus usually affects:","o":[["A","Upper back."],["B","Genitalia."],["C","Nails."],["D","All of the above."],["E","None of the above."]],"a":"E","sa":null,"pg":null,"f":[],"n":93,"e":["Actinic LP is on sun-exposed skin, not upper back, genitals or nails per this key (none of the above). It spares the back. It spares genitalia. It spares nails. Wrong: not all listed statements are correct.",""],"im":[]},{"id":"H199","ch":"Inflammatory Dermatoses","q":"Well-defined flat-topped, polyangular, violaceous, itchy papules are the primary lesions of:","o":[["A","Vitiligo."],["B","Lupus erythematosus."],["C","Lichen planus."],["D","Psoriasis."],["E","None of the above."]],"a":"C","sa":null,"pg":null,"f":[],"n":94,"e":["Flat-topped polyangular violaceous itchy papules are the primary lesion of lichen planus, unlike psoriasis (silvery scale) or lupus. Vitiligo has macules. Lupus has atrophic plaques. Psoriasis is scaly. Wrong: at least one listed statement is correct.\nLP.",""],"im":[]},{"id":"H201","ch":"Inflammatory Dermatoses","q":"Scarring alopecia may be caused by:","o":[["A","Psoriasis."],["B","Seborrheic dermatitis."],["C","Fever."],["D","Lichen planus."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":95,"e":["Lichen planus of the scalp destroys the follicles and causes scarring alopecia, unlike psoriasis, seborrheic dermatitis or fever. Psoriasis is non-scarring. Seb derm is non-scarring. Fever causes shedding. Wrong: at least one listed statement is correct.\nLP can scar.",""],"im":[]},{"id":"H204","ch":"Inflammatory Dermatoses","q":"All of the following are types of lichen planus EXCEPT:","o":[["A","Actinic lichen planus."],["B","Pustular li rl came to the clinic complaining ofa skin rash of 10 days duration. On exam-ination,multiple oval lesions were scattered on the trunk in a “Christmas tree distribution. The primary lesion of this disease is:","o":[["A","Scaly erythema"],["B","Target lesion"],["C","Stippling sign"],["D","Nodule."],["E","Herald patch"]],"a":"E","sa":null,"pg":null,"f":[],"n":100,"e":["Oval lesions in a Christmas-tree distribution mean pityriasis rosea, whose primary lesion is the herald patch. Scaly erythema is not specific. Target is EM. Stippling is DLE. A nodule is not primary.",""],"im":[]},{"id":"H221","ch":"Inflammatory Dermatoses","q":"PUVA may be used in the treatment of all of the following EXCEPT:","o":[["A","Psoriasis."],["B","Vitiligo."],["C","Discoid lupus erythematosus."],["D","Alopecia."],["E","None of the above."]],"a":"C","sa":null,"pg":null,"f":[],"n":101,"e":["PUVA treats psoriasis, vitiligo and alopecia areata, but not DLE, which is made worse by light. PUVA treats it. PUVA treats it. PUVA treats AA. Not applicable.\nDLE excluded.",""],"im":[]},{"id":"H224","ch":"Inflammatory Dermatoses","q":"The following findings are pathognomonic of discoid lupus erythematosus EXCEPT:","o":[["A","Erythema."],["B","Adherent scales."],["C","Dilated pilosebaceous orifices."],["D","Pustules."],["E","Telangiectasia."]],"a":"D","sa":null,"pg":null,"f":[],"n":102,"e":["Pustules are not a finding in DLE, unlike erythema, scales and dilated orifices. Present. Present. Present. Present.\nNo pustules.",""],"im":[]},{"id":"H225","ch":"Inflammatory Dermatoses","q":"The clinical picture of discoid lupus erythematosus is:","o":[["A","Well-defined erythematous plaques covered with adherent scales."],["B","Ill-defined erythematous plaques covered with adherent scales."],["C","Ill-defined erythematous plaques covered with loose scales."],["D","Well-defined erythematous patches covered with adherent scales."],["E","Well-defined erythematous patches covered with loose scales."]],"a":"A","sa":null,"pg":null,"f":[],"n":103,"e":["DLE gives well-defined erythematous plaques covered by adherent scales, with dilated follicles beneath. It is well defined. It is well defined. They are plaques. They are plaques.",""],"im":[]},{"id":"H227","ch":"Inflammatory Dermatoses","q":"Discoid lupus erythematosus:","o":[["A","Usually occurs in semi-exposed areas."],["B","May be a manifestation of systemic lupus erythematosus."],["C","May end in cicatricial alopecia."],["D","Tropical antimalarials are very effective."],["E","May be confused with lichen planus."]],"a":"C","sa":null,"pg":null,"f":["More than one option is defensible (B and E are also true); the key is C."],"n":104,"e":["DLE of the scalp can end in cicatricial alopecia, and it improves with antimalarials but is not mainly at semi-exposed sites. DLE is sun-exposed. DLE can accompany SLE, so this is also arguable. There are no topical antimalarials. It can resemble LP, so this is also arguable.\nDLE scars.",""],"im":[]},{"id":"H229","ch":"Inflammatory Dermatoses","q":"A 32-year-old male patient presented with well-defined scaly erythematous plaques on his cheeks and nose with telangiectasia and atrophy. Plaques also showed dilatation of the pilosebaceous orifices. The condition started to appear about five years ago and showed remissions and exacerbations with some improvement during winter times. What is the diagnosis of this case?","o":[["A","Discoid lupus."],["B","Contact urticaria."],["C","Contact dermatitis."],["D","Psoriasis."],["E","Vitiligo."]],"a":"A","sa":null,"pg":null,"f":[],"n":105,"e":["Cheek and nose plaques with atrophy, telangiectasia, dilated orifices and chronic course improving in winter is discoid lupus. Urticaria has wheals. Contact dermatitis is itchy. Psoriasis has silvery scale. Vitiligo is depigmented.\nSun-exposed face.",""],"im":[]},{"id":"Q379","ch":"Allergic Disorders","q":"In acute eczema, all of the following occurs EXCEPT","o":[["A","Erythema."],["B","Oozing."],["C","Lichenification."],["D","Vesicles."],["E","Crusting."]],"a":"C","sa":null,"pg":"67","f":[],"n":1,"e":["Acute eczema is the wet stage: erythema, edema, vesicles, oozing and crusting. Lichenification (thickened skin with accentuated lines) develops only after prolonged scratching, so it belongs to chronic eczema. Occurs. Occurs. Occurs. Occurs.\nAcute = vesicles/oozing; chronic = lichenification.",""],"im":[]},{"id":"Q380","ch":"Allergic Disorders","q":"Acute dermatitis presents by","o":[["A","Vesicles."],["B","Lichenification."],["C","Wheals."],["D","Pustules."],["E","Ulcers."]],"a":"A","sa":null,"pg":"67","f":[],"n":2,"e":["In the acute phase eczema presents with papules and vesicles on an erythematous edematous base, followed by oozing and crusts. That is chronic. That is urticaria. That is infection. That is infection.\nAcute dermatitis → vesicles.",""],"im":[]},{"id":"Q381","ch":"Allergic Disorders","q":"Chronic eczema is characterized by one of the following","o":[["A","Erythema."],["B","Oozing."],["C","Lichenification."],["D","Vesicles."],["E","Pustules."]],"a":"C","sa":null,"pg":"67","f":[],"n":3,"e":["Chronic eczema results from prolonged, repeated attacks, giving lichenification, excoriations and pigment change. Erythema, oozing, vesicles and pustules are acute or infected features. It occurs in acute. Oozing is acute. Vesicles are acute. Pustules are infection.\nChronic = lichenification.",""],"im":[]},{"id":"Q382","ch":"Allergic Disorders","q":"Chronic eczema is characterized by","o":[["A","Itching."],["B","Vesiculation."],["C","Lichenification."],["D","a + b."],["E","a + c."]],"a":"E","sa":null,"pg":"67","f":[],"n":4,"e":["Chronic eczema is itchy (a) and lichenified (c). Vesiculation (b) belongs to the acute stage, so a + c is correct. True but incomplete. Vesicles are acute. True but incomplete. Vesicles are acute.\nItch + lichenification.",""],"im":[]},{"id":"Q383","ch":"Allergic Disorders","q":"A 4-month-old infant had bilateral erythematous plaques with vesicles, oozin Impetigo is crusted.\nIgE elevated in atopy.",""],"im":[]},{"id":"Q386","ch":"Allergic Disorders","q":"A 6-year-old child presented with groups of itchy papules involving the flexures & sides of the neck. The most probable diagnosis is","o":[["A","Varicose eczema."],["B","Contact eczema."],["C","Atopic eczema."],["D","Stasis eczema."],["E","Seborrheic eczema."]],"a":"C","sa":null,"pg":"68","f":[],"n":8,"e":["Itchy papules on the flexures and neck sides of a child are the childhood phase of atopic dermatitis, which prefers antecubital and popliteal fossae. Varicose is legs. Contact follows exposure. Stasis is legs. Seb derm is greasy.\nChild: flexures.",""],"im":[]},{"id":"Q387","ch":"Allergic Disorders","q":"A male baby, 4 months old, presented with a reddish rash on his face. His mother reported that the baby was irritable and always crying. On examination, papules and vesicles were noted. (Clinical photo: infant with erythematous papulovesicular rash on the cheeks.) One of the following statements about this disease is true","o":[["A","Transmitted by direct contact."],["B","Diagnosed by patch test."],["C","Heals with a scar."],["D","Family history is usually positive."],["E","Treated by topical retinoids."]],"a":"D","sa":null,"pg":"67","f":[],"n":9,"e":["Atopic dermatitis is a hereditary predisposition; family history of asthma, rhinitis or dermatitis is positive in 50-70%. It is not contagious and does not scar. Atopic dermatitis is not contagious; it is an inherited atopic disease. Patch test is for contact. It heals without scar. Retinoids treat acne and keratinization disorders; atopic dermatitis needs emollients, topical steroids or calcineurin inhibitors.\nFamily history positive.",""],"im":[]},{"id":"Q388","ch":"Allergic Disorders","q":"The following characterizes atopic eczema","o":[["A","Antiseptic lotions are used for lichenified lesions."],["B","In infants, lichenified lesions are common."],["C","In children, it is common on cheeks."],["D","In adults, it is common on flexor areas."],["E","Pruritus is absent."]],"a":"D","sa":null,"pg":"69","f":[],"n":10,"e":["In adults the lesions are like childhood ones with lichenification, common in flexures (flexor areas). Infants favor the face and extensors. Antiseptics are for oozing. Infants have vesicles. Children have flexures. It is itchy.\nAdult atopic: flexural, lichenified.",""],"im":[]},{"id":"Q389","ch":"Allergic Disorders","q":"Sites of atopic dermatitis in the infantile and childhood phases are ___","o":[],"a":null,"sa":"Infantile phase: face, neck, extensor extremities (and flexures); childhood phase: flexures, particularly antecubital and popliteal fossae (also face, neck, extensors).","pg":"68","f":[],"n":11,"e":["Infantile phase: face, neck, extensor extremities (and flexures). Childhood phase: flexures, particularly antecubital and popliteal fossae, plus face and neck.\nInfant face/extensors; child flexures.",""],"im":[]},{"id":"Q390","ch":"Allergic Disorders","q":"A 9-year-old female has recurrent itchy papulo-vesicular lesions on the antecubital and popliteal fossae. Her mother gave a history that the child had similar lesions on the cheeks since she was one year old. The best treatment for this condition is","o":[["A","Terbinafine."],["B","Acyclovir."],["C","Dapsone."],["D","Topical steroids."],["E","Electrocautery."]],"a":"D","sa":null,"pg":"75","f":[],"n":12,"e":["Recurrent itchy papulovesicular lesions in the elbow and knee flexures, with facial lesions in infancy, are atopic dermatitis; topical corticosteroids (with moisturizers) are the treatment. Terbinafine, acyclovir and dapsone treat other conditions. Terbinafine is antifungal. Acyclovir is antiviral. Dapsone is for leprosy. Cautery is for warts.\nMoisturizer + topical steroid.",""],"im":[]},{"id":"Q391","ch":"Allergic Disorders","q":"Seborrheic dermatitis may be treated by","o":[["A","Olive oil in infantile scalp lesions."],["B","Topical antifungals."],["C","Topical steroids."],["D","Selenium sulphide."],["E","All of the above."]],"a":"E","sa":null,"pg":"75","f":[],"n":13,"e":["Seborrheic dermatitis (due to the yeast Malassezia) is treated with oils for infantile scalp crusts, topical antifungals, mild steroids and selenium sulfide shampoos, so all options apply.\nOil, antifungal, steroid, selenium.",""],"im":[]},{"id":"Q392","ch":"Allergic Disorders","q":"Allergic contact dermatitis","o":[["A","Is an immunological reaction."],["B","Occurs in any individual soon after exposure."],["C","Can be caused by acids or alkalis."],["D","Can occur due to cumulative damage by mild irritants."],["E","Occurs in compulsive washers."]],"a":"A","sa":null,"pg":"72","f":[],"n":14,"e":["Allergic contact dermatitis is a delayed immunological reaction in sensitized individuals after exposure to an allergen. Irritant dermatitis, by contrast, is non-immunological. It needs sensitization. That is irritant. That is irritant. That is irritant.\nAllergic = immune; irritant = direct damage.",""],"im":[]},{"id":"Q393","ch":"Allergic Disorders","q":"A female patient, 18 years old, presented with an itchy rash on the dorsa of both hands and forearms. The condition started 2 days after henna application with a gradual onset and a progressive course. Patient reported that she once applied henna a year ago and no rash appeared then. What is the diagnosis of this case?","o":[["A","Psoriasis vulgaris."],["B","Irritant dermatitis."],["C","Allergic dermatitis."],["D","Neurodermatitis."],["E","Lichen planus."]],"a":"C","sa":null,"pg":"72","f":[],"n":15,"e":["A localized eczematous rash occurring at the site of contact is allergic contact dermatitis; confirm with patch test. Psoriasis is scaly. Irritant needs exposure. Neurodermatitis is chronic. LP is violaceous.\nRash follows contact.",""],"im":[]},{"id":"Q394","ch":"Allergic Disorders","q":"A 33-year-old man develops severely itchy vesicular lesions at the sites of contact with a leather belt. Lesions are confined to the waistband area. Patch testing is positive for nickel. The most likely diagnosis is","o":[["A","Seborrheic dermatitis."],["B","Allergic contact dermatitis."],["C","Atopic dermatitis."],["D","Stasis dermatitis."],["E","Angioedema."]],"a":"B","sa":null,"pg":"72","f":[],"n":16,"e":["Vesicles confined to the belt buckle area with a positive nickel patch test prove allergic contact dermatitis to nickel. Seborrheic, atopic and stasis dermatitis have different distributions. Seb derm is greasy. Atopic is flexural. Stasis is legs. Angioedema is deep swelling.",""],"im":[]},{"id":"Q395","ch":"Allergic Disorders","q":"A 17-year-old female presents with a pruritic rash localized to the wrist. Papules and vesicles are noted in a band-like pattern, with slight oozing from some lesions. Which of the following is the most likely cause of the rash?","o":[["A","Stasis dermatitis."],["B","Herpes zoster."],["C","Atopic dermatitis."],["D","Seborrheic dermatitis."],["E","Contact dermatitis."]],"a":"E","sa":null,"pg":"72","f":[],"n":17,"e":["A band-like rash on the wrist suggests contact with a watch or bracelet: contact dermatitis. Herpes zoster is dermatomal and stasis dermatitis occurs in the legs. Stasis is legs. Zoster is dermatomal. Atopic is flexural. Seb derm is greasy.\nBand-like pattern = contact.",""],"im":[]},{"id":"Q396","ch":"Allergic Disorders","q":"A female patient, 21 years old, presented with a rash on the dorsa of both feet. Rash was severely itchy. (Clinical photo: erythematous eczematous rash on the dorsa of both feet at the sites of sandal straps.) What is the diagnosis of this case?","o":[["A","Irritant dermatitis."],["B","Papular urticaria."],["C","Stasis eczema."],["D","Neurodermatitis."],["E","Allergic dermatitis."]],"a":"E","sa":null,"pg":null,"f":[],"n":18,"e":["A rash at the area of contact with a shoe or ornament is allergic dermatitis, diagnosed by patch testing. Irritant needs exposure. Papular urticaria is bites. Stasis is leg. Neurodermatitis is chronic.\nContact allergen.",""],"im":[]},{"id":"Q397","ch":"Allergic Disorders","q":"Patch test is useful for diagnosis of","o":[["A","Atopic dermatitis."],["B","Stasis dermatitis."],["C","Urticaria."],["D","Irritant contact dermatitis."],["E","Allergic contact dermatitis."]],"a":"E","sa":null,"pg":null,"f":[],"n":19,"e":["Patch testing detects type IV hypersensitivity, so it is used for allergic contact dermatitis (not for urticaria or atopic dermatitis). Atopic is clinical. Stasis is clinical. Urticaria uses prick tests. Irritant has no patch test.\nPatch test = allergic contact.",""],"im":[]},{"id":"Q398","ch":"Allergic Disorders","q":"Acute oozing skin conditions are best treated by","o":[["A","Powders."],["B","Ointments."],["C","Creams."],["D","Drying lotions."],["E","Emulsions."]],"a":"D","sa":null,"pg":"75","f":[],"n":20,"e":["Weeping lesions are dried with drying antiseptic lotions (potassium permanganate, aluminum acetate). Ointments and creams would macerate the skin. Powders are for dry. Ointments macerate. Creams macerate. Emulsions are for subacute.\nWet lesions: lotions; chronic dry lesions: ointments.",""],"im":[]},{"id":"Q399","ch":"Allergic Disorders","q":"An acute eruption of intensely itchy papules or wheals is called","o":[["A","Acne vulgaris."],["B","Pityriasis rosea."],["C","Psoriasis."],["D","Urticaria."],["E","Scabies."]],"a":"D","sa":null,"pg":"77","f":[],"n":21,"e":["Urticaria is an itchy eruption of raised wheals appearing suddenly; it is acute if shorter than 6 weeks. Acne is not itchy. PR is scaly. Psoriasis is scaly. Scabies has burrows.\nWheals = urticaria.",""],"im":[]},{"id":"Q400","ch":"Allergic Disorders","q":"The primary lesion of urticaria is","o":[["A","Papule."],["B","Vesicle."],["C","Macule."],["D","Pustule."],["E","Wheal."]],"a":"E","sa":null,"pg":"77","f":[],"n":22,"e":["The wheal is a transient edematous elevation and is the primary lesion of urticaria. Papule is persistent. Vesicle is fluid. Macule is flat. Pustule is pus.",""],"im":[]},{"id":"Q401","ch":"Allergic Disorders","q":"The picture shows one of the primary lesions of the skin: a transient, edematous, erythematous or skin-colored elevation of the skin of variable sizes. (Clinical photo: erythematous edematous wheals.) This primary lesion is characteristic of","o":[["A","Psoriasis."],["B","Herpes simplex."],["C","Urticaria."],["D","Warts."],["E","Molluscum contagiosum."]],"a":"C","sa":null,"pg":"77","f":[],"n":23,"e":["The transient edematous plaque pictured is the wheal, characteristic of urticaria. Psoriasis is scaly. HSV is vesicular. Warts are rough. Molluscum is umbilicated.",""],"im":[]},{"id":"Q402","ch":"Allergic Disorders","q":"Scarring is NOT found in","o":[["A","Discoid lupus erythematosus."],["B","Favus."],["C","Acne vulgaris."],["D","Ecthyma."],["E","Urticaria."]],"a":"E","sa":null,"pg":"6","f":[],"n":24,"e":["Urticarial wheals are due to dermal edema that resolves without leaving a scar. Ecthyma, DLE and kerion can scar. DLE scars. Favus scars. Acne scars. Ecthyma scars.\nUrticaria: no scar.",""],"im":[]},{"id":"Q403","ch":"Allergic Disorders","q":"A male patient, 52 years old, presented with sudden appearance of a reddish rash on his back, both upper limbs and extended to the lower limbs. Rash was itchy. There was no fever. (Clinical photo: large erythematous edematous wheals on the back.) Diagnosis of this case is","o":[["A","Stevens-Johnson syndrome."],["B","Erythema multiforme."],["C","Angioedema."],["D","Urticaria."],["E","Fixed drug eruption."]],"a":"D","sa":null,"pg":"77","f":[],"n":25,"e":["A sudden itchy rash over the back and limbs without fever is urticaria; erythema multiforme gives target lesions and SJS gives mucosal erosions. SJS has mucosal erosions. EM has targets. Angioedema is deep. FDE is fixed.\nFleeting itchy wheals.",""],"im":[]},{"id":"Q404","ch":"Allergic Disorders","q":"Angioedema can be life threatening as it causes","o":[["A","Arrhythmias."],["B","Renal failure."],["C","Retinopathy."],["D","Myalgia."],["E","Laryngeal edema."]],"a":"E","sa":null,"pg":"77","f":[],"n":26,"e":["Angioedema involves the deep dermis and hypodermis and can involve the larynx, causing airway obstruction. Angioedema is deep dermal/subcutaneous swelling; the danger is airway obstruction from laryngeal edema, not this. Angioedema is deep dermal/subcutaneous swelling; the danger is airway obstruction from laryngeal edema, not this. Angioedema is deep dermal/subcutaneous swelling; the danger is airway obstruction from laryngeal edema, not this. Angioedema is deep dermal/subcutaneous swelling; the danger is airway obstruction from laryngeal edema, not this.",""],"im":[]},{"id":"Q405","ch":"Allergic Disorders","q":"Angioedema","o":[["A","Is an emergency condition."],["B","Is a severe form of eczema."],["C","Is treated by antibiotics."],["D","Acetylcholine is the mediator."],["E","Is due to lymphedema."]],"a":"A","sa":null,"pg":"77","f":[],"n":27,"e":["Because it may involve the larynx, angioedema is an emergency needing immediate treatment; it is not an eczema or lymphedema. It is not eczema. Antibiotics do not help. Acetylcholine is cholinergic. It is not lymphedema.",""],"im":[]},{"id":"Q406","ch":"Allergic Disorders","q":"The following type of urticaria may be life threatening","o":[["A","Papular urticaria."],["B","Cholinergic urticaria."],["C","Dermographism."],["D","Angioedema."],["E","None of the above."]],"a":"D","sa":null,"pg":"77","f":[],"n":28,"e":["Angioedema is the urticarial variant that can threaten life through laryngeal edema. Papular is bites. Cholinergic is mild. Dermographism is mild. Wrong: at least one listed statement is correct.",""],"im":[]},{"id":"Q407","ch":"Allergic Disorders","q":"Choose the correct answer","o":[["A","Lichen planus is caused by pox virus."],["B","The treatment of choice of discoid lupus erythematosus is PUVA."],["C","Herald patch is the primary lesion of urticaria."],["D","Angioedema could be life threatening."],["E","Alopecia areata is a form of cicatricial alopecia."]],"a":"D","sa":null,"pg":"77","f":[],"n":29,"e":["Angioedema could be life threatening due to laryngeal edema and respiratory obstruction. LP is not viral. DLE uses antimalarials. Herald is PR. AA is non-scarring.\nAirway.",""],"im":[]},{"id":"Q408","ch":"Allergic Disorders","q":"Histamine is the main mediator of","o":[["A","Contact dermatitis."],["B","Urticaria."],["C","Atopic dermatitis."],["D","Psoriasis."],["E","Discoid lupus erythematosus."]],"a":"B","sa":null,"pg":"77","f":[],"n":30,"e":["Histamine released from mast cells is the principal mediator of urticaria, with prostaglandins and leukotrienes. Contact is type IV. Atopic is IgE-related. Psoriasis is T-cell. DLE is autoimmune.",""],"im":[]},{"id":"Q409","ch":"Allergic Disorders","q":"Urticaria is","o":[["A","Type I hypersensitivity reaction."],["B","Type II hypersensitivity reaction."],["C","Type III hypersensitivity reaction."],["D","Type IV hypersensitivity reaction."],["E","None of the above."]],"a":"A","sa":null,"pg":"77","f":[],"n":31,"e":["Urticaria is a type I (IgE-mediated) hypersensitivity, although cholinergic types act through acetylcholine-stimulated mast cells. Type II is cytotoxic. Type III is immune complex. Type IV is delayed. Wrong: at least one listed statement is correct.\nType I; allergic contact is type IV.",""],"im":[]},{"id":"Q410","ch":"Allergic Disorders","q":"The primary effector cell in urticaria pathogenesis is the","o":[["A","Keratinocyte."],["B","Neutrophil."],["C","Mast cell."],["D","Melanocyte."],["E","Langerhans cell."]],"a":"C","sa":null,"pg":null,"f":[],"n":32,"e":["The mast cell is the primary effector cell: IgE bound to mast cells triggers degranulation on re-exposure. Keratinocytes are structural. Neutrophils are not primary. Melanocytes make pigment. Langerhans cells present antigen.",""],"im":[]},{"id":"Q411","ch":"Allergic Disorders","q":"Pathogenesis of urticaria is through","o":[["A","Vasoconstriction of blood vessels."],["B","Exaggerated cell-mediated immune response."],["C","Plasma cell activation."],["D","IgD-mediated allergic reaction."],["E","Increased capillary permeability."]],"a":"E","sa":null,"pg":"77","f":[],"n":33,"e":["Mediators such as histamine increase capillary permeability, producing dermal edema (wheal). Vasoconstriction is not involved. It is vasodilatation. It is not cell-mediated. Plasma cells are not involved. IgE, not IgD.\nPermeability ↑, vasodilatation.",""],"im":[]},{"id":"Q412","ch":"Allergic Disorders","q":"Which of the following is TRUE about urticaria?","o":[["A","In the ordinary type, the main mediator is acetylcholine."],["B","It involves skin and mucous membranes."],["C","Adrenaline is the treatment of the papular type."],["D","Wheal is caused by vasoconstriction."],["E","In cholinergic urticaria, the mediator is cholestyramine."]],"a":"B","sa":null,"pg":"77","f":[],"n":34,"e":["Urticaria can affect skin and mucous membranes (e.g. lips, oral mucosa). Adrenaline is for severe cases, not the papular type, and acetylcholine mediates only cholinergic urticaria. Histamine is the mediator. Adrenaline is for angioedema. It is vasodilatation. Cholestyramine is not the mediator.\nSkin + mucosa.",""],"im":[]},{"id":"Q413","ch":"Allergic Disorders","q":"Physical urticaria includes all of the following EXCEPT","o":[["A","Solar urticaria."],["B","Papular urticaria."],["C","Pressure urticaria."],["D","Heat urticaria."],["E","None of the above."]],"a":"B","sa":null,"pg":"78","f":[],"n":35,"e":["Physical urticaria (solar, cold, heat, aquagenic, dermographism, pressure) is provoked by physical stimuli. Papular urticaria is a hypersensitivity to insect bites. Physical. Physical. Physical. Wrong: at least one listed statement is correct.\nPapular urticaria ≠ physical.",""],"im":[]},{"id":"Q414","ch":"Allergic Disorders","q":"A 33-year-old female patient presented with erythematous, edematous, evanescent itchy lesions on her back of variable sizes. Patient stated that they always appear at sites of exposure to pressure on her skin. (Clinical photo: linear erythematous wheals on the back.) What is the diagnosis of this case?","o":[["A","Acute eczema."],["B","Erythema multiforme."],["C","Chronic spontaneous urticaria."],["D","Physical urticaria."],["E","Lichen planus."]],"a":"D","sa":null,"pg":"78","f":[],"n":36,"e":["Wheals induced by physical stimuli such as pressure, cold, heat, sun or water indicate physical (chronic inducible) urticaria. Eczema is scaly. EM has targets. Spontaneous has no trigger. LP is violaceous.\nPhysical trigger.",""],"im":[]},{"id":"Q415","ch":"Allergic Disorders","q":"Cholinergic urticaria is induced by which of the following precipitating factors","o":[["A","Foods as fish, milk, eggs or strawberries."],["B","Drugs as salicylates, antibiotics or NSAIDs."],["C","Blood elements."],["D","Insect bites."],["E","Sweating, physical effort, psychological stress or increased environmental temperature."]],"a":"E","sa":null,"pg":"79","f":[],"n":37,"e":["Cholinergic urticaria follows sweating from physical effort, emotional stress or heat; acetylcholine stimulates mast cells, giving 1-3 mm wheals lasting less than an hour. Foods cause ordinary urticaria. Drugs cause ordinary urticaria. Blood elements cause other types. Bites cause papular.\nSmall wheals with sweating.",""],"im":[]},{"id":"Q416","ch":"Allergic Disorders","q":"A 22-year-old woman developed small itchy wheals after physical exertion, walking in the sun, eating hot spicy food and when she was angry. The most likely diagnosis is","o":[["A","Chronic idiopathic urticaria."],["B","Heat urticaria."],["C","Solar urticaria."],["D","Cholinergic urticaria."],["E","Papular urticaria."]],"a":"D","sa":null,"pg":"79","f":[],"n":38,"e":["Small itchy wheals provoked by exertion, hot spicy food, sun and anger are cholinergic urticaria. Solar and heat urticaria are induced by sun or heat alone. Idiopathic has no trigger. Heat urticaria is local. Solar needs sun. Papular is bites.\nSweat-induced.",""],"im":[]},{"id":"Q417","ch":"Allergic Disorders","q":"The mainstay of treatment of urticaria is","o":[["A","Topical corticosteroids."],["B","Topical antihistamines."],["C","Oral antihistamines."],["D","Oral erythromycin."],["E","Emollients and moisturizers."]],"a":"C","sa":null,"pg":"79","f":[],"n":39,"e":["Systemic antihistamines are the mainstay; topical agents and erythromycin do not control wheals. Topical steroids do not help. Topical antihistamines are weak. Erythromycin is antibacterial. Emollients do not help.\nOral antihistamine.",""],"im":[]},{"id":"Q418","ch":"Allergic Disorders","q":"A 35-year-old woman develops an itchy rash over her back, legs, and trunk several hours after swimming in a lake. Erythematous edematous papules and plaques are noted. Lesions vary in size. There are no mucosal lesions and no swelling of the lips. What is best first step in management of her symptomatic rash?","o":[["A","Subcutaneous epinephrine."],["B","Intravenous glucocorticoids."],["C","Oral antihistamines."],["D","Aspirin."],["E","Doxycycline."]],"a":"C","sa":null,"pg":"79","f":[],"n":40,"e":["Urticaria after swimming (cold or water contact) is treated with oral antihistamines. Epinephrine is for emergencies. Steroids are for severe. Aspirin worsens. Doxycycline is antibacterial.\nH1 blocker.",""],"im":[]},{"id":"Q419","ch":"Allergic Disorders","q":"Systemic treatment of urticaria includes","o":[["A","Corticosteroids."],["B","Antihistamines."],["C","Adrenaline."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"79","f":[],"n":41,"e":["Systemic options are antihistamines (mainstay), corticosteroids for short courses, and adrenaline in emergencies, so all of the above.",""],"im":[]},{"id":"Q420","ch":"Allergic Disorders","q":"Which of the following is TRUE about urticaria?","o":[["A","It is treated by intravenous corticosteroids in severe cases."],["B","It is a type II hypersensitivity reaction."],["C","Acetylcholine is the mediator of the papular type."],["D","Cholinergic type may be caused by intestinal parasites."],["E","Intravenous adrenaline is life saving."]],"a":"A","sa":null,"pg":"79","f":[],"n":42,"e":["Severe urticaria and angioedema may need IV antihistamines and IV corticosteroids. It is type I. Acetylcholine is cholinergic. Parasites cause other types. Intravenous adrenaline is risky.\nIV steroids severe.",""],"im":[]},{"id":"Q421","ch":"Allergic Disorders","q":"SC adrenaline is life saving in patients suffering from","o":[["A","Angioedema."],["B","Papular urticaria."],["C","Aquagenic urticaria."],["D","Cholinergic urticaria."],["E","Solar urticaria."]],"a":"A","sa":null,"pg":null,"f":[],"n":43,"e":["Adrenaline (epinephrine) 300-500 mcg SC or IM is life-saving for angioedema involving the oropharynx or larynx, and anaphylaxis. Papular is mild. Aquagenic is mild. Cholinergic is mild. Solar is mild.",""],"im":[]},{"id":"Q422","ch":"Allergic Disorders","q":"The following therapy is a life-saving measure in laryngeal angioedema","o":[["A","IV adrenaline."],["B","SC adrenaline."],["C","IV corticosteroids."],["D","IM corticosteroids."],["E","Antihistamines."]],"a":"B","sa":null,"pg":null,"f":[],"n":44,"e":["In laryngeal angioedema SC (or IM) adrenaline rapidly reverses airway edema, while antihistamines alone are slower. IV adrenaline is risky. Steroids are slow. Steroids are slow. Antihistamines are slow.\nAdrenaline first.",""],"im":[]},{"id":"Q423","ch":"Allergic Disorders","q":"The following therapy is a life saving measure in acute urticaria","o":[["A","IV adrenaline."],["B","Topical corticosteroids."],["C","SC adrenaline."],["D","IM methotrexate."],["E","Oral antihistamines."]],"a":"C","sa":null,"pg":"79","f":["Key says SC adrenaline in acute urticaria; adrenaline is normally reserved for angioedema/anaphylaxis. Please verify."],"n":45,"e":["Per the book's key, SC adrenaline is the life-saving measure; strictly, adrenaline is reserved for angioedema/anaphylaxis, not routine acute urticaria. Flagged for your review. IV adrenaline is risky. Topicals do not help. Methotrexate is unrelated. Antihistamines are routine.\nAdrenaline for airway.",""],"im":[]},{"id":"Q424","ch":"Allergic Disorders","q":"A 25-year-old female presented with puffiness of both eyes and lips with difficulty in breathing. The following is a proper life-saving treatment for her","o":[["A","0.5 ml 1/100 adrenaline IV."],["B","0.5 ml 1/1000 adrenaline SC."],["C","1,000,000 IU penicillin IV."],["D","5 ml adrenaline 1/100 solution SC."],["E","Calamine lotion compresses on involved sites."]],"a":"B","sa":null,"pg":"79","f":[],"n":46,"e":["Eyelid and lip swelling with breathing difficulty is angioedema, an emergency; give adrenaline 0.5 ml of 1/1000 SC (300-500 mcg). IV and 1/100 is dangerous. Penicillin is unrelated. 5 ml of 1/100 is a lethal dose. Calamine is symptomatic.\nAdrenaline 0.5 ml 1/1000.",""],"im":[]},{"id":"Q425","ch":"Allergic Disorders","q":"All the following drugs may be used in treatment of angioedema except","o":[["A","Corticosteroids."],["B","Adrenaline."],["C","Hydroxyzine."],["D","Salicylate."],["E","Chlorpheniramine maleate."]],"a":"D","sa":null,"pg":"79","f":[],"n":47,"e":["Corticosteroids, adrenaline and antihistamines (hydroxyzine, chlorpheniramine) are used. Salicylates (aspirin) can actually trigger urticaria/angioedema. Corticosteroids are used in severe cases. Adrenaline is used for laryngeal edema. Hydroxyzine is a sedating antihistamine. Chlorpheniramine is an antihistamine.\nAvoid aspirin/NSAIDs.",""],"im":[]},{"id":"Q426","ch":"Allergic Disorders","q":"Cutaneous drug reactions may present with the following EXCEPT","o":[["A","Acneform eruption."],["B","Lichenoid eruption."],["C","Neuralgia."],["D","Bullous eruption."],["E","Erythroderma."]],"a":"C","sa":null,"pg":"80","f":[],"n":48,"e":["Drug eruptions may appear as exanthematous, urticarial, acneiform, lichenoid, bullous or erythrodermic reactions. Neuralgia is not a cutaneous reaction. Occurs. Occurs. Occurs. Occurs.\nNeuralgia not a rash.",""],"im":[]},{"id":"Q427","ch":"Allergic Disorders","q":"Drug eruptions may be","o":[["A","Eczematous."],["B","Acneiform."],["C","Pigmented."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"80","f":[],"n":49,"e":["Drugs can cause eczematous, acneiform and pigmented eruptions as well as urticarial and fixed reactions.\nMany patterns.",""],"im":[]},{"id":"Q428","ch":"Allergic Disorders","q":"Exanthematous drug reaction presents by","o":[["A","Papules on an erythematous background."],["B","Vesicles and bullae."],["C","Wheals."],["D","Pustules."],["E","Violaceous macules and patches."]],"a":"A","sa":null,"pg":"80","f":[],"n":50,"e":["Exanthematous reactions produce papules on an erythematous background that start proximally and generalize in 1-2 days, with marked pruritus. That is bullous. That is urticarial. That is pustular. That is FDE.\nMorbilliform.",""],"im":[]},{"id":"Q429","ch":"Allergic Disorders","q":"Acneform drug eruption is commonly caused by which of the following drug?","o":[["A","Analgesics."],["B","Corticosteroids."],["C","Tetracyclines."],["D","Penicillins."],["E","Erythromycin."]],"a":"B","sa":null,"pg":"81","f":[],"n":51,"e":["Corticosteroids and anti-epileptics cause acneiform eruptions, which lack comedones. Tetracyclines treat acne. Analgesics are not typical. Tetracyclines treat acne. Penicillins cause rash. Erythromycin treats acne.\nSteroid acne: no comedones.",""],"im":[]},{"id":"Q430","ch":"Allergic Disorders","q":"A 20-year-old male patient had fever and a sore throat for which he received sulphamethoxazole- trimethoprim. The next day, he developed a violaceous macule on his lip. The most probable diagnosis is","o":[["A","Herpes simplex."],["B","Lichen planus."],["C","Discoid lupus erythematosus."],["D","Fixed drug eruption."],["E","Impetigo."]],"a":"D","sa":null,"pg":"81","f":[],"n":52,"e":["A violaceous lip macule after sulfonamide (trimethoprim-sulfamethoxazole) is a fixed drug eruption, which characteristically involves the lips and genitalia. HSV is vesicular. LP is violaceous. DLE is scaly. Impetigo is crusted.\nLips + sulfa.",""],"im":[]},{"id":"Q431","ch":"Allergic Disorders","q":"27-year-old male develops a vesicobullous lesion on the glans soon after taking oral tetracycline. The lesion healed with hyperpigmentation. The diagnosis is","o":[["A","Herpes progenitalis."],["B","Fixed drug eruption."],["C","Genital warts."],["D","Genital molluscum."],["E","Chlamydia infection."]],"a":"B","sa":null,"pg":"81","f":[],"n":53,"e":["A vesiculobullous glans lesion after tetracycline that heals with hyperpigmentation is a fixed drug eruption, not herpes (which recurs without drug and with grouped vesicles). Herpes recurs without drug. Warts are rough. Molluscum is umbilicated. Chlamydia is not a rash.\nGenitals; leaves pigmentation.",""],"im":[]},{"id":"Q432","ch":"Allergic Disorders","q":"Fixed drug eruption is named so because it is","o":[["A","Fixed to site."],["B","Fixed to site and drug."],["C","Fixed to drug."],["D","Fixed to duration."],["E","Fixed to season."]],"a":"B","sa":null,"pg":"81","f":[],"n":54,"e":["It recurs at the same site each time the same (or related) drug is taken, so it is fixed to site and drug. It is also fixed to drug. It is also fixed to site. It is not time-bound. It is not seasonal.",""],"im":[]},{"id":"Q433","ch":"Allergic Disorders","q":"Fixed drug eruption is treated by","o":[["A","Topical corticosteroid."],["B","Topical terbinafine."],["C","Systemic acyclovir."],["D","Systemic cyclosporin."],["E","IVIGs."]],"a":"A","sa":null,"pg":"82","f":[],"n":55,"e":["Management is to stop the offending drug; potent topical corticosteroid and antihistamines relieve the lesion. Terbinafine is antifungal. Acyclovir is antiviral. Cyclosporin is excessive. IVIG is for TEN.\nStop the drug.",""],"im":[]},{"id":"Q434","ch":"Allergic Disorders","q":"Regarding drug reaction, which statement is not true?","o":[["A","Involve skin and mucous membrane."],["B","Corticosteroids are used to treat acneiform eruptions."],["C","Antihistaminics are used to treat urticarial eruptions."],["D","Blisters are seen in fixed eruptions."],["E","Exanthematous reactions cause pruritus."]],"a":"B","sa":null,"pg":"82","f":[],"n":56,"e":["Corticosteroids can themselves cause acneiform eruption, so they are not used to treat it; retinoids and antibiotics are. Drug reactions can involve skin and mucous membranes. Antihistamines relieve urticarial drug reactions. Fixed drug eruptions can blister. Exanthematous reactions are itchy.\nSteroids not for acneiform.",""],"im":[]},{"id":"Q435","ch":"Allergic Disorders","q":"The commonest viral infection involved in the etiology of erythema multiforme is","o":[["A","Human papilloma virus."],["B","Herpes simplex."],["C","Cytomegalovirus."],["D","Varicella Zoster virus."],["E","Epstein Barr virus."]],"a":"B","sa":null,"pg":"82","f":[],"n":57,"e":["Herpes simplex virus is the most common trigger of erythema multiforme, followed by drugs and other infections. HPV is not involved. CMV is not common. VZV is not common. EBV is not common.\nHSV.",""],"im":[]},{"id":"Q436","ch":"Allergic Disorders","q":"Target lesions are classic of","o":[["A","Atopic dermatitis."],["B","Seborrheic dermatitis."],["C","Erythema multiforme."],["D","Fixed drug eruption."],["E","Alopecia areata."]],"a":"C","sa":null,"pg":"82","f":[],"n":58,"e":["Target (iris) lesions are classic of erythema multiforme: three concentric zones, with a dark center, pink ring and red outer ring. Atopic is flexural. Seb derm is greasy. FDE is a patch. AA is smooth.\nTarget = EM.",""],"im":[]},{"id":"Q437","ch":"Allergic Disorders","q":"The most characteristic lesion of erythema multiforme is","o":[["A","Wheal."],["B","Burrow."],["C","Furrow."],["D","Herald patch."],["E","Iris lesion."]],"a":"E","sa":null,"pg":"82","f":[],"n":59,"e":["The iris (target) lesion is the characteristic lesion of EM and often involves oral mucosa. Wheal is urticaria. Burrow is scabies. Furrow is scabies. Herald is PR.",""],"im":[]},{"id":"Q546","ch":"Allergic Disorders","q":"Patch test is done to document:","o":[["A","Type I hypersensitivity."],["B","Delayed type hypersensitivity."],["C","Autoimmune disease."],["D","Immune complex deposition."],["E","Antigen antibody reaction."]],"a":"B","sa":null,"pg":"73","f":[],"n":60,"e":["A patch test documents delayed (type IV) hypersensitivity, as in allergic contact dermatitis, by applying suspected allergens under occlusion and reading at 48-72 hours. Type I hypersensitivity is tested with prick tests. Type I uses prick tests. Autoimmune needs serology. Immune complex needs biopsy. Antigen-antibody is type I-III.\nPatch test = type IV; prick test = type I.",""],"im":[]},{"id":"Q547","ch":"Allergic Disorders","q":"A 3-month infant presented with papules and vesicles with erythema, edema, oozing and crustations on face and neck. His mother reported positive family history of bronchial asthma. The most likely diagnosis is:","o":[["A","Stasis dermatitis."],["B","Psoriasis."],["C","Molluscum contagiosum."],["D","Atopic dermatitis."]],"a":"D","sa":null,"pg":"68","f":[],"n":61,"e":["An infant of 3 months with papules, vesicles, edema, oozing and crusting on the face and neck and a family history of asthma has infantile atopic dermatitis. Stasis dermatitis, psoriasis and molluscum do not fit. Stasis is legs. Psoriasis is silvery. Molluscum is umbilicated.\nInfantile atopic: face; family history of atopy.",""],"im":[]},{"id":"H232","ch":"Allergic Disorders","q":"Allergic contact dermatitis is which type of hypersensitivity reaction?","o":[["A","Type I."],["B","Type II."],["C","Type III."],["D","Type IV."],["E","Type V."]],"a":"D","sa":null,"pg":null,"f":[],"n":62,"e":["Allergic contact dermatitis is a delayed type IV (T-cell mediated) hypersensitivity, unlike urticaria (type I). Type I is immediate. Type II is cytotoxic. Type III is immune complex. Type V is not classic.",""],"im":[]},{"id":"H233","ch":"Allergic Disorders","q":"The primary lesion of urticaria is:","o":[["A","Papule."],["B","Vesicle."],["C","Macule."],["D","Pustule."],["E","Wheal."]],"a":"E","sa":null,"pg":null,"f":[],"n":63,"e":["Urticaria is characterized by wheals, which are transient edematous elevations. Papule is persistent. Vesicle is fluid. Macule is flat. Pustule is pus.",""],"im":[]},{"id":"H234","ch":"Allergic Disorders","q":"Mother complain that her infant has red rash and vesicles and papules in his face and he is very irritable and crying :","o":[["A","Atopic dermatitis"],["B","Discoid lupus erythematosus"]],"a":"A","sa":null,"pg":null,"f":[],"n":64,"e":["An irritable infant with facial red papulovesicular rash has infantile atopic dermatitis; discoid lupus does not occur like this. DLE is atrophic.\nInfant face.",""],"im":[]},{"id":"H236","ch":"Allergic Disorders","q":"Histamine is the main mediator of:","o":[["A","Atopic dermatitis"],["B","Contact dermatitis"],["C","Urticaria"],["D","Alopecia areata"],["E","Acne vulgaris"]],"a":"C","sa":null,"pg":null,"f":[],"n":65,"e":["Histamine is released by mast cells in urticaria; atopic eczema is IgE-related but histamine is the main urticaria mediator. Atopic is IgE-related. Contact is type IV. AA is autoimmune. Acne is follicular.",""],"im":[]},{"id":"H238","ch":"Allergic Disorders","q":"A female patient, 21 years old, presented with a rash on the dorsa of both feet. Rash was severely itchy. What is the diagnosis of this case?","o":[["A","Irritant dermatitis."],["B","Papular urticaria."],["C","Stasis eczema."],["D","Neurodermatitis."],["E","Allergic dermatitis."]],"a":"E","sa":null,"pg":null,"f":[],"n":66,"e":["A severely itchy rash on the foot dorsa is allergic contact dermatitis to footwear materials (rubber, chromate, glues). Irritant needs exposure. Papular urticaria is bites. Stasis is leg. Neurodermatitis is chronic.\nShoe allergy.",""],"im":[]},{"id":"H239","ch":"Allergic Disorders","q":"Allergic contact dermatitis (the rash in the previous question) is caused by: [image- based in the original bank]","o":[["A","Immediate tissue damage."],["B","Type I hypersensitivity reaction."],["C","Type IV hypersensitivity reaction."],["D","Immune complex reaction."],["E","Antigen-antibody reaction."]],"a":"C","sa":null,"pg":null,"f":["Image-based in the original bank; image not in the PDF text."],"n":67,"e":["Allergic contact dermatitis is a type IV (delayed, T-cell) hypersensitivity, not immediate or antigen-antibody mediated. Not immediate. Type I is immediate. Immune complex is type III. Antigen-antibody is type I-III.",""],"im":[]},{"id":"H241","ch":"Allergic Disorders","q":"The wheal is the characteristic primary lesion of: [image-based in the original bank]","o":[["A","Psoriasis."],["B","Herpes simplex."],["C","Urticaria."],["D","Warts."],["E","Molluscum contagiosum."]],"a":"C","sa":null,"pg":null,"f":["Image-based in the original bank; image not in the PDF text."],"n":68,"e":["The wheal is the characteristic lesion of urticaria; psoriasis, herpes simplex, warts and molluscum have other lesions. Psoriasis is scaly. HSV is vesicular. Warts are rough. Molluscum is umbilicated.\nWheal = urticaria.",""],"im":[]},{"id":"H242","ch":"Allergic Disorders","q":"A male patient, 52 years old, presented with sudden appearance of a reddish rash on his back, both upper limbs and extended to the lower limbs. Rash was itchy. There was no fever. Diagnosis of this case is:","o":[["A","Stevens-Johnson syndrome."],["B","Erythema multiforme."],["C","Angioedema."],["D","Urticaria."],["E","Fixed drug eruption."]],"a":"D","sa":null,"pg":null,"f":[],"n":69,"e":["A sudden widespread itchy erythematous rash on trunk and limbs without fever is urticaria. SJS has mucosal erosions. EM has targets. Angioedema is deep. FDE is fixed.\nNo fever.",""],"im":[]},{"id":"H245","ch":"Allergic Disorders","q":"Allergic contact dermatitis:","o":[["A","Is an immunological reaction."],["B","Occurs in any individual soon after exposure."],["C","Can be caused by acids or alkalis."],["D","Can occur due to cumulative damage by mild irritants."],["E","Occurs in compulsive washers."]],"a":"A","sa":null,"pg":null,"f":[],"n":70,"e":["Allergic contact dermatitis is an immunologic reaction in genetically susceptible people; irritant dermatitis is the one caused by acids, alkalis and cumulative mild irritants. It needs sensitization. That is irritant. That is irritant. That is irritant.\nImmune vs irritant.",""],"im":[]},{"id":"H254","ch":"Allergic Disorders","q":"Physical urticaria includes all of the following EXCEPT:","o":[["A","Solar urticaria."],["B","Papular urticaria."],["C","Pressure urticaria."],["D","Heat urticaria."],["E","None of the above."]],"a":"B","sa":null,"pg":null,"f":[],"n":71,"e":["Physical urticarias are solar, pressure, heat, cold and aquagenic types. Papular urticaria is an insect-bite hypersensitivity. Physical. Physical. Physical. Wrong: at least one listed statement is correct.\nPapular excluded.",""],"im":[]},{"id":"H256","ch":"Allergic Disorders","q":"The immunoglobulin which is usually elevated in atopics is:","o":[["A","Ig G."],["B","Ig M."],["C","Ig E."],["D","Ig D."],["E","All of the above."]],"a":"C","sa":null,"pg":null,"f":[],"n":72,"e":["IgE is typically elevated in atopic individuals (atopic dermatitis, asthma, rhinitis). IgG is not specific. IgM is not specific. IgD is not specific. Only IgE.",""],"im":[]},{"id":"H257","ch":"Allergic Disorders","q":"Mucous membrane affection may occur in all of the following EXCEPT:","o":[["A","Varicella."],["B","Papular urticaria."],["C","Lichen planus."],["D","Herpes simplex."],["E","DLE."]],"a":"B","sa":null,"pg":null,"f":[],"n":73,"e":["Mucous membranes may be involved in varicella, lichen planus, herpes simplex and DLE, but papular urticaria spares them. Occurs. Occurs. Occurs. Occurs.\nPapular urticaria: no mucosa.",""],"im":[]},{"id":"H265","ch":"Allergic Disorders","q":"A 17-year-old female presents with a pruritic rash localized to the wrist. Papules and vesicles are noted in a band-like pattern, with slight oozing from some lesions. Which of the following is the most likely cause of the rash?","o":[["A","Stasis dermatitis."],["B","Herpes zoster."],["C","Atopic dermatitis."],["D","Seborrheic dermatitis."],["E","Contact dermatitis."]],"a":"E","sa":null,"pg":null,"f":[],"n":74,"e":["Band-like papules and vesicles with oozing on the wrist indicate contact dermatitis to a watch or bracelet. Stasis is legs. Zoster is dermatomal. Atopic is flexural. Seb derm is greasy.",""],"im":[]},{"id":"H266","ch":"Allergic Disorders","q":"A 6-year-old child presented with groups of itchy papules involving the flexures & sides of the neck. The most probable diagnosis is:","o":[["A","Varicose eczema."],["B","Contact eczema."],["C","Atopic eczema."],["D","Stasis eczema."],["E","Seborrheic eczema."]],"a":"C","sa":null,"pg":null,"f":[],"n":75,"e":["Groups of itchy papules in the flexures and neck sides of a child are atopic eczema. Varicose is legs. Contact follows exposure. Stasis is legs. Seb derm is greasy.\nFlexural.",""],"im":[]},{"id":"H271","ch":"Allergic Disorders","q":"An asthmatic child with a severely itchy rash on both popliteal fossae and antecubital fossae. The patient suffered from insomnia in addition to irritability most of the day. The following is true about this disease:","o":[["A","Transmitted by direct contact."],["B","Family history is usually positive."],["C","Involves sebaceous glands activity."],["D","Heals with a scar."],["E","Treated by topical retinoids."]],"a":"B","sa":null,"pg":null,"f":[],"n":76,"e":["An asthmatic child with itchy flexural rash and sleep loss has atopic eczema; the family history of atopy is usually positive. It is not transmitted by contact and heals without scar. Atopic dermatitis is not contagious; it is an inherited atopic disease. Sebaceous activity matters in seborrheic dermatitis and acne; atopic dermatitis involves flexures and a defective skin barrier. It heals without scar. Retinoids treat acne and keratinization disorders; atopic dermatitis needs emollients, topical steroids or calcineurin inhibitors.\nAtopic triad.",""],"im":[]},{"id":"H279","ch":"Allergic Disorders","q":"Erythema multiforme may be precipitated by:","o":[["A","Herpes simplex infection."],["B","Drugs."],["C","Internal malignancy."],["D","Pregnancy."],["E","All of the above."]],"a":"E","sa":null,"pg":null,"f":[],"n":77,"e":["EM may be triggered by herpes simplex, drugs, internal malignancy and pregnancy, so all of the above.\nHSV most common.",""],"im":[]},{"id":"Q438","ch":"Melanocyte Disorders","q":"Absence of pigment in the skin is called","o":[["A","Alopecia areata."],["B","Vitiligo."],["C","Psoriasis."],["D","Discoid lupus erythematosus."],["E","Pityriasis rosea."]],"a":"B","sa":null,"pg":"85","f":[],"n":1,"e":["Vitiligo is an acquired depigmenting disorder: well-circumscribed milky-white macules/patches in which the pigment is completely lost. It is different from hypopigmentation, where some pigment remains. Alopecia areata is hair loss. Psoriasis is scaly. DLE is atrophic scarring. PR has herald patch.\nComplete loss of pigment = vitiligo.",""],"im":[]},{"id":"Q439","ch":"Melanocyte Disorders","q":"Complete absence of melanocytes will show as","o":[["A","Vitiligo."],["B","Post-inflammatory hypopigmentation."],["C","Pityriasis alba."],["D","Hypopigmented tinea versicolor."],["E","Hypopigmented nevus."]],"a":"A","sa":null,"pg":"85","f":[],"n":2,"e":["In vitiligo the cytotoxic T cells destroy melanocytes, so the lesion contains no melanocytes and appears chalk-white and accentuated under Wood's lamp. Melanocytes are present but less active. Pityriasis alba is partial loss. Versicolor is scaly. Nevus has melanocytes.",""],"im":[]},{"id":"Q440","ch":"Melanocyte Disorders","q":"Which of the following is TRUE about vitiligo?","o":[["A","It is an infectious disease characterized by loss of melanocytes."],["B","Milky white papule is the
