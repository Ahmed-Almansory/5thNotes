primary lesion."],["C","Focal type is transmitted by close contact."],["D","It is a disease of adults."],["E","In generalized type, white macules are scattered all over the body."]],"a":"E","sa":null,"pg":"87","f":[],"n":3,"e":["Generalized vitiligo (vulgaris) shows macules and patches distributed all over the body. It is not infectious or transmitted by contact, can start in childhood or adulthood, and the primary lesion is a macule or patch, not a papule. Vitiligo is non-infectious: it is autoimmune depigmentation. The lesion is a macule. Not contagious; focal means limited to one area for at least 2 years. It also occurs in children.\nVulgaris = scattered over the body.",""],"im":[]},{"id":"Q441","ch":"Melanocyte Disorders","q":"The primary lesion of vitiligo is a milky white","o":[["A","Plaque."],["B","Scaly patch."],["C","Wheal."],["D","Papule."],["E","Macule."]],"a":"E","sa":null,"pg":"85","f":[],"n":4,"e":["The primary lesion is a well-circumscribed milky-white macule (a patch if larger than 1 cm), often with convex borders and white hairs. It is not elevated. Vitiligo patches are smooth, milky white and non-scaly; scale suggests pityriasis versicolor or alba. A wheal is transient urticarial edema, not a depigmented lesion. A papule is raised; vitiligo lesions are flat (macules/patches).\nMacule/patch.",""],"im":[]},{"id":"Q442","ch":"Melanocyte Disorders","q":"The main complaint in vitiligo is","o":[["A","Itching."],["B","Pain."],["C","Discoloration."],["D","Loss of sensation."],["E","Burning sensation."]],"a":"C","sa":null,"pg":"85","f":[],"n":5,"e":["Vitiligo is asymptomatic: no itching, pain or burning. The complaint is the cosmetic discoloration and its psychological impact. It is asymptomatic. It is not painful. Sensation is normal. It does not burn.\nCosmetic complaint only.",""],"im":[]},{"id":"Q443","ch":"Melanocyte Disorders","q":"The main complaint in vitiligo is","o":[["A","Itching."],["B","Pain."],["C","Burning sensation."],["D","All of the above."],["E","None of the above."]],"a":"E","sa":null,"pg":"85","f":[],"n":6,"e":["Itching, pain and burning are not features of vitiligo (the key gives 'none of the above'); the only complaint is cosmetic discoloration. It is asymptomatic. It is not painful. It does not burn. Wrong: not all of the statements are correct.",""],"im":[]},{"id":"Q444","ch":"Melanocyte Disorders","q":"Pruritus is a cardinal symptom in all of the following EXCEPT","o":[["A","Scabies."],["B","Urticaria."],["C","Atopic dermatitis."],["D","Lichen planus."],["E","Vitiligo."]],"a":"E","sa":null,"pg":"85","f":[],"n":7,"e":["Pruritus is the cardinal symptom of scabies, eczema or lichen planus, but vitiligo is asymptomatic. Itchy. Itchy. Itchy. Itchy.\nVitiligo: no itch.",""],"im":[]},{"id":"Q445","ch":"Melanocyte Disorders","q":"As regards vitiligo, all of the following are false EXCEPT","o":[["A","Itching is a prominent symptom."],["B","It is not heritable."],["C","Scalp may be affected."],["D","Family history is positive in all cases."],["E","Milky white papules are seen."]],"a":"C","sa":null,"pg":"85","f":[],"n":8,"e":["Of the listed statements only 'scalp may be affected' is true. Vitiligo is not usually itchy and is partly heritable, it does not have milky papules, and family history is not positive in all cases. It is not itchy. Genetic predisposition is part of the pathogenesis, and many patients have affected relatives. Only some patients have a family history; predisposition does not mean every case is familial. The lesions are macules.\nScalp/white hairs can be involved.",""],"im":[]},{"id":"Q446","ch":"Melanocyte Disorders","q":"Vitiligo as an autoimmune disease may be associated with","o":[["A","Thyroid disease."],["B","Impetigo."],["C","Herpes zoster."],["D","Eczema."],["E","Pityriasis rosea."]],"a":"A","sa":null,"pg":"85","f":[],"n":9,"e":["Generalized vitiligo is autoimmune, so it is associated with autoimmune thyroid disease, alopecia areata, type 1 diabetes, myasthenia gravis, lupus and rheumatoid arthritis. Impetigo, zoster, eczema and pityriasis rosea are unrelated. Impetigo is unrelated. Zoster is unrelated. Eczema is not autoimmune. PR is unrelated.",""],"im":[]},{"id":"Q447","ch":"Melanocyte Disorders","q":"Vitiligo as an autoimmune disease may be associated with","o":[["A","Impetigo."],["B","Herpes zoster."],["C","Alopecia areata."],["D","Eczema."],["E","Pityriasis rosea."]],"a":"C","sa":null,"pg":"85","f":[],"n":10,"e":["Alopecia areata is another autoimmune disease associated with generalized vitiligo. Impetigo is unrelated. Zoster is unrelated. Eczema is not autoimmune. PR is unrelated.",""],"im":[]},{"id":"Q448","ch":"Melanocyte Disorders","q":"A male patient, 13 years old, presented with whitish patches involving his face, chest and both upper limbs. The condition started when he was four years old with a gradual onset and a progressive course. (Clinical photo: depigmented milky white patches on chest and arms.) What is the pathogenesis of vitiligo?","o":[["A","Congenital lack of pigmentation."],["B","Autoimmune destruction of melanocytes."],["C","Appearance of malformed melanocytes."],["D","Benign proliferation of melanocytes."],["E","Enlargement of melanocytes."]],"a":"B","sa":null,"pg":"86","f":[],"n":11,"e":["Cytotoxic T cells attack melanocytes in genetically predisposed patients, helped by oxidative stress; it is not fungal, viral or congenital. It is acquired. Melanocytes are absent. Vitiligo is destruction of melanocytes, not proliferation (proliferation suggests nevi or melanoma). They are absent, not enlarged.\nAutoimmune destruction of melanocytes.",""],"im":[]},{"id":"Q449","ch":"Melanocyte Disorders","q":"Vitiligo is caused by","o":[["A","Hyperproliferation of melanocytes."],["B","Excess melanin synthesis."],["C","Fungal infection."],["D","Autoimmune destruction of melanocytes."],["E","Viral infection."]],"a":"D","sa":null,"pg":"86","f":[],"n":12,"e":["Vitiligo results from autoimmune destruction of melanocytes, not overproduction or proliferation of them. Melanocytes are lost. Pigment is lost. Fungal infection causes pityriasis versicolor (fine-scaly macules), not vitiligo. No viral cause; vitiligo is autoimmune, with cytotoxic T cells destroying melanocytes.",""],"im":[]},{"id":"Q450","ch":"Melanocyte Disorders","q":"A male patient, 23 years old, presented with milky white patches involving both hands and feet. The condition started four years ago with a gradual onset and a progressive course. Which is true regarding this disorder?","o":[["A","Considered an autoimmune disease."],["B","Treated by antiandrogens."],["C","Benign proliferation of melanocytes."],["D","Affects adults only."],["E","It is contagious."]],"a":"A","sa":null,"pg":"86","f":[],"n":13,"e":["Vitiligo is considered an autoimmune disease; it is not contagious, not a benign proliferation of melanocytes and not treated by anti-androgens. Anti-androgens are not used. Melanocytes are lost. Children get it too. Vitiligo is autoimmune and not contagious.\nAutoimmune, non-infectious.",""],"im":[]},{"id":"Q451","ch":"Melanocyte Disorders","q":"In vitiligo, melanocytes are","o":[["A","Absent."],["B","Malformed."],["C","Non-functioning."],["D","Hyperactive."],["E","Enlarged."]],"a":"A","sa":null,"pg":"86","f":[],"n":14,"e":["Biopsy of a vitiligo patch shows complete absence of melanocytes, whereas in hypopigmentation they are present but less active. They are absent. They are absent. They are absent. They are absent.",""],"im":[]},{"id":"Q452","ch":"Melanocyte Disorders","q":"The damage in vitiligo is in","o":[["A","Keratinocytes."],["B","Langerhans cells."],["C","Melanocytes."],["D","Lymphocytes."],["E","Endothelial cells."]],"a":"C","sa":null,"pg":"86","f":[],"n":15,"e":["The target of the immune attack is the melanocyte (pigment cell), not the keratinocyte or Langerhans cell. Keratinocytes are intact. Langerhans cells are intact. Lymphocytes are the attackers. Endothelium is intact.\nMelanocytes.",""],"im":[]},{"id":"Q453","ch":"Melanocyte Disorders","q":"Types of vitiligo include all of the following EXCEPT","o":[["A","Papular."],["B","Unilateral."],["C","Generalized."],["D","Focal."],["E","Universal."]],"a":"A","sa":null,"pg":"86","f":[],"n":16,"e":["Clinical types are focal, segmental, mucosal, vulgaris, acrofacial and universal. There is no papular type, since the primary lesion is a macule. A type (segmental). A type. A type. A type.\nTypes: focal, segmental, mucosal, vulgaris, acrofacial, universal.",""],"im":[]},{"id":"Q454","ch":"Melanocyte Disorders","q":"Clinical types of vitiligo include","o":[["A","Focal type."],["B","Segmental type."],["C","Acrofacial vitiligo."],["D","Universal type."],["E","All of the above."]],"a":"E","sa":null,"pg":"86","f":[],"n":17,"e":["Clinical types include localized (focal, segmental, mucosal) and generalized (vulgaris, acrofacial, universal), so all of the above.\nLocalized vs generalized.",""],"im":[]},{"id":"Q455","ch":"Melanocyte Disorders","q":"What is the diagnosis? (Clinical photo: well-defined depigmented milky white patches on the trunk and arms.)","o":[["A","Hypopigmented tinea versicolor."],["B","Tuberculoid leprosy."],["C","Vitiligo."],["D","Disseminated eczema."],["E","Post-inflammatory hypopigmentation."]],"a":"C","sa":null,"pg":"85","f":[],"n":18,"e":["Well-defined depigmented milky-white patches on trunk and arms are vitiligo; pityriasis alba is hypopigmented with fine scale and versicolor is scaly. Versicolor is scaly. TT is anesthetic. Eczema is itchy. Post-inflammatory has history.\nChalk-white, no scale.",""],"im":[]},{"id":"Q456","ch":"Melanocyte Disorders","q":"The following may be used in the treatment of vitiligo","o":[["A","Radiotherapy."],["B","Electrocautery."],["C","Cryocautery."],["D","Phototherapy."],["E","Physiotherapy."]],"a":"D","sa":null,"pg":"89","f":[],"n":19,"e":["Phototherapy (narrow-band UVB, excimer light, PUVA) is the backbone of vitiligo treatment because it stimulates residual melanocytes. Radiotherapy has no role here; vitiligo is treated by stopping the autoimmune process and stimulating repigmentation (phototherapy, steroids, calcineurin inhibitors). Cautery is not used. Cryo is not used. Physiotherapy does not act on melanocyte autoimmunity; phototherapy is the backbone.\nPhototherapy backbone.",""],"im":[]},{"id":"Q457","ch":"Melanocyte Disorders","q":"A male patient, 33 years old, presented with white patches on his chest and both upper limbs. The condition started when he was 27 years old with a gradual onset and a progressive course. (Clinical photo: extensive depigmented white patches on the back.) Which of the following can be used in its treatment?","o":[["A","Radiotherapy."],["B","Systemic antibiotics."],["C","Topical retinoids."],["D","Narrowband UVB."],["E","Systemic antifungals."]],"a":"D","sa":null,"pg":"89","f":[],"n":20,"e":["Narrow-band UVB is the standard phototherapy for generalized vitiligo, which helps repigmentation. Radiotherapy has no role here; vitiligo is treated by stopping the autoimmune process and stimulating repigmentation (phototherapy, steroids, calcineurin inhibitors). Vitiligo is autoimmune, not bacterial, so antibiotics do nothing. Retinoids treat acne and keratinization disorders; they do not repigment vitiligo. Vitiligo is autoimmune, not fungal (do not confuse it with pityriasis versicolor), so antifungals do nothing.\nNB-UVB.",""],"im":[]},{"id":"Q458","ch":"Melanocyte Disorders","q":"One of the following is used in treatment of vitiligo","o":[["A","Radiotherapy."],["B","Topical calcineurin inhibitors."],["C","Systemic antibiotics."],["D","Systemic antifungals."]],"a":"B","sa":null,"pg":"89","f":[],"n":21,"e":["Topical calcineurin inhibitors (tacrolimus, pimecrolimus) stop the autoimmune process locally and are used especially on face and neck. Radiotherapy has no role here; vitiligo is treated by stopping the autoimmune process and stimulating repigmentation (phototherapy, steroids, calcineurin inhibitors). Vitiligo is autoimmune, not bacterial, so antibiotics do nothing. Vitiligo is autoimmune, not fungal (do not confuse it with pityriasis versicolor), so antifungals do nothing.",""],"im":[]},{"id":"Q459","ch":"Melanocyte Disorders","q":"The following drug could be used topically for treatment of vitiligo","o":[["A","Terbinafine."],["B","Azelaic acid 20%."],["C","Steroid."],["D","Crude coal tar."],["E","Permethrin lotion 5%."]],"a":"C","sa":null,"pg":"89","f":[],"n":22,"e":["Topical corticosteroids are used for stabilization and repigmentation in localized vitiligo. Terbinafine and permethrin are anti-infective agents. Terbinafine is antifungal. Azelaic acid is for acne. Coal tar is for psoriasis. Permethrin is for scabies.\nTopical steroids.",""],"im":[]},{"id":"Q460","ch":"Melanocyte Disorders","q":"Vitiligo in a patient with hepatic failure can be treated by","o":[["A","Topical psoralen with ultraviolet A."],["B","Topical steroids."],["C","Ultraviolet B."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"89","f":[],"n":23,"e":["In hepatic failure oral drugs are avoided, so topical PUVA, topical steroids or UVB can all be used, i.e. all of the above.\nTopical/light-based treatments.",""],"im":[]},{"id":"H335","ch":"Melanocyte Disorders","q":"The following may be used in the treatment of vitiligo:","o":[["A","Radiotherapy."],["B","Electrocautery."],["C","Cryocautery."],["D","Phototherapy."],["E","Physiotherapy."]],"a":"D","sa":null,"pg":null,"f":[],"n":24,"e":["Phototherapy (NB-UVB, PUVA, excimer) is the main treatment of vitiligo; radiotherapy, cautery and cryocautery are not used. Radiotherapy has no role here; vitiligo is treated by stopping the autoimmune process and stimulating repigmentation (phototherapy, steroids, calcineurin inhibitors). Cautery is not used. Cryo is not used. Physiotherapy does not act on melanocyte autoimmunity; phototherapy is the backbone.",""],"im":[]},{"id":"H336","ch":"Melanocyte Disorders","q":"In vitiligo, melanocytes are:","o":[["A","Absent."],["B","Malformed."],["C","Non-functioning."],["D","Hyperactive."],["E","None of the above."]],"a":"A","sa":null,"pg":null,"f":[],"n":25,"e":["Melanocytes are completely absent in vitiligo patches, not just malformed or non-functioning. They are absent. They are absent. They are absent. Wrong: at least one of the listed statements is correct.",""],"im":[]},{"id":"H340","ch":"Melanocyte Disorders","q":"Vitiligo may be confused with:","o":[["A","Pityriasis alba."],["B","Leprosy."],["C","Pityriasis versicolor."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":26,"e":["Vitiligo can be confused with pityriasis alba, leprosy (hypopigmented patches) and pityriasis versicolor; the history of total pigment loss and absent sensory loss helps.\nAll of the above.",""],"im":[]},{"id":"H341","ch":"Melanocyte Disorders","q":"Vitiligo is caused by:","o":[["A","Hyperproliferation of melanocytes."],["B","Excess melanin synthesis."],["C","Fungal infection."],["D","Autoimmune destruction of melanocytes."],["E","Viral infection."]],"a":"D","sa":null,"pg":null,"f":[],"n":27,"e":["Vitiligo results from autoimmune destruction of melanocytes by cytotoxic T cells. Melanocytes are lost. Pigment is lost. Fungal infection causes pityriasis versicolor (fine-scaly macules), not vitiligo. No viral cause; vitiligo is autoimmune, with cytotoxic T cells destroying melanocytes.",""],"im":[]},{"id":"H344","ch":"Melanocyte Disorders","q":"A male patient, 23 years old presented with milky white patches involving both hands and feet. The condition started four years ago with a gradual onset and a progressive course. which is true regarding this disorder?","o":[["A","Considered an autoimmune disease."],["B","Treated by antiandrogens."],["C","Benign proliferation of melanocytes."],["D","Affects adults only."],["E","It is contagious."]],"a":"A","sa":null,"pg":null,"f":[],"n":28,"e":["Milky-white patches on the hands and feet for years, progressive, indicate vitiligo, an autoimmune disease. It is not contagious, not treated with anti-androgens, and is not limited to adults. Anti-androgens are not used. Melanocytes are lost. Children get it too. Vitiligo is autoimmune and not contagious.\nAutoimmune, not contagious.",""],"im":[]},{"id":"H345","ch":"Melanocyte Disorders","q":"Which of the following can be used in treatment of vitiligo ?","o":[["A","Radiotherapy."],["B","Phototherapy."],["C","Systemic antibiotics."],["D","Systemic antifungals."],["E","Isotretinoin."]],"a":"B","sa":null,"pg":null,"f":[],"n":29,"e":["Phototherapy is a mainstay; antibiotics, antifungals, isotretinoin and radiotherapy have no role. Radiotherapy has no role here; vitiligo is treated by stopping the autoimmune process and stimulating repigmentation (phototherapy, steroids, calcineurin inhibitors). Vitiligo is autoimmune, not bacterial, so antibiotics do nothing. Vitiligo is autoimmune, not fungal (do not confuse it with pityriasis versicolor), so antifungals do nothing. Isotretinoin is for acne.",""],"im":[]},{"id":"H346","ch":"Melanocyte Disorders","q":"Vitiligo as an autoimmune disease may be associated with:","o":[["A","Impetigo."],["B","Herpes zoster."],["C","Alopecia areata."],["D","Eczema."],["E","Pityriasis rosea."]],"a":"C","sa":null,"pg":null,"f":[],"n":30,"e":["Alopecia areata is autoimmune and is associated with generalized vitiligo, along with thyroid disease and type 1 diabetes. Impetigo is unrelated. Zoster is unrelated. Eczema is not autoimmune. PR is unrelated.\nAutoimmune cluster.",""],"im":[]},{"id":"H350","ch":"Melanocyte Disorders","q":"As regards vitiligo all of the following is true:","o":[["A","Itching is a prominent symptom."],["B","It is not heritable."],["C","Scalp may be affected."],["D","Family history is positive in all cases."],["E","Milky white papules are seen."]],"a":"C","sa":null,"pg":null,"f":[],"n":31,"e":["Vitiligo can affect the scalp (with white hair patches). It is not itchy, is heritable, and the lesions are macules, not papules. It is not itchy. Genetic predisposition is part of the pathogenesis, and many patients have affected relatives. Only some patients have a family history; predisposition does not mean every case is familial. The lesions are macules.\nScalp involved.",""],"im":[]},{"id":"H351","ch":"Melanocyte Disorders","q":"Vitiligo may affect all of the following areas EXCEPT:","o":[["A","Oral mucosa."],["B","Scalp."],["C","Palm."],["D","Penis."],["E","Areola."]],"a":"A","sa":null,"pg":null,"f":["Key (oral mucosa) is questionable: the book describes mucosal vitiligo, so every listed site can be affected. Please verify."],"n":32,"e":["Per the key, oral mucosa is the exception; however, the book describes mucosal vitiligo, so this answer is questionable. Please verify against the source. The scalp can be affected. The palm can be affected. The penis can be affected. The areola can be affected.\nMucosal vitiligo exists.",""],"im":[]},{"id":"H352","ch":"Melanocyte Disorders","q":"A patient presented with well-circumscribed milky white patches involving both hands, feet, forearms and chest with a gradual onset and a progressive course. Which of the following can be used in treatment?","o":[["A","Antimalarials."],["B","Systemic antibiotics."],["C","Systemic antifungals."],["D","Isotretinoin."],["E","Phototherapy."]],"a":"E","sa":null,"pg":null,"f":[],"n":33,"e":["Well-circumscribed milky-white patches on hands, feet, forearms and chest, with gradual progression, are generalized vitiligo; phototherapy is used. Antimalarials are used in lupus and lichen planus, not vitiligo. Vitiligo is autoimmune, not bacterial, so antibiotics do nothing. Vitiligo is autoimmune, not fungal (do not confuse it with pityriasis versicolor), so antifungals do nothing. Isotretinoin is for acne.",""],"im":[]},{"id":"Q461","ch":"Hair Disorders","q":"Scarring alopecia may be caused by","o":[["A","Psoriasis."],["B","Seborrheic dermatitis."],["C","Fever."],["D","Lichen planus."],["E","Scaly tinea capitis."]],"a":"D","sa":null,"pg":"90","f":[],"n":1,"e":["Lichen planus of the scalp (lichen planopilaris) destroys follicles, leaving scarring alopecia, as do DLE, kerion and favus. Psoriasis is non-scarring. Seb derm is non-scarring. Fever causes shedding. Scaly ringworm is non-scarring.\nLP can scar.",""],"im":[]},{"id":"Q462","ch":"Hair Disorders","q":"Hair loss is permanent and irreversible in","o":[["A","Cicatricial alopecia."],["B","Androgenetic alopecia."],["C","Telogen effluvium."],["D","Anagen effluvium."],["E","Alopecia areata."]],"a":"A","sa":null,"pg":"90","f":[],"n":2,"e":["In cicatricial alopecia the follicle is destroyed and replaced by scar tissue, so hair loss is permanent. Non-scarring types (androgenetic alopecia, telogen/anagen effluvium, alopecia areata) are reversible, at least in principle. AGA is non-scarring. TE is reversible. Anagen effluvium is reversible. AA can regrow.\nScar = permanent.",""],"im":[]},{"id":"Q463","ch":"Hair Disorders","q":"Cicatricial alopecia occurs in the following disease","o":[["A","Tinea circinata."],["B","Psoriasis vulgaris."],["C","Systemic lupus erythematosus."],["D","Scaly ringworm."],["E","Favus."]],"a":"E","sa":null,"pg":"90","f":[],"n":3,"e":["Favus (yellow scutula) of the scalp causes cicatricial alopecia. Scaly ringworm and black-dot types usually heal without scar. Circinata is on the body. Psoriasis is non-scarring. SLE is typically non-scarring. Scaly ringworm is non-scarring.\nFavus and kerion scar.",""],"im":[]},{"id":"Q464","ch":"Hair Disorders","q":"Cicatricial alopecia occurs in the following disease","o":[["A","Tinea circinata."],["B","Psoriasis vulgaris."],["C","Acne vulgaris."],["D","Systemic lupus erythematosus."],["E","Discoid lupus erythematosus."]],"a":"E","sa":null,"pg":"90","f":[],"n":4,"e":["DLE affecting the scalp ends in permanent cicatricial alopecia, so it appears among scarring causes. Circinata is on the body. Psoriasis is non-scarring. Acne scars the face, not the scalp. SLE is typically non-scarring.\nDLE scars.",""],"im":[]},{"id":"Q465","ch":"Hair Disorders","q":"The following disease can cause cicatricial hair loss","o":[["A","Telogen effluvium."],["B","Discoid lupus erythematosus."],["C","Psoriasis."],["D","Seborrheic dermatitis."],["E","Pityriasis rosea."]],"a":"B","sa":null,"pg":"90","f":[],"n":5,"e":["DLE is a collagen disease that destroys follicles and causes permanent hair loss; telogen effluvium, psoriasis and seborrheic dermatitis do not. TE is reversible. Psoriasis is non-scarring. Seb derm is non-scarring. PR is not scalp.\nDLE scars.",""],"im":[]},{"id":"Q467","ch":"Hair Disorders","q":"Cicatricial alopecia may be caused by","o":[["A","Warts."],["B","Vitiligo."],["C","Psoriasis."],["D","Burn."],["E","Alopecia areata."]],"a":"D","sa":null,"pg":"90","f":[],"n":6,"e":["Burns destroy the follicles directly, a physical cause of cicatricial alopecia, whereas warts, vitiligo, psoriasis and alopecia areata spare them. Warts are not destructive. Vitiligo is pigment. Psoriasis is non-scarring. AA is non-scarring.",""],"im":[]},{"id":"Q468","ch":"Hair Disorders","q":"Scarring alopecia may be due to","o":[["A","Discoid LE."],["B","Lichen planus."],["C","Favus."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"90","f":[],"n":7,"e":["Scarring alopecia arises from trauma, burns, fungal infections (kerion, favus), zoster, DLE and lichen planus, so all of the above.\nMany causes.",""],"im":[]},{"id":"Q469","ch":"Hair Disorders","q":"Cicatricial alopecia is caused by all of the following diseases EXCEPT","o":[["A","Lichen planus."],["B","Trauma."],["C","Favus."],["D","Systemic lupus erythematosus."],["E","Kerion."]],"a":"D","sa":null,"pg":"90","f":[],"n":8,"e":["DLE, lichen planus, trauma, favus and kerion scar the scalp. The key lists SLE as the exception because it usually causes non-scarring diffuse hair loss. It scars. It scars. It scars. It scars.\nDLE ≠ SLE.",""],"im":[]},{"id":"Q470","ch":"Hair Disorders","q":"The following skin diseases may cause cicatricial alopecia EXCEPT","o":[["A","Discoid LE."],["B","Lichen planus."],["C","Favus."],["D","Alopecia areata."],["E","Kerion."]],"a":"D","sa":null,"pg":"90","f":[],"n":9,"e":["Alopecia areata attacks anagen follicles without destroying them, so it is non-scarring; the other diseases listed can scar. It scars. It scars. It scars. It scars.\nAA non-scarring.",""],"im":[]},{"id":"Q471","ch":"Hair Disorders","q":"Which of the following conditions causes non-cicatricial alopecia?","o":[["A","Discoid lupus."],["B","Herpes zoster."],["C","Alopecia areata."],["D","Lichen planus."],["E","Burn."]],"a":"C","sa":null,"pg":"93","f":[],"n":10,"e":["Alopecia areata, an immune attack on anagen follicles in a patch of otherwise normal skin, is non-cicatricial. DLE, zoster, lichen planus and burns scar. DLE scars. Zoster can scar. LP scars. Burn scars.\nAA = non-scarring.",""],"im":[]},{"id":"Q472","ch":"Hair Disorders","q":"Which of the following diseases can cause non-cicatricial alopecia?","o":[["A","Herpes zoster."],["B","Telogen effluvium."],["C","Favus."],["D","Basal cell carcinoma."],["E","Mechanical trauma."]],"a":"B","sa":null,"pg":"92","f":[],"n":11,"e":["Telogen effluvium (premature shift to telogen) causes diffuse reversible shedding without follicle destruction. Zoster can scar. Favus scars. BCC destroys follicles. Trauma can scar.",""],"im":[]},{"id":"Q473","ch":"Hair Disorders","q":"A female patient, 36 years old, presented with hair loss of 5 years duration with a gradual onset and a progressive course. She also complained of skin lesions on the face and ears that, on examination, were well-defined erythematous plaques covered with adherent scales as well as telangiectasia. (Clinical photo: scalp with scarring alopecia and atrophic depigmented and hyperpigmented patches.) This patient is presenting with","o":[["A","Androgenetic alopecia."],["B","Telogen effluvium."],["C","Anagen effluvium."],["D","Cicatricial alopecia."],["E","Alopecia areata."]],"a":"D","sa":null,"pg":"90","f":[],"n":12,"e":["Smooth shiny scalp patches without follicle openings indicate cicatricial alopecia, where follicles are destroyed. AGA is non-scarring. TE is reversible. Anagen effluvium is acute. AA is non-scarring.\nNo follicular openings.",""],"im":[]},{"id":"Q474","ch":"Hair Disorders","q":"A female patient, 36 years old, presented with hair loss of 5 years duration with a gradual onset and a progressive course. She also complained of skin lesions on the face and ears that, on examination, were well-defined erythematous plaques covered with adherent scales as well as telangiectasia. (Clinical photo: scalp with scarring alopecia and atrophic depigmented and hyperpigmented patches.) What is the cause of this condition?","o":[["A","Toxicity of anagen hairs."],["B","Lymphocyte infiltrates around hair follicles."],["C","Activity of 5-alpha reductase enzyme in hair follicles."],["D","Destruction of hair follicles."],["E","Premature transformation of hair follicles into telogen phase."]],"a":"D","sa":null,"pg":"90","f":[],"n":13,"e":["In cicatricial alopecia the follicles themselves are destroyed (by inflammation, trauma or infection) and replaced by fibrous tissue. That is anagen effluvium. That is AA. That is AGA. That is TE.\nFollicle destruction.",""],"im":[]},{"id":"Q475","ch":"Hair Disorders","q":"A male patient, 27 years old, presented with hair loss of five-year duration with a gradual onset and a progressive course. It began by frontal and bitemporal recession, and then it involved the vertex. (Clinical photo: male scalp with frontal/bitemporal recession and vertex thinning.) This patient is presenting with","o":[["A","Telogen effluvium."],["B","Anagen effluvium."],["C","Androgenetic alopecia."],["D","Cicatricial alopecia."],["E","Alopecia areata."]],"a":"C","sa":null,"pg":"91","f":[],"n":14,"e":["Hair thinning in a characteristic pattern (frontal and bitemporal recession then vertex in males) is androgenetic alopecia. TE is diffuse. Anagen effluvium is acute. Scarring is localized. AA is patchy.\nAGA pattern.",""],"im":[]},{"id":"Q476","ch":"Hair Disorders","q":"A male patient, 27 years old, presented with hair loss of five-year duration with a gradual onset and a progressive course. It began by frontal and bitemporal recession, and then it involved the vertex. (Clinical photo: male scalp with frontal/bitemporal recession and vertex thinning.) Which is true regarding this disease?","o":[["A","Treated by systemic corticosteroids."],["B","Affects males only."],["C","Pathology involves melanocytes."],["D","Caused by accentuated 5-alpha reductase activity in hair follicles."],["E","Contagious."]],"a":"D","sa":null,"pg":"91","f":[],"n":15,"e":["In androgenetic alopecia 5-alpha reductase activity increases in susceptible follicles, converting testosterone to the more potent DHT, which miniaturizes follicles. It is not treated by corticosteroids, not melanocyte-related and not contagious; it also occurs in females. Steroids do not treat AGA. Females are affected. Melanocytes are the target in vitiligo; hair-loss pathology here is in the follicle. Not contagious.\n5-alpha reductase → DHT.",""],"im":[]},{"id":"Q477","ch":"Hair Disorders","q":"Which of the following is TRUE about androgenetic alopecia?","o":[["A","It is a genetically determined cicatricial type of alopecia."],["B","Oral antiandrogens are used for treatment of male androgenetic alopecia."],["C","Minoxidil 2% is used in treatment of male (not female) androgenetic alopecia."],["D","Finasteride is contraindicated in male androgenetic alopecia."],["E","It is due to increased activity of 5-alpha reductase in target follicles."]],"a":"E","sa":null,"pg":"91","f":[],"n":16,"e":["AGA is genetically determined and non-cicatricial, caused by increased 5-alpha reductase activity in target follicles. AGA is non-scarring. Antiandrogens feminize males. Minoxidil is used in both sexes. Finasteride is used.",""],"im":[]},{"id":"Q478","ch":"Hair Disorders","q":"Diffuse hair loss involving the vertex of the scalp with maintenance of the frontal hairline is","o":[["A","Alopecia areata."],["B","Anagen effluvium."],["C","Male pattern baldness."],["D","Female pattern baldness."],["E","Telogen effluvium."]],"a":"D","sa":null,"pg":"91","f":[],"n":17,"e":["Female pattern hair loss involves the vertex with preservation of the frontal hairline; in males it begins with frontal and bitemporal recession. AA is patchy. Anagen effluvium is acute. Male is frontal and bitemporal. TE is diffuse.\nFemale: vertex with intact frontal line.",""],"im":[]},{"id":"Q479","ch":"Hair Disorders","q":"Androgenetic alopecia in males can be treated by","o":[["A","Estrogens."],["B","Cyproterone acetate."],["C","Spironolactone."],["D","Topical minoxidil."],["E","Corticosteroids."]],"a":"D","sa":null,"pg":"92","f":[],"n":18,"e":["Topical minoxidil 2-5% and 5-alpha reductase inhibitors (finasteride) are used in males; antiandrogens and estrogens are not. Estrogens feminize. Cyproterone feminizes. Spironolactone feminizes. Steroids do not help.\nMinoxidil, finasteride.",""],"im":[]},{"id":"Q480","ch":"Hair Disorders","q":"Androgenetic alopecia can be treated by all of the following EXCEPT","o":[["A","Finasteride."],["B","Cyproterone acetate."],["C","Spironolactone."],["D","Topical minoxidil."],["E","Corticosteroids."]],"a":"E","sa":null,"pg":"92","f":[],"n":19,"e":["AGA is treated with minoxidil, finasteride, spironolactone (females) and transplantation. Corticosteroids have no role. Finasteride is a 5-alpha reductase inhibitor. Cyproterone acetate is an antiandrogen. Spironolactone has antiandrogen action. Topical minoxidil prolongs anagen.\nNo steroids.",""],"im":[]},{"id":"Q481","ch":"Hair Disorders","q":"Telogen effluvium is","o":[["A","A type of cicatricial alopecia."],["B","Diffuse hair loss."],["C","Alopecia totalis."],["D","Alopecia universalis."],["E","Ophiasis."]],"a":"B","sa":null,"pg":null,"f":[],"n":20,"e":["Telogen effluvium is a diffuse increase in hair shedding after follicles prematurely enter telogen, not a scarring alopecia. It is non-scarring. Totalis is total scalp. Universalis is total body. Ophiasis is marginal.",""],"im":[]},{"id":"Q482","ch":"Hair Disorders","q":"A female patient presents with diffuse alopecia. She had suffered from typhoid fever 4 months back. The most probable diagnosis is","o":[["A","Androgenetic alopecia."],["B","Telogen effluvium."],["C","Anagen effluvium."],["D","Alopecia areata."],["E","Trichotillomania."]],"a":"B","sa":null,"pg":"92","f":[],"n":21,"e":["Diffuse alopecia appearing about 3-4 months after typhoid fever is telogen effluvium after a stressful (febrile) illness. AGA is gradual. Anagen effluvium follows toxins. AA is patchy. Trichotillomania is self-pulling.\n3-4 months after the trigger.",""],"im":[]},{"id":"Q483","ch":"Hair Disorders","q":"A woman reports diffuse hair shedding three months after childbirth with a normal scalp. The diagnosis is","o":[["A","Telogen effluvium."],["B","Alopecia areata."],["C","Androgenetic alopecia."],["D","Ophiasis."],["E","Anagen effluvium."]],"a":"A","sa":null,"pg":"93","f":[],"n":22,"e":["Postpartum diffuse shedding with a normal scalp 3 months after childbirth is classic telogen effluvium. AA is patchy. AGA is gradual. Ophiasis is marginal. Anagen effluvium follows toxins.",""],"im":[]},{"id":"Q484","ch":"Hair Disorders","q":"Anagen effluvium is caused by","o":[["A","High fever."],["B","Surgical interventions."],["C","General anesthesia."],["D","Weight loss."],["E","Cytotoxic chemotherapy."]],"a":"E","sa":null,"pg":"93","f":[],"n":23,"e":["Cytotoxic chemotherapy, heavy metals, radiation and drugs like methotrexate poison actively growing anagen follicles, causing anagen effluvium. Fever and surgery cause telogen effluvium. Fever causes telogen effluvium. Surgery causes telogen effluvium. Anesthesia causes telogen effluvium. Weight loss causes telogen effluvium.\nChemo = anagen effluvium.",""],"im":[]},{"id":"Q485","ch":"Hair Disorders","q":"A 17-year-old male presents with alopecia of gradual onset and progressive course 3 months after starting chemotherapy for lymphoma. The diagnosis is","o":[["A","Androgenetic alopecia."],["B","Telogen effluvium."],["C","Anagen effluvium."],["D","Alopecia areata."],["E","Cicatricial alopecia."]],"a":"C","sa":null,"pg":"93","f":[],"n":24,"e":["Hair loss after starting chemotherapy is anagen effluvium due to toxicity to active anagen roots. AGA is gradual. TE is later. AA is patchy. It is non-scarring.",""],"im":[]},{"id":"Q486","ch":"Hair Disorders","q":"A patient presented with hair loss of gradual onset and a rapidly progressive course, which started after receiving 2 chemotherapy sessions for lymphoma. (Clinical photo: scalp with diffuse sparse hair.) What is the cause of this disease?","o":[["A","Toxicity of anagen hairs."],["B","Lymphocyte infiltrates around hair follicles."],["C","Activity of 5-alpha reductase enzyme in hair follicles."],["D","Destruction of hair follicles."],["E","Premature transformation of hair follicles into telogen phase."]],"a":"A","sa":null,"pg":"93","f":[],"n":25,"e":["Anagen effluvium is caused by toxic injury to actively growing anagen follicles, e.g. chemotherapy, heavy metals and radiation. That is AA. That is AGA. That is scarring. That is TE.",""],"im":[]},{"id":"Q487","ch":"Hair Disorders","q":"Which of the following is considered an autoimmune disease?","o":[["A","Scaly ringworm."],["B","Androgenetic alopecia."],["C","Alopecia areata."],["D","Favus."],["E","Kerion."]],"a":"C","sa":null,"pg":"93","f":[],"n":26,"e":["Alopecia areata is an autoimmune disease against anagen follicles. Androgenetic alopecia is hormonal and fungal infections (kerion, favus, scaly ringworm) are infectious. Fungal. Hormonal. Fungal. Fungal.\nAA autoimmune.",""],"im":[]},{"id":"Q488","ch":"Hair Disorders","q":"A male patient, 27 years old, presented with several circumscribed areas of hair loss of one-year duration. He received several topical treatments to which he initially responded, but hair loss started again once he stopped treatment. On examination, scalp skin was completely normal with no scales or erythema. (Clinical photo: scalp with multiple well-circumscribed smooth patches of hair loss.) This patient is presenting with","o":[["A","Androgenetic alopecia."],["B","Telogen effluvium."],["C","Anagen effluvium."],["D","Cicatricial alopecia."],["E","Alopecia areata."]],"a":"E","sa":null,"pg":"93","f":[],"n":27,"e":["Circumscribed round patches of hair loss in normal-looking skin are alopecia areata. AGA is patterned. TE is diffuse. Anagen effluvium is toxic. Scarring is atrophic.\nPatches, smooth.",""],"im":[]},{"id":"Q489","ch":"Hair Disorders","q":"A male patient, 27 years old, presented with several circumscribed areas of hair loss of one-year duration. He received several topical treatments to which he initially responded, but hair loss started again once he stopped treatment. On examination, scalp skin was completely normal with no scales or erythema. (Clinical photo: scalp with multiple well-circumscribed smooth patches of hair loss.) Which is true regarding this disease?","o":[["A","Considered an autoimmune disease."],["B","Treated by antiandrogens."],["C","Pathology involves melanocytes."],["D","Affects adults only."],["E","Contagious."]],"a":"A","sa":null,"pg":null,"f":[],"n":28,"e":["Alopecia areata is autoimmune, associated with thyroid disease, atopy and SLE; 10-20% have a family history. Antiandrogens treat androgenetic alopecia; alopecia areata is autoimmune. Melanocytes are the target in vitiligo; hair-loss pathology here is in the follicle. It affects all ages. Not contagious.",""],"im":[]},{"id":"Q490","ch":"Hair Disorders","q":"Patchy, asymptomatic, non-scarring, sudden complete loss of hair in circumscribed areas of the scalp is called","o":[["A","Androgenetic alopecia."],["B","Telogen effluvium."],["C","Alopecia totalis."],["D","Alopecia areata."],["E","Anagen effluvium."]],"a":"D","sa":null,"pg":"94","f":[],"n":29,"e":["Patchy, sudden, asymptomatic, non-scarring hair loss in circumscribed areas is alopecia areata, an autoimmune disease. AGA is gradual. TE is diffuse. Totalis is total. Anagen effluvium is toxic.\nSudden non-scarring patches.",""],"im":[]},{"id":"Q491","ch":"Hair Disorders","q":"A 7-year-old female child presented with a circumscribed area of hair loss on the scalp. On examination, the skin of the affected area was normal. The diagnosis is","o":[["A","Cicatricial alopecia."],["B","Tinea capitis."],["C","Alopecia areata."],["D","Lichen planus."],["E","Discoid lupus erythematosus."]],"a":"C","sa":null,"pg":"93","f":[],"n":30,"e":["A well-demarcated patch of hair loss on normal smooth scalp in a child, with exclamation-mark hairs at its margin, is alopecia areata; tinea capitis has scales and broken hairs. The skin is normal. Tinea has scales. LP is scarring. DLE is scarring.\nNo scales.",""],"im":[]},{"id":"Q493","ch":"Hair Disorders","q":"Clinical types of alopecia areata include all of the following EXCEPT","o":[["A","Patchy type."],["B","Marginal type."],["C","Mucocutaneous type."],["D","Alopecia totalis."],["E","Alopecia universalis."]],"a":"C","sa":null,"pg":"94","f":[],"n":31,"e":["Types are patchy, ophiasis, totalis and universalis; there is no mucocutaneous type. Patchy: one or more round bald patches. Marginal (ophiasis): loss along the scalp margins. Totalis: total scalp hair loss. Universalis: loss of all body hair.",""],"im":[]},{"id":"Q494","ch":"Hair Disorders","q":"In ophiasis","o":[["A","Hair loss occurs along the margins of the scalp."],["B","Total scalp hair loss occurs."],["C","Cicatricial alopecia is a complication."],["D","Total body hair loss occurs."],["E","A localized area of hair loss is present."]],"a":"A","sa":null,"pg":"94","f":[],"n":32,"e":["In ophiasis hair loss occurs along the scalp margins (temporal and occipital); it is usually resistant to therapy. That is totalis. It is non-scarring. That is universalis. That is patchy.",""],"im":[]},{"id":"Q495","ch":"Hair Disorders","q":"Marginal alopecia of the scalp is called","o":[["A","Alopecia totalis."],["B","Alopecia universalis."],["C","Ophiasis."],["D","Telogen effluvium."]],"a":"C","sa":null,"pg":"94","f":[],"n":33,"e":["Ophiasis is alopecia areata along the scalp margins. Totalis is total scalp. Universalis is total body. TE is diffuse.",""],"im":[]},{"id":"Q496","ch":"Hair Disorders","q":"Alopecia areata along the scalp margins is named ___ and it is ___ (regarding response to treatment).","o":[],"a":null,"sa":"Ophiasis; usually resistant to therapy","pg":null,"f":[],"n":34,"e":["Ophiasis is a band-like loss along the scalp margins and usually resists treatment.\nPoor response.",""],"im":[]},{"id":"Q497","ch":"Hair Disorders","q":"Alopecia totalis is","o":[["A","Localised loss of hair."],["B","Loss of the scalp and body hair."],["C","Loss of frontal scalp hair."],["D","Loss of all scalp hair."],["E","None of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":35,"e":["Alopecia totalis is loss of all scalp hair; loss of all body hair is alopecia universalis. That is patchy. That is universalis. That is not totalis. Wrong: at least one listed statement is correct.\nTotalis = scalp; universalis = body.",""],"im":[]},{"id":"Q498","ch":"Hair Disorders","q":"Alopecia areata may be treated by","o":[["A","Corticosteroids."],["B","Spironolactone."],["C","Estrogens."],["D","Androgens."],["E","Cyproterone acetate."]],"a":"A","sa":null,"pg":"95","f":[],"n":36,"e":["Topical or intralesional corticosteroids are the first treatment for alopecia areata, with calcineurin inhibitors, minoxidil, PUVA and irritants. Spironolactone is antiandrogen. Estrogens are not used. Androgens worsen. Cyproterone is antiandrogen.",""],"im":[]},{"id":"Q499","ch":"Hair Disorders","q":"Alopecia areata may be treated by","o":[["A","Corticosteroids."],["B","Tincture iodine."],["C","PUVA."],["D","Minoxidil."],["E","All of the above."]],"a":"E","sa":null,"pg":"95","f":[],"n":37,"e":["Alopecia areata responds to corticosteroids, irritants like tincture iodine, PUVA and minoxidil, so all of the above.\nSeveral options.",""],"im":[]},{"id":"Q500","ch":"Hair Disorders","q":"Systemic corticosteroids are used to treat","o":[["A","Androgenetic alopecia."],["B","Alopecia areata."],["C","Psoriasis."],["D","Warts."],["E","Molluscum contagiosum."]],"a":"B","sa":null,"pg":"95","f":[],"n":38,"e":["Systemic corticosteroids are used in resistant or extensive alopecia areata (ophiasis, totalis, universalis). AGA is hormonal. Psoriasis uses MTX. Warts are destroyed. Molluscum is destroyed.\nSystemic steroids in extensive AA.",""],"im":[]},{"id":"H292","ch":"Hair Disorders","q":"The following may be observed in alopecia areata:","o":[["A","Itching."],["B","Comedones."],["C","Vesicles."],["D","Adherent scales."],["E","Exclamation mark hairs."]],"a":"E","sa":null,"pg":null,"f":[],"n":39,"e":["Exclamation-mark hairs, short broken hairs tapering toward the scalp, are seen at the border of alopecia areata patches. Itching, comedones, vesicles and adherent scales are not features. AA is not itchy. Not seen in alopecia areata (comedones = acne, vesicles = viral/eczema); the scalp skin is smooth. Not seen in alopecia areata (comedones = acne, vesicles = viral/eczema); the scalp skin is smooth. AA is non-scaly.\nExclamation hairs = AA.",""],"im":[]},{"id":"H293","ch":"Hair Disorders","q":"Clinical types of alopecia areata include all EXCEPT:","o":[["A","Patchy type."],["B","Marginal type."],["C","Mucocutaneous type."],["D","Alopecia totalis."],["E","Alopecia universalis."]],"a":"C","sa":null,"pg":null,"f":[],"n":40,"e":["Clinical types: patchy, ophiasis, totalis, universalis (marginal type is ophiasis). No mucocutaneous type. Patchy: one or more round bald patches. Marginal (ophiasis): loss along the scalp margins. Totalis: total scalp hair loss. Universalis: loss of all body hair.",""],"im":[]},{"id":"H294","ch":"Hair Disorders","q":"Androgenetic alopecia in males can be treated by:","o":[["A","Estrogens."],["B","Cyproterone acetate."],["C","Spironolactone."],["D","Topical minoxidil."],["E","All of the above."]],"a":"D","sa":null,"pg":null,"f":[],"n":41,"e":["Topical minoxidil and 5-alpha reductase inhibitors treat male AGA; estrogens and antiandrogens are for females. Estrogens feminize. Cyproterone feminizes. Spironolactone feminizes. Not all are used in males.",""],"im":[]},{"id":"H296","ch":"Hair Disorders","q":"17 year old male presenting with alopecia of gradual onset and progressive course 3 months after starting chemotherapy for lymphoma:","o":[["A","Androgenet alopecia"],["B","Telogen effluvium"],["C","Anagen effluvium"],["D","Alopecia areata"],["E","Cicatricial alopecia"]],"a":"C","sa":null,"pg":null,"f":[],"n":42,"e":["Hair loss starting 3 months after chemotherapy for lymphoma points to anagen effluvium (toxic to active follicles). AGA is gradual. TE is later. AA is patchy. It is non-scarring.",""],"im":[]},{"id":"H297","ch":"Hair Disorders","q":"In ophiasis:","o":[["A","Hair loss occurs along the margins of the scalp."],["B","Total scalp hair loss occurs."],["C","Cicatricial alopecia is a complication."],["D","Total body hair loss occurs."],["E","Localized area of hair loss is present."]],"a":"A","sa":null,"pg":null,"f":[],"n":43,"e":["Hair loss along the scalp margins is ophiasis, a type of alopecia areata; it is not cicatricial and is not total. That is totalis. It is non-scarring. That is universalis. That is patchy.",""],"im":[]},{"id":"H298","ch":"Hair Disorders","q":"Case 2 A male patient, 27 years old, presented with hair loss of five- year duration with a gradual onset and a progressive course. It began by frontal and bitemporal recession, and then it involved the vertex. This patient is presenting with:","o":[["A","Telogen effluvium."],["B","Anagen effluvium."],["C","Androgenetic alopecia."],["D","Cicatricial alopecia."],["E","Alopecia areata."]],"a":"C","sa":null,"pg":null,"f":[],"n":44,"e":["Slow progressive hair loss starting with frontal and bitemporal recession then the vertex in a young man is androgenetic alopecia. TE is diffuse. Anagen effluvium is acute. Scarring is localized. AA is patchy.\nMale pattern.",""],"im":[]},{"id":"H299","ch":"Hair Disorders","q":"Which is TRUE regarding androgenetic alopecia?","o":[["A","Treated by systemic corticosteroids."],["B","Affects males only."],["C","Pathology involves melanocytes."],["D","Caused by accentuated 5-alpha reductase activity in hair follicles."],["E","Contagious."]],"a":"D","sa":null,"pg":null,"f":[],"n":45,"e":["AGA is due to accentuated 5-alpha reductase in follicles. It is not treated by systemic steroids, affects both sexes and does not involve melanocytes. Steroids do not treat AGA. Females are affected. Melanocytes are the target in vitiligo; hair-loss pathology here is in the follicle. Not contagious.",""],"im":[]},{"id":"H301","ch":"Hair Disorders","q":"Exclamation mark hair is present in:","o":[["A","Androgenetic alopecia."],["B","Alopecia areata."],["C","Telogen effluvium."],["D","Anagen effluvium."]],"a":"B","sa":null,"pg":null,"f":[],"n":46,"e":["Exclamation-mark hairs, broken tapered hairs at the margin of patches, are specific to alopecia areata. AGA has miniaturization. TE has club hairs. Anagen effluvium has tapered hairs.\nExclamation hairs.",""],"im":[]},{"id":"H305","ch":"Hair Disorders","q":"Which of the following is considered an autoimmune disease?","o":[["A","Scaly ringworm."],["B","Androgenetic alopecia."],["C","Alopecia areata."],["D","Favus."],["E","Kerion."]],"a":"C","sa":null,"pg":null,"f":[],"n":47,"e":["Alopecia areata is autoimmune; androgenetic alopecia is hormonal, others are fungal. Fungal. Hormonal. Fungal. Fungal.\nAA autoimmune.",""],"im":[]},{"id":"H307","ch":"Hair Disorders","q":"Which of the following is TRUE about androgenetic alopecia?","o":[["A","It is a genetically determined cicatricial type of alopecia."],["B","Oral antiandrogens are used for treatment of male androgenetic alopecia."],["C","Minoxidil 2% is used in treatment of male (not female) androgenetic alopecia."],["D","Finasteride is contraindicated in male androgenetic alopecia."],["E","Is due to increased activity of 5 alfa-reductase in target follicles."]],"a":"E","sa":null,"pg":null,"f":[],"n":48,"e":["AGA is genetically determined, non-cicatricial, treated by minoxidil (males and females), antiandrogens only in females, and due to increased 5-alpha reductase. Finasteride is used in males, not contraindicated. AGA is non-scarring. Antiandrogens feminize males. Minoxidil is used in both sexes. Finasteride is used.\n5-AR increased.",""],"im":[]},{"id":"Q501","ch":"Acne Vulgaris","q":"Acne is a chronic inflammatory disorder of the","o":[["A","Pilosebaceous units."],["B","Eccrine sweat glands."],["C","Apocrine sweat glands."],["D","Superficial dermis."],["E","Epidermis."]],"a":"A","sa":null,"pg":"96","f":[],"n":1,"e":["Acne vulgaris is a chronic inflammatory disorder of the pilosebaceous unit (hair follicle plus sebaceous gland), not of sweat glands. Eccrine glands are sweat glands with no follicle; acne arises in the pilosebaceous unit (follicle plus sebaceous gland). Apocrine glands (axilla, groin) are involved in other diseases such as hidradenitis; acne is pilosebaceous. Acne starts in the follicle; the dermis is inflamed only after follicular rupture. Not the epidermis alone.",""],"im":[]},{"id":"Q502","ch":"Acne Vulgaris","q":"Acne vulgaris is due to involvement of","o":[["A","Sebaceous glands."],["B","Eccrine glands."],["C","Pilosebaceous glands."],["D","Apocrine glands."],["E","Sweat glands."]],"a":"C","sa":null,"pg":null,"f":[],"n":2,"e":["Acne arises in the pilosebaceous glands of the face, chest and back, where sebum production is under androgen control. The gland alone is incomplete. Eccrine glands are not involved. Apocrine glands are not involved. Sweat glands are not involved.\nFace, chest, back.",""],"im":[]},{"id":"Q503","ch":"Acne Vulgaris","q":"Acne vulgaris","o":[["A","Is cured by topical steroids."],["B","Is an infectious disease."],["C","Causes itching that increases at night."],["D","Is a disease of the pilosebaceous unit."],["E","Is characterized by vesicle formation."]],"a":"D","sa":null,"pg":"96","f":[],"n":3,"e":["Acne is a disease of the pilosebaceous unit, involving follicular keratinization, sebum and Cutibacterium acnes. Steroids worsen acne. Acne is multifactorial (keratinization, sebum, Cutibacterium acnes); the bacterium is a skin commensal, not a contagious infection. It is not itchy. Acne lesions are comedones, papules, pustules, nodules and cysts; vesicles belong to viral or eczematous diseases.\n3 factors.",""],"im":[]},{"id":"Q504","ch":"Acne Vulgaris","q":"Acne vulgaris is","o":[["A","A superficial streptococcal infection."],["B","A human papilloma viral infection."],["C","Best treated by systemic steroids."],["D","May affect palms and soles."],["E","A disease of pilosebaceous follicles."]],"a":"E","sa":null,"pg":null,"f":[],"n":4,"e":["Acne is a disease of the pilosebaceous follicles, with retained keratinocytes blocking the follicle opening and sebum accumulating. Streptococci cause impetigo and erysipelas; the acne organism is Cutibacterium acnes. HPV causes warts; acne has no viral cause. Steroids worsen. It spares palms and soles.",""],"im":[]},{"id":"Q505","ch":"Acne Vulgaris","q":"Regarding acne vulgaris, choose the correct answer","o":[["A","Staphylococcus aureus is involved in the pathogenesis."],["B","An infectious disease."],["C","A chronic inflammation of the pilosebaceous units."],["D","Treated by topical and systemic steroids."],["E","Clinical lesions include papules, vesicles, nodules and cysts."]],"a":"C","sa":null,"pg":"96","f":[],"n":5,"e":["Acne is chronic inflammation of the pilosebaceous units; it is not an infection, not treated with steroids and has no vesicles. Staph is not the key. Acne is multifactorial (keratinization, sebum, Cutibacterium acnes); the bacterium is a skin commensal, not a contagious infection. Steroids worsen. Acne lesions are comedones, papules, pustules, nodules and cysts; vesicles belong to viral or eczematous diseases.",""],"im":[]},{"id":"Q506","ch":"Acne Vulgaris","q":"Which of the following is true about acne vulgaris?","o":[["A","It is an infectious disease."],["B","Lesions include comedones, papules, vesicles and nodulocysts."],["C","Chronic inflammation of the pilosebaceous unit."],["D","There is colonization of pilosebaceous units by Streptococcus acnes."]],"a":"C","sa":null,"pg":"96","f":[],"n":6,"e":["Chronic inflammation of the pilosebaceous unit with retained keratinocytes blocking the follicle is the correct description. Acne is multifactorial (keratinization, sebum, Cutibacterium acnes); the bacterium is a skin commensal, not a contagious infection. Acne lesions are comedones, papules, pustules, nodules and cysts; vesicles belong to viral or eczematous diseases. The organism in the pilosebaceous unit is Cutibacterium acnes, not streptococcus.\nNot infectious.",""],"im":[]},{"id":"Q507","ch":"Acne Vulgaris","q":"The following disease is NOT contagious","o":[["A","Scabies."],["B","Pediculosis capitis."],["C","Ecthyma."],["D","Leprosy."],["E","Acne."]],"a":"E","sa":null,"pg":"96","f":[],"n":7,"e":["Acne is not contagious: it results from follicular keratinization, androgens and bacterial colonization (commensal C. acnes). Contagious. Contagious. Contagious. Contagious.",""],"im":[]},{"id":"Q508","ch":"Acne Vulgaris","q":"Acne vulgaris is:","o":[["A","A disease of the pilosebaceous apparatus."],["B","A disease which commonly affects the face."],["C","A disease which can be treated by oral tetracyclines."],["D","All of the above."],["E","None of the above."]],"a":"D","sa":null,"pg":"96","f":[],"n":8,"e":["Acne is a chronic inflammatory disease of pilosebaceous units seen in adolescence and involving face, chest and back, so all of the above.",""],"im":[]},{"id":"Q509","ch":"Acne Vulgaris","q":"Acne vulgaris:","o":[["A","May affect palms and soles."],["B","Is a disease of sweat glands."],["C","Commonly affects the scalp."],["D","Is a disease of adolescents."],["E","Causes itching which increases by night."]],"a":"D","sa":null,"pg":"96","f":[],"n":9,"e":["Acne vulgaris peaks in adolescence under androgen influence, although it may start or persist in adulthood. It does not affect palms and soles (no pilosebaceous units). Palms and soles lack follicles. It is pilosebaceous. The face is common. It is not itchy.\nAdolescents.",""],"im":[]},{"id":"Q510","ch":"Acne Vulgaris","q":"Which of the following statements about acne vulgaris is INCORRECT?","o":[["A","It is a disease of adolescence."],["B","Primary lesion is a comedone."],["C","Severe forms can be treated by systemic retinoids."],["D","It is a disease of the pilosebaceous unit."],["E","It is best treated by topical steroids."]],"a":"E","sa":null,"pg":"99","f":[],"n":10,"e":["Topical steroids worsen or cause acneiform eruptions, so 'best treated by topical steroids' is wrong. Retinoids, benzoyl peroxide and antibiotics are used. The peak incidence is in adolescence. The comedone is the primary lesion (non-inflammatory keratinous impaction). Severe nodulocystic or scarring acne is treated with systemic retinoids. Acne is a chronic inflammatory disease of the pilosebaceous unit.\nSteroids worsen acne.",""],"im":[]},{"id":"Q511","ch":"Acne Vulgaris","q":"In acne vulgaris,","o":[["A","There is loss of melanocytes."],["B","The sebum composition is normal."],["C","There is colonization of pilosebaceous units by Strep. acnes."],["D","Lesions include comedones, vesicles and nodulocysts."],["E","There is increased proliferation of keratinocytes."]],"a":"E","sa":null,"pg":"96","f":[],"n":11,"e":["Abnormal follicular keratinization with proliferation of keratinocytes blocks the follicle opening, forming the comedone. Melanocytes are intact. Sebum composition changes. The organism is P. acnes. Acne lesions are comedones, papules, pustules, nodules and cysts; vesicles belong to viral or eczematous diseases.\nKeratin plug.",""],"im":[]},{"id":"Q512","ch":"Acne Vulgaris","q":"The following organism is related to acne vulgaris","o":[["A","Malassezia furfur."],["B","Corynebacterium minutissimum."],["C","Propionibacterium acnes."],["D","Streptococcus haemolyticus."],["E","Pityrosporum ovale."]],"a":"C","sa":null,"pg":"96","f":[],"n":12,"e":["Cutibacterium (Propionibacterium) acnes colonizes the pilosebaceous unit; Malassezia is linked to seborrheic dermatitis and Corynebacterium to erythrasma. Malassezia is seb derm. Corynebacterium is erythrasma. Strep is impetigo. Pityrosporum is Malassezia.\nP. acnes.",""],"im":[]},{"id":"Q513","ch":"Acne Vulgaris","q":"The bacteria that multiply in blocked skin pores, metabolize sebum, and can lead to the development of acne are:","o":[["A","Staphylococcus aureus."],["B","Mycobacteria."],["C","Corynebacterium minutissimum."],["D","Streptococcus pyogenes."],["E","Propionibacterium."]],"a":"E","sa":null,"pg":"96","f":[],"n":13,"e":["Propionibacterium (Cutibacterium) multiplies in blocked pores and metabolizes sebum, driving inflammation. S. aureus causes boils. Mycobacteria cause leprosy. Corynebacterium causes erythrasma. Strep causes impetigo.\nP. acnes.",""],"im":[]},{"id":"Q514","ch":"Acne Vulgaris","q":"Which organism in the pilosebaceous unit is involved in the pathogenesis of acne vulgaris?","o":[],"a":null,"sa":"Cutibacterium (Propionibacterium) acnes.","pg":"96","f":[],"n":14,"e":["Cutibacterium acnes (formerly Propionibacterium) is the organism in acne pathogenesis.\nC. acnes.",""],"im":[]},{"id":"Q515","ch":"Acne Vulgaris","q":"In acne vulgaris","o":[["A","There is loss of melanocytes."],["B","Sebum composition is normal."],["C","There is colonization of pilosebaceous units by Strep. acnes."],["D","Lesions include comedones, vesicles & nodulocysts."],["E","Retinoids are used for treatment."]],"a":"E","sa":null,"pg":"99","f":[],"n":15,"e":["Retinoids normalize follicular keratinization and are anti-inflammatory; they are used topically and orally. Melanocytes are intact. Sebum composition changes. The organism is P. acnes. Acne lesions are comedones, papules, pustules, nodules and cysts; vesicles belong to viral or eczematous diseases.",""],"im":[]},{"id":"Q516","ch":"Acne Vulgaris","q":"The following lesions are present in acne vulgaris EXCEPT","o":[["A","Papules."],["B","Comedones."],["C","Pustules."],["D","Nodules."],["E","Vesicles."]],"a":"E","sa":null,"pg":"96","f":[],"n":16,"e":["Acne lesions are comedones, papules, pustules, nodules and cysts. Vesicles are not part of acne. Present. Present. Present. Present.\nNo vesicles.",""],"im":[]},{"id":"Q517","ch":"Acne Vulgaris","q":"The lesions in acne vulgaris include:","o":[["A","Comedones, pustules, nodules."],["B","Comedones, furrows, cysts."],["C","Papules, macules, vesicles."],["D","Papules, nodules, bullae."],["E","Pustules, vesicles, scars."]],"a":"A","sa":null,"pg":"96","f":[],"n":17,"e":["Acne lesions include comedones, pustules, nodules (and papules and cysts); none are vesicles. Furrows are scabies. A papule is raised; vitiligo lesions are flat (macules/patches). Bullae are not acne. Vesicles are not acne.\nPolymorphic.",""],"im":[]},{"id":"Q518","ch":"Acne Vulgaris","q":"In acne vulgaris","o":[["A","Lesions are monomorphic, primary lesion is a comedone."],["B","Lesions are polymorphic, primary lesion is a cyst."],["C","Lesions are polymorphic, primary lesion is a comedone."],["D","Lesions are monomorphic, primary lesion is a pustule."],["E","Lesions are comedones, papules, vesicles, pustules & cysts."]],"a":"C","sa":null,"pg":"96","f":[],"n":18,"e":["Acne is polymorphic (many lesion types) and the primary lesion is the comedone. It is polymorphic. The primary lesion is a comedone. It is polymorphic. Acne lesions are comedones, papules, pustules, nodules and cysts; vesicles belong to viral or eczematous diseases.",""],"im":[]},{"id":"Q519","ch":"Acne Vulgaris","q":"Scarring can occur as a result of","o":[["A","Psoriasis."],["B","Urticaria."],["C","Nodular acne."],["D","Actinic lichen planus."],["E","Erythrasma."]],"a":"C","sa":null,"pg":"96","f":[],"n":19,"e":["Inflammatory nodular and cystic acne destroys deep follicular tissue and scars, unlike psoriasis, urticaria or erythrasma. Psoriasis is non-scarring. Urticaria is non-scarring. Actinic LP is non-scarring. Erythrasma is non-scarring.\nNodulocystic scars.",""],"im":[]},{"id":"Q520","ch":"Acne Vulgaris","q":"A patient is concerned his acne will leave scarring; which lesion is more likely to cause such a complication?","o":[["A","Comedones."],["B","Papules."],["C","Nodulocystic lesions."],["D","Plaques."],["E","Macules."]],"a":"C","sa":null,"pg":"96","f":[],"n":20,"e":["Nodulocystic lesions, being deep inflammatory, carry the highest risk of scarring. Comedones rarely scar. Papules rarely scar. Plaques are not acne. Macules are not acne.\nNodulocystic scars.",""],"im":[]},{"id":"Q521","ch":"Acne Vulgaris","q":"A female patient, 21 years old, single, presented with facial lesions. She stated that it all started since she was 15 years old with remissions and exacerbations. Lesions exacerbated during her menstruation. Patient's face was oily. (Clinical photo: papules and pustules on the cheeks and chin.) This patient suffers from","o":[["A","Actinic lichen."],["B","Furuncles."],["C","Acne vulgaris."],["D","Impetigo of Bockhart."],["E","Systemic lupus."]],"a":"C","sa":null,"pg":"96","f":[],"n":21,"e":["Comedones, papules and pustules on the face of an adolescent are acne vulgaris. Actinic LP is violaceous. Furuncles are single. Bockhart is infectious. SLE is photosensitive.",""],"im":[]},{"id":"Q522","ch":"Acne Vulgaris","q":"A male patient, 24 years old, presented with skin lesions on his face. The condition started since he was 14 years old with remissions and exacerbations. (Clinical photo: papules and pustules on the cheek.) This patient suffers from","o":[["A","Folliculitis."],["B","Molluscum contagiosum."],["C","Contact eczema."],["D","Acne vulgaris."],["E","Furunculosis."]],"a":"D","sa":null,"pg":"96","f":[],"n":22,"e":["Polymorphic facial lesions with comedones are acne vulgaris. Folliculitis is pustular only. Molluscum is umbilicated. Contact eczema is itchy. Furunculosis is boils.",""],"im":[]},{"id":"Q523","ch":"Acne Vulgaris","q":"A patient with comedones and few or no papules on his face has","o":[["A","Mild acne."],["B","Sycosis barbae."],["C","Bockhart impetigo."],["D","Acne conglobata."],["E","Folliculitis."]],"a":"A","sa":null,"pg":"97","f":[],"n":23,"e":["A patient with only comedones and few or no papules has mild acne (non-inflammatory acne). Sycosis is beard. Bockhart is pustular. Conglobata is severe. Folliculitis is pustular.",""],"im":[]},{"id":"Q524","ch":"Acne Vulgaris","q":"A teenage boy presents with oily skin, comedones, and inflammatory papules on face and back. First- line therapy includes topical:","o":[["A","Calcipotriol."],["B","Terbinafine."],["C","Crotamiton 10%."],["D","Retinoids."],["E","Steroid."]],"a":"D","sa":null,"pg":"99","f":[],"n":24,"e":["Oily skin with comedones and inflammatory papules is acne; topical retinoids are first-line because they normalize keratinization. Calcipotriol is for psoriasis. Terbinafine is antifungal. Crotamiton is for scabies. Steroids worsen acne.",""],"im":[]},{"id":"Q525","ch":"Acne Vulgaris","q":"An adolescent with comedones and papules on the skin is treated with which topical agent?","o":[],"a":null,"sa":"Topical benzoyl peroxide (other topical options: retinoids, erythromycin/clindamycin, azelaic acid)","pg":"99","f":[],"n":25,"e":["Comedones and papules are treated with topical agents: retinoids, benzoyl peroxide, antibiotics (erythromycin, clindamycin) or azelaic acid.\nTopical first.",""],"im":[]},{"id":"Q526","ch":"Acne Vulgaris","q":"Benzoyl peroxide may be used in the treatment of","o":[["A","Scabies."],["B","Acne vulgaris."],["C","Phthirus pubis."],["D","Impetigo."],["E","Pediculosis."]],"a":"B","sa":null,"pg":"99","f":[],"n":26,"e":["Benzoyl peroxide 2.5-10% is a bactericidal agent against C. acnes with no resistance. Scabies uses permethrin. Phthirus uses permethrin. Impetigo uses antibiotics. Pediculosis uses permethrin.\nBPO for acne.",""],"im":[]},{"id":"Q527","ch":"Acne Vulgaris","q":"Benzoyl peroxide is used in the treatment of:","o":[["A","Scabies."],["B","Pediculosis."],["C","Phthirus pubis."],["D","None of the above."]],"a":"D","sa":null,"pg":"99","f":[],"n":27,"e":["Benzoyl peroxide treats acne, not scabies, lice or fungal infection, so the listed non-acne options are wrong. Scabies uses permethrin. Pediculosis uses permethrin. Phthirus uses permethrin.\nBPO = acne only.",""],"im":[]},{"id":"Q528","ch":"Acne Vulgaris","q":"Acne vulgaris is","o":[["A","Cured by topical steroids."],["B","An infectious disease."],["C","Treated by oral retinoids in its nodulocystic forms."],["D","A disease affecting skin and mucous membranes."],["E","A disease of sweat glands."]],"a":"C","sa":null,"pg":"99","f":[],"n":28,"e":["Nodulocystic acne is severe and treated with oral retinoids (isotretinoin). Steroids worsen. Acne is multifactorial (keratinization, sebum, Cutibacterium acnes); the bacterium is a skin commensal, not a contagious infection. Mucosa is spared. It is pilosebaceous.",""],"im":[]},{"id":"Q529","ch":"Acne Vulgaris","q":"A 17-year-old female presented with multiple papules, pustules, nodules and cysts on her face. What is the appropriate systemic treatment for such a case?","o":[["A","Methotrexate."],["B","Retinoids."],["C","Cyclosporine."],["D","Antivirals."],["E","Antihelminthics."]],"a":"B","sa":null,"pg":"99","f":[],"n":29,"e":["Multiple papules, pustules, nodules and cysts represent severe acne needing systemic retinoids. Methotrexate is for psoriasis. Cyclosporine is immunosuppressive. Antivirals are unrelated. Antihelminthics are unrelated.\nOral retinoid.",""],"im":[]},{"id":"Q530","ch":"Acne Vulgaris","q":"A teenager presented with a polymorphic eruption on the face of comedones, papules, pustules, many nodules and cysts. The treatment of choice is oral","o":[["A","Ampicillin."],["B","Retinoids."],["C","Fluconazole."],["D","Acyclovir."],["E","Antihistamines."]],"a":"B","sa":null,"pg":"99","f":[],"n":30,"e":["Polymorphic eruption with many nodules is severe acne, treated by systemic retinoids. Ampicillin is not an acne antibiotic; acne uses tetracyclines or macrolides, and nodulocystic acne needs retinoids. Fluconazole is antifungal. Acyclovir is antiviral. Acne is not histamine-mediated, so antihistamines do not treat it.\nIsotretinoin.",""],"im":[]},{"id":"Q531","ch":"Acne Vulgaris","q":"An 18-year-old female patient has severe acne, with multiple inflammatory papules on her face and some even larger nodules and cysts. She tried many topical therapies with no lasting benefit. Which of the following is the most appropriate next step in management?","o":[["A","Radiotherapy."],["B","Phototherapy."],["C","Cryotherapy."],["D","Oral steroids."],["E","Oral retinoids."]],"a":"E","sa":null,"pg":"99","f":[],"n":31,"e":["Severe nodulocystic acne unresponsive to topical therapy needs oral retinoids; this drug is teratogenic, so pregnancy must be excluded and double contraception used. Radiotherapy has no role here; vitiligo is treated by stopping the autoimmune process and stimulating repigmentation (phototherapy, steroids, calcineurin inhibitors). Phototherapy is not a standard acne treatment; failed topical therapy with nodulocystic lesions calls for oral retinoids. Cryotherapy is used for warts, not acne. Oral steroids worsen.\nOral retinoid; teratogenic.",""],"im":[]},{"id":"Q532","ch":"Acne Vulgaris","q":"Choose the wrong answer","o":[["A","Retinoids are special derivatives of vitamin A."],["B","Retinoids could be used topically or orally."],["C","Retinoids increase keratinization of the orifice."],["D","Systemic retinoids should not be given to females in childbearing period."],["E","Retinoids are used in severe acne."]],"a":"C","sa":null,"pg":"99","f":[],"n":32,"e":["Retinoids (vitamin A derivatives) normalize keratinization; saying they increase keratinization of the follicle orifice is incorrect. Retinoids are vitamin A derivatives. Retinoids are used topically (all cases) or orally (severe cases). Oral retinoids are teratogenic: pregnancy test and double contraception are mandatory. Oral retinoids are used in severe inflammatory, nodulocystic or scarring acne.",""],"im":[]},{"id":"Q533","ch":"Acne Vulgaris","q":"What is the systemic treatment of acne vulgaris?","o":[],"a":null,"sa":"Systemic antibiotics (tetracyclines, macrolides) and oral retinoids; also dapsone and antiandrogens/OCPs for females with hormonal disturbance","pg":"99","f":[],"n":33,"e":["Moderate or severe acne is treated with systemic antibiotics (tetracyclines, macrolides), oral retinoids and dapsone; females with hormonal causes get antiandrogens or OCPs.\nIsotretinoin teratogenic.",""],"im":[]},{"id":"H316","ch":"Acne Vulgaris","q":"Acne vulgaris is:","o":[["A","An infectious disease."],["B","A disease affecting skin and mucous membranes."],["C","A disease of sweat glands."],["D","Treated by topical steroids."],["E","Treated by retinoids in its nodulocystic form."]],"a":"E","sa":null,"pg":null,"f":[],"n":34,"e":["Nodulocystic acne is severe inflammatory acne treated with oral retinoids (isotretinoin), because they reduce sebum, normalize keratinization and are anti-inflammatory. Acne is multifactorial (keratinization, sebum, Cutibacterium acnes); the bacterium is a skin commensal, not a contagious infection. Mucosa is spared. It is pilosebaceous. Steroids worsen.",""],"im":[]},{"id":"H318","ch":"Acne Vulgaris","q":"All of the following are factors in acne pathogenesis EXCEPT:","o":[["A","Increase in sebum production."],["B","Change in sebum composition."],["C","Increase in the epidermal turnover."],["D","Distension of pilosebaceous follicle."],["E","Microbial colonization of pilosebaceous units."]],"a":"C","sa":null,"pg":null,"f":["Key says increased epidermal turnover is not a factor, but keratinocyte hyperproliferation contributes to comedone formation. Please verify."],"n":35,"e":["Pathogenesis includes increased sebum and altered composition, distension of the follicle, microbial colonization and increased keratinocyte proliferation. The key marks 'increase in epidermal turnover' as the exception, though hyperproliferation does occur; flagged. A factor. A factor. A factor. A factor.\nKeratinization abnormality.",""],"im":[]},{"id":"H321","ch":"Acne Vulgaris","q":"Choose the wrong answer:","o":[["A","Retinoids are special derivatives of vitamin A."],["B","Retinoids could be used systemically or orally."],["C","Retinoids increase keratinization of the orifice."],["D","Systemic retinoids should not be given to females in childbearing period."],["E","Retinoids are used in severe acne."]],"a":"C","sa":null,"pg":null,"f":[],"n":36,"e":["Retinoids normalize follicular keratinization, so saying they increase it is wrong; they are derivatives of vitamin A used for severe acne, are teratogenic, and are used orally or topically. Retinoids are vitamin A derivatives. Retinoids can be applied topically (all cases) or taken orally (severe cases). Oral retinoids are teratogenic: pregnancy test and double contraception are mandatory. Oral retinoids are used in severe inflammatory, nodulocystic or scarring acne.",""],"im":[]},{"id":"H323","ch":"Acne Vulgaris","q":"Acne vulgaris:","o":[["A","Is cured by topical steroids."],["B","Is an infectious disease."],["C","Causes itching that increases at night."],["D","Is a disease of pilosebaceous unit."],["E","Characterized by vesicle formation."]],"a":"D","sa":null,"pg":null,"f":[],"n":37,"e":["Acne is a disease of the pilosebaceous unit, not of sweat glands and not infectious. Steroids worsen. Acne is multifactorial (keratinization, sebum, Cutibacterium acnes); the bacterium is a skin commensal, not a contagious infection. It is not itchy. Acne lesions are comedones, papules, pustules, nodules and cysts; vesicles belong to viral or eczematous diseases.",""],"im":[]},{"id":"H324","ch":"Acne Vulgaris","q":"Case 5 A female patient, 21 years old, single, presented with facial lesions. She stated that it all started since she was 15 years old with remissions and exacerbations. Lesions exacerbated during her menstruation. Patient's face was oily. 9) This patient suffers from:","o":[["A","Actinic lichen."],["B","Furuncles."],["C","Acne vulgaris."],["D","Impetigo of Bockhart."],["E","Systemic lupus."]],"a":"C","sa":null,"pg":null,"f":[],"n":38,"e":["Facial lesions from age 15 with menstrual flares and oily skin indicate acne vulgaris (androgen-driven sebum). Actinic LP is violaceous. Furuncles are single. Bockhart is infectious. SLE is photosensitive.\nPremenstrual flare.",""],"im":[]},{"id":"H328","ch":"Acne Vulgaris","q":"The following drugs may be used in the treatment of acne EXCEPT:","o":[["A","Retinoids."],["B","Dapsone."],["C","Tetracyclines."],["D","Androgens."],["E","Steroids."]],"a":"D","sa":null,"pg":null,"f":[],"n":39,"e":["Retinoids, dapsone, tetracyclines and steroids (intralesional) may be used; androgens increase sebum and worsen acne. Retinoids are used topically and orally in acne. Dapsone is used for severe inflammatory and nodulocystic acne. Tetracyclines are used systemically for moderate to severe acne. Intralesional or short oral steroid courses are used selectively for severe inflammatory lesions; androgens, in contrast, increase sebum production.\nAndrogens worsen acne.",""],"im":[]},{"id":"H329","ch":"Acne Vulgaris","q":"Benzoyl peroxide is used in the treatment of:","o":[["A","Animal scabies."],["B","Pediculosis capitis."],["C","Phthirus pubis."],["D","Acne vulgaris"]],"a":"D","sa":null,"pg":null,"f":[],"n":40,"e":["Benzoyl peroxide 2.5-10% is a bactericidal topical agent for acne vulgaris without bacterial resistance. Scabies uses permethrin. Pediculosis uses permethrin. Phthirus uses permethrin.\nBPO.",""],"im":[]},{"id":"H331","ch":"Acne Vulgaris","q":"In acne vulgaris:","o":[["A","There is loss of melanocytes."],["B","Benzyl benzoate is an effective topical agent."],["C","There is colonization of pilosebaceous units by Propionibacterium acnes."],["D","Lesions include comedones, pustules, vesicles and nodulocysts."],["E","Retinoids could be used topically or orally."]],"a":"E","sa":null,"pg":null,"f":[],"n":41,"e":["Retinoids can be used topically for mild-moderate acne and orally for severe disease. Melanocytes are intact. Benzyl benzoate is for scabies. The organism is P. acnes. Acne lesions are comedones, papules, pustules, nodules and cysts; vesicles belong to viral or eczematous diseases.\nTopical or oral.",""],"im":[]}],"img":{},"skillVersion":"3.3","categories":[{"id":"hawary","name":"Hawary Only","subtitle":"Questions from Dr. Hawary only","description":"All questions from the Hawary source, shown as a separate view. They remain in their original chapters too.","kind":"source","questionIds":["Q008","Q004","Q003","Q001","Q012","Q011","H007","Q017","Q019","Q010","H011","H012","H013","Q025","H015","Q033","Q032","Q041","H019","Q037","H021","Q052","H023","Q051","Q361","Q068","Q063","H028","Q077","Q061","Q073","Q086","Q076","Q056","Q095","Q062","H037","Q083","Q097","Q080","H041","H042","Q057","Q078","Q094","Q059","Q088","Q093","Q085","Q064","H051","Q121","H053","H054","H055","H056","H057","Q106","Q119","Q118","H061","Q108","Q099","Q120","Q104","Q101","H067","Q102","Q117","Q107","H071","H072","Q170","Q179","Q185","Q150","Q144","Q143","H079","Q130","Q131","H082","H083","H084","Q147","Q145","Q153","Q151","Q175","Q137","Q155","Q180","Q174","Q140","Q138","Q126","Q182","Q186","Q142","Q172","H101","H102","H103","H104","Q169","Q156","Q129","Q163","Q149","
