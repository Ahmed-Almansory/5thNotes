<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folio 196 — Private Stats</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="logo.jpg">
<style>
  html,body{margin:0;padding:0}
  body{background:#00142D;color:#e6f2f2;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
  main{max-width:560px;margin:0 auto;padding:40px 20px 60px}
  img.logo{display:block;width:220px;margin:0 auto 8px}
  h1{text-align:center;font-size:1.5rem;margin:8px 0 4px}
  p.sub{text-align:center;color:#9fb3c8;font-size:.9rem;margin:0 0 24px}
  table{width:100%;border-collapse:collapse;background:#0A3A6B;border-radius:12px;overflow:hidden}
  th,td{padding:12px 16px;text-align:left}
  th{color:#45E0C0;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
  td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  tr + tr td{border-top:1px solid rgba(69,224,192,.18)}
  tr.total td{border-top:2px solid rgba(69,224,192,.4);font-weight:700}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 0;flex-wrap:wrap}
  .mut{color:#9fb3c8;font-size:.85rem}
  button{background:transparent;color:#45E0C0;border:1px solid #45E0C0;border-radius:999px;padding:8px 18px;font:inherit;font-size:.9rem;font-weight:600;cursor:pointer}
  a{color:#45E0C0}
  .err{color:#f2b04d}
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.jpg" alt="Folio 196">
  <h1>Folio 196 — Stats</h1>
  <p class="sub">Private page — not linked anywhere on the site.<br>Counts are <b>opens</b>, not unique people. Bank counts started 20 Nov 2026.</p>
  <table>
    <thead><tr><th>Bank</th><th style="text-align:right">Opens</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="row">
    <span class="mut">Portal loads (total): <b id="total">…</b></span>
    <span class="mut" id="updated"></span>
  </div>
  <div class="row">
    <button id="refresh" type="button">Refresh</button>
    <a href="https://analytics.google.com/" target="_blank" rel="noopener">Open Google Analytics ↗</a>
  </div>
  <p class="mut" id="note"></p>
</main>
<script>
var BANKS = [
  ['Dermatology', 'dermatology'],
  ['Chest', 'chest'],
  ['Cardiology', 'cardiology'],
  ['Tropical Medicine', 'tropical'],
  ['Anesthesia', 'anesthesia'],
  ['Andrology', 'andrology'],
  ['Radiology', 'radiology']
];
function getCount(key) {
  var ctrl = new AbortController();
  var timer = setTimeout(function () { ctrl.abort(); }, 8000);
  return fetch('https://abacus.jasoncameron.dev/get/' + key + '?t=' + Date.now(), { signal: ctrl.signal, cache: 'no-store' })
    .then(function (r) { return r.json().then(function (d) { return { status: r.status, d: d }; }); })
    .then(function (o) {
      if (o.d && typeof o.d.value === 'number') return o.d.value;
      if (o.status === 404) return 0; // key never created = genuinely zero opens
      return null; // error JSON, timeout or network failure — not a zero
    })
    .catch(function () { return null; })
    .finally(function () { clearTimeout(timer); });
}
function load() {
  var rows = document.getElementById('rows');
  rows.innerHTML = BANKS.map(function (b) {
    return '<tr><td>' + b[0] + '</td><td class="num" data-slug="' + b[1] + '">…</td></tr>';
  }).join('') + '<tr class="total"><td>All banks</td><td class="num" id="bankTotal">…</td></tr>';
  document.getElementById('total').textContent = '…';
  document.getElementById('note').textContent = '';
  document.getElementById('note').className = 'mut';
  document.getElementById('updated').textContent = 'Loading…';
  var loaded = 0, sum = 0, failed = 0;
  function finishOne() {
    loaded++;
    if (loaded === BANKS.length + 1) {
      document.getElementById('bankTotal').textContent = failed ? sum + '+' : sum;
      document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
      if (failed) {
        document.getElementById('note').textContent = 'Some counts could not be loaded (the counter service was slow or returned an error) — “—” is not zero, try Refresh.';
        document.getElementById('note').className = 'mut err';
      }
    }
  }
  BANKS.forEach(function (b) {
    getCount('folio196-bank/' + b[1]).then(function (v) {
      var cell = rows.querySelector('[data-slug="' + b[1] + '"]');
      if (v === null) { failed++; if (cell) cell.textContent = '—'; }
      else { sum += v; if (cell) cell.textContent = v; }
      finishOne();
    });
  });
  getCount('5thnotes-almansory/visits').then(function (v) {
    if (v === null) { failed++; document.getElementById('total').textContent = '—'; }
    else { document.getElementById('total').textContent = v; }
    finishOne();
  });
}
document.getElementById('refresh').addEventListener('click', load);
load();
</script>
</body>
</html>
