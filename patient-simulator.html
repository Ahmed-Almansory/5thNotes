<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>محاكاة مريض</title>
<meta name="robots" content="noindex">
<script>try{var t=localStorage.getItem('sim-theme');if(!t)t=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
<style>
:root{--page:#F8FAFC;--sheet:#FFFFFF;--ink:#0F172A;--ink2:#5b6a7e;--hair:#E2E8F0;--teal:#0F766E;--tealbg:#E6F4F1;--raised:#F1F5F9;--warn:#FFF8E1;--warnline:#e7d3a8;--bad:#EF4444;--aqua:#45E0C0}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;font-size:16px;line-height:1.55}
.sheet{max-width:640px;margin:0 auto;padding:28px 22px 40px;background:var(--sheet);min-height:100vh}
@media(min-width:700px){.sheet{margin-top:24px;min-height:calc(100vh - 24px);border-radius:28px 28px 0 0;padding:36px 36px 48px}}
h1{font-size:30px;font-weight:400;margin:6px 0 4px;letter-spacing:-.01em}
h2{font-size:21px;font-weight:400;margin:0 0 8px}
.fact{color:var(--ink2);font-size:14px;margin:0 0 6px}
.group{margin-top:34px}
p{margin:0 0 10px;font-size:15px;overflow-wrap:anywhere}
.muted{color:var(--ink2)}
button{font:inherit;color:var(--ink);cursor:pointer}
.btn{min-height:44px;padding:8px 18px;border-radius:4px;border:1px solid var(--hair);background:var(--sheet);font-size:15px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.ghost{border-color:transparent;color:var(--ink2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.block{width:100%}
.stack{display:grid;gap:10px;margin-top:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sys{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sysbtn{min-height:44px;padding:8px 14px;border:1px solid var(--hair);border-radius:4px;background:var(--sheet)}
.sysbtn.on{border-color:var(--teal);color:var(--teal);font-weight:600}
details{border:1px solid var(--hair);border-radius:4px;padding:0 12px;margin-bottom:6px}
summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-weight:600}
.ngrid{display:flex;flex-wrap:wrap;gap:6px;padding-bottom:10px}
.n{min-width:44px;min-height:44px;border:1px solid var(--hair);border-radius:4px;background:var(--sheet)}
.callout{margin-top:34px;padding:14px 16px;border:1px solid var(--warnline);background:var(--warn);border-radius:4px}
.callout b{display:block;margin-bottom:4px}
.callout p{margin:0;font-size:14px}
.ask{display:grid;gap:10px}
.field{display:grid;gap:4px}
.field label{font-size:13px;color:var(--ink2)}
.field input{font:inherit;min-height:44px;padding:8px 12px;border:1px solid var(--hair);border-radius:4px;background:var(--sheet);color:var(--ink);width:100%}
.field input:focus,.btn:focus-visible,.sysbtn:focus-visible,.n:focus-visible,.chip:focus-visible,summary:focus-visible,.opt:focus-within{outline:2px solid var(--teal);outline-offset:1px}
.chips{margin-top:12px;display:grid;gap:6px}
.chip{display:block;width:100%;text-align:start;min-height:44px;margin:0 0 6px;padding:8px 12px;border:1px solid var(--hair);border-radius:4px;background:var(--sheet)}
.chip.done{color:var(--teal);border-color:var(--teal)}
.chat{display:grid;gap:14px}
.turn{display:grid;gap:6px}
.bubble{max-width:88%;padding:8px 12px;border-radius:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.me{justify-self:end;background:var(--ink);color:var(--sheet)}
.pt{justify-self:start;background:var(--raised)}
.dxs{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.opt{max-width:100%;position:relative;display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border:1px solid var(--hair);border-radius:4px;cursor:pointer;direction:ltr;text-align:left;background:var(--sheet)}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt.sel{border-color:var(--teal);color:var(--teal);font-weight:600}
.rows{display:block}
.r{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:10px 0;border-top:1px solid var(--hair)}
.r:first-child{border-top:0}
.r .name{font-size:15px}
.r .val{font-size:14px;color:var(--ink2);white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.r .val.ok{color:var(--teal);font-weight:600}
.r .detail{display:block;color:var(--ink2);font-size:14px;margin-top:2px;overflow-wrap:anywhere}
.r .main{min-width:0;flex:1}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block}
.enblock{direction:ltr;text-align:left;unicode-bidi:isolate;display:block;font-size:14px;color:var(--ink2);margin-top:2px}
.closing{margin-top:34px;color:var(--ink2);font-size:13px;border-top:1px solid var(--hair);padding-top:14px}

html[data-theme="dark"]{--page:#090E17;--sheet:#111827;--ink:#F8FAFC;--ink2:#94A3B8;--hair:#1E293B;--teal:#45E0C0;--tealbg:#0f2a2b;--raised:#1E293B;--warn:#2a2113;--warnline:#6b5a2e;--bad:#F87171}
body{line-height:1.6}
h1{font-weight:800;letter-spacing:-.02em}
h2{font-weight:700}
.btn,.sysbtn,details,.n,.chip,.opt,.field input{border-radius:10px}
.bubble{border-radius:12px}
.group{margin-top:24px;background:var(--sheet);border:1px solid var(--hair);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(15,23,42,.04),0 1px 2px rgba(15,23,42,.03)}
html[data-theme="dark"] .group{box-shadow:0 2px 6px rgba(0,0,0,.35)}
@media(min-width:700px){.sheet{box-shadow:0 20px 35px -10px rgba(15,23,42,.14)}}
html[data-theme="dark"] .sheet{box-shadow:0 24px 48px -12px rgba(0,0,0,.75)}
.hero{margin:-28px -22px 24px;background:linear-gradient(135deg,#0B2545 0%,#0F766E 100%);color:#fff;padding:22px 22px 20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#45E0C0,rgba(69,224,192,.2) 60%,transparent)}
.hero h1{color:#fff;margin:10px 0 4px}
.hero .fact{color:rgba(255,255,255,.88)}
.hero .eyebrow{color:#45E0C0}
.hero .themebtn{color:#fff;border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.12)}
@media(min-width:700px){.hero{margin:-36px -36px 24px;padding:24px 36px 22px;border-radius:28px 28px 0 0}}
.sysbtn[data-sys="cardio"]{--sys:#b91c1c}.sysbtn[data-sys="chest"]{--sys:#0d9488}.sysbtn[data-sys="abd"]{--sys:#b45309}.sysbtn[data-sys="neuro"]{--sys:#6d28d9}
.sysbtn{border-top:3px solid var(--sys,#0F766E)}
.sysbtn.on{border-color:var(--sys,#0F766E);color:var(--sys,#0F766E)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--teal);font-weight:700}
.themebtn{padding:4px 10px;min-height:36px;font-size:13px}
.mockbar{background:#0B2545;color:#fff;text-align:center;font-size:13px;padding:8px 12px}
html[data-theme="dark"] .mockbar{background:#0A3A6B}
.btn.primary{background:#0B2545;border-color:#0B2545}
html[data-theme="dark"] .btn.primary{background:#0A3A6B;border-color:#0A3A6B}
</style>
</head>

["alcohol","hepatitis_past","transfusion","bilharzia"],"abd-6":["alcohol","hepatitis_past","transfusion","bilharzia"],"abd-7":["age"],"abd-8":["smoking","alcohol","age"],"abd-9":["drugs","smoking","alcohol"],"abd-10":["smoking","drugs","family"],"abd-11":["age","family"],"abd-12":["operations","age"],"abd-13":["transfusion","hepatitis_past","family"],"abd-14":["sex","age","family"],"abd-15":["alcohol","hepatitis_past","transfusion","bilharzia"],"abd-16":["drugs","smoking","alcohol"],"abd-17":["smoking","drugs","family"],"abd-18":["operations","age"],"neuro-1":["smoking","htn","dm","age"],"neuro-2":["smoking","htn","dm","age"],"neuro-3":["age","htn","family"],"neuro-4":["htn","alcohol","age"],"neuro-5":["htn","smoking","family","age"],"neuro-6":["trauma","family","alcohol"],"neuro-7":["trauma","family","alcohol"],"neuro-8":["family","sex","age"],"neuro-9":["age","family"],"neuro-10":["family","age","sex"],"neuro-11":["family","age","sex"],"neuro-12":["family","age"],"neuro-13":["family","consang"],"neuro-14":["dm","alcohol"],"neuro-15":["alcohol","operations","drugs"],"neuro-16":["consang","family"],"neuro-17":["family","drugs"],"neuro-18":["tb_past","family"],"neuro-19":["trauma","operations"]};
  /* Approved corrections to ORIGINAL values (Ahmed, 2026-11-24): the two sputum
     answers started with "لا" so sputum details fell back to "مفيش بلغم" although
     both cases have a little sputum; neuro-1 speech ("improved after 2 months")
     contradicted the 3-week duration; cardio-17 irregular palpitation is unusual
     for aortic stenosis. */
  var OVERRIDES = {
    'chest-2': { sputum: 'شوية أبيض نادر بس.' },
    'chest-19': { sputum: 'بلغم قليل جدا.' },
    'neuro-1': { speech: 'أيوه كان تقيل في الأول وتحسن بعد أسبوعين.' },
    'cardio-17': { palp_regular: 'منتظمة.' }
  };
  Object.keys(PATCH).forEach(function(cid){
    var sysId = cid.split('-')[0];
    var sys = window.SimCore.systems.filter(function(s){ return s.id === sysId; })[0];
    if (!sys) return;
    var c = sys.cases.filter(function(x){ return x.id === cid; })[0];
    if (!c) return;
    Object.keys(PATCH[cid]).forEach(function(q){ c.a[q] = PATCH[cid][q]; });
    if (CORE[cid]) c.core = CORE[cid];
    if (RISK[cid]) c.risk = RISK[cid];
  });
  Object.keys(OVERRIDES).forEach(function(cid){
    var sysId = cid.split('-')[0];
    var sys = window.SimCore.systems.filter(function(s){ return s.id === sysId; })[0];
    if (!sys) return;
    var c = sys.cases.filter(function(x){ return x.id === cid; })[0];
    if (!c) return;
    Object.keys(OVERRIDES[cid]).forEach(function(q){ c.a[q] = OVERRIDES[cid][q]; });

<script>
(function(){
  var S = window.SimCore, root = document.getElementById('root');
  function h(tag, attrs, kids){
    var e = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){
      if (k === 'text') e.textContent = attrs[k];
      else if (k.slice(0,2) === 'on') e.addEventListener(k.slice(2), attrs[k]);
      else e.setAttribute(k, attrs[k]);
    });
    (kids || []).forEach(function(c){ if (c != null) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return e;
  }
  function group(label, kids){ return h('section', {'class':'group'}, [h('h2', {text:label})].concat(kids)); }
  function btn(text, cls, fn, extra){ var b = h('button', Object.assign({type:'button','class':'btn '+(cls||''), text:text}, extra||{})); b.addEventListener('click', fn); return b; }
  var openG = {}, sess = null, sel = {}, last = null, stage = 'home', dx = '', turns = [], open = false, draft = '', wasRandom = false;
  S.systems.forEach(function(s){ sel[s.id] = true; });
  function shell(){
    root.textContent = '';
    var th = h('button',{type:'button','class':'btn ghost themebtn',text:document.documentElement.getAttribute('data-theme')==='dark'?'الوضع النهاري':'الوضع الليلي'});
    th.addEventListener('click', function(){ var d = document.documentElement; var next = d.getAttribute('data-theme')==='dark' ? 'light' : 'dark'; d.setAttribute('data-theme', next); try{ localStorage.setItem('sim-theme', next); }catch(e){} th.textContent = next==='dark' ? 'الوضع النهاري' : 'الوضع الليلي'; });
    root.appendChild(h('div', {'class':'hero'}, [h('div', {'class':'topbar'}, [h('span',{'class':'eyebrow',text:'FOLIO 196 · PATIENT SIMULATOR'}), th]), h('h1',{text:'محاكاة مريض'}), h('p',{'class':'fact',text:'Cardiology · Chest · Abdomen · Neurology — حالات تدريبية من ملف العملي'})]));
  }
  function start(c, isRnd){ sess = S.newSession(c); wasRandom = !!isRnd; last = c.id; turns = []; open = false; openG = {}; draft = ''; stage = 'ask'; render(); }
  function render(keepScroll){
    shell();
    if (stage === 'home') home();
    else if (stage === 'ask') interview();
    else if (stage === 'dx') diagnosis();
    else result();
    if (!keepScroll) window.scrollTo(0, 0);
  }
  function home(){
    var ids = function(){ return S.systems.filter(function(s){ return sel[s.id]; }).map(function(s){ return s.id; }); };
    var rnd = btn('حالة عشوائية من المختار', 'primary', function(){ var c = S.pick(ids(), last); if (c) start(c, true); }, {'id':'rnd'});
    rnd.disabled = ids().length === 0;
    var box = h('div', {'class':'sys'});
    S.systems.forEach(function(s){
      var b = h('button', {type:'button','class':'sysbtn'+(sel[s.id]?' on':''),'aria-pressed':String(!!sel[s.id]),'data-sys':s.id,text:s.en+' ('+s.cases.length+' حالة)'});
      b.addEventListener('click', function(){ sel[s.id] = !sel[s.id]; b.className = 'sysbtn'+(sel[s.id]?' on':''); b.setAttribute('aria-pressed', String(!!sel[s.id])); rnd.disabled = ids().length === 0; });
      box.appendChild(b);
    });
    root.appendChild(group('اختار الأنظمة', [h('p',{text:'المريض الافتراضي بيجاوب على اللي تسأله. خد الهيستوري زي الامتحان، وبعدين اختار التشخيص الأقرب وشوف إيه اللي فاتك.'}), box, h('div',{'class':'stack'},[rnd])]));
    var pick = S.systems.map(function(s){
      var g = h('div',{'class':'ngrid'});
      s.cases.forEach(function(c){ var b = h('button',{type:'button','class':'n','aria-label':s.en+' حالة '+c.n,text:String(c.n)}); b.addEventListener('click', function(){ start(c); }); g.appendChild(b); });
      return h('details',{}, [h('summary',{text:s.en+' ('+s.cases.length+')'}), g]);
    });
    root.appendChild(group('أو اختار حالة بنفسك', pick));
  }
  function send(t){
    t = String(t || '').trim(); if (!t) return;
    turns.unshift({q:t, a:S.ask(sess, t)}); draft = '';
    render(true);
    var inp = document.getElementById('q'); if (inp) inp.focus({preventScroll:true});
  }
  function interview(){
    var input = h('input', {id:'q', type:'text', autocomplete:'off', value:draft});
    input.value = draft;
    input.addEventListener('input', function(){ draft = input.value; });
    input.addEventListener('keydown', function(e){ if (e.key === 'Enter') { e.preventDefault(); send(input.value); } });
    var ask = h('div', {'class':'ask'}, [h('div',{'class':'field'},[h('label',{'for':'q',text:'سؤالك (عربي أو English)'}), input]), btn('إرسال','primary',function(){ send(input.value); },{id:'send'})]);
    var row = h('div',{'class':'row'},[
      btn(open?'إخفاء الأسئلة الجاهزة':'أسئلة جاهزة','',function(){ open = !open; render(true); },{id:'toggle'}),
      btn('خلصت الهيستوري','',function(){ stage = 'dx'; dx = ''; render(); },{id:'finish'}),
      btn('خروج','ghost',function(){ stage = 'home'; render(); },{id:'exit'})]);
    var kids = [ask, row];
    if (open) {
      var chips = h('div',{'class':'chips'});
      Object.keys(sess.sys.groups).filter(function(g){ return sess.sys.items.some(function(it){ return it.group === g; }); }).forEach(function(g){
        var d = h('details',{}, [h('summary',{text:sess.sys.groups[g]})]); if (openG[g]) d.open = true; d.addEventListener('toggle', function(){ openG[g] = d.open; });
        sess.sys.items.filter(function(it){ return it.group === g; }).forEach(function(it){
          var b = h('button',{type:'button','class':'chip'+(sess.asked[it.id]?' done':''),text:it.chip}); b.addEventListener('click', function(){ send(it.chip); }); d.appendChild(b);
        });
        chips.appendChild(d);
      });
      kids.push(chips);
    }
    root.appendChild(group('اسأل المريض ('+(wasRandom ? '' : sess.sys.name+' · ')+'حالة '+sess.c.n+')', kids));
    var chat = h('div',{'class':'chat','aria-live':'polite'});
    turns.forEach(function(t){ chat.appendChild(h('div',{'class':'turn'},[h('div',{'class':'bubble me',text:t.q})].concat(t.a.map(function(a){ return h('div',{'class':'bubble pt',text:a.text}); })))); });
    var cg = group('المحادثة ('+turns.length+' سؤال)', turns.length ? [chat] : [h('p',{text:'ابدأ بالأسئلة الشخصية ثم الشكوى. الأحدث بيظهر فوق.'})]);
    cg.id = 'chatgroup';
    root.appendChild(cg);
  }
  function diagnosis(){
    var list = h('div',{'class':'dxs'});
    sess.sys.dxs.forEach(function(d){
      var inp = h('input',{type:'radio',name:'dx',value:d.id}); if (dx === d.id) inp.checked = true;
      var lab = h('label',{'class':'opt'+(dx===d.id?' sel':'')},[inp, h('span',{text:d.label})]);
      inp.addEventListener('change', function(){ dx = d.id; Array.prototype.forEach.call(list.children,function(c){ c.classList.remove('sel'); }); lab.classList.add('sel'); go.disabled = false; });
      list.appendChild(lab);
    });
    var go = btn('شوف النتيجة','primary',function(){ stage = 'result'; render(); },{id:'go'}); go.disabled = !dx;
    root.appendChild(group('التشخيص الأقرب من الهيستوري', [h('p',{text:'اختار التشخيص اللي الهيستوري بيرجّحه. ده ترجيح تدريبي، مش تشخيص نهائي.'}), h('p',{'class':'muted',style:'font-size:13px;margin-bottom:0',text:'التشخيص'}), list, h('div',{'class':'row'},[go, btn('رجوع للمريض','',function(){ stage = 'ask'; render(); })])]));
  }
  function row(name, detail, value, ok){
    var main = h('div',{'class':'main'},[h('span',{'class':'name'},[name])]);
    if (detail != null) main.appendChild(h('span',{'class':'detail'},[detail]));
    var r = h('div',{'class':'r'},[main]);
    if (value != null) r.appendChild(h('span',{'class':'val'+(ok?' ok':''),text:value}));
    return r;
  }
  function result(){
    var r = S.score(sess, dx), c = sess.c;
    var correct = sess.sys.dxs.filter(function(d){ return d.id === c.dx; })[0].label;
    var askedN = Object.keys(sess.asked).length, totalN = Object.keys(sess.sys.byId).length;
    var risk = c.risk || [], riskDone = risk.filter(function(id){ return sess.asked[id]; }).length;
    var riskMiss = risk.filter(function(id){ return !sess.asked[id]; });
    var rows1 = h('div',{'class':'rows'},[
      row(r.dxCorrect ? 'الترجيح مطابق للحالة' : 'الترجيح مختلف عن الحالة', r.dxCorrect ? null : h('span',{},['الأقرب للحالة: ', h('bdi',{text:correct})])),
      row('درجة التشخيص', r.pct+'% من الأسئلة الأساسية', r.done+'/'+r.total, r.pct === 100),
      row('اكتمال الهيستوري', 'سألت '+askedN+' من '+totalN+' سؤال في السيستم', askedN+'/'+totalN, askedN === totalN),
      row('عوامل الخطورة المهمة للحالة', 'سألت '+riskDone+' من '+risk.length+(riskMiss.length ? ' — فاتك: '+riskMiss.map(function(id){ return sess.sys.byId[id].label; }).join('، ') : ''), riskDone+'/'+risk.length, risk.length > 0 && riskDone === risk.length)]);
    root.appendChild(group('النتيجة', [rows1, h('p',{'class':'muted'},['ليه (من الملف، بالإنجليزي)']), h('bdi',{'class':'enblock',text:c.why})]));
    var rows2 = h('div',{'class':'rows'});
    Object.keys(sess.sys.groups).filter(function(k){ return r.byGroup[k]; }).forEach(function(k){
      rows2.appendChild(row(h('bdi',{text:sess.sys.groups[k]}), null, r.byGroup[k].done+'/'+r.byGroup[k].total, r.byGroup[k].done === r.byGroup[k].total));
    });
    root.appendChild(group('حسب القسم', [rows2]));
    var miss = r.missed.length === 0 ? [h('p',{text:'سألت كل الأسئلة الأساسية.'})] : [h('div',{'class':'rows'}, r.missed.map(function(id){
      var it = sess.sys.byId[id];
      return row(h('bdi',{text:it.label}), 'كان هيجاوب: '+S.answerFor(c, id), it.ref);
    }))];
    miss.push(h('p',{'class':'muted',style:'margin-top:10px',text:'أرقام p دي صفحات PDF في ملف العملي المدمج.'}));
    root.appendChild(group('اللي فاتك ('+r.missed.length+')', miss));
    root.appendChild(h('div',{'class':'row'},[btn('حالة تانية','primary',function(){ stage = 'home'; render(); },{id:'again'})]));
  }
  render();
})();
</script>
